<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景（米色） -->
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- Modal 遮罩 -->
  <rect width="800" height="500" fill="#1e293b" opacity="0.4"/>

  <!-- Modal 卡片陰影 -->
  <rect x="148" y="24" width="512" height="460" rx="14" fill="#0f172a" opacity="0.25"/>
  <!-- Modal 主卡片 -->
  <rect x="144" y="20" width="512" height="460" rx="14" fill="white"/>

  <!-- Modal Header -->
  <text x="168" y="58" font-size="18" font-weight="700" fill="#1e293b">上傳報告</text>
  <text x="636" y="58" text-anchor="middle" font-size="20" fill="#78716c">×</text>

  <!-- 隱私提示 -->
  <text x="168" y="82" font-size="11" fill="#78716c">因應個人資料保護法，請勿涉及個人敏感資料，本平台不負任何法律責任。</text>

  <!-- Tabs 列 -->
  <rect x="168" y="100" width="464" height="38" rx="8" fill="#f5f5f4"/>
  <!-- Tab1 inactive：上傳檔案 -->
  <text x="284" y="125" text-anchor="middle" font-size="13" fill="#78716c">上傳檔案</text>
  <!-- Tab2 active：手動輸入 -->
  <rect x="401" y="102" width="229" height="34" rx="6" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="515" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#3a8fa8">手動輸入</text>

  <!-- 報告標題 label -->
  <text x="168" y="162" font-size="13" font-weight="600" fill="#57534e">報告標題 *</text>
  <!-- 報告標題 input -->
  <rect x="168" y="170" width="464" height="38" rx="8" fill="white" stroke="#dedad3" stroke-width="1.5"/>
  <text x="184" y="193" font-size="12" fill="#a8a29e">例如：初始評估報告、追蹤記錄 2024/01</text>

  <!-- 報告內容 label -->
  <text x="168" y="232" font-size="13" font-weight="600" fill="#57534e">報告內容</text>
  <!-- 報告內容 textarea -->
  <rect x="168" y="240" width="464" height="156" rx="8" fill="white" stroke="#dedad3" stroke-width="1.5"/>
  <text x="184" y="264" font-size="12" fill="#a8a29e">貼上報告內容...</text>

  <!-- Footer：取消 + 儲存報告 -->
  <rect x="448" y="434" width="76" height="38" rx="8" fill="white" stroke="#dedad3" stroke-width="1.5"/>
  <text x="486" y="458" text-anchor="middle" font-size="13" fill="#57534e">取消</text>
  <rect x="532" y="434" width="100" height="38" rx="8" fill="#3a8fa8"/>
  <text x="582" y="458" text-anchor="middle" font-size="13" font-weight="600" fill="white">儲存報告</text>
  <!-- 虛線高亮框 -->
  <rect x="528" y="430" width="108" height="46" rx="10" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="5 3"/>

  <!-- 標註① 填標題 -->
  <rect x="6" y="160" width="134" height="56" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="73" y="180" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">① 填入標題</text>
  <text x="73" y="198" text-anchor="middle" font-size="11" fill="#92400e">報告類型＋時間</text>
  <line x1="140" y1="185" x2="166" y2="187" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrC2)"/>

  <!-- 標註② 貼上/輸入內容 -->
  <rect x="6" y="260" width="134" height="68" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="73" y="280" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">② 貼上或輸入</text>
  <text x="73" y="298" text-anchor="middle" font-size="11" fill="#92400e">報告文字內容</text>
  <text x="73" y="314" text-anchor="middle" font-size="11" fill="#92400e">（Ctrl+V 貼上）</text>
  <line x1="140" y1="290" x2="166" y2="310" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrC2)"/>

  <!-- 標註③ 儲存報告 -->
  <rect x="650" y="424" width="144" height="56" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="722" y="444" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">③ 儲存報告</text>
  <text x="722" y="462" text-anchor="middle" font-size="11" fill="#92400e">完成建立</text>
  <line x1="650" y1="453" x2="638" y2="453" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrC2)"/>

  <defs>
    <marker id="arrC2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#d97706"/>
    </marker>
  </defs>

  <text x="795" y="494" text-anchor="end" font-size="10" fill="#a8a29e">示意圖｜實際介面以登入後為準</text>
</svg>
