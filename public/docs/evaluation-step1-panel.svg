<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景米色 + 暗色遮罩 -->
  <rect width="800" height="500" fill="#f0efe8"/>
  <rect width="800" height="500" fill="#1e293b" opacity="0.4"/>

  <!-- Dialog 陰影 -->
  <rect x="102" y="24" width="608" height="460" rx="14" fill="#0f172a" opacity="0.25"/>
  <!-- Dialog 主卡片 -->
  <rect x="98" y="20" width="608" height="460" rx="14" fill="white"/>

  <!-- Dialog Header -->
  <!-- ClipboardList icon 示意 -->
  <rect x="122" y="46" width="14" height="18" rx="2" fill="none" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="126" y1="42" x2="132" y2="42" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="126" y1="52" x2="134" y2="52" stroke="#1e293b" stroke-width="1"/>
  <line x1="126" y1="57" x2="134" y2="57" stroke="#1e293b" stroke-width="1"/>
  <text x="144" y="62" font-size="16" font-weight="700" fill="#1e293b">報告 AI 分析</text>
  <text x="688" y="62" text-anchor="middle" font-size="20" fill="#78716c">×</text>
  <line x1="98" y1="72" x2="706" y2="72" stroke="#e8e6de" stroke-width="1"/>

  <!-- 警告橫幅 -->
  <rect x="118" y="84" width="568" height="36" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <!-- AlertTriangle icon -->
  <polygon points="134,114 148,90 162,114" fill="none" stroke="#d97706" stroke-width="1.5"/>
  <line x1="148" y1="98" x2="148" y2="108" stroke="#d97706" stroke-width="1.5"/>
  <circle cx="148" cy="111" r="1" fill="#d97706"/>
  <text x="170" y="106" font-size="11" fill="#92400e">此 AI 分析僅供參考，不代表實際評鑑結果，請依機構實際情況判斷。</text>

  <!-- 選擇報告 section -->
  <text x="118" y="144" font-size="12" font-weight="600" fill="#57534e">選擇要分析的報告</text>
  <!-- 報告 badge pills -->
  <rect x="118" y="152" width="104" height="24" rx="12" fill="#e0f0f5"/>
  <text x="170" y="168" text-anchor="middle" font-size="11" fill="#3a8fa8">2025年3月 服務計畫</text>
  <rect x="228" y="152" width="116" height="24" rx="12" fill="#e0f0f5"/>
  <text x="286" y="168" text-anchor="middle" font-size="11" fill="#3a8fa8">2025年2月 追蹤紀錄</text>
  <rect x="350" y="152" width="104" height="24" rx="12" fill="#e0f0f5"/>
  <text x="402" y="168" text-anchor="middle" font-size="11" fill="#3a8fa8">2025年1月 初始評估</text>
  <rect x="118" y="182" width="80" height="24" rx="12" fill="#f5f5f4" stroke="#e8e6de" stroke-width="1"/>
  <text x="158" y="198" text-anchor="middle" font-size="11" fill="#57534e">+ 新增報告</text>

  <!-- 機構類型 Select -->
  <text x="118" y="226" font-size="12" font-weight="600" fill="#57534e">機構類型</text>
  <rect x="118" y="234" width="260" height="36" rx="8" fill="white" stroke="#dedad3" stroke-width="1.5"/>
  <text x="136" y="256" font-size="13" fill="#1e293b">日間照顧機構</text>
  <text x="362" y="256" font-size="13" fill="#a8a29e">▾</text>

  <!-- 開始分析按鈕 -->
  <rect x="118" y="284" width="568" height="44" rx="8" fill="#3a8fa8"/>
  <rect x="114" y="280" width="576" height="52" rx="10" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="402" y="311" text-anchor="middle" font-size="14" font-weight="600" fill="white">開始分析</text>

  <!-- 分析結果區 -->
  <line x1="98" y1="348" x2="706" y2="348" stroke="#e8e6de" stroke-width="1"/>
  <text x="118" y="370" font-size="12" font-weight="600" fill="#57534e">分析結果</text>

  <!-- 串流輸出示意 -->
  <rect x="118" y="378" width="568" height="84" rx="6" fill="#f8f7f4"/>
  <text x="134" y="398" font-size="12" font-weight="700" fill="#1e293b">【個案權益保障】</text>
  <text x="134" y="416" font-size="12" fill="#57534e">目前紀錄顯示機構已建立個案申訴機制，</text>
  <text x="134" y="432" font-size="12" fill="#57534e">惟缺乏書面申訴處理流程...</text>
  <!-- 游標閃爍示意 -->
  <line x1="354" y1="422" x2="354" y2="438" stroke="#3a8fa8" stroke-width="1.5" opacity="0.8"/>

  <!-- 標註① 選擇機構類型 -->
  <rect x="6" y="226" width="104" height="68" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="58" y="247" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">① 選擇機構</text>
  <text x="58" y="263" text-anchor="middle" font-size="11" fill="#92400e">類型</text>
  <text x="58" y="279" text-anchor="middle" font-size="11" fill="#92400e">套用評鑑準則</text>
  <line x1="110" y1="252" x2="116" y2="252" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrEV1)"/>

  <!-- 標註② 開始分析 -->
  <rect x="690" y="284" width="104" height="52" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="742" y="305" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">② 開始分析</text>
  <text x="742" y="323" text-anchor="middle" font-size="11" fill="#92400e">AI 即時串流</text>
  <line x1="690" y1="306" x2="694" y2="306" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrEV1left)"/>

  <defs>
    <marker id="arrEV1" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#d97706"/>
    </marker>
    <marker id="arrEV1left" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <polygon points="8 0, 0 3, 8 6" fill="#d97706"/>
    </marker>
  </defs>

  <text x="795" y="494" text-anchor="end" font-size="10" fill="#a8a29e">示意圖｜實際介面以登入後為準</text>
</svg>
