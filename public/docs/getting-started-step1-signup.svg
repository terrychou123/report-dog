<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- 裝飾圓 -->
  <circle cx="70" cy="70" r="52" fill="#e8e6de" opacity="0.45"/>
  <circle cx="730" cy="440" r="60" fill="#e8e6de" opacity="0.35"/>

  <!-- 卡片陰影 -->
  <rect x="200" y="33" width="408" height="446" rx="12" fill="#1e293b" opacity="0.07"/>
  <!-- 主卡片 -->
  <rect x="196" y="28" width="408" height="446" rx="12" fill="white" stroke="#e8e6de" stroke-width="1.5"/>
  <!-- 頂部色條 -->
  <rect x="196" y="28" width="408" height="6" rx="4" fill="#3a8fa8"/>

  <!-- 標題 -->
  <text x="400" y="85" text-anchor="middle" font-size="28" font-weight="700" fill="#1e293b">註冊</text>
  <text x="400" y="108" text-anchor="middle" font-size="14" fill="#57534e">建立新帳號</text>
  <line x1="220" y1="122" x2="580" y2="122" stroke="#dedad3" stroke-width="1"/>

  <!-- 電子郵件欄位 -->
  <text x="220" y="148" font-size="13" font-weight="600" fill="#57534e">電子郵件</text>
  <rect x="220" y="154" width="360" height="38" rx="8" fill="white" stroke="#dedad3" stroke-width="1.5"/>
  <text x="236" y="178" font-size="13" fill="#a8a29e">m@example.com</text>

  <!-- 密碼欄位 -->
  <text x="220" y="218" font-size="13" font-weight="600" fill="#57534e">密碼</text>
  <rect x="220" y="224" width="360" height="38" rx="8" fill="white" stroke="#dedad3" stroke-width="1.5"/>
  <text x="238" y="249" font-size="16" fill="#1e293b" letter-spacing="5">••••••••</text>

  <!-- 再次輸入密碼欄位 -->
  <text x="220" y="288" font-size="13" font-weight="600" fill="#57534e">再次輸入密碼</text>
  <rect x="220" y="294" width="360" height="38" rx="8" fill="white" stroke="#dedad3" stroke-width="1.5"/>
  <text x="238" y="319" font-size="16" fill="#1e293b" letter-spacing="5">••••••••</text>

  <!-- 主按鈕：註冊 -->
  <rect x="220" y="356" width="360" height="44" rx="8" fill="#3a8fa8"/>
  <text x="400" y="383" text-anchor="middle" font-size="15" font-weight="600" fill="white">註冊</text>

  <!-- 已有帳號 -->
  <text x="400" y="432" text-anchor="middle" font-size="13" fill="#78716c">已有帳號？ <tspan fill="#3a8fa8">登入</tspan></text>

  <!-- 左側標註：① 填入欄位 -->
  <rect x="8" y="190" width="178" height="56" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="97" y="211" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">① 填入三個欄位</text>
  <text x="97" y="230" text-anchor="middle" font-size="11" fill="#92400e">電子郵件、密碼</text>
  <line x1="186" y1="218" x2="218" y2="205" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr1)"/>

  <!-- 右側標註：② 點擊註冊 -->
  <rect x="612" y="348" width="178" height="56" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="701" y="369" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">② 點擊「註冊」</text>
  <text x="701" y="388" text-anchor="middle" font-size="11" fill="#92400e">完成帳號建立</text>
  <line x1="612" y1="372" x2="582" y2="374" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr1)"/>

  <defs>
    <marker id="arr1" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#d97706"/>
    </marker>
  </defs>

  <text x="795" y="494" text-anchor="end" font-size="10" fill="#a8a29e">示意圖｜實際介面以登入後為準</text>
</svg>
