<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景米色 + 暗色遮罩 -->
  <rect width="800" height="500" fill="#f0efe8"/>
  <rect width="800" height="500" fill="#1e293b" opacity="0.4"/>

  <!-- Dialog 陰影 -->
  <rect x="258" y="44" width="304" height="424" rx="14" fill="#0f172a" opacity="0.25"/>
  <!-- Dialog 主卡片 -->
  <rect x="254" y="40" width="304" height="424" rx="14" fill="white"/>

  <!-- Dialog Header -->
  <!-- History icon 示意（時鐘外框 + 指針） -->
  <circle cx="274" cy="68" r="10" fill="none" stroke="#1e293b" stroke-width="1.5"/>
  <polyline points="274,62 274,68 279,72" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 264,64 L 260,60" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 260,60 L 258,65" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
  <text x="292" y="73" font-size="15" font-weight="700" fill="#1e293b">版本歷史</text>
  <text x="540" y="73" text-anchor="middle" font-size="20" fill="#78716c">×</text>
  <line x1="254" y1="82" x2="558" y2="82" stroke="#e8e6de" stroke-width="1"/>

  <!-- 副標：實際 panel hint -->
  <text x="270" y="104" font-size="11" fill="#78716c">免費用戶僅保存最新的五筆資料</text>

  <!-- 版本 #3（最新） -->
  <rect x="270" y="120" width="272" height="92" rx="8" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="282" y="140" font-size="11" font-weight="700" fill="#57534e">版本 #3</text>
  <text x="530" y="140" text-anchor="end" font-size="11" fill="#78716c">2025/03/31  14:22</text>
  <text x="282" y="162" font-size="13" fill="#1e293b">新增個案意見反映機制說明</text>
  <!-- 還原按鈕（全寬，藍色外框） -->
  <rect x="282" y="174" width="248" height="26" rx="6" fill="white" stroke="#3a8fa8" stroke-width="1.5"/>
  <!-- RotateCcw icon -->
  <path d="M 372,184 Q 372,190 378,192" fill="none" stroke="#3a8fa8" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 372,184 L 369,180 L 374,180" fill="#3a8fa8" stroke="none"/>
  <text x="406" y="192" text-anchor="start" font-size="12" fill="#3a8fa8">還原此版本</text>

  <!-- 版本 #2 -->
  <rect x="270" y="220" width="272" height="92" rx="8" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="282" y="240" font-size="11" font-weight="700" fill="#57534e">版本 #2</text>
  <text x="530" y="240" text-anchor="end" font-size="11" fill="#78716c">2025/03/28  09:15</text>
  <text x="282" y="262" font-size="13" fill="#1e293b">修改服務流程描述段落</text>
  <rect x="282" y="274" width="248" height="26" rx="6" fill="white" stroke="#3a8fa8" stroke-width="1.5"/>
  <path d="M 372,284 Q 372,290 378,292" fill="none" stroke="#3a8fa8" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 372,284 L 369,280 L 374,280" fill="#3a8fa8" stroke="none"/>
  <text x="406" y="292" text-anchor="start" font-size="12" fill="#3a8fa8">還原此版本</text>

  <!-- 版本 #1 -->
  <rect x="270" y="320" width="272" height="92" rx="8" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="282" y="340" font-size="11" font-weight="700" fill="#57534e">版本 #1</text>
  <text x="530" y="340" text-anchor="end" font-size="11" fill="#78716c">2025/03/25  16:08</text>
  <text x="282" y="362" font-size="13" fill="#a8a29e" font-style="italic">（未填寫摘要）</text>
  <rect x="282" y="374" width="248" height="26" rx="6" fill="white" stroke="#3a8fa8" stroke-width="1.5"/>
  <path d="M 372,384 Q 372,390 378,392" fill="none" stroke="#3a8fa8" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 372,384 L 369,380 L 374,380" fill="#3a8fa8" stroke="none"/>
  <text x="406" y="392" text-anchor="start" font-size="12" fill="#3a8fa8">還原此版本</text>

  <!-- Dialog 底部說明（簡化） -->
  <line x1="254" y1="426" x2="558" y2="426" stroke="#e8e6de" stroke-width="1"/>
  <text x="406" y="448" text-anchor="middle" font-size="11" fill="#a8a29e">點擊「還原此版本」可回到任意版本</text>

  <!-- 標註① 版本卡片內容 -->
  <rect x="86" y="232" width="160" height="68" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="166" y="253" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">① 版本號 + 時間</text>
  <text x="166" y="271" text-anchor="middle" font-size="11" fill="#92400e">與儲存時填寫的</text>
  <text x="166" y="287" text-anchor="middle" font-size="11" fill="#92400e">修改摘要</text>
  <line x1="246" y1="266" x2="270" y2="262" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrVH1)"/>

  <!-- 標註② 還原按鈕 -->
  <rect x="566" y="270" width="160" height="52" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="646" y="291" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">② 點擊還原此版本</text>
  <text x="646" y="309" text-anchor="middle" font-size="11" fill="#92400e">回到指定版本</text>
  <line x1="566" y1="288" x2="530" y2="288" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrVH1left)"/>

  <defs>
    <marker id="arrVH1" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#d97706"/>
    </marker>
    <marker id="arrVH1left" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <polygon points="8 0, 0 3, 8 6" fill="#d97706"/>
    </marker>
  </defs>

  <text x="795" y="494" text-anchor="end" font-size="10" fill="#a8a29e">示意圖｜實際介面以登入後為準</text>
</svg>
