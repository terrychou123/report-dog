<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景米色 + 暗色遮罩 -->
  <rect width="800" height="500" fill="#f0efe8"/>
  <rect width="800" height="500" fill="#1e293b" opacity="0.4"/>

  <!-- Dialog 卡片陰影 -->
  <rect x="112" y="24" width="584" height="460" rx="14" fill="#0f172a" opacity="0.25"/>
  <!-- Dialog 主卡片 -->
  <rect x="108" y="20" width="584" height="460" rx="14" fill="white"/>

  <!-- Dialog Header -->
  <text x="132" y="58" font-size="17" font-weight="700" fill="#1e293b">匯入評鑑範本</text>
  <text x="668" y="58" text-anchor="middle" font-size="20" fill="#78716c">×</text>
  <text x="132" y="78" font-size="12" fill="#78716c">選擇您的機構類型，一鍵建立評鑑標籤與報告範本（可重複匯入）</text>
  <text x="132" y="96" font-size="11" fill="#e03e3e">⚠️ 此評鑑範本由AI產生，非官方文件，敬請斟酌使用</text>
  <line x1="108" y1="104" x2="692" y2="104" stroke="#e8e6de" stroke-width="1"/>

  <!-- 2-col grid：8 個機構類型 -->
  <!-- Row 1 -->
  <!-- 居家服務機構 -->
  <rect x="132" y="114" width="262" height="60" rx="8" fill="white" stroke="#dedad3" stroke-width="1.5"/>
  <text x="152" y="136" font-size="13" font-weight="600" fill="#1e293b">居家服務機構</text>
  <text x="152" y="154" font-size="11" fill="#78716c">4 個標籤・32 份報告</text>

  <!-- 日間照顧機構（selected: ring + check） -->
  <rect x="402" y="114" width="262" height="60" rx="8" fill="white" stroke="#3a8fa8" stroke-width="2"/>
  <!-- ring effect -->
  <rect x="400" y="112" width="266" height="64" rx="10" fill="none" stroke="#3a8fa8" stroke-width="1" opacity="0.4"/>
  <text x="422" y="136" font-size="13" font-weight="600" fill="#1e293b">日間照顧機構</text>
  <text x="422" y="154" font-size="11" fill="#78716c">4 個標籤・43 份報告</text>
  <!-- CheckIcon -->
  <g stroke="#3a8fa8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="647,128 651,133 659,125"/>
  </g>

  <!-- Row 2 -->
  <!-- 住宿型照顧機構 -->
  <rect x="132" y="184" width="262" height="60" rx="8" fill="white" stroke="#dedad3" stroke-width="1.5"/>
  <text x="152" y="206" font-size="13" font-weight="600" fill="#1e293b">住宿型照顧機構</text>
  <text x="152" y="224" font-size="11" fill="#78716c">5 個標籤・75 份報告</text>

  <!-- 居家護理所 -->
  <rect x="402" y="184" width="262" height="60" rx="8" fill="white" stroke="#dedad3" stroke-width="1.5"/>
  <text x="422" y="206" font-size="13" font-weight="600" fill="#1e293b">居家護理所</text>
  <text x="422" y="224" font-size="11" fill="#78716c">2 個標籤・8 份報告</text>

  <!-- Row 3 -->
  <!-- 一般護理之家 -->
  <rect x="132" y="254" width="262" height="60" rx="8" fill="white" stroke="#dedad3" stroke-width="1.5"/>
  <text x="152" y="276" font-size="13" font-weight="600" fill="#1e293b">一般護理之家</text>
  <text x="152" y="294" font-size="11" fill="#78716c">4 個標籤・15 份報告</text>

  <!-- 產後護理之家 -->
  <rect x="402" y="254" width="262" height="60" rx="8" fill="white" stroke="#dedad3" stroke-width="1.5"/>
  <text x="422" y="276" font-size="13" font-weight="600" fill="#1e293b">產後護理之家</text>
  <text x="422" y="294" font-size="11" fill="#78716c">4 個標籤・17 份報告</text>

  <!-- Row 4 -->
  <!-- 身心障礙福利機構 -->
  <rect x="132" y="324" width="262" height="60" rx="8" fill="white" stroke="#dedad3" stroke-width="1.5"/>
  <text x="152" y="346" font-size="13" font-weight="600" fill="#1e293b">身心障礙福利機構</text>
  <text x="152" y="364" font-size="11" fill="#78716c">6 個標籤・35 份報告</text>

  <!-- 醫院 -->
  <rect x="402" y="324" width="262" height="60" rx="8" fill="white" stroke="#dedad3" stroke-width="1.5"/>
  <text x="422" y="346" font-size="13" font-weight="600" fill="#1e293b">醫院</text>
  <text x="422" y="364" font-size="11" fill="#78716c">15 個標籤・124 份報告</text>

  <!-- 選取後預覽說明 -->
  <line x1="108" y1="396" x2="692" y2="396" stroke="#e8e6de" stroke-width="1"/>
  <text x="132" y="416" font-size="12" fill="#57534e">將為您建立 <tspan font-weight="700" fill="#1e293b">4</tspan> 個標籤、<tspan font-weight="700" fill="#1e293b">43</tspan> 份報告範本</text>

  <!-- Footer：取消 + 確認匯入 -->
  <rect x="530" y="436" width="76" height="36" rx="8" fill="white" stroke="#dedad3" stroke-width="1.5"/>
  <text x="568" y="459" text-anchor="middle" font-size="13" fill="#57534e">取消</text>
  <rect x="614" y="436" width="100" height="36" rx="8" fill="#3a8fa8"/>
  <text x="664" y="459" text-anchor="middle" font-size="13" font-weight="600" fill="white">確認匯入</text>
  <!-- 虛線高亮框 -->
  <rect x="610" y="432" width="108" height="44" rx="10" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="5 3"/>

  <!-- 標註① 選擇機構 -->
  <rect x="6" y="128" width="118" height="52" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="65" y="149" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">① 選擇機構</text>
  <text x="65" y="167" text-anchor="middle" font-size="11" fill="#92400e">點擊卡片選取</text>
  <line x1="124" y1="152" x2="130" y2="152" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrT1)"/>

  <!-- 標註② 確認匯入 -->
  <rect x="6" y="428" width="118" height="52" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="65" y="449" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">② 確認匯入</text>
  <text x="65" y="467" text-anchor="middle" font-size="11" fill="#92400e">自動建立標籤</text>
  <line x1="124" y1="452" x2="608" y2="452" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrT1)"/>

  <defs>
    <marker id="arrT1" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#d97706"/>
    </marker>
  </defs>

  <text x="795" y="494" text-anchor="end" font-size="10" fill="#a8a29e">示意圖｜實際介面以登入後為準</text>
</svg>
