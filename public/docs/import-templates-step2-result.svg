<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景米色 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- Navbar -->
  <rect width="800" height="44" fill="white"/>
  <line x1="0" y1="44" x2="800" y2="44" stroke="#e8e6de" stroke-width="1"/>
  <rect x="20" y="9" width="26" height="26" rx="6" fill="#3a8fa8"/>
  <text x="33" y="27" text-anchor="middle" font-size="13" font-weight="700" fill="white">汪</text>
  <text x="54" y="27" font-size="14" font-weight="700" fill="#1e293b">報告汪</text>

  <!-- Sidebar -->
  <rect x="0" y="44" width="140" height="456" fill="white"/>
  <line x1="140" y1="44" x2="140" y2="500" stroke="#e8e6de" stroke-width="1"/>
  <!-- 通知 bell -->
  <path d="M 56 72 Q 56 66 62 66 Q 68 66 68 72 L 68 76 L 70 80 L 54 80 L 56 76 Z" fill="none" stroke="#57534e" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="62" cy="83" r="1.5" fill="#57534e"/>
  <text x="82" y="79" font-size="12" fill="#57534e">通知</text>
  <!-- 報告 -->
  <path d="M 56 100 L 56 116 L 70 116 L 70 106 L 66 100 Z" fill="none" stroke="#57534e" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M 66 100 L 66 106 L 70 106" fill="none" stroke="#57534e" stroke-width="1.5"/>
  <text x="82" y="112" font-size="12" fill="#57534e">報告</text>
  <!-- 標籤（active） -->
  <rect x="8" y="126" width="124" height="28" rx="6" fill="#e0f0f5"/>
  <path d="M 56 130 L 64 130 L 70 136 L 64 142 L 56 136 Z" fill="none" stroke="#3a8fa8" stroke-width="1.5"/>
  <circle cx="59" cy="133" r="1.5" fill="#3a8fa8"/>
  <text x="82" y="143" font-size="12" font-weight="600" fill="#3a8fa8">標籤</text>
  <!-- 追蹤 -->
  <path d="M 60 168 Q 60 163 65 163 Q 70 163 70 168 L 70 173 L 73 178 L 57 178 L 60 173 Z" fill="none" stroke="#57534e" stroke-width="1.5"/>
  <text x="82" y="175" font-size="12" fill="#57534e">追蹤</text>
  <!-- 與我分享 -->
  <circle cx="58" cy="200" r="3" fill="none" stroke="#57534e" stroke-width="1.5"/>
  <circle cx="68" cy="196" r="3" fill="none" stroke="#57534e" stroke-width="1.5"/>
  <circle cx="68" cy="206" r="3" fill="none" stroke="#57534e" stroke-width="1.5"/>
  <text x="82" y="205" font-size="12" fill="#57534e">與我分享</text>

  <!-- 主內容區 -->
  <rect x="140" y="44" width="660" height="456" fill="#f8f7f4"/>

  <!-- Header -->
  <text x="168" y="88" font-size="22" font-weight="700" fill="#1e293b">標籤</text>
  <text x="168" y="108" font-size="12" fill="#78716c">管理您的標籤</text>

  <!-- 右上按鈕 -->
  <rect x="488" y="72" width="116" height="34" rx="8" fill="white" stroke="#dedad3" stroke-width="1.5"/>
  <text x="546" y="94" text-anchor="middle" font-size="12" fill="#57534e">↓ 匯入評鑑範本</text>
  <rect x="612" y="72" width="100" height="34" rx="8" fill="#3a8fa8"/>
  <text x="662" y="94" text-anchor="middle" font-size="12" font-weight="600" fill="white">+ 新建標籤</text>

  <!-- 搜尋列 -->
  <rect x="168" y="126" width="604" height="34" rx="8" fill="white" stroke="#e8e6de" stroke-width="1.5"/>
  <text x="186" y="148" font-size="12" fill="#a8a29e">🔍  搜尋標籤...</text>

  <!-- 4 個標籤卡片（匯入後自動建立） -->
  <!-- 個案權益保障 -->
  <rect x="168" y="174" width="604" height="44" rx="8" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <g fill="none" stroke="#3a8fa8" stroke-width="1.5">
    <path d="M 186 188 L 194 188 L 200 194 L 194 200 L 186 194 Z"/>
    <circle cx="188" cy="191" r="1.5" fill="#3a8fa8" stroke="none"/>
  </g>
  <text x="210" y="200" font-size="13" font-weight="600" fill="#1e293b">個案權益保障</text>
  <!-- report count badge -->
  <rect x="700" y="183" width="48" height="22" rx="11" fill="#e0f0f5"/>
  <text x="724" y="198" text-anchor="middle" font-size="11" fill="#3a8fa8">📄 12</text>
  <!-- drag handle -->
  <text x="758" y="200" font-size="14" fill="#a8a29e">⋮⋮</text>

  <!-- 專業照護品質 -->
  <rect x="168" y="226" width="604" height="44" rx="8" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <g fill="none" stroke="#3a8fa8" stroke-width="1.5">
    <path d="M 186 240 L 194 240 L 200 246 L 194 252 L 186 246 Z"/>
    <circle cx="188" cy="243" r="1.5" fill="#3a8fa8" stroke="none"/>
  </g>
  <text x="210" y="252" font-size="13" font-weight="600" fill="#1e293b">專業照護品質</text>
  <rect x="700" y="235" width="48" height="22" rx="11" fill="#e0f0f5"/>
  <text x="724" y="250" text-anchor="middle" font-size="11" fill="#3a8fa8">📄 15</text>
  <text x="758" y="252" font-size="14" fill="#a8a29e">⋮⋮</text>

  <!-- 活動品質管理 -->
  <rect x="168" y="278" width="604" height="44" rx="8" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <g fill="none" stroke="#3a8fa8" stroke-width="1.5">
    <path d="M 186 292 L 194 292 L 200 298 L 194 304 L 186 298 Z"/>
    <circle cx="188" cy="295" r="1.5" fill="#3a8fa8" stroke="none"/>
  </g>
  <text x="210" y="304" font-size="13" font-weight="600" fill="#1e293b">活動品質管理</text>
  <rect x="700" y="287" width="48" height="22" rx="11" fill="#e0f0f5"/>
  <text x="724" y="302" text-anchor="middle" font-size="11" fill="#3a8fa8">📄 8</text>
  <text x="758" y="304" font-size="14" fill="#a8a29e">⋮⋮</text>

  <!-- 環境設備管理 -->
  <rect x="168" y="330" width="604" height="44" rx="8" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <g fill="none" stroke="#3a8fa8" stroke-width="1.5">
    <path d="M 186 344 L 194 344 L 200 350 L 194 356 L 186 350 Z"/>
    <circle cx="188" cy="347" r="1.5" fill="#3a8fa8" stroke="none"/>
  </g>
  <text x="210" y="356" font-size="13" font-weight="600" fill="#1e293b">環境設備管理</text>
  <rect x="700" y="339" width="48" height="22" rx="11" fill="#e0f0f5"/>
  <text x="724" y="354" text-anchor="middle" font-size="11" fill="#3a8fa8">📄 8</text>
  <text x="758" y="356" font-size="14" fill="#a8a29e">⋮⋮</text>

  <!-- 成功提示橫幅 -->
  <rect x="168" y="392" width="604" height="44" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="186" y="419" font-size="13" fill="#166534">✓ 匯入完成！已建立 4 個標籤、43 份報告範本</text>

  <!-- 標註① 自動建立的標籤 -->
  <rect x="6" y="214" width="146" height="68" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="79" y="235" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">① 自動建立</text>
  <text x="79" y="253" text-anchor="middle" font-size="11" fill="#92400e">評鑑分類標籤</text>
  <text x="79" y="269" text-anchor="middle" font-size="11" fill="#92400e">（4 個）</text>
  <line x1="152" y1="248" x2="166" y2="248" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrT2)"/>

  <!-- 標註② 點擊數字展開 -->
  <rect x="660" y="214" width="132" height="68" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="726" y="235" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">② 點擊數字</text>
  <text x="726" y="253" text-anchor="middle" font-size="11" fill="#92400e">展開查看</text>
  <text x="726" y="269" text-anchor="middle" font-size="11" fill="#92400e">報告清單</text>
  <line x1="660" y1="248" x2="750" y2="248" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrT2)"/>

  <defs>
    <marker id="arrT2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#d97706"/>
    </marker>
  </defs>

  <text x="795" y="494" text-anchor="end" font-size="10" fill="#a8a29e">示意圖｜實際介面以登入後為準</text>
</svg>
