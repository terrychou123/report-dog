<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景米色 + 暗色遮罩 -->
  <rect width="800" height="500" fill="#f0efe8"/>
  <rect width="800" height="500" fill="#1e293b" opacity="0.4"/>

  <!-- Dialog 陰影 -->
  <rect x="172" y="34" width="464" height="440" rx="14" fill="#0f172a" opacity="0.25"/>
  <!-- Dialog 主卡片 -->
  <rect x="168" y="30" width="464" height="440" rx="14" fill="white"/>

  <!-- Dialog Header -->
  <text x="192" y="68" font-size="15" font-weight="700" fill="#1e293b">✦ AI 修改助手</text>
  <text x="614" y="68" text-anchor="middle" font-size="20" fill="#78716c">×</text>
  <line x1="168" y1="78" x2="632" y2="78" stroke="#e8e6de" stroke-width="1"/>

  <!-- 圈選段落 label -->
  <text x="192" y="102" font-size="12" font-weight="600" fill="#57534e">圈選段落</text>
  <!-- 圈選段落內容 -->
  <rect x="192" y="110" width="408" height="52" rx="6" fill="#f8f7f4" stroke="#e8e6de" stroke-width="1"/>
  <text x="204" y="130" font-size="12" fill="#78716c">本機構依個案需求提供日間照顧服務，</text>
  <text x="204" y="148" font-size="12" fill="#78716c">每月召開服務檢討會議...</text>

  <!-- 修改指令 label -->
  <text x="192" y="182" font-size="12" font-weight="600" fill="#57534e">修改指令</text>
  <!-- 修改指令 textarea -->
  <rect x="192" y="190" width="408" height="72" rx="6" fill="white" stroke="#e8e6de" stroke-width="1.5"/>
  <text x="204" y="210" font-size="12" fill="#a8a29e">請輸入 AI 修改指令...</text>

  <!-- SOAP 模式 checkbox（已勾選） -->
  <rect x="192" y="276" width="18" height="18" rx="4" fill="#3a8fa8"/>
  <polyline points="196,285 199,289 207,280" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="216" y="289" font-size="13" font-weight="600" fill="#1e293b">SOAP 模式</text>
  <text x="216" y="305" font-size="11" fill="#78716c">改寫成主觀、客觀、評估、計畫四段結構</text>

  <!-- SOAP 段落預覽說明 -->
  <rect x="192" y="318" width="408" height="72" rx="6" fill="#edf7fa" stroke="#b8dde8" stroke-width="1"/>
  <text x="208" y="338" font-size="11" font-weight="600" fill="#3a8fa8">S  主觀資料（Subjective）</text>
  <text x="208" y="354" font-size="11" font-weight="600" fill="#3a8fa8">O  客觀資料（Objective）</text>
  <text x="208" y="370" font-size="11" font-weight="600" fill="#3a8fa8">A  評估（Assessment）</text>
  <text x="208" y="386" font-size="11" font-weight="600" fill="#3a8fa8">P  計畫（Plan）</text>

  <!-- Footer 按鈕 -->
  <rect x="192" y="406" width="188" height="40" rx="8" fill="white" stroke="#dedad3" stroke-width="1.5"/>
  <text x="286" y="431" text-anchor="middle" font-size="13" fill="#57534e">取消</text>
  <rect x="388" y="406" width="212" height="40" rx="8" fill="#3a8fa8"/>
  <!-- 虛線高亮框 -->
  <rect x="384" y="402" width="220" height="48" rx="10" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="494" y="431" text-anchor="middle" font-size="13" font-weight="600" fill="white">送出 SOAP 改寫</text>

  <!-- 標註① SOAP checkbox -->
  <rect x="6" y="268" width="148" height="68" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="80" y="289" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">① 勾選 SOAP 模式</text>
  <text x="80" y="307" text-anchor="middle" font-size="11" fill="#92400e">自動改寫成</text>
  <text x="80" y="323" text-anchor="middle" font-size="11" fill="#92400e">四段護理格式</text>
  <line x1="154" y1="290" x2="190" y2="284" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrS1)"/>

  <!-- 標註② 送出按鈕 -->
  <rect x="646" y="398" width="148" height="52" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="720" y="419" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">② 送出</text>
  <text x="720" y="437" text-anchor="middle" font-size="11" fill="#92400e">取得四段改寫</text>
  <line x1="646" y1="426" x2="608" y2="426" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrS1)"/>

  <defs>
    <marker id="arrS1" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#d97706"/>
    </marker>
  </defs>

  <text x="795" y="494" text-anchor="end" font-size="10" fill="#a8a29e">示意圖｜實際介面以登入後為準</text>
</svg>
