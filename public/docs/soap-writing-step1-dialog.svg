<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景米色 + 暗色遮罩 -->
  <rect width="800" height="500" fill="#f0efe8"/>
  <rect width="800" height="500" fill="#1e293b" opacity="0.4"/>

  <!-- Dialog 陰影 -->
  <rect x="144" y="54" width="436" height="400" rx="14" fill="#0f172a" opacity="0.25"/>
  <!-- Dialog 主卡片 -->
  <rect x="140" y="50" width="436" height="400" rx="14" fill="white"/>

  <!-- Dialog Header -->
  <text x="164" y="86" font-size="16" font-weight="700" fill="#1e293b">✦ AI 修改助手</text>
  <text x="556" y="86" text-anchor="middle" font-size="20" fill="#78716c">×</text>

  <!-- 圈選段落 label -->
  <text x="164" y="118" font-size="12" fill="#78716c">圈選段落</text>
  <!-- 圈選段落 box（淺米灰底，無邊框） -->
  <rect x="164" y="126" width="388" height="86" rx="8" fill="#efedea"/>
  <text x="180" y="150" font-size="13" fill="#1e293b">本機構依個案需求提供日間照顧服務，每月召</text>
  <text x="180" y="172" font-size="13" fill="#1e293b">開服務檢討會議，並由跨專業團隊共同擬定個</text>
  <text x="180" y="194" font-size="13" fill="#1e293b">別化照顧計畫...</text>

  <!-- 修改指令 label（左）+ SOAP checkbox（右）同行 -->
  <text x="164" y="244" font-size="13" font-weight="600" fill="#1e293b">修改指令</text>
  <!-- SOAP checkbox（已勾選） -->
  <rect x="496" y="230" width="16" height="16" rx="4" fill="#3a8fa8"/>
  <polyline points="499,239 502,242 509,234" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="520" y="244" font-size="13" font-weight="600" fill="#1e293b">SOAP</text>

  <!-- 修改指令 textarea -->
  <rect x="164" y="256" width="388" height="98" rx="6" fill="white" stroke="#e8e6de" stroke-width="1.5"/>
  <text x="180" y="280" font-size="12" fill="#a8a29e">改寫成：主觀S、客觀O、評估A、計畫P四段</text>
  <text x="180" y="300" font-size="12" fill="#a8a29e">結構。若還有其他需求，可在此對話框說明</text>
  <text x="180" y="320" font-size="12" fill="#a8a29e">(例：精簡用字、加入具體數值範圍等等)</text>

  <!-- 取消 button -->
  <rect x="372" y="386" width="80" height="40" rx="8" fill="white" stroke="#dedad3" stroke-width="1.5"/>
  <text x="412" y="411" text-anchor="middle" font-size="13" fill="#57534e">取消</text>
  <!-- 送出 button（藍色填滿） -->
  <rect x="464" y="386" width="92" height="40" rx="8" fill="#3a8fa8"/>
  <text x="510" y="411" text-anchor="middle" font-size="13" font-weight="600" fill="white">✦ 送出</text>

  <!-- 虛線高亮框 (SOAP checkbox 區) -->
  <rect x="488" y="222" width="72" height="32" rx="6" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="5 3"/>
  <!-- 虛線高亮框 (送出 button) -->
  <rect x="460" y="382" width="100" height="48" rx="10" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="5 3"/>

  <!-- 標註① SOAP -->
  <rect x="600" y="216" width="186" height="58" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="693" y="239" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">① 勾選 SOAP</text>
  <text x="693" y="259" text-anchor="middle" font-size="11" fill="#92400e">啟用四段自動改寫</text>
  <line x1="600" y1="240" x2="566" y2="240" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrS1)"/>

  <!-- 標註② 送出 -->
  <rect x="600" y="382" width="186" height="58" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="693" y="405" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">② 點擊送出</text>
  <text x="693" y="425" text-anchor="middle" font-size="11" fill="#92400e">取得 SOAP 四段改寫</text>
  <line x1="600" y1="406" x2="566" y2="406" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrS1)"/>

  <defs>
    <marker id="arrS1" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#d97706"/>
    </marker>
  </defs>

  <text x="795" y="494" text-anchor="end" font-size="10" fill="#a8a29e">示意圖｜實際介面以登入後為準</text>
</svg>
