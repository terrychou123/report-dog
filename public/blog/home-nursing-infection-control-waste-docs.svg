  <text x="100" y="313" font-size="28" fill="#1e293b" font-weight="700">廢棄物清除記錄</text>
  <text x="100" y="337" font-size="18" fill="#57534e">每次清除的日期、數量、業者確認，不可有空缺月份</text>
