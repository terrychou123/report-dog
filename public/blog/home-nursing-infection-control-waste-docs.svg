  <text x="100" y="210" font-size="28" fill="#1e293b" font-weight="700">廢棄物清除合約</text>
  <text x="100" y="234" font-size="18" fill="#57534e">與合法業者簽訂，合約有效期限需在評鑑期間內</text>
  <rect x="620" y="185" width="136" height="52" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="205" font-size="16" fill="#d97706" text-anchor="middle">有效</text>
  <text x="688" y="225" font-size="16" fill="#d97706" text-anchor="middle">期限</text>
  <rect x="28" y="269" width="744" height="90" rx="12" fill="#e8e6de"/>
