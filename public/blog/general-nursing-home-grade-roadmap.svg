<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>
  <rect width="800" height="6" fill="#d97706"/>

  <!-- 標題 -->
  <text x="400" y="45" font-size="22" fill="#d97706" font-weight="bold" text-anchor="middle">從合格到優等的升級路徑圖</text>

  <!-- 階梯背景裝飾 -->
  <rect x="50" y="390" width="700" height="10" fill="#d97706" rx="3" opacity="0.3"/>

  <!-- 階梯1：不合格 → 合格 -->
  <rect x="50" y="370" width="155" height="50" fill="#fef2f2" rx="8" stroke="#dc2626" stroke-width="2"/>
  <text x="128" y="390" font-size="15" fill="#dc2626" font-weight="bold" text-anchor="middle">不合格</text>
  <text x="128" y="410" font-size="14" fill="#dc2626" text-anchor="middle">重大缺失</text>

  <!-- 箭頭右 -->
  <polygon points="215,393 228,385 228,401" fill="#d97706"/>
  <line x1="205" y1="393" x2="228" y2="393" stroke="#d97706" stroke-width="2.5"/>

  <!-- 階梯2：合格 -->
  <rect x="230" y="320" width="155" height="100" fill="#fff7ed" rx="8" stroke="#d97706" stroke-width="2"/>
  <text x="308" y="358" font-size="17" fill="#d97706" font-weight="bold" text-anchor="middle">合格</text>
  <text x="308" y="378" font-size="14" fill="#d97706" text-anchor="middle">A 區全達標</text>
  <text x="308" y="393" font-size="14" fill="#d97706" text-anchor="middle">B 區部分達成</text>
  <text x="308" y="413" font-size="14" fill="#d97706" text-anchor="middle">無重大缺失</text>

  <!-- 箭頭右 -->
  <polygon points="395,343 408,335 408,351" fill="#d97706"/>
  <line x1="385" y1="343" x2="408" y2="343" stroke="#d97706" stroke-width="2.5"/>

  <!-- 階梯3：甲等 -->
  <rect x="410" y="240" width="155" height="180" fill="#fef3c7" rx="8" stroke="#d97706" stroke-width="2"/>
  <text x="488" y="280" font-size="19" fill="#d97706" font-weight="bold" text-anchor="middle">甲等</text>
  <text x="488" y="305" font-size="14" fill="#d97706" text-anchor="middle">A 區全達標</text>
  <text x="488" y="323" font-size="14" fill="#d97706" text-anchor="middle">B 區大部分達成</text>
  <text x="488" y="341" font-size="14" fill="#d97706" text-anchor="middle">照護計畫個別化</text>
  <text x="488" y="359" font-size="14" fill="#d97706" text-anchor="middle">PDCA 記錄完整</text>
  <text x="488" y="377" font-size="14" fill="#d97706" text-anchor="middle">C 區消防達標</text>
  <text x="488" y="397" font-size="14" fill="#78716c" text-anchor="middle">少量待改善</text>

  <!-- 箭頭右 -->
  <polygon points="575,263 588,255 588,271" fill="#d97706"/>
  <line x1="565" y1="263" x2="588" y2="263" stroke="#d97706" stroke-width="2.5"/>

  <!-- 階梯4：優等 -->
  <rect x="590" y="120" width="165" height="300" fill="#d97706" rx="8" stroke="#d97706" stroke-width="3"/>
  <!-- 星星 -->
  <text x="672" y="158" font-size="28" fill="#d97706" text-anchor="middle">*</text>
  <text x="672" y="190" font-size="22" fill="#d97706" font-weight="bold" text-anchor="middle">優等</text>
  <text x="672" y="218" font-size="14" fill="#d97706" text-anchor="middle">全部項目達成</text>
  <text x="672" y="238" font-size="14" fill="#d97706" text-anchor="middle">無任何缺失</text>
  <text x="672" y="260" font-size="14" fill="#d97706" text-anchor="middle">D1 創新加分</text>
  <text x="672" y="280" font-size="14" fill="#d97706" text-anchor="middle">配合政府計畫</text>
  <text x="672" y="302" font-size="14" fill="#d97706" text-anchor="middle">B2 跨專業</text>
  <text x="672" y="320" font-size="14" fill="#d97706" text-anchor="middle">實質討論記錄</text>
  <text x="672" y="342" font-size="14" fill="#d97706" text-anchor="middle">超越基本要求</text>
  <text x="672" y="362" font-size="14" fill="#d97706" text-anchor="middle">的創新照護</text>
  <text x="672" y="390" font-size="14" fill="#78716c" text-anchor="middle">系統性無缺失</text>

  <!-- 左側標注：升等關鍵 -->
  <text x="40" y="110" font-size="14" fill="#d97706" font-weight="bold">升等關鍵</text>

  <!-- 合格→甲等 標注 -->
  <line x1="308" y1="318" x2="230" y2="280" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4"/>
  <rect x="30" y="258" width="190" height="50" fill="white" rx="6" stroke="#d97706" stroke-width="1.5"/>
  <text x="125" y="278" font-size="14" fill="#d97706" font-weight="bold" text-anchor="middle">B1 照護計畫個別化</text>
  <text x="125" y="298" font-size="14" fill="#d97706" text-anchor="middle">B3 PDCA 記錄完整</text>

  <!-- 甲等→優等 標注 -->
  <line x1="488" y1="238" x2="390" y2="195" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4"/>
  <rect x="185" y="165" width="195" height="50" fill="white" rx="6" stroke="#d97706" stroke-width="1.5"/>
  <text x="283" y="185" font-size="14" fill="#d97706" font-weight="bold" text-anchor="middle">D1 創新加分項目</text>
  <text x="283" y="205" font-size="14" fill="#d97706" text-anchor="middle">B2 跨專業實質記錄</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end">報告汪 reportwang.com</text>
</svg>
