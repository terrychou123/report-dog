<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- Header 區塊 (y=29, h=60) -->
  <rect x="0" y="29" width="800" height="60" fill="white"/>
  <!-- Header 左側色條 -->
  <rect x="0" y="29" width="6" height="60" fill="#d97706" rx="2"/>
  <!-- Header 文字（12字，font-size=36） -->
  <text x="28" y="73" font-size="36" fill="#1e293b" font-weight="700" >文書負擔最重的 5 項基準</text>

  <!-- Row 1 (y=118, color=#d97706, H=60) -->
  <rect x="28" y="118" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="118" width="6" height="60" rx="2" fill="#d97706"/>
  <circle cx="66" cy="148" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="154" font-size="16" font-weight="900" text-anchor="middle" fill="#d97706" >1</text>
  <text x="100" y="145" font-size="22" fill="#1e293b" font-weight="700" >項目13 服務紀錄</text>
  <text x="100" y="165" font-size="16" fill="#57534e" >每次服務均需完整填寫保存</text>
  <rect x="620" y="126" width="136" height="44" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="138" font-size="16" text-anchor="middle" fill="#d97706" font-weight="700" >照服員</text>
  <text x="688" y="158" font-size="16" text-anchor="middle" fill="#d97706" >每次必填</text>

  <!-- Row 2 (y=191, color=#78716c) -->
  <rect x="28" y="191" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="191" width="6" height="60" rx="2" fill="#78716c"/>
  <circle cx="66" cy="221" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="227" font-size="16" font-weight="900" text-anchor="middle" fill="#78716c" >2</text>
  <text x="100" y="218" font-size="22" fill="#1e293b" font-weight="700" >項目6 個別計畫</text>
  <text x="100" y="238" font-size="16" fill="#57534e" >書面計畫含同意書每6月更新</text>
  <rect x="620" y="199" width="136" height="44" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="211" font-size="16" text-anchor="middle" fill="#78716c" font-weight="700" >社工</text>
  <text x="688" y="231" font-size="16" text-anchor="middle" fill="#78716c" >定期更新</text>

  <!-- Row 3 (y=264, color=#57534e) -->
  <rect x="28" y="264" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="264" width="6" height="60" rx="2" fill="#57534e"/>
  <circle cx="66" cy="294" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="300" font-size="16" font-weight="900" text-anchor="middle" fill="#57534e" >3</text>
  <text x="100" y="291" font-size="22" fill="#1e293b" font-weight="700" >項目12 督導訪視</text>
  <text x="100" y="311" font-size="16" fill="#57534e" >督導需有書面訪視紀錄</text>
  <rect x="620" y="272" width="136" height="44" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="284" font-size="16" text-anchor="middle" fill="#57534e" font-weight="700" >主管</text>
  <text x="688" y="304" font-size="16" text-anchor="middle" fill="#57534e" >頻率要求</text>

  <!-- Row 4 (y=337, color=#a8a29e) -->
  <rect x="28" y="337" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="337" width="6" height="60" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="367" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="373" font-size="16" font-weight="900" text-anchor="middle" fill="#a8a29e" >4</text>
  <text x="100" y="364" font-size="22" fill="#1e293b" font-weight="700" >項目18 人員訓練</text>
  <text x="100" y="384" font-size="16" fill="#57534e" >每位員工訓練時數需有紀錄</text>
  <rect x="620" y="345" width="136" height="44" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="357" font-size="16" text-anchor="middle" fill="#a8a29e" font-weight="700" >行政</text>
  <text x="688" y="377" font-size="16" text-anchor="middle" fill="#a8a29e" >逐人建檔</text>

  <!-- Row 5 (y=410, color=#94a3b8) -->
  <rect x="28" y="410" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="410" width="6" height="60" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="440" r="16" fill="#94a3b8" opacity="0.15"/>
  <text x="66" y="446" font-size="16" font-weight="900" text-anchor="middle" fill="#94a3b8" >5</text>
  <text x="100" y="437" font-size="22" fill="#1e293b" font-weight="700" >項目30 機構自評</text>
  <text x="100" y="457" font-size="16" fill="#57534e" >年度自評需書面報告存查</text>
  <rect x="620" y="418" width="136" height="44" rx="8" fill="#94a3b8" opacity="0.12"/>
  <text x="688" y="430" font-size="16" text-anchor="middle" fill="#94a3b8" font-weight="700" >主管</text>
  <text x="688" y="450" font-size="16" text-anchor="middle" fill="#94a3b8" >年度必繳</text>

  <!-- 浮水印 -->
  <text x="760" y="492" font-size="16" fill="#d97706" text-anchor="end" >報告汪 reportwang.com</text>
</svg>
