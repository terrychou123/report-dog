<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <text x="400" y="48"  font-size="32" font-weight="700" fill="#1e293b" text-anchor="middle">第二週行動計畫</text>
  <text x="400" y="78"  font-size="22" fill="#78716c" text-anchor="middle">掌握人力配置法規要件——三個一級必要項確認</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#a8a29e" stroke-width="1.5"/>
  <rect x="40" y="108" width="100" height="36" rx="18" fill="#78716c"/>
  <text x="90" y="131"  font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">第 2 週</text>
  <!-- 項目1 -->
  <rect x="40" y="162" width="720" height="64" rx="8" fill="#ffffff"/>
  <rect x="40" y="162" width="6" height="64" rx="2" fill="#d97706"/>
  <circle cx="80" cy="194" r="18" fill="#d97706" opacity="0.15"/>
  <text x="80" y="200"  font-size="16" font-weight="700" fill="#d97706" text-anchor="middle">1</text>
  <text x="116" y="186"  font-size="17" font-weight="700" fill="#1e293b">確認 A9 護理人員配置（一級必要）</text>
  <text x="116" y="210"  font-size="15" fill="#57534e">長照型 1:15、養護型 1:20、失智型 1:20；全日含假日夜班均需有護理師</text>
  <!-- 項目2 -->
  <rect x="40" y="240" width="720" height="64" rx="8" fill="#ffffff"/>
  <rect x="40" y="240" width="6" height="64" rx="2" fill="#78716c"/>
  <circle cx="80" cy="272" r="18" fill="#78716c" opacity="0.15"/>
  <text x="80" y="278"  font-size="16" font-weight="700" fill="#78716c" text-anchor="middle">2</text>
  <text x="116" y="264"  font-size="17" font-weight="700" fill="#1e293b">確認 A11 照服員配置（一級必要）</text>
  <text x="116" y="288"  font-size="15" fill="#57534e">外籍照服員不超過本國籍照服員及護理師總數；各班均需有本國籍照服員</text>
  <!-- 項目3 -->
  <rect x="40" y="318" width="720" height="64" rx="8" fill="#ffffff"/>
  <rect x="40" y="318" width="6" height="64" rx="2" fill="#57534e"/>
  <circle cx="80" cy="350" r="18" fill="#57534e" opacity="0.15"/>
  <text x="80" y="356"  font-size="16" font-weight="700" fill="#57534e" text-anchor="middle">3</text>
  <text x="116" y="342"  font-size="17" font-weight="700" fill="#1e293b">確認 A7 業務負責人自身文件（一級必要）</text>
  <text x="116" y="366"  font-size="15" fill="#57534e">勞健保投保記錄更新至本機構、勞退金提撥確認、資格文件備存</text>
  <!-- 項目4 -->
  <rect x="40" y="396" width="720" height="64" rx="8" fill="#ffffff"/>
  <rect x="40" y="396" width="6" height="64" rx="2" fill="#a8a29e"/>
  <circle cx="80" cy="428" r="18" fill="#94a3b8" opacity="0.15"/>
  <text x="80" y="434"  font-size="16" font-weight="700" fill="#94a3b8" text-anchor="middle">4</text>
  <text x="116" y="420"  font-size="17" font-weight="700" fill="#1e293b">製作人力配置現況對照表</text>
  <text x="116" y="444"  font-size="15" fill="#57534e">以法規要求對照實際配置，標注達標與缺口，列入改善計畫</text>
  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" >報告汪 reportwang.com</text>
</svg>
