<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- 標題列 -->
  <rect x="0" y="29" width="800" height="60" fill="#e8e6de"/>
  <rect x="0" y="29" width="6" height="60" rx="2" fill="#d97706"/>
  <text x="28" y="74" font-size="30" fill="#1e293b" font-weight="700">合格品質指標季報：必要結構 4 要素</text>
  <!-- Row 1 -->
  <rect x="28" y="118" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="118" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="66" cy="149" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="155" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <text x="100" y="146" font-size="20" fill="#1e293b" font-weight="700">封面資訊 + 6 項指標統計表</text>
  <text x="100" y="167" font-size="16" fill="#57534e">機構名稱、統計期間；每項指標本季數值、前季比較、趨勢</text>
  <rect x="620" y="126" width="136" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="143" font-size="16" fill="#d97706" text-anchor="middle">基本</text>
  <text x="688" y="163" font-size="16" fill="#d97706" text-anchor="middle">必備</text>
  <!-- Row 2 -->
  <rect x="28" y="191" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="191" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="66" cy="222" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="228" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <text x="100" y="219" font-size="20" fill="#1e293b" font-weight="700">異常項目分析 + 改善措施</text>
  <text x="100" y="240" font-size="16" fill="#57534e">超出警戒值須說明可能原因，提出改善措施含負責人與完成日期</text>
  <rect x="620" y="199" width="136" height="46" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="216" font-size="16" fill="#78716c" text-anchor="middle">評鑑委員</text>
  <text x="688" y="236" font-size="16" fill="#78716c" text-anchor="middle">最注重</text>
  <!-- Row 3 -->
  <rect x="28" y="264" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="264" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="295" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="301" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <text x="100" y="292" font-size="20" fill="#1e293b" font-weight="700">前季改善追蹤</text>
  <text x="100" y="313" font-size="16" fill="#57534e">上一季提出的改善措施，本季執行狀況如何？有無完成？</text>
  <rect x="620" y="272" width="136" height="46" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="289" font-size="16" fill="#57534e" text-anchor="middle">持續</text>
  <text x="688" y="309" font-size="16" fill="#57534e" text-anchor="middle">改善閉環</text>
  <!-- Row 4 -->
  <rect x="28" y="337" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="337" width="6" height="62" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="368" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="374" font-size="16" fill="#a8a29e" text-anchor="middle" font-weight="900">4</text>
  <text x="100" y="365" font-size="20" fill="#1e293b" font-weight="700">品管會議記錄（或負責人確認簽名）</text>
  <text x="100" y="386" font-size="16" fill="#57534e">機構負責人或品管負責人簽名確認，證明有主動管理指標</text>
  <rect x="620" y="345" width="136" height="46" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="362" font-size="16" fill="#a8a29e" text-anchor="middle">簽名</text>
  <text x="688" y="382" font-size="16" fill="#a8a29e" text-anchor="middle">確認必要</text>
  <!-- 小提示 -->
  <rect x="28" y="420" width="744" height="50" rx="10" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
  <text x="50" y="437" font-size="16" fill="#92400e" font-weight="700">月底花 15 分鐘統計當月數值，季末加總 3 個月，</text>
  <text x="50" y="458" font-size="16" fill="#92400e">季報撰寫時間可壓縮至 1 小時內完成</text>
  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
