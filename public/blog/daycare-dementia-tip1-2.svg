<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="450" fill="#f0efe8"/>
  <text x="400" y="46" font-size="21" font-weight="700" fill="#1e293b" text-anchor="middle">技巧 1–2：情緒同理 → 個別化活動轉移</text>
  <rect x="60" y="58" width="48" height="3" rx="1.5" fill="#d97706"/>
  <line x1="116" y1="59.5" x2="740" y2="59.5" stroke="#dedad3" stroke-width="1"/>

  <!-- Step 1 -->
  <rect x="52" y="84" width="300" height="312" rx="12" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="52" y="84" width="300" height="5" rx="2.5" fill="#d97706"/>
  <rect x="68" y="100" width="80" height="26" rx="6" fill="#d97706" opacity="0.12"/>
  <text x="108" y="117" font-size="13" fill="#d97706" text-anchor="middle" font-weight="700">技巧 1</text>
  <text x="202" y="117" font-size="15" font-weight="700" fill="#1e293b">情緒同理優先回應</text>
  <text x="202" y="135" font-size="12" fill="#64748b">對應評鑑第 6 條</text>
  <line x1="68" y1="150" x2="336" y2="150" stroke="#f0ede6" stroke-width="1"/>
  <text x="72" y="174" font-size="13" fill="#1e293b" font-weight="600">❌ 避免的回應</text>
  <rect x="68" y="182" width="268" height="50" rx="8" fill="#ef4444" opacity="0.06"/>
  <text x="80" y="204" font-size="12" fill="#dc2626">「這裡就是你家啦」</text>
  <text x="80" y="222" font-size="12" fill="#94a3b8">→ 否定感受，引發更大混亂</text>
  <text x="72" y="254" font-size="13" fill="#1e293b" font-weight="600">✓ 正確回應步驟</text>
  <rect x="68" y="262" width="268" height="34" rx="8" fill="#d97706" opacity="0.08"/>
  <text x="80" y="283" font-size="12" fill="#92400e">① 先認可：「我知道你想家…」</text>
  <rect x="68" y="302" width="268" height="34" rx="8" fill="#f8f7f2"/>
  <text x="80" y="323" font-size="12" fill="#1e293b">② 傾聽：讓情緒被看見</text>
  <rect x="68" y="342" width="268" height="34" rx="8" fill="#d97706" opacity="0.08"/>
  <text x="80" y="363" font-size="12" fill="#92400e">③ 轉引：「今天有想到誰嗎？」</text>

  <!-- Arrow -->
  <text x="384" y="248" font-size="28" fill="#d97706" text-anchor="middle">→</text>

  <!-- Step 2 -->
  <rect x="420" y="84" width="328" height="312" rx="12" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="420" y="84" width="328" height="5" rx="2.5" fill="#78716c"/>
  <rect x="436" y="100" width="80" height="26" rx="6" fill="#78716c" opacity="0.12"/>
  <text x="476" y="117" font-size="13" fill="#78716c" text-anchor="middle" font-weight="700">技巧 2</text>
  <text x="564" y="117" font-size="15" font-weight="700" fill="#1e293b">個別化活動轉移</text>
  <text x="564" y="135" font-size="12" fill="#64748b">對應評鑑第 6、11 條</text>
  <line x1="436" y1="150" x2="732" y2="150" stroke="#f0ede6" stroke-width="1"/>
  <text x="440" y="174" font-size="13" fill="#1e293b" font-weight="600">轉移活動來自生命經驗</text>
  <rect x="436" y="182" width="296" height="34" rx="8" fill="#f8f7f2"/>
  <text x="448" y="203" font-size="12" fill="#1e293b">縫紉工作者 → 摸布料、整理布塊</text>
  <rect x="436" y="222" width="296" height="34" rx="8" fill="#d97706" opacity="0.08"/>
  <text x="448" y="243" font-size="12" fill="#92400e">農耕者 → 庭院澆水、摘菜葉</text>
  <rect x="436" y="262" width="296" height="34" rx="8" fill="#f8f7f2"/>
  <text x="448" y="283" font-size="12" fill="#1e293b">家庭主婦 → 摺衣服、整理碗筷</text>
  <line x1="436" y1="308" x2="732" y2="308" stroke="#f0ede6" stroke-width="1"/>
  <text x="440" y="330" font-size="13" fill="#d97706" font-weight="600">評鑑紀錄寫法：</text>
  <text x="440" y="350" font-size="12" fill="#78716c">「個案偏好活動：整理布料</text>
  <text x="440" y="368" font-size="12" fill="#78716c">（與職業經驗相關）」→ 計畫個別化</text>

  <text x="760" y="421" font-size="16" fill="#c4bfb8" text-anchor="end" font-weight="400" font-family="'Noto Sans TC', sans-serif">報告汪 reportwang.com</text>
</svg>
