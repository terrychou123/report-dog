<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"
     font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">技巧 1–2：情緒同理與活動轉移</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">接納情緒是第一步，活動轉移讓情緒著陸</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- 左卡片（#d97706，技巧1 情緒同理，x=40, y=104, w=346, h=346）-->
  <rect x="40" y="104" width="346" height="346" rx="12" fill="white"/>
  <rect x="40" y="104" width="346" height="44" rx="12" fill="#d97706"/>
  <rect x="40" y="128" width="346" height="20" fill="#d97706"/>
  <circle cx="68" cy="126" r="9" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
  <circle cx="68" cy="126" r="3" fill="white"/>
  <text x="213" y="143" text-anchor="middle" font-size="15" fill="white" font-weight="700">技巧 1：情緒同理</text>
  <text x="60" y="180" font-size="14" fill="#57534e">• 說「您想回家啊，想家的感覺」</text>
  <text x="60" y="202" font-size="14" fill="#57534e">• 不說「這裡就是你的家」</text>
  <text x="60" y="224" font-size="14" fill="#57534e">• 不爭辯、不說教、不否定</text>
  <text x="60" y="246" font-size="14" fill="#57534e">• 身體語言：微笑、輕拍、靠近</text>
  <line x1="56" y1="260" x2="370" y2="260" stroke="#dedad3" stroke-width="1"/>
  <text x="60" y="282" font-size="14" fill="#d97706" font-weight="600">評鑑關聯：</text>
  <text x="60" y="302" font-size="14" fill="#57534e">• 對應第 6 條「失智照顧技術」</text>
  <text x="60" y="322" font-size="14" fill="#57534e">• 展示工作人員具備失智照護知識</text>
  <rect x="56" y="382" width="100" height="20" rx="10" fill="#fef3c7"/>
  <text x="106" y="396" text-anchor="middle" font-size="14" fill="#d97706" font-weight="600">情緒接納法</text>

  <!-- 右卡片（#78716c，技巧2 活動轉移，x=414, y=104, w=346, h=346）-->
  <rect x="414" y="104" width="346" height="346" rx="12" fill="white"/>
  <rect x="414" y="104" width="346" height="44" rx="12" fill="#78716c"/>
  <rect x="414" y="128" width="346" height="20" fill="#78716c"/>
  <rect x="438" y="117" width="18" height="18" rx="3" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
  <line x1="441" y1="126" x2="453" y2="126" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
  <text x="587" y="143" text-anchor="middle" font-size="15" fill="white" font-weight="700">技巧 2：個別化活動轉移</text>
  <text x="434" y="180" font-size="14" fill="#57534e">• 根據生命史設計懷舊活動</text>
  <text x="434" y="202" font-size="14" fill="#57534e">• 播放個案熟悉的老歌音樂</text>
  <text x="434" y="224" font-size="14" fill="#57534e">• 讓個案做慣性工作（摺衣等）</text>
  <text x="434" y="246" font-size="14" fill="#57534e">• 擺設家庭照片營造熟悉感</text>
  <line x1="430" y1="260" x2="744" y2="260" stroke="#dedad3" stroke-width="1"/>
  <text x="434" y="282" font-size="14" fill="#78716c" font-weight="600">評鑑關聯：</text>
  <text x="434" y="302" font-size="14" fill="#57534e">• 對應第 9 條「服務活動計畫」</text>
  <text x="434" y="322" font-size="14" fill="#57534e">• 展示活動規劃有個別性考量</text>
  <rect x="430" y="382" width="100" height="20" rx="10" fill="#f5f5f4"/>
  <text x="480" y="396" text-anchor="middle" font-size="14" fill="#78716c" font-weight="600">個別化轉移</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
