<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題 -->
  <text x="400" y="48" text-anchor="middle" font-size="30" fill="#1e293b" font-weight="700">管制藥品管理三大必要機制</text>
  <text x="400" y="76" text-anchor="middle" font-size="20" fill="#57534e">2.5.8 評鑑委員翻清點本、查保險箱</text>
  <line x1="129" y1="92" x2="671" y2="92" stroke="#dedad3" stroke-width="1"/>

  <!-- N=3 flow，card_w=170, margin=129 -->

  <!-- Step 01：雙鎖保管 (#d97706) x=129 cx=214 -->
  <rect x="129" y="108" width="170" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="129" y="108" width="170" height="8" rx="4" fill="#d97706"/>
  <rect x="129" y="112" width="170" height="4" fill="#d97706"/>
  <circle cx="214" cy="194" r="43" fill="#fef3c7"/>
  <text x="214" y="183" text-anchor="middle" font-size="16" fill="#d97706" font-weight="700">機制</text>
  <text x="214" y="211" text-anchor="middle" font-size="26" fill="#d97706" font-weight="700">01</text>
  <text x="214" y="290" text-anchor="middle" font-size="28" fill="#1e293b" font-weight="700">雙鎖保管</text>
  <text x="214" y="324" text-anchor="middle" font-size="18" fill="#57534e">專用保險箱雙鎖</text>
  <text x="214" y="346" text-anchor="middle" font-size="18" fill="#57534e">依醫囑始得領用</text>
  <rect x="142" y="381" width="144" height="36" rx="18" fill="#fef3c7"/>
  <text x="214" y="405" text-anchor="middle" font-size="16" fill="#d97706" font-weight="600">符合管制條例</text>

  <!-- Step 02：班班清點 (#78716c) x=315 cx=400 -->
  <rect x="315" y="108" width="170" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="315" y="108" width="170" height="8" rx="4" fill="#78716c"/>
  <rect x="315" y="112" width="170" height="4" fill="#78716c"/>
  <circle cx="400" cy="194" r="43" fill="#f5f5f4"/>
  <text x="400" y="183" text-anchor="middle" font-size="16" fill="#78716c" font-weight="700">機制</text>
  <text x="400" y="211" text-anchor="middle" font-size="26" fill="#78716c" font-weight="700">02</text>
  <text x="400" y="290" text-anchor="middle" font-size="28" fill="#1e293b" font-weight="700">班班清點</text>
  <text x="400" y="324" text-anchor="middle" font-size="18" fill="#57534e">每班交班清點數量</text>
  <text x="400" y="346" text-anchor="middle" font-size="18" fill="#57534e">清點本兩人簽名</text>
  <rect x="328" y="381" width="144" height="36" rx="18" fill="#f5f5f4"/>
  <text x="400" y="405" text-anchor="middle" font-size="16" fill="#78716c" font-weight="600">連續無空白</text>

  <!-- Step 03：浪費量簽名 (#57534e) x=501 cx=586 -->
  <rect x="501" y="108" width="170" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="501" y="108" width="170" height="8" rx="4" fill="#57534e"/>
  <rect x="501" y="112" width="170" height="4" fill="#57534e"/>
  <circle cx="586" cy="194" r="43" fill="#f5f0eb"/>
  <text x="586" y="183" text-anchor="middle" font-size="16" fill="#57534e" font-weight="700">機制</text>
  <text x="586" y="211" text-anchor="middle" font-size="26" fill="#57534e" font-weight="700">03</text>
  <text x="586" y="290" text-anchor="middle" font-size="28" fill="#1e293b" font-weight="700">浪費量</text>
  <text x="586" y="313" text-anchor="middle" font-size="28" fill="#1e293b" font-weight="700">雙人見證</text>
  <text x="586" y="344" text-anchor="middle" font-size="18" fill="#57534e">丟棄量兩人在場</text>
  <text x="586" y="364" text-anchor="middle" font-size="18" fill="#57534e">各自簽名留記錄</text>
  <rect x="514" y="381" width="144" height="36" rx="18" fill="#f5f0eb"/>
  <text x="586" y="405" text-anchor="middle" font-size="16" fill="#57534e" font-weight="600">最常被忽略</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
