<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="450" fill="#f0efe8"/>
  <text x="400" y="46" font-size="21" font-weight="700" fill="#1e293b" text-anchor="middle">照顧計畫 4 大必要要素（第 6 條）</text>
  <rect x="60" y="58" width="48" height="3" rx="1.5" fill="#d97706"/>
  <line x1="116" y1="59.5" x2="740" y2="59.5" stroke="#dedad3" stroke-width="1"/>

  <!-- Top rule -->
  <rect x="52" y="78" width="696" height="34" rx="8" fill="#d97706" opacity="0.08"/>
  <text x="400" y="99" font-size="13" fill="#92400e" text-anchor="middle" font-weight="600">評估完成後 7 個工作天內完成 ｜ 制式模板套用所有個案 = 不符合</text>

  <!-- 4 flow steps -->
  <!-- Step 1 -->
  <rect x="52" y="126" width="154" height="260" rx="12" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="52" y="126" width="154" height="5" rx="2.5" fill="#d97706"/>
  <text x="129" y="162" font-size="13" font-weight="700" fill="#78716c" text-anchor="middle">① 具體目標</text>
  <line x1="68" y1="176" x2="190" y2="176" stroke="#f0ede6" stroke-width="1"/>
  <text x="129" y="200" font-size="12" fill="#64748b" text-anchor="middle">可衡量，有數字</text>
  <text x="129" y="220" font-size="12" fill="#64748b" text-anchor="middle">有時間節點</text>
  <line x1="68" y1="238" x2="190" y2="238" stroke="#f0ede6" stroke-width="1"/>
  <rect x="68" y="248" width="120" height="48" rx="8" fill="#d97706" opacity="0.08"/>
  <text x="128" y="268" font-size="11" fill="#92400e" text-anchor="middle">✓ 3個月內</text>
  <text x="128" y="286" font-size="11" fill="#92400e" text-anchor="middle">如廁輔助達成</text>
  <rect x="68" y="302" width="120" height="38" rx="8" fill="#f0ede6"/>
  <text x="128" y="318" font-size="11" fill="#94a3b8" text-anchor="middle">✗ 維持現況</text>
  <text x="128" y="334" font-size="11" fill="#94a3b8" text-anchor="middle">（過於模糊）</text>

  <!-- Arrow 1 -->
  <text x="226" y="252" font-size="22" fill="#d97706" text-anchor="middle">→</text>

  <!-- Step 2 -->
  <rect x="244" y="126" width="154" height="260" rx="12" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="244" y="126" width="154" height="5" rx="2.5" fill="#78716c"/>
  <text x="321" y="162" font-size="13" font-weight="700" fill="#78716c" text-anchor="middle">② 服務策略</text>
  <line x1="260" y1="176" x2="382" y2="176" stroke="#f0ede6" stroke-width="1"/>
  <text x="321" y="200" font-size="12" fill="#64748b" text-anchor="middle">每項目標對應</text>
  <text x="321" y="220" font-size="12" fill="#64748b" text-anchor="middle">具體介入措施</text>
  <line x1="260" y1="238" x2="382" y2="238" stroke="#f0ede6" stroke-width="1"/>
  <text x="260" y="262" font-size="12" fill="#78716c">→ 每週3次平衡訓練</text>
  <text x="260" y="282" font-size="12" fill="#78716c">→ 每日提醒如廁</text>
  <text x="260" y="302" font-size="12" fill="#78716c">→ 餐後口腔護理</text>

  <!-- Arrow 2 -->
  <text x="418" y="252" font-size="22" fill="#d97706" text-anchor="middle">→</text>

  <!-- Step 3 -->
  <rect x="436" y="126" width="154" height="260" rx="12" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="436" y="126" width="154" height="5" rx="2.5" fill="#a8a29e"/>
  <text x="513" y="162" font-size="13" font-weight="700" fill="#78716c" text-anchor="middle">③ 個案意見</text>
  <line x1="452" y1="176" x2="574" y2="176" stroke="#f0ede6" stroke-width="1"/>
  <text x="513" y="200" font-size="12" fill="#64748b" text-anchor="middle">個案或代理人</text>
  <text x="513" y="220" font-size="12" fill="#64748b" text-anchor="middle">意見與簽名確認</text>
  <line x1="452" y1="238" x2="574" y2="238" stroke="#f0ede6" stroke-width="1"/>
  <text x="452" y="262" font-size="12" fill="#78716c">→ 個案意見記錄</text>
  <text x="452" y="282" font-size="12" fill="#78716c">→ 家屬確認簽名</text>
  <text x="452" y="302" font-size="11" fill="#94a3b8">失智：觀察行為線索</text>

  <!-- Arrow 3 -->
  <text x="610" y="252" font-size="22" fill="#d97706" text-anchor="middle">→</text>

  <!-- Step 4 -->
  <rect x="628" y="126" width="120" height="260" rx="12" fill="#d97706" opacity="0.06"/>
  <rect x="628" y="126" width="120" height="260" rx="12" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.5"/>
  <rect x="628" y="126" width="120" height="5" rx="2.5" fill="#d97706" opacity="0.7"/>
  <text x="688" y="162" font-size="13" font-weight="700" fill="#78716c" text-anchor="middle">④ 負責人</text>
  <text x="688" y="180" font-size="11" fill="#78716c" text-anchor="middle">與時程</text>
  <line x1="644" y1="192" x2="732" y2="192" stroke="#f0ede6" stroke-width="1"/>
  <text x="688" y="218" font-size="12" fill="#64748b" text-anchor="middle">每目標</text>
  <text x="688" y="238" font-size="12" fill="#64748b" text-anchor="middle">標明負責人</text>
  <line x1="644" y1="254" x2="732" y2="254" stroke="#f0ede6" stroke-width="1"/>
  <text x="644" y="276" font-size="11" fill="#d97706">社工</text>
  <text x="644" y="296" font-size="11" fill="#d97706">護理師</text>
  <text x="644" y="316" font-size="11" fill="#d97706">照服員</text>

  <text x="760" y="421" font-size="16" fill="#c4bfb8" text-anchor="end" font-weight="400" font-family="'Noto Sans TC', sans-serif">報告汪 reportwang.com</text>
</svg>
