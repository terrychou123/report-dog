<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Noto Sans TC', sans-serif">
  <defs>
    <style>
      text { font-family: 'Noto Sans TC', sans-serif; }
    </style>
  </defs>
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題 N=4 Header y=50 h=62 -->
  <rect x="28" y="50" width="744" height="62" rx="10" fill="#78716c"/>
  <text x="400" y="90" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">個案研討會紀錄四大要素</text>

  <!-- Row 1 y=160 h=62 -->
  <rect x="28" y="160" width="744" height="62" rx="10" fill="#ffffff"/>
  <rect x="28" y="160" width="6" height="62" rx="2" fill="#d97706"/>
  <circle cx="66" cy="191" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" font-size="16" font-weight="700" fill="#d97706" text-anchor="middle" dominant-baseline="central" y="191">A</text>
  <text x="96" y="184" font-size="18" font-weight="700" fill="#1e293b">出席名單（Attendance）</text>
  <text x="96" y="207" font-size="14" fill="#57534e">姓名＋職稱＋親筆簽名，附研討日期、時間、地點</text>
  <rect x="660" y="171" width="100" height="38" rx="8" fill="#fef3c7"/>
  <text x="710" y="194" font-size="13" font-weight="700" fill="#d97706" text-anchor="middle">高失分風險</text>

  <!-- Row 2 y=235 h=62 -->
  <rect x="28" y="235" width="744" height="62" rx="10" fill="#ffffff"/>
  <rect x="28" y="235" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="66" cy="266" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" font-size="16" font-weight="700" fill="#78716c" text-anchor="middle" dominant-baseline="central" y="266">B</text>
  <text x="96" y="259" font-size="18" font-weight="700" fill="#1e293b">討論個案（Case Discussed）</text>
  <text x="96" y="282" font-size="14" fill="#57534e">個案代號＋背景脈絡描述，委員會交叉比對個案檔案</text>
  <rect x="660" y="246" width="100" height="38" rx="8" fill="#f5f3ef"/>
  <text x="710" y="269" font-size="14" font-weight="700" fill="#78716c" text-anchor="middle">需夠具體</text>

  <!-- Row 3 y=310 h=62 -->
  <rect x="28" y="310" width="744" height="62" rx="10" fill="#ffffff"/>
  <rect x="28" y="310" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="66" cy="341" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" font-size="16" font-weight="700" fill="#57534e" text-anchor="middle" dominant-baseline="central" y="341">C</text>
  <text x="96" y="334" font-size="18" font-weight="700" fill="#1e293b">討論內容摘要（Summary）</text>
  <text x="96" y="357" font-size="14" fill="#57534e">問題描述、各方觀點、討論重點，建議 200–400 字</text>
  <rect x="660" y="321" width="100" height="38" rx="8" fill="#fef3c7"/>
  <text x="710" y="344" font-size="13" font-weight="700" fill="#d97706" text-anchor="middle">高失分風險</text>

  <!-- Row 4 y=385 h=62 -->
  <rect x="28" y="385" width="744" height="62" rx="10" fill="#ffffff"/>
  <rect x="28" y="385" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="416" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" font-size="16" font-weight="700" fill="#a8a29e" text-anchor="middle" dominant-baseline="central" y="416">D</text>
  <text x="96" y="409" font-size="18" font-weight="700" fill="#1e293b">結論與行動建議（Action Items）</text>
  <text x="96" y="432" font-size="14" fill="#57534e">2–3 項具體行動＋負責人＋時程，下次需追蹤執行情形</text>
  <rect x="660" y="396" width="100" height="38" rx="8" fill="#fef3c7"/>
  <text x="710" y="419" font-size="13" font-weight="700" fill="#d97706" text-anchor="middle">高失分風險</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end">reportwang.com</text>
</svg>
