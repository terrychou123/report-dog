<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 Header y=38 h=90 -->
  <rect x="28" y="38" width="744" height="90" rx="8" fill="#1e293b"/>
  <text x="400" y="74" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">E+F 區加分文件清單</text>
  <text x="400" y="104" font-size="16" fill="#94a3b8" text-anchor="middle">服務創新 + 加分項目｜最多可加 4 分，是優等關鍵</text>

  <!-- N=3 版型：H=90, inner_gap=13, outer_gap=38 -->
  <!-- Row1 y=166 E1品質改善（3行文字） -->
  <rect x="28" y="166" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="166" width="6" height="90" rx="2" fill="#d97706"/>
  <circle cx="66" cy="211" r="20" fill="#d97706" opacity="0.15"/>
  <text x="66" y="218" font-size="16" font-weight="900" fill="#d97706" text-anchor="middle">E1</text>
  <text x="116" y="198" font-size="20" font-weight="700" fill="#1e293b">品質改善 PDCA 成果報告（E1）</text>
  <text x="116" y="220" font-size="16" fill="#57534e">完整 PDCA 循環文件：計畫書、執行紀錄、稽核分析、改善成效數據</text>
  <text x="116" y="240" font-size="14" fill="#78716c">建議涵蓋至少1項照護品質指標之完整年度改善歷程</text>
  <rect x="620" y="185" width="136" height="52" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="207" font-size="16" fill="#d97706" text-anchor="middle">加分項目</text>
  <text x="688" y="227" font-size="16" fill="#d97706" text-anchor="middle">E 最多+2</text>

  <!-- Row2 y=269 E2創新服務（3行文字） -->
  <rect x="28" y="269" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="269" width="6" height="90" rx="2" fill="#78716c"/>
  <circle cx="66" cy="314" r="20" fill="#78716c" opacity="0.15"/>
  <text x="66" y="321" font-size="16" font-weight="900" fill="#78716c" text-anchor="middle">E2</text>
  <text x="116" y="301" font-size="20" font-weight="700" fill="#1e293b">創新服務報告（E2，最高加 2 分）</text>
  <text x="116" y="323" font-size="16" fill="#57534e">每項創新措施加0.5分：起源背景、執行方法、具體成效（含照片或數據）</text>
  <text x="116" y="343" font-size="14" fill="#78716c">政府試辦計畫、特殊族群照護創新模式、多元族群語言翻譯服務均可計分</text>
  <rect x="620" y="288" width="136" height="52" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="310" font-size="16" fill="#78716c" text-anchor="middle">每項+0.5</text>
  <text x="688" y="330" font-size="16" fill="#78716c" text-anchor="middle">最多+2分</text>

  <!-- Row3 y=372 F1/F2/F3（3行文字） -->
  <rect x="28" y="372" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="372" width="6" height="90" rx="2" fill="#57534e"/>
  <circle cx="66" cy="417" r="20" fill="#57534e" opacity="0.15"/>
  <text x="66" y="424" font-size="16" font-weight="900" fill="#57534e" text-anchor="middle">F</text>
  <text x="116" y="404" font-size="20" font-weight="700" fill="#1e293b">F 加分項目（F1 牙科、F2 關懷人、F3 視聽障逃生）</text>
  <text x="116" y="426" font-size="16" fill="#57534e">F1牙科診療機制(+1)、F2倡導關懷人每月2次拜訪(+0.5)、F3點字/閃光警示(+0.5)</text>
  <text x="116" y="446" font-size="14" fill="#78716c">F 區最多加 2 分，加上 E 區合計最多 4 分，是甲等升優等的分水嶺</text>
  <rect x="620" y="391" width="136" height="52" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="413" font-size="16" fill="#57534e" text-anchor="middle">F 最多+2</text>
  <text x="688" y="433" font-size="16" fill="#57534e" text-anchor="middle">共可+4分</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
