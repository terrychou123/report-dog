<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', sans-serif">
  <!-- @template: cover -->
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 右側裝飾區塊 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6dc"/>
  <!-- 右側大數字 3.8 + 3.9 -->
  <text x="1010" y="195" font-size="120" fill="#d97706" text-anchor="middle" font-weight="700" opacity="0.85">3.8</text>
  <text x="1010" y="230" font-size="36" fill="#57534e" text-anchor="middle">+</text>
  <text x="1010" y="340" font-size="120" fill="#78716c" text-anchor="middle" font-weight="700" opacity="0.75">3.9</text>
  <!-- 說明標籤 -->
  <rect x="856" y="378" width="166" height="44" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="939" y="405" font-size="18" fill="#d97706" text-anchor="middle" font-weight="700">緊急醫療感染</text>
  <rect x="1032" y="378" width="140" height="44" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="1102" y="405" font-size="18" fill="#78716c" text-anchor="middle" font-weight="700">緊急應變</text>
  <text x="1010" y="465" font-size="20" fill="#57534e" text-anchor="middle">日間型 3.8/3.9</text>
  <text x="1010" y="490" font-size="20" fill="#57534e" text-anchor="middle">住宿型 3.9/3.10</text>
  <!-- 左側主要內容 -->
  <!-- 類別標籤 -->
  <rect x="60" y="60" width="160" height="38" rx="19" fill="#ea580c" opacity="0.12"/>
  <text x="140" y="85" font-size="18" fill="#ea580c" text-anchor="middle" font-weight="700">服務品質</text>
  <!-- 主標題 -->
  <text x="60" y="185" font-size="80" fill="#1e293b" font-weight="700">緊急事件</text>
  <text x="60" y="278" font-size="80" fill="#d97706" font-weight="700">感染管控</text>
  <!-- 分隔線 -->
  <line x1="60" y1="306" x2="760" y2="306" stroke="#dedad3" stroke-width="2"/>
  <!-- 副標題 -->
  <text x="60" y="352" font-size="28" fill="#57534e">書面化流程、演練紀錄</text>
  <text x="60" y="392" font-size="26" fill="#57534e">事件處理完整性三大查核重點</text>
  <!-- 標籤 Pills -->
  <rect x="60" y="440" width="120" height="36" rx="18" fill="#d97706" opacity="0.12"/>
  <text x="120" y="463" font-size="16" fill="#d97706" text-anchor="middle" font-weight="600">緊急醫療</text>
  <rect x="194" y="440" width="120" height="36" rx="18" fill="#d97706" opacity="0.12"/>
  <text x="254" y="463" font-size="16" fill="#d97706" text-anchor="middle" font-weight="600">群聚感染</text>
  <rect x="328" y="440" width="120" height="36" rx="18" fill="#78716c" opacity="0.12"/>
  <text x="388" y="463" font-size="16" fill="#78716c" text-anchor="middle" font-weight="600">消防演練</text>
  <rect x="462" y="440" width="148" height="36" rx="18" fill="#78716c" opacity="0.12"/>
  <text x="536" y="463" font-size="16" fill="#78716c" text-anchor="middle" font-weight="600">115年度評鑑</text>
  <!-- 浮水印 -->
  <text x="1140" y="590" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
