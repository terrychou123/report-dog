<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 頂部標題區 -->
  <rect width="800" height="90" fill="#1e293b"/>
  <text x="400" y="42"  font-size="22" font-weight="700" fill="#fff" text-anchor="middle">醫療事故處理四步驟（1.7.2）</text>
  <text x="400" y="70"  font-size="14" fill="#a8a29e" text-anchor="middle">通報 - RCA - 改善 - 支持，完整閉環管理</text>

  <!-- 步驟連接線 -->
  <line x1="128" y1="148" x2="128" y2="458" stroke="#e8e6de" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- 步驟1：通報 -->
  <rect x="32" y="108" width="736" height="78" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <rect x="32" y="108" width="8" height="78" rx="4" fill="#d97706"/>
  <!-- 步驟標籤 -->
  <rect x="48" y="118" width="80" height="22" rx="4" fill="#d97706"/>
  <text x="88" y="132"  font-size="14" font-weight="700" fill="#fff" text-anchor="middle">STEP 01</text>
  <text x="144" y="132"  font-size="16" font-weight="700" fill="#1e293b">通報</text>
  <text x="48" y="160"  font-size="14" fill="#57534e">醫療事故發生後依規定向主管機關通報，院內啟動處理程序，保全相關文件</text>
  <!-- Pill -->
  <rect x="668" y="118" width="84" height="26" rx="13" fill="#d97706"/>
  <text x="710" y="135"  font-size="14" font-weight="600" fill="#fff" text-anchor="middle">24-72h</text>

  <!-- 步驟2：RCA分析 -->
  <rect x="32" y="198" width="736" height="78" rx="10" fill="#f0efe8" stroke="#78716c" stroke-width="1.5"/>
  <rect x="32" y="198" width="8" height="78" rx="4" fill="#78716c"/>
  <rect x="48" y="208" width="80" height="22" rx="4" fill="#78716c"/>
  <text x="88" y="222"  font-size="14" font-weight="700" fill="#fff" text-anchor="middle">STEP 02</text>
  <text x="144" y="222"  font-size="16" font-weight="700" fill="#1e293b">RCA分析</text>
  <text x="48" y="250"  font-size="14" fill="#57534e">組成跨部門RCA小組，找出系統性根本原因（非個人歸咎），45天內完成報告</text>
  <rect x="660" y="208" width="92" height="26" rx="13" fill="#78716c"/>
  <text x="706" y="225"  font-size="14" font-weight="600" fill="#fff" text-anchor="middle">45天內</text>

  <!-- 步驟3：改善追蹤 -->
  <rect x="32" y="288" width="736" height="78" rx="10" fill="#f0efe8" stroke="#57534e" stroke-width="1.5"/>
  <rect x="32" y="288" width="8" height="78" rx="4" fill="#57534e"/>
  <rect x="48" y="298" width="80" height="22" rx="4" fill="#57534e"/>
  <text x="88" y="312"  font-size="14" font-weight="700" fill="#fff" text-anchor="middle">STEP 03</text>
  <text x="144" y="312"  font-size="16" font-weight="700" fill="#1e293b">改善追蹤</text>
  <text x="48" y="340"  font-size="14" fill="#57534e">依根本原因訂定系統改善措施，設定改善期限，追蹤完成情況並評估效果</text>
  <rect x="660" y="298" width="92" height="26" rx="13" fill="#57534e"/>
  <text x="706" y="315"  font-size="14" font-weight="600" fill="#fff" text-anchor="middle">改善閉環</text>

  <!-- 步驟4：人員支持 -->
  <rect x="32" y="378" width="736" height="78" rx="10" fill="#f0efe8" stroke="#a8a29e" stroke-width="1.5"/>
  <rect x="32" y="378" width="8" height="78" rx="4" fill="#a8a29e"/>
  <rect x="48" y="388" width="80" height="22" rx="4" fill="#a8a29e"/>
  <text x="88" y="402"  font-size="14" font-weight="700" fill="#fff" text-anchor="middle">STEP 04</text>
  <text x="144" y="402"  font-size="16" font-weight="700" fill="#1e293b">人員支持</text>
  <text x="48" y="430"  font-size="14" fill="#57534e">相關醫護人員接受心理支持，避免Second Victim效應，有關懷機制</text>
  <rect x="660" y="388" width="92" height="26" rx="13" fill="#a8a29e"/>
  <text x="706" y="405"  font-size="14" font-weight="600" fill="#fff" text-anchor="middle">人員照顧</text>

  <!-- 浮水印 -->
  <text x="400" y="480"  font-size="14" fill="#a8a29e" text-anchor="middle" opacity="0.6">報告汪 reportwang.com</text>
</svg>
