<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- 背景 -->
  <rect width="800" height="500" fill="#fafaf9"/>

  <!-- 標題區塊 -->
  <rect x="0" y="0" width="800" height="100" fill="#1c1917"/>
  <text x="400" y="48"  font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle">人力配置自我查核四步驟</text>
  <text x="400" y="78"  font-size="14" fill="#a8a29e" text-anchor="middle">評鑑前 30 天確認合規，避免必要條文失分</text>

  <!-- 步驟1 -->
  <rect x="38" y="110" width="724" height="80" rx="9" fill="#fffbeb"/>
  <rect x="38" y="110" width="7" height="80" rx="4" fill="#d97706"/>
  <!-- 步驟編號圓圈 -->
  <circle cx="80" cy="150" r="20" fill="#d97706" opacity="0.15"/>
  <text x="80" y="156"  font-size="14" font-weight="900" fill="#d97706" text-anchor="middle">01</text>
  <text x="112" y="138"  font-size="14" font-weight="800" fill="#d97706">STEP 01 盤點所有人員執照</text>
  <text x="112" y="158"  font-size="14" fill="#57534e">列清冊，確認所有醫師、護理及醫事人員效期，過期立即辦理換照</text>
  <text x="112" y="178"  font-size="14" fill="#a8a29e">產出物：人員執照清冊（含效期欄位）</text>
  <rect x="622" y="128" width="122" height="32" rx="16" fill="#d97706"/>
  <text x="683" y="149"  font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle">第 1 週</text>

  <!-- 步驟2 -->
  <rect x="38" y="200" width="724" height="80" rx="9" fill="#fafaf9" stroke="#e7e5e4" stroke-width="1"/>
  <rect x="38" y="200" width="7" height="80" rx="4" fill="#78716c"/>
  <circle cx="80" cy="240" r="20" fill="#78716c" opacity="0.15"/>
  <text x="80" y="246"  font-size="14" font-weight="900" fill="#78716c" text-anchor="middle">02</text>
  <text x="112" y="228"  font-size="14" font-weight="800" fill="#78716c">STEP 02 計算各科護病比</text>
  <text x="112" y="248"  font-size="14" fill="#57534e">依班次計算（白班/小夜班/大夜班），確認每班紀錄清楚可供查核</text>
  <text x="112" y="268"  font-size="14" fill="#a8a29e">產出物：各病房各班次護病比計算表</text>
  <rect x="622" y="218" width="122" height="32" rx="16" fill="#78716c"/>
  <text x="683" y="239"  font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle">第 2 週</text>

  <!-- 步驟3 -->
  <rect x="38" y="290" width="724" height="80" rx="9" fill="#fafaf9" stroke="#e7e5e4" stroke-width="1"/>
  <rect x="38" y="290" width="7" height="80" rx="4" fill="#57534e"/>
  <circle cx="80" cy="330" r="20" fill="#57534e" opacity="0.15"/>
  <text x="80" y="336"  font-size="14" font-weight="900" fill="#57534e" text-anchor="middle">03</text>
  <text x="112" y="318"  font-size="14" font-weight="800" fill="#57534e">STEP 03 查核值班排班紀錄</text>
  <text x="112" y="338"  font-size="14" fill="#57534e">確認夜班配置符合規定，緊急補足機制書面化並有啟動案例紀錄</text>
  <text x="112" y="358"  font-size="14" fill="#a8a29e">產出物：值班排班表、緊急補足機制書面規定</text>
  <rect x="622" y="308" width="122" height="32" rx="16" fill="#57534e"/>
  <text x="683" y="329"  font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle">第 3 週</text>

  <!-- 步驟4 -->
  <rect x="38" y="380" width="724" height="80" rx="9" fill="#fafaf9" stroke="#e7e5e4" stroke-width="1"/>
  <rect x="38" y="380" width="7" height="80" rx="4" fill="#a8a29e"/>
  <circle cx="80" cy="420" r="20" fill="#a8a29e" opacity="0.15"/>
  <text x="80" y="426"  font-size="14" font-weight="900" fill="#a8a29e" text-anchor="middle">04</text>
  <text x="112" y="408"  font-size="14" font-weight="800" fill="#a8a29e">STEP 04 AI 模擬查核</text>
  <text x="112" y="428"  font-size="14" fill="#57534e">使用 AI 工具上傳人力資料，快速發現執照過期、人力比例缺口</text>
  <text x="112" y="448"  font-size="14" fill="#a8a29e">工具：報告汪 AI 自我查核功能，產出缺失清單</text>
  <rect x="606" y="398" width="138" height="32" rx="16" fill="#a8a29e"/>
  <text x="675" y="419"  font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle">評鑑前 1 週</text>

  <!-- 浮水印 -->
  <text x="400" y="480"  font-size="14" fill="#a8a29e" text-anchor="middle">報告汪 reportwang.com</text>
</svg>
