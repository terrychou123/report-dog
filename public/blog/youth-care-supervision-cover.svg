<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      text { font-family: 'Noto Sans TC', sans-serif; }
    </style>
  </defs>
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 右側面板 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>
  <!-- 右側大數字 -->
  <text x="1010" y="400" font-size="280" font-weight="900" fill="#d97706" opacity="0.18" text-anchor="middle">2</text>
  <text x="1010" y="560" font-size="36" font-weight="700" fill="#78716c" text-anchor="middle">項目 28</text>
  <text x="1010" y="600" font-size="22" font-weight="400" fill="#a8a29e" text-anchor="middle">專業成長</text>
  <!-- 左側主標題區 -->
  <text x="72" y="148" font-size="52" font-weight="900" fill="#1e293b">督導紀錄</text>
  <text x="72" y="218" font-size="52" font-weight="900" fill="#1e293b">與個案研討會</text>
  <text x="72" y="300" font-size="30" font-weight="600" fill="#d97706">評鑑項目 28 的準備攻略</text>
  <!-- 分隔線 -->
  <rect x="72" y="328" width="80" height="4" rx="2" fill="#d97706"/>
  <!-- 副說明文字 -->
  <text x="72" y="376" font-size="22" fill="#57534e">個案研討會 1分 ＋ 督導制度 1分</text>
  <text x="72" y="412" font-size="22" fill="#57534e">出席名單、討論摘要、督導意見、落實證明</text>
  <!-- 標籤 -->
  <rect x="72" y="460" width="148" height="44" rx="22" fill="#d97706"/>
  <text x="146" y="488" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">112年度評鑑</text>
  <rect x="234" y="460" width="168" height="44" rx="22" fill="#78716c"/>
  <text x="318" y="488" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">兒少安置機構</text>
  <!-- 浮水印 -->
  <text x="1140" y="600" font-size="24" fill="#c4bfb8" text-anchor="end">reportwang.com</text>
</svg>
