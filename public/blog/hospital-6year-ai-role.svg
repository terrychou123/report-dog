<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 (Header y=29, h=90, rows y=166/269/372) -->
  <rect x="0" y="0" width="800" height="110" fill="#f5f5f4"/>
  <text x="400" y="52" text-anchor="middle" font-size="26" font-weight="900" fill="#1e293b">AI工具在6年品管週期中的三大角色</text>
  <text x="400" y="84" text-anchor="middle" font-size="15" fill="#78716c">從指標分析到文書生成——AI全程輔助持續品管</text>

  <!-- 列1：品質指標自動分析 y=166, H=90 -->
  <rect x="38" y="122" width="724" height="90" rx="12" fill="#ffffff" stroke="#e8e6de" stroke-width="1.5"/>
  <rect x="38" y="122" width="10" height="90" rx="5" fill="#d97706"/>
  <text x="68" y="158" font-size="17" font-weight="700" fill="#d97706">品質指標自動分析</text>
  <text x="68" y="182" font-size="15" fill="#1e293b">AI自動彙整各月品質指標數據，生成趨勢圖、達標率報告、異常警示</text>
  <text x="68" y="202" font-size="14" fill="#78716c">品管人員聚焦在改善決策，而非繁瑣的數據整理</text>
  <rect x="634" y="142" width="92" height="30" rx="15" fill="#fef3c7"/>
  <text x="680" y="162" text-anchor="middle" font-size="14" fill="#d97706" font-weight="700">智慧分析</text>

  <!-- 列2：AI自我查核缺口識別 y=269, H=90 -->
  <rect x="38" y="225" width="724" height="90" rx="12" fill="#ffffff" stroke="#e8e6de" stroke-width="1.5"/>
  <rect x="38" y="225" width="10" height="90" rx="5" fill="#78716c"/>
  <text x="68" y="261" font-size="17" font-weight="700" fill="#78716c">AI自我查核缺口識別</text>
  <text x="68" y="285" font-size="15" fill="#1e293b">定期以AI對照評鑑基準進行自我查核，識別文書缺漏或不符合項目</text>
  <text x="68" y="305" font-size="14" fill="#78716c">在評鑑前主動改善，而非等委員來才發現問題</text>
  <rect x="634" y="245" width="92" height="30" rx="15" fill="#f5f5f4"/>
  <text x="680" y="265" text-anchor="middle" font-size="14" fill="#78716c" font-weight="700">主動查核</text>

  <!-- 列3：改善計畫文書自動生成 y=372, H=90 -->
  <rect x="38" y="328" width="724" height="90" rx="12" fill="#ffffff" stroke="#e8e6de" stroke-width="1.5"/>
  <rect x="38" y="328" width="10" height="90" rx="5" fill="#57534e"/>
  <text x="68" y="364" font-size="17" font-weight="700" fill="#57534e">改善計畫文書自動生成</text>
  <text x="68" y="388" font-size="15" fill="#1e293b">AI協助撰寫品質改善計畫初稿（PDCA格式），確保格式符合評鑑要求</text>
  <text x="68" y="408" font-size="14" fill="#78716c">節省品管人員文書時間，讓人力投入真正的改善工作</text>
  <rect x="634" y="348" width="92" height="30" rx="15" fill="#f5f5f4"/>
  <text x="680" y="368" text-anchor="middle" font-size="14" fill="#57534e" font-weight="700">文書生成</text>

  <!-- 浮水印 -->
  <text x="400" y="480" text-anchor="middle" font-size="14" fill="#a8a29e" opacity="0.6">報告汪 reportwang.com</text>
</svg>
