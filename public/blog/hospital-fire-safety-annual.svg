<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- 背景 -->
  <rect width="800" height="500" fill="#fafaf9"/>

  <!-- 頂部標題區塊 -->
  <rect x="0" y="0" width="800" height="108" rx="0" fill="#1c1917"/>
  <text x="400" y="52"  font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">消防安全全年追蹤管理曆</text>
  <text x="400" y="82"  font-size="14" fill="#a8a29e" text-anchor="middle">四季分工，確保設備維護與演練全年不漏接</text>

  <!-- 列 1 (y=128, H=78)：第一季 -->
  <rect x="38" y="128" width="724" height="78" rx="10" fill="#fffbeb"/>
  <rect x="38" y="128" width="6" height="78" rx="2" fill="#d97706"/>
  <circle cx="80" cy="167" r="22" fill="#d97706" opacity="0.15"/>
  <text x="80" y="162"  font-size="14" font-weight="700" fill="#d97706" text-anchor="middle">第一季</text>
  <text x="80" y="175"  font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1-3月</text>
  <text x="118" y="151"  font-size="15" font-weight="700" fill="#78350f">第一季（1–3月）</text>
  <text x="118" y="172"  font-size="14" fill="#78716c">年度消防計畫訂定、消防設備年度申報、辦理日間疏散演練（第1次）</text>
  <rect x="618" y="143" width="120" height="26" rx="13" fill="#d97706"/>
  <text x="678" y="161"  font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">年度啟動</text>
  <text x="118" y="195"  font-size="14" fill="#a8a29e">依消防法規委由消防安全設備師辦理年度申報，完成第一次日間演練並存檔紀錄</text>

  <!-- 列 2 (y=224, H=78)：第二季 -->
  <rect x="38" y="224" width="724" height="78" rx="10" fill="#f5f5f4"/>
  <rect x="38" y="224" width="6" height="78" rx="2" fill="#78716c"/>
  <circle cx="80" cy="263" r="22" fill="#78716c" opacity="0.15"/>
  <text x="80" y="258"  font-size="14" font-weight="700" fill="#78716c" text-anchor="middle">第二季</text>
  <text x="80" y="271"  font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4-6月</text>
  <text x="118" y="247"  font-size="15" font-weight="700" fill="#44403c">第二季（4–6月）</text>
  <text x="118" y="268"  font-size="14" fill="#78716c">消防設備半年定期檢查、緊急廣播系統測試、演練缺失改善追蹤</text>
  <rect x="618" y="239" width="120" height="26" rx="13" fill="#78716c"/>
  <text x="678" y="257"  font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">半年維護</text>
  <text x="118" y="291"  font-size="14" fill="#a8a29e">偵測器、灑水系統半年檢查，廣播覆蓋測試，確認第一次演練改善事項已完成</text>

  <!-- 列 3 (y=320, H=78)：第三季 -->
  <rect x="38" y="320" width="724" height="78" rx="10" fill="#f5f5f4"/>
  <rect x="38" y="320" width="6" height="78" rx="2" fill="#57534e"/>
  <circle cx="80" cy="359" r="22" fill="#57534e" opacity="0.15"/>
  <text x="80" y="354"  font-size="14" font-weight="700" fill="#57534e" text-anchor="middle">第三季</text>
  <text x="80" y="367"  font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">7-9月</text>
  <text x="118" y="343"  font-size="15" font-weight="700" fill="#44403c">第三季（7–9月）</text>
  <text x="118" y="364"  font-size="14" fill="#78716c">消防逃生路線走查、員工消防教育訓練（含新進人員）</text>
  <rect x="618" y="335" width="120" height="26" rx="13" fill="#57534e"/>
  <text x="678" y="353"  font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">教育訓練</text>
  <text x="118" y="387"  font-size="14" fill="#a8a29e">全院逃生通道走查確認無堆積雜物，全體員工（含新進）完成消防訓練並存紀錄</text>

  <!-- 列 4 (y=416, H=62)：第四季 -->
  <rect x="38" y="408" width="724" height="70" rx="10" fill="#fff1f2"/>
  <rect x="38" y="408" width="6" height="70" rx="3" fill="#dc2626"/>
  <circle cx="80" cy="443" r="22" fill="#dc2626"/>
  <text x="80" y="438"  font-size="14" font-weight="700" fill="#dc2626" text-anchor="middle">第四季</text>
  <text x="80" y="451"  font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">10-12月</text>
  <text x="118" y="430"  font-size="15" font-weight="700" fill="#7f1d1d">第四季（10–12月）</text>
  <text x="118" y="451"  font-size="14" fill="#78716c">辦理夜間疏散演練（第2次）、年度總檢討、次年計畫規劃</text>
  <rect x="618" y="421" width="120" height="26" rx="13" fill="#dc2626"/>
  <text x="678" y="439"  font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">夜間演練</text>
  <text x="118" y="468"  font-size="14" fill="#a8a29e">完成年度最重要的夜間演練，整理全年紀錄備查，規劃次年消防計畫</text>

  <!-- 浮水印 -->
  <text x="400" y="492"  font-size="14" fill="#a8a29e" text-anchor="middle" opacity="0.7">報告汪 reportwang.com</text>
</svg>
