<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="'Noto Sans TC', sans-serif">
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#fafaf8"/>

  <!-- 左側主要內容區 -->
  <!-- 頂部標籤列 -->
  <rect x="60" y="60" width="110" height="32" rx="16" fill="#dcfce7"/>
  <text x="115" y="81" text-anchor="middle" font-size="14" fill="#16a34a" font-weight="700">醫院評鑑</text>

  <rect x="182" y="60" width="90" height="32" rx="16" fill="#fef9c3"/>
  <text x="227" y="81" text-anchor="middle" font-size="14" fill="#d97706" font-weight="700">1.3章</text>

  <!-- 主標題 -->
  <text x="60" y="158" font-size="52" font-weight="900" fill="#1e293b" letter-spacing="-1">醫院教育訓練</text>
  <text x="60" y="222" font-size="52" font-weight="900" fill="#16a34a" letter-spacing="-1">三軌評鑑攻略</text>

  <!-- 副標題 -->
  <text x="60" y="272" font-size="20" fill="#57534e" font-weight="500">1.3.5職前訓練 × 1.3.6在職教育 × 繼續教育學分</text>

  <!-- 分隔線 -->
  <line x1="60" y1="300" x2="460" y2="300" stroke="#e8e6de" stroke-width="2"/>

  <!-- 特色標籤群組 -->
  <rect x="60" y="320" width="88" height="34" rx="8" fill="#f0fdf4"/>
  <text x="104" y="342" text-anchor="middle" font-size="14" fill="#16a34a" font-weight="600">職前訓練</text>

  <rect x="158" y="320" width="88" height="34" rx="8" fill="#fef3c7"/>
  <text x="202" y="342" text-anchor="middle" font-size="14" fill="#d97706" font-weight="600">在職教育</text>

  <rect x="256" y="320" width="88" height="34" rx="8" fill="#f0fdf4"/>
  <text x="300" y="342" text-anchor="middle" font-size="14" fill="#16a34a" font-weight="600">繼續教育</text>

  <rect x="60" y="364" width="88" height="34" rx="8" fill="#f5f5f4"/>
  <text x="104" y="386" text-anchor="middle" font-size="14" fill="#57534e" font-weight="600">志工管理</text>

  <rect x="158" y="364" width="88" height="34" rx="8" fill="#f0fdf4"/>
  <text x="202" y="386" text-anchor="middle" font-size="14" fill="#16a34a" font-weight="600">定期追蹤</text>

  <!-- 底部說明 -->
  <text x="60" y="450" font-size="16" fill="#a8a29e">評鑑委員最常查的文書類型</text>
  <text x="60" y="474" font-size="16" fill="#a8a29e">資料查核，紀錄完整才能通關</text>

  <!-- 右側裝飾區塊 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de" rx="0"/>

  <!-- 右側大數字 -->
  <text x="1010" y="200" text-anchor="middle" font-size="160" font-weight="900" fill="#16a34a" opacity="0.15">3</text>
  <text x="1010" y="190" text-anchor="middle" font-size="130" font-weight="900" fill="#16a34a">3</text>

  <!-- 右側說明文字 -->
  <text x="1010" y="240" text-anchor="middle" font-size="16" fill="#57534e" font-weight="600">職前訓練軌 × 在職訓練軌 × 繼續教育軌</text>

  <!-- 右側三個條文卡片 -->
  <!-- 卡片1 -->
  <rect x="848" y="270" width="304" height="78" rx="10" fill="#ffffff"/>
  <rect x="848" y="270" width="8" height="78" rx="4" fill="#16a34a"/>
  <text x="872" y="300" font-size="16" font-weight="700" fill="#1e293b">1.3.5 新進職前訓練</text>
  <rect x="872" y="308" width="56" height="22" rx="11" fill="#dcfce7"/>
  <text x="900" y="330" text-anchor="middle" font-size="14" fill="#16a34a" font-weight="700">重點條文</text>
  <text x="936" y="324" font-size="14" fill="#78716c">資料查核</text>

  <!-- 卡片2 -->
  <rect x="848" y="360" width="304" height="78" rx="10" fill="#ffffff"/>
  <rect x="848" y="360" width="8" height="78" rx="4" fill="#16a34a"/>
  <text x="872" y="390" font-size="16" font-weight="700" fill="#1e293b">1.3.6 在職教育訓練</text>
  <rect x="872" y="398" width="56" height="22" rx="11" fill="#dcfce7"/>
  <text x="900" y="420" text-anchor="middle" font-size="14" fill="#16a34a" font-weight="700">重點條文</text>
  <text x="936" y="414" font-size="14" fill="#78716c">資料查核</text>

  <!-- 卡片3 -->
  <rect x="848" y="450" width="304" height="78" rx="10" fill="#ffffff"/>
  <rect x="848" y="450" width="8" height="78" rx="4" fill="#78716c"/>
  <text x="872" y="480" font-size="16" font-weight="700" fill="#1e293b">1.3.7-1.3.8 繼續教育</text>
  <rect x="872" y="488" width="56" height="22" rx="11" fill="#f5f5f4"/>
  <text x="900" y="510" text-anchor="middle" font-size="14" fill="#78716c" font-weight="700">一般條文</text>
  <text x="936" y="504" font-size="14" fill="#78716c">資料查核</text>

  <!-- 浮水印 -->
  <text x="600" y="612" text-anchor="middle" font-size="14" fill="#a8a29e" opacity="0.6">報告汪 reportwang.com</text>
</svg>
