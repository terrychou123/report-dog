<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">C 區塊安全環境設備核心要求</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">16 項指標（含 6 個一級必要、3 個二級加強）</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- 上排 2×2 y=104 h=168 -->
  <!-- 卡片1 x=40 w=346 -->
  <rect x="40" y="104" width="346" height="168" rx="12" fill="white"/>
  <rect x="40" y="104" width="346" height="44" rx="12" fill="#d97706"/>
  <rect x="40" y="128" width="346" height="20" fill="#d97706"/>
  <text x="213" y="133" text-anchor="middle" font-size="15" fill="white" font-weight="700">環境設施（C1–C3、C13）</text>
  <text x="60" y="170" font-size="14" fill="#57534e">- 採光通風：自然或機械通風設備完善</text>
  <text x="60" y="190" font-size="14" fill="#57534e">- 活動空間：各樓層設置，每週清潔消毒</text>
  <text x="60" y="210" font-size="14" fill="#57534e">- 隔離空間：獨立空調、衛浴及緊急呼叫</text>
  <rect x="56" y="248" width="80" height="20" rx="10" fill="#fef3c7"/>
  <text x="96" y="262" text-anchor="middle" font-size="14" fill="#d97706" font-weight="600">環境基礎</text>

  <!-- 卡片2 x=414 w=346 -->
  <rect x="414" y="104" width="346" height="168" rx="12" fill="white"/>
  <rect x="414" y="104" width="346" height="44" rx="12" fill="#78716c"/>
  <rect x="414" y="128" width="346" height="20" fill="#78716c"/>
  <text x="587" y="133" text-anchor="middle" font-size="15" fill="white" font-weight="700">安全設備（C4–C8）</text>
  <text x="434" y="170" font-size="14" fill="#57534e">- C4 緊急呼叫：浴廁寢室均設（一級必要）</text>
  <text x="434" y="190" font-size="14" fill="#57534e">- C5 電梯：門寬≥90cm深≥135cm（二級）</text>
  <text x="434" y="210" font-size="14" fill="#57534e">- C6 無障礙浴廁：扶手迴轉空間（二級）</text>
  <rect x="430" y="248" width="110" height="20" rx="10" fill="#f5f5f4"/>
  <text x="485" y="262" text-anchor="middle" font-size="14" fill="#78716c" font-weight="600">含一級 + 二級</text>

  <!-- 下排 2×2 y=288 h=162 -->
  <!-- 卡片3 x=40 w=346 -->
  <rect x="40" y="288" width="346" height="162" rx="12" fill="white"/>
  <rect x="40" y="288" width="346" height="44" rx="12" fill="#57534e"/>
  <rect x="40" y="312" width="346" height="20" fill="#57534e"/>
  <text x="213" y="317" text-anchor="middle" font-size="15" fill="white" font-weight="700">消防疏散（C9–C12）</text>
  <text x="60" y="354" font-size="14" fill="#57534e">- C9 消防安全：每半年委設備師檢修（一級）</text>
  <text x="60" y="374" font-size="14" fill="#57534e">- C10 疏散避難：雙向路徑，防火門（一級）</text>
  <text x="60" y="394" font-size="14" fill="#57534e">- C11 EOP：每年 2 次演練含夜間（一級）</text>
  <rect x="56" y="420" width="110" height="20" rx="10" fill="#f5f0eb"/>
  <text x="111" y="434" text-anchor="middle" font-size="14" fill="#57534e" font-weight="600">C12 各層 A3 避難圖</text>

  <!-- 卡片4 x=414 w=346 -->
  <rect x="414" y="288" width="346" height="162" rx="12" fill="white"/>
  <rect x="414" y="288" width="346" height="44" rx="12" fill="#a8a29e"/>
  <rect x="414" y="312" width="346" height="20" fill="#a8a29e"/>
  <text x="587" y="317" text-anchor="middle" font-size="15" fill="white" font-weight="700">服務設施（C14–C16）</text>
  <text x="434" y="354" font-size="14" fill="#57534e">- C14 設備維護：定期保養記錄</text>
  <text x="434" y="374" font-size="14" fill="#57534e">- C15 護理站：急救設備每層設置（一級）</text>
  <text x="434" y="394" font-size="14" fill="#57534e">- C16 飲用水：每 3 月大腸桿菌群檢測（二級）</text>
  <rect x="430" y="420" width="110" height="20" rx="10" fill="#f5f5f4"/>
  <text x="485" y="434" text-anchor="middle" font-size="14" fill="#a8a29e" font-weight="600">含一級 + 二級</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
