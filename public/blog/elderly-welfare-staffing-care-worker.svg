<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區塊 -->
  <rect x="0" y="0" width="800" height="76" fill="#1e293b"/>
  <text x="400" y="29" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle" font-weight="400">A11 照顧服務員設置情形</text>
  <text x="400" y="57" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-size="22" fill="white" text-anchor="middle" font-weight="700">照服員與外籍看護工比例管理</text>

  <!-- N=4 版型: H=62, outer_gap=50, Row y: 100/175/250/325 -->

  <!-- Row 1: 人數達法定標準 -->
  <rect x="50" y="100" width="700" height="62" rx="8" fill="white"/>
  <rect x="50" y="100" width="6" height="62" rx="3" fill="#d97706"/>
  <circle cx="87" cy="131" r="16" fill="#d97706"/>
  <text x="87" y="137" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="700">1</text>
  <text x="118" y="125" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-size="20" fill="#1e293b" font-weight="700">照服員人數達法定標準（近 5 年）</text>
  <text x="118" y="148" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-size="16" fill="#57534e">依設置標準按住民人數比例設置；評鑑檢視近 5 年配置狀況</text>
  <rect x="556" y="108" width="136" height="46" rx="6" fill="#fef3c7"/>
  <text x="624" y="127" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-size="14" fill="#92400e" text-anchor="middle" font-weight="600">依人數</text>
  <text x="624" y="145" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-size="14" fill="#92400e" text-anchor="middle">比例配置</text>

  <!-- Row 2: 外籍比例不超1/2 -->
  <rect x="50" y="175" width="700" height="62" rx="8" fill="white"/>
  <rect x="50" y="175" width="6" height="62" rx="3" fill="#78716c"/>
  <circle cx="87" cy="206" r="16" fill="#78716c"/>
  <text x="87" y="212" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="700">2</text>
  <text x="118" y="200" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-size="20" fill="#1e293b" font-weight="700">外籍看護工不超全數照服員 1/2</text>
  <text x="118" y="223" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-size="16" fill="#57534e">範例：10人中外籍4人（40%）合規；外籍6人（60%）超標</text>
  <rect x="556" y="183" width="136" height="46" rx="6" fill="#fef2f2"/>
  <text x="624" y="202" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="700">≤ 50%</text>
  <text x="624" y="220" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-size="14" fill="#dc2626" text-anchor="middle">人員異動即算</text>

  <!-- Row 3: 隨時有本國籍在班 -->
  <rect x="50" y="250" width="700" height="62" rx="8" fill="white"/>
  <rect x="50" y="250" width="6" height="62" rx="3" fill="#57534e"/>
  <circle cx="87" cy="281" r="16" fill="#57534e"/>
  <text x="87" y="287" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="700">3</text>
  <text x="118" y="275" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-size="20" fill="#1e293b" font-weight="700">隨時保持至少 1 名本國籍照服員上班</text>
  <text x="118" y="298" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-size="16" fill="#57534e">任何班別不得僅有外籍看護工值班；排班表需標示國籍</text>
  <rect x="556" y="258" width="136" height="46" rx="6" fill="#fef2f2"/>
  <text x="624" y="277" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="600">每班必備</text>
  <text x="624" y="295" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-size="14" fill="#dc2626" text-anchor="middle">本國籍1人</text>

  <!-- Row 4: A12 勞動條件 -->
  <rect x="50" y="325" width="700" height="62" rx="8" fill="white"/>
  <rect x="50" y="325" width="6" height="62" rx="3" fill="#a8a29e"/>
  <circle cx="87" cy="356" r="16" fill="#a8a29e"/>
  <text x="87" y="362" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="700">A12</text>
  <text x="118" y="350" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-size="20" fill="#1e293b" font-weight="700">勞動條件（A12）— 近 4 年無違規處罰</text>
  <text x="118" y="373" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-size="16" fill="#57534e">無違反勞基法、性別工作平等法、勞退條例處罰；由主管機關提供</text>
  <rect x="556" y="333" width="136" height="46" rx="6" fill="#f5f5f4"/>
  <text x="624" y="352" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-size="14" fill="#57534e" text-anchor="middle" font-weight="600">近4年</text>
  <text x="624" y="370" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-size="14" fill="#57534e" text-anchor="middle">無處罰紀錄</text>

  <!-- 比例說明框 -->
  <rect x="50" y="404" width="700" height="52" rx="8" fill="#fef3c7" opacity="0.9"/>
  <text x="400" y="425" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-size="16" fill="#92400e" text-anchor="middle" font-weight="700">比例計算提醒：每次人員異動後須立即重新計算外籍照服員比例</text>
  <text x="400" y="446" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-size="15" fill="#92400e" text-anchor="middle">本國籍照服員離職時，若外籍比例超標需立即補充本國籍人員</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">報告汪 reportwang.com</text>
</svg>
