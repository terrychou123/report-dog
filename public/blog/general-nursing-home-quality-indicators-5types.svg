<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- Header -->
  <rect x="0" y="29" width="800" height="62" fill="white"/>
  <rect x="0" y="29" width="6" height="62" fill="#d97706" rx="2"/>
  <text x="28" y="67" font-size="32" fill="#1e293b" font-weight="700">護理之家 5 大品質指標</text>
  <text x="28" y="85" font-size="16" fill="#57534e">B3 評鑑基準必追指標：計算公式與業界參考值</text>

  <!-- Row 1：跌倒發生率 -->
  <rect x="28" y="103" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="103" width="6" height="62" rx="2" fill="#d97706"/>
  <circle cx="66" cy="134" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="140" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <text x="100" y="129" font-size="20" fill="#1e293b" font-weight="700">跌倒發生率</text>
  <text x="100" y="153" font-size="16" fill="#57534e">件數 ÷ 住民人日數 × 1000（單位：件/千人日）</text>
  <rect x="580" y="111" width="180" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="670" y="129" font-size="16" fill="#d97706" text-anchor="middle">參考值</text>
  <text x="670" y="149" font-size="16" fill="#d97706" text-anchor="middle">2–8 件/千人日</text>

  <!-- Row 2：壓傷發生率 -->
  <rect x="28" y="177" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="177" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="66" cy="208" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="214" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <text x="100" y="203" font-size="20" fill="#1e293b" font-weight="700">院內壓傷發生率</text>
  <text x="100" y="227" font-size="16" fill="#57534e">院內新發生壓傷數 ÷ 有壓傷風險住民數 × 100%</text>
  <rect x="580" y="185" width="180" height="46" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="670" y="203" font-size="16" fill="#78716c" text-anchor="middle">目標值</text>
  <text x="670" y="223" font-size="16" fill="#78716c" text-anchor="middle">1% 以下</text>

  <!-- Row 3：導管感染率 -->
  <rect x="28" y="251" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="251" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="66" cy="282" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="288" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <text x="100" y="277" font-size="20" fill="#1e293b" font-weight="700">導管相關感染率（CAUTI）</text>
  <text x="100" y="301" font-size="16" fill="#57534e">CAUTI 件數 ÷ 導尿管留置人日數 × 1000（件/千導管日）</text>
  <rect x="580" y="259" width="180" height="46" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="670" y="277" font-size="16" fill="#57534e" text-anchor="middle">無導管者</text>
  <text x="670" y="297" font-size="16" fill="#57534e" text-anchor="middle">標注不適用</text>

  <!-- Row 4：約束使用率 -->
  <rect x="28" y="325" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="325" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="356" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="362" font-size="16" fill="#a8a29e" text-anchor="middle" font-weight="900">4</text>
  <text x="100" y="351" font-size="20" fill="#1e293b" font-weight="700">約束使用率</text>
  <text x="100" y="375" font-size="16" fill="#57534e">使用約束具住民數 ÷ 全體在住住民數 × 100%</text>
  <rect x="580" y="333" width="180" height="46" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="670" y="351" font-size="16" fill="#1e293b" text-anchor="middle">需附知情</text>
  <text x="670" y="371" font-size="16" fill="#1e293b" text-anchor="middle">同意書</text>

  <!-- Row 5：非計畫性住院率 -->
  <rect x="28" y="399" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="399" width="6" height="62" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="430" r="16" fill="#94a3b8" opacity="0.15"/>
  <text x="66" y="436" font-size="16" fill="#94a3b8" text-anchor="middle" font-weight="900">5</text>
  <text x="100" y="425" font-size="20" fill="#1e293b" font-weight="700">非計畫性住院率</text>
  <text x="100" y="449" font-size="16" fill="#57534e">非計畫性住院人次 ÷ 全體在住住民數 × 100%</text>
  <rect x="580" y="407" width="180" height="46" rx="8" fill="#94a3b8" opacity="0.12"/>
  <text x="670" y="425" font-size="16" fill="#94a3b8" text-anchor="middle">含急診</text>
  <text x="670" y="445" font-size="16" fill="#94a3b8" text-anchor="middle">非例行住院</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
