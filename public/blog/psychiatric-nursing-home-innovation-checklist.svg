<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 主標題 -->
  <text x="40" y="48" font-size="32" fill="#1e293b"  font-weight="bold">創新措施自評清單</text>
  <!-- 副標題 -->
  <text x="40" y="78" font-size="22" fill="#78716c" >評鑑前確認E1.1的四項子要求均已達標</text>
  <!-- 分隔線 -->
  <line x1="40" y1="94" x2="760" y2="94" stroke="#dedad3" stroke-width="2"/>

  <!-- 左欄標題 -->
  <rect x="40" y="114" width="340" height="44" rx="8" fill="#d97706"/>
  <text x="210" y="141" font-size="20" fill="white" text-anchor="middle"  font-weight="bold">計畫執行</text>

  <!-- 右欄標題 -->
  <rect x="420" y="114" width="340" height="44" rx="8" fill="#78716c"/>
  <text x="590" y="141" font-size="20" fill="white" text-anchor="middle"  font-weight="bold">成效分享</text>

  <!-- 左欄項目1 -->
  <rect x="40" y="172" width="340" height="52" rx="6" fill="white" opacity="0.8"/>
  <circle cx="72" cy="198" r="14" fill="#d97706" opacity="0.15"/>
  <text x="72" y="204" font-size="16" fill="white" text-anchor="middle"  font-weight="bold">✓</text>
  <text x="98" y="193" font-size="16" fill="#1e293b"  font-weight="bold">確認</text>
  <text x="98" y="215" font-size="15" fill="#57534e" >有創新措施書面計畫</text>

  <!-- 左欄項目2 -->
  <rect x="40" y="234" width="340" height="52" rx="6" fill="white" opacity="0.8"/>
  <circle cx="72" cy="260" r="14" fill="#d97706" opacity="0.15"/>
  <text x="72" y="266" font-size="16" fill="white" text-anchor="middle"  font-weight="bold">✓</text>
  <text x="98" y="255" font-size="16" fill="#1e293b"  font-weight="bold">確認</text>
  <text x="98" y="277" font-size="15" fill="#57534e" >有執行紀錄</text>

  <!-- 左欄項目3 -->
  <rect x="40" y="296" width="340" height="52" rx="6" fill="white" opacity="0.8"/>
  <circle cx="72" cy="322" r="14" fill="#a8a29e" opacity="0.15"/>
  <text x="72" y="328" font-size="16" fill="white" text-anchor="middle" >?</text>
  <text x="98" y="317" font-size="16" fill="#78716c"  font-weight="bold">待確認</text>
  <text x="98" y="339" font-size="15" fill="#57534e" >計畫具體可行性說明</text>

  <!-- 右欄項目1 -->
  <rect x="420" y="172" width="340" height="52" rx="6" fill="white" opacity="0.8"/>
  <circle cx="452" cy="198" r="14" fill="#78716c" opacity="0.15"/>
  <text x="452" y="204" font-size="16" fill="white" text-anchor="middle"  font-weight="bold">✓</text>
  <text x="478" y="193" font-size="16" fill="#1e293b"  font-weight="bold">確認</text>
  <text x="478" y="215" font-size="15" fill="#57534e" >有成效佐證資料</text>

  <!-- 右欄項目2 -->
  <rect x="420" y="234" width="340" height="52" rx="6" fill="white" opacity="0.8"/>
  <circle cx="452" cy="260" r="14" fill="#78716c" opacity="0.15"/>
  <text x="452" y="266" font-size="16" fill="white" text-anchor="middle"  font-weight="bold">✓</text>
  <text x="478" y="255" font-size="16" fill="#1e293b"  font-weight="bold">確認</text>
  <text x="478" y="277" font-size="15" fill="#57534e" >有公開分享紀錄</text>

  <!-- 右欄項目3 -->
  <rect x="420" y="296" width="340" height="52" rx="6" fill="white" opacity="0.8"/>
  <circle cx="452" cy="322" r="14" fill="#a8a29e" opacity="0.15"/>
  <text x="452" y="328" font-size="16" fill="white" text-anchor="middle" >?</text>
  <text x="478" y="317" font-size="16" fill="#78716c"  font-weight="bold">待確認</text>
  <text x="478" y="339" font-size="15" fill="#57534e" >評鑑委員訪談負責人準備</text>

  <!-- 底部提示 -->
  <rect x="40" y="370" width="720" height="50" rx="8" fill="#d97706" opacity="0.15"/>
  <text x="400" y="400" font-size="17" fill="#78716c" text-anchor="middle" >E1.1為加分項，完整的四個子要求全達標可獲最高加分</text>

  <!-- 品牌浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" >報告汪 reportwang.com</text>
</svg>
