<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- Header -->
  <rect x="0" y="29" width="800" height="60" fill="#e8e6de"/>
  <rect x="0" y="29" width="6" height="60" rx="2" fill="#d97706"/>
  <text x="28" y="74" font-size="28" fill="#1e293b" font-weight="700">115年度居家護理所評鑑 8 項基準概覽</text>
  <!-- Row 1: A構面 -->
  <rect x="28" y="118" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="118" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="66" cy="149" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="155" font-size="14" fill="#d97706" text-anchor="middle" font-weight="900">A</text>
  <text x="100" y="139" font-size="20" fill="#1e293b" font-weight="700">A 構面：經營管理（5 項）</text>
  <text x="100" y="160" font-size="16" fill="#57534e">A1社區資源、A2感染管制、A3訪視安全、A4緊急事件、A5品質指標</text>
  <rect x="620" y="126" width="136" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="146" font-size="16" fill="#d97706" text-anchor="middle">資料查核</text>
  <text x="688" y="162" font-size="16" fill="#d97706" text-anchor="middle">5 項基準</text>
  <!-- Row 2: B構面 -->
  <rect x="28" y="191" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="191" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="66" cy="222" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="228" font-size="14" fill="#78716c" text-anchor="middle" font-weight="900">B</text>
  <text x="100" y="212" font-size="20" fill="#1e293b" font-weight="700">B 構面：照護管理（3 項）</text>
  <text x="100" y="233" font-size="16" fill="#57534e">B1機構資訊管理、B2個案照護管理、B3加分項目</text>
  <rect x="620" y="199" width="136" height="46" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="219" font-size="16" fill="#78716c" text-anchor="middle">資料查核</text>
  <text x="688" y="235" font-size="16" fill="#78716c" text-anchor="middle">3 項基準</text>
  <!-- Row 3: 評鑑方式 -->
  <rect x="28" y="264" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="264" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="295" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="301" font-size="14" fill="#57534e" text-anchor="middle" font-weight="900">方式</text>
  <text x="100" y="285" font-size="20" fill="#1e293b" font-weight="700">評鑑方式：全程資料查核</text>
  <text x="100" y="306" font-size="16" fill="#57534e">評鑑委員審閱書面文件，文件齊全度決定評鑑成績</text>
  <rect x="620" y="272" width="136" height="46" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="292" font-size="16" fill="#57534e" text-anchor="middle">書面文件</text>
  <text x="688" y="308" font-size="16" fill="#57534e" text-anchor="middle">為核心</text>
  <!-- Row 4: 規模說明 -->
  <rect x="28" y="337" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="337" width="6" height="62" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="368" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="374" font-size="14" fill="#a8a29e" text-anchor="middle" font-weight="900">規模</text>
  <text x="100" y="358" font-size="20" fill="#1e293b" font-weight="700">適合機構：小型居家護理所（1-3 人）</text>
  <text x="100" y="379" font-size="16" fill="#57534e">比住宿型機構精簡，8 項均需文件齊全、有邏輯、有時效</text>
  <rect x="620" y="345" width="136" height="46" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="365" font-size="16" fill="#a8a29e" text-anchor="middle">每 3-4 年</text>
  <text x="688" y="381" font-size="16" fill="#a8a29e" text-anchor="middle">辦理一次</text>
  <!-- Watermark -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
