<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- 標題 -->
  <text x="400" y="50" font-size="26" fill="#1e293b" text-anchor="middle" font-weight="700" font-family="sans-serif">F1 住民牙科診療機制 — 3 大重點（+1 分）</text>
  <!-- N=3: H=90, outer_gap=38, Row y: 166/269/372 -->
  <!-- Row 1 -->
  <rect x="38" y="151" width="724" height="90" rx="8" fill="#ffffff"/>
  <rect x="38" y="151" width="6" height="90" rx="3" fill="#d97706"/>
  <circle cx="73" cy="196" r="16" fill="#d97706" opacity="0.15"/>
  <text x="73" y="202" font-size="16" fill="#d97706" text-anchor="middle" font-weight="700" font-family="sans-serif">1</text>
  <text x="107" y="185" font-size="18" fill="#1e293b" font-weight="700" font-family="sans-serif">制定牙科診療機制與作業流程</text>
  <text x="107" y="209" font-size="14" fill="#57534e" font-family="sans-serif">訂有住民牙科診療機制的書面文件，包含：評估條件、轉介流程、特約牙醫或合作診所資訊</text>
  <text x="107" y="230" font-size="14" fill="#57534e" font-family="sans-serif">機制文件需納入護理手冊，並定期（至少每年）更新合作牙科診所資訊及聯絡方式</text>
  <rect x="590" y="162" width="150" height="46" rx="6" fill="#d97706" opacity="0.10"/>
  <text x="665" y="190" font-size="14" fill="#d97706" text-anchor="middle" font-weight="600" font-family="sans-serif">SOP 文件</text>
  <!-- Row 2 -->
  <rect x="38" y="254" width="724" height="90" rx="8" fill="#ffffff"/>
  <rect x="38" y="254" width="6" height="90" rx="3" fill="#78716c"/>
  <circle cx="73" cy="299" r="16" fill="#78716c" opacity="0.15"/>
  <text x="73" y="305" font-size="16" fill="#78716c" text-anchor="middle" font-weight="700" font-family="sans-serif">2</text>
  <text x="107" y="288" font-size="18" fill="#1e293b" font-weight="700" font-family="sans-serif">對有需求住民持續協助就醫</text>
  <text x="107" y="312" font-size="14" fill="#57534e" font-family="sans-serif">對有牙科治療需求的住民，協助安排就診（含陪同外出或邀請牙醫師至機構巡診）</text>
  <text x="107" y="333" font-size="14" fill="#57534e" font-family="sans-serif">每位有需求住民均需建立牙科就醫追蹤紀錄，確認治療是否完成或持續追蹤中</text>
  <rect x="590" y="265" width="150" height="46" rx="6" fill="#78716c" opacity="0.10"/>
  <text x="665" y="293" font-size="14" fill="#78716c" text-anchor="middle" font-weight="600" font-family="sans-serif">持續追蹤</text>
  <!-- Row 3 -->
  <rect x="38" y="357" width="724" height="90" rx="8" fill="#ffffff"/>
  <rect x="38" y="357" width="6" height="90" rx="3" fill="#57534e"/>
  <circle cx="73" cy="402" r="16" fill="#57534e" opacity="0.15"/>
  <text x="73" y="408" font-size="16" fill="#57534e" text-anchor="middle" font-weight="700" font-family="sans-serif">3</text>
  <text x="107" y="391" font-size="18" fill="#1e293b" font-weight="700" font-family="sans-serif">評鑑備審文件準備</text>
  <text x="107" y="415" font-size="14" fill="#57534e" font-family="sans-serif">評鑑時抽查至少 2 位住民就醫紀錄（含口腔診療紀錄、轉診紀錄等文件）</text>
  <text x="107" y="436" font-size="14" fill="#57534e" font-family="sans-serif">建議建立全機構住民口腔健康管理清冊，含最後評估日期、診療狀態、下次追蹤時間</text>
  <rect x="590" y="368" width="150" height="46" rx="6" fill="#57534e" opacity="0.10"/>
  <text x="665" y="396" font-size="14" fill="#57534e" text-anchor="middle" font-weight="600" font-family="sans-serif">清冊備查</text>
  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" font-family="sans-serif">報告汪 reportwang.com</text>
</svg>