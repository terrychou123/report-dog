<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <rect x="0" y="31" width="800" height="54" fill="#e8e6de"/>
  <rect x="0" y="31" width="6" height="54" rx="2" fill="#d97706"/>
  <text x="28" y="73" font-size="30" fill="#1e293b" font-weight="700">A 區行政管理自評重點確認六項</text>
  <rect x="28" y="95" width="744" height="54" rx="12" fill="#e8e6de"/>
  <rect x="28" y="95" width="6" height="54" rx="2" fill="#d97706"/>
  <circle cx="66" cy="122" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="128" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <text x="100" y="119" font-size="18" fill="#1e293b" font-weight="700">負責人月查記錄</text>
  <text x="100" y="138" font-size="16" fill="#57534e">近 12 個月每月均有，記錄查核項目、發現問題、後續追蹤</text>
  <rect x="620" y="103" width="136" height="38" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="116" font-size="14" fill="#d97706" text-anchor="middle">每月</text>
  <text x="688" y="134" font-size="14" fill="#d97706" text-anchor="middle">必有</text>
  <rect x="28" y="159" width="744" height="54" rx="12" fill="#e8e6de"/>
  <rect x="28" y="159" width="6" height="54" rx="2" fill="#78716c"/>
  <circle cx="66" cy="186" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="192" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <text x="100" y="183" font-size="18" fill="#1e293b" font-weight="700">護理人員執照效期追蹤</text>
  <text x="100" y="202" font-size="16" fill="#57534e">所有護理師執照有效，6 個月內到期者已安排換照</text>
  <rect x="620" y="167" width="136" height="38" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="180" font-size="14" fill="#78716c" text-anchor="middle">效期</text>
  <text x="688" y="198" font-size="14" fill="#78716c" text-anchor="middle">追蹤</text>
  <rect x="28" y="223" width="744" height="54" rx="12" fill="#e8e6de"/>
  <rect x="28" y="223" width="6" height="54" rx="2" fill="#57534e"/>
  <circle cx="66" cy="250" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="256" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <text x="100" y="247" font-size="18" fill="#1e293b" font-weight="700">在職訓練計畫書</text>
  <text x="100" y="266" font-size="16" fill="#57534e">年度計畫書存在，每位人員出席簽到記錄完整</text>
  <rect x="620" y="231" width="136" height="38" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="244" font-size="14" fill="#57534e" text-anchor="middle">簽到</text>
  <text x="688" y="262" font-size="14" fill="#57534e" text-anchor="middle">完整</text>
  <rect x="28" y="287" width="744" height="54" rx="12" fill="#e8e6de"/>
  <rect x="28" y="287" width="6" height="54" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="314" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="320" font-size="16" fill="#a8a29e" text-anchor="middle" font-weight="900">4</text>
  <text x="100" y="311" font-size="18" fill="#1e293b" font-weight="700">護理主管資格符合</text>
  <text x="100" y="330" font-size="16" fill="#57534e">護理長任命文件存在，具護理師執照（非護士）</text>
  <rect x="620" y="295" width="136" height="38" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="308" font-size="14" fill="#a8a29e" text-anchor="middle">資格</text>
  <text x="688" y="326" font-size="14" fill="#a8a29e" text-anchor="middle">符合</text>
  <rect x="28" y="351" width="744" height="54" rx="12" fill="#e8e6de"/>
  <rect x="28" y="351" width="6" height="54" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="378" r="16" fill="#94a3b8" opacity="0.15"/>
  <text x="66" y="384" font-size="16" fill="#94a3b8" text-anchor="middle" font-weight="900">5</text>
  <text x="100" y="375" font-size="18" fill="#1e293b" font-weight="700">急救訓練含 AED 明確標示</text>
  <text x="100" y="394" font-size="16" fill="#57534e">訓練記錄上明確載明「含 BLS 及 AED」，而非只寫 CPR</text>
  <rect x="620" y="359" width="136" height="38" rx="8" fill="#94a3b8" opacity="0.12"/>
  <text x="688" y="372" font-size="14" fill="#94a3b8" text-anchor="middle">AED</text>
  <text x="688" y="390" font-size="14" fill="#94a3b8" text-anchor="middle">明標</text>
  <rect x="28" y="415" width="744" height="54" rx="12" fill="#e8e6de"/>
  <rect x="28" y="415" width="6" height="54" rx="2" fill="#6b7280"/>
  <circle cx="66" cy="442" r="16" fill="#6b7280" opacity="0.15"/>
  <text x="66" y="448" font-size="16" fill="#6b7280" text-anchor="middle" font-weight="900">6</text>
  <text x="100" y="439" font-size="18" fill="#1e293b" font-weight="700">照護比日班最多9人、夜班最多15人</text>
  <text x="100" y="458" font-size="16" fill="#57534e">排班記錄反映實際人力配置，符合照護比規定</text>
  <rect x="620" y="423" width="136" height="38" rx="8" fill="#6b7280" opacity="0.12"/>
  <text x="688" y="436" font-size="14" fill="#6b7280" text-anchor="middle">照護比</text>
  <text x="688" y="454" font-size="14" fill="#6b7280" text-anchor="middle">符合</text>
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
