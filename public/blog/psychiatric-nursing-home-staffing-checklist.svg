  <text x="74" y="249" font-size="15" fill="#a8a29e" font-family="'Noto Sans TC', sans-serif">連假是否有排班缺口（待確認）</text>
  <rect x="50" y="262" width="15" height="15" rx="3" fill="none" stroke="#a8a29e" stroke-width="2"/>
  <text x="74" y="275" font-size="15" fill="#a8a29e" font-family="'Noto Sans TC', sans-serif">三班護理紀錄簽名完整性（待確認）</text>
