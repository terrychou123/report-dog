  <text x="454" y="275" font-size="15" fill="#a8a29e" font-family="'Noto Sans TC', sans-serif">床數變動後重新計算（待確認）</text>
  <rect x="430" y="288" width="15" height="15" rx="3" fill="none" stroke="#a8a29e" stroke-width="2"/>
  <text x="454" y="301" font-size="15" fill="#a8a29e" font-family="'Noto Sans TC', sans-serif">兼任人員聘用合約（待確認）</text>
  <rect x="430" y="314" width="15" height="15" rx="3" fill="none" stroke="#a8a29e" stroke-width="2"/>
  <text x="454" y="327" font-size="15" fill="#a8a29e" font-family="'Noto Sans TC', sans-serif">職能師月時數統計表（待確認）</text>
  <rect x="430" y="340" width="15" height="15" rx="3" fill="none" stroke="#a8a29e" stroke-width="2"/>
  <text x="454" y="353" font-size="15" fill="#a8a29e" font-family="'Noto Sans TC', sans-serif">照服員結訓證書影本（待確認）</text>

  <!-- 品牌浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-family="'Noto Sans TC', sans-serif">報告汪 reportwang.com</text>
