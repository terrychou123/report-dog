  <line x1="40" y1="94" x2="760" y2="94" stroke="#dedad3" stroke-width="2"/>

  <!-- 左欄：護理人員 -->
  <rect x="30" y="112" width="360" height="330" rx="10" fill="white" opacity="0.75"/>
  <rect x="30" y="112" width="360" height="6" rx="3" fill="#d97706"/>
  <text x="50" y="142" font-size="19" font-weight="bold" fill="#d97706" font-family="'Noto Sans TC', sans-serif">護理人員</text>
  <text x="370" y="142" font-size="14" fill="#d97706" text-anchor="end" font-family="'Noto Sans TC', sans-serif">A2.2 試扣分</text>

  <!-- 已確認項目 -->
  <rect x="50" y="158" width="15" height="15" rx="3" fill="#d97706"/>
  <text x="74" y="171" font-size="15" fill="#57534e" font-family="'Noto Sans TC', sans-serif">有排班表（已確認）</text>
  <rect x="50" y="184" width="15" height="15" rx="3" fill="#d97706"/>
