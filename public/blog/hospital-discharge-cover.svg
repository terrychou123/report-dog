<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#fafaf9"/>

  <!-- 右側裝飾區塊 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>

  <!-- 右側大數字 3 -->
  <text x="870" y="200" font-family="'Noto Sans TC', sans-serif" font-size="160" font-weight="900" fill="#0d9488" opacity="0.18">3</text>

  <!-- 右側標籤標題 -->
  <text x="870" y="260" font-family="'Noto Sans TC', sans-serif" font-size="16" font-weight="700" fill="#44403c">3 項關鍵評鑑條文</text>

  <!-- 右側卡片 1 -->
  <rect x="858" y="278" width="300" height="72" rx="10" fill="#ffffff"/>
  <rect x="858" y="278" width="6" height="72" rx="3" fill="#d97706"/>
  <text x="876" y="302" font-family="'Noto Sans TC', sans-serif" font-size="14" font-weight="700" fill="#78350f">2.3.10 出院計畫與準備</text>
  <text x="876" y="322" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#92400e">重點條文 ▸ 資料查核＋訪談</text>
  <text x="876" y="340" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#a8a29e">早期啟動、出院教育、長照銜接</text>

  <!-- 右側卡片 2 -->
  <rect x="858" y="362" width="300" height="72" rx="10" fill="#ffffff"/>
  <rect x="858" y="362" width="6" height="72" rx="3" fill="#78716c"/>
  <text x="876" y="386" font-family="'Noto Sans TC', sans-serif" font-size="14" font-weight="700" fill="#44403c">2.3.11 轉診轉介作業</text>
  <text x="876" y="406" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#57534e">一般條文 ▸ 資料查核</text>
  <text x="876" y="424" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#a8a29e">標準化流程、完整文書</text>

  <!-- 右側卡片 3 -->
  <rect x="858" y="446" width="300" height="72" rx="10" fill="#ffffff"/>
  <rect x="858" y="446" width="6" height="72" rx="3" fill="#57534e"/>
  <text x="876" y="470" font-family="'Noto Sans TC', sans-serif" font-size="14" font-weight="700" fill="#44403c">2.3.16 病歷摘要與出院紀錄</text>
  <text x="876" y="490" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#57534e">重點條文 ▸ 資料查核</text>
  <text x="876" y="508" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#a8a29e">時限內完成、內容完整</text>

  <!-- 左側頂部標籤 -->
  <rect x="60" y="60" width="100" height="32" rx="16" fill="#0d9488"/>
  <text x="110" y="81" font-family="'Noto Sans TC', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">醫院評鑑</text>

  <!-- 左側主標題 -->
  <text x="60" y="170" font-family="'Noto Sans TC', sans-serif" font-size="72" font-weight="900" fill="#1c1917">出院準備</text>
  <text x="60" y="258" font-family="'Noto Sans TC', sans-serif" font-size="72" font-weight="900" fill="#0d9488">轉銜照護</text>

  <!-- 副標題 -->
  <text x="60" y="310" font-family="'Noto Sans TC', sans-serif" font-size="20" fill="#78716c">2.3.10 出院計畫 × 長照銜接 × 多人協作</text>

  <!-- 分隔線 -->
  <line x1="60" y1="334" x2="760" y2="334" stroke="#e7e5e4" stroke-width="1.5"/>

  <!-- 特色標籤列 -->
  <rect x="60" y="354" width="88" height="30" rx="15" fill="#f0fdfa"/>
  <text x="104" y="374" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#0d9488" text-anchor="middle">出院計畫</text>

  <rect x="158" y="354" width="88" height="30" rx="15" fill="#fef3c7"/>
  <text x="202" y="374" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#92400e" text-anchor="middle">長照銜接</text>

  <rect x="256" y="354" width="88" height="30" rx="15" fill="#f0fdf4"/>
  <text x="300" y="374" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#15803d" text-anchor="middle">出院教育</text>

  <rect x="354" y="354" width="88" height="30" rx="15" fill="#fdf4ff"/>
  <text x="398" y="374" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#7e22ce" text-anchor="middle">轉診轉介</text>

  <rect x="452" y="354" width="88" height="30" rx="15" fill="#ffe4e6"/>
  <text x="496" y="374" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#be123c" text-anchor="middle">多人協作</text>

  <!-- 底部說明文字 -->
  <text x="60" y="440" font-family="'Noto Sans TC', sans-serif" font-size="16" fill="#57534e">評鑑委員透過資料查核＋訪談雙管齊下，</text>
  <text x="60" y="466" font-family="'Noto Sans TC', sans-serif" font-size="16" fill="#57534e">本文提供出院計畫到長照銜接的完整攻略。</text>

  <!-- 圖示：出院計畫圓圈裝飾 -->
  <circle cx="740" cy="120" r="50" fill="#0d9488" opacity="0.06"/>
  <circle cx="760" cy="480" r="35" fill="#d97706" opacity="0.08"/>

  <!-- 浮水印 -->
  <text x="600" y="612" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#a8a29e" text-anchor="middle" opacity="0.7">報告汪 reportwang.com</text>
</svg>
