<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', sans-serif">
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 裝飾線 -->
  <rect x="0" y="0" width="8" height="630" fill="#d97706"/>
  <rect x="0" y="0" width="1200" height="8" fill="#d97706"/>
  <!-- 右側裝飾圖 — 仿病歷格線 -->
  <rect x="820" y="80" width="320" height="460" rx="16" fill="#ffffff" opacity="0.6"/>
  <line x1="840" y1="130" x2="1120" y2="130" stroke="#e8e6de" stroke-width="1.5"/>
  <line x1="840" y1="160" x2="1120" y2="160" stroke="#e8e6de" stroke-width="1.5"/>
  <line x1="840" y1="190" x2="1120" y2="190" stroke="#e8e6de" stroke-width="1.5"/>
  <line x1="840" y1="220" x2="1120" y2="220" stroke="#e8e6de" stroke-width="1.5"/>
  <line x1="840" y1="250" x2="1120" y2="250" stroke="#e8e6de" stroke-width="1.5"/>
  <line x1="840" y1="280" x2="1120" y2="280" stroke="#e8e6de" stroke-width="1.5"/>
  <text x="980" y="115" font-size="16" fill="#a8a29e" text-anchor="middle">S：主觀資料</text>
  <text x="980" y="145" font-size="16" fill="#a8a29e" text-anchor="middle">O：客觀資料</text>
  <text x="980" y="175" font-size="16" fill="#a8a29e" text-anchor="middle">A：評估分析</text>
  <text x="980" y="205" font-size="16" fill="#d97706" text-anchor="middle" font-weight="600">P：照護計畫</text>
  <!-- 醒目標籤 -->
  <rect x="840" y="290" width="240" height="48" rx="8" fill="#d97706"/>
  <text x="960" y="320" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">SOAP 格式護理紀錄</text>
  <!-- 標題 -->
  <text x="80" y="180" font-size="56" fill="#1e293b" font-weight="700">護理紀錄怎麼寫才過關？</text>
  <text x="80" y="248" font-size="36" fill="#d97706" font-weight="600">評鑑委員最在意的 5 個細節</text>
  <!-- 說明 -->
  <text x="80" y="320" font-size="22" fill="#57534e">對應 B2/B13/B14/B16/B17 評鑑基準</text>
  <text x="80" y="352" font-size="22" fill="#57534e">從「有寫」升級到「寫得讓委員點頭」</text>
  <!-- 5個細節預覽 -->
  <text x="80" y="410" font-size="18" fill="#78716c">細節1：B2初評完整性｜細節2：跌倒壓損逐案分析</text>
  <text x="80" y="438" font-size="18" fill="#78716c">細節3：B9巡診紀錄｜細節4：B17感染事件｜細節5：B16約束</text>
  <!-- 分類標籤 -->
  <rect x="80" y="478" width="100" height="32" rx="16" fill="#fef3c7"/>
  <text x="130" y="499" font-size="16" fill="#d97706" text-anchor="middle" font-weight="600">實務技巧</text>
  <rect x="196" y="478" width="120" height="32" rx="16" fill="#fef3c7"/>
  <text x="256" y="499" font-size="16" fill="#d97706" text-anchor="middle" font-weight="600">護理紀錄</text>
  <!-- 浮水印 -->
  <text x="1140" y="590" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
