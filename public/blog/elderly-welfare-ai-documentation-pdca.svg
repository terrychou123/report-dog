<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <rect x="0" y="0" width="800" height="90" fill="#1e293b"/>
  <text x="400" y="44" font-size="22" font-weight="700" fill="#ffffff"  text-anchor="middle">B13–B19 七大監測 PDCA AI 生成</text>
  <text x="400" y="72" font-size="15" fill="#94a3b8"  text-anchor="middle">護理師每季節省 70% 分析報告撰寫時間</text>

  <!-- N=3，H=90，outer_gap=38，Row y: 166/269/372 -->

  <!-- Row 1 -->
  <rect x="29" y="154" width="742" height="90" rx="6" fill="#ffffff"/>
  <rect x="29" y="154" width="6" height="90" rx="2" fill="#d97706"/>
  <circle cx="66" cy="199" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="204" font-size="15" font-weight="700" fill="#d97706"  text-anchor="middle">P</text>
  <text x="100" y="183" font-size="16" font-weight="700" fill="#1e293b" >七大監測項目</text>
  <text x="100" y="207" font-size="14" fill="#57534e" >B13 跌倒 ／ B14 壓力性損傷 ／ B15 疼痛 ／ B16 約束</text>
  <text x="100" y="229" font-size="14" fill="#57534e" >B17 感染 ／ B18 非計畫性住院 ／ B19 非計畫性體重改變</text>
  <rect x="620" y="167" width="136" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="186" font-size="13" font-weight="700" fill="#d97706"  text-anchor="middle">7 項指標</text>
  <text x="688" y="204" font-size="12" fill="#d97706"  text-anchor="middle">各需每季報告</text>

  <!-- Row 2 -->
  <rect x="29" y="257" width="742" height="90" rx="6" fill="#ffffff"/>
  <rect x="29" y="257" width="6" height="90" rx="2" fill="#78716c"/>
  <circle cx="66" cy="302" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="307" font-size="15" font-weight="700" fill="#78716c"  text-anchor="middle">D</text>
  <text x="100" y="286" font-size="16" font-weight="700" fill="#1e293b" >AI 生成 PDCA 分析框架</text>
  <text x="100" y="310" font-size="14" fill="#57534e" >護理師輸入本季案例數、數據，AI 自動生成：</text>
  <text x="100" y="332" font-size="14" fill="#57534e" >計畫說明→執行紀要→數據分析→改善措施建議</text>
  <rect x="620" y="270" width="136" height="46" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="289" font-size="13" font-weight="700" fill="#78716c"  text-anchor="middle">分鐘內</text>
  <text x="688" y="307" font-size="12" fill="#78716c"  text-anchor="middle">7 份同時完成</text>

  <!-- Row 3 -->
  <rect x="29" y="360" width="742" height="90" rx="6" fill="#ffffff"/>
  <rect x="29" y="360" width="6" height="90" rx="2" fill="#57534e"/>
  <circle cx="66" cy="405" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="410" font-size="15" font-weight="700" fill="#57534e"  text-anchor="middle">A</text>
  <text x="100" y="389" font-size="16" font-weight="700" fill="#1e293b" >護理師確認數字與改善措施定稿</text>
  <text x="100" y="413" font-size="14" fill="#57534e" >核對案例數據正確性、補充個案處置細節、確認改善方向</text>
  <text x="100" y="435" font-size="14" fill="#57534e" >全年 28 份報告：56h → 17h，節省 70%</text>
  <rect x="620" y="373" width="136" height="46" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="392" font-size="13" font-weight="700" fill="#57534e"  text-anchor="middle">節省 70%</text>
  <text x="688" y="410" font-size="12" fill="#57534e"  text-anchor="middle">全年時間</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" >報告汪 reportwang.com</text>
</svg>
