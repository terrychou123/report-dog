<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- 背景 -->
  <rect width="800" height="500" fill="#fafaf9" />

  <!-- 標題區塊 -->
  <rect x="0" y="0" width="800" height="80" fill="#0d9488" />
  <text x="400" y="35" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">醫療設備管理四大查核要件（1.5.3）</text>
  <text x="400" y="60" font-size="14" fill="#ccfbf1" text-anchor="middle">重點條文：資料查核 + 實地查核雙重審查</text>

  <!-- 列1：設備清冊（y=90） -->
  <rect x="30" y="92" width="740" height="88" rx="8" fill="#ffffff" stroke="#e7e5e4" stroke-width="1" />
  <rect x="30" y="92" width="6" height="88" rx="2" fill="#d97706" />
  <circle cx="68" cy="136" r="18" fill="#d97706"  opacity="0.15"/>
  <text x="68" y="142" font-size="14" font-weight="700" fill="#d97706" text-anchor="middle">1</text>
  <text x="98" y="120" font-size="15" font-weight="700" fill="#1c1917">設備清冊</text>
  <text x="98" y="140" font-size="14" fill="#57534e">醫療設備全院清冊，含名稱、型號、序號、位置、維護週期，</text>
  <text x="98" y="158" font-size="14" fill="#57534e">定期盤點確認與實際一致</text>
  <rect x="648" y="114" width="90" height="26" rx="6" fill="#fef3c7" />
  <text x="693" y="132" font-size="14" fill="#92400e" text-anchor="middle" font-weight="600">清冊齊全</text>

  <!-- 列2：預防性維護紀錄（y=190） -->
  <rect x="30" y="192" width="740" height="88" rx="8" fill="#ffffff" stroke="#e7e5e4" stroke-width="1" />
  <rect x="30" y="192" width="6" height="88" rx="2" fill="#78716c" />
  <circle cx="68" cy="236" r="18" fill="#78716c"  opacity="0.15"/>
  <text x="68" y="242" font-size="14" font-weight="700" fill="#78716c" text-anchor="middle">2</text>
  <text x="98" y="220" font-size="15" font-weight="700" fill="#1c1917">預防性維護紀錄</text>
  <text x="98" y="240" font-size="14" fill="#57534e">依計畫執行定期維護，每次有紀錄（日期、執行人、結果），</text>
  <text x="98" y="258" font-size="14" fill="#57534e">可供2-3年追溯</text>
  <rect x="648" y="214" width="90" height="26" rx="6" fill="#f5f5f4" />
  <text x="693" y="232" font-size="14" fill="#57534e" text-anchor="middle" font-weight="600">紀錄可溯</text>

  <!-- 列3：故障通報維修流程（y=292） -->
  <rect x="30" y="292" width="740" height="88" rx="8" fill="#ffffff" stroke="#e7e5e4" stroke-width="1" />
  <rect x="30" y="292" width="6" height="88" rx="2" fill="#57534e" />
  <circle cx="68" cy="336" r="18" fill="#57534e"  opacity="0.15"/>
  <text x="68" y="342" font-size="14" font-weight="700" fill="#57534e" text-anchor="middle">3</text>
  <text x="98" y="320" font-size="15" font-weight="700" fill="#1c1917">故障通報維修流程</text>
  <text x="98" y="340" font-size="14" fill="#57534e">設備故障立即通報，有維修工單、備用設備調度、恢復使用前確認安全，</text>
  <text x="98" y="358" font-size="14" fill="#57534e">不影響病人照護</text>
  <rect x="648" y="314" width="90" height="26" rx="6" fill="#f5f5f4" />
  <text x="693" y="332" font-size="14" fill="#57534e" text-anchor="middle" font-weight="600">安全維修</text>

  <!-- 列4：高風險設備安全查核（y=392） -->
  <rect x="30" y="392" width="740" height="88" rx="8" fill="#ffffff" stroke="#e7e5e4" stroke-width="1" />
  <rect x="30" y="392" width="6" height="88" rx="2" fill="#a8a29e" />
  <circle cx="68" cy="436" r="18" fill="#a8a29e"  opacity="0.15"/>
  <text x="68" y="442" font-size="14" font-weight="700" fill="#a8a29e" text-anchor="middle">4</text>
  <text x="98" y="420" font-size="15" font-weight="700" fill="#1c1917">高風險設備安全查核</text>
  <text x="98" y="440" font-size="14" fill="#57534e">呼吸器、電刀等使用前有標準查核清單，</text>
  <text x="98" y="458" font-size="14" fill="#57534e">使用人員訓練紀錄完整</text>
  <rect x="648" y="414" width="90" height="26" rx="6" fill="#f5f5f4" />
  <text x="693" y="432" font-size="14" fill="#78716c" text-anchor="middle" font-weight="600">使用前查核</text>

  <!-- 浮水印 -->
  <text x="400" y="480" font-size="14" fill="#a8a29e" text-anchor="middle" opacity="0.6">報告汪 reportwang.com</text>
</svg>
