<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"
     font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- Header（y=50, h=76）-->
  <rect x="0" y="50" width="800" height="76" fill="white"/>
  <rect x="0" y="50" width="6" height="76" fill="#d97706" rx="2"/>
  <text x="28" y="104" font-size="36" fill="#1e293b" font-weight="700">新手主任 4 個常見 FAQ</text>

  <!-- ===== Row 1（y=160）#d97706 文件補件 ===== -->
  <rect x="28" y="160" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="160" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="66" cy="191" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="197" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">Q1</text>
  <text x="100" y="188" font-size="22" fill="#1e293b" font-weight="700">上任才發現文件嚴重缺失怎麼辦？</text>
  <text x="100" y="208" font-size="16" fill="#57534e">先清點、後補件，按評鑑重要性排序，從個案評估計畫優先補起</text>
  <rect x="620" y="168" width="136" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="181" font-size="16" fill="#d97706" text-anchor="middle">文件缺失</text>
  <text x="688" y="201" font-size="16" fill="#d97706" text-anchor="middle">優先補件</text>

  <!-- ===== Row 2（y=235）#78716c 人力不足 ===== -->
  <rect x="28" y="235" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="235" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="66" cy="266" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="272" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">Q2</text>
  <text x="100" y="263" font-size="22" fill="#1e293b" font-weight="700">評鑑前發現人力比例不符規定？</text>
  <text x="100" y="283" font-size="16" fill="#57534e">立即向主管機關報備，說明改善計畫，評鑑前展示具體補救行動</text>
  <rect x="620" y="243" width="136" height="46" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="256" font-size="16" fill="#78716c" text-anchor="middle">人力不足</text>
  <text x="688" y="276" font-size="16" fill="#78716c" text-anchor="middle">提前報備</text>

  <!-- ===== Row 3（y=310）#57534e 訓練時數 ===== -->
  <rect x="28" y="310" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="310" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="341" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="347" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">Q3</text>
  <text x="100" y="338" font-size="22" fill="#1e293b" font-weight="700">訓練時數不夠怎麼快速補足？</text>
  <text x="100" y="358" font-size="16" fill="#57534e">確認線上課程是否計入，安排密集訓練課程，但不能偽造紀錄</text>
  <rect x="620" y="318" width="136" height="46" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="331" font-size="16" fill="#57534e" text-anchor="middle">訓練時數</text>
  <text x="688" y="351" font-size="16" fill="#57534e" text-anchor="middle">密集補課</text>

  <!-- ===== Row 4（y=385）#a8a29e 委員提問 ===== -->
  <rect x="28" y="385" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="385" width="6" height="62" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="416" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="422" font-size="16" fill="#a8a29e" text-anchor="middle" font-weight="900">Q4</text>
  <text x="100" y="413" font-size="22" fill="#1e293b" font-weight="700">第一次接受評鑑非常緊張怎麼辦？</text>
  <text x="100" y="433" font-size="16" fill="#57534e">事前演練最重要，實誠回答不懂的問題，展示改善計畫更勝完美</text>
  <rect x="620" y="393" width="136" height="46" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="406" font-size="16" fill="#a8a29e" text-anchor="middle">臨場應對</text>
  <text x="688" y="426" font-size="16" fill="#a8a29e" text-anchor="middle">演練備戰</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
