<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8" rx="16"/>
  <rect x="20" y="20" width="760" height="460" fill="white" rx="12"/>

  <!-- 標題列 -->
  <rect x="20" y="20" width="760" height="60" fill="#2563eb" rx="12"/>
  <rect x="20" y="60" width="760" height="20" fill="#2563eb"/>
  <text x="400" y="58" font-size="22" font-weight="700" fill="white" text-anchor="middle">A2.2 安寧緩和療護評鑑文件準備清單</text>

  <!-- 表格標題列 -->
  <rect x="40" y="100" width="720" height="40" fill="#eff6ff" rx="6"/>
  <text x="160" y="126" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">文件類別</text>
  <text x="430" y="126" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">應備文件項目</text>
  <text x="690" y="126" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">達成狀態</text>
  <line x1="280" y1="100" x2="280" y2="460" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="580" y1="100" x2="580" y2="460" stroke="#e2e8f0" stroke-width="1"/>

  <!-- 第1類 -->
  <rect x="40" y="140" width="720" height="70" rx="4" fill="#eff6ff"/>
  <rect x="40" y="140" width="4" height="70" rx="2" fill="#2563eb"/>
  <text x="160" y="168" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">住民與家屬</text>
  <text x="160" y="190" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">資訊提供</text>
  <text x="350" y="163" font-size="14" fill="#1e293b">• 入住說明書（含安寧療護說明）</text>
  <text x="350" y="183" font-size="14" fill="#1e293b">• 安寧療護衛教資料（書面/影片）</text>
  <text x="350" y="203" font-size="14" fill="#1e293b">• 住民/家屬簽收紀錄</text>
  <text x="690" y="178" font-size="20" fill="#16a34a" text-anchor="middle" font-weight="900">[v]</text>

  <!-- 第2類 -->
  <rect x="40" y="215" width="720" height="70" rx="4" fill="#f0fdf4"/>
  <rect x="40" y="215" width="4" height="70" rx="2" fill="#16a34a"/>
  <text x="160" y="243" font-size="14" font-weight="700" fill="#16a34a" text-anchor="middle">AD 預立</text>
  <text x="160" y="265" font-size="14" font-weight="700" fill="#16a34a" text-anchor="middle">醫療決定</text>
  <text x="350" y="238" font-size="14" fill="#1e293b">• 住民意願記錄表（每位住民）</text>
  <text x="350" y="258" font-size="14" fill="#1e293b">• 轉介記錄（有意願者的轉介過程）</text>
  <text x="350" y="278" font-size="14" fill="#1e293b">• AD 完成影本（完成者附）</text>
  <text x="690" y="253" font-size="20" fill="#16a34a" text-anchor="middle" font-weight="900">[v]</text>

  <!-- 第3類 -->
  <rect x="40" y="290" width="720" height="70" rx="4" fill="#faf5ff"/>
  <rect x="40" y="290" width="4" height="70" rx="2" fill="#9333ea"/>
  <text x="160" y="318" font-size="14" font-weight="700" fill="#9333ea" text-anchor="middle">工作人員</text>
  <text x="160" y="340" font-size="14" font-weight="700" fill="#9333ea" text-anchor="middle">教育訓練</text>
  <text x="350" y="313" font-size="14" fill="#1e293b">• 安寧療護訓練計畫書（年度）</text>
  <text x="350" y="333" font-size="14" fill="#1e293b">• 訓練出席記錄（含簽到表）</text>
  <text x="350" y="353" font-size="14" fill="#1e293b">• 訓練教材/課程表</text>
  <text x="690" y="328" font-size="20" fill="#d97706" text-anchor="middle" font-weight="900">^</text>

  <!-- 第4類 -->
  <rect x="40" y="365" width="720" height="70" rx="4" fill="#fef3c7"/>
  <rect x="40" y="365" width="4" height="70" rx="2" fill="#d97706"/>
  <text x="160" y="393" font-size="14" font-weight="700" fill="#d97706" text-anchor="middle">安寧療護</text>
  <text x="160" y="415" font-size="14" font-weight="700" fill="#d97706" text-anchor="middle">轉介機制</text>
  <text x="350" y="388" font-size="14" fill="#1e293b">• 轉介流程書面化文件（SOP）</text>
  <text x="350" y="408" font-size="14" fill="#1e293b">• 合作醫療機構聯絡名單（含合約）</text>
  <text x="350" y="428" font-size="14" fill="#1e293b">• 轉介個案追蹤記錄</text>
  <text x="690" y="403" font-size="20" fill="#dc2626" text-anchor="middle" font-weight="900">[x]</text>

  <!-- 圖例 -->
  <text x="500" y="460" font-size="14" fill="#57534e">[v] 已備齊　^ 部分備齊　[x] 尚未備齊</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
