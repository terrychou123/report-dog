<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"
     font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">個案紀錄 4 大撰寫原則</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">掌握核心原則，讓每一筆紀錄都能通過評鑑</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- 左上卡片（#d97706）原則1 客觀具體 -->
  <rect x="40" y="104" width="346" height="168" rx="12" fill="white"/>
  <rect x="40" y="104" width="346" height="44" rx="12" fill="#d97706"/>
  <rect x="40" y="128" width="346" height="20" fill="#d97706"/>
  <circle cx="68" cy="126" r="9" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
  <circle cx="68" cy="126" r="3" fill="white" opacity="0.8"/>
  <text x="213" y="133" text-anchor="middle" font-size="15" fill="white" font-weight="700">原則 1：客觀具體描述</text>
  <text x="60" y="172" font-size="14" fill="#57534e">• 記錄可觀察的行為事實</text>
  <text x="60" y="192" font-size="14" fill="#57534e">• 用 5W1H 架構組織內容</text>
  <text x="60" y="212" font-size="14" fill="#57534e">• 避免「情緒不好」等主觀詞彙</text>
  <text x="60" y="232" font-size="14" fill="#57534e">• 數量化描述優於形容詞描述</text>
  <rect x="56" y="246" width="80" height="20" rx="10" fill="#fef3c7"/>
  <text x="96" y="260" text-anchor="middle" font-size="14" fill="#d97706" font-weight="600">核心原則</text>

  <!-- 右上卡片（#78716c）原則2 即時完整 -->
  <rect x="414" y="104" width="346" height="168" rx="12" fill="white"/>
  <rect x="414" y="104" width="346" height="44" rx="12" fill="#78716c"/>
  <rect x="414" y="128" width="346" height="20" fill="#78716c"/>
  <rect x="438" y="117" width="18" height="18" rx="3" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
  <line x1="441" y1="126" x2="453" y2="126" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
  <text x="587" y="133" text-anchor="middle" font-size="15" fill="white" font-weight="700">原則 2：即時完整記錄</text>
  <text x="434" y="172" font-size="14" fill="#57534e">• 服務當天完成記錄</text>
  <text x="434" y="192" font-size="14" fill="#57534e">• 時間精確標記至分鐘</text>
  <text x="434" y="212" font-size="14" fill="#57534e">• 工作人員親筆簽名確認</text>
  <text x="434" y="232" font-size="14" fill="#57534e">• 不得事後補記或塗改</text>
  <rect x="430" y="246" width="80" height="20" rx="10" fill="#f5f5f4"/>
  <text x="470" y="260" text-anchor="middle" font-size="14" fill="#78716c" font-weight="600">時效要求</text>

  <!-- 左下卡片（#57534e）原則3 個別化呈現 -->
  <rect x="40" y="288" width="346" height="162" rx="12" fill="white"/>
  <rect x="40" y="288" width="346" height="44" rx="12" fill="#57534e"/>
  <rect x="40" y="312" width="346" height="20" fill="#57534e"/>
  <line x1="60" y1="309" x2="68" y2="317" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-linecap="round"/>
  <line x1="68" y1="317" x2="84" y2="301" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-linecap="round"/>
  <text x="213" y="317" text-anchor="middle" font-size="15" fill="white" font-weight="700">原則 3：個別化呈現</text>
  <text x="60" y="356" font-size="14" fill="#57534e">• 記錄顯示個案的獨特性</text>
  <text x="60" y="376" font-size="14" fill="#57534e">• 禁止複製貼上範本套用</text>
  <text x="60" y="396" font-size="14" fill="#57534e">• 展現對個案的深入了解</text>
  <text x="60" y="416" font-size="14" fill="#57534e">• 每位個案記錄應明顯不同</text>
  <rect x="56" y="430" width="80" height="20" rx="10" fill="#f5f0eb"/>
  <text x="96" y="444" text-anchor="middle" font-size="14" fill="#57534e" font-weight="600">個別差異</text>

  <!-- 右下卡片（#a8a29e）原則4 計畫連動 -->
  <rect x="414" y="288" width="346" height="162" rx="12" fill="white"/>
  <rect x="414" y="288" width="346" height="44" rx="12" fill="#a8a29e"/>
  <rect x="414" y="312" width="346" height="20" fill="#a8a29e"/>
  <circle cx="440" cy="310" r="8" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
  <line x1="440" y1="302" x2="440" y2="307" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
  <circle cx="440" cy="314" r="2" fill="rgba(255,255,255,0.7)"/>
  <text x="587" y="317" text-anchor="middle" font-size="15" fill="white" font-weight="700">原則 4：計畫連動評值</text>
  <text x="434" y="356" font-size="14" fill="#57534e">• 每筆記錄需與照顧目標連結</text>
  <text x="434" y="376" font-size="14" fill="#57534e">• 提供計畫調整的依據與軌跡</text>
  <text x="434" y="396" font-size="14" fill="#57534e">• 呈現照護成效的連續變化</text>
  <text x="434" y="416" font-size="14" fill="#57534e">• 讓評鑑委員看到照護品質</text>
  <rect x="430" y="430" width="80" height="20" rx="10" fill="#f5f5f4"/>
  <text x="470" y="444" text-anchor="middle" font-size="14" fill="#a8a29e" font-weight="600">目標連結</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
