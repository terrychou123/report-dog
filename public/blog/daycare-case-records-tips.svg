<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="450" fill="#f0efe8"/>
  <text x="400" y="46" font-size="21" font-weight="700" fill="#1e293b" text-anchor="middle">個案紀錄撰寫技巧總整理</text>
  <rect x="60" y="58" width="48" height="3" rx="1.5" fill="#d97706"/>
  <line x1="116" y1="59.5" x2="740" y2="59.5" stroke="#dedad3" stroke-width="1"/>

  <!-- NG vs OK comparison table -->
  <!-- Header -->
  <rect x="52" y="78" width="330" height="40" rx="8" fill="#ef4444" opacity="0.10"/>
  <text x="217" y="103" font-size="15" font-weight="700" fill="#dc2626" text-anchor="middle">❌ 常見 NG 寫法</text>
  <rect x="418" y="78" width="330" height="40" rx="8" fill="#22c55e" opacity="0.10"/>
  <text x="583" y="103" font-size="15" font-weight="700" fill="#16a34a" text-anchor="middle">✓ 正確寫法</text>

  <!-- Row 1: 評估 -->
  <rect x="52" y="126" width="330" height="62" rx="8" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="72" y="148" font-size="11" fill="#78716c" font-weight="600">入案評估</text>
  <text x="72" y="168" font-size="12" fill="#dc2626">「整體狀況尚可，功能維持穩定」</text>

  <rect x="418" y="126" width="330" height="62" rx="8" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="438" y="148" font-size="11" fill="#78716c" font-weight="600">入案評估</text>
  <text x="438" y="168" font-size="12" fill="#16a34a">「ADL 45分、MMSE 18分，輕度認知障礙」</text>

  <!-- Row 2: 計畫目標 -->
  <rect x="52" y="198" width="330" height="62" rx="8" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="72" y="220" font-size="11" fill="#78716c" font-weight="600">照顧目標</text>
  <text x="72" y="240" font-size="12" fill="#dc2626">「維持現況，提供所需照顧服務」</text>

  <rect x="418" y="198" width="330" height="62" rx="8" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="438" y="220" font-size="11" fill="#78716c" font-weight="600">照顧目標</text>
  <text x="438" y="240" font-size="12" fill="#16a34a">「3個月內如廁輔助下完成率達90%」</text>

  <!-- Row 3: 追蹤評值 -->
  <rect x="52" y="270" width="330" height="62" rx="8" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="72" y="292" font-size="11" fill="#78716c" font-weight="600">追蹤評值</text>
  <text x="72" y="312" font-size="12" fill="#dc2626">「計畫繼續執行，個案狀況穩定」</text>

  <rect x="418" y="270" width="330" height="62" rx="8" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="438" y="292" font-size="11" fill="#78716c" font-weight="600">追蹤評值</text>
  <text x="438" y="312" font-size="12" fill="#16a34a">「如廁目標7/10次達成，增加指導頻率」</text>

  <!-- Row 4: 個案討論 -->
  <rect x="52" y="342" width="330" height="62" rx="8" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="72" y="364" font-size="11" fill="#78716c" font-weight="600">個案討論</text>
  <text x="72" y="384" font-size="12" fill="#dc2626">「出席：社工、護理。結論：繼續執行」</text>

  <rect x="418" y="342" width="330" height="62" rx="8" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="438" y="364" font-size="11" fill="#78716c" font-weight="600">個案討論</text>
  <text x="438" y="384" font-size="12" fill="#16a34a">「跨專業決議+責任人+期限+前次追蹤」</text>

  <!-- Center divider -->
  <line x1="400" y1="78" x2="400" y2="404" stroke="#dedad3" stroke-width="1.5" stroke-dasharray="4,3"/>

  <text x="760" y="421" font-size="16" fill="#c4bfb8" text-anchor="end" font-weight="400" font-family="'Noto Sans TC', sans-serif">報告汪 reportwang.com</text>
</svg>
