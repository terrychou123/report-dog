<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 右側裝飾區塊 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>

  <!--
    右側高度計算：
    · 大數字 font-size=180, baseline=y=239, 頂部≈y=104（與左側主標題頂部對齊）
    · 最後卡片底部 ≤ 左側適用對象 y=558 ✓
  -->

  <!-- 右側裝飾大數字（頂部對齊左側主標題） -->
  <text x="1010" y="239" font-size="180" font-weight="900" fill="#d97706" text-anchor="middle" opacity="0.85">5</text>
  <text x="1010" y="281" font-size="28" fill="#78716c" text-anchor="middle" font-weight="600">大核心角色</text>

  <!-- 右側 2×2 資訊卡片（row1 y=299, row2 y=395, h=86）
       垂直置中：title_y = rect_y + 43 - 31/2 + 28×0.35 ≈ rect_y + 37
                sub_y   = title_y + 31（固定行距）
  -->
  <rect x="840" y="299" width="155" height="86" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="918" y="336" font-size="28" fill="#d97706" text-anchor="middle" font-weight="700">主管院長</text>
  <text x="918" y="367" font-size="22" fill="#a8a29e" text-anchor="middle">統籌督導</text>

  <rect x="1005" y="299" width="155" height="86" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="1083" y="336" font-size="28" fill="#78716c" text-anchor="middle" font-weight="700">社工</text>
  <text x="1083" y="367" font-size="22" fill="#a8a29e" text-anchor="middle">個案服務</text>

  <rect x="840" y="395" width="155" height="86" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="918" y="432" font-size="28" fill="#78716c" text-anchor="middle" font-weight="700">生輔員</text>
  <text x="918" y="463" font-size="22" fill="#a8a29e" text-anchor="middle">日常照顧</text>

  <rect x="1005" y="395" width="155" height="86" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="1083" y="432" font-size="28" fill="#d97706" text-anchor="middle" font-weight="700">督導</text>
  <text x="1083" y="463" font-size="22" fill="#a8a29e" text-anchor="middle">品質把關</text>

  <!-- 右側底部標籤（底部 ≤ y=558）
       單行置中：y = 491 + 52/2 + 28×0.35 ≈ 527
  -->
  <rect x="840" y="491" width="320" height="52" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="1000" y="527" font-size="28" fill="#d97706" text-anchor="middle" font-weight="700">行政支援貫穿全流程</text>

  <!-- 左側主內容區（主標題頂部≈y=104） -->
  <text x="60" y="200" font-size="120" font-weight="900" fill="#1e293b">評鑑不是</text>
  <text x="60" y="338" font-size="120" font-weight="900" fill="#d97706">一個人的事</text>

  <line x1="60" y1="365" x2="780" y2="365" stroke="#dedad3" stroke-width="2"/>

  <text x="60" y="416" font-size="38" fill="#57534e" font-weight="400">兒少安置機構｜團隊分工協作完整指南</text>

  <!-- 特色標籤列（pill 高 54px，28px 文字） -->
  <rect x="60" y="450" width="148" height="54" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="134" y="487" font-size="28" fill="#d97706" text-anchor="middle" font-weight="600">實務技巧</text>

  <rect x="220" y="450" width="148" height="54" rx="10" fill="#78716c" opacity="0.12"/>
  <text x="294" y="487" font-size="28" fill="#78716c" text-anchor="middle" font-weight="600">團隊分工</text>

  <rect x="380" y="450" width="148" height="54" rx="10" fill="#57534e" opacity="0.12"/>
  <text x="454" y="487" font-size="28" fill="#57534e" text-anchor="middle" font-weight="600">多人協作</text>

  <!-- 適用對象說明（y=558，底部≈y=565） -->
  <text x="60" y="558" font-size="28" fill="#94a3b8">適合院長、社工、生輔員、督導與行政協作使用</text>

  <!-- 浮水印 -->
  <text x="1140" y="590" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
