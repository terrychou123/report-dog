  <text x="1010" y="245" font-size="22" fill="#57534e" text-anchor="middle" >D面向2項</text>
  <text x="1010" y="275" font-size="26" fill="#78716c" text-anchor="middle"  font-weight="bold">住民權益基準</text>

  <!-- 直列pill -->
