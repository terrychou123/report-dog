  <rect x="620" y="332" width="136" height="74" rx="8" fill="#94a3b8" opacity="0.12"/>
  <text x="688" y="363" font-size="16" fill="#94a3b8" text-anchor="middle">演練紀錄</text>
  <text x="688" y="383" font-size="16" fill="#94a3b8" text-anchor="middle">持續改善</text>
  <!-- Watermark -->
