<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- Header -->
  <rect x="0" y="29" width="800" height="60" fill="#e8e6de"/>
  <rect x="0" y="29" width="6" height="60" rx="2" fill="#d97706"/>
  <text x="28" y="74" font-size="28" fill="#1e293b" font-weight="700">疏散策略3106-2三大要素</text>
  <!-- Row 1 - y=118, H=90 -->
  <rect x="28" y="118" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="118" width="6" height="90" rx="2" fill="#78716c"/>
  <circle cx="66" cy="163" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="169" font-size="14" fill="#d97706" text-anchor="middle" font-weight="900">01</text>
  <text x="100" y="153" font-size="20" fill="#1e293b" font-weight="700">針對失能服務對象的疏散程序</text>
  <text x="100" y="176" font-size="16" fill="#57534e">依服務對象行動能力分級，訂定個別化疏散協助方式與順序</text>
  <rect x="620" y="126" width="136" height="74" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="157" font-size="16" fill="#d97706" text-anchor="middle">個別化</text>
  <text x="688" y="177" font-size="16" fill="#d97706" text-anchor="middle">疏散程序</text>
  <!-- Row 2 - y=221, H=90 -->
  <rect x="28" y="221" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="221" width="6" height="90" rx="2" fill="#57534e"/>
  <circle cx="66" cy="266" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="272" font-size="14" fill="#78716c" text-anchor="middle" font-weight="900">02</text>
  <text x="100" y="256" font-size="20" fill="#1e293b" font-weight="700">逃生路線與集合點標示</text>
  <text x="100" y="279" font-size="16" fill="#57534e">標示清晰的逃生路線圖，集合點有明確指示且保持暢通</text>
  <rect x="620" y="229" width="136" height="74" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="260" font-size="16" fill="#78716c" text-anchor="middle">路線標示</text>
  <text x="688" y="280" font-size="16" fill="#78716c" text-anchor="middle">集合點明確</text>
  <!-- Row 3 - y=324, H=90 -->
  <rect x="28" y="324" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="324" width="6" height="90" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="369" r="16" fill="#94a3b8" opacity="0.15"/>
  <text x="66" y="375" font-size="14" fill="#94a3b8" text-anchor="middle" font-weight="900">03</text>
  <text x="100" y="359" font-size="20" fill="#1e293b" font-weight="700">演練紀錄與檢討報告</text>
