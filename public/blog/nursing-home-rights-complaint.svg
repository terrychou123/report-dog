<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif" width="800" height="500">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- 標題 -->
  <text x="400" y="48" font-size="32" fill="#1e293b" text-anchor="middle" font-weight="700">D4 申訴機制 4 大建置要點</text>
  <text x="400" y="78" font-size="22" fill="#78716c" text-anchor="middle">設置 + 受理 + 分析 + 改善，缺一不可</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#d97706" stroke-width="2"/>

  <!-- 標題列背景 -->
  <rect x="0" y="29" width="800" height="60" fill="white"/>
  <rect x="0" y="29" width="6" height="60" fill="#d97706" rx="2"/>

  <!-- 要點 1 -->
  <rect x="28" y="118" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="118" width="6" height="60" rx="2" fill="#78716c"/>
  <circle cx="70" cy="148" r="16" fill="#d97706" opacity="0.15"/>
  <text x="70" y="154" font-size="20" fill="white" text-anchor="middle" font-weight="700">1</text>
  <text x="105" y="142" font-size="14" fill="#1e293b" font-weight="600">申訴管道資訊張貼於明顯處</text>
  <text x="105" y="162" font-size="14" fill="#57534e">大廳公告欄、每間寢室門口均須張貼，住民與家屬可輕易看到</text>
  <rect x="620" y="126" width="136" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="145" font-size="14" fill="#d97706" text-anchor="middle" font-weight="600">設置</text>
  <text x="688" y="163" font-size="14" fill="#78716c" text-anchor="middle">明顯可見</text>

  <!-- 要點 2 -->
  <rect x="28" y="191" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="191" width="6" height="60" rx="2" fill="#57534e"/>
  <circle cx="70" cy="221" r="16" fill="#78716c" opacity="0.15"/>
  <text x="70" y="227" font-size="20" fill="white" text-anchor="middle" font-weight="700">2</text>
  <text x="105" y="215" font-size="14" fill="#1e293b" font-weight="600">有專人負責受理申訴</text>
  <text x="105" y="235" font-size="14" fill="#57534e">不得只設意見箱而無人跟進；須指定專責人員，並公告聯絡方式</text>
  <rect x="620" y="199" width="136" height="46" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="218" font-size="14" fill="#78716c" text-anchor="middle" font-weight="600">受理</text>
  <text x="688" y="236" font-size="14" fill="#78716c" text-anchor="middle">有人跟進</text>

  <!-- 要點 3 -->
  <rect x="28" y="264" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="264" width="6" height="60" rx="2" fill="#a8a29e"/>
  <circle cx="70" cy="294" r="16" fill="#57534e" opacity="0.15"/>
  <text x="70" y="300" font-size="20" fill="white" text-anchor="middle" font-weight="700">3</text>
  <text x="105" y="288" font-size="14" fill="#1e293b" font-weight="600">每年對申訴案件進行統計分析</text>
  <text x="105" y="308" font-size="14" fill="#57534e">分析申訴類型、數量、處理結果，製作年度申訴分析報告</text>
  <rect x="620" y="272" width="136" height="46" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="291" font-size="14" fill="#57534e" text-anchor="middle" font-weight="600">分析</text>
  <text x="688" y="309" font-size="14" fill="#78716c" text-anchor="middle">每年1次</text>

  <!-- 要點 4 -->
  <rect x="28" y="337" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="337" width="6" height="60" rx="2" fill="#94a3b8"/>
  <circle cx="70" cy="367" r="16" fill="#94a3b8" opacity="0.15"/>
  <text x="70" y="373" font-size="20" fill="white" text-anchor="middle" font-weight="700">4</text>
  <text x="105" y="361" font-size="14" fill="#1e293b" font-weight="600">根據分析結果提出改善措施</text>
  <text x="105" y="381" font-size="14" fill="#57534e">申訴分析結果須有對應改善方案，並追蹤改善成效</text>
  <rect x="620" y="345" width="136" height="46" rx="8" fill="#94a3b8" opacity="0.12"/>
  <text x="688" y="364" font-size="14" fill="#57534e" text-anchor="middle" font-weight="600">改善</text>
  <text x="688" y="382" font-size="14" fill="#78716c" text-anchor="middle">追蹤成效</text>

  <!-- 底部提示 -->
  <rect x="28" y="415" width="744" height="45" rx="8" fill="#d97706" opacity="0.08"/>
  <text x="400" y="435" font-size="14" fill="#d97706" text-anchor="middle" font-weight="600">評鑑委員關注重點</text>
  <text x="400" y="453" font-size="14" fill="#78716c" text-anchor="middle">申訴管道是否真的容易使用？住民是否知道如何申訴？委員可能直接詢問住民</text>

  <!-- 水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
