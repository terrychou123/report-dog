<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <rect x="0" y="0" width="800" height="90" fill="#1e293b"/>
  <text x="400" y="44" font-size="22" font-weight="700" fill="#ffffff"  text-anchor="middle">D 區常見訪談問題</text>
  <text x="400" y="72" font-size="15" fill="#94a3b8"  text-anchor="middle">個案權益保障・社工需熟知每位個案文件狀態</text>

  <!-- N=4，Row y: 160/235/310/385，H=62，outer_gap=50 -->

  <!-- Row 1 -->
  <rect x="29" y="148" width="742" height="62" rx="6" fill="#ffffff"/>
  <rect x="29" y="148" width="6" height="62" rx="2" fill="#d97706"/>
  <circle cx="66" cy="179" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="184" font-size="13" font-weight="700" fill="#d97706"  text-anchor="middle">D2</text>
  <text x="100" y="170" font-size="15" font-weight="700" fill="#1e293b" >個案資料可以讓委員看嗎？需要哪些授權？</text>
  <text x="100" y="193" font-size="13" fill="#57534e" >備答：依調閱辦法授權，能即時調出計畫與評估紀錄</text>
  <rect x="620" y="161" width="136" height="36" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="184" font-size="13" font-weight="700" fill="#d97706"  text-anchor="middle">調閱辦法</text>

  <!-- Row 2 -->
  <rect x="29" y="223" width="742" height="62" rx="6" fill="#ffffff"/>
  <rect x="29" y="223" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="66" cy="254" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="259" font-size="13" font-weight="700" fill="#78716c"  text-anchor="middle">D3</text>
  <text x="100" y="245" font-size="15" font-weight="700" fill="#1e293b" >如果個案有申訴，流程是什麼？個案知道嗎？</text>
  <text x="100" y="268" font-size="13" fill="#57534e" >備答：說明申訴管道（書面/口頭/匿名）及如何告知個案</text>
  <rect x="620" y="236" width="136" height="36" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="259" font-size="13" font-weight="700" fill="#78716c"  text-anchor="middle">申訴流程</text>

  <!-- Row 3 -->
  <rect x="29" y="298" width="742" height="62" rx="6" fill="#ffffff"/>
  <rect x="29" y="298" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="66" cy="329" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="334" font-size="13" font-weight="700" fill="#57534e"  text-anchor="middle">D8</text>
  <text x="100" y="320" font-size="15" font-weight="700" fill="#1e293b" >DNR 流程是如何建立的？哪些個案有簽署？</text>
  <text x="100" y="343" font-size="13" fill="#57534e" >備答：說明說明→同意書流程，能查出簽署人數與原因</text>
  <rect x="620" y="311" width="136" height="36" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="334" font-size="13" font-weight="700" fill="#57534e"  text-anchor="middle">護理負責</text>

  <!-- Row 4 -->
  <rect x="29" y="373" width="742" height="62" rx="6" fill="#ffffff"/>
  <rect x="29" y="373" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="404" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="409" font-size="13" font-weight="700" fill="#a8a29e"  text-anchor="middle">D9</text>
  <text x="100" y="395" font-size="15" font-weight="700" fill="#1e293b" >個案自主表達意見的管道有哪些？有定期蒐集嗎？</text>
  <text x="100" y="418" font-size="13" fill="#57534e" >備答：意見箱/座談/個別訪談，說明如何回饋到服務改善</text>
  <rect x="620" y="386" width="136" height="36" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="404" font-size="13" font-weight="700" fill="#a8a29e"  text-anchor="middle">社工負責</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" >報告汪 reportwang.com</text>
</svg>
