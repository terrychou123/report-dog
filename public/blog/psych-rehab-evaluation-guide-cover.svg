  <line x1="60" y1="338" x2="780" y2="338" stroke="#dedad3" stroke-width="2"/>

  <text x="60" y="388" font-size="36" fill="#57534e" font-weight="400">115年度完整備審攻略</text>

  <!-- 特色標籤列 -->
