  <text x="1083" y="318" font-size="28" fill="#78716c" text-anchor="middle" font-weight="700">7項PFM</text>
  <text x="1083" y="347" font-size="20" fill="#a8a29e" text-anchor="middle">直接訪談學員</text>

  <rect x="840" y="375" width="155" height="80" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="918" y="408" font-size="28" fill="#78716c" text-anchor="middle" font-weight="700">重點項目</text>
  <text x="918" y="437" font-size="20" fill="#a8a29e" text-anchor="middle">住宿型3.11</text>

  <rect x="1005" y="375" width="155" height="80" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="1083" y="408" font-size="28" fill="#d97706" text-anchor="middle" font-weight="700">100分制</text>
  <text x="1083" y="437" font-size="20" fill="#a8a29e" text-anchor="middle">115年度基準</text>

