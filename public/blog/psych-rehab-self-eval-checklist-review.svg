<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <text x="400" y="48" text-anchor="middle" font-size="30" fill="#1e293b" font-weight="700">自評三輪審查時間建議</text>
  <text x="400" y="78" text-anchor="middle" font-size="20" fill="#57534e">逐步縮小問題範圍，確保評鑑當日零驚嚇</text>
  <!-- 分隔線，與卡片群組等寬（N=3，margin=129，width=3×170+2×16=542，到x=671） -->
  <line x1="129" y1="94" x2="671" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- N=3 流程圖，card_w=170, gap=16, margin=129 -->
  <!-- card_y=108, card_bottom=450, arrow_y=279 -->

  <!-- Card 0: 評鑑前3個月 (x=129, cx=214) -->
  <rect x="129" y="108" width="170" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="129" y="108" width="170" height="8" rx="4" fill="#d97706"/>
  <rect x="129" y="112" width="170" height="4" fill="#d97706"/>
  <!-- STEP circle: cy=116+35+86/2+35=116+35+43+35=229 → 使用公式：usable_top=116, gap=35, r=43, cy=116+35+43=194 -->
  <circle cx="214" cy="194" r="43" fill="#fef3c7"/>
  <text x="214" y="183" text-anchor="middle" font-size="17" fill="#d97706" font-weight="700">STEP</text>
  <text x="214" y="211" text-anchor="middle" font-size="28" fill="#d97706" font-weight="700">01</text>
  <!-- H 標題 -->
  <text x="214" y="297" text-anchor="middle" font-size="35" fill="#1e293b" font-weight="700">3個月前</text>
  <!-- J1 說明 -->
  <text x="214" y="324" text-anchor="middle" font-size="20" fill="#57534e">全面盤點</text>
  <!-- J2 -->
  <text x="214" y="346" text-anchor="middle" font-size="20" fill="#57534e">找出缺口</text>
  <!-- K Pill -->
  <rect x="128" y="381" width="171" height="36" rx="18" fill="#fef3c7"/>
  <text x="214" y="405" text-anchor="middle" font-size="16" fill="#d97706" font-weight="600">逐條核對備審</text>

  <!-- Arrow 0→1 (x1=299, x2=315, y=279) -->
  <line x1="299" y1="279" x2="311" y2="279" stroke="#dedad3" stroke-width="2"/>
  <polygon points="315,279 309,275 309,283" fill="#dedad3"/>

  <!-- Card 1: 評鑑前1個月 (x=315, cx=400) -->
  <rect x="315" y="108" width="170" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="315" y="108" width="170" height="8" rx="4" fill="#78716c"/>
  <rect x="315" y="112" width="170" height="4" fill="#78716c"/>
  <circle cx="400" cy="194" r="43" fill="#f5f5f4"/>
  <text x="400" y="183" text-anchor="middle" font-size="17" fill="#78716c" font-weight="700">STEP</text>
  <text x="400" y="211" text-anchor="middle" font-size="28" fill="#78716c" font-weight="700">02</text>
  <text x="400" y="297" text-anchor="middle" font-size="35" fill="#1e293b" font-weight="700">1個月前</text>
  <text x="400" y="324" text-anchor="middle" font-size="20" fill="#57534e">模擬訪談</text>
  <text x="400" y="346" text-anchor="middle" font-size="20" fill="#57534e">文件複查</text>
  <rect x="314" y="381" width="171" height="36" rx="18" fill="#f5f5f4"/>
  <text x="400" y="405" text-anchor="middle" font-size="16" fill="#78716c" font-weight="600">PFM重點預演</text>

  <!-- Arrow 1→2 (x1=485, x2=501, y=279) -->
  <line x1="485" y1="279" x2="497" y2="279" stroke="#dedad3" stroke-width="2"/>
  <polygon points="501,279 495,275 495,283" fill="#dedad3"/>

  <!-- Card 2: 評鑑前1週 (x=501, cx=586) -->
  <rect x="501" y="108" width="170" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="501" y="108" width="170" height="8" rx="4" fill="#57534e"/>
  <rect x="501" y="112" width="170" height="4" fill="#57534e"/>
  <circle cx="586" cy="194" r="43" fill="#f5f0eb"/>
  <text x="586" y="183" text-anchor="middle" font-size="17" fill="#57534e" font-weight="700">STEP</text>
  <text x="586" y="211" text-anchor="middle" font-size="28" fill="#57534e" font-weight="700">03</text>
  <text x="586" y="297" text-anchor="middle" font-size="35" fill="#1e293b" font-weight="700">1週前</text>
  <text x="586" y="324" text-anchor="middle" font-size="20" fill="#57534e">最終確認</text>
  <text x="586" y="346" text-anchor="middle" font-size="20" fill="#57534e">清零待檢</text>
  <rect x="500" y="381" width="171" height="36" rx="18" fill="#f5f0eb"/>
  <text x="586" y="405" text-anchor="middle" font-size="16" fill="#57534e" font-weight="600">掃尾清零補齊</text>

  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
