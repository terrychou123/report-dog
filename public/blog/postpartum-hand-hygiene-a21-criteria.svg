<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- Header -->
  <rect x="0" y="29" width="800" height="60" fill="#e8e6de"/>
  <rect x="0" y="29" width="6" height="60" rx="2" fill="#d97706"/>
  <text x="28" y="74" font-size="30" fill="#1e293b" font-weight="700">A2.1 評鑑查核四大項目</text>
  <!-- Row 1 -->
  <rect x="28" y="118" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="118" width="6" height="62" rx="2" fill="#d97706"/>
  <circle cx="66" cy="149" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="155" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <text x="100" y="146" font-size="20" fill="#1e293b" font-weight="700">手部衛生稽核</text>
  <text x="100" y="167" font-size="16" fill="#57534e">定期稽核並留有稽核記錄，建議每季至少一次</text>
  <rect x="620" y="126" width="136" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="145" font-size="16" fill="#d97706" text-anchor="middle">資料查核</text>
  <text x="688" y="165" font-size="16" fill="#d97706" text-anchor="middle">現場觀察</text>
  <!-- Row 2 -->
  <rect x="28" y="191" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="191" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="66" cy="222" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="228" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <text x="100" y="219" font-size="20" fill="#1e293b" font-weight="700">護產人員流感疫苗接種率</text>
  <text x="100" y="240" font-size="16" fill="#57534e">每年流感季前完成，接種率須達 80% 以上</text>
  <rect x="620" y="199" width="136" height="46" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="218" font-size="16" fill="#78716c" text-anchor="middle">資料查核</text>
  <text x="688" y="238" font-size="16" fill="#78716c" text-anchor="middle">接種統計表</text>
  <!-- Row 3 -->
  <rect x="28" y="264" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="264" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="66" cy="295" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="301" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <text x="100" y="292" font-size="20" fill="#1e293b" font-weight="700">嬰兒室環境清潔稽核</text>
  <text x="100" y="313" font-size="16" fill="#57534e">定期環境清潔稽核，保留稽核記錄備查</text>
  <rect x="620" y="272" width="136" height="46" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="291" font-size="16" fill="#57534e" text-anchor="middle">資料查核</text>
  <text x="688" y="311" font-size="16" fill="#57534e" text-anchor="middle">現場觀察</text>
  <!-- Row 4 -->
  <rect x="28" y="337" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="337" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="368" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="374" font-size="16" fill="#a8a29e" text-anchor="middle" font-weight="900">4</text>
  <text x="100" y="365" font-size="20" fill="#1e293b" font-weight="700">感染事件通報機制</text>
  <text x="100" y="386" font-size="16" fill="#57534e">備有感染事件通報程序和記錄，與 A2.2 呼應</text>
  <rect x="620" y="345" width="136" height="46" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="364" font-size="16" fill="#a8a29e" text-anchor="middle">資料查核</text>
  <text x="688" y="384" font-size="16" fill="#a8a29e" text-anchor="middle">訪談確認</text>
  <!-- Watermark -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
