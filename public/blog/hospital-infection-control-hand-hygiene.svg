<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- N=5 列表圖：H=60, inner_gap=13, outer_gap=29 -->
  <!-- Header y=29, Row y=118/191/264/337/410 -->

  <!-- Header（y=29, h=60） -->
  <rect x="0" y="29" width="800" height="60" fill="white"/>
  <rect x="0" y="29" width="6" height="60" fill="#d97706" rx="2"/>
  <text x="28" y="71" font-size="36" fill="#1e293b" font-weight="700">WHO手部衛生五大時機（My 5 Moments）</text>

  <!-- ===== Row 1（y=118）接觸病人前 #d97706 ===== -->
  <rect x="28" y="118" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="118" width="6" height="60" rx="2" fill="#78716c"/>
  <circle cx="66" cy="148" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="154" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <text x="100" y="141" font-size="20" fill="#1e293b" font-weight="700">接觸病人前（Before patient contact）</text>
  <text x="100" y="165" font-size="16" fill="#57534e">接觸病人皮膚、進行評估、幫病人翻身等任何接觸之前執行手部衛生</text>
  <rect x="620" y="126" width="136" height="38" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="150" font-size="16" fill="#d97706" text-anchor="middle">時機一</text>

  <!-- ===== Row 2（y=191）無菌操作前 #78716c ===== -->
  <rect x="28" y="191" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="191" width="6" height="60" rx="2" fill="#57534e"/>
  <circle cx="66" cy="221" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="227" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <text x="100" y="214" font-size="20" fill="#1e293b" font-weight="700">執行無菌/清潔操作前（Before aseptic task）</text>
  <text x="100" y="238" font-size="16" fill="#57534e">插管、換藥、抽血、靜脈注射等無菌操作前，即使剛洗過手也需再次執行</text>
  <rect x="620" y="199" width="136" height="38" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="223" font-size="16" fill="#78716c" text-anchor="middle">時機二</text>

  <!-- ===== Row 3（y=264）接觸體液後 #dc2626 ===== -->
  <rect x="28" y="264" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="264" width="6" height="60" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="294" r="16" fill="#dc2626"/>
  <text x="66" y="300" font-size="16" fill="#dc2626" text-anchor="middle" font-weight="900">3</text>
  <text x="100" y="287" font-size="20" fill="#1e293b" font-weight="700">接觸體液後（After body fluid exposure）</text>
  <text x="100" y="311" font-size="16" fill="#57534e">接觸血液、尿液、傷口分泌物、黏膜等體液後，須立即洗手（此時用流水洗手優於消毒液）</text>
  <rect x="620" y="272" width="136" height="38" rx="8" fill="#dc2626" opacity="0.12"/>
  <text x="688" y="296" font-size="16" fill="#dc2626" text-anchor="middle">時機三</text>

  <!-- ===== Row 4（y=337）接觸病人後 #57534e ===== -->
  <rect x="28" y="337" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="337" width="6" height="60" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="367" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="373" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">4</text>
  <text x="100" y="360" font-size="20" fill="#1e293b" font-weight="700">接觸病人後（After patient contact）</text>
  <text x="100" y="384" font-size="16" fill="#57534e">離開病床後，即使未直接接觸傷口或分泌物也需執行手部衛生，保護自己不受感染</text>
  <rect x="620" y="345" width="136" height="38" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="369" font-size="16" fill="#57534e" text-anchor="middle">時機四</text>

  <!-- ===== Row 5（y=410）接觸病人環境後 #a8a29e ===== -->
  <rect x="28" y="410" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="410" width="6" height="60" rx="2" fill="#6b7280"/>
  <circle cx="66" cy="440" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="446" font-size="16" fill="#a8a29e" text-anchor="middle" font-weight="900">5</text>
  <text x="100" y="433" font-size="20" fill="#1e293b" font-weight="700">接觸病人環境後（After touching patient surroundings）</text>
  <text x="100" y="457" font-size="16" fill="#57534e">碰觸病人床欄、床頭設備、床旁桌椅等環境物品後，即使未接觸病人本人也需執行</text>
  <rect x="620" y="418" width="136" height="38" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="442" font-size="16" fill="#a8a29e" text-anchor="middle">時機五</text>

  <!-- 浮水印 -->
  <text x="760" y="490" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
