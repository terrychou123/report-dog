<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <rect x="0" y="0" width="800" height="94" fill="white"/>
  <rect x="0" y="0" width="6" height="94" fill="#d97706"/>
  <text x="400" y="48" font-size="32" font-weight="700" fill="#1e293b" text-anchor="middle">各職種負責評鑑範圍</text>
  <text x="400" y="78" font-size="22" fill="#78716c" text-anchor="middle">住宿型機構評鑑五大職種分工</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- 上排左：行政/主任 -->
  <rect x="40" y="104" width="346" height="168" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="40" y="104" width="346" height="44" rx="10" fill="#d97706" opacity="0.12"/>
  <rect x="40" y="128" width="346" height="20" fill="#d97706" opacity="0.12"/>
  <text x="213" y="133" font-size="20" font-weight="700" fill="#d97706" text-anchor="middle">行政 / 主任</text>
  <text x="60" y="170" font-size="14" fill="#57534e">A1-A7：機構設置、危機管理、業務負責人</text>
  <text x="60" y="192" font-size="14" fill="#57534e">A12-A15：訓練時數、績效管理制度</text>
  <text x="60" y="214" font-size="14" fill="#57534e">E1-E3：前次改善、創新措施、防災計畫</text>
  <rect x="60" y="234" width="110" height="26" rx="6" fill="#d97706" opacity="0.12"/>
  <text x="115" y="252" font-size="14" fill="#d97706" text-anchor="middle" font-weight="600">經營管理效能</text>

  <!-- 上排右：社工師 -->
  <rect x="414" y="104" width="346" height="168" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="414" y="104" width="346" height="44" rx="10" fill="#78716c" opacity="0.12"/>
  <rect x="414" y="128" width="346" height="20" fill="#78716c" opacity="0.12"/>
  <text x="587" y="133" font-size="20" font-weight="700" fill="#78716c" text-anchor="middle">社工師</text>
  <text x="434" y="170" font-size="14" fill="#57534e">A8：社工人員配置（長照1:100/安養1:80）</text>
  <text x="434" y="192" font-size="14" fill="#57534e">B3-B8：個案計畫、家屬溝通、轉銜</text>
  <text x="434" y="214" font-size="14" fill="#57534e">D1-D9：個案權益、居家情境、緩和醫療</text>
  <rect x="434" y="234" width="110" height="26" rx="6" fill="#78716c" opacity="0.12"/>
  <text x="489" y="252" font-size="14" fill="#78716c" text-anchor="middle" font-weight="600">個案權益保障</text>

  <!-- 下排左：護理師A -->
  <rect x="40" y="288" width="224" height="162" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="40" y="288" width="224" height="40" rx="10" fill="#57534e" opacity="0.12"/>
  <rect x="40" y="308" width="224" height="20" fill="#57534e" opacity="0.12"/>
  <text x="152" y="314" font-size="18" font-weight="700" fill="#57534e" text-anchor="middle">護理師（護A）</text>
  <text x="58" y="348" font-size="13" fill="#57534e">A9、B9、B11-B16</text>
  <text x="58" y="368" font-size="13" fill="#57534e">B22-B24、B26-B27</text>
  <text x="58" y="388" font-size="13" fill="#57534e">醫療服務、藥品管理</text>
  <text x="58" y="408" font-size="13" fill="#57534e">跌倒壓損疼痛約束</text>
  <rect x="58" y="420" width="80" height="22" rx="5" fill="#57534e" opacity="0.12"/>
  <text x="98" y="436" font-size="13" fill="#57534e" text-anchor="middle" font-weight="600">護理照護品質</text>

  <!-- 下排中：護理師B -->
  <rect x="276" y="288" width="222" height="162" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="276" y="288" width="222" height="40" rx="10" fill="#a8a29e" opacity="0.15"/>
  <rect x="276" y="308" width="222" height="20" fill="#a8a29e" opacity="0.15"/>
  <text x="387" y="314" font-size="18" font-weight="700" fill="#78716c" text-anchor="middle">護理師（護B）</text>
  <text x="294" y="348" font-size="13" fill="#57534e">A11、B17-B21、B25</text>
  <text x="294" y="368" font-size="13" fill="#57534e">B29-B32、C7、C8</text>
  <text x="294" y="388" font-size="13" fill="#57534e">感染預防、照服員配比</text>
  <text x="294" y="408" font-size="13" fill="#57534e">疫苗接種、廚房衛生</text>
  <rect x="294" y="420" width="80" height="22" rx="5" fill="#a8a29e" opacity="0.15"/>
  <text x="334" y="436" font-size="13" fill="#78716c" text-anchor="middle" font-weight="600">感控照服管理</text>

  <!-- 下排右：環安人員 -->
  <rect x="510" y="288" width="250" height="162" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="510" y="288" width="250" height="40" rx="10" fill="#94a3b8" opacity="0.15"/>
  <rect x="510" y="308" width="250" height="20" fill="#94a3b8" opacity="0.15"/>
  <text x="635" y="314" font-size="18" font-weight="700" fill="#57534e" text-anchor="middle">環安人員</text>
  <text x="528" y="348" font-size="13" fill="#57534e">C1-C6：無障礙設施、緊急呼叫</text>
  <text x="528" y="368" font-size="13" fill="#57534e">C9-C14：消防安全、疏散演練</text>
  <text x="528" y="388" font-size="13" fill="#57534e">C16：環境安全設備維護</text>
  <text x="528" y="408" font-size="13" fill="#57534e">每半年消防檢修、每月自主檢查</text>
  <rect x="528" y="420" width="80" height="22" rx="5" fill="#94a3b8" opacity="0.15"/>
  <text x="568" y="436" font-size="13" fill="#57534e" text-anchor="middle" font-weight="600">安全環境設備</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
