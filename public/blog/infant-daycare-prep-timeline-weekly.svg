<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- Header（y=31, h=58） -->
  <rect x="0" y="31" width="800" height="58" fill="white"/>
  <rect x="0" y="31" width="6" height="58" fill="#d97706" rx="2"/>
  <text x="28" y="70" font-size="36" fill="#1e293b" font-weight="700">評鑑前逐週行動清單</text>

  <!-- Row 1（y=118）#d97706 -->
  <rect x="28" y="118" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="118" width="6" height="60" rx="2" fill="#d97706"/>
  <circle cx="66" cy="148" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="154" font-size="14" fill="#d97706" text-anchor="middle" font-weight="900">12週</text>
  <text x="100" y="145" font-size="20" fill="#1e293b" font-weight="700">盤點：60 項指標逐條核對，建立缺漏清單</text>
  <text x="100" y="166" font-size="16" fill="#57534e">印出評鑑指標表，三大區塊各指定負責人，召開準備會議確認分工</text>
  <rect x="620" y="126" width="136" height="44" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="144" font-size="16" fill="#d97706" text-anchor="middle">必做第一步</text>
  <text x="688" y="164" font-size="16" fill="#d97706" text-anchor="middle">提早開始</text>

  <!-- Row 2（y=191）#78716c -->
  <rect x="28" y="191" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="191" width="6" height="60" rx="2" fill="#78716c"/>
  <circle cx="66" cy="221" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="227" font-size="14" fill="#78716c" text-anchor="middle" font-weight="900">8週</text>
  <text x="100" y="218" font-size="20" fill="#1e293b" font-weight="700">文件：佐證資料補件，依附件編號裝訂</text>
  <text x="100" y="239" font-size="16" fill="#57534e">完成缺漏文件補件，訓練紀錄、體檢表、清潔記錄整理歸檔</text>
  <rect x="620" y="199" width="136" height="44" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="217" font-size="16" fill="#78716c" text-anchor="middle">文件補齊</text>
  <text x="688" y="237" font-size="16" fill="#78716c" text-anchor="middle">建立索引</text>

  <!-- Row 3（y=264）#57534e -->
  <rect x="28" y="264" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="264" width="6" height="60" rx="2" fill="#57534e"/>
  <circle cx="66" cy="294" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="300" font-size="14" fill="#57534e" text-anchor="middle" font-weight="900">4週</text>
  <text x="100" y="291" font-size="20" fill="#1e293b" font-weight="700">自評：完成 60 項自評說明，主管覆核</text>
  <text x="100" y="312" font-size="16" fill="#57534e">自評說明引用指標語言，標注佐證編號，主任逐條確認後定稿</text>
  <rect x="620" y="272" width="136" height="44" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="290" font-size="16" fill="#57534e" text-anchor="middle">說明定稿</text>
  <text x="688" y="310" font-size="16" fill="#57534e" text-anchor="middle">主管簽核</text>

  <!-- Row 4（y=337）#a8a29e -->
  <rect x="28" y="337" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="337" width="6" height="60" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="367" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="373" font-size="14" fill="#a8a29e" text-anchor="middle" font-weight="900">2週</text>
  <text x="100" y="364" font-size="20" fill="#1e293b" font-weight="700">模擬：進行內部模擬訪談，查找遺漏點</text>
  <text x="100" y="385" font-size="16" fill="#57534e">各角色依分工模擬委員訪談問答，提前發現說法不一或文件不足的問題</text>
  <rect x="620" y="345" width="136" height="44" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="363" font-size="16" fill="#1e293b" text-anchor="middle">角色演練</text>
  <text x="688" y="383" font-size="16" fill="#1e293b" text-anchor="middle">找出漏洞</text>

  <!-- Row 5（y=410）#94a3b8 -->
  <rect x="28" y="410" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="410" width="6" height="60" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="440" r="16" fill="#94a3b8" opacity="0.15"/>
  <text x="66" y="446" font-size="14" fill="#94a3b8" text-anchor="middle" font-weight="900">前1天</text>
  <text x="100" y="437" font-size="20" fill="#1e293b" font-weight="700">備場：資料夾排列，環境最終整理</text>
  <text x="100" y="458" font-size="16" fill="#57534e">三大資料夾依評鑑順序排好，電子備份確認，工作人員提醒明天評鑑流程</text>
  <rect x="620" y="418" width="136" height="44" rx="8" fill="#94a3b8" opacity="0.12"/>
  <text x="688" y="436" font-size="16" fill="#1e293b" text-anchor="middle">最終確認</text>
  <text x="688" y="456" font-size="16" fill="#1e293b" text-anchor="middle">從容備場</text>

  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
