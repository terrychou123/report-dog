<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <text x="400" y="48" text-anchor="middle" font-size="28" fill="#1e293b" font-weight="700">輔導目標達成（項目 16）— 15 分三面向</text>
  <text x="400" y="78" text-anchor="middle" font-size="20" fill="#57534e">每個面向各 5 分，缺一不可</text>
  <line x1="129" y1="94" x2="671" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- N=3 flow: card_w=170, arrow_gap=16, margin=129 -->
  <!-- card[0] x=129 cx=214 -->
  <!-- card[1] x=315 cx=400 -->
  <!-- card[2] x=501 cx=586 -->

  <!-- Arrow 0→1 -->
  <line x1="299" y1="279" x2="315" y2="279" stroke="#c4bfb8" stroke-width="2"/>
  <polygon points="299,273 315,279 299,285" fill="#c4bfb8"/>
  <!-- Arrow 1→2 -->
  <line x1="485" y1="279" x2="501" y2="279" stroke="#c4bfb8" stroke-width="2"/>
  <polygon points="485,273 501,279 485,285" fill="#c4bfb8"/>

  <!-- Step 1 (x=129 cx=214) color #d97706 -->
  <rect x="129" y="108" width="170" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="129" y="108" width="170" height="8" rx="4" fill="#d97706"/>
  <rect x="129" y="112" width="170" height="4" fill="#d97706"/>
  <circle cx="214" cy="194" r="43" fill="#fef3c7"/>
  <text x="214" y="183" text-anchor="middle" font-size="17" fill="#d97706" font-weight="700">STEP</text>
  <text x="214" y="211" text-anchor="middle" font-size="28" fill="#d97706" font-weight="700">01</text>
  <text x="214" y="297" text-anchor="middle" font-size="22" fill="#1e293b" font-weight="700">設定目標</text>
  <text x="214" y="324" text-anchor="middle" font-size="16" fill="#57534e">個案年度</text>
  <text x="214" y="344" text-anchor="middle" font-size="16" fill="#57534e">輔導目標設定</text>
  <rect x="142" y="381" width="144" height="36" rx="18" fill="#fef3c7"/>
  <text x="214" y="405" text-anchor="middle" font-size="16" fill="#d97706" font-weight="600">各 5 分</text>

  <!-- Step 2 (x=315 cx=400) color #78716c -->
  <rect x="315" y="108" width="170" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="315" y="108" width="170" height="8" rx="4" fill="#78716c"/>
  <rect x="315" y="112" width="170" height="4" fill="#78716c"/>
  <circle cx="400" cy="194" r="43" fill="#f5f5f4"/>
  <text x="400" y="183" text-anchor="middle" font-size="17" fill="#78716c" font-weight="700">STEP</text>
  <text x="400" y="211" text-anchor="middle" font-size="28" fill="#78716c" font-weight="700">02</text>
  <text x="400" y="297" text-anchor="middle" font-size="22" fill="#1e293b" font-weight="700">檢視執行</text>
  <text x="400" y="324" text-anchor="middle" font-size="16" fill="#57534e">定期追蹤</text>
  <text x="400" y="344" text-anchor="middle" font-size="16" fill="#57534e">目標執行情形</text>
  <rect x="328" y="381" width="144" height="36" rx="18" fill="#f5f5f4"/>
  <text x="400" y="405" text-anchor="middle" font-size="16" fill="#78716c" font-weight="600">各 5 分</text>

  <!-- Step 3 (x=501 cx=586) color #57534e -->
  <rect x="501" y="108" width="170" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="501" y="108" width="170" height="8" rx="4" fill="#57534e"/>
  <rect x="501" y="112" width="170" height="4" fill="#57534e"/>
  <circle cx="586" cy="194" r="43" fill="#f5f0eb"/>
  <text x="586" y="183" text-anchor="middle" font-size="17" fill="#57534e" font-weight="700">STEP</text>
  <text x="586" y="211" text-anchor="middle" font-size="28" fill="#57534e" font-weight="700">03</text>
  <text x="586" y="297" text-anchor="middle" font-size="22" fill="#1e293b" font-weight="700">評估達成</text>
  <text x="586" y="324" text-anchor="middle" font-size="16" fill="#57534e">年度達成率</text>
  <text x="586" y="344" text-anchor="middle" font-size="16" fill="#57534e">系統性評估</text>
  <rect x="514" y="381" width="144" height="36" rx="18" fill="#f5f0eb"/>
  <text x="586" y="405" text-anchor="middle" font-size="16" fill="#57534e" font-weight="600">各 5 分</text>

  <!-- 合計標示 -->
  <rect x="310" y="456" width="180" height="32" rx="16" fill="#d97706" opacity="0.15"/>
  <text x="400" y="477" text-anchor="middle" font-size="18" fill="#d97706" font-weight="700">三面向合計 15 分</text>

  <text x="760" y="492" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
