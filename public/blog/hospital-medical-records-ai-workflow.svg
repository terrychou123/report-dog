<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <rect x="50" y="38" width="6" height="72" rx="2" fill="#d97706"/>
  <text x="68" y="68"  font-size="28" font-weight="900" fill="#1e293b">AI輔助病歷書寫工作流程</text>
  <text x="68" y="100"  font-size="15" fill="#57534e">合規框架內提升效率：AI生成初稿 - 醫師審核簽名</text>

  <!-- Step cards - y=160, card_w=174, 間距=12 -->
  <!-- STEP 01 -->
  <rect x="50" y="148" width="162" height="300" rx="14" fill="white"/>
  <rect x="50" y="148" width="162" height="8" rx="4" fill="#d97706"/>
  <text x="131" y="184"  font-size="14" font-weight="700" fill="#d97706" text-anchor="middle">STEP 01</text>
  <!-- 圓形圖示 -->
  <circle cx="131" cy="232" r="32" fill="#fef3c7"/>
  <text x="131" y="240"  font-size="28" text-anchor="middle"></text>
  <text x="131" y="294"  font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">臨床觀察</text>
  <text x="131" y="318"  font-size="14" fill="#57534e" text-anchor="middle">醫師/護師</text>
  <text x="131" y="336"  font-size="14" fill="#57534e" text-anchor="middle">執行診療</text>
  <text x="131" y="354"  font-size="14" fill="#57534e" text-anchor="middle">記錄關鍵</text>
  <text x="131" y="372"  font-size="14" fill="#57534e" text-anchor="middle">資訊要點</text>

  <!-- 箭頭 1 -->
  <polygon points="224,279 238,271 238,287" fill="#d97706"/>
  <line x1="212" y1="279" x2="238" y2="279" stroke="#d97706" stroke-width="2.5"/>

  <!-- STEP 02 -->
  <rect x="240" y="148" width="162" height="300" rx="14" fill="white"/>
  <rect x="240" y="148" width="162" height="8" rx="4" fill="#78716c"/>
  <text x="321" y="184"  font-size="14" font-weight="700" fill="#78716c" text-anchor="middle">STEP 02</text>
  <circle cx="321" cy="232" r="32" fill="#f5f5f4"/>
  <text x="321" y="240"  font-size="28" text-anchor="middle"></text>
  <text x="321" y="294"  font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">AI初稿生成</text>
  <text x="321" y="318"  font-size="14" fill="#57534e" text-anchor="middle">依輸入要點</text>
  <text x="321" y="336"  font-size="14" fill="#57534e" text-anchor="middle">生成格式化</text>
  <text x="321" y="354"  font-size="14" fill="#57534e" text-anchor="middle">初稿符合</text>
  <text x="321" y="372"  font-size="14" fill="#57534e" text-anchor="middle">SOAP格式</text>

  <!-- 箭頭 2 -->
  <polygon points="414,279 428,271 428,287" fill="#78716c"/>
  <line x1="402" y1="279" x2="428" y2="279" stroke="#78716c" stroke-width="2.5"/>

  <!-- STEP 03 -->
  <rect x="430" y="148" width="162" height="300" rx="14" fill="white"/>
  <rect x="430" y="148" width="162" height="8" rx="4" fill="#57534e"/>
  <text x="511" y="184"  font-size="14" font-weight="700" fill="#57534e" text-anchor="middle">STEP 03</text>
  <circle cx="511" cy="232" r="32" fill="#f5f5f4"/>
  <text x="511" y="240"  font-size="28" text-anchor="middle">‍️</text>
  <text x="511" y="294"  font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">醫師審核修正</text>
  <text x="511" y="318"  font-size="14" fill="#57534e" text-anchor="middle">醫師核閱AI</text>
  <text x="511" y="336"  font-size="14" fill="#57534e" text-anchor="middle">初稿依實際</text>
  <text x="511" y="354"  font-size="14" fill="#57534e" text-anchor="middle">情況修正</text>
  <text x="511" y="372"  font-size="14" fill="#57534e" text-anchor="middle">補充說明</text>

  <!-- 箭頭 3 -->
  <polygon points="604,279 618,271 618,287" fill="#57534e"/>
  <line x1="592" y1="279" x2="618" y2="279" stroke="#57534e" stroke-width="2.5"/>

  <!-- STEP 04 -->
  <rect x="620" y="148" width="130" height="300" rx="14" fill="white"/>
  <rect x="620" y="148" width="130" height="8" rx="4" fill="#a8a29e"/>
  <text x="685" y="184"  font-size="14" font-weight="700" fill="#78716c" text-anchor="middle">STEP 04</text>
  <circle cx="685" cy="232" r="32" fill="#f5f5f4"/>
  <text x="685" y="240"  font-size="28" text-anchor="middle">[v]</text>
  <text x="685" y="294"  font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">簽名存檔</text>
  <text x="685" y="318"  font-size="14" fill="#57534e" text-anchor="middle">醫師電子</text>
  <text x="685" y="336"  font-size="14" fill="#57534e" text-anchor="middle">簽名確認</text>
  <text x="685" y="354"  font-size="14" fill="#57534e" text-anchor="middle">病歷正式</text>
  <text x="685" y="372"  font-size="14" fill="#57534e" text-anchor="middle">完成合規</text>

  <!-- 底部說明 -->
  <rect x="50" y="462" width="700" height="24" rx="12" fill="#fef3c7"/>
  <text x="400" y="479"  font-size="14" fill="#d97706" text-anchor="middle" font-weight="600">合規關鍵：最終病歷必須由有執照醫療人員實質審核並電子簽名</text>

  <!-- 浮水印 -->
  <text x="50" y="497"  font-size="14" fill="#94a3b8" opacity="0.8">報告汪 reportwang.com</text>
</svg>
