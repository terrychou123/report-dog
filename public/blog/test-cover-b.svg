<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 右側裝飾區塊 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>

  <!--
    右側高度計算：
    · 數字 "7"：font-size=190, baseline=y=247, 頂部≈y=104（與左側主標題頂部對齊）
    · 最後 pill 底部：y=499+56=555 ≤ 左側適用對象 y=558 ✓
    · 右側內容總高：104~555 = 451px ≤ 左側 104~565 = 461px ✓
  -->

  <!-- 右側裝飾大數字（190px，頂部對齊左側主標題） -->
  <text x="1010" y="247" font-size="190" font-weight="900" fill="#d97706" text-anchor="middle" opacity="0.85">7</text>
  <text x="1010" y="289" font-size="28" fill="#78716c" text-anchor="middle" font-weight="600">個常見照護技巧</text>

  <!-- 右側直列 pill 標籤（4 個，各 56px，gap 8px，底部 555）
       單行置中：y = rect_y + 56/2 + 28×0.35 = rect_y + 38
  -->
  <rect x="840" y="307" width="330" height="56" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="1005" y="345" font-size="28" fill="#d97706" text-anchor="middle" font-weight="700">技巧 1：情緒同理優先</text>

  <rect x="840" y="371" width="330" height="56" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="1005" y="409" font-size="28" fill="#78716c" text-anchor="middle" font-weight="600">技巧 3：安撫音樂治療</text>

  <rect x="840" y="435" width="330" height="56" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="1005" y="473" font-size="28" fill="#78716c" text-anchor="middle" font-weight="600">技巧 6：安全視線看視</text>

  <rect x="840" y="499" width="330" height="56" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="1005" y="537" font-size="28" fill="#78716c" text-anchor="middle" font-weight="600">技巧 7：追蹤評值更新</text>

  <!-- 左側主內容區（主標題 120/110px，頂部≈y=104） -->
  <text x="60" y="200" font-size="120" font-weight="900" fill="#1e293b">失智長輩</text>
  <text x="60" y="338" font-size="110" font-weight="900" fill="#d97706">想回家怎麼辦</text>

  <line x1="60" y1="365" x2="780" y2="365" stroke="#dedad3" stroke-width="2"/>

  <text x="60" y="416" font-size="38" fill="#57534e" font-weight="400">7 個照護技巧 · 對照評鑑第 16 條</text>

  <!-- 特色標籤列（28px，pill 高 54px） -->
  <rect x="60" y="450" width="148" height="54" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="134" y="483" font-size="28" fill="#d97706" text-anchor="middle" font-weight="600">日照中心</text>

  <rect x="220" y="450" width="148" height="54" rx="10" fill="#78716c" opacity="0.12"/>
  <text x="294" y="483" font-size="28" fill="#78716c" text-anchor="middle" font-weight="600">失智照護</text>

  <rect x="380" y="450" width="148" height="54" rx="10" fill="#57534e" opacity="0.12"/>
  <text x="454" y="483" font-size="28" fill="#57534e" text-anchor="middle" font-weight="600">BPSD 處理</text>

  <!-- 適用對象說明（28px，底部≈y=565） -->
  <text x="60" y="558" font-size="28" fill="#94a3b8">適用對象：照服員 · 社工 · 日照主任 · 評鑑準備</text>

  <!-- 浮水印（24px，上移） -->
  <text x="1140" y="590" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
