<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <!-- 背景：米黃暖色 -->
  <rect width="800" height="450" fill="#f0efe8" rx="16"/>

  <!-- 標題 -->
  <text x="400" y="48" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="22" fill="#1e293b" font-weight="700">評鑑前 3 個月準備時程表</text>
  <text x="400" y="72" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="14" fill="#64748b">建議最少提前 3 個月啟動系統性準備</text>

  <!-- 時程線 -->
  <line x1="80" y1="260" x2="720" y2="260" stroke="#dedad3" stroke-width="2"/>

  <!-- 月份節點 -->
  <!-- 3 個月前 -->
  <circle cx="160" cy="260" r="18" fill="#94a3b8" stroke="#dedad3" stroke-width="2"/>
  <text x="160" y="265" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="white" font-weight="700">3M</text>

  <!-- 2 個月前 -->
  <circle cx="400" cy="260" r="18" fill="#a8a29e" stroke="#dedad3" stroke-width="2"/>
  <text x="400" y="265" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="white" font-weight="700">2M</text>

  <!-- 1 個月前 -->
  <circle cx="640" cy="260" r="18" fill="#78716c" stroke="#dedad3" stroke-width="2"/>
  <text x="640" y="265" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="white" font-weight="700">1M</text>

  <!-- 評鑑日 -->
  <circle cx="720" cy="260" r="14" fill="#d97706" stroke="#dedad3" stroke-width="2"/>
  <text x="720" y="265" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="10" fill="white" font-weight="700">評鑑</text>

  <!-- 3 個月前 內容（上方） -->
  <line x1="160" y1="242" x2="160" y2="185" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="60" y="100" width="200" height="85" rx="10" fill="white" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="160" y="122" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="15" fill="#94a3b8" font-weight="700">第 1 個月：盤點</text>
  <text x="160" y="143" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#1e293b">• 下載自評表全面盤點</text>
  <text x="160" y="161" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#1e293b">• 找出文件/制度缺口</text>
  <text x="160" y="179" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#1e293b">• 分配各部門補強責任</text>

  <!-- 2 個月前 內容（下方） -->
  <line x1="400" y1="278" x2="400" y2="315" stroke="#a8a29e" stroke-width="1.5"/>
  <rect x="300" y="315" width="200" height="85" rx="10" fill="white" stroke="#a8a29e" stroke-width="1.5"/>
  <text x="400" y="337" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="15" fill="#a8a29e" font-weight="700">第 2 個月：補強</text>
  <text x="400" y="358" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#1e293b">• 補齊書面規定文件</text>
  <text x="400" y="376" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#1e293b">• 整理現有紀錄歸檔</text>
  <text x="400" y="394" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#1e293b">• 補足教育訓練時數</text>

  <!-- 1 個月前 內容（上方） -->
  <line x1="640" y1="242" x2="640" y2="185" stroke="#78716c" stroke-width="1.5"/>
  <rect x="540" y="100" width="200" height="85" rx="10" fill="white" stroke="#78716c" stroke-width="1.5"/>
  <text x="640" y="122" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="15" fill="#78716c" font-weight="700">第 3 個月：演練</text>
  <text x="640" y="143" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#1e293b">• 全面最後確認</text>
  <text x="640" y="161" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#1e293b">• 全員訪談口頭演練</text>
  <text x="640" y="179" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#1e293b">• 環境整備最終巡視</text>

  <!-- 只剩 1 個月的特別提示 -->
  <rect x="40" y="380" width="720" height="50" rx="10" fill="white" stroke="#dedad3" stroke-width="1"/>
  <text x="400" y="401" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="14" fill="#1e293b" font-weight="600">⚠️ 只剩 1 個月？優先處理：第 2、6、7、9、22、29 條</text>
  <text x="400" y="420" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#64748b">這幾條委員查核頻率最高，文件也最容易整備，應優先補強</text>

  <!-- 浮水印 -->
  <text x="400" y="444" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#c4bfb8">報告汪 reportwang.com</text>
</svg>
