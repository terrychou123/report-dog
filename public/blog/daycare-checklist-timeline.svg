<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <!-- 背景 -->
  <rect width="800" height="450" fill="#0f172a" rx="16"/>

  <!-- 標題 -->
  <text x="400" y="48" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="22" fill="white" font-weight="700">評鑑前 3 個月準備時程表</text>
  <text x="400" y="72" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="14" fill="rgba(255,255,255,0.5)">建議最少提前 3 個月啟動系統性準備</text>

  <!-- 時程線 -->
  <line x1="80" y1="260" x2="720" y2="260" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>

  <!-- 月份節點 -->
  <!-- 3 個月前 -->
  <circle cx="160" cy="260" r="18" fill="#1d4ed8" stroke="#60a5fa" stroke-width="2"/>
  <text x="160" y="265" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="white" font-weight="700">3M</text>

  <!-- 2 個月前 -->
  <circle cx="400" cy="260" r="18" fill="#7c3aed" stroke="#a78bfa" stroke-width="2"/>
  <text x="400" y="265" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="white" font-weight="700">2M</text>

  <!-- 1 個月前 -->
  <circle cx="640" cy="260" r="18" fill="#10b981" stroke="#34d399" stroke-width="2"/>
  <text x="640" y="265" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="white" font-weight="700">1M</text>

  <!-- 評鑑日 -->
  <circle cx="720" cy="260" r="14" fill="#ef4444" stroke="#fca5a5" stroke-width="2"/>
  <text x="720" y="265" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="10" fill="white" font-weight="700">評鑑</text>

  <!-- 3 個月前 內容（上方） -->
  <line x1="160" y1="242" x2="160" y2="185" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="60" y="100" width="200" height="85" rx="10" fill="rgba(29,78,216,0.2)" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="160" y="122" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="15" fill="#60a5fa" font-weight="700">第 1 個月：盤點</text>
  <text x="160" y="143" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">• 下載自評表全面盤點</text>
  <text x="160" y="161" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">• 找出文件/制度缺口</text>
  <text x="160" y="179" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">• 分配各部門補強責任</text>

  <!-- 2 個月前 內容（下方） -->
  <line x1="400" y1="278" x2="400" y2="315" stroke="#a78bfa" stroke-width="1.5"/>
  <rect x="300" y="315" width="200" height="85" rx="10" fill="rgba(124,58,237,0.2)" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="400" y="337" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="15" fill="#a78bfa" font-weight="700">第 2 個月：補強</text>
  <text x="400" y="358" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">• 補齊書面規定文件</text>
  <text x="400" y="376" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">• 整理現有紀錄歸檔</text>
  <text x="400" y="394" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">• 補足教育訓練時數</text>

  <!-- 1 個月前 內容（上方） -->
  <line x1="640" y1="242" x2="640" y2="185" stroke="#34d399" stroke-width="1.5"/>
  <rect x="540" y="100" width="200" height="85" rx="10" fill="rgba(16,185,129,0.2)" stroke="#10b981" stroke-width="1.5"/>
  <text x="640" y="122" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="15" fill="#34d399" font-weight="700">第 3 個月：演練</text>
  <text x="640" y="143" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">• 全面最後確認</text>
  <text x="640" y="161" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">• 全員訪談口頭演練</text>
  <text x="640" y="179" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">• 環境整備最終巡視</text>

  <!-- 只剩 1 個月的特別提示 -->
  <rect x="40" y="380" width="720" height="50" rx="10" fill="rgba(239,68,68,0.15)" stroke="rgba(239,68,68,0.4)" stroke-width="1"/>
  <text x="400" y="401" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="14" fill="white" font-weight="600">⚠️ 只剩 1 個月？優先處理：第 2、6、7、9、22、29 條</text>
  <text x="400" y="420" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="rgba(255,255,255,0.55)">這幾條委員查核頻率最高，文件也最容易整備，應優先補強</text>
</svg>
