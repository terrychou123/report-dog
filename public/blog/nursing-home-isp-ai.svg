<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- 標題區 -->
  <text x="40" y="48" font-size="32" fill="#1e293b" font-weight="700">AI 輔助 ISP 撰寫流程</text>
  <text x="40" y="78" font-size="22" fill="#57534e">三步驟讓 ISP 撰寫更快、更符合評鑑要求</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#d97706" stroke-width="2"/>

  <!-- 步驟 1 -->
  <rect x="60" y="135" width="200" height="230" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <rect x="60" y="135" width="200" height="56" rx="12" fill="#d97706"/>
  <rect x="60" y="171" width="200" height="20" fill="#d97706"/>
  <text x="160" y="154" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle">步驟 1</text>
  <text x="160" y="174" font-size="15" fill="#fff8e7" text-anchor="middle">輸入評估資料</text>
  <text x="160" y="216" font-size="14" fill="#57534e" text-anchor="middle">填入住民基本資料</text>
  <text x="160" y="240" font-size="14" fill="#57534e" text-anchor="middle">上傳評估量表分數</text>
  <text x="160" y="264" font-size="14" fill="#57534e" text-anchor="middle">選擇照護問題類型</text>
  <text x="160" y="288" font-size="14" fill="#57534e" text-anchor="middle">輸入診斷與用藥</text>
  <text x="160" y="312" font-size="14" fill="#d97706" text-anchor="middle" font-weight="600">5 分鐘完成資料輸入</text>

  <!-- 箭頭 1 -->
  <path d="M 268 250 L 312 250" stroke="#d97706" stroke-width="3" fill="none"/>
  <polygon points="310,242 322,250 310,258" fill="#d97706"/>

  <!-- 步驟 2 -->
  <rect x="320" y="135" width="200" height="230" rx="12" fill="#ffffff" stroke="#78716c" stroke-width="2"/>
  <rect x="320" y="135" width="200" height="56" rx="12" fill="#78716c"/>
  <rect x="320" y="171" width="200" height="20" fill="#78716c"/>
  <text x="420" y="154" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle">步驟 2</text>
  <text x="420" y="174" font-size="15" fill="#e7e5e4" text-anchor="middle">AI 生成 ISP 初稿</text>
  <text x="420" y="216" font-size="14" fill="#57534e" text-anchor="middle">自動套用 B2 格式</text>
  <text x="420" y="240" font-size="14" fill="#57534e" text-anchor="middle">生成護理問題清單</text>
  <text x="420" y="264" font-size="14" fill="#57534e" text-anchor="middle">提供目標設定建議</text>
  <text x="420" y="288" font-size="14" fill="#57534e" text-anchor="middle">生成照護措施方案</text>
  <text x="420" y="312" font-size="14" fill="#78716c" text-anchor="middle" font-weight="600">符合評鑑委員審查邏輯</text>

  <!-- 箭頭 2 -->
  <path d="M 528 250 L 572 250" stroke="#78716c" stroke-width="3" fill="none"/>
  <polygon points="570,242 582,250 570,258" fill="#78716c"/>

  <!-- 步驟 3 -->
  <rect x="580" y="135" width="180" height="230" rx="12" fill="#ffffff" stroke="#57534e" stroke-width="2"/>
  <rect x="580" y="135" width="180" height="56" rx="12" fill="#57534e"/>
  <rect x="580" y="171" width="180" height="20" fill="#57534e"/>
  <text x="670" y="154" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle">步驟 3</text>
  <text x="670" y="174" font-size="15" fill="#e7e5e4" text-anchor="middle">確認並管理進度</text>
  <text x="670" y="216" font-size="14" fill="#57534e" text-anchor="middle">護理師核對補充</text>
  <text x="670" y="240" font-size="14" fill="#57534e" text-anchor="middle">跨專業共同編輯</text>
  <text x="670" y="264" font-size="14" fill="#57534e" text-anchor="middle">評值到期日提醒</text>
  <text x="670" y="288" font-size="14" fill="#57534e" text-anchor="middle">家屬確認電子簽名</text>
  <text x="670" y="312" font-size="14" fill="#57534e" text-anchor="middle">全程可追蹤記錄</text>

  <!-- 底部說明 -->
  <rect x="60" y="392" width="700" height="72" rx="10" fill="#fef3c7"/>
  <text x="410" y="418" font-size="15" fill="#92400e" text-anchor="middle" font-weight="700">報告汪 ISP 管理功能</text>
  <text x="410" y="433" font-size="14" fill="#92400e" text-anchor="middle">自動提醒評值到期 / 多人協作即時更新 / AI 輔助撰寫節省 60% 時間</text>
  <text x="410" y="458" font-size="14" fill="#92400e" text-anchor="middle">立即試用：reportwang.com</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
