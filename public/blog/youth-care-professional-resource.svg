<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- Header (y=31, h=54) -->
  <rect x="0" y="31" width="800" height="54" fill="white"/>
  <rect x="0" y="31" width="6" height="54" fill="#16a34a"/>
  <text x="28" y="68" font-size="30" fill="#1e293b" font-weight="700">資源結合與運用（項目 26）— 六面向各 1 分</text>

  <!-- Row 1 (y=95) #d97706 -->
  <rect x="28" y="95" width="744" height="54" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="95" width="6" height="54" rx="2" fill="#d97706"/>
  <circle cx="66" cy="122" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="128" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <text x="100" y="117" font-size="18" fill="#1e293b" font-weight="700">與主管機關之聯繫與合作</text>
  <text x="100" y="137" font-size="14" fill="#57534e">共同參加個案研討、緊短家園討論、聯繫會議等</text>
  <rect x="660" y="103" width="100" height="38" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="710" y="127" font-size="20" fill="#d97706" text-anchor="middle" font-weight="700">1 分</text>

  <!-- Row 2 (y=159) #78716c -->
  <rect x="28" y="159" width="744" height="54" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="159" width="6" height="54" rx="2" fill="#78716c"/>
  <circle cx="66" cy="186" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="192" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <text x="100" y="181" font-size="18" fill="#1e293b" font-weight="700">與其他專業人員之協調合作</text>
  <text x="100" y="201" font-size="14" fill="#57534e">心理師、學校輔導老師、醫療單位等協作紀錄</text>
  <rect x="660" y="167" width="100" height="38" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="710" y="191" font-size="20" fill="#78716c" text-anchor="middle" font-weight="700">1 分</text>

  <!-- Row 3 (y=223) #57534e -->
  <rect x="28" y="223" width="744" height="54" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="223" width="6" height="54" rx="2" fill="#57534e"/>
  <circle cx="66" cy="250" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="256" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <text x="100" y="245" font-size="18" fill="#1e293b" font-weight="700">建立兒少轉介諮詢或其他資源檔案</text>
  <text x="100" y="265" font-size="14" fill="#57534e">資源網絡清冊，有定期更新記錄</text>
  <rect x="660" y="231" width="100" height="38" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="710" y="255" font-size="20" fill="#57534e" text-anchor="middle" font-weight="700">1 分</text>

  <!-- Row 4 (y=287) #a8a29e -->
  <rect x="28" y="287" width="744" height="54" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="287" width="6" height="54" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="314" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="320" font-size="16" fill="#a8a29e" text-anchor="middle" font-weight="900">4</text>
  <text x="100" y="309" font-size="18" fill="#1e293b" font-weight="700">結合並運用社區正式及非正式資源</text>
  <text x="100" y="329" font-size="14" fill="#57534e">資源連結運用紀錄，呈現資源多元性</text>
  <rect x="660" y="295" width="100" height="38" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="710" y="319" font-size="20" fill="#a8a29e" text-anchor="middle" font-weight="700">1 分</text>

  <!-- Row 5 (y=351) #94a3b8 -->
  <rect x="28" y="351" width="744" height="54" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="351" width="6" height="54" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="378" r="16" fill="#94a3b8" opacity="0.15"/>
  <text x="66" y="384" font-size="16" fill="#94a3b8" text-anchor="middle" font-weight="900">5</text>
  <text x="100" y="373" font-size="18" fill="#1e293b" font-weight="700">兒少的轉介或諮詢</text>
  <text x="100" y="393" font-size="14" fill="#57534e">實際轉介或諮詢的完整處理記錄</text>
  <rect x="660" y="359" width="100" height="38" rx="8" fill="#94a3b8" opacity="0.12"/>
  <text x="710" y="383" font-size="20" fill="#94a3b8" text-anchor="middle" font-weight="700">1 分</text>

  <!-- Row 6 (y=415) #6b7280 -->
  <rect x="28" y="415" width="744" height="54" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="415" width="6" height="54" rx="2" fill="#6b7280"/>
  <circle cx="66" cy="442" r="16" fill="#6b7280" opacity="0.15"/>
  <text x="66" y="448" font-size="16" fill="#6b7280" text-anchor="middle" font-weight="900">6</text>
  <text x="100" y="437" font-size="18" fill="#1e293b" font-weight="700">志工人力資源運用</text>
  <text x="100" y="457" font-size="14" fill="#57534e">志工管理制度：招募/訓練/服務/退場，加上服務紀錄</text>
  <rect x="660" y="423" width="100" height="38" rx="8" fill="#6b7280" opacity="0.12"/>
  <text x="710" y="447" font-size="20" fill="#6b7280" text-anchor="middle" font-weight="700">1 分</text>

  <text x="760" y="490" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
