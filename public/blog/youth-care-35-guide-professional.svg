<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">參、專業服務 60 分——六個子項分布</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">單項最高 15 分，評鑑等第關鍵</text>
  <line x1="28" y1="94" x2="772" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- Row 1 (y=108) -->
  <rect x="28" y="108" width="744" height="54" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="108" width="6" height="54" rx="2" fill="#d97706"/>
  <circle cx="66" cy="135" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="141" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">一</text>
  <text x="100" y="127" font-size="19" fill="#1e293b" font-weight="700">個案紀錄與交班紀錄（項目 15）</text>
  <text x="100" y="150" font-size="15" fill="#57534e">主管機關依輔導查核表評分，格式完整、每班確實填寫</text>
  <rect x="660" y="116" width="100" height="38" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="710" y="135" font-size="18" fill="#d97706" text-anchor="middle" font-weight="700">1 分</text>
  <text x="710" y="151" font-size="14" fill="#d97706" text-anchor="middle">項目 15</text>

  <!-- Row 2 (y=172) -->
  <rect x="28" y="172" width="744" height="54" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="172" width="6" height="54" rx="2" fill="#78716c"/>
  <circle cx="66" cy="199" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="205" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">二</text>
  <text x="100" y="191" font-size="19" fill="#1e293b" font-weight="700">兒少輔導目標之達成（項目 16）⭐ 最高單項</text>
  <text x="100" y="214" font-size="15" fill="#57534e">設定目標 5分、執行檢視 5分、達成評估 5分，目標需具體可衡量</text>
  <rect x="660" y="180" width="100" height="38" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="710" y="199" font-size="18" fill="#78716c" text-anchor="middle" font-weight="700">15 分</text>
  <text x="710" y="215" font-size="14" fill="#78716c" text-anchor="middle">項目 16</text>

  <!-- Row 3 (y=236) -->
  <rect x="28" y="236" width="744" height="54" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="236" width="6" height="54" rx="2" fill="#2563eb"/>
  <circle cx="66" cy="263" r="16" fill="#2563eb" opacity="0.15"/>
  <text x="66" y="269" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="900">三</text>
  <text x="100" y="255" font-size="19" fill="#1e293b" font-weight="700">兒少專業服務品質（項目 17–24）雙版本</text>
  <text x="100" y="278" font-size="15" fill="#57534e">2歲以下（項目17–20）/ 2歲以上（項目21–24），各 32 分，同時安置取平均</text>
  <rect x="660" y="244" width="100" height="38" rx="8" fill="#2563eb" opacity="0.12"/>
  <text x="710" y="263" font-size="18" fill="#2563eb" text-anchor="middle" font-weight="700">32 分</text>
  <text x="710" y="279" font-size="14" fill="#2563eb" text-anchor="middle">8 項</text>

  <!-- Row 4 (y=300) -->
  <rect x="28" y="300" width="744" height="54" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="300" width="6" height="54" rx="2" fill="#57534e"/>
  <circle cx="66" cy="327" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="333" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">四</text>
  <text x="100" y="319" font-size="19" fill="#1e293b" font-weight="700">兒少權益保障（項目 25）</text>
  <text x="100" y="342" font-size="15" fill="#57534e">申訴制度、每月家庭會議、零用金管理，主管機關依輔導查核評分</text>
  <rect x="660" y="308" width="100" height="38" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="710" y="327" font-size="18" fill="#57534e" text-anchor="middle" font-weight="700">2 分</text>
  <text x="710" y="343" font-size="14" fill="#57534e" text-anchor="middle">項目 25</text>

  <!-- Row 5 (y=364) -->
  <rect x="28" y="364" width="744" height="54" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="364" width="6" height="54" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="391" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="397" font-size="16" fill="#a8a29e" text-anchor="middle" font-weight="900">五</text>
  <text x="100" y="383" font-size="19" fill="#1e293b" font-weight="700">資源結合與運用（項目 26）</text>
  <text x="100" y="406" font-size="15" fill="#57534e">6面向各1分：主管機關聯繫、專業協調、資源檔案、社區資源、轉介、志工</text>
  <rect x="660" y="372" width="100" height="38" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="710" y="391" font-size="18" fill="#1e293b" text-anchor="middle" font-weight="700">6 分</text>
  <text x="710" y="407" font-size="14" fill="#57534e" text-anchor="middle">項目 26</text>

  <!-- Row 6 (y=428) -->
  <rect x="28" y="428" width="744" height="30" rx="10" fill="#e8e6de" stroke="#e8e6de" stroke-width="1"/>
  <text x="400" y="448" font-size="16" fill="#57534e" text-anchor="middle">六、專業訓練與服務評估（項目 27–28）── 服務評估 2分 + 個案研討/督導 2分＝共 4 分</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
