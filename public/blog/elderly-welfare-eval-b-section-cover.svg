<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>

  <!-- 右側裝飾區塊 -->
  <rect x="820" y="60" width="320" height="510" rx="20" fill="#e8e6de"/>
  <text x="980" y="220" font-size="160" font-weight="900" fill="#16a34a" text-anchor="middle" >40%</text>
  <text x="980" y="290" font-size="36" fill="#57534e" text-anchor="middle" >最高配分</text>
  <text x="980" y="340" font-size="24" fill="#78716c" text-anchor="middle" >B 區專業照護品質</text>
  <text x="980" y="380" font-size="22" fill="#78716c" text-anchor="middle" >共 31 個評鑑項目</text>

  <!-- 分隔線 -->
  <rect x="60" y="80" width="6" height="420" rx="3" fill="#16a34a"/>

  <!-- 主標題第1行 -->
  <text x="90" y="180" font-size="100" font-weight="900" fill="#1e293b" >B 區專業</text>
  <!-- 主標題第2行 -->
  <text x="90" y="290" font-size="100" font-weight="900" fill="#16a34a" >照護品質</text>
  <!-- 主標題第3行 -->
  <text x="90" y="380" font-size="80" font-weight="900" fill="#1e293b" >31 項深度解析</text>

  <!-- 副標題 -->
  <text x="90" y="430" font-size="32" fill="#57534e" >評鑑配分 40%，分職類攻破最高配分區塊</text>

  <!-- Pill 標籤 -->
  <rect x="90" y="460" width="150" height="40" rx="20" fill="#16a34a"/>
  <text x="165" y="486" font-size="18" fill="white" text-anchor="middle" >社工 B1-B8</text>

  <rect x="252" y="460" width="160" height="40" rx="20" fill="#16a34a" fill-opacity="0.8"/>
  <text x="332" y="486" font-size="18" fill="white" text-anchor="middle" >護理 B9-B24</text>

  <rect x="424" y="460" width="160" height="40" rx="20" fill="#16a34a" fill-opacity="0.6"/>
  <text x="504" y="486" font-size="18" fill="white" text-anchor="middle" >照服 B25-B27</text>

  <rect x="596" y="460" width="160" height="40" rx="20" fill="#d97706"/>
  <text x="676" y="486" font-size="18" fill="white" text-anchor="middle" >AI 報告輔助</text>

  <!-- 浮水印 -->
  <text x="1140" y="590" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400" >報告汪 reportwang.com</text>
</svg>
