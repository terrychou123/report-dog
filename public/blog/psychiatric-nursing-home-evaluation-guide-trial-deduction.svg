<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <text x="40" y="48" font-size="32" font-weight="bold" fill="#1e293b" >兩大試扣分項目完整說明</text>
  <text x="40" y="78" font-size="22" fill="#57534e" >未達C級即視為不合格，準備時需優先確認</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#dedad3" stroke-width="2"/>

  <!-- 行1 A2.2 -->
  <rect x="30" y="120" width="8" height="155" rx="4" fill="#d97706"/>
  <rect x="46" y="120" width="714" height="155" rx="10" fill="white" opacity="0.75"/>
  <rect x="46" y="120" width="714" height="6" rx="3" fill="#d97706"/>
  <!-- 試扣分標籤 -->
  <rect x="580" y="132" width="160" height="34" rx="17" fill="#d97706"/>
  <text x="660" y="154" font-size="16" fill="white" text-anchor="middle" >試扣分 A2.2</text>
  <text x="70" y="158" font-size="22" font-weight="bold" fill="#d97706" >A2.2 人員設置</text>
  <text x="70" y="190" font-size="17" fill="#1e293b" >護理人員24小時在班、職能治療師、臨床心理師配置合規</text>
  <text x="70" y="218" font-size="15" fill="#57534e" >每班至少1名護理人員在班（不得以電話待命代替）</text>
  <text x="70" y="242" font-size="15" fill="#57534e" >職能治療師、心理師依床數計算，200床為分界點</text>

  <!-- 行2 C1.1 -->
  <rect x="30" y="295" width="8" height="155" rx="4" fill="#78716c"/>
  <rect x="46" y="295" width="714" height="155" rx="10" fill="white" opacity="0.75"/>
  <rect x="46" y="295" width="714" height="6" rx="3" fill="#78716c"/>
  <!-- 試扣分標籤 -->
  <rect x="580" y="307" width="160" height="34" rx="17" fill="#78716c"/>
  <text x="660" y="329" font-size="16" fill="white" text-anchor="middle" >試扣分 C1.1</text>
  <text x="70" y="333" font-size="22" font-weight="bold" fill="#78716c" >C1.1 疏散避難</text>
  <text x="70" y="365" font-size="17" fill="#1e293b" >各樓層2個以上不同方向等待救接空間、防火門規定</text>
  <text x="70" y="393" font-size="15" fill="#57534e" >每層樓須有2個以上、不同方向的等待救接空間</text>
  <text x="70" y="417" font-size="15" fill="#57534e" >防火門、緊急廣播系統、安全疏散圖均需合規</text>

  <!-- 品牌浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" >報告汪 reportwang.com</text>
</svg>
