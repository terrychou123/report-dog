<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Noto Sans TC', sans-serif">
  <!-- @template: flow -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- Header -->
  <rect x="28" y="16" width="744" height="60" rx="12" fill="#78716c"/>
  <text x="400" y="53"  font-size="20" fill="white" font-weight="700" text-anchor="middle">多人協作工作流程</text>

  <!-- N=3 flow: Cards x=129,315,501 cx=214,400,586 y=108 h=342 -->
  <!-- Card 1: 資料收集 -->
  <rect x="129" y="108" width="170" height="342" rx="14" fill="white"/>
  <rect x="129" y="108" width="170" height="8" rx="7" fill="#d97706"/>
  <text x="214" y="155"  font-size="28" fill="#d97706" text-anchor="middle" font-weight="900">STEP 1</text>
  <text x="214" y="180"  font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">分頭收集資料</text>
  <line x1="149" y1="196" x2="279" y2="196" stroke="#e2e0d8" stroke-width="1"/>
  <text x="214" y="220"  font-size="14" fill="#57534e" text-anchor="middle">社工整理個案計畫</text>
  <text x="214" y="240"  font-size="14" fill="#57534e" text-anchor="middle">追蹤紀錄</text>
  <text x="214" y="270"  font-size="14" fill="#57534e" text-anchor="middle">生輔員彙整</text>
  <text x="214" y="290"  font-size="14" fill="#57534e" text-anchor="middle">日誌交班文件</text>
  <text x="214" y="320"  font-size="14" fill="#57534e" text-anchor="middle">行政備齊</text>
  <text x="214" y="340"  font-size="14" fill="#57534e" text-anchor="middle">人事財務紀錄</text>
  <text x="214" y="370"  font-size="14" fill="#57534e" text-anchor="middle">督導準備</text>
  <text x="214" y="390"  font-size="14" fill="#57534e" text-anchor="middle">督導研討紀錄</text>
  <text x="214" y="420"  font-size="14" fill="#d97706" text-anchor="middle">各自負責領域</text>

  <!-- Arrow 1 -->
  <polygon points="303,279 316,272 316,286" fill="#d97706"/>
  <line x1="299" y1="279" x2="315" y2="279" stroke="#d97706" stroke-width="2"/>

  <!-- Card 2: 彙整審核 -->
  <rect x="315" y="108" width="170" height="342" rx="14" fill="white"/>
  <rect x="315" y="108" width="170" height="8" rx="7" fill="#78716c"/>
  <text x="400" y="155"  font-size="28" fill="#78716c" text-anchor="middle" font-weight="900">STEP 2</text>
  <text x="400" y="180"  font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">督導審核彙整</text>
  <line x1="335" y1="196" x2="465" y2="196" stroke="#e2e0d8" stroke-width="1"/>
  <text x="400" y="220"  font-size="14" fill="#57534e" text-anchor="middle">使用報告汪</text>
  <text x="400" y="240"  font-size="14" fill="#57534e" text-anchor="middle">標籤統整文件</text>
  <text x="400" y="270"  font-size="14" fill="#57534e" text-anchor="middle">AI 掃描缺漏</text>
  <text x="400" y="290"  font-size="14" fill="#57534e" text-anchor="middle">自動標記問題</text>
  <text x="400" y="320"  font-size="14" fill="#57534e" text-anchor="middle">跨角色即時</text>
  <text x="400" y="340"  font-size="14" fill="#57534e" text-anchor="middle">協作補件</text>
  <text x="400" y="370"  font-size="14" fill="#57534e" text-anchor="middle">主管逐項</text>
  <text x="400" y="390"  font-size="14" fill="#57534e" text-anchor="middle">確認簽核</text>
  <text x="400" y="420"  font-size="14" fill="#78716c" text-anchor="middle">雲端即時協作</text>

  <!-- Arrow 2 -->
  <polygon points="489,279 502,272 502,286" fill="#78716c"/>
  <line x1="485" y1="279" x2="501" y2="279" stroke="#78716c" stroke-width="2"/>

  <!-- Card 3: 模擬演練 -->
  <rect x="501" y="108" width="170" height="342" rx="14" fill="white"/>
  <rect x="501" y="108" width="170" height="8" rx="7" fill="#94a3b8"/>
  <text x="586" y="155"  font-size="28" fill="#94a3b8" text-anchor="middle" font-weight="900">STEP 3</text>
  <text x="586" y="180"  font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">全員模擬演練</text>
  <line x1="521" y1="196" x2="651" y2="196" stroke="#e2e0d8" stroke-width="1"/>
  <text x="586" y="220"  font-size="14" fill="#57534e" text-anchor="middle">全員參與</text>
  <text x="586" y="240"  font-size="14" fill="#57534e" text-anchor="middle">分工演練現場</text>
  <text x="586" y="270"  font-size="14" fill="#57534e" text-anchor="middle">角色認領</text>
  <text x="586" y="290"  font-size="14" fill="#57534e" text-anchor="middle">訪談問題回應</text>
  <text x="586" y="320"  font-size="14" fill="#57534e" text-anchor="middle">文件定位</text>
  <text x="586" y="340"  font-size="14" fill="#57534e" text-anchor="middle">快速檢索練習</text>
  <text x="586" y="370"  font-size="14" fill="#57534e" text-anchor="middle">最終確認</text>
  <text x="586" y="390"  font-size="14" fill="#57534e" text-anchor="middle">準備完成</text>
  <text x="586" y="420"  font-size="14" fill="#94a3b8" text-anchor="middle">評鑑前 1 個月</text>

  <!-- Watermark -->
  <text x="760" y="480"  font-size="16" fill="#d97706" text-anchor="end">報告汪 reportwang.com</text>
