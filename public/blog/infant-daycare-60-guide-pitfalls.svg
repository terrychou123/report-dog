<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- Header（y=29, h=60）-->
  <rect x="0" y="29" width="800" height="60" fill="white"/>
  <rect x="0" y="29" width="6" height="60" fill="#dc2626"/>
  <text x="28" y="68" font-size="36" fill="#1e293b" font-weight="700">五大常見缺失 一次看清</text>

  <!-- Row 0：廚工體檢週期錯誤（y=118）#d97706 -->
  <rect x="28" y="118" width="744" height="60" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="118" width="6" height="60" rx="2" fill="#d97706"/>
  <circle cx="66" cy="148" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="154" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <text x="100" y="145" font-size="20" fill="#1e293b" font-weight="700">廚工體檢週期搞錯</text>
  <text x="100" y="166" font-size="16" fill="#57534e">廚工須每年體檢1次，其他工作人員每2年1次，兩者不同，常被混淆（第1項）</text>
  <rect x="620" y="126" width="136" height="44" rx="8" fill="#dc2626" opacity="0.10"/>
  <text x="688" y="142" font-size="16" fill="#dc2626" text-anchor="middle">高頻缺失</text>
  <text x="688" y="162" font-size="16" fill="#dc2626" text-anchor="middle">第1項</text>

  <!-- Row 1：1歲以內使用枕頭（y=191）#78716c -->
  <rect x="28" y="191" width="744" height="60" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="191" width="6" height="60" rx="2" fill="#78716c"/>
  <circle cx="66" cy="221" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="227" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <text x="100" y="218" font-size="20" fill="#1e293b" font-weight="700">1歲以內嬰兒使用枕頭</text>
  <text x="100" y="239" font-size="16" fill="#57534e">1歲以內應保持仰睡姿勢且不使用枕頭，是防窒息的基本規範（第55項）</text>
  <rect x="620" y="199" width="136" height="44" rx="8" fill="#dc2626" opacity="0.10"/>
  <text x="688" y="215" font-size="16" fill="#dc2626" text-anchor="middle">安全缺失</text>
  <text x="688" y="235" font-size="16" fill="#dc2626" text-anchor="middle">第55項</text>

  <!-- Row 2：寶寶日誌未每日記錄（y=264）#57534e -->
  <rect x="28" y="264" width="744" height="60" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="264" width="6" height="60" rx="2" fill="#57534e"/>
  <circle cx="66" cy="294" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="300" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <text x="100" y="291" font-size="20" fill="#1e293b" font-weight="700">寶寶日誌未每日記錄</text>
  <text x="100" y="312" font-size="16" fill="#57534e">每日應與嬰幼兒家庭保持聯繫，內容含個別嬰幼兒成長與發展表現（第35項）</text>
  <rect x="620" y="272" width="136" height="44" rx="8" fill="#dc2626" opacity="0.10"/>
  <text x="688" y="288" font-size="16" fill="#dc2626" text-anchor="middle">文書缺失</text>
  <text x="688" y="308" font-size="16" fill="#dc2626" text-anchor="middle">第35項</text>

  <!-- Row 3：食物樣品保存不當（y=337）#a8a29e -->
  <rect x="28" y="337" width="744" height="60" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="337" width="6" height="60" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="367" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="373" font-size="16" fill="#a8a29e" text-anchor="middle" font-weight="900">4</text>
  <text x="100" y="364" font-size="20" fill="#1e293b" font-weight="700">食物樣品保存不當</text>
  <text x="100" y="385" font-size="16" fill="#57534e">食物樣品需密封、日期標示清楚、置於冰箱冷藏7°C以下保存48小時（第44項）</text>
  <rect x="620" y="345" width="136" height="44" rx="8" fill="#dc2626" opacity="0.10"/>
  <text x="688" y="361" font-size="16" fill="#dc2626" text-anchor="middle">衛生缺失</text>
  <text x="688" y="381" font-size="16" fill="#dc2626" text-anchor="middle">第44項</text>

  <!-- Row 4：感染管制手冊未更新（y=410）#94a3b8 -->
  <rect x="28" y="410" width="744" height="60" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="410" width="6" height="60" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="440" r="16" fill="#94a3b8" opacity="0.15"/>
  <text x="66" y="446" font-size="16" fill="#94a3b8" text-anchor="middle" font-weight="900">5</text>
  <text x="100" y="437" font-size="20" fill="#1e293b" font-weight="700">感染管制手冊未更新</text>
  <text x="100" y="458" font-size="16" fill="#57534e">需依衛生福利部疾管署公告最新版「托嬰中心感染管制手冊」修訂（第60項）</text>
  <rect x="620" y="418" width="136" height="44" rx="8" fill="#dc2626" opacity="0.10"/>
  <text x="688" y="434" font-size="16" fill="#dc2626" text-anchor="middle">制度缺失</text>
  <text x="688" y="454" font-size="16" fill="#dc2626" text-anchor="middle">第60項</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
