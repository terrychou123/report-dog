<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- @template: timeline -->
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">評鑑準備三階段時間軸</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">從 3 個月前到評鑑當天的行動清單</text>
  <line x1="28" y1="94" x2="772" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- 時間軸主線 -->
  <line x1="60" y1="272" x2="736" y2="272" stroke="#a8a29e" stroke-width="4"/>
  <polygon points="736,265 736,279 752,272" fill="#a8a29e"/>

  <!-- 節點1：評鑑前3個月（上方，cx=152） -->
  <!-- W標籤（上） -->
  <rect x="118" y="222" width="68" height="22" rx="11" fill="#d97706"/>
  <text x="152" y="237" text-anchor="middle" font-size="14" fill="white" font-weight="700">T-3月</text>
  <!-- 大圓 -->
  <circle cx="152" cy="272" r="24" fill="#d97706" opacity="0.15"/>
  <text x="152" y="280" text-anchor="middle" font-size="20" fill="white" font-weight="700">1</text>
  <!-- 虛線 -->
  <line x1="152" y1="296" x2="152" y2="350" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- 卡片（下） -->
  <rect x="92" y="350" width="120" height="100" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="92" y="442" width="120" height="8" rx="4" fill="#d97706"/>
  <rect x="92" y="438" width="120" height="4" fill="#d97706"/>
  <text x="152" y="381" text-anchor="middle" font-size="20" fill="#1e293b" font-weight="700">自我評估</text>
  <text x="152" y="403" text-anchor="middle" font-size="15" fill="#57534e">下載自評表</text>
  <text x="152" y="421" text-anchor="middle" font-size="15" fill="#57534e">找出缺失區塊</text>

  <!-- 節點2：評鑑前2個月（下方，cx=306） -->
  <!-- W標籤（下） -->
  <rect x="272" y="300" width="68" height="22" rx="11" fill="#78716c"/>
  <text x="306" y="315" text-anchor="middle" font-size="14" fill="white" font-weight="700">T-2月</text>
  <!-- 大圓 -->
  <circle cx="306" cy="272" r="24" fill="#78716c" opacity="0.15"/>
  <text x="306" y="280" text-anchor="middle" font-size="20" fill="white" font-weight="700">2</text>
  <!-- 虛線 -->
  <line x1="306" y1="248" x2="306" y2="208" stroke="#78716c" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- 卡片（上） -->
  <rect x="246" y="108" width="120" height="100" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="246" y="108" width="120" height="8" rx="4" fill="#78716c"/>
  <rect x="246" y="112" width="120" height="4" fill="#78716c"/>
  <text x="306" y="139" text-anchor="middle" font-size="20" fill="#1e293b" font-weight="700">文件補齊</text>
  <text x="306" y="161" text-anchor="middle" font-size="15" fill="#57534e">啟動文件</text>
  <text x="306" y="179" text-anchor="middle" font-size="15" fill="#57534e">補齊作業</text>

  <!-- 節點3：評鑑前1個月（上方，cx=460） -->
  <!-- W標籤（上） -->
  <rect x="426" y="222" width="68" height="22" rx="11" fill="#57534e"/>
  <text x="460" y="237" text-anchor="middle" font-size="14" fill="white" font-weight="700">T-1月</text>
  <!-- 大圓 -->
  <circle cx="460" cy="272" r="24" fill="#57534e" opacity="0.15"/>
  <text x="460" y="280" text-anchor="middle" font-size="20" fill="white" font-weight="700">3</text>
  <!-- 虛線 -->
  <line x1="460" y1="296" x2="460" y2="350" stroke="#57534e" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- 卡片（下） -->
  <rect x="400" y="350" width="120" height="100" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="400" y="442" width="120" height="8" rx="4" fill="#57534e"/>
  <rect x="400" y="438" width="120" height="4" fill="#57534e"/>
  <text x="460" y="381" text-anchor="middle" font-size="20" fill="#1e293b" font-weight="700">模擬演練</text>
  <text x="460" y="403" text-anchor="middle" font-size="15" fill="#57534e">整理個案紀錄</text>
  <text x="460" y="421" text-anchor="middle" font-size="15" fill="#57534e">模擬委員訪談</text>

  <!-- 節點4：評鑑前1週（下方，cx=614） -->
  <!-- W標籤（下） -->
  <rect x="580" y="300" width="68" height="22" rx="11" fill="#a8a29e"/>
  <text x="614" y="315" text-anchor="middle" font-size="14" fill="white" font-weight="700">T-1週</text>
  <!-- 大圓 -->
  <circle cx="614" cy="272" r="24" fill="#a8a29e" opacity="0.15"/>
  <text x="614" y="280" text-anchor="middle" font-size="20" fill="white" font-weight="700">4</text>
  <!-- 虛線 -->
  <line x1="614" y1="248" x2="614" y2="208" stroke="#a8a29e" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- 卡片（上） -->
  <rect x="554" y="108" width="120" height="100" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="554" y="108" width="120" height="8" rx="4" fill="#a8a29e"/>
  <rect x="554" y="112" width="120" height="4" fill="#a8a29e"/>
  <text x="614" y="139" text-anchor="middle" font-size="20" fill="#1e293b" font-weight="700">最終確認</text>
  <text x="614" y="161" text-anchor="middle" font-size="15" fill="#57534e">文件索引</text>
  <text x="614" y="179" text-anchor="middle" font-size="15" fill="#57534e">整理文件盒</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
