<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#fafaf9"/>

  <!-- 標題區塊 -->
  <rect x="0" y="0" width="800" height="80" fill="#1c1917"/>
  <text x="400" y="35"  font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">WHO手術安全查核表三大時間點</text>
  <text x="400" y="60"  font-size="13" fill="#a8a29e" text-anchor="middle">Sign In → Time Out → Sign Out，完整執行有書面紀錄</text>

  <!-- 步驟1：Sign In -->
  <rect x="129" y="110" width="170" height="300" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <rect x="129" y="110" width="170" height="8" rx="4" fill="#d97706"/>
  <!-- 步驟標號 -->
  <rect x="194" y="100" width="40" height="20" rx="10" fill="#d97706"/>
  <text x="214" y="114"  font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">STEP 01</text>
  <!-- 標題 -->
  <text x="214" y="155"  font-size="17" font-weight="900" fill="#d97706" text-anchor="middle">Sign In</text>
  <text x="214" y="178"  font-size="13" fill="#44403c" text-anchor="middle">麻醉誘導前</text>
  <!-- 分隔線 -->
  <rect x="149" y="192" width="130" height="1.5" fill="#e8e6de"/>
  <!-- 內容 -->
  <text x="214" y="215"  font-size="12" fill="#57534e" text-anchor="middle">確認病人身分</text>
  <text x="214" y="235"  font-size="12" fill="#57534e" text-anchor="middle">手術部位標示</text>
  <text x="214" y="255"  font-size="12" fill="#57534e" text-anchor="middle">麻醉機安全確認</text>
  <!-- Pill -->
  <rect x="164" y="368" width="100" height="26" rx="13" fill="#fef3c7"/>
  <text x="214" y="385"  font-size="12" fill="#d97706" text-anchor="middle">麻醉前</text>

  <!-- 箭頭1 -->
  <line x1="299" y1="260" x2="357" y2="260" stroke="#9333ea" stroke-width="2.5" stroke-dasharray="5,3"/>
  <polygon points="357,254 371,260 357,266" fill="#9333ea"/>

  <!-- 步驟2：Time Out -->
  <rect x="315" y="110" width="170" height="300" rx="12" fill="#ffffff" stroke="#9333ea" stroke-width="2.5"/>
  <rect x="315" y="110" width="170" height="8" rx="4" fill="#9333ea"/>
  <!-- 步驟標號 -->
  <rect x="380" y="100" width="40" height="20" rx="10" fill="#9333ea"/>
  <text x="400" y="114"  font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">STEP 02</text>
  <!-- 標題 -->
  <text x="400" y="155"  font-size="17" font-weight="900" fill="#9333ea" text-anchor="middle">Time Out</text>
  <text x="400" y="178"  font-size="13" fill="#44403c" text-anchor="middle">切皮前暫停</text>
  <!-- 分隔線 -->
  <rect x="335" y="192" width="130" height="1.5" fill="#e8e6de"/>
  <!-- 內容 -->
  <text x="400" y="215"  font-size="12" fill="#57534e" text-anchor="middle">全員確認：病人</text>
  <text x="400" y="235"  font-size="12" fill="#57534e" text-anchor="middle">手術 / 部位 / 備血</text>
  <text x="400" y="255"  font-size="12" fill="#57534e" text-anchor="middle">預防性抗生素</text>
  <!-- Pill -->
  <rect x="350" y="368" width="100" height="26" rx="13" fill="#f5f0ff"/>
  <text x="400" y="385"  font-size="12" fill="#9333ea" text-anchor="middle">切皮前</text>

  <!-- 箭頭2 -->
  <line x1="485" y1="260" x2="543" y2="260" stroke="#78716c" stroke-width="2.5" stroke-dasharray="5,3"/>
  <polygon points="543,254 557,260 543,266" fill="#78716c"/>

  <!-- 步驟3：Sign Out -->
  <rect x="501" y="110" width="170" height="300" rx="12" fill="#ffffff" stroke="#57534e" stroke-width="2"/>
  <rect x="501" y="110" width="170" height="8" rx="4" fill="#57534e"/>
  <!-- 步驟標號 -->
  <rect x="566" y="100" width="40" height="20" rx="10" fill="#57534e"/>
  <text x="586" y="114"  font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">STEP 03</text>
  <!-- 標題 -->
  <text x="586" y="155"  font-size="17" font-weight="900" fill="#57534e" text-anchor="middle">Sign Out</text>
  <text x="586" y="178"  font-size="13" fill="#44403c" text-anchor="middle">離開手術室前</text>
  <!-- 分隔線 -->
  <rect x="521" y="192" width="130" height="1.5" fill="#e8e6de"/>
  <!-- 內容 -->
  <text x="586" y="215"  font-size="12" fill="#57534e" text-anchor="middle">器械紗布點數</text>
  <text x="586" y="235"  font-size="12" fill="#57534e" text-anchor="middle">手術名稱確認</text>
  <text x="586" y="255"  font-size="12" fill="#57534e" text-anchor="middle">標本送檢確認</text>
  <!-- Pill -->
  <rect x="536" y="368" width="100" height="26" rx="13" fill="#f5f5f4"/>
  <text x="586" y="385"  font-size="12" fill="#57534e" text-anchor="middle">離室前</text>

  <!-- 浮水印 -->
  <text x="400" y="480"  font-size="11" fill="#a8a29e" text-anchor="middle" opacity="0.6">報告汪 reportwang.com</text>
</svg>
