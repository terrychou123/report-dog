<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#fafaf9"/>

  <!-- 標題區塊 -->
  <rect x="0" y="0" width="800" height="80" fill="#1c1917"/>
  <text x="400" y="35"  font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">麻醉前評估四大要件（2.6.2）</text>
  <text x="400" y="60"  font-size="13" fill="#a8a29e" text-anchor="middle">評鑑方式：資料查核 | 擇期手術須術前完成麻醉科醫師評估</text>

  <!-- 列1：病史與身體評估 -->
  <rect x="40" y="100" width="720" height="75" rx="12" fill="#ffffff" stroke="#e8e6de" stroke-width="1.5"/>
  <rect x="40" y="100" width="6" height="75" rx="2" fill="#d97706"/>
  <circle cx="80" cy="137" r="20" fill="#fef3c7"/>
  <text x="80" y="142"  font-size="16" font-weight="900" fill="#d97706" text-anchor="middle">1</text>
  <text x="115" y="125"  font-size="15" font-weight="700" fill="#1c1917">病史與身體評估</text>
  <text x="115" y="147"  font-size="12" fill="#57534e">完整病史收集（心肺功能、過去麻醉史、藥物過敏）、身體評估有書面紀錄</text>
  <text x="115" y="163"  font-size="11" fill="#78716c">評估紀錄須由麻醉科醫師親自完成並簽名，不可由護理師或實習醫師代勞</text>
  <rect x="670" y="118" width="72" height="26" rx="6" fill="#fef3c7"/>
  <text x="706" y="135"  font-size="12" fill="#d97706" text-anchor="middle">術前評估</text>

  <!-- 列2：ASA麻醉風險分級 -->
  <rect x="40" y="190" width="720" height="75" rx="12" fill="#ffffff" stroke="#e8e6de" stroke-width="1.5"/>
  <rect x="40" y="190" width="6" height="75" rx="2" fill="#78716c"/>
  <circle cx="80" cy="227" r="20" fill="#f5f5f4"/>
  <text x="80" y="232"  font-size="16" font-weight="900" fill="#78716c" text-anchor="middle">2</text>
  <text x="115" y="215"  font-size="15" font-weight="700" fill="#1c1917">ASA麻醉風險分級</text>
  <text x="115" y="237"  font-size="12" fill="#57534e">ASA I-VI級評估記載，高風險（ASA III以上）病人有適當術前處置計畫</text>
  <text x="115" y="253"  font-size="11" fill="#78716c">ASA分級需明確記錄於麻醉前評估單，評鑑委員抽查紀錄完整性</text>
  <rect x="670" y="208" width="72" height="26" rx="6" fill="#f5f5f4"/>
  <text x="706" y="225"  font-size="12" fill="#78716c" text-anchor="middle">風險分級</text>

  <!-- 列3：高風險病人處置 -->
  <rect x="40" y="280" width="720" height="75" rx="12" fill="#ffffff" stroke="#e8e6de" stroke-width="1.5"/>
  <rect x="40" y="280" width="6" height="75" rx="2" fill="#57534e"/>
  <circle cx="80" cy="317" r="20" fill="#f5f5f4"/>
  <text x="80" y="322"  font-size="16" font-weight="900" fill="#57534e" text-anchor="middle">3</text>
  <text x="115" y="305"  font-size="15" font-weight="700" fill="#1c1917">高風險病人處置</text>
  <text x="115" y="327"  font-size="12" fill="#57534e">術前會診、優化慢性病控制、特殊監測計畫，有處置紀錄</text>
  <text x="115" y="343"  font-size="11" fill="#78716c">高風險病人須有具體術前優化措施（如心臟科會診意見、血糖控制紀錄）</text>
  <rect x="670" y="298" width="72" height="26" rx="6" fill="#f5f5f4"/>
  <text x="706" y="315"  font-size="12" fill="#57534e" text-anchor="middle">高風險管理</text>

  <!-- 列4：麻醉知情同意 -->
  <rect x="40" y="370" width="720" height="75" rx="12" fill="#ffffff" stroke="#e8e6de" stroke-width="1.5"/>
  <rect x="40" y="370" width="6" height="75" rx="2" fill="#a8a29e"/>
  <circle cx="80" cy="407" r="20" fill="#fafaf9" stroke="#d6d3d1" stroke-width="1"/>
  <text x="80" y="412"  font-size="16" font-weight="900" fill="#a8a29e" text-anchor="middle">4</text>
  <text x="115" y="395"  font-size="15" font-weight="700" fill="#1c1917">麻醉知情同意</text>
  <text x="115" y="417"  font-size="12" fill="#57534e">術前取得病人/家屬書面知情同意，說明麻醉方式、風險及替代方案</text>
  <text x="115" y="433"  font-size="11" fill="#78716c">同意書需完整填寫、簽名、日期，且須在手術前完成（非手術當天才簽）</text>
  <rect x="670" y="388" width="72" height="26" rx="6" fill="#fafaf9" stroke="#d6d3d1" stroke-width="1"/>
  <text x="706" y="405"  font-size="12" fill="#a8a29e" text-anchor="middle">知情同意</text>

  <!-- 浮水印 -->
  <text x="400" y="480"  font-size="11" fill="#a8a29e" text-anchor="middle" opacity="0.6">報告汪 reportwang.com</text>
</svg>
