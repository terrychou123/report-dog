  <text x="400" y="345" font-size="12" fill="#a8a29e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">評鑑前</text>
  <text x="400" y="366" font-size="12" fill="#a8a29e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">4-6 週執行期</text>
  <text x="400" y="400" font-size="12" fill="#78716c" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-weight="700">各角色文件</text>
  <text x="400" y="420" font-size="12" fill="#78716c" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-weight="700">獨立備妥</text>
  <!-- 箭頭 2 -->
  <polygon points="489,258 511,270 489,282" fill="#78716c"/>
  <line x1="485" y1="270" x2="501" y2="270" stroke="#78716c" stroke-width="2"/>
  <!-- 卡片 3 -->
  <rect x="501" y="108" width="170" height="342" rx="12" fill="white" stroke="#57534e" stroke-width="2"/>
  <circle cx="586" cy="108" r="43" fill="#57534e"/>
  <text x="586" y="100" font-size="28" fill="white" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-weight="900">03</text>
  <text x="586" y="125" font-size="13" fill="white" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">STEP</text>
  <text x="586" y="190" font-size="20" fill="#57534e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-weight="700">統一彙整</text>
  <text x="586" y="225" font-size="13" fill="#57534e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">負責人統整</text>
  <text x="586" y="248" font-size="13" fill="#57534e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">所有文件資料</text>
  <text x="586" y="280" font-size="13" fill="#78716c" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">模擬訪談演練</text>
