  <text x="400" y="190" font-size="20" fill="#78716c" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-weight="700">各自準備</text>
  <text x="400" y="225" font-size="13" fill="#57534e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">各角色依清單</text>
  <text x="400" y="248" font-size="13" fill="#57534e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">準備負責文件</text>
  <text x="400" y="280" font-size="13" fill="#78716c" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">每週進度回報</text>
