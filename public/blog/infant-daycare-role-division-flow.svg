<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- 主標題 -->
  <text x="400" y="48" font-size="24" fill="#1e293b" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-weight="900">評鑑準備協作三步驟</text>
  <!-- 副標 -->
  <text x="400" y="78" font-size="16" fill="#78716c" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">分工啟動 &#8594; 各自準備 &#8594; 統一彙整</text>
  <!-- 分隔線 -->
  <line x1="80" y1="94" x2="720" y2="94" stroke="#e8e6de" stroke-width="2"/>
  <!-- 卡片 1 -->
  <rect x="129" y="108" width="170" height="342" rx="12" fill="white" stroke="#d97706" stroke-width="2"/>
  <circle cx="214" cy="108" r="43" fill="#d97706"/>
  <text x="214" y="100" font-size="28" fill="white" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-weight="900">01</text>
  <text x="214" y="125" font-size="13" fill="white" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">STEP</text>
  <text x="214" y="190" font-size="20" fill="#d97706" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-weight="700">分工啟動</text>
  <text x="214" y="225" font-size="13" fill="#57534e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">負責人召集會議</text>
  <text x="214" y="248" font-size="13" fill="#57534e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">說明評鑑範圍</text>
