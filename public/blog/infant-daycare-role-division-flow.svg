  <text x="214" y="345" font-size="12" fill="#a8a29e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">收到評鑑通知</text>
  <text x="214" y="366" font-size="12" fill="#a8a29e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">後 1 週內完成</text>
  <text x="214" y="400" font-size="12" fill="#d97706" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-weight="700">啟動清單</text>
  <text x="214" y="420" font-size="12" fill="#d97706" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-weight="700">分工表格</text>
  <!-- 箭頭 1 -->
  <polygon points="303,258 325,270 303,282" fill="#d97706"/>
  <line x1="299" y1="270" x2="315" y2="270" stroke="#d97706" stroke-width="2"/>
  <!-- 卡片 2 -->
  <rect x="315" y="108" width="170" height="342" rx="12" fill="white" stroke="#78716c" stroke-width="2"/>
  <circle cx="400" cy="108" r="43" fill="#78716c"/>
  <text x="400" y="100" font-size="28" fill="white" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-weight="900">02</text>
