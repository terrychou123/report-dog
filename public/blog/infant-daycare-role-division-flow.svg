  <text x="586" y="345" font-size="12" fill="#a8a29e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">評鑑前</text>
  <text x="586" y="366" font-size="12" fill="#a8a29e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">1-2 週前完成</text>
  <text x="586" y="400" font-size="12" fill="#57534e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-weight="700">完整文件夾</text>
  <text x="586" y="420" font-size="12" fill="#57534e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-weight="700">備妥迎接評鑑</text>
  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" font-family="'Noto Sans TC', sans-serif">報告汪 reportwang.com</text>
