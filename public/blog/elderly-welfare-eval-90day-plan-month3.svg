<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- Header y=50, h=76 -->
  <rect x="30" y="50" width="740" height="76" rx="8" fill="#57534e"/>
  <text x="400" y="84" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="sans-serif">第三個月（第 9-12 週）：模擬衝刺任務</text>
  <text x="400" y="112" font-size="15" fill="#a8a29e" text-anchor="middle" font-family="sans-serif">全員分工、演練整合、缺失修正、最後確認</text>

  <!-- Row1 y=160, h=62 -->
  <rect x="30" y="160" width="740" height="62" rx="6" fill="#ffffff"/>
  <rect x="30" y="160" width="6" height="62" rx="3" fill="#d97706"/>
  <circle cx="66" cy="191" r="16" fill="#d97706"/>
  <text x="66" y="196" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="sans-serif">W9</text>
  <text x="100" y="180" font-size="19" font-weight="700" fill="#1e293b" font-family="sans-serif">第 9 週：全員文件整理，6 大區塊分工確認</text>
  <text x="100" y="200" font-size="15" fill="#57534e" font-family="sans-serif">A/B/C/D 各區負責人確定，文件索引表完成，報告汪協作分工到人</text>
  <rect x="620" y="169" width="136" height="44" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="688" y="188" font-size="13" fill="#d97706" text-anchor="middle" font-family="sans-serif">全體</text>
  <text x="688" y="206" font-size="13" fill="#92400e" text-anchor="middle" font-family="sans-serif">跨部門協作</text>

  <!-- Row2 y=235, h=62 -->
  <rect x="30" y="235" width="740" height="62" rx="6" fill="#ffffff"/>
  <rect x="30" y="235" width="6" height="62" rx="3" fill="#78716c"/>
  <circle cx="66" cy="266" r="16" fill="#78716c"/>
  <text x="66" y="271" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="sans-serif">W10</text>
  <text x="100" y="255" font-size="19" font-weight="700" fill="#1e293b" font-family="sans-serif">第 10 週：第一次模擬評鑑演練（內部自評）</text>
  <text x="100" y="275" font-size="15" fill="#57534e" font-family="sans-serif">依評鑑委員動線走一遍，各單位依評鑑方式提示問答、出示文件</text>
  <rect x="620" y="244" width="136" height="44" rx="6" fill="#f5f5f4" stroke="#78716c" stroke-width="1.5"/>
  <text x="688" y="263" font-size="13" fill="#78716c" text-anchor="middle" font-family="sans-serif">全體</text>
  <text x="688" y="281" font-size="13" fill="#44403c" text-anchor="middle" font-family="sans-serif">模擬演練</text>

  <!-- Row3 y=310, h=62 -->
  <rect x="30" y="310" width="740" height="62" rx="6" fill="#ffffff"/>
  <rect x="30" y="310" width="6" height="62" rx="3" fill="#57534e"/>
  <circle cx="66" cy="341" r="16" fill="#57534e"/>
  <text x="66" y="346" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="sans-serif">W11</text>
  <text x="100" y="330" font-size="19" font-weight="700" fill="#1e293b" font-family="sans-serif">第 11 週：缺失修正，設備測試（C4/C15）</text>
  <text x="100" y="350" font-size="15" fill="#57534e" font-family="sans-serif">依模擬演練缺失清單逐項修正，測試緊急呼叫、監視設備運作正常</text>
  <rect x="620" y="319" width="136" height="44" rx="6" fill="#f0efe8" stroke="#57534e" stroke-width="1.5"/>
  <text x="688" y="338" font-size="13" fill="#57534e" text-anchor="middle" font-family="sans-serif">行政 / 設備</text>
  <text x="688" y="356" font-size="13" fill="#44403c" text-anchor="middle" font-family="sans-serif">缺失修正</text>

  <!-- Row4 y=385, h=62 -->
  <rect x="30" y="385" width="740" height="62" rx="6" fill="#ffffff"/>
  <rect x="30" y="385" width="6" height="62" rx="3" fill="#a8a29e"/>
  <circle cx="66" cy="416" r="16" fill="#a8a29e"/>
  <text x="66" y="421" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="sans-serif">W12</text>
  <text x="100" y="405" font-size="19" font-weight="700" fill="#1e293b" font-family="sans-serif">第 12 週：最後確認，人員備詢演練</text>
  <text x="100" y="425" font-size="15" fill="#57534e" font-family="sans-serif">各崗位人員熟悉問答話術，文件最終歸檔，機構環境整潔確認</text>
  <rect x="620" y="394" width="136" height="44" rx="6" fill="#f5f5f4" stroke="#a8a29e" stroke-width="1.5"/>
  <text x="688" y="413" font-size="13" fill="#78716c" text-anchor="middle" font-family="sans-serif">全體</text>
  <text x="688" y="431" font-size="13" fill="#44403c" text-anchor="middle" font-family="sans-serif">備詢準備</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" font-family="sans-serif">報告汪 reportwang.com</text>
</svg>
