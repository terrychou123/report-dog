<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- Header y=50, h=76 -->
  <rect x="30" y="50" width="740" height="76" rx="8" fill="#57534e"/>
  <text x="400" y="84" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">第三個月（第 9-12 週）：模擬衝刺任務</text>
  <text x="400" y="112" font-size="15" fill="#a8a29e" text-anchor="middle">全員分工、演練整合、缺失修正、最後確認</text>

  <!-- Row1 y=160, h=62 -->
  <rect x="28" y="160" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="160" width="6" height="62" rx="2" fill="#d97706"/>
  <circle cx="66" cy="191" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="197" font-size="16" font-weight="900" fill="#d97706" text-anchor="middle">W9</text>
  <text x="100" y="188" font-size="18" font-weight="700" fill="#1e293b">第 9 週：全員文件整理，6 大區塊分工確認</text>
  <text x="100" y="208" font-size="16" fill="#57534e">A/B/C/D 各區負責人確定，文件索引表完成，報告汪協作分工到人</text>
  <rect x="620" y="168" width="136" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="187" font-size="16" fill="#d97706" text-anchor="middle">全體</text>
  <text x="688" y="207" font-size="16" fill="#d97706" text-anchor="middle">跨部門協作</text>

  <!-- Row2 y=235, h=62 -->
  <rect x="28" y="235" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="235" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="66" cy="266" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="272" font-size="16" font-weight="900" fill="#78716c" text-anchor="middle">W10</text>
  <text x="100" y="263" font-size="18" font-weight="700" fill="#1e293b">第 10 週：第一次模擬評鑑演練（內部自評）</text>
  <text x="100" y="283" font-size="16" fill="#57534e">依評鑑委員動線走一遍，各單位依評鑑方式提示問答、出示文件</text>
  <rect x="620" y="243" width="136" height="46" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="262" font-size="16" fill="#78716c" text-anchor="middle">全體</text>
  <text x="688" y="282" font-size="16" fill="#78716c" text-anchor="middle">模擬演練</text>

  <!-- Row3 y=310, h=62 -->
  <rect x="28" y="310" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="310" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="66" cy="341" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="347" font-size="16" font-weight="900" fill="#57534e" text-anchor="middle">W11</text>
  <text x="100" y="338" font-size="18" font-weight="700" fill="#1e293b">第 11 週：缺失修正，設備測試（C4/C15）</text>
  <text x="100" y="358" font-size="16" fill="#57534e">依模擬演練缺失清單逐項修正，測試緊急呼叫、監視設備運作正常</text>
  <rect x="620" y="318" width="136" height="46" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="337" font-size="16" fill="#57534e" text-anchor="middle">行政 / 設備</text>
  <text x="688" y="357" font-size="16" fill="#57534e" text-anchor="middle">缺失修正</text>

  <!-- Row4 y=385, h=62 -->
  <rect x="28" y="385" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="385" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="416" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="422" font-size="16" font-weight="900" fill="#a8a29e" text-anchor="middle">W12</text>
  <text x="100" y="413" font-size="18" font-weight="700" fill="#1e293b">第 12 週：最後確認，人員備詢演練</text>
  <text x="100" y="433" font-size="16" fill="#57534e">各崗位人員熟悉問答話術，文件最終歸檔，機構環境整潔確認</text>
  <rect x="620" y="393" width="136" height="46" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="412" font-size="16" fill="#a8a29e" text-anchor="middle">全體</text>
  <text x="688" y="432" font-size="16" fill="#a8a29e" text-anchor="middle">備詢準備</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
