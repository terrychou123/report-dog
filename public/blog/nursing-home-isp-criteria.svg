<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- 標題區 -->
  <text x="40" y="48" font-size="32" fill="#1e293b" font-weight="700">ISP 4 大評值時間點</text>
  <text x="40" y="78" font-size="22" fill="#57534e">B2 規定的法定評值週期</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#d97706" stroke-width="2"/>

  <!-- 時間點 1 -->
  <rect x="40" y="115" width="340" height="160" rx="12" fill="#d97706"/>
  <text x="210" y="155" font-size="48" fill="#ffffff" font-weight="700" text-anchor="middle">72hr</text>
  <text x="210" y="188" font-size="20" fill="#ffffff" font-weight="700" text-anchor="middle">入住初評</text>
  <text x="210" y="214" font-size="14" fill="#fef3c7" text-anchor="middle">全面身體、心理、社會評估</text>
  <text x="210" y="236" font-size="14" fill="#fef3c7" text-anchor="middle">跌倒、壓損、營養三大高風險</text>
  <text x="210" y="258" font-size="14" fill="#fef3c7" text-anchor="middle">建立個案資料檔</text>

  <!-- 時間點 2 -->
  <rect x="420" y="115" width="340" height="160" rx="12" fill="#78716c"/>
  <text x="590" y="155" font-size="44" fill="#ffffff" font-weight="700" text-anchor="middle">每3個月</text>
  <text x="590" y="190" font-size="20" fill="#ffffff" font-weight="700" text-anchor="middle">定期評值</text>
  <text x="590" y="214" font-size="14" fill="#e8e6de" text-anchor="middle">身體（含營養）、心理、社會</text>
  <text x="590" y="236" font-size="14" fill="#e8e6de" text-anchor="middle">認知及活動功能評估</text>
  <text x="590" y="258" font-size="14" fill="#e8e6de" text-anchor="middle">安養機構每6個月評估一次</text>

  <!-- 時間點 3 -->
  <rect x="40" y="290" width="340" height="160" rx="12" fill="#57534e"/>
  <text x="210" y="330" font-size="44" fill="#ffffff" font-weight="700" text-anchor="middle">每半年</text>
  <text x="210" y="365" font-size="20" fill="#ffffff" font-weight="700" text-anchor="middle">計畫修正</text>
  <text x="210" y="390" font-size="14" fill="#e8e6de" text-anchor="middle">依評估結果修正照顧計畫</text>
  <text x="210" y="412" font-size="14" fill="#e8e6de" text-anchor="middle">與住民或家屬共同討論確認</text>
  <text x="210" y="434" font-size="14" fill="#e8e6de" text-anchor="middle">修正紀錄須有家屬簽名</text>

  <!-- 時間點 4 -->
  <rect x="420" y="290" width="340" height="160" rx="12" fill="#94a3b8"/>
  <text x="590" y="330" font-size="44" fill="#ffffff" font-weight="700" text-anchor="middle">需要時</text>
  <text x="590" y="365" font-size="20" fill="#1e293b" font-weight="700" text-anchor="middle">隨時調整</text>
  <text x="590" y="390" font-size="14" fill="#1e293b" text-anchor="middle">健康狀況急遽變化</text>
  <text x="590" y="412" font-size="14" fill="#1e293b" text-anchor="middle">入院後返回、住民提出要求</text>
  <text x="590" y="434" font-size="14" fill="#1e293b" text-anchor="middle">須有臨時評值記錄</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
