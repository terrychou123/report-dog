<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- Header -->
  <rect x="0" y="29" width="800" height="60" fill="#e8e6de"/>
  <rect x="0" y="29" width="6" height="60" rx="2" fill="#d97706"/>
  <text x="28" y="74" font-size="30" fill="#1e293b" font-weight="700">護理記錄中呈現 EPDS 的 4 個要素</text>
  <!-- Row 1 y=118 -->
  <rect x="28" y="118" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="118" width="6" height="62" rx="2" fill="#d97706"/>
  <circle cx="66" cy="149" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="155" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">①</text>
  <text x="100" y="146" font-size="20" fill="#1e293b" font-weight="700">分數與第 10 題結果</text>
  <text x="100" y="167" font-size="16" fill="#57534e">記錄 EPDS 總分及第 10 題（自傷念頭）得分</text>
  <rect x="620" y="126" width="136" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="143" font-size="16" fill="#d97706" text-anchor="middle">量化</text>
  <text x="688" y="163" font-size="16" fill="#d97706" text-anchor="middle">數據</text>
  <!-- Row 2 y=191 -->
  <rect x="28" y="191" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="191" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="66" cy="221" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="227" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">②</text>
  <text x="100" y="218" font-size="20" fill="#1e293b" font-weight="700">護理師判讀結論</text>
  <text x="100" y="239" font-size="16" fill="#57534e">說明分數對應的憂鬱程度判讀（如無明顯症狀）</text>
  <rect x="620" y="199" width="136" height="46" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="216" font-size="16" fill="#78716c" text-anchor="middle">臨床</text>
  <text x="688" y="236" font-size="16" fill="#78716c" text-anchor="middle">判斷</text>
  <!-- Row 3 y=264 -->
  <rect x="28" y="264" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="264" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="66" cy="294" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="300" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">③</text>
  <text x="100" y="291" font-size="20" fill="#1e293b" font-weight="700">個案情緒背景說明</text>
  <text x="100" y="312" font-size="16" fill="#57534e">記錄產婦主訴、家屬支持狀況等情境描述</text>
  <rect x="620" y="272" width="136" height="46" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="289" font-size="16" fill="#57534e" text-anchor="middle">情境</text>
  <text x="688" y="309" font-size="16" fill="#57534e" text-anchor="middle">脈絡</text>
  <!-- Row 4 y=337 -->
  <rect x="28" y="337" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="337" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="367" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="373" font-size="16" fill="#a8a29e" text-anchor="middle" font-weight="900">④</text>
  <text x="100" y="364" font-size="20" fill="#1e293b" font-weight="700">後續追蹤計畫</text>
  <text x="100" y="385" font-size="16" fill="#57534e">說明後續護理行動，如出院前再評估或轉介計畫</text>
  <rect x="620" y="345" width="136" height="46" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="362" font-size="16" fill="#a8a29e" text-anchor="middle">追蹤</text>
  <text x="688" y="382" font-size="16" fill="#a8a29e" text-anchor="middle">計畫</text>
  <!-- Watermark -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
