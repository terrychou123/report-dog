<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 右側裝飾區塊 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>

  <!-- 右側裝飾大數字 "77" -->
  <text x="1010" y="220" font-size="170" font-weight="900" fill="#d97706" text-anchor="middle" opacity="0.85">77</text>
  <text x="1010" y="260" font-size="26" fill="#78716c" text-anchor="middle" font-weight="600">項評鑑基準</text>

  <!-- 右側 6 區塊卡片 (3 rows × 2 cols) -->
  <!-- Row 1: A管 + B專 -->
  <rect x="840" y="282" width="148" height="70" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="914" y="316" font-size="22" fill="#ea580c" text-anchor="middle" font-weight="700">A 管理</text>
  <text x="914" y="340" font-size="17" fill="#a8a29e" text-anchor="middle">15 項 · 20%</text>

  <rect x="1002" y="282" width="148" height="70" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="1076" y="316" font-size="22" fill="#16a34a" text-anchor="middle" font-weight="700">B 照護</text>
  <text x="1076" y="340" font-size="17" fill="#a8a29e" text-anchor="middle">31 項 · 40%</text>

  <!-- Row 2: C安 + D權 -->
  <rect x="840" y="362" width="148" height="70" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="914" y="396" font-size="22" fill="#0d9488" text-anchor="middle" font-weight="700">C 安全</text>
  <text x="914" y="420" font-size="17" fill="#a8a29e" text-anchor="middle">16 項 · 25%</text>

  <rect x="1002" y="362" width="148" height="70" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="1076" y="396" font-size="22" fill="#2563eb" text-anchor="middle" font-weight="700">D 權益</text>
  <text x="1076" y="420" font-size="17" fill="#a8a29e" text-anchor="middle">9 項 · 13%</text>

  <!-- Row 3: E創 + F加 -->
  <rect x="840" y="442" width="148" height="70" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="914" y="476" font-size="22" fill="#4f46e5" text-anchor="middle" font-weight="700">E 創新</text>
  <text x="914" y="500" font-size="17" fill="#a8a29e" text-anchor="middle">3 項 · 2%</text>

  <rect x="1002" y="442" width="148" height="70" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="1076" y="476" font-size="22" fill="#9333ea" text-anchor="middle" font-weight="700">F 加分</text>
  <text x="1076" y="500" font-size="17" fill="#a8a29e" text-anchor="middle">3 項 · +2 分</text>

  <!-- 左側主內容區 -->
  <!-- 主標題第 1 行 -->
  <text x="60" y="190" font-size="100" font-weight="900" fill="#1e293b">老人福利</text>
  <!-- 主標題第 2 行 (amber) -->
  <text x="60" y="310" font-size="100" font-weight="900" fill="#d97706">機構評鑑</text>

  <line x1="60" y1="338" x2="780" y2="338" stroke="#dedad3" stroke-width="1.5"/>

  <!-- 副標題 -->
  <text x="60" y="386" font-size="36" fill="#57534e" font-weight="400">77 項全攻略：115 年度 6 大區塊逐條拆解</text>

  <!-- 特色標籤列 -->
  <rect x="60" y="418" width="138" height="48" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="129" y="449" font-size="24" fill="#d97706" text-anchor="middle" font-weight="600">77 項基準</text>

  <rect x="210" y="418" width="138" height="48" rx="10" fill="#16a34a" opacity="0.12"/>
  <text x="279" y="449" font-size="24" fill="#16a34a" text-anchor="middle" font-weight="600">6 大區塊</text>

  <rect x="360" y="418" width="138" height="48" rx="10" fill="#0d9488" opacity="0.12"/>
  <text x="429" y="449" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="600">備審攻略</text>

  <rect x="510" y="418" width="192" height="48" rx="10" fill="#2563eb" opacity="0.12"/>
  <text x="606" y="449" font-size="24" fill="#2563eb" text-anchor="middle" font-weight="600">115 年度適用</text>

  <!-- 適用對象說明 -->
  <text x="60" y="540" font-size="26" fill="#94a3b8">適用：養護型、長期照護型、安養型老人福利機構</text>

  <!-- 浮水印 -->
  <text x="1140" y="590" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
