<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!--
    N=3 直列清單（兩層間距）
    H=90, inner_gap=13, outer_gap=38
    Header y=38, h=90, text_y=100（font=40, 8字）
    Row 1 y=166, Row 2 y=269, Row 3 y=372
    貳、專業照護品質三大子分類
  -->

  <!-- Header（y=38, h=90） -->
  <rect x="0" y="38" width="800" height="90" fill="#e8e6de"/>
  <rect x="0" y="38" width="6" height="90" fill="#16a34a"/>
  <!-- font=40（≤8字） -->
  <text x="28" y="100" font-size="40" fill="#1e293b" font-weight="700">貳、專業照護品質</text>

  <!-- Row 1（y=166, H=90, 評估與處遇, 琥珀 #d97706） -->
  <rect x="28" y="166" width="744" height="90" rx="12" fill="#e8e6de"/>
  <rect x="28" y="166" width="6" height="90" rx="2" fill="#d97706"/>
  <circle cx="66" cy="211" r="20" fill="#d97706" opacity="0.15"/>
  <text x="66" y="217" font-size="18" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <!-- Q_y=166+44=210, R_y=166+68=234 -->
  <text x="100" y="210" font-size="28" fill="#1e293b" font-weight="700">評估與處遇</text>
  <text x="100" y="234" font-size="16" fill="#57534e">新個案評估-7日完成照顧計畫-定期追蹤評值</text>
  <!-- S rect y=166+19=185, h=52 -->
  <rect x="620" y="185" width="136" height="52" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="205" font-size="16" fill="#d97706" text-anchor="middle">第 5–10 條</text>
  <text x="688" y="225" font-size="16" fill="#d97706" text-anchor="middle">共 6 項</text>

  <!-- Row 2（y=269, H=90, 健康生活照顧, 暖灰 #78716c） -->
  <rect x="28" y="269" width="744" height="90" rx="12" fill="#e8e6de"/>
  <rect x="28" y="269" width="6" height="90" rx="2" fill="#78716c"/>
  <circle cx="66" cy="314" r="20" fill="#78716c" opacity="0.15"/>
  <text x="66" y="320" font-size="18" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <!-- Q_y=269+44=313, R_y=269+68=337 -->
  <text x="100" y="313" font-size="28" fill="#1e293b" font-weight="700">健康生活照顧</text>
  <text x="100" y="337" font-size="16" fill="#57534e">服藥管理、活動計畫、安全看視、營養餐點</text>
  <!-- S rect y=269+19=288, h=52 -->
  <rect x="620" y="288" width="136" height="52" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="308" font-size="16" fill="#78716c" text-anchor="middle">第 11–21 條</text>
  <text x="688" y="328" font-size="16" fill="#78716c" text-anchor="middle">共 11 項</text>

  <!-- Row 3（y=372, H=90, 品質監測, 深棕 #57534e） -->
  <rect x="28" y="372" width="744" height="90" rx="12" fill="#e8e6de"/>
  <rect x="28" y="372" width="6" height="90" rx="2" fill="#57534e"/>
  <circle cx="66" cy="417" r="20" fill="#57534e" opacity="0.15"/>
  <text x="66" y="423" font-size="18" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <!-- Q_y=372+44=416, R_y=372+68=440 -->
  <text x="100" y="416" font-size="28" fill="#1e293b" font-weight="700">品質監測</text>
  <text x="100" y="440" font-size="16" fill="#57534e">自訂至少 2 項品管指標，逐案分析改善</text>
  <!-- S rect y=372+19=391, h=52 -->
  <rect x="620" y="391" width="136" height="52" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="411" font-size="16" fill="#57534e" text-anchor="middle">第 22 條</text>
  <text x="688" y="431" font-size="16" fill="#57534e" text-anchor="middle">品管指標</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
