<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"
     font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- Header（y=38, h=90）-->
  <rect x="0" y="38" width="800" height="90" fill="white"/>
  <rect x="0" y="38" width="6" height="90" fill="#d97706" rx="2"/>
  <text x="28" y="98" font-size="36" fill="#1e293b" font-weight="700">地雷三：督導紀錄踩雷點</text>

  <!-- Row 1（y=166）#d97706 — 頻率未達規定 -->
  <rect x="28" y="166" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="166" width="6" height="90" rx="2" fill="#d97706"/>
  <circle cx="66" cy="211" r="20" fill="#d97706" opacity="0.15"/>
  <text x="66" y="217" font-size="18" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <text x="100" y="210" font-size="28" fill="#1e293b" font-weight="700">頻率未達規定</text>
  <text x="100" y="234" font-size="18" fill="#57534e">個督每半年、團督每季，每位工作人員（含照服員）都要</text>
  <rect x="620" y="185" width="136" height="52" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="201" font-size="16" fill="#d97706" text-anchor="middle">頻率</text>
  <text x="688" y="221" font-size="16" fill="#d97706" text-anchor="middle">達標</text>

  <!-- Row 2（y=269）#78716c — 紀錄內容空洞 -->
  <rect x="28" y="269" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="269" width="6" height="90" rx="2" fill="#78716c"/>
  <circle cx="66" cy="314" r="20" fill="#78716c" opacity="0.15"/>
  <text x="66" y="320" font-size="18" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <text x="100" y="313" font-size="28" fill="#1e293b" font-weight="700">紀錄內容空洞</text>
  <text x="100" y="337" font-size="18" fill="#57534e">需記錄督導主題、討論內容與後續追蹤行動，非流水帳</text>
  <rect x="620" y="288" width="136" height="52" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="304" font-size="16" fill="#78716c" text-anchor="middle">內容</text>
  <text x="688" y="324" font-size="16" fill="#78716c" text-anchor="middle">充實</text>

  <!-- Row 3（y=372）#57534e — 缺後續追蹤記錄 -->
  <rect x="28" y="372" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="372" width="6" height="90" rx="2" fill="#57534e"/>
  <circle cx="66" cy="417" r="20" fill="#57534e" opacity="0.15"/>
  <text x="66" y="423" font-size="18" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <text x="100" y="416" font-size="28" fill="#1e293b" font-weight="700">缺後續追蹤記錄</text>
  <text x="100" y="440" font-size="18" fill="#57534e">督導結果需有後續跟進紀錄，只有督導紀錄仍算缺失</text>
  <rect x="620" y="391" width="136" height="52" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="407" font-size="16" fill="#57534e" text-anchor="middle">追蹤</text>
  <text x="688" y="427" font-size="16" fill="#57534e" text-anchor="middle">改善</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
