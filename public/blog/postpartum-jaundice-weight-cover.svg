<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 右側裝飾區塊 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>

  <!-- 右側大文字 B1.2 -->
  <text x="1010" y="195" font-size="120" font-weight="900" fill="#16a34a" text-anchor="middle" opacity="0.85">B1.2</text>
  <text x="1010" y="237" font-size="26" fill="#78716c" text-anchor="middle" font-weight="600">嬰兒照護</text>

  <!-- 右側資訊卡片（兩欄） -->
  <rect x="840" y="260" width="152" height="90" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="916" y="299" font-size="26" fill="#d97706" text-anchor="middle" font-weight="700">黃疸值</text>
  <text x="916" y="330" font-size="20" fill="#a8a29e" text-anchor="middle">動態追蹤</text>

  <rect x="1008" y="260" width="152" height="90" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="1084" y="299" font-size="26" fill="#16a34a" text-anchor="middle" font-weight="700">體重</text>
  <text x="1084" y="330" font-size="20" fill="#a8a29e" text-anchor="middle">每日對比</text>

  <rect x="840" y="360" width="152" height="90" rx="10" fill="#16a34a" opacity="0.10" stroke="#e8e5de" stroke-width="1"/>
  <text x="916" y="399" font-size="26" fill="#16a34a" text-anchor="middle" font-weight="700">餵食</text>
  <text x="916" y="430" font-size="20" fill="#a8a29e" text-anchor="middle">吸吮能力評估</text>

  <rect x="1008" y="360" width="152" height="90" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="1084" y="399" font-size="26" fill="#78716c" text-anchor="middle" font-weight="700">身分辨識</text>
  <text x="1084" y="430" font-size="20" fill="#a8a29e" text-anchor="middle">手腳環管理</text>

  <!-- 右側底部里程碑 -->
  <rect x="840" y="462" width="320" height="56" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="1000" y="498" font-size="24" fill="#d97706" text-anchor="middle" font-weight="700">出生後 10–14 日</text>
  <text x="1000" y="526" font-size="20" fill="#57534e" text-anchor="middle">體重回升至出生體重</text>

  <rect x="840" y="526" width="320" height="52" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="1000" y="562" font-size="22" fill="#57534e" text-anchor="middle">含照光治療記錄規範</text>

  <!-- 左側主標題 -->
  <text x="60" y="160" font-size="88" font-weight="900" fill="#1e293b">新生兒黃疸</text>
  <text x="60" y="258" font-size="88" font-weight="900" fill="#16a34a">體重監測</text>

  <line x1="60" y1="290" x2="780" y2="290" stroke="#dedad3" stroke-width="2"/>

  <text x="60" y="336" font-size="34" fill="#57534e" font-weight="400">B1.2 · 評鑑紀錄撰寫要點與範例</text>

  <!-- 特色標籤列 -->
  <rect x="60" y="364" width="178" height="52" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="149" y="399" font-size="26" fill="#d97706" text-anchor="middle" font-weight="600">黃疸判讀</text>

  <rect x="250" y="364" width="178" height="52" rx="10" fill="#16a34a" opacity="0.10"/>
  <text x="339" y="399" font-size="26" fill="#16a34a" text-anchor="middle" font-weight="600">體重趨勢</text>

  <rect x="440" y="364" width="178" height="52" rx="10" fill="#78716c" opacity="0.12"/>
  <text x="529" y="399" font-size="26" fill="#78716c" text-anchor="middle" font-weight="600">身分管理</text>

  <!-- 適用對象 -->
  <text x="60" y="452" font-size="28" fill="#94a3b8">護產人員 · 護理主管 · 嬰兒照顧人員</text>

  <!-- 底部說明 -->
  <text x="60" y="500" font-size="30" fill="#57534e" font-weight="500">黃疸記錄要有動態趨勢，體重要對比出生體重</text>
  <text x="60" y="538" font-size="26" fill="#a8a29e">有做但沒記，在 B1.2 評鑑等同於沒做</text>

  <!-- 浮水印 -->
  <text x="780" y="585" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
