<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <text x="400" y="45" font-size="22" font-weight="700" fill="#1e293b" text-anchor="middle" >B2 個案服務計畫（二級加強）：5 大必備要素</text>
  <text x="400" y="70" font-size="15" fill="#57534e" text-anchor="middle" >入住 72 小時內完成評估，每 3 個月定期更新照護計畫</text>

  <!-- N=5 版型：H=60, outer_gap=29, Header y=29, Row y: 118/191/264/337/410 -->

  <!-- 列 1 -->
  <rect x="29" y="93" width="742" height="60" rx="8" fill="white"/>
  <rect x="29" y="93" width="6" height="60" rx="2" fill="#d97706"/>
  <circle cx="53" cy="123" r="16" fill="#d97706" opacity="0.15"/>
  <text x="53" y="128" font-size="14" fill="white" text-anchor="middle"  font-weight="700">1</text>
  <text x="87" y="115" font-size="18" font-weight="700" fill="#1e293b" >72 小時內個別化評估</text>
  <text x="87" y="137" font-size="15" fill="#57534e" >涵蓋身體、心理、社會需求三面向，入住即啟動評估流程</text>
  <rect x="620" y="101" width="136" height="44" rx="8" fill="#fef3c7" opacity="0.12"/>
  <text x="688" y="114" font-size="14" fill="#d97706" text-anchor="middle"  font-weight="700">時效要求</text>
  <text x="688" y="132" font-size="14" fill="#d97706" text-anchor="middle" >72 小時</text>

  <!-- 列 2 -->
  <rect x="29" y="166" width="742" height="60" rx="8" fill="white"/>
  <rect x="29" y="166" width="6" height="60" rx="2" fill="#78716c"/>
  <circle cx="53" cy="196" r="16" fill="#78716c" opacity="0.15"/>
  <text x="53" y="201" font-size="14" fill="white" text-anchor="middle"  font-weight="700">2</text>
  <text x="87" y="188" font-size="18" font-weight="700" fill="#1e293b" >定期多面向功能評估</text>
  <text x="87" y="210" font-size="15" fill="#57534e" >每 3 個月評估（安養每 6 個月）：身體、心理、社會、認知、活動功能</text>
  <rect x="620" y="174" width="136" height="44" rx="8" fill="#f5f5f4" opacity="0.12"/>
  <text x="688" y="187" font-size="14" fill="#78716c" text-anchor="middle"  font-weight="700">評估頻率</text>
  <text x="688" y="205" font-size="14" fill="#78716c" text-anchor="middle" >每 3 個月</text>

  <!-- 列 3 -->
  <rect x="29" y="239" width="742" height="60" rx="8" fill="white"/>
  <rect x="29" y="239" width="6" height="60" rx="3" fill="#16a34a"/>
  <circle cx="53" cy="269" r="16" fill="#16a34a"/>
  <text x="53" y="274" font-size="14" fill="white" text-anchor="middle"  font-weight="700">3</text>
  <text x="87" y="261" font-size="18" font-weight="700" fill="#1e293b" >照護計畫與服務措施一致性</text>
  <text x="87" y="283" font-size="15" fill="#57534e" >執行措施須與照護計畫一致，半年至少 1 次與服務對象或家屬共同討論修正</text>
  <rect x="620" y="247" width="136" height="44" rx="8" fill="#dcfce7" opacity="0.12"/>
  <text x="688" y="260" font-size="14" fill="#16a34a" text-anchor="middle"  font-weight="700">計畫一致</text>
  <text x="688" y="278" font-size="14" fill="#16a34a" text-anchor="middle" >每半年修正</text>

  <!-- 列 4 -->
  <rect x="29" y="312" width="742" height="60" rx="8" fill="white"/>
  <rect x="29" y="312" width="6" height="60" rx="2" fill="#a8a29e"/>
  <circle cx="53" cy="342" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="53" y="347" font-size="14" fill="white" text-anchor="middle"  font-weight="700">4</text>
  <text x="87" y="334" font-size="18" font-weight="700" fill="#1e293b" >完整個案資料建檔與保存</text>
  <text x="87" y="356" font-size="15" fill="#57534e" >建立每位服務對象資料檔，依規定年限保存，訂有調閱辦法並有調閱紀錄</text>
  <rect x="620" y="320" width="136" height="44" rx="8" fill="#f5f5f4" opacity="0.12"/>
  <text x="688" y="333" font-size="14" fill="#a8a29e" text-anchor="middle"  font-weight="700">資料保全</text>
  <text x="688" y="351" font-size="14" fill="#a8a29e" text-anchor="middle" >調閱有紀錄</text>

  <!-- 列 5 -->
  <rect x="29" y="385" width="742" height="60" rx="8" fill="white"/>
  <rect x="29" y="385" width="6" height="60" rx="2" fill="#94a3b8"/>
  <circle cx="53" cy="415" r="16" fill="#94a3b8" opacity="0.15"/>
  <text x="53" y="420" font-size="14" fill="white" text-anchor="middle"  font-weight="700">5</text>
  <text x="87" y="407" font-size="18" font-weight="700" fill="#1e293b" >抽查 5 位個案備查文件</text>
  <text x="87" y="429" font-size="15" fill="#57534e" >評鑑委員抽閱 5 位個案服務計畫，詢問個管師、社工、護理等各職類評估方式</text>
  <rect x="620" y="393" width="136" height="44" rx="8" fill="#f1f5f9" opacity="0.12"/>
  <text x="688" y="406" font-size="14" fill="#94a3b8" text-anchor="middle"  font-weight="700">評鑑重點</text>
  <text x="688" y="424" font-size="14" fill="#94a3b8" text-anchor="middle" >抽查 5 案</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" >報告汪 reportwang.com</text>
</svg>
