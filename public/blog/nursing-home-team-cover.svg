<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 右側裝飾區塊 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>

  <!-- 右側大數字裝飾 -->
  <text x="1010" y="240" font-size="180" font-weight="900" fill="#d97706" text-anchor="middle" opacity="0.85">5</text>
  <text x="1010" y="283" font-size="28" fill="#78716c" text-anchor="middle" font-weight="600">大職種分工</text>

  <!-- 右側 2×2 資訊卡片 -->
  <rect x="840" y="303" width="155" height="86" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="918" y="340" font-size="28" fill="#d97706" text-anchor="middle" font-weight="700">行政主任</text>
  <text x="918" y="371" font-size="22" fill="#a8a29e" text-anchor="middle">A1-A7, E1-E3</text>

  <rect x="1005" y="303" width="155" height="86" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="1083" y="340" font-size="28" fill="#78716c" text-anchor="middle" font-weight="700">社工師</text>
  <text x="1083" y="371" font-size="22" fill="#a8a29e" text-anchor="middle">A8, B3-B8, D1-D9</text>

  <rect x="840" y="399" width="155" height="86" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="918" y="436" font-size="28" fill="#57534e" text-anchor="middle" font-weight="700">護理師</text>
  <text x="918" y="467" font-size="22" fill="#a8a29e" text-anchor="middle">A9-A11, B 系列</text>

  <rect x="1005" y="399" width="155" height="86" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="1083" y="436" font-size="28" fill="#a8a29e" text-anchor="middle" font-weight="700">環安人員</text>
  <text x="1083" y="467" font-size="22" fill="#a8a29e" text-anchor="middle">C1-C14 系列</text>

  <!-- 右側底部標籤 -->
  <rect x="840" y="495" width="320" height="52" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="1000" y="531" font-size="28" fill="#d97706" text-anchor="middle" font-weight="700">多職種協作攻略</text>

  <!-- 左側主內容 -->
  <text x="60" y="198" font-size="120" font-weight="900" fill="#1e293b">多職種協作</text>
  <text x="60" y="338" font-size="120" font-weight="900" fill="#d97706">評鑑分工</text>

  <line x1="60" y1="365" x2="780" y2="365" stroke="#dedad3" stroke-width="2"/>

  <text x="60" y="414" font-size="38" fill="#57534e" font-weight="400">護理、社工、照服員協作攻略</text>

  <!-- 特色標籤列 -->
  <rect x="60" y="448" width="148" height="54" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="134" y="481" font-size="28" fill="#d97706" text-anchor="middle" font-weight="600">住宿型評鑑</text>

  <rect x="220" y="448" width="148" height="54" rx="10" fill="#78716c" opacity="0.12"/>
  <text x="294" y="481" font-size="28" fill="#78716c" text-anchor="middle" font-weight="600">多人協作</text>

  <rect x="380" y="448" width="148" height="54" rx="10" fill="#57534e" opacity="0.12"/>
  <text x="454" y="481" font-size="28" fill="#57534e" text-anchor="middle" font-weight="600">評鑑分工</text>

  <!-- 適用對象 -->
  <text x="60" y="558" font-size="28" fill="#94a3b8">適用：住宿型長照機構各職種人員</text>

  <!-- 浮水印 -->
  <text x="1140" y="590" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
