<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!--
    N=5 直列清單（兩層間距）
    H=60, inner_gap=13, outer_gap=29
    Header y=29, h=60, text_y=76
    Row[0] y=118, Row[1] y=191, Row[2] y=264, Row[3] y=337, Row[4] y=410
    5條對應評鑑條文（2.2.1/2.2.2/2.2.3/2.7.1/2.5.3）
  -->

  <!-- Header（y=29, h=60） -->
  <rect x="0" y="29" width="800" height="60" fill="#e8e6de"/>
  <rect x="0" y="29" width="6" height="60" fill="#d97706" rx="2"/>
  <text x="28" y="76" font-size="40" fill="#1e293b" font-weight="700">5條對應評鑑條文</text>

  <!-- Row 0（y=118, #d97706 琥珀）2.2.1 醫品病安計畫 -->
  <rect x="28" y="118" width="744" height="60" rx="12" fill="#e8e6de"/>
  <rect x="28" y="118" width="6" height="60" rx="2" fill="#78716c"/>
  <circle cx="66" cy="148" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="154" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <text x="100" y="145" font-size="20" fill="#1e293b" font-weight="700">2.2.1 醫品病安計畫</text>
  <text x="100" y="166" font-size="16" fill="#57534e">年度品安目標與計畫書，含指標設定</text>
  <rect x="620" y="126" width="136" height="44" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="142" font-size="16" fill="#d97706" text-anchor="middle">2.2.1</text>
  <text x="688" y="162" font-size="16" fill="#d97706" text-anchor="middle">文件審查</text>

  <!-- Row 1（y=191, #78716c 暖灰）2.2.2 醫療不良事件 -->
  <rect x="28" y="191" width="744" height="60" rx="12" fill="#e8e6de"/>
  <rect x="28" y="191" width="6" height="60" rx="2" fill="#57534e"/>
  <circle cx="66" cy="221" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="227" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <text x="100" y="218" font-size="20" fill="#1e293b" font-weight="700">2.2.2 醫療不良事件</text>
  <text x="100" y="239" font-size="16" fill="#57534e">RCA根因分析與改善追蹤紀錄</text>
  <rect x="620" y="199" width="136" height="44" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="215" font-size="16" fill="#78716c" text-anchor="middle">2.2.2</text>
  <text x="688" y="235" font-size="16" fill="#78716c" text-anchor="middle">文件審查</text>

  <!-- Row 2（y=264, #57534e 深棕）2.2.3 品質會議 -->
  <rect x="28" y="264" width="744" height="60" rx="12" fill="#e8e6de"/>
  <rect x="28" y="264" width="6" height="60" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="294" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="300" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <text x="100" y="291" font-size="20" fill="#1e293b" font-weight="700">2.2.3 品質會議</text>
  <text x="100" y="312" font-size="16" fill="#57534e">定期品管委員會議紀錄與追蹤</text>
  <rect x="620" y="272" width="136" height="44" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="288" font-size="16" fill="#57534e" text-anchor="middle">2.2.3</text>
  <text x="688" y="308" font-size="16" fill="#57534e" text-anchor="middle">文件審查</text>

  <!-- Row 3（y=337, #a8a29e 淺灰）2.7.1 感染管制重點 -->
  <rect x="28" y="337" width="744" height="60" rx="12" fill="#e8e6de"/>
  <rect x="28" y="337" width="6" height="60" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="367" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="373" font-size="16" fill="#a8a29e" text-anchor="middle" font-weight="900">4</text>
  <text x="100" y="364" font-size="20" fill="#1e293b" font-weight="700">2.7.1 感染管制重點</text>
  <text x="100" y="385" font-size="16" fill="#57534e">組合式照護落實率監測</text>
  <rect x="620" y="345" width="136" height="44" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="361" font-size="16" fill="#a8a29e" text-anchor="middle">2.7.1</text>
  <text x="688" y="381" font-size="16" fill="#a8a29e" text-anchor="middle">實地+文件</text>

  <!-- Row 4（y=410, #94a3b8 藍灰）2.5.3 防止用藥錯誤 -->
  <rect x="28" y="410" width="744" height="60" rx="12" fill="#e8e6de"/>
  <rect x="28" y="410" width="6" height="60" rx="2" fill="#6b7280"/>
  <circle cx="66" cy="440" r="16" fill="#94a3b8" opacity="0.15"/>
  <text x="66" y="446" font-size="16" fill="#94a3b8" text-anchor="middle" font-weight="900">5</text>
  <text x="100" y="437" font-size="20" fill="#1e293b" font-weight="700">2.5.3 防止用藥錯誤</text>
  <text x="100" y="458" font-size="16" fill="#57534e">用藥錯誤率監測與改善措施</text>
  <rect x="620" y="418" width="136" height="44" rx="8" fill="#94a3b8" opacity="0.12"/>
  <text x="688" y="434" font-size="16" fill="#94a3b8" text-anchor="middle">2.5.3</text>
  <text x="688" y="454" font-size="16" fill="#94a3b8" text-anchor="middle">文件審查</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
