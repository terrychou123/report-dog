<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- Header -->
  <rect x="0" y="0" width="800" height="90" fill="white"/>
  <rect x="0" y="0" width="6" height="90" fill="#d97706"/>
  <text x="28" y="46" font-size="30" fill="#1e293b" font-weight="700">托育活動 40 分：4 個子類總覽</text>
  <text x="28" y="74" font-size="18" fill="#78716c">臺北市114-116年度 指標12-36 分類說明</text>

  <!-- Row 1：關係建立 y=160 -->
  <rect x="28" y="100" width="744" height="62" rx="8" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="100" width="6" height="62" rx="2" fill="#d97706"/>
  <circle cx="66" cy="131" r="18" fill="#d97706" opacity="0.15"/>
  <text x="66" y="137" font-size="15" fill="#d97706" text-anchor="middle" font-weight="900">A</text>
  <text x="100" y="122" font-size="22" fill="#1e293b" font-weight="700">關係建立（指標12-14）</text>
  <text x="100" y="148" font-size="15" fill="#57534e">托育人員與嬰幼兒互動品質、安全依附關係建立 — 以實地觀察互動方式為主要查核</text>
  <rect x="648" y="112" width="108" height="38" rx="6" fill="#d97706" opacity="0.12"/>
  <text x="702" y="136" font-size="15" fill="#d97706" text-anchor="middle" font-weight="600">3項 · 觀察</text>

  <!-- Row 2：環境規劃 y=235 -->
  <rect x="28" y="175" width="744" height="62" rx="8" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="175" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="66" cy="206" r="18" fill="#78716c" opacity="0.15"/>
  <text x="66" y="212" font-size="15" fill="#78716c" text-anchor="middle" font-weight="900">B</text>
  <text x="100" y="197" font-size="22" fill="#1e293b" font-weight="700">環境規劃（指標15-23）</text>
  <text x="100" y="223" font-size="15" fill="#57534e">睡眠區床距30cm（指標15）、活動區規劃、材料擺放高度 — 物理環境實地查核</text>
  <rect x="648" y="187" width="108" height="38" rx="6" fill="#78716c" opacity="0.12"/>
  <text x="702" y="211" font-size="15" fill="#78716c" text-anchor="middle" font-weight="600">9項 · 觀察</text>

  <!-- Row 3：活動實施 y=310 -->
  <rect x="28" y="250" width="744" height="62" rx="8" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="250" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="66" cy="281" r="18" fill="#57534e" opacity="0.15"/>
  <text x="66" y="287" font-size="15" fill="#57534e" text-anchor="middle" font-weight="900">C</text>
  <text x="100" y="272" font-size="22" fill="#1e293b" font-weight="700">活動實施（指標24-33）</text>
  <text x="100" y="298" font-size="15" fill="#57534e">課程計畫（發展領域涵蓋）、個別化觀察紀錄、活動實施記錄 — 文件與觀察並重</text>
  <rect x="648" y="262" width="108" height="38" rx="6" fill="#57534e" opacity="0.12"/>
  <text x="702" y="286" font-size="15" fill="#57534e" text-anchor="middle" font-weight="600">10項 · 混合</text>

  <!-- Row 4：親師交流 y=385 -->
  <rect x="28" y="325" width="744" height="62" rx="8" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="325" width="6" height="62" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="356" r="18" fill="#94a3b8" opacity="0.15"/>
  <text x="66" y="362" font-size="15" fill="#94a3b8" text-anchor="middle" font-weight="900">D</text>
  <text x="100" y="347" font-size="22" fill="#1e293b" font-weight="700">親師交流（指標34-36）</text>
  <text x="100" y="373" font-size="15" fill="#57534e">家長溝通機制、聯絡溝通記錄、親職教育辦理 — 佐證文件（聯絡單、活動記錄）</text>
  <rect x="648" y="337" width="108" height="38" rx="6" fill="#94a3b8" opacity="0.12"/>
  <text x="702" y="361" font-size="15" fill="#94a3b8" text-anchor="middle" font-weight="600">3項 · 文件</text>

  <!-- 底部說明 -->
  <rect x="28" y="410" width="744" height="52" rx="8" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="400" y="432" font-size="15" fill="#78716c" text-anchor="middle">托育活動 25 項指標以實地觀察為主（約60%），文件佐證為輔（約40%）</text>
  <text x="400" y="452" font-size="14" fill="#d97706" text-anchor="middle">→ 備審重點：日常照護品質真實呈現 + 課程計畫文件完整</text>

  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
