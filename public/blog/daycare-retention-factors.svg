<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="450" fill="#f0efe8"/>

  <!-- 頂部標題區域 -->
  <rect x="0" y="0" width="800" height="66" fill="#e8e6de"/>
  <rect x="0" y="0" width="5" height="66" fill="#d97706"/>
  <text x="28" y="30" font-size="11" fill="#78716c" font-weight="600">留任率分析</text>
  <text x="28" y="52" font-size="18" fill="#1e293b" font-weight="800">留任率影響因素——哪些管理細節決定員工是否留下</text>

  <!-- 說明文字 -->
  <text x="28" y="95" font-size="13" fill="#57534e">以下 5 項因素對應 115 年度評鑑基準，改善任一項均有助提升留任率</text>

  <!-- ── 因素卡片區，5欄排列 ── -->

  <!-- 因素1：督導制度 -->
  <rect x="28" y="112" width="140" height="296" rx="10" fill="#e8e6de"/>
  <rect x="28" y="112" width="140" height="6" rx="3" fill="#d97706"/>
  <text x="98" y="148" font-size="30" fill="#d97706" text-anchor="middle" font-weight="900">①</text>
  <text x="98" y="174" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">督導制度</text>
  <line x1="48" y1="186" x2="148" y2="186" stroke="#dedad3" stroke-width="1"/>
  <!-- 正向 -->
  <rect x="40" y="196" width="116" height="48" rx="6" fill="#d97706" opacity="0.1"/>
  <text x="98" y="213" font-size="11" fill="#d97706" text-anchor="middle" font-weight="700">✓ 定期個督＋團督</text>
  <text x="98" y="231" font-size="10" fill="#78716c" text-anchor="middle">有追蹤、有回饋</text>
  <text x="98" y="245" font-size="10" fill="#78716c" text-anchor="middle">員工感到被支持</text>
  <!-- 負向 -->
  <rect x="40" y="252" width="116" height="48" rx="6" fill="#94a3b8" opacity="0.12"/>
  <text x="98" y="269" font-size="11" fill="#57534e" text-anchor="middle" font-weight="700">✗ 督導流於形式</text>
  <text x="98" y="287" font-size="10" fill="#94a3b8" text-anchor="middle">只問「有沒有問題」</text>
  <text x="98" y="301" font-size="10" fill="#94a3b8" text-anchor="middle">員工感到孤立無援</text>
  <!-- 對應條文 -->
  <rect x="40" y="308" width="116" height="84" rx="6" fill="#f0efe8"/>
  <text x="98" y="326" font-size="10" fill="#94a3b8" text-anchor="middle">對應條文</text>
  <text x="98" y="344" font-size="13" fill="#d97706" text-anchor="middle" font-weight="800">第 9 條</text>
  <text x="98" y="362" font-size="10" fill="#78716c" text-anchor="middle">個督每半年1次</text>
  <text x="98" y="378" font-size="10" fill="#78716c" text-anchor="middle">團督每季1次</text>

  <!-- 因素2：訓練品質 -->
  <rect x="180" y="112" width="140" height="296" rx="10" fill="#e8e6de"/>
  <rect x="180" y="112" width="140" height="6" rx="3" fill="#78716c"/>
  <text x="250" y="148" font-size="30" fill="#78716c" text-anchor="middle" font-weight="900">②</text>
  <text x="250" y="174" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">訓練品質</text>
  <line x1="200" y1="186" x2="300" y2="186" stroke="#dedad3" stroke-width="1"/>
  <rect x="192" y="196" width="116" height="48" rx="6" fill="#78716c" opacity="0.1"/>
  <text x="250" y="213" font-size="11" fill="#78716c" text-anchor="middle" font-weight="700">✓ 情境式訓練</text>
  <text x="250" y="231" font-size="10" fill="#78716c" text-anchor="middle">結合個案討論</text>
  <text x="250" y="245" font-size="10" fill="#78716c" text-anchor="middle">員工參與規劃</text>
  <rect x="192" y="252" width="116" height="48" rx="6" fill="#94a3b8" opacity="0.12"/>
  <text x="250" y="269" font-size="11" fill="#57534e" text-anchor="middle" font-weight="700">✗ 只是來簽到</text>
  <text x="250" y="287" font-size="10" fill="#94a3b8" text-anchor="middle">無實質學習效果</text>
  <text x="250" y="301" font-size="10" fill="#94a3b8" text-anchor="middle">員工覺得浪費時間</text>
  <rect x="192" y="308" width="116" height="84" rx="6" fill="#f0efe8"/>
  <text x="250" y="326" font-size="10" fill="#94a3b8" text-anchor="middle">對應條文</text>
  <text x="250" y="344" font-size="13" fill="#78716c" text-anchor="middle" font-weight="800">第 29 條</text>
  <text x="250" y="362" font-size="10" fill="#78716c" text-anchor="middle">在職訓練20小時</text>
  <text x="250" y="378" font-size="10" fill="#78716c" text-anchor="middle">網路至多5小時</text>

  <!-- 因素3：管理風格 -->
  <rect x="332" y="112" width="140" height="296" rx="10" fill="#e8e6de"/>
  <rect x="332" y="112" width="140" height="6" rx="3" fill="#57534e"/>
  <text x="402" y="148" font-size="30" fill="#57534e" text-anchor="middle" font-weight="900">③</text>
  <text x="402" y="174" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">管理風格</text>
  <line x1="352" y1="186" x2="452" y2="186" stroke="#dedad3" stroke-width="1"/>
  <rect x="344" y="196" width="116" height="48" rx="6" fill="#57534e" opacity="0.1"/>
  <text x="402" y="213" font-size="11" fill="#57534e" text-anchor="middle" font-weight="700">✓ 正面回饋導向</text>
  <text x="402" y="231" font-size="10" fill="#78716c" text-anchor="middle">主動關心員工狀況</text>
  <text x="402" y="245" font-size="10" fill="#78716c" text-anchor="middle">建立信任感與歸屬感</text>
  <rect x="344" y="252" width="116" height="48" rx="6" fill="#94a3b8" opacity="0.12"/>
  <text x="402" y="269" font-size="11" fill="#57534e" text-anchor="middle" font-weight="700">✗ 只關注問題</text>
  <text x="402" y="287" font-size="10" fill="#94a3b8" text-anchor="middle">缺乏正向肯定</text>
  <text x="402" y="301" font-size="10" fill="#94a3b8" text-anchor="middle">員工工作成就感低</text>
  <rect x="344" y="308" width="116" height="84" rx="6" fill="#f0efe8"/>
  <text x="402" y="326" font-size="10" fill="#94a3b8" text-anchor="middle">對應條文</text>
  <text x="402" y="344" font-size="13" fill="#57534e" text-anchor="middle" font-weight="800">第 31 條</text>
  <text x="402" y="362" font-size="10" fill="#78716c" text-anchor="middle">主任進修</text>
  <text x="402" y="378" font-size="10" fill="#78716c" text-anchor="middle">管理知能提升</text>

  <!-- 因素4：健康支持 -->
  <rect x="484" y="112" width="140" height="296" rx="10" fill="#e8e6de"/>
  <rect x="484" y="112" width="140" height="6" rx="3" fill="#a8a29e"/>
  <text x="554" y="148" font-size="30" fill="#a8a29e" text-anchor="middle" font-weight="900">④</text>
  <text x="554" y="174" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">健康支持</text>
  <line x1="504" y1="186" x2="604" y2="186" stroke="#dedad3" stroke-width="1"/>
  <rect x="496" y="196" width="116" height="48" rx="6" fill="#a8a29e" opacity="0.15"/>
  <text x="554" y="213" font-size="11" fill="#78716c" text-anchor="middle" font-weight="700">✓ 完善健檢制度</text>
  <text x="554" y="231" font-size="10" fill="#78716c" text-anchor="middle">追蹤異常值</text>
  <text x="554" y="245" font-size="10" fill="#78716c" text-anchor="middle">員工感受到被照顧</text>
  <rect x="496" y="252" width="116" height="48" rx="6" fill="#94a3b8" opacity="0.12"/>
  <text x="554" y="269" font-size="11" fill="#57534e" text-anchor="middle" font-weight="700">✗ 健檢只是走形式</text>
  <text x="554" y="287" font-size="10" fill="#94a3b8" text-anchor="middle">異常值無追蹤</text>
  <text x="554" y="301" font-size="10" fill="#94a3b8" text-anchor="middle">員工健康風險累積</text>
  <rect x="496" y="308" width="116" height="84" rx="6" fill="#f0efe8"/>
  <text x="554" y="326" font-size="10" fill="#94a3b8" text-anchor="middle">對應條文</text>
  <text x="554" y="344" font-size="13" fill="#a8a29e" text-anchor="middle" font-weight="800">第 32 條</text>
  <text x="554" y="362" font-size="10" fill="#78716c" text-anchor="middle">每年健檢</text>
  <text x="554" y="378" font-size="10" fill="#78716c" text-anchor="middle">醫師判讀核章</text>

  <!-- 因素5：生涯發展 -->
  <rect x="636" y="112" width="136" height="296" rx="10" fill="#e8e6de"/>
  <rect x="636" y="112" width="136" height="6" rx="3" fill="#dedad3"/>
  <text x="704" y="148" font-size="30" fill="#dedad3" text-anchor="middle" font-weight="900">⑤</text>
  <text x="704" y="174" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">生涯發展</text>
  <line x1="656" y1="186" x2="756" y2="186" stroke="#dedad3" stroke-width="1"/>
  <rect x="648" y="196" width="116" height="48" rx="6" fill="#dedad3" opacity="0.4"/>
  <text x="704" y="213" font-size="11" fill="#78716c" text-anchor="middle" font-weight="700">✓ 有晉升路徑</text>
  <text x="704" y="231" font-size="10" fill="#78716c" text-anchor="middle">技能被肯定</text>
  <text x="704" y="245" font-size="10" fill="#78716c" text-anchor="middle">有學習成長空間</text>
  <rect x="648" y="252" width="116" height="48" rx="6" fill="#94a3b8" opacity="0.12"/>
  <text x="704" y="269" font-size="11" fill="#57534e" text-anchor="middle" font-weight="700">✗ 看不到未來</text>
  <text x="704" y="287" font-size="10" fill="#94a3b8" text-anchor="middle">缺乏晉升機會</text>
  <text x="704" y="301" font-size="10" fill="#94a3b8" text-anchor="middle">優秀人才容易離職</text>
  <rect x="648" y="308" width="116" height="84" rx="6" fill="#f0efe8"/>
  <text x="704" y="326" font-size="10" fill="#94a3b8" text-anchor="middle">綜合指標</text>
  <text x="704" y="344" font-size="13" fill="#94a3b8" text-anchor="middle" font-weight="800">留任率</text>
  <text x="704" y="362" font-size="10" fill="#78716c" text-anchor="middle">前四年度平均</text>
  <text x="704" y="378" font-size="10" fill="#78716c" text-anchor="middle">第 30 條指標</text>

  <!-- 浮水印 -->
  <text x="760" y="421" font-size="16" fill="#c4bfb8" text-anchor="end" font-weight="400" font-family="'Noto Sans TC', sans-serif">報告汪 reportwang.com</text>
</svg>
