<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"
     font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">影響留任的 4 大關鍵面向</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">同時照顧 4 個面向，才能打造留得住人的職場</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- 左上卡片（#d97706）薪資福利 -->
  <rect x="40" y="104" width="346" height="168" rx="12" fill="white"/>
  <rect x="40" y="104" width="346" height="44" rx="12" fill="#d97706"/>
  <rect x="40" y="128" width="346" height="20" fill="#d97706"/>
  <circle cx="68" cy="126" r="9" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
  <circle cx="68" cy="126" r="3" fill="white"/>
  <text x="213" y="143" text-anchor="middle" font-size="15" fill="white" font-weight="700">薪資福利</text>
  <text x="60" y="172" font-size="14" fill="#57534e">• 薪資需貼近市場水準</text>
  <text x="60" y="192" font-size="14" fill="#57534e">• 績效獎金及年終有明確規定</text>
  <text x="60" y="212" font-size="14" fill="#57534e">• 勞健保齊全、無欠繳紀錄</text>
  <text x="60" y="232" font-size="14" fill="#57534e">• 交通補貼等附加福利完善</text>
  <rect x="56" y="246" width="80" height="20" rx="10" fill="#fef3c7"/>
  <text x="96" y="260" text-anchor="middle" font-size="14" fill="#d97706" font-weight="600">最關鍵因素</text>

  <!-- 右上卡片（#78716c）工作環境 -->
  <rect x="414" y="104" width="346" height="168" rx="12" fill="white"/>
  <rect x="414" y="104" width="346" height="44" rx="12" fill="#78716c"/>
  <rect x="414" y="128" width="346" height="20" fill="#78716c"/>
  <rect x="438" y="117" width="18" height="18" rx="3" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
  <line x1="441" y1="126" x2="453" y2="126" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
  <text x="587" y="143" text-anchor="middle" font-size="15" fill="white" font-weight="700">工作環境</text>
  <text x="434" y="172" font-size="14" fill="#57534e">• 職場氛圍友善互助</text>
  <text x="434" y="192" font-size="14" fill="#57534e">• 設備充足不讓員工受傷</text>
  <text x="434" y="212" font-size="14" fill="#57534e">• 主管管理風格受員工信賴</text>
  <text x="434" y="232" font-size="14" fill="#57534e">• 工作負荷量合理可持續</text>
  <rect x="430" y="246" width="80" height="20" rx="10" fill="#f5f5f4"/>
  <text x="470" y="260" text-anchor="middle" font-size="14" fill="#78716c" font-weight="600">日常體驗</text>

  <!-- 左下卡片（#57534e）發展機會 -->
  <rect x="40" y="288" width="346" height="162" rx="12" fill="white"/>
  <rect x="40" y="288" width="346" height="44" rx="12" fill="#57534e"/>
  <rect x="40" y="312" width="346" height="20" fill="#57534e"/>
  <line x1="60" y1="309" x2="68" y2="317" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-linecap="round"/>
  <line x1="68" y1="317" x2="84" y2="301" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-linecap="round"/>
  <text x="213" y="327" text-anchor="middle" font-size="15" fill="white" font-weight="700">發展機會</text>
  <text x="60" y="356" font-size="14" fill="#57534e">• 訓練課程有實質學習效益</text>
  <text x="60" y="376" font-size="14" fill="#57534e">• 晉升管道清晰有機會</text>
  <text x="60" y="396" font-size="14" fill="#57534e">• 支持考取專業證照</text>
  <text x="60" y="416" font-size="14" fill="#57534e">• 能看見自己的職涯路徑</text>
  <rect x="56" y="430" width="80" height="20" rx="10" fill="#f5f0eb"/>
  <text x="96" y="444" text-anchor="middle" font-size="14" fill="#57534e" font-weight="600">長遠留才</text>

  <!-- 右下卡片（#a8a29e）支持系統 -->
  <rect x="414" y="288" width="346" height="162" rx="12" fill="white"/>
  <rect x="414" y="288" width="346" height="44" rx="12" fill="#a8a29e"/>
  <rect x="414" y="312" width="346" height="20" fill="#a8a29e"/>
  <circle cx="440" cy="310" r="8" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
  <line x1="440" y1="302" x2="440" y2="307" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
  <circle cx="440" cy="314" r="2" fill="rgba(255,255,255,0.7)"/>
  <text x="587" y="327" text-anchor="middle" font-size="15" fill="white" font-weight="700">支持系統</text>
  <text x="434" y="356" font-size="14" fill="#57534e">• 督導制度提供專業指導</text>
  <text x="434" y="376" font-size="14" fill="#57534e">• 同儕情誼與團隊文化凝聚</text>
  <text x="434" y="396" font-size="14" fill="#57534e">• 情緒輔導資源可及性</text>
  <text x="434" y="416" font-size="14" fill="#57534e">• 健康管理關懷員工身心</text>
  <rect x="430" y="430" width="80" height="20" rx="10" fill="#f5f5f4"/>
  <text x="470" y="444" text-anchor="middle" font-size="14" fill="#a8a29e" font-weight="600">心理安全</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
