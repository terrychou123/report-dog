<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <rect x="0" y="29" width="800" height="60" fill="#e8e6de"/>
  <rect x="0" y="29" width="6" height="60" rx="2" fill="#d97706"/>
  <text x="28" y="74" font-size="28" fill="#1e293b" font-weight="700">自評表填寫三大核心原則</text>
  <rect x="28" y="166" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="166" width="6" height="90" rx="2" fill="#78716c"/>
  <circle cx="66" cy="211" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="217" font-size="14" fill="#d97706" text-anchor="middle" font-weight="900">原則1</text>
  <text x="100" y="201" font-size="18" fill="#1e293b" font-weight="700">逐條對照，不跳過任何一項</text>
  <text x="100" y="222" font-size="16" fill="#57534e">17 項基準逐條自評，不可假設「應該沒問題」而略過</text>
  <rect x="620" y="174" width="136" height="74" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="207" font-size="16" fill="#d97706" text-anchor="middle">逐條</text>
  <text x="688" y="227" font-size="16" fill="#d97706" text-anchor="middle">對照</text>
  <rect x="28" y="269" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="269" width="6" height="90" rx="2" fill="#57534e"/>
  <circle cx="66" cy="314" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="320" font-size="14" fill="#78716c" text-anchor="middle" font-weight="900">原則2</text>
  <text x="100" y="304" font-size="18" fill="#1e293b" font-weight="700">以文件存在為唯一標準</text>
  <text x="100" y="325" font-size="16" fill="#57534e">有做不等於有記錄，評鑑委員只看文件</text>
  <rect x="620" y="277" width="136" height="74" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="310" font-size="16" fill="#78716c" text-anchor="middle">文件</text>
  <text x="688" y="330" font-size="16" fill="#78716c" text-anchor="middle">優先</text>
  <rect x="28" y="372" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="372" width="6" height="90" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="417" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="423" font-size="14" fill="#57534e" text-anchor="middle" font-weight="900">原則3</text>
  <text x="100" y="407" font-size="18" fill="#1e293b" font-weight="700">發現缺漏立即補強</text>
  <text x="100" y="428" font-size="16" fill="#57534e">評鑑前自評找到缺漏，即是最佳補強時機</text>
  <rect x="620" y="380" width="136" height="74" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="413" font-size="16" fill="#57534e" text-anchor="middle">缺漏</text>
  <text x="688" y="433" font-size="16" fill="#57534e" text-anchor="middle">補強</text>
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>