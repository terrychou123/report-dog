<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <text x="400" y="48" text-anchor="middle" font-size="28" fill="#1e293b" font-weight="700">115 年度居家護理所 A5 五項固定指標</text>
  <text x="400" y="76" text-anchor="middle" font-size="20" fill="#57534e">衛福部官方規定，不可自行調整名稱與計算方式</text>
  <line x1="40" y1="92" x2="760" y2="92" stroke="#dedad3" stroke-width="1"/>
  <!-- N=5 列表 -->
  <rect x="28" y="102" width="744" height="60" rx="12" fill="#e8e6de"/>
  <rect x="28" y="102" width="6" height="60" rx="2" fill="#d97706"/>
  <circle cx="66" cy="132" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="138" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <text x="100" y="129" font-size="20" fill="#1e293b" font-weight="700">平均個案管理人數</text>
  <text x="100" y="150" font-size="16" fill="#57534e">服務個案總數 ÷ 護理人員數，反映每位護理師的照護負荷</text>
  <rect x="28" y="175" width="744" height="60" rx="12" fill="#e8e6de"/>
  <rect x="28" y="175" width="6" height="60" rx="2" fill="#78716c"/>
  <circle cx="66" cy="205" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="211" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <text x="100" y="202" font-size="20" fill="#1e293b" font-weight="700">護理人員離職率</text>
  <text x="100" y="223" font-size="16" fill="#57534e">評鑑期間離職人數 ÷ 期初護理人員數，反映人力穩定性</text>
  <rect x="28" y="248" width="744" height="60" rx="12" fill="#e8e6de"/>
  <rect x="28" y="248" width="6" height="60" rx="2" fill="#57534e"/>
  <circle cx="66" cy="278" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="284" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <text x="100" y="275" font-size="20" fill="#1e293b" font-weight="700">個案非計畫性住院率</text>
  <text x="100" y="296" font-size="16" fill="#57534e">非計畫性住院人次 ÷ 總個案數，反映病情監測與應變</text>
  <rect x="28" y="321" width="744" height="60" rx="12" fill="#e8e6de"/>
  <rect x="28" y="321" width="6" height="60" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="351" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="357" font-size="16" fill="#a8a29e" text-anchor="middle" font-weight="900">4</text>
  <text x="100" y="348" font-size="20" fill="#1e293b" font-weight="700">個案急診使用率</text>
  <text x="100" y="369" font-size="16" fill="#57534e">急診使用人次 ÷ 總個案數，反映急性狀況處理能力</text>
  <rect x="28" y="394" width="744" height="60" rx="12" fill="#e8e6de"/>
  <rect x="28" y="394" width="6" height="60" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="424" r="16" fill="#94a3b8" opacity="0.15"/>
  <text x="66" y="430" font-size="16" fill="#94a3b8" text-anchor="middle" font-weight="900">5</text>
  <text x="100" y="421" font-size="20" fill="#1e293b" font-weight="700">皮膚損傷發生率</text>
  <text x="100" y="442" font-size="16" fill="#57534e">新發生皮膚損傷個案數 ÷ 總個案數，反映照護品質</text>
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
