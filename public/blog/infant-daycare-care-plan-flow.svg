<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- 主標題 -->
  <text x="400" y="48" font-size="24" fill="#1e293b" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-weight="900">個別化照顧計畫三步驟流程</text>
  <!-- 副標 -->
  <text x="400" y="78" font-size="16" fill="#78716c" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">觀察評量 &#8594; 制定計畫 &#8594; 執行複評</text>
  <!-- 分隔線 -->
  <line x1="80" y1="94" x2="720" y2="94" stroke="#e8e6de" stroke-width="2"/>
  <!-- 卡片 1：觀察評量 -->
  <rect x="129" y="108" width="170" height="342" rx="12" fill="white" stroke="#d97706" stroke-width="2"/>
  <circle cx="214" cy="108" r="43" fill="#d97706"/>
  <text x="214" y="100" font-size="28" fill="white" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-weight="900">01</text>
  <text x="214" y="125" font-size="13" fill="white" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">STEP</text>
  <text x="214" y="190" font-size="20" fill="#d97706" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-weight="700">觀察評量</text>
  <text x="214" y="225" font-size="13" fill="#57534e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">每日觀察記錄</text>
  <text x="214" y="248" font-size="13" fill="#57534e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">（指標 35）</text>
  <text x="214" y="280" font-size="13" fill="#78716c" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">五大發展領域</text>
  <text x="214" y="303" font-size="13" fill="#78716c" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">系統性評量工具</text>
  <text x="214" y="335" font-size="13" fill="#a8a29e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">頻率：入托後</text>
  <text x="214" y="356" font-size="13" fill="#a8a29e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">2週內完成初評</text>
  <text x="214" y="390" font-size="12" fill="#d97706" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-weight="700">觀察 + 量表</text>
  <text x="214" y="412" font-size="12" fill="#d97706" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-weight="700">+ 家長問卷</text>
  <!-- 箭頭 1 -->
  <polygon points="303,258 325,270 303,282" fill="#d97706"/>
  <line x1="299" y1="270" x2="315" y2="270" stroke="#d97706" stroke-width="2"/>
  <!-- 卡片 2：制定計畫 -->
  <rect x="315" y="108" width="170" height="342" rx="12" fill="white" stroke="#78716c" stroke-width="2"/>
  <circle cx="400" cy="108" r="43" fill="#78716c"/>
  <text x="400" y="100" font-size="28" fill="white" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-weight="900">02</text>
  <text x="400" y="125" font-size="13" fill="white" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">STEP</text>
  <text x="400" y="190" font-size="20" fill="#78716c" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-weight="700">制定計畫</text>
  <text x="400" y="225" font-size="13" fill="#57534e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">依評量結果</text>
  <text x="400" y="248" font-size="13" fill="#57534e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">訂定個別目標</text>
  <text x="400" y="280" font-size="13" fill="#78716c" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">短期 1個月目標</text>
  <text x="400" y="303" font-size="13" fill="#78716c" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">中期 3個月目標</text>
  <text x="400" y="335" font-size="13" fill="#a8a29e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">家長共同</text>
  <text x="400" y="356" font-size="13" fill="#a8a29e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">討論確認</text>
  <text x="400" y="390" font-size="12" fill="#78716c" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-weight="700">目標需具體</text>
  <text x="400" y="412" font-size="12" fill="#78716c" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-weight="700">可觀察可評量</text>
  <!-- 箭頭 2 -->
  <polygon points="489,258 511,270 489,282" fill="#78716c"/>
  <line x1="485" y1="270" x2="501" y2="270" stroke="#78716c" stroke-width="2"/>
  <!-- 卡片 3：執行複評 -->
  <rect x="501" y="108" width="170" height="342" rx="12" fill="white" stroke="#57534e" stroke-width="2"/>
  <circle cx="586" cy="108" r="43" fill="#57534e"/>
  <text x="586" y="100" font-size="28" fill="white" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-weight="900">03</text>
  <text x="586" y="125" font-size="13" fill="white" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">STEP</text>
  <text x="586" y="190" font-size="20" fill="#57534e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-weight="700">執行複評</text>
  <text x="586" y="225" font-size="13" fill="#57534e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">落實執行計畫</text>
  <text x="586" y="248" font-size="13" fill="#57534e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">每季定期複評</text>
  <text x="586" y="280" font-size="13" fill="#78716c" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">日誌記錄對應</text>
  <text x="586" y="303" font-size="13" fill="#78716c" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">計畫目標進展</text>
  <text x="586" y="335" font-size="13" fill="#a8a29e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">成效不佳時</text>
  <text x="586" y="356" font-size="13" fill="#a8a29e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">調整策略目標</text>
  <text x="586" y="390" font-size="12" fill="#57534e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-weight="700">循環改善</text>
  <text x="586" y="412" font-size="12" fill="#57534e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-weight="700">持續優化</text>
  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" font-family="'Noto Sans TC', sans-serif">報告汪 reportwang.com</text>
</svg>
