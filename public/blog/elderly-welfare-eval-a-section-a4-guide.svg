<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區塊 -->
  <rect x="0" y="0" width="800" height="76" fill="#1e293b"/>
  <text x="400" y="29" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle" font-weight="400">A4 二級加強</text>
  <text x="400" y="57" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-size="22" fill="white" text-anchor="middle" font-weight="700">查核缺失改善 — 4 種主管機關全面達標</text>

  <!-- N=4 版型: H=62, outer_gap=50, Header y=50, Row y: 160/235/310/385 -->

  <!-- Row 1: 衛生主管機關 -->
  <rect x="50" y="100" width="700" height="62" rx="8" fill="white"/>
  <rect x="50" y="100" width="6" height="62" rx="3" fill="#d97706"/>
  <circle cx="87" cy="131" r="16" fill="#d97706"/>
  <text x="87" y="137" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="700">1</text>
  <text x="118" y="125" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-size="20" fill="#1e293b" font-weight="700">衛生主管機關查核</text>
  <text x="118" y="148" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-size="16" fill="#57534e">感染管制、醫療廢棄物、藥物管理、食品衛生等相關缺失改善</text>
  <rect x="556" y="108" width="136" height="46" rx="6" fill="#fef3c7"/>
  <text x="624" y="127" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-size="14" fill="#92400e" text-anchor="middle" font-weight="600">改善率</text>
  <text x="624" y="145" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-size="14" fill="#92400e" text-anchor="middle">須達 100%</text>

  <!-- Row 2: 消防主管機關 -->
  <rect x="50" y="175" width="700" height="62" rx="8" fill="white"/>
  <rect x="50" y="175" width="6" height="62" rx="3" fill="#78716c"/>
  <circle cx="87" cy="206" r="16" fill="#78716c"/>
  <text x="87" y="212" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="700">2</text>
  <text x="118" y="200" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-size="20" fill="#1e293b" font-weight="700">消防主管機關查核</text>
  <text x="118" y="223" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-size="16" fill="#57534e">消防設備、逃生動線、防火區劃、避難演練等缺失改善</text>
  <rect x="556" y="183" width="136" height="46" rx="6" fill="#fef3c7"/>
  <text x="624" y="202" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-size="14" fill="#92400e" text-anchor="middle" font-weight="600">改善率</text>
  <text x="624" y="220" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-size="14" fill="#92400e" text-anchor="middle">須達 100%</text>

  <!-- Row 3: 建管主管機關 -->
  <rect x="50" y="250" width="700" height="62" rx="8" fill="white"/>
  <rect x="50" y="250" width="6" height="62" rx="3" fill="#57534e"/>
  <circle cx="87" cy="281" r="16" fill="#57534e"/>
  <text x="87" y="287" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="700">3</text>
  <text x="118" y="275" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-size="20" fill="#1e293b" font-weight="700">建管主管機關查核</text>
  <text x="118" y="298" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-size="16" fill="#57534e">建築使用執照、無障礙設施、結構安全等缺失改善</text>
  <rect x="556" y="258" width="136" height="46" rx="6" fill="#fef3c7"/>
  <text x="624" y="277" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-size="14" fill="#92400e" text-anchor="middle" font-weight="600">改善率</text>
  <text x="624" y="295" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-size="14" fill="#92400e" text-anchor="middle">須達 100%</text>

  <!-- Row 4: 勞工主管機關 -->
  <rect x="50" y="325" width="700" height="62" rx="8" fill="white"/>
  <rect x="50" y="325" width="6" height="62" rx="3" fill="#a8a29e"/>
  <circle cx="87" cy="356" r="16" fill="#a8a29e"/>
  <text x="87" y="362" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="700">4</text>
  <text x="118" y="350" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-size="20" fill="#1e293b" font-weight="700">勞工主管機關查核</text>
  <text x="118" y="373" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-size="16" fill="#57534e">勞動基準法、職業安全衛生法規等違規缺失改善</text>
  <rect x="556" y="333" width="136" height="46" rx="6" fill="#fef3c7"/>
  <text x="624" y="352" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-size="14" fill="#92400e" text-anchor="middle" font-weight="600">改善率</text>
  <text x="624" y="370" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-size="14" fill="#92400e" text-anchor="middle">須達 100%</text>

  <!-- 提示說明 -->
  <rect x="50" y="404" width="700" height="52" rx="8" fill="#fef3c7" opacity="0.8"/>
  <text x="400" y="425" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-size="16" fill="#92400e" text-anchor="middle" font-weight="700">過去 4 年查核均無缺失者，本項以「A（符合）」計分，視同滿分</text>
  <text x="400" y="446" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-size="15" fill="#92400e" text-anchor="middle">建議備妥各主管機關查核公文影本與缺失改善追蹤表</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">報告汪 reportwang.com</text>
</svg>
