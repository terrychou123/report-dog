<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">評鑑備審三階段時程表</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">90天有計畫地準備・每個階段有明確重點</text>
  <line x1="129" y1="94" x2="671" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- N=3 flow: card_w=170, margin=129, arrow_y=279 -->
  <!-- Arrow 1 -->
  <line x1="299" y1="279" x2="315" y2="279" stroke="#c4bfb8" stroke-width="2"/>
  <polygon points="303,273 315,279 303,285" fill="#c4bfb8"/>
  <!-- Arrow 2 -->
  <line x1="485" y1="279" x2="501" y2="279" stroke="#c4bfb8" stroke-width="2"/>
  <polygon points="489,273 501,279 489,285" fill="#c4bfb8"/>

  <!-- Card 1: 自評規劃 x=129 cx=214 -->
  <rect x="129" y="108" width="170" height="342" rx="12" fill="white"/>
  <rect x="129" y="108" width="170" height="8" rx="4" fill="#d97706"/>
  <rect x="129" y="112" width="170" height="4" fill="#d97706"/>
  <circle cx="214" cy="194" r="43" fill="#fef3c7"/>
  <text x="214" y="183" text-anchor="middle" font-size="17" fill="#d97706" font-weight="700">STEP</text>
  <text x="214" y="211" text-anchor="middle" font-size="28" fill="#d97706" font-weight="700">01</text>
  <text x="214" y="297" text-anchor="middle" font-size="22" fill="#1e293b" font-weight="700">自評</text>
  <text x="214" y="322" text-anchor="middle" font-size="16" fill="#57534e">與規劃</text>
  <text x="214" y="344" text-anchor="middle" font-size="16" fill="#57534e">找出缺口</text>
  <rect x="145" y="381" width="138" height="36" rx="18" fill="#fef3c7"/>
  <text x="214" y="405" text-anchor="middle" font-size="16" fill="#d97706" font-weight="600">第90-61天</text>

  <!-- Card 2: 文件補強 x=315 cx=400 -->
  <rect x="315" y="108" width="170" height="342" rx="12" fill="white"/>
  <rect x="315" y="108" width="170" height="8" rx="4" fill="#78716c"/>
  <rect x="315" y="112" width="170" height="4" fill="#78716c"/>
  <circle cx="400" cy="194" r="43" fill="#f5f5f4"/>
  <text x="400" y="183" text-anchor="middle" font-size="17" fill="#78716c" font-weight="700">STEP</text>
  <text x="400" y="211" text-anchor="middle" font-size="28" fill="#78716c" font-weight="700">02</text>
  <text x="400" y="297" text-anchor="middle" font-size="22" fill="#1e293b" font-weight="700">補強</text>
  <text x="400" y="322" text-anchor="middle" font-size="16" fill="#57534e">製作文件</text>
  <text x="400" y="344" text-anchor="middle" font-size="16" fill="#57534e">建立索引</text>
  <rect x="331" y="381" width="138" height="36" rx="18" fill="#f5f5f4"/>
  <text x="400" y="405" text-anchor="middle" font-size="16" fill="#78716c" font-weight="600">第60-31天</text>

  <!-- Card 3: 演練確認 x=501 cx=586 -->
  <rect x="501" y="108" width="170" height="342" rx="12" fill="white"/>
  <rect x="501" y="108" width="170" height="8" rx="4" fill="#57534e"/>
  <rect x="501" y="112" width="170" height="4" fill="#57534e"/>
  <circle cx="586" cy="194" r="43" fill="#f5f0eb"/>
  <text x="586" y="183" text-anchor="middle" font-size="17" fill="#57534e" font-weight="700">STEP</text>
  <text x="586" y="211" text-anchor="middle" font-size="28" fill="#57534e" font-weight="700">03</text>
  <text x="586" y="297" text-anchor="middle" font-size="22" fill="#1e293b" font-weight="700">演練</text>
  <text x="586" y="322" text-anchor="middle" font-size="16" fill="#57534e">模擬評鑑</text>
  <text x="586" y="344" text-anchor="middle" font-size="16" fill="#57534e">最終確認</text>
  <rect x="517" y="381" width="138" height="36" rx="18" fill="#f5f0eb"/>
  <text x="586" y="405" text-anchor="middle" font-size="16" fill="#57534e" font-weight="600">第30-1天</text>

  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
