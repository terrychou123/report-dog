<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">10大常見缺失 風險分類</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">依失分嚴重程度排列，優先補強高風險項目</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- 左欄：高風險（紅色） -->
  <rect x="40" y="108" width="220" height="330" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="40" y="108" width="220" height="40" rx="12" fill="#dc2626"/>
  <rect x="40" y="128" width="220" height="20" fill="#dc2626"/>
  <text x="150" y="134" text-anchor="middle" font-size="18" fill="white" font-weight="700">高風險（可不合格）</text>
  <text x="60" y="175" font-size="16" fill="#1e293b" font-weight="700">1. 住宿型3.11</text>
  <text x="60" y="196" font-size="15" fill="#57534e">出入自由限制</text>
  <text x="60" y="214" font-size="14" fill="#dc2626">- 唯一重點項目</text>
  <line x1="60" y1="224" x2="240" y2="224" stroke="#f0efe8" stroke-width="1"/>
  <text x="60" y="248" font-size="16" fill="#1e293b" font-weight="700">2. PFM訪談失敗</text>
  <text x="60" y="269" font-size="15" fill="#57534e">學員說不出答案</text>
  <text x="60" y="287" font-size="14" fill="#dc2626">- 直接評D/E等級</text>
  <line x1="60" y1="297" x2="240" y2="297" stroke="#f0efe8" stroke-width="1"/>
  <text x="60" y="321" font-size="16" fill="#1e293b" font-weight="700">3. 結案回歸不足</text>
  <text x="60" y="342" font-size="15" fill="#57534e">4年內15%達標</text>
  <text x="60" y="360" font-size="14" fill="#dc2626">- 長期累積指標</text>

  <!-- 中欄：中高風險（橘色） -->
  <rect x="290" y="108" width="220" height="330" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="290" y="108" width="220" height="40" rx="12" fill="#ea580c"/>
  <rect x="290" y="128" width="220" height="20" fill="#ea580c"/>
  <text x="400" y="134" text-anchor="middle" font-size="18" fill="white" font-weight="700">中高風險（常失分）</text>
  <text x="310" y="175" font-size="16" fill="#1e293b" font-weight="700">4. 計畫未每3月修正</text>
  <text x="310" y="196" font-size="15" fill="#57534e">2.2 復健計畫</text>
  <line x1="310" y1="208" x2="490" y2="208" stroke="#f0efe8" stroke-width="1"/>
  <text x="310" y="232" font-size="16" fill="#1e293b" font-weight="700">5. 討論會記錄不實</text>
  <text x="310" y="253" font-size="15" fill="#57534e">2.9 社區復健討論會</text>
  <line x1="310" y1="265" x2="490" y2="265" stroke="#f0efe8" stroke-width="1"/>
  <text x="310" y="289" font-size="16" fill="#1e293b" font-weight="700">6. 訓練議題缺漏</text>
  <text x="310" y="310" font-size="15" fill="#57534e">1.3 CRPD/CEDAW</text>

  <!-- 右欄：中風險（琥珀色） -->
  <rect x="540" y="108" width="220" height="330" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="540" y="108" width="220" height="40" rx="12" fill="#d97706"/>
  <rect x="540" y="128" width="220" height="20" fill="#d97706"/>
  <text x="650" y="134" text-anchor="middle" font-size="18" fill="white" font-weight="700">中風險（易忽略）</text>
  <text x="560" y="175" font-size="16" fill="#1e293b" font-weight="700">7. 消防演練未備查</text>
  <text x="560" y="196" font-size="15" fill="#57534e">3.9 緊急應變演練</text>
  <line x1="560" y1="208" x2="740" y2="208" stroke="#f0efe8" stroke-width="1"/>
  <text x="560" y="232" font-size="16" fill="#1e293b" font-weight="700">8. 復健基金未公告</text>
  <text x="560" y="253" font-size="15" fill="#57534e">3.5 收支未每月公告</text>
  <line x1="560" y1="265" x2="740" y2="265" stroke="#f0efe8" stroke-width="1"/>
  <text x="560" y="289" font-size="16" fill="#1e293b" font-weight="700">9. 紀錄缺乏整合</text>
  <text x="560" y="310" font-size="15" fill="#57534e">3.4 各專業各自記錄</text>
  <line x1="560" y1="322" x2="740" y2="322" stroke="#f0efe8" stroke-width="1"/>
  <text x="560" y="346" font-size="16" fill="#1e293b" font-weight="700">10. 藥品標示不全</text>
  <text x="560" y="367" font-size="15" fill="#57534e">2.8 標示/存放問題</text>

  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
