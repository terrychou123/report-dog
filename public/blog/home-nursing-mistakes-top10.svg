  <text x="28" y="74" font-size="28" fill="#1e293b" font-weight="700">10 個缺失——前 5 項快速對照</text>
  <!-- Row 1 N=5 H=60 -->
  <rect x="28" y="118" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="118" width="6" height="60" rx="2" fill="#78716c"/>
  <circle cx="66" cy="148" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="154" font-size="14" fill="#d97706" text-anchor="middle" font-weight="900">No.1</text>
  <text x="100" y="138" font-size="20" fill="#1e293b" font-weight="700">資源清單超過一年未更新（A1）</text>
  <text x="100" y="159" font-size="16" fill="#57534e">立即補更新記錄，標注版本日期與審閱說明</text>
  <rect x="620" y="126" width="136" height="44" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="146" font-size="16" fill="#d97706" text-anchor="middle">立即可補</text>
  <text x="688" y="162" font-size="16" fill="#d97706" text-anchor="middle">A1</text>
  <!-- Row 2 -->
  <rect x="28" y="191" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
