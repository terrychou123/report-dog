  <text x="100" y="357" font-size="20" fill="#1e293b" font-weight="700">安全辦法缺動物咬傷或扎刺傷（A3）</text>
  <text x="100" y="378" font-size="16" fill="#57534e">修訂辦法加入四類情境，記錄修訂日期</text>
  <rect x="620" y="345" width="136" height="44" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="365" font-size="16" fill="#a8a29e" text-anchor="middle">立即可補</text>
  <text x="688" y="381" font-size="16" fill="#a8a29e" text-anchor="middle">A3</text>
  <!-- Row 5 -->
  <rect x="28" y="410" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="410" width="6" height="60" rx="2" fill="#6b7280"/>
  <circle cx="66" cy="440" r="16" fill="#94a3b8" opacity="0.15"/>
  <text x="66" y="446" font-size="14" fill="#94a3b8" text-anchor="middle" font-weight="900">No.5</text>
  <text x="100" y="430" font-size="20" fill="#1e293b" font-weight="700">緊急事件記錄缺後續追蹤結果（A4）</text>
