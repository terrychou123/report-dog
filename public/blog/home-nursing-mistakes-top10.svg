  <text x="100" y="211" font-size="20" fill="#1e293b" font-weight="700">感染管制手冊缺更新記錄（A2）</text>
  <text x="100" y="232" font-size="16" fill="#57534e">補審閱記錄表，感控負責人簽名確認即可</text>
  <rect x="620" y="199" width="136" height="44" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="219" font-size="16" fill="#78716c" text-anchor="middle">立即可補</text>
  <text x="688" y="235" font-size="16" fill="#78716c" text-anchor="middle">A2</text>
  <!-- Row 3 -->
  <rect x="28" y="264" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="264" width="6" height="60" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="294" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="300" font-size="14" fill="#57534e" text-anchor="middle" font-weight="900">No.3</text>
  <text x="100" y="284" font-size="20" fill="#1e293b" font-weight="700">部分器材缺校正記錄（A2）</text>
