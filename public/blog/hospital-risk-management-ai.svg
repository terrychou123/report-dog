<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- 背景 -->
  <rect width="800" height="500" fill="#fafaf9"/>

  <!-- 頂部標題區 -->
  <rect width="800" height="90" fill="#1c1917"/>
  <text x="400" y="42"  font-size="22" font-weight="700" fill="#fff" text-anchor="middle">AI輔助風險管理文書三大應用</text>
  <text x="400" y="70"  font-size="14" fill="#a8a29e" text-anchor="middle">報告汪 AI 助理 | 提升文書效率 | 符合評鑑標準</text>

  <!-- 列1：全院風險評估報告 -->
  <rect x="32" y="166" width="736" height="90" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <rect x="32" y="166" width="8" height="90" rx="4" fill="#d97706"/>
  <circle cx="76" cy="211" r="20" fill="#d97706" opacity="0.15"/>
  <text x="76" y="216"  font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <text x="112" y="196"  font-size="15" font-weight="700" fill="#1c1917">全院風險評估報告</text>
  <text x="112" y="216"  font-size="14" fill="#57534e">AI協助彙整各部門風險評估資料</text>
  <text x="112" y="234"  font-size="14" fill="#57534e">自動生成風險矩陣圖表與優先處理建議</text>
  <rect x="660" y="192" width="90" height="26" rx="13" fill="#d97706"/>
  <text x="705" y="209"  font-size="14" font-weight="600" fill="#fff" text-anchor="middle">報告生成</text>

  <!-- 列2：RCA分析報告撰寫 -->
  <rect x="32" y="269" width="736" height="90" rx="10" fill="#fafaf9" stroke="#78716c" stroke-width="1.5"/>
  <rect x="32" y="269" width="8" height="90" rx="4" fill="#78716c"/>
  <circle cx="76" cy="314" r="20" fill="#78716c" opacity="0.15"/>
  <text x="76" y="319"  font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <text x="112" y="299"  font-size="15" font-weight="700" fill="#1c1917">RCA分析報告撰寫</text>
  <text x="112" y="319"  font-size="14" fill="#57534e">依標準RCA格式（事件描述/根本原因/改善措施）生成初稿</text>
  <text x="112" y="337"  font-size="14" fill="#57534e">品管人員審閱修訂，確保品質符合評鑑要求</text>
  <rect x="660" y="295" width="90" height="26" rx="13" fill="#78716c"/>
  <text x="705" y="312"  font-size="14" font-weight="600" fill="#fff" text-anchor="middle">RCA初稿</text>

  <!-- 列3：改善計畫追蹤文書 -->
  <rect x="32" y="372" width="736" height="90" rx="10" fill="#fafaf9" stroke="#57534e" stroke-width="1.5"/>
  <rect x="32" y="372" width="8" height="90" rx="4" fill="#57534e"/>
  <circle cx="76" cy="417" r="20" fill="#57534e" opacity="0.15"/>
  <text x="76" y="422"  font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <text x="112" y="402"  font-size="15" font-weight="700" fill="#1c1917">改善計畫追蹤文書</text>
  <text x="112" y="422"  font-size="14" fill="#57534e">自動追蹤改善措施執行狀態，生成進度報告供管理層審閱</text>
  <text x="112" y="440"  font-size="14" fill="#57534e">確保閉環管理，避免改善措施流於形式</text>
  <rect x="660" y="398" width="90" height="26" rx="13" fill="#57534e"/>
  <text x="705" y="415"  font-size="14" font-weight="600" fill="#fff" text-anchor="middle">追蹤報告</text>

  <!-- 浮水印 -->
  <text x="400" y="480"  font-size="14" fill="#a8a29e" text-anchor="middle" opacity="0.6">報告汪 reportwang.com</text>
</svg>
