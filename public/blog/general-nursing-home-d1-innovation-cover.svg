<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 裝飾背景塊 -->
  <rect x="0" y="0" width="480" height="630" fill="#d97706" opacity="0.08"/>
  <rect x="60" y="60" width="6" height="510" fill="#d97706" opacity="0.5" rx="2"/>
  <!-- 大字 D1 -->
  <text x="120" y="320" font-size="220" font-weight="900" fill="#d97706" opacity="0.18" letter-spacing="-10">D1</text>
  <!-- 主標題 -->
  <text x="90" y="160" font-size="52" font-weight="900" fill="#1e293b">護理之家</text>
  <text x="90" y="226" font-size="52" font-weight="900" fill="#d97706">D1 創新加分項</text>
  <text x="90" y="290" font-size="36" font-weight="700" fill="#57534e">怎麼拿？</text>
  <!-- 副標題 -->
  <text x="90" y="350" font-size="24" fill="#78716c">5 個低成本高效益的創新案例</text>
  <!-- 分隔線 -->
  <rect x="90" y="374" width="120" height="4" fill="#d97706" rx="2"/>
  <!-- 5個案例圖示卡片區 -->
  <!-- 卡片1 -->
  <rect x="540" y="80" width="160" height="110" rx="12" fill="#ffffff" opacity="0.9"/>
  <text x="620" y="132" font-size="36" text-anchor="middle" fill="#d97706"></text>
  <text x="620" y="163" font-size="24" text-anchor="middle" fill="#57534e" font-weight="700">AI 文書工具</text>
  <text x="620" y="182" font-size="20" text-anchor="middle" fill="#78716c">文書省 33%</text>
  <!-- 卡片2 -->
  <rect x="720" y="80" width="160" height="110" rx="12" fill="#ffffff" opacity="0.9"/>
  <text x="800" y="132" font-size="36" text-anchor="middle" fill="#d97706"></text>
  <text x="800" y="163" font-size="24" text-anchor="middle" fill="#57534e" font-weight="700">生命故事書</text>
  <text x="800" y="182" font-size="20" text-anchor="middle" fill="#78716c">個別化照護</text>
  <!-- 卡片3 -->
  <rect x="900" y="80" width="160" height="110" rx="12" fill="#ffffff" opacity="0.9"/>
  <text x="980" y="132" font-size="36" text-anchor="middle" fill="#d97706"></text>
  <text x="980" y="163" font-size="24" text-anchor="middle" fill="#57534e" font-weight="700">失智友善環境</text>
  <text x="980" y="182" font-size="20" text-anchor="middle" fill="#78716c">環境改善</text>
  <!-- 卡片4 -->
  <rect x="630" y="210" width="160" height="110" rx="12" fill="#ffffff" opacity="0.9"/>
  <text x="710" y="262" font-size="36" text-anchor="middle" fill="#d97706"></text>
  <text x="710" y="293" font-size="24" text-anchor="middle" fill="#57534e" font-weight="700">數位探視系統</text>
  <text x="710" y="312" font-size="20" text-anchor="middle" fill="#78716c">家屬連結</text>
  <!-- 卡片5 -->
  <rect x="810" y="210" width="160" height="110" rx="12" fill="#ffffff" opacity="0.9"/>
  <text x="890" y="262" font-size="36" text-anchor="middle" fill="#d97706"></text>
  <text x="890" y="293" font-size="24" text-anchor="middle" fill="#57534e" font-weight="700">技能競賽</text>
  <text x="890" y="312" font-size="20" text-anchor="middle" fill="#78716c">工作人員參與</text>
  <!-- 要點清單 -->
  <rect x="90" y="400" width="420" height="168" rx="12" fill="#ffffff" opacity="0.7"/>
  <text x="116" y="432" font-size="24" font-weight="700" fill="#d97706">D1 評鑑基準（115年度）</text>
  <text x="116" y="458" font-size="20" fill="#57534e">[v] 推動創新服務，有具體成效</text>
  <text x="116" y="482" font-size="20" fill="#57534e">[v] 參與政府計畫或試辦方案</text>
  <text x="116" y="506" font-size="20" fill="#57534e">[v] 創新成果有書面記錄及成效評估</text>
  <text x="116" y="530" font-size="20" fill="#57534e">[v] 鼓勵工作人員參與創新發展</text>
  <!-- 底部大圓形裝飾 -->
  <circle cx="1100" cy="550" r="180" fill="#d97706" opacity="0.06"/>
  <!-- 標籤 -->
  <rect x="540" y="360" width="140" height="36" rx="18" fill="#d97706"/>
  <text x="610" y="383" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700">115年度評鑑基準</text>
  <rect x="700" y="360" width="140" height="36" rx="18" fill="#57534e"/>
  <text x="770" y="383" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700">加分項攻略</text>
  <!-- 浮水印 -->
  <text x="1140" y="590" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
