  <text x="100" y="212" font-size="18" fill="#1e293b" font-weight="700">B區：數字要能背、現場要能示範</text>
  <text x="100" y="233" font-size="16" fill="#57534e">監測數值（月報）、照護技能現場示範</text>
  <rect x="620" y="199" width="136" height="46" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="218" font-size="16" fill="#78716c" text-anchor="middle">B區</text>
  <text x="688" y="238" font-size="16" fill="#78716c" text-anchor="middle">數字</text>
