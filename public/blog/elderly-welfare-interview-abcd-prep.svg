  <circle cx="66" cy="295" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="301" font-size="14" fill="#57534e" text-anchor="middle" font-weight="900">C區</text>
  <text x="100" y="285" font-size="18" fill="#1e293b" font-weight="700">C區：安全設施要能即時出示</text>
