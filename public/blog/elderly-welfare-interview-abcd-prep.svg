  <text x="100" y="139" font-size="18" fill="#1e293b" font-weight="700">A區：制度細節考驗主管熟悉度</text>
  <text x="100" y="160" font-size="16" fill="#57534e">負責人需熟知人力配置比例、訓練時數規定</text>
