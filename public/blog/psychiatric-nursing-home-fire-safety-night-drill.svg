<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <text x="40" y="48" font-size="32" font-weight="900" fill="#1e293b" font-family="'Noto Sans TC', sans-serif">夜間演練計畫四大要素</text>
  <text x="40" y="78" font-size="22" fill="#78716c" font-family="'Noto Sans TC', sans-serif">精神護理之家夜間演練的特殊規劃重點</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#d97706" stroke-width="2"/>

  <!-- 流程連接線 -->
  <line x1="130" y1="200" x2="670" y2="200" stroke="#e8e6de" stroke-width="4" stroke-dasharray="8,4"/>

  <!-- 步驟1 -->
  <circle cx="130" cy="200" r="38" fill="#d97706"/>
  <text x="130" y="196" font-size="20" font-weight="700" fill="white" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">訂</text>
  <text x="130" y="218" font-size="20" font-weight="700" fill="white" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">計畫</text>
  <rect x="60" y="258" width="140" height="100" rx="8" fill="white"/>
  <text x="130" y="284" font-size="17" font-weight="700" fill="#d97706" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">訂計畫</text>
  <text x="130" y="306" font-size="13" fill="#57534e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">符合機構特性</text>
  <text x="130" y="324" font-size="13" fill="#57534e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">的夜間演練計畫</text>
  <text x="130" y="342" font-size="13" fill="#57534e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">含住民移動輔助</text>

  <!-- 步驟2 -->
  <circle cx="330" cy="200" r="38" fill="#78716c"/>
  <text x="330" y="196" font-size="20" font-weight="700" fill="white" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">落實</text>
  <text x="330" y="218" font-size="20" font-weight="700" fill="white" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">執行</text>
  <rect x="260" y="258" width="140" height="100" rx="8" fill="white"/>
  <text x="330" y="284" font-size="17" font-weight="700" fill="#78716c" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">落實執行</text>
  <text x="330" y="306" font-size="13" fill="#57534e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">真實情境演練</text>
  <text x="330" y="324" font-size="13" fill="#57534e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">夜班人員全員</text>
  <text x="330" y="342" font-size="13" fill="#57534e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">參與配合</text>

  <!-- 步驟3 -->
  <circle cx="530" cy="200" r="38" fill="#57534e"/>
  <text x="530" y="196" font-size="20" font-weight="700" fill="white" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">完整</text>
  <text x="530" y="218" font-size="20" font-weight="700" fill="white" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">記錄</text>
  <rect x="460" y="258" width="140" height="100" rx="8" fill="white"/>
  <text x="530" y="284" font-size="17" font-weight="700" fill="#57534e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">完整記錄</text>
  <text x="530" y="306" font-size="13" fill="#57534e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">演練日期時間</text>
  <text x="530" y="324" font-size="13" fill="#57534e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">參與人員名單</text>
  <text x="530" y="342" font-size="13" fill="#57534e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">住民疏散情形</text>

  <!-- 步驟4 -->
  <circle cx="670" cy="200" r="38" fill="#a8a29e"/>
  <text x="670" y="196" font-size="20" font-weight="700" fill="white" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">檢討</text>
  <text x="670" y="218" font-size="20" font-weight="700" fill="white" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">改善</text>
  <rect x="600" y="258" width="140" height="100" rx="8" fill="white"/>
  <text x="670" y="284" font-size="17" font-weight="700" fill="#a8a29e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">檢討改善</text>
  <text x="670" y="306" font-size="13" fill="#57534e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">演練後討論</text>
  <text x="670" y="324" font-size="13" fill="#57534e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">不足之處改善</text>
  <text x="670" y="342" font-size="13" fill="#57534e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">修訂演練計畫</text>

  <!-- 提示文字 -->
  <rect x="40" y="400" width="720" height="48" rx="8" fill="#d97706" fill-opacity="0.12"/>
  <text x="400" y="430" font-size="19" fill="#d97706" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">精神護理之家夜間住民移動輔助需特別規劃，符合機構特性</text>

  <!-- 品牌浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-family="'Noto Sans TC', sans-serif">報告汪 reportwang.com</text>
</svg>
