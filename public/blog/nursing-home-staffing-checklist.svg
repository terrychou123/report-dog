<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <text x="400" y="48"  font-size="32" font-weight="700" fill="#1e293b" text-anchor="middle">A11 人力配置評鑑自查清單</text>
  <text x="400" y="78"  font-size="22" fill="#78716c" text-anchor="middle">評鑑前確認所有 A11 要件</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#a8a29e" stroke-width="1.5"/>
  <!-- 清單項目 -->
  <rect x="40" y="114" width="720" height="44" rx="6" fill="#ffffff"/>
  <rect x="40" y="114" width="4" height="44" rx="2" fill="#d97706"/>
  <rect x="54" y="124" width="24" height="24" rx="4" fill="#d97706" opacity="0.15"/>
  <text x="56" y="140"  font-size="18" fill="#d97706">&#10003;</text>
  <text x="90" y="132"  font-size="15" font-weight="700" fill="#1e293b">各型別住民人數及對應所需照服員人數已計算確認</text>
  <text x="90" y="150"  font-size="14" fill="#78716c">長照型 1:5、養護型 1:8、失智型 1:3（日班）</text>
  <rect x="40" y="166" width="720" height="44" rx="6" fill="#f8f7f5"/>
  <rect x="40" y="166" width="4" height="44" rx="2" fill="#d97706"/>
  <rect x="54" y="176" width="24" height="24" rx="4" fill="#d97706" opacity="0.15"/>
  <text x="56" y="192"  font-size="18" fill="#d97706">&#10003;</text>
  <text x="90" y="184"  font-size="15" font-weight="700" fill="#1e293b">夜班人力達標，且每班至少 1 位本國籍照服員</text>
  <text x="90" y="202"  font-size="14" fill="#78716c">長照型夜班 1:15、養護型 1:25、失智型 1:15</text>
  <rect x="40" y="218" width="720" height="44" rx="6" fill="#ffffff"/>
  <rect x="40" y="218" width="4" height="44" rx="2" fill="#78716c"/>
  <rect x="54" y="228" width="24" height="24" rx="4" fill="#78716c" opacity="0.15"/>
  <text x="56" y="244"  font-size="18" fill="#78716c">&#10003;</text>
  <text x="90" y="236"  font-size="15" font-weight="700" fill="#1e293b">外籍照服員人數不超過（本國籍照服員 + 護理人員）總數</text>
  <text x="90" y="254"  font-size="14" fill="#78716c">計算公式：外籍 <= 本國籍照服員 + 護理人員</text>
  <rect x="40" y="270" width="720" height="44" rx="6" fill="#f8f7f5"/>
  <rect x="40" y="270" width="4" height="44" rx="2" fill="#78716c"/>
  <rect x="54" y="280" width="24" height="24" rx="4" fill="#78716c" opacity="0.15"/>
  <text x="56" y="296"  font-size="18" fill="#78716c">&#10003;</text>
  <text x="90" y="288"  font-size="15" font-weight="700" fill="#1e293b">工作人員名冊、排班表、出勤記錄均已備妥</text>
  <text x="90" y="306"  font-size="14" fill="#78716c">含過去 4 年配置狀況的記錄</text>
  <rect x="40" y="322" width="720" height="44" rx="6" fill="#ffffff"/>
  <rect x="40" y="322" width="4" height="44" rx="2" fill="#57534e"/>
  <rect x="54" y="332" width="24" height="24" rx="4" fill="#57534e" opacity="0.15"/>
  <text x="56" y="348"  font-size="18" fill="#57534e">&#10003;</text>
  <text x="90" y="340"  font-size="15" font-weight="700" fill="#1e293b">照服員資格證明（照顧服務員訓練結業證書）均已留存</text>
  <text x="90" y="358"  font-size="14" fill="#78716c">每位照服員的訓練結業證書或相關資格證明</text>
  <rect x="40" y="374" width="720" height="44" rx="6" fill="#f8f7f5"/>
  <rect x="40" y="374" width="4" height="44" rx="2" fill="#57534e"/>
  <rect x="54" y="384" width="24" height="24" rx="4" fill="#57534e" opacity="0.15"/>
  <text x="56" y="400"  font-size="18" fill="#57534e">&#10003;</text>
  <text x="90" y="392"  font-size="15" font-weight="700" fill="#1e293b">照服員可現場示範照顧操作並熟悉流程</text>
  <text x="90" y="410"  font-size="14" fill="#78716c">委員可能現場抽測，需確保照服員熟悉實務操作</text>
  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" >報告汪 reportwang.com</text>
</svg>
