<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"
     font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- Header（y=50, h=76）-->
  <rect x="0" y="50" width="800" height="76" fill="white"/>
  <rect x="0" y="50" width="6" height="76" fill="#d97706" rx="2"/>
  <text x="28" y="104" font-size="36" fill="#1e293b" font-weight="700">年度計畫與教育訓練制度建立</text>

  <!-- ===== Row 1（y=160）#d97706 制定年度計畫 ===== -->
  <rect x="28" y="160" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="160" width="6" height="62" rx="2" fill="#d97706"/>
  <circle cx="66" cy="191" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="197" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">5</text>
  <text x="100" y="188" font-size="22" fill="#1e293b" font-weight="700">制定年度服務計畫</text>
  <text x="100" y="208" font-size="16" fill="#57534e">規劃節日活動、訓練課程、評鑑準備時程，一次統整全年</text>
  <rect x="620" y="168" width="136" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="181" font-size="16" fill="#d97706" text-anchor="middle">年度規劃</text>
  <text x="688" y="201" font-size="16" fill="#d97706" text-anchor="middle">全年統整</text>

  <!-- ===== Row 2（y=235）#78716c 規劃訓練制度 ===== -->
  <rect x="28" y="235" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="235" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="66" cy="266" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="272" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">6</text>
  <text x="100" y="263" font-size="22" fill="#1e293b" font-weight="700">規劃全年教育訓練日曆</text>
  <text x="100" y="283" font-size="16" fill="#57534e">建立訓練時程，確保人員依法達到在職訓練時數要求</text>
  <rect x="620" y="243" width="136" height="46" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="256" font-size="16" fill="#78716c" text-anchor="middle">訓練日曆</text>
  <text x="688" y="276" font-size="16" fill="#78716c" text-anchor="middle">時數達標</text>

  <!-- ===== Row 3（y=310）#57534e 特殊訓練 ===== -->
  <rect x="28" y="310" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="310" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="66" cy="341" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="347" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">+</text>
  <text x="100" y="338" font-size="22" fill="#1e293b" font-weight="700">特殊訓練時數要特別注意</text>
  <text x="100" y="358" font-size="16" fill="#57534e">失智照顧、身障服務等特殊訓練時數，評鑑查核有明確要求</text>
  <rect x="620" y="318" width="136" height="46" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="331" font-size="16" fill="#57534e" text-anchor="middle">特殊訓練</text>
  <text x="688" y="351" font-size="16" fill="#57534e" text-anchor="middle">額外注意</text>

  <!-- ===== Row 4（y=385）#a8a29e 訓練記錄 ===== -->
  <rect x="28" y="385" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="385" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="416" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="422" font-size="16" fill="#a8a29e" text-anchor="middle" font-weight="900">+</text>
  <text x="100" y="413" font-size="22" fill="#1e293b" font-weight="700">訓練紀錄完整保存是關鍵</text>
  <text x="100" y="433" font-size="16" fill="#57534e">每次訓練的簽到表、教材、評核表均需完整歸檔備查</text>
  <rect x="620" y="393" width="136" height="46" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="406" font-size="16" fill="#a8a29e" text-anchor="middle">訓練記錄</text>
  <text x="688" y="426" font-size="16" fill="#a8a29e" text-anchor="middle">完整歸檔</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
