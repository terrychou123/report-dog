<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <text x="400" y="48"  font-size="32" font-weight="700" fill="#1e293b" text-anchor="middle">評分制度四大架構</text>
  <text x="400" y="78"  font-size="22" fill="#78716c" text-anchor="middle">了解規則才能有效衝刺</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#a8a29e" stroke-width="1.5"/>
  <!-- 左上：一級必要 -->
  <rect x="40" y="118" width="348" height="160" rx="14" fill="#d97706"/>
  <text x="214" y="162"  font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">一級必要項（9 項）</text>
  <text x="214" y="190"  font-size="15" fill="#fff3cd" text-anchor="middle">底線要求</text>
  <text x="214" y="214"  font-size="15" fill="#fff3cd" text-anchor="middle">任一不達標 = 無法通過</text>
  <text x="214" y="238"  font-size="14" fill="#fff3cd" text-anchor="middle">（A7、A9、A11、C4、C9、C10、C11、C12、C15）</text>
  <text x="214" y="262"  font-size="14" fill="#fff3cd" text-anchor="middle">優先確保，無論等第</text>
  <!-- 右上：二級加強 -->
  <rect x="412" y="118" width="348" height="160" rx="14" fill="#78716c"/>
  <text x="586" y="162"  font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">二級加強項</text>
  <text x="586" y="190"  font-size="15" fill="#d4ccc8" text-anchor="middle">重點提升項</text>
  <text x="586" y="214"  font-size="15" fill="#d4ccc8" text-anchor="middle">加強型計分</text>
  <text x="586" y="238"  font-size="15" fill="#d4ccc8" text-anchor="middle">如 B2、D1、A2、C5、C6、C7</text>
  <text x="586" y="262"  font-size="14" fill="#d4ccc8" text-anchor="middle">資源投入有較高得分回報</text>
  <!-- 左下：E 加分 -->
  <rect x="40" y="298" width="348" height="160" rx="14" fill="#57534e"/>
  <text x="214" y="342"  font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">E 區塊加分項</text>
  <text x="214" y="370"  font-size="15" fill="#d4ccc8" text-anchor="middle">E1：前次建議改善 80%+</text>
  <text x="214" y="392"  font-size="15" fill="#d4ccc8" text-anchor="middle">E2：創新服務每項 0.5 分</text>
  <text x="214" y="414"  font-size="15" fill="#d4ccc8" text-anchor="middle">最多加 3 分</text>
  <text x="214" y="436"  font-size="14" fill="#d4ccc8" text-anchor="middle">衝刺優等的關鍵</text>
  <!-- 右下：E3 扣分 -->
  <rect x="412" y="298" width="348" height="160" rx="14" fill="#94a3b8"/>
  <text x="586" y="342"  font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">E3 違規扣分</text>
  <text x="586" y="370"  font-size="15" fill="#e2e8f0" text-anchor="middle">總分外扣分</text>
  <text x="586" y="392"  font-size="15" fill="#e2e8f0" text-anchor="middle">違規事項或重大負面事件</text>
  <text x="586" y="414"  font-size="15" fill="#e2e8f0" text-anchor="middle">（性侵害、對住民施暴等）</text>
  <text x="586" y="436"  font-size="14" fill="#e2e8f0" text-anchor="middle">零違規是維持優等的前提</text>
  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" >報告汪 reportwang.com</text>
</svg>
