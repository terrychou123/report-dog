<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 右側裝飾區塊 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>

  <!-- 右側裝飾大數字 -->
  <text x="1010" y="219" font-size="140" font-weight="900" fill="#d97706" text-anchor="middle" opacity="0.85">A1</text>
  <text x="1010" y="261" font-size="26" fill="#78716c" text-anchor="middle" font-weight="600">社區資源盤點</text>

  <!-- 右側 3 個條件說明 -->
  <rect x="840" y="279" width="320" height="60" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="840" y="279" width="6" height="60" rx="2" fill="#d97706"/>
  <text x="860" y="304" font-size="22" fill="#d97706" font-weight="700">條件 1</text>
  <text x="860" y="328" font-size="20" fill="#78716c">定期更新資源清單</text>

  <rect x="840" y="351" width="320" height="60" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="840" y="351" width="6" height="60" rx="2" fill="#78716c"/>
  <text x="860" y="376" font-size="22" fill="#78716c" font-weight="700">條件 2</text>
  <text x="860" y="400" font-size="20" fill="#78716c">資源連結運用紀錄</text>

  <rect x="840" y="423" width="320" height="60" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="840" y="423" width="6" height="60" rx="2" fill="#57534e"/>
  <text x="860" y="448" font-size="22" fill="#57534e" font-weight="700">條件 3</text>
  <text x="860" y="472" font-size="20" fill="#78716c">轉介機制含追蹤結果</text>

  <!-- 右側底部標籤 -->
  <rect x="840" y="497" width="320" height="52" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="1000" y="533" font-size="26" fill="#d97706" text-anchor="middle" font-weight="700">醫療 · 長照 · 社福</text>

  <rect x="840" y="561" width="320" height="52" rx="10" fill="#78716c" opacity="0.10"/>
  <text x="1000" y="597" font-size="22" fill="#78716c" text-anchor="middle" font-weight="600">轉介追蹤是關鍵</text>

  <!-- 浮水印 -->
  <text x="1140" y="590" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>

  <!-- 左側主內容區 -->
  <text x="60" y="200" font-size="110" font-weight="900" fill="#1e293b">社區資源盤點</text>
  <text x="60" y="338" font-size="110" font-weight="900" fill="#d97706">A1 實務教學</text>

  <line x1="60" y1="365" x2="780" y2="365" stroke="#dedad3" stroke-width="2"/>

  <text x="60" y="416" font-size="36" fill="#57534e" font-weight="400">資源清單架構 · 轉介記錄格式 · 追蹤結果</text>

  <!-- 特色標籤列 -->
  <rect x="60" y="450" width="148" height="54" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="134" y="483" font-size="28" fill="#d97706" text-anchor="middle" font-weight="600">社區資源</text>

  <rect x="220" y="450" width="148" height="54" rx="10" fill="#78716c" opacity="0.12"/>
  <text x="294" y="483" font-size="28" fill="#78716c" text-anchor="middle" font-weight="600">A1 基準</text>

  <rect x="380" y="450" width="148" height="54" rx="10" fill="#57534e" opacity="0.12"/>
  <text x="454" y="483" font-size="28" fill="#57534e" text-anchor="middle" font-weight="600">轉介機制</text>

  <rect x="540" y="450" width="148" height="54" rx="10" fill="#a8a29e" opacity="0.18"/>
  <text x="614" y="483" font-size="28" fill="#78716c" text-anchor="middle" font-weight="600">115 年度</text>

  <!-- 適用對象 -->
  <text x="60" y="558" font-size="28" fill="#94a3b8">適用對象：居家護理所負責人 · 護理長 · 護理師</text>
</svg>
