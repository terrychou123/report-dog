<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <text x="400" y="48"  font-size="32" font-weight="700" fill="#1e293b" text-anchor="middle">四步驟缺失追蹤系統</text>
  <text x="400" y="78"  font-size="22" fill="#78716c" text-anchor="middle">從收到查核通知到歸檔完成</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#a8a29e" stroke-width="1.5"/>
  <!-- 步驟1 -->
  <rect x="40" y="118" width="162" height="270" rx="12" fill="#d97706"/>
  <text x="121" y="172"  font-size="36" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="121" y="204"  font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">即時登錄</text>
  <text x="121" y="234"  font-size="13" fill="#fff3cd" text-anchor="middle">收到查核通知</text>
  <text x="121" y="252"  font-size="13" fill="#fff3cd" text-anchor="middle">或缺失函後</text>
  <text x="121" y="270"  font-size="13" fill="#fff3cd" text-anchor="middle">立即登錄台帳</text>
  <text x="121" y="302"  font-size="12" fill="#fef3c7" text-anchor="middle">當日完成</text>
  <!-- 箭頭1 -->
  <text x="214" y="260"  font-size="28" fill="#a8a29e" text-anchor="middle">&#8594;</text>
  <!-- 步驟2 -->
  <rect x="222" y="118" width="162" height="270" rx="12" fill="#78716c"/>
  <text x="303" y="172"  font-size="36" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="303" y="204"  font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">制定改善計畫</text>
  <text x="303" y="234"  font-size="13" fill="#d4ccc8" text-anchor="middle">負責人、方法</text>
  <text x="303" y="252"  font-size="13" fill="#d4ccc8" text-anchor="middle">目標、期限</text>
  <text x="303" y="270"  font-size="13" fill="#d4ccc8" text-anchor="middle">主管核准</text>
  <text x="303" y="302"  font-size="12" fill="#e7e5e4" text-anchor="middle">7 工作天內</text>
  <!-- 箭頭2 -->
  <text x="396" y="260"  font-size="28" fill="#a8a29e" text-anchor="middle">&#8594;</text>
  <!-- 步驟3 -->
  <rect x="404" y="118" width="162" height="270" rx="12" fill="#57534e"/>
  <text x="485" y="172"  font-size="36" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="485" y="204"  font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">執行留佐證</text>
  <text x="485" y="234"  font-size="13" fill="#d4ccc8" text-anchor="middle">依計畫執行</text>
  <text x="485" y="252"  font-size="13" fill="#d4ccc8" text-anchor="middle">照片、記錄</text>
  <text x="485" y="270"  font-size="13" fill="#d4ccc8" text-anchor="middle">採購單據</text>
  <text x="485" y="302"  font-size="12" fill="#e7e5e4" text-anchor="middle">計畫期限內</text>
  <!-- 箭頭3 -->
  <text x="578" y="260"  font-size="28" fill="#a8a29e" text-anchor="middle">&#8594;</text>
  <!-- 步驟4 -->
  <rect x="586" y="118" width="174" height="270" rx="12" fill="#94a3b8"/>
  <text x="673" y="172"  font-size="36" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="673" y="204"  font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">複核歸檔</text>
  <text x="673" y="234"  font-size="13" fill="#e2e8f0" text-anchor="middle">內部複核</text>
  <text x="673" y="252"  font-size="13" fill="#e2e8f0" text-anchor="middle">填寫結案記錄</text>
  <text x="673" y="270"  font-size="13" fill="#e2e8f0" text-anchor="middle">更新台帳狀態</text>
  <text x="673" y="302"  font-size="12" fill="#f1f5f9" text-anchor="middle">改善完成後</text>
  <!-- 底部提示 -->
  <rect x="40" y="410" width="720" height="48" rx="10" fill="#d97706" opacity="0.1"/>
  <text x="400" y="440"  font-size="14" fill="#57534e" text-anchor="middle">四大查核機關：衛福主管機關 / 消防局 / 建管局 / 勞政局——每一機關均適用此流程</text>
  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" >報告汪 reportwang.com</text>
</svg>
