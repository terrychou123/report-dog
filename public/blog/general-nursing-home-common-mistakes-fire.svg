<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <text x="40" y="48" font-size="32" fill="#1e293b" font-weight="700">C 區消防安全 2 大常見缺失</text>
  <text x="40" y="76" font-size="22" fill="#57534e">夜間演練缺漏 · 情境計畫不足——評鑑前必須補強</text>
  <line x1="40" y1="92" x2="760" y2="92" stroke="#2563eb" stroke-width="2"/>

  <!-- 缺失8 夜間演練 -->
  <rect x="40" y="112" width="350" height="310" rx="12" fill="white" stroke="#2563eb" stroke-width="2"/>
  <rect x="40" y="112" width="350" height="46" rx="12" fill="#2563eb"/>
  <rect x="40" y="134" width="350" height="24" fill="#2563eb"/>
  <text x="215" y="140" font-size="18" fill="#fff" font-weight="700" text-anchor="middle">缺失8：缺少夜間消防演練</text>
  <text x="215" y="160" font-size="14" fill="#bfdbfe" text-anchor="middle">C1 基準明確要求每年至少1次</text>
  <text x="56" y="190" font-size="14" fill="#57534e" font-weight="600">為什麼夜間演練不能少？</text>
  <text x="56" y="212" font-size="14" fill="#57534e">• 夜間人力只有白天的 1/3</text>
  <text x="56" y="232" font-size="14" fill="#57534e">• 住民熟睡中，喚醒需要更多時間</text>
  <text x="56" y="252" font-size="14" fill="#57534e">• 光線不足，疏散難度大幅提高</text>
  <text x="56" y="284" font-size="14" fill="#57534e" font-weight="600">如何安排？</text>
  <text x="56" y="306" font-size="14" fill="#57534e">建議選擇傍晚 7-8 點（「準夜間」），</text>
  <text x="56" y="326" font-size="14" fill="#57534e">既符合夜間演練要求，又能降低</text>
  <text x="56" y="346" font-size="14" fill="#57534e">對已入睡住民的影響。</text>
  <text x="56" y="376" font-size="14" fill="#dc2626" font-weight="600">評鑑前還未辦？立即排定！</text>
  <text x="56" y="396" font-size="14" fill="#57534e">演練後留存：時間、人員名單、</text>
  <text x="56" y="414" font-size="14" fill="#57534e">疏散時間、問題與改善措施</text>

  <!-- 缺失9 情境計畫 -->
  <rect x="410" y="112" width="350" height="310" rx="12" fill="white" stroke="#dc2626" stroke-width="2"/>
  <rect x="410" y="112" width="350" height="46" rx="12" fill="#dc2626"/>
  <rect x="410" y="134" width="350" height="24" fill="#dc2626"/>
  <text x="585" y="140" font-size="18" fill="#fff" font-weight="700" text-anchor="middle">缺失9：只熟悉一個起火情境</text>
  <text x="585" y="160" font-size="14" fill="#fee2e2" text-anchor="middle">C4 情境演練——委員當場指定</text>
  <text x="426" y="190" font-size="14" fill="#57534e" font-weight="600">評鑑委員可能這樣問：</text>
  <text x="426" y="212" font-size="14" fill="#57534e">「假設走廊中段起火，你們怎麼疏散？」</text>
  <text x="426" y="244" font-size="14" fill="#57534e" font-weight="600">你必須準備的情境（至少3個）：</text>
  <text x="426" y="266" font-size="14" fill="#57534e">① 廚房起火</text>
  <text x="426" y="286" font-size="14" fill="#57534e">② 走廊起火</text>
  <text x="426" y="306" font-size="14" fill="#57534e">③ 住民房間起火</text>
  <text x="426" y="338" font-size="14" fill="#dc2626" font-weight="600">每個情境需要：</text>
  <text x="426" y="358" font-size="14" fill="#57534e">• 書面疏散路線圖</text>
  <text x="426" y="378" font-size="14" fill="#57534e">• 各班次人員分工表</text>
  <text x="426" y="398" font-size="14" fill="#57534e">• 各班次均有實際演練過</text>
  <text x="426" y="414" font-size="14" fill="#dc2626">臨時補救不了，只能靠平時練</text>

  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
