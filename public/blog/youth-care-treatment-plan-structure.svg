<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- @template: categories -->
  <rect width="800" height="500" fill="#f0efe8"/>
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">處遇計畫四大核心要素</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">缺一不可，評鑑委員逐項查核</text>
  <line x1="28" y1="94" x2="772" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- 2×2 四大要素卡片 -->
  <!-- 上排左：個案評估 -->
  <rect x="28" y="104" width="364" height="168" rx="12" fill="white"/>
  <rect x="28" y="104" width="364" height="44" rx="12" fill="#d97706"/>
  <rect x="28" y="128" width="364" height="20" fill="#d97706"/>
  <!-- 標題列圖示（幾何） -->
  <circle cx="58" cy="126" r="9" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
  <circle cx="58" cy="126" r="3" fill="white"/>
  <text x="210" y="133" text-anchor="middle" font-size="20" fill="white" font-weight="700">要素 1：個案評估</text>
  <text x="48" y="172" font-size="16" fill="#57534e">• 入院原因與家庭背景</text>
  <text x="48" y="194" font-size="16" fill="#57534e">• 身心狀態評估結果</text>
  <text x="48" y="216" font-size="16" fill="#57534e">• 特殊需求與優勢資源</text>
  <rect x="44" y="240" width="80" height="22" rx="11" fill="#fef3c7"/>
  <text x="84" y="255" text-anchor="middle" font-size="14" fill="#d97706" font-weight="600">計畫依據</text>

  <!-- 上排右：具體目標 -->
  <rect x="408" y="104" width="364" height="168" rx="12" fill="white"/>
  <rect x="408" y="104" width="364" height="44" rx="12" fill="#78716c"/>
  <rect x="408" y="128" width="364" height="20" fill="#78716c"/>
  <circle cx="438" cy="126" r="9" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
  <circle cx="438" cy="126" r="3" fill="white"/>
  <text x="590" y="133" text-anchor="middle" font-size="20" fill="white" font-weight="700">要素 2：具體可量化目標</text>
  <text x="428" y="172" font-size="16" fill="#57534e">• 目標陳述清楚且可評估</text>
  <text x="428" y="194" font-size="16" fill="#57534e">• 設定達成指標和時程</text>
  <text x="428" y="216" font-size="16" fill="#57534e">• 反映個案個別需求</text>
  <rect x="424" y="240" width="80" height="22" rx="11" fill="#f5f5f4"/>
  <text x="464" y="255" text-anchor="middle" font-size="14" fill="#78716c" font-weight="600">關鍵環節</text>

  <!-- 下排左：介入策略 -->
  <rect x="28" y="288" width="364" height="162" rx="12" fill="white"/>
  <rect x="28" y="288" width="364" height="44" rx="12" fill="#57534e"/>
  <rect x="28" y="312" width="364" height="20" fill="#57534e"/>
  <circle cx="58" cy="310" r="9" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
  <circle cx="58" cy="310" r="3" fill="white"/>
  <text x="210" y="317" text-anchor="middle" font-size="20" fill="white" font-weight="700">要素 3：介入策略</text>
  <text x="48" y="356" font-size="16" fill="#57534e">• 誰做、做什麼、頻率</text>
  <text x="48" y="378" font-size="16" fill="#57534e">• 多專業協作分工</text>
  <text x="48" y="400" font-size="16" fill="#57534e">• 家庭支持資源連結</text>
  <rect x="44" y="420" width="80" height="22" rx="11" fill="#f5f0eb"/>
  <text x="84" y="435" text-anchor="middle" font-size="14" fill="#57534e" font-weight="600">執行藍圖</text>

  <!-- 下排右：定期評估 -->
  <rect x="408" y="288" width="364" height="162" rx="12" fill="white"/>
  <rect x="408" y="288" width="364" height="44" rx="12" fill="#a8a29e"/>
  <rect x="408" y="312" width="364" height="20" fill="#a8a29e"/>
  <circle cx="438" cy="310" r="9" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
  <circle cx="438" cy="310" r="3" fill="white"/>
  <text x="590" y="317" text-anchor="middle" font-size="20" fill="white" font-weight="700">要素 4：定期評估調整</text>
  <text x="428" y="356" font-size="16" fill="#57534e">• 每 3–6 個月定期評估</text>
  <text x="428" y="378" font-size="16" fill="#57534e">• 狀況改變即時調整計畫</text>
  <text x="428" y="400" font-size="16" fill="#57534e">• 評估結果影響下一期計畫</text>
  <rect x="424" y="420" width="80" height="22" rx="11" fill="#f5f5f4"/>
  <text x="464" y="435" text-anchor="middle" font-size="14" fill="#1e293b" font-weight="600">持續改善</text>

  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
