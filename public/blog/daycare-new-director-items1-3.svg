<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="450" fill="#f0efe8"/>
  <text x="400" y="46" font-size="21" font-weight="700" fill="#1e293b" text-anchor="middle">第 1–3 件事：人力、手冊、會議（快速摘要）</text>
  <rect x="60" y="58" width="48" height="3" rx="1.5" fill="#d97706"/>
  <line x1="116" y1="59.5" x2="740" y2="59.5" stroke="#dedad3" stroke-width="1"/>

  <!-- Item 1 -->
  <rect x="52" y="84" width="210" height="310" rx="12" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="52" y="84" width="210" height="5" rx="2.5" fill="#d97706"/>
  <rect x="68" y="100" width="30" height="30" rx="6" fill="#d97706" opacity="0.15"/>
  <text x="83" y="121" font-size="16" font-weight="900" fill="#d97706" text-anchor="middle">1</text>
  <text x="157" y="121" font-size="14" font-weight="700" fill="#1e293b">熟讀人力設置標準</text>
  <text x="157" y="139" font-size="11" fill="#d97706">第 28 條</text>
  <line x1="68" y1="152" x2="246" y2="152" stroke="#f0ede6" stroke-width="1"/>
  <text x="72" y="174" font-size="12" fill="#57534e">□ 執業登錄或報備</text>
  <text x="72" y="196" font-size="12" fill="#57534e">□ 執照效期確認</text>
  <text x="72" y="218" font-size="12" fill="#57534e">□ 勞保投保明細</text>
  <line x1="68" y1="236" x2="246" y2="236" stroke="#f0ede6" stroke-width="1"/>
  <rect x="68" y="248" width="178" height="32" rx="8" fill="#d97706" opacity="0.08"/>
  <text x="157" y="269" font-size="12" fill="#d97706" text-anchor="middle" font-weight="600">上任 2 週內完成</text>
  <text x="72" y="302" font-size="12" fill="#78716c">建立人力盤點表</text>
  <text x="72" y="322" font-size="12" fill="#78716c">每半年複查一次</text>
  <text x="72" y="344" font-size="11" fill="#57534e">第一個要被檢視的文件</text>
  <text x="72" y="364" font-size="11" fill="#57534e">→ 評鑑委員首查項</text>

  <!-- Item 2 -->
  <rect x="295" y="84" width="210" height="310" rx="12" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="295" y="84" width="210" height="5" rx="2.5" fill="#78716c"/>
  <rect x="311" y="100" width="30" height="30" rx="6" fill="#78716c" opacity="0.15"/>
  <text x="326" y="121" font-size="16" font-weight="900" fill="#78716c" text-anchor="middle">2</text>
  <text x="400" y="121" font-size="14" font-weight="700" fill="#1e293b">建立工作手冊</text>
  <text x="400" y="139" font-size="11" fill="#78716c">第 24 條</text>
  <line x1="311" y1="152" x2="489" y2="152" stroke="#f0ede6" stroke-width="1"/>
  <text x="315" y="174" font-size="12" fill="#57534e">□ 組織架構圖</text>
  <text x="315" y="196" font-size="12" fill="#57534e">□ 各職位職掌說明</text>
  <text x="315" y="218" font-size="12" fill="#57534e">□ 差勤規定</text>
  <line x1="311" y1="236" x2="489" y2="236" stroke="#f0ede6" stroke-width="1"/>
  <rect x="311" y="248" width="178" height="32" rx="8" fill="#78716c" opacity="0.08"/>
  <text x="400" y="269" font-size="12" fill="#78716c" text-anchor="middle" font-weight="600">上任 1 個月內完成</text>
  <text x="315" y="302" font-size="12" fill="#78716c">每年修訂 + 版本號</text>
  <text x="315" y="322" font-size="12" fill="#78716c">全體人員簽收</text>
  <text x="315" y="344" font-size="11" fill="#57534e">簽收單＝評鑑佐證文件</text>

  <!-- Item 3 -->
  <rect x="538" y="84" width="210" height="310" rx="12" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="538" y="84" width="210" height="5" rx="2.5" fill="#a8a29e"/>
  <rect x="554" y="100" width="30" height="30" rx="6" fill="#a8a29e" opacity="0.20"/>
  <text x="569" y="121" font-size="16" font-weight="900" fill="#78716c" text-anchor="middle">3</text>
  <text x="643" y="121" font-size="14" font-weight="700" fill="#1e293b">啟動月行政會議</text>
  <text x="643" y="139" font-size="11" fill="#78716c">第 25 條</text>
  <line x1="554" y1="152" x2="732" y2="152" stroke="#f0ede6" stroke-width="1"/>
  <text x="558" y="174" font-size="12" fill="#57534e">□ 每月固定日期召開</text>
  <text x="558" y="196" font-size="12" fill="#57534e">□ 四類人員參與</text>
  <text x="558" y="218" font-size="12" fill="#57534e">□ 議程 + 紀錄 + 簽名</text>
  <line x1="554" y1="236" x2="732" y2="236" stroke="#f0ede6" stroke-width="1"/>
  <rect x="554" y="248" width="178" height="32" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="643" y="269" font-size="12" fill="#78716c" text-anchor="middle" font-weight="600">上任當月啟動</text>
  <text x="558" y="302" font-size="12" fill="#78716c">決議追蹤欄</text>
  <text x="558" y="322" font-size="12" fill="#78716c">下次會議逐一回顧</text>
  <text x="558" y="344" font-size="11" fill="#57534e">PDCA 循環讓委員</text>
  <text x="558" y="364" font-size="11" fill="#57534e">一眼看出確實執行</text>

  <text x="760" y="421" font-size="16" fill="#c4bfb8" text-anchor="end" font-weight="400" font-family="'Noto Sans TC', sans-serif">報告汪 reportwang.com</text>
</svg>
