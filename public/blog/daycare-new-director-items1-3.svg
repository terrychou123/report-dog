<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"
     font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- Header（y=38, h=90）N=3 -->
  <rect x="0" y="38" width="800" height="90" fill="white"/>
  <rect x="0" y="38" width="6" height="90" fill="#d97706"/>
  <text x="28" y="99" font-size="40" fill="#1e293b" font-weight="700">上任前 3 件必做的事</text>

  <!-- ===== Row 1（y=166）H=90 #d97706 盤點人力 ===== -->
  <rect x="28" y="166" width="744" height="90" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="166" width="6" height="90" rx="2" fill="#d97706"/>
  <circle cx="66" cy="211" r="20" fill="#d97706" opacity="0.15"/>
  <text x="66" y="218" font-size="18" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <text x="100" y="205" font-size="28" fill="#1e293b" font-weight="700">全面盤點現有人力狀況</text>
  <text x="100" y="235" font-size="18" fill="#57534e">確認各職類人數是否符合法規比例，建立個人訓練時數追蹤清單</text>
  <rect x="620" y="174" width="136" height="52" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="195" font-size="16" fill="#d97706" text-anchor="middle">上任第一週</text>
  <text x="688" y="215" font-size="16" fill="#d97706" text-anchor="middle">人力盤點</text>

  <!-- ===== Row 2（y=269）H=90 #78716c 熟悉手冊 ===== -->
  <rect x="28" y="269" width="744" height="90" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="269" width="6" height="90" rx="2" fill="#78716c"/>
  <circle cx="66" cy="314" r="20" fill="#78716c" opacity="0.15"/>
  <text x="66" y="321" font-size="18" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <text x="100" y="308" font-size="28" fill="#1e293b" font-weight="700">熟讀服務作業手冊與評鑑基準</text>
  <text x="100" y="338" font-size="18" fill="#57534e">逐條閱讀評鑑指標，標記尚未符合項目，建立改善行動清單</text>
  <rect x="620" y="277" width="136" height="52" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="298" font-size="16" fill="#78716c" text-anchor="middle">上任第一月</text>
  <text x="688" y="318" font-size="16" fill="#78716c" text-anchor="middle">熟悉法規</text>

  <!-- ===== Row 3（y=372）H=90 #57534e 說明會 ===== -->
  <rect x="28" y="372" width="744" height="90" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="372" width="6" height="90" rx="2" fill="#57534e"/>
  <circle cx="66" cy="417" r="20" fill="#57534e" opacity="0.15"/>
  <text x="66" y="424" font-size="18" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <text x="100" y="411" font-size="28" fill="#1e293b" font-weight="700">召開全員說明會</text>
  <text x="100" y="441" font-size="18" fill="#57534e">介紹自己的管理方向，說明評鑑準備重點，凝聚全員共識</text>
  <rect x="620" y="380" width="136" height="52" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="401" font-size="16" fill="#57534e" text-anchor="middle">上任第一月</text>
  <text x="688" y="421" font-size="16" fill="#57534e" text-anchor="middle">全員說明</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
