<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- 標題 -->
  <text x="400" y="48" font-size="32" fill="#1e293b" text-anchor="middle" font-weight="700">多人協作準備評鑑 4 大訣竅</text>
  <text x="400" y="78" font-size="22" fill="#78716c" text-anchor="middle">讓品質管理不只靠一個人</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#d97706" stroke-width="2"/>

  <!-- 標題列背景 -->
  <rect x="0" y="29" width="800" height="60" fill="white"/>
  <rect x="0" y="29" width="6" height="60" fill="#d97706"/>

  <!-- 訣竅 1 -->
  <rect x="28" y="118" width="744" height="72" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="118" width="6" height="72" rx="3" fill="#d97706"/>
  <circle cx="70" cy="154" r="16" fill="#d97706"/>
  <text x="70" y="160" font-size="20" fill="white" text-anchor="middle" font-weight="700">1</text>
  <text x="105" y="143" font-size="14" fill="#1e293b" font-weight="600">指定「品質評鑑雙軌負責人」：一人對口評鑑、一人對口品質獎勵</text>
  <text x="105" y="163" font-size="14" fill="#57534e">兩人定期同步，確保文件可相互引用，避免平行作業產生衝突</text>
  <text x="105" y="181" font-size="13" fill="#78716c">評鑑前每週開一次「對齊會議」，30分鐘內解決文件格式差異</text>
  <rect x="620" y="126" width="136" height="55" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="151" font-size="13" fill="#d97706" text-anchor="middle" font-weight="600">分工明確</text>
  <text x="688" y="169" font-size="12" fill="#78716c" text-anchor="middle">雙軌並行</text>

  <!-- 訣竅 2 -->
  <rect x="28" y="203" width="744" height="72" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="203" width="6" height="72" rx="3" fill="#78716c"/>
  <circle cx="70" cy="239" r="16" fill="#78716c"/>
  <text x="70" y="245" font-size="20" fill="white" text-anchor="middle" font-weight="700">2</text>
  <text x="105" y="228" font-size="14" fill="#1e293b" font-weight="600">品質會議議程標準化：固定納入「評鑑指標進度」與「品質獎進度」</text>
  <text x="105" y="248" font-size="14" fill="#57534e">每次品質會議同時推進兩套系統，一份紀錄自然產生雙向佐證</text>
  <text x="105" y="266" font-size="13" fill="#78716c">會議紀錄標題格式：OOOO年度第X季品質暨評鑑追蹤會議</text>
  <rect x="620" y="211" width="136" height="55" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="236" font-size="13" fill="#78716c" text-anchor="middle" font-weight="600">會議整合</text>
  <text x="688" y="254" font-size="12" fill="#78716c" text-anchor="middle">一次產出</text>

  <!-- 訣竅 3 -->
  <rect x="28" y="288" width="744" height="72" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="288" width="6" height="72" rx="3" fill="#57534e"/>
  <circle cx="70" cy="324" r="16" fill="#57534e"/>
  <text x="70" y="330" font-size="20" fill="white" text-anchor="middle" font-weight="700">3</text>
  <text x="105" y="313" font-size="14" fill="#1e293b" font-weight="600">建立共用雲端文件夾：評鑑佐證依 A-E 分類，品質獎依指標分類</text>
  <text x="105" y="333" font-size="14" fill="#57534e">同一份文件放入兩個分類資料夾，避免重複建檔造成版本混亂</text>
  <text x="105" y="351" font-size="13" fill="#78716c">使用報告汪等協作平台統一管理，讓所有人即時存取最新版本</text>
  <rect x="620" y="296" width="136" height="55" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="321" font-size="13" fill="#57534e" text-anchor="middle" font-weight="600">文件共用</text>
  <text x="688" y="339" font-size="12" fill="#78716c" text-anchor="middle">避免版本亂</text>

  <!-- 訣竅 4 -->
  <rect x="28" y="373" width="744" height="72" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="373" width="6" height="72" rx="3" fill="#94a3b8"/>
  <circle cx="70" cy="409" r="16" fill="#94a3b8"/>
  <text x="70" y="415" font-size="20" fill="white" text-anchor="middle" font-weight="700">4</text>
  <text x="105" y="398" font-size="14" fill="#1e293b" font-weight="600">定期「雙向核對」：每季末對照兩套清單，找出漏洞補強</text>
  <text x="105" y="418" font-size="14" fill="#57534e">評鑑 75 項指標與品質獎勵指標各自確認進度，互相提醒補件</text>
  <text x="105" y="436" font-size="13" fill="#78716c">建議在 Q3 結束時進行一次完整的雙向核對，留足補強時間</text>
  <rect x="620" y="381" width="136" height="55" rx="8" fill="#94a3b8" opacity="0.18"/>
  <text x="688" y="406" font-size="13" fill="#57534e" text-anchor="middle" font-weight="600">定期核對</text>
  <text x="688" y="424" font-size="12" fill="#78716c" text-anchor="middle">Q3 末完成</text>

  <!-- 水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
