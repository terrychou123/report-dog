<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 右側裝飾區塊 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>

  <!-- 右側裝飾大數字 -->
  <text x="1010" y="230" font-size="160" font-weight="900" fill="#16a34a" text-anchor="middle" opacity="0.80">A2.1</text>
  <text x="1010" y="275" font-size="28" fill="#78716c" text-anchor="middle" font-weight="600">防疫機制落實執行</text>

  <!-- 右側四張核心要素卡片 2×2 -->
  <rect x="840" y="298" width="155" height="74" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="918" y="327" font-size="24" fill="#16a34a" text-anchor="middle" font-weight="700">感染管制計畫</text>
  <text x="918" y="352" font-size="20" fill="#78716c" text-anchor="middle">年度計畫書</text>

  <rect x="1005" y="298" width="155" height="74" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="1083" y="327" font-size="24" fill="#57534e" text-anchor="middle" font-weight="700">防疫演練記錄</text>
  <text x="1083" y="352" font-size="20" fill="#78716c" text-anchor="middle">傳染病監測</text>

  <rect x="840" y="384" width="155" height="74" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="918" y="413" font-size="24" fill="#57534e" text-anchor="middle" font-weight="700">6 小時訓練</text>
  <text x="918" y="438" font-size="20" fill="#78716c" text-anchor="middle">感控教育訓練</text>

  <rect x="1005" y="384" width="155" height="74" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="1083" y="413" font-size="24" fill="#16a34a" text-anchor="middle" font-weight="700">追蹤改善機制</text>
  <text x="1083" y="438" font-size="20" fill="#78716c" text-anchor="middle">監測記錄</text>

  <!-- 右側底部標籤 -->
  <rect x="840" y="470" width="320" height="52" rx="10" fill="#16a34a" opacity="0.12"/>
  <text x="1000" y="503" font-size="26" fill="#16a34a" text-anchor="middle" font-weight="700">4 項核心要素缺一不可</text>

  <!-- 左側主內容 -->
  <text x="60" y="210" font-size="120" font-weight="900" fill="#1e293b">感染管控</text>
  <text x="60" y="348" font-size="100" font-weight="900" fill="#16a34a">評鑑攻略</text>

  <line x1="60" y1="375" x2="780" y2="375" stroke="#dedad3" stroke-width="2"/>

  <text x="60" y="422" font-size="36" fill="#57534e" font-weight="400">從計畫撰寫到演練紀錄一次搞定</text>

  <!-- 特色標籤列 -->
  <rect x="60" y="452" width="130" height="50" rx="10" fill="#16a34a" opacity="0.12"/>
  <text x="125" y="483" font-size="26" fill="#16a34a" text-anchor="middle" font-weight="600">感控計畫</text>

  <rect x="202" y="452" width="130" height="50" rx="10" fill="#78716c" opacity="0.12"/>
  <text x="267" y="483" font-size="26" fill="#78716c" text-anchor="middle" font-weight="600">防疫演練</text>

  <rect x="344" y="452" width="130" height="50" rx="10" fill="#57534e" opacity="0.12"/>
  <text x="409" y="483" font-size="26" fill="#57534e" text-anchor="middle" font-weight="600">6小時訓練</text>

  <rect x="486" y="452" width="130" height="50" rx="10" fill="#2563eb" opacity="0.12"/>
  <text x="551" y="483" font-size="26" fill="#2563eb" text-anchor="middle" font-weight="600">監測記錄</text>

  <!-- 適用對象 -->
  <text x="60" y="555" font-size="28" fill="#94a3b8">適用：一般護理之家 ｜ 115 年度評鑑基準</text>

  <!-- 浮水印 -->
  <text x="1140" y="590" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
