<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#fafaf9"/>

  <!-- 標題區塊 -->
  <rect x="0" y="0" width="800" height="100" fill="#1c1917"/>
  <text x="400" y="48"  font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle">AI 自我查核工作流程</text>
  <text x="400" y="78"  font-size="13" fill="#a8a29e" text-anchor="middle">上傳人力資料，AI 快速發現合規缺口</text>

  <!-- 步驟1 -->
  <rect x="38" y="110" width="724" height="80" rx="9" fill="#fffbeb"/>
  <rect x="38" y="110" width="7" height="80" rx="4" fill="#d97706"/>
  <circle cx="80" cy="150" r="20" fill="#d97706" opacity="0.15"/>
  <text x="80" y="156"  font-size="13" font-weight="900" fill="#d97706" text-anchor="middle">01</text>
  <text x="112" y="138"  font-size="14" font-weight="800" fill="#d97706">STEP 01  上傳人力清冊</text>
  <text x="112" y="158"  font-size="13" fill="#57534e">將人員名單、執照效期、班表上傳至系統，支援 Excel/PDF 格式</text>
  <text x="112" y="178"  font-size="12" fill="#a8a29e">所需資料：醫師/護理/醫事人員名冊、執照效期清單、排班表</text>
  <rect x="622" y="128" width="122" height="32" rx="16" fill="#d97706"/>
  <text x="683" y="149"  font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2 分鐘</text>

  <!-- 步驟2 -->
  <rect x="38" y="200" width="724" height="80" rx="9" fill="#fafaf9" stroke="#e7e5e4" stroke-width="1"/>
  <rect x="38" y="200" width="7" height="80" rx="4" fill="#78716c"/>
  <circle cx="80" cy="240" r="20" fill="#78716c" opacity="0.15"/>
  <text x="80" y="246"  font-size="13" font-weight="900" fill="#78716c" text-anchor="middle">02</text>
  <text x="112" y="228"  font-size="14" font-weight="800" fill="#78716c">STEP 02  AI 比對法規</text>
  <text x="112" y="248"  font-size="13" fill="#57534e">自動比對醫療法、護理人員法等相關法規要求，計算護病比是否合規</text>
  <text x="112" y="268"  font-size="12" fill="#a8a29e">比對法規：醫療法、護理人員法、醫院設置標準、114年評鑑基準</text>
  <rect x="622" y="218" width="122" height="32" rx="16" fill="#78716c"/>
  <text x="683" y="239"  font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">AI 分析</text>

  <!-- 步驟3 -->
  <rect x="38" y="290" width="724" height="80" rx="9" fill="#fafaf9" stroke="#e7e5e4" stroke-width="1"/>
  <rect x="38" y="290" width="7" height="80" rx="4" fill="#57534e"/>
  <circle cx="80" cy="330" r="20" fill="#57534e" opacity="0.15"/>
  <text x="80" y="336"  font-size="13" font-weight="900" fill="#57534e" text-anchor="middle">03</text>
  <text x="112" y="318"  font-size="14" font-weight="800" fill="#57534e">STEP 03  缺口報告</text>
  <text x="112" y="338"  font-size="13" fill="#57534e">產出執照過期清單、護病比異常班次、人力不足警示，優先順序排列</text>
  <text x="112" y="358"  font-size="12" fill="#a8a29e">報告內容：缺失項目、嚴重程度、建議改善措施</text>
  <rect x="614" y="308" width="130" height="32" rx="16" fill="#57534e"/>
  <text x="679" y="329"  font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">即時報告</text>

  <!-- 步驟4 -->
  <rect x="38" y="380" width="724" height="80" rx="9" fill="#fafaf9" stroke="#e7e5e4" stroke-width="1"/>
  <rect x="38" y="380" width="7" height="80" rx="4" fill="#a8a29e"/>
  <circle cx="80" cy="420" r="20" fill="#a8a29e" opacity="0.15"/>
  <text x="80" y="426"  font-size="13" font-weight="900" fill="#a8a29e" text-anchor="middle">04</text>
  <text x="112" y="408"  font-size="14" font-weight="800" fill="#a8a29e">STEP 04  改善追蹤</text>
  <text x="112" y="428"  font-size="13" fill="#57534e">逐項確認改善狀態，評鑑前完成閉環管理，確保所有缺口均已解決</text>
  <text x="112" y="448"  font-size="12" fill="#a8a29e">追蹤功能：改善進度看板、責任人指派、完成時限設定</text>
  <rect x="614" y="398" width="130" height="32" rx="16" fill="#a8a29e"/>
  <text x="679" y="419"  font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">追蹤管控</text>

  <!-- 浮水印 -->
  <text x="400" y="480"  font-size="12" fill="#a8a29e" text-anchor="middle">報告汪 reportwang.com</text>
</svg>
