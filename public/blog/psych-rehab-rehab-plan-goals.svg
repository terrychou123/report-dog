<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <text x="400" y="48" text-anchor="middle" font-size="30" fill="#1e293b" font-weight="700">復健計畫目標撰寫：良好 vs 需改善</text>
  <text x="400" y="78" text-anchor="middle" font-size="20" fill="#57534e">個別化、具體、可追蹤的目標才符合復元導向精神</text>
  <line x1="28" y1="94" x2="772" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- 左側：需改善（紅色） -->
  <rect x="28" y="108" width="354" height="350" rx="12" fill="white" stroke="#dc2626" stroke-width="2"/>
  <rect x="28" y="108" width="354" height="40" rx="12" fill="#dc2626"/>
  <rect x="28" y="128" width="354" height="20" fill="#dc2626"/>
  <text x="205" y="145" text-anchor="middle" font-size="20" fill="white" font-weight="700">需改善的目標寫法</text>

  <text x="48" y="176" font-size="16" fill="#57534e" font-weight="700">問題一：過於籠統</text>
  <rect x="48" y="186" width="314" height="40" rx="6" fill="#fef2f2"/>
  <text x="68" y="210" font-size="15" fill="#dc2626">「提升個案社區適應能力」</text>
  <text x="48" y="244" font-size="14" fill="#57534e">→ 如何判斷有沒有達成？無法追蹤</text>

  <text x="48" y="278" font-size="16" fill="#57534e" font-weight="700">問題二：專業術語化</text>
  <rect x="48" y="288" width="314" height="40" rx="6" fill="#fef2f2"/>
  <text x="68" y="312" font-size="15" fill="#dc2626">「改善 IADL 功能與社區適應」</text>
  <text x="48" y="346" font-size="14" fill="#57534e">→ 學員自己看不懂，缺乏當事人意識</text>

  <text x="48" y="378" font-size="16" fill="#57534e" font-weight="700">問題三：多人共用同一目標</text>
  <rect x="48" y="388" width="314" height="40" rx="6" fill="#fef2f2"/>
  <text x="68" y="413" font-size="15" fill="#dc2626">5 人計畫中目標文字完全相同</text>
  <text x="48" y="440" font-size="14" fill="#57534e">→ 評鑑委員一眼看出，嚴重扣分</text>

  <!-- 右側：良好（綠色） -->
  <rect x="418" y="108" width="354" height="350" rx="12" fill="white" stroke="#16a34a" stroke-width="2"/>
  <rect x="418" y="108" width="354" height="40" rx="12" fill="#16a34a"/>
  <rect x="418" y="128" width="354" height="20" fill="#16a34a"/>
  <text x="595" y="145" text-anchor="middle" font-size="20" fill="white" font-weight="700">良好的目標寫法</text>

  <text x="438" y="176" font-size="16" fill="#57534e" font-weight="700">優點一：具體可量測</text>
  <rect x="438" y="186" width="314" height="40" rx="6" fill="#f0fdf4"/>
  <text x="458" y="210" font-size="15" fill="#16a34a">「3個月後能自己搭捷運去圖書館」</text>
  <text x="438" y="244" font-size="14" fill="#57534e">→ 清楚知道達成了沒有，可追蹤</text>

  <text x="438" y="278" font-size="16" fill="#57534e" font-weight="700">優點二：學員自己的語言</text>
  <rect x="438" y="288" width="314" height="40" rx="6" fill="#f0fdf4"/>
  <text x="458" y="312" font-size="15" fill="#16a34a">「我想要能夠自己買菜煮飯」</text>
  <text x="438" y="346" font-size="14" fill="#57534e">→ 反映當事人真實意願，CHIME Hope</text>

  <text x="438" y="378" font-size="16" fill="#57534e" font-weight="700">優點三：個別化步驟</text>
  <rect x="438" y="388" width="314" height="40" rx="6" fill="#f0fdf4"/>
  <text x="458" y="413" font-size="15" fill="#16a34a">「練習步驟：辨識公車路線→自行刷卡」</text>
  <text x="438" y="440" font-size="14" fill="#57534e">→ 可拆解執行，顯示個案管理深度</text>

  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
