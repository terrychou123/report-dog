<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8" rx="16"/>
  <rect x="20" y="20" width="760" height="460" fill="white" rx="12"/>

  <!-- 標題列 -->
  <rect x="20" y="20" width="760" height="60" fill="#2563eb" rx="12"/>
  <rect x="20" y="60" width="760" height="20" fill="#2563eb"/>
  <text x="400" y="58" font-size="22" font-weight="700" fill="white" text-anchor="middle">牙科轉介機制流程圖（D2 評鑑基準）</text>

  <!-- 流程步驟 -->
  <!-- 步驟1 轉介指標 -->
  <rect x="50" y="110" width="160" height="160" rx="12" fill="#fee2e2"/>
  <rect x="50" y="110" width="160" height="8" rx="4" fill="#dc2626"/>
  <text x="130" y="142" font-size="28" font-weight="900" fill="#dc2626" text-anchor="middle">觸發</text>
  <text x="130" y="165" font-size="14" font-weight="700" fill="#dc2626" text-anchor="middle">轉介指標</text>
  <line x1="65" y1="175" x2="195" y2="175" stroke="#fef2f2" stroke-width="1"/>
  <text x="65" y="194" font-size="14" fill="#1e293b">• 牙痛/口腔疼痛</text>
  <text x="65" y="212" font-size="14" fill="#1e293b">• 疑似感染/膿腫</text>
  <text x="65" y="230" font-size="14" fill="#1e293b">• 義齒破損/不適</text>
  <text x="65" y="248" font-size="14" fill="#1e293b">• 口腔黏膜異常</text>

  <!-- 箭頭 -->
  <polygon points="214,188 228,182 228,195" fill="#2563eb"/>
  <line x1="210" y1="188" x2="230" y2="188" stroke="#2563eb" stroke-width="2"/>

  <!-- 步驟2 通報護理師 -->
  <rect x="230" y="110" width="155" height="160" rx="12" fill="#fef3c7"/>
  <rect x="230" y="110" width="155" height="8" rx="4" fill="#d97706"/>
  <text x="308" y="142" font-size="28" font-weight="900" fill="#d97706" text-anchor="middle">1</text>
  <text x="308" y="165" font-size="14" font-weight="700" fill="#d97706" text-anchor="middle">通報護理師</text>
  <line x1="245" y1="175" x2="370" y2="175" stroke="#fef3c7" stroke-width="1"/>
  <text x="245" y="194" font-size="14" fill="#1e293b">• 照服員發現異常</text>
  <text x="245" y="212" font-size="14" fill="#1e293b">• 立即通報值班護理師</text>
  <text x="245" y="230" font-size="14" fill="#1e293b">• 護理師初步評估</text>
  <text x="245" y="248" font-size="14" fill="#1e293b">• 確認需要轉介</text>

  <!-- 箭頭 -->
  <polygon points="389,188 403,182 403,195" fill="#2563eb"/>
  <line x1="385" y1="188" x2="405" y2="188" stroke="#2563eb" stroke-width="2"/>

  <!-- 步驟3 聯絡牙科 -->
  <rect x="405" y="110" width="155" height="160" rx="12" fill="#f0fdf4"/>
  <rect x="405" y="110" width="155" height="8" rx="4" fill="#16a34a"/>
  <text x="483" y="142" font-size="28" font-weight="900" fill="#16a34a" text-anchor="middle">2</text>
  <text x="483" y="165" font-size="14" font-weight="700" fill="#16a34a" text-anchor="middle">聯絡牙科</text>
  <line x1="420" y1="175" x2="545" y2="175" stroke="#a7f3d0" stroke-width="1"/>
  <text x="420" y="194" font-size="14" fill="#1e293b">• 查合作牙科名單</text>
  <text x="420" y="212" font-size="14" fill="#1e293b">• 協助預約看診</text>
  <text x="420" y="230" font-size="14" fill="#1e293b">• 填寫轉介單</text>
  <text x="420" y="248" font-size="14" fill="#1e293b">• 通知家屬</text>

  <!-- 箭頭 -->
  <polygon points="564,188 578,182 578,195" fill="#2563eb"/>
  <line x1="560" y1="188" x2="580" y2="188" stroke="#2563eb" stroke-width="2"/>

  <!-- 步驟4 執行追蹤 -->
  <rect x="580" y="110" width="170" height="160" rx="12" fill="#e0e7ff"/>
  <rect x="580" y="110" width="170" height="8" rx="4" fill="#4f46e5"/>
  <text x="665" y="142" font-size="28" font-weight="900" fill="#4f46e5" text-anchor="middle">3</text>
  <text x="665" y="165" font-size="14" font-weight="700" fill="#4f46e5" text-anchor="middle">執行與追蹤</text>
  <line x1="595" y1="175" x2="735" y2="175" stroke="#c7d2fe" stroke-width="1"/>
  <text x="595" y="194" font-size="14" fill="#1e293b">• 陪同或安排就診</text>
  <text x="595" y="212" font-size="14" fill="#1e293b">• 記錄就診結果</text>
  <text x="595" y="230" font-size="14" fill="#1e293b">• 照護計畫更新</text>
  <text x="595" y="248" font-size="14" fill="#1e293b">• 追蹤恢復狀況</text>

  <!-- 合作名單區塊 -->
  <rect x="50" y="295" width="345" height="150" rx="10" fill="#f0fdf4"/>
  <rect x="50" y="295" width="4" height="150" rx="2" fill="#16a34a"/>
  <text x="70" y="322" font-size="14" font-weight="700" fill="#16a34a">合作牙科醫療機構名單範例</text>
  <text x="70" y="346" font-size="14" fill="#1e293b">牙科名稱：牙醫診所</text>
  <text x="70" y="366" font-size="14" fill="#1e293b">聯絡電話：(02) XXXX-XXXX</text>
  <text x="70" y="386" font-size="14" fill="#1e293b">合作方式：門診預約 / 必要時到機構服務</text>
  <text x="70" y="406" font-size="14" fill="#1e293b">合約有效期：115 年 1 月 1 日至 115 年 12 月 31 日</text>
  <text x="70" y="426" font-size="14" fill="#57534e">- 每年更新合約，確認合作關係有效</text>

  <!-- 轉介記錄區塊 -->
  <rect x="410" y="295" width="340" height="150" rx="10" fill="#eff6ff"/>
  <rect x="410" y="295" width="4" height="150" rx="2" fill="#2563eb"/>
  <text x="430" y="322" font-size="14" font-weight="700" fill="#1e293b">轉介記錄必備欄位</text>
  <text x="430" y="346" font-size="14" fill="#1e293b">• 轉介日期與轉介原因（症狀描述）</text>
  <text x="430" y="366" font-size="14" fill="#1e293b">• 轉介至牙科名稱 + 聯絡窗口</text>
  <text x="430" y="386" font-size="14" fill="#1e293b">• 住民就診日期 + 診斷/處置結果</text>
  <text x="430" y="406" font-size="14" fill="#1e293b">• 回診或追蹤安排</text>
  <text x="430" y="426" font-size="14" fill="#1e293b">• 照護計畫是否已更新（[ ] 是 [ ] 否）</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
