<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <text x="400" y="48" text-anchor="middle" font-size="30" fill="#1e293b" font-weight="700">2.2 復健計畫三大必要條件</text>
  <text x="400" y="78" text-anchor="middle" font-size="20" fill="#57534e">缺一不可，任一條件不足即可能扣分</text>
  <line x1="28" y1="94" x2="772" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- 三個卡片並排 (N=3 pattern) -->
  <!-- Card 0: 三方參與 x=28 w=222 -->
  <rect x="28" y="110" width="222" height="346" rx="12" fill="white" stroke="#d97706" stroke-width="2"/>
  <rect x="28" y="110" width="222" height="8" rx="4" fill="#d97706"/>
  <rect x="28" y="114" width="222" height="4" fill="#d97706"/>
  <text x="139" y="150" text-anchor="middle" font-size="22" fill="#d97706" font-weight="700">三方參與</text>
  <text x="139" y="174" text-anchor="middle" font-size="16" fill="#57534e">必要條件一</text>
  <line x1="48" y1="188" x2="230" y2="188" stroke="#f0efe8" stroke-width="1"/>
  <text x="139" y="216" text-anchor="middle" font-size="16" fill="#1e293b" font-weight="700">服務對象本人</text>
  <text x="139" y="244" text-anchor="middle" font-size="16" fill="#1e293b" font-weight="700">家屬／主要照顧者</text>
  <text x="139" y="272" text-anchor="middle" font-size="16" fill="#1e293b" font-weight="700">機構工作人員</text>
  <text x="139" y="300" text-anchor="middle" font-size="14" fill="#57534e">三方均需簽名</text>
  <text x="139" y="318" text-anchor="middle" font-size="14" fill="#57534e">或有參與紀錄</text>
  <rect x="48" y="358" width="182" height="80" rx="8" fill="#fef3c7"/>
  <text x="139" y="378" text-anchor="middle" font-size="14" fill="#d97706" font-weight="700">家屬無法到場：</text>
  <text x="139" y="398" text-anchor="middle" font-size="14" fill="#d97706">電話聯繫時間</text>
  <text x="139" y="416" text-anchor="middle" font-size="14" fill="#d97706">和討論內容即可</text>

  <!-- Card 1: 每季更新 x=278 w=222 -->
  <rect x="278" y="110" width="222" height="346" rx="12" fill="white" stroke="#78716c" stroke-width="2"/>
  <rect x="278" y="110" width="222" height="8" rx="4" fill="#78716c"/>
  <rect x="278" y="114" width="222" height="4" fill="#78716c"/>
  <text x="389" y="150" text-anchor="middle" font-size="22" fill="#78716c" font-weight="700">每季更新</text>
  <text x="389" y="174" text-anchor="middle" font-size="16" fill="#57534e">必要條件二</text>
  <line x1="298" y1="188" x2="480" y2="188" stroke="#f0efe8" stroke-width="1"/>
  <text x="389" y="216" text-anchor="middle" font-size="16" fill="#1e293b" font-weight="700">每3個月更新一次</text>
  <text x="389" y="244" text-anchor="middle" font-size="14" fill="#57534e">評鑑委員抽查</text>
  <text x="389" y="262" text-anchor="middle" font-size="14" fill="#57534e">最近一年所有紀錄</text>
  <text x="389" y="290" text-anchor="middle" font-size="14" fill="#57534e">4次更新不可缺</text>
  <text x="389" y="310" text-anchor="middle" font-size="14" fill="#57534e">任何一季</text>
  <rect x="298" y="358" width="182" height="80" rx="8" fill="#f5f5f4"/>
  <text x="389" y="378" text-anchor="middle" font-size="14" fill="#78716c" font-weight="700">建議機制：</text>
  <text x="389" y="398" text-anchor="middle" font-size="14" fill="#78716c">入案 90 天系統</text>
  <text x="389" y="416" text-anchor="middle" font-size="14" fill="#78716c">自動提醒更新</text>

  <!-- Card 2: 個別化目標 x=528 w=222 -->
  <rect x="528" y="110" width="222" height="346" rx="12" fill="white" stroke="#57534e" stroke-width="2"/>
  <rect x="528" y="110" width="222" height="8" rx="4" fill="#57534e"/>
  <rect x="528" y="114" width="222" height="4" fill="#57534e"/>
  <text x="639" y="150" text-anchor="middle" font-size="22" fill="#57534e" font-weight="700">個別化目標</text>
  <text x="639" y="174" text-anchor="middle" font-size="16" fill="#57534e">必要條件三</text>
  <line x1="548" y1="188" x2="730" y2="188" stroke="#f0efe8" stroke-width="1"/>
  <text x="639" y="214" text-anchor="middle" font-size="14" fill="#1e293b" font-weight="700">用學員自己的語言</text>
  <text x="639" y="236" text-anchor="middle" font-size="14" fill="#57534e">描述具體目標</text>
  <text x="639" y="260" text-anchor="middle" font-size="14" fill="#1e293b" font-weight="700">不同學員不同目標</text>
  <text x="639" y="282" text-anchor="middle" font-size="14" fill="#57534e">禁用統一模板目標</text>
  <text x="639" y="306" text-anchor="middle" font-size="14" fill="#1e293b" font-weight="700">連結復健評估結果</text>
  <text x="639" y="328" text-anchor="middle" font-size="14" fill="#57534e">目標可追蹤可評估</text>
  <rect x="548" y="358" width="182" height="80" rx="8" fill="#f5f0eb"/>
  <text x="639" y="378" text-anchor="middle" font-size="14" fill="#57534e" font-weight="700">範例目標：</text>
  <text x="639" y="396" text-anchor="middle" font-size="13" fill="#57534e">「3個月後能</text>
  <text x="639" y="414" text-anchor="middle" font-size="13" fill="#57534e">自己搭公車買菜」</text>

  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
