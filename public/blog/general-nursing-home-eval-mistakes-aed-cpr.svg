<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <rect x="0" y="50" width="800" height="76" fill="white"/>
  <rect x="0" y="50" width="6" height="76" rx="2" fill="#d97706"/>
  <text x="28" y="104" font-size="36" fill="#1e293b" font-weight="700">缺失二：急救訓練記錄 AED 未明確標示</text>
  <rect x="28" y="160" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="160" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="66" cy="191" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="197" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">錯</text>
  <text x="100" y="188" font-size="22" fill="#1e293b" font-weight="700">記錄只寫「CPR 訓練」</text>
  <text x="100" y="208" font-size="16" fill="#57534e">委員無法確認是否真的包含 AED 操作，視為不符合</text>
  <rect x="620" y="168" width="136" height="46" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="185" font-size="16" fill="#57534e" text-anchor="middle">失分</text>
  <text x="688" y="205" font-size="16" fill="#57534e" text-anchor="middle">風險</text>
  <rect x="28" y="235" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="235" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="66" cy="266" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="272" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">對</text>
  <text x="100" y="263" font-size="22" fill="#1e293b" font-weight="700">記錄明確標示「含 BLS 及 AED 操作」</text>
  <text x="100" y="283" font-size="16" fill="#57534e">訓練記錄或結業證書需明確載明含 AED 課程</text>
  <rect x="620" y="243" width="136" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="260" font-size="16" fill="#d97706" text-anchor="middle">符合</text>
  <text x="688" y="280" font-size="16" fill="#d97706" text-anchor="middle">要求</text>
  <rect x="28" y="310" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="310" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="341" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="347" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">查核</text>
  <text x="100" y="338" font-size="22" fill="#1e293b" font-weight="700">補救方式：查核所有護理人員記錄</text>
  <text x="100" y="358" font-size="16" fill="#57534e">逐一確認訓練記錄，必要時安排補訓或請訓練機構補發新證明</text>
  <rect x="620" y="318" width="136" height="46" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="335" font-size="16" fill="#78716c" text-anchor="middle">逐一</text>
  <text x="688" y="355" font-size="16" fill="#78716c" text-anchor="middle">核查</text>
  <rect x="28" y="385" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="385" width="6" height="62" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="416" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="422" font-size="16" fill="#a8a29e" text-anchor="middle" font-weight="900">效期</text>
  <text x="100" y="413" font-size="22" fill="#1e293b" font-weight="700">BLS/AED 訓練效期管理（通常 2 年）</text>
  <text x="100" y="433" font-size="16" fill="#57534e">建立效期追蹤清單，提前安排即將到期人員重新訓練</text>
  <rect x="620" y="393" width="136" height="46" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="410" font-size="16" fill="#a8a29e" text-anchor="middle">2 年</text>
  <text x="688" y="430" font-size="16" fill="#a8a29e" text-anchor="middle">效期</text>
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
