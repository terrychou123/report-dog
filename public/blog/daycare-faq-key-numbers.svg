<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"
     font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- Header (y=29, h=60) -->
  <rect x="0" y="29" width="800" height="60" fill="white"/>
  <rect x="0" y="29" width="6" height="60" fill="#d97706" rx="2"/>
  <text x="28" y="74" font-size="32" fill="#1e293b" font-weight="700">文件準備 5 個關鍵數字（必記）</text>

  <!-- Row 1 (y=118) #d97706 7工作天 -->
  <rect x="28" y="118" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="118" width="6" height="60" rx="2" fill="#d97706"/>
  <circle cx="66" cy="148" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="154" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <text x="100" y="145" font-size="20" fill="#1e293b" font-weight="700">照顧計畫：7 工作天內完成</text>
  <text x="100" y="166" font-size="16" fill="#57534e">第 6 條，從個案評估日起算工作天，不含例假日及國定假日</text>
  <rect x="620" y="126" width="136" height="44" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="143" font-size="16" fill="#d97706" text-anchor="middle">7 工作</text>
  <text x="688" y="163" font-size="16" fill="#d97706" text-anchor="middle">天必記</text>

  <!-- Row 2 (y=191) #78716c 督導頻率 -->
  <rect x="28" y="191" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="191" width="6" height="60" rx="2" fill="#78716c"/>
  <circle cx="66" cy="221" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="227" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <text x="100" y="218" font-size="20" fill="#1e293b" font-weight="700">督導頻率：個督半年・團督每季</text>
  <text x="100" y="239" font-size="16" fill="#57534e">第 9 條，每位工作人員（含照服員）均需達到，需有紀錄</text>
  <rect x="620" y="199" width="136" height="44" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="216" font-size="16" fill="#78716c" text-anchor="middle">個督/半年</text>
  <text x="688" y="236" font-size="16" fill="#78716c" text-anchor="middle">團督/每季</text>

  <!-- Row 3 (y=264) #57534e 20小時 -->
  <rect x="28" y="264" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="264" width="6" height="60" rx="2" fill="#57534e"/>
  <circle cx="66" cy="294" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="300" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <text x="100" y="291" font-size="20" fill="#1e293b" font-weight="700">在職訓練：每年至少 20 小時</text>
  <text x="100" y="312" font-size="16" fill="#57534e">第 29 條，需含原住民族文化敏感度・多元族群各 1 小時</text>
  <rect x="620" y="272" width="136" height="44" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="289" font-size="16" fill="#57534e" text-anchor="middle">20 小時</text>
  <text x="688" y="309" font-size="16" fill="#57534e" text-anchor="middle">最低限</text>

  <!-- Row 4 (y=337) #a8a29e 線上5小時 -->
  <rect x="28" y="337" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="337" width="6" height="60" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="367" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="373" font-size="16" fill="#a8a29e" text-anchor="middle" font-weight="900">4</text>
  <text x="100" y="364" font-size="20" fill="#1e293b" font-weight="700">線上課程：最多採計 5 小時</text>
  <text x="100" y="385" font-size="16" fill="#57534e">第 29 條，超過 5 小時部分不計入有效時數，注意上限</text>
  <rect x="620" y="345" width="136" height="44" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="362" font-size="16" fill="#a8a29e" text-anchor="middle">5 小時</text>
  <text x="688" y="382" font-size="16" fill="#a8a29e" text-anchor="middle">上限</text>

  <!-- Row 5 (y=410) #94a3b8 品管2項 -->
  <rect x="28" y="410" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="410" width="6" height="60" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="440" r="16" fill="#94a3b8" opacity="0.15"/>
  <text x="66" y="446" font-size="16" fill="#94a3b8" text-anchor="middle" font-weight="900">5</text>
  <text x="100" y="437" font-size="20" fill="#1e293b" font-weight="700">品管指標：自訂至少 2 項</text>
  <text x="100" y="458" font-size="16" fill="#57534e">第 22 條，需依機構特性自訂，有月報數據與異常分析</text>
  <rect x="620" y="418" width="136" height="44" rx="8" fill="#94a3b8" opacity="0.12"/>
  <text x="688" y="435" font-size="16" fill="#94a3b8" text-anchor="middle">2 項</text>
  <text x="688" y="455" font-size="16" fill="#94a3b8" text-anchor="middle">以上</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
