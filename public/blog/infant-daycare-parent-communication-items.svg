<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- Header（y=38, h=90） -->
  <rect x="0" y="38" width="800" height="90" fill="white"/>
  <rect x="0" y="38" width="6" height="90" fill="#d97706" rx="2"/>
  <text x="28" y="95" font-size="36" fill="#1e293b" font-weight="700">第 34-36 條：委員查核三大重點</text>

  <!-- Row 0（y=166）#d97706 -->
  <rect x="28" y="166" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="166" width="6" height="90" rx="2" fill="#78716c"/>
  <circle cx="66" cy="211" r="20" fill="#d97706" opacity="0.15"/>
  <text x="66" y="217" font-size="18" fill="#d97706" text-anchor="middle" font-weight="900">34</text>
  <text x="100" y="200" font-size="26" fill="#1e293b" font-weight="700">親師互動與溝通管道（第 34 條）</text>
  <text x="100" y="224" font-size="16" fill="#57534e">委員查核：機構有無固定親師溝通管道（日誌/APP/書面），家長是否能隨時了解孩子狀況</text>
  <text x="100" y="244" font-size="14" fill="#d97706">準備要點：確認溝通工具、記錄家長詢問的回應、入托說明書說明溝通方式</text>
  <rect x="620" y="185" width="136" height="52" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="201" font-size="16" fill="#d97706" text-anchor="middle">溝通管道</text>
  <text x="688" y="221" font-size="16" fill="#d97706" text-anchor="middle">明確建立</text>

  <!-- Row 1（y=269）#78716c -->
  <rect x="28" y="269" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="269" width="6" height="90" rx="2" fill="#57534e"/>
  <circle cx="66" cy="314" r="20" fill="#78716c" opacity="0.15"/>
  <text x="66" y="320" font-size="18" fill="#78716c" text-anchor="middle" font-weight="900">35</text>
  <text x="100" y="303" font-size="26" fill="#1e293b" font-weight="700">每日個別化照顧記錄（第 35 條）</text>
  <text x="100" y="327" font-size="16" fill="#57534e">委員查核：抽查 2-3 名幼兒的日誌，確認是否有個別差異，有無發展觀察描述</text>
  <text x="100" y="347" font-size="14" fill="#78716c">準備要點：每位幼兒日誌需有個別化觀察描述，不可只記錄飲食量</text>
  <rect x="620" y="288" width="136" height="52" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="304" font-size="16" fill="#78716c" text-anchor="middle">個別差異</text>
  <text x="688" y="324" font-size="16" fill="#78716c" text-anchor="middle">發展觀察</text>

  <!-- Row 2（y=372）#57534e -->
  <rect x="28" y="372" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="372" width="6" height="90" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="417" r="20" fill="#57534e" opacity="0.15"/>
  <text x="66" y="423" font-size="18" fill="#57534e" text-anchor="middle" font-weight="900">36</text>
  <text x="100" y="406" font-size="26" fill="#1e293b" font-weight="700">家長參與托育活動（第 36 條）</text>
  <text x="100" y="430" font-size="16" fill="#57534e">委員查核：機構有無提供家長了解課程與參與活動的機會，如說明會、開放觀察日</text>
  <text x="100" y="450" font-size="16" fill="#57534e">準備要點：保存家長說明會簽到表、開放日通知與出席記錄</text>
  <rect x="620" y="391" width="136" height="52" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="407" font-size="16" fill="#57534e" text-anchor="middle">家長參與</text>
  <text x="688" y="427" font-size="16" fill="#57534e" text-anchor="middle">有紀錄佐證</text>

  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
