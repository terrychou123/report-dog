<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <text x="400" y="50" font-size="26" font-weight="700" fill="#1e293b" text-anchor="middle" font-family="sans-serif">B 區 40% 配分：衝高總分的核心戰場</text>
  <text x="400" y="76" font-size="16" fill="#57534e" text-anchor="middle" font-family="sans-serif">B 區佔總分約 40%，從 70 分衝向 90 分，B 區是關鍵</text>

  <!-- N=4, H=62, outer_gap=50 -->
  <!-- Row 1 (y=160) -->
  <rect x="40" y="110" width="720" height="62" rx="6" fill="#ffffff"/>
  <rect x="40" y="110" width="6" height="62" rx="3" fill="#d97706"/>
  <circle cx="74" cy="141" r="16" fill="#d97706" opacity="0.15"/>
  <text x="74" y="147" font-size="16" font-weight="700" fill="#d97706" text-anchor="middle" font-family="sans-serif">1</text>
  <text x="100" y="133" font-size="16" font-weight="700" fill="#1e293b" font-family="sans-serif">B2 個案計畫完整性（二級加強）</text>
  <text x="100" y="156" font-size="14" fill="#57534e" font-family="sans-serif">72H初評＋每季重評＋多專業討論＋計畫與照護紀錄一致，四環節缺一不可</text>
  <rect x="596" y="119" width="136" height="46" rx="5" fill="#d97706" opacity="0.12"/>
  <text x="664" y="138" font-size="13" fill="#d97706" text-anchor="middle" font-weight="600" font-family="sans-serif">二級加強</text>
  <text x="664" y="157" font-size="13" fill="#d97706" text-anchor="middle" font-family="sans-serif">高風險項目</text>

  <!-- Row 2 (y=235) -->
  <rect x="40" y="185" width="720" height="62" rx="6" fill="#ffffff"/>
  <rect x="40" y="185" width="6" height="62" rx="3" fill="#78716c"/>
  <circle cx="74" cy="216" r="16" fill="#78716c" opacity="0.15"/>
  <text x="74" y="222" font-size="16" font-weight="700" fill="#78716c" text-anchor="middle" font-family="sans-serif">2</text>
  <text x="100" y="208" font-size="16" font-weight="700" fill="#1e293b" font-family="sans-serif">B13-B19 七項監測：統計分析是得分關鍵</text>
  <text x="100" y="231" font-size="14" fill="#57534e" font-family="sans-serif">跌倒/壓傷/疼痛/約束/感染/非計畫住院/體重——每項均需每季統計分析＋改善方案</text>
  <rect x="596" y="194" width="136" height="46" rx="5" fill="#78716c" opacity="0.1"/>
  <text x="664" y="213" font-size="13" fill="#78716c" text-anchor="middle" font-weight="600" font-family="sans-serif">每季</text>
  <text x="664" y="232" font-size="13" fill="#78716c" text-anchor="middle" font-family="sans-serif">統計報告</text>

  <!-- Row 3 (y=310) -->
  <rect x="40" y="260" width="720" height="62" rx="6" fill="#ffffff"/>
  <rect x="40" y="260" width="6" height="62" rx="3" fill="#57534e"/>
  <circle cx="74" cy="291" r="16" fill="#57534e" opacity="0.15"/>
  <text x="74" y="297" font-size="16" font-weight="700" fill="#57534e" text-anchor="middle" font-family="sans-serif">3</text>
  <text x="100" y="283" font-size="16" font-weight="700" fill="#1e293b" font-family="sans-serif">B28-B31 膳食與管灌：常見缺失易修正</text>
  <text x="100" y="306" font-size="14" fill="#57534e" font-family="sans-serif">菜單需營養師簽名、個別化飲食有照護計畫、管灌用個別空針且技術符合規範</text>
  <rect x="596" y="269" width="136" height="46" rx="5" fill="#57534e" opacity="0.1"/>
  <text x="664" y="288" font-size="13" fill="#57534e" text-anchor="middle" font-weight="600" font-family="sans-serif">缺失率高</text>
  <text x="664" y="307" font-size="13" fill="#57534e" text-anchor="middle" font-family="sans-serif">改善容易</text>

  <!-- Row 4 (y=385) -->
  <rect x="40" y="335" width="720" height="62" rx="6" fill="#ffffff"/>
  <rect x="40" y="335" width="6" height="62" rx="3" fill="#a8a29e"/>
  <circle cx="74" cy="366" r="16" fill="#a8a29e" opacity="0.2"/>
  <text x="74" y="372" font-size="16" font-weight="700" fill="#a8a29e" text-anchor="middle" font-family="sans-serif">4</text>
  <text x="100" y="358" font-size="16" font-weight="700" fill="#1e293b" font-family="sans-serif">文件一致性：跨文件交叉比對是評鑑常態</text>
  <text x="100" y="381" font-size="14" fill="#57534e" font-family="sans-serif">個案計畫、護理紀錄、統計報告三份文件描述須相互一致，不可自相矛盾</text>
  <rect x="596" y="344" width="136" height="46" rx="5" fill="#a8a29e" opacity="0.15"/>
  <text x="664" y="363" font-size="13" fill="#78716c" text-anchor="middle" font-weight="600" font-family="sans-serif">季度稽核</text>
  <text x="664" y="382" font-size="13" fill="#78716c" text-anchor="middle" font-family="sans-serif">確保一致性</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" font-family="sans-serif">報告汪 reportwang.com</text>
</svg>
