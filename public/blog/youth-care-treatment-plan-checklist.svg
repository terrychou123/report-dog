<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">處遇計畫評鑑前自評清單</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">逐項確認，確保委員查核時不慌張</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- 左欄 -->
  <rect x="40" y="108" width="6" height="24" rx="2" fill="#d97706"/>
  <text x="54" y="125" font-size="20" fill="#1e293b" font-weight="700">個案計畫完整性</text>

  <!-- 左欄項目 -->
  <rect x="64" y="136" width="20" height="20" rx="3" fill="#f0efe8" stroke="#a8a29e" stroke-width="1"/>
  <path d="M 68,146 L 72,151 L 81,139" fill="none" stroke="#d97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="94" y="152" font-size="18" fill="#1e293b">所有在院個案都有處遇計畫</text>

  <rect x="64" y="164" width="20" height="20" rx="3" fill="#f0efe8" stroke="#a8a29e" stroke-width="1"/>
  <path d="M 68,174 L 72,179 L 81,167" fill="none" stroke="#d97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="94" y="180" font-size="18" fill="#1e293b">目標具體可量化（有時程/指標）</text>

  <rect x="64" y="192" width="20" height="20" rx="3" fill="none" stroke="#a8a29e" stroke-width="1.5"/>
  <text x="94" y="208" font-size="18" fill="#1e293b">計畫有定期評估記錄</text>

  <rect x="64" y="220" width="20" height="20" rx="3" fill="none" stroke="#a8a29e" stroke-width="1.5"/>
  <text x="94" y="236" font-size="18" fill="#1e293b">計畫與生活紀錄相互對應</text>

  <rect x="40" y="258" width="6" height="24" rx="2" fill="#a8a29e"/>
  <text x="54" y="275" font-size="20" fill="#1e293b" font-weight="700">直接服務紀錄</text>

  <rect x="64" y="287" width="20" height="20" rx="3" fill="#f0efe8" stroke="#a8a29e" stroke-width="1"/>
  <path d="M 68,297 L 72,302 L 81,290" fill="none" stroke="#78716c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="94" y="303" font-size="18" fill="#1e293b">接案記錄、會談記錄齊全</text>

  <rect x="64" y="315" width="20" height="20" rx="3" fill="none" stroke="#a8a29e" stroke-width="1.5"/>
  <text x="94" y="331" font-size="18" fill="#1e293b">心理諮商、就學輔導紀錄</text>

  <rect x="64" y="343" width="20" height="20" rx="3" fill="none" stroke="#a8a29e" stroke-width="1.5"/>
  <text x="94" y="359" font-size="18" fill="#1e293b">離院追蹤輔導記錄</text>

  <!-- 垂直分隔線 -->
  <line x1="400" y1="98" x2="400" y2="432" stroke="#dedad3" stroke-width="1"/>

  <!-- 右欄 -->
  <rect x="420" y="108" width="6" height="24" rx="2" fill="#78716c"/>
  <text x="434" y="125" font-size="20" fill="#1e293b" font-weight="700">原生家庭與資源連結</text>

  <rect x="444" y="136" width="20" height="20" rx="3" fill="#f0efe8" stroke="#a8a29e" stroke-width="1"/>
  <path d="M 448,146 L 452,151 L 461,139" fill="none" stroke="#57534e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="474" y="152" font-size="18" fill="#1e293b">原生家庭聯繫與重聚紀錄</text>

  <rect x="444" y="164" width="20" height="20" rx="3" fill="none" stroke="#a8a29e" stroke-width="1.5"/>
  <text x="474" y="180" font-size="18" fill="#1e293b">多專業協作記錄（心理師/老師）</text>

  <rect x="444" y="192" width="20" height="20" rx="3" fill="none" stroke="#a8a29e" stroke-width="1.5"/>
  <text x="474" y="208" font-size="18" fill="#1e293b">資源網絡清冊更新</text>

  <rect x="420" y="230" width="6" height="24" rx="2" fill="#57534e"/>
  <text x="434" y="247" font-size="20" fill="#1e293b" font-weight="700">文件整理與索引</text>

  <rect x="444" y="258" width="20" height="20" rx="3" fill="none" stroke="#a8a29e" stroke-width="1.5"/>
  <text x="474" y="274" font-size="18" fill="#1e293b">各個案文件有獨立資料夾</text>

  <rect x="444" y="286" width="20" height="20" rx="3" fill="none" stroke="#a8a29e" stroke-width="1.5"/>
  <text x="474" y="302" font-size="18" fill="#1e293b">建立文件索引（委員翻查用）</text>

  <rect x="444" y="314" width="20" height="20" rx="3" fill="none" stroke="#a8a29e" stroke-width="1.5"/>
  <text x="474" y="330" font-size="18" fill="#1e293b">離院個案追蹤記錄可查閱</text>

  <!-- 圖例 + 分隔線 -->
  <line x1="40" y1="433" x2="760" y2="433" stroke="#dedad3" stroke-width="1"/>
  <rect x="75" y="443" width="18" height="18" rx="3" fill="#f0efe8" stroke="#a8a29e" stroke-width="1"/>
  <path d="M 78,453 L 82,458 L 91,446" fill="none" stroke="#78716c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="102" y="458" font-size="18" fill="#57534e">已確認完成</text>
  <rect x="220" y="443" width="18" height="18" rx="3" fill="none" stroke="#a8a29e" stroke-width="1.5"/>
  <text x="247" y="458" font-size="18" fill="#57534e">待確認項目</text>

  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
