<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- Header (N=4) -->
  <rect x="50" y="50" width="700" height="76" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="400" y="77" font-size="22" fill="#1e293b" font-weight="700" text-anchor="middle" >感染管制訓練要求</text>
  <text x="400" y="101" font-size="15" fill="#57534e" text-anchor="middle" >B10 訓練記錄稽核重點，職前與在職訓練需完整備查</text>

  <!-- Row 1 -->
  <rect x="50" y="160" width="700" height="62" rx="8" fill="#ffffff"/>
  <rect x="50" y="160" width="6" height="62" rx="2" fill="#d97706"/>
  <circle cx="87" cy="191" r="16" fill="#d97706" opacity="0.15"/>
  <text x="87" y="197" font-size="16" fill="#d97706" font-weight="700" text-anchor="middle" >1</text>
  <text x="120" y="182" font-size="16" fill="#1e293b" font-weight="700" >新進人員職前訓練（4 小時感控）</text>
  <text x="120" y="202" font-size="14" fill="#57534e" >到職 1 個月內完成，感染管制課程至少 4 小時，需有出席簽到與評估記錄</text>
  <rect x="620" y="167" width="115" height="46" rx="6" fill="#d97706" opacity="0.12"/>
  <text x="677" y="182" font-size="14" fill="#d97706" font-weight="700" text-anchor="middle" >職前4H</text>
  <text x="677" y="198" font-size="13" fill="#d97706" text-anchor="middle" >1個月內</text>

  <!-- Row 2 -->
  <rect x="50" y="235" width="700" height="62" rx="8" fill="#ffffff"/>
  <rect x="50" y="235" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="87" cy="266" r="16" fill="#78716c" opacity="0.15"/>
  <text x="87" y="272" font-size="16" fill="#78716c" font-weight="700" text-anchor="middle" >2</text>
  <text x="120" y="257" font-size="16" fill="#1e293b" font-weight="700" >感控專業人員在職訓練（8 小時）</text>
  <text x="120" y="277" font-size="14" fill="#57534e" >每位感控專業人員每年至少 8 小時感染管制相關課程，含院外課程心得報告</text>
  <rect x="620" y="242" width="115" height="46" rx="6" fill="#78716c" opacity="0.12"/>
  <text x="677" y="257" font-size="14" fill="#78716c" font-weight="700" text-anchor="middle" >在職8H</text>
  <text x="677" y="273" font-size="13" fill="#78716c" text-anchor="middle" >每年必修</text>

  <!-- Row 3 -->
  <rect x="50" y="310" width="700" height="62" rx="8" fill="#ffffff"/>
  <rect x="50" y="310" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="87" cy="341" r="16" fill="#57534e" opacity="0.15"/>
  <text x="87" y="347" font-size="16" fill="#57534e" font-weight="700" text-anchor="middle" >3</text>
  <text x="120" y="332" font-size="16" fill="#1e293b" font-weight="700" >手部衛生實作稽核</text>
  <text x="120" y="352" font-size="14" fill="#57534e" >定期抽測工作人員洗手步驟正確性，記錄稽核日期、對象及結果</text>
  <rect x="620" y="317" width="115" height="46" rx="6" fill="#57534e" opacity="0.12"/>
  <text x="677" y="332" font-size="14" fill="#57534e" font-weight="700" text-anchor="middle" >實作抽測</text>
  <text x="677" y="348" font-size="13" fill="#57534e" text-anchor="middle" >記錄結果</text>

  <!-- Row 4 -->
  <rect x="50" y="385" width="700" height="62" rx="8" fill="#ffffff"/>
  <rect x="50" y="385" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="87" cy="416" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="87" y="422" font-size="16" fill="#a8a29e" font-weight="700" text-anchor="middle" >4</text>
  <text x="120" y="407" font-size="16" fill="#1e293b" font-weight="700" >疫苗接種宣導與記錄</text>
  <text x="120" y="427" font-size="14" fill="#57534e" >公費流感疫苗施打率：工作人員與服務對象均須達 80% 以上，需有接種紀錄</text>
  <rect x="620" y="392" width="115" height="46" rx="6" fill="#a8a29e" opacity="0.12"/>
  <text x="677" y="407" font-size="14" fill="#a8a29e" font-weight="700" text-anchor="middle" >疫苗80%</text>
  <text x="677" y="423" font-size="13" fill="#a8a29e" text-anchor="middle" >接種記錄</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" >報告汪 reportwang.com</text>
</svg>
