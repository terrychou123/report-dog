<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- 背景 -->
  <rect width="800" height="500" fill="#fafaf9" />
  <rect x="0" y="0" width="800" height="64" fill="#1c1917" rx="8" />

  <!-- 標題 -->
  <text x="400" y="38"  font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">AI 段落改寫護理文書流程</text>
  <text x="400" y="58"  font-size="14" fill="#a8a29e" text-anchor="middle">護理師寫草稿、AI 協助精修、護理師最終把關</text>

  <!-- 步驟1 -->
  <rect x="30" y="90" width="164" height="330" rx="12" fill="#fffbeb" />
  <rect x="30" y="90" width="164" height="8" rx="4" fill="#d97706" />
  <circle cx="112" cy="148" r="28" fill="#d97706"  opacity="0.15"/>
  <text x="112" y="141"  font-size="14" fill="#d97706" text-anchor="middle" font-weight="600">STEP</text>
  <text x="112" y="158"  font-size="18" fill="#ffffff" text-anchor="middle" font-weight="900">01</text>
  <text x="112" y="200"  font-size="15" font-weight="700" fill="#92400e" text-anchor="middle">護理師撰寫草稿</text>
  <text x="112" y="228"  font-size="14" fill="#57534e" text-anchor="middle">護理評估粗稿</text>
  <text x="112" y="248"  font-size="14" fill="#57534e" text-anchor="middle">照護計畫初版</text>
  <text x="112" y="268"  font-size="14" fill="#57534e" text-anchor="middle">依臨床判斷下筆</text>
  <rect x="52" y="382" width="120" height="28" rx="14" fill="#d97706" />
  <text x="112" y="401"  font-size="14" fill="#ffffff" text-anchor="middle" font-weight="600">護理師主導</text>

  <!-- 箭頭 -->
  <text x="206" y="260"  font-size="26" fill="#d6d3d1" text-anchor="middle">&#8250;</text>

  <!-- 步驟2 -->
  <rect x="214" y="90" width="164" height="330" rx="12" fill="#f5f5f4" />
  <rect x="214" y="90" width="164" height="8" rx="4" fill="#78716c" />
  <circle cx="296" cy="148" r="28" fill="#78716c"  opacity="0.15"/>
  <text x="296" y="141"  font-size="14" fill="#78716c" text-anchor="middle" font-weight="600">STEP</text>
  <text x="296" y="158"  font-size="18" fill="#ffffff" text-anchor="middle" font-weight="900">02</text>
  <text x="296" y="200"  font-size="15" font-weight="700" fill="#44403c" text-anchor="middle">選取段落＋指令</text>
  <text x="296" y="228"  font-size="14" fill="#57534e" text-anchor="middle">「補上量表評估」</text>
  <text x="296" y="248"  font-size="14" fill="#57534e" text-anchor="middle">「整合跨科照護」</text>
  <text x="296" y="268"  font-size="14" fill="#57534e" text-anchor="middle">「改 SOAP 格式」</text>
  <rect x="236" y="382" width="120" height="28" rx="14" fill="#78716c" />
  <text x="296" y="401"  font-size="14" fill="#ffffff" text-anchor="middle" font-weight="600">指令輸入</text>

  <!-- 箭頭 -->
  <text x="390" y="260"  font-size="26" fill="#d6d3d1" text-anchor="middle">&#8250;</text>

  <!-- 步驟3 -->
  <rect x="398" y="90" width="164" height="330" rx="12" fill="#f5f5f4" />
  <rect x="398" y="90" width="164" height="8" rx="4" fill="#57534e" />
  <circle cx="480" cy="148" r="28" fill="#57534e"  opacity="0.15"/>
  <text x="480" y="141"  font-size="14" fill="#57534e" text-anchor="middle" font-weight="600">STEP</text>
  <text x="480" y="158"  font-size="18" fill="#ffffff" text-anchor="middle" font-weight="900">03</text>
  <text x="480" y="200"  font-size="15" font-weight="700" fill="#44403c" text-anchor="middle">AI 改寫保留原意</text>
  <text x="480" y="228"  font-size="14" fill="#57534e" text-anchor="middle">改寫單一段落</text>
  <text x="480" y="248"  font-size="14" fill="#57534e" text-anchor="middle">SOAP 結構化</text>
  <text x="480" y="268"  font-size="14" fill="#57534e" text-anchor="middle">支援多輪追問</text>
  <rect x="420" y="382" width="120" height="28" rx="14" fill="#57534e" />
  <text x="480" y="401"  font-size="14" fill="#ffffff" text-anchor="middle" font-weight="600">AI 精修</text>

  <!-- 箭頭 -->
  <text x="574" y="260"  font-size="26" fill="#d6d3d1" text-anchor="middle">&#8250;</text>

  <!-- 步驟4 -->
  <rect x="582" y="90" width="188" height="330" rx="12" fill="#f5f5f4" />
  <rect x="582" y="90" width="188" height="8" rx="4" fill="#a8a29e" />
  <circle cx="676" cy="148" r="28" fill="#a8a29e"  opacity="0.15"/>
  <text x="676" y="141"  font-size="14" fill="#a8a29e" text-anchor="middle" font-weight="600">STEP</text>
  <text x="676" y="158"  font-size="18" fill="#ffffff" text-anchor="middle" font-weight="900">04</text>
  <text x="676" y="200"  font-size="15" font-weight="700" fill="#44403c" text-anchor="middle">護理師確認簽名</text>
  <text x="676" y="228"  font-size="14" fill="#57534e" text-anchor="middle">臨床準確性把關</text>
  <text x="676" y="248"  font-size="14" fill="#57534e" text-anchor="middle">個別化細節補強</text>
  <text x="676" y="268"  font-size="14" fill="#57534e" text-anchor="middle">護理師簽名留存</text>
  <rect x="616" y="382" width="120" height="28" rx="14" fill="#a8a29e" />
  <text x="676" y="401"  font-size="14" fill="#ffffff" text-anchor="middle" font-weight="600">專業把關</text>

  <!-- 浮水印 -->
  <text x="400" y="480"  font-size="14" fill="#d6d3d1" text-anchor="middle">報告汪 reportwang.com</text>
</svg>
