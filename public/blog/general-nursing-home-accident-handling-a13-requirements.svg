  <text x="100" y="263" font-size="22" fill="#1e293b" font-weight="700">意外事件後 24 小時內通報</text>
  <text x="100" y="283" font-size="16" fill="#57534e">通報機構主管、醫師，依縣市規定通報主管機關</text>
  <rect x="620" y="243" width="136" height="46" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="260" font-size="16" fill="#78716c" text-anchor="middle">24 小時</text>
  <text x="688" y="280" font-size="16" fill="#78716c" text-anchor="middle">通報</text>
  <rect x="28" y="310" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="310" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="66" cy="341" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="347" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <text x="100" y="338" font-size="22" fill="#1e293b" font-weight="700">有追蹤改善措施記錄</text>
  <text x="100" y="358" font-size="16" fill="#57534e">發生後有改善措施、負責人、追蹤記錄，顯示機構有學習</text>
  <rect x="620" y="318" width="136" height="46" rx="8" fill="#57534e" opacity="0.12"/>
