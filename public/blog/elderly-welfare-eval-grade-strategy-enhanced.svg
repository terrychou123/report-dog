<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <text x="400" y="43" font-size="26" font-weight="700" fill="#1e293b" text-anchor="middle" >10 項二級加強指標：優等的必過門檻</text>
  <text x="400" y="68" font-size="16" fill="#57534e" text-anchor="middle" >A區 2 項 ／ B區 2 項 ／ C區 4 項 ／ D區 2 項，共 10 項全部達標</text>

  <!-- N=5, H=60, outer_gap=29 -->
  <!-- Row 1 (y=118) -->
  <rect x="40" y="89" width="720" height="60" rx="6" fill="#ffffff"/>
  <rect x="40" y="89" width="6" height="60" rx="2" fill="#d97706"/>
  <circle cx="74" cy="119" r="16" fill="#d97706" opacity="0.15"/>
  <text x="74" y="125" font-size="16" font-weight="700" fill="#d97706" text-anchor="middle" >A</text>
  <text x="100" y="112" font-size="16" font-weight="700" fill="#1e293b" >A區（2項）：A2 教育訓練 ／ A4 主管在職訓練</text>
  <text x="100" y="135" font-size="16" fill="#57534e" >全員每年訓練時數達標，主管完成衛福部指定課程，並留有完整訓練紀錄</text>
  <rect x="596" y="97" width="136" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="664" y="115" font-size="14" fill="#d97706" text-anchor="middle" font-weight="600" >訓練時數</text>
  <text x="664" y="134" font-size="14" fill="#d97706" text-anchor="middle" >文件查核</text>

  <!-- Row 2 (y=191) -->
  <rect x="40" y="162" width="720" height="60" rx="6" fill="#ffffff"/>
  <rect x="40" y="162" width="6" height="60" rx="2" fill="#78716c"/>
  <circle cx="74" cy="192" r="16" fill="#78716c" opacity="0.15"/>
  <text x="74" y="198" font-size="16" font-weight="700" fill="#78716c" text-anchor="middle" >B</text>
  <text x="100" y="185" font-size="16" font-weight="700" fill="#1e293b" >B區（2項）：B2 個案計畫 ／ B10 防疫機制</text>
  <text x="100" y="208" font-size="16" fill="#57534e" >B2：72小時初評＋每季重評＋計畫實際執行；B10：體溫記錄＋感管手冊每年更新</text>
  <rect x="596" y="170" width="136" height="46" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="664" y="188" font-size="14" fill="#78716c" text-anchor="middle" font-weight="600" >跨文件</text>
  <text x="664" y="207" font-size="14" fill="#78716c" text-anchor="middle" >交叉核查</text>

  <!-- Row 3 (y=264) -->
  <rect x="40" y="235" width="720" height="60" rx="6" fill="#ffffff"/>
  <rect x="40" y="235" width="6" height="60" rx="2" fill="#57534e"/>
  <circle cx="74" cy="265" r="16" fill="#57534e" opacity="0.15"/>
  <text x="74" y="271" font-size="16" font-weight="700" fill="#57534e" text-anchor="middle" >C</text>
  <text x="100" y="258" font-size="16" font-weight="700" fill="#1e293b" >C區（4項）：C5 電梯 ／ C6 無障礙浴廁 ／ C7 廚房衛生 ／ C16 供水</text>
  <text x="100" y="281" font-size="16" fill="#57534e" >硬體設施類，若有缺失需提前評估並啟動改善工程，最好評鑑前 1 年完成</text>
  <rect x="596" y="243" width="136" height="46" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="664" y="261" font-size="14" fill="#57534e" text-anchor="middle" font-weight="600" >硬體設施</text>
  <text x="664" y="280" font-size="14" fill="#57534e" text-anchor="middle" >提前 1 年查</text>

  <!-- Row 4 (y=337) -->
  <rect x="40" y="308" width="720" height="60" rx="6" fill="#ffffff"/>
  <rect x="40" y="308" width="6" height="60" rx="2" fill="#a8a29e"/>
  <circle cx="74" cy="338" r="16" fill="#a8a29e" opacity="0.2"/>
  <text x="74" y="344" font-size="16" font-weight="700" fill="#a8a29e" text-anchor="middle" >D</text>
  <text x="100" y="331" font-size="16" font-weight="700" fill="#1e293b" >D區（2項）：D1 個案資料統計 ／ D6 住民隱私</text>
  <text x="100" y="354" font-size="16" fill="#57534e" >D1：資料統計分析連結改善行動；D6：無監視器於寢室/浴廁＋床間有圍簾</text>
  <rect x="596" y="316" width="136" height="46" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="664" y="334" font-size="14" fill="#78716c" text-anchor="middle" font-weight="600" >系統分析</text>
  <text x="664" y="353" font-size="14" fill="#78716c" text-anchor="middle" >現場察看</text>

  <!-- Row 5 (y=410) -->
  <rect x="40" y="381" width="720" height="60" rx="6" fill="#16a34a" opacity="0.08"/>
  <rect x="40" y="381" width="6" height="60" rx="3" fill="#16a34a"/>
  <circle cx="74" cy="411" r="16" fill="#16a34a" opacity="0.2"/>
  <text x="74" y="417" font-size="16" font-weight="700" fill="#16a34a" text-anchor="middle" >[v]</text>
  <text x="100" y="404" font-size="16" font-weight="700" fill="#16a34a" >全部 10 項達標 - 優等必要條件之一</text>
  <text x="100" y="427" font-size="16" fill="#57534e" >10 項二級加強任一未達標，即使總分超過 90 分，仍只能評為「合格」</text>
  <rect x="596" y="389" width="136" height="46" rx="8" fill="#16a34a" opacity="0.12"/>
  <text x="664" y="407" font-size="14" fill="#16a34a" text-anchor="middle" font-weight="600" >優等關鍵</text>
  <text x="664" y="426" font-size="14" fill="#16a34a" text-anchor="middle" >缺一不可</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" >報告汪 reportwang.com</text>
</svg>
