  <text x="685" y="183" text-anchor="middle" font-size="17" fill="#a8a29e" font-weight="700">STEP</text>
  <text x="685" y="211" text-anchor="middle" font-size="28" fill="#a8a29e" font-weight="700">04</text>
  <text x="685" y="297" text-anchor="middle" font-size="20" fill="#1e293b" font-weight="700">最終確認</text>
  <text x="685" y="322" text-anchor="middle" font-size="15" fill="#57534e">行程確認</text>
