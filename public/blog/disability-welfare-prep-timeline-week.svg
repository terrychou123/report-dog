  <line x1="28" y1="94" x2="772" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- N=4 flow: card_w=174, arrow_y=279 -->
  <line x1="202" y1="279" x2="218" y2="279" stroke="#c4bfb8" stroke-width="2"/>
  <polygon points="206,273 218,279 206,285" fill="#c4bfb8"/>
  <line x1="392" y1="279" x2="408" y2="279" stroke="#c4bfb8" stroke-width="2"/>
  <polygon points="396,273 408,279 396,285" fill="#c4bfb8"/>
  <line x1="582" y1="279" x2="598" y2="279" stroke="#c4bfb8" stroke-width="2"/>
  <polygon points="586,273 598,279 586,285" fill="#c4bfb8"/>

  <!-- Card 1: D-7到D-5 x=28 cx=115 -->
  <rect x="28" y="108" width="174" height="342" rx="12" fill="white"/>
  <rect x="28" y="108" width="174" height="8" rx="4" fill="#d97706"/>
  <rect x="28" y="112" width="174" height="4" fill="#d97706"/>
  <circle cx="115" cy="194" r="44" fill="#fef3c7"/>
  <text x="115" y="183" text-anchor="middle" font-size="17" fill="#d97706" font-weight="700">STEP</text>
  <text x="115" y="211" text-anchor="middle" font-size="28" fill="#d97706" font-weight="700">01</text>
  <text x="115" y="297" text-anchor="middle" font-size="20" fill="#1e293b" font-weight="700">最終清點</text>
  <text x="115" y="322" text-anchor="middle" font-size="15" fill="#57534e">文件逐項</text>
  <text x="115" y="344" text-anchor="middle" font-size="15" fill="#57534e">確認齊全</text>
  <rect x="41" y="381" width="148" height="36" rx="18" fill="#fef3c7"/>
  <text x="115" y="405" text-anchor="middle" font-size="16" fill="#d97706" font-weight="600">D-7 至 D-5</text>

  <!-- Card 2: D-4到D-3 x=218 cx=305 -->
  <rect x="218" y="108" width="174" height="342" rx="12" fill="white"/>
  <rect x="218" y="108" width="174" height="8" rx="4" fill="#78716c"/>
