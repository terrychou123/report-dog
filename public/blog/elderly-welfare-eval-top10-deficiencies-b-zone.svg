<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題 -->
  <text x="400" y="46" font-size="26" font-weight="700" fill="#1e293b" text-anchor="middle" >B 區照護品質：4 大高頻缺失重點</text>
  <text x="400" y="76" font-size="16" fill="#57534e" text-anchor="middle" >B2 服務計畫 / B10 防疫 / B13-B19 七大監測 / B25-B27 照護記錄</text>

  <!-- 列1：B2 -->
  <rect x="60" y="100" width="680" height="75" rx="10" fill="white"/>
  <rect x="60" y="100" width="6" height="75" rx="2" fill="#d97706"/>
  <circle cx="94" cy="137" r="16" fill="#d97706" opacity="0.15"/>
  <text x="94" y="143" font-size="15" fill="#d97706" text-anchor="middle" font-weight="700" >B2</text>
  <text x="125" y="127" font-size="20" font-weight="700" fill="#1e293b" >B2 個案服務計畫不完整</text>
  <text x="125" y="151" font-size="15" fill="#57534e" >72 小時內完成入住評估；每 3 個月更新一次照護計畫；半年與家屬共同討論修正</text>
  <text x="125" y="167" font-size="14" fill="#dc2626" >缺失：評估未依時程更新、缺照服員記錄、個案資料未妥善保存</text>
  <rect x="612" y="108" width="112" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="668" y="136" font-size="16" font-weight="700" fill="#d97706" text-anchor="middle" >二級加強</text>

  <!-- 列2：B10 -->
  <rect x="60" y="192" width="680" height="75" rx="10" fill="white"/>
  <rect x="60" y="192" width="6" height="75" rx="2" fill="#78716c"/>
  <circle cx="94" cy="229" r="16" fill="#78716c" opacity="0.15"/>
  <text x="94" y="235" font-size="14" fill="#78716c" text-anchor="middle" font-weight="700" >B10</text>
  <text x="125" y="219" font-size="20" font-weight="700" fill="#1e293b" >B10 防疫機制文件不足</text>
  <text x="125" y="243" font-size="15" fill="#57534e" >每日量測體溫並上網登載；感染管制手冊每年更新；防護物資須有適當儲備量</text>
  <text x="125" y="259" font-size="14" fill="#dc2626" >缺失：SOP 未更新至最新版、訓練記錄不全、防護物資儲放不當</text>
  <rect x="612" y="200" width="112" height="46" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="668" y="228" font-size="16" font-weight="700" fill="#78716c" text-anchor="middle" >二級加強</text>

  <!-- 列3：B13-B19 -->
  <rect x="60" y="284" width="680" height="75" rx="10" fill="white"/>
  <rect x="60" y="284" width="6" height="75" rx="2" fill="#57534e"/>
  <circle cx="94" cy="321" r="16" fill="#57534e" opacity="0.15"/>
  <text x="94" y="327" font-size="12" fill="#57534e" text-anchor="middle" font-weight="700" >B13-19</text>
  <text x="125" y="311" font-size="20" font-weight="700" fill="#1e293b" >B13-B19 七大監測指標未落實 PDCA</text>
  <text x="125" y="335" font-size="15" fill="#57534e" >跌倒 / 壓傷 / 疼痛 / 約束 / 感染 / 非計畫住院 / 體重變化，每季分析改善</text>
  <text x="125" y="351" font-size="14" fill="#dc2626" >缺失：有發生案件但無逐案分析、缺改善方案追蹤紀錄</text>
  <rect x="612" y="292" width="112" height="46" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="668" y="320" font-size="16" font-weight="700" fill="#57534e" text-anchor="middle" >7 項監測</text>

  <!-- 列4：B25-B27 -->
  <rect x="60" y="376" width="680" height="75" rx="10" fill="white"/>
  <rect x="60" y="376" width="6" height="75" rx="2" fill="#a8a29e"/>
  <circle cx="94" cy="413" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="94" y="419" font-size="12" fill="#78716c" text-anchor="middle" font-weight="700" >B25-27</text>
  <text x="125" y="403" font-size="20" font-weight="700" fill="#1e293b" >B25-B27 照護記錄缺失</text>
  <text x="125" y="427" font-size="15" fill="#57534e" >每 2 小時翻身拍背記錄；可移動住民每日下床 2 次；自我照顧能力促進記錄</text>
  <text x="125" y="443" font-size="14" fill="#dc2626" >缺失：翻身記錄與實際不符、下床活動次數記錄不完整</text>
  <rect x="612" y="384" width="112" height="46" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="668" y="412" font-size="16" font-weight="700" fill="#78716c" text-anchor="middle" >照護記錄</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" >報告汪 reportwang.com</text>
</svg>
