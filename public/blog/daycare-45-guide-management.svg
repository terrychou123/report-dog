<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"
     font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">參、經營管理效能（第 23–37 條）</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">行政制度 → 人員管理 → 財務管理 → 緊急應變</text>
  <line x1="28" y1="94" x2="772" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- 箭頭 N=4, arrow_y=279 -->
  <!-- 0→1: card 0 right=28+174=202, card 1 left=218 -->
  <line x1="202" y1="279" x2="218" y2="279" stroke="#c4bfb8" stroke-width="2"/>
  <polygon points="202,273 218,279 202,285" fill="#c4bfb8"/>
  <!-- 1→2: 392→408 -->
  <line x1="392" y1="279" x2="408" y2="279" stroke="#c4bfb8" stroke-width="2"/>
  <polygon points="392,273 408,279 392,285" fill="#c4bfb8"/>
  <!-- 2→3: 582→598 -->
  <line x1="582" y1="279" x2="598" y2="279" stroke="#c4bfb8" stroke-width="2"/>
  <polygon points="582,273 598,279 582,285" fill="#c4bfb8"/>

  <!-- Step 1: 行政制度 #d97706, card x=28 cx=115, r=44 -->
  <rect x="28" y="108" width="174" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="108" width="174" height="8" rx="4" fill="#d97706"/>
  <rect x="28" y="112" width="174" height="4" fill="#d97706"/>
  <circle cx="115" cy="193" r="44" fill="#fef3c7"/>
  <text x="115" y="182" text-anchor="middle" font-size="18" fill="#d97706" font-weight="700">STEP</text>
  <text x="115" y="211" text-anchor="middle" font-size="29" fill="#d97706" font-weight="700">01</text>
  <text x="115" y="296" text-anchor="middle" font-size="28" fill="#1e293b" font-weight="700">行政制度</text>
  <text x="115" y="323" text-anchor="middle" font-size="18" fill="#57534e">計畫手冊</text>
  <text x="115" y="345" text-anchor="middle" font-size="18" fill="#57534e">會議記錄</text>
  <rect x="41" y="379" width="148" height="36" rx="18" fill="#fef3c7"/>
  <text x="115" y="403" text-anchor="middle" font-size="16" fill="#d97706" font-weight="600">第 23–27 條</text>

  <!-- Step 2: 人員管理 #78716c, card x=218 cx=305, r=44 -->
  <rect x="218" y="108" width="174" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="218" y="108" width="174" height="8" rx="4" fill="#78716c"/>
  <rect x="218" y="112" width="174" height="4" fill="#78716c"/>
  <circle cx="305" cy="193" r="44" fill="#f5f5f4"/>
  <text x="305" y="182" text-anchor="middle" font-size="18" fill="#78716c" font-weight="700">STEP</text>
  <text x="305" y="211" text-anchor="middle" font-size="29" fill="#78716c" font-weight="700">02</text>
  <text x="305" y="296" text-anchor="middle" font-size="28" fill="#1e293b" font-weight="700">人員管理</text>
  <text x="305" y="323" text-anchor="middle" font-size="18" fill="#57534e">訓練留任</text>
  <text x="305" y="345" text-anchor="middle" font-size="18" fill="#57534e">健檢疫苗</text>
  <rect x="231" y="379" width="148" height="36" rx="18" fill="#f5f5f4"/>
  <text x="305" y="403" text-anchor="middle" font-size="16" fill="#78716c" font-weight="600">第 28–33 條</text>

  <!-- Step 3: 財務管理 #57534e, card x=408 cx=495, r=44 -->
  <rect x="408" y="108" width="174" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="408" y="108" width="174" height="8" rx="4" fill="#57534e"/>
  <rect x="408" y="112" width="174" height="4" fill="#57534e"/>
  <circle cx="495" cy="193" r="44" fill="#f5f0eb"/>
  <text x="495" y="182" text-anchor="middle" font-size="18" fill="#57534e" font-weight="700">STEP</text>
  <text x="495" y="211" text-anchor="middle" font-size="29" fill="#57534e" font-weight="700">03</text>
  <text x="495" y="296" text-anchor="middle" font-size="28" fill="#1e293b" font-weight="700">財務管理</text>
  <text x="495" y="323" text-anchor="middle" font-size="18" fill="#57534e">獨立會計</text>
  <text x="495" y="345" text-anchor="middle" font-size="18" fill="#57534e">收費徵信</text>
  <rect x="421" y="379" width="148" height="36" rx="18" fill="#f5f0eb"/>
  <text x="495" y="403" text-anchor="middle" font-size="16" fill="#57534e" font-weight="600">第 34 條</text>

  <!-- Step 4: 緊急應變 #a8a29e, card x=598 cx=685, r=44 -->
  <rect x="598" y="108" width="174" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="598" y="108" width="174" height="8" rx="4" fill="#a8a29e"/>
  <rect x="598" y="112" width="174" height="4" fill="#a8a29e"/>
  <circle cx="685" cy="193" r="44" fill="#f5f5f4"/>
  <text x="685" y="182" text-anchor="middle" font-size="18" fill="#a8a29e" font-weight="700">STEP</text>
  <text x="685" y="211" text-anchor="middle" font-size="29" fill="#a8a29e" font-weight="700">04</text>
  <text x="685" y="296" text-anchor="middle" font-size="28" fill="#1e293b" font-weight="700">緊急應變</text>
  <text x="685" y="323" text-anchor="middle" font-size="18" fill="#57534e">事件急救</text>
  <text x="685" y="345" text-anchor="middle" font-size="18" fill="#57534e">性騷擾防</text>
  <rect x="611" y="379" width="148" height="36" rx="18" fill="#f5f5f4"/>
  <text x="685" y="403" text-anchor="middle" font-size="16" fill="#a8a29e" font-weight="600">第 35–37 條</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
