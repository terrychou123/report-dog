<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', sans-serif">
  <!-- @template: cover -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 右側裝飾區塊 -->

  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>
  <!-- 大數字裝飾 -->
  <text x="1010" y="370" font-size="240" fill="#d97706" opacity="0.85" text-anchor="middle" font-weight="700">60</text>
  <text x="1010" y="420" font-size="28" fill="#57534e" text-anchor="middle">專業服務滿分</text>
  <text x="1010" y="460" font-size="24" fill="#57534e" text-anchor="middle">（佔評鑑總分 60%）</text>
  <text x="1010" y="510" font-size="22" fill="#78716c" text-anchor="middle">6 個子項 14 個評鑑項目</text>

  <!-- 左側主內容 -->
  <!-- 分類標籤 -->
  <rect x="60" y="100" width="120" height="36" rx="18" fill="#d97706" opacity="0.15"/>
  <text x="120" y="124" font-size="20" fill="#d97706" text-anchor="middle" font-weight="600">評鑑準備</text>
  <rect x="196" y="100" width="120" height="36" rx="18" fill="#78716c" opacity="0.12"/>
  <text x="256" y="124" font-size="20" fill="#78716c" text-anchor="middle" font-weight="600">112年度</text>

  <!-- 主標題 -->
  <text x="60" y="210" font-size="96" fill="#1e293b" font-weight="700">專業服務</text>
  <text x="60" y="310" font-size="96" fill="#d97706" font-weight="700">60 分怎麼拿？</text>

  <!-- 分隔線 -->
  <line x1="60" y1="340" x2="780" y2="340" stroke="#dedad3" stroke-width="2"/>

  <!-- 副標題 -->
  <text x="60" y="390" font-size="36" fill="#57534e">安置機構評鑑最大區塊完整解析</text>

  <!-- 特色標籤列 -->
  <rect x="60" y="430" width="136" height="40" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="128" y="456" font-size="20" fill="#d97706" text-anchor="middle" font-weight="600">輔導目標 15分</text>
  <rect x="208" y="430" width="136" height="40" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="276" y="456" font-size="20" fill="#78716c" text-anchor="middle" font-weight="600">雙版本各 32分</text>
  <rect x="356" y="430" width="136" height="40" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="424" y="456" font-size="20" fill="#57534e" text-anchor="middle" font-weight="600">資源結合 6分</text>

  <!-- 底部資訊 -->
  <text x="60" y="530" font-size="24" fill="#78716c">兒少安置機構評鑑 ／ 報告汪</text>

  <!-- 品牌浮水印 -->
  <text x="1140" y="600" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
