<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8" />

  <!-- 標題區塊 -->
  <rect x="0" y="0" width="800" height="100" fill="#d97706" />
  <text x="400" y="45" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">危險物品標示三大規範</text>
  <text x="400" y="75" font-size="14" fill="#fef3c7" text-anchor="middle">實地查核委員必核對的現場標示要件</text>

  <!-- 列1：GHS危害標示（y=130，H=90） -->
  <rect x="30" y="130" width="740" height="90" rx="12" fill="#ffffff" stroke="#e8e6de" stroke-width="1" />
  <rect x="30" y="130" width="6" height="90" rx="2" fill="#d97706" />
  <circle cx="68" cy="175" r="20" fill="#d97706"  opacity="0.15"/>
  <text x="68" y="181" font-size="16" font-weight="700" fill="#d97706" text-anchor="middle">1</text>
  <text x="100" y="158" font-size="17" font-weight="700" fill="#1e293b">GHS危害標示</text>
  <text x="100" y="180" font-size="16" fill="#57534e">容器需標示：危害圖示、信號詞（危險/警告）、危害說明、廠商資訊，</text>
  <text x="100" y="200" font-size="16" fill="#57534e">標示清晰不褪色</text>
  <rect x="648" y="150" width="90" height="28" rx="6" fill="#fef3c7" />
  <text x="693" y="169" font-size="14" fill="#d97706" text-anchor="middle" font-weight="600">容器標示</text>

  <!-- 列2：SDS安全資料表（y=233，H=90） -->
  <rect x="30" y="235" width="740" height="90" rx="12" fill="#ffffff" stroke="#e8e6de" stroke-width="1" />
  <rect x="30" y="235" width="6" height="90" rx="2" fill="#78716c" />
  <circle cx="68" cy="280" r="20" fill="#78716c"  opacity="0.15"/>
  <text x="68" y="286" font-size="16" font-weight="700" fill="#78716c" text-anchor="middle">2</text>
  <text x="100" y="263" font-size="17" font-weight="700" fill="#1e293b">SDS安全資料表</text>
  <text x="100" y="285" font-size="16" fill="#57534e">每種危險物品的SDS放置於使用/儲存場所旁，保持最新版本，</text>
  <text x="100" y="305" font-size="16" fill="#57534e">操作人員知道位置</text>
  <rect x="648" y="255" width="90" height="28" rx="6" fill="#f5f5f4" />
  <text x="693" y="274" font-size="14" fill="#57534e" text-anchor="middle" font-weight="600">資料就近</text>

  <!-- 列3：儲存區標示（y=338，H=90） -->
  <rect x="30" y="338" width="740" height="90" rx="12" fill="#ffffff" stroke="#e8e6de" stroke-width="1" />
  <rect x="30" y="338" width="6" height="90" rx="2" fill="#57534e" />
  <circle cx="68" cy="383" r="20" fill="#57534e"  opacity="0.15"/>
  <text x="68" y="389" font-size="16" font-weight="700" fill="#57534e" text-anchor="middle">3</text>
  <text x="100" y="365" font-size="17" font-weight="700" fill="#1e293b">儲存區標示</text>
  <text x="100" y="387" font-size="16" fill="#57534e">危險物品儲存區域明顯標示危險警示，</text>
  <text x="100" y="407" font-size="16" fill="#57534e">禁止飲食、禁止明火等限制標示清楚</text>
  <rect x="648" y="358" width="90" height="28" rx="6" fill="#f5f5f4" />
  <text x="693" y="377" font-size="14" fill="#57534e" text-anchor="middle" font-weight="600">區域標示</text>

  <!-- 浮水印 -->
  <text x="400" y="480" font-size="14" fill="#a8a29e" text-anchor="middle" opacity="0.6">報告汪 reportwang.com</text>
</svg>
