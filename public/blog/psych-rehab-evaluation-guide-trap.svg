<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">5大常見失分陷阱</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">精神復健機構評鑑最容易被扣分的地方</text>
  <line x1="28" y1="94" x2="772" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- Row 1 -->
  <rect x="28" y="108" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="108" width="6" height="60" rx="2" fill="#d97706"/>
  <circle cx="66" cy="138" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="144" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <text x="100" y="129" font-size="18" fill="#1e293b" font-weight="700">復健計畫未每3個月修正（2.2）</text>
  <text x="100" y="151" font-size="15" fill="#57534e">常見：初次計畫完整，但後續修正記錄缺漏或流於形式，評鑑委員會抽查多份個案</text>
  <rect x="616" y="116" width="140" height="36" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="686" y="139" font-size="15" fill="#d97706" text-anchor="middle" font-weight="700">每3月強制修正</text>

  <!-- Row 2 -->
  <rect x="28" y="178" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="178" width="6" height="60" rx="2" fill="#78716c"/>
  <circle cx="66" cy="208" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="214" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <text x="100" y="199" font-size="18" fill="#1e293b" font-weight="700">學員不知道自己的藥怎麼管（2.8 PFM）</text>
  <text x="100" y="221" font-size="15" fill="#57534e">機構若習慣統一保管發藥，需評鑑前調整作業模式，讓60%以上學員自行保管</text>
  <rect x="616" y="186" width="140" height="36" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="686" y="209" font-size="15" fill="#78716c" text-anchor="middle" font-weight="700">PFM訪談重點</text>

  <!-- Row 3 -->
  <rect x="28" y="248" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="248" width="6" height="60" rx="2" fill="#57534e"/>
  <circle cx="66" cy="278" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="284" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <text x="100" y="269" font-size="18" fill="#1e293b" font-weight="700">結案回歸社區比例不足（3.3）</text>
  <text x="100" y="291" font-size="15" fill="#57534e">4年內需15%以上學員功能進步結案；主要留住學員的機構需長期累積紀錄</text>
  <rect x="616" y="256" width="140" height="36" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="686" y="279" font-size="15" fill="#57534e" text-anchor="middle" font-weight="700">長期累積指標</text>

  <!-- Row 4: 住宿型3.11 紅色警示 -->
  <rect x="28" y="318" width="744" height="60" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <rect x="28" y="318" width="6" height="60" rx="2" fill="#dc2626"/>
  <circle cx="66" cy="348" r="16" fill="#dc2626" opacity="0.15"/>
  <!-- 警告三角形 -->
  <polygon points="66,336 59,354 73,354" fill="none" stroke="#dc2626" stroke-width="2"/>
  <text x="66" y="352" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="900">!</text>
  <text x="100" y="339" font-size="18" fill="#1e293b" font-weight="700">住宿型3.11限制出入（重點項目）</text>
  <text x="100" y="361" font-size="15" fill="#dc2626">上鎖大門、須簽退才能外出＝限制出入自由，未達C即評鑑不合格</text>
  <rect x="616" y="326" width="140" height="36" rx="8" fill="#dc2626" opacity="0.12"/>
  <text x="686" y="349" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="700">不合格風險最高</text>

  <!-- Row 5 -->
  <rect x="28" y="388" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="388" width="6" height="60" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="418" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="424" font-size="16" fill="#a8a29e" text-anchor="middle" font-weight="900">5</text>
  <text x="100" y="409" font-size="18" fill="#1e293b" font-weight="700">消防演練資料不完整（3.9）</text>
  <text x="100" y="431" font-size="15" fill="#57534e">每半年1次演練須通過消防主管機關備查，常見問題：「做了但沒備查」或找不到資料</text>
  <rect x="616" y="396" width="140" height="36" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="686" y="419" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700">備查紀錄留存</text>

  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
