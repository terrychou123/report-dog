<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- @template: list-N -->
  <rect width="800" height="500" fill="#f0efe8"/>
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">5大常見失分陷阱</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">精神復健機構評鑑最容易被扣分的地方</text>
  <line x1="28" y1="94" x2="772" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- Row 1 -->
  <rect x="28" y="118" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="118" width="6" height="60" rx="2" fill="#d97706"/>
  <circle cx="66" cy="148" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="154" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <text x="100" y="140" font-size="21" fill="#1e293b" font-weight="700">復健計畫未每3個月修正（2.2）</text>
  <text x="100" y="161" font-size="16" fill="#57534e">常見：初次計畫完整，但後續修正記錄缺漏或流於形式，評鑑委員會抽查多份個案</text>
  <rect x="616" y="126" width="140" height="44" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="686" y="144" font-size="16" fill="#d97706" text-anchor="middle" font-weight="700">每3月強制修正</text>
  <text x="686" y="162" font-size="16" fill="#d97706" text-anchor="middle"> </text>

  <!-- Row 2 -->
  <rect x="28" y="191" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="191" width="6" height="60" rx="2" fill="#78716c"/>
  <circle cx="66" cy="221" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="227" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <text x="100" y="213" font-size="21" fill="#1e293b" font-weight="700">學員不知道自己的藥怎麼管（2.8 PFM）</text>
  <text x="100" y="234" font-size="16" fill="#57534e">機構若習慣統一保管發藥，需評鑑前調整作業模式，讓60%以上學員自行保管</text>
  <rect x="616" y="199" width="140" height="44" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="686" y="217" font-size="16" fill="#78716c" text-anchor="middle" font-weight="700">PFM訪談重點</text>
  <text x="686" y="235" font-size="16" fill="#78716c" text-anchor="middle"> </text>

  <!-- Row 3 -->
  <rect x="28" y="264" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="264" width="6" height="60" rx="2" fill="#57534e"/>
  <circle cx="66" cy="294" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="300" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <text x="100" y="286" font-size="21" fill="#1e293b" font-weight="700">結案回歸社區比例不足（3.3）</text>
  <text x="100" y="307" font-size="16" fill="#57534e">4年內需15%以上學員功能進步結案；主要留住學員的機構需長期累積紀錄</text>
  <rect x="616" y="272" width="140" height="44" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="686" y="290" font-size="16" fill="#57534e" text-anchor="middle" font-weight="700">長期累積指標</text>
  <text x="686" y="308" font-size="16" fill="#57534e" text-anchor="middle"> </text>

  <!-- Row 4: 住宿型3.11 警示（白底警示色） -->
  <rect x="28" y="337" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="337" width="6" height="60" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="367" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="373" font-size="16" fill="#dc2626" text-anchor="middle" font-weight="900">!</text>
  <text x="100" y="359" font-size="21" fill="#dc2626" font-weight="700">住宿型3.11限制出入（重點項目）</text>
  <text x="100" y="380" font-size="16" fill="#dc2626">上鎖大門、須簽退才能外出＝限制出入自由，未達C即評鑑不合格</text>
  <rect x="616" y="345" width="140" height="44" rx="8" fill="#dc2626" opacity="0.12"/>
  <text x="686" y="363" font-size="16" fill="#dc2626" text-anchor="middle" font-weight="700">不合格風險</text>
  <text x="686" y="381" font-size="16" fill="#dc2626" text-anchor="middle" font-weight="700">最高</text>

  <!-- Row 5 -->
  <rect x="28" y="410" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="410" width="6" height="60" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="440" r="16" fill="#94a3b8" opacity="0.15"/>
  <text x="66" y="446" font-size="16" fill="#94a3b8" text-anchor="middle" font-weight="900">5</text>
  <text x="100" y="432" font-size="21" fill="#1e293b" font-weight="700">消防演練資料不完整（3.9）</text>
  <text x="100" y="453" font-size="16" fill="#57534e">每半年1次演練須通過消防主管機關備查，常見問題：「做了但沒備查」或找不到資料</text>
  <rect x="616" y="418" width="140" height="44" rx="8" fill="#94a3b8" opacity="0.12"/>
  <text x="686" y="436" font-size="16" fill="#6b7280" text-anchor="middle" font-weight="700">備查紀錄留存</text>
  <text x="686" y="454" font-size="16" fill="#6b7280" text-anchor="middle"> </text>

  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
