<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- 標題 -->
  <text x="400" y="48" font-size="32" fill="#1e293b" text-anchor="middle" font-weight="700">因應長照 3.0 準備建議</text>
  <text x="400" y="78" font-size="22" fill="#78716c" text-anchor="middle">4 個方向 · 現在就可以開始</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#d97706" stroke-width="2"/>

  <!-- 標題列背景 -->
  <rect x="0" y="29" width="800" height="60" fill="white"/>
  <rect x="0" y="29" width="6" height="60" fill="#d97706"/>

  <!-- 建議 1 -->
  <rect x="28" y="118" width="744" height="72" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="118" width="6" height="72" rx="3" fill="#d97706"/>
  <circle cx="70" cy="154" r="16" fill="#d97706"/>
  <text x="70" y="160" font-size="20" fill="white" text-anchor="middle" font-weight="700">1</text>
  <text x="105" y="143" font-size="14" fill="#1e293b" font-weight="600">重新審視 B2 個案計畫的個別化程度</text>
  <text x="105" y="163" font-size="14" fill="#57534e">確認每位住民的個案計畫是否真正反映其個人偏好、生活習慣與文化背景</text>
  <text x="105" y="181" font-size="13" fill="#78716c">長照3.0的核心是住民本位，個案計畫是最直接的展現機會</text>
  <rect x="620" y="126" width="136" height="55" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="151" font-size="13" fill="#d97706" text-anchor="middle" font-weight="600">住民本位</text>
  <text x="688" y="169" font-size="12" fill="#78716c" text-anchor="middle">B2 強化</text>

  <!-- 建議 2 -->
  <rect x="28" y="203" width="744" height="72" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="203" width="6" height="72" rx="3" fill="#78716c"/>
  <circle cx="70" cy="239" r="16" fill="#78716c"/>
  <text x="70" y="245" font-size="20" fill="white" text-anchor="middle" font-weight="700">2</text>
  <text x="105" y="228" font-size="14" fill="#1e293b" font-weight="600">選擇一個流程進行數位化，作為 E2 創新措施</text>
  <text x="105" y="248" font-size="14" fill="#57534e">品質會議管理系統、跌倒紀錄數位化、或評鑑報告管理平台均可</text>
  <text x="105" y="266" font-size="13" fill="#78716c">重點是「有在做」，從低成本的雲端工具開始即可，不必一次到位</text>
  <rect x="620" y="211" width="136" height="55" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="236" font-size="13" fill="#78716c" text-anchor="middle" font-weight="600">數位化</text>
  <text x="688" y="254" font-size="12" fill="#78716c" text-anchor="middle">E2 素材</text>

  <!-- 建議 3 -->
  <rect x="28" y="288" width="744" height="72" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="288" width="6" height="72" rx="3" fill="#57534e"/>
  <circle cx="70" cy="324" r="16" fill="#57534e"/>
  <text x="70" y="330" font-size="20" fill="white" text-anchor="middle" font-weight="700">3</text>
  <text x="105" y="313" font-size="14" fill="#1e293b" font-weight="600">強化品質會議的數據分析深度</text>
  <text x="105" y="333" font-size="14" fill="#57534e">在 B1 品質會議中加入跌倒、壓損、感染發生率的趨勢圖表分析</text>
  <text x="105" y="351" font-size="13" fill="#78716c">從「事件報告」進化為「趨勢分析＋改善對策」，展現品質管理成熟度</text>
  <rect x="620" y="296" width="136" height="55" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="321" font-size="13" fill="#57534e" text-anchor="middle" font-weight="600">品質深化</text>
  <text x="688" y="339" font-size="12" fill="#78716c" text-anchor="middle">B1 升級</text>

  <!-- 建議 4 -->
  <rect x="28" y="373" width="744" height="72" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="373" width="6" height="72" rx="3" fill="#94a3b8"/>
  <circle cx="70" cy="409" r="16" fill="#94a3b8"/>
  <text x="70" y="415" font-size="20" fill="white" text-anchor="middle" font-weight="700">4</text>
  <text x="105" y="398" font-size="14" fill="#1e293b" font-weight="600">建立住民生命故事紀錄，展現以人為中心的服務文化</text>
  <text x="105" y="418" font-size="14" fill="#57534e">在 D5 靈性關懷紀錄中加入住民個人故事、重要記憶與心願</text>
  <text x="105" y="436" font-size="13" fill="#78716c">這是長照3.0最難複製的競爭力，也是委員最願意給高分的亮點</text>
  <rect x="620" y="381" width="136" height="55" rx="8" fill="#94a3b8" opacity="0.18"/>
  <text x="688" y="406" font-size="13" fill="#57534e" text-anchor="middle" font-weight="600">文化建立</text>
  <text x="688" y="424" font-size="12" fill="#78716c" text-anchor="middle">D5 深化</text>

  <!-- 水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
