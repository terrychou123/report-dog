<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區（主標 32px y=48 / 副標 22px y=78 / 分隔線 y=94）-->
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">評鑑委員三大查核方式</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">了解查核方式，才能有效準備評鑑</text>
  <line x1="129" y1="94" x2="671" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- 箭頭（N=3，card_w=170，margin=129）-->
  <!-- arrow y=279，arrow from card 0 (x1=299) to card 1 (x2=315)-->
  <line x1="299" y1="279" x2="310" y2="279" stroke="#c4bfb8" stroke-width="2"/>
  <polygon points="299,273 315,279 299,285" fill="#c4bfb8"/>
  <!-- arrow from card 1 (x1=485) to card 2 (x2=501) -->
  <line x1="485" y1="279" x2="496" y2="279" stroke="#c4bfb8" stroke-width="2"/>
  <polygon points="485,273 501,279 485,285" fill="#c4bfb8"/>

  <!-- Card 0：實地觀察（cx=214, x=129, #d97706）-->
  <rect x="129" y="108" width="170" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="129" y="108" width="170" height="8" rx="4" fill="#d97706"/>
  <rect x="129" y="112" width="170" height="4" fill="#d97706"/>
  <!-- STEP 圓圈 cy=194 -->
  <circle cx="214" cy="194" r="43" fill="#fef3c7"/>
  <text x="214" y="183" text-anchor="middle" font-size="16" fill="#d97706" font-weight="700">STEP</text>
  <text x="214" y="211" text-anchor="middle" font-size="26" fill="#d97706" font-weight="700">01</text>
  <!-- H 標題 -->
  <text x="214" y="298" text-anchor="middle" font-size="28" fill="#1e293b" font-weight="700">實地觀察</text>
  <!-- J1 說明 1 -->
  <text x="214" y="326" text-anchor="middle" font-size="18" fill="#57534e">環境設備現場</text>
  <!-- J2 說明 2 -->
  <text x="214" y="348" text-anchor="middle" font-size="18" fill="#57534e">照護互動走查</text>
  <!-- Pill 標籤 -->
  <rect x="142" y="381" width="144" height="36" rx="18" fill="#fef3c7"/>
  <text x="214" y="405" text-anchor="middle" font-size="16" fill="#d97706" font-weight="600">現場查核</text>

  <!-- Card 1：文件檢閱（cx=400, x=315, #78716c）-->
  <rect x="315" y="108" width="170" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="315" y="108" width="170" height="8" rx="4" fill="#78716c"/>
  <rect x="315" y="112" width="170" height="4" fill="#78716c"/>
  <!-- STEP 圓圈 cy=194 -->
  <circle cx="400" cy="194" r="43" fill="#f5f5f4"/>
  <text x="400" y="183" text-anchor="middle" font-size="16" fill="#78716c" font-weight="700">STEP</text>
  <text x="400" y="211" text-anchor="middle" font-size="26" fill="#78716c" font-weight="700">02</text>
  <!-- H 標題 -->
  <text x="400" y="298" text-anchor="middle" font-size="28" fill="#1e293b" font-weight="700">文件檢閱</text>
  <!-- J1 說明 1 -->
  <text x="400" y="326" text-anchor="middle" font-size="18" fill="#57534e">各式紀錄表格</text>
  <!-- J2 說明 2 -->
  <text x="400" y="348" text-anchor="middle" font-size="18" fill="#57534e">訓練記錄審查</text>
  <!-- Pill 標籤 -->
  <rect x="328" y="381" width="144" height="36" rx="18" fill="#f5f5f4"/>
  <text x="400" y="405" text-anchor="middle" font-size="16" fill="#78716c" font-weight="600">書面查核</text>

  <!-- Card 2：人員訪談（cx=586, x=501, #57534e）-->
  <rect x="501" y="108" width="170" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="501" y="108" width="170" height="8" rx="4" fill="#57534e"/>
  <rect x="501" y="112" width="170" height="4" fill="#57534e"/>
  <!-- STEP 圓圈 cy=194 -->
  <circle cx="586" cy="194" r="43" fill="#f5f0eb"/>
  <text x="586" y="183" text-anchor="middle" font-size="16" fill="#57534e" font-weight="700">STEP</text>
  <text x="586" y="211" text-anchor="middle" font-size="26" fill="#57534e" font-weight="700">03</text>
  <!-- H 標題 -->
  <text x="586" y="298" text-anchor="middle" font-size="28" fill="#1e293b" font-weight="700">人員訪談</text>
  <!-- J1 說明 1 -->
  <text x="586" y="326" text-anchor="middle" font-size="18" fill="#57534e">訪問負責人與</text>
  <!-- J2 說明 2 -->
  <text x="586" y="348" text-anchor="middle" font-size="18" fill="#57534e">托育人員問答</text>
  <!-- Pill 標籤 -->
  <rect x="514" y="381" width="144" height="36" rx="18" fill="#f5f0eb"/>
  <text x="586" y="405" text-anchor="middle" font-size="16" fill="#57534e" font-weight="600">口頭查核</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
