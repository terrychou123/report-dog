<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 右側裝飾區塊 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>

  <!-- 右側裝飾大字「B2」 -->
  <text x="1010" y="245" font-size="180" font-weight="900" fill="#d97706" text-anchor="middle" opacity="0.85">B2</text>
  <text x="1010" y="284" font-size="26" fill="#78716c" text-anchor="middle" font-weight="600">跨專業整合評鑑基準</text>

  <!-- 右側 4 項要求卡片（y=305~520，每個 h=46，間距 12） -->
  <rect x="840" y="305" width="320" height="46" rx="8" fill="#d97706" opacity="0.15"/>
  <text x="1000" y="334" font-size="24" fill="#d97706" text-anchor="middle" font-weight="700">每 3 個月跨專業照護會議</text>

  <rect x="840" y="361" width="320" height="46" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="1000" y="390" font-size="24" fill="#78716c" text-anchor="middle" font-weight="700">住民及家屬參與討論</text>

  <rect x="840" y="417" width="320" height="46" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="1000" y="446" font-size="24" fill="#57534e" text-anchor="middle" font-weight="700">整合醫護復健營養服務</text>

  <rect x="840" y="473" width="320" height="46" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="1000" y="502" font-size="24" fill="#1e293b" text-anchor="middle" font-weight="700">定期 ADL 認知功能評估</text>

  <!-- 左側主內容區 -->
  <text x="60" y="195" font-size="110" font-weight="900" fill="#1e293b">跨專業</text>
  <text x="60" y="330" font-size="110" font-weight="900" fill="#d97706">照護會議</text>

  <!-- 分隔線 -->
  <line x1="60" y1="358" x2="780" y2="358" stroke="#dedad3" stroke-width="2"/>

  <!-- 副標題 -->
  <text x="60" y="408" font-size="38" fill="#57534e" font-weight="400">從湊人數到真正整合的實務指南</text>

  <!-- 特色標籤列 -->
  <rect x="60" y="444" width="150" height="52" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="135" y="476" font-size="26" fill="#d97706" text-anchor="middle" font-weight="600">評鑑準備</text>

  <rect x="224" y="444" width="140" height="52" rx="10" fill="#78716c" opacity="0.12"/>
  <text x="294" y="476" font-size="26" fill="#78716c" text-anchor="middle" font-weight="600">B2 基準</text>

  <rect x="378" y="444" width="150" height="52" rx="10" fill="#57534e" opacity="0.12"/>
  <text x="453" y="476" font-size="26" fill="#57534e" text-anchor="middle" font-weight="600">115 年度</text>

  <!-- 適用對象說明 -->
  <text x="60" y="558" font-size="28" fill="#94a3b8">適用：護理長、社工師、跨專業團隊成員</text>

  <!-- 浮水印 -->
  <text x="1140" y="590" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
