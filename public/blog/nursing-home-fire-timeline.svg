<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- 標題 -->
  <text x="400" y="48" font-size="32" fill="#1e293b" text-anchor="middle" font-weight="700">年度消防安全計畫時程</text>
  <text x="400" y="78" font-size="22" fill="#78716c" text-anchor="middle">12 個月滾動執行 · C9/C11 雙線並行</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#d97706" stroke-width="2"/>

  <!-- 時間軸主線 -->
  <line x1="60" y1="200" x2="740" y2="200" stroke="#a8a29e" stroke-width="3"/>

  <!-- Q1：1-3月 -->
  <circle cx="120" cy="200" r="14" fill="#d97706"/>
  <text x="120" y="205" font-size="12" fill="white" text-anchor="middle" font-weight="700">Q1</text>
  <rect x="60" y="215" width="120" height="80" rx="8" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="120" y="234" font-size="13" fill="#d97706" text-anchor="middle" font-weight="700">1-3 月</text>
  <text x="120" y="252" font-size="12" fill="#57534e" text-anchor="middle">訂定年度</text>
  <text x="120" y="268" font-size="12" fill="#57534e" text-anchor="middle">EOP 計畫</text>
  <text x="120" y="284" font-size="12" fill="#78716c" text-anchor="middle">月檢查×3</text>

  <!-- Q2：4-6月 -->
  <circle cx="300" cy="200" r="14" fill="#78716c"/>
  <text x="300" y="205" font-size="12" fill="white" text-anchor="middle" font-weight="700">Q2</text>
  <rect x="240" y="215" width="120" height="80" rx="8" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="300" y="234" font-size="13" fill="#78716c" text-anchor="middle" font-weight="700">4-6 月</text>
  <text x="300" y="252" font-size="12" fill="#57534e" text-anchor="middle">第 1 次演練</text>
  <text x="300" y="268" font-size="12" fill="#57534e" text-anchor="middle">（白天）</text>
  <text x="300" y="284" font-size="12" fill="#78716c" text-anchor="middle">消防師檢修①</text>

  <!-- Q3：7-9月 -->
  <circle cx="480" cy="200" r="14" fill="#d97706"/>
  <text x="480" y="205" font-size="12" fill="white" text-anchor="middle" font-weight="700">Q3</text>
  <!-- 上方卡片 -->
  <rect x="420" y="100" width="120" height="80" rx="8" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <line x1="480" y1="180" x2="480" y2="200" stroke="#d97706" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="480" y="119" font-size="13" fill="#d97706" text-anchor="middle" font-weight="700">7-9 月</text>
  <text x="480" y="137" font-size="12" fill="#57534e" text-anchor="middle">夜間複合型</text>
  <text x="480" y="153" font-size="12" fill="#57534e" text-anchor="middle">演練（必辦）</text>
  <text x="480" y="169" font-size="12" fill="#78716c" text-anchor="middle">月檢查×3</text>

  <!-- Q4：10-12月 -->
  <circle cx="660" cy="200" r="14" fill="#57534e"/>
  <text x="660" y="205" font-size="12" fill="white" text-anchor="middle" font-weight="700">Q4</text>
  <rect x="600" y="215" width="120" height="80" rx="8" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="660" y="234" font-size="13" fill="#57534e" text-anchor="middle" font-weight="700">10-12 月</text>
  <text x="660" y="252" font-size="12" fill="#57534e" text-anchor="middle">消防師檢修②</text>
  <text x="660" y="268" font-size="12" fill="#57534e" text-anchor="middle">年度總檢討</text>
  <text x="660" y="284" font-size="12" fill="#78716c" text-anchor="middle">次年計畫草擬</text>

  <!-- 連接線裝飾 -->
  <line x1="134" y1="200" x2="286" y2="200" stroke="#a8a29e" stroke-width="2" stroke-dasharray="6,3"/>
  <line x1="314" y1="200" x2="466" y2="200" stroke="#a8a29e" stroke-width="2" stroke-dasharray="6,3"/>
  <line x1="494" y1="200" x2="646" y2="200" stroke="#a8a29e" stroke-width="2" stroke-dasharray="6,3"/>

  <!-- 月度標籤：每月用電檢查 -->
  <rect x="60" y="320" width="680" height="50" rx="10" fill="white" stroke="#d97706" stroke-width="1.5"/>
  <rect x="60" y="320" width="6" height="50" rx="3" fill="#d97706"/>
  <text x="400" y="343" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="600">每月固定任務：用電安全自主檢查</text>
  <text x="400" y="361" font-size="13" fill="#78716c" text-anchor="middle">1月～12月，每月執行一次，書面留存，不得回溯補填</text>

  <!-- 底部說明 -->
  <text x="400" y="410" font-size="13" fill="#78716c" text-anchor="middle">每半年消防師檢修：建議 5-6 月完成第①次，10-11 月完成第②次，確保年末評鑑有 2 份報告</text>

  <!-- 水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
