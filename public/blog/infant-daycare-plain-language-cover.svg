<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>

  <!-- 右側裝飾數字 -->
  <text x="1010" y="250" font-size="160" font-weight="900" fill="#d97706" text-anchor="middle" opacity="0.85">10</text>
  <text x="1010" y="295" font-size="26" fill="#78716c" text-anchor="middle" font-weight="600">個抽象指標白話解讀</text>
  <line x1="840" y1="315" x2="1180" y2="315" stroke="#dedad3" stroke-width="1"/>

  <!-- 右側卡片 -->
  <rect x="840" y="326" width="320" height="70" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="1000" y="350" font-size="28" fill="#d97706" text-anchor="middle" font-weight="700">官方術語</text>
  <text x="1000" y="382" font-size="22" fill="#a8a29e" text-anchor="middle">→ 白話說明</text>

  <rect x="840" y="404" width="320" height="70" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="1000" y="428" font-size="28" fill="#78716c" text-anchor="middle" font-weight="700">查核方式</text>
  <text x="1000" y="460" font-size="22" fill="#a8a29e" text-anchor="middle">委員怎麼看</text>

  <rect x="840" y="482" width="320" height="70" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="1000" y="506" font-size="28" fill="#57534e" text-anchor="middle" font-weight="700">準備要點</text>
  <text x="1000" y="538" font-size="22" fill="#a8a29e" text-anchor="middle">具體行動說明</text>

  <!-- 左側主內容 -->
  <text x="60" y="196" font-size="100" font-weight="900" fill="#1e293b">指標看不懂</text>
  <text x="60" y="326" font-size="80" font-weight="900" fill="#d97706">白話翻譯</text>
  <line x1="60" y1="356" x2="780" y2="356" stroke="#dedad3" stroke-width="2"/>
  <text x="60" y="404" font-size="34" fill="#57534e">10 個最抽象指標 × 白話說明 × 準備要點</text>

  <rect x="60" y="430" width="160" height="54" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="140" y="463" font-size="26" fill="#d97706" text-anchor="middle" font-weight="600">白話解讀</text>

  <rect x="232" y="430" width="160" height="54" rx="10" fill="#78716c" opacity="0.12"/>
  <text x="312" y="463" font-size="26" fill="#78716c" text-anchor="middle" font-weight="600">委員視角</text>

  <rect x="404" y="430" width="160" height="54" rx="10" fill="#57534e" opacity="0.12"/>
  <text x="484" y="463" font-size="26" fill="#57534e" text-anchor="middle" font-weight="600">準備行動</text>

  <text x="60" y="556" font-size="26" fill="#94a3b8">適用：托嬰中心負責人・行政人員・托育人員</text>
  <text x="1140" y="590" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
