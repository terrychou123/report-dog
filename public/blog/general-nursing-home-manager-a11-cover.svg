<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 頂部深藍條 -->
  <rect width="1200" height="8" fill="#1e3a5f"/>
  <!-- 左側裝飾線 -->
  <rect x="60" y="40" width="6" height="550" fill="#d97706" rx="2"/>

  <!-- 大標題區 -->
  <text x="100" y="120" font-size="28" fill="#1e3a5f" font-weight="bold">A1.1 評鑑基準</text>
  <text x="100" y="200" font-size="72" fill="#1e3a5f" font-weight="900">負責人</text>
  <text x="100" y="280" font-size="72" fill="#d97706" font-weight="900">管理查核</text>
  <text x="100" y="340" font-size="26" fill="#78716c">查核紀錄・照護比・在職訓練計畫</text>
  <text x="100" y="390" font-size="26" fill="#a8a29e">115 年度一般護理之家評鑑</text>

  <!-- 四張要求卡片 -->
  <rect x="100" y="430" width="200" height="110" fill="#dbeafe" rx="10" stroke="#1d4ed8" stroke-width="2"/>
  <text x="200" y="465" font-size="24" fill="#1e40af" font-weight="bold" text-anchor="middle">每月查核</text>
  <text x="200" y="488" font-size="20" fill="#1e3a5f" text-anchor="middle">至少1次到機構</text>
  <text x="200" y="508" font-size="20" fill="#1e3a5f" text-anchor="middle">留書面紀錄</text>
  <text x="200" y="528" font-size="20" fill="#3b82f6" text-anchor="middle">✓ 書面記錄</text>

  <rect x="320" y="430" width="200" height="110" fill="#dcfce7" rx="10" stroke="#16a34a" stroke-width="2"/>
  <text x="420" y="465" font-size="24" fill="#15803d" font-weight="bold" text-anchor="middle">護理執照</text>
  <text x="420" y="488" font-size="20" fill="#166534" text-anchor="middle">有效執照執業</text>
  <text x="420" y="508" font-size="20" fill="#166534" text-anchor="middle">執業機構相符</text>
  <text x="420" y="528" font-size="20" fill="#16a34a" text-anchor="middle">✓ 資料查核</text>

  <rect x="540" y="430" width="200" height="110" fill="#fef3c7" rx="10" stroke="#d97706" stroke-width="2"/>
  <text x="640" y="465" font-size="24" fill="#92400e" font-weight="bold" text-anchor="middle">照護比例</text>
  <text x="640" y="488" font-size="20" fill="#92400e" text-anchor="middle">日班 ≤ 9人</text>
  <text x="640" y="508" font-size="20" fill="#92400e" text-anchor="middle">夜班 ≤ 15人</text>
  <text x="640" y="528" font-size="20" fill="#d97706" text-anchor="middle">✓ 排班記錄</text>

  <rect x="760" y="430" width="200" height="110" fill="#f3e8ff" rx="10" stroke="#7c3aed" stroke-width="2"/>
  <text x="860" y="465" font-size="24" fill="#6d28d9" font-weight="bold" text-anchor="middle">在職訓練</text>
  <text x="860" y="488" font-size="20" fill="#6d28d9" text-anchor="middle">每年≥ 16小時</text>
  <text x="860" y="508" font-size="20" fill="#6d28d9" text-anchor="middle">計畫並執行</text>
  <text x="860" y="528" font-size="20" fill="#7c3aed" text-anchor="middle">✓ 訓練計畫</text>

  <!-- 右側視覺裝飾 -->
  <circle cx="1020" cy="220" r="130" fill="#dbeafe"/>
  <circle cx="1020" cy="220" r="90" fill="#bfdbfe"/>
  <text x="1020" y="185" font-size="44" fill="#1e3a5f" font-weight="900" text-anchor="middle">A1.1</text>
  <text x="1020" y="230" font-size="18" fill="#1e40af" text-anchor="middle">負責人</text>
  <text x="1020" y="255" font-size="18" fill="#1e40af" text-anchor="middle">管理基準</text>

  <!-- 浮水印 -->
  <text x="1140" y="590" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
