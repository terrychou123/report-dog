  <circle cx="66" cy="417" r="20" fill="#57534e" opacity="0.15"/>
  <text x="66" y="423" font-size="18" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <text x="100" y="416" font-size="28" fill="#1e293b" font-weight="700">結案個案記錄不完整</text>
  <text x="100" y="440" font-size="18" fill="#57534e">缺少結案原因、結案前評估、照護目標是否達成的說明</text>
