  <text x="100" y="210" font-size="28" fill="#1e293b" font-weight="700">照護計畫千篇一律</text>
  <text x="100" y="234" font-size="18" fill="#57534e">所有個案護理問題相同，看不出個別差異，委員一翻就發現</text>
  <rect x="620" y="185" width="136" height="52" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="205" font-size="16" fill="#d97706" text-anchor="middle">個別</text>
  <text x="688" y="225" font-size="16" fill="#d97706" text-anchor="middle">化</text>
  <rect x="28" y="269" width="744" height="90" rx="12" fill="#e8e6de"/>
  <rect x="28" y="269" width="6" height="90" rx="2" fill="#78716c"/>
  <circle cx="66" cy="314" r="20" fill="#78716c" opacity="0.15"/>
  <text x="66" y="320" font-size="18" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <text x="100" y="313" font-size="28" fill="#1e293b" font-weight="700">需求改變後未重新評估</text>
  <text x="100" y="337" font-size="18" fill="#57534e">出院返家或新增管路後，未補充重新評估的觸發說明</text>
  <rect x="620" y="288" width="136" height="52" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="308" font-size="16" fill="#78716c" text-anchor="middle">觸發</text>
  <text x="688" y="328" font-size="16" fill="#78716c" text-anchor="middle">說明</text>
  <rect x="28" y="372" width="744" height="90" rx="12" fill="#e8e6de"/>
