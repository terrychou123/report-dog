<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460">
  <defs>
    <filter id="center-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#94a3b8" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- 背景：米黃暖色 -->
  <rect width="800" height="460" fill="#f0efe8"/>

  <!-- 標題 -->
  <text x="400" y="36" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="20" fill="#1e293b" font-weight="700">PDCA 持續改善循環</text>
  <text x="400" y="56" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#64748b">Continuous Improvement Process · 評鑑品質提升框架</text>

  <!-- PDCA 弧段：Plan（藍）-80° to 5° -->
  <path d="M 422 107 A 125 125 0 0 1 525 241 L 480 237 A 80 80 0 0 0 414 151 Z" fill="#2563eb"/>
  <polygon points="501,255 494,230 512,248" fill="#2563eb"/>

  <!-- Do（綠）10° to 95° -->
  <path d="M 523 252 A 125 125 0 0 1 389 355 L 393 310 A 80 80 0 0 0 479 244 Z" fill="#16a34a"/>
  <polygon points="375,331 400,324 382,342" fill="#16a34a"/>

  <!-- Check（橘）100° to 185° -->
  <path d="M 378 353 A 125 125 0 0 1 276 219 L 320 223 A 80 80 0 0 0 386 309 Z" fill="#ea580c"/>
  <polygon points="299,205 306,230 290,212" fill="#ea580c"/>

  <!-- Act（紫）190° to 275° -->
  <path d="M 277 208 A 125 125 0 0 1 411 106 L 407 150 A 80 80 0 0 0 321 216 Z" fill="#9333ea"/>
  <polygon points="425,129 400,136 418,120" fill="#9333ea"/>

  <!-- 字母 -->
  <text x="481" y="178" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="26" fill="white" font-weight="700">P</text>
  <text x="462" y="321" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="26" fill="white" font-weight="700">D</text>
  <text x="319" y="302" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="26" fill="white" font-weight="700">C</text>
  <text x="338" y="159" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="26" fill="white" font-weight="700">A</text>

  <!-- 中央白圓 -->
  <circle cx="400" cy="230" r="74" fill="white" filter="url(#center-shadow)"/>
  <text x="400" y="224" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="22" fill="#1e293b" font-weight="700">PDCA</text>
  <text x="400" y="244" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#64748b">Cycle</text>
  <text x="400" y="262" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="10" fill="#94a3b8">持續改善</text>

  <!-- 右上：Plan（藍） -->
  <rect x="556" y="72" width="6" height="18" rx="1" fill="#2563eb"/>
  <text x="568" y="86" font-family="'Noto Sans TC', sans-serif" font-size="15" fill="#1e293b" font-weight="700">計劃 Plan</text>
  <line x1="556" y1="96" x2="700" y2="96" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="556" y="112" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#475569">設定明確的改善目標</text>
  <text x="556" y="130" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#475569">制定具體行動方案</text>

  <!-- 右下：Do（綠） -->
  <rect x="556" y="300" width="6" height="18" rx="1" fill="#16a34a"/>
  <text x="568" y="314" font-family="'Noto Sans TC', sans-serif" font-size="15" fill="#1e293b" font-weight="700">執行 Do</text>
  <line x1="556" y1="324" x2="700" y2="324" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="556" y="340" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#475569">依計劃執行各項任務</text>
  <text x="556" y="358" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#475569">收集過程中的數據</text>

  <!-- 左下：Check（橘） -->
  <rect x="100" y="300" width="6" height="18" rx="1" fill="#ea580c"/>
  <text x="112" y="314" font-family="'Noto Sans TC', sans-serif" font-size="15" fill="#1e293b" font-weight="700">查核 Check</text>
  <line x1="100" y1="324" x2="244" y2="324" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="100" y="340" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#475569">評估執行結果成效</text>
  <text x="100" y="358" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#475569">找出差異與問題點</text>

  <!-- 左上：Act（紫） -->
  <rect x="100" y="72" width="6" height="18" rx="1" fill="#9333ea"/>
  <text x="112" y="86" font-family="'Noto Sans TC', sans-serif" font-size="15" fill="#1e293b" font-weight="700">行動 Act</text>
  <line x1="100" y1="96" x2="244" y2="96" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="100" y="112" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#475569">落實改善措施</text>
  <text x="100" y="130" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#475569">納入下一輪計劃基礎</text>

  <!-- 浮水印 -->
  <text x="756" y="450" text-anchor="end" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#c4bfb8">報告汪 reportwang.com</text>
</svg>
