<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- 標題列 -->
  <rect x="0" y="5" width="800" height="52" fill="#e8e6de"/>
  <rect x="0" y="5" width="6" height="52" rx="2" fill="#d97706"/>
  <text x="28" y="40" font-size="26" fill="#1e293b" font-weight="700">A2.3 品質指標 6 項總覽：計算方式與數據來源</text>
  <!-- 6 rows, H=72, y start ~70 -->
  <!-- Row 1 -->
  <rect x="28" y="68" width="744" height="68" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="68" width="6" height="68" rx="2" fill="#d97706"/>
  <circle cx="62" cy="102" r="14" fill="#d97706" opacity="0.15"/>
  <text x="62" y="107" font-size="14" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <text x="90" y="97" font-size="18" fill="#1e293b" font-weight="700">嬰兒紅臀（尿布疹）發生率</text>
  <text x="90" y="118" font-size="14" fill="#57534e">本季發生紅臀嬰兒數 ÷ 本季在院嬰兒總數 × 100%</text>
  <rect x="596" y="76" width="160" height="52" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="676" y="98" font-size="14" fill="#d97706" text-anchor="middle">每日嬰兒</text>
  <text x="676" y="118" font-size="14" fill="#d97706" text-anchor="middle">照護記錄</text>
  <!-- Row 2 -->
  <rect x="28" y="143" width="744" height="68" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="143" width="6" height="68" rx="2" fill="#78716c"/>
  <circle cx="62" cy="177" r="14" fill="#78716c" opacity="0.15"/>
  <text x="62" y="182" font-size="14" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <text x="90" y="172" font-size="18" fill="#1e293b" font-weight="700">產婦乳腺炎發生率</text>
  <text x="90" y="193" font-size="14" fill="#57534e">本季發生乳腺炎產婦數 ÷ 本季在院產婦總數 × 100%</text>
  <rect x="596" y="151" width="160" height="52" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="676" y="173" font-size="14" fill="#78716c" text-anchor="middle">護理紀錄</text>
  <text x="676" y="193" font-size="14" fill="#78716c" text-anchor="middle">乳房護理記錄</text>
  <!-- Row 3 -->
  <rect x="28" y="218" width="744" height="68" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="218" width="6" height="68" rx="2" fill="#57534e"/>
  <circle cx="62" cy="252" r="14" fill="#57534e" opacity="0.15"/>
  <text x="62" y="257" font-size="14" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <text x="90" y="247" font-size="18" fill="#1e293b" font-weight="700">純母乳哺育率</text>
  <text x="90" y="268" font-size="14" fill="#57534e">出院時純母乳哺育產婦數 ÷ 本季出院產婦總數 × 100%</text>
  <rect x="596" y="226" width="160" height="52" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="676" y="248" font-size="14" fill="#57534e" text-anchor="middle">出院評估表</text>
  <text x="676" y="268" font-size="14" fill="#57534e" text-anchor="middle">哺乳計畫記錄</text>
  <!-- Row 4 -->
  <rect x="28" y="293" width="744" height="68" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="293" width="6" height="68" rx="2" fill="#a8a29e"/>
  <circle cx="62" cy="327" r="14" fill="#a8a29e" opacity="0.15"/>
  <text x="62" y="332" font-size="14" fill="#a8a29e" text-anchor="middle" font-weight="900">4</text>
  <text x="90" y="322" font-size="18" fill="#1e293b" font-weight="700">嬰兒體重回升達出生體重比率</text>
  <text x="90" y="343" font-size="14" fill="#57534e">出院前體重已回升嬰兒數 ÷ 本季出院嬰兒總數 × 100%</text>
  <rect x="596" y="301" width="160" height="52" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="676" y="323" font-size="14" fill="#a8a29e" text-anchor="middle">嬰兒體重</text>
  <text x="676" y="343" font-size="14" fill="#a8a29e" text-anchor="middle">監測記錄</text>
  <!-- Row 5 -->
  <rect x="28" y="368" width="744" height="68" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="368" width="6" height="68" rx="2" fill="#94a3b8"/>
  <circle cx="62" cy="402" r="14" fill="#94a3b8" opacity="0.15"/>
  <text x="62" y="407" font-size="14" fill="#94a3b8" text-anchor="middle" font-weight="900">5</text>
  <text x="90" y="397" font-size="18" fill="#1e293b" font-weight="700">嬰兒黃疸（需照光）發生率</text>
  <text x="90" y="418" font-size="14" fill="#57534e">本季需照光嬰兒數 ÷ 本季在院嬰兒總數 × 100%</text>
  <rect x="596" y="376" width="160" height="52" rx="8" fill="#94a3b8" opacity="0.12"/>
  <text x="676" y="398" font-size="14" fill="#94a3b8" text-anchor="middle">黃疸評估</text>
  <text x="676" y="418" font-size="14" fill="#94a3b8" text-anchor="middle">照光治療記錄</text>
  <!-- Row 6 — compact, no sub-row, just at bottom -->
  <rect x="28" y="443" width="744" height="42" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="443" width="6" height="42" rx="2" fill="#6b7280"/>
  <circle cx="62" cy="464" r="14" fill="#6b7280" opacity="0.15"/>
  <text x="62" y="469" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="900">6</text>
  <text x="90" y="460" font-size="18" fill="#1e293b" font-weight="700">服務對象（產婦）滿意度</text>
  <text x="90" y="459" font-size="16" fill="#57534e">滿意度調查平均分數，數據來源：出院滿意度問卷</text>
  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
