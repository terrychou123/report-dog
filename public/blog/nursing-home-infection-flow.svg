<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- 標題 -->
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">感染事件處理標準流程</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">B17 逐案分析 4 步驟</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- 步驟1 -->
  <rect x="28" y="140" width="174" height="220" rx="10" fill="#fff" stroke="#e5e3dc" stroke-width="1"/>
  <circle cx="115" cy="170" r="22" fill="#d97706" opacity="0.15"/>
  <text x="115" y="177" text-anchor="middle" font-size="22" fill="#fff" font-weight="700">1</text>
  <text x="115" y="218" text-anchor="middle" font-size="16" fill="#1e293b" font-weight="700">發現疑似感染</text>
  <text x="115" y="244" text-anchor="middle" font-size="14" fill="#57534e">症狀觀察</text>
  <text x="115" y="264" text-anchor="middle" font-size="14" fill="#57534e">體溫測量</text>
  <text x="115" y="284" text-anchor="middle" font-size="14" fill="#57534e">疑似病例通知</text>
  <text x="115" y="304" text-anchor="middle" font-size="14" fill="#57534e">護理人員評估</text>
  <text x="115" y="340" text-anchor="middle" font-size="14" fill="#d97706" font-weight="600">及時啟動機制</text>

  <!-- 箭頭 1→2 -->
  <polygon points="210,245 228,237 228,253" fill="#d97706"/>
  <line x1="202" y1="245" x2="228" y2="245" stroke="#d97706" stroke-width="2"/>

  <!-- 步驟2 -->
  <rect x="218" y="140" width="174" height="220" rx="10" fill="#fff" stroke="#e5e3dc" stroke-width="1"/>
  <circle cx="305" cy="170" r="22" fill="#78716c" opacity="0.15"/>
  <text x="305" y="177" text-anchor="middle" font-size="22" fill="#fff" font-weight="700">2</text>
  <text x="305" y="218" text-anchor="middle" font-size="16" fill="#1e293b" font-weight="700">隔離與通報</text>
  <text x="305" y="244" text-anchor="middle" font-size="14" fill="#57534e">啟動隔離措施</text>
  <text x="305" y="264" text-anchor="middle" font-size="14" fill="#57534e">依規定通報衛生機關</text>
  <text x="305" y="284" text-anchor="middle" font-size="14" fill="#57534e">通知家屬</text>
  <text x="305" y="304" text-anchor="middle" font-size="14" fill="#57534e">接觸者追蹤</text>
  <text x="305" y="340" text-anchor="middle" font-size="14" fill="#78716c" font-weight="600">記錄所有接觸者</text>

  <!-- 箭頭 2→3 -->
  <polygon points="400,245 418,237 418,253" fill="#d97706"/>
  <line x1="392" y1="245" x2="418" y2="245" stroke="#d97706" stroke-width="2"/>

  <!-- 步驟3 -->
  <rect x="408" y="140" width="174" height="220" rx="10" fill="#fff" stroke="#e5e3dc" stroke-width="1"/>
  <circle cx="495" cy="170" r="22" fill="#d97706" opacity="0.15"/>
  <text x="495" y="177" text-anchor="middle" font-size="22" fill="#fff" font-weight="700">3</text>
  <text x="495" y="218" text-anchor="middle" font-size="16" fill="#1e293b" font-weight="700">逐案分析處置</text>
  <text x="495" y="244" text-anchor="middle" font-size="14" fill="#57534e">填寫感染事件表單</text>
  <text x="495" y="264" text-anchor="middle" font-size="14" fill="#57534e">分析感染源與途徑</text>
  <text x="495" y="284" text-anchor="middle" font-size="14" fill="#57534e">擬訂處置方案</text>
  <text x="495" y="304" text-anchor="middle" font-size="14" fill="#57534e">執行感染控制措施</text>
  <text x="495" y="340" text-anchor="middle" font-size="14" fill="#d97706" font-weight="600">完整書面紀錄</text>

  <!-- 箭頭 3→4 -->
  <polygon points="590,245 608,237 608,253" fill="#d97706"/>
  <line x1="582" y1="245" x2="608" y2="245" stroke="#d97706" stroke-width="2"/>

  <!-- 步驟4 -->
  <rect x="598" y="140" width="174" height="220" rx="10" fill="#fff" stroke="#e5e3dc" stroke-width="1"/>
  <circle cx="685" cy="170" r="22" fill="#78716c" opacity="0.15"/>
  <text x="685" y="177" text-anchor="middle" font-size="22" fill="#fff" font-weight="700">4</text>
  <text x="685" y="218" text-anchor="middle" font-size="16" fill="#1e293b" font-weight="700">定期統計分析</text>
  <text x="685" y="244" text-anchor="middle" font-size="14" fill="#57534e">每半年彙整分析</text>
  <text x="685" y="264" text-anchor="middle" font-size="14" fill="#57534e">撰寫分析報告</text>
  <text x="685" y="284" text-anchor="middle" font-size="14" fill="#57534e">檢討防疫作為</text>
  <text x="685" y="304" text-anchor="middle" font-size="14" fill="#57534e">改善標準作業流程</text>
  <text x="685" y="340" text-anchor="middle" font-size="14" fill="#78716c" font-weight="600">至少每半年1次</text>

  <!-- 提示說明 -->
  <rect x="40" y="390" width="720" height="60" rx="8" fill="#fef3c7"/>
  <text x="400" y="418" text-anchor="middle" font-size="15" fill="#d97706" font-weight="700">重要提示：感染案件「逐案」分析是核心要求，每半年統計分析報告需含改善標準作業流程</text>
  <text x="400" y="443" text-anchor="middle" font-size="14" fill="#78716c">B17 要求：疥瘡、呼吸道傳染病、腸道傳染病、不明原因發燒均需納入監測範圍</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
