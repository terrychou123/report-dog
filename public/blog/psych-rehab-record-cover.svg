<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', sans-serif">
  <!-- @template: cover -->
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 右側裝飾區塊 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>
  <!-- 右側三條條號 -->
  <text x="1010" y="160" font-size="100" fill="#d97706" text-anchor="middle" font-weight="700" opacity="0.85">3.2</text>
  <line x1="860" y1="185" x2="1160" y2="185" stroke="#dedad3" stroke-width="1.5"/>
  <text x="1010" y="268" font-size="100" fill="#78716c" text-anchor="middle" font-weight="700" opacity="0.75">3.3</text>
  <line x1="860" y1="293" x2="1160" y2="293" stroke="#dedad3" stroke-width="1.5"/>
  <text x="1010" y="376" font-size="100" fill="#57534e" text-anchor="middle" font-weight="700" opacity="0.70">3.4</text>
  <!-- 連動說明 -->
  <rect x="870" y="410" width="280" height="46" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="1010" y="440" font-size="22" fill="#d97706" text-anchor="middle" font-weight="700">三條相互連動</text>
  <text x="1010" y="490" font-size="18" fill="#57534e" text-anchor="middle">3.2 含 PFM 訪談項目</text>
  <!-- 左側主要內容 -->
  <!-- 類別標籤 -->
  <rect x="60" y="60" width="160" height="38" rx="19" fill="#ea580c" opacity="0.12"/>
  <text x="140" y="85" font-size="18" fill="#ea580c" text-anchor="middle" font-weight="700">服務品質</text>
  <!-- 主標題 -->
  <text x="60" y="185" font-size="80" fill="#1e293b" font-weight="700">收結案標準</text>
  <text x="60" y="278" font-size="80" fill="#d97706" font-weight="700">紀錄管理</text>
  <!-- 分隔線 -->
  <line x1="60" y1="305" x2="760" y2="305" stroke="#dedad3" stroke-width="2"/>
  <!-- 副標題 -->
  <text x="60" y="350" font-size="28" fill="#57534e">收案標準決定誰適合</text>
  <text x="60" y="390" font-size="26" fill="#57534e">紀錄品質決定評鑑當日的勝敗</text>
  <!-- 標籤 Pills -->
  <rect x="60" y="440" width="148" height="36" rx="18" fill="#d97706" opacity="0.12"/>
  <text x="134" y="463" font-size="16" fill="#d97706" text-anchor="middle" font-weight="600">PFM收案標準</text>
  <rect x="222" y="440" width="120" height="36" rx="18" fill="#78716c" opacity="0.12"/>
  <text x="282" y="463" font-size="16" fill="#78716c" text-anchor="middle" font-weight="600">結案標準</text>
  <rect x="356" y="440" width="120" height="36" rx="18" fill="#57534e" opacity="0.12"/>
  <text x="416" y="463" font-size="16" fill="#57534e" text-anchor="middle" font-weight="600">紀錄管理</text>
  <rect x="490" y="440" width="148" height="36" rx="18" fill="#a8a29e" opacity="0.15"/>
  <text x="564" y="463" font-size="16" fill="#78716c" text-anchor="middle" font-weight="600">115年度評鑑</text>
  <!-- 浮水印 -->
  <text x="1140" y="590" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
