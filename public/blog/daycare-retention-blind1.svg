<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="450" fill="#f0efe8"/>
  <text x="400" y="46" font-size="21" font-weight="700" fill="#1e293b" text-anchor="middle">盲點 1：督導機制形同虛設（第 9 條）</text>
  <rect x="60" y="58" width="48" height="3" rx="1.5" fill="#d97706"/>
  <line x1="116" y1="59.5" x2="740" y2="59.5" stroke="#dedad3" stroke-width="1"/>

  <!-- Left: Required by law -->
  <rect x="52" y="82" width="320" height="316" rx="12" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="52" y="82" width="320" height="5" rx="2.5" fill="#d97706"/>
  <text x="212" y="112" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">第 9 條要求（所有人員適用）</text>
  <line x1="68" y1="124" x2="356" y2="124" stroke="#f0ede6" stroke-width="1"/>

  <rect x="68" y="136" width="288" height="50" rx="8" fill="#d97706" opacity="0.08"/>
  <text x="212" y="159" font-size="13" font-weight="700" fill="#d97706" text-anchor="middle">個別督導</text>
  <text x="212" y="177" font-size="12" fill="#92400e" text-anchor="middle">每半年至少 1 次（包含照服員）</text>

  <rect x="68" y="196" width="288" height="50" rx="8" fill="#78716c" opacity="0.08"/>
  <text x="212" y="219" font-size="13" font-weight="700" fill="#78716c" text-anchor="middle">團體督導</text>
  <text x="212" y="237" font-size="12" fill="#78716c" text-anchor="middle">每季至少 1 次</text>

  <line x1="68" y1="258" x2="356" y2="258" stroke="#f0ede6" stroke-width="1"/>
  <text x="72" y="280" font-size="13" font-weight="600" fill="#1e293b">紀錄必備</text>
  <text x="72" y="300" font-size="12" fill="#64748b">→ 日期 + 督導對象</text>
  <text x="72" y="320" font-size="12" fill="#64748b">→ 討論內容重點</text>
  <text x="72" y="340" font-size="12" fill="#64748b">→ 追蹤事項 + 雙方簽名</text>
  <text x="72" y="360" font-size="11" fill="#d97706" font-weight="600">保存至少 7 年</text>

  <!-- Right: What to change -->
  <rect x="406" y="82" width="342" height="316" rx="12" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="406" y="82" width="342" height="5" rx="2.5" fill="#78716c"/>
  <text x="577" y="112" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">打招呼 vs. 真督導</text>
  <line x1="422" y1="124" x2="732" y2="124" stroke="#f0ede6" stroke-width="1"/>

  <rect x="422" y="136" width="300" height="68" rx="8" fill="#ef4444" opacity="0.07"/>
  <text x="440" y="158" font-size="12" fill="#dc2626" font-weight="700">❌ 打招呼式督導</text>
  <text x="440" y="178" font-size="12" fill="#78716c">「最近有什麼問題嗎？」</text>
  <text x="440" y="196" font-size="12" fill="#78716c">「還好。」→「好，繼續努力。」</text>

  <rect x="422" y="216" width="300" height="100" rx="8" fill="#d97706" opacity="0.06"/>
  <text x="440" y="238" font-size="12" fill="#d97706" font-weight="700">✓ 有意義的個督流程</text>
  <text x="440" y="258" font-size="12" fill="#78716c">① 督導前準備工作紀錄</text>
  <text x="440" y="278" font-size="12" fill="#78716c">② 帶著具體個案或困難來談</text>
  <text x="440" y="296" font-size="12" fill="#78716c">③ 督導後書面追蹤行動</text>

  <line x1="422" y1="328" x2="732" y2="328" stroke="#f0ede6" stroke-width="1"/>
  <rect x="422" y="338" width="300" height="40" rx="8" fill="#f8f7f2"/>
  <text x="440" y="356" font-size="12" fill="#78716c">員工「被聽見」= 留人的關鍵</text>
  <text x="440" y="374" font-size="11" fill="#d97706">「之前沒說，是因為沒人問。」</text>

  <text x="760" y="421" font-size="16" fill="#c4bfb8" text-anchor="end" font-weight="400" font-family="'Noto Sans TC', sans-serif">報告汪 reportwang.com</text>
</svg>
