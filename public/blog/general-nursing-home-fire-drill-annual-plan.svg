<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">年度消防演練規劃建議</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">每年 2 次，含夜間演練 1 次（C1 評鑑基準）</text>
  <line x1="28" y1="94" x2="772" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- 月份軸背景條 -->
  <rect x="40" y="120" width="720" height="50" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>

  <!-- 月份標籤（1–12月） -->
  <text x="70" y="151" text-anchor="middle" font-size="16" fill="#57534e">1月</text>
  <text x="130" y="151" text-anchor="middle" font-size="16" fill="#57534e">2月</text>
  <text x="190" y="151" text-anchor="middle" font-size="16" fill="#57534e">3月</text>
  <text x="250" y="151" text-anchor="middle" font-size="16" fill="#57534e">4月</text>
  <text x="310" y="151" text-anchor="middle" font-size="16" fill="#57534e">5月</text>
  <text x="370" y="151" text-anchor="middle" font-size="16" fill="#57534e">6月</text>
  <text x="430" y="151" text-anchor="middle" font-size="16" fill="#57534e">7月</text>
  <text x="490" y="151" text-anchor="middle" font-size="16" fill="#57534e">8月</text>
  <text x="550" y="151" text-anchor="middle" font-size="16" fill="#57534e">9月</text>
  <text x="610" y="151" text-anchor="middle" font-size="16" fill="#57534e">10月</text>
  <text x="670" y="151" text-anchor="middle" font-size="16" fill="#57534e">11月</text>
  <text x="730" y="151" text-anchor="middle" font-size="16" fill="#57534e">12月</text>

  <!-- 時間軸橫線 -->
  <line x1="40" y1="220" x2="760" y2="220" stroke="#a8a29e" stroke-width="3"/>
  <polygon points="752,213 760,220 752,227" fill="#a8a29e"/>

  <!-- 第一次演練（5月，x=310）：日間演練 -->
  <!-- 上方卡片 -->
  <rect x="250" y="115" width="120" height="88" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="250" y="115" width="120" height="8" rx="4" fill="#d97706"/>
  <rect x="250" y="119" width="120" height="4" fill="#d97706"/>
  <text x="310" y="148" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="700">第 1 次</text>
  <text x="310" y="168" text-anchor="middle" font-size="15" fill="#57534e">日間演練</text>
  <text x="310" y="186" text-anchor="middle" font-size="15" fill="#57534e">建議 3–6 月</text>
  <!-- 虛線連接 -->
  <line x1="310" y1="203" x2="310" y2="216" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- 圓點 -->
  <circle cx="310" cy="220" r="18" fill="#d97706" opacity="0.15"/>
  <text x="310" y="226" text-anchor="middle" font-size="16" fill="white" font-weight="700">1</text>
  <!-- 下方 Pill 標籤 -->
  <rect x="278" y="242" width="64" height="22" rx="11" fill="#d97706"/>
  <text x="310" y="257" text-anchor="middle" font-size="14" fill="white" font-weight="700">Q1/Q2</text>

  <!-- 第二次演練（11月，x=670）：夜間演練（特別標注） -->
  <!-- 下方卡片 -->
  <!-- Pill 在上方（夜間特別標注） -->
  <rect x="638" y="185" width="64" height="22" rx="11" fill="#dc2626"/>
  <text x="670" y="200" text-anchor="middle" font-size="14" fill="white" font-weight="700">夜間！</text>
  <circle cx="670" cy="220" r="18" fill="#dc2626"/>
  <text x="670" y="226" text-anchor="middle" font-size="16" fill="white" font-weight="700">2</text>
  <!-- 虛線連接 -->
  <line x1="670" y1="240" x2="670" y2="265" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- 下方卡片 -->
  <rect x="610" y="265" width="120" height="100" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="610" y="357" width="120" height="8" rx="4" fill="#dc2626"/>
  <rect x="610" y="353" width="120" height="4" fill="#dc2626"/>
  <text x="670" y="292" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="700">第 2 次</text>
  <text x="670" y="314" text-anchor="middle" font-size="15" fill="#dc2626" font-weight="700">夜間演練</text>
  <text x="670" y="336" text-anchor="middle" font-size="15" fill="#57534e">建議 9–12 月</text>

  <!-- 說明區塊 -->
  <rect x="40" y="390" width="340" height="70" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="40" y="390" width="6" height="70" rx="2" fill="#d97706"/>
  <text x="60" y="415" font-size="16" fill="#1e293b" font-weight="700">日間演練要點</text>
  <text x="60" y="436" font-size="14" fill="#57534e">全體工作人員參與、演練紀錄含疏散時間</text>
  <text x="60" y="452" font-size="14" fill="#57534e">消防隊通報、問題與改善措施記錄</text>

  <rect x="400" y="390" width="360" height="70" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="400" y="390" width="6" height="70" rx="3" fill="#dc2626"/>
  <text x="420" y="415" font-size="16" fill="#1e293b" font-weight="700">夜間演練特別要求</text>
  <text x="420" y="436" font-size="14" fill="#57534e">夜班人力實際執行（不可請白班人員支援）</text>
  <text x="420" y="452" font-size="14" fill="#57534e">記錄夜間特殊狀況與實際疏散時間</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
