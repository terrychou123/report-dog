<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- Header -->
  <rect x="40" y="29" width="720" height="60" rx="8" fill="#d97706"/>
  <text x="400" y="66" font-size="22" fill="white" text-anchor="middle"  font-weight="700">行政管理 11 項指標分類</text>
  <!-- Row 1 -->
  <rect x="40" y="118" width="720" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1.5"/>
  <rect x="40" y="118" width="8" height="60" rx="3" fill="#d97706"/>
  <text x="70" y="143" font-size="14" fill="#d97706"  font-weight="700">指標 1-3</text>
  <text x="160" y="143" font-size="18" fill="#1e293b"  font-weight="700">立案行政</text>
  <text x="160" y="167" font-size="14" fill="#78716c" >立案文件、設施設備、監視器設備保養（指標 1 含體格檢查）</text>
  <!-- Row 2 -->
  <rect x="40" y="191" width="720" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1.5"/>
  <rect x="40" y="191" width="8" height="60" rx="3" fill="#78716c"/>
  <text x="70" y="216" font-size="14" fill="#78716c"  font-weight="700">指標 4-5</text>
  <text x="160" y="216" font-size="18" fill="#1e293b"  font-weight="700">人事管理</text>
  <text x="160" y="240" font-size="14" fill="#78716c" >托育人員資格、在職訓練時數（指標 2：>=18 小時 / 廚工 4 小時）</text>
  <!-- Row 3 -->
  <rect x="40" y="264" width="720" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1.5"/>
  <rect x="40" y="264" width="8" height="60" rx="3" fill="#57534e"/>
  <text x="70" y="289" font-size="14" fill="#57534e"  font-weight="700">指標 6-7</text>
  <text x="160" y="289" font-size="18" fill="#1e293b"  font-weight="700">文書管理</text>
  <text x="160" y="313" font-size="14" fill="#78716c" >托育服務計畫、家長簽約與告知、各式紀錄表單完整歸檔</text>
  <!-- Row 4 -->
  <rect x="40" y="337" width="720" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1.5"/>
  <rect x="40" y="337" width="8" height="60" rx="3" fill="#a8a29e"/>
  <text x="70" y="362" font-size="14" fill="#a8a29e"  font-weight="700">指標 8-10</text>
  <text x="160" y="362" font-size="18" fill="#1e293b"  font-weight="700">財務安全</text>
  <text x="160" y="386" font-size="14" fill="#78716c" >收退費制度、財務管理、消防與公共安全維護</text>
  <!-- Row 5 -->
  <rect x="40" y="410" width="720" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1.5"/>
  <rect x="40" y="410" width="8" height="60" rx="3" fill="#94a3b8"/>
  <text x="70" y="435" font-size="14" fill="#94a3b8"  font-weight="700">指標 11</text>
  <text x="160" y="435" font-size="18" fill="#1e293b"  font-weight="700">兒童權益</text>
  <text x="160" y="459" font-size="14" fill="#78716c" >兒童最佳利益原則、不當管教防制、申訴管道公告</text>
  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" >報告汪 reportwang.com</text>
</svg>
