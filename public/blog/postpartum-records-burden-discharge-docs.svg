<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- 標題列 -->
  <rect x="0" y="29" width="800" height="60" fill="#e8e6de"/>
  <rect x="0" y="29" width="6" height="60" rx="2" fill="#d97706"/>
  <text x="28" y="74" font-size="30" fill="#1e293b" font-weight="700">出院評估整合表結構（技巧 3 ＋ 4）</text>
  <!-- Row 1 - 3 rows, H=90, y: 166/269/372 -->
  <rect x="28" y="166" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="166" width="6" height="90" rx="2" fill="#d97706"/>
  <circle cx="66" cy="211" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="217" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <text x="100" y="200" font-size="20" fill="#1e293b" font-weight="700">哺乳追蹤指標式格式（B1.7）</text>
  <text x="100" y="224" font-size="16" fill="#57534e">哺乳方式勾選（純母乳／混合／配方奶）+ 當日體重 + 24 小時哺乳次數</text>
  <text x="100" y="244" font-size="16" fill="#57534e">異常說明欄：有異常才填，每日 2-3 分鐘完成，連貫性清晰</text>
  <rect x="620" y="178" width="136" height="66" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="203" font-size="16" fill="#d97706" text-anchor="middle">每日指標式</text>
  <text x="688" y="223" font-size="16" fill="#d97706" text-anchor="middle">取代日記式</text>
  <text x="688" y="243" font-size="16" fill="#d97706" text-anchor="middle">記錄</text>
  <!-- Row 2 -->
  <rect x="28" y="269" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="269" width="6" height="90" rx="2" fill="#78716c"/>
  <circle cx="66" cy="314" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="320" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <text x="100" y="303" font-size="20" fill="#1e293b" font-weight="700">出院整合評估表三合一（B1.5）</text>
  <text x="100" y="327" font-size="16" fill="#57534e">第一部分：產婦出院評估（傷口、子宮、乳房、情緒、EPDS 複評）</text>
  <text x="100" y="347" font-size="16" fill="#57534e">第二部分：嬰兒評估 ＋ 第三部分：出院指導＋家屬簽名</text>
  <rect x="620" y="281" width="136" height="66" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="306" font-size="16" fill="#78716c" text-anchor="middle">一張表</text>
  <text x="688" y="326" font-size="16" fill="#78716c" text-anchor="middle">三個評鑑</text>
  <text x="688" y="346" font-size="16" fill="#78716c" text-anchor="middle">需求</text>
  <!-- Row 3 -->
  <rect x="28" y="372" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="372" width="6" height="90" rx="2" fill="#57534e"/>
  <circle cx="66" cy="417" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="423" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <text x="100" y="406" font-size="20" fill="#1e293b" font-weight="700">母乳貯存記錄結構化（B1.8）</text>
  <text x="100" y="430" font-size="16" fill="#57534e">冰箱溫度：交班確認填入，或數位溫度計自動記錄定期列印</text>
  <text x="100" y="450" font-size="16" fill="#57534e">母乳標示：預印標籤貼紙，填入姓名日期時間，避免手寫潦草</text>
  <rect x="620" y="384" width="136" height="66" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="409" font-size="16" fill="#57534e" text-anchor="middle">連續記錄</text>
  <text x="688" y="429" font-size="16" fill="#57534e" text-anchor="middle">不漏填</text>
  <text x="688" y="449" font-size="16" fill="#57534e" text-anchor="middle">是關鍵</text>
  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
