<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1a2744"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0ea5e9"/>
      <stop offset="100%" style="stop-color:#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="420" fill="url(#bg)"/>

  <!-- 裝飾圓圈 -->
  <circle cx="720" cy="80" r="160" fill="rgba(245,158,11,0.06)"/>
  <circle cx="50" cy="400" r="100" fill="rgba(14,165,233,0.05)"/>
  <circle cx="750" cy="350" r="80" fill="rgba(255,255,255,0.03)"/>

  <!-- 頂部標籤 -->
  <rect x="48" y="42" width="90" height="28" rx="14" fill="rgba(245,158,11,0.85)"/>
  <text x="93" y="61" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="white" font-weight="600">評鑑準備</text>
  <rect x="148" y="42" width="90" height="28" rx="14" fill="rgba(255,255,255,0.12)"/>
  <text x="193" y="61" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="rgba(255,255,255,0.85)">主任必讀</text>

  <!-- 主標題 -->
  <text x="48" y="140" font-family="'Noto Sans TC', sans-serif" font-size="58" fill="white" font-weight="700">評鑑前</text>
  <text x="230" y="140" font-family="'Noto Sans TC', sans-serif" font-size="58" fill="#f59e0b" font-weight="700">3 個月</text>

  <!-- 副標題 -->
  <text x="48" y="183" font-family="'Noto Sans TC', sans-serif" font-size="22" fill="rgba(255,255,255,0.75)">主任必備衝刺計畫</text>

  <!-- 分隔線 -->
  <rect x="48" y="203" width="200" height="3" rx="2" fill="url(#accentBar)"/>

  <!-- 說明文字 -->
  <text x="48" y="235" font-family="'Noto Sans TC', sans-serif" font-size="14" fill="rgba(255,255,255,0.55)">從 -3 個月開始，每週有任務、每月有里程碑</text>

  <!-- 時間軸區域 -->
  <!-- 軸線 -->
  <line x1="48" y1="316" x2="760" y2="316" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>

  <!-- -3月 節點 -->
  <circle cx="130" cy="316" r="16" fill="#0ea5e9" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <text x="130" y="321" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="white" font-weight="700">-3</text>
  <rect x="80" y="270" width="100" height="32" rx="8" fill="rgba(14,165,233,0.25)" stroke="rgba(14,165,233,0.4)" stroke-width="1"/>
  <text x="130" y="291" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#7dd3fc">-3 個月</text>
  <!-- 連接線 -->
  <line x1="130" y1="302" x2="130" y2="316" stroke="rgba(14,165,233,0.5)" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- -2月 節點 -->
  <circle cx="310" cy="316" r="16" fill="#0ea5e9" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <text x="310" y="321" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="white" font-weight="700">-2</text>
  <rect x="260" y="270" width="100" height="32" rx="8" fill="rgba(14,165,233,0.25)" stroke="rgba(14,165,233,0.4)" stroke-width="1"/>
  <text x="310" y="291" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#7dd3fc">-2 個月</text>
  <line x1="310" y1="302" x2="310" y2="316" stroke="rgba(14,165,233,0.5)" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- -1月 節點 -->
  <circle cx="490" cy="316" r="16" fill="#f59e0b" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <text x="490" y="321" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="white" font-weight="700">-1</text>
  <rect x="440" y="270" width="100" height="32" rx="8" fill="rgba(245,158,11,0.25)" stroke="rgba(245,158,11,0.4)" stroke-width="1"/>
  <text x="490" y="291" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#fcd34d">-1 個月</text>
  <line x1="490" y1="302" x2="490" y2="316" stroke="rgba(245,158,11,0.5)" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- 評鑑日 節點 -->
  <circle cx="700" cy="316" r="22" fill="#ef4444" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
  <text x="700" y="312" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="9" fill="white" font-weight="700">評鑑</text>
  <text x="700" y="324" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="9" fill="white" font-weight="700">到來</text>
  <rect x="642" y="270" width="116" height="32" rx="8" fill="rgba(239,68,68,0.25)" stroke="rgba(239,68,68,0.5)" stroke-width="1.5"/>
  <text x="700" y="291" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#fca5a5" font-weight="600">評鑑日</text>
  <line x1="700" y1="302" x2="700" y2="294" stroke="rgba(239,68,68,0.5)" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- 底部說明文字 -->
  <text x="130" y="352" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="rgba(255,255,255,0.45)">盤點缺口</text>
  <text x="310" y="352" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="rgba(255,255,255,0.45)">補齊紀錄</text>
  <text x="490" y="352" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="rgba(255,255,255,0.45)">模擬演練</text>
  <text x="700" y="352" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="rgba(255,255,255,0.45)">全力衝刺</text>

  <!-- 品牌 -->
  <rect x="48" y="384" width="70" height="24" rx="6" fill="rgba(255,255,255,0.08)"/>
  <text x="83" y="400" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="rgba(255,255,255,0.55)">報告汪</text>
</svg>
