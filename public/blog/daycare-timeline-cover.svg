<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420">

  <!-- 背景：米黃暖色 -->
  <rect width="800" height="420" fill="#f0efe8"/>

  <!-- 頂部標籤 -->
  <rect x="48" y="42" width="90" height="28" rx="14" fill="#d97706"/>
  <text x="93" y="61" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="white" font-weight="600">評鑑準備</text>
  <rect x="148" y="42" width="90" height="28" rx="14" fill="white" stroke="#dedad3" stroke-width="1"/>
  <text x="193" y="61" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#64748b">主任必讀</text>

  <!-- 主標題 -->
  <text x="48" y="140" font-family="'Noto Sans TC', sans-serif" font-size="58" fill="#1e293b" font-weight="700">評鑑前</text>
  <text x="230" y="140" font-family="'Noto Sans TC', sans-serif" font-size="58" fill="#d97706" font-weight="700">3 個月</text>

  <!-- 副標題 -->
  <text x="48" y="183" font-family="'Noto Sans TC', sans-serif" font-size="22" fill="#64748b">主任必備衝刺計畫</text>

  <!-- 分隔線 -->
  <rect x="48" y="203" width="200" height="3" rx="2" fill="#a8a29e"/>

  <!-- 說明文字 -->
  <text x="48" y="232" font-family="'Noto Sans TC', sans-serif" font-size="14" fill="#94a3b8">從 -3 個月開始，每週有任務、每月有里程碑</text>

  <!-- 時間軸 -->
  <line x1="48" y1="316" x2="760" y2="316" stroke="#d6d3d1" stroke-width="2"/>

  <!-- -3月 節點 -->
  <circle cx="130" cy="316" r="16" fill="white" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="130" cy="316" r="9" fill="#94a3b8"/>
  <text x="130" y="321" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="10" fill="white" font-weight="700">-3</text>
  <rect x="80" y="270" width="100" height="32" rx="8" fill="white" stroke="#dedad3" stroke-width="1"/>
  <text x="130" y="291" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#64748b">-3 個月</text>
  <line x1="130" y1="302" x2="130" y2="316" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- -2月 節點 -->
  <circle cx="310" cy="316" r="16" fill="white" stroke="#a8a29e" stroke-width="2"/>
  <circle cx="310" cy="316" r="9" fill="#a8a29e"/>
  <text x="310" y="321" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="10" fill="white" font-weight="700">-2</text>
  <rect x="260" y="270" width="100" height="32" rx="8" fill="white" stroke="#dedad3" stroke-width="1"/>
  <text x="310" y="291" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#64748b">-2 個月</text>
  <line x1="310" y1="302" x2="310" y2="316" stroke="#a8a29e" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- -1月 節點 -->
  <circle cx="490" cy="316" r="16" fill="white" stroke="#78716c" stroke-width="2"/>
  <circle cx="490" cy="316" r="9" fill="#78716c"/>
  <text x="490" y="321" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="10" fill="white" font-weight="700">-1</text>
  <rect x="440" y="270" width="100" height="32" rx="8" fill="white" stroke="#dedad3" stroke-width="1"/>
  <text x="490" y="291" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#64748b">-1 個月</text>
  <line x1="490" y1="302" x2="490" y2="316" stroke="#78716c" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- 評鑑日 節點 -->
  <circle cx="700" cy="316" r="22" fill="white" stroke="#d97706" stroke-width="2.5"/>
  <circle cx="700" cy="316" r="12" fill="#d97706"/>
  <text x="700" y="311" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="9" fill="white" font-weight="700">評鑑</text>
  <text x="700" y="323" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="9" fill="white" font-weight="700">到來</text>
  <rect x="642" y="270" width="116" height="32" rx="8" fill="white" stroke="#d97706" stroke-width="1.5"/>
  <text x="700" y="291" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#92400e" font-weight="600">評鑑日</text>
  <line x1="700" y1="302" x2="700" y2="294" stroke="#d97706" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- 底部說明文字 -->
  <text x="130" y="352" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#94a3b8">盤點缺口</text>
  <text x="310" y="352" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#94a3b8">補齊紀錄</text>
  <text x="490" y="352" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#94a3b8">模擬演練</text>
  <text x="700" y="352" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#94a3b8">全力衝刺</text>

  <!-- 浮水印 -->
  <text x="756" y="412" text-anchor="end" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#c4bfb8">報告汪 reportwang.com</text>
</svg>
