<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區塊 -->
  <rect x="0" y="0" width="800" height="76" fill="#1e293b"/>
  <text x="400" y="29"  font-size="14" fill="#94a3b8" text-anchor="middle" font-weight="400">115年度老人福利機構評鑑 A7–A11</text>
  <text x="400" y="57"  font-size="22" fill="white" text-anchor="middle" font-weight="700">五大職類人力配置概覽</text>

  <!-- N=5 版型: H=60, outer_gap=29, Row y: 118/191/264/337/410 -->

  <!-- Row 1: A7 業務負責人 -->
  <rect x="29" y="88" width="742" height="60" rx="8" fill="white"/>
  <rect x="29" y="88" width="6" height="60" rx="2" fill="#d97706"/>
  <circle cx="66" cy="118" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="124"  font-size="14" fill="white" text-anchor="middle" font-weight="700">A7</text>
  <text x="100" y="112"  font-size="20" fill="#1e293b" font-weight="700">業務負責人（院長）</text>
  <text x="100" y="134"  font-size="16" fill="#57534e">專任投保勞健保；資格符合老人福利服務專業人員資格訓練辦法；有行政參與佐證</text>
  <rect x="620" y="95" width="136" height="46" rx="8" fill="#fef3c7" opacity="0.12"/>
  <text x="688" y="114"  font-size="14" fill="#d97706" text-anchor="middle" font-weight="600">專任</text>
  <text x="688" y="132"  font-size="14" fill="#d97706" text-anchor="middle">投保勞健保</text>

  <!-- Row 2: A8 社工 -->
  <rect x="29" y="161" width="742" height="60" rx="8" fill="white"/>
  <rect x="29" y="161" width="6" height="60" rx="2" fill="#78716c"/>
  <circle cx="66" cy="191" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="197"  font-size="14" fill="white" text-anchor="middle" font-weight="700">A8</text>
  <text x="100" y="185"  font-size="20" fill="#1e293b" font-weight="700">社會工作人員</text>
  <text x="100" y="207"  font-size="16" fill="#57534e">依床數標準人數設置；兼任需報備+同意書+勞保；檢視近 5 年</text>
  <rect x="620" y="168" width="136" height="46" rx="8" fill="#f5f5f4" opacity="0.12"/>
  <text x="688" y="187"  font-size="14" fill="#57534e" text-anchor="middle" font-weight="600">床數比例</text>
  <text x="688" y="205"  font-size="14" fill="#57534e" text-anchor="middle">5年檢視</text>

  <!-- Row 3: A9 護理 -->
  <rect x="29" y="234" width="742" height="60" rx="8" fill="white"/>
  <rect x="29" y="234" width="6" height="60" rx="2" fill="#57534e"/>
  <circle cx="66" cy="264" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="270"  font-size="14" fill="white" text-anchor="middle" font-weight="700">A9</text>
  <text x="100" y="258"  font-size="20" fill="#1e293b" font-weight="700">護理人員</text>
  <text x="100" y="280"  font-size="16" fill="#57534e">全日24小時均有護理人員；完成執業登錄；近5年無違規聘用</text>
  <rect x="620" y="241" width="136" height="46" rx="8" fill="#fef2f2" opacity="0.12"/>
  <text x="688" y="260"  font-size="14" fill="#dc2626" text-anchor="middle" font-weight="600">24H 排班</text>
  <text x="688" y="278"  font-size="14" fill="#dc2626" text-anchor="middle">高頻扣分</text>

  <!-- Row 4: A10 特約 -->
  <rect x="29" y="307" width="742" height="60" rx="8" fill="white"/>
  <rect x="29" y="307" width="6" height="60" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="337" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="343"  font-size="14" fill="white" text-anchor="middle" font-weight="700">A10</text>
  <text x="100" y="331"  font-size="20" fill="#1e293b" font-weight="700">特約專業人員</text>
  <text x="100" y="353"  font-size="16" fill="#57534e">含營養師、物理/職能治療師（生）、醫師；完成支援報備；有到勤紀錄</text>
  <rect x="620" y="314" width="136" height="46" rx="8" fill="#f5f5f4" opacity="0.12"/>
  <text x="688" y="333"  font-size="14" fill="#57534e" text-anchor="middle" font-weight="600">支援報備</text>
  <text x="688" y="351"  font-size="14" fill="#57534e" text-anchor="middle">到勤紀錄</text>

  <!-- Row 5: A11 照服員 -->
  <rect x="29" y="380" width="742" height="60" rx="8" fill="white"/>
  <rect x="29" y="380" width="6" height="60" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="410" r="16" fill="#94a3b8" opacity="0.15"/>
  <text x="66" y="416"  font-size="14" fill="white" text-anchor="middle" font-weight="700">A11</text>
  <text x="100" y="404"  font-size="20" fill="#1e293b" font-weight="700">照顧服務員</text>
  <text x="100" y="426"  font-size="16" fill="#57534e">外籍不超全數照服員1/2；隨時有本國籍在班；近5年配置檢視</text>
  <rect x="620" y="387" width="136" height="46" rx="8" fill="#fef2f2" opacity="0.12"/>
  <text x="688" y="408"  font-size="14" fill="#dc2626" text-anchor="middle" font-weight="600">外籍&lt;=1/2</text>
  <text x="688" y="422"  font-size="14" fill="#dc2626" text-anchor="middle">高頻超標</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" >報告汪 reportwang.com</text>
</svg>
