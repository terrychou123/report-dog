<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 右側裝飾區塊 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>

  <!-- 右側裝飾大文字 -->
  <text x="1010" y="208" font-size="110" font-weight="900" fill="#d97706" text-anchor="middle" opacity="0.85">B3</text>
  <text x="1010" y="250" font-size="26" fill="#78716c" text-anchor="middle" font-weight="600">評鑑加分項目</text>

  <!-- 右側 5 個加分方向 -->
  <rect x="840" y="268" width="320" height="44" rx="8" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="840" y="268" width="6" height="44" rx="2" fill="#d97706"/>
  <text x="860" y="296" font-size="21" fill="#78716c">創新照護模式（最可行）</text>

  <rect x="840" y="324" width="320" height="44" rx="8" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="840" y="324" width="6" height="44" rx="2" fill="#78716c"/>
  <text x="860" y="352" font-size="21" fill="#78716c">工作人員競賽獲獎</text>

  <rect x="840" y="380" width="320" height="44" rx="8" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="840" y="380" width="6" height="44" rx="2" fill="#57534e"/>
  <text x="860" y="408" font-size="21" fill="#78716c">學術發表（壁報）</text>

  <rect x="840" y="436" width="320" height="44" rx="8" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="840" y="436" width="6" height="44" rx="2" fill="#a8a29e"/>
  <text x="860" y="464" font-size="21" fill="#78716c">國際交流</text>

  <rect x="840" y="492" width="320" height="44" rx="8" fill="#d97706" opacity="0.12"/>
  <rect x="840" y="492" width="6" height="44" rx="2" fill="#94a3b8"/>
  <text x="860" y="520" font-size="21" fill="#d97706" font-weight="600">標竿機構/主管機關表揚</text>

  <!-- 浮水印 -->
  <text x="1140" y="590" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>

  <!-- 左側主內容區 -->
  <text x="60" y="190" font-size="110" font-weight="900" fill="#1e293b">評鑑加分項目</text>
  <text x="60" y="318" font-size="110" font-weight="900" fill="#d97706">B3 可行方向</text>

  <line x1="60" y1="348" x2="780" y2="348" stroke="#dedad3" stroke-width="2"/>

  <text x="60" y="400" font-size="36" fill="#57534e" font-weight="400">5 個加分方向的可行性分析與文件指引</text>

  <!-- 特色標籤列 -->
  <rect x="60" y="434" width="148" height="54" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="134" y="471" font-size="28" fill="#d97706" text-anchor="middle" font-weight="600">加分項目</text>

  <rect x="220" y="434" width="148" height="54" rx="10" fill="#78716c" opacity="0.12"/>
  <text x="294" y="471" font-size="28" fill="#78716c" text-anchor="middle" font-weight="600">B3 基準</text>

  <rect x="380" y="434" width="148" height="54" rx="10" fill="#57534e" opacity="0.12"/>
  <text x="454" y="471" font-size="28" fill="#57534e" text-anchor="middle" font-weight="600">創新照護</text>

  <rect x="540" y="434" width="148" height="54" rx="10" fill="#a8a29e" opacity="0.18"/>
  <text x="614" y="471" font-size="28" fill="#78716c" text-anchor="middle" font-weight="600">115 年度</text>

  <!-- 適用對象 -->
  <text x="60" y="540" font-size="28" fill="#94a3b8">適用對象：目標衝優等的居家護理所負責人</text>
</svg>
