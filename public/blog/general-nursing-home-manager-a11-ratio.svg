<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>
  <rect width="800" height="6" fill="#1e3a5f"/>

  <!-- 標題 -->
  <text x="400" y="45" font-size="22" fill="#1e3a5f" font-weight="bold" text-anchor="middle">護理人員照護比規定與計算（A1.1）</text>

  <!-- 日班卡片 -->
  <rect x="30" y="70" width="360" height="200" fill="white" rx="12" stroke="#1e3a5f" stroke-width="2.5"/>
  <rect x="30" y="70" width="360" height="48" fill="#1e3a5f" rx="12"/>
  <rect x="30" y="100" width="360" height="18" fill="#1e3a5f"/>
  <text x="210" y="101" font-size="18" fill="white" font-weight="bold" text-anchor="middle">日班（07:00–19:00）</text>
  <text x="210" y="158" font-size="52" fill="#1e3a5f" font-weight="900" text-anchor="middle"><= 9</text>
  <text x="210" y="190" font-size="16" fill="#44403c" text-anchor="middle">每位護理師照顧住民數</text>
  <text x="210" y="215" font-size="14" fill="#78716c" text-anchor="middle">（含主護護理師、助理護理師）</text>
  <text x="210" y="240" font-size="14" fill="#d97706" font-weight="bold" text-anchor="middle">住民30人 ÷ 9 = 至少需 4 位護理師</text>
  <text x="210" y="258" font-size="14" fill="#78716c" text-anchor="middle">＊不足人力須加派或調整班次</text>

  <!-- 夜班卡片 -->
  <rect x="410" y="70" width="360" height="200" fill="white" rx="12" stroke="#334155" stroke-width="2.5"/>
  <rect x="410" y="70" width="360" height="48" fill="#334155" rx="12"/>
  <rect x="410" y="100" width="360" height="18" fill="#334155"/>
  <text x="590" y="101" font-size="18" fill="white" font-weight="bold" text-anchor="middle">夜班（19:00–07:00）</text>
  <text x="590" y="158" font-size="52" fill="#334155" font-weight="900" text-anchor="middle"><= 15</text>
  <text x="590" y="190" font-size="16" fill="#44403c" text-anchor="middle">每位護理師照顧住民數</text>
  <text x="590" y="215" font-size="14" fill="#78716c" text-anchor="middle">（含主護護理師、助理護理師）</text>
  <text x="590" y="240" font-size="14" fill="#d97706" font-weight="bold" text-anchor="middle">住民30人 ÷ 15 = 至少需 2 位護理師</text>
  <text x="590" y="258" font-size="14" fill="#78716c" text-anchor="middle">＊每班至少1位正職護理師在場</text>

  <!-- 計算範例表 -->
  <rect x="30" y="290" width="740" height="52" fill="#1e3a5f" rx="8"/>
  <text x="400" y="320" font-size="16" fill="white" font-weight="bold" text-anchor="middle">計算範例：住民總數 45 人的機構</text>

  <!-- 表格 -->
  <rect x="30" y="342" width="370" height="38" fill="#dbeafe"/>
  <rect x="400" y="342" width="370" height="38" fill="#fef3c7"/>
  <line x1="30" y1="342" x2="400" y2="342" stroke="#d1d5db" stroke-width="1"/>
  <line x1="400" y1="342" x2="780" y2="342" stroke="#d1d5db" stroke-width="1"/>
  <text x="215" y="354" font-size="14" fill="#1e40af" font-weight="bold" text-anchor="middle">日班：45 ÷ 9 = 5 位護理師</text>
  <text x="215" y="369" font-size="14" fill="#1e40af" text-anchor="middle">（住民45人，每班需配置至少5人）</text>
  <text x="585" y="354" font-size="14" fill="#92400e" font-weight="bold" text-anchor="middle">夜班：45 ÷ 15 = 3 位護理師</text>
  <text x="585" y="369" font-size="14" fill="#92400e" text-anchor="middle">（住民45人，每班需配置至少3人）</text>

  <!-- 注意事項 -->
  <rect x="30" y="390" width="740" height="70" fill="#fff7ed" rx="8" stroke="#d97706" stroke-width="1.5"/>
  <text x="55" y="412" font-size="14" fill="#92400e" font-weight="bold">(!) 評鑑委員查核重點：</text>
  <text x="55" y="432" font-size="14" fill="#44403c">• 排班表須清楚顯示每班次護理師人數與住民數，以及每人照顧比</text>
  <text x="55" y="450" font-size="14" fill="#44403c">• 若排班記錄與實際人力不符，視為缺失項目（A1.1）</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end">報告汪 reportwang.com</text>
</svg>
