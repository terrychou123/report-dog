<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8" rx="16"/>
  <!-- 標題 -->
  <rect x="0" y="0" width="800" height="64" fill="#2563eb" rx="16"/>
  <rect x="0" y="50" width="800" height="14" fill="#2563eb"/>
  <text x="400" y="40" font-size="22" font-weight="900" text-anchor="middle" fill="#ffffff">住民個別化疏散名冊格式（評鑑委員查核版）</text>
  <!-- 名冊標題區 -->
  <rect x="24" y="78" width="752" height="36" rx="8" fill="#2563eb"/>
  <text x="400" y="101" font-size="14" font-weight="900" text-anchor="middle" fill="#ffffff">護理之家 住民個別化疏散名冊 （最後更新：115年月日 版本：v3 製作人：護理長）</text>
  <!-- 表頭 -->
  <rect x="24" y="118" width="752" height="34" fill="#eff6ff"/>
  <!-- 欄位線 -->
  <line x1="24" y1="118" x2="776" y2="118" stroke="#eff6ff" stroke-width="1"/>
  <line x1="24" y1="152" x2="776" y2="152" stroke="#eff6ff" stroke-width="1"/>
  <!-- 表頭文字 -->
  <text x="52" y="140" font-size="14" font-weight="900" fill="#2563eb">床號</text>
  <text x="100" y="140" font-size="14" font-weight="900" fill="#2563eb">住民姓名</text>
  <text x="180" y="140" font-size="14" font-weight="900" fill="#2563eb">疏散分級</text>
  <text x="270" y="140" font-size="14" font-weight="900" fill="#2563eb">疏散方式</text>
  <text x="370" y="140" font-size="14" font-weight="900" fill="#2563eb">特殊醫療設備</text>
  <text x="510" y="140" font-size="14" font-weight="900" fill="#2563eb">協助人力</text>
  <text x="610" y="140" font-size="14" font-weight="900" fill="#2563eb">指定救援空間</text>
  <!-- 資料行1 -->
  <rect x="24" y="152" width="752" height="40" fill="#ffffff" opacity="0.85"/>
  <line x1="24" y1="192" x2="776" y2="192" stroke="#e2e8f0" stroke-width="1"/>
  <text x="52" y="177" font-size="14" fill="#1e293b">101</text>
  <text x="100" y="177" font-size="14" fill="#1e293b">王</text>
  <rect x="175" y="161" width="70" height="22" rx="11" fill="#f0fdf4"/>
  <text x="210" y="176" font-size="14" text-anchor="middle" fill="#16a34a" font-weight="700">第一級</text>
  <text x="270" y="177" font-size="14" fill="#57534e">步行疏散</text>
  <text x="370" y="177" font-size="14" fill="#78716c">無</text>
  <text x="510" y="177" font-size="14" fill="#57534e">1人引導</text>
  <text x="610" y="177" font-size="14" fill="#57534e">2F 北側走廊</text>
  <!-- 資料行2 -->
  <rect x="24" y="192" width="752" height="40" fill="#fafaf8" opacity="0.85"/>
  <line x1="24" y1="232" x2="776" y2="232" stroke="#e2e8f0" stroke-width="1"/>
  <text x="52" y="217" font-size="14" fill="#1e293b">102</text>
  <text x="100" y="217" font-size="14" fill="#1e293b">李</text>
  <rect x="175" y="201" width="70" height="22" rx="11" fill="#fef3c7"/>
  <text x="210" y="216" font-size="14" text-anchor="middle" fill="#d97706" font-weight="700">第二級</text>
  <text x="270" y="217" font-size="14" fill="#57534e">輪椅疏散</text>
  <text x="370" y="217" font-size="14" fill="#78716c">無</text>
  <text x="510" y="217" font-size="14" fill="#57534e">1人推輪椅</text>
  <text x="610" y="217" font-size="14" fill="#57534e">2F 等待救援區</text>
  <!-- 資料行3 -->
  <rect x="24" y="232" width="752" height="40" fill="#ffffff" opacity="0.85"/>
  <line x1="24" y1="272" x2="776" y2="272" stroke="#e2e8f0" stroke-width="1"/>
  <text x="52" y="257" font-size="14" fill="#1e293b">103</text>
  <text x="100" y="257" font-size="14" fill="#1e293b">陳</text>
  <rect x="175" y="241" width="70" height="22" rx="11" fill="#fee2e2"/>
  <text x="210" y="256" font-size="14" text-anchor="middle" fill="#dc2626" font-weight="700">第三級</text>
  <text x="270" y="257" font-size="14" fill="#57534e">擔架搬運</text>
  <text x="370" y="257" font-size="14" fill="#d97706" font-weight="700">鼻胃管</text>
  <text x="510" y="257" font-size="14" fill="#57534e">需 3 人協助</text>
  <text x="610" y="257" font-size="14" fill="#57534e">2F 等待救援區</text>
  <!-- 資料行4 -->
  <rect x="24" y="272" width="752" height="40" fill="#fafaf8" opacity="0.85"/>
  <line x1="24" y1="312" x2="776" y2="312" stroke="#e2e8f0" stroke-width="1"/>
  <text x="52" y="297" font-size="14" fill="#1e293b">201</text>
  <text x="100" y="297" font-size="14" fill="#1e293b">張</text>
  <rect x="175" y="281" width="70" height="22" rx="11" fill="#fee2e2"/>
  <text x="210" y="296" font-size="14" text-anchor="middle" fill="#dc2626" font-weight="700">第三級</text>
  <text x="270" y="297" font-size="14" fill="#57534e">擔架搬運</text>
  <text x="370" y="297" font-size="14" fill="#d97706" font-weight="700">氣切、氧氣</text>
  <text x="510" y="297" font-size="14" fill="#57534e">需 3 人＋設備</text>
  <text x="610" y="297" font-size="14" fill="#57534e">優先送醫</text>
  <!-- 欄位說明 -->
  <rect x="24" y="322" width="752" height="80" rx="8" fill="#eff6ff" opacity="0.9"/>
  <text x="44" y="344" font-size="14" font-weight="700" fill="#2563eb">疏散分級說明：</text>
  <rect x="44" y="354" width="56" height="20" rx="10" fill="#f0fdf4"/>
  <text x="72" y="368" font-size="14" text-anchor="middle" fill="#16a34a" font-weight="700">第一級</text>
  <text x="110" y="368" font-size="14" fill="#57534e">可自行步行，認知功能正常</text>
  <rect x="310" y="354" width="56" height="20" rx="10" fill="#fef3c7"/>
  <text x="338" y="368" font-size="14" text-anchor="middle" fill="#d97706" font-weight="700">第二級</text>
  <text x="376" y="368" font-size="14" fill="#57534e">需輪椅協助</text>
  <rect x="530" y="354" width="56" height="20" rx="10" fill="#fee2e2"/>
  <text x="558" y="368" font-size="14" text-anchor="middle" fill="#dc2626" font-weight="700">第三級</text>
  <text x="596" y="368" font-size="14" fill="#57534e">需擔架搬運（臥床/特殊設備）</text>
  <text x="44" y="393" font-size="14" fill="#d97706" font-weight="700">(!) 名冊更新：住民狀況改變時立即更新，每季複查一次</text>
  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end">報告汪 reportwang.com</text>
</svg>
