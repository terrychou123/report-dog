<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- @template: custom -->
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- 主標題 -->
  <text x="400" y="40" font-size="22" fill="#1e293b" text-anchor="middle" font-weight="700">日間型與住宿型品質管理條目對照</text>
  <line x1="28" y1="54" x2="772" y2="54" stroke="#dedad3" stroke-width="1"/>

  <!-- 左側：日間型（amber #d97706） -->
  <rect x="28" y="64" width="360" height="400" rx="12" fill="white"/>
  <rect x="28" y="64" width="360" height="8" rx="4" fill="#d97706"/>
  <rect x="28" y="68" width="360" height="4" fill="#d97706"/>
  <rect x="28" y="64" width="6" height="400" rx="2" fill="#d97706"/>
  <text x="208" y="104" font-size="22" fill="#d97706" text-anchor="middle" font-weight="700">日間型 3.10 ＋ 3.11</text>
  <text x="208" y="126" font-size="15" fill="#57534e" text-anchor="middle">品質管理會議 ＋ 滿意度調查</text>

  <!-- Item 1：3.10 品質管理會議 -->
  <circle cx="58" cy="175" r="14" fill="#d97706" opacity="0.12"/>
  <text x="58" y="181" font-size="15" fill="#d97706" text-anchor="middle" font-weight="700">1</text>
  <text x="82" y="171" font-size="16" fill="#1e293b" font-weight="700">3.10 品質管理會議</text>
  <text x="82" y="189" font-size="14" fill="#57534e">每季至少1次，紀錄議題討論與改善決議</text>

  <!-- Item 2：3.11 滿意度調查 -->
  <circle cx="58" cy="250" r="14" fill="#d97706" opacity="0.12"/>
  <text x="58" y="256" font-size="15" fill="#d97706" text-anchor="middle" font-weight="700">2</text>
  <text x="82" y="246" font-size="16" fill="#1e293b" font-weight="700">3.11 滿意度調查</text>
  <text x="82" y="264" font-size="14" fill="#57534e">每年至少1次，學員與家屬均需參與</text>

  <!-- 左底部框 -->
  <rect x="46" y="315" width="322" height="110" rx="8" fill="#fffbeb"/>
  <text x="208" y="340" font-size="15" fill="#d97706" text-anchor="middle" font-weight="700">評鑑委員查核重點</text>
  <text x="208" y="362" font-size="14" fill="#57534e" text-anchor="middle">會議紀錄是否完整記錄議題？</text>
  <text x="208" y="382" font-size="14" fill="#57534e" text-anchor="middle">改善項目是否有追蹤閉環？</text>
  <text x="208" y="402" font-size="14" fill="#57534e" text-anchor="middle">問卷回收率是否合理說明？</text>

  <!-- 右側：住宿型（stone-500 #78716c） -->
  <rect x="412" y="64" width="360" height="400" rx="12" fill="white"/>
  <rect x="412" y="64" width="360" height="8" rx="4" fill="#78716c"/>
  <rect x="412" y="68" width="360" height="4" fill="#78716c"/>
  <rect x="412" y="64" width="6" height="400" rx="2" fill="#78716c"/>
  <text x="592" y="104" font-size="22" fill="#78716c" text-anchor="middle" font-weight="700">住宿型 3.12 ＋ 3.13</text>
  <text x="592" y="126" font-size="15" fill="#57534e" text-anchor="middle">條號順移，基準內容相同</text>

  <!-- Item 1：3.12 品質管理會議 -->
  <circle cx="442" cy="175" r="14" fill="#78716c" opacity="0.12"/>
  <text x="442" y="181" font-size="15" fill="#78716c" text-anchor="middle" font-weight="700">1</text>
  <text x="466" y="171" font-size="16" fill="#1e293b" font-weight="700">3.12 品質管理會議</text>
  <text x="466" y="189" font-size="14" fill="#57534e">與日間型3.10相同，應有住民代表出席</text>

  <!-- Item 2：3.13 滿意度調查 -->
  <circle cx="442" cy="250" r="14" fill="#78716c" opacity="0.12"/>
  <text x="442" y="256" font-size="15" fill="#78716c" text-anchor="middle" font-weight="700">2</text>
  <text x="466" y="246" font-size="16" fill="#1e293b" font-weight="700">3.13 滿意度調查</text>
  <text x="466" y="264" font-size="14" fill="#57534e">與日間型3.11相同，住民與家屬均受訪</text>

  <!-- 右底部框 -->
  <rect x="430" y="315" width="322" height="110" rx="8" fill="#f5f5f4"/>
  <text x="592" y="340" font-size="15" fill="#78716c" text-anchor="middle" font-weight="700">對照說明</text>
  <text x="592" y="362" font-size="14" fill="#57534e" text-anchor="middle">日間型3.10 ＝ 住宿型3.12</text>
  <text x="592" y="382" font-size="14" fill="#57534e" text-anchor="middle">日間型3.11 ＝ 住宿型3.13</text>
  <text x="592" y="402" font-size="14" fill="#57534e" text-anchor="middle">內容相同，條號依類型不同</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
