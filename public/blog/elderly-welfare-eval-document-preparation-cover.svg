<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>

  <!-- 右側裝飾區塊 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>
  <text x="870" y="280" font-size="200" font-weight="900" fill="#d97706" opacity="0.18" >77</text>
  <text x="870" y="240" font-size="200" font-weight="900" fill="#d97706"  opacity="0.9">77</text>
  <text x="900" y="305" font-size="32" fill="#57534e"  font-weight="500">項文件對應</text>
  <text x="893" y="355" font-size="22" fill="#78716c" >115 年度評鑑指標</text>

  <!-- 左側主內容 -->
  <!-- 類別標籤 -->
  <rect x="60" y="52" width="148" height="36" rx="18" fill="#d97706"/>
  <text x="134" y="76" font-size="16" fill="#ffffff" text-anchor="middle"  font-weight="600">老人福利機構</text>

  <!-- 主標題第1行 -->
  <text x="60" y="185" font-size="100" font-weight="900" fill="#1e293b" >老人福利機構</text>
  <!-- 主標題第2行 -->
  <text x="60" y="295" font-size="100" font-weight="900" fill="#d97706" >備審文件全指南</text>

  <!-- 副標題 -->
  <text x="60" y="358" font-size="38" fill="#57534e" >77 項對應文件清單，整理不遺漏</text>

  <!-- pill 標籤群 -->
  <!-- pill 1 -->
  <rect x="60" y="400" width="162" height="38" rx="19" fill="#1e293b"/>
  <text x="141" y="425" font-size="17" fill="#ffffff" text-anchor="middle" >6大區塊對應</text>
  <!-- pill 2 -->
  <rect x="236" y="400" width="162" height="38" rx="19" fill="#78716c"/>
  <text x="317" y="425" font-size="17" fill="#ffffff" text-anchor="middle" >文件清單速查</text>
  <!-- pill 3 -->
  <rect x="412" y="400" width="162" height="38" rx="19" fill="#57534e"/>
  <text x="493" y="425" font-size="17" fill="#ffffff" text-anchor="middle" >AI文書輔助</text>
  <!-- pill 4 -->
  <rect x="588" y="400" width="120" height="38" rx="19" fill="#d97706"/>
  <text x="648" y="425" font-size="17" fill="#ffffff" text-anchor="middle" >報告汪</text>

  <!-- 分隔線 -->
  <line x1="60" y1="460" x2="790" y2="460" stroke="#c4bfb8" stroke-width="1.5"/>

  <!-- 底部說明 -->
  <text x="60" y="492" font-size="20" fill="#78716c" >A行政管理 / B專業照護 / C安全環境 / D個案權益 / E創新 / F加分</text>

  <!-- 浮水印 -->
  <text x="1140" y="590" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400" >報告汪 reportwang.com</text>
