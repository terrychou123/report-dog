<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">文書系統化 5 個核心步驟</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">從日常維護到評鑑備查的完整流程</text>
  <line x1="28" y1="94" x2="772" y2="94" stroke="#dedad3" stroke-width="1"/>
  <!-- 箭頭 N=5 card_w=140 arrow_gap=12 -->
  <line x1="168" y1="279" x2="180" y2="279" stroke="#c4bfb8" stroke-width="2"/>
  <polygon points="168,273 180,279 168,285" fill="#c4bfb8"/>
  <line x1="320" y1="279" x2="332" y2="279" stroke="#c4bfb8" stroke-width="2"/>
  <polygon points="320,273 332,279 320,285" fill="#c4bfb8"/>
  <line x1="472" y1="279" x2="484" y2="279" stroke="#c4bfb8" stroke-width="2"/>
  <polygon points="472,273 484,279 472,285" fill="#c4bfb8"/>
  <line x1="624" y1="279" x2="636" y2="279" stroke="#c4bfb8" stroke-width="2"/>
  <polygon points="624,273 636,279 624,285" fill="#c4bfb8"/>
  <!-- Step 1 (x=28 cx=98) -->
  <rect x="28" y="108" width="140" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="108" width="140" height="8" rx="4" fill="#d97706"/>
  <rect x="28" y="112" width="140" height="4" fill="#d97706"/>
  <circle cx="98" cy="189" r="35" fill="#fef3c7"/>
  <text x="98" y="180" text-anchor="middle" font-size="14" fill="#d97706" font-weight="700">STEP</text>
  <text x="98" y="203" text-anchor="middle" font-size="23" fill="#d97706" font-weight="700">01</text>
  <text x="98" y="288" text-anchor="middle" font-size="20" fill="#1e293b" font-weight="700">盤點文件</text>
  <text x="98" y="314" text-anchor="middle" font-size="14" fill="#57534e">列出評鑑</text>
  <text x="98" y="334" text-anchor="middle" font-size="14" fill="#57534e">必要文件清單</text>
  <rect x="41" y="376" width="114" height="36" rx="18" fill="#fef3c7"/>
  <text x="98" y="400" text-anchor="middle" font-size="14" fill="#d97706" font-weight="600">評鑑前 3 月</text>
  <!-- Step 2 (x=180 cx=250) -->
  <rect x="180" y="108" width="140" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="180" y="108" width="140" height="8" rx="4" fill="#78716c"/>
  <rect x="180" y="112" width="140" height="4" fill="#78716c"/>
  <circle cx="250" cy="189" r="35" fill="#f5f5f4"/>
  <text x="250" y="180" text-anchor="middle" font-size="14" fill="#78716c" font-weight="700">STEP</text>
  <text x="250" y="203" text-anchor="middle" font-size="23" fill="#78716c" font-weight="700">02</text>
  <text x="250" y="288" text-anchor="middle" font-size="20" fill="#1e293b" font-weight="700">建立格式</text>
  <text x="250" y="314" text-anchor="middle" font-size="14" fill="#57534e">設計標準化</text>
  <text x="250" y="334" text-anchor="middle" font-size="14" fill="#57534e">紀錄模板</text>
  <rect x="193" y="376" width="114" height="36" rx="18" fill="#f5f5f4"/>
  <text x="250" y="400" text-anchor="middle" font-size="14" fill="#78716c" font-weight="600">評鑑前 3 月</text>
  <!-- Step 3 (x=332 cx=402) -->
  <rect x="332" y="108" width="140" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="332" y="108" width="140" height="8" rx="4" fill="#57534e"/>
  <rect x="332" y="112" width="140" height="4" fill="#57534e"/>
  <circle cx="402" cy="189" r="35" fill="#f5f0eb"/>
  <text x="402" y="180" text-anchor="middle" font-size="14" fill="#57534e" font-weight="700">STEP</text>
  <text x="402" y="203" text-anchor="middle" font-size="23" fill="#57534e" font-weight="700">03</text>
  <text x="402" y="288" text-anchor="middle" font-size="20" fill="#1e293b" font-weight="700">分工確認</text>
  <text x="402" y="314" text-anchor="middle" font-size="14" fill="#57534e">指定每項</text>
  <text x="402" y="334" text-anchor="middle" font-size="14" fill="#57534e">文件負責人</text>
  <rect x="345" y="376" width="114" height="36" rx="18" fill="#f5f0eb"/>
  <text x="402" y="400" text-anchor="middle" font-size="14" fill="#57534e" font-weight="600">評鑑前 2 月</text>
  <!-- Step 4 (x=484 cx=554) -->
  <rect x="484" y="108" width="140" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="484" y="108" width="140" height="8" rx="4" fill="#a8a29e"/>
  <rect x="484" y="112" width="140" height="4" fill="#a8a29e"/>
  <circle cx="554" cy="189" r="35" fill="#f5f5f4"/>
  <text x="554" y="180" text-anchor="middle" font-size="14" fill="#a8a29e" font-weight="700">STEP</text>
  <text x="554" y="203" text-anchor="middle" font-size="23" fill="#a8a29e" font-weight="700">04</text>
  <text x="554" y="288" text-anchor="middle" font-size="20" fill="#1e293b" font-weight="700">月度維護</text>
  <text x="554" y="314" text-anchor="middle" font-size="14" fill="#57534e">每月最後週</text>
  <text x="554" y="334" text-anchor="middle" font-size="14" fill="#57534e">確認當月完整</text>
  <rect x="497" y="376" width="114" height="36" rx="18" fill="#f5f5f4"/>
  <text x="554" y="400" text-anchor="middle" font-size="14" fill="#1e293b" font-weight="600">持續執行</text>
  <!-- Step 5 (x=636 cx=706) -->
  <rect x="636" y="108" width="136" height="342" rx="8" fill="white" opacity="0.12"/>
  <rect x="636" y="108" width="136" height="8" rx="8" fill="#94a3b8" opacity="0.12"/>
  <rect x="636" y="112" width="136" height="4" fill="#94a3b8" rx="8" opacity="0.12"/>
  <circle cx="704" cy="189" r="35" fill="#f1f5f9"/>
  <text x="704" y="180" text-anchor="middle" font-size="14" fill="#94a3b8" font-weight="700">STEP</text>
  <text x="704" y="203" text-anchor="middle" font-size="23" fill="#94a3b8" font-weight="700">05</text>
  <text x="704" y="288" text-anchor="middle" font-size="20" fill="#1e293b" font-weight="700">評鑑整理</text>
  <text x="704" y="314" text-anchor="middle" font-size="14" fill="#57534e">建立文件索引</text>
  <text x="704" y="334" text-anchor="middle" font-size="14" fill="#57534e">準備文件盒</text>
  <rect x="647" y="376" width="114" height="36" rx="18" fill="#f1f5f9"/>
  <text x="704" y="400" text-anchor="middle" font-size="14" fill="#94a3b8" font-weight="600">評鑑前 1 週</text>

  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
