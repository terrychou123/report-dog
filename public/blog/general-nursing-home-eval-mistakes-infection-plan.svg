<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <rect x="0" y="38" width="800" height="90" fill="#e8e6de"/>
  <rect x="0" y="38" width="6" height="90" rx="2" fill="#d97706"/>
  <text x="28" y="98" font-size="36" fill="#1e293b" font-weight="700">缺失四：感染管制計畫多年未更新</text>
  <rect x="28" y="166" width="744" height="90" rx="12" fill="#e8e6de"/>
  <rect x="28" y="166" width="6" height="90" rx="2" fill="#78716c"/>
  <circle cx="66" cy="211" r="20" fill="#57534e" opacity="0.15"/>
  <text x="66" y="217" font-size="18" fill="#57534e" text-anchor="middle" font-weight="900">問題</text>
  <text x="100" y="210" font-size="28" fill="#1e293b" font-weight="700">感染管制計畫封面日期是 3-4 年前</text>
  <text x="100" y="234" font-size="16" fill="#57534e">未更新代表機構沒有跟上最新防疫知識與政策要求</text>
  <rect x="620" y="185" width="136" height="52" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="205" font-size="16" fill="#57534e" text-anchor="middle">委員</text>
  <text x="688" y="225" font-size="16" fill="#57534e" text-anchor="middle">一眼看出</text>
  <rect x="28" y="269" width="744" height="90" rx="12" fill="#e8e6de"/>
  <rect x="28" y="269" width="6" height="90" rx="2" fill="#57534e"/>
  <circle cx="66" cy="314" r="20" fill="#d97706" opacity="0.15"/>
  <text x="66" y="320" font-size="18" fill="#d97706" text-anchor="middle" font-weight="900">解法</text>
  <text x="100" y="313" font-size="28" fill="#1e293b" font-weight="700">每年定期審閱並更新日期</text>
  <text x="100" y="337" font-size="16" fill="#57534e">即使內容不需修改，也要記錄「本年度審閱結果」並更新版次</text>
  <rect x="620" y="288" width="136" height="52" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="308" font-size="16" fill="#d97706" text-anchor="middle">每年</text>
  <text x="688" y="328" font-size="16" fill="#d97706" text-anchor="middle">審閱</text>
  <rect x="28" y="372" width="744" height="90" rx="12" fill="#e8e6de"/>
  <rect x="28" y="372" width="6" height="90" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="417" r="20" fill="#78716c" opacity="0.15"/>
  <text x="66" y="423" font-size="18" fill="#78716c" text-anchor="middle" font-weight="900">重點</text>
  <text x="100" y="416" font-size="28" fill="#1e293b" font-weight="700">版次管理：版次號＋更新日期</text>
  <text x="100" y="440" font-size="16" fill="#57534e">計畫封面必須有版次號和最後更新日期，顯示持續維護</text>
  <rect x="620" y="391" width="136" height="52" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="411" font-size="16" fill="#78716c" text-anchor="middle">版次</text>
