<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- 標題 -->
  <text x="400" y="50" font-size="26" fill="#1e293b" text-anchor="middle" font-weight="700" font-family="sans-serif">家屬溝通與臨終支持 — 4 大重點</text>
  <!-- N=4: H=62, outer_gap=50, Header y=50, Row y: 160/235/310/385 -->
  <!-- Row 1 -->
  <rect x="50" y="145" width="700" height="62" rx="8" fill="#ffffff"/>
  <rect x="50" y="145" width="6" height="62" rx="3" fill="#d97706"/>
  <circle cx="85" cy="176" r="16" fill="#d97706" opacity="0.15"/>
  <text x="85" y="182" font-size="16" fill="#d97706" text-anchor="middle" font-weight="700" font-family="sans-serif">1</text>
  <text x="118" y="169" font-size="17" fill="#1e293b" font-weight="700" font-family="sans-serif">家屬溝通紀錄</text>
  <text x="118" y="191" font-size="14" fill="#57534e" font-family="sans-serif">每次與家屬討論緩和醫療意願的溝通均需留有會談紀錄，含日期、參與人員、結論</text>
  <rect x="570" y="153" width="168" height="46" rx="6" fill="#d97706" opacity="0.10"/>
  <text x="654" y="181" font-size="14" fill="#d97706" text-anchor="middle" font-weight="600" font-family="sans-serif">書面留存</text>
  <!-- Row 2 -->
  <rect x="50" y="220" width="700" height="62" rx="8" fill="#ffffff"/>
  <rect x="50" y="220" width="6" height="62" rx="3" fill="#78716c"/>
  <circle cx="85" cy="251" r="16" fill="#78716c" opacity="0.15"/>
  <text x="85" y="257" font-size="16" fill="#78716c" text-anchor="middle" font-weight="700" font-family="sans-serif">2</text>
  <text x="118" y="244" font-size="17" fill="#1e293b" font-weight="700" font-family="sans-serif">臨終照護諮詢服務</text>
  <text x="118" y="266" font-size="14" fill="#57534e" font-family="sans-serif">提供臨終照護關懷處理流程或手冊，協助家屬了解臨終階段各項安排</text>
  <rect x="570" y="228" width="168" height="46" rx="6" fill="#78716c" opacity="0.10"/>
  <text x="654" y="256" font-size="14" fill="#78716c" text-anchor="middle" font-weight="600" font-family="sans-serif">手冊提供</text>
  <!-- Row 3 -->
  <rect x="50" y="295" width="700" height="62" rx="8" fill="#ffffff"/>
  <rect x="50" y="295" width="6" height="62" rx="3" fill="#57534e"/>
  <circle cx="85" cy="326" r="16" fill="#57534e" opacity="0.15"/>
  <text x="85" y="332" font-size="16" fill="#57534e" text-anchor="middle" font-weight="700" font-family="sans-serif">3</text>
  <text x="118" y="319" font-size="17" fill="#1e293b" font-weight="700" font-family="sans-serif">情緒陪伴與悲傷輔導</text>
  <text x="118" y="341" font-size="14" fill="#57534e" font-family="sans-serif">社工師提供家屬悲傷輔導服務，必要時轉介心理諮商資源，保留服務紀錄</text>
  <rect x="570" y="303" width="168" height="46" rx="6" fill="#57534e" opacity="0.10"/>
  <text x="654" y="331" font-size="14" fill="#57534e" text-anchor="middle" font-weight="600" font-family="sans-serif">社工主責</text>
  <!-- Row 4 -->
  <rect x="50" y="370" width="700" height="62" rx="8" fill="#ffffff"/>
  <rect x="50" y="370" width="6" height="62" rx="3" fill="#a8a29e"/>
  <circle cx="85" cy="401" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="85" y="407" font-size="16" fill="#a8a29e" text-anchor="middle" font-weight="700" font-family="sans-serif">4</text>
  <text x="118" y="394" font-size="17" fill="#1e293b" font-weight="700" font-family="sans-serif">喪葬事宜協助</text>
  <text x="118" y="416" font-size="14" fill="#57534e" font-family="sans-serif">協助家屬聯繫殯葬服務、辦理後事，留有協助紀錄，展現機構全程陪伴</text>
  <rect x="570" y="378" width="168" height="46" rx="6" fill="#a8a29e" opacity="0.10"/>
  <text x="654" y="406" font-size="14" fill="#a8a29e" text-anchor="middle" font-weight="600" font-family="sans-serif">協助紀錄</text>
  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" font-family="sans-serif">報告汪 reportwang.com</text>
</svg>