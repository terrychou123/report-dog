<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <rect x="0" y="0" width="800" height="90" fill="#1e293b"/>
  <text x="400" y="44" font-size="22" font-weight="700" fill="#ffffff" font-family="sans-serif" text-anchor="middle">AI 輔助評鑑文書工作流程</text>
  <text x="400" y="72" font-size="15" fill="#94a3b8" font-family="sans-serif" text-anchor="middle">評鑑前 3 個月啟動・各職類分工協作</text>

  <!-- N=4，Row y: 160/235/310/385，H=62，outer_gap=50 -->

  <!-- Row 1 -->
  <rect x="29" y="148" width="742" height="62" rx="6" fill="#ffffff"/>
  <rect x="29" y="148" width="6" height="62" rx="3" fill="#d97706"/>
  <circle cx="66" cy="179" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="184" font-size="13" font-weight="700" fill="#d97706" font-family="sans-serif" text-anchor="middle">月前</text>
  <text x="100" y="170" font-size="16" font-weight="700" fill="#1e293b" font-family="sans-serif">評鑑前 3 個月：啟動 AI 自我查核掃描</text>
  <text x="100" y="193" font-size="14" fill="#57534e" font-family="sans-serif">主管輸入機構現況，AI 產出 77 項缺失清單，各職類分頭補強</text>
  <rect x="620" y="161" width="136" height="36" rx="6" fill="#d97706" opacity="0.12"/>
  <text x="688" y="184" font-size="13" font-weight="700" fill="#d97706" font-family="sans-serif" text-anchor="middle">全員啟動</text>

  <!-- Row 2 -->
  <rect x="29" y="223" width="742" height="62" rx="6" fill="#ffffff"/>
  <rect x="29" y="223" width="6" height="62" rx="3" fill="#78716c"/>
  <circle cx="66" cy="254" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="259" font-size="13" font-weight="700" fill="#78716c" font-family="sans-serif" text-anchor="middle">月前</text>
  <text x="100" y="245" font-size="16" font-weight="700" fill="#1e293b" font-family="sans-serif">評鑑前 2 個月：B 區文書批量產出</text>
  <text x="100" y="268" font-size="14" fill="#57534e" font-family="sans-serif">社工完成 B2 個案計畫、護理師完成 B13–B19 PDCA 報告</text>
  <rect x="620" y="236" width="136" height="36" rx="6" fill="#78716c" opacity="0.12"/>
  <text x="688" y="259" font-size="13" font-weight="700" fill="#78716c" font-family="sans-serif" text-anchor="middle">B 區重點</text>

  <!-- Row 3 -->
  <rect x="29" y="298" width="742" height="62" rx="6" fill="#ffffff"/>
  <rect x="29" y="298" width="6" height="62" rx="3" fill="#57534e"/>
  <circle cx="66" cy="329" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="334" font-size="13" font-weight="700" fill="#57534e" font-family="sans-serif" text-anchor="middle">月前</text>
  <text x="100" y="320" font-size="16" font-weight="700" fill="#1e293b" font-family="sans-serif">評鑑前 1 個月：A/D 區文件定稿</text>
  <text x="100" y="343" font-size="14" fill="#57534e" font-family="sans-serif">行政完成 A 區文件、社工補齊 D 區個案權益文件缺漏</text>
  <rect x="620" y="311" width="136" height="36" rx="6" fill="#57534e" opacity="0.12"/>
  <text x="688" y="334" font-size="13" font-weight="700" fill="#57534e" font-family="sans-serif" text-anchor="middle">全面收尾</text>

  <!-- Row 4 -->
  <rect x="29" y="373" width="742" height="62" rx="6" fill="#ffffff"/>
  <rect x="29" y="373" width="6" height="62" rx="3" fill="#a8a29e"/>
  <circle cx="66" cy="404" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="409" font-size="13" font-weight="700" fill="#a8a29e" font-family="sans-serif" text-anchor="middle">評鑑</text>
  <text x="100" y="395" font-size="16" font-weight="700" fill="#1e293b" font-family="sans-serif">評鑑當天：文件即時調閱</text>
  <text x="100" y="418" font-size="14" fill="#57534e" font-family="sans-serif">委員提問時，系統直接調出對應文件與版本歷程佐證</text>
  <rect x="620" y="386" width="136" height="36" rx="6" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="409" font-size="13" font-weight="700" fill="#a8a29e" font-family="sans-serif" text-anchor="middle">即時應對</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" font-family="sans-serif">報告汪 reportwang.com</text>
</svg>
