<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題列 -->
  <rect x="30" y="50" width="740" height="62" rx="10" fill="#2563eb"/>
  <text x="400" y="89" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="sans-serif">D 區個案權益保障 9 項分組概覽</text>

  <!-- Row 1 -->
  <rect x="30" y="160" width="740" height="62" rx="8" fill="#ffffff"/>
  <rect x="30" y="160" width="6" height="62" rx="3" fill="#d97706"/>
  <circle cx="66" cy="191" r="16" fill="#d97706"/>
  <text x="66" y="197" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="sans-serif">1</text>
  <text x="100" y="183" font-size="20" fill="#1e293b" font-weight="700" font-family="sans-serif">資料與隱私（D1、D6）</text>
  <text x="100" y="207" font-size="16" fill="#57534e" font-family="sans-serif">D1個案資料保密（二級加強）、D6住民隱私及居家布置（二級加強）</text>
  <rect x="620" y="168" width="136" height="46" rx="6" fill="#dbeafe"/>
  <text x="688" y="196" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="600" font-family="sans-serif">二級加強×2</text>

  <!-- Row 2 -->
  <rect x="30" y="235" width="740" height="62" rx="8" fill="#ffffff"/>
  <rect x="30" y="235" width="6" height="62" rx="3" fill="#78716c"/>
  <circle cx="66" cy="266" r="16" fill="#78716c"/>
  <text x="66" y="272" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="sans-serif">2</text>
  <text x="100" y="258" font-size="20" fill="#1e293b" font-weight="700" font-family="sans-serif">契約與財務（D2、D3）</text>
  <text x="100" y="282" font-size="16" fill="#57534e" font-family="sans-serif">D2入住契約管理、D3個案財務管理（零用金、代購、遺產處理）</text>
  <rect x="620" y="243" width="136" height="46" rx="6" fill="#fef9c3"/>
  <text x="688" y="271" font-size="15" fill="#78716c" text-anchor="middle" font-weight="600" font-family="sans-serif">文件備審重點</text>

  <!-- Row 3 -->
  <rect x="30" y="310" width="740" height="62" rx="8" fill="#ffffff"/>
  <rect x="30" y="310" width="6" height="62" rx="3" fill="#57534e"/>
  <circle cx="66" cy="341" r="16" fill="#57534e"/>
  <text x="66" y="347" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="sans-serif">3</text>
  <text x="100" y="333" font-size="20" fill="#1e293b" font-weight="700" font-family="sans-serif">申訴與自主（D4、D5）</text>
  <text x="100" y="357" font-size="16" fill="#57534e" font-family="sans-serif">D4申訴意見管道、D5個案自主決定（宗教信仰與靈性關懷）</text>
  <rect x="620" y="318" width="136" height="46" rx="6" fill="#f0fdf4"/>
  <text x="688" y="346" font-size="15" fill="#57534e" text-anchor="middle" font-weight="600" font-family="sans-serif">住民訪談核查</text>

  <!-- Row 4 -->
  <rect x="30" y="385" width="740" height="62" rx="8" fill="#ffffff"/>
  <rect x="30" y="385" width="6" height="62" rx="3" fill="#a8a29e"/>
  <circle cx="66" cy="416" r="16" fill="#a8a29e"/>
  <text x="66" y="422" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="sans-serif">4</text>
  <text x="100" y="408" font-size="20" fill="#1e293b" font-weight="700" font-family="sans-serif">虐待防治、緩和醫療、滿意度（D7–D9）</text>
  <text x="100" y="432" font-size="16" fill="#57534e" font-family="sans-serif">D7虐待防治、D8緩和醫療DNR、D9服務對象問卷調查</text>
  <rect x="620" y="393" width="136" height="46" rx="6" fill="#fef3c7"/>
  <text x="688" y="421" font-size="15" fill="#a8a29e" text-anchor="middle" font-weight="600" font-family="sans-serif">護理+社工共備</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" font-family="sans-serif">報告汪 reportwang.com</text>
</svg>
