<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Noto Sans TC', sans-serif">
  <!-- @template: list-4 -->
<!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題 N=4 Header y=50 h=62 -->
  <rect x="28" y="50" width="744" height="62" rx="10" fill="#78716c"/>
  <text x="400" y="84" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">志工管理制度四個關鍵環節</text>
  <text x="400" y="104" font-size="16" fill="#dedad3" text-anchor="middle">項目 26 第六面向——評鑑重點在制度完善，非人數多寡</text>

  <!-- Row 1 y=160 h=62 -->
  <rect x="28" y="160" width="744" height="62" rx="10" fill="#ffffff"/>
  <rect x="28" y="160" width="6" height="62" rx="2" fill="#d97706"/>
  <circle cx="66" cy="191" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" font-size="14" font-weight="700" fill="#d97706" text-anchor="middle" dominant-baseline="central" y="191">1</text>
  <text x="96" y="184" font-size="18" font-weight="700" fill="#1e293b">招募與訓練</text>
  <text x="96" y="207" font-size="14" fill="#57534e">志工招募計畫/廣告記錄＋志工訓練課程大綱＋出席名單</text>
  <rect x="660" y="171" width="100" height="38" rx="8" fill="#fef3c7"/>
  <text x="710" y="194" font-size="14" font-weight="700" fill="#d97706" text-anchor="middle">入門門檻</text>

  <!-- Row 2 y=235 h=62 -->
  <rect x="28" y="235" width="744" height="62" rx="10" fill="#ffffff"/>
  <rect x="28" y="235" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="66" cy="266" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" font-size="14" font-weight="700" fill="#78716c" text-anchor="middle" dominant-baseline="central" y="266">2</text>
  <text x="96" y="259" font-size="18" font-weight="700" fill="#1e293b">服務管理</text>
  <text x="96" y="282" font-size="14" fill="#57534e">每次服務：日期、時數、人數、內容描述；志工簽到簽退記錄</text>
  <rect x="660" y="246" width="100" height="38" rx="8" fill="#fef3c7"/>
  <text x="710" y="269" font-size="14" font-weight="700" fill="#d97706" text-anchor="middle">核心文件</text>

  <!-- Row 3 y=310 h=62 -->
  <rect x="28" y="310" width="744" height="62" rx="10" fill="#ffffff"/>
  <rect x="28" y="310" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="66" cy="341" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" font-size="14" font-weight="700" fill="#57534e" text-anchor="middle" dominant-baseline="central" y="341">3</text>
  <text x="96" y="334" font-size="18" font-weight="700" fill="#1e293b">志工考核</text>
  <text x="96" y="357" font-size="14" fill="#57534e">年度座談、服務回顧或滿意度問卷；評估結果需有記錄</text>
  <rect x="660" y="321" width="100" height="38" rx="8" fill="#f0efe8"/>
  <text x="710" y="344" font-size="14" font-weight="700" fill="#78716c" text-anchor="middle">品質把關</text>

  <!-- Row 4 y=385 h=62 -->
  <rect x="28" y="385" width="744" height="62" rx="10" fill="#ffffff"/>
  <rect x="28" y="385" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="416" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" font-size="14" font-weight="700" fill="#a8a29e" text-anchor="middle" dominant-baseline="central" y="416">4</text>
  <text x="96" y="409" font-size="18" font-weight="700" fill="#1e293b">志工退場</text>
  <text x="96" y="432" font-size="14" fill="#57534e">最後服務日、退出原因、感謝函；確保資料完整可追溯</text>
  <rect x="660" y="396" width="100" height="38" rx="8" fill="#f0efe8"/>
  <text x="710" y="419" font-size="14" font-weight="700" fill="#78716c" text-anchor="middle">閉環管理</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end">reportwang.com</text>
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end">報告汪 reportwang.com</text>
</svg>
