<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- Header -->
  <rect x="0" y="29" width="800" height="60" fill="#e8e6de"/>
  <rect x="0" y="29" width="6" height="60" rx="2" fill="#d97706"/>
  <text x="28" y="74" font-size="28" fill="#1e293b" font-weight="700">1106 四類人力配置概覽（最高分 8 分）</text>
  <!-- Row 1: y=118, H=62 -->
  <rect x="28" y="118" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1.5"/>
  <rect x="28" y="118" width="6" height="62" rx="2" fill="#d97706"/>
  <circle cx="66" cy="149" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="144" font-size="20" fill="#d97706" font-weight="700" text-anchor="middle">1</text>
  <text x="66" y="164" font-size="14" fill="#78716c" text-anchor="middle">社工師</text>
  <text x="96" y="144" font-size="20" fill="#1e293b" font-weight="700">社會工作人員</text>
  <text x="96" y="165" font-size="16" fill="#57534e">服務人數每滿 80 人配置 1 名，需具社工師執照或相關學歷</text>
  <rect x="620" y="126" width="136" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="146" font-size="14" fill="#d97706" font-weight="700" text-anchor="middle">每 80 人</text>
  <text x="688" y="165" font-size="14" fill="#d97706" text-anchor="middle">配置 1 名</text>
  <!-- Row 2: y=191, H=62 -->
  <rect x="28" y="191" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1.5"/>
  <rect x="28" y="191" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="66" cy="222" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="217" font-size="20" fill="#78716c" font-weight="700" text-anchor="middle">2</text>
  <text x="66" y="237" font-size="14" fill="#78716c" text-anchor="middle">護理師</text>
  <text x="96" y="217" font-size="20" fill="#1e293b" font-weight="700">護理人員</text>
  <text x="96" y="238" font-size="16" fill="#57534e">住宿型機構需有全日班次安排，持護理師或護士執照，紀錄一致</text>
  <rect x="620" y="199" width="136" height="46" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="219" font-size="14" fill="#78716c" font-weight="700" text-anchor="middle">全日班</text>
  <text x="688" y="238" font-size="14" fill="#78716c" text-anchor="middle">值班安排</text>
  <!-- Row 3: y=264, H=62 -->
  <rect x="28" y="264" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1.5"/>
  <rect x="28" y="264" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="66" cy="295" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="290" font-size="20" fill="#57534e" font-weight="700" text-anchor="middle">3</text>
  <text x="66" y="310" font-size="14" fill="#78716c" text-anchor="middle">教保員</text>
  <text x="96" y="290" font-size="20" fill="#1e293b" font-weight="700">教保員（生活服務員）</text>
  <text x="96" y="311" font-size="16" fill="#57534e">日間照顧時段每 8 名服務對象配置 1 名直接服務人員（比例最嚴格）</text>
  <rect x="620" y="272" width="136" height="46" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="292" font-size="14" fill="#57534e" font-weight="700" text-anchor="middle">每 8 人</text>
  <text x="688" y="311" font-size="14" fill="#57534e" text-anchor="middle">配置 1 名</text>
  <!-- Row 4: y=337, H=62 -->
  <rect x="28" y="337" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1.5"/>
  <rect x="28" y="337" width="6" height="62" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="368" r="16" fill="#94a3b8" opacity="0.15"/>
  <text x="66" y="363" font-size="20" fill="#94a3b8" font-weight="700" text-anchor="middle">4</text>
  <text x="66" y="383" font-size="14" fill="#78716c" text-anchor="middle">治療師</text>
  <text x="96" y="363" font-size="20" fill="#1e293b" font-weight="700">物理治療師 / 職能治療師</text>
  <text x="96" y="384" font-size="16" fill="#57534e">依機構服務性質，可簽約外聘定期到機構，需保存合約與服務紀錄</text>
  <rect x="620" y="345" width="136" height="46" rx="8" fill="#94a3b8" opacity="0.12"/>
  <text x="688" y="365" font-size="14" fill="#94a3b8" font-weight="700" text-anchor="middle">簽約外聘</text>
  <text x="688" y="384" font-size="14" fill="#94a3b8" text-anchor="middle">可計入</text>
  <!-- Watermark -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
