<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <rect x="0" y="50" width="800" height="76" fill="white"/>
  <rect x="0" y="50" width="6" height="76" rx="2" fill="#d97706"/>
  <text x="28" y="104" font-size="36" fill="#1e293b" font-weight="700">子項三餐具管理 vs 子項四循環菜單</text>
  <rect x="28" y="175" width="744" height="130" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="175" width="6" height="130" rx="2" fill="#57534e"/>
  <circle cx="66" cy="235" r="20" fill="#57534e" opacity="0.15"/>
  <text x="66" y="241" font-size="18" fill="#57534e" text-anchor="middle" font-weight="900">子3</text>
  <text x="100" y="225" font-size="22" fill="#1e293b" font-weight="700">餐具管理：禁止全程使用免洗餐具</text>
  <text x="100" y="251" font-size="16" fill="#57534e">免洗餐具讓住民感覺像「患者」而非「居住者」，不符合以人為中心</text>
  <text x="100" y="271" font-size="16" fill="#57534e">特殊情形（如傳染病隔離）可暫時使用，需有說明記錄</text>
  <text x="100" y="291" font-size="16" fill="#57534e">常規用餐需使用不鏽鋼等耐用餐具</text>
  <rect x="620" y="183" width="136" height="115" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="234" font-size="16" fill="#57534e" text-anchor="middle">尊嚴</text>
  <text x="688" y="254" font-size="16" fill="#57534e" text-anchor="middle">用餐</text>
  <rect x="28" y="325" width="744" height="120" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="325" width="6" height="120" rx="2" fill="#d97706"/>
  <circle cx="66" cy="380" r="20" fill="#d97706" opacity="0.15"/>
  <text x="66" y="386" font-size="18" fill="#d97706" text-anchor="middle" font-weight="900">子4</text>
  <text x="100" y="370" font-size="22" fill="#1e293b" font-weight="700">2 週循環菜單：菜單須與餐食相符</text>
  <text x="100" y="396" font-size="16" fill="#57534e">菜單格式：日期/星期、早午晚餐、菜色名稱、烹飪方式、質地</text>
  <text x="100" y="416" font-size="16" fill="#57534e">委員可能比對菜單與當天實際供餐，或詢問廚房核實</text>
  <rect x="620" y="333" width="136" height="105" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="381" font-size="16" fill="#d97706" text-anchor="middle">相符</text>
  <text x="688" y="401" font-size="16" fill="#d97706" text-anchor="middle">可核</text>
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
