<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">ISP 撰寫 5 大步驟流程</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">從需求評估到計畫執行・每步驟對應評鑑指標</text>
  <line x1="28" y1="94" x2="772" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- N=5 卡片 card_w=140 arrow_gap=12 -->
  <!-- i=0: x=28 cx=98, i=1: x=180 cx=250, i=2: x=332 cx=402, i=3: x=484 cx=554, i=4: x=636 cx=706 -->

  <!-- 箭頭 arrow_y=279 -->
  <line x1="168" y1="279" x2="180" y2="279" stroke="#c4bfb8" stroke-width="2"/>
  <polygon points="168,273 180,279 168,285" fill="#c4bfb8"/>
  <line x1="320" y1="279" x2="332" y2="279" stroke="#c4bfb8" stroke-width="2"/>
  <polygon points="320,273 332,279 320,285" fill="#c4bfb8"/>
  <line x1="472" y1="279" x2="484" y2="279" stroke="#c4bfb8" stroke-width="2"/>
  <polygon points="472,273 484,279 472,285" fill="#c4bfb8"/>
  <line x1="624" y1="279" x2="636" y2="279" stroke="#c4bfb8" stroke-width="2"/>
  <polygon points="624,273 636,279 624,285" fill="#c4bfb8"/>

  <!-- Step 1: 需求評估 cx=98 -->
  <rect x="28" y="108" width="140" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="108" width="140" height="8" rx="4" fill="#d97706"/>
  <rect x="28" y="112" width="140" height="4" fill="#d97706"/>
  <circle cx="98" cy="189" r="35" fill="#fef3c7"/>
  <text x="98" y="180" text-anchor="middle" font-size="14" fill="#d97706" font-weight="700">STEP</text>
  <text x="98" y="203" text-anchor="middle" font-size="22" fill="#d97706" font-weight="700">01</text>
  <text x="98" y="285" text-anchor="middle" font-size="20" fill="#1e293b" font-weight="700">需求</text>
  <text x="98" y="308" text-anchor="middle" font-size="20" fill="#1e293b" font-weight="700">評估</text>
  <text x="98" y="332" text-anchor="middle" font-size="14" fill="#57534e">適齡適性</text>
  <text x="98" y="350" text-anchor="middle" font-size="14" fill="#57534e">工具選用</text>
  <rect x="43" y="377" width="110" height="36" rx="18" fill="#fef3c7"/>
  <text x="98" y="401" text-anchor="middle" font-size="14" fill="#d97706" font-weight="600">4101</text>

  <!-- Step 2: 召開會議 cx=250 -->
  <rect x="180" y="108" width="140" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="180" y="108" width="140" height="8" rx="4" fill="#78716c"/>
  <rect x="180" y="112" width="140" height="4" fill="#78716c"/>
  <circle cx="250" cy="189" r="35" fill="#f5f5f4"/>
  <text x="250" y="180" text-anchor="middle" font-size="14" fill="#78716c" font-weight="700">STEP</text>
  <text x="250" y="203" text-anchor="middle" font-size="22" fill="#78716c" font-weight="700">02</text>
  <text x="250" y="285" text-anchor="middle" font-size="20" fill="#1e293b" font-weight="700">召開</text>
  <text x="250" y="308" text-anchor="middle" font-size="20" fill="#1e293b" font-weight="700">計畫會議</text>
  <text x="250" y="332" text-anchor="middle" font-size="14" fill="#57534e">本人+家屬</text>
  <text x="250" y="350" text-anchor="middle" font-size="14" fill="#57534e">2個月內</text>
  <rect x="195" y="377" width="110" height="36" rx="18" fill="#f5f5f4"/>
  <text x="250" y="401" text-anchor="middle" font-size="14" fill="#78716c" font-weight="600">4101</text>

  <!-- Step 3: 設定目標 cx=402 -->
  <rect x="332" y="108" width="140" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="332" y="108" width="140" height="8" rx="4" fill="#57534e"/>
  <rect x="332" y="112" width="140" height="4" fill="#57534e"/>
  <circle cx="402" cy="189" r="35" fill="#f5f0eb"/>
  <text x="402" y="180" text-anchor="middle" font-size="14" fill="#57534e" font-weight="700">STEP</text>
  <text x="402" y="203" text-anchor="middle" font-size="22" fill="#57534e" font-weight="700">03</text>
  <text x="402" y="285" text-anchor="middle" font-size="20" fill="#1e293b" font-weight="700">設定</text>
  <text x="402" y="308" text-anchor="middle" font-size="20" fill="#1e293b" font-weight="700">服務目標</text>
  <text x="402" y="332" text-anchor="middle" font-size="14" fill="#57534e">長短期目標</text>
  <text x="402" y="350" text-anchor="middle" font-size="14" fill="#57534e">SMART原則</text>
  <rect x="347" y="377" width="110" height="36" rx="18" fill="#f5f0eb"/>
  <text x="402" y="401" text-anchor="middle" font-size="14" fill="#57534e" font-weight="600">4102</text>

  <!-- Step 4: 每2週記錄 cx=554 -->
  <rect x="484" y="108" width="140" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="484" y="108" width="140" height="8" rx="4" fill="#a8a29e"/>
  <rect x="484" y="112" width="140" height="4" fill="#a8a29e"/>
  <circle cx="554" cy="189" r="35" fill="#f5f5f4"/>
  <text x="554" y="180" text-anchor="middle" font-size="14" fill="#a8a29e" font-weight="700">STEP</text>
  <text x="554" y="203" text-anchor="middle" font-size="22" fill="#a8a29e" font-weight="700">04</text>
  <text x="554" y="285" text-anchor="middle" font-size="20" fill="#1e293b" font-weight="700">執行</text>
  <text x="554" y="308" text-anchor="middle" font-size="20" fill="#1e293b" font-weight="700">並記錄</text>
  <text x="554" y="332" text-anchor="middle" font-size="14" fill="#57534e">每2週1次</text>
  <text x="554" y="350" text-anchor="middle" font-size="14" fill="#57534e">紀錄不間斷</text>
  <rect x="499" y="377" width="110" height="36" rx="18" fill="#f5f5f4"/>
  <text x="554" y="401" text-anchor="middle" font-size="14" fill="#1e293b" font-weight="600">4103</text>

  <!-- Step 5: 半年檢討 cx=706 -->
  <rect x="636" y="108" width="140" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="636" y="108" width="140" height="8" rx="4" fill="#94a3b8"/>
  <rect x="636" y="112" width="140" height="4" fill="#94a3b8"/>
  <circle cx="706" cy="189" r="35" fill="#f1f5f9"/>
  <text x="706" y="180" text-anchor="middle" font-size="14" fill="#94a3b8" font-weight="700">STEP</text>
  <text x="706" y="203" text-anchor="middle" font-size="22" fill="#94a3b8" font-weight="700">05</text>
  <text x="706" y="285" text-anchor="middle" font-size="20" fill="#1e293b" font-weight="700">半年</text>
  <text x="706" y="308" text-anchor="middle" font-size="20" fill="#1e293b" font-weight="700">檢討修正</text>
  <text x="706" y="332" text-anchor="middle" font-size="14" fill="#57534e">通知家屬</text>
  <text x="706" y="350" text-anchor="middle" font-size="14" fill="#57534e">留存紀錄</text>
  <rect x="651" y="377" width="110" height="36" rx="18" fill="#f1f5f9"/>
  <text x="706" y="401" text-anchor="middle" font-size="14" fill="#94a3b8" font-weight="600">4103</text>

  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
