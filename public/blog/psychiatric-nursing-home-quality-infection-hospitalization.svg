<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <rect x="0" y="50" width="800" height="76" fill="white"/>
  <rect x="0" y="50" width="6" height="76" rx="2" fill="#d97706"/>
  <text x="28" y="104" font-size="36" fill="#1e293b" font-weight="700">指標四感染與指標五非計畫性住院</text>
  <rect x="28" y="175" width="744" height="130" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="175" width="6" height="130" rx="2" fill="#57534e"/>
  <circle cx="66" cy="235" r="20" fill="#57534e" opacity="0.15"/>
  <text x="66" y="241" font-size="18" fill="#57534e" text-anchor="middle" font-weight="900">感染</text>
  <text x="100" y="225" font-size="24" fill="#1e293b" font-weight="700">院內感染密度</text>
  <text x="100" y="251" font-size="16" fill="#57534e">感染密度（每千人日）= 感染總件次 ÷ 住民總住院日數 × 1000</text>
  <text x="100" y="271" font-size="16" fill="#57534e">入住後48小時以上發生才算院內感染，需排除入住時已存在的</text>
  <text x="100" y="291" font-size="16" fill="#57534e">泌尿道、呼吸道、皮膚、腸胃道四大常見類型分別追蹤</text>
  <rect x="620" y="183" width="136" height="115" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="234" font-size="16" fill="#57534e" text-anchor="middle">48 小時</text>
  <text x="688" y="254" font-size="16" fill="#57534e" text-anchor="middle">後發生</text>
  <rect x="28" y="325" width="744" height="120" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="325" width="6" height="120" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="380" r="20" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="386" font-size="18" fill="#a8a29e" text-anchor="middle" font-weight="900">住院</text>
  <text x="100" y="370" font-size="24" fill="#1e293b" font-weight="700">非計畫性轉急性住院率</text>
  <text x="100" y="396" font-size="16" fill="#57534e">計算：轉急性住院人次 ÷ 平均在院住民人數 × 100%</text>
  <text x="100" y="416" font-size="16" fill="#57534e">不包含事先安排的定期檢查或計畫性手術入院</text>
  <rect x="620" y="333" width="136" height="105" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="381" font-size="16" fill="#a8a29e" text-anchor="middle">非計畫</text>
  <text x="688" y="401" font-size="16" fill="#a8a29e" text-anchor="middle">性轉院</text>
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
