<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- Header (N=4) -->
  <rect x="50" y="50" width="700" height="76" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="400" y="84" font-size="22" fill="#1e293b" font-weight="700" text-anchor="middle" >照護計畫更新時程規範</text>
  <text x="400" y="108" font-size="15" fill="#57534e" text-anchor="middle" >依 B2 指標要求，不同時程對應不同更新義務</text>

  <!-- Row 1: y=160 -->
  <rect x="50" y="160" width="700" height="62" rx="8" fill="#ffffff"/>
  <rect x="50" y="160" width="6" height="62" rx="2" fill="#d97706"/>
  <circle cx="87" cy="191" r="16" fill="#d97706" opacity="0.15"/>
  <text x="87" y="197" font-size="16" fill="#d97706" font-weight="700" text-anchor="middle" >1</text>
  <text x="120" y="182" font-size="16" fill="#1e293b" font-weight="700" >入住 72 小時內</text>
  <text x="120" y="202" font-size="14" fill="#57534e" >完成初步多專業評估，建立第一版個別化服務計畫（最低要求）</text>
  <rect x="620" y="167" width="115" height="46" rx="6" fill="#d97706" opacity="0.12"/>
  <text x="677" y="187" font-size="14" fill="#d97706" font-weight="700" text-anchor="middle" >初次評估</text>
  <text x="677" y="203" font-size="14" fill="#d97706" text-anchor="middle" >72小時內</text>

  <!-- Row 2: y=235 -->
  <rect x="50" y="235" width="700" height="62" rx="8" fill="#ffffff"/>
  <rect x="50" y="235" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="87" cy="266" r="16" fill="#78716c" opacity="0.15"/>
  <text x="87" y="272" font-size="16" fill="#78716c" font-weight="700" text-anchor="middle" >2</text>
  <text x="120" y="257" font-size="16" fill="#1e293b" font-weight="700" >每月追蹤記錄</text>
  <text x="120" y="277" font-size="14" fill="#57534e" >各職類按月填寫服務執行記錄與評值，異常情形立即記錄並通報</text>
  <rect x="620" y="242" width="115" height="46" rx="6" fill="#78716c" opacity="0.12"/>
  <text x="677" y="262" font-size="14" fill="#78716c" font-weight="700" text-anchor="middle" >月度記錄</text>
  <text x="677" y="278" font-size="14" fill="#78716c" text-anchor="middle" >異常即時</text>

  <!-- Row 3: y=310 -->
  <rect x="50" y="310" width="700" height="62" rx="8" fill="#ffffff"/>
  <rect x="50" y="310" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="87" cy="341" r="16" fill="#57534e" opacity="0.15"/>
  <text x="87" y="347" font-size="16" fill="#57534e" font-weight="700" text-anchor="middle" >3</text>
  <text x="120" y="332" font-size="16" fill="#1e293b" font-weight="700" >每 3 個月重新評估</text>
  <text x="120" y="352" font-size="14" fill="#57534e" >重評身體（含營養）、心理、社會、認知及活動功能，召開個案會議</text>
  <rect x="620" y="317" width="115" height="46" rx="6" fill="#57534e" opacity="0.12"/>
  <text x="677" y="337" font-size="14" fill="#57534e" font-weight="700" text-anchor="middle" >季度重評</text>
  <text x="677" y="353" font-size="14" fill="#57534e" text-anchor="middle" >個案會議</text>

  <!-- Row 4: y=385 -->
  <rect x="50" y="385" width="700" height="62" rx="8" fill="#ffffff"/>
  <rect x="50" y="385" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="87" cy="416" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="87" y="422" font-size="16" fill="#a8a29e" font-weight="700" text-anchor="middle" >4</text>
  <text x="120" y="407" font-size="16" fill="#1e293b" font-weight="700" >每半年家屬共同修正</text>
  <text x="120" y="427" font-size="14" fill="#57534e" >與服務對象或家屬共同討論修正照護計畫，需有家屬簽名確認</text>
  <rect x="620" y="392" width="115" height="46" rx="6" fill="#a8a29e" opacity="0.12"/>
  <text x="677" y="412" font-size="14" fill="#a8a29e" font-weight="700" text-anchor="middle" >半年修訂</text>
  <text x="677" y="428" font-size="14" fill="#a8a29e" text-anchor="middle" >家屬參與</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" >報告汪 reportwang.com</text>
</svg>
