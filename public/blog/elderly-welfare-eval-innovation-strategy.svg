<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- 標題 -->
  <text x="400" y="50" font-size="26" fill="#1e293b" text-anchor="middle" font-weight="700" font-family="sans-serif">從合格到優等：加分策略 4 步驟</text>
  <!-- N=4: H=62, outer_gap=50, Row y: 145/220/295/370 -->
  <!-- Row 1 -->
  <rect x="50" y="145" width="700" height="62" rx="8" fill="#ffffff"/>
  <rect x="50" y="145" width="6" height="62" rx="3" fill="#9333ea"/>
  <circle cx="85" cy="176" r="16" fill="#9333ea" opacity="0.15"/>
  <text x="85" y="182" font-size="16" fill="#9333ea" text-anchor="middle" font-weight="700" font-family="sans-serif">1</text>
  <text x="118" y="169" font-size="17" fill="#1e293b" font-weight="700" font-family="sans-serif">優先確保必答題 A-D 全數達標</text>
  <text x="118" y="191" font-size="14" fill="#57534e" font-family="sans-serif">加分題以「必答題不失分」為前提，若 A-D 有扣分項目，應優先補強，再追求加分</text>
  <rect x="570" y="153" width="168" height="46" rx="6" fill="#9333ea" opacity="0.10"/>
  <text x="654" y="181" font-size="14" fill="#9333ea" text-anchor="middle" font-weight="600" font-family="sans-serif">基礎優先</text>
  <!-- Row 2 -->
  <rect x="50" y="220" width="700" height="62" rx="8" fill="#ffffff"/>
  <rect x="50" y="220" width="6" height="62" rx="3" fill="#d97706"/>
  <circle cx="85" cy="251" r="16" fill="#d97706" opacity="0.15"/>
  <text x="85" y="257" font-size="16" fill="#d97706" text-anchor="middle" font-weight="700" font-family="sans-serif">2</text>
  <text x="118" y="244" font-size="17" fill="#1e293b" font-weight="700" font-family="sans-serif">盤點現有創新服務項目</text>
  <text x="118" y="266" font-size="14" fill="#57534e" font-family="sans-serif">盤點機構已在執行但尚未申報的創新服務，例如：智慧設備、文化照護、政策試辦計畫</text>
  <rect x="570" y="228" width="168" height="46" rx="6" fill="#d97706" opacity="0.10"/>
  <text x="654" y="256" font-size="14" fill="#d97706" text-anchor="middle" font-weight="600" font-family="sans-serif">E2 盤點</text>
  <!-- Row 3 -->
  <rect x="50" y="295" width="700" height="62" rx="8" fill="#ffffff"/>
  <rect x="50" y="295" width="6" height="62" rx="3" fill="#78716c"/>
  <circle cx="85" cy="326" r="16" fill="#78716c" opacity="0.15"/>
  <text x="85" y="332" font-size="16" fill="#78716c" text-anchor="middle" font-weight="700" font-family="sans-serif">3</text>
  <text x="118" y="319" font-size="17" fill="#1e293b" font-weight="700" font-family="sans-serif">評估 F1-F3 建置成本與加分效益</text>
  <text x="118" y="341" font-size="14" fill="#57534e" font-family="sans-serif">F1 牙科機制建置成本低；F2 需配合志工；F3 閃光燈設施一次性投資，效益持久</text>
  <rect x="570" y="303" width="168" height="46" rx="6" fill="#78716c" opacity="0.10"/>
  <text x="654" y="331" font-size="14" fill="#78716c" text-anchor="middle" font-weight="600" font-family="sans-serif">效益分析</text>
  <!-- Row 4 -->
  <rect x="50" y="370" width="700" height="62" rx="8" fill="#ffffff"/>
  <rect x="50" y="370" width="6" height="62" rx="3" fill="#57534e"/>
  <circle cx="85" cy="401" r="16" fill="#57534e" opacity="0.15"/>
  <text x="85" y="407" font-size="16" fill="#57534e" text-anchor="middle" font-weight="700" font-family="sans-serif">4</text>
  <text x="118" y="394" font-size="17" fill="#1e293b" font-weight="700" font-family="sans-serif">提前 6 個月建置並留存佐證文件</text>
  <text x="118" y="416" font-size="14" fill="#57534e" font-family="sans-serif">加分項目需有「具體實踐成效」，臨時建置無效，需在評鑑前 6 個月完成並累積紀錄</text>
  <rect x="570" y="378" width="168" height="46" rx="6" fill="#57534e" opacity="0.10"/>
  <text x="654" y="406" font-size="14" fill="#57534e" text-anchor="middle" font-weight="600" font-family="sans-serif">提早準備</text>
  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" font-family="sans-serif">報告汪 reportwang.com</text>
</svg>