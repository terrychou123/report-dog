<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!--
    【自適應佈局 — 4 條範例】
    N=4, H=72, row_gap=10
    rows_block = 72×4 + 10×3 = 318
    gap = (500-56-318)/3 = 42

    Header y=42, bottom=98
    Row[0] y = 42+56+42 = 140
    Row[1] y = 140+82   = 222
    Row[2] y = 222+82   = 304
    Row[3] y = 304+82   = 386  bottom=458, 底部留白=42 ✓

    垂直置中公式（H=72, center=H/2=36）：
      Q  baseline = row_y + 36-5  = row_y+31
      R  baseline = row_y + 36+15 = row_y+51
      circle cy   = row_y + 36
      NUM text y  = row_y + 36+6  = row_y+42
      S rect h=46, S rect y = row_y+(72-46)/2 = row_y+13
      S1 baseline = row_y + 36-6  = row_y+30
      S2 baseline = row_y + 36+14 = row_y+50

    字數計算：
      M2 "5 大督導留才盲點 × 對應評鑑條文" = 15.5字 → 15-20 → 32px
      Q Row1 "督導機制形同虛設" = 8字 → ≤8 → 22px
      Q Row2 "教育訓練時數不足或內容無感" = 13字 → 13+ → 18px
      Q Row3 "不追蹤留任率數字，只靠感覺" = 13字 → 13+ → 18px
      Q Row4 "主任自己缺乏持續學習" = 10字 → 9-12 → 20px
      R / S1 / S2 全部 16px 不加粗
  -->

  <!-- Header（y=42, h=56） -->
  <rect x="0" y="42" width="800" height="56" fill="#e8e6de"/>
  <rect x="0" y="42" width="6" height="56" fill="#d97706"/>
  <text x="28" y="79" font-size="32" fill="#1e293b" font-weight="700">5 大督導留才盲點 × 對應評鑑條文</text>

  <!-- Row 1（y=140, H=72, center=176） -->
  <rect x="28" y="140" width="744" height="72" rx="10" fill="#e8e6de"/>
  <rect x="28" y="140" width="6" height="72" rx="2" fill="#d97706"/>
  <circle cx="66" cy="176" r="18" fill="#d97706" opacity="0.15"/>
  <text x="66" y="182" font-size="18" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <text x="100" y="171" font-size="22" fill="#1e293b" font-weight="700">督導機制形同虛設</text>
  <text x="100" y="191" font-size="16" fill="#57534e">個督頻率不足、督導內容流於形式，員工問題無法被發現與支持</text>
  <rect x="620" y="153" width="136" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="170" font-size="16" fill="#d97706" text-anchor="middle">第 9 條</text>
  <text x="688" y="190" font-size="16" fill="#d97706" text-anchor="middle">個督每半年一次</text>

  <!-- Row 2（y=222, H=72, center=258） -->
  <rect x="28" y="222" width="744" height="72" rx="10" fill="#e8e6de"/>
  <rect x="28" y="222" width="6" height="72" rx="2" fill="#78716c"/>
  <circle cx="66" cy="258" r="18" fill="#78716c" opacity="0.15"/>
  <text x="66" y="264" font-size="18" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <text x="100" y="253" font-size="18" fill="#1e293b" font-weight="700">教育訓練時數不足或內容無感</text>
  <text x="100" y="273" font-size="16" fill="#57534e">訓練只是簽到、網路課程超過上限，員工缺乏實質學習與成長</text>
  <rect x="620" y="235" width="136" height="46" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="252" font-size="16" fill="#78716c" text-anchor="middle">第 29 條</text>
  <text x="688" y="272" font-size="16" fill="#78716c" text-anchor="middle">在職 20 小時</text>

  <!-- Row 3（y=304, H=72, center=340） -->
  <rect x="28" y="304" width="744" height="72" rx="10" fill="#e8e6de"/>
  <rect x="28" y="304" width="6" height="72" rx="2" fill="#57534e"/>
  <circle cx="66" cy="340" r="18" fill="#57534e" opacity="0.15"/>
  <text x="66" y="346" font-size="18" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <text x="100" y="335" font-size="18" fill="#1e293b" font-weight="700">不追蹤留任率數字，只靠感覺</text>
  <text x="100" y="355" font-size="16" fill="#57534e">不知道如何計算留任率、離職原因未系統性收集與分析</text>
  <rect x="620" y="317" width="136" height="46" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="334" font-size="16" fill="#57534e" text-anchor="middle">第 30 條</text>
  <text x="688" y="354" font-size="16" fill="#57534e" text-anchor="middle">前四年度留任率</text>

  <!-- Row 4（y=386, H=72, center=422） -->
  <rect x="28" y="386" width="744" height="72" rx="10" fill="#e8e6de"/>
  <rect x="28" y="386" width="6" height="72" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="422" r="18" fill="#a8a29e" opacity="0.2"/>
  <text x="66" y="428" font-size="18" fill="#a8a29e" text-anchor="middle" font-weight="900">4</text>
  <text x="100" y="417" font-size="20" fill="#1e293b" font-weight="700">主任自己缺乏持續學習</text>
  <text x="100" y="437" font-size="16" fill="#57534e">主任忙於日常事務，未安排管理進修，缺乏新管理知能輸入</text>
  <rect x="620" y="399" width="136" height="46" rx="8" fill="#a8a29e" opacity="0.15"/>
  <text x="688" y="416" font-size="16" fill="#78716c" text-anchor="middle">第 31 條</text>
  <text x="688" y="436" font-size="16" fill="#78716c" text-anchor="middle">負責人每年 4 小時</text>

  <!-- 浮水印 -->
  <text x="760" y="488" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
