<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <text x="400" y="48"  font-size="32" font-weight="700" fill="#1e293b" text-anchor="middle">30 天必完成事項清單</text>
  <text x="400" y="78"  font-size="22" fill="#78716c" text-anchor="middle">新任主管評鑑準備核心確認項目</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#a8a29e" stroke-width="1.5"/>
  <!-- 兩欄佈局 -->
  <!-- 左欄 -->
  <text x="56" y="128"  font-size="16" font-weight="700" fill="#d97706">行政管理類</text>
  <rect x="40" y="138" width="348" height="38" rx="6" fill="#ffffff"/>
  <rect x="40" y="138" width="4" height="38" rx="2" fill="#d97706"/>
  <text x="54" y="154"  font-size="14" fill="#1e293b">A7 業務負責人資格文件備存</text>
  <text x="54" y="170"  font-size="14" fill="#78716c">含勞健保、勞退金投保更新</text>
  <rect x="40" y="184" width="348" height="38" rx="6" fill="#ffffff"/>
  <rect x="40" y="184" width="4" height="38" rx="2" fill="#d97706"/>
  <text x="54" y="200"  font-size="14" fill="#1e293b">A3 年度業務計畫確認執行狀況</text>
  <text x="54" y="216"  font-size="14" fill="#78716c">確認前一年度訂定，已按計畫執行</text>
  <rect x="40" y="230" width="348" height="38" rx="6" fill="#ffffff"/>
  <rect x="40" y="230" width="4" height="38" rx="2" fill="#d97706"/>
  <text x="54" y="246"  font-size="14" fill="#1e293b">A4 過去 4 年查核缺失彙整</text>
  <text x="54" y="262"  font-size="14" fill="#78716c">衛福、消防、建管、勞工均需涵蓋</text>
  <rect x="40" y="276" width="348" height="38" rx="6" fill="#ffffff"/>
  <rect x="40" y="276" width="4" height="38" rx="2" fill="#d97706"/>
  <text x="54" y="292"  font-size="14" fill="#1e293b">A6 危機管理計畫閱讀與確認</text>
  <text x="54" y="308"  font-size="14" fill="#78716c">至少 3 項風險，每半年檢討有記錄</text>
  <!-- 右欄 -->
  <text x="430" y="128"  font-size="16" font-weight="700" fill="#78716c">人力與品質類</text>
  <rect x="414" y="138" width="346" height="38" rx="6" fill="#ffffff"/>
  <rect x="414" y="138" width="4" height="38" rx="2" fill="#78716c"/>
  <text x="428" y="154"  font-size="14" fill="#1e293b">A9 護理人員配置（一級必要）達標</text>
  <text x="428" y="170"  font-size="14" fill="#78716c">全日均有護理師，執業登錄完成</text>
  <rect x="414" y="184" width="346" height="38" rx="6" fill="#ffffff"/>
  <rect x="414" y="184" width="4" height="38" rx="2" fill="#78716c"/>
  <text x="428" y="200"  font-size="14" fill="#1e293b">A11 照服員配置（一級必要）達標</text>
  <text x="428" y="216"  font-size="14" fill="#78716c">外籍人員比例確認，各班本國籍照服員</text>
  <rect x="414" y="230" width="346" height="38" rx="6" fill="#ffffff"/>
  <rect x="414" y="230" width="4" height="38" rx="2" fill="#78716c"/>
  <text x="428" y="246"  font-size="14" fill="#1e293b">A14 在職訓練年度計畫確認</text>
  <text x="428" y="262"  font-size="14" fill="#78716c">每人 20 小時，感染管制至少 4 小時</text>
  <rect x="414" y="276" width="346" height="38" rx="6" fill="#ffffff"/>
  <rect x="414" y="276" width="4" height="38" rx="2" fill="#78716c"/>
  <text x="428" y="292"  font-size="14" fill="#1e293b">B1 主持品質會議並留有記錄</text>
  <text x="428" y="308"  font-size="14" fill="#78716c">主管親自主持，讓名字出現在會議紀錄</text>
  <!-- 模擬評鑑欄 -->
  <rect x="40" y="330" width="720" height="60" rx="10" fill="#d97706"/>
  <text x="400" y="356"  font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">第 4 週：完成一次完整模擬評鑑自查</text>
  <text x="400" y="380"  font-size="15" fill="#fff3cd" text-anchor="middle">對照 75 條基準，確認 9 項一級必要項全部達標</text>
  <!-- E1提示 -->
  <rect x="40" y="408" width="720" height="44" rx="8" fill="#ffffff" stroke="#78716c" stroke-width="1.5"/>
  <text x="60" y="430"  font-size="15" font-weight="700" fill="#78716c">E1 前次評鑑建議：</text>
  <text x="220" y="430"  font-size="15" fill="#57534e">確認改善比例達 80% 以上，未改善項目需說明原因</text>
  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" >報告汪 reportwang.com</text>
</svg>
