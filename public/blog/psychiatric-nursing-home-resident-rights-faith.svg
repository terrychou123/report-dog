<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 主標題 -->
  <text x="40" y="48" font-size="32" fill="#1e293b" font-family="'Noto Sans TC', sans-serif" font-weight="bold">D1.1信仰尊重服務架構</text>
  <!-- 副標題 -->
  <text x="40" y="78" font-size="22" fill="#78716c" font-family="'Noto Sans TC', sans-serif">評鑑委員查核的三個面向</text>
  <!-- 分隔線 -->
  <line x1="40" y1="94" x2="760" y2="94" stroke="#dedad3" stroke-width="2"/>

  <!-- 行1 -->
  <rect x="40" y="118" width="720" height="68" rx="8" fill="white" opacity="0.7"/>
  <rect x="40" y="118" width="6" height="68" rx="3" fill="#d97706"/>
  <text x="70" y="147" font-size="22" fill="#d97706" font-family="'Noto Sans TC', sans-serif" font-weight="bold">宗教空間設置</text>
  <text x="70" y="174" font-size="17" fill="#57534e" font-family="'Noto Sans TC', sans-serif">機構應有宗教活動設施或空間，尊重各宗教信仰</text>

  <!-- 行2 -->
  <rect x="40" y="202" width="720" height="68" rx="8" fill="white" opacity="0.7"/>
  <rect x="40" y="202" width="6" height="68" rx="3" fill="#78716c"/>
  <text x="70" y="231" font-size="22" fill="#78716c" font-family="'Noto Sans TC', sans-serif" font-weight="bold">工作人員態度</text>
  <text x="70" y="258" font-size="17" fill="#57534e" font-family="'Noto Sans TC', sans-serif">工作人員需尊重住民的宗教信仰，有相關教育訓練</text>

  <!-- 行3 -->
  <rect x="40" y="286" width="720" height="68" rx="8" fill="white" opacity="0.7"/>
  <rect x="40" y="286" width="6" height="68" rx="3" fill="#57534e"/>
  <text x="70" y="315" font-size="22" fill="#57534e" font-family="'Noto Sans TC', sans-serif" font-weight="bold">心靈關懷服務</text>
  <text x="70" y="342" font-size="17" fill="#57534e" font-family="'Noto Sans TC', sans-serif">提供住民精神照護及心靈關懷，有服務紀錄</text>

  <!-- 行4 -->
  <rect x="40" y="370" width="720" height="68" rx="8" fill="white" opacity="0.7"/>
  <rect x="40" y="370" width="6" height="68" rx="3" fill="#a8a29e"/>
  <text x="70" y="399" font-size="22" fill="#a8a29e" font-family="'Noto Sans TC', sans-serif" font-weight="bold">紀錄留存</text>
  <text x="70" y="426" font-size="17" fill="#57534e" font-family="'Noto Sans TC', sans-serif">宗教活動相關紀錄，評鑑委員訪談住民及工作人員確認</text>

  <!-- 品牌浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-family="'Noto Sans TC', sans-serif">報告汪 reportwang.com</text>
</svg>
