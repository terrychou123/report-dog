<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <text x="40" y="48" font-size="32" font-weight="900" fill="#1e293b" >防疫機制自評確認清單</text>
  <text x="40" y="78" font-size="22" fill="#78716c" >評鑑前逐項確認B1.3的8項子要求</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#d97706" stroke-width="2"/>

  <!-- 左欄標題 -->
  <rect x="40" y="110" width="340" height="40" rx="6" fill="#d97706"/>
  <text x="210" y="136" font-size="20" font-weight="700" fill="white" text-anchor="middle" >人員管理</text>

  <!-- 左欄項目1 - 確認 -->
  <rect x="40" y="162" width="340" height="54" rx="6" fill="white"/>
  <circle cx="70" cy="189" r="14" fill="#16a34a"/>
  <text x="70" y="194" font-size="14" fill="white" text-anchor="middle" font-weight="700" >V</text>
  <text x="96" y="184" font-size="16" fill="#1e293b" >住民每日體溫記錄表</text>
  <text x="96" y="204" font-size="14" fill="#78716c" >已確認完整保存</text>

  <!-- 左欄項目2 - 確認 -->
  <rect x="40" y="228" width="340" height="54" rx="6" fill="white"/>
  <circle cx="70" cy="255" r="14" fill="#16a34a"/>
  <text x="70" y="260" font-size="14" fill="white" text-anchor="middle" font-weight="700" >V</text>
  <text x="96" y="250" font-size="16" fill="#1e293b" >感控專責人員指定</text>
  <text x="96" y="270" font-size="14" fill="#78716c" >有指定書面資料</text>

  <!-- 左欄項目3 - 待確認 -->
  <rect x="40" y="294" width="340" height="54" rx="6" fill="white"/>
  <circle cx="70" cy="321" r="14" fill="#d97706"/>
  <text x="70" y="326" font-size="16" fill="white" text-anchor="middle" font-weight="700" >!</text>
  <text x="96" y="316" font-size="16" fill="#1e293b" >8小時感控課程紀錄</text>
  <text x="96" y="336" font-size="14" fill="#d97706" >待確認 — 需補充佐證資料</text>

  <!-- 右欄標題 -->
  <rect x="420" y="110" width="340" height="40" rx="6" fill="#78716c"/>
  <text x="590" y="136" font-size="20" font-weight="700" fill="white" text-anchor="middle" >物資環境</text>

  <!-- 右欄項目1 - 確認 -->
  <rect x="420" y="162" width="340" height="54" rx="6" fill="white"/>
  <circle cx="450" cy="189" r="14" fill="#16a34a"/>
  <text x="450" y="194" font-size="14" fill="white" text-anchor="middle" font-weight="700" >V</text>
  <text x="476" y="184" font-size="16" fill="#1e293b" >感染管制計畫</text>
  <text x="476" y="204" font-size="14" fill="#78716c" >年度更新完成</text>

  <!-- 右欄項目2 - 確認 -->
  <rect x="420" y="228" width="340" height="54" rx="6" fill="white"/>
  <circle cx="450" cy="255" r="14" fill="#16a34a"/>
  <text x="450" y="260" font-size="14" fill="white" text-anchor="middle" font-weight="700" >V</text>
  <text x="476" y="250" font-size="16" fill="#1e293b" >1週物資儲備量</text>
  <text x="476" y="270" font-size="14" fill="#78716c" >已盤點並記錄有效期限</text>

  <!-- 右欄項目3 - 待確認 -->
  <rect x="420" y="294" width="340" height="54" rx="6" fill="white"/>
  <circle cx="450" cy="321" r="14" fill="#d97706"/>
  <text x="450" y="326" font-size="16" fill="white" text-anchor="middle" font-weight="700" >!</text>
  <text x="476" y="316" font-size="16" fill="#1e293b" >隔離空間規劃圖</text>
  <text x="476" y="336" font-size="14" fill="#d97706" >待確認 — 需繪製平面圖</text>

  <!-- 圖例說明 -->
  <circle cx="60" cy="398" r="10" fill="#16a34a"/>
  <text x="78" y="403" font-size="16" fill="#57534e" >已確認</text>
  <circle cx="160" cy="398" r="10" fill="#d97706"/>
  <text x="178" y="403" font-size="16" fill="#57534e" >待確認（需補強）</text>

  <!-- 提示 -->
  <rect x="40" y="420" width="720" height="40" rx="6" fill="#d97706" fill-opacity="0.12"/>
  <text x="400" y="445" font-size="18" fill="#d97706" text-anchor="middle" >評鑑前2週完成全部項目確認，確保零缺漏</text>

  <!-- 品牌浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" >報告汪 reportwang.com</text>
</svg>
