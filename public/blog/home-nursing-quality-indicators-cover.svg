<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 右側裝飾區塊 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>

  <!-- 右側裝飾大數字 -->
  <text x="1010" y="219" font-size="160" font-weight="900" fill="#d97706" text-anchor="middle" opacity="0.85">5+</text>
  <text x="1010" y="261" font-size="26" fill="#78716c" text-anchor="middle" font-weight="600">項品質指標定義</text>

  <!-- 右側 2×2 資訊卡片 -->
  <rect x="840" y="279" width="155" height="86" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="918" y="324" font-size="28" fill="#d97706" text-anchor="middle" font-weight="700">再住院率</text>
  <text x="918" y="339" font-size="22" fill="#a8a29e" text-anchor="middle">&lt;= 5%</text>

  <rect x="1005" y="279" width="155" height="86" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="1083" y="316" font-size="28" fill="#78716c" text-anchor="middle" font-weight="700">傷口癒合率</text>
  <text x="1083" y="347" font-size="22" fill="#a8a29e" text-anchor="middle">>= 85%</text>

  <rect x="840" y="375" width="155" height="86" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="918" y="412" font-size="28" fill="#78716c" text-anchor="middle" font-weight="700">滿意度</text>
  <text x="918" y="443" font-size="22" fill="#a8a29e" text-anchor="middle">>= 90%</text>

  <rect x="1005" y="375" width="155" height="86" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="1083" y="412" font-size="28" fill="#d97706" text-anchor="middle" font-weight="700">準時訪視率</text>
  <text x="1083" y="443" font-size="22" fill="#a8a29e" text-anchor="middle">>= 90%</text>

  <!-- 右側底部標籤 -->
  <rect x="840" y="471" width="320" height="52" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="1000" y="507" font-size="26" fill="#d97706" text-anchor="middle" font-weight="700">每季統計分析 · 持續改善</text>

  <rect x="840" y="535" width="320" height="52" rx="10" fill="#78716c" opacity="0.10"/>
  <text x="1000" y="569" font-size="24" fill="#78716c" text-anchor="middle" font-weight="600">閾值設定 · 改善計畫追蹤</text>

  <!-- 左側主內容區 -->
  <text x="60" y="200" font-size="110" font-weight="900" fill="#1e293b">居家護理所</text>
  <text x="60" y="338" font-size="110" font-weight="900" fill="#d97706">品質指標實務</text>

  <line x1="60" y1="365" x2="780" y2="365" stroke="#dedad3" stroke-width="2"/>

  <text x="60" y="416" font-size="36" fill="#57534e" font-weight="400">A5 基準 · 指標選定 · 閾值設定 · 季報撰寫</text>

  <!-- 特色標籤列 -->
  <rect x="60" y="450" width="148" height="54" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="134" y="487" font-size="28" fill="#d97706" text-anchor="middle" font-weight="600">品質指標</text>

  <rect x="220" y="450" width="148" height="54" rx="10" fill="#78716c" opacity="0.12"/>
  <text x="294" y="487" font-size="28" fill="#78716c" text-anchor="middle" font-weight="600">閾值設定</text>

  <rect x="380" y="450" width="148" height="54" rx="10" fill="#57534e" opacity="0.12"/>
  <text x="454" y="487" font-size="28" fill="#57534e" text-anchor="middle" font-weight="600">季報範本</text>

  <rect x="540" y="450" width="148" height="54" rx="10" fill="#a8a29e" opacity="0.18"/>
  <text x="614" y="487" font-size="28" fill="#78716c" text-anchor="middle" font-weight="600">A5 基準</text>

  <!-- 適用對象 -->
  <text x="60" y="558" font-size="28" fill="#94a3b8">適用對象：居家護理所負責人 · 護理長 · 品管人員</text>

  <!-- 浮水印 -->
  <text x="1140" y="585" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
