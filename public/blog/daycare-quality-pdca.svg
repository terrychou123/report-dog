<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"
     font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">品管指標 PDCA 管理循環</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">四個環節持續循環，讓照護品質不斷提升</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- PDCA 弧形箭頭（圓心 cx=400, cy=285） -->
  <!-- Plan（#d97706，14°→86°，尖@100°）-->
  <path d="M 431 159 A 130 130 0 0 1 530 276 L 545 275 L 498 302 L 453 281 L 468 280 A 68 68 0 0 0 416 219 Z"
        fill="#d97706"/>
  <!-- Do（#78716c，104°→176°，尖@190°）-->
  <path d="M 526 316 A 130 130 0 0 1 409 415 L 410 430 L 383 383 L 404 338 L 405 353 A 68 68 0 0 0 466 301 Z"
        fill="#78716c"/>
  <!-- Check（#57534e，194°→266°，尖@280°）-->
  <path d="M 369 411 A 130 130 0 0 1 270 294 L 255 295 L 303 268 L 347 289 L 332 290 A 68 68 0 0 0 384 351 Z"
        fill="#57534e"/>
  <!-- Act（#a8a29e，284°→356°，尖@10°）-->
  <path d="M 274 254 A 130 130 0 0 1 391 155 L 390 140 L 417 188 L 396 232 L 395 217 A 68 68 0 0 0 334 269 Z"
        fill="#a8a29e"/>

  <!-- 弧中點字母（r=99） -->
  <text x="476" y="227" text-anchor="middle" font-size="30" fill="white" font-weight="700">P</text>
  <text x="464" y="367" text-anchor="middle" font-size="30" fill="white" font-weight="700">D</text>
  <text x="324" y="355" text-anchor="middle" font-size="30" fill="white" font-weight="700">C</text>
  <text x="336" y="215" text-anchor="middle" font-size="30" fill="white" font-weight="700">A</text>

  <!-- 中央文字 -->
  <text x="400" y="278" text-anchor="middle" font-size="22" fill="#1e293b" font-weight="700">PDCA</text>
  <text x="400" y="302" text-anchor="middle" font-size="22" fill="#1e293b" font-weight="700">Cycle</text>

  <!-- ===== 右上角：Plan（#d97706）===== -->
  <rect x="555" y="130" width="6" height="24" rx="2" fill="#d97706"/>
  <text x="569" y="147" font-size="22" fill="#1e293b" font-weight="700">訂定指標目標</text>
  <line x1="555" y1="155" x2="790" y2="155" stroke="#dedad3" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="555" y="174" font-size="17" fill="#57534e">選定監測指標項目</text>
  <text x="555" y="196" font-size="17" fill="#57534e">設定每月達標數值</text>

  <!-- ===== 右下角：Do（#78716c）===== -->
  <rect x="555" y="365" width="6" height="24" rx="2" fill="#78716c"/>
  <text x="569" y="382" font-size="22" fill="#1e293b" font-weight="700">蒐集記錄數據</text>
  <line x1="555" y1="390" x2="790" y2="390" stroke="#dedad3" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="555" y="409" font-size="17" fill="#57534e">每日記錄指標數據</text>
  <text x="555" y="431" font-size="17" fill="#57534e">按月彙整統計報表</text>

  <!-- ===== 左下角：Check（#57534e）===== -->
  <rect x="10" y="365" width="6" height="24" rx="2" fill="#57534e"/>
  <text x="22" y="382" font-size="22" fill="#1e293b" font-weight="700">逐案分析異常</text>
  <line x1="10" y1="390" x2="245" y2="390" stroke="#dedad3" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="10" y="409" font-size="17" fill="#57534e">找出超標個案原因</text>
  <text x="10" y="431" font-size="17" fill="#57534e">確認處理措施成效</text>

  <!-- ===== 左上角：Act（#a8a29e）===== -->
  <rect x="10" y="130" width="6" height="24" rx="2" fill="#a8a29e"/>
  <text x="22" y="147" font-size="22" fill="#1e293b" font-weight="700">擬定改善方案</text>
  <line x1="10" y1="155" x2="245" y2="155" stroke="#dedad3" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="10" y="174" font-size="17" fill="#57534e">提出具體改善對策</text>
  <text x="10" y="196" font-size="17" fill="#57534e">追蹤下月改善成效</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
