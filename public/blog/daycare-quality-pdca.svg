<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460">
  <!-- 背景：米黃暖色 -->
  <rect width="800" height="460" fill="#f0efe8"/>

  <!-- 標題區 -->
  <rect x="0" y="0" width="800" height="56" fill="#78716c"/>
  <text x="32" y="22" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="rgba(255,255,255,0.85)">品管指標管理</text>
  <text x="32" y="44" font-family="'Noto Sans TC', sans-serif" font-size="20" fill="white" font-weight="700">PDCA 品質管理循環</text>

  <!-- ===== PDCA 圓形圖 ===== -->
  <!-- 外圈裝飾 -->
  <circle cx="272" cy="272" r="190" fill="white" stroke="#e8e5de" stroke-width="1.5"/>

  <!-- P 象限 (左上, 0~90度) — 暖灰藍 -->
  <path d="M 272 272 L 272 82 A 190 190 0 0 1 462 272 Z" fill="#94a3b8" opacity="0.9"/>
  <!-- D 象限 (右上, 90~180度) — 暖褐 -->
  <path d="M 272 272 L 462 272 A 190 190 0 0 1 272 462 Z" fill="#a8a29e" opacity="0.9"/>
  <!-- C 象限 (右下, 180~270度) — 琥珀 -->
  <path d="M 272 272 L 272 462 A 190 190 0 0 1 82 272 Z" fill="#d97706" opacity="0.9"/>
  <!-- A 象限 (左下, 270~360度) — 深灰褐 -->
  <path d="M 272 272 L 82 272 A 190 190 0 0 1 272 82 Z" fill="#78716c" opacity="0.9"/>

  <!-- 中心白圓 -->
  <circle cx="272" cy="272" r="70" fill="white" stroke="#e8e5de" stroke-width="2"/>
  <text x="272" y="262" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="15" fill="#1e293b" font-weight="700">品管</text>
  <text x="272" y="282" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="15" fill="#1e293b" font-weight="700">循環</text>
  <text x="272" y="300" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#64748b">PDCA</text>

  <!-- 象限標籤 -->
  <!-- P -->
  <text x="340" y="160" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="28" fill="white" font-weight="900">P</text>
  <text x="340" y="186" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" font-weight="600">Plan</text>
  <!-- D -->
  <text x="376" y="340" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="28" fill="white" font-weight="900">D</text>
  <text x="376" y="366" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" font-weight="600">Do</text>
  <!-- C -->
  <text x="204" y="380" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="28" fill="white" font-weight="900">C</text>
  <text x="204" y="406" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" font-weight="600">Check</text>
  <!-- A -->
  <text x="168" y="204" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="28" fill="white" font-weight="900">A</text>
  <text x="168" y="230" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" font-weight="600">Act</text>

  <!-- 循環箭頭提示 -->
  <text x="272" y="75" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="16" fill="#64748b">↻</text>

  <!-- ===== 右側說明卡片 ===== -->
  <!-- P 卡片 -->
  <rect x="490" y="72" width="286" height="84" rx="10" fill="white" stroke="#dedad3" stroke-width="1.5"/>
  <rect x="490" y="72" width="6" height="84" rx="3" fill="#94a3b8"/>
  <text x="510" y="92" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#64748b" font-weight="700">P — Plan　自訂指標</text>
  <rect x="510" y="100" width="80" height="20" rx="5" fill="#f0efe8"/>
  <text x="550" y="114" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="10" fill="#94a3b8">選定指標項目</text>
  <rect x="600" y="100" width="80" height="20" rx="5" fill="#f0efe8"/>
  <text x="640" y="114" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="10" fill="#94a3b8">設定目標數值</text>
  <text x="510" y="142" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#64748b">訂定計算公式、資料來源與負責人員</text>

  <!-- D 卡片 -->
  <rect x="490" y="170" width="286" height="84" rx="10" fill="white" stroke="#dedad3" stroke-width="1.5"/>
  <rect x="490" y="170" width="6" height="84" rx="3" fill="#a8a29e"/>
  <text x="510" y="190" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#64748b" font-weight="700">D — Do　每月追蹤</text>
  <rect x="510" y="198" width="80" height="20" rx="5" fill="#f0efe8"/>
  <text x="550" y="212" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="10" fill="#a8a29e">每月收集數據</text>
  <rect x="600" y="198" width="80" height="20" rx="5" fill="#f0efe8"/>
  <text x="640" y="212" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="10" fill="#a8a29e">填入追蹤表格</text>
  <text x="510" y="240" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#64748b">建立月報表，持續累積歷史數據</text>

  <!-- C 卡片 -->
  <rect x="490" y="268" width="286" height="84" rx="10" fill="white" stroke="#dedad3" stroke-width="1.5"/>
  <rect x="490" y="268" width="6" height="84" rx="3" fill="#d97706"/>
  <text x="510" y="288" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#64748b" font-weight="700">C — Check　異常分析</text>
  <rect x="510" y="296" width="80" height="20" rx="5" fill="#f0efe8"/>
  <text x="550" y="310" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="10" fill="#d97706">比對目標差距</text>
  <rect x="600" y="296" width="80" height="20" rx="5" fill="#f0efe8"/>
  <text x="640" y="310" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="10" fill="#d97706">逐案根因分析</text>
  <text x="510" y="338" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#64748b">異常個案需書面說明原因</text>

  <!-- A 卡片 -->
  <rect x="490" y="366" width="286" height="68" rx="10" fill="white" stroke="#dedad3" stroke-width="1.5"/>
  <rect x="490" y="366" width="6" height="68" rx="3" fill="#78716c"/>
  <text x="510" y="386" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#64748b" font-weight="700">A — Act　擬定改善</text>
  <rect x="510" y="394" width="80" height="20" rx="5" fill="#f0efe8"/>
  <text x="550" y="408" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="10" fill="#78716c">撰寫改善方案</text>
  <rect x="600" y="394" width="80" height="20" rx="5" fill="#f0efe8"/>
  <text x="640" y="408" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="10" fill="#78716c">更新 SOP 流程</text>

  <!-- 底部 -->
  <rect x="0" y="440" width="800" height="20" fill="#e8e5de"/>
  <text x="400" y="454" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#c4bfb8">PDCA 品管循環 · 日照中心品管指標管理 · 報告汪 reportwang.com</text>
</svg>
