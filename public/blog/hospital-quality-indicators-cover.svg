<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', sans-serif">
  <rect width="1200" height="630" fill="#f0efe8"/>

  <!-- 右側裝飾區塊 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>

  <!-- 右側大數字 4 -->
  <text x="1010" y="270" text-anchor="middle" font-size="200" fill="#d97706" font-weight="900" opacity="0.85">4</text>
  <text x="1010" y="318" text-anchor="middle" font-size="24" fill="#78716c" font-weight="600">品質指標選定四大標準</text>

  <!-- 右側資訊卡片 -->
  <rect x="840" y="346" width="320" height="52" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="1000" y="379" text-anchor="middle" font-size="24" fill="#d97706" font-weight="700">臨床意義 · 可測量性</text>

  <rect x="840" y="408" width="320" height="52" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="1000" y="441" text-anchor="middle" font-size="24" fill="#78716c" font-weight="700">改善可行性 · 三面向</text>

  <rect x="840" y="470" width="320" height="52" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="1000" y="503" text-anchor="middle" font-size="24" fill="#57534e" font-weight="700">臨床 × 效率 × 安全</text>

  <!-- 右側底部標籤 -->
  <rect x="840" y="532" width="320" height="46" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="1000" y="562" text-anchor="middle" font-size="24" fill="#d97706" font-weight="700">資料查核 ＋ 訪談</text>

  <!-- 左側主標題 -->
  <text x="60" y="200" font-size="108" fill="#1e293b" font-weight="900">品質指標</text>
  <text x="60" y="318" font-size="96" fill="#d97706" font-weight="900">如何選、如何追？</text>

  <!-- 左側分隔線 -->
  <line x1="60" y1="348" x2="780" y2="348" stroke="#dedad3" stroke-width="2"/>

  <!-- 左側副標題 -->
  <text x="60" y="390" font-size="32" fill="#57534e">2.2.1 必要條文 × PDCA持續改善管理完整攻略</text>

  <!-- 特色標籤列 -->
  <rect x="60" y="420" width="148" height="48" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="134" y="452" text-anchor="middle" font-size="24" fill="#d97706" font-weight="600">指標選定依據</text>

  <rect x="220" y="420" width="148" height="48" rx="10" fill="#78716c" opacity="0.12"/>
  <text x="294" y="452" text-anchor="middle" font-size="24" fill="#78716c" font-weight="600">目標值設定</text>

  <rect x="380" y="420" width="148" height="48" rx="10" fill="#57534e" opacity="0.12"/>
  <text x="454" y="452" text-anchor="middle" font-size="24" fill="#57534e" font-weight="600">PDCA追蹤</text>

  <rect x="540" y="420" width="148" height="48" rx="10" fill="#0d9488" opacity="0.12"/>
  <text x="614" y="452" text-anchor="middle" font-size="24" fill="#0d9488" font-weight="600">委員訪談準備</text>

  <!-- 第二排標籤 -->
  <rect x="60" y="480" width="148" height="48" rx="10" fill="#16a34a" opacity="0.12"/>
  <text x="134" y="512" text-anchor="middle" font-size="24" fill="#16a34a" font-weight="600">全國基準值</text>

  <rect x="220" y="480" width="148" height="48" rx="10" fill="#4f46e5" opacity="0.12"/>
  <text x="294" y="512" text-anchor="middle" font-size="24" fill="#4f46e5" font-weight="600">品管月報</text>

  <rect x="380" y="480" width="148" height="48" rx="10" fill="#9333ea" opacity="0.12"/>
  <text x="454" y="512" text-anchor="middle" font-size="24" fill="#9333ea" font-weight="600">改善計畫追蹤</text>

  <!-- 適用對象 -->
  <text x="60" y="562" font-size="24" fill="#a8a29e">適用：醫院品管人員、護理主管、評鑑協調人員</text>

  <!-- 浮水印 -->
  <text x="1140" y="612" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
