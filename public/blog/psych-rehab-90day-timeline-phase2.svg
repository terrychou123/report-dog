<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- @template: list-4 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- Header (y=50, h=62) -->
  <rect x="0" y="50" width="800" height="62" fill="white"/>
  <rect x="0" y="50" width="6" height="63" fill="#d97706" rx="2"/>
  <text x="28" y="83" font-size="32" fill="#1e293b" font-weight="700">第二階段 D-60 至 D-30：文件整備期</text>

  <!-- Row 1（y=160）D-60 PFM訓練 #d97706 -->
  <rect x="28" y="160" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="160" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="66" cy="191" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="197" font-size="14" fill="#d97706" text-anchor="middle" font-weight="900">D-60</text>
  <text x="100" y="185" font-size="22" fill="#1e293b" font-weight="700">PFM 訓練正式啟動</text>
  <text x="100" y="207" font-size="16" fill="#57534e">每週情境演練：2.8 藥物自管（說出藥名）、2.12 社區融合（描述上次外出）</text>
  <rect x="620" y="168" width="136" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="186" font-size="15" fill="#d97706" text-anchor="middle">每週演練</text>
  <text x="688" y="206" font-size="15" fill="#d97706" text-anchor="middle">真實訓練</text>

  <!-- Row 2（y=235）D-50 住宿型3.11 警示列（特殊強調，以紅色 S-box 和說明文標示） -->
  <rect x="28" y="235" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="235" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="66" cy="266" r="16" fill="#dc2626"/>
  <text x="66" y="271" font-size="18" fill="white" text-anchor="middle" font-weight="700">!</text>
  <text x="100" y="260" font-size="22" fill="#1e293b" font-weight="700">住宿型 3.11 出入自由機制確認（D-50）</text>
  <text x="100" y="282" font-size="16" fill="#dc2626">門禁可從內側開啟，訂定合理外出登記制度，不得以設施設備限制住民</text>
  <rect x="620" y="243" width="136" height="46" rx="8" fill="#dc2626" opacity="0.12"/>
  <text x="688" y="261" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="700">住宿型必做</text>
  <text x="688" y="281" font-size="14" fill="#dc2626" text-anchor="middle">未達C不合格</text>

  <!-- Row 3（y=310）D-40 第一輪內部評核 #57534e -->
  <rect x="28" y="310" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="310" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="341" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="347" font-size="14" fill="#57534e" text-anchor="middle" font-weight="900">D-40</text>
  <text x="100" y="335" font-size="22" fill="#1e293b" font-weight="700">第一輪模擬內部評核</text>
  <text x="100" y="357" font-size="16" fill="#57534e">非負責人同事交叉審查，模擬委員視角提出補強建議，查核文件完整性</text>
  <rect x="620" y="318" width="136" height="46" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="336" font-size="15" fill="#57534e" text-anchor="middle">交叉審查</text>
  <text x="688" y="356" font-size="15" fill="#57534e" text-anchor="middle">找出盲點</text>

  <!-- Row 4（y=385）D-30 全員說明 #a8a29e -->
  <rect x="28" y="385" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="385" width="6" height="62" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="416" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="422" font-size="14" fill="#a8a29e" text-anchor="middle" font-weight="900">D-30</text>
  <text x="100" y="410" font-size="22" fill="#1e293b" font-weight="700">進入第三階段：全員評鑑說明會</text>
  <text x="100" y="432" font-size="16" fill="#57534e">所有文件初步整備完成，向全體工作人員說明評鑑流程與各自職責</text>
  <rect x="620" y="393" width="136" height="46" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="411" font-size="15" fill="#a8a29e" text-anchor="middle">轉入演練</text>
  <text x="688" y="431" font-size="15" fill="#a8a29e" text-anchor="middle">全員備戰</text>

  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
