<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- 背景 -->
  <rect width="800" height="500" fill="#fafaf9"/>

  <!-- 標題區 -->
  <rect x="0" y="0" width="800" height="110" fill="#f5f5f4"/>
  <text x="400" y="52" text-anchor="middle" font-size="24" font-weight="900" fill="#1c1917">全年教育訓練追蹤管理曆</text>
  <text x="400" y="84" text-anchor="middle" font-size="14" fill="#78716c">按季追蹤確保訓練紀錄完整，評鑑前可快速調閱</text>

  <!-- Q1：第一季 -->
  <rect x="38" y="120" width="724" height="82" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <rect x="38" y="120" width="8" height="82" rx="4" fill="#d97706"/>
  <!-- 季別標籤 -->
  <rect x="54" y="135" width="108" height="24" rx="12" fill="#fef3c7"/>
  <text x="108" y="152" text-anchor="middle" font-size="14" fill="#d97706" font-weight="700">第一季（1-3月）</text>
  <text x="54" y="182" font-size="14" fill="#78716c">訂定年度在職訓練計畫、核對上年度新進人員職前訓練完成率、</text>
  <text x="54" y="198" font-size="14" fill="#78716c">醫師護理CME學分年初清點</text>
  <rect x="628" y="138" width="88" height="28" rx="14" fill="#fef3c7"/>
  <text x="672" y="157" text-anchor="middle" font-size="14" fill="#d97706" font-weight="700">計畫啟動</text>

  <!-- Q2：第二季 -->
  <rect x="38" y="212" width="724" height="82" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <rect x="38" y="212" width="8" height="82" rx="4" fill="#78716c"/>
  <rect x="54" y="227" width="108" height="24" rx="12" fill="#f5f5f4"/>
  <text x="108" y="244" text-anchor="middle" font-size="14" fill="#78716c" font-weight="700">第二季（4-6月）</text>
  <text x="54" y="274" font-size="14" fill="#78716c">執行上半年在職訓練課程、收集出席記錄、</text>
  <text x="54" y="290" font-size="14" fill="#78716c">職前訓練效果評估歸檔</text>
  <rect x="628" y="230" width="88" height="28" rx="14" fill="#f5f5f4"/>
  <text x="672" y="249" text-anchor="middle" font-size="14" fill="#78716c" font-weight="700">執行記錄</text>

  <!-- Q3：第三季 -->
  <rect x="38" y="304" width="724" height="82" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <rect x="38" y="304" width="8" height="82" rx="4" fill="#57534e"/>
  <rect x="54" y="319" width="108" height="24" rx="12" fill="#f5f5f4"/>
  <text x="108" y="336" text-anchor="middle" font-size="14" fill="#57534e" font-weight="700">第三季（7-9月）</text>
  <text x="54" y="366" font-size="14" fill="#78716c">上半年訓練成效評估、針對未達時數人員安排補訓、</text>
  <text x="54" y="382" font-size="14" fill="#78716c">CME學分進度中期確認</text>
  <rect x="628" y="322" width="88" height="28" rx="14" fill="#f5f5f4"/>
  <text x="672" y="341" text-anchor="middle" font-size="14" fill="#57534e" font-weight="700">中期確認</text>

  <!-- Q4：第四季 -->
  <rect x="38" y="396" width="724" height="82" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <rect x="38" y="396" width="8" height="82" rx="4" fill="#a8a29e"/>
  <rect x="54" y="411" width="114" height="24" rx="12" fill="#f5f5f4"/>
  <text x="111" y="428" text-anchor="middle" font-size="14" fill="#a8a29e" font-weight="700">第四季（10-12月）</text>
  <text x="54" y="458" font-size="14" fill="#78716c">年度訓練收尾、確認全員達標、準備訓練紀錄供評鑑查核、</text>
  <text x="54" y="474" font-size="14" fill="#78716c">次年計畫規劃</text>
  <rect x="628" y="414" width="88" height="28" rx="14" fill="#f5f5f4"/>
  <text x="672" y="433" text-anchor="middle" font-size="14" fill="#a8a29e" font-weight="700">年度總結</text>

  <!-- 浮水印 -->
  <text x="400" y="497" text-anchor="middle" font-size="14" fill="#a8a29e" opacity="0.6">報告汪 reportwang.com</text>
</svg>
