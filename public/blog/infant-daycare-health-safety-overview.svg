<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- Header -->
  <rect x="0" y="0" width="800" height="100" fill="white"/>
  <rect x="0" y="0" width="6" height="100" fill="#d97706"/>
  <text x="28" y="50" font-size="30" fill="#1e293b" font-weight="700">健康安全 40 分：5 個子類總覽</text>
  <text x="28" y="78" font-size="18" fill="#78716c">臺北市114-116年度 指標37-60 分類說明</text>

  <!-- Row 1：健康管理 y=118 -->
  <rect x="28" y="118" width="744" height="60" rx="8" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="118" width="6" height="60" rx="2" fill="#d97706"/>
  <circle cx="66" cy="148" r="18" fill="#d97706" opacity="0.15"/>
  <text x="66" y="154" font-size="15" fill="#d97706" text-anchor="middle" font-weight="900">A</text>
  <text x="100" y="140" font-size="22" fill="#1e293b" font-weight="700">健康管理（指標37-39）</text>
  <text x="100" y="164" font-size="15" fill="#57534e">嬰幼兒健康追蹤、入托健康檢查、異常通報機制 — 以個別健康記錄本為核心佐證</text>
  <rect x="660" y="130" width="96" height="36" rx="6" fill="#d97706" opacity="0.12"/>
  <text x="708" y="153" font-size="15" fill="#d97706" text-anchor="middle" font-weight="600">3項 · 文件</text>

  <!-- Row 2：飲食安全 y=191 -->
  <rect x="28" y="191" width="744" height="60" rx="8" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="191" width="6" height="60" rx="2" fill="#78716c"/>
  <circle cx="66" cy="221" r="18" fill="#78716c" opacity="0.15"/>
  <text x="66" y="227" font-size="15" fill="#78716c" text-anchor="middle" font-weight="900">B</text>
  <text x="100" y="213" font-size="22" fill="#1e293b" font-weight="700">飲食安全（指標40-44）</text>
  <text x="100" y="237" font-size="15" fill="#57534e">菜單留存、食物留樣7°C/48hr、冰箱溫度0-7°C — 量化標準最密集，每日記錄不可中斷</text>
  <rect x="660" y="203" width="96" height="36" rx="6" fill="#78716c" opacity="0.12"/>
  <text x="708" y="226" font-size="15" fill="#78716c" text-anchor="middle" font-weight="600">5項 · 量化</text>

  <!-- Row 3：環境衛生 y=264 -->
  <rect x="28" y="264" width="744" height="60" rx="8" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="264" width="6" height="60" rx="2" fill="#57534e"/>
  <circle cx="66" cy="294" r="18" fill="#57534e" opacity="0.15"/>
  <text x="66" y="300" font-size="15" fill="#57534e" text-anchor="middle" font-weight="900">C</text>
  <text x="100" y="286" font-size="22" fill="#1e293b" font-weight="700">環境衛生（指標45-51）</text>
  <text x="100" y="310" font-size="15" fill="#57534e">環境消毒頻率、廁所清潔、廚房衛生、廢棄物管理 — 結合實地觀察與清潔記錄</text>
  <rect x="660" y="276" width="96" height="36" rx="6" fill="#57534e" opacity="0.12"/>
  <text x="708" y="299" font-size="15" fill="#57534e" text-anchor="middle" font-weight="600">7項 · 混合</text>

  <!-- Row 4：設備安全 y=337 -->
  <rect x="28" y="337" width="744" height="60" rx="8" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="337" width="6" height="60" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="367" r="18" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="373" font-size="15" fill="#78716c" text-anchor="middle" font-weight="900">D</text>
  <text x="100" y="359" font-size="22" fill="#1e293b" font-weight="700">設備安全（指標52-57）</text>
  <text x="100" y="383" font-size="15" fill="#57534e">寢具安全（指標55禁枕）、玩具安全、設施維護記錄 — 實地查核為主，記錄輔助</text>
  <rect x="660" y="349" width="96" height="36" rx="6" fill="#a8a29e" opacity="0.12"/>
  <text x="708" y="372" font-size="15" fill="#78716c" text-anchor="middle" font-weight="600">6項 · 觀察</text>

  <!-- Row 5：健康照護 y=410 -->
  <rect x="28" y="410" width="744" height="60" rx="8" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="410" width="6" height="60" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="440" r="18" fill="#94a3b8" opacity="0.15"/>
  <text x="66" y="446" font-size="15" fill="#94a3b8" text-anchor="middle" font-weight="900">E</text>
  <text x="100" y="432" font-size="22" fill="#1e293b" font-weight="700">健康照護（指標58-60）</text>
  <text x="100" y="456" font-size="15" fill="#57534e">用藥管理、急救設備、感染管制手冊（依疾管署最新版）— 手冊版本須為現行版</text>
  <rect x="660" y="422" width="96" height="36" rx="6" fill="#94a3b8" opacity="0.12"/>
  <text x="708" y="445" font-size="15" fill="#94a3b8" text-anchor="middle" font-weight="600">3項 · 文件</text>

  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
