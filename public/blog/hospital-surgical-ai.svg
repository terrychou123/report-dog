  <!-- 列1：手術安全品質指標報告 -->
  <rect x="40" y="100" width="720" height="90" rx="12" fill="#ffffff" stroke="#e8e6de" stroke-width="1.5"/>
  <rect x="40" y="100" width="6" height="90" rx="2" fill="#d97706"/>
