<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <rect x="0" y="29" width="800" height="60" fill="#e8e6de"/>
  <rect x="0" y="29" width="6" height="60" rx="2" fill="#d97706"/>
  <text x="28" y="74" font-size="28" fill="#1e293b" font-weight="700">護產人員 1.4 倍配置計算四步驟</text>
  <rect x="28" y="118" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="118" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="66" cy="149" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="155" font-size="14" fill="#d97706" text-anchor="middle" font-weight="900">步驟1</text>
  <text x="100" y="139" font-size="18" fill="#1e293b" font-weight="700">確認服務對象總人數</text>
  <text x="100" y="160" font-size="16" fill="#57534e">統計當班在院產婦與嬰兒的實際人數（分開計算）</text>
  <rect x="620" y="126" width="136" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="145" font-size="16" fill="#d97706" text-anchor="middle">服務</text>
  <text x="688" y="165" font-size="16" fill="#d97706" text-anchor="middle">對象</text>
  <rect x="28" y="191" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="191" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="66" cy="222" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="228" font-size="14" fill="#78716c" text-anchor="middle" font-weight="900">步驟2</text>
  <text x="100" y="212" font-size="18" fill="#1e293b" font-weight="700">計算法定所需人力</text>
  <text x="100" y="233" font-size="16" fill="#57534e">法定照護比 = 服務對象數 ÷ 1.4（無條件進位）</text>
  <rect x="620" y="199" width="136" height="46" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="218" font-size="16" fill="#78716c" text-anchor="middle">除以</text>
  <text x="688" y="238" font-size="16" fill="#78716c" text-anchor="middle">1.4</text>
  <rect x="28" y="264" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="264" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="295" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="301" font-size="14" fill="#57534e" text-anchor="middle" font-weight="900">步驟3</text>
  <text x="100" y="285" font-size="18" fill="#1e293b" font-weight="700">確認排班人力符合</text>
  <text x="100" y="306" font-size="16" fill="#57534e">當班護產人員數需大於等於計算所需最低人力</text>
  <rect x="620" y="272" width="136" height="46" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="291" font-size="16" fill="#57534e" text-anchor="middle">排班</text>
  <text x="688" y="311" font-size="16" fill="#57534e" text-anchor="middle">確認</text>
  <rect x="28" y="337" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="337" width="6" height="62" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="368" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="374" font-size="14" fill="#a8a29e" text-anchor="middle" font-weight="900">步驟4</text>
  <text x="100" y="358" font-size="18" fill="#1e293b" font-weight="700">排班表存檔備查</text>
  <text x="100" y="379" font-size="16" fill="#57534e">日夜班排班表完整留存，評鑑委員可直接查閱</text>
  <rect x="620" y="345" width="136" height="46" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="364" font-size="16" fill="#a8a29e" text-anchor="middle">排班</text>
  <text x="688" y="384" font-size="16" fill="#a8a29e" text-anchor="middle">存檔</text>
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>