<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- Header -->
  <rect x="28" y="29" width="744" height="62" rx="8" fill="#1e293b"/>
  <text x="400" y="68"  font-size="22" font-weight="700" fill="white" text-anchor="middle">備審文件準備實用技巧</text>
  <!-- Row 1 -->
  <rect x="28" y="118" width="744" height="60" rx="8" fill="white"/>
  <rect x="28" y="118" width="6" height="60" rx="2" fill="#d97706"/>
  <circle cx="66" cy="148" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="154"  font-size="14" font-weight="700" fill="white" text-anchor="middle">01</text>
  <text x="100" y="144"  font-size="17" font-weight="600" fill="#1e293b">以評鑑項目編號建立文件資料夾</text>
  <text x="100" y="167"  font-size="14" fill="#78716c">每個項目建立獨立子資料夾，方便委員快速找到對應佐證文件</text>
  <rect x="620" y="125" width="136" height="46" rx="8" fill="#fef3c7" opacity="0.12"/>
  <text x="688" y="152"  font-size="14" font-weight="600" fill="#d97706" text-anchor="middle">文件整備</text>
  <!-- Row 2 -->
  <rect x="28" y="191" width="744" height="60" rx="8" fill="white"/>
  <rect x="28" y="191" width="6" height="60" rx="2" fill="#78716c"/>
  <circle cx="66" cy="221" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="227"  font-size="14" font-weight="700" fill="white" text-anchor="middle">02</text>
  <text x="100" y="217"  font-size="17" font-weight="600" fill="#1e293b">主管機關查核項目另立清單追蹤</text>
  <text x="100" y="240"  font-size="14" fill="#78716c">項目 4、5、6、7-14 由主管機關評分，平日即應持續維護記錄</text>
  <rect x="620" y="198" width="136" height="46" rx="8" fill="#f1f5f9" opacity="0.12"/>
  <text x="688" y="225"  font-size="14" font-weight="600" fill="#78716c" text-anchor="middle">日常維護</text>
  <!-- Row 3 -->
  <rect x="28" y="264" width="744" height="60" rx="8" fill="white"/>
  <rect x="28" y="264" width="6" height="60" rx="2" fill="#57534e"/>
  <circle cx="66" cy="294" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="300"  font-size="14" font-weight="700" fill="white" text-anchor="middle">03</text>
  <text x="100" y="290"  font-size="17" font-weight="600" fill="#1e293b">參、專業服務需區分雙版本</text>
  <text x="100" y="313"  font-size="14" fill="#78716c">2 歲以下（項目 17-20）與 2 歲以上（項目 21-24）分開整理，避免混用</text>
  <rect x="620" y="271" width="136" height="46" rx="8" fill="#f1f5f9" opacity="0.12"/>
  <text x="688" y="298"  font-size="14" font-weight="600" fill="#57534e" text-anchor="middle">版本管控</text>
  <!-- Row 4 -->
  <rect x="28" y="337" width="744" height="60" rx="8" fill="white"/>
  <rect x="28" y="337" width="6" height="60" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="367" r="16" fill="#94a3b8" opacity="0.15"/>
  <text x="66" y="373"  font-size="14" font-weight="700" fill="white" text-anchor="middle">04</text>
  <text x="100" y="363"  font-size="17" font-weight="600" fill="#1e293b">申訴紀錄與零用金紀錄須持續累積</text>
  <text x="100" y="386"  font-size="14" fill="#78716c">項目 25 要求每月家庭會議紀錄與零用金簽收，臨時補件難以顯示真實執行</text>
  <rect x="620" y="344" width="136" height="46" rx="8" fill="#f1f5f9" opacity="0.12"/>
  <text x="688" y="371"  font-size="14" font-weight="600" fill="#94a3b8" text-anchor="middle">持續累積</text>
  <!-- Row 5 -->
  <rect x="28" y="410" width="744" height="60" rx="8" fill="white"/>
  <rect x="28" y="410" width="6" height="60" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="440" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="446"  font-size="14" font-weight="700" fill="white" text-anchor="middle">05</text>
  <text x="100" y="436"  font-size="17" font-weight="600" fill="#1e293b">使用 AI 工具輔助查漏補缺</text>
  <text x="100" y="459"  font-size="14" fill="#78716c">AI 可依評鑑項目自動提示缺漏文件，大幅縮短人工逐項比對時間</text>
  <rect x="620" y="417" width="136" height="46" rx="8" fill="#fef3c7" opacity="0.12"/>
  <text x="688" y="444"  font-size="14" font-weight="600" fill="#d97706" text-anchor="middle">效率提升</text>
  <!-- Watermark -->
  <text x="760" y="480" font-size="16"  fill="#d97706" text-anchor="end">報告汪 reportwang.com</text>
</svg>
