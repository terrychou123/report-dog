<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- Header -->
  <rect x="28" y="29" width="744" height="62" rx="8" fill="#1e293b"/>
  <text x="400" y="68"  font-size="22" font-weight="700" fill="white" text-anchor="middle">離院準備到追蹤輔導四階段流程</text>
  <!-- Row 1 -->
  <rect x="28" y="160" width="744" height="62" rx="8" fill="white"/>
  <rect x="28" y="160" width="6" height="62" rx="2" fill="#d97706"/>
  <circle cx="66" cy="191" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="197"  font-size="16" font-weight="700" fill="white" text-anchor="middle">1</text>
  <text x="100" y="184"  font-size="18" font-weight="600" fill="#1e293b">預備離院計畫（離院前 3-6 個月）</text>
  <text x="100" y="208"  font-size="14" fill="#78716c">社工評估個案準備度，擬訂離院計畫書，確認返家或轉介去處</text>
  <rect x="620" y="168" width="136" height="46" rx="8" fill="#fef3c7" opacity="0.12"/>
  <text x="688" y="195"  font-size="14" font-weight="700" fill="#d97706" text-anchor="middle">準備階段</text>
  <!-- Row 2 -->
  <rect x="28" y="235" width="744" height="62" rx="8" fill="white"/>
  <rect x="28" y="235" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="66" cy="266" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="272"  font-size="16" font-weight="700" fill="white" text-anchor="middle">2</text>
  <text x="100" y="259"  font-size="18" font-weight="600" fill="#1e293b">獨立生活技巧訓練課程</text>
  <text x="100" y="283"  font-size="14" fill="#78716c">實施烹飪、理財、就業準備等技能訓練，留存課程計畫與出席紀錄</text>
  <rect x="620" y="243" width="136" height="46" rx="8" fill="#f1f5f9" opacity="0.12"/>
  <text x="688" y="270"  font-size="14" font-weight="700" fill="#78716c" text-anchor="middle">技能訓練</text>
  <!-- Row 3 -->
  <rect x="28" y="310" width="744" height="62" rx="8" fill="white"/>
  <rect x="28" y="310" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="66" cy="341" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="347"  font-size="16" font-weight="700" fill="white" text-anchor="middle">3</text>
  <text x="100" y="334"  font-size="18" font-weight="600" fill="#1e293b">辦理離院程序與結案評估</text>
  <text x="100" y="358"  font-size="14" fill="#78716c">完成結案評估報告，交接後續社福資源資訊，確認緊急聯絡窗口</text>
  <rect x="620" y="318" width="136" height="46" rx="8" fill="#f1f5f9" opacity="0.12"/>
  <text x="688" y="345"  font-size="14" font-weight="700" fill="#57534e" text-anchor="middle">結案離院</text>
  <!-- Row 4 -->
  <rect x="28" y="385" width="744" height="62" rx="8" fill="white"/>
  <rect x="28" y="385" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="416" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="422"  font-size="16" font-weight="700" fill="white" text-anchor="middle">4</text>
  <text x="100" y="409"  font-size="18" font-weight="600" fill="#1e293b">離院後追蹤輔導（3 個月 / 6 個月 / 1 年）</text>
  <text x="100" y="433"  font-size="14" fill="#78716c">定期電訪或家訪，記錄個案現況、困難與需求，提供轉介或資源連結</text>
  <rect x="620" y="393" width="136" height="46" rx="8" fill="#fef3c7" opacity="0.12"/>
  <text x="688" y="420"  font-size="14" font-weight="700" fill="#d97706" text-anchor="middle">追蹤輔導</text>
  <!-- Watermark -->
  <text x="760" y="480" font-size="16"  fill="#d97706" text-anchor="end">報告汪 reportwang.com</text>
</svg>
