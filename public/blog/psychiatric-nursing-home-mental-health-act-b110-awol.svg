<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <rect x="0" y="50" width="800" height="76" fill="white"/>
  <rect x="0" y="50" width="6" height="76" rx="2" fill="#d97706"/>
  <text x="28" y="104" font-size="36" fill="#1e293b" font-weight="700">修法對 B1.10 擅離院處理的影響</text>
  <rect x="28" y="175" width="744" height="130" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="175" width="6" height="130" rx="2" fill="#d97706"/>
  <circle cx="66" cy="235" r="20" fill="#d97706" opacity="0.15"/>
  <text x="66" y="241" font-size="18" fill="#d97706" text-anchor="middle" font-weight="900">修法</text>
  <text x="100" y="225" font-size="22" fill="#1e293b" font-weight="700">第 52 條通報義務更明確</text>
  <text x="100" y="251" font-size="16" fill="#57534e">「即時」通報的要求更嚴格：不假外出後即時通知保護人</text>
  <text x="100" y="271" font-size="16" fill="#57534e">行蹤不明後盡速報警，不能等待觀察</text>
  <text x="100" y="291" font-size="16" fill="#57534e">所有通報動作需有書面記錄（通話記錄、報案號碼）</text>
  <rect x="620" y="183" width="136" height="115" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="234" font-size="16" fill="#d97706" text-anchor="middle">即時</text>
  <text x="688" y="254" font-size="16" fill="#d97706" text-anchor="middle">更嚴</text>
  <rect x="28" y="325" width="744" height="120" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="325" width="6" height="120" rx="2" fill="#78716c"/>
  <circle cx="66" cy="380" r="20" fill="#78716c" opacity="0.15"/>
  <text x="66" y="386" font-size="18" fill="#78716c" text-anchor="middle" font-weight="900">實務</text>
  <text x="100" y="370" font-size="22" fill="#1e293b" font-weight="700">機構 SOP 需按修法內容更新</text>
  <text x="100" y="396" font-size="16" fill="#57534e">B1.10 的擅離院 SOP 需明確納入修法後的時限要求</text>
  <text x="100" y="416" font-size="16" fill="#57534e">辦法版次需更新，說明依 111/112 年修法調整的具體變動</text>
  <rect x="620" y="333" width="136" height="105" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="381" font-size="16" fill="#78716c" text-anchor="middle">SOP</text>
  <text x="688" y="401" font-size="16" fill="#78716c" text-anchor="middle">更新</text>
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
