<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <rect x="0" y="0" width="800" height="90" fill="#0d9488"/>
  <text x="400" y="38" font-size="22" font-weight="bold" fill="white" text-anchor="middle" font-family="sans-serif">C10. 疏散避難系統及等待救接空間設置</text>
  <text x="400" y="68" font-size="16" fill="#ccfbf1" text-anchor="middle" font-family="sans-serif">一級必要指標 ｜ 115年度老人福利機構評鑑</text>

  <!-- N=4 版型 -->

  <!-- Row 1 -->
  <rect x="30" y="110" width="740" height="62" rx="8" fill="white"/>
  <rect x="30" y="110" width="6" height="62" rx="3" fill="#d97706"/>
  <circle cx="66" cy="141" r="16" fill="#d97706"/>
  <text x="66" y="146" font-size="13" font-weight="bold" fill="white" text-anchor="middle" font-family="sans-serif">1</text>
  <text x="100" y="134" font-size="17" font-weight="bold" fill="#1e293b" font-family="sans-serif">走道、防火門、出入口保持暢通</text>
  <text x="100" y="156" font-size="13" fill="#57534e" font-family="sans-serif">樓梯間、走道、出入口、防火門應保持暢通無阻礙物；安全梯出入口周圍1.5公尺地面標線明示</text>
  <rect x="620" y="121" width="136" height="40" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="688" y="146" font-size="13" fill="#d97706" text-anchor="middle" font-family="sans-serif">隨時確保</text>

  <!-- Row 2 -->
  <rect x="30" y="185" width="740" height="62" rx="8" fill="white"/>
  <rect x="30" y="185" width="6" height="62" rx="3" fill="#78716c"/>
  <circle cx="66" cy="216" r="16" fill="#78716c"/>
  <text x="66" y="221" font-size="13" font-weight="bold" fill="white" text-anchor="middle" font-family="sans-serif">2</text>
  <text x="100" y="209" font-size="17" font-weight="bold" fill="#1e293b" font-family="sans-serif">雙向逃生路徑設計</text>
  <text x="100" y="231" font-size="13" fill="#57534e" font-family="sans-serif">逃生路徑為雙向，具備一座安全梯及兩個以上避難途徑；防火門往避難方向開啟且隨時保持開閘</text>
  <rect x="620" y="196" width="136" height="40" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="688" y="221" font-size="13" fill="#dc2626" text-anchor="middle" font-family="sans-serif">雙向路徑</text>

  <!-- Row 3 -->
  <rect x="30" y="260" width="740" height="62" rx="8" fill="white"/>
  <rect x="30" y="260" width="6" height="62" rx="3" fill="#57534e"/>
  <circle cx="66" cy="291" r="16" fill="#57534e"/>
  <text x="66" y="296" font-size="13" font-weight="bold" fill="white" text-anchor="middle" font-family="sans-serif">3</text>
  <text x="100" y="284" font-size="17" font-weight="bold" fill="#1e293b" font-family="sans-serif">等待救接空間與排煙設計</text>
  <text x="100" y="306" font-size="13" fill="#57534e" font-family="sans-serif">設有等待救接空間並有排煙設計或有效排煙功能，或依法有防火區劃；三者擇一符合</text>
  <rect x="620" y="271" width="136" height="40" rx="6" fill="#f0fdf4" stroke="#0d9488" stroke-width="1.5"/>
  <text x="688" y="296" font-size="13" fill="#0d9488" text-anchor="middle" font-family="sans-serif">排煙連動</text>

  <!-- Row 4 -->
  <rect x="30" y="335" width="740" height="62" rx="8" fill="white"/>
  <rect x="30" y="335" width="6" height="62" rx="3" fill="#a8a29e"/>
  <circle cx="66" cy="366" r="16" fill="#a8a29e"/>
  <text x="66" y="371" font-size="13" font-weight="bold" fill="white" text-anchor="middle" font-family="sans-serif">4</text>
  <text x="100" y="359" font-size="17" font-weight="bold" fill="#1e293b" font-family="sans-serif">中央空調與火警設備連動</text>
  <text x="100" y="381" font-size="13" fill="#57534e" font-family="sans-serif">火災發生時中央空氣調節系統電源開關能和火警自動警報設備連動自動切斷，防止火煙蔓延</text>
  <rect x="620" y="346" width="136" height="40" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="688" y="371" font-size="13" fill="#d97706" text-anchor="middle" font-family="sans-serif">自動切斷</text>

  <!-- 底部說明 -->
  <text x="30" y="440" font-size="14" fill="#78716c" font-family="sans-serif">防火門禁止常開或固定鎖死，應保持可隨時關閉的開閘狀態</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" font-family="sans-serif">報告汪 reportwang.com</text>
</svg>
