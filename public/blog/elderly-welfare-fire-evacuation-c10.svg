<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <rect x="0" y="0" width="800" height="90" fill="#0d9488"/>
  <text x="400" y="38" font-size="22" font-weight="bold" fill="white" text-anchor="middle" >C10. 疏散避難系統及等待救接空間設置</text>
  <text x="400" y="68" font-size="16" fill="#ccfbf1" text-anchor="middle" >一級必要指標 ｜ 115年度老人福利機構評鑑</text>

  <!-- N=4 版型 -->

  <!-- Row 1 -->
  <rect x="30" y="110" width="740" height="62" rx="8" fill="white"/>
  <rect x="30" y="110" width="6" height="62" rx="2" fill="#d97706"/>
  <circle cx="66" cy="141" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="146" font-size="14" font-weight="bold" fill="white" text-anchor="middle" >1</text>
  <text x="100" y="134" font-size="17" font-weight="bold" fill="#1e293b" >走道、防火門、出入口保持暢通</text>
  <text x="100" y="156" font-size="16" fill="#57534e" >樓梯間、走道、出入口、防火門應保持暢通無阻礙物；安全梯出入口周圍1.5公尺地面標線明示</text>
  <rect x="620" y="121" width="136" height="40" rx="8" fill="#fef3c7" opacity="0.12"/>
  <text x="688" y="146" font-size="14" fill="#d97706" text-anchor="middle" >隨時確保</text>

  <!-- Row 2 -->
  <rect x="30" y="185" width="740" height="62" rx="8" fill="white"/>
  <rect x="30" y="185" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="66" cy="216" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="221" font-size="14" font-weight="bold" fill="white" text-anchor="middle" >2</text>
  <text x="100" y="209" font-size="17" font-weight="bold" fill="#1e293b" >雙向逃生路徑設計</text>
  <text x="100" y="231" font-size="16" fill="#57534e" >逃生路徑為雙向，具備一座安全梯及兩個以上避難途徑；防火門往避難方向開啟且隨時保持開閘</text>
  <rect x="620" y="196" width="136" height="40" rx="8" fill="#fef2f2" opacity="0.12"/>
  <text x="688" y="221" font-size="14" fill="#dc2626" text-anchor="middle" >雙向路徑</text>

  <!-- Row 3 -->
  <rect x="30" y="260" width="740" height="62" rx="8" fill="white"/>
  <rect x="30" y="260" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="66" cy="291" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="296" font-size="14" font-weight="bold" fill="white" text-anchor="middle" >3</text>
  <text x="100" y="284" font-size="17" font-weight="bold" fill="#1e293b" >等待救接空間與排煙設計</text>
  <text x="100" y="306" font-size="16" fill="#57534e" >設有等待救接空間並有排煙設計或有效排煙功能，或依法有防火區劃；三者擇一符合</text>
  <rect x="620" y="271" width="136" height="40" rx="8" fill="#f0fdf4" opacity="0.12"/>
  <text x="688" y="296" font-size="14" fill="#0d9488" text-anchor="middle" >排煙連動</text>

  <!-- Row 4 -->
  <rect x="30" y="335" width="740" height="62" rx="8" fill="white"/>
  <rect x="30" y="335" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="366" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="371" font-size="14" font-weight="bold" fill="white" text-anchor="middle" >4</text>
  <text x="100" y="359" font-size="17" font-weight="bold" fill="#1e293b" >中央空調與火警設備連動</text>
  <text x="100" y="381" font-size="16" fill="#57534e" >火災發生時中央空氣調節系統電源開關能和火警自動警報設備連動自動切斷，防止火煙蔓延</text>
  <rect x="620" y="346" width="136" height="40" rx="8" fill="#fef3c7" opacity="0.12"/>
  <text x="688" y="371" font-size="14" fill="#d97706" text-anchor="middle" >自動切斷</text>

  <!-- 底部說明 -->
  <text x="30" y="440" font-size="14" fill="#78716c" >防火門禁止常開或固定鎖死，應保持可隨時關閉的開閘狀態</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" >報告汪 reportwang.com</text>
</svg>
