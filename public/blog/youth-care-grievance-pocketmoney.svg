<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- Header -->
  <rect x="28" y="16" width="744" height="60" rx="12" fill="#57534e"/>
  <text x="400" y="53"  font-size="20" fill="white" font-weight="700" text-anchor="middle">兒少零用金管理制度：評鑑查核要點</text>

  <!-- N=4 list rows -->
  <!-- Row 1 -->
  <rect x="28" y="108" width="744" height="62" rx="12" fill="white"/>
  <rect x="28" y="108" width="6" height="62" rx="2" fill="#d97706"/>
  <circle cx="66" cy="139" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="145"  font-size="14" fill="white" text-anchor="middle" font-weight="700">1</text>
  <text x="100" y="131"  font-size="15" fill="#1e293b" font-weight="700">建立個人零用金薄</text>
  <text x="100" y="153"  font-size="12" fill="#57534e">每位兒少均有獨立的零用金收支簿，記載日期、金額、用途、餘額</text>
  <rect x="660" y="116" width="100" height="46" rx="8" fill="#fef3c7"/>
  <text x="710" y="136"  font-size="12" fill="#d97706" text-anchor="middle" font-weight="700">必備文件</text>
  <text x="710" y="152"  font-size="11" fill="#d97706" text-anchor="middle">標準 6</text>

  <!-- Row 2 -->
  <rect x="28" y="183" width="744" height="62" rx="12" fill="white"/>
  <rect x="28" y="183" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="66" cy="214" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="220"  font-size="14" fill="white" text-anchor="middle" font-weight="700">2</text>
  <text x="100" y="206"  font-size="15" fill="#1e293b" font-weight="700">簽收或匯款憑證</text>
  <text x="100" y="228"  font-size="12" fill="#57534e">現金發放有兒少本人簽名確認；匯入帳戶者保留匯款單據或轉帳截圖</text>
  <rect x="660" y="191" width="100" height="46" rx="8" fill="#f5f3f0"/>
  <text x="710" y="211"  font-size="12" fill="#78716c" text-anchor="middle" font-weight="700">佐證文件</text>
  <text x="710" y="227"  font-size="11" fill="#78716c" text-anchor="middle">標準 6</text>

  <!-- Row 3 -->
  <rect x="28" y="258" width="744" height="62" rx="12" fill="white"/>
  <rect x="28" y="258" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="66" cy="289" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="295"  font-size="14" fill="white" text-anchor="middle" font-weight="700">3</text>
  <text x="100" y="281"  font-size="15" fill="#1e293b" font-weight="700">定期稽查記錄</text>
  <text x="100" y="303"  font-size="12" fill="#57534e">機構定期（建議每季）抽查兒少，確認實際收到的零用金與薄上一致</text>
  <rect x="660" y="266" width="100" height="46" rx="8" fill="#f5f3f0"/>
  <text x="710" y="286"  font-size="12" fill="#57534e" text-anchor="middle" font-weight="700">內部稽查</text>
  <text x="710" y="302"  font-size="11" fill="#57534e" text-anchor="middle">標準 7</text>

  <!-- Row 4 -->
  <rect x="28" y="333" width="744" height="62" rx="12" fill="white"/>
  <rect x="28" y="333" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="364" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="370"  font-size="14" fill="white" text-anchor="middle" font-weight="700">4</text>
  <text x="100" y="356"  font-size="15" fill="#1e293b" font-weight="700">評鑑委員直接訪談</text>
  <text x="100" y="378"  font-size="12" fill="#57534e">委員可能直接詢問兒少「最近有沒有收到零用金？金額對不對？」事先讓兒少了解</text>
  <rect x="660" y="341" width="100" height="46" rx="8" fill="#f5f3f0"/>
  <text x="710" y="361"  font-size="12" fill="#a8a29e" text-anchor="middle" font-weight="700">現場查核</text>
  <text x="710" y="377"  font-size="11" fill="#a8a29e" text-anchor="middle">標準 7</text>

  <!-- Warning box -->
  <rect x="28" y="415" width="744" height="50" rx="10" fill="#fff8f0"/>
  <rect x="28" y="415" width="6" height="50" rx="2" fill="#d97706"/>
  <text x="55" y="436"  font-size="13" fill="#d97706" font-weight="700">評鑑常見扣分原因</text>
  <text x="55" y="456"  font-size="12" fill="#57534e">零用金薄未個別建立、發放記錄缺簽名、稽查記錄付之闕如、兒少說不清楚金額</text>

  <!-- Watermark -->
  <text x="760" y="480"  font-size="16" fill="#d97706" text-anchor="end">報告汪 reportwang.com</text>
</svg>
