<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">10 大常見缺失分布區塊</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">依 A／B／C 區塊分類，評鑑前必查</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- 上排：3 卡片 y=104 h=168 -->
  <!-- A 卡片 x=40 w=218 -->
  <rect x="40" y="104" width="218" height="168" rx="12" fill="white"/>
  <rect x="40" y="104" width="218" height="44" rx="12" fill="#d97706"/>
  <rect x="40" y="128" width="218" height="20" fill="#d97706"/>
  <text x="149" y="133" text-anchor="middle" font-size="15" fill="white" font-weight="700">A 區塊 人力（3 項）</text>
  <text x="60" y="168" font-size="13" fill="#57534e">缺失1 A9 護理配置不足</text>
  <text x="60" y="186" font-size="13" fill="#57534e">缺失2 A11 夜班比例不符</text>
  <text x="60" y="204" font-size="13" fill="#57534e">缺失3 外籍照服員超比例</text>
  <rect x="56" y="246" width="80" height="20" rx="10" fill="#fef3c7"/>
  <text x="96" y="260" text-anchor="middle" font-size="14" fill="#d97706" font-weight="600">一級必要</text>

  <!-- B 卡片 x=272 w=256 -->
  <rect x="272" y="104" width="256" height="168" rx="12" fill="white"/>
  <rect x="272" y="104" width="256" height="44" rx="12" fill="#78716c"/>
  <rect x="272" y="128" width="256" height="20" fill="#78716c"/>
  <text x="400" y="133" text-anchor="middle" font-size="15" fill="white" font-weight="700">B 區塊 照護品質（5 項）</text>
  <text x="292" y="168" font-size="13" fill="#57534e">缺失4 B2 初評逾時（二級加強）</text>
  <text x="292" y="186" font-size="13" fill="#57534e">缺失5 B2 計畫未按時更新</text>
  <text x="292" y="204" font-size="13" fill="#57534e">缺失6 B13 跌倒分析不完整</text>
  <text x="292" y="222" font-size="13" fill="#57534e">缺失7 B17 感染分析缺漏</text>
  <rect x="288" y="246" width="100" height="20" rx="10" fill="#f5f5f4"/>
  <text x="338" y="260" text-anchor="middle" font-size="14" fill="#78716c" font-weight="600">最多缺失區</text>

  <!-- C 卡片 x=542 w=218 -->
  <rect x="542" y="104" width="218" height="168" rx="12" fill="white"/>
  <rect x="542" y="104" width="218" height="44" rx="12" fill="#57534e"/>
  <rect x="542" y="128" width="218" height="20" fill="#57534e"/>
  <text x="651" y="133" text-anchor="middle" font-size="15" fill="white" font-weight="700">C 區塊 消防（2 項）</text>
  <text x="562" y="168" font-size="13" fill="#57534e">缺失8 C9 設備未按時檢修</text>
  <text x="562" y="186" font-size="13" fill="#57534e">缺失9 C11 演練次數不足</text>
  <rect x="558" y="246" width="80" height="20" rx="10" fill="#f5f0eb"/>
  <text x="598" y="260" text-anchor="middle" font-size="14" fill="#57534e" font-weight="600">一級必要</text>

  <!-- 下排橫幅：B27缺失 y=288 h=100 -->
  <rect x="40" y="288" width="720" height="100" rx="12" fill="white"/>
  <rect x="40" y="288" width="720" height="44" rx="12" fill="#a8a29e"/>
  <rect x="40" y="312" width="720" height="20" fill="#a8a29e"/>
  <text x="400" y="317" text-anchor="middle" font-size="15" fill="white" font-weight="700">B 區塊 日常照護（缺失 10）</text>
  <text x="80" y="354" font-size="14" fill="#57534e">缺失10：B27 清潔與翻身紀錄不完整 — 每週洗澡頻率不足，翻身紀錄空白或時間超過 2 小時未記錄</text>
  <text x="80" y="374" font-size="14" fill="#57534e">改善：建立翻身紀錄單，每班交接確認；若住民拒絕洗澡，護理記錄需說明原因</text>
  <rect x="56" y="406" width="100" height="20" rx="10" fill="#f5f5f4"/>
  <text x="106" y="420" text-anchor="middle" font-size="14" fill="#a8a29e" font-weight="600">日常照護缺失</text>

  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
