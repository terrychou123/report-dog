<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#0d2d1a"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#065f46"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="420" fill="url(#bg)"/>

  <!-- 裝飾 -->
  <circle cx="700" cy="100" r="160" fill="rgba(16,185,129,0.05)"/>
  <circle cx="60" cy="380" r="100" fill="rgba(52,211,153,0.04)"/>
  <circle cx="740" cy="380" r="70" fill="rgba(255,255,255,0.02)"/>

  <!-- 頂部標籤 -->
  <rect x="48" y="40" width="96" height="28" rx="14" fill="rgba(16,185,129,0.8)"/>
  <text x="96" y="59" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="white" font-weight="600">評鑑後管理</text>
  <rect x="155" y="40" width="96" height="28" rx="14" fill="rgba(255,255,255,0.1)"/>
  <text x="203" y="59" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">改善計畫</text>

  <!-- 主標題 -->
  <text x="48" y="138" font-family="'Noto Sans TC', sans-serif" font-size="58" fill="white" font-weight="700">評鑑結束後</text>
  <text x="48" y="198" font-family="'Noto Sans TC', sans-serif" font-size="42" fill="#10b981" font-weight="700">30 天改善行動計畫</text>

  <!-- 副標題 -->
  <text x="48" y="240" font-family="'Noto Sans TC', sans-serif" font-size="17" fill="rgba(255,255,255,0.6)">評鑑結束是新開始，不是終點</text>

  <!-- 分隔線 -->
  <rect x="48" y="258" width="200" height="3" rx="2" fill="url(#greenGrad)"/>

  <!-- 特色標籤 -->
  <rect x="48" y="275" width="120" height="32" rx="8" fill="rgba(16,185,129,0.2)" stroke="rgba(16,185,129,0.4)" stroke-width="1"/>
  <text x="108" y="295" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#6ee7b7">30 天行動計畫</text>
  <rect x="180" y="275" width="120" height="32" rx="8" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="240" y="295" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="rgba(255,255,255,0.7)">改善計畫範本</text>

  <!-- 品牌 -->
  <rect x="48" y="378" width="70" height="24" rx="6" fill="rgba(255,255,255,0.07)"/>
  <text x="83" y="394" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="rgba(255,255,255,0.45)">報告汪</text>

  <!-- 右側大勾號視覺 -->
  <circle cx="604" cy="210" r="148" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.15)" stroke-width="1.5"/>
  <circle cx="604" cy="210" r="108" fill="rgba(16,185,129,0.06)" stroke="rgba(16,185,129,0.1)" stroke-width="1"/>

  <!-- 大勾號 -->
  <polyline points="524,210 584,272 700,148" fill="none" stroke="url(#greenGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 勾號外圈發光效果 -->
  <polyline points="524,210 584,272 700,148" fill="none" stroke="rgba(52,211,153,0.2)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 完成標籤 -->
  <rect x="546" y="296" width="116" height="30" rx="15" fill="rgba(16,185,129,0.25)" stroke="rgba(16,185,129,0.5)" stroke-width="1"/>
  <text x="604" y="316" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#34d399" font-weight="600">評鑑完成</text>

  <!-- 小箭頭向前 -->
  <text x="604" y="350" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="20" fill="rgba(16,185,129,0.5)">→</text>
  <text x="618" y="374" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="rgba(255,255,255,0.35)">持續改善</text>
</svg>
