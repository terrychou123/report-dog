<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420">

  <!-- 背景：米黃暖色 -->
  <rect width="800" height="420" fill="#f0efe8"/>

  <!-- 右側裝飾塊 -->
  <rect x="430" y="0" width="370" height="420" fill="#e8e6de"/>

  <!-- 頂部標籤 -->
  <rect x="48" y="40" width="96" height="28" rx="14" fill="#78716c"/>
  <text x="96" y="59" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="white" font-weight="600">評鑑後管理</text>
  <rect x="155" y="40" width="96" height="28" rx="14" fill="white" stroke="#dedad3" stroke-width="1"/>
  <text x="203" y="59" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#64748b">改善計畫</text>

  <!-- 主標題 -->
  <text x="48" y="138" font-family="'Noto Sans TC', sans-serif" font-size="58" fill="#1e293b" font-weight="700">評鑑結束後</text>
  <text x="48" y="198" font-family="'Noto Sans TC', sans-serif" font-size="42" fill="#d97706" font-weight="700">30 天改善行動計畫</text>

  <!-- 副標題 -->
  <text x="48" y="240" font-family="'Noto Sans TC', sans-serif" font-size="17" fill="#64748b">評鑑結束是新開始，不是終點</text>

  <!-- 分隔線 -->
  <rect x="48" y="258" width="200" height="3" rx="2" fill="#a8a29e"/>

  <!-- 特色標籤 -->
  <rect x="48" y="275" width="120" height="32" rx="8" fill="white" stroke="#dedad3" stroke-width="1"/>
  <text x="108" y="295" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#78716c">30 天行動計畫</text>
  <rect x="180" y="275" width="120" height="32" rx="8" fill="white" stroke="#dedad3" stroke-width="1"/>
  <text x="240" y="295" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#78716c">改善計畫範本</text>

  <!-- 浮水印 -->
  <text x="756" y="412" text-anchor="end" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#c4bfb8">報告汪 reportwang.com</text>

  <!-- 右側大勾號視覺 (暖灰版) -->
  <circle cx="604" cy="210" r="148" fill="white" stroke="#dedad3" stroke-width="1.5"/>
  <circle cx="604" cy="210" r="108" fill="#f8f7f2" stroke="#e8e5de" stroke-width="1"/>

  <!-- 大勾號 -->
  <polyline points="524,210 584,272 700,148" fill="none" stroke="#78716c" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 勾號淡暈 -->
  <polyline points="524,210 584,272 700,148" fill="none" stroke="#d97706" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>

  <!-- 完成標籤 -->
  <rect x="546" y="296" width="116" height="30" rx="15" fill="white" stroke="#dedad3" stroke-width="1"/>
  <text x="604" y="316" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#78716c" font-weight="600">評鑑完成</text>

  <!-- 小箭頭向前 -->
  <text x="604" y="350" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="20" fill="#a8a29e">→</text>
  <text x="618" y="374" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#94a3b8">持續改善</text>
</svg>
