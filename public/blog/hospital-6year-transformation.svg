<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#fafaf9"/>

  <!-- 標題區 (Header y=29, h=90, rows y=166/269/372) -->
  <rect x="0" y="0" width="800" height="110" fill="#f5f5f4"/>
  <text x="400" y="52" text-anchor="middle" font-size="26" font-weight="900" fill="#1c1917">從大拜拜到持續品管三階段轉型</text>
  <text x="400" y="84" text-anchor="middle" font-size="15" fill="#78716c">現況診斷 · 過渡建立 · 目標文化——具體轉型路徑</text>

  <!-- 列1：現況大拜拜模式 y=166, H=90 -->
  <rect x="38" y="122" width="724" height="90" rx="10" fill="#fff5f5" stroke="#fecaca" stroke-width="1.5"/>
  <rect x="38" y="122" width="10" height="90" rx="5" fill="#dc2626"/>
  <text x="68" y="158" font-size="17" font-weight="700" fill="#dc2626">現況  大拜拜模式</text>
  <text x="68" y="182" font-size="15" fill="#1c1917">評鑑年前2個月集中備審，全院加班、文書趕製、品質不穩定</text>
  <text x="68" y="202" font-size="14" fill="#78716c">評鑑後立即鬆懈，品管工作中斷直到下次評鑑年</text>
  <rect x="634" y="142" width="92" height="30" rx="15" fill="#fee2e2"/>
  <text x="680" y="162" text-anchor="middle" font-size="13" fill="#dc2626" font-weight="700">待改變</text>

  <!-- 箭頭 -->
  <polygon points="396,218 404,218 400,232" fill="#a8a29e"/>

  <!-- 列2：過渡月度品管建立 y=269, H=90 -->
  <rect x="38" y="235" width="724" height="90" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
  <rect x="38" y="235" width="10" height="90" rx="5" fill="#d97706"/>
  <text x="68" y="271" font-size="17" font-weight="700" fill="#d97706">過渡  月度品管建立</text>
  <text x="68" y="295" font-size="15" fill="#1c1917">建立月度品質報告和季度自我查核機制，AI工具輔助</text>
  <text x="68" y="315" font-size="14" fill="#78716c">逐步減少評鑑年的衝刺量，評鑑前準備更從容</text>
  <rect x="634" y="255" width="92" height="30" rx="15" fill="#fef3c7"/>
  <text x="680" y="275" text-anchor="middle" font-size="13" fill="#d97706" font-weight="700">轉型中</text>

  <!-- 箭頭 -->
  <polygon points="396,331 404,331 400,345" fill="#a8a29e"/>

  <!-- 列3：目標持續品質文化 y=372, H=90 -->
  <rect x="38" y="348" width="724" height="90" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <rect x="38" y="348" width="10" height="90" rx="5" fill="#16a34a"/>
  <text x="68" y="384" font-size="17" font-weight="700" fill="#16a34a">目標  持續品質文化</text>
  <text x="68" y="408" font-size="15" fill="#1c1917">全年均衡品管工作，評鑑只是定期驗收，不會有衝刺期</text>
  <text x="68" y="428" font-size="14" fill="#78716c">品質成為日常文化而非年度事件，員工壓力大幅降低</text>
  <rect x="634" y="368" width="92" height="30" rx="15" fill="#dcfce7"/>
  <text x="680" y="388" text-anchor="middle" font-size="13" fill="#16a34a" font-weight="700">目標狀態</text>

  <!-- 浮水印 -->
  <text x="400" y="480" text-anchor="middle" font-size="12" fill="#a8a29e" opacity="0.6">報告汪 reportwang.com</text>
</svg>
