  <text x="568" y="254" font-size="14" fill="#57534e">模擬評鑑查核</text>
  <text x="568" y="274" font-size="14" fill="#57534e">疏散通道最終走查</text>
  <text x="568" y="302" font-size="14" fill="#d97706" font-weight="600">成果：評鑑就緒</text>
  <text x="568" y="322" font-size="14" fill="#57534e">工作人員熟練</text>
  <text x="568" y="362" font-size="14" fill="#16a34a">評鑑日：從容應對</text>

  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
