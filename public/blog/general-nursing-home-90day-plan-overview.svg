  <text x="40" y="76" font-size="22" fill="#57534e">先盤點、再補強、最後衝刺——不亂不慌</text>
  <line x1="40" y1="92" x2="760" y2="92" stroke="#d97706" stroke-width="2"/>

  <!-- 階段一 -->
  <rect x="40" y="112" width="220" height="300" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
