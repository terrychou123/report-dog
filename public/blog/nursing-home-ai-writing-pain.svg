<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- Header（y=29, h=60） -->
  <rect x="0" y="29" width="800" height="60" fill="white"/>
  <rect x="0" y="29" width="6" height="60" fill="#d97706" rx="2"/>
  <text x="28" y="70" font-size="36" fill="#1e293b" font-weight="700">五大文書痛點</text>

  <!-- Row 1（y=118）色系 #d97706 H=60, inner_gap=13, outer_gap=29 -->
  <rect x="28" y="118" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="118" width="6" height="60" rx="2" fill="#d97706"/>
  <circle cx="66" cy="148" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="154" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <text x="100" y="145" font-size="20" fill="#1e293b" font-weight="700">數量龐大</text>
  <text x="100" y="165" font-size="16" fill="#57534e">75 項評鑑指標，幾乎每項都需完整書面佐證文件</text>
  <rect x="620" y="126" width="136" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="140" font-size="16" fill="#d97706" text-anchor="middle">A 區塊</text>
  <text x="688" y="158" font-size="16" fill="#d97706" text-anchor="middle">15 項計畫</text>

  <!-- Row 2（y=191）色系 #78716c -->
  <rect x="28" y="191" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="191" width="6" height="60" rx="2" fill="#78716c"/>
  <circle cx="66" cy="221" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="227" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <text x="100" y="218" font-size="20" fill="#1e293b" font-weight="700">格式不統一</text>
  <text x="100" y="238" font-size="16" fill="#57534e">各員書寫習慣不同，同一機構文件品質落差極大</text>
  <rect x="620" y="199" width="136" height="46" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="213" font-size="16" fill="#78716c" text-anchor="middle">B2 個案</text>
  <text x="688" y="231" font-size="16" fill="#78716c" text-anchor="middle">計畫痛點</text>

  <!-- Row 3（y=264）色系 #57534e -->
  <rect x="28" y="264" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="264" width="6" height="60" rx="2" fill="#57534e"/>
  <circle cx="66" cy="294" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="300" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <text x="100" y="291" font-size="20" fill="#1e293b" font-weight="700">時間嚴重不足</text>
  <text x="100" y="311" font-size="16" fill="#57534e">日常照顧業務繁重，文書只能利用下班後時間完成</text>
  <rect x="620" y="272" width="136" height="46" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="286" font-size="16" fill="#57534e" text-anchor="middle">護理長</text>
  <text x="688" y="304" font-size="16" fill="#57534e" text-anchor="middle">最大痛點</text>

  <!-- Row 4（y=337）色系 #a8a29e -->
  <rect x="28" y="337" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="337" width="6" height="60" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="367" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="373" font-size="16" fill="#a8a29e" text-anchor="middle" font-weight="900">4</text>
  <text x="100" y="364" font-size="20" fill="#1e293b" font-weight="700">更新頻率難維持</text>
  <text x="100" y="384" font-size="16" fill="#57534e">B2 計畫要求每 3 月評值、每半年修正，實務難落實</text>
  <rect x="620" y="345" width="136" height="46" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="359" font-size="16" fill="#a8a29e" text-anchor="middle">B2 二級</text>
  <text x="688" y="377" font-size="16" fill="#a8a29e" text-anchor="middle">加強重點</text>

  <!-- Row 5（y=410）色系 #94a3b8 -->
  <rect x="28" y="410" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="410" width="6" height="60" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="440" r="16" fill="#94a3b8" opacity="0.15"/>
  <text x="66" y="446" font-size="16" fill="#94a3b8" text-anchor="middle" font-weight="900">5</text>
  <text x="100" y="437" font-size="20" fill="#1e293b" font-weight="700">新人難以接手</text>
  <text x="100" y="457" font-size="16" fill="#57534e">資深人員離職後文書品質下滑，缺乏統一撰寫規範</text>
  <rect x="620" y="418" width="136" height="46" rx="8" fill="#94a3b8" opacity="0.12"/>
  <text x="688" y="432" font-size="16" fill="#94a3b8" text-anchor="middle">A12–A14</text>
  <text x="688" y="450" font-size="16" fill="#94a3b8" text-anchor="middle">訓練相關</text>

  <!-- 浮水印 -->
  <text x="760" y="492" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
