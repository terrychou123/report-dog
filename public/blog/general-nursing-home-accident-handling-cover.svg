<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 頂部橙色條 -->
  <rect width="1200" height="8" fill="#d97706"/>
  <!-- 左側裝飾線 -->
  <rect x="60" y="40" width="6" height="550" fill="#d97706" rx="2"/>

  <!-- 大標題區 -->
  <text x="100" y="120" font-size="28" fill="#92400e" font-weight="bold">A1.3 評鑑基準</text>
  <text x="100" y="200" font-size="72" fill="#b45309" font-weight="900">意外事件</text>
  <text x="100" y="280" font-size="72" fill="#d97706" font-weight="900">處理 SOP</text>
  <text x="100" y="340" font-size="26" fill="#78716c">跌倒通報・壓傷追蹤・緊急應變全攻略</text>
  <text x="100" y="390" font-size="26" fill="#a8a29e">115 年度一般護理之家評鑑</text>

  <!-- 三張卡片 -->
  <!-- 跌倒卡片 -->
  <rect x="100" y="440" width="280" height="130" fill="#fef3c7" rx="12" stroke="#d97706" stroke-width="2"/>
  <text x="240" y="478" font-size="32" fill="#d97706" font-weight="bold" text-anchor="middle">🚶</text>
  <text x="240" y="512" font-size="24" fill="#92400e" font-weight="bold" text-anchor="middle">跌倒事件</text>
  <text x="240" y="538" font-size="20" fill="#78716c" text-anchor="middle">24小時內通報</text>
  <text x="240" y="558" font-size="20" fill="#78716c" text-anchor="middle">追蹤改善措施</text>

  <!-- 壓傷卡片 -->
  <rect x="420" y="440" width="280" height="130" fill="#fee2e2" rx="12" stroke="#dc2626" stroke-width="2"/>
  <text x="560" y="478" font-size="32" fill="#dc2626" font-weight="bold" text-anchor="middle">🩹</text>
  <text x="560" y="512" font-size="24" fill="#991b1b" font-weight="bold" text-anchor="middle">壓傷事件</text>
  <text x="560" y="538" font-size="20" fill="#78716c" text-anchor="middle">Stage 1–4 分級</text>
  <text x="560" y="558" font-size="20" fill="#78716c" text-anchor="middle">護理措施記錄</text>

  <!-- 緊急醫療卡片 -->
  <rect x="740" y="440" width="280" height="130" fill="#ffe4e6" rx="12" stroke="#e11d48" stroke-width="2"/>
  <text x="880" y="478" font-size="32" fill="#e11d48" font-weight="bold" text-anchor="middle">🚑</text>
  <text x="880" y="512" font-size="24" fill="#9f1239" font-weight="bold" text-anchor="middle">緊急醫療</text>
  <text x="880" y="538" font-size="20" fill="#78716c" text-anchor="middle">急救流程</text>
  <text x="880" y="558" font-size="20" fill="#78716c" text-anchor="middle">呼叫救護車</text>

  <!-- 右側視覺裝飾 -->
  <circle cx="980" cy="200" r="140" fill="#fef3c7"/>
  <circle cx="980" cy="200" r="100" fill="#fde68a"/>
  <text x="980" y="160" font-size="44" fill="#d97706" font-weight="900" text-anchor="middle">A1.3</text>
  <text x="980" y="210" font-size="18" fill="#92400e" text-anchor="middle">意外事件</text>
  <text x="980" y="235" font-size="18" fill="#92400e" text-anchor="middle">處理基準</text>

  <!-- 浮水印 -->
  <text x="1140" y="590" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
