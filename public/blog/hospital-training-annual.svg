<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- 背景 -->
  <rect width="800" height="500" fill="#fafaf9"/>

  <!-- 標題區 -->
  <rect x="0" y="0" width="800" height="110" fill="#f5f5f4"/>
  <text x="400" y="50" text-anchor="middle" font-size="24" font-weight="900" fill="#1c1917">在職教育訓練年度計畫四大要件</text>
  <rect x="324" y="62" width="56" height="22" rx="11" fill="#dcfce7"/>
  <text x="352" y="78" text-anchor="middle" font-size="14" fill="#16a34a" font-weight="700">1.3.6</text>
  <rect x="388" y="62" width="56" height="22" rx="11" fill="#fef9c3"/>
  <text x="416" y="78" text-anchor="middle" font-size="14" fill="#ca8a04" font-weight="700">重點條文</text>
  <text x="400" y="98" text-anchor="middle" font-size="14" fill="#78716c">評鑑委員資料查核重點：全職類涵蓋、時數達標、紀錄完整、持續改善</text>

  <!-- 列1：涵蓋所有職類 -->
  <rect x="38" y="120" width="724" height="76" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <rect x="38" y="120" width="8" height="76" rx="4" fill="#d97706"/>
  <text x="62" y="152" font-size="16" font-weight="700" fill="#d97706">01</text>
  <text x="88" y="152" font-size="16" font-weight="700" fill="#1c1917">涵蓋所有職類</text>
  <text x="88" y="174" font-size="14" fill="#78716c">訓練計畫明確列出適用職類（護理/醫師/藥師/行政等），不遺漏任何職類</text>
  <rect x="628" y="138" width="88" height="28" rx="14" fill="#fef3c7"/>
  <text x="672" y="157" text-anchor="middle" font-size="14" fill="#d97706" font-weight="700">全職類</text>

  <!-- 列2：達到規定時數 -->
  <rect x="38" y="206" width="724" height="76" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <rect x="38" y="206" width="8" height="76" rx="4" fill="#78716c"/>
  <text x="62" y="238" font-size="16" font-weight="700" fill="#78716c">02</text>
  <text x="88" y="238" font-size="16" font-weight="700" fill="#1c1917">達到規定時數</text>
  <text x="88" y="260" font-size="14" fill="#78716c">各職類員工依規定時數完成訓練，個別出席記錄可核對</text>
  <rect x="628" y="224" width="88" height="28" rx="14" fill="#f5f5f4"/>
  <text x="672" y="243" text-anchor="middle" font-size="14" fill="#78716c" font-weight="700">時數達標</text>

  <!-- 列3：紀錄完整可查核 -->
  <rect x="38" y="292" width="724" height="76" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <rect x="38" y="292" width="8" height="76" rx="4" fill="#57534e"/>
  <text x="62" y="324" font-size="16" font-weight="700" fill="#57534e">03</text>
  <text x="88" y="324" font-size="16" font-weight="700" fill="#1c1917">紀錄完整可查核</text>
  <text x="88" y="346" font-size="14" fill="#78716c">簽到表、訓練主題、講師、評估結果均留存，建立訓練履歷</text>
  <rect x="628" y="310" width="88" height="28" rx="14" fill="#f5f5f4"/>
  <text x="672" y="329" text-anchor="middle" font-size="14" fill="#57534e" font-weight="700">完整紀錄</text>

  <!-- 列4：成效評估與修訂 -->
  <rect x="38" y="378" width="724" height="76" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <rect x="38" y="378" width="8" height="76" rx="4" fill="#a8a29e"/>
  <text x="62" y="410" font-size="16" font-weight="700" fill="#a8a29e">04</text>
  <text x="88" y="410" font-size="16" font-weight="700" fill="#1c1917">成效評估與修訂</text>
  <text x="88" y="432" font-size="14" fill="#78716c">訓練後評估效果，每年檢討訓練計畫，依評估結果調整下年度內容</text>
  <rect x="628" y="396" width="88" height="28" rx="14" fill="#f5f5f4"/>
  <text x="672" y="415" text-anchor="middle" font-size="14" fill="#a8a29e" font-weight="700">持續改善</text>

  <!-- 浮水印 -->
  <text x="400" y="480" text-anchor="middle" font-size="14" fill="#a8a29e" opacity="0.6">報告汪 reportwang.com</text>
</svg>
