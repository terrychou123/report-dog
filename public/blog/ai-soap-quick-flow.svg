<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="360" fill="#f0efe8"/>

  <!-- 卡片 1 -->
  <rect x="24" y="60" width="224" height="220" rx="12" fill="#ffffff" stroke="#e8e6de" stroke-width="1"/>
  <!-- 卡片 2 -->
  <rect x="288" y="60" width="224" height="220" rx="12" fill="#ffffff" stroke="#e8e6de" stroke-width="1"/>
  <!-- 卡片 3 -->
  <rect x="552" y="60" width="224" height="220" rx="12" fill="#ffffff" stroke="#e8e6de" stroke-width="1"/>

  <!-- 箭頭 1（卡片 1 → 卡片 2） -->
  <line x1="252" y1="170" x2="280" y2="170" stroke="#3a8fa8" stroke-width="3" stroke-linecap="round"/>
  <polygon points="280,163 292,170 280,177" fill="#3a8fa8"/>

  <!-- 箭頭 2（卡片 2 → 卡片 3） -->
  <line x1="516" y1="170" x2="544" y2="170" stroke="#3a8fa8" stroke-width="3" stroke-linecap="round"/>
  <polygon points="544,163 556,170 544,177" fill="#3a8fa8"/>

  <!-- Step badge 1 -->
  <circle cx="52" cy="88" r="16" fill="#d97706"/>
  <text x="52" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">1</text>

  <!-- Step badge 2 -->
  <circle cx="316" cy="88" r="16" fill="#d97706"/>
  <text x="316" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">2</text>

  <!-- Step badge 3 -->
  <circle cx="580" cy="88" r="16" fill="#d97706"/>
  <text x="580" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">3</text>

  <!-- 卡片 1 標題：圈選段落 -->
  <text x="136" y="120" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">圈選段落</text>

  <!-- 卡片 1 內容：mock 文字 + 選取高亮 -->
  <rect x="44" y="142" width="158" height="11" rx="3" fill="#e8e6de"/>
  <!-- 選取高亮背景 -->
  <rect x="44" y="162" width="162" height="19" rx="3" fill="#3a8fa8" opacity="0.18"/>
  <!-- 選取文字 mockup -->
  <rect x="44" y="166" width="118" height="9" rx="2" fill="#94a3b8" opacity="0.8"/>
  <!-- 游標 -->
  <rect x="44" y="160" width="3" height="23" rx="1.5" fill="#3a8fa8"/>
  <rect x="44" y="190" width="130" height="11" rx="3" fill="#e8e6de"/>
  <rect x="44" y="210" width="100" height="11" rx="3" fill="#e8e6de"/>

  <!-- 選取提示文字 -->
  <text x="136" y="240" text-anchor="middle" font-size="11" fill="#78716c">拖曳選取紀錄文字</text>
  <text x="136" y="256" text-anchor="middle" font-size="11" fill="#78716c">再點「AI 修改助手」</text>

  <!-- 卡片 2 標題：勾 SOAP -->
  <text x="400" y="120" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">勾 SOAP</text>

  <!-- 卡片 2 內容：迷你對話框 -->
  <!-- 對話框外框 -->
  <rect x="304" y="136" width="192" height="116" rx="8" fill="#f8f7f4" stroke="#dedad3" stroke-width="1"/>
  <!-- 對話框 header 背景 -->
  <rect x="304" y="136" width="192" height="26" rx="8" fill="#ede9e3"/>
  <rect x="304" y="150" width="192" height="12" fill="#ede9e3"/>
  <text x="318" y="153" font-size="11" font-weight="bold" fill="#78716c">✦ AI 修改助手</text>

  <!-- Checkbox（勾選，teal 填充） -->
  <rect x="316" y="176" width="16" height="16" rx="3" fill="#3a8fa8"/>
  <path d="M319,184 L323,188 L330,179" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- SOAP label -->
  <text x="338" y="189" font-size="13" font-weight="bold" fill="#1e293b">SOAP</text>

  <!-- 橘色虛線高亮框 -->
  <rect x="311" y="171" width="76" height="26" rx="5" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- 標注文字 -->
  <text x="400" y="183" font-size="10" fill="#d97706">← 勾選此框</text>

  <!-- 輸入框 mockup -->
  <rect x="314" y="206" width="172" height="36" rx="4" fill="#ffffff" stroke="#dedad3" stroke-width="1"/>
  <text x="320" y="219" font-size="9" fill="#a8a29e">改寫成：主觀S、客觀O、</text>
  <text x="320" y="232" font-size="9" fill="#a8a29e">評估A、計畫P 四段結構…</text>

  <!-- 卡片 3 標題：送出 → 套用 -->
  <text x="664" y="120" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">送出 → 套用</text>

  <!-- 卡片 3：送出按鈕 -->
  <rect x="614" y="136" width="60" height="26" rx="13" fill="#3a8fa8"/>
  <text x="644" y="153" text-anchor="middle" font-size="12" fill="#ffffff">送出</text>

  <!-- 向下箭頭 -->
  <line x1="644" y1="166" x2="644" y2="178" stroke="#78716c" stroke-width="2"/>
  <polygon points="640,177 644,186 648,177" fill="#78716c"/>

  <!-- SOAP 四段結果 -->
  <text x="568" y="200" font-size="11" font-weight="bold" fill="#3a8fa8">S</text>
  <rect x="580" y="192" width="116" height="10" rx="2" fill="#e8e6de"/>
  <text x="568" y="218" font-size="11" font-weight="bold" fill="#3a8fa8">O</text>
  <rect x="580" y="210" width="116" height="10" rx="2" fill="#e8e6de"/>
  <text x="568" y="236" font-size="11" font-weight="bold" fill="#3a8fa8">A</text>
  <rect x="580" y="228" width="116" height="10" rx="2" fill="#e8e6de"/>
  <text x="568" y="254" font-size="11" font-weight="bold" fill="#3a8fa8">P</text>
  <rect x="580" y="246" width="116" height="10" rx="2" fill="#e8e6de"/>

  <!-- 套用修改按鈕 -->
  <rect x="599" y="261" width="90" height="24" rx="12" fill="none" stroke="#3a8fa8" stroke-width="1.5"/>
  <text x="644" y="277" text-anchor="middle" font-size="11" fill="#3a8fa8">套用修改</text>

  <!-- 底部標語 -->
  <text x="400" y="338" text-anchor="middle" font-size="16" fill="#3f3f46">30 秒一鍵改寫成 SOAP 四段式</text>
</svg>
