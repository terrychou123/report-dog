<!-- @template: flow -->
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"
     font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區：主標 32px y=48 / 副標 22px y=78 / 分隔線 y=94 -->
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">AI 輔助改寫三步驟</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">護理記錄快速升級為 SOAP 四段式</text>
  <line x1="129" y1="94" x2="671" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- 箭頭 1（card[0]→card[1]，arrow_y=279） -->
  <line x1="299" y1="279" x2="307" y2="279" stroke="#c4bfb8" stroke-width="2"/>
  <polygon points="307,273 315,279 307,285" fill="#c4bfb8"/>

  <!-- 箭頭 2（card[1]→card[2]，arrow_y=279） -->
  <line x1="485" y1="279" x2="493" y2="279" stroke="#c4bfb8" stroke-width="2"/>
  <polygon points="493,273 501,279 493,285" fill="#c4bfb8"/>

  <!-- ===== Step 1: 圈選段落（amber #d97706）x=129 cx=214 ===== -->
  <rect x="129" y="108" width="170" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <!-- 頂色條 -->
  <rect x="129" y="108" width="170" height="8" rx="4" fill="#d97706"/>
  <rect x="129" y="112" width="170" height="4" fill="#d97706"/>
  <!-- STEP 圓圈（r=43, cy=194） -->
  <circle cx="214" cy="194" r="43" fill="#fef3c7"/>
  <text x="214" y="183" text-anchor="middle" font-size="16" fill="#d97706" font-weight="700">STEP</text>
  <text x="214" y="211" text-anchor="middle" font-size="26" fill="#d97706" font-weight="700">01</text>
  <!-- H 卡片標題（35px, y=297） -->
  <text x="214" y="297" text-anchor="middle" font-size="35" fill="#1e293b" font-weight="700">圈選段落</text>
  <!-- J 說明文字（20px, y=324/346） -->
  <text x="214" y="324" text-anchor="middle" font-size="20" fill="#57534e">拖曳選取文字</text>
  <text x="214" y="346" text-anchor="middle" font-size="20" fill="#57534e">點 AI 助手</text>
  <!-- K Pill（y=381, w=144, rx=18） -->
  <rect x="142" y="381" width="144" height="36" rx="18" fill="#fef3c7"/>
  <text x="214" y="405" text-anchor="middle" font-size="18" fill="#d97706" font-weight="600">30 秒完成</text>

  <!-- ===== Step 2: 勾選格式（warm gray #78716c）x=315 cx=400 ===== -->
  <rect x="315" y="108" width="170" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="315" y="108" width="170" height="8" rx="4" fill="#78716c"/>
  <rect x="315" y="112" width="170" height="4" fill="#78716c"/>
  <circle cx="400" cy="194" r="43" fill="#f5f5f4"/>
  <text x="400" y="183" text-anchor="middle" font-size="16" fill="#78716c" font-weight="700">STEP</text>
  <text x="400" y="211" text-anchor="middle" font-size="26" fill="#78716c" font-weight="700">02</text>
  <text x="400" y="297" text-anchor="middle" font-size="35" fill="#1e293b" font-weight="700">勾選格式</text>
  <text x="400" y="324" text-anchor="middle" font-size="20" fill="#57534e">選 SOAP 格式</text>
  <text x="400" y="346" text-anchor="middle" font-size="20" fill="#57534e">按確認改寫</text>
  <rect x="328" y="381" width="144" height="36" rx="18" fill="#f5f5f4"/>
  <text x="400" y="405" text-anchor="middle" font-size="18" fill="#78716c" font-weight="600">一鍵設定</text>

  <!-- ===== Step 3: 送出套用（dark brown #57534e）x=501 cx=586 ===== -->
  <rect x="501" y="108" width="170" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="501" y="108" width="170" height="8" rx="4" fill="#57534e"/>
  <rect x="501" y="112" width="170" height="4" fill="#57534e"/>
  <circle cx="586" cy="194" r="43" fill="#f5f0eb"/>
  <text x="586" y="183" text-anchor="middle" font-size="16" fill="#57534e" font-weight="700">STEP</text>
  <text x="586" y="211" text-anchor="middle" font-size="26" fill="#57534e" font-weight="700">03</text>
  <text x="586" y="297" text-anchor="middle" font-size="35" fill="#1e293b" font-weight="700">送出套用</text>
  <text x="586" y="324" text-anchor="middle" font-size="20" fill="#57534e">AI 自動改寫</text>
  <text x="586" y="346" text-anchor="middle" font-size="20" fill="#57534e">四段完整呈現</text>
  <rect x="514" y="381" width="144" height="36" rx="18" fill="#f5f0eb"/>
  <text x="586" y="405" text-anchor="middle" font-size="18" fill="#57534e" font-weight="600">立即套用</text>

  <!-- 品牌浮水印（y=480） -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
