<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <text x="400" y="48" text-anchor="middle" font-size="28" fill="#1e293b" font-weight="700">CHIME 面向 × PFM 訪談項目對應一覽</text>
  <text x="400" y="78" text-anchor="middle" font-size="20" fill="#57534e">日間型5項PFM、住宿型7項PFM，全部對應 CHIME E/C/M 三大面向</text>
  <line x1="28" y1="94" x2="772" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- 表頭 -->
  <rect x="28" y="106" width="744" height="38" rx="8" fill="#e8e4dc"/>
  <text x="120" y="130" text-anchor="middle" font-size="15" fill="#57534e" font-weight="700">PFM 項目</text>
  <text x="340" y="130" text-anchor="middle" font-size="15" fill="#57534e" font-weight="700">委員提問方向</text>
  <text x="576" y="130" text-anchor="middle" font-size="15" fill="#57534e" font-weight="700">CHIME面向</text>
  <text x="710" y="130" text-anchor="middle" font-size="15" fill="#57534e" font-weight="700">類型</text>

  <!-- Row 1: 2.8 -->
  <rect x="28" y="152" width="744" height="44" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="120" y="174" text-anchor="middle" font-size="14" fill="#1e293b" font-weight="700">2.8 藥物自我管理</text>
  <text x="120" y="190" text-anchor="middle" font-size="14" fill="#57534e">（PFM 必評）</text>
  <text x="340" y="180" text-anchor="middle" font-size="14" fill="#57534e">你知道你在吃什麼藥嗎？</text>
  <rect x="520" y="158" width="88" height="30" rx="15" fill="#eff6ff"/>
  <text x="564" y="178" text-anchor="middle" font-size="14" fill="#2563eb" font-weight="700">E 增能</text>
  <rect x="640" y="158" width="116" height="30" rx="6" fill="#f5f5f4"/>
  <text x="698" y="178" text-anchor="middle" font-size="14" fill="#78716c">日間＋住宿</text>

  <!-- Row 2: 2.12 -->
  <rect x="28" y="204" width="744" height="44" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="120" y="226" text-anchor="middle" font-size="14" fill="#1e293b" font-weight="700">2.12 社區融合</text>
  <text x="120" y="242" text-anchor="middle" font-size="14" fill="#57534e">（PFM 必評）</text>
  <text x="340" y="232" text-anchor="middle" font-size="14" fill="#57534e">上個月有去哪裡嗎？</text>
  <rect x="520" y="210" width="88" height="30" rx="15" fill="#eff6ff"/>
  <text x="564" y="230" text-anchor="middle" font-size="14" fill="#2563eb" font-weight="700">C/M</text>
  <rect x="640" y="210" width="116" height="30" rx="6" fill="#f5f5f4"/>
  <text x="698" y="230" text-anchor="middle" font-size="14" fill="#78716c">日間＋住宿</text>

  <!-- Row 3: 3.2 -->
  <rect x="28" y="256" width="744" height="44" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="120" y="278" text-anchor="middle" font-size="14" fill="#1e293b" font-weight="700">3.2 收案標準</text>
  <text x="120" y="294" text-anchor="middle" font-size="14" fill="#57534e">（PFM 必評）</text>
  <text x="340" y="284" text-anchor="middle" font-size="14" fill="#57534e">你是怎麼被接收到這裡的？</text>
  <rect x="520" y="262" width="88" height="30" rx="15" fill="#faf5ff"/>
  <text x="564" y="282" text-anchor="middle" font-size="14" fill="#7c3aed" font-weight="700">I 認同</text>
  <rect x="640" y="262" width="116" height="30" rx="6" fill="#f5f5f4"/>
  <text x="698" y="282" text-anchor="middle" font-size="14" fill="#78716c">日間＋住宿</text>

  <!-- Row 4: 3.6/3.5 -->
  <rect x="28" y="308" width="744" height="44" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="120" y="330" text-anchor="middle" font-size="14" fill="#1e293b" font-weight="700">3.5/3.6 基金/權益</text>
  <text x="120" y="346" text-anchor="middle" font-size="14" fill="#57534e">（PFM 必評）</text>
  <text x="340" y="336" text-anchor="middle" font-size="14" fill="#57534e">被不公平對待，你知道怎麼申訴？</text>
  <rect x="520" y="314" width="88" height="30" rx="15" fill="#eff6ff"/>
  <text x="564" y="334" text-anchor="middle" font-size="14" fill="#2563eb" font-weight="700">E 增能</text>
  <rect x="640" y="314" width="116" height="30" rx="6" fill="#f5f5f4"/>
  <text x="698" y="334" text-anchor="middle" font-size="14" fill="#78716c">日間＋住宿</text>

  <!-- Row 5: 3.7 住宿型 -->
  <rect x="28" y="360" width="744" height="44" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="120" y="382" text-anchor="middle" font-size="14" fill="#1e293b" font-weight="700">3.7 財物自主</text>
  <text x="120" y="398" text-anchor="middle" font-size="14" fill="#7c3aed">（住宿型 PFM）</text>
  <text x="340" y="388" text-anchor="middle" font-size="14" fill="#57534e">你的錢可以自己管理嗎？</text>
  <rect x="520" y="366" width="88" height="30" rx="15" fill="#eff6ff"/>
  <text x="564" y="386" text-anchor="middle" font-size="14" fill="#2563eb" font-weight="700">E 增能</text>
  <rect x="640" y="366" width="116" height="30" rx="6" fill="#f5f3ff"/>
  <text x="698" y="386" text-anchor="middle" font-size="14" fill="#7c3aed">住宿型獨有</text>

  <!-- Row 6: 重3.11 -->
  <rect x="28" y="412" width="744" height="44" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="120" y="432" text-anchor="middle" font-size="14" fill="#dc2626" font-weight="700">重3.11 出入自由</text>
  <text x="120" y="449" text-anchor="middle" font-size="14" fill="#dc2626">（住宿型唯一重點PFM）</text>
  <text x="340" y="438" text-anchor="middle" font-size="14" fill="#dc2626">你想外出可以自由出去嗎？</text>
  <rect x="520" y="418" width="88" height="30" rx="15" fill="#eff6ff"/>
  <text x="564" y="438" text-anchor="middle" font-size="14" fill="#2563eb" font-weight="700">E/C</text>
  <rect x="640" y="418" width="116" height="30" rx="6" fill="#fef2f2"/>
  <text x="698" y="438" text-anchor="middle" font-size="14" fill="#dc2626" font-weight="700">未達C不合格</text>

  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
