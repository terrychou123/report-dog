<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- @template: list-4 -->
  <rect width="800" height="500" fill="#f0efe8"/>
  <text x="400" y="48" text-anchor="middle" font-size="28" fill="#1e293b" font-weight="700">CHIME 面向 × PFM 訪談項目對應一覽</text>
  <text x="400" y="78" text-anchor="middle" font-size="20" fill="#57534e">日間型5項PFM、住宿型7項PFM，全部對應 CHIME E/C/M 三大面向</text>
  <line x1="28" y1="94" x2="772" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- Row 1: 2.8 藥物自我管理 (rowY=160, H=62) -->
  <rect x="28" y="160" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="160" width="6" height="62" rx="2" fill="#d97706"/>
  <circle cx="66" cy="191" r="18" fill="#d97706" opacity="0.15"/>
  <!-- text_y = 160+31+22*0.35=198.7≈199 -->
  <text x="66" y="199" font-size="22" fill="#d97706" text-anchor="middle" font-weight="900">E</text>
  <text x="100" y="180" font-size="22" fill="#1e293b" font-weight="700">2.8 藥物自我管理（E 增能）</text>
  <text x="100" y="204" font-size="16" fill="#57534e">你知道你在吃什麼藥嗎？ - 日間＋住宿型 PFM 必評</text>
  <!-- S-box: y=160+8=168, rectH=46 -->
  <rect x="620" y="168" width="136" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="186" font-size="15" fill="#d97706" text-anchor="middle">日間＋住宿</text>
  <text x="688" y="204" font-size="15" fill="#d97706" text-anchor="middle">必評</text>

  <!-- Row 2: 2.12 社區融合 (rowY=235, H=62) -->
  <rect x="28" y="235" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="235" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="66" cy="266" r="18" fill="#78716c" opacity="0.15"/>
  <!-- text_y = 235+31+7.7=273.7≈274 -->
  <text x="66" y="274" font-size="22" fill="#78716c" text-anchor="middle" font-weight="900">C</text>
  <text x="100" y="255" font-size="22" fill="#1e293b" font-weight="700">2.12 社區融合（C 連結感 / M 意義）</text>
  <text x="100" y="279" font-size="16" fill="#57534e">上個月有去哪裡嗎？ - 日間＋住宿型 PFM 必評</text>
  <!-- S-box: y=235+8=243 -->
  <rect x="620" y="243" width="136" height="46" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="261" font-size="15" fill="#78716c" text-anchor="middle">日間＋住宿</text>
  <text x="688" y="279" font-size="15" fill="#78716c" text-anchor="middle">必評</text>

  <!-- Row 3: 3.2 收案標準 (rowY=310, H=62) -->
  <rect x="28" y="310" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="310" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="66" cy="341" r="18" fill="#57534e" opacity="0.15"/>
  <!-- text_y = 310+31+7.7=348.7≈349 -->
  <text x="66" y="349" font-size="22" fill="#57534e" text-anchor="middle" font-weight="900">I</text>
  <text x="100" y="330" font-size="22" fill="#1e293b" font-weight="700">3.2 收案標準（I 身份認同）</text>
  <text x="100" y="354" font-size="16" fill="#57534e">你是怎麼被接收到這裡的？ - 日間＋住宿型 PFM 必評</text>
  <!-- S-box: y=310+8=318 -->
  <rect x="620" y="318" width="136" height="46" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="336" font-size="15" fill="#57534e" text-anchor="middle">日間＋住宿</text>
  <text x="688" y="354" font-size="15" fill="#57534e" text-anchor="middle">必評</text>

  <!-- Row 4: 3.5/3.6 基金/權益 (rowY=385, H=62) -->
  <rect x="28" y="385" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="385" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="416" r="18" fill="#a8a29e" opacity="0.15"/>
  <!-- text_y = 385+31+7.7=423.7≈424 -->
  <text x="66" y="424" font-size="22" fill="#a8a29e" text-anchor="middle" font-weight="900">E</text>
  <text x="100" y="405" font-size="22" fill="#1e293b" font-weight="700">3.5/3.6 基金／權益（E 增能）</text>
  <text x="100" y="429" font-size="16" fill="#57534e">被不公平對待，你知道怎麼申訴？ - 日間＋住宿型 PFM 必評</text>
  <!-- S-box: y=385+8=393 -->
  <rect x="620" y="393" width="136" height="46" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="411" font-size="15" fill="#a8a29e" text-anchor="middle">日間＋住宿</text>
  <text x="688" y="429" font-size="15" fill="#a8a29e" text-anchor="middle">必評</text>

  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
