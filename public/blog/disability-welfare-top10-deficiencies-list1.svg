<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">文件類常見失分（項目1-4）</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">這四類文件缺失是評鑑委員最常開缺失單的原因</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- Row 1: ISP每2週紀錄 -->
  <rect x="28" y="118" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="118" width="6" height="62" rx="2" fill="#d97706"/>
  <circle cx="66" cy="149" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="155" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <text x="100" y="146" font-size="20" fill="#1e293b" font-weight="700">ISP 執行紀錄頻率不足（4103）</text>
  <text x="100" y="168" font-size="16" fill="#57534e">每2週至少記錄1次・漏記或間隔超過14天即列為缺失</text>
  <rect x="620" y="126" width="136" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="140" font-size="14" fill="#d97706" text-anchor="middle">4分項目</text>
  <text x="688" y="158" font-size="14" fill="#d97706" text-anchor="middle">常見缺失</text>

  <!-- Row 2: ISP半年未檢討 -->
  <rect x="28" y="193" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="193" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="66" cy="224" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="230" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <text x="100" y="221" font-size="20" fill="#1e293b" font-weight="700">ISP 半年未依規定檢討修正（4103）</text>
  <text x="100" y="243" font-size="16" fill="#57534e">每半年至少檢討1次・修正結果需告知本人/家屬並有紀錄</text>
  <rect x="620" y="201" width="136" height="46" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="215" font-size="14" fill="#78716c" text-anchor="middle">4103</text>
  <text x="688" y="233" font-size="14" fill="#78716c" text-anchor="middle">第3項標準</text>

  <!-- Row 3: 消防檢修申報不完整 -->
  <rect x="28" y="268" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="268" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="66" cy="299" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="305" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <text x="100" y="296" font-size="20" fill="#1e293b" font-weight="700">消防安全設備檢修申報未備 3 年紀錄（3105）</text>
  <text x="100" y="318" font-size="16" fill="#57534e">核心指標・需完整備有近3年半年申報資料・初檢不合格需複檢</text>
  <rect x="620" y="276" width="136" height="46" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="290" font-size="14" fill="#57534e" text-anchor="middle">核心指標</text>
  <text x="688" y="308" font-size="14" fill="#57534e" text-anchor="middle">3105</text>

  <!-- Row 4: 員工訓練時數不足 -->
  <rect x="28" y="343" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="343" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="374" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="380" font-size="16" fill="#a8a29e" text-anchor="middle" font-weight="900">4</text>
  <text x="100" y="371" font-size="20" fill="#1e293b" font-weight="700">直接服務人員在職訓練時數不足 20 小時（1105）</text>
  <text x="100" y="393" font-size="16" fill="#57534e">含4小時應急管制訓練・2小時口腔照護・消防演練不計入</text>
  <rect x="620" y="351" width="136" height="46" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="365" font-size="14" fill="#1e293b" text-anchor="middle">1105</text>
  <text x="688" y="383" font-size="14" fill="#57534e" text-anchor="middle">3分項目</text>

  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
