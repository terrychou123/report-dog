<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <rect x="0" y="0" width="800" height="90" fill="#0d9488"/>
  <text x="400" y="38" font-size="22" font-weight="bold" fill="white" text-anchor="middle" font-family="sans-serif">C15. 護理站設施設備設置（一級必要）</text>
  <text x="400" y="68" font-size="16" fill="#ccfbf1" text-anchor="middle" font-family="sans-serif">每層樓需設護理站 ｜ 115年度老人福利機構評鑑</text>

  <!-- N=3 版型：H=90, outer_gap=38, Row y: 128/231/334 -->

  <!-- Row 1 -->
  <rect x="30" y="128" width="740" height="90" rx="8" fill="white"/>
  <rect x="30" y="128" width="6" height="90" rx="3" fill="#d97706"/>
  <circle cx="66" cy="173" r="16" fill="#d97706"/>
  <text x="66" y="178" font-size="14" font-weight="bold" fill="white" text-anchor="middle" font-family="sans-serif">1</text>
  <text x="100" y="160" font-size="18" font-weight="bold" fill="#1e293b" font-family="sans-serif">護理站基本配備要求</text>
  <text x="100" y="183" font-size="14" fill="#57534e" font-family="sans-serif">急救設備、準備室、護理紀錄欄、藥品醫材存放櫃、工作台、</text>
  <text x="100" y="202" font-size="14" fill="#57534e" font-family="sans-serif">治療車、洗手設備及緊急應變急救裝備，缺一不可</text>
  <rect x="620" y="151" width="136" height="46" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="688" y="170" font-size="14" fill="#dc2626" text-anchor="middle" font-family="sans-serif">8 項必備</text>
  <text x="688" y="189" font-size="13" fill="#dc2626" text-anchor="middle" font-family="sans-serif">設備</text>

  <!-- Row 2 -->
  <rect x="30" y="231" width="740" height="90" rx="8" fill="white"/>
  <rect x="30" y="231" width="6" height="90" rx="3" fill="#78716c"/>
  <circle cx="66" cy="276" r="16" fill="#78716c"/>
  <text x="66" y="281" font-size="14" font-weight="bold" fill="white" text-anchor="middle" font-family="sans-serif">2</text>
  <text x="100" y="263" font-size="18" font-weight="bold" fill="#1e293b" font-family="sans-serif">樓層覆蓋與氧氣瓶要求</text>
  <text x="100" y="286" font-size="14" fill="#57534e" font-family="sans-serif">每層樓設護理站或簡易護理工作站；機構內至少 1 處護理站；</text>
  <text x="100" y="305" font-size="14" fill="#57534e" font-family="sans-serif">氧氣瓶須在有效期限內；每護理站至少 1 套急救設備</text>
  <rect x="620" y="254" width="136" height="46" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="688" y="273" font-size="14" fill="#d97706" text-anchor="middle" font-family="sans-serif">每層設置</text>
  <text x="688" y="292" font-size="13" fill="#d97706" text-anchor="middle" font-family="sans-serif">氧氣在效期</text>

  <!-- Row 3 -->
  <rect x="30" y="334" width="740" height="90" rx="8" fill="white"/>
  <rect x="30" y="334" width="6" height="90" rx="3" fill="#57534e"/>
  <circle cx="66" cy="379" r="16" fill="#57534e"/>
  <text x="66" y="384" font-size="14" font-weight="bold" fill="white" text-anchor="middle" font-family="sans-serif">3</text>
  <text x="100" y="366" font-size="18" font-weight="bold" fill="#1e293b" font-family="sans-serif">人員熟悉度與定期查核</text>
  <text x="100" y="389" font-size="14" fill="#57534e" font-family="sans-serif">護理人員應熟悉各項急救設備與藥品的正確使用機制；</text>
  <text x="100" y="408" font-size="14" fill="#57534e" font-family="sans-serif">評鑑委員現場抽驗用物熟悉度及急救設備功能，需定期查核有紀錄</text>
  <rect x="620" y="357" width="136" height="46" rx="6" fill="#f0fdf4" stroke="#0d9488" stroke-width="1.5"/>
  <text x="688" y="376" font-size="14" fill="#0d9488" text-anchor="middle" font-family="sans-serif">現場抽驗</text>
  <text x="688" y="395" font-size="13" fill="#0d9488" text-anchor="middle" font-family="sans-serif">定期紀錄</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" font-family="sans-serif">報告汪 reportwang.com</text>
</svg>
