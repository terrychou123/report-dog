<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <rect x="0" y="0" width="800" height="90" fill="#0d9488"/>
  <text x="400" y="38" font-size="22" font-weight="bold" fill="white" text-anchor="middle" >C15. 護理站設施設備設置（一級必要）</text>
  <text x="400" y="68" font-size="16" fill="#ccfbf1" text-anchor="middle" >每層樓需設護理站 ｜ 115年度老人福利機構評鑑</text>

  <!-- N=3 版型：H=90, outer_gap=38, Row y: 128/231/334 -->

  <!-- Row 1 -->
  <rect x="30" y="128" width="740" height="90" rx="8" fill="white"/>
  <rect x="30" y="128" width="6" height="90" rx="2" fill="#d97706"/>
  <circle cx="66" cy="173" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="178" font-size="14" font-weight="bold" fill="white" text-anchor="middle" >1</text>
  <text x="100" y="160" font-size="18" font-weight="bold" fill="#1e293b" >護理站基本配備要求</text>
  <text x="100" y="183" font-size="16" fill="#57534e" >急救設備、準備室、護理紀錄欄、藥品醫材存放櫃、工作台、</text>
  <text x="100" y="202" font-size="16" fill="#57534e" >治療車、洗手設備及緊急應變急救裝備，缺一不可</text>
  <rect x="620" y="151" width="136" height="46" rx="8" fill="#fef2f2" opacity="0.12"/>
  <text x="688" y="169" font-size="14" fill="#dc2626" text-anchor="middle" >8 項必備</text>
  <text x="688" y="188" font-size="14" fill="#dc2626" text-anchor="middle" >設備</text>

  <!-- Row 2 -->
  <rect x="30" y="231" width="740" height="90" rx="8" fill="white"/>
  <rect x="30" y="231" width="6" height="90" rx="2" fill="#78716c"/>
  <circle cx="66" cy="276" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="281" font-size="14" font-weight="bold" fill="white" text-anchor="middle" >2</text>
  <text x="100" y="263" font-size="18" font-weight="bold" fill="#1e293b" >樓層覆蓋與氧氣瓶要求</text>
  <text x="100" y="286" font-size="16" fill="#57534e" >每層樓設護理站或簡易護理工作站；機構內至少 1 處護理站；</text>
  <text x="100" y="305" font-size="16" fill="#57534e" >氧氣瓶須在有效期限內；每護理站至少 1 套急救設備</text>
  <rect x="620" y="254" width="136" height="46" rx="8" fill="#fef3c7" opacity="0.12"/>
  <text x="688" y="272" font-size="14" fill="#d97706" text-anchor="middle" >每層設置</text>
  <text x="688" y="291" font-size="14" fill="#d97706" text-anchor="middle" >氧氣在效期</text>

  <!-- Row 3 -->
  <rect x="30" y="334" width="740" height="90" rx="8" fill="white"/>
  <rect x="30" y="334" width="6" height="90" rx="2" fill="#57534e"/>
  <circle cx="66" cy="379" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="384" font-size="14" font-weight="bold" fill="white" text-anchor="middle" >3</text>
  <text x="100" y="366" font-size="18" font-weight="bold" fill="#1e293b" >人員熟悉度與定期查核</text>
  <text x="100" y="389" font-size="16" fill="#57534e" >護理人員應熟悉各項急救設備與藥品的正確使用機制；</text>
  <text x="100" y="408" font-size="16" fill="#57534e" >評鑑委員現場抽驗用物熟悉度及急救設備功能，需定期查核有紀錄</text>
  <rect x="620" y="357" width="136" height="46" rx="8" fill="#f0fdf4" opacity="0.12"/>
  <text x="688" y="375" font-size="14" fill="#0d9488" text-anchor="middle" >現場抽驗</text>
  <text x="688" y="394" font-size="14" fill="#0d9488" text-anchor="middle" >定期紀錄</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" >報告汪 reportwang.com</text>
</svg>
