  <text x="918" y="455" font-size="22" fill="#a8a29e" text-anchor="middle">全面評核</text>

  <rect x="1005" y="395" width="155" height="86" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="1083" y="424" font-size="28" fill="#d97706" text-anchor="middle" font-weight="700">115 年度</text>
  <text x="1083" y="455" font-size="22" fill="#a8a29e" text-anchor="middle">臺北市版</text>

