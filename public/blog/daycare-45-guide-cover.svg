  <line x1="60" y1="365" x2="780" y2="365" stroke="#dedad3" stroke-width="2"/>

  <text x="60" y="416" font-size="38" fill="#57534e" font-weight="400">115 年度臺北市 · 逐條對照 · 含加分項</text>

