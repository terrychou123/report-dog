<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">

  <!-- 背景：米黃暖色 -->
  <rect width="1200" height="630" fill="#f0efe8"/>

  <!-- 右側裝飾塊 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de" rx="0"/>

  <!-- 頂部標籤 -->
  <rect x="60" y="55" width="130" height="32" rx="16" fill="#78716c"/>
  <text x="125" y="76" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="14" fill="white" font-weight="600">評鑑準備指南</text>

  <!-- 主標題 -->
  <text x="60" y="160" font-family="'Noto Sans TC', sans-serif" font-size="58" fill="#1e293b" font-weight="700">日照中心評鑑</text>
  <text x="60" y="230" font-family="'Noto Sans TC', sans-serif" font-size="58" fill="#d97706" font-weight="700">45 題全攻略</text>

  <!-- 副標題 -->
  <text x="60" y="278" font-family="'Noto Sans TC', sans-serif" font-size="20" fill="#64748b">115 年度 · 43 項正式基準 + 2 項加分題 · 逐條解析＋準備秘笈</text>

  <!-- 分隔線 -->
  <line x1="60" y1="302" x2="500" y2="302" stroke="#dedad3" stroke-width="1.5"/>

  <!-- 五大面向卡片 -->
  <!-- 壹 個案權益保障 -->
  <rect x="60" y="330" width="195" height="100" rx="12" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="60" y="330" width="195" height="6" rx="3" fill="#94a3b8"/>
  <rect x="60" y="333" width="195" height="3" fill="#94a3b8"/>
  <text x="80" y="368" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#78716c">壹、個案權益保障</text>
  <text x="80" y="400" font-family="'Noto Sans TC', sans-serif" font-size="36" fill="#1e293b" font-weight="700">4</text>
  <text x="118" y="400" font-family="'Noto Sans TC', sans-serif" font-size="14" fill="#64748b"> 項</text>
  <text x="80" y="422" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#94a3b8">第 1–4 條</text>

  <!-- 貳 專業照護品質 -->
  <rect x="270" y="330" width="195" height="100" rx="12" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="270" y="330" width="195" height="6" rx="3" fill="#a8a29e"/>
  <rect x="270" y="333" width="195" height="3" fill="#a8a29e"/>
  <text x="290" y="368" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#78716c">貳、專業照護品質</text>
  <text x="290" y="400" font-family="'Noto Sans TC', sans-serif" font-size="36" fill="#1e293b" font-weight="700">18</text>
  <text x="338" y="400" font-family="'Noto Sans TC', sans-serif" font-size="14" fill="#64748b"> 項</text>
  <text x="290" y="422" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#94a3b8">第 5–22 條 · 最核心面向</text>

  <!-- 參 經營管理效能 -->
  <rect x="480" y="330" width="195" height="100" rx="12" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="480" y="330" width="195" height="6" rx="3" fill="#a3a3a3"/>
  <rect x="480" y="333" width="195" height="3" fill="#a3a3a3"/>
  <text x="500" y="368" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#78716c">參、經營管理效能</text>
  <text x="500" y="400" font-family="'Noto Sans TC', sans-serif" font-size="36" fill="#1e293b" font-weight="700">15</text>
  <text x="548" y="400" font-family="'Noto Sans TC', sans-serif" font-size="14" fill="#64748b"> 項</text>
  <text x="500" y="422" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#94a3b8">第 23–37 條</text>

  <!-- 肆 安全環境設備 -->
  <rect x="690" y="330" width="195" height="100" rx="12" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="690" y="330" width="195" height="6" rx="3" fill="#78716c"/>
  <rect x="690" y="333" width="195" height="3" fill="#78716c"/>
  <text x="710" y="368" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#78716c">肆、安全環境設備</text>
  <text x="710" y="400" font-family="'Noto Sans TC', sans-serif" font-size="36" fill="#1e293b" font-weight="700">6</text>
  <text x="748" y="400" font-family="'Noto Sans TC', sans-serif" font-size="14" fill="#64748b"> 項</text>
  <text x="710" y="422" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#94a3b8">第 38–43 條</text>

  <!-- 伍 加分題 -->
  <rect x="900" y="330" width="195" height="100" rx="12" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="900" y="330" width="195" height="6" rx="3" fill="#d97706"/>
  <rect x="900" y="333" width="195" height="3" fill="#d97706"/>
  <text x="920" y="368" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#78716c">伍、加分題</text>
  <text x="920" y="400" font-family="'Noto Sans TC', sans-serif" font-size="36" fill="#d97706" font-weight="700">+3</text>
  <text x="968" y="400" font-family="'Noto Sans TC', sans-serif" font-size="14" fill="#64748b"> 分</text>
  <text x="920" y="422" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#94a3b8">第 44–45 條</text>

  <!-- 底部資訊 -->
  <text x="60" y="492" font-family="'Noto Sans TC', sans-serif" font-size="16" fill="#94a3b8">本文涵蓋：社工師 · 護理師 · 照服員 · 業務負責人角色分工策略</text>

  <!-- 浮水印 -->
  <text x="1140" y="618" text-anchor="end" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#c4bfb8">報告汪 reportwang.com</text>

  <!-- 右側裝飾文字 -->
  <text x="1010" y="200" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="80" fill="#dedad3" font-weight="700">45</text>
  <text x="1010" y="260" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="18" fill="#a8a29e">題全攻略</text>
  <!-- 裝飾線條 -->
  <line x1="900" y1="290" x2="1110" y2="290" stroke="#dedad3" stroke-width="1"/>
  <text x="1010" y="318" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="14" fill="#78716c">115 年度臺北市版</text>
</svg>
