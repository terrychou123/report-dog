<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 頂部標題區塊 -->
  <rect x="0" y="0" width="800" height="108" rx="0" fill="#1e293b"/>
  <text x="400" y="52"  font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">消防設備定期維護四大類</text>
  <text x="400" y="82"  font-size="14" fill="#a8a29e" text-anchor="middle">設備完善並有定期維護紀錄，是1.5.2資料查核的核心</text>

  <!-- 列 1 (y=128, H=78)：偵測與警報系統 -->
  <rect x="38" y="128" width="724" height="78" rx="10" fill="#fef3c7"/>
  <rect x="38" y="128" width="6" height="78" rx="2" fill="#d97706"/>
  <circle cx="80" cy="167" r="22" fill="#d97706" opacity="0.15"/>
  <text x="80" y="172"  font-size="14" font-weight="700" fill="#d97706" text-anchor="middle">偵測</text>
  <text x="118" y="151"  font-size="15" font-weight="700" fill="#d97706">偵測與警報系統</text>
  <text x="118" y="172"  font-size="14" fill="#78716c">煙霧偵測器、熱感偵測器、火災警報系統，每半年定期檢查，有維護紀錄</text>
  <rect x="618" y="143" width="120" height="26" rx="13" fill="#d97706"/>
  <text x="678" y="161"  font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">每半年</text>
  <text x="118" y="195"  font-size="14" fill="#a8a29e">合格廠商執行，紀錄含檢查日期、人員、結果，故障需附維修完成憑證</text>

  <!-- 列 2 (y=224, H=78)：滅火設備 -->
  <rect x="38" y="224" width="724" height="78" rx="10" fill="#f5f5f4"/>
  <rect x="38" y="224" width="6" height="78" rx="2" fill="#78716c"/>
  <circle cx="80" cy="263" r="22" fill="#78716c" opacity="0.15"/>
  <text x="80" y="268"  font-size="14" font-weight="700" fill="#78716c" text-anchor="middle">滅火</text>
  <text x="118" y="247"  font-size="15" font-weight="700" fill="#57534e">滅火設備</text>
  <text x="118" y="268"  font-size="14" fill="#78716c">自動灑水系統、滅火器（年度換藥或充填），消防局每年申報，有維護文件</text>
  <rect x="618" y="239" width="120" height="26" rx="13" fill="#78716c"/>
  <text x="678" y="257"  font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">年度申報</text>
  <text x="118" y="291"  font-size="14" fill="#a8a29e">依消防法規每年委由消防安全設備師申報，超過有效期限即構成缺失</text>

  <!-- 列 3 (y=320, H=78)：疏散引導設備 -->
  <rect x="38" y="320" width="724" height="78" rx="10" fill="#f5f5f4"/>
  <rect x="38" y="320" width="6" height="78" rx="2" fill="#57534e"/>
  <circle cx="80" cy="359" r="22" fill="#57534e" opacity="0.15"/>
  <text x="80" y="364"  font-size="14" font-weight="700" fill="#57534e" text-anchor="middle">疏散</text>
  <text x="118" y="343"  font-size="15" font-weight="700" fill="#57534e">疏散引導設備</text>
  <text x="118" y="364"  font-size="14" fill="#78716c">緊急出口標示燈、緊急照明設備，定期測試確保緊急時亮起，有測試紀錄</text>
  <rect x="618" y="335" width="120" height="26" rx="13" fill="#57534e"/>
  <text x="678" y="353"  font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">月度測試</text>
  <text x="118" y="387"  font-size="14" fill="#a8a29e">每月至少測試一次，確認緊急斷電時燈具正常，評鑑委員可能要求現場演示</text>

  <!-- 列 4 (y=416, H=60)：緊急廣播與通訊 -->
  <rect x="38" y="408" width="724" height="62" rx="10" fill="#f5f5f4"/>
  <rect x="38" y="408" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="80" cy="439" r="22" fill="#a8a29e" opacity="0.15"/>
  <text x="80" y="444"  font-size="14" font-weight="700" fill="#a8a29e" text-anchor="middle">廣播</text>
  <text x="118" y="430"  font-size="15" font-weight="700" fill="#57534e">緊急廣播與通訊</text>
  <text x="118" y="451"  font-size="14" fill="#78716c">緊急廣播系統定期測試，緊急電話通訊線路確認可用，覆蓋全院每個區域</text>
  <rect x="618" y="421" width="120" height="26" rx="13" fill="#a8a29e"/>
  <text x="678" y="439"  font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">通訊確認</text>

  <!-- 浮水印 -->
  <text x="400" y="487"  font-size="14" fill="#a8a29e" text-anchor="middle" opacity="0.7">報告汪 reportwang.com</text>
</svg>
