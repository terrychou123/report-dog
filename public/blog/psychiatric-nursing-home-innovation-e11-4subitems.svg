<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <rect x="0" y="50" width="800" height="76" fill="white"/>
  <rect x="0" y="50" width="6" height="76" rx="2" fill="#d97706"/>
  <text x="28" y="104" font-size="36" fill="#1e293b" font-weight="700">E1.1 四個遞進式評分子項</text>
  <rect x="28" y="160" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="160" width="6" height="62" rx="2" fill="#d97706"/>
  <circle cx="66" cy="191" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="197" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">子1</text>
  <text x="100" y="188" font-size="22" fill="#1e293b" font-weight="700">有創新措施之政策或計畫（可行性）</text>
  <text x="100" y="208" font-size="16" fill="#57534e">書面化計畫：背景、目標、執行策略、時程、預期成效</text>
  <rect x="620" y="168" width="136" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="185" font-size="16" fill="#d97706" text-anchor="middle">書面</text>
  <text x="688" y="205" font-size="16" fill="#d97706" text-anchor="middle">計畫</text>
  <rect x="28" y="235" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="235" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="66" cy="266" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="272" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">子2</text>
  <text x="100" y="263" font-size="22" fill="#1e293b" font-weight="700">已執行且有成效評值</text>
  <text x="100" y="283" font-size="16" fill="#57534e">執行記錄、成效數據（執行前後比較），非只有計畫沒有行動</text>
  <rect x="620" y="243" width="136" height="46" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="260" font-size="16" fill="#78716c" text-anchor="middle">執行</text>
  <text x="688" y="280" font-size="16" fill="#78716c" text-anchor="middle">成效</text>
  <rect x="28" y="310" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="310" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="66" cy="341" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="347" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">子3</text>
  <text x="100" y="338" font-size="22" fill="#1e293b" font-weight="700">住民、家屬或工作人員參與</text>
  <text x="100" y="358" font-size="16" fill="#57534e">創新措施的設計或執行有服務對象參與，展示以人為中心</text>
  <rect x="620" y="318" width="136" height="46" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="335" font-size="16" fill="#57534e" text-anchor="middle">參與</text>
  <text x="688" y="355" font-size="16" fill="#57534e" text-anchor="middle">共創</text>
  <rect x="28" y="385" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="385" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="416" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="422" font-size="16" fill="#a8a29e" text-anchor="middle" font-weight="900">子4</text>
  <text x="100" y="413" font-size="22" fill="#1e293b" font-weight="700">有業界推廣或分享價值</text>
  <text x="100" y="433" font-size="16" fill="#57534e">成果具有可複製性或參考價值，可在業界分享學習</text>
  <rect x="620" y="393" width="136" height="46" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="410" font-size="16" fill="#a8a29e" text-anchor="middle">推廣</text>
  <text x="688" y="430" font-size="16" fill="#a8a29e" text-anchor="middle">價值</text>
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
