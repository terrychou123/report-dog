<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 左色塊 -->
  <rect x="0" y="0" width="500" height="630" fill="#d97706" opacity="0.07"/>
  <rect x="60" y="60" width="6" height="510" fill="#d97706" opacity="0.5" rx="2"/>
  <!-- 大數字裝飾 -->
  <text x="80" y="400" font-size="320" font-weight="900" fill="#d97706" opacity="0.10">30</text>
  <!-- 主標題 -->
  <text x="90" y="155" font-size="50" font-weight="900" fill="#1c1917">護理之家</text>
  <text x="90" y="218" font-size="50" font-weight="900" fill="#d97706">新任護理長</text>
  <text x="90" y="280" font-size="44" font-weight="900" fill="#1c1917">30 天上手指南</text>
  <!-- 副標題 -->
  <text x="90" y="336" font-size="38" fill="#78716c">從接手到備戰評鑑的生存攻略</text>
  <rect x="90" y="358" width="120" height="4" fill="#d97706" rx="2"/>
  <!-- 4週計畫卡片 -->
  <!-- 第1週 -->
  <rect x="540" y="60" width="148" height="130" rx="12" fill="#ffffff" opacity="0.9"/>
  <rect x="540" y="60" width="148" height="40" rx="12" fill="#d97706"/>
  <rect x="540" y="88" width="148" height="12" fill="#d97706"/>
  <text x="614" y="87" font-size="24" text-anchor="middle" fill="#ffffff" font-weight="900">第 1 週</text>
  <text x="614" y="118" font-size="24" text-anchor="middle" fill="#d97706" font-weight="700">盤點現況</text>
  <text x="614" y="138" font-size="20" text-anchor="middle" fill="#78716c">索取評鑑報告</text>
  <text x="614" y="156" font-size="20" text-anchor="middle" fill="#78716c">文件現況盤點</text>
  <text x="614" y="174" font-size="20" text-anchor="middle" fill="#78716c">交接清單確認</text>
  <!-- 第2週 -->
  <rect x="708" y="60" width="148" height="130" rx="12" fill="#ffffff" opacity="0.9"/>
  <rect x="708" y="60" width="148" height="40" rx="12" fill="#44403c"/>
  <rect x="708" y="88" width="148" height="12" fill="#44403c"/>
  <text x="782" y="87" font-size="24" text-anchor="middle" fill="#ffffff" font-weight="900">第 2 週</text>
  <text x="782" y="118" font-size="24" text-anchor="middle" fill="#44403c" font-weight="700">識別缺口</text>
  <text x="782" y="138" font-size="20" text-anchor="middle" fill="#78716c">高風險項目</text>
  <text x="782" y="156" font-size="20" text-anchor="middle" fill="#78716c">優先級分類</text>
  <text x="782" y="174" font-size="20" text-anchor="middle" fill="#78716c">缺口清單製作</text>
  <!-- 第3週 -->
  <rect x="876" y="60" width="148" height="130" rx="12" fill="#ffffff" opacity="0.9"/>
  <rect x="876" y="60" width="148" height="40" rx="12" fill="#d97706"/>
  <rect x="876" y="88" width="148" height="12" fill="#d97706"/>
  <text x="950" y="87" font-size="24" text-anchor="middle" fill="#ffffff" font-weight="900">第 3 週</text>
  <text x="950" y="118" font-size="24" text-anchor="middle" fill="#d97706" font-weight="700">建立分工</text>
  <text x="950" y="138" font-size="20" text-anchor="middle" fill="#78716c">15項基準分配</text>
  <text x="950" y="156" font-size="20" text-anchor="middle" fill="#78716c">負責人指定</text>
  <text x="950" y="174" font-size="20" text-anchor="middle" fill="#78716c">週進度追蹤</text>
  <!-- 第4週 -->
  <rect x="1044" y="60" width="148" height="130" rx="12" fill="#ffffff" opacity="0.9"/>
  <rect x="1044" y="60" width="148" height="40" rx="12" fill="#44403c"/>
  <rect x="1044" y="88" width="148" height="12" fill="#44403c"/>
  <text x="1118" y="87" font-size="24" text-anchor="middle" fill="#ffffff" font-weight="900">第 4 週</text>
  <text x="1118" y="118" font-size="24" text-anchor="middle" fill="#44403c" font-weight="700">系統化管理</text>
  <text x="1118" y="138" font-size="20" text-anchor="middle" fill="#78716c">文件系統建立</text>
  <text x="1118" y="156" font-size="20" text-anchor="middle" fill="#78716c">AI查核啟動</text>
  <text x="1118" y="174" font-size="20" text-anchor="middle" fill="#78716c">自評時程設定</text>
  <!-- 箭頭連接 -->
  <text x="697" y="128" font-size="20" fill="#d97706" text-anchor="middle">-</text>
  <text x="866" y="128" font-size="20" fill="#d97706" text-anchor="middle">-</text>
  <text x="1034" y="128" font-size="20" fill="#d97706" text-anchor="middle">-</text>
  <!-- 要點區 -->
  <rect x="540" y="220" width="652" height="170" rx="12" fill="#ffffff" opacity="0.75"/>
  <text x="570" y="254" font-size="24" font-weight="700" fill="#d97706">新任護理長最常犯的錯誤（要避免！）</text>
  <text x="570" y="280" font-size="20" fill="#44403c">[x] 急著改變前任所有文件格式</text>
  <text x="570" y="302" font-size="20" fill="#44403c">[x] 把 15 項基準的文書全部攬在自己身上</text>
  <text x="570" y="324" font-size="20" fill="#44403c">[x] 只準備文件，忽略工作人員實際執行能力</text>
  <text x="570" y="346" font-size="20" fill="#44403c">[x] 不追蹤上次評鑑缺失改善進度</text>
  <!-- 底部裝飾 -->
  <circle cx="1100" cy="560" r="160" fill="#d97706" opacity="0.05"/>
  <!-- 標籤 -->
  <rect x="90" y="390" width="140" height="36" rx="18" fill="#d97706"/>
  <text x="160" y="413" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700">115年度評鑑</text>
  <rect x="250" y="390" width="160" height="36" rx="18" fill="#44403c"/>
  <text x="330" y="413" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700">護理長上手攻略</text>
  <!-- 浮水印 -->
  <text x="1140" y="590" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
