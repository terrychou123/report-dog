<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- Header -->
  <rect x="0" y="50" width="800" height="76" fill="white"/>
  <rect x="0" y="50" width="6" height="76" rx="2" fill="#d97706"/>
  <text x="28" y="104" font-size="36" fill="#1e293b" font-weight="700">DAR vs SOAP 格式使用時機對照</text>

  <!-- Row 1 amber — DAR 適用 -->
  <rect x="28" y="160" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="160" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="66" cy="191" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="197" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">D</text>
  <text x="100" y="185" font-size="22" fill="#1e293b" font-weight="700">DAR 適合：行為事件紀錄</text>
  <text x="100" y="208" font-size="16" fill="#57534e">精神科急性行為事件（情緒激動、拒藥、攻擊）以 DAR 即時記錄</text>
  <rect x="620" y="168" width="136" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="187" font-size="16" fill="#d97706" text-anchor="middle">DAR</text>
  <text x="688" y="207" font-size="16" fill="#d97706" text-anchor="middle">行為事件</text>

  <!-- Row 2 stone-500 — SOAP 適用 -->
  <rect x="28" y="235" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="235" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="66" cy="266" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="272" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">S</text>
  <text x="100" y="260" font-size="22" fill="#1e293b" font-weight="700">SOAP 適合：照護計畫與定期評值</text>
  <text x="100" y="283" font-size="16" fill="#57534e">每 3 月定期評估、照護目標修訂、家屬計畫討論使用 SOAP 格式</text>
  <rect x="620" y="243" width="136" height="46" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="262" font-size="16" fill="#78716c" text-anchor="middle">SOAP</text>
  <text x="688" y="282" font-size="16" fill="#78716c" text-anchor="middle">計畫評值</text>

  <!-- Row 3 stone-600 — 共同必備 -->
  <rect x="28" y="310" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="310" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="341" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="347" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <text x="100" y="335" font-size="22" fill="#1e293b" font-weight="700">兩種格式均需具備：量表數值</text>
  <text x="100" y="358" font-size="16" fill="#57534e">不論 DAR 或 SOAP，O 段均需記錄自傷風險評估量表結果</text>
  <rect x="620" y="318" width="136" height="46" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="337" font-size="16" fill="#57534e" text-anchor="middle">共同</text>
  <text x="688" y="357" font-size="16" fill="#57534e" text-anchor="middle">量表記錄</text>

  <!-- Row 4 stone-400 — 互補使用 -->
  <rect x="28" y="385" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="385" width="6" height="62" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="416" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="422" font-size="16" fill="#a8a29e" text-anchor="middle" font-weight="900">4</text>
  <text x="100" y="410" font-size="22" fill="#1e293b" font-weight="700">互補使用：DAR 事件 + SOAP 計畫</text>
  <text x="100" y="433" font-size="16" fill="#57534e">平日 DAR 記錄日常觀察，每 3 月 SOAP 整合所有 DAR 進行計畫修訂</text>
  <rect x="620" y="393" width="136" height="46" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="412" font-size="16" fill="#a8a29e" text-anchor="middle">最佳實務</text>
  <text x="688" y="432" font-size="16" fill="#a8a29e" text-anchor="middle">互補使用</text>

  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
