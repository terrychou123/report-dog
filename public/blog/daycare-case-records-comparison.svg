<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"
     font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">紀錄品質 NG vs OK 對比</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">從反例學習正確書寫方式，讓記錄通過評鑑檢核</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- 左上卡片（#d97706，NG 主觀空泛）x=40 y=104 w=346 h=168 -->
  <rect x="40" y="104" width="346" height="168" rx="12" fill="white"/>
  <rect x="40" y="104" width="346" height="44" rx="12" fill="#d97706"/>
  <rect x="40" y="128" width="346" height="20" fill="#d97706"/>
  <circle cx="68" cy="126" r="9" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
  <circle cx="68" cy="126" r="3" fill="white" opacity="0.8"/>
  <text x="213" y="133" text-anchor="middle" font-size="15" fill="white" font-weight="700">NG：主觀空泛描述</text>
  <text x="60" y="172" font-size="14" fill="#57534e">• 「今天個案情緒不好」</text>
  <text x="60" y="192" font-size="14" fill="#57534e">• 「狀況穩定」「尚好」等模糊詞</text>
  <text x="60" y="212" font-size="14" fill="#57534e">• 看不出具體觀察事實</text>
  <text x="60" y="232" font-size="14" fill="#57534e">• 無法提供評鑑所需的客觀依據</text>
  <rect x="56" y="246" width="80" height="20" rx="10" fill="#fef3c7"/>
  <text x="96" y="260" text-anchor="middle" font-size="14" fill="#d97706" font-weight="600">扣分風險</text>

  <!-- 右上卡片（#78716c，OK 客觀具體）x=414 y=104 w=346 h=168 -->
  <rect x="414" y="104" width="346" height="168" rx="12" fill="white"/>
  <rect x="414" y="104" width="346" height="44" rx="12" fill="#78716c"/>
  <rect x="414" y="128" width="346" height="20" fill="#78716c"/>
  <rect x="438" y="117" width="18" height="18" rx="3" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
  <line x1="441" y1="126" x2="453" y2="126" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
  <text x="587" y="133" text-anchor="middle" font-size="15" fill="white" font-weight="700">OK：客觀具體描述</text>
  <text x="434" y="172" font-size="14" fill="#57534e">• 「09:30 個案拒絕用餐，表情皺眉」</text>
  <text x="434" y="192" font-size="14" fill="#57534e">• 記錄時間、行為事實與量化數據</text>
  <text x="434" y="212" font-size="14" fill="#57534e">• 用 5W1H 架構描述可觀察事實</text>
  <text x="434" y="232" font-size="14" fill="#57534e">• 避免主觀判斷用詞</text>
  <rect x="430" y="246" width="80" height="20" rx="10" fill="#f5f5f4"/>
  <text x="470" y="260" text-anchor="middle" font-size="14" fill="#78716c" font-weight="600">評鑑合格</text>

  <!-- 左下卡片（#57534e，NG 缺乏追蹤）x=40 y=288 w=346 h=162 -->
  <rect x="40" y="288" width="346" height="162" rx="12" fill="white"/>
  <rect x="40" y="288" width="346" height="44" rx="12" fill="#57534e"/>
  <rect x="40" y="312" width="346" height="20" fill="#57534e"/>
  <line x1="60" y1="309" x2="68" y2="317" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-linecap="round"/>
  <line x1="68" y1="317" x2="84" y2="301" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-linecap="round"/>
  <text x="213" y="317" text-anchor="middle" font-size="15" fill="white" font-weight="700">NG：缺乏後續追蹤</text>
  <text x="60" y="356" font-size="14" fill="#57534e">• 記錄問題後沒有後續評值記錄</text>
  <text x="60" y="376" font-size="14" fill="#57534e">• 照護計畫從未更新修改</text>
  <text x="60" y="396" font-size="14" fill="#57534e">• 無法呈現動態照護的連續性</text>
  <text x="60" y="416" font-size="14" fill="#57534e">• 委員查閱時看不到改善軌跡</text>
  <rect x="56" y="430" width="80" height="20" rx="10" fill="#f5f0eb"/>
  <text x="96" y="444" text-anchor="middle" font-size="14" fill="#57534e" font-weight="600">扣分項目</text>

  <!-- 右下卡片（#a8a29e，OK 持續追蹤）x=414 y=288 w=346 h=162 -->
  <rect x="414" y="288" width="346" height="162" rx="12" fill="white"/>
  <rect x="414" y="288" width="346" height="44" rx="12" fill="#a8a29e"/>
  <rect x="414" y="312" width="346" height="20" fill="#a8a29e"/>
  <circle cx="440" cy="310" r="8" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
  <line x1="440" y1="302" x2="440" y2="307" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
  <circle cx="440" cy="314" r="2" fill="rgba(255,255,255,0.7)"/>
  <text x="587" y="317" text-anchor="middle" font-size="15" fill="white" font-weight="700">OK：持續追蹤評值</text>
  <text x="434" y="356" font-size="14" fill="#57534e">• 每筆記錄標記下次評值時間</text>
  <text x="434" y="376" font-size="14" fill="#57534e">• 照護計畫隨狀況變化動態更新</text>
  <text x="434" y="396" font-size="14" fill="#57534e">• 記錄呈現完整照護軌跡</text>
  <text x="434" y="416" font-size="14" fill="#57534e">• 評鑑委員可清楚看到改善成效</text>
  <rect x="430" y="430" width="80" height="20" rx="10" fill="#f5f5f4"/>
  <text x="470" y="444" text-anchor="middle" font-size="14" fill="#a8a29e" font-weight="600">評鑑加分</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
