<svg width="800" height="480" viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans TC', sans-serif">
  <!-- 主背景 -->
  <rect width="800" height="480" fill="#f0efe8"/>

  <!-- 頂部標題區域 -->
  <rect x="0" y="0" width="800" height="64" fill="#1e293b"/>
  <text x="400" y="38" font-size="20" font-weight="700" fill="#f0efe8" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">專業紀錄 vs. NG 寫法對照</text>
  <text x="400" y="56" font-size="13" fill="#94a3b8" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">對應評鑑基準第 5、6、7 條</text>

  <!-- 左欄標題（NG） -->
  <rect x="20" y="78" width="370" height="38" rx="8" fill="#e8d5d5" opacity="0.7"/>
  <text x="32" y="100" font-size="16" font-weight="700" fill="#c0392b" font-family="'Noto Sans TC', sans-serif">✗  NG 寫法（評鑑時會被標記）</text>

  <!-- 右欄標題（OK） -->
  <rect x="410" y="78" width="370" height="38" rx="8" fill="#d5e8d8" opacity="0.7"/>
  <text x="422" y="100" font-size="16" font-weight="700" fill="#1e7e34" font-family="'Noto Sans TC', sans-serif">✓  專業寫法（符合評鑑要求）</text>

  <!-- 中間分隔線 -->
  <line x1="400" y1="72" x2="400" y2="460" stroke="#dedad3" stroke-width="2"/>

  <!-- 條目 1：評估紀錄（第5條） -->
  <!-- 條文標籤 -->
  <rect x="20" y="126" width="50" height="20" rx="10" fill="#d97706" opacity="0.2"/>
  <text x="45" y="140" font-size="11" fill="#d97706" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">第5條</text>
  <rect x="410" y="126" width="50" height="20" rx="10" fill="#d97706" opacity="2"/>
  <text x="435" y="140" font-size="11" fill="#d97706" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">第5條</text>

  <!-- NG 內容 1 -->
  <rect x="20" y="150" width="370" height="52" rx="8" fill="#e8e6de"/>
  <rect x="20" y="150" width="4" height="52" rx="2" fill="#e57373"/>
  <text x="34" y="171" font-size="13" fill="#78716c" font-family="'Noto Sans TC', sans-serif">「整體狀況尚可，日常生活功能</text>
  <text x="34" y="191" font-size="13" fill="#78716c" font-family="'Noto Sans TC', sans-serif">維持穩定。」</text>

  <!-- OK 內容 1 -->
  <rect x="410" y="150" width="370" height="52" rx="8" fill="#e8e6de"/>
  <rect x="410" y="150" width="4" height="52" rx="2" fill="#4caf50"/>
  <text x="424" y="165" font-size="12" fill="#1e293b" font-family="'Noto Sans TC', sans-serif">「ADL 評估：45分（使用巴氏量表），</text>
  <text x="424" y="181" font-size="12" fill="#1e293b" font-family="'Noto Sans TC', sans-serif">無法自行如廁，需協助沐浴；MMSE</text>
  <text x="424" y="197" font-size="12" fill="#1e293b" font-family="'Noto Sans TC', sans-serif">18分，輕度認知障礙。」</text>

  <!-- 條目 2：照顧計畫（第6條） -->
  <rect x="20" y="212" width="50" height="20" rx="10" fill="#64748b" opacity="0.2"/>
  <text x="45" y="226" font-size="11" fill="#64748b" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">第6條</text>
  <rect x="410" y="212" width="50" height="20" rx="10" fill="#64748b" opacity="0.2"/>
  <text x="435" y="226" font-size="11" fill="#64748b" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">第6條</text>

  <!-- NG 內容 2 -->
  <rect x="20" y="236" width="370" height="52" rx="8" fill="#e8e6de"/>
  <rect x="20" y="236" width="4" height="52" rx="2" fill="#e57373"/>
  <text x="34" y="257" font-size="13" fill="#78716c" font-family="'Noto Sans TC', sans-serif">「照顧目標：維持現況，提供所需</text>
  <text x="34" y="277" font-size="13" fill="#78716c" font-family="'Noto Sans TC', sans-serif">照顧服務。」</text>

  <!-- OK 內容 2 -->
  <rect x="410" y="236" width="370" height="52" rx="8" fill="#e8e6de"/>
  <rect x="410" y="236" width="4" height="52" rx="2" fill="#4caf50"/>
  <text x="424" y="251" font-size="12" fill="#1e293b" font-family="'Noto Sans TC', sans-serif">「目標：3個月內如廁能力維持在</text>
  <text x="424" y="267" font-size="12" fill="#1e293b" font-family="'Noto Sans TC', sans-serif">輔助下可自行完成（依個案需求訂</text>
  <text x="424" y="283" font-size="12" fill="#1e293b" font-family="'Noto Sans TC', sans-serif">定，含家屬確認簽名）」</text>

  <!-- 條目 3：個案意見（第6條） -->
  <rect x="20" y="298" width="50" height="20" rx="10" fill="#64748b" opacity="0.2"/>
  <text x="45" y="312" font-size="11" fill="#64748b" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">第6條</text>
  <rect x="410" y="298" width="50" height="20" rx="10" fill="#64748b" opacity="0.2"/>
  <text x="435" y="312" font-size="11" fill="#64748b" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">第6條</text>

  <!-- NG 內容 3 -->
  <rect x="20" y="322" width="370" height="52" rx="8" fill="#e8e6de"/>
  <rect x="20" y="322" width="4" height="52" rx="2" fill="#e57373"/>
  <text x="34" y="343" font-size="13" fill="#78716c" font-family="'Noto Sans TC', sans-serif">「持續照顧中，無特殊狀況，按計</text>
  <text x="34" y="363" font-size="13" fill="#78716c" font-family="'Noto Sans TC', sans-serif">畫執行。」（未記錄個案反應）</text>

  <!-- OK 內容 3 -->
  <rect x="410" y="322" width="370" height="52" rx="8" fill="#e8e6de"/>
  <rect x="410" y="322" width="4" height="52" rx="2" fill="#4caf50"/>
  <text x="424" y="337" font-size="12" fill="#1e293b" font-family="'Noto Sans TC', sans-serif">「03/15 長輩主動表示想學摺紙，</text>
  <text x="424" y="353" font-size="12" fill="#1e293b" font-family="'Noto Sans TC', sans-serif">已與家屬討論並納入週活動計畫，</text>
  <text x="424" y="369" font-size="12" fill="#1e293b" font-family="'Noto Sans TC', sans-serif">家屬表示支持。」</text>

  <!-- 條目 4：追蹤評值（第7條） -->
  <rect x="20" y="384" width="50" height="20" rx="10" fill="#d97706" opacity="0.2"/>
  <text x="45" y="398" font-size="11" fill="#d97706" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">第7條</text>
  <rect x="410" y="384" width="50" height="20" rx="10" fill="#d97706" opacity="0.2"/>
  <text x="435" y="398" font-size="11" fill="#d97706" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">第7條</text>

  <!-- NG 內容 4 -->
  <rect x="20" y="408" width="370" height="42" rx="8" fill="#e8e6de"/>
  <rect x="20" y="408" width="4" height="42" rx="2" fill="#e57373"/>
  <text x="34" y="429" font-size="13" fill="#78716c" font-family="'Noto Sans TC', sans-serif">「評值：計畫繼續執行，狀況穩</text>
  <text x="34" y="445" font-size="13" fill="#78716c" font-family="'Noto Sans TC', sans-serif">定。」（無達成率、無分析）</text>

  <!-- OK 內容 4 -->
  <rect x="410" y="408" width="370" height="42" rx="8" fill="#e8e6de"/>
  <rect x="410" y="408" width="4" height="42" rx="2" fill="#4caf50"/>
  <text x="424" y="423" font-size="12" fill="#1e293b" font-family="'Noto Sans TC', sans-serif">「部分達成（7/10次成功）；未達成</text>
  <text x="424" y="439" font-size="12" fill="#1e293b" font-family="'Noto Sans TC', sans-serif">原因：情緒低落日增加，已修正計畫。」</text>

  <!-- 浮水印 -->
  <text x="756" y="470" font-size="13" fill="#c4bfb8" text-anchor="end" font-family="'Noto Sans TC', sans-serif">報告汪 reportwang.com</text>
</svg>
