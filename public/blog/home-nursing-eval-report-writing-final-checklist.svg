<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- Header（y=31, h=54） -->
  <rect x="0" y="31" width="800" height="54" fill="#e8e6de"/>
  <rect x="0" y="31" width="6" height="54" rx="2" fill="#d97706"/>
  <text x="28" y="73" font-size="32" fill="#1e293b" font-weight="700">A5 季報最終 6 項檢查清單</text>

  <!-- Row 1（y=95, #d97706 琥珀） -->
  <rect x="28" y="95" width="744" height="54" rx="12" fill="#e8e6de"/>
  <rect x="28" y="95" width="6" height="54" rx="2" fill="#d97706"/>
  <circle cx="66" cy="122" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="128" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <text x="100" y="119" font-size="18" fill="#1e293b" font-weight="700">封面頁期間正確</text>
  <text x="100" y="138" font-size="14" fill="#57534e">月份對應，報告期間不可有誤</text>
  <rect x="620" y="103" width="136" height="38" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="116" font-size="14" fill="#d97706" text-anchor="middle">基本</text>
  <text x="688" y="134" font-size="14" fill="#d97706" text-anchor="middle">必查</text>

  <!-- Row 2（y=159, #78716c 暖灰） -->
  <rect x="28" y="159" width="744" height="54" rx="12" fill="#e8e6de"/>
  <rect x="28" y="159" width="6" height="54" rx="2" fill="#78716c"/>
  <circle cx="66" cy="186" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="192" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <text x="100" y="183" font-size="18" fill="#1e293b" font-weight="700">各指標數值一致</text>
  <text x="100" y="202" font-size="14" fill="#57534e">與原始記錄完全吻合，交叉核對不遺漏</text>
  <rect x="620" y="167" width="136" height="38" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="180" font-size="14" fill="#78716c" text-anchor="middle">數值</text>
  <text x="688" y="198" font-size="14" fill="#78716c" text-anchor="middle">核對</text>

  <!-- Row 3（y=223, #57534e 深棕） -->
  <rect x="28" y="223" width="744" height="54" rx="12" fill="#e8e6de"/>
  <rect x="28" y="223" width="6" height="54" rx="2" fill="#57534e"/>
  <circle cx="66" cy="250" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="256" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <text x="100" y="247" font-size="18" fill="#1e293b" font-weight="700">計算方式前後一致</text>
  <text x="100" y="266" font-size="14" fill="#57534e">與指標定義文件計算方式完全相同，不可季季不同</text>
  <rect x="620" y="231" width="136" height="38" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="244" font-size="14" fill="#57534e" text-anchor="middle">前後</text>
  <text x="688" y="262" font-size="14" fill="#57534e" text-anchor="middle">一致性</text>

  <!-- Row 4（y=287, #a8a29e 淺灰） -->
  <rect x="28" y="287" width="744" height="54" rx="12" fill="#e8e6de"/>
  <rect x="28" y="287" width="6" height="54" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="314" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="320" font-size="16" fill="#a8a29e" text-anchor="middle" font-weight="900">4</text>
  <text x="100" y="311" font-size="18" fill="#1e293b" font-weight="700">未達標有改善計畫</text>
  <text x="100" y="330" font-size="14" fill="#57534e">每項未達標指標均有對應具體改善措施</text>
  <rect x="620" y="295" width="136" height="38" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="308" font-size="14" fill="#a8a29e" text-anchor="middle">缺項</text>
  <text x="688" y="326" font-size="14" fill="#a8a29e" text-anchor="middle">補齊</text>

  <!-- Row 5（y=351, #94a3b8 藍灰） -->
  <rect x="28" y="351" width="744" height="54" rx="12" fill="#e8e6de"/>
  <rect x="28" y="351" width="6" height="54" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="378" r="16" fill="#94a3b8" opacity="0.15"/>
  <text x="66" y="384" font-size="16" fill="#94a3b8" text-anchor="middle" font-weight="900">5</text>
  <text x="100" y="375" font-size="18" fill="#1e293b" font-weight="700">上季改善有追蹤</text>
  <text x="100" y="394" font-size="14" fill="#57534e">上季改善計畫執行狀況有明確記載</text>
  <rect x="620" y="359" width="136" height="38" rx="8" fill="#94a3b8" opacity="0.12"/>
  <text x="688" y="372" font-size="14" fill="#94a3b8" text-anchor="middle">追蹤</text>
  <text x="688" y="390" font-size="14" fill="#94a3b8" text-anchor="middle">閉環</text>

  <!-- Row 6（y=415, #6b7280 中灰） -->
  <rect x="28" y="415" width="744" height="54" rx="12" fill="#e8e6de"/>
  <rect x="28" y="415" width="6" height="54" rx="2" fill="#6b7280"/>
  <circle cx="66" cy="442" r="16" fill="#6b7280" opacity="0.15"/>
  <text x="66" y="448" font-size="16" fill="#6b7280" text-anchor="middle" font-weight="900">6</text>
  <text x="100" y="439" font-size="18" fill="#1e293b" font-weight="700">負責人與核准人簽名</text>
  <text x="100" y="458" font-size="14" fill="#57534e">撰寫人與核准人均需簽名，文件版本日期已更新</text>
  <rect x="620" y="423" width="136" height="38" rx="8" fill="#6b7280" opacity="0.12"/>
  <text x="688" y="436" font-size="14" fill="#6b7280" text-anchor="middle">簽名</text>
  <text x="688" y="454" font-size="14" fill="#6b7280" text-anchor="middle">核准</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
