  <rect x="256" y="395" width="180" height="40" rx="20" fill="#78716c"/>
  <text x="346" y="420" font-size="18" fill="white" text-anchor="middle" font-weight="600">3年中長程</text>
  <rect x="452" y="395" width="180" height="40" rx="20" fill="#57534e"/>
  <text x="542" y="420" font-size="18" fill="white" text-anchor="middle" font-weight="600">改善達100%</text>
  <!-- 右側裝飾 -->
  <rect x="820" y="120" width="320" height="380" rx="20" fill="white" opacity="0.6"/>
