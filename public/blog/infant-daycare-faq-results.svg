  <text x="100" y="210" font-size="28" fill="#1e293b" font-weight="700">等第如何換算成評鑑結果？</text>
  <text x="100" y="234" font-size="16" fill="#57534e">甲等（85分以上）、乙等（70-84分）、丙等（未達70分）</text>
  <rect x="620" y="185" width="136" height="52" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="205" font-size="16" fill="#d97706" text-anchor="middle">等第</text>
  <text x="688" y="225" font-size="16" fill="#d97706" text-anchor="middle">換算</text>
  <rect x="28" y="269" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="269" width="6" height="90" rx="2" fill="#57534e"/>
  <circle cx="66" cy="314" r="20" fill="#78716c" opacity="0.15"/>
  <text x="66" y="320" font-size="18" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <text x="100" y="313" font-size="28" fill="#1e293b" font-weight="700">收到缺失通知要怎麼辦？</text>
  <text x="100" y="337" font-size="16" fill="#57534e">30 天內提交改善計畫書，說明改善措施與預計完成時間</text>
  <rect x="620" y="288" width="136" height="52" rx="8" fill="#78716c" opacity="0.12"/>
