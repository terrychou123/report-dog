<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- 主標題 -->
  <text x="400" y="48" font-size="24" fill="#1e293b" text-anchor="middle"  font-weight="900">委員三種查核方式與比重</text>
  <!-- 副標 -->
  <text x="400" y="78" font-size="16" fill="#78716c" text-anchor="middle" >了解查核比重，準備才能有效分配心力</text>
  <!-- 分隔線 -->
  <line x1="80" y1="94" x2="720" y2="94" stroke="#e8e6de" stroke-width="2"/>
  <!-- Row 1 -->
  <rect x="60" y="130" width="680" height="90" rx="10" fill="white" stroke="#d97706" stroke-width="2"/>
  <rect x="60" y="130" width="10" height="90" rx="4" fill="#d97706"/>
  <rect x="620" y="148" width="100" height="36" rx="18" fill="#d97706" opacity="0.15"/>
  <text x="670" y="171" font-size="18" fill="#d97706" text-anchor="middle"  font-weight="700">40%</text>
  <text x="100" y="166" font-size="20" fill="#d97706"  font-weight="700">文件查核</text>
  <text x="100" y="200" font-size="16" fill="#57534e" >行政、訓練紀錄、照顧計畫、活動紀錄、健康衛生等所有紙本或電子檔案</text>
  <!-- Row 2 -->
  <rect x="60" y="257" width="680" height="90" rx="10" fill="white" stroke="#78716c" stroke-width="2"/>
  <rect x="60" y="257" width="10" height="90" rx="4" fill="#78716c"/>
  <rect x="620" y="275" width="100" height="36" rx="18" fill="#78716c" opacity="0.15"/>
  <text x="670" y="298" font-size="18" fill="#78716c" text-anchor="middle"  font-weight="700">35%</text>
  <text x="100" y="293" font-size="20" fill="#78716c"  font-weight="700">實地觀察</text>
  <text x="100" y="327" font-size="16" fill="#57534e" >環境設施、托育活動進行、睡床間距（指標 15：30 公分以上）、廚房食物留樣</text>
  <!-- Row 3 -->
  <rect x="60" y="384" width="680" height="90" rx="10" fill="white" stroke="#57534e" stroke-width="2"/>
  <rect x="60" y="384" width="10" height="90" rx="4" fill="#57534e"/>
  <rect x="620" y="402" width="100" height="36" rx="18" fill="#57534e" opacity="0.15"/>
  <text x="670" y="425" font-size="18" fill="#57534e" text-anchor="middle"  font-weight="700">25%</text>
  <text x="100" y="420" font-size="20" fill="#57534e"  font-weight="700">人員訪談</text>
  <text x="100" y="454" font-size="16" fill="#57534e" >訪談負責人、托育人員，了解制度執行狀況，確認說法與文件一致</text>
  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" >報告汪 reportwang.com</text>
</svg>
