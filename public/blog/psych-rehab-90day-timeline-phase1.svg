<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- Header (y=50, h=62) -->
  <rect x="0" y="50" width="800" height="62" fill="white"/>
  <rect x="0" y="50" width="6" height="62" fill="#d97706" rx="2"/>
  <text x="28" y="83" font-size="32" fill="#1e293b" font-weight="700">第一階段 D-90 至 D-60：盤點缺口期</text>

  <!-- Row 1（y=160）D-90 #d97706 -->
  <rect x="28" y="160" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="160" width="6" height="62" rx="2" fill="#d97706"/>
  <circle cx="66" cy="191" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="197" font-size="14" fill="#d97706" text-anchor="middle" font-weight="900">D-90</text>
  <text x="100" y="183" font-size="20" fill="#1e293b" font-weight="700">召開備評啟動會議</text>
  <text x="100" y="207" font-size="16" fill="#57534e">指定三章節負責人，確認可選項目是否申請免評（1.2、1.9/1.11、住宿可3.5）</text>
  <rect x="620" y="168" width="136" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="181" font-size="15" fill="#d97706" text-anchor="middle">分工明確</text>
  <text x="688" y="201" font-size="15" fill="#d97706" text-anchor="middle">責任到人</text>

  <!-- Row 2（y=235）D-80 #78716c -->
  <rect x="28" y="235" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="235" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="66" cy="266" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="272" font-size="14" fill="#78716c" text-anchor="middle" font-weight="900">D-80</text>
  <text x="100" y="258" font-size="20" fill="#1e293b" font-weight="700">逐條盤點備審缺口</text>
  <text x="100" y="282" font-size="16" fill="#57534e">復健計畫（2.2）更新頻率、教育訓練紀錄（1.3）、PFM 文件完整性</text>
  <rect x="620" y="243" width="136" height="46" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="256" font-size="15" fill="#78716c" text-anchor="middle">對照基準</text>
  <text x="688" y="276" font-size="15" fill="#78716c" text-anchor="middle">逐條核實</text>

  <!-- Row 3（y=310）D-70 #57534e -->
  <rect x="28" y="310" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="310" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="66" cy="341" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="347" font-size="14" fill="#57534e" text-anchor="middle" font-weight="900">D-70</text>
  <text x="100" y="333" font-size="20" fill="#1e293b" font-weight="700">制定缺口修正計畫</text>
  <text x="100" y="357" font-size="16" fill="#57534e">每個缺口標示負責人和完成期限，住宿型 3.11 門禁問題列為優先處理</text>
  <rect x="620" y="318" width="136" height="46" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="331" font-size="15" fill="#57534e" text-anchor="middle">建立追蹤</text>
  <text x="688" y="351" font-size="15" fill="#57534e" text-anchor="middle">設定期限</text>

  <!-- Row 4（y=385）D-60 #a8a29e -->
  <rect x="28" y="385" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="385" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="416" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="422" font-size="14" fill="#a8a29e" text-anchor="middle" font-weight="900">D-60</text>
  <text x="100" y="408" font-size="20" fill="#1e293b" font-weight="700">進入第二階段：PFM 訓練啟動</text>
  <text x="100" y="432" font-size="16" fill="#57534e">盤點缺口清單完成，開始正式補件；同步啟動學員藥物自我管理訓練</text>
  <rect x="620" y="393" width="136" height="46" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="406" font-size="15" fill="#a8a29e" text-anchor="middle">轉入整備</text>
  <text x="688" y="426" font-size="15" fill="#a8a29e" text-anchor="middle">開始訓練</text>

  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
