<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- 標題列 -->
  <rect x="0" y="29" width="800" height="60" fill="#e8e6de"/>
  <rect x="0" y="29" width="6" height="60" rx="2" fill="#d97706"/>
  <text x="28" y="74" font-size="30" fill="#1e293b" font-weight="700">產婦相關 3 項指標：乳腺炎、母乳、滿意度</text>
  <!-- N=3 rows, H=90, y: 166/269/372 -->
  <!-- Row 1 -->
  <rect x="28" y="166" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="166" width="6" height="90" rx="2" fill="#d97706"/>
  <circle cx="66" cy="211" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="217" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">2</text>
  <text x="100" y="200" font-size="20" fill="#1e293b" font-weight="700">產婦乳腺炎發生率</text>
  <text x="100" y="224" font-size="16" fill="#57534e">乳房局部紅腫熱痛合併發燒超過 38°C，需與充奶區分</text>
  <text x="100" y="244" font-size="16" fill="#57534e">分析：哺乳技巧指導、親子同室比率、乳房護理介入時機</text>
  <rect x="614" y="178" width="142" height="66" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="685" y="203" font-size="16" fill="#d97706" text-anchor="middle">症狀描述</text>
  <text x="685" y="223" font-size="16" fill="#d97706" text-anchor="middle">處置方式</text>
  <text x="685" y="243" font-size="16" fill="#d97706" text-anchor="middle">需記載</text>
  <!-- Row 2 -->
  <rect x="28" y="269" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="269" width="6" height="90" rx="2" fill="#78716c"/>
  <circle cx="66" cy="314" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="320" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">3</text>
  <text x="100" y="303" font-size="20" fill="#1e293b" font-weight="700">純母乳哺育率</text>
  <text x="100" y="327" font-size="16" fill="#57534e">出院時哺乳方式以出院評估表為準，出院前 24 小時內僅母乳</text>
  <text x="100" y="347" font-size="16" fill="#57534e">提升策略：哺乳意願評估、個別化計畫、母嬰肌膚接觸</text>
  <rect x="614" y="281" width="142" height="66" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="685" y="306" font-size="16" fill="#78716c" text-anchor="middle">出院時</text>
  <text x="685" y="326" font-size="16" fill="#78716c" text-anchor="middle">哺乳方式</text>
  <text x="685" y="346" font-size="16" fill="#78716c" text-anchor="middle">為基準</text>
  <!-- Row 3 -->
  <rect x="28" y="372" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="372" width="6" height="90" rx="2" fill="#57534e"/>
  <circle cx="66" cy="417" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="423" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">6</text>
  <text x="100" y="406" font-size="20" fill="#1e293b" font-weight="700">服務對象（產婦）滿意度</text>
  <text x="100" y="430" font-size="16" fill="#57534e">每年至少辦理 1 次，出院時發放問卷或出院後一週追蹤</text>
  <text x="100" y="450" font-size="16" fill="#57534e">季報需含：平均分數、前季比較、不滿意改善計畫</text>
  <rect x="614" y="384" width="142" height="66" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="685" y="409" font-size="16" fill="#57534e" text-anchor="middle">每年</text>
  <text x="685" y="429" font-size="16" fill="#57534e" text-anchor="middle">至少 1 次</text>
  <text x="685" y="449" font-size="16" fill="#57534e" text-anchor="middle">A2.3 要求</text>
  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
