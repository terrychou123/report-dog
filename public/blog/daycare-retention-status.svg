<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="450" fill="#f0efe8"/>
  <text x="400" y="46" font-size="21" font-weight="700" fill="#1e293b" text-anchor="middle">日照人力流動的現況與代價</text>
  <rect x="60" y="58" width="48" height="3" rx="1.5" fill="#d97706"/>
  <line x1="116" y1="59.5" x2="740" y2="59.5" stroke="#dedad3" stroke-width="1"/>

  <!-- 3 impact cards -->
  <!-- Card 1: 直接成本 -->
  <rect x="52" y="84" width="210" height="280" rx="12" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="52" y="84" width="210" height="5" rx="2.5" fill="#d97706"/>
  <text x="157" y="115" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">人力流動直接成本</text>
  <line x1="68" y1="128" x2="246" y2="128" stroke="#f0ede6" stroke-width="1"/>
  <rect x="68" y="140" width="178" height="36" rx="8" fill="#d97706" opacity="0.08"/>
  <text x="157" y="163" font-size="13" fill="#d97706" text-anchor="middle" font-weight="700">每次招募＝成本</text>
  <text x="72" y="200" font-size="12" fill="#57534e">→ 刊登招募廣告</text>
  <text x="72" y="220" font-size="12" fill="#57534e">→ 面試與篩選時間</text>
  <text x="72" y="240" font-size="12" fill="#57534e">→ 職前訓練 16 小時</text>
  <text x="72" y="260" font-size="12" fill="#57534e">→ 新人上手磨合期</text>
  <line x1="68" y1="278" x2="246" y2="278" stroke="#f0ede6" stroke-width="1"/>
  <text x="72" y="300" font-size="12" fill="#d97706" font-weight="600">評鑑影響：</text>
  <text x="72" y="320" font-size="12" fill="#78716c">留任率納入第 30 條</text>
  <text x="72" y="340" font-size="12" fill="#78716c">前 4 年度平均計算</text>

  <!-- Card 2: 照護品質 -->
  <rect x="295" y="84" width="210" height="280" rx="12" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="295" y="84" width="210" height="5" rx="2.5" fill="#ef4444" opacity="0.7"/>
  <text x="400" y="115" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">照護品質衝擊</text>
  <line x1="311" y1="128" x2="489" y2="128" stroke="#f0ede6" stroke-width="1"/>
  <rect x="311" y="140" width="178" height="36" rx="8" fill="#ef4444" opacity="0.08"/>
  <text x="400" y="163" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="700">個案適應新照服員</text>
  <text x="311" y="200" font-size="12" fill="#57534e">→ 適應期長達數週</text>
  <text x="311" y="220" font-size="12" fill="#57534e">→ 認知症長輩壓力倍增</text>
  <text x="311" y="240" font-size="12" fill="#57534e">→ 個別化照顧中斷</text>
  <text x="311" y="260" font-size="12" fill="#57534e">→ 家屬信任感降低</text>
  <line x1="311" y1="278" x2="489" y2="278" stroke="#f0ede6" stroke-width="1"/>
  <text x="311" y="300" font-size="12" fill="#dc2626" font-weight="600">評鑑風險：</text>
  <text x="311" y="320" font-size="12" fill="#78716c">計畫執行連續性降低</text>
  <text x="311" y="340" font-size="12" fill="#78716c">個案滿意度下滑</text>

  <!-- Card 3: 根本原因 -->
  <rect x="538" y="84" width="210" height="280" rx="12" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="538" y="84" width="210" height="5" rx="2.5" fill="#78716c"/>
  <text x="643" y="115" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">留不住人的根因</text>
  <line x1="554" y1="128" x2="732" y2="128" stroke="#f0ede6" stroke-width="1"/>
  <rect x="554" y="140" width="178" height="36" rx="8" fill="#78716c" opacity="0.08"/>
  <text x="643" y="163" font-size="13" fill="#78716c" text-anchor="middle" font-weight="700">薪資只是表面</text>
  <text x="554" y="200" font-size="12" fill="#57534e">→ 督導形同虛設</text>
  <text x="554" y="220" font-size="12" fill="#57534e">→ 訓練毫無感覺</text>
  <text x="554" y="240" font-size="12" fill="#57534e">→ 問題得不到回應</text>
  <text x="554" y="260" font-size="12" fill="#57534e">→ 看不到未來發展</text>
  <line x1="554" y1="278" x2="732" y2="278" stroke="#f0ede6" stroke-width="1"/>
  <text x="554" y="300" font-size="12" fill="#d97706" font-weight="600">本文分析：</text>
  <text x="554" y="320" font-size="12" fill="#78716c">5 大管理盲點</text>
  <text x="554" y="340" font-size="12" fill="#78716c">對應第 9、29–32 條</text>

  <text x="760" y="421" font-size="16" fill="#c4bfb8" text-anchor="end" font-weight="400" font-family="'Noto Sans TC', sans-serif">報告汪 reportwang.com</text>
</svg>
