<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"
     font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- Header（y=38, h=90）N=3 -->
  <rect x="0" y="38" width="800" height="90" fill="white"/>
  <rect x="0" y="38" width="6" height="90" fill="#d97706" rx="2"/>
  <text x="28" y="99" font-size="40" fill="#1e293b" font-weight="700">日照人力流動的現況與代價</text>

  <!-- ===== Row 1（y=166）H=90 #d97706 流動率高 ===== -->
  <rect x="28" y="166" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="166" width="6" height="90" rx="2" fill="#78716c"/>
  <circle cx="66" cy="211" r="20" fill="#d97706" opacity="0.15"/>
  <text x="66" y="218" font-size="18" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <text x="100" y="205" font-size="28" fill="#1e293b" font-weight="700">人員流動率偏高</text>
  <text x="100" y="235" font-size="16" fill="#57534e">長照機構年流動率普遍超過 30%，遠高於一般服務業的 15%</text>
  <rect x="620" y="185" width="136" height="52" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="207" font-size="16" fill="#d97706" text-anchor="middle">年流動率</text>
  <text x="688" y="227" font-size="16" fill="#d97706" text-anchor="middle">超過 30%</text>

  <!-- ===== Row 2（y=269）H=90 #78716c 照護品質受損 ===== -->
  <rect x="28" y="269" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="269" width="6" height="90" rx="2" fill="#57534e"/>
  <circle cx="66" cy="314" r="20" fill="#78716c" opacity="0.15"/>
  <text x="66" y="321" font-size="18" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <text x="100" y="308" font-size="28" fill="#1e293b" font-weight="700">照護品質與服務連續性受損</text>
  <text x="100" y="338" font-size="16" fill="#57534e">人員頻繁替換讓個案難以建立信任，照護熟悉度降低，評鑑成績受影響</text>
  <rect x="620" y="288" width="136" height="52" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="310" font-size="16" fill="#78716c" text-anchor="middle">服務連續性</text>
  <text x="688" y="330" font-size="16" fill="#78716c" text-anchor="middle">信任建立</text>

  <!-- ===== Row 3（y=372）H=90 #57534e 評鑑影響 ===== -->
  <rect x="28" y="372" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="372" width="6" height="90" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="417" r="20" fill="#57534e" opacity="0.15"/>
  <text x="66" y="424" font-size="18" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <text x="100" y="411" font-size="28" fill="#1e293b" font-weight="700">評鑑成績連帶下滑</text>
  <text x="100" y="441" font-size="16" fill="#57534e">人力不穩定直接影響留任率條文（第 30 條）得分，督導制度也難以落實</text>
  <rect x="620" y="391" width="136" height="52" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="413" font-size="16" fill="#57534e" text-anchor="middle">第 30 條</text>
  <text x="688" y="433" font-size="16" fill="#57534e" text-anchor="middle">評鑑扣分</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
