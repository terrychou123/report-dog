<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#f1f5f9"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="450" fill="url(#bg)" rx="16"/>

  <!-- 標題 -->
  <text x="400" y="50" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="22" fill="#0f172a" font-weight="700">115 年度日照評鑑 — 五大面向題數分布</text>
  <text x="400" y="78" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="14" fill="#64748b">43 項正式基準 + 2 項加分題，共 45 項</text>

  <!-- 壹：個案權益保障 4題 -->
  <rect x="60" y="110" width="130" height="260" rx="10" fill="#eff6ff"/>
  <rect x="60" y="282" width="130" height="88" rx="10" fill="#1d4ed8"/>
  <text x="125" y="250" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#1d4ed8" font-weight="600">壹</text>
  <text x="125" y="270" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#475569">個案權益</text>
  <text x="125" y="315" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="36" fill="white" font-weight="700">4</text>
  <text x="125" y="340" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="rgba(255,255,255,0.8)">第 1–4 條</text>
  <text x="125" y="390" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#64748b">4 / 43</text>

  <!-- 貳：專業照護品質 18題 -->
  <rect x="210" y="110" width="130" height="260" rx="10" fill="#f0fdfa"/>
  <rect x="210" y="148" width="130" height="222" rx="10" fill="#0d9488"/>
  <text x="275" y="168" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="white" font-weight="600">貳</text>
  <text x="275" y="186" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="rgba(255,255,255,0.85)">專業照護</text>
  <text x="275" y="285" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="56" fill="white" font-weight="700">18</text>
  <text x="275" y="330" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="rgba(255,255,255,0.8)">第 5–22 條</text>
  <text x="275" y="390" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#64748b">18 / 43 最多</text>

  <!-- 參：經營管理效能 15題 -->
  <rect x="360" y="110" width="130" height="260" rx="10" fill="#faf5ff"/>
  <rect x="360" y="178" width="130" height="192" rx="10" fill="#7c3aed"/>
  <text x="425" y="150" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#7c3aed" font-weight="600">參</text>
  <text x="425" y="168" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#64748b">經營管理</text>
  <text x="425" y="265" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="56" fill="white" font-weight="700">15</text>
  <text x="425" y="310" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="rgba(255,255,255,0.8)">第 23–37 條</text>
  <text x="425" y="390" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#64748b">15 / 43</text>

  <!-- 肆：安全環境設備 6題 -->
  <rect x="510" y="110" width="130" height="260" rx="10" fill="#fff7ed"/>
  <rect x="510" y="254" width="130" height="116" rx="10" fill="#ea580c"/>
  <text x="575" y="220" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#ea580c" font-weight="600">肆</text>
  <text x="575" y="240" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#475569">安全環境</text>
  <text x="575" y="310" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="36" fill="white" font-weight="700">6</text>
  <text x="575" y="340" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="rgba(255,255,255,0.8)">第 38–43 條</text>
  <text x="575" y="390" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#64748b">6 / 43</text>

  <!-- 伍：加分題 2題 -->
  <rect x="660" y="110" width="100" height="260" rx="10" fill="#fdf2f8"/>
  <rect x="660" y="306" width="100" height="64" rx="10" fill="#be185d"/>
  <text x="710" y="275" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#be185d" font-weight="600">伍</text>
  <text x="710" y="293" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#475569">加分題</text>
  <text x="710" y="343" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="28" fill="white" font-weight="700">+3</text>
  <text x="710" y="390" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#64748b">最多 3 分</text>

  <!-- X 軸底線 -->
  <line x1="60" y1="370" x2="760" y2="370" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- 提示說明 -->
  <text x="400" y="430" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#94a3b8">貳、專業照護品質（18 項）為評鑑最核心面向，需社工師、護理師、照服員共同準備</text>
</svg>
