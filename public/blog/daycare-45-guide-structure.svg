<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"
     font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- Header (y=29, h=60) -->
  <rect x="0" y="29" width="800" height="60" fill="white"/>
  <rect x="0" y="29" width="6" height="60" fill="#d97706" rx="2"/>
  <text x="28" y="74" font-size="36" fill="#1e293b" font-weight="700">五大面向基準總覽</text>

  <!-- Row 1 y=118, H=60, 琥珀 #d97706 -->
  <rect x="28" y="118" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="118" width="6" height="60" rx="2" fill="#78716c"/>
  <circle cx="66" cy="148" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="154" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <text x="100" y="145" font-size="20" fill="#1e293b" font-weight="700">壹、個案權益保障</text>
  <text x="100" y="166" font-size="16" fill="#57534e">服務資訊公開、申訴機制、契約簽訂、個人資料保護</text>
  <rect x="620" y="126" width="136" height="44" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="138" font-size="16" fill="#d97706" text-anchor="middle">共 4 條</text>
  <text x="688" y="158" font-size="16" fill="#d97706" text-anchor="middle">第 1–4 條</text>

  <!-- Row 2 y=191, H=60, 暖灰 #78716c -->
  <rect x="28" y="191" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="191" width="6" height="60" rx="2" fill="#57534e"/>
  <circle cx="66" cy="221" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="227" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <text x="100" y="218" font-size="20" fill="#1e293b" font-weight="700">貳、專業照護品質</text>
  <text x="100" y="239" font-size="16" fill="#57534e">個案評估、照顧計畫、督導機制、健康照護、品管指標</text>
  <rect x="620" y="199" width="136" height="44" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="211" font-size="16" fill="#78716c" text-anchor="middle">共 18 條</text>
  <text x="688" y="231" font-size="16" fill="#78716c" text-anchor="middle">第 5–22 條</text>

  <!-- Row 3 y=264, H=60, 深棕 #57534e -->
  <rect x="28" y="264" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="264" width="6" height="60" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="294" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="300" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <text x="100" y="291" font-size="20" fill="#1e293b" font-weight="700">參、經營管理效能</text>
  <text x="100" y="312" font-size="16" fill="#57534e">行政制度、服務人員管理、財務管理、緊急事件管理</text>
  <rect x="620" y="272" width="136" height="44" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="284" font-size="16" fill="#57534e" text-anchor="middle">共 15 條</text>
  <text x="688" y="304" font-size="16" fill="#57534e" text-anchor="middle">第 23–37 條</text>

  <!-- Row 4 y=337, H=60, 淺灰 #a8a29e -->
  <rect x="28" y="337" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="337" width="6" height="60" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="367" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="373" font-size="16" fill="#a8a29e" text-anchor="middle" font-weight="900">4</text>
  <text x="100" y="364" font-size="20" fill="#1e293b" font-weight="700">肆、安全環境設備</text>
  <text x="100" y="385" font-size="16" fill="#57534e">高齡友善環境、衛浴設備、飲用水、廚房衛生、環境清潔</text>
  <rect x="620" y="345" width="136" height="44" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="357" font-size="16" fill="#a8a29e" text-anchor="middle">共 6 條</text>
  <text x="688" y="377" font-size="16" fill="#a8a29e" text-anchor="middle">第 38–43 條</text>

  <!-- Row 5 y=410, H=60, 藍灰 #94a3b8 -->
  <rect x="28" y="410" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="410" width="6" height="60" rx="2" fill="#6b7280"/>
  <circle cx="66" cy="440" r="16" fill="#94a3b8" opacity="0.15"/>
  <text x="66" y="446" font-size="16" fill="#94a3b8" text-anchor="middle" font-weight="900">5</text>
  <text x="100" y="437" font-size="20" fill="#1e293b" font-weight="700">伍、加分題</text>
  <text x="100" y="458" font-size="16" fill="#57534e">原住民族文化敏感度、監視器設備權益保障</text>
  <rect x="620" y="418" width="136" height="44" rx="8" fill="#94a3b8" opacity="0.12"/>
  <text x="688" y="430" font-size="16" fill="#94a3b8" text-anchor="middle">共 2 條</text>
  <text x="688" y="450" font-size="16" fill="#94a3b8" text-anchor="middle">第 44–45 條</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
