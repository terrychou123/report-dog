<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">

  <!-- 背景：米黃暖色 -->
  <rect width="1200" height="630" fill="#f0efe8"/>

  <!-- 右側裝飾塊 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>

  <!-- 警示標籤 -->
  <rect x="60" y="55" width="130" height="32" rx="16" fill="#78716c"/>
  <text x="125" y="76" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="14" fill="white" font-weight="600">評鑑地雷</text>

  <!-- 主標題 -->
  <text x="60" y="152" font-family="'Noto Sans TC', sans-serif" font-size="56" fill="#1e293b" font-weight="700">日照評鑑最常</text>
  <text x="60" y="218" font-family="'Noto Sans TC', sans-serif" font-size="56" fill="#1e293b" font-weight="700">被扣分的</text>
  <text x="368" y="218" font-family="'Noto Sans TC', sans-serif" font-size="72" fill="#d97706" font-weight="700">5</text>
  <text x="428" y="218" font-family="'Noto Sans TC', sans-serif" font-size="56" fill="#1e293b" font-weight="700"> 個地雷</text>

  <!-- 副標題 -->
  <text x="60" y="262" font-family="'Noto Sans TC', sans-serif" font-size="20" fill="#64748b">115 年度版 · 你中了幾個？</text>

  <!-- 分隔線 -->
  <line x1="60" y1="284" x2="540" y2="284" stroke="#dedad3" stroke-width="1.5"/>

  <!-- 5 個地雷項目 -->
  <rect x="60" y="305" width="210" height="72" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="78" y="334" font-family="'Noto Sans TC', sans-serif" font-size="20" fill="#d97706" font-weight="700">01</text>
  <text x="78" y="357" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#1e293b">照顧計畫逾期完成</text>
  <text x="78" y="372" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#94a3b8">第 6 條</text>

  <rect x="285" y="305" width="210" height="72" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="303" y="334" font-family="'Noto Sans TC', sans-serif" font-size="20" fill="#d97706" font-weight="700">02</text>
  <text x="303" y="357" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#1e293b">追蹤評值有做沒紀錄</text>
  <text x="303" y="372" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#94a3b8">第 7 條</text>

  <rect x="510" y="305" width="210" height="72" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="528" y="334" font-family="'Noto Sans TC', sans-serif" font-size="20" fill="#d97706" font-weight="700">03</text>
  <text x="528" y="357" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#1e293b">督導紀錄不完整</text>
  <text x="528" y="372" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#94a3b8">第 9 條</text>

  <rect x="60" y="392" width="210" height="72" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="78" y="421" font-family="'Noto Sans TC', sans-serif" font-size="20" fill="#d97706" font-weight="700">04</text>
  <text x="78" y="444" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#1e293b">品管指標沒自訂</text>
  <text x="78" y="459" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#94a3b8">第 22 條</text>

  <rect x="285" y="392" width="210" height="72" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="303" y="421" font-family="'Noto Sans TC', sans-serif" font-size="20" fill="#d97706" font-weight="700">05</text>
  <text x="303" y="444" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#1e293b">教育訓練時數不足</text>
  <text x="303" y="459" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#94a3b8">第 29 條</text>

  <!-- 底部說明 -->
  <text x="60" y="526" font-family="'Noto Sans TC', sans-serif" font-size="16" fill="#94a3b8">附快速確認清單 · 評鑑前及早補強</text>

  <!-- 浮水印 -->
  <text x="1140" y="618" text-anchor="end" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#c4bfb8">報告汪 reportwang.com</text>

  <!-- 右側裝飾：每個地雷都有解法 -->
  <text x="1010" y="220" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="72" fill="#dedad3" font-weight="700">5</text>
  <line x1="900" y1="260" x2="1110" y2="260" stroke="#dedad3" stroke-width="1"/>
  <text x="1010" y="296" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="16" fill="#a8a29e">每個地雷</text>
  <text x="1010" y="322" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="16" fill="#a8a29e">都有解法</text>
  <!-- 裝飾圓點 -->
  <circle cx="1010" cy="380" r="30" fill="white" stroke="#dedad3" stroke-width="1.5"/>
  <text x="1010" y="388" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="20" fill="#d97706">!</text>
</svg>
