<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區塊 -->
  <rect x="0" y="50" width="800" height="76" fill="white"/>
  <rect x="0" y="50" width="6" height="76" fill="#d97706" rx="2"/>
  <text x="28" y="104"  font-size="36" font-weight="700" fill="#1e293b">3人行政的協作痛點</text>

  <!-- Row 1: 任務不清楚 -->
  <rect x="28" y="160" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="160" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="66" cy="191" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="197"  font-size="16" font-weight="900" text-anchor="middle" fill="#d97706">1</text>
  <text x="100" y="188"  font-size="22" font-weight="700" fill="#1e293b">任務不清楚</text>
  <text x="100" y="208"  font-size="16" fill="#57534e">不知道誰負責哪些評鑑項目</text>
  <rect x="620" y="168" width="136" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="181"  font-size="16" text-anchor="middle" fill="#d97706">責任模糊</text>
  <text x="688" y="201"  font-size="16" text-anchor="middle" fill="#d97706">效率低落</text>

  <!-- Row 2: 版本亂成一鍋 -->
  <rect x="28" y="235" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="235" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="66" cy="266" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="272"  font-size="16" font-weight="900" text-anchor="middle" fill="#78716c">2</text>
  <text x="100" y="263"  font-size="22" font-weight="700" fill="#1e293b">版本亂成一鍋</text>
  <text x="100" y="283"  font-size="16" fill="#57534e">同一份文件多人修改，無法確認最新版</text>
  <rect x="620" y="243" width="136" height="46" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="256"  font-size="16" text-anchor="middle" fill="#78716c">版本衝突</text>
  <text x="688" y="276"  font-size="16" text-anchor="middle" fill="#78716c">最常見</text>

  <!-- Row 3: 截止日不知道 -->
  <rect x="28" y="310" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="310" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="341" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="347"  font-size="16" font-weight="900" text-anchor="middle" fill="#57534e">3</text>
  <text x="100" y="338"  font-size="22" font-weight="700" fill="#1e293b">截止日不知道</text>
  <text x="100" y="358"  font-size="16" fill="#57534e">評鑑時程不清楚，臨時才發現漏做</text>
  <rect x="620" y="318" width="136" height="46" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="331"  font-size="16" text-anchor="middle" fill="#57534e">時程混亂</text>
  <text x="688" y="351"  font-size="16" text-anchor="middle" fill="#57534e">壓力大增</text>

  <!-- Row 4: 進度無法追蹤 -->
  <rect x="28" y="385" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="385" width="6" height="62" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="416" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="422"  font-size="16" font-weight="900" text-anchor="middle" fill="#a8a29e">4</text>
  <text x="100" y="413"  font-size="22" font-weight="700" fill="#1e293b">進度無法追蹤</text>
  <text x="100" y="433"  font-size="16" fill="#57534e">不知道各組準備到哪個階段</text>
  <rect x="620" y="393" width="136" height="46" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="406"  font-size="16" text-anchor="middle" fill="#a8a29e">進度不明</text>
  <text x="688" y="426"  font-size="16" text-anchor="middle" fill="#a8a29e">無法協調</text>

  <!-- 浮水印 -->
  <text x="760" y="480"  font-size="16" fill="#d97706" text-anchor="end">報告汪 reportwang.com</text>
</svg>
