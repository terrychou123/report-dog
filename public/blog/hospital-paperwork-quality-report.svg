<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#fafaf9"/>

  <!-- 標題區 -->
  <rect x="0" y="0" width="800" height="68" fill="#1c1917"/>
  <text x="400" y="42"  font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">品質指標報告撰寫三大要素</text>

  <!-- 列1 — 趨勢圖呈現 (#d97706)，y=128 -->
  <rect x="32" y="128" width="736" height="90" rx="8" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <rect x="32" y="128" width="8" height="90" rx="4" fill="#d97706"/>
  <text x="56" y="157"  font-size="17" font-weight="700" fill="#1c1917">趨勢圖呈現</text>
  <text x="56" y="179"  font-size="14" fill="#57534e">至少呈現6個月趨勢，目標值與實際值對比顯示</text>
  <text x="56" y="200"  font-size="13" fill="#78716c">評鑑委員最想看改善軌跡，而非單月數字；趨勢下降需說明原因</text>
  <rect x="648" y="150" width="100" height="32" rx="16" fill="#d97706" opacity="0.15"/>
  <text x="698" y="171"  font-size="14" font-weight="700" fill="#d97706" text-anchor="middle">趨勢優先</text>

  <!-- 列2 — 根本原因分析 (#78716c)，y=269 -->
  <rect x="32" y="231" width="736" height="90" rx="8" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <rect x="32" y="231" width="8" height="90" rx="4" fill="#78716c"/>
  <text x="56" y="260"  font-size="17" font-weight="700" fill="#1c1917">根本原因分析</text>
  <text x="56" y="282"  font-size="14" fill="#57534e">未達目標時需說明原因（而非只列數字），改善措施具體可執行</text>
  <text x="56" y="303"  font-size="13" fill="#78716c">使用魚骨圖、5-Why等方法找出根因，改善措施有明確負責人與期限</text>
  <rect x="628" y="253" width="120" height="32" rx="16" fill="#78716c" opacity="0.15"/>
  <text x="688" y="274"  font-size="14" font-weight="700" fill="#78716c" text-anchor="middle">有改善計畫</text>

  <!-- 列3 — 追蹤與結案 (#57534e)，y=372 -->
  <rect x="32" y="334" width="736" height="90" rx="8" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <rect x="32" y="334" width="8" height="90" rx="4" fill="#57534e"/>
  <text x="56" y="363"  font-size="17" font-weight="700" fill="#1c1917">追蹤與結案</text>
  <text x="56" y="385"  font-size="14" fill="#57534e">改善計畫有追蹤時程，有效後結案，無效則調整措施</text>
  <text x="56" y="406"  font-size="13" fill="#78716c">閉環管理（Plan-Do-Check-Act），每一輪改善都有完整紀錄可查核</text>
  <rect x="648" y="356" width="100" height="32" rx="16" fill="#57534e" opacity="0.12"/>
  <text x="698" y="377"  font-size="14" font-weight="700" fill="#57534e" text-anchor="middle">閉環管理</text>

  <!-- 浮水印 -->
  <text x="400" y="480"  font-size="12" fill="#a8a29e" text-anchor="middle" opacity="0.7">報告汪 reportwang.com</text>
</svg>
