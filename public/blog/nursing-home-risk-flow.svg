<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- 標題 -->
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">危機管理計畫撰寫流程</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">A6 計畫書 4 步驟建立方法</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- 步驟1 -->
  <rect x="28" y="140" width="174" height="220" rx="10" fill="#fff" stroke="#e5e3dc" stroke-width="1"/>
  <circle cx="115" cy="170" r="22" fill="#d97706" opacity="0.15"/>
  <text x="115" y="177" text-anchor="middle" font-size="22" fill="#fff" font-weight="700">1</text>
  <text x="115" y="218" text-anchor="middle" font-size="16" fill="#1e293b" font-weight="700">風險盤點</text>
  <text x="115" y="244" text-anchor="middle" font-size="14" fill="#57534e">列出機構面臨的</text>
  <text x="115" y="264" text-anchor="middle" font-size="14" fill="#57534e">潛在風險清單</text>
  <text x="115" y="284" text-anchor="middle" font-size="14" fill="#57534e">評估發生機率</text>
  <text x="115" y="304" text-anchor="middle" font-size="14" fill="#57534e">及影響嚴重程度</text>
  <text x="115" y="340" text-anchor="middle" font-size="14" fill="#d97706" font-weight="600">選出 3 個以上</text>

  <!-- 箭頭 1→2 -->
  <polygon points="210,245 228,237 228,253" fill="#d97706"/>
  <line x1="202" y1="245" x2="228" y2="245" stroke="#d97706" stroke-width="2"/>

  <!-- 步驟2 -->
  <rect x="218" y="140" width="174" height="220" rx="10" fill="#fff" stroke="#e5e3dc" stroke-width="1"/>
  <circle cx="305" cy="170" r="22" fill="#78716c" opacity="0.15"/>
  <text x="305" y="177" text-anchor="middle" font-size="22" fill="#fff" font-weight="700">2</text>
  <text x="305" y="218" text-anchor="middle" font-size="16" fill="#1e293b" font-weight="700">撰寫計畫書</text>
  <text x="305" y="244" text-anchor="middle" font-size="14" fill="#57534e">風險描述</text>
  <text x="305" y="264" text-anchor="middle" font-size="14" fill="#57534e">預防措施</text>
  <text x="305" y="284" text-anchor="middle" font-size="14" fill="#57534e">處理程序步驟</text>
  <text x="305" y="304" text-anchor="middle" font-size="14" fill="#57534e">責任人員分配</text>
  <text x="305" y="340" text-anchor="middle" font-size="14" fill="#78716c" font-weight="600">每個風險獨立計畫</text>

  <!-- 箭頭 2→3 -->
  <polygon points="400,245 418,237 418,253" fill="#d97706"/>
  <line x1="392" y1="245" x2="418" y2="245" stroke="#d97706" stroke-width="2"/>

  <!-- 步驟3 -->
  <rect x="408" y="140" width="174" height="220" rx="10" fill="#fff" stroke="#e5e3dc" stroke-width="1"/>
  <circle cx="495" cy="170" r="22" fill="#d97706" opacity="0.15"/>
  <text x="495" y="177" text-anchor="middle" font-size="22" fill="#fff" font-weight="700">3</text>
  <text x="495" y="218" text-anchor="middle" font-size="16" fill="#1e293b" font-weight="700">事件紀錄執行</text>
  <text x="495" y="244" text-anchor="middle" font-size="14" fill="#57534e">事件發生時</text>
  <text x="495" y="264" text-anchor="middle" font-size="14" fill="#57534e">依計畫逐步執行</text>
  <text x="495" y="284" text-anchor="middle" font-size="14" fill="#57534e">完整記錄過程</text>
  <text x="495" y="304" text-anchor="middle" font-size="14" fill="#57534e">結果與後續追蹤</text>
  <text x="495" y="340" text-anchor="middle" font-size="14" fill="#d97706" font-weight="600">執行佐證必備</text>

  <!-- 箭頭 3→4 -->
  <polygon points="590,245 608,237 608,253" fill="#d97706"/>
  <line x1="582" y1="245" x2="608" y2="245" stroke="#d97706" stroke-width="2"/>

  <!-- 步驟4 -->
  <rect x="598" y="140" width="174" height="220" rx="10" fill="#fff" stroke="#e5e3dc" stroke-width="1"/>
  <circle cx="685" cy="170" r="22" fill="#78716c" opacity="0.15"/>
  <text x="685" y="177" text-anchor="middle" font-size="22" fill="#fff" font-weight="700">4</text>
  <text x="685" y="218" text-anchor="middle" font-size="16" fill="#1e293b" font-weight="700">半年定期分析</text>
  <text x="685" y="244" text-anchor="middle" font-size="14" fill="#57534e">每半年召集相關</text>
  <text x="685" y="264" text-anchor="middle" font-size="14" fill="#57534e">人員進行分析</text>
  <text x="685" y="284" text-anchor="middle" font-size="14" fill="#57534e">撰寫分析報告</text>
  <text x="685" y="304" text-anchor="middle" font-size="14" fill="#57534e">訂定改善措施</text>
  <text x="685" y="340" text-anchor="middle" font-size="14" fill="#78716c" font-weight="600">改善追蹤紀錄</text>

  <!-- 底部說明 -->
  <rect x="40" y="390" width="720" height="60" rx="8" fill="#fef3c7"/>
  <text x="400" y="414" text-anchor="middle" font-size="15" fill="#d97706" font-weight="700">A6 計畫書標準結構：目的-風險描述-評估矩陣-預防措施-緊急處理程序-責任人員-追蹤機制</text>
  <text x="400" y="440" text-anchor="middle" font-size="14" fill="#78716c">E1 前次建議改善：改善比例需達 80% 以上，建議對每項建議逐一製作改善對照表</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
