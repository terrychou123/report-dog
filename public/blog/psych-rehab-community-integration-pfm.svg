<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- @template: custom -->
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- 主標題 -->
  <text x="400" y="40" font-size="22" fill="#1e293b" text-anchor="middle" font-weight="700">2.12 社區融合 PFM 訪談問題與機構紀錄對照</text>
  <line x1="28" y1="54" x2="772" y2="54" stroke="#dedad3" stroke-width="1"/>

  <!-- 左側：PFM 訪談問題 -->
  <rect x="28" y="64" width="360" height="400" rx="12" fill="white"/>
  <rect x="28" y="64" width="360" height="8" rx="4" fill="#16a34a"/>
  <rect x="28" y="68" width="360" height="4" fill="#16a34a"/>
  <rect x="28" y="64" width="6" height="400" rx="2" fill="#d97706"/>
  <text x="208" y="104" font-size="22" fill="#16a34a" text-anchor="middle" font-weight="700">PFM 訪談問題</text>
  <text x="208" y="126" font-size="15" fill="#57534e" text-anchor="middle">評鑑委員直接詢問學員／住民</text>

  <!-- Q1 -->
  <circle cx="58" cy="165" r="14" fill="#16a34a" opacity="0.12"/>
  <text x="58" y="170" font-size="14" fill="#16a34a" text-anchor="middle" font-weight="700">Q1</text>
  <text x="82" y="161" font-size="16" fill="#1e293b" font-weight="700">最近一次外出去哪裡？</text>
  <text x="82" y="179" font-size="14" fill="#57534e">確認學員有真實、定期的外出活動</text>

  <!-- Q2 -->
  <circle cx="58" cy="224" r="14" fill="#16a34a" opacity="0.12"/>
  <text x="58" y="229" font-size="14" fill="#16a34a" text-anchor="middle" font-weight="700">Q2</text>
  <text x="82" y="220" font-size="16" fill="#1e293b" font-weight="700">外出是誰提議安排的？</text>
  <text x="82" y="238" font-size="14" fill="#57534e">確認活動由學員意願主導，非強制</text>

  <!-- Q3 -->
  <circle cx="58" cy="283" r="14" fill="#16a34a" opacity="0.12"/>
  <text x="58" y="288" font-size="14" fill="#16a34a" text-anchor="middle" font-weight="700">Q3</text>
  <text x="82" y="279" font-size="16" fill="#1e293b" font-weight="700">有沒有想去但還沒去的地方？</text>
  <text x="82" y="297" font-size="14" fill="#57534e">評估機構是否積極了解外出需求</text>

  <!-- 左底部提示 -->
  <rect x="46" y="330" width="322" height="95" rx="8" fill="#f0fdf4"/>
  <text x="208" y="355" font-size="15" fill="#16a34a" text-anchor="middle" font-weight="700">訪談重要提醒</text>
  <text x="208" y="378" font-size="14" fill="#57534e" text-anchor="middle">無法訪談即視為未符合 C 等級</text>
  <text x="208" y="400" font-size="14" fill="#57534e" text-anchor="middle">外出服務需真實、定期執行</text>

  <!-- 右側：機構必備紀錄 -->
  <rect x="412" y="64" width="360" height="400" rx="12" fill="white"/>
  <rect x="412" y="64" width="360" height="8" rx="4" fill="#d97706"/>
  <rect x="412" y="68" width="360" height="4" fill="#d97706"/>
  <rect x="412" y="64" width="6" height="400" rx="2" fill="#d97706"/>
  <text x="592" y="104" font-size="22" fill="#d97706" text-anchor="middle" font-weight="700">機構必備紀錄</text>
  <text x="592" y="126" font-size="15" fill="#57534e" text-anchor="middle">委員可能隨機翻閱文件查核</text>

  <!-- 紀錄 1 -->
  <circle cx="442" cy="165" r="14" fill="#d97706" opacity="0.12"/>
  <text x="442" y="171" font-size="15" fill="#d97706" text-anchor="middle" font-weight="700">1</text>
  <text x="466" y="161" font-size="16" fill="#1e293b" font-weight="700">外出紀錄表</text>
  <text x="466" y="179" font-size="14" fill="#57534e">日期、地點、目的、陪同人員</text>

  <!-- 紀錄 2 -->
  <circle cx="442" cy="224" r="14" fill="#d97706" opacity="0.12"/>
  <text x="442" y="230" font-size="15" fill="#d97706" text-anchor="middle" font-weight="700">2</text>
  <text x="466" y="220" font-size="16" fill="#1e293b" font-weight="700">意願評估記錄</text>
  <text x="466" y="238" font-size="14" fill="#57534e">學員自發外出或機構協助安排說明</text>

  <!-- 紀錄 3 -->
  <circle cx="442" cy="283" r="14" fill="#d97706" opacity="0.12"/>
  <text x="442" y="289" font-size="15" fill="#d97706" text-anchor="middle" font-weight="700">3</text>
  <text x="466" y="279" font-size="16" fill="#1e293b" font-weight="700">外出回饋紀錄</text>
  <text x="466" y="297" font-size="14" fill="#57534e">外出後學員感受、收穫與後續規劃</text>

  <!-- 右底部提示 -->
  <rect x="430" y="330" width="322" height="95" rx="8" fill="#fffbeb"/>
  <text x="592" y="355" font-size="15" fill="#d97706" text-anchor="middle" font-weight="700">紀錄準備重點</text>
  <text x="592" y="378" font-size="14" fill="#57534e" text-anchor="middle">委員可能隨機抽閱近半年外出紀錄</text>
  <text x="592" y="400" font-size="14" fill="#57534e" text-anchor="middle">每位學員均應有外出記錄可供查閱</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
