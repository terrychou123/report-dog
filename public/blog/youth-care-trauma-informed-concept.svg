  <text x="100" y="313" font-size="28" fill="#1e293b" font-weight="700">安全感是一切的基礎</text>
  <text x="100" y="337" font-size="16" fill="#57534e">機構環境需讓兒少感到安全可預期，才能進行有效輔導</text>
  <rect x="620" y="288" width="136" height="52" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="308" font-size="16" fill="#78716c" text-anchor="middle">安全感</text>
  <text x="688" y="328" font-size="16" fill="#78716c" text-anchor="middle">基礎</text>
  <rect x="28" y="372" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="372" width="6" height="90" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="417" r="20" fill="#57534e" opacity="0.15"/>
  <text x="66" y="423" font-size="18" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <text x="100" y="416" font-size="28" fill="#1e293b" font-weight="700">避免再創傷（Re-traumatization）</text>
  <text x="100" y="440" font-size="16" fill="#57534e">了解哪些言行可能觸發兒少創傷反應，主動避免</text>
