  <text x="100" y="210" font-size="28" fill="#1e293b" font-weight="700">理解創傷對行為的影響</text>
  <text x="100" y="234" font-size="16" fill="#57534e">兒少的問題行為可能源於創傷，而非故意為之，需換位思考</text>
  <rect x="620" y="185" width="136" height="52" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="205" font-size="16" fill="#d97706" text-anchor="middle">理解</text>
  <text x="688" y="225" font-size="16" fill="#d97706" text-anchor="middle">創傷</text>
  <rect x="28" y="269" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="269" width="6" height="90" rx="2" fill="#57534e"/>
  <circle cx="66" cy="314" r="20" fill="#78716c" opacity="0.15"/>
