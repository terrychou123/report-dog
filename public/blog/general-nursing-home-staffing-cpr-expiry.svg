  <text x="60" y="378" font-size="14" fill="#475569">• 紅色＝已到期：立即停止排班或緊急安排補訓後才能繼續值班（評鑑最嚴重缺失）</text>
  <text x="60" y="396" font-size="14" fill="#475569">• 橙色＝6個月內到期：提前安排訓練，評鑑前 6 個月開始逐月檢查到期名單</text>

  <!-- 浮水印 -->
