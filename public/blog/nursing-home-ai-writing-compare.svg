<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">傳統文書 vs AI 輔助時間對比</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">各類評鑑文件實際節省時間比較</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- 表頭 y=108 -->
  <rect x="40" y="108" width="720" height="44" fill="#e8e4dc"/>
  <text x="200" y="136" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="700">文件類型</text>
  <line x1="360" y1="108" x2="360" y2="152" stroke="#dedad3" stroke-width="1"/>
  <text x="476" y="136" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="700">傳統方式</text>
  <line x1="592" y1="108" x2="592" y2="152" stroke="#dedad3" stroke-width="1"/>
  <text x="676" y="136" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="700">AI 輔助</text>
  <line x1="40" y1="152" x2="760" y2="152" stroke="#dedad3" stroke-width="1"/>

  <!-- Row 1: B2 個案計畫 y=152-212 -->
  <rect x="40" y="152" width="720" height="60" fill="white" stroke="#e8e6de" stroke-width="1" rx="12"/>
  <rect x="40" y="152" width="6" height="60" fill="#d97706" rx="2"/>
  <text x="200" y="186" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="700">B2 個案計畫</text>
  <line x1="360" y1="152" x2="360" y2="212" stroke="#dedad3" stroke-width="1"/>
  <text x="476" y="186" text-anchor="middle" font-size="18" fill="#78716c" font-weight="700">45 分鐘 / 份</text>
  <line x1="592" y1="152" x2="592" y2="212" stroke="#dedad3" stroke-width="1"/>
  <text x="676" y="186" text-anchor="middle" font-size="18" fill="#d97706" font-weight="700">15 分鐘（省 67%）</text>

  <!-- Row 2: A6 危機管理 y=212-272 -->
  <rect x="40" y="212" width="720" height="60" fill="#fafaf8" stroke="#e8e6de" stroke-width="1" rx="12"/>
  <rect x="40" y="212" width="6" height="60" fill="#78716c" rx="2"/>
  <text x="200" y="246" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="700">A6 危機管理計畫</text>
  <line x1="360" y1="212" x2="360" y2="272" stroke="#dedad3" stroke-width="1"/>
  <text x="476" y="246" text-anchor="middle" font-size="18" fill="#78716c" font-weight="700">2–3 小時</text>
  <line x1="592" y1="212" x2="592" y2="272" stroke="#dedad3" stroke-width="1"/>
  <text x="676" y="246" text-anchor="middle" font-size="18" fill="#d97706" font-weight="700">40 分鐘（省 60%）</text>

  <!-- Row 3: B1 品質分析報告 y=272-332 -->
  <rect x="40" y="272" width="720" height="60" fill="white" stroke="#e8e6de" stroke-width="1" rx="12"/>
  <rect x="40" y="272" width="6" height="60" fill="#57534e" rx="2"/>
  <text x="200" y="306" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="700">品質分析報告</text>
  <line x1="360" y1="272" x2="360" y2="332" stroke="#dedad3" stroke-width="1"/>
  <text x="476" y="306" text-anchor="middle" font-size="18" fill="#78716c" font-weight="700">2 小時</text>
  <line x1="592" y1="272" x2="592" y2="332" stroke="#dedad3" stroke-width="1"/>
  <text x="676" y="306" text-anchor="middle" font-size="18" fill="#d97706" font-weight="700">30 分鐘（省 75%）</text>

  <!-- Row 4: A3 年度業務計畫 y=332-392 -->
  <rect x="40" y="332" width="720" height="60" fill="#fafaf8" stroke="#e8e6de" stroke-width="1" rx="12"/>
  <rect x="40" y="332" width="6" height="60" fill="#a8a29e" rx="2"/>
  <text x="200" y="366" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="700">A3 年度業務計畫</text>
  <line x1="360" y1="332" x2="360" y2="392" stroke="#dedad3" stroke-width="1"/>
  <text x="476" y="366" text-anchor="middle" font-size="18" fill="#78716c" font-weight="700">全天（8 小時）</text>
  <line x1="592" y1="332" x2="592" y2="392" stroke="#dedad3" stroke-width="1"/>
  <text x="676" y="366" text-anchor="middle" font-size="18" fill="#d97706" font-weight="700">3 小時（省 60%）</text>

  <!-- 說明 -->
  <text x="46" y="416" font-size="15" fill="#d97706">整體評估：導入 AI 文書輔助工具後，機構備審總工時可縮減 60–75%，讓護理人員把時間還給住民</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
