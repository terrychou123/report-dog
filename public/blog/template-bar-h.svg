<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- Header（y=50, h=76）底色白 -->
  <rect x="0" y="50" width="800" height="76" fill="white"/>
  <rect x="0" y="50" width="6" height="76" fill="#d97706"/>
  <text x="28" y="104" font-size="36" fill="#1e293b" font-weight="700">5 大評鑑缺失出現頻率（%）</text>

  <!--
    水平長條圖（Horizontal Bar Chart）版型
    Row 高 h=44，間距 60，共 5 列
    左欄（x=28~212）: 編號圓 + 項目標籤
    長條軌道（x=220, w=500）: 背景軌 + 填色條
    數值（x=724）: 百分比文字
    垂直置中公式: text_y = row_y + 44/2 + font_size × 0.35
  -->

  <!-- Row 1（y=155）色系 #d97706 琥珀，範例值 85% -->
  <!-- 編號圓 cx=55, cy=row_y+22=177, r=14 -->
  <circle cx="55" cy="177" r="14" fill="#d97706" opacity="0.15"/>
  <text x="55" y="182" font-size="14" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <!-- 項目標籤: text_y = 155 + 22 + 16×0.35 = 182.6 ≈ 183 -->
  <text x="80" y="183" font-size="16" fill="#1e293b" font-weight="700">督導機制不完整</text>
  <!-- 長條軌道（w=500 代表最大刻度） -->
  <rect x="220" y="165" width="500" height="24" rx="12" fill="#e8e6de"/>
  <!-- 填色條 85% → w=425 -->
  <rect x="220" y="165" width="425" height="24" rx="12" fill="#d97706"/>
  <!-- 數值 -->
  <text x="724" y="183" font-size="16" fill="#d97706" font-weight="700">85%</text>

  <!-- Row 2（y=215）色系 #78716c 暖灰，範例值 72% -->
  <circle cx="55" cy="237" r="14" fill="#78716c" opacity="0.15"/>
  <text x="55" y="242" font-size="14" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <text x="80" y="243" font-size="16" fill="#1e293b" font-weight="700">教育訓練流於形式</text>
  <rect x="220" y="225" width="500" height="24" rx="12" fill="#e8e6de"/>
  <rect x="220" y="225" width="360" height="24" rx="12" fill="#78716c"/>
  <text x="724" y="243" font-size="16" fill="#78716c" font-weight="700">72%</text>

  <!-- Row 3（y=275）色系 #57534e 深棕，範例值 61% -->
  <circle cx="55" cy="297" r="14" fill="#57534e" opacity="0.15"/>
  <text x="55" y="302" font-size="14" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <text x="80" y="303" font-size="16" fill="#1e293b" font-weight="700">感染控制文件不齊</text>
  <rect x="220" y="285" width="500" height="24" rx="12" fill="#e8e6de"/>
  <rect x="220" y="285" width="305" height="24" rx="12" fill="#57534e"/>
  <text x="724" y="303" font-size="16" fill="#57534e" font-weight="700">61%</text>

  <!-- Row 4（y=335）色系 #a8a29e 淺石，範例值 43% -->
  <circle cx="55" cy="357" r="14" fill="#a8a29e" opacity="0.15"/>
  <text x="55" y="362" font-size="14" fill="#a8a29e" text-anchor="middle" font-weight="900">4</text>
  <text x="80" y="363" font-size="16" fill="#1e293b" font-weight="700">緊急應變演練不足</text>
  <rect x="220" y="345" width="500" height="24" rx="12" fill="#e8e6de"/>
  <rect x="220" y="345" width="215" height="24" rx="12" fill="#a8a29e"/>
  <text x="724" y="363" font-size="16" fill="#a8a29e" font-weight="700">43%</text>

  <!-- Row 5（y=395）色系 #94a3b8 藍石，範例值 28% -->
  <circle cx="55" cy="417" r="14" fill="#94a3b8" opacity="0.15"/>
  <text x="55" y="422" font-size="14" fill="#94a3b8" text-anchor="middle" font-weight="900">5</text>
  <text x="80" y="423" font-size="16" fill="#1e293b" font-weight="700">個案紀錄填寫錯誤</text>
  <rect x="220" y="405" width="500" height="24" rx="12" fill="#e8e6de"/>
  <rect x="220" y="405" width="140" height="24" rx="12" fill="#94a3b8"/>
  <text x="724" y="423" font-size="16" fill="#94a3b8" font-weight="700">28%</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
