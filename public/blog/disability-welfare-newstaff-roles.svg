<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- 標題列 -->
  <rect x="0" y="29" width="800" height="60" fill="#e8e6de"/>
  <rect x="0" y="29" width="6" height="60" rx="2" fill="#d97706"/>
  <text x="28" y="74" font-size="28" fill="#1e293b" font-weight="700">新進人員各角色核心任務</text>
  <!-- 第1行 -->
  <rect x="28" y="118" width="744" height="62" rx="12" fill="#ffffff" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="118" width="6" height="62" rx="2" fill="#d97706"/>
  <circle cx="66" cy="149" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="154" font-size="20" fill="#d97706" font-weight="700" text-anchor="middle">社</text>
  <text x="96" y="144" font-size="20" fill="#1e293b" font-weight="700">社工師：ISP 流程主責</text>
  <text x="96" y="165" font-size="16" fill="#57534e">負責 4101-4103 ISP 擬訂、4201 跨專業團隊協調、4401-4402 社區與家庭指標</text>
  <rect x="620" y="130" width="136" height="28" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="149" font-size="16" fill="#d97706" font-weight="700" text-anchor="middle">ISP 核心</text>
  <!-- 第2行 -->
  <rect x="28" y="191" width="744" height="62" rx="12" fill="#ffffff" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="191" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="66" cy="222" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="227" font-size="20" fill="#78716c" font-weight="700" text-anchor="middle">教</text>
  <text x="96" y="217" font-size="20" fill="#1e293b" font-weight="700">教保員：日常生活直接照顧</text>
  <text x="96" y="238" font-size="16" fill="#57534e">負責 4202-4204 輔具與體能、4303 膳食，並配合社工填寫 ISP 執行紀錄</text>
  <rect x="620" y="203" width="136" height="28" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="222" font-size="16" fill="#78716c" font-weight="700" text-anchor="middle">生活照顧</text>
  <!-- 第3行 -->
  <rect x="28" y="264" width="744" height="62" rx="12" fill="#ffffff" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="264" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="66" cy="295" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="300" font-size="20" fill="#57534e" font-weight="700" text-anchor="middle">護</text>
  <text x="96" y="290" font-size="20" fill="#1e293b" font-weight="700">護理師：健康管理面向</text>
  <text x="96" y="311" font-size="16" fill="#57534e">負責 4207 壓傷預防、4301-4302 健康管理用藥、4306 感染管制與體溫監測</text>
  <rect x="620" y="276" width="136" height="28" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="295" font-size="16" fill="#57534e" font-weight="700" text-anchor="middle">健康管理</text>
  <!-- 第4行 -->
  <rect x="28" y="337" width="744" height="62" rx="12" fill="#ffffff" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="337" width="6" height="62" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="368" r="16" fill="#94a3b8" opacity="0.15"/>
  <text x="66" y="373" font-size="20" fill="#94a3b8" font-weight="700" text-anchor="middle">共</text>
  <text x="96" y="363" font-size="20" fill="#1e293b" font-weight="700">共同任務：日常紀錄累積</text>
  <text x="96" y="384" font-size="16" fill="#57534e">評鑑佐證來自日常紀錄累積；每次服務後及時填寫，評鑑時才不會手忙腳亂</text>
  <rect x="620" y="349" width="136" height="28" rx="8" fill="#94a3b8" opacity="0.12"/>
  <text x="688" y="368" font-size="16" fill="#94a3b8" font-weight="700" text-anchor="middle">日常養成</text>
  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
