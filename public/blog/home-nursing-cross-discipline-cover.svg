<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 右側裝飾區塊 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>

  <!-- 右側裝飾大文字 -->
  <text x="1010" y="208" font-size="110" font-weight="900" fill="#d97706" text-anchor="middle" opacity="0.85">B1</text>
  <text x="1010" y="250" font-size="26" fill="#78716c" text-anchor="middle" font-weight="600">機構資訊管理</text>

  <!-- 右側 2×2 資訊卡片（B1 5個條件中的跨域合作相關） -->
  <rect x="840" y="270" width="155" height="86" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="918" y="299" font-size="28" fill="#d97706" text-anchor="middle" font-weight="700">合作協議</text>
  <text x="918" y="330" font-size="22" fill="#a8a29e" text-anchor="middle">有效期限管理</text>

  <rect x="1005" y="270" width="155" height="86" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="1083" y="299" font-size="28" fill="#78716c" text-anchor="middle" font-weight="700">轉介記錄</text>
  <text x="1083" y="330" font-size="22" fill="#a8a29e" text-anchor="middle">佐證真實合作</text>

  <rect x="840" y="366" width="155" height="86" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="918" y="395" font-size="28" fill="#78716c" text-anchor="middle" font-weight="700">醫療機構</text>
  <text x="918" y="426" font-size="22" fill="#a8a29e" text-anchor="middle">轉介 · 諮詢</text>

  <rect x="1005" y="366" width="155" height="86" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="1083" y="395" font-size="28" fill="#d97706" text-anchor="middle" font-weight="700">社福機構</text>
  <text x="1083" y="426" font-size="22" fill="#a8a29e" text-anchor="middle">居服 · 日照</text>

  <!-- 右側底部標籤 -->
  <rect x="840" y="462" width="320" height="52" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="1000" y="498" font-size="26" fill="#d97706" text-anchor="middle" font-weight="700">不只是協議書 要有紀錄</text>

  <rect x="840" y="526" width="320" height="52" rx="10" fill="#78716c" opacity="0.10"/>
  <text x="1000" y="562" font-size="24" fill="#78716c" text-anchor="middle" font-weight="600">跨域合作真實運作</text>

  <!-- 浮水印 -->
  <text x="1140" y="590" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>

  <!-- 左側主內容區 -->
  <text x="60" y="200" font-size="110" font-weight="900" fill="#1e293b">跨專業合作</text>
  <text x="60" y="338" font-size="110" font-weight="900" fill="#d97706">B1 完整攻略</text>

  <line x1="60" y1="365" x2="780" y2="365" stroke="#dedad3" stroke-width="2"/>

  <text x="60" y="416" font-size="36" fill="#57534e" font-weight="400">協議書格式 · 效期管理 · 轉介記錄連結</text>

  <!-- 特色標籤列 -->
  <rect x="60" y="450" width="148" height="54" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="134" y="487" font-size="28" fill="#d97706" text-anchor="middle" font-weight="600">跨域合作</text>

  <rect x="220" y="450" width="148" height="54" rx="10" fill="#78716c" opacity="0.12"/>
  <text x="294" y="487" font-size="28" fill="#78716c" text-anchor="middle" font-weight="600">B1 基準</text>

  <rect x="380" y="450" width="148" height="54" rx="10" fill="#57534e" opacity="0.12"/>
  <text x="454" y="487" font-size="28" fill="#57534e" text-anchor="middle" font-weight="600">協議書</text>

  <rect x="540" y="450" width="148" height="54" rx="10" fill="#a8a29e" opacity="0.18"/>
  <text x="614" y="487" font-size="28" fill="#78716c" text-anchor="middle" font-weight="600">115 年度</text>

  <!-- 適用對象 -->
  <text x="60" y="558" font-size="28" fill="#94a3b8">適用對象：居家護理所負責人 · 護理長</text>
</svg>
