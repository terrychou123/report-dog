  <rect x="870" y="420" width="280" height="44" rx="22" fill="#57534e"/>
  <text x="1010" y="448" font-size="20" fill="white" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">循環菜單2週</text>

  <rect x="870" y="475" width="280" height="44" rx="22" fill="#a8a29e"/>
  <text x="1010" y="503" font-size="20" fill="white" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">滿意度調查</text>

