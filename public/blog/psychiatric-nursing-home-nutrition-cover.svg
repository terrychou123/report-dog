<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 右側裝飾區 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>

  <!-- 左側內容區 -->
  <!-- 特色標籤 -->
  <rect x="60" y="60" width="90" height="32" rx="16" fill="#d97706"/>
  <text x="105" y="81" font-size="16" fill="white" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-weight="bold">B3.1</text>
  <rect x="160" y="60" width="130" height="32" rx="16" fill="#78716c"/>
  <text x="225" y="81" font-size="16" fill="white" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">個別化飲食</text>
  <rect x="300" y="60" width="90" height="32" rx="16" fill="#57534e"/>
  <text x="345" y="81" font-size="16" fill="white" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">營養師</text>

  <!-- 主標題第1行 -->
  <text x="60" y="220" font-size="120" fill="#1e293b" font-family="'Noto Sans TC', sans-serif" font-weight="bold">膳食管理</text>
  <!-- 主標題第2行 -->
  <text x="60" y="345" font-size="110" fill="#d97706" font-family="'Noto Sans TC', sans-serif" font-weight="bold">個別化飲食</text>

  <!-- 副標題 -->
  <text x="60" y="410" font-size="38" fill="#57534e" font-family="'Noto Sans TC', sans-serif">B3.1循環菜單、快樂餐與營養照護評鑑準備</text>

  <!-- 分隔線 -->
