  <!-- 直列pill -->
  <rect x="870" y="310" width="280" height="44" rx="22" fill="#d97706"/>
  <text x="1010" y="338" font-size="20" fill="white" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">一般／細碎／軟質</text>

  <rect x="870" y="365" width="280" height="44" rx="22" fill="#78716c"/>
