<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- Header y=29, h=60 -->
  <rect x="40" y="29" width="720" height="60" rx="10" fill="#1e293b"/>
  <text x="400" y="58" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">B 區：專業照護品質 — 5 大核心自評問題（B1–B31）</text>

  <!-- N=5 版型：H=60, inner_gap=13, outer_gap=29 -->
  <!-- Row1 y=118 -->
  <rect x="28" y="118" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="118" width="6" height="60" rx="2" fill="#d97706"/>
  <circle cx="66" cy="148" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="154" font-size="16" font-weight="900" fill="#d97706" text-anchor="middle">B2</text>
  <text x="100" y="145" font-size="20" font-weight="700" fill="#1e293b">個案多專業服務計畫（二級加強）</text>
  <text x="100" y="166" font-size="16" fill="#57534e">入住72h內完成評估；每3個月更新；抽查至少5位個案</text>
  <rect x="620" y="126" width="136" height="44" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="154" font-size="16" fill="#d97706" text-anchor="middle">二級加強</text>

  <!-- Row2 y=191 -->
  <rect x="28" y="191" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="191" width="6" height="60" rx="2" fill="#78716c"/>
  <circle cx="66" cy="221" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="227" font-size="16" font-weight="900" fill="#78716c" text-anchor="middle">B10</text>
  <text x="100" y="218" font-size="20" font-weight="700" fill="#1e293b">防疫感染管制手冊年度更新</text>
  <text x="100" y="239" font-size="16" fill="#57534e">每年至少檢視更新1次；每間寢室需有效期內洗手液</text>
  <rect x="620" y="199" width="136" height="44" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="227" font-size="16" fill="#78716c" text-anchor="middle">每年必更新</text>

  <!-- Row3 y=264 -->
  <rect x="28" y="264" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="264" width="6" height="60" rx="2" fill="#57534e"/>
  <circle cx="66" cy="294" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="300" font-size="16" font-weight="900" fill="#57534e" text-anchor="middle">B13-19</text>
  <text x="100" y="291" font-size="20" font-weight="700" fill="#1e293b">七大監測指標每季PDCA分析</text>
  <text x="100" y="312" font-size="16" fill="#57534e">跌倒、壓瘡、疼痛、約束、感染、非計畫住院、體重改變</text>
  <rect x="620" y="272" width="136" height="44" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="300" font-size="16" fill="#57534e" text-anchor="middle">每季分析</text>

  <!-- Row4 y=337 -->
  <rect x="28" y="337" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="337" width="6" height="60" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="367" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="373" font-size="16" font-weight="900" fill="#a8a29e" text-anchor="middle">B25</text>
  <text x="100" y="364" font-size="20" font-weight="700" fill="#1e293b">個案每日下床活動紀錄</text>
  <text x="100" y="385" font-size="16" fill="#57534e">可移動個案每天至少2次；昏迷個案每天至少1次，有記錄</text>
  <rect x="620" y="345" width="136" height="44" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="373" font-size="16" fill="#a8a29e" text-anchor="middle">每日執行</text>

  <!-- Row5 y=410 -->
  <rect x="28" y="410" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="410" width="6" height="60" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="440" r="16" fill="#94a3b8" opacity="0.15"/>
  <text x="66" y="446" font-size="16" font-weight="900" fill="#94a3b8" text-anchor="middle">B31</text>
  <text x="100" y="437" font-size="20" font-weight="700" fill="#1e293b">管灌個案個別空針＋天然食材</text>
  <text x="100" y="458" font-size="16" fill="#57534e">每位管灌個案用個別空針；食物不可全為商業配方</text>
  <rect x="620" y="418" width="136" height="44" rx="8" fill="#94a3b8" opacity="0.12"/>
  <text x="688" y="446" font-size="16" fill="#94a3b8" text-anchor="middle">實地抽查</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
