<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- Header y=29, h=60 -->
  <rect x="40" y="29" width="720" height="60" rx="10" fill="#1e293b"/>
  <text x="400" y="58" font-size="22" font-weight="700" fill="#ffffff" font-family="sans-serif" text-anchor="middle">B 區：專業照護品質 — 5 大核心自評問題（B1–B31）</text>
  <text x="400" y="79" font-size="14" fill="#a8a29e" font-family="sans-serif" text-anchor="middle"> </text>

  <!-- N=5 版型：H=60, inner_gap=13, outer_gap=29 -->
  <!-- Row1 y=118 -->
  <rect x="40" y="118" width="720" height="60" rx="8" fill="#ffffff"/>
  <rect x="40" y="118" width="6" height="60" rx="3" fill="#d97706"/>
  <circle cx="66" cy="148" r="16" fill="#d97706"/>
  <text x="66" y="154" font-size="14" font-weight="700" fill="#ffffff" font-family="sans-serif" text-anchor="middle">B2</text>
  <text x="100" y="140" font-size="18" font-weight="700" fill="#1e293b" font-family="sans-serif">個案多專業服務計畫（二級加強）</text>
  <text x="100" y="161" font-size="14" fill="#57534e" font-family="sans-serif">入住72h內完成評估；每3個月更新；抽查至少5位個案</text>
  <rect x="620" y="129" width="128" height="38" rx="6" fill="#fee2e2"/>
  <text x="684" y="153" font-size="14" font-weight="700" fill="#dc2626" font-family="sans-serif" text-anchor="middle">二級加強</text>

  <!-- Row2 y=191 -->
  <rect x="40" y="191" width="720" height="60" rx="8" fill="#ffffff"/>
  <rect x="40" y="191" width="6" height="60" rx="3" fill="#78716c"/>
  <circle cx="66" cy="221" r="16" fill="#78716c"/>
  <text x="66" y="227" font-size="14" font-weight="700" fill="#ffffff" font-family="sans-serif" text-anchor="middle">B10</text>
  <text x="100" y="213" font-size="18" font-weight="700" fill="#1e293b" font-family="sans-serif">防疫感染管制手冊年度更新</text>
  <text x="100" y="234" font-size="14" fill="#57534e" font-family="sans-serif">每年至少檢視更新1次；每間寢室需有效期內洗手液</text>
  <rect x="620" y="202" width="128" height="38" rx="6" fill="#fef3c7"/>
  <text x="684" y="226" font-size="14" font-weight="700" fill="#d97706" font-family="sans-serif" text-anchor="middle">每年必更新</text>

  <!-- Row3 y=264 -->
  <rect x="40" y="264" width="720" height="60" rx="8" fill="#ffffff"/>
  <rect x="40" y="264" width="6" height="60" rx="3" fill="#57534e"/>
  <circle cx="66" cy="294" r="16" fill="#57534e"/>
  <text x="66" y="300" font-size="13" font-weight="700" fill="#ffffff" font-family="sans-serif" text-anchor="middle">B13-19</text>
  <text x="100" y="286" font-size="18" font-weight="700" fill="#1e293b" font-family="sans-serif">七大監測指標每季PDCA分析</text>
  <text x="100" y="307" font-size="14" fill="#57534e" font-family="sans-serif">跌倒、壓瘡、疼痛、約束、感染、非計畫住院、體重改變</text>
  <rect x="620" y="275" width="128" height="38" rx="6" fill="#fef3c7"/>
  <text x="684" y="299" font-size="14" font-weight="700" fill="#d97706" font-family="sans-serif" text-anchor="middle">每季分析</text>

  <!-- Row4 y=337 -->
  <rect x="40" y="337" width="720" height="60" rx="8" fill="#ffffff"/>
  <rect x="40" y="337" width="6" height="60" rx="3" fill="#a8a29e"/>
  <circle cx="66" cy="367" r="16" fill="#a8a29e"/>
  <text x="66" y="373" font-size="14" font-weight="700" fill="#ffffff" font-family="sans-serif" text-anchor="middle">B25</text>
  <text x="100" y="359" font-size="18" font-weight="700" fill="#1e293b" font-family="sans-serif">個案每日下床活動紀錄</text>
  <text x="100" y="380" font-size="14" fill="#57534e" font-family="sans-serif">可移動個案每天至少2次；昏迷個案每天至少1次，有記錄</text>
  <rect x="620" y="348" width="128" height="38" rx="6" fill="#dcfce7"/>
  <text x="684" y="372" font-size="14" font-weight="700" fill="#16a34a" font-family="sans-serif" text-anchor="middle">每日執行</text>

  <!-- Row5 y=410 -->
  <rect x="40" y="410" width="720" height="60" rx="8" fill="#ffffff"/>
  <rect x="40" y="410" width="6" height="60" rx="3" fill="#94a3b8"/>
  <circle cx="66" cy="440" r="16" fill="#94a3b8"/>
  <text x="66" y="446" font-size="14" font-weight="700" fill="#ffffff" font-family="sans-serif" text-anchor="middle">B31</text>
  <text x="100" y="432" font-size="18" font-weight="700" fill="#1e293b" font-family="sans-serif">管灌個案個別空針＋天然食材</text>
  <text x="100" y="453" font-size="14" fill="#57534e" font-family="sans-serif">每位管灌個案用個別空針；食物不可全為商業配方</text>
  <rect x="620" y="421" width="128" height="38" rx="6" fill="#fef3c7"/>
  <text x="684" y="445" font-size="14" font-weight="700" fill="#d97706" font-family="sans-serif" text-anchor="middle">實地抽查</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" font-family="sans-serif">報告汪 reportwang.com</text>
</svg>
