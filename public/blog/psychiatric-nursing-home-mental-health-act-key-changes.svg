<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <rect x="0" y="29" width="800" height="60" fill="#e8e6de"/>
  <rect x="0" y="29" width="6" height="60" rx="2" fill="#d97706"/>
  <text x="28" y="74" font-size="30" fill="#1e293b" font-weight="700">精神衛生法修法三大重點及機構影響</text>
  <rect x="28" y="118" width="744" height="60" rx="12" fill="#e8e6de"/>
  <rect x="28" y="118" width="6" height="60" rx="2" fill="#d97706"/>
  <circle cx="66" cy="148" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="154" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <text x="100" y="145" font-size="20" fill="#1e293b" font-weight="700">緊急安置不得逾 7 日</text>
  <text x="100" y="166" font-size="16" fill="#57534e">機構需熟悉住民轉至急性病房的法律時限程序，書面記錄即時性更重要</text>
  <rect x="620" y="126" width="136" height="44" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="142" font-size="16" fill="#d97706" text-anchor="middle">7 日</text>
  <text x="688" y="162" font-size="16" fill="#d97706" text-anchor="middle">期限</text>
  <rect x="28" y="191" width="744" height="60" rx="12" fill="#e8e6de"/>
  <rect x="28" y="191" width="6" height="60" rx="2" fill="#78716c"/>
  <circle cx="66" cy="221" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="227" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <text x="100" y="218" font-size="20" fill="#1e293b" font-weight="700">強制鑑定 3 日內完成</text>
  <text x="100" y="239" font-size="16" fill="#57534e">住民被申請強制鑑定時，機構需提供近期護理記錄作為鑑定參考</text>
  <rect x="620" y="199" width="136" height="44" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="215" font-size="16" fill="#78716c" text-anchor="middle">3 日</text>
  <text x="688" y="235" font-size="16" fill="#78716c" text-anchor="middle">即時記錄</text>
  <rect x="28" y="264" width="744" height="60" rx="12" fill="#e8e6de"/>
  <rect x="28" y="264" width="6" height="60" rx="2" fill="#57534e"/>
  <circle cx="66" cy="294" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="300" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <text x="100" y="291" font-size="20" fill="#1e293b" font-weight="700">社區支持入法</text>
  <text x="100" y="312" font-size="16" fill="#57534e">強化去機構化政策，要求機構主動建立社區連結（B1.13重要性提升）</text>
  <rect x="620" y="272" width="136" height="44" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="288" font-size="16" fill="#57534e" text-anchor="middle">B1.13</text>
  <text x="688" y="308" font-size="16" fill="#57534e" text-anchor="middle">強化</text>
  <rect x="28" y="337" width="744" height="60" rx="12" fill="#e8e6de"/>
  <rect x="28" y="337" width="6" height="60" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="367" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="373" font-size="16" fill="#a8a29e" text-anchor="middle" font-weight="900">因應</text>
  <text x="100" y="364" font-size="20" fill="#1e293b" font-weight="700">「合理調整」原則入法</text>
  <text x="100" y="385" font-size="16" fill="#57534e">機構需依住民個別需求提供合理調整，而非統一服務標準</text>
  <rect x="620" y="345" width="136" height="44" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="361" font-size="16" fill="#a8a29e" text-anchor="middle">個別</text>
  <text x="688" y="381" font-size="16" fill="#a8a29e" text-anchor="middle">調整</text>
  <rect x="28" y="410" width="744" height="60" rx="12" fill="#e8e6de"/>
  <rect x="28" y="410" width="6" height="60" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="440" r="16" fill="#94a3b8" opacity="0.15"/>
  <text x="66" y="446" font-size="16" fill="#94a3b8" text-anchor="middle" font-weight="900">文件</text>
  <text x="100" y="437" font-size="20" fill="#1e293b" font-weight="700">評鑑文件要呈現對新法規的因應</text>
  <text x="100" y="458" font-size="16" fill="#57534e">業務計畫或政策文件中加入「依修法更新以下SOP」的說明</text>
  <rect x="620" y="418" width="136" height="44" rx="8" fill="#94a3b8" opacity="0.12"/>
  <text x="688" y="434" font-size="16" fill="#94a3b8" text-anchor="middle">法規</text>
  <text x="688" y="454" font-size="16" fill="#94a3b8" text-anchor="middle">因應</text>
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
