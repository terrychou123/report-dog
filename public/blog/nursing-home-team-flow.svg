<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <rect x="0" y="0" width="800" height="94" fill="white"/>
  <rect x="0" y="0" width="6" height="94" fill="#d97706" rx="2"/>
  <text x="400" y="48" font-size="32" font-weight="700" fill="#1e293b" text-anchor="middle">多職種協作流程</text>
  <text x="400" y="78" font-size="22" fill="#78716c" text-anchor="middle">從任務分配到整合演練的四步驟</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- 分隔線（卡片群組等寬） -->
  <line x1="28" y1="102" x2="772" y2="102" stroke="#dedad3" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- 卡片1：任務分配 -->
  <rect x="28" y="108" width="174" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="108" width="174" height="8" rx="4" fill="#d97706"/>
  <rect x="28" y="112" width="174" height="4" fill="#d97706"/>
  <circle cx="115" cy="201" r="44" fill="#d97706" opacity="0.10"/>
  <text x="115" y="192" font-size="18" fill="#d97706" text-anchor="middle" font-weight="600">STEP</text>
  <text x="115" y="220" font-size="29" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <text x="115" y="265" font-size="22" fill="#1e293b" text-anchor="middle" font-weight="700">任務分配</text>
  <text x="115" y="299" font-size="15" fill="#57534e" text-anchor="middle">召開啟動會議</text>
  <text x="115" y="321" font-size="15" fill="#57534e" text-anchor="middle">確認各職種負責</text>
  <text x="115" y="343" font-size="15" fill="#57534e" text-anchor="middle">評鑑構面與項目</text>
  <rect x="38" y="377" width="154" height="36" rx="18" fill="#d97706" opacity="0.12"/>
  <text x="115" y="401" font-size="16" fill="#d97706" text-anchor="middle" font-weight="600">評鑑前12週</text>

  <!-- 箭頭1 -->
  <line x1="202" y1="279" x2="218" y2="279" stroke="#d97706" stroke-width="2"/>
  <polygon points="218,273 228,279 218,285" fill="#d97706"/>

  <!-- 卡片2：各自準備 -->
  <rect x="218" y="108" width="174" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="218" y="108" width="174" height="8" rx="4" fill="#78716c"/>
  <rect x="218" y="112" width="174" height="4" fill="#78716c"/>
  <circle cx="305" cy="201" r="44" fill="#78716c" opacity="0.10"/>
  <text x="305" y="192" font-size="18" fill="#78716c" text-anchor="middle" font-weight="600">STEP</text>
  <text x="305" y="220" font-size="29" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <text x="305" y="265" font-size="22" fill="#1e293b" text-anchor="middle" font-weight="700">各自準備</text>
  <text x="305" y="299" font-size="15" fill="#57534e" text-anchor="middle">各職種依責任清單</text>
  <text x="305" y="321" font-size="15" fill="#57534e" text-anchor="middle">整理文件、訂SOP</text>
  <text x="305" y="343" font-size="15" fill="#57534e" text-anchor="middle">每週更新進度</text>
  <rect x="228" y="377" width="154" height="36" rx="18" fill="#78716c" opacity="0.12"/>
  <text x="305" y="401" font-size="16" fill="#78716c" text-anchor="middle" font-weight="600">評鑑前8-12週</text>

  <!-- 箭頭2 -->
  <line x1="392" y1="279" x2="408" y2="279" stroke="#78716c" stroke-width="2"/>
  <polygon points="408,273 418,279 408,285" fill="#78716c"/>

  <!-- 卡片3：交叉確認 -->
  <rect x="408" y="108" width="174" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="408" y="108" width="174" height="8" rx="4" fill="#57534e"/>
  <rect x="408" y="112" width="174" height="4" fill="#57534e"/>
  <circle cx="495" cy="201" r="44" fill="#57534e" opacity="0.10"/>
  <text x="495" y="192" font-size="18" fill="#57534e" text-anchor="middle" font-weight="600">STEP</text>
  <text x="495" y="220" font-size="29" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <text x="495" y="265" font-size="22" fill="#1e293b" text-anchor="middle" font-weight="700">交叉確認</text>
  <text x="495" y="299" font-size="15" fill="#57534e" text-anchor="middle">跨職種相互查核</text>
  <text x="495" y="321" font-size="15" fill="#57534e" text-anchor="middle">B5每季聯繫會議</text>
  <text x="495" y="343" font-size="15" fill="#57534e" text-anchor="middle">補齊漏缺文件</text>
  <rect x="418" y="377" width="154" height="36" rx="18" fill="#57534e" opacity="0.12"/>
  <text x="495" y="401" font-size="16" fill="#57534e" text-anchor="middle" font-weight="600">評鑑前4-8週</text>

  <!-- 箭頭3 -->
  <line x1="582" y1="279" x2="598" y2="279" stroke="#57534e" stroke-width="2"/>
  <polygon points="598,273 608,279 598,285" fill="#57534e"/>

  <!-- 卡片4：整合演練 -->
  <rect x="598" y="108" width="174" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="598" y="108" width="174" height="8" rx="4" fill="#a8a29e"/>
  <rect x="598" y="112" width="174" height="4" fill="#a8a29e"/>
  <circle cx="685" cy="201" r="44" fill="#a8a29e" opacity="0.10"/>
  <text x="685" y="192" font-size="18" fill="#78716c" text-anchor="middle" font-weight="600">STEP</text>
  <text x="685" y="220" font-size="29" fill="#78716c" text-anchor="middle" font-weight="900">4</text>
  <text x="685" y="265" font-size="22" fill="#1e293b" text-anchor="middle" font-weight="700">整合演練</text>
  <text x="685" y="299" font-size="15" fill="#57534e" text-anchor="middle">模擬委員查核流程</text>
  <text x="685" y="321" font-size="15" fill="#57534e" text-anchor="middle">全體彩排訪談問答</text>
  <text x="685" y="343" font-size="15" fill="#57534e" text-anchor="middle">確認文件隨手可取</text>
  <rect x="608" y="377" width="154" height="36" rx="18" fill="#a8a29e" opacity="0.12"/>
  <text x="685" y="401" font-size="16" fill="#78716c" text-anchor="middle" font-weight="600">評鑑前1-4週</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
