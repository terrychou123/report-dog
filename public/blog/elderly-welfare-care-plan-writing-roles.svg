<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- Header (N=4 outer_gap=50, Header y=50, h=76) -->
  <rect x="50" y="50" width="700" height="76" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="400" y="89" font-size="22" fill="#1e293b" font-weight="700" text-anchor="middle" font-family="sans-serif">多專業分工角色說明</text>
  <text x="400" y="113" font-size="15" fill="#57534e" text-anchor="middle" font-family="sans-serif">B2 審查重點：各職類評估分工明確、記錄完整</text>

  <!-- Row 1: y=160 -->
  <rect x="50" y="160" width="700" height="62" rx="8" fill="#ffffff"/>
  <rect x="50" y="160" width="6" height="62" rx="3" fill="#d97706"/>
  <circle cx="87" cy="191" r="16" fill="#d97706" opacity="0.15"/>
  <text x="87" y="197" font-size="16" fill="#d97706" font-weight="700" text-anchor="middle" font-family="sans-serif">1</text>
  <text x="120" y="182" font-size="16" fill="#1e293b" font-weight="700" font-family="sans-serif">社工人員</text>
  <text x="120" y="202" font-size="14" fill="#57534e" font-family="sans-serif">負責社會需求評估、家庭資源盤點、家屬溝通協調與計畫修訂會議主持</text>
  <rect x="620" y="167" width="115" height="46" rx="6" fill="#d97706" opacity="0.12"/>
  <text x="677" y="191" font-size="14" fill="#d97706" font-weight="700" text-anchor="middle" font-family="sans-serif">社會需求</text>
  <text x="677" y="207" font-size="13" fill="#d97706" text-anchor="middle" font-family="sans-serif">家屬協調</text>

  <!-- Row 2: y=235 -->
  <rect x="50" y="235" width="700" height="62" rx="8" fill="#ffffff"/>
  <rect x="50" y="235" width="6" height="62" rx="3" fill="#78716c"/>
  <circle cx="87" cy="266" r="16" fill="#78716c" opacity="0.15"/>
  <text x="87" y="272" font-size="16" fill="#78716c" font-weight="700" text-anchor="middle" font-family="sans-serif">2</text>
  <text x="120" y="257" font-size="16" fill="#1e293b" font-weight="700" font-family="sans-serif">護理人員</text>
  <text x="120" y="277" font-size="14" fill="#57534e" font-family="sans-serif">負責身體與營養狀態評估、醫療照護需求分析、護理計畫制定</text>
  <rect x="620" y="242" width="115" height="46" rx="6" fill="#78716c" opacity="0.12"/>
  <text x="677" y="266" font-size="14" fill="#78716c" font-weight="700" text-anchor="middle" font-family="sans-serif">身體評估</text>
  <text x="677" y="282" font-size="13" fill="#78716c" text-anchor="middle" font-family="sans-serif">護理計畫</text>

  <!-- Row 3: y=310 -->
  <rect x="50" y="310" width="700" height="62" rx="8" fill="#ffffff"/>
  <rect x="50" y="310" width="6" height="62" rx="3" fill="#57534e"/>
  <circle cx="87" cy="341" r="16" fill="#57534e" opacity="0.15"/>
  <text x="87" y="347" font-size="16" fill="#57534e" font-weight="700" text-anchor="middle" font-family="sans-serif">3</text>
  <text x="120" y="332" font-size="16" fill="#1e293b" font-weight="700" font-family="sans-serif">照顧服務員</text>
  <text x="120" y="352" font-size="14" fill="#57534e" font-family="sans-serif">負責日常生活自理能力評估、翻身拍背/盥洗/下床活動執行記錄</text>
  <rect x="620" y="317" width="115" height="46" rx="6" fill="#57534e" opacity="0.12"/>
  <text x="677" y="341" font-size="14" fill="#57534e" font-weight="700" text-anchor="middle" font-family="sans-serif">日常照護</text>
  <text x="677" y="357" font-size="13" fill="#57534e" text-anchor="middle" font-family="sans-serif">生活功能</text>

  <!-- Row 4: y=385 -->
  <rect x="50" y="385" width="700" height="62" rx="8" fill="#ffffff"/>
  <rect x="50" y="385" width="6" height="62" rx="3" fill="#a8a29e"/>
  <circle cx="87" cy="416" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="87" y="422" font-size="16" fill="#a8a29e" font-weight="700" text-anchor="middle" font-family="sans-serif">4</text>
  <text x="120" y="407" font-size="16" fill="#1e293b" font-weight="700" font-family="sans-serif">主管/個管師</text>
  <text x="120" y="427" font-size="14" fill="#57534e" font-family="sans-serif">統籌個案會議召開、整合各職類評估意見、審核計畫完整性並簽核</text>
  <rect x="620" y="392" width="115" height="46" rx="6" fill="#a8a29e" opacity="0.12"/>
  <text x="677" y="416" font-size="14" fill="#a8a29e" font-weight="700" text-anchor="middle" font-family="sans-serif">整合統籌</text>
  <text x="677" y="432" font-size="13" fill="#a8a29e" text-anchor="middle" font-family="sans-serif">計畫簽核</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" font-family="sans-serif">報告汪 reportwang.com</text>
</svg>
