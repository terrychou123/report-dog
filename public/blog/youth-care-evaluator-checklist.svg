<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;display=swap');</style>
  </defs>
  <!-- Background -->
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- Header -->
  <rect x="28" y="29" width="744" height="60" rx="12" fill="#1e293b"/>
  <text x="400" y="53" font-family="'Noto Sans TC', sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">文件審查階段</text>
  <text x="400" y="75" font-family="'Noto Sans TC', sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">評鑑委員優先查看的文件順序</text>
  <!-- Row 1 -->
  <rect x="28" y="118" width="744" height="60" rx="12" fill="#ffffff"/>
  <rect x="28" y="118" width="6" height="60" rx="3" fill="#d97706"/>
  <circle cx="66" cy="148" r="16" fill="#fef3c7"/>
  <text x="66" y="153" font-family="'Noto Sans TC', sans-serif" font-size="14" font-weight="700" fill="#d97706" text-anchor="middle">1</text>
  <text x="100" y="136" font-family="'Noto Sans TC', sans-serif" font-size="15" font-weight="700" fill="#1e293b">輔導目標追蹤表（項目 16，15分）</text>
  <text x="100" y="158" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#57534e">目標設定→執行追蹤→達成評估的完整鏈條，幾乎必定抽查</text>
  <rect x="620" y="129" width="136" height="38" rx="8" fill="#fef3c7"/>
  <text x="688" y="152" font-family="'Noto Sans TC', sans-serif" font-size="13" font-weight="700" fill="#d97706" text-anchor="middle">最高優先</text>
  <!-- Row 2 -->
  <rect x="28" y="191" width="744" height="60" rx="12" fill="#ffffff"/>
  <rect x="28" y="191" width="6" height="60" rx="3" fill="#78716c"/>
  <circle cx="66" cy="221" r="16" fill="#f5f5f4"/>
  <text x="66" y="226" font-family="'Noto Sans TC', sans-serif" font-size="14" font-weight="700" fill="#78716c" text-anchor="middle">2</text>
  <text x="100" y="213" font-family="'Noto Sans TC', sans-serif" font-size="15" font-weight="700" fill="#1e293b">個案服務記錄（項目 17–24）</text>
  <text x="100" y="235" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#57534e">抽查 2–4 個案完整記錄，看規律性與個別化程度</text>
  <rect x="620" y="202" width="136" height="38" rx="8" fill="#f5f5f4"/>
  <text x="688" y="225" font-family="'Noto Sans TC', sans-serif" font-size="13" font-weight="700" fill="#78716c" text-anchor="middle">高度關注</text>
  <!-- Row 3 -->
  <rect x="28" y="264" width="744" height="60" rx="12" fill="#ffffff"/>
  <rect x="28" y="264" width="6" height="60" rx="3" fill="#57534e"/>
  <circle cx="66" cy="294" r="16" fill="#f5f5f4"/>
  <text x="66" y="299" font-family="'Noto Sans TC', sans-serif" font-size="14" font-weight="700" fill="#57534e" text-anchor="middle">3</text>
  <text x="100" y="286" font-family="'Noto Sans TC', sans-serif" font-size="15" font-weight="700" fill="#1e293b">督導記錄（項目 28）</text>
  <text x="100" y="308" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#57534e">需顯示討論深度，有具體主題、督導意見和後續行動</text>
  <rect x="620" y="275" width="136" height="38" rx="8" fill="#f5f5f4"/>
  <text x="688" y="298" font-family="'Noto Sans TC', sans-serif" font-size="13" font-weight="700" fill="#57534e" text-anchor="middle">質量並重</text>
  <!-- Row 4 -->
  <rect x="28" y="337" width="744" height="60" rx="12" fill="#ffffff"/>
  <rect x="28" y="337" width="6" height="60" rx="3" fill="#a8a29e"/>
  <circle cx="66" cy="367" r="16" fill="#e7e5e4"/>
  <text x="66" y="372" font-family="'Noto Sans TC', sans-serif" font-size="14" font-weight="700" fill="#a8a29e" text-anchor="middle">4</text>
  <text x="100" y="359" font-family="'Noto Sans TC', sans-serif" font-size="15" font-weight="700" fill="#1e293b">財務與董事會文件（項目 29，行政組織）</text>
  <text x="100" y="381" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#57534e">歷年審計查核結果、預算執行、持續改善跡象</text>
  <rect x="620" y="348" width="136" height="38" rx="8" fill="#e7e5e4"/>
  <text x="688" y="371" font-family="'Noto Sans TC', sans-serif" font-size="13" font-weight="700" fill="#a8a29e" text-anchor="middle">歷史脈絡</text>
  <!-- Warning note -->
  <rect x="28" y="412" width="744" height="48" rx="12" fill="#fef3c7"/>
  <text x="400" y="441" font-family="'Noto Sans TC', sans-serif" font-size="15" font-weight="700" fill="#d97706" text-anchor="middle">委員最在意：文件空白處、記錄不連續、同質性過高</text>
  <!-- Watermark -->
  <text x="760" y="480" font-family="'Noto Sans TC', sans-serif" font-size="16" fill="#d97706" text-anchor="end" opacity="0.6">報告汪</text>
</svg>
