<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <rect x="0" y="29" width="800" height="60" fill="#e8e6de"/>
  <rect x="0" y="29" width="6" height="60" rx="2" fill="#d97706"/>
  <text x="28" y="74" font-size="30" fill="#1e293b" font-weight="700">完整約束記錄必備五大欄位</text>
  <rect x="28" y="118" width="744" height="60" rx="12" fill="#e8e6de"/>
  <rect x="28" y="118" width="6" height="60" rx="2" fill="#d97706"/>
  <circle cx="66" cy="148" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="154" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">前</text>
  <text x="100" y="145" font-size="20" fill="#1e293b" font-weight="700">約束前評估：危險性評估與替代措施嘗試</text>
  <text x="100" y="166" font-size="16" fill="#57534e">說明臨床理由，記錄已嘗試哪些非約束替代措施及效果</text>
  <rect x="620" y="126" width="136" height="44" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="142" font-size="16" fill="#d97706" text-anchor="middle">評估</text>
  <text x="688" y="162" font-size="16" fill="#d97706" text-anchor="middle">替代</text>
  <rect x="28" y="191" width="744" height="60" rx="12" fill="#e8e6de"/>
  <rect x="28" y="191" width="6" height="60" rx="2" fill="#78716c"/>
  <circle cx="66" cy="221" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="227" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">醫囑</text>
  <text x="100" y="218" font-size="20" fill="#1e293b" font-weight="700">醫師醫囑與住民/家屬知情同意</text>
  <text x="100" y="239" font-size="16" fill="#57534e">約束使用通常須有醫師醫囑，住民或家屬知情同意需有記錄</text>
  <rect x="620" y="199" width="136" height="44" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="215" font-size="16" fill="#78716c" text-anchor="middle">醫囑</text>
  <text x="688" y="235" font-size="16" fill="#78716c" text-anchor="middle">同意</text>
  <rect x="28" y="264" width="744" height="60" rx="12" fill="#e8e6de"/>
  <rect x="28" y="264" width="6" height="60" rx="2" fill="#57534e"/>
  <circle cx="66" cy="294" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="300" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">執行</text>
  <text x="100" y="291" font-size="20" fill="#1e293b" font-weight="700">約束期間定時觀察記錄</text>
  <text x="100" y="312" font-size="16" fill="#57534e">每隔固定時間（通常每 2 小時）確認住民狀況並記錄</text>
  <rect x="620" y="272" width="136" height="44" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="288" font-size="16" fill="#57534e" text-anchor="middle">定時</text>
  <text x="688" y="308" font-size="16" fill="#57534e" text-anchor="middle">觀察</text>
  <rect x="28" y="337" width="744" height="60" rx="12" fill="#e8e6de"/>
  <rect x="28" y="337" width="6" height="60" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="367" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="373" font-size="16" fill="#a8a29e" text-anchor="middle" font-weight="900">解除</text>
  <text x="100" y="364" font-size="20" fill="#1e293b" font-weight="700">解除約束後的追蹤評估</text>
  <text x="100" y="385" font-size="16" fill="#57534e">解除後評估住民狀況，記錄解除原因與後續照護計畫</text>
  <rect x="620" y="345" width="136" height="44" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="361" font-size="16" fill="#a8a29e" text-anchor="middle">解除</text>
  <text x="688" y="381" font-size="16" fill="#a8a29e" text-anchor="middle">追蹤</text>
  <rect x="28" y="410" width="744" height="60" rx="12" fill="#e8e6de"/>
  <rect x="28" y="410" width="6" height="60" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="440" r="16" fill="#94a3b8" opacity="0.15"/>
  <text x="66" y="446" font-size="16" fill="#94a3b8" text-anchor="middle" font-weight="900">月檢</text>
  <text x="100" y="437" font-size="20" fill="#1e293b" font-weight="700">每月逐案檢討，納入品質指標統計</text>
  <text x="100" y="458" font-size="16" fill="#57534e">約束率計算、趨勢分析，低約束目標持續追蹤</text>
  <rect x="620" y="418" width="136" height="44" rx="8" fill="#94a3b8" opacity="0.12"/>
  <text x="688" y="434" font-size="16" fill="#94a3b8" text-anchor="middle">月度</text>
  <text x="688" y="454" font-size="16" fill="#94a3b8" text-anchor="middle">統計</text>
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
