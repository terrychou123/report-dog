<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- Header（y=50, h=76）底色白 -->
  <rect x="0" y="50" width="800" height="76" fill="white"/>
  <rect x="0" y="50" width="6" height="76" fill="#d97706"/>
  <text x="28" y="104" font-size="36" fill="#1e293b" font-weight="700">各機構評鑑得分分佈（頻率直方圖）</text>

  <!--
    頻率分佈直方圖（Histogram）
    圖表區: x=90~756（Y 軸 x=90），y=140~410（h=270，代表 0~35 家）
    6 個相鄰色柱（無間隔），每柱 w=111px
    x 起點: 90/201/312/423/534/645（中心: 145/256/367/478/589/700）
    Y 軸刻度 0/10/20/30 對應 y=410/333/256/179
    水平格線（虛線）: y=333/256/179
    最高柱（80-84 分，31 家）用琥珀色強調
    Y 軸標題: 「機構數（家）」、X 軸標題: 「評鑑得分分佈」
  -->

  <!-- Y 軸線 & 基線 -->
  <line x1="90" y1="140" x2="90" y2="415" stroke="#e8e6de" stroke-width="1"/>
  <line x1="90" y1="410" x2="756" y2="410" stroke="#e8e6de" stroke-width="1"/>

  <!-- 水平格線（虛線，y=333/256/179 對應 10/20/30 家） -->
  <line x1="90" y1="333" x2="756" y2="333" stroke="#e8e6de" stroke-dasharray="4,3" stroke-width="1"/>
  <line x1="90" y1="256" x2="756" y2="256" stroke="#e8e6de" stroke-dasharray="4,3" stroke-width="1"/>
  <line x1="90" y1="179" x2="756" y2="179" stroke="#e8e6de" stroke-dasharray="4,3" stroke-width="1"/>

  <!-- Y 軸刻度標籤（text-anchor=end, x=82）
       text_y = scale_y + 14×0.35 = scale_y + 5 -->
  <text x="82" y="415" font-size="14" fill="#a8a29e" text-anchor="end">0</text>
  <text x="82" y="338" font-size="14" fill="#a8a29e" text-anchor="end">10</text>
  <text x="82" y="261" font-size="14" fill="#a8a29e" text-anchor="end">20</text>
  <text x="82" y="184" font-size="14" fill="#a8a29e" text-anchor="end">30</text>
  <!-- Y 軸標題 -->
  <text x="28" y="137" font-size="14" fill="#a8a29e">機構數（家）</text>

  <!--
    6 個相鄰柱（無間隔 = 直方圖特徵）：
    bar_h = round(n / 35 × 270)，top_y = 410 - bar_h

    柱 1（60-69 分，n=8）:  h=62,  top=348, fill=#c4bfb8
    柱 2（70-74 分，n=15）: h=116, top=294, fill=#a8a29e
    柱 3（75-79 分，n=22）: h=170, top=240, fill=#78716c
    柱 4（80-84 分，n=31）: h=239, top=171, fill=#d97706（峰值強調）
    柱 5（85-89 分，n=18）: h=139, top=271, fill=#78716c
    柱 6（90分+，n=6）:     h=46,  top=364, fill=#a8a29e
  -->

  <!-- 柱 1：60-69 分，n=8 -->
  <rect x="90" y="348" width="111" height="62" fill="#c4bfb8"/>
  <!-- 數值標籤 text_y = top - 8 = 340 -->
  <text x="145" y="340" font-size="16" fill="#a8a29e" text-anchor="middle" font-weight="600">8</text>

  <!-- 柱 2：70-74 分，n=15 -->
  <rect x="201" y="294" width="111" height="116" fill="#a8a29e"/>
  <text x="256" y="286" font-size="16" fill="#a8a29e" text-anchor="middle" font-weight="600">15</text>

  <!-- 柱 3：75-79 分，n=22 -->
  <rect x="312" y="240" width="111" height="170" fill="#78716c"/>
  <text x="367" y="232" font-size="16" fill="#78716c" text-anchor="middle" font-weight="600">22</text>

  <!-- 柱 4：80-84 分，n=31（峰值，琥珀色強調） -->
  <rect x="423" y="171" width="111" height="239" fill="#d97706"/>
  <text x="478" y="163" font-size="18" fill="#d97706" text-anchor="middle" font-weight="700">31</text>
  <!-- 峰值 callout -->
  <rect x="424" y="148" width="112" height="26" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="480" y="166" font-size="14" fill="#d97706" text-anchor="middle" font-weight="600">最多集中</text>

  <!-- 柱 5：85-89 分，n=18 -->
  <rect x="534" y="271" width="111" height="139" fill="#78716c"/>
  <text x="589" y="263" font-size="16" fill="#78716c" text-anchor="middle" font-weight="600">18</text>

  <!-- 柱 6：90分+，n=6 -->
  <rect x="645" y="364" width="111" height="46" fill="#a8a29e"/>
  <text x="700" y="356" font-size="16" fill="#a8a29e" text-anchor="middle" font-weight="600">6</text>

  <!-- 柱子外框邊線（白色分隔線，讓相鄰柱有界線感）-->
  <line x1="201" y1="171" x2="201" y2="410" stroke="white" stroke-width="2"/>
  <line x1="312" y1="171" x2="312" y2="410" stroke="white" stroke-width="2"/>
  <line x1="423" y1="171" x2="423" y2="410" stroke="white" stroke-width="2"/>
  <line x1="534" y1="171" x2="534" y2="410" stroke="white" stroke-width="2"/>
  <line x1="645" y1="171" x2="645" y2="410" stroke="white" stroke-width="2"/>

  <!-- X 軸得分分段標籤（y=428，中心對齊各柱）-->
  <text x="145" y="428" font-size="14" fill="#57534e" text-anchor="middle">60-69</text>
  <text x="256" y="428" font-size="14" fill="#57534e" text-anchor="middle">70-74</text>
  <text x="367" y="428" font-size="14" fill="#57534e" text-anchor="middle">75-79</text>
  <text x="478" y="428" font-size="14" fill="#d97706" text-anchor="middle" font-weight="700">80-84</text>
  <text x="589" y="428" font-size="14" fill="#57534e" text-anchor="middle">85-89</text>
  <text x="700" y="428" font-size="14" fill="#57534e" text-anchor="middle">90 分+</text>

  <!-- X 軸標題 -->
  <text x="423" y="455" font-size="14" fill="#a8a29e" text-anchor="middle">評鑑得分分佈</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
