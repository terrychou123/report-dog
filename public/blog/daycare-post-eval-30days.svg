<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"
     font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">黃金 30 天 4 大改善面向</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">分面向分工，讓改善執行有條不紊</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- 左上卡片（#d97706，x=40, y=104, w=346, h=168）-->
  <rect x="40" y="104" width="346" height="168" rx="12" fill="white"/>
  <rect x="40" y="104" width="346" height="44" rx="12" fill="#d97706"/>
  <rect x="40" y="128" width="346" height="20" fill="#d97706"/>
  <circle cx="68" cy="126" r="9" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
  <circle cx="68" cy="126" r="3" fill="white"/>
  <text x="213" y="143" text-anchor="middle" font-size="15" fill="white" font-weight="700">文件補強</text>
  <text x="60" y="172" font-size="14" fill="#57534e">• 補齊評鑑中被要求的缺失文件</text>
  <text x="60" y="192" font-size="14" fill="#57534e">• 更新表單格式符合最新規定</text>
  <text x="60" y="212" font-size="14" fill="#57534e">• 整理個案文件確保完整性</text>
  <text x="60" y="232" font-size="14" fill="#57534e">• 製作文件索引便於後續查閱</text>
  <rect x="56" y="246" width="70" height="20" rx="10" fill="#fef3c7"/>
  <text x="91" y="260" text-anchor="middle" font-size="14" fill="#d97706" font-weight="600">文件作業</text>

  <!-- 右上卡片（#78716c，x=414, y=104, w=346, h=168）-->
  <rect x="414" y="104" width="346" height="168" rx="12" fill="white"/>
  <rect x="414" y="104" width="346" height="44" rx="12" fill="#78716c"/>
  <rect x="414" y="128" width="346" height="20" fill="#78716c"/>
  <rect x="438" y="117" width="18" height="18" rx="3" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
  <line x1="441" y1="126" x2="453" y2="126" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
  <text x="587" y="143" text-anchor="middle" font-size="15" fill="white" font-weight="700">人員訓練</text>
  <text x="434" y="172" font-size="14" fill="#57534e">• 針對評鑑缺失加強在職訓練</text>
  <text x="434" y="192" font-size="14" fill="#57534e">• 辦理訪談應對模擬演練</text>
  <text x="434" y="212" font-size="14" fill="#57534e">• 確認人員了解各自職責規範</text>
  <text x="434" y="232" font-size="14" fill="#57534e">• 補足缺少的訓練紀錄文件</text>
  <rect x="430" y="246" width="70" height="20" rx="10" fill="#f5f5f4"/>
  <text x="465" y="260" text-anchor="middle" font-size="14" fill="#78716c" font-weight="600">人員訓練</text>

  <!-- 左下卡片（#57534e，x=40, y=288, w=346, h=162）-->
  <rect x="40" y="288" width="346" height="162" rx="12" fill="white"/>
  <rect x="40" y="288" width="346" height="44" rx="12" fill="#57534e"/>
  <rect x="40" y="312" width="346" height="20" fill="#57534e"/>
  <line x1="60" y1="309" x2="68" y2="317" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-linecap="round"/>
  <line x1="68" y1="317" x2="84" y2="301" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-linecap="round"/>
  <text x="213" y="327" text-anchor="middle" font-size="15" fill="white" font-weight="700">環境設備</text>
  <text x="60" y="356" font-size="14" fill="#57534e">• 修繕有缺失的高齡友善設施</text>
  <text x="60" y="376" font-size="14" fill="#57534e">• 補充安全設備與急救物品</text>
  <text x="60" y="396" font-size="14" fill="#57534e">• 廚房留樣設備與流程確認</text>
  <text x="60" y="416" font-size="14" fill="#57534e">• 定期環境安全巡查機制建立</text>
  <rect x="56" y="430" width="70" height="20" rx="10" fill="#f5f0eb"/>
  <text x="91" y="444" text-anchor="middle" font-size="14" fill="#57534e" font-weight="600">環境改善</text>

  <!-- 右下卡片（#a8a29e，x=414, y=288, w=346, h=162）-->
  <rect x="414" y="288" width="346" height="162" rx="12" fill="white"/>
  <rect x="414" y="288" width="346" height="44" rx="12" fill="#a8a29e"/>
  <rect x="414" y="312" width="346" height="20" fill="#a8a29e"/>
  <circle cx="440" cy="310" r="8" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
  <line x1="440" y1="302" x2="440" y2="307" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
  <circle cx="440" cy="314" r="2" fill="rgba(255,255,255,0.7)"/>
  <text x="587" y="327" text-anchor="middle" font-size="15" fill="white" font-weight="700">制度建立</text>
  <text x="434" y="356" font-size="14" fill="#57534e">• 新增或修訂缺失的服務流程</text>
  <text x="434" y="376" font-size="14" fill="#57534e">• 建立品管指標月度追蹤制度</text>
  <text x="434" y="396" font-size="14" fill="#57534e">• 訂定督導與查核機制頻率</text>
  <text x="434" y="416" font-size="14" fill="#57534e">• 確認制度規範書面化並公告</text>
  <rect x="430" y="430" width="70" height="20" rx="10" fill="#f5f5f4"/>
  <text x="465" y="444" text-anchor="middle" font-size="14" fill="#a8a29e" font-weight="600">制度規範</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
