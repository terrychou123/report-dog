<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#059669"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
    <linearGradient id="axisGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="480" fill="#f8fafc"/>

  <!-- 標題區 -->
  <rect x="0" y="0" width="800" height="60" fill="url(#headerGrad)"/>
  <text x="32" y="22" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="rgba(255,255,255,0.85)">評鑑結束後</text>
  <text x="32" y="46" font-family="'Noto Sans TC', sans-serif" font-size="20" fill="white" font-weight="700">評鑑後 30 天行動計畫</text>

  <!-- 水平時間軸 -->
  <line x1="60" y1="290" x2="760" y2="290" stroke="#e2e8f0" stroke-width="2"/>
  <!-- 軸線漸層覆蓋 -->
  <rect x="60" y="288" width="700" height="4" rx="2" fill="url(#axisGrad)" opacity="0.4"/>

  <!-- ===== 第1週 ===== -->
  <!-- 節點 -->
  <circle cx="110" cy="290" r="18" fill="#10b981" stroke="white" stroke-width="3"/>
  <text x="110" y="295" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="10" fill="white" font-weight="700">D1</text>

  <!-- 上方卡片 -->
  <rect x="42" y="88" width="136" height="176" rx="12" fill="white" stroke="#a7f3d0" stroke-width="1.5"/>
  <rect x="42" y="88" width="136" height="40" rx="12" fill="#10b981"/>
  <rect x="42" y="112" width="136" height="16" fill="#10b981"/>
  <text x="110" y="113" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="white" font-weight="700">第 1 週</text>

  <!-- 連接線 -->
  <line x1="110" y1="264" x2="110" y2="128" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,3"/>

  <text x="110" y="152" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#1e293b" font-weight="600">蒐集委員意見</text>
  <text x="110" y="170" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#1e293b" font-weight="600">整理缺失清單</text>

  <rect x="56" y="184" width="108" height="22" rx="6" fill="#f0fdf4"/>
  <text x="110" y="199" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="10" fill="#065f46">評鑑報告取得</text>
  <rect x="56" y="210" width="108" height="22" rx="6" fill="#f0fdf4"/>
  <text x="110" y="225" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="10" fill="#065f46">缺失條次整理</text>
  <rect x="56" y="236" width="108" height="22" rx="6" fill="#f0fdf4"/>
  <text x="110" y="251" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="10" fill="#065f46">主任召開說明會</text>

  <!-- ===== 第2週 ===== -->
  <circle cx="310" cy="290" r="18" fill="#0ea5e9" stroke="white" stroke-width="3"/>
  <text x="310" y="295" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="10" fill="white" font-weight="700">D8</text>

  <rect x="242" y="88" width="136" height="176" rx="12" fill="white" stroke="#bae6fd" stroke-width="1.5"/>
  <rect x="242" y="88" width="136" height="40" rx="12" fill="#0ea5e9"/>
  <rect x="242" y="112" width="136" height="16" fill="#0ea5e9"/>
  <text x="310" y="113" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="white" font-weight="700">第 2 週</text>

  <line x1="310" y1="264" x2="310" y2="128" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="4,3"/>

  <text x="310" y="152" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#1e293b" font-weight="600">分派負責人員</text>
  <text x="310" y="170" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#1e293b" font-weight="600">制定改善期限</text>

  <rect x="256" y="184" width="108" height="22" rx="6" fill="#f0f9ff"/>
  <text x="310" y="199" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="10" fill="#0369a1">各缺失分配負責</text>
  <rect x="256" y="210" width="108" height="22" rx="6" fill="#f0f9ff"/>
  <text x="310" y="225" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="10" fill="#0369a1">訂出完成時間表</text>
  <rect x="256" y="236" width="108" height="22" rx="6" fill="#f0f9ff"/>
  <text x="310" y="251" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="10" fill="#0369a1">所需資源確認</text>

  <!-- ===== 第2-4週 ===== -->
  <circle cx="530" cy="290" r="18" fill="#f59e0b" stroke="white" stroke-width="3"/>
  <text x="530" y="295" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="9" fill="white" font-weight="700">D14</text>

  <rect x="460" y="88" width="138" height="176" rx="12" fill="white" stroke="#fde68a" stroke-width="1.5"/>
  <rect x="460" y="88" width="138" height="40" rx="12" fill="#f59e0b"/>
  <rect x="460" y="112" width="138" height="16" fill="#f59e0b"/>
  <text x="529" y="113" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="white" font-weight="700">第 2–4 週</text>

  <line x1="530" y1="264" x2="530" y2="128" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3"/>

  <text x="529" y="152" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#1e293b" font-weight="600">執行改善措施</text>
  <text x="529" y="170" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#1e293b" font-weight="600">建立追蹤機制</text>

  <rect x="474" y="184" width="110" height="22" rx="6" fill="#fffbeb"/>
  <text x="529" y="199" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="10" fill="#92400e">逐項改善落實</text>
  <rect x="474" y="210" width="110" height="22" rx="6" fill="#fffbeb"/>
  <text x="529" y="225" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="10" fill="#92400e">每週進度回報</text>
  <rect x="474" y="236" width="110" height="22" rx="6" fill="#fffbeb"/>
  <text x="529" y="251" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="10" fill="#92400e">建立追蹤表格</text>

  <!-- ===== 第30天 ===== -->
  <circle cx="720" cy="290" r="22" fill="#ef4444" stroke="white" stroke-width="3"/>
  <text x="720" y="286" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="9" fill="white" font-weight="700">第30</text>
  <text x="720" y="298" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="9" fill="white" font-weight="700">天</text>

  <rect x="650" y="88" width="130" height="176" rx="12" fill="white" stroke="#fecaca" stroke-width="1.5"/>
  <rect x="650" y="88" width="130" height="40" rx="12" fill="#ef4444"/>
  <rect x="650" y="112" width="130" height="16" fill="#ef4444"/>
  <text x="715" y="113" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="white" font-weight="700">第 30 天</text>

  <line x1="720" y1="264" x2="720" y2="128" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,3"/>

  <text x="715" y="152" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#1e293b" font-weight="600">確認改善成效</text>
  <text x="715" y="170" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#1e293b" font-weight="600">更新 SOP 文件</text>

  <rect x="664" y="184" width="102" height="22" rx="6" fill="#fff1f2"/>
  <text x="715" y="199" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="10" fill="#991b1b">改善成效驗收</text>
  <rect x="664" y="210" width="102" height="22" rx="6" fill="#fff1f2"/>
  <text x="715" y="225" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="10" fill="#991b1b">SOP 文件更新</text>
  <rect x="664" y="236" width="102" height="22" rx="6" fill="#fff1f2"/>
  <text x="715" y="251" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="10" fill="#991b1b">存檔備查</text>

  <!-- 時間軸刻度 -->
  <text x="110" y="325" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#64748b">Day 1</text>
  <text x="310" y="325" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#64748b">Day 8</text>
  <text x="530" y="325" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#64748b">Day 14</text>
  <text x="720" y="325" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#64748b">Day 30</text>

  <!-- 底部 -->
  <rect x="0" y="440" width="800" height="40" fill="#f1f5f9"/>
  <!-- 圖例 -->
  <circle cx="80" cy="460" r="6" fill="#10b981"/>
  <text x="94" y="464" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#64748b">蒐集反饋</text>
  <circle cx="200" cy="460" r="6" fill="#0ea5e9"/>
  <text x="214" y="464" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#64748b">分派負責</text>
  <circle cx="320" cy="460" r="6" fill="#f59e0b"/>
  <text x="334" y="464" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#64748b">執行改善</text>
  <circle cx="440" cy="460" r="6" fill="#ef4444"/>
  <text x="454" y="464" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#64748b">驗收存檔</text>
  <text x="680" y="464" text-anchor="end" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#94a3b8">報告汪製作</text>
</svg>
