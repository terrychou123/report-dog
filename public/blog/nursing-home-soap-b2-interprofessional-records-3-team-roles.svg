  <text x="100" y="208" font-size="16" fill="#57534e">主責 S/O/A/P 四段整合撰寫，負責 Barthel、Braden 量表評估</text>
  <rect x="620" y="168" width="136" height="46" rx="8" fill="#d97706" opacity="0.12"/>
