<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!--
    N=5 直列清單（兩層間距）
    H=60, inner_gap=13, outer_gap=29
    Header y=29, h=60, text_y=76
    Row[0] y=118, Row[1] y=191, Row[2] y=264, Row[3] y=337, Row[4] y=410
    PDCA 5 大常見填寫錯誤
  -->

  <!-- Header（y=29, h=60） -->
  <rect x="0" y="29" width="800" height="60" fill="#e8e6de"/>
  <rect x="0" y="29" width="6" height="60" fill="#d97706" rx="2"/>
  <text x="28" y="76" font-size="40" fill="#1e293b" font-weight="700">PDCA 5 大常見填寫錯誤</text>

  <!-- Row 0（y=118, #d97706 琥珀）P目標沒有量化 -->
  <rect x="28" y="118" width="744" height="60" rx="12" fill="#e8e6de"/>
  <rect x="28" y="118" width="6" height="60" rx="2" fill="#78716c"/>
  <circle cx="66" cy="148" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="154" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <text x="100" y="145" font-size="20" fill="#1e293b" font-weight="700">P 目標沒有量化</text>
  <text x="100" y="166" font-size="16" fill="#57534e">只寫「降低跌倒」，無具體數字或期限</text>
  <rect x="620" y="126" width="136" height="44" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="142" font-size="16" fill="#d97706" text-anchor="middle">錯誤1</text>
  <text x="688" y="162" font-size="16" fill="#d97706" text-anchor="middle">立即改正</text>

  <!-- Row 1（y=191, #78716c 暖灰）D措施無佐證 -->
  <rect x="28" y="191" width="744" height="60" rx="12" fill="#e8e6de"/>
  <rect x="28" y="191" width="6" height="60" rx="2" fill="#57534e"/>
  <circle cx="66" cy="221" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="227" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <text x="100" y="218" font-size="20" fill="#1e293b" font-weight="700">D 措施無佐證文件</text>
  <text x="100" y="239" font-size="16" fill="#57534e">訓練活動未留簽到表或施工前後照片</text>
  <rect x="620" y="199" width="136" height="44" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="215" font-size="16" fill="#78716c" text-anchor="middle">錯誤2</text>
  <text x="688" y="235" font-size="16" fill="#78716c" text-anchor="middle">立即改正</text>

  <!-- Row 2（y=264, #57534e 深棕）C只有總數 -->
  <rect x="28" y="264" width="744" height="60" rx="12" fill="#e8e6de"/>
  <rect x="28" y="264" width="6" height="60" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="294" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="300" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <text x="100" y="291" font-size="20" fill="#1e293b" font-weight="700">C 只有總數無月別趨勢</text>
  <text x="100" y="312" font-size="16" fill="#57534e">缺乏月別圖表，委員無法比對達標情形</text>
  <rect x="620" y="272" width="136" height="44" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="288" font-size="16" fill="#57534e" text-anchor="middle">錯誤3</text>
  <text x="688" y="308" font-size="16" fill="#57534e" text-anchor="middle">立即改正</text>

  <!-- Row 3（y=337, #a8a29e 淺灰）A只寫繼續執行 -->
  <rect x="28" y="337" width="744" height="60" rx="12" fill="#e8e6de"/>
  <rect x="28" y="337" width="6" height="60" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="367" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="373" font-size="16" fill="#a8a29e" text-anchor="middle" font-weight="900">4</text>
  <text x="100" y="364" font-size="20" fill="#1e293b" font-weight="700">A 只寫「繼續執行」</text>
  <text x="100" y="385" font-size="16" fill="#57534e">未說明標準化方向或納入下一輪改善計畫</text>
  <rect x="620" y="345" width="136" height="44" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="361" font-size="16" fill="#a8a29e" text-anchor="middle">錯誤4</text>
  <text x="688" y="381" font-size="16" fill="#a8a29e" text-anchor="middle">立即改正</text>

  <!-- Row 4（y=410, #94a3b8 藍灰）根因停在表面 -->
  <rect x="28" y="410" width="744" height="60" rx="12" fill="#e8e6de"/>
  <rect x="28" y="410" width="6" height="60" rx="2" fill="#6b7280"/>
  <circle cx="66" cy="440" r="16" fill="#94a3b8" opacity="0.15"/>
  <text x="66" y="446" font-size="16" fill="#94a3b8" text-anchor="middle" font-weight="900">5</text>
  <text x="100" y="437" font-size="20" fill="#1e293b" font-weight="700">根因分析停在表面現象</text>
  <text x="100" y="458" font-size="16" fill="#57534e">寫「地板太滑」未追問制度或系統根本原因</text>
  <rect x="620" y="418" width="136" height="44" rx="8" fill="#94a3b8" opacity="0.12"/>
  <text x="688" y="434" font-size="16" fill="#94a3b8" text-anchor="middle">錯誤5</text>
  <text x="688" y="454" font-size="16" fill="#94a3b8" text-anchor="middle">立即改正</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
