<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- @template: list-4 -->
  <rect width="800" height="500" fill="#f0efe8"/>
  <text x="400" y="48" text-anchor="middle" font-size="30" fill="#1e293b" font-weight="700">2.4 活動規劃 PDCA 循環四要素</text>
  <text x="400" y="78" text-anchor="middle" font-size="20" fill="#57534e">「妥善規劃並定期修正」——四個缺一不可的環節</text>
  <line x1="28" y1="94" x2="772" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- Row 1: Plan 規劃 (rowY=160, H=62) -->
  <rect x="28" y="160" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="160" width="6" height="62" rx="2" fill="#d97706"/>
  <circle cx="66" cy="191" r="18" fill="#d97706" opacity="0.15"/>
  <!-- text_y = 160+31+22*0.35=198.7≈199 -->
  <text x="66" y="199" font-size="22" fill="#d97706" text-anchor="middle" font-weight="900">P</text>
  <text x="100" y="180" font-size="22" fill="#1e293b" font-weight="700">PLAN 規劃 ─ 月度計畫書事前準備</text>
  <text x="100" y="204" font-size="16" fill="#57534e">活動前完成月度計畫書，載明活動目標、分工、所需資源，才算「妥善規劃」</text>
  <!-- S-box: y=160+8=168, rectH=46 -->
  <rect x="620" y="168" width="136" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="186" font-size="15" fill="#d97706" text-anchor="middle">月度計畫書</text>
  <text x="688" y="204" font-size="15" fill="#d97706" text-anchor="middle">事前完成</text>

  <!-- Row 2: Do 執行 (rowY=235, H=62) -->
  <rect x="28" y="235" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="235" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="66" cy="266" r="18" fill="#78716c" opacity="0.15"/>
  <!-- text_y = 235+31+7.7=273.7≈274 -->
  <text x="66" y="274" font-size="22" fill="#78716c" text-anchor="middle" font-weight="900">D</text>
  <text x="100" y="255" font-size="22" fill="#1e293b" font-weight="700">DO 執行 ─ 依計畫辦理並記錄參與</text>
  <text x="100" y="279" font-size="16" fill="#57534e">依計畫書執行活動，同步記錄出席人數、參與情形，留存活動照片或出席紀錄</text>
  <!-- S-box: y=235+8=243 -->
  <rect x="620" y="243" width="136" height="46" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="261" font-size="15" fill="#78716c" text-anchor="middle">出席紀錄</text>
  <text x="688" y="279" font-size="15" fill="#78716c" text-anchor="middle">活動照片</text>

  <!-- Row 3: Check 查核 (rowY=310, H=62) -->
  <rect x="28" y="310" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="310" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="66" cy="341" r="18" fill="#57534e" opacity="0.15"/>
  <!-- text_y = 310+31+7.7=348.7≈349 -->
  <text x="66" y="349" font-size="22" fill="#57534e" text-anchor="middle" font-weight="900">C</text>
  <text x="100" y="330" font-size="22" fill="#1e293b" font-weight="700">CHECK 查核 ─ 月底收集服務對象回饋</text>
  <text x="100" y="354" font-size="16" fill="#57534e">月底辦理滿意度調查，收集服務對象回饋，確認活動是否達成原定目標</text>
  <!-- S-box: y=310+8=318 -->
  <rect x="620" y="318" width="136" height="46" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="336" font-size="15" fill="#57534e" text-anchor="middle">滿意度回饋</text>
  <text x="688" y="354" font-size="15" fill="#57534e" text-anchor="middle">月底完成</text>

  <!-- Row 4: Act 修正 (rowY=385, H=62) -->
  <rect x="28" y="385" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="385" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="416" r="18" fill="#a8a29e" opacity="0.15"/>
  <!-- text_y = 385+31+7.7=423.7≈424 -->
  <text x="66" y="424" font-size="22" fill="#a8a29e" text-anchor="middle" font-weight="900">A</text>
  <text x="100" y="405" font-size="22" fill="#1e293b" font-weight="700">ACT 修正 ─ 依回饋調整下月計畫書</text>
  <text x="100" y="429" font-size="16" fill="#57534e">依回饋修正下月計畫書，並在計畫書中載明修正原因，體現「定期修正」的 PDCA 精神</text>
  <!-- S-box: y=385+8=393 -->
  <rect x="620" y="393" width="136" height="46" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="411" font-size="15" fill="#a8a29e" text-anchor="middle">修正說明</text>
  <text x="688" y="429" font-size="15" fill="#a8a29e" text-anchor="middle">列於計畫書</text>

  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
