<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>

  <!-- 左側裝飾色塊 -->
  <rect x="0" y="0" width="8" height="630" fill="#d97706"/>

  <!-- 主標題第1行：黑色 -->
  <text x="80" y="175" font-size="100" font-weight="900" fill="#1e293b" >AI 輔助</text>

  <!-- 主標題第2行：琥珀色 -->
  <text x="80" y="290" font-size="100" font-weight="900" fill="#d97706" >評鑑文書撰寫</text>

  <!-- 副標題 -->
  <text x="80" y="360" font-size="38" fill="#57534e" >5 大應用場景，長照機構文書效率提升 50% 以上</text>

  <!-- Pills 標籤列 -->
  <!-- pill 1 -->
  <rect x="80" y="400" width="190" height="44" rx="22" fill="#d97706" opacity="0.15"/>
  <text x="175" y="428" font-size="20" fill="#d97706" font-weight="700"  text-anchor="middle">個案計畫自動</text>

  <!-- pill 2 -->
  <rect x="284" y="400" width="160" height="44" rx="22" fill="#d97706" opacity="0.15"/>
  <text x="364" y="428" font-size="20" fill="#d97706" font-weight="700"  text-anchor="middle">PDCA生成</text>

  <!-- pill 3 -->
  <rect x="458" y="400" width="148" height="44" rx="22" fill="#d97706" opacity="0.15"/>
  <text x="532" y="428" font-size="20" fill="#d97706" font-weight="700"  text-anchor="middle">自我查核</text>

  <!-- pill 4 -->
  <rect x="620" y="400" width="120" height="44" rx="22" fill="#d97706" opacity="0.15"/>
  <text x="680" y="428" font-size="20" fill="#d97706" font-weight="700"  text-anchor="middle">報告汪</text>

  <!-- 右側裝飾大數字 -->
  <text x="920" y="290" font-size="160" font-weight="900" fill="#d97706"  text-anchor="middle">50%</text>
  <text x="920" y="350" font-size="36" fill="#57534e"  text-anchor="middle">效率提升</text>

  <!-- 裝飾線條 -->
  <line x1="80" y1="475" x2="760" y2="475" stroke="#d97706" stroke-width="2" opacity="0.3"/>

  <!-- 底部說明 -->
  <text x="80" y="520" font-size="26" fill="#78716c" >115年度老人福利機構評鑑 ✦ B2 個案計畫 ✦ B13–B19 七大監測</text>

  <!-- 浮水印 -->
  <text x="1140" y="590" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400" >報告汪 reportwang.com</text>
</svg>
