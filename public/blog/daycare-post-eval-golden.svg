<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="450" fill="#f0efe8"/>
  <text x="400" y="46" font-size="21" font-weight="700" fill="#1e293b" text-anchor="middle">評鑑結束後：黃金 30 天行動總覽</text>
  <rect x="60" y="58" width="48" height="3" rx="1.5" fill="#d97706"/>
  <line x1="116" y1="59.5" x2="740" y2="59.5" stroke="#dedad3" stroke-width="1"/>

  <!-- Alert -->
  <rect x="52" y="78" width="696" height="38" rx="8" fill="#d97706" opacity="0.10"/>
  <rect x="52" y="78" width="4" height="38" rx="2" fill="#d97706"/>
  <text x="72" y="101" font-size="13" fill="#92400e">評鑑結束不代表結束，黃金 30 天是展現機構真正管理力的關鍵時刻</text>

  <!-- Timeline: 4 phases -->
  <!-- Phase 1: 48hr -->
  <rect x="52" y="134" width="152" height="248" rx="12" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="52" y="134" width="152" height="5" rx="2.5" fill="#d97706"/>
  <text x="128" y="160" font-size="13" fill="#d97706" text-anchor="middle" font-weight="700">48 小時內</text>
  <circle cx="128" cy="198" r="26" fill="#d97706" opacity="0.10"/>
  <text x="128" y="196" font-size="13" fill="#d97706" text-anchor="middle" font-weight="700">48</text>
  <text x="128" y="212" font-size="10" fill="#d97706" text-anchor="middle">小時</text>
  <line x1="68" y1="234" x2="188" y2="234" stroke="#f0ede6" stroke-width="1"/>
  <text x="68" y="254" font-size="12" fill="#64748b">▸ 記錄委員反饋</text>
  <text x="68" y="272" font-size="12" fill="#64748b">▸ 分類缺失等級</text>
  <text x="68" y="290" font-size="12" fill="#64748b">▸ A類/B類/C類</text>
  <text x="68" y="308" font-size="12" fill="#64748b">▸ 確認通報義務</text>
  <rect x="68" y="338" width="116" height="28" rx="6" fill="#d97706" opacity="0.10"/>
  <text x="126" y="356" font-size="12" fill="#d97706" text-anchor="middle" font-weight="600">最緊急</text>
  <text x="68" y="368" font-size="11" fill="#94a3b8">A類需立即處理</text>

  <!-- Arrow 1 -->
  <text x="220" y="260" font-size="22" fill="#d97706" text-anchor="middle">→</text>

  <!-- Phase 2: Week 1 -->
  <rect x="236" y="134" width="152" height="248" rx="12" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="236" y="134" width="152" height="5" rx="2.5" fill="#a8a29e"/>
  <text x="312" y="160" font-size="13" fill="#78716c" text-anchor="middle" font-weight="700">第 1 週</text>
  <circle cx="312" cy="198" r="26" fill="#a8a29e" opacity="0.12"/>
  <text x="312" y="196" font-size="20" fill="#78716c" text-anchor="middle" font-weight="700">W1</text>
  <line x1="252" y1="234" x2="372" y2="234" stroke="#f0ede6" stroke-width="1"/>
  <text x="252" y="254" font-size="12" fill="#64748b">▸ 召開改善會議</text>
  <text x="252" y="272" font-size="12" fill="#64748b">▸ 填改善計畫表</text>
  <text x="252" y="290" font-size="12" fill="#64748b">▸ 分配改善任務</text>
  <text x="252" y="308" font-size="12" fill="#64748b">▸ 設定完成期限</text>
  <rect x="252" y="338" width="116" height="28" rx="6" fill="#a8a29e" opacity="0.12"/>
  <text x="310" y="356" font-size="12" fill="#78716c" text-anchor="middle" font-weight="600">組織動員</text>
  <text x="252" y="368" font-size="11" fill="#94a3b8">全員知悉缺失</text>

  <!-- Arrow 2 -->
  <text x="404" y="260" font-size="22" fill="#d97706" text-anchor="middle">→</text>

  <!-- Phase 3: Week 2-4 -->
  <rect x="420" y="134" width="152" height="248" rx="12" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="420" y="134" width="152" height="5" rx="2.5" fill="#78716c"/>
  <text x="496" y="160" font-size="13" fill="#78716c" text-anchor="middle" font-weight="700">第 2–4 週</text>
  <circle cx="496" cy="198" r="26" fill="#78716c" opacity="0.10"/>
  <text x="496" y="196" font-size="20" fill="#78716c" text-anchor="middle" font-weight="700">W4</text>
  <line x1="436" y1="234" x2="556" y2="234" stroke="#f0ede6" stroke-width="1"/>
  <text x="436" y="254" font-size="12" fill="#64748b">▸ 快速改善B/C類</text>
  <text x="436" y="272" font-size="12" fill="#64748b">▸ 建立基礎文件</text>
  <text x="436" y="290" font-size="12" fill="#64748b">▸ SOP 修訂更新</text>
  <text x="436" y="308" font-size="12" fill="#64748b">▸ 持續追蹤進度</text>
  <rect x="436" y="338" width="116" height="28" rx="6" fill="#78716c" opacity="0.10"/>
  <text x="494" y="356" font-size="12" fill="#78716c" text-anchor="middle" font-weight="600">快速改善</text>
  <text x="436" y="368" font-size="11" fill="#94a3b8">見效最快的時段</text>

  <!-- Arrow 3 -->
  <text x="588" y="260" font-size="22" fill="#d97706" text-anchor="middle">→</text>

  <!-- Phase 4: Day 30 -->
  <rect x="604" y="134" width="144" height="248" rx="12" fill="#d97706" opacity="0.06"/>
  <rect x="604" y="134" width="144" height="248" rx="12" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.4"/>
  <rect x="604" y="134" width="144" height="5" rx="2.5" fill="#d97706" opacity="0.7"/>
  <text x="676" y="160" font-size="13" fill="#d97706" text-anchor="middle" font-weight="700">第 30 天</text>
  <circle cx="676" cy="198" r="26" fill="#d97706" opacity="0.12"/>
  <text x="676" y="196" font-size="17" fill="#d97706" text-anchor="middle" font-weight="700">30</text>
  <text x="676" y="210" font-size="10" fill="#d97706" text-anchor="middle">天</text>
  <line x1="620" y1="234" x2="732" y2="234" stroke="#f0ede6" stroke-width="1"/>
  <text x="620" y="254" font-size="12" fill="#64748b">▸ 確認A類改善</text>
  <text x="620" y="272" font-size="12" fill="#64748b">▸ 更新所有SOP</text>
  <text x="620" y="290" font-size="12" fill="#64748b">▸ 完善文件台帳</text>
  <text x="620" y="308" font-size="12" fill="#64748b">▸ 繳交改善報告</text>
  <rect x="620" y="338" width="112" height="28" rx="6" fill="#d97706" opacity="0.12"/>
  <text x="676" y="356" font-size="12" fill="#d97706" text-anchor="middle" font-weight="600">完成改善</text>
  <text x="620" y="368" font-size="11" fill="#94a3b8">呈報主管機關</text>

  <text x="760" y="421" font-size="16" fill="#c4bfb8" text-anchor="end" font-weight="400" font-family="'Noto Sans TC', sans-serif">報告汪 reportwang.com</text>
</svg>
