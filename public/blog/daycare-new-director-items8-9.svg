<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="450" fill="#f0efe8"/>
  <text x="400" y="46" font-size="21" font-weight="700" fill="#1e293b" text-anchor="middle">第 8–9 件事：主任進修 ＋ 督導機制</text>
  <rect x="60" y="58" width="48" height="3" rx="1.5" fill="#d97706"/>
  <line x1="116" y1="59.5" x2="740" y2="59.5" stroke="#dedad3" stroke-width="1"/>

  <!-- Left: 第8件事 -->
  <rect x="52" y="82" width="336" height="316" rx="12" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="52" y="82" width="336" height="5" rx="2.5" fill="#d97706"/>
  <rect x="68" y="98" width="36" height="36" rx="8" fill="#d97706" opacity="0.15"/>
  <text x="86" y="123" font-size="20" font-weight="900" fill="#d97706" text-anchor="middle">8</text>
  <text x="208" y="118" font-size="15" font-weight="700" fill="#1e293b">主任自我提升管理力</text>
  <text x="208" y="136" font-size="12" fill="#57534e">第 31 條｜每年至少 4 小時</text>
  <line x1="68" y1="150" x2="372" y2="150" stroke="#f0ede6" stroke-width="1"/>
  <text x="72" y="172" font-size="13" font-weight="600" fill="#1e293b">進修方向選擇</text>
  <text x="72" y="194" font-size="12" fill="#57534e">→ 衛生局主任研習</text>
  <text x="72" y="214" font-size="12" fill="#57534e">→ 長照管理、組織行為</text>
  <text x="72" y="234" font-size="12" fill="#57534e">→ 優秀機構參訪交流</text>
  <line x1="68" y1="252" x2="372" y2="252" stroke="#f0ede6" stroke-width="1"/>
  <text x="72" y="274" font-size="13" font-weight="600" fill="#1e293b">評鑑要求提出</text>
  <rect x="68" y="284" width="304" height="52" rx="8" fill="#d97706" opacity="0.08"/>
  <text x="220" y="306" font-size="12" fill="#92400e" text-anchor="middle">機構的經營管理問題</text>
  <text x="220" y="326" font-size="12" fill="#92400e" text-anchor="middle">＋ 對應的解決策略</text>
  <text x="72" y="358" font-size="11" fill="#57534e">4小時訓練→整個團隊氛圍改變</text>

  <!-- Right: 第9件事 -->
  <rect x="412" y="82" width="336" height="316" rx="12" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="412" y="82" width="336" height="5" rx="2.5" fill="#78716c"/>
  <rect x="428" y="98" width="36" height="36" rx="8" fill="#78716c" opacity="0.15"/>
  <text x="446" y="123" font-size="20" font-weight="900" fill="#78716c" text-anchor="middle">9</text>
  <text x="568" y="118" font-size="15" font-weight="700" fill="#1e293b">建立督導機制</text>
  <text x="568" y="136" font-size="12" fill="#57534e">第 9 條｜適用所有服務人員</text>
  <line x1="428" y1="150" x2="732" y2="150" stroke="#f0ede6" stroke-width="1"/>

  <rect x="428" y="160" width="304" height="44" rx="8" fill="#d97706" opacity="0.08"/>
  <text x="580" y="180" font-size="13" fill="#d97706" text-anchor="middle" font-weight="700">個督：每半年至少 1 次</text>
  <text x="580" y="198" font-size="12" fill="#92400e" text-anchor="middle">照服員也適用</text>

  <rect x="428" y="212" width="304" height="44" rx="8" fill="#78716c" opacity="0.08"/>
  <text x="580" y="232" font-size="13" fill="#78716c" text-anchor="middle" font-weight="700">團督：每季至少 1 次</text>
  <text x="580" y="250" font-size="12" fill="#78716c" text-anchor="middle">可結合月行政會議</text>

  <line x1="428" y1="266" x2="732" y2="266" stroke="#f0ede6" stroke-width="1"/>
  <text x="432" y="288" font-size="13" font-weight="600" fill="#1e293b">督導追蹤表內容</text>
  <text x="432" y="308" font-size="12" fill="#57534e">□ 人員姓名 ＋ 督導頻率</text>
  <text x="432" y="328" font-size="12" fill="#57534e">□ 上次個督日期</text>
  <text x="432" y="348" font-size="12" fill="#57534e">□ 督導者 ＋ 被督導者簽名</text>
  <text x="432" y="368" font-size="11" fill="#d97706" font-weight="600">督導紀錄保存 7 年</text>

  <text x="760" y="421" font-size="16" fill="#c4bfb8" text-anchor="end" font-weight="400" font-family="'Noto Sans TC', sans-serif">報告汪 reportwang.com</text>
</svg>
