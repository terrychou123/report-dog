<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- @template: list-4 -->
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- Header -->
  <rect x="28" y="28" width="744" height="62" rx="10" fill="#57534e"/>
  <text x="400" y="53" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">生輔員必知核心文件一覽</text>
  <text x="400" y="78" font-size="15" fill="#dedad3" text-anchor="middle">新進人員三個月內必須掌握的關鍵紀錄格式</text>
  <!-- Row 1 -->
  <rect x="28" y="108" width="744" height="62" rx="8" fill="#ffffff"/>
  <rect x="28" y="108" width="6" height="62" rx="2" fill="#d97706"/>
  <circle cx="66" cy="121" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="127" font-size="14" fill="#d97706" text-anchor="middle" font-weight="700">01</text>
  <text x="94" y="126" font-size="16" fill="#1e293b" font-weight="600">交接班紀錄（項目 15）</text>
  <text x="94" y="150" font-size="14" fill="#57534e">每班次填寫個案生活動態、特殊事件、待交辦事項</text>
  <rect x="540" y="116" width="224" height="46" rx="8" fill="#fef3c7"/>
  <text x="652" y="135" font-size="14" fill="#d97706" text-anchor="middle" font-weight="600">每班必做</text>
  <text x="652" y="153" font-size="14" fill="#d97706" text-anchor="middle">主管機關查核</text>
  <!-- Row 2 -->
  <rect x="28" y="183" width="744" height="62" rx="8" fill="#ffffff"/>
  <rect x="28" y="183" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="66" cy="196" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="202" font-size="14" fill="#78716c" text-anchor="middle" font-weight="700">02</text>
  <text x="94" y="201" font-size="16" fill="#1e293b" font-weight="600">個案生活輔導紀錄（項目 22/18）</text>
  <text x="94" y="225" font-size="14" fill="#57534e">個案日常生活情況、輔導過程、行為觀察、目標追蹤</text>
  <rect x="540" y="191" width="224" height="46" rx="8" fill="#f5f5f4"/>
  <text x="652" y="210" font-size="14" fill="#78716c" text-anchor="middle" font-weight="600">定期撰寫</text>
  <text x="652" y="228" font-size="14" fill="#78716c" text-anchor="middle">評鑑委員重點查核</text>
  <!-- Row 3 -->
  <rect x="28" y="258" width="744" height="62" rx="8" fill="#ffffff"/>
  <rect x="28" y="258" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="66" cy="271" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="277" font-size="14" fill="#57534e" text-anchor="middle" font-weight="700">03</text>
  <text x="94" y="276" font-size="16" fill="#1e293b" font-weight="600">個案研討會出席紀錄（項目 28）</text>
  <text x="94" y="300" font-size="14" fill="#57534e">出席簽名、討論個案概況、討論結論與後續行動</text>
  <rect x="540" y="266" width="224" height="46" rx="8" fill="#f5f5f4"/>
  <text x="652" y="285" font-size="14" fill="#57534e" text-anchor="middle" font-weight="600">定期出席</text>
  <text x="652" y="303" font-size="14" fill="#57534e" text-anchor="middle">保留出席證明</text>
  <!-- Row 4 -->
  <rect x="28" y="333" width="744" height="62" rx="8" fill="#ffffff"/>
  <rect x="28" y="333" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="346" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="352" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">04</text>
  <text x="94" y="351" font-size="16" fill="#1e293b" font-weight="600">訓練進修紀錄（項目 5）</text>
  <text x="94" y="375" font-size="14" fill="#57534e">每年訓練時數、性侵害防治課程，需保留結業證書</text>
  <rect x="540" y="341" width="224" height="46" rx="8" fill="#f5f5f4"/>
  <text x="652" y="360" font-size="14" fill="#a8a29e" text-anchor="middle" font-weight="600">年度累積</text>
  <text x="652" y="378" font-size="14" fill="#a8a29e" text-anchor="middle">年度結束前確認</text>
  <!-- Watermark -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end">報告汪 reportwang.com</text>
</svg>
