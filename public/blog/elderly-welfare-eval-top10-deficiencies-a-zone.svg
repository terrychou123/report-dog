<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題 -->
  <text x="400" y="46" font-size="26" font-weight="700" fill="#1e293b" text-anchor="middle" font-family="Arial, sans-serif">A 區經營管理：3 大高頻行政缺失</text>
  <text x="400" y="76" font-size="16" fill="#57534e" text-anchor="middle" font-family="Arial, sans-serif">A2 入出管理 / A4 查核改善 / A13-14 訓練時數 — 行政文件最易被忽略</text>

  <!-- 列1：A2 -->
  <rect x="60" y="110" width="680" height="100" rx="10" fill="white"/>
  <rect x="60" y="110" width="6" height="100" rx="3" fill="#d97706"/>
  <circle cx="94" cy="160" r="16" fill="#d97706" opacity="0.15"/>
  <text x="94" y="166" font-size="16" fill="#d97706" text-anchor="middle" font-weight="700" font-family="Arial, sans-serif">A2</text>
  <text x="125" y="145" font-size="20" font-weight="700" fill="#1e293b" font-family="Arial, sans-serif">A2 入出機構管理違規（二級加強）</text>
  <text x="125" y="169" font-size="15" fill="#57534e" font-family="Arial, sans-serif">收費標準須公開於機構網站；近 4 年無違規收容紀錄</text>
  <text x="125" y="189" font-size="15" fill="#57534e" font-family="Arial, sans-serif">收容人數須符合許可床數；有專人辦理入出機構業務</text>
  <rect x="612" y="122" width="112" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="668" y="150" font-size="16" font-weight="700" fill="#d97706" text-anchor="middle" font-family="Arial, sans-serif">二級加強</text>

  <!-- 列2：A4 -->
  <rect x="60" y="228" width="680" height="100" rx="10" fill="white"/>
  <rect x="60" y="228" width="6" height="100" rx="3" fill="#78716c"/>
  <circle cx="94" cy="278" r="16" fill="#78716c" opacity="0.15"/>
  <text x="94" y="284" font-size="16" fill="#78716c" text-anchor="middle" font-weight="700" font-family="Arial, sans-serif">A4</text>
  <text x="125" y="263" font-size="20" font-weight="700" fill="#1e293b" font-family="Arial, sans-serif">A4 查核缺失改善率未達 100%（二級加強）</text>
  <text x="125" y="287" font-size="15" fill="#57534e" font-family="Arial, sans-serif">過去 4 年衛生、消防、建管、勞工等主管機關查核缺失</text>
  <text x="125" y="307" font-size="15" fill="#57534e" font-family="Arial, sans-serif">改善率須達 100%；過去 4 年無缺失者本項以 A 計分</text>
  <rect x="612" y="240" width="112" height="46" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="668" y="268" font-size="16" font-weight="700" fill="#78716c" text-anchor="middle" font-family="Arial, sans-serif">100% 達標</text>

  <!-- 列3：A13-A14 -->
  <rect x="60" y="346" width="680" height="100" rx="10" fill="white"/>
  <rect x="60" y="346" width="6" height="100" rx="3" fill="#57534e"/>
  <circle cx="94" cy="396" r="16" fill="#57534e" opacity="0.15"/>
  <text x="94" y="402" font-size="12" fill="#57534e" text-anchor="middle" font-weight="700" font-family="Arial, sans-serif">A13/14</text>
  <text x="125" y="381" font-size="20" font-weight="700" fill="#1e293b" font-family="Arial, sans-serif">A13-A14 訓練時數不足</text>
  <text x="125" y="405" font-size="15" fill="#57534e" font-family="Arial, sans-serif">A13 新進人員：到職 1 個月內完成 16 小時職前訓練（含感控 4H、勞安 2H）</text>
  <text x="125" y="425" font-size="15" fill="#57534e" font-family="Arial, sans-serif">A14 在職訓練：每人每年 20 小時；護理及照服員須有急救訓練有效證明</text>
  <rect x="612" y="358" width="112" height="46" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="668" y="386" font-size="16" font-weight="700" fill="#57534e" text-anchor="middle" font-family="Arial, sans-serif">16H / 20H</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" font-family="Arial, sans-serif">報告汪 reportwang.com</text>
</svg>
