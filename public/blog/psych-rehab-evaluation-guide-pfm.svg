<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- @template: custom -->
  <rect width="800" height="500" fill="#f0efe8"/>
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">PFM以病人為焦點查證</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">評鑑委員直接訪談學員/住民，日間型5項、住宿型7項</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- 左側：日間型PFM 5項 -->
  <rect x="40" y="108" width="346" height="330" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="40" y="108" width="346" height="40" rx="12" fill="#2563eb"/>
  <rect x="40" y="128" width="346" height="20" fill="#2563eb"/>
  <text x="213" y="135" text-anchor="middle" font-size="20" fill="white" font-weight="700">日間型 5項PFM</text>

  <text x="60" y="175" font-size="18" fill="#1e293b" font-weight="700">2.8</text>
  <text x="100" y="175" font-size="16" fill="#57534e">輔導規則就醫及藥物自我管理</text>
  <line x1="60" y1="188" x2="366" y2="188" stroke="#f0efe8" stroke-width="1"/>

  <text x="60" y="213" font-size="18" fill="#1e293b" font-weight="700">2.12</text>
  <text x="100" y="213" font-size="16" fill="#57534e">社區融合</text>
  <line x1="60" y1="226" x2="366" y2="226" stroke="#f0efe8" stroke-width="1"/>

  <text x="60" y="251" font-size="18" fill="#1e293b" font-weight="700">3.2</text>
  <text x="100" y="251" font-size="16" fill="#57534e">訂定適當收案標準</text>
  <line x1="60" y1="264" x2="366" y2="264" stroke="#f0efe8" stroke-width="1"/>

  <text x="60" y="289" font-size="18" fill="#1e293b" font-weight="700">3.5</text>
  <text x="100" y="289" font-size="16" fill="#57534e">適切的復健基金管理</text>
  <line x1="60" y1="302" x2="366" y2="302" stroke="#f0efe8" stroke-width="1"/>

  <text x="60" y="327" font-size="18" fill="#1e293b" font-weight="700">3.6</text>
  <text x="100" y="327" font-size="16" fill="#57534e">落實學員權益維護措施</text>

  <rect x="60" y="348" width="306" height="70" rx="8" fill="#eff6ff"/>
  <text x="213" y="370" text-anchor="middle" font-size="15" fill="#2563eb" font-weight="700">重要：學員無法接受訪談</text>
  <text x="213" y="390" text-anchor="middle" font-size="15" fill="#2563eb">（如拒絕、不在場）</text>
  <text x="213" y="410" text-anchor="middle" font-size="15" fill="#2563eb">直接評為「未達C等級」</text>

  <!-- 右側：住宿型PFM 7項 -->
  <rect x="414" y="108" width="346" height="330" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="414" y="108" width="346" height="40" rx="12" fill="#9333ea"/>
  <rect x="414" y="128" width="346" height="20" fill="#9333ea"/>
  <text x="587" y="135" text-anchor="middle" font-size="20" fill="white" font-weight="700">住宿型 7項PFM</text>

  <text x="434" y="163" font-size="16" fill="#57534e">（含日間型5項，另加以下2項）</text>

  <text x="434" y="191" font-size="18" fill="#1e293b" font-weight="700">3.7</text>
  <text x="474" y="191" font-size="16" fill="#57534e">維護住民財物自主管理</text>
  <line x1="434" y1="204" x2="740" y2="204" stroke="#f0efe8" stroke-width="1"/>

  <rect x="434" y="216" width="306" height="68" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="460" y="238" font-size="18" fill="#dc2626" font-weight="900">重3.11</text>
  <text x="544" y="238" font-size="16" fill="#dc2626" font-weight="700">維護住民出入自由</text>
  <text x="460" y="258" font-size="15" fill="#dc2626">未達C級 = 評鑑不合格</text>
  <text x="460" y="275" font-size="15" fill="#dc2626">開放式管理，不得限制出入</text>

  <rect x="434" y="300" width="306" height="118" rx="8" fill="#f0fdf4"/>
  <text x="587" y="324" text-anchor="middle" font-size="16" fill="#16a34a" font-weight="700">評鑑前PFM準備要點</text>
  <text x="454" y="350" font-size="15" fill="#1e293b">1. 讓學員/住民知道自己能自保藥物</text>
  <text x="454" y="372" font-size="15" fill="#1e293b">2. 說明申訴管道、權益保護措施</text>
  <text x="454" y="394" font-size="15" fill="#1e293b">3. 模擬訪談練習，讓學員有信心回答</text>

  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
