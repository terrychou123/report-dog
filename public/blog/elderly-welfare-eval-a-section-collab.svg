<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區塊 -->
  <rect x="0" y="0" width="800" height="76" fill="#1e293b"/>
  <text x="400" y="29"  font-size="14" fill="#94a3b8" text-anchor="middle" font-weight="400">報告汪 多人協作功能</text>
  <text x="400" y="57"  font-size="22" fill="white" text-anchor="middle" font-weight="700">A 區 15 項多人分工備審策略</text>

  <!-- N=4 版型: H=62, outer_gap=50, Row y: 160/235/310/385 -->

  <!-- Row 1: 行政組 -->
  <rect x="50" y="100" width="700" height="62" rx="8" fill="white"/>
  <rect x="50" y="100" width="6" height="62" rx="2" fill="#d97706"/>
  <circle cx="87" cy="131" r="16" fill="#d97706" opacity="0.15"/>
  <text x="87" y="137"  font-size="13" fill="white" text-anchor="middle" font-weight="700">行</text>
  <text x="118" y="125"  font-size="20" fill="#1e293b" font-weight="700">行政組負責</text>
  <text x="118" y="148"  font-size="16" fill="#57534e">A1工作手冊、A2入出機構辦法、A3業務計畫、A4缺失改善表、A5住民保護、A6危機管理</text>
  <rect x="556" y="108" width="136" height="46" rx="8" fill="#fef3c7" opacity="0.12"/>
  <text x="624" y="122"  font-size="14" fill="#92400e" text-anchor="middle" font-weight="600">9 項</text>
  <text x="624" y="140"  font-size="14" fill="#92400e" text-anchor="middle">A1–A6+訓練</text>

  <!-- Row 2: 社工組 -->
  <rect x="50" y="175" width="700" height="62" rx="8" fill="white"/>
  <rect x="50" y="175" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="87" cy="206" r="16" fill="#78716c" opacity="0.15"/>
  <text x="87" y="212"  font-size="13" fill="white" text-anchor="middle" font-weight="700">社</text>
  <text x="118" y="200"  font-size="20" fill="#1e293b" font-weight="700">社工組負責</text>
  <text x="118" y="223"  font-size="16" fill="#57534e">A8 社工人員名冊與資格文件、兼任社工報備同意書及合約</text>
  <rect x="556" y="183" width="136" height="46" rx="8" fill="#f5f5f4" opacity="0.12"/>
  <text x="624" y="197"  font-size="14" fill="#57534e" text-anchor="middle" font-weight="600">1 項</text>
  <text x="624" y="215"  font-size="14" fill="#57534e" text-anchor="middle">A8</text>

  <!-- Row 3: 護理組 -->
  <rect x="50" y="250" width="700" height="62" rx="8" fill="white"/>
  <rect x="50" y="250" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="87" cy="281" r="16" fill="#57534e" opacity="0.15"/>
  <text x="87" y="287"  font-size="13" fill="white" text-anchor="middle" font-weight="700">護</text>
  <text x="118" y="275"  font-size="20" fill="#1e293b" font-weight="700">護理組負責</text>
  <text x="118" y="298"  font-size="16" fill="#57534e">A9 護理排班表與執業登錄文件、A10 特約專業人員到勤紀錄</text>
  <rect x="556" y="258" width="136" height="46" rx="8" fill="#f5f5f4" opacity="0.12"/>
  <text x="624" y="272"  font-size="14" fill="#57534e" text-anchor="middle" font-weight="600">2 項</text>
  <text x="624" y="290"  font-size="14" fill="#57534e" text-anchor="middle">A9–A10</text>

  <!-- Row 4: 照服組 -->
  <rect x="50" y="325" width="700" height="62" rx="8" fill="white"/>
  <rect x="50" y="325" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="87" cy="356" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="87" y="362"  font-size="13" fill="white" text-anchor="middle" font-weight="700">照</text>
  <text x="118" y="350"  font-size="20" fill="#1e293b" font-weight="700">照服組負責</text>
  <text x="118" y="373"  font-size="16" fill="#57534e">A11 照服員名冊、外籍/本國籍比例計算表、隨時在班確認紀錄</text>
  <rect x="556" y="333" width="136" height="46" rx="8" fill="#f5f5f4" opacity="0.12"/>
  <text x="624" y="347"  font-size="14" fill="#57534e" text-anchor="middle" font-weight="600">1 項</text>
  <text x="624" y="365"  font-size="14" fill="#57534e" text-anchor="middle">A11</text>

  <!-- 底部說明 -->
  <rect x="50" y="404" width="700" height="52" rx="8" fill="#1e293b" opacity="0.9"/>
  <text x="400" y="425"  font-size="16" fill="white" text-anchor="middle" font-weight="700">報告汪多人協作 — 各組即時同步進度，主管一鍵掌握備審狀況</text>
  <text x="400" y="435"  font-size="15" fill="#94a3b8" text-anchor="middle">標籤功能分類管理文件 · 追蹤功能監控完成進度 · 多人同時編輯</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" >報告汪 reportwang.com</text>
</svg>
