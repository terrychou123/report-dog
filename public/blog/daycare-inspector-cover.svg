  <text x="1010" y="262" font-size="28" fill="#78716c" text-anchor="middle" font-weight="600">大審查方式</text>

  <!-- 右側時程條（3 條，各 80px，底部 y=538） -->
  <rect x="840" y="282" width="330" height="80" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="840" y="282" width="7" height="80" rx="3" fill="#d97706"/>
  <text x="862" y="309" font-size="28" fill="#d97706" font-weight="700">文件審閱</text>
  <text x="862" y="337" font-size="22" fill="#78716c">照顧計畫 · 督導紀錄 · 品管指標</text>

  <rect x="840" y="370" width="330" height="80" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="840" y="370" width="7" height="80" rx="3" fill="#78716c"/>
  <text x="862" y="397" font-size="28" fill="#78716c" font-weight="700">現場訪談</text>
  <text x="862" y="425" font-size="22" fill="#78716c">服務對象 · 家屬 · 工作人員</text>

  <rect x="840" y="458" width="330" height="80" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="840" y="458" width="7" height="80" rx="3" fill="#a8a29e"/>
  <text x="862" y="485" font-size="28" fill="#a8a29e" font-weight="700">環境查看</text>
  <text x="862" y="513" font-size="22" fill="#78716c">高齡友善 · 廚房衛生 · 急救設備</text>

  <!-- 左側主內容區 -->
  <text x="60" y="200" font-size="120" font-weight="900" fill="#1e293b">評鑑委員</text>
  <text x="60" y="338" font-size="120" font-weight="900" fill="#d97706">怎麼看你？</text>

  <line x1="60" y1="365" x2="780" y2="365" stroke="#dedad3" stroke-width="2"/>

  <text x="60" y="416" font-size="38" fill="#57534e" font-weight="400">文件 · 訪談 · 環境 · 現場視角大公開</text>

  <!-- 特色標籤列（pill 高 54px） -->
  <rect x="60" y="450" width="148" height="54" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="134" y="487" font-size="28" fill="#d97706" text-anchor="middle" font-weight="600">文件審閱</text>

  <rect x="220" y="450" width="148" height="54" rx="10" fill="#78716c" opacity="0.12"/>
  <text x="294" y="487" font-size="28" fill="#78716c" text-anchor="middle" font-weight="600">現場訪談</text>

  <rect x="380" y="450" width="148" height="54" rx="10" fill="#57534e" opacity="0.12"/>
  <text x="454" y="487" font-size="28" fill="#57534e" text-anchor="middle" font-weight="600">環境查看</text>

  <rect x="540" y="450" width="148" height="54" rx="10" fill="#a8a29e" opacity="0.18"/>
  <text x="614" y="487" font-size="28" fill="#78716c" text-anchor="middle" font-weight="600">評分邏輯</text>

