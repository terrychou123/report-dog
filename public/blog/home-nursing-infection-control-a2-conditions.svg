  <text x="100" y="188" font-size="22" fill="#1e293b" font-weight="700">感染管制手冊</text>
  <text x="100" y="208" font-size="16" fill="#57534e">依疾管署指引訂定，涵蓋傳染病、肺結核、疥瘡及手部衛生</text>
  <rect x="620" y="168" width="136" height="46" rx="8" fill="#d97706" opacity="0.12"/>
