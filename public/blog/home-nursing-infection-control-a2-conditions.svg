  <text x="100" y="263" font-size="22" fill="#1e293b" font-weight="700">流感疫苗接種率 ≥ 80%</text>
  <text x="100" y="283" font-size="16" fill="#57534e">【試評，本年度不計分】建議仍建立接種名冊供未來年度使用</text>
  <rect x="620" y="243" width="136" height="46" rx="8" fill="#78716c" opacity="0.12"/>
