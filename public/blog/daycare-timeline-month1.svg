<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="450" fill="#f0efe8"/>
  <text x="400" y="46" font-size="21" font-weight="700" fill="#1e293b" text-anchor="middle">評鑑前第 1 個月：最終衝刺 4 大任務</text>
  <rect x="60" y="58" width="48" height="3" rx="1.5" fill="#d97706"/>
  <line x1="116" y1="59.5" x2="740" y2="59.5" stroke="#dedad3" stroke-width="1"/>

  <!-- Month badge -->
  <rect x="52" y="78" width="120" height="52" rx="10" fill="#78716c" opacity="0.12"/>
  <text x="112" y="100" font-size="28" font-weight="900" fill="#78716c" text-anchor="middle">-1</text>
  <text x="112" y="120" font-size="13" fill="#78716c" text-anchor="middle">個月前</text>

  <text x="192" y="112" font-size="15" fill="#1e293b" font-weight="600">目標：模擬演練，確認萬無一失</text>

  <!-- Task 1 -->
  <rect x="52" y="152" width="335" height="120" rx="12" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="52" y="152" width="335" height="5" rx="2.5" fill="#d97706"/>
  <text x="76" y="180" font-size="15" fill="#1e293b" font-weight="700">任務一：模擬委員訪談</text>
  <text x="76" y="198" font-size="13" fill="#64748b">讓全員預先準備訪談問答</text>
  <text x="76" y="222" font-size="12" fill="#78716c">□ 準備常見訪談問題清單（30 題以上）</text>
  <text x="76" y="240" font-size="12" fill="#78716c">□ 分角色演練：個案/家屬/工作人員</text>
  <text x="76" y="258" font-size="12" fill="#78716c">□ 避免「統一口徑」，強調真實回應</text>

  <!-- Task 2 -->
  <rect x="413" y="152" width="335" height="120" rx="12" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="413" y="152" width="335" height="5" rx="2.5" fill="#78716c"/>
  <text x="437" y="180" font-size="15" fill="#1e293b" font-weight="700">任務二：全員宣導說明</text>
  <text x="437" y="198" font-size="13" fill="#64748b">讓每位員工知道評鑑當天怎麼做</text>
  <text x="437" y="222" font-size="12" fill="#78716c">□ 召開評鑑說明會（全員參與）</text>
  <text x="437" y="240" font-size="12" fill="#78716c">□ 發放評鑑注意事項一頁說明</text>
  <text x="437" y="258" font-size="12" fill="#78716c">□ 新進人員特別輔導說明</text>

  <!-- Task 3 -->
  <rect x="52" y="290" width="335" height="110" rx="12" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="52" y="290" width="335" height="5" rx="2.5" fill="#a8a29e"/>
  <text x="76" y="318" font-size="15" fill="#1e293b" font-weight="700">任務三：文件最終整備</text>
  <text x="76" y="336" font-size="13" fill="#64748b">建立文件分類索引，備查方便</text>
  <text x="76" y="358" font-size="12" fill="#78716c">□ 文件依評鑑大項分類夾存</text>
  <text x="76" y="376" font-size="12" fill="#78716c">□ 製作文件清單封面頁（含頁次）</text>

  <!-- Task 4 -->
  <rect x="413" y="290" width="335" height="110" rx="12" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="413" y="290" width="335" height="5" rx="2.5" fill="#d97706" opacity="0.6"/>
  <text x="437" y="318" font-size="15" fill="#1e293b" font-weight="700">任務四：環境最終清查</text>
  <text x="437" y="336" font-size="13" fill="#64748b">委員必看的環境細節確認</text>
  <text x="437" y="358" font-size="12" fill="#78716c">□ 消防逃生動線無雜物阻擋</text>
  <text x="437" y="376" font-size="12" fill="#78716c">□ 廚房/廁所清潔整齊如常</text>

  <text x="760" y="421" font-size="16" fill="#c4bfb8" text-anchor="end" font-weight="400" font-family="'Noto Sans TC', sans-serif">報告汪 reportwang.com</text>
</svg>
