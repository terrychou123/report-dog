<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- Header -->
  <rect x="0" y="29" width="800" height="60" fill="#e8e6de"/>
  <rect x="0" y="29" width="6" height="60" rx="2" fill="#d97706"/>
  <text x="28" y="74" font-size="28" fill="#1e293b" font-weight="700">1106 常見被扣分的四種情形</text>
  <!-- Row 1: y=118, H=62 -->
  <rect x="28" y="118" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1.5"/>
  <rect x="28" y="118" width="6" height="62" rx="2" fill="#d97706"/>
  <circle cx="66" cy="149" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="144" font-size="20" fill="#d97706" font-weight="700" text-anchor="middle">1</text>
  <text x="66" y="164" font-size="14" fill="#78716c" text-anchor="middle">計算錯誤</text>
  <text x="96" y="144" font-size="20" fill="#1e293b" font-weight="700">月均值計算錯誤</text>
  <text x="96" y="165" font-size="16" fill="#57534e">只計算近一年或當前月份人數，未使用三年 36 個月月均值計算法定需求</text>
  <rect x="620" y="126" width="136" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="146" font-size="14" fill="#d97706" font-weight="700" text-anchor="middle">三年月均值</text>
  <text x="688" y="165" font-size="14" fill="#d97706" text-anchor="middle">非當月人數</text>
  <!-- Row 2: y=191, H=62 -->
  <rect x="28" y="191" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1.5"/>
  <rect x="28" y="191" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="66" cy="222" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="217" font-size="20" fill="#78716c" font-weight="700" text-anchor="middle">2</text>
  <text x="66" y="237" font-size="14" fill="#78716c" text-anchor="middle">人員離職</text>
  <text x="96" y="217" font-size="20" fill="#1e293b" font-weight="700">人員不在職造成配置缺口</text>
  <text x="96" y="238" font-size="16" fill="#57534e">社工師或護理師已離職，替補人員未到位，造成某月份配置低於法定要求</text>
  <rect x="620" y="199" width="136" height="46" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="219" font-size="14" fill="#78716c" font-weight="700" text-anchor="middle">離職缺口</text>
  <text x="688" y="238" font-size="14" fill="#78716c" text-anchor="middle">補人要快</text>
  <!-- Row 3: y=264, H=62 -->
  <rect x="28" y="264" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1.5"/>
  <rect x="28" y="264" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="66" cy="295" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="290" font-size="20" fill="#57534e" font-weight="700" text-anchor="middle">3</text>
  <text x="66" y="310" font-size="14" fill="#78716c" text-anchor="middle">夜班空窗</text>
  <text x="96" y="290" font-size="20" fill="#1e293b" font-weight="700">夜班護理人員空窗</text>
  <text x="96" y="311" font-size="16" fill="#57534e">住宿型機構大夜班時段無護理人員在崗，屬高風險違規項目</text>
  <rect x="620" y="272" width="136" height="46" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="292" font-size="14" fill="#57534e" font-weight="700" text-anchor="middle">大夜班</text>
  <text x="688" y="311" font-size="14" fill="#57534e" text-anchor="middle">高風險違規</text>
  <!-- Row 4: y=337, H=62 -->
  <rect x="28" y="337" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1.5"/>
  <rect x="28" y="337" width="6" height="62" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="368" r="16" fill="#94a3b8" opacity="0.15"/>
  <text x="66" y="363" font-size="20" fill="#94a3b8" font-weight="700" text-anchor="middle">4</text>
  <text x="66" y="383" font-size="14" fill="#78716c" text-anchor="middle">超收問題</text>
  <text x="96" y="363" font-size="20" fill="#1e293b" font-weight="700">服務人數超收稀釋人力比例</text>
  <text x="96" y="384" font-size="16" fill="#57534e">實際服務人數超過核定許可床數，導致各類人力配置比例被稀釋</text>
  <rect x="620" y="345" width="136" height="46" rx="8" fill="#94a3b8" opacity="0.12"/>
  <text x="688" y="365" font-size="14" fill="#94a3b8" font-weight="700" text-anchor="middle">超收床數</text>
  <text x="688" y="384" font-size="14" fill="#94a3b8" text-anchor="middle">比例被稀釋</text>
  <!-- Watermark -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
