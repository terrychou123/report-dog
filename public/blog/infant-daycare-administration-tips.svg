<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- 主標題 -->
  <text x="400" y="48" font-size="24" fill="#1e293b" text-anchor="middle"  font-weight="900">行政管理 3 大得分關鍵</text>
  <!-- 副標 -->
  <text x="400" y="78" font-size="16" fill="#78716c" text-anchor="middle" >掌握這三點，行政管理穩拿高分</text>
  <!-- 分隔線 -->
  <line x1="80" y1="94" x2="720" y2="94" stroke="#e8e6de" stroke-width="2"/>
  <!-- Row 1 -->
  <rect x="60" y="130" width="680" height="88" rx="10" fill="white" stroke="#d97706" stroke-width="2"/>
  <rect x="60" y="130" width="10" height="88" rx="4" fill="#d97706"/>
  <text x="100" y="168" font-size="20" fill="#d97706"  font-weight="700">關鍵一：制度訂定要完整</text>
  <text x="100" y="198" font-size="14" fill="#57534e" >規章制度每項都需有書面版本，放置位置固定、人員知悉，委員詢問時能立即取出</text>
  <!-- Row 2 -->
  <rect x="60" y="255" width="680" height="88" rx="10" fill="white" stroke="#78716c" stroke-width="2"/>
  <rect x="60" y="255" width="10" height="88" rx="4" fill="#78716c"/>
  <text x="100" y="293" font-size="20" fill="#78716c"  font-weight="700">關鍵二：訓練紀錄要逐人核對</text>
  <text x="100" y="323" font-size="14" fill="#57534e" >在職訓練逐人建立時數清冊，托育人員 18 小時、廚工及行政人員 4 小時，缺少一人即扣分</text>
  <!-- Row 3 -->
  <rect x="60" y="380" width="680" height="88" rx="10" fill="white" stroke="#57534e" stroke-width="2"/>
  <rect x="60" y="380" width="10" height="88" rx="4" fill="#57534e"/>
  <text x="100" y="418" font-size="20" fill="#57534e"  font-weight="700">關鍵三：文件查得到</text>
  <text x="100" y="448" font-size="14" fill="#57534e" >委員通常在現場隨機翻查，文件分類標示清楚、正本影本分開，30 秒內找到任何資料</text>
  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" >報告汪 reportwang.com</text>
</svg>
