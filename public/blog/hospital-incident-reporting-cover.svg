<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', sans-serif">
  <rect width="1200" height="630" fill="#f0efe8"/>

  <!-- 右側裝飾區塊 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>

  <!-- 右側大字 RCA -->
  <text x="1010" y="278" text-anchor="middle" font-size="160" fill="#d97706" font-weight="900" opacity="0.85">RCA</text>
  <text x="1010" y="322" text-anchor="middle" font-size="24" fill="#78716c" font-weight="600">根本原因分析（Root Cause Analysis）</text>

  <!-- 右側資訊卡片 -->
  <rect x="840" y="354" width="320" height="52" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="1000" y="387" text-anchor="middle" font-size="24" fill="#d97706" font-weight="700">警示事件必須完整RCA</text>

  <rect x="840" y="416" width="320" height="52" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="1000" y="449" text-anchor="middle" font-size="24" fill="#78716c" font-weight="700">45天內完成，品質達標</text>

  <rect x="840" y="478" width="320" height="52" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="1000" y="511" text-anchor="middle" font-size="24" fill="#57534e" font-weight="700">3個月追蹤確認成效</text>

  <!-- 右側底部標籤 -->
  <rect x="840" y="540" width="320" height="46" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="1000" y="570" text-anchor="middle" font-size="24" fill="#d97706" font-weight="700">資料查核（必要條文）</text>

  <!-- 左側主標題 -->
  <text x="60" y="208" font-size="100" fill="#1e293b" font-weight="900">異常事件</text>
  <text x="60" y="320" font-size="90" fill="#d97706" font-weight="900">通報與RCA</text>

  <!-- 左側分隔線 -->
  <line x1="60" y1="350" x2="780" y2="350" stroke="#dedad3" stroke-width="2"/>

  <!-- 左側副標題 -->
  <text x="60" y="392" font-size="30" fill="#57534e">醫院評鑑2.2.3條文 × RCA品質達標的實戰攻略</text>

  <!-- 特色標籤列 -->
  <rect x="60" y="420" width="148" height="48" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="134" y="452" text-anchor="middle" font-size="24" fill="#d97706" font-weight="600">事件分類標準</text>

  <rect x="220" y="420" width="148" height="48" rx="10" fill="#78716c" opacity="0.12"/>
  <text x="294" y="452" text-anchor="middle" font-size="24" fill="#78716c" font-weight="600">RCA四步驟</text>

  <rect x="380" y="420" width="148" height="48" rx="10" fill="#57534e" opacity="0.12"/>
  <text x="454" y="452" text-anchor="middle" font-size="24" fill="#57534e" font-weight="600">魚骨圖分析</text>

  <rect x="540" y="420" width="148" height="48" rx="10" fill="#0d9488" opacity="0.12"/>
  <text x="614" y="452" text-anchor="middle" font-size="24" fill="#0d9488" font-weight="600">改善措施撰寫</text>

  <!-- 第二排標籤 -->
  <rect x="60" y="480" width="148" height="48" rx="10" fill="#16a34a" opacity="0.12"/>
  <text x="134" y="512" text-anchor="middle" font-size="24" fill="#16a34a" font-weight="600">3個月追蹤</text>

  <rect x="220" y="480" width="148" height="48" rx="10" fill="#4f46e5" opacity="0.12"/>
  <text x="294" y="512" text-anchor="middle" font-size="24" fill="#4f46e5" font-weight="600">通報系統設計</text>

  <rect x="380" y="480" width="148" height="48" rx="10" fill="#9333ea" opacity="0.12"/>
  <text x="454" y="512" text-anchor="middle" font-size="24" fill="#9333ea" font-weight="600">AI輔助撰寫</text>

  <!-- 適用對象 -->
  <text x="60" y="562" font-size="24" fill="#a8a29e">適用：醫院品管人員、護理主管、感染管制護理師</text>

  <!-- 浮水印 -->
  <text x="1140" y="612" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
