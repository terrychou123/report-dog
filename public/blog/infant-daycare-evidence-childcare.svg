<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- Header（y=38, h=90） -->
  <rect x="0" y="38" width="800" height="90" fill="white"/>
  <rect x="0" y="38" width="6" height="90" fill="#78716c" rx="2"/>
  <text x="28" y="95" font-size="36" fill="#1e293b" font-weight="700">托育活動佐證清單（指標 12-36）</text>

  <!-- Row 0（y=166）#d97706 琥珀 -->
  <rect x="28" y="166" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="166" width="6" height="90" rx="2" fill="#d97706"/>
  <circle cx="66" cy="211" r="20" fill="#d97706" opacity="0.15"/>
  <text x="66" y="217" font-size="18" fill="#d97706" text-anchor="middle" font-weight="900">A</text>
  <text x="100" y="200" font-size="26" fill="#1e293b" font-weight="700">關係建立與環境（指標 12-23）</text>
  <text x="100" y="224" font-size="16" fill="#57534e">必備文件：空間規劃平面圖、設施設備照片紀錄、玩教具安全規格書</text>
  <text x="100" y="244" font-size="14" fill="#d97706">提示：睡眠區照片須顯示床距 30 公分以上，照片標示量測日期</text>
  <rect x="620" y="185" width="136" height="52" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="201" font-size="16" fill="#d97706" text-anchor="middle">附照片</text>
  <text x="688" y="221" font-size="16" fill="#d97706" text-anchor="middle">最有說服力</text>

  <!-- Row 1（y=269）#78716c 暖灰 -->
  <rect x="28" y="269" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="269" width="6" height="90" rx="2" fill="#78716c"/>
  <circle cx="66" cy="314" r="20" fill="#78716c" opacity="0.15"/>
  <text x="66" y="320" font-size="18" fill="#78716c" text-anchor="middle" font-weight="900">B</text>
  <text x="100" y="303" font-size="26" fill="#1e293b" font-weight="700">活動實施（指標 24-33）</text>
  <text x="100" y="327" font-size="16" fill="#57534e">必備文件：月週課程計畫表、個別化課程觀察紀錄、活動照片（含日期）</text>
  <text x="100" y="347" font-size="14" fill="#78716c">提示：課程計畫需涵蓋不同發展領域（動作、認知、語言、社會），委員會抽查</text>
  <rect x="620" y="288" width="136" height="52" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="304" font-size="16" fill="#78716c" text-anchor="middle">課程計畫</text>
  <text x="688" y="324" font-size="16" fill="#78716c" text-anchor="middle">需有照片</text>

  <!-- Row 2（y=372）#57534e 深棕 -->
  <rect x="28" y="372" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="372" width="6" height="90" rx="2" fill="#57534e"/>
  <circle cx="66" cy="417" r="20" fill="#57534e" opacity="0.15"/>
  <text x="66" y="423" font-size="18" fill="#57534e" text-anchor="middle" font-weight="900">C</text>
  <text x="100" y="406" font-size="26" fill="#1e293b" font-weight="700">親師交流（指標 34-36）</text>
  <text x="100" y="430" font-size="16" fill="#57534e">必備文件：寶寶日誌範本與實例、親師溝通記錄、家長說明書與入托契約</text>
  <text x="100" y="450" font-size="14" fill="#57534e">提示：寶寶日誌需呈現個別幼兒觀察紀錄，僅記錄餵食量不符合規定</text>
  <rect x="620" y="391" width="136" height="52" rx="8" fill="#57534e" opacity="0.12"/>
