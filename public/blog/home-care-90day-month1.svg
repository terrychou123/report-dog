<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區塊 (N=5: y=29, h=60) -->
  <rect x="0" y="29" width="800" height="60" fill="white"/>
  <rect x="0" y="29" width="6" height="60" fill="#d97706" rx="2"/>
  <text x="28" y="76"  font-size="36" font-weight="700" fill="#1e293b">第 1 個月：奠定基礎</text>

  <!-- Row 1: y=118, 人力配置盤點 -->
  <rect x="28" y="118" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="118" width="6" height="60" rx="2" fill="#78716c"/>
  <circle cx="66" cy="148" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="154"  font-size="16" font-weight="900" text-anchor="middle" fill="#d97706">1</text>
  <text x="100" y="145"  font-size="22" font-weight="700" fill="#1e293b">人力配置盤點</text>
  <text x="100" y="165"  font-size="16" fill="#57534e">統計照服員數量與服務個案比例</text>
  <rect x="620" y="126" width="136" height="44" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="139"  font-size="16" text-anchor="middle" fill="#d97706">項目16</text>
  <text x="688" y="158"  font-size="16" text-anchor="middle" fill="#d97706">第1-4週</text>

  <!-- Row 2: y=191, 訓練計畫規劃 -->
  <rect x="28" y="191" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="191" width="6" height="60" rx="2" fill="#57534e"/>
  <circle cx="66" cy="221" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="227"  font-size="16" font-weight="900" text-anchor="middle" fill="#78716c">2</text>
  <text x="100" y="218"  font-size="22" font-weight="700" fill="#1e293b">訓練計畫規劃</text>
  <text x="100" y="238"  font-size="16" fill="#57534e">安排全年在職訓練課程與時數</text>
  <rect x="620" y="199" width="136" height="44" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="212"  font-size="16" text-anchor="middle" fill="#78716c">項目18</text>
  <text x="688" y="231"  font-size="16" text-anchor="middle" fill="#78716c">第1-4週</text>

  <!-- Row 3: y=264, 留任率統計 -->
  <rect x="28" y="264" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="264" width="6" height="60" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="294" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="300"  font-size="16" font-weight="900" text-anchor="middle" fill="#57534e">3</text>
  <text x="100" y="291"  font-size="22" font-weight="700" fill="#1e293b">留任率統計</text>
  <text x="100" y="311"  font-size="16" fill="#57534e">計算專任/兼任照服員留任情況</text>
  <rect x="620" y="272" width="136" height="44" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="285"  font-size="16" text-anchor="middle" fill="#57534e">項目23,24</text>
  <text x="688" y="304"  font-size="16" text-anchor="middle" fill="#57534e">第1-4週</text>

  <!-- Row 4: y=337, 個別計畫清查 -->
  <rect x="28" y="337" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="337" width="6" height="60" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="367" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="373"  font-size="16" font-weight="900" text-anchor="middle" fill="#a8a29e">4</text>
  <text x="100" y="364"  font-size="22" font-weight="700" fill="#1e293b">個別計畫清查</text>
  <text x="100" y="384"  font-size="16" fill="#57534e">盤點是否有超過6個月未更新的計畫</text>
  <rect x="620" y="345" width="136" height="44" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="358"  font-size="16" text-anchor="middle" fill="#a8a29e">項目6</text>
  <text x="688" y="377"  font-size="16" text-anchor="middle" fill="#a8a29e">第1-4週</text>

  <!-- Row 5: y=410, 紀錄格式確認 -->
  <rect x="28" y="410" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="410" width="6" height="60" rx="2" fill="#6b7280"/>
  <circle cx="66" cy="440" r="16" fill="#94a3b8" opacity="0.15"/>
  <text x="66" y="446"  font-size="16" font-weight="900" text-anchor="middle" fill="#94a3b8">5</text>
  <text x="100" y="437"  font-size="22" font-weight="700" fill="#1e293b">紀錄格式確認</text>
  <text x="100" y="457"  font-size="16" fill="#57534e">確認服務紀錄格式符合評鑑基準</text>
  <rect x="620" y="418" width="136" height="44" rx="8" fill="#94a3b8" opacity="0.12"/>
  <text x="688" y="431"  font-size="16" text-anchor="middle" fill="#94a3b8">項目13</text>
  <text x="688" y="450"  font-size="16" text-anchor="middle" fill="#94a3b8">第1-4週</text>

  <!-- 浮水印 -->
  <text x="760" y="492"  font-size="16" fill="#d97706" text-anchor="end">報告汪 reportwang.com</text>
</svg>
