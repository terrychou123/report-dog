<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題 -->
  <text x="400" y="48" text-anchor="middle" font-size="30" fill="#1e293b" font-weight="700">病人安全文化推動的四大要素</text>
  <text x="400" y="76" text-anchor="middle" font-size="20" fill="#57534e">2.2.2 評鑑委員查核的核心面向</text>
  <line x1="28" y1="92" x2="772" y2="92" stroke="#dedad3" stroke-width="1"/>

  <!-- 左上卡片：不責罰通報環境 (#d97706) x=28 y=100 w=364 h=180 -->
  <rect x="28" y="100" width="364" height="180" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="100" width="364" height="8" rx="4" fill="#d97706"/>
  <rect x="28" y="104" width="364" height="4" fill="#d97706"/>
  <circle cx="72" cy="165" r="26" fill="#fef3c7"/>
  <text x="72" y="159" text-anchor="middle" font-size="14" fill="#d97706" font-weight="700">要素</text>
  <text x="72" y="178" text-anchor="middle" font-size="20" fill="#d97706" font-weight="700">01</text>
  <text x="108" y="155" font-size="22" fill="#1e293b" font-weight="700">不責罰通報環境</text>
  <text x="108" y="181" font-size="16" fill="#57534e">鼓勵主動通報錯誤及不安全情境</text>
  <text x="108" y="201" font-size="16" fill="#57534e">訪談護理師是否有通報顧慮</text>
  <rect x="40" y="225" width="148" height="34" rx="17" fill="#fef3c7"/>
  <text x="114" y="247" text-anchor="middle" font-size="16" fill="#d97706" font-weight="600">最重視文化面向</text>

  <!-- 右上卡片：病安教育訓練 (#78716c) x=408 y=100 w=364 h=180 -->
  <rect x="408" y="100" width="364" height="180" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="408" y="100" width="364" height="8" rx="4" fill="#78716c"/>
  <rect x="408" y="104" width="364" height="4" fill="#78716c"/>
  <circle cx="452" cy="165" r="26" fill="#f5f5f4"/>
  <text x="452" y="159" text-anchor="middle" font-size="14" fill="#78716c" font-weight="700">要素</text>
  <text x="452" y="178" text-anchor="middle" font-size="20" fill="#78716c" font-weight="700">02</text>
  <text x="488" y="155" font-size="22" fill="#1e293b" font-weight="700">病安教育訓練</text>
  <text x="488" y="181" font-size="16" fill="#57534e">定期辦理，全體員工參與</text>
  <text x="488" y="201" font-size="16" fill="#57534e">需有完整訓練紀錄可查核</text>
  <rect x="420" y="225" width="148" height="34" rx="17" fill="#f5f5f4"/>
  <text x="494" y="247" text-anchor="middle" font-size="16" fill="#78716c" font-weight="600">年年辦、年年記錄</text>

  <!-- 左下卡片：衛福部病安目標 (#57534e) x=28 y=296 w=364 h=180 -->
  <rect x="28" y="296" width="364" height="180" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="296" width="364" height="8" rx="4" fill="#57534e"/>
  <rect x="28" y="300" width="364" height="4" fill="#57534e"/>
  <circle cx="72" cy="361" r="26" fill="#f5f0eb"/>
  <text x="72" y="355" text-anchor="middle" font-size="14" fill="#57534e" font-weight="700">要素</text>
  <text x="72" y="374" text-anchor="middle" font-size="20" fill="#57534e" font-weight="700">03</text>
  <text x="108" y="351" font-size="22" fill="#1e293b" font-weight="700">衛福部病安目標</text>
  <text x="108" y="377" font-size="16" fill="#57534e">對應年度衛福部公告目標</text>
  <text x="108" y="397" font-size="16" fill="#57534e">需有推動計畫及執行成效</text>
  <rect x="40" y="421" width="148" height="34" rx="17" fill="#f5f0eb"/>
  <text x="114" y="443" text-anchor="middle" font-size="16" fill="#57534e" font-weight="600">年度更新必確認</text>

  <!-- 右下卡片：病安委員會運作 (#a8a29e) x=408 y=296 w=364 h=180 -->
  <rect x="408" y="296" width="364" height="180" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="408" y="296" width="364" height="8" rx="4" fill="#a8a29e"/>
  <rect x="408" y="300" width="364" height="4" fill="#a8a29e"/>
  <circle cx="452" cy="361" r="26" fill="#f5f5f4"/>
  <text x="452" y="355" text-anchor="middle" font-size="14" fill="#a8a29e" font-weight="700">要素</text>
  <text x="452" y="374" text-anchor="middle" font-size="20" fill="#a8a29e" font-weight="700">04</text>
  <text x="488" y="351" font-size="22" fill="#1e293b" font-weight="700">病安委員會運作</text>
  <text x="488" y="377" font-size="16" fill="#57534e">定期召開會議並有記錄</text>
  <text x="488" y="397" font-size="16" fill="#57534e">決議事項需有後續追蹤</text>
  <rect x="420" y="421" width="148" height="34" rx="17" fill="#f5f5f4"/>
  <text x="494" y="443" text-anchor="middle" font-size="16" fill="#a8a29e" font-weight="600">制度化運作基礎</text>

  <!-- 浮水印 -->
  <text x="760" y="490" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
