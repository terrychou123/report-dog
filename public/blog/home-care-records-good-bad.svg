<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- Header 區塊 -->
  <rect x="0" y="50" width="800" height="76" fill="white"/>
  <!-- Header 左側色條 -->
  <rect x="0" y="50" width="6" height="76" fill="#d97706"/>
  <!-- Header 文字（11字，font-size=36） -->
  <text x="28" y="104" font-size="36" fill="#1e293b" font-weight="700" font-family="sans-serif">服務紀錄 NG vs OK 對比</text>

  <!-- Row 1 (y=160, color=#d97706) -->
  <rect x="28" y="160" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="160" width="6" height="62" rx="2" fill="#d97706"/>
  <circle cx="66" cy="191" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="197" font-size="16" font-weight="900" text-anchor="middle" fill="#d97706" font-family="sans-serif">1</text>
  <text x="100" y="188" font-size="22" fill="#1e293b" font-weight="700" font-family="sans-serif">NG：時間模糊</text>
  <text x="100" y="208" font-size="16" fill="#57534e" font-family="sans-serif">「下午幫個案洗澡」→ 未記開始/結束時間</text>
  <rect x="620" y="168" width="136" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="185" font-size="16" text-anchor="middle" fill="#d97706" font-weight="700" font-family="sans-serif">&#10060; 缺失</text>
  <text x="688" y="205" font-size="16" text-anchor="middle" fill="#d97706" font-family="sans-serif">時間格式</text>

  <!-- Row 2 (y=235, color=#78716c) -->
  <rect x="28" y="235" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="235" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="66" cy="266" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="272" font-size="16" font-weight="900" text-anchor="middle" fill="#78716c" font-family="sans-serif">2</text>
  <text x="100" y="263" font-size="22" fill="#1e293b" font-weight="700" font-family="sans-serif">OK：時間完整</text>
  <text x="100" y="283" font-size="16" fill="#57534e" font-family="sans-serif">「13:30–14:00 協助沐浴，個案配合良好」</text>
  <rect x="620" y="243" width="136" height="46" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="260" font-size="16" text-anchor="middle" fill="#78716c" font-weight="700" font-family="sans-serif">&#10003; 合格</text>
  <text x="688" y="280" font-size="16" text-anchor="middle" fill="#78716c" font-family="sans-serif">符合基準</text>

  <!-- Row 3 (y=310, color=#57534e) -->
  <rect x="28" y="310" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="310" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="66" cy="341" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="347" font-size="16" font-weight="900" text-anchor="middle" fill="#57534e" font-family="sans-serif">3</text>
  <text x="100" y="338" font-size="22" fill="#1e293b" font-weight="700" font-family="sans-serif">NG：未見簽名</text>
  <text x="100" y="358" font-size="16" fill="#57534e" font-family="sans-serif">紀錄表格填完，照服員欄位空白未簽名</text>
  <rect x="620" y="318" width="136" height="46" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="335" font-size="16" text-anchor="middle" fill="#57534e" font-weight="700" font-family="sans-serif">&#10060; 缺失</text>
  <text x="688" y="355" font-size="16" text-anchor="middle" fill="#57534e" font-family="sans-serif">簽名缺漏</text>

  <!-- Row 4 (y=385, color=#a8a29e) -->
  <rect x="28" y="385" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="385" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="416" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="422" font-size="16" font-weight="900" text-anchor="middle" fill="#a8a29e" font-family="sans-serif">4</text>
  <text x="100" y="413" font-size="22" fill="#1e293b" font-weight="700" font-family="sans-serif">OK：完整簽名</text>
  <text x="100" y="433" font-size="16" fill="#57534e" font-family="sans-serif">服務後照服員在紀錄表格上親筆簽名</text>
  <rect x="620" y="393" width="136" height="46" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="410" font-size="16" text-anchor="middle" fill="#a8a29e" font-weight="700" font-family="sans-serif">&#10003; 合格</text>
  <text x="688" y="430" font-size="16" text-anchor="middle" fill="#a8a29e" font-family="sans-serif">符合要求</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-family="sans-serif">報告汪 reportwang.com</text>
</svg>
