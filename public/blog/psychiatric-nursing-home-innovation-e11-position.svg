<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <rect x="0" y="38" width="800" height="90" fill="#e8e6de"/>
  <rect x="0" y="38" width="6" height="90" rx="2" fill="#d97706"/>
  <text x="28" y="98" font-size="36" fill="#1e293b" font-weight="700">E1.1 在評鑑架構中的位置與意義</text>
  <rect x="28" y="166" width="744" height="90" rx="12" fill="#e8e6de"/>
  <rect x="28" y="166" width="6" height="90" rx="2" fill="#d97706"/>
  <circle cx="66" cy="211" r="20" fill="#d97706" opacity="0.15"/>
  <text x="66" y="217" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">E</text>
  <text x="100" y="210" font-size="28" fill="#1e293b" font-weight="700">唯一的加分項目（E 面向只有 1 條）</text>
  <text x="100" y="234" font-size="18" fill="#57534e">A-D 面向 35 條是「基本要求」，E1.1 是「做出特色、值得學習」的加分</text>
  <rect x="620" y="185" width="136" height="52" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="205" font-size="16" fill="#d97706" text-anchor="middle">加分</text>
  <text x="688" y="225" font-size="16" fill="#d97706" text-anchor="middle">空間</text>
  <rect x="28" y="269" width="744" height="90" rx="12" fill="#e8e6de"/>
  <rect x="28" y="269" width="6" height="90" rx="2" fill="#78716c"/>
  <circle cx="66" cy="314" r="20" fill="#78716c" opacity="0.15"/>
  <text x="66" y="320" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">時機</text>
  <text x="100" y="313" font-size="28" fill="#1e293b" font-weight="700">評鑑前 1–2 年就要開始布局</text>
  <text x="100" y="337" font-size="18" fill="#57534e">創新措施需要計畫、執行和成效評估的完整脈絡，臨時準備不足</text>
  <rect x="620" y="288" width="136" height="52" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="308" font-size="16" fill="#78716c" text-anchor="middle">提前</text>
  <text x="688" y="328" font-size="16" fill="#78716c" text-anchor="middle">布局</text>
  <rect x="28" y="372" width="744" height="90" rx="12" fill="#e8e6de"/>
  <rect x="28" y="372" width="6" height="90" rx="2" fill="#57534e"/>
  <circle cx="66" cy="417" r="20" fill="#57534e" opacity="0.15"/>
  <text x="66" y="423" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">重點</text>
  <text x="100" y="416" font-size="28" fill="#1e293b" font-weight="700">委員最期待看到機構有獨特性</text>
  <text x="100" y="440" font-size="18" fill="#57534e">不是填寫表格，而是展示機構在精神照護上有自己的特色做法</text>
  <rect x="620" y="391" width="136" height="52" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="411" font-size="16" fill="#57534e" text-anchor="middle">特色</text>
  <text x="688" y="431" font-size="16" fill="#57534e" text-anchor="middle">展示</text>
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
