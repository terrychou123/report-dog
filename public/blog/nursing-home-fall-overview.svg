<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- 標題 -->
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">跌倒預防評鑑 3 大面向</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">B13 跌倒 ／ B14 壓損 ／ B16 約束</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- 左欄 B13 -->
  <rect x="40" y="114" width="225" height="340" rx="10" fill="#fff" stroke="#e5e3dc" stroke-width="1"/>
  <rect x="40" y="114" width="225" height="8" rx="4" fill="#d97706"/>
  <text x="152" y="150" text-anchor="middle" font-size="18" fill="#d97706" font-weight="700">B13 跌倒預防</text>
  <line x1="55" y1="162" x2="250" y2="162" stroke="#f3f0eb" stroke-width="1"/>
  <text x="55" y="184" font-size="14" fill="#57534e">訂有預防評估措施</text>
  <text x="55" y="206" font-size="14" fill="#57534e">訂有處理辦法及流程</text>
  <text x="55" y="228" font-size="14" fill="#57534e">發生跌倒案件逐案分析</text>
  <text x="55" y="250" font-size="14" fill="#57534e">有監測紀錄且完整</text>
  <rect x="55" y="270" width="195" height="36" rx="6" fill="#fef3c7"/>
  <text x="152" y="294" text-anchor="middle" font-size="14" fill="#92400e" font-weight="700">每半年定期分析</text>
  <text x="55" y="330" font-size="14" fill="#78716c">常見缺失：</text>
  <text x="55" y="350" font-size="14" fill="#78716c">逐案表單不完整</text>
  <text x="55" y="370" font-size="14" fill="#78716c">半年分析缺改善方案</text>
  <text x="55" y="390" font-size="14" fill="#78716c">環境原因未分析</text>
  <text x="55" y="436" font-size="14" fill="#d97706" font-weight="600">適用：長照/養護/失智</text>

  <!-- 中欄 B14 -->
  <rect x="288" y="114" width="225" height="340" rx="10" fill="#fff" stroke="#e5e3dc" stroke-width="1"/>
  <rect x="288" y="114" width="225" height="8" rx="4" fill="#78716c"/>
  <text x="400" y="150" text-anchor="middle" font-size="18" fill="#78716c" font-weight="700">B14 壓損預防</text>
  <line x1="303" y1="162" x2="498" y2="162" stroke="#f3f0eb" stroke-width="1"/>
  <text x="303" y="184" font-size="14" fill="#57534e">訂有壓損預防評估措施</text>
  <text x="303" y="206" font-size="14" fill="#57534e">訂有處理辦法及流程</text>
  <text x="303" y="228" font-size="14" fill="#57534e">發生壓損案件逐案分析</text>
  <text x="303" y="250" font-size="14" fill="#57534e">有監測紀錄且完整</text>
  <rect x="303" y="270" width="195" height="36" rx="6" fill="#fef3c7"/>
  <text x="400" y="294" text-anchor="middle" font-size="14" fill="#92400e" font-weight="700">每季定期分析（每3月）</text>
  <text x="303" y="330" font-size="14" fill="#78716c">常見缺失：</text>
  <text x="303" y="350" font-size="14" fill="#78716c">翻身紀錄不連續</text>
  <text x="303" y="370" font-size="14" fill="#78716c">每季分析不如期</text>
  <text x="303" y="390" font-size="14" fill="#78716c">入住評估未含壓損</text>
  <text x="303" y="436" font-size="14" fill="#78716c" font-weight="600">注意：安養機構不適用</text>

  <!-- 右欄 B16 -->
  <rect x="536" y="114" width="225" height="340" rx="10" fill="#fff" stroke="#e5e3dc" stroke-width="1"/>
  <rect x="536" y="114" width="225" height="8" rx="4" fill="#d97706"/>
  <text x="648" y="150" text-anchor="middle" font-size="18" fill="#d97706" font-weight="700">B16 約束管理</text>
  <line x1="551" y1="162" x2="746" y2="162" stroke="#f3f0eb" stroke-width="1"/>
  <text x="551" y="184" font-size="14" fill="#57534e">訂有約束處理辦法流程</text>
  <text x="551" y="206" font-size="14" fill="#57534e">須醫師診斷或護理專判</text>
  <text x="551" y="228" font-size="14" fill="#57534e">有個別化評估</text>
  <text x="551" y="250" font-size="14" fill="#57534e">約束過程隨時監測</text>
  <rect x="551" y="270" width="195" height="36" rx="6" fill="#fef3c7"/>
  <text x="648" y="294" text-anchor="middle" font-size="14" fill="#92400e" font-weight="700">同意書 3 個月有效期</text>
  <text x="551" y="330" font-size="14" fill="#78716c">常見缺失：</text>
  <text x="551" y="350" font-size="14" fill="#78716c">同意書逾 3 個月未更新</text>
  <text x="551" y="370" font-size="14" fill="#78716c">無醫師診斷佐證</text>
  <text x="551" y="390" font-size="14" fill="#78716c">每季分析未執行</text>
  <text x="551" y="436" font-size="14" fill="#d97706" font-weight="600">注意：安養機構不適用</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
