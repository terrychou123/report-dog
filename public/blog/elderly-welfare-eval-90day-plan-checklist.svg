<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- Header -->
  <rect x="30" y="30" width="740" height="60" rx="8" fill="#d97706"/>
  <text x="400" y="58" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="sans-serif">評鑑前最後衝刺：12 項必確認清單</text>
  <text x="400" y="82" font-size="14" fill="#fef3c7" text-anchor="middle" font-family="sans-serif">評鑑前 2 週完成核對，確保萬無一失</text>

  <!-- 左欄標題 -->
  <rect x="30" y="108" width="360" height="32" rx="4" fill="#1e293b"/>
  <text x="210" y="129" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="sans-serif">行政與人員管理</text>

  <!-- 右欄標題 -->
  <rect x="410" y="108" width="360" height="32" rx="4" fill="#1e293b"/>
  <text x="590" y="129" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="sans-serif">照護品質與環境設備</text>

  <!-- 左欄項目 1 -->
  <rect x="30" y="148" width="360" height="46" rx="4" fill="#ffffff"/>
  <rect x="30" y="148" width="5" height="46" rx="2" fill="#d97706"/>
  <text x="48" y="167" font-size="14" font-weight="700" fill="#1e293b" font-family="sans-serif">1. 業務負責人登錄與勞健保</text>
  <text x="48" y="185" font-size="13" fill="#57534e" font-family="sans-serif">A7：資格登錄、勞健保、勞退金提撥</text>

  <!-- 右欄項目 2 -->
  <rect x="410" y="148" width="360" height="46" rx="4" fill="#ffffff"/>
  <rect x="410" y="148" width="5" height="46" rx="2" fill="#78716c"/>
  <text x="428" y="167" font-size="14" font-weight="700" fill="#1e293b" font-family="sans-serif">2. 七大監測指標每季分析</text>
  <text x="428" y="185" font-size="13" fill="#57534e" font-family="sans-serif">B13-B19：每季有分析報告與改善方案</text>

  <!-- 左欄項目 3 -->
  <rect x="30" y="202" width="360" height="46" rx="4" fill="#ffffff"/>
  <rect x="30" y="202" width="5" height="46" rx="2" fill="#d97706"/>
  <text x="48" y="221" font-size="14" font-weight="700" fill="#1e293b" font-family="sans-serif">3. 在職訓練時數：每人 20 小時</text>
  <text x="48" y="239" font-size="13" fill="#57534e" font-family="sans-serif">A14：含急救訓練、感染管制、性別議題</text>

  <!-- 右欄項目 4 -->
  <rect x="410" y="202" width="360" height="46" rx="4" fill="#ffffff"/>
  <rect x="410" y="202" width="5" height="46" rx="2" fill="#78716c"/>
  <text x="428" y="221" font-size="14" font-weight="700" fill="#1e293b" font-family="sans-serif">4. 緊急廣播與逃生設備測試</text>
  <text x="428" y="239" font-size="13" fill="#57534e" font-family="sans-serif">C4/C9：設備正常、逃生動線清楚</text>

  <!-- 左欄項目 5 -->
  <rect x="30" y="256" width="360" height="46" rx="4" fill="#ffffff"/>
  <rect x="30" y="256" width="5" height="46" rx="2" fill="#d97706"/>
  <text x="48" y="275" font-size="14" font-weight="700" fill="#1e293b" font-family="sans-serif">5. 品質會議記錄完整（B1）</text>
  <text x="48" y="293" font-size="13" fill="#57534e" font-family="sans-serif">每季 1 次，決議追蹤紀錄、PDCA 閉環</text>

  <!-- 右欄項目 6 -->
  <rect x="410" y="256" width="360" height="46" rx="4" fill="#ffffff"/>
  <rect x="410" y="256" width="5" height="46" rx="2" fill="#78716c"/>
  <text x="428" y="275" font-size="14" font-weight="700" fill="#1e293b" font-family="sans-serif">6. 個案服務計畫每季更新</text>
  <text x="428" y="293" font-size="13" fill="#57534e" font-family="sans-serif">B2：至少每 3 個月重新評估並與家屬討論</text>

  <!-- 左欄項目 7 -->
  <rect x="30" y="310" width="360" height="46" rx="4" fill="#ffffff"/>
  <rect x="30" y="310" width="5" height="46" rx="2" fill="#57534e"/>
  <text x="48" y="329" font-size="14" font-weight="700" fill="#1e293b" font-family="sans-serif">7. 疫苗施打率達 80%</text>
  <text x="48" y="347" font-size="13" fill="#57534e" font-family="sans-serif">B24：工作人員與住民流感疫苗各達 80%</text>

  <!-- 右欄項目 8 -->
  <rect x="410" y="310" width="360" height="46" rx="4" fill="#ffffff"/>
  <rect x="410" y="310" width="5" height="46" rx="2" fill="#57534e"/>
  <text x="428" y="329" font-size="14" font-weight="700" fill="#1e293b" font-family="sans-serif">8. 翻身拍背每 2 小時紀錄</text>
  <text x="428" y="347" font-size="13" fill="#57534e" font-family="sans-serif">B26：臥床住民翻身擺位紀錄與實際相符</text>

  <!-- 左欄項目 9 -->
  <rect x="30" y="364" width="360" height="46" rx="4" fill="#ffffff"/>
  <rect x="30" y="364" width="5" height="46" rx="2" fill="#a8a29e"/>
  <text x="48" y="383" font-size="14" font-weight="700" fill="#1e293b" font-family="sans-serif">9. 過去 4 年查核缺失改善 100%</text>
  <text x="48" y="401" font-size="13" fill="#57534e" font-family="sans-serif">A4：衛生、消防、建管、勞工缺失全改善</text>

  <!-- 右欄項目 10 -->
  <rect x="410" y="364" width="360" height="46" rx="4" fill="#ffffff"/>
  <rect x="410" y="364" width="5" height="46" rx="2" fill="#a8a29e"/>
  <text x="428" y="383" font-size="14" font-weight="700" fill="#1e293b" font-family="sans-serif">10. 照顧服務員人數符合規定</text>
  <text x="428" y="401" font-size="13" fill="#57534e" font-family="sans-serif">A11：外籍看護不超過 1/2，本國籍隨時在班</text>

  <!-- 左欄項目 11 -->
  <rect x="30" y="418" width="360" height="46" rx="4" fill="#ffffff"/>
  <rect x="30" y="418" width="5" height="46" rx="2" fill="#94a3b8"/>
  <text x="48" y="437" font-size="14" font-weight="700" fill="#1e293b" font-family="sans-serif">11. 個案權益說明書完備（D 區）</text>
  <text x="48" y="455" font-size="13" fill="#57534e" font-family="sans-serif">服務契約、申訴機制、隱私保護均有簽署</text>

  <!-- 右欄項目 12 -->
  <rect x="410" y="418" width="360" height="46" rx="4" fill="#ffffff"/>
  <rect x="410" y="418" width="5" height="46" rx="2" fill="#94a3b8"/>
  <text x="428" y="437" font-size="14" font-weight="700" fill="#1e293b" font-family="sans-serif">12. 防疫 SOP 與儲備物資確認</text>
  <text x="428" y="455" font-size="13" fill="#57534e" font-family="sans-serif">B10：感染管制手冊更新、口罩手套有效期限</text>

  <!-- 浮水印 -->
  <text x="760" y="492" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" font-family="sans-serif">報告汪 reportwang.com</text>
</svg>
