<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 右側裝飾區塊 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>

  <!-- 右側裝飾大數字（15 項基準） -->
  <text x="1010" y="220" font-size="168" font-weight="900" fill="#d97706" text-anchor="middle" opacity="0.88">15</text>
  <text x="1010" y="262" font-size="26" fill="#78716c" text-anchor="middle" font-weight="600">項評鑑基準逐條拆解</text>

  <!-- 右側 2×2 資訊卡片 -->
  <rect x="840" y="292" width="155" height="86" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="918" y="329" font-size="26" fill="#d97706" text-anchor="middle" font-weight="700">A 區 5 項</text>
  <text x="918" y="360" font-size="20" fill="#a8a29e" text-anchor="middle">行政管理</text>

  <rect x="1005" y="292" width="155" height="86" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="1083" y="329" font-size="26" fill="#16a34a" text-anchor="middle" font-weight="700">B 區 3 項</text>
  <text x="1083" y="360" font-size="20" fill="#a8a29e" text-anchor="middle">專業服務</text>

  <rect x="840" y="388" width="155" height="86" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="918" y="425" font-size="26" fill="#2563eb" text-anchor="middle" font-weight="700">C 區 4 項</text>
  <text x="918" y="456" font-size="20" fill="#a8a29e" text-anchor="middle">消防安全</text>

  <rect x="1005" y="388" width="155" height="86" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="1083" y="425" font-size="26" fill="#7c3aed" text-anchor="middle" font-weight="700">D 區 3 項</text>
  <text x="1083" y="456" font-size="20" fill="#a8a29e" text-anchor="middle">特別事項</text>

  <!-- 右側底部標籤 -->
  <rect x="840" y="484" width="320" height="50" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="1000" y="515" font-size="24" fill="#d97706" text-anchor="middle" font-weight="700">含常見失分點 · 完整自查清單</text>

  <!-- 左側主標題 -->
  <text x="60" y="190" font-size="100" font-weight="900" fill="#1e293b">一般護理之家</text>
  <text x="60" y="310" font-size="100" font-weight="900" fill="#d97706">評鑑15題全攻略</text>

  <line x1="60" y1="340" x2="790" y2="340" stroke="#dedad3" stroke-width="2"/>

  <text x="60" y="390" font-size="34" fill="#57534e" font-weight="400">115 年度 · 四大區塊逐條解析 · 準備秘笈</text>

  <!-- 特色標籤列 -->
  <rect x="60" y="422" width="148" height="52" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="134" y="454" font-size="26" fill="#d97706" text-anchor="middle" font-weight="600">A 行政管理</text>

  <rect x="218" y="422" width="148" height="52" rx="10" fill="#16a34a" opacity="0.12"/>
  <text x="292" y="454" font-size="26" fill="#16a34a" text-anchor="middle" font-weight="600">B 專業服務</text>

  <rect x="376" y="422" width="148" height="52" rx="10" fill="#2563eb" opacity="0.12"/>
  <text x="450" y="454" font-size="26" fill="#2563eb" text-anchor="middle" font-weight="600">C 消防安全</text>

  <rect x="534" y="422" width="148" height="52" rx="10" fill="#7c3aed" opacity="0.12"/>
  <text x="608" y="454" font-size="26" fill="#7c3aed" text-anchor="middle" font-weight="600">D 特別事項</text>

  <!-- 適用對象 -->
  <text x="60" y="546" font-size="26" fill="#94a3b8">適用對象：一般護理之家負責人 · 護理長 · 護理師 · 品管人員</text>

  <!-- 浮水印 -->
  <text x="1140" y="590" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
