<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', sans-serif">
  <!-- @template: cover -->
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 右側裝飾區塊 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>
  <!-- 右側大數字 7 -->
  <text x="1010" y="260" font-size="200" fill="#d97706" text-anchor="middle" font-weight="700" opacity="0.85">7</text>
  <!-- 項目說明 -->
  <text x="1010" y="320" font-size="24" fill="#57534e" text-anchor="middle">住宿型 PFM 項目數</text>
  <!-- 日間/住宿對比 -->
  <rect x="858" y="360" width="130" height="54" rx="8" fill="#0d9488" opacity="0.12"/>
  <text x="923" y="379" font-size="20" fill="#0d9488" text-anchor="middle" font-weight="700">日間型</text>
  <text x="923" y="410" font-size="22" fill="#0d9488" text-anchor="middle" font-weight="700">5 項</text>
  <rect x="1002" y="360" width="150" height="54" rx="8" fill="#9333ea" opacity="0.12"/>
  <text x="1077" y="379" font-size="20" fill="#9333ea" text-anchor="middle" font-weight="700">住宿型</text>
  <text x="1077" y="410" font-size="22" fill="#9333ea" text-anchor="middle" font-weight="700">7 項</text>
  <text x="1010" y="475" font-size="20" fill="#57534e" text-anchor="middle">評鑑委員直接訪談</text>
  <text x="1010" y="500" font-size="20" fill="#57534e" text-anchor="middle">學員 ‧ 住民</text>
  <!-- 左側主要內容 -->
  <!-- 類別標籤 -->
  <rect x="60" y="60" width="196" height="38" rx="19" fill="#d97706" opacity="0.12"/>
  <text x="158" y="85" font-size="18" fill="#d97706" text-anchor="middle" font-weight="700">以病人為焦點查證</text>
  <!-- 主標題 -->
  <text x="60" y="180" font-size="78" fill="#1e293b" font-weight="700">PFM</text>
  <text x="60" y="275" font-size="78" fill="#d97706" font-weight="700">訪談全攻略</text>
  <!-- 分隔線 -->
  <line x1="60" y1="305" x2="760" y2="305" stroke="#dedad3" stroke-width="2"/>
  <!-- 副標題 -->
  <text x="60" y="350" font-size="28" fill="#57534e">從評鑑委員視角逐一解析</text>
  <text x="60" y="390" font-size="26" fill="#57534e">每項提問邏輯與達標判斷標準</text>
  <!-- 標籤 Pills -->
  <rect x="60" y="440" width="148" height="36" rx="18" fill="#d97706" opacity="0.12"/>
  <text x="134" y="463" font-size="16" fill="#d97706" text-anchor="middle" font-weight="600">日間型5項</text>
  <rect x="222" y="440" width="148" height="36" rx="18" fill="#9333ea" opacity="0.12"/>
  <text x="296" y="463" font-size="16" fill="#9333ea" text-anchor="middle" font-weight="600">住宿型7項</text>
  <rect x="384" y="440" width="130" height="36" rx="18" fill="#d97706" opacity="0.12"/>
  <text x="449" y="463" font-size="16" fill="#d97706" text-anchor="middle" font-weight="600">60天準備</text>
  <rect x="528" y="440" width="148" height="36" rx="18" fill="#78716c" opacity="0.12"/>
  <text x="602" y="463" font-size="16" fill="#78716c" text-anchor="middle" font-weight="600">115年度評鑑</text>
  <!-- 浮水印 -->
  <text x="1140" y="590" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
