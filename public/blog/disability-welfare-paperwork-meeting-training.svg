<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- Header -->
  <rect x="0" y="29" width="800" height="60" fill="#e8e6de"/>
  <rect x="0" y="29" width="6" height="60" rx="2" fill="#d97706"/>
  <text x="28" y="74" font-size="28" fill="#1e293b" font-weight="700">管理會議與訓練時數記錄四要點</text>
  <!-- Row 1: y=118, H=62 -->
  <rect x="28" y="118" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1.5"/>
  <rect x="28" y="118" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="66" cy="149" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="144" font-size="20" fill="#d97706" font-weight="700" text-anchor="middle">1</text>
  <text x="66" y="164" font-size="14" fill="#78716c" text-anchor="middle">1102 會議</text>
  <text x="96" y="144" font-size="20" fill="#1e293b" font-weight="700">管理會議每 2 個月至少 1 次（1102）</text>
  <text x="96" y="165" font-size="16" fill="#57534e">紀錄需含：出席人員、會議主題、決議事項、執行期限與追蹤記錄</text>
  <rect x="620" y="126" width="136" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="146" font-size="14" fill="#d97706" font-weight="700" text-anchor="middle">1102 指標</text>
  <text x="688" y="165" font-size="14" fill="#d97706" text-anchor="middle">決議追蹤</text>
  <!-- Row 2: y=191, H=62 -->
  <rect x="28" y="191" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1.5"/>
  <rect x="28" y="191" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="66" cy="222" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="217" font-size="20" fill="#78716c" font-weight="700" text-anchor="middle">2</text>
  <text x="66" y="237" font-size="14" fill="#78716c" text-anchor="middle">1105 訓練</text>
  <text x="96" y="217" font-size="20" fill="#1e293b" font-weight="700">年度訓練時數需達 20 小時（1105）</text>
  <text x="96" y="238" font-size="16" fill="#57534e">含 4 小時應急管制 + 2 小時口腔照護，其餘依職類彈性規劃</text>
  <rect x="620" y="199" width="136" height="46" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="219" font-size="14" fill="#78716c" font-weight="700" text-anchor="middle">1105 指標</text>
  <text x="688" y="238" font-size="14" fill="#78716c" text-anchor="middle">20 小時</text>
  <!-- Row 3: y=264, H=62 -->
  <rect x="28" y="264" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1.5"/>
  <rect x="28" y="264" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="295" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="290" font-size="20" fill="#57534e" font-weight="700" text-anchor="middle">3</text>
  <text x="66" y="310" font-size="14" fill="#78716c" text-anchor="middle">AI 彙整</text>
  <text x="96" y="290" font-size="20" fill="#1e293b" font-weight="700">AI 批量統計每位人員訓練累積時數</text>
  <text x="96" y="311" font-size="16" fill="#57534e">輸入各場次訓練日期、時數、參加人員，AI 生成訓練時數彙整佐證表</text>
  <rect x="620" y="272" width="136" height="46" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="292" font-size="14" fill="#57534e" font-weight="700" text-anchor="middle">批量處理</text>
  <text x="688" y="311" font-size="14" fill="#57534e" text-anchor="middle">自動彙整</text>
  <!-- Row 4: y=337, H=62 -->
  <rect x="28" y="337" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1.5"/>
  <rect x="28" y="337" width="6" height="62" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="368" r="16" fill="#94a3b8" opacity="0.15"/>
  <text x="66" y="363" font-size="20" fill="#94a3b8" font-weight="700" text-anchor="middle">4</text>
  <text x="66" y="383" font-size="14" fill="#78716c" text-anchor="middle">達標提醒</text>
  <text x="96" y="363" font-size="20" fill="#1e293b" font-weight="700">未達標人員自動提示，備審前完成補強</text>
  <text x="96" y="384" font-size="16" fill="#57534e">AI 統計後標示未達標人員，評鑑備審前即時提示需補辦訓練場次</text>
  <rect x="620" y="345" width="136" height="46" rx="8" fill="#94a3b8" opacity="0.12"/>
  <text x="688" y="365" font-size="14" fill="#94a3b8" font-weight="700" text-anchor="middle">自動標示</text>
  <text x="688" y="384" font-size="14" fill="#94a3b8" text-anchor="middle">未達標者</text>
  <!-- Watermark -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
