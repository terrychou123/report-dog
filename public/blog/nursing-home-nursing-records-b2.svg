<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- 標題區 -->
  <text x="40" y="48" font-size="32" fill="#1e293b" font-weight="700">B2 個案服務計畫四個關鍵時間點</text>
  <text x="40" y="78" font-size="22" fill="#57534e">二級加強項目：委員必查的時間軸</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#d97706" stroke-width="2"/>

  <!-- 時間軸線 -->
  <line x1="80" y1="230" x2="720" y2="230" stroke="#d97706" stroke-width="3"/>

  <!-- 節點 1：入住 -->
  <circle cx="80" cy="230" r="16" fill="#d97706" opacity="0.15"/>
  <text x="80" y="236" font-size="14" fill="#d97706" font-weight="700" text-anchor="middle">入</text>

  <!-- 節點 2：72hr -->
  <circle cx="240" cy="230" r="20" fill="#d97706" opacity="0.15"/>
  <text x="240" y="225" font-size="14" fill="#d97706" font-weight="700" text-anchor="middle">72</text>
  <text x="240" y="240" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle">hr</text>

  <!-- 節點 3：3個月 -->
  <circle cx="420" cy="230" r="20" fill="#78716c" opacity="0.15"/>
  <text x="420" y="225" font-size="14" fill="#78716c" font-weight="700" text-anchor="middle">每3</text>
  <text x="420" y="240" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle">個月</text>

  <!-- 節點 4：半年 -->
  <circle cx="600" cy="230" r="20" fill="#57534e" opacity="0.15"/>
  <text x="600" y="225" font-size="14" fill="#57534e" font-weight="700" text-anchor="middle">每半</text>
  <text x="600" y="240" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle">年</text>

  <!-- 節點 5：需要時 -->
  <circle cx="720" cy="230" r="14" fill="#94a3b8" opacity="0.15"/>
  <text x="720" y="235" font-size="14" fill="#94a3b8" font-weight="700" text-anchor="middle">需要</text>

  <!-- 說明框 1：72hr -->
  <rect x="160" y="115" width="160" height="98" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <line x1="240" y1="213" x2="240" y2="210" stroke="#d97706" stroke-width="2"/>
  <text x="240" y="138" font-size="14" fill="#d97706" font-weight="700" text-anchor="middle">72小時初評</text>
  <text x="240" y="158" font-size="14" fill="#57534e" text-anchor="middle">跌倒風險量表</text>
  <text x="240" y="176" font-size="14" fill="#57534e" text-anchor="middle">Braden Scale</text>
  <text x="240" y="194" font-size="14" fill="#57534e" text-anchor="middle">MNA 營養評估</text>

  <!-- 說明框 2：3個月 -->
  <rect x="340" y="258" width="160" height="98" rx="8" fill="#eff6ff" stroke="#78716c" stroke-width="1.5"/>
  <line x1="420" y1="250" x2="420" y2="256" stroke="#78716c" stroke-width="2"/>
  <text x="420" y="280" font-size="14" fill="#57534e" font-weight="700" text-anchor="middle">每3個月評值</text>
  <text x="420" y="300" font-size="14" fill="#57534e" text-anchor="middle">身體心理社會</text>
  <text x="420" y="318" font-size="14" fill="#57534e" text-anchor="middle">認知活動功能</text>
  <text x="420" y="336" font-size="14" fill="#57534e" text-anchor="middle">含比較說明</text>

  <!-- 說明框 3：半年 -->
  <rect x="520" y="115" width="160" height="98" rx="8" fill="#f0fdf4" stroke="#57534e" stroke-width="1.5"/>
  <line x1="600" y1="213" x2="600" y2="210" stroke="#57534e" stroke-width="2"/>
  <text x="600" y="138" font-size="14" fill="#57534e" font-weight="700" text-anchor="middle">每半年修正</text>
  <text x="600" y="158" font-size="14" fill="#57534e" text-anchor="middle">依評值修正計畫</text>
  <text x="600" y="176" font-size="14" fill="#57534e" text-anchor="middle">與住民/家屬</text>
  <text x="600" y="194" font-size="14" fill="#57534e" text-anchor="middle">共同討論確認</text>

  <!-- 底部說明 -->
  <rect x="40" y="390" width="720" height="72" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="400" y="415" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">B2 評鑑條文原文</text>
  <text x="400" y="440" font-size="14" fill="#57534e" text-anchor="middle">「新進服務對象應於入住72小時內完成個別化服務，包括身體、心理、社會及高風險評估等</text>
  <text x="400" y="458" font-size="14" fill="#d97706" text-anchor="middle" font-weight="600">（高風險評估至少包含跌倒、壓力性損傷、營養不良三項）」</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
