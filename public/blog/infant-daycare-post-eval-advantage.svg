<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <rect x="0" y="50" width="800" height="76" fill="white"/>
  <rect x="0" y="50" width="6" height="76" fill="#d97706" rx="2"/>
  <text x="28" y="102" font-size="32" fill="#1e293b" font-weight="700">把評鑑轉化為下次優勢：4 個做法</text>
  <rect x="28" y="160" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="160" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="66" cy="191" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="197" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <text x="100" y="188" font-size="22" fill="#1e293b" font-weight="700">建立「年度評鑑學習冊」</text>
  <text x="100" y="208" font-size="16" fill="#57534e">記錄每次評鑑的缺失、委員反饋、改善成效，傳承給新主任</text>
  <rect x="620" y="168" width="136" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="185" font-size="16" fill="#d97706" text-anchor="middle">學習</text>
  <text x="688" y="205" font-size="16" fill="#d97706" text-anchor="middle">傳承</text>
  <rect x="28" y="235" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="235" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="66" cy="266" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="272" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <text x="100" y="263" font-size="22" fill="#1e293b" font-weight="700">將改善計畫轉為日常SOP</text>
  <text x="100" y="283" font-size="16" fill="#57534e">評鑑後改善的做法，納入工作手冊成為日常操作標準</text>
  <rect x="620" y="243" width="136" height="46" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="260" font-size="16" fill="#78716c" text-anchor="middle">改善</text>
  <text x="688" y="280" font-size="16" fill="#78716c" text-anchor="middle">SOP</text>
  <rect x="28" y="310" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="310" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="341" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="347" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <text x="100" y="338" font-size="22" fill="#1e293b" font-weight="700">每季自我模擬評鑑</text>
  <text x="100" y="358" font-size="16" fill="#57534e">每 3 個月用評鑑清單自查一次，持續累積達標狀態</text>
  <rect x="620" y="318" width="136" height="46" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="335" font-size="16" fill="#57534e" text-anchor="middle">季度</text>
  <text x="688" y="355" font-size="16" fill="#57534e" text-anchor="middle">自查</text>
  <rect x="28" y="385" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="385" width="6" height="62" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="416" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="422" font-size="16" fill="#a8a29e" text-anchor="middle" font-weight="900">4</text>
  <text x="100" y="413" font-size="22" fill="#1e293b" font-weight="700">主動分享評鑑心得</text>
  <text x="100" y="433" font-size="16" fill="#57534e">向公會或同業分享備考心得，建立口碑，也能收集新資訊</text>
  <rect x="620" y="393" width="136" height="46" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="410" font-size="16" fill="#a8a29e" text-anchor="middle">分享</text>
  <text x="688" y="430" font-size="16" fill="#a8a29e" text-anchor="middle">口碑</text>
  <text x="760" y="490" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>