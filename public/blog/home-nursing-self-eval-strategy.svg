<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- Header -->
  <rect x="0" y="29" width="800" height="60" fill="#e8e6de"/>
  <rect x="0" y="29" width="6" height="60" rx="2" fill="#d97706"/>
  <text x="28" y="74" font-size="28" fill="#1e293b" font-weight="700">自評結果填寫策略 4 原則</text>
  <!-- Row 1 N=4 H=62 -->
  <rect x="28" y="118" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="118" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="66" cy="149" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="155" font-size="14" fill="#d97706" text-anchor="middle" font-weight="900">原則1</text>
  <text x="100" y="139" font-size="20" fill="#1e293b" font-weight="700">誠實填寫（不要過度樂觀）</text>
  <text x="100" y="160" font-size="16" fill="#57534e">自評與委員查核差異太大，反而降低信任度</text>
  <rect x="620" y="126" width="136" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="146" font-size="16" fill="#d97706" text-anchor="middle">誠實</text>
  <text x="688" y="162" font-size="16" fill="#d97706" text-anchor="middle">最重要</text>
  <!-- Row 2 -->
  <rect x="28" y="191" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="191" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="66" cy="222" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="228" font-size="14" fill="#78716c" text-anchor="middle" font-weight="900">原則2</text>
  <text x="100" y="212" font-size="20" fill="#1e293b" font-weight="700">「部分符合」要說明哪部分不足</text>
  <text x="100" y="233" font-size="16" fill="#57534e">清楚說明哪部分已符合、哪部分不足、預計何時改善</text>
  <rect x="620" y="199" width="136" height="46" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="219" font-size="16" fill="#78716c" text-anchor="middle">具體</text>
  <text x="688" y="235" font-size="16" fill="#78716c" text-anchor="middle">說明缺口</text>
  <!-- Row 3 -->
  <rect x="28" y="264" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="264" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="295" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="301" font-size="14" fill="#57534e" text-anchor="middle" font-weight="900">原則3</text>
  <text x="100" y="285" font-size="20" fill="#1e293b" font-weight="700">「不符合」要有改善計畫與完成時限</text>
  <text x="100" y="306" font-size="16" fill="#57534e">說明原因與預計完成時間，展示主動管理態度</text>
  <rect x="620" y="272" width="136" height="46" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="292" font-size="16" fill="#57534e" text-anchor="middle">改善計畫</text>
  <text x="688" y="308" font-size="16" fill="#57534e" text-anchor="middle">必須附上</text>
  <!-- Row 4 -->
  <rect x="28" y="337" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="337" width="6" height="62" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="368" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="374" font-size="14" fill="#a8a29e" text-anchor="middle" font-weight="900">原則4</text>
  <text x="100" y="358" font-size="20" fill="#1e293b" font-weight="700">自評說明和文件內容必須一致</text>
  <text x="100" y="379" font-size="16" fill="#57534e">委員會核對說明與實際文件，兩者不符比不足更嚴重</text>
  <rect x="620" y="345" width="136" height="46" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="365" font-size="16" fill="#a8a29e" text-anchor="middle">說明與</text>
  <text x="688" y="381" font-size="16" fill="#a8a29e" text-anchor="middle">文件一致</text>
  <!-- Watermark -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
