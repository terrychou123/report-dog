<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">第一章 經營管理 備審重點</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">日間型34分／住宿型33分，負責人簡報最關鍵</text>
  <line x1="28" y1="94" x2="772" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- Row 1: 1.1 負責人簡報 -->
  <rect x="28" y="108" width="744" height="84" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="108" width="6" height="84" rx="2" fill="#d97706"/>
  <circle cx="66" cy="150" r="20" fill="#d97706" opacity="0.15"/>
  <text x="66" y="156" font-size="18" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <text x="100" y="141" font-size="20" fill="#1e293b" font-weight="700">1.1 機構負責人之經營管理（8分）</text>
  <text x="100" y="165" font-size="16" fill="#57534e">簡報須含個人復元（CHIME）+社區支持理念、短中長程計畫、財務管理說明</text>
  <text x="100" y="183" font-size="16" fill="#57534e">負責人於評鑑當年7月1日前在職須滿1年</text>
  <rect x="620" y="122" width="136" height="60" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="147" font-size="16" fill="#d97706" text-anchor="middle">最高配分</text>
  <text x="688" y="168" font-size="16" fill="#d97706" text-anchor="middle">負責人主責</text>

  <!-- Row 2: 1.3 督導與教育訓練 -->
  <rect x="28" y="202" width="744" height="84" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="202" width="6" height="84" rx="2" fill="#78716c"/>
  <circle cx="66" cy="244" r="20" fill="#78716c" opacity="0.15"/>
  <text x="66" y="250" font-size="18" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <text x="100" y="235" font-size="20" fill="#1e293b" font-weight="700">1.3 督導與教育訓練制度</text>
  <text x="100" y="259" font-size="16" fill="#57534e">工作人員每月至少1次督導；2年內新進人員每月2次（含1次個別督導）</text>
  <text x="100" y="277" font-size="16" fill="#57534e">訓練需含CRPD、CEDAW、性侵害及性騷擾防治議題</text>
  <rect x="620" y="216" width="136" height="60" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="241" font-size="16" fill="#78716c" text-anchor="middle">每月查核</text>
  <text x="688" y="262" font-size="16" fill="#78716c" text-anchor="middle">督導紀錄</text>

  <!-- Row 3: 住宿型1.4 日夜人力 -->
  <rect x="28" y="296" width="744" height="84" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="296" width="6" height="84" rx="2" fill="#57534e"/>
  <circle cx="66" cy="338" r="20" fill="#57534e" opacity="0.15"/>
  <text x="66" y="344" font-size="18" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <text x="100" y="329" font-size="20" fill="#1e293b" font-weight="700">住宿型1.4 適切的日、夜間人力配置</text>
  <text x="100" y="353" font-size="16" fill="#57534e">24小時均需有負責人、專任管理人員或專業人員在機構內</text>
  <text x="100" y="371" font-size="16" fill="#57534e">排班表與值班紀錄是查核重點（日間型為1.4工作人員健康檢查）</text>
  <rect x="620" y="310" width="136" height="60" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="335" font-size="16" fill="#57534e" text-anchor="middle">住宿型專有</text>
  <text x="688" y="356" font-size="16" fill="#57534e" text-anchor="middle">排班表佐證</text>

  <!-- Row 4: 1.9/1.11 前次評鑑 -->
  <rect x="28" y="390" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="390" width="6" height="60" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="420" r="20" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="426" font-size="18" fill="#a8a29e" text-anchor="middle" font-weight="900">4</text>
  <text x="100" y="412" font-size="20" fill="#1e293b" font-weight="700">可選1.9/1.11 前次評鑑建議改善（3分）</text>
  <text x="100" y="436" font-size="16" fill="#57534e">有前次評鑑建議者，提出改善措施與成效；新設機構或無建議事項者可申請免評</text>
  <rect x="620" y="402" width="136" height="38" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="425" font-size="16" fill="#6b7280" text-anchor="middle">可選免評</text>

  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
