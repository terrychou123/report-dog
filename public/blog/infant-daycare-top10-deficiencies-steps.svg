<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">3步驟自查缺失，不讓缺失拖到評鑑前</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">提早發現，提早改善</text>
  <line x1="129" y1="94" x2="671" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- 箭頭 -->
  <line x1="299" y1="279" x2="310" y2="279" stroke="#c4bfb8" stroke-width="2"/>
  <polygon points="299,273 315,279 299,285" fill="#c4bfb8"/>
  <line x1="485" y1="279" x2="496" y2="279" stroke="#c4bfb8" stroke-width="2"/>
  <polygon points="485,273 501,279 485,285" fill="#c4bfb8"/>

  <!-- Card 0：對照指標自評（#d97706）-->
  <rect x="129" y="108" width="170" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="129" y="108" width="170" height="8" rx="4" fill="#d97706"/>
  <rect x="129" y="112" width="170" height="4" fill="#d97706"/>
  <circle cx="214" cy="194" r="43" fill="#fef3c7"/>
  <text x="214" y="183" text-anchor="middle" font-size="16" fill="#d97706" font-weight="700">STEP</text>
  <text x="214" y="211" text-anchor="middle" font-size="26" fill="#d97706" font-weight="700">01</text>
  <text x="214" y="298" text-anchor="middle" font-size="26" fill="#1e293b" font-weight="700">對照指標</text>
  <text x="214" y="326" text-anchor="middle" font-size="17" fill="#57534e">逐一核對60項</text>
  <text x="214" y="348" text-anchor="middle" font-size="17" fill="#57534e">找出缺漏項目</text>
  <rect x="142" y="381" width="144" height="36" rx="18" fill="#fef3c7"/>
  <text x="214" y="405" text-anchor="middle" font-size="16" fill="#d97706" font-weight="600">缺失識別</text>

  <!-- Card 1：記錄缺漏清單（#78716c）-->
  <rect x="315" y="108" width="170" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="315" y="108" width="170" height="8" rx="4" fill="#78716c"/>
  <rect x="315" y="112" width="170" height="4" fill="#78716c"/>
  <circle cx="400" cy="194" r="43" fill="#f5f5f4"/>
  <text x="400" y="183" text-anchor="middle" font-size="16" fill="#78716c" font-weight="700">STEP</text>
  <text x="400" y="211" text-anchor="middle" font-size="26" fill="#78716c" font-weight="700">02</text>
  <text x="400" y="298" text-anchor="middle" font-size="26" fill="#1e293b" font-weight="700">分工改善</text>
  <text x="400" y="326" text-anchor="middle" font-size="17" fill="#57534e">依角色分配</text>
  <text x="400" y="348" text-anchor="middle" font-size="17" fill="#57534e">設定改善期限</text>
  <rect x="328" y="381" width="144" height="36" rx="18" fill="#f5f5f4"/>
  <text x="400" y="405" text-anchor="middle" font-size="16" fill="#78716c" font-weight="600">責任分工</text>

  <!-- Card 2：追蹤驗收（#57534e）-->
  <rect x="501" y="108" width="170" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="501" y="108" width="170" height="8" rx="4" fill="#57534e"/>
  <rect x="501" y="112" width="170" height="4" fill="#57534e"/>
  <circle cx="586" cy="194" r="43" fill="#f5f0eb"/>
  <text x="586" y="183" text-anchor="middle" font-size="16" fill="#57534e" font-weight="700">STEP</text>
  <text x="586" y="211" text-anchor="middle" font-size="26" fill="#57534e" font-weight="700">03</text>
  <text x="586" y="298" text-anchor="middle" font-size="26" fill="#1e293b" font-weight="700">追蹤驗收</text>
  <text x="586" y="326" text-anchor="middle" font-size="17" fill="#57534e">定期確認進度</text>
  <text x="586" y="348" text-anchor="middle" font-size="17" fill="#57534e">改善完成存檔</text>
  <rect x="514" y="381" width="144" height="36" rx="18" fill="#f5f0eb"/>
  <text x="586" y="405" text-anchor="middle" font-size="16" fill="#57534e" font-weight="600">持續改善</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
