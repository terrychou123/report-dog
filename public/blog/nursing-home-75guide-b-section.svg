<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">B 區塊專業照護品質核心要求</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">32 項指標關鍵週期要求一覽</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- 上排 2×2 y=104 h=168 -->
  <!-- 卡片1 x=40 w=346 -->
  <rect x="40" y="104" width="346" height="168" rx="12" fill="white"/>
  <rect x="40" y="104" width="346" height="44" rx="12" fill="#d97706"/>
  <rect x="40" y="128" width="346" height="20" fill="#d97706"/>
  <text x="213" y="133" text-anchor="middle" font-size="15" fill="white" font-weight="700">品質管理（B1-B9）</text>
  <text x="60" y="170" font-size="14" fill="#57534e">- 品質會議：每 3 個月 1 次</text>
  <text x="60" y="190" font-size="14" fill="#57534e">- 個案計畫（B2）：72 小時初評</text>
  <text x="60" y="210" font-size="14" fill="#57534e">- 跨專業聯繫會：每 3 個月含 3 種領域</text>
  <rect x="56" y="248" width="100" height="20" rx="10" fill="#fef3c7"/>
  <text x="106" y="262" text-anchor="middle" font-size="14" fill="#d97706" font-weight="600">二級加強 B2</text>

  <!-- 卡片2 x=414 w=346 -->
  <rect x="414" y="104" width="346" height="168" rx="12" fill="white"/>
  <rect x="414" y="104" width="346" height="44" rx="12" fill="#78716c"/>
  <rect x="414" y="128" width="346" height="20" fill="#78716c"/>
  <text x="587" y="133" text-anchor="middle" font-size="15" fill="white" font-weight="700">感染防疫（B10-B17）</text>
  <text x="434" y="170" font-size="14" fill="#57534e">- 體溫：住民每日、工作人員每週</text>
  <text x="434" y="190" font-size="14" fill="#57534e">- 感染管制手冊：定期更新</text>
  <text x="434" y="210" font-size="14" fill="#57534e">- 跌倒/壓損/感染：逐案分析+定期分析</text>
  <rect x="430" y="248" width="100" height="20" rx="10" fill="#f5f5f4"/>
  <text x="480" y="262" text-anchor="middle" font-size="14" fill="#78716c" font-weight="600">二級加強 B10</text>

  <!-- 下排 2×2 y=288 h=162 -->
  <!-- 卡片3 x=40 w=346 -->
  <rect x="40" y="288" width="346" height="162" rx="12" fill="white"/>
  <rect x="40" y="288" width="346" height="44" rx="12" fill="#57534e"/>
  <rect x="40" y="312" width="346" height="20" fill="#57534e"/>
  <text x="213" y="317" text-anchor="middle" font-size="15" fill="white" font-weight="700">藥品與醫療（B11-B12、B24）</text>
  <text x="60" y="354" font-size="14" fill="#57534e">- 三讀五對：每次給藥確實執行</text>
  <text x="60" y="374" font-size="14" fill="#57534e">- 藥師諮詢：每 3 個月 1 次</text>
  <text x="60" y="394" font-size="14" fill="#57534e">- 緊急送醫：需有救護車合約</text>
  <rect x="56" y="420" width="80" height="20" rx="10" fill="#f5f0eb"/>
  <text x="96" y="434" text-anchor="middle" font-size="14" fill="#57534e" font-weight="600">護A 負責</text>

  <!-- 卡片4 x=414 w=346 -->
  <rect x="414" y="288" width="346" height="162" rx="12" fill="white"/>
  <rect x="414" y="288" width="346" height="44" rx="12" fill="#a8a29e"/>
  <rect x="414" y="312" width="346" height="20" fill="#a8a29e"/>
  <text x="587" y="317" text-anchor="middle" font-size="15" fill="white" font-weight="700">日常照護（B26-B32）</text>
  <text x="434" y="354" font-size="14" fill="#57534e">- 每日下床 2 次；每 2 小時翻身</text>
  <text x="434" y="374" font-size="14" fill="#57534e">- 每週洗澡 2 次（夏季 3 次）</text>
  <text x="434" y="394" font-size="14" fill="#57534e">- 菜單由營養師擬定，2 週循環</text>
  <rect x="430" y="420" width="80" height="20" rx="10" fill="#f5f5f4"/>
  <text x="470" y="434" text-anchor="middle" font-size="14" fill="#a8a29e" font-weight="600">護A/護B</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
