<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 右側裝飾區塊 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>

  <!--
    右側高度計算：
    · 數字 "3"：font-size=150, baseline=y=224, 頂部≈y=104（與左側主標題頂部對齊）
    · 時程條底部：y=458+80=538 ≤ 左側適用對象 y=558 ✓
    · 右側內容總高：104~538 = 434px ≤ 左側 104~565 = 461px ✓
  -->

  <!-- 右側裝飾大數字（150px，頂部對齊左側主標題） -->
  <text x="1010" y="224" font-size="150" font-weight="900" fill="#d97706" text-anchor="middle" opacity="0.85">3</text>
  <text x="1010" y="262" font-size="28" fill="#78716c" text-anchor="middle" font-weight="600">個月評鑑準備時程</text>

  <!-- 右側時程條（3 條，各 80px，底部 y=538 ≤ 左側 y=558）
       雙行置中：title_y = rect_y + 40 - 28/2 + 28×0.35 = rect_y + 36, sub_y = title_y + 28
  -->
  <rect x="840" y="282" width="330" height="80" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="840" y="282" width="7" height="80" rx="3" fill="#d97706"/>
  <text x="862" y="318" font-size="28" fill="#d97706" font-weight="700">第 1 個月</text>
  <text x="862" y="346" font-size="22" fill="#78716c">文件盤點 · 人力核算</text>

  <rect x="840" y="370" width="330" height="80" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="840" y="370" width="7" height="80" rx="3" fill="#78716c"/>
  <text x="862" y="406" font-size="28" fill="#78716c" font-weight="700">第 2 個月</text>
  <text x="862" y="434" font-size="22" fill="#78716c">試評 · 缺點補強</text>

  <rect x="840" y="458" width="330" height="80" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="840" y="458" width="7" height="80" rx="3" fill="#a8a29e"/>
  <text x="862" y="494" font-size="28" fill="#a8a29e" font-weight="700">評鑑前一個月</text>
  <text x="862" y="522" font-size="22" fill="#78716c">完整演練 · 最終確認</text>

  <!-- 左側主內容區 -->
  <!-- 主標題 120px，baseline y=200，頂部≈y=104 -->
  <text x="60" y="200" font-size="120" font-weight="900" fill="#1e293b">評鑑三個月</text>
  <text x="60" y="338" font-size="120" font-weight="900" fill="#d97706">完整準備攻略</text>

  <line x1="60" y1="365" x2="780" y2="365" stroke="#dedad3" stroke-width="2"/>

  <text x="60" y="416" font-size="38" fill="#57534e" font-weight="400">日照中心 · 115 年度 · 逐週行動計畫</text>

  <!-- 特色標籤列（28px，pill 高 54px） -->
  <rect x="60" y="450" width="148" height="54" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="134" y="483" font-size="28" fill="#d97706" text-anchor="middle" font-weight="600">文件整備</text>

  <rect x="220" y="450" width="148" height="54" rx="10" fill="#78716c" opacity="0.12"/>
  <text x="294" y="483" font-size="28" fill="#78716c" text-anchor="middle" font-weight="600">模擬演練</text>

  <rect x="380" y="450" width="148" height="54" rx="10" fill="#57534e" opacity="0.12"/>
  <text x="454" y="483" font-size="28" fill="#57534e" text-anchor="middle" font-weight="600">時程規劃</text>

  <rect x="540" y="450" width="148" height="54" rx="10" fill="#a8a29e" opacity="0.18"/>
  <text x="614" y="483" font-size="28" fill="#78716c" text-anchor="middle" font-weight="600">清單下載</text>

  <!-- 資料來源（28px，底部≈y=565） -->
  <text x="60" y="558" font-size="28" fill="#94a3b8">資料來源：臺北市 115 年度日間照顧機構評鑑基準</text>

  <!-- 浮水印（24px，上移） -->
  <text x="1140" y="590" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
