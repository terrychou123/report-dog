  <text x="670" y="215" font-size="14" fill="white" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">志工人力</text>
  <text x="670" y="235" font-size="14" fill="white" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">資源</text>
  <text x="670" y="265" font-size="14" fill="white" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">家屬教育</text>
  <text x="670" y="285" font-size="14" fill="white" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">活動</text>
  <text x="670" y="315" font-size="14" fill="white" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">社區講座</text>

  <!-- 品牌浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-family="'Noto Sans TC', sans-serif">報告汪 reportwang.com</text>
