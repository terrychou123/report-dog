  <text x="482" y="215" font-size="14" fill="white" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">社區關懷</text>
  <text x="482" y="235" font-size="14" fill="white" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">據點</text>
  <text x="482" y="265" font-size="14" fill="white" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">居家服務</text>
