  <text x="482" y="315" font-size="14" fill="white" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">中心</text>

  <!-- 卡片4 -->
  <rect x="580" y="114" width="180" height="330" rx="12" fill="#a8a29e"/>
  <text x="670" y="150" font-size="18" fill="white" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-weight="bold">志工與</text>
  <text x="670" y="172" font-size="18" fill="white" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-weight="bold">教育</text>
