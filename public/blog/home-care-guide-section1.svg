<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- Header (N=3: y=38, h=76) -->
  <rect x="0" y="38" width="800" height="76" fill="white"/>
  <rect x="0" y="38" width="6" height="76" fill="#d97706" rx="2"/>
  <text x="28" y="92" font-size="36" fill="#1e293b" font-weight="700">壹、個案權益保障（項 1–4）</text>

  <!-- Row 1 (y=166) amber #d97706, N=3: H=90 -->
  <rect x="28" y="166" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="166" width="6" height="90" rx="2" fill="#78716c"/>
  <!-- circle cy=row_y+45=211 -->
  <circle cx="66" cy="211" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="217" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <!-- Q_y=row_y+44=210, R_y=row_y+68=234 -->
  <text x="100" y="210" font-size="22" fill="#1e293b" font-weight="700">服務資訊公開</text>
  <text x="100" y="234" font-size="16" fill="#57534e">服務費率、服務項目須公開揭示</text>
  <!-- S rect: y=row_y+19=185, h=52 -->
  <rect x="620" y="185" width="136" height="52" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="207" font-size="16" fill="#d97706" text-anchor="middle">項目1</text>
  <text x="688" y="227" font-size="16" fill="#d97706" text-anchor="middle">主管負責</text>

  <!-- Row 2 (y=269) stone #78716c -->
  <rect x="28" y="269" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="269" width="6" height="90" rx="2" fill="#57534e"/>
  <!-- circle cy=269+45=314 -->
  <circle cx="66" cy="314" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="320" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <!-- Q_y=269+44=313, R_y=269+68=337 -->
  <text x="100" y="313" font-size="22" fill="#1e293b" font-weight="700">基本權益維護</text>
  <text x="100" y="337" font-size="16" fill="#57534e">個案尊嚴、自主選擇服務的權利</text>
  <rect x="620" y="288" width="136" height="52" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="310" font-size="16" fill="#78716c" text-anchor="middle">項目2</text>
  <text x="688" y="330" font-size="16" fill="#78716c" text-anchor="middle">社工負責</text>

  <!-- Row 3 (y=372) stone #57534e -->
  <rect x="28" y="372" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="372" width="6" height="90" rx="2" fill="#a8a29e"/>
  <!-- circle cy=372+45=417 -->
  <circle cx="66" cy="417" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="423" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <!-- Q_y=372+44=416, R_y=372+68=440 -->
  <text x="100" y="416" font-size="22" fill="#1e293b" font-weight="700">隱私保護</text>
  <text x="100" y="440" font-size="16" fill="#57534e">個案資料保密、不得洩露個資</text>
  <rect x="620" y="391" width="136" height="52" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="413" font-size="16" fill="#57534e" text-anchor="middle">項目3</text>
  <text x="688" y="433" font-size="16" fill="#57534e" text-anchor="middle">全體落實</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
