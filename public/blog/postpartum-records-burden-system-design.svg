<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- 標題列 -->
  <rect x="0" y="29" width="800" height="60" fill="#e8e6de"/>
  <rect x="0" y="29" width="6" height="60" rx="2" fill="#d97706"/>
  <text x="28" y="74" font-size="30" fill="#1e293b" font-weight="700">系統設計比個人勤奮更重要的 4 原則</text>
  <!-- Row 1 -->
  <rect x="28" y="118" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="118" width="6" height="62" rx="2" fill="#d97706"/>
  <circle cx="66" cy="149" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="155" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <text x="100" y="146" font-size="20" fill="#1e293b" font-weight="700">分配文書資源：知道哪些記錄評鑑最重要</text>
  <text x="100" y="167" font-size="16" fill="#57534e">B1.1/1.2/1.5/1.7/1.8 是委員最常翻閱項目，重點資源集中</text>
  <rect x="620" y="126" width="136" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="143" font-size="16" fill="#d97706" text-anchor="middle">重點</text>
  <text x="688" y="163" font-size="16" fill="#d97706" text-anchor="middle">資源分配</text>
  <!-- Row 2 -->
  <rect x="28" y="191" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="191" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="66" cy="222" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="228" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <text x="100" y="219" font-size="20" fill="#1e293b" font-weight="700">表格設計決定填寫速度與完整度</text>
  <text x="100" y="240" font-size="16" fill="#57534e">設計良好的表格可讓同樣記錄縮短至三分之一時間完成</text>
  <rect x="620" y="199" width="136" height="46" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="216" font-size="16" fill="#78716c" text-anchor="middle">表格設計</text>
  <text x="688" y="236" font-size="16" fill="#78716c" text-anchor="middle">優先</text>
  <!-- Row 3 -->
  <rect x="28" y="264" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="264" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="66" cy="295" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="301" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <text x="100" y="292" font-size="20" fill="#1e293b" font-weight="700">每年評鑑後定期檢視現有記錄表格</text>
  <text x="100" y="313" font-size="16" fill="#57534e">低填寫率欄位、護理師最抱怨的欄位、評鑑常被挑的缺漏</text>
  <rect x="620" y="272" width="136" height="46" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="289" font-size="16" fill="#57534e" text-anchor="middle">年度</text>
  <text x="688" y="309" font-size="16" fill="#57534e" text-anchor="middle">持續改善</text>
  <!-- Row 4 -->
  <rect x="28" y="337" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="337" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="368" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="374" font-size="16" fill="#a8a29e" text-anchor="middle" font-weight="900">4</text>
  <text x="100" y="365" font-size="20" fill="#1e293b" font-weight="700">新進護理師學習曲線：文書指引標準化</text>
  <text x="100" y="386" font-size="16" fill="#57534e">填寫範例＋常見錯誤＋入住/每日/出院流程清單，一人都不掉隊</text>
  <rect x="620" y="345" width="136" height="46" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="362" font-size="16" fill="#a8a29e" text-anchor="middle">標準化</text>
  <text x="688" y="382" font-size="16" fill="#a8a29e" text-anchor="middle">新人指引</text>
  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
