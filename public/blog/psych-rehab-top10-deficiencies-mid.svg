<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">中高風險缺失：3大常見失分點</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">評鑑委員抽查紀錄必找的問題</text>
  <line x1="28" y1="94" x2="772" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- Row 1: 2.2 -->
  <rect x="28" y="118" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="118" width="6" height="90" rx="2" fill="#d97706"/>
  <circle cx="66" cy="163" r="20" fill="#d97706" opacity="0.15"/>
  <text x="66" y="170" font-size="18" fill="#d97706" text-anchor="middle" font-weight="900">4</text>
  <text x="100" y="148" font-size="20" fill="#1e293b" font-weight="700">2.2 復健計畫未每3個月修正</text>
  <text x="100" y="171" font-size="16" fill="#57534e">常見問題：第一次計畫很完整，但後續修正記錄缺漏或只是重新蓋章</text>
  <text x="100" y="192" font-size="16" fill="#d97706">改善：每份個案設定「修正提醒」，修正須有實質內容變化與三方簽名</text>
  <rect x="620" y="130" width="136" height="64" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="155" font-size="16" fill="#d97706" text-anchor="middle">每3月</text>
  <text x="688" y="175" font-size="16" fill="#d97706" text-anchor="middle">強制修正</text>

  <!-- Row 2: 2.9 -->
  <rect x="28" y="220" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="220" width="6" height="90" rx="2" fill="#78716c"/>
  <circle cx="66" cy="265" r="20" fill="#78716c" opacity="0.15"/>
  <text x="66" y="272" font-size="18" fill="#78716c" text-anchor="middle" font-weight="900">5</text>
  <text x="100" y="250" font-size="20" fill="#1e293b" font-weight="700">2.9 社區復健討論會記錄不完整</text>
  <text x="100" y="273" font-size="16" fill="#57534e">常見問題：模板重複使用（議題雷同）、時間未達45分鐘卻記錄達標</text>
  <text x="100" y="294" font-size="16" fill="#78716c">改善：依學員實際適應情況設計議題，確保30人以下一組，紀錄員確實填寫時間</text>
  <rect x="620" y="232" width="136" height="64" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="257" font-size="16" fill="#78716c" text-anchor="middle">每月1次</text>
  <text x="688" y="277" font-size="16" fill="#78716c" text-anchor="middle">45分鐘</text>

  <!-- Row 3: 1.3 -->
  <rect x="28" y="322" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="322" width="6" height="90" rx="2" fill="#57534e"/>
  <circle cx="66" cy="367" r="20" fill="#57534e" opacity="0.15"/>
  <text x="66" y="374" font-size="18" fill="#57534e" text-anchor="middle" font-weight="900">6</text>
  <text x="100" y="352" font-size="20" fill="#1e293b" font-weight="700">1.3 教育訓練未涵蓋必要議題</text>
  <text x="100" y="375" font-size="16" fill="#57534e">常見問題：有訓練計畫但課程未含CRPD、CEDAW、性侵害及性騷擾防治</text>
  <text x="100" y="396" font-size="16" fill="#57534e">改善：在年度訓練計畫中明確標示各議題、執行紀錄須有簽到表與內容摘要</text>
  <rect x="620" y="334" width="136" height="64" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="359" font-size="16" fill="#57534e" text-anchor="middle">CRPD</text>
  <text x="688" y="379" font-size="16" fill="#57534e" text-anchor="middle">CEDAW必含</text>

  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
