<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 Header y=50 h=76 -->
  <rect x="28" y="50" width="744" height="76" rx="8" fill="#1e293b"/>
  <text x="400" y="82" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">備審文件準備 4 步驟流程</text>
  <text x="400" y="110" font-size="16" fill="#94a3b8" text-anchor="middle">建議評鑑前 3 個月啟動，依優先順序逐步完成</text>

  <!-- N=4 版型：H=62 -->
  <!-- Row1 y=160 步驟1 盤點清冊 -->
  <rect x="28" y="160" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="160" width="6" height="62" rx="2" fill="#d97706"/>
  <circle cx="66" cy="191" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="197" font-size="16" font-weight="900" fill="#d97706" text-anchor="middle">1</text>
  <text x="100" y="188" font-size="18" font-weight="700" fill="#1e293b">盤點現有文件庫（評鑑前 12 週）</text>
  <text x="100" y="208" font-size="16" fill="#57534e">依六大區塊列出 77 項對應文件清單，逐一確認現況是否已有、是否完整</text>
  <rect x="620" y="168" width="136" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="197" font-size="16" fill="#d97706" text-anchor="middle">第12週</text>

  <!-- Row2 y=235 步驟2 缺口分析 -->
  <rect x="28" y="235" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="235" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="66" cy="266" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="272" font-size="16" font-weight="900" fill="#78716c" text-anchor="middle">2</text>
  <text x="100" y="263" font-size="18" font-weight="700" fill="#1e293b">優先補強一級必要 + 二級加強項目（評鑑前 8 週）</text>
  <text x="100" y="283" font-size="16" fill="#57534e">C區一級必要指標（C4/C9/C10/C11/C12/C15）優先完成；再處理二級加強A2/A4/B2/B10/D1</text>
  <rect x="620" y="243" width="136" height="46" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="272" font-size="16" fill="#78716c" text-anchor="middle">第8週</text>

  <!-- Row3 y=310 步驟3 補足一般指標 -->
  <rect x="28" y="310" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="310" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="66" cy="341" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="347" font-size="16" font-weight="900" fill="#57534e" text-anchor="middle">3</text>
  <text x="100" y="338" font-size="18" font-weight="700" fill="#1e293b">補足一般指標文件（評鑑前 4 週）</text>
  <text x="100" y="358" font-size="16" fill="#57534e">訓練紀錄、照護記錄、個案資料、品管會議記錄逐一核實，確保內容完整一致</text>
  <rect x="620" y="318" width="136" height="46" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="347" font-size="16" fill="#57534e" text-anchor="middle">第4週</text>

  <!-- Row4 y=385 步驟4 加分題準備 -->
  <rect x="28" y="385" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="385" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="416" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="422" font-size="16" font-weight="900" fill="#a8a29e" text-anchor="middle">4</text>
  <text x="100" y="413" font-size="18" font-weight="700" fill="#1e293b">準備 E/F 加分題文件 + 最終自我查核（評鑑前 1 週）</text>
  <text x="100" y="433" font-size="16" fill="#57534e">整理創新服務報告、PDCA成果、F區加分文件；AI逐項查核確認備審文件完整度</text>
  <rect x="620" y="393" width="136" height="46" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="422" font-size="16" fill="#a8a29e" text-anchor="middle">第1週</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
