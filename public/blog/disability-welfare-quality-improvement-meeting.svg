<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- Header (N=3: outer_gap=38, Header y=38, h=90) -->
  <rect x="0" y="38" width="800" height="90" fill="white"/>
  <rect x="0" y="38" width="6" height="90" fill="#d97706" rx="2"/>
  <text x="28" y="100" font-size="40" fill="#1e293b" font-weight="700">管理會議三大議程</text>

  <!-- Row 1: 決議追蹤報告 (y=166, H=90, r=20) -->
  <rect x="28" y="166" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="166" width="6" height="90" rx="2" fill="#d97706"/>
  <circle cx="70" cy="211" r="20" fill="#d97706" opacity="0.15"/>
  <text x="70" y="218" font-size="18" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <text x="100" y="210" font-size="28" fill="#1e293b" font-weight="700">決議追蹤報告</text>
  <text x="100" y="234" font-size="18" fill="#57534e">上次會議決議追蹤結案說明，確認各項改善行動完成狀況</text>
  <rect x="620" y="185" width="136" height="52" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="205" font-size="16" fill="#d97706" text-anchor="middle">決議追蹤</text>
  <text x="688" y="225" font-size="16" fill="#d97706" text-anchor="middle">必要議程</text>

  <!-- Row 2: 品質指標回顧 (y=269, H=90) -->
  <rect x="28" y="269" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="269" width="6" height="90" rx="2" fill="#78716c"/>
  <circle cx="70" cy="314" r="20" fill="#78716c" opacity="0.15"/>
  <text x="70" y="321" font-size="18" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <text x="100" y="313" font-size="28" fill="#1e293b" font-weight="700">品質指標回顧</text>
  <text x="100" y="337" font-size="18" fill="#57534e">評鑑指標達成率與缺失改善進度統計，找出落差與瓶頸</text>
  <rect x="620" y="288" width="136" height="52" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="308" font-size="16" fill="#78716c" text-anchor="middle">品質監控</text>
  <text x="688" y="328" font-size="16" fill="#78716c" text-anchor="middle">指標回顧</text>

  <!-- Row 3: 新議題討論 (y=372, H=90) -->
  <rect x="28" y="372" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="372" width="6" height="90" rx="2" fill="#57534e"/>
  <circle cx="70" cy="417" r="20" fill="#57534e" opacity="0.15"/>
  <text x="70" y="424" font-size="18" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <text x="100" y="416" font-size="28" fill="#1e293b" font-weight="700">新議題討論</text>
  <text x="100" y="440" font-size="18" fill="#57534e">新增缺失發現、法規異動通知與後續改善提案討論</text>
  <rect x="620" y="391" width="136" height="52" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="411" font-size="16" fill="#57534e" text-anchor="middle">新增議題</text>
  <text x="688" y="431" font-size="16" fill="#57534e" text-anchor="middle">持續改善</text>

  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
