<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <rect x="0" y="50" width="800" height="76" fill="white"/>
  <rect x="0" y="50" width="6" height="76" rx="2" fill="#d97706"/>
  <text x="28" y="104" font-size="36" fill="#1e293b" font-weight="700">B1.13 評分結構：連結 3 處 vs 5 處</text>
  <rect x="28" y="175" width="744" height="130" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="175" width="6" height="130" rx="2" fill="#78716c"/>
  <circle cx="66" cy="235" r="20" fill="#78716c" opacity="0.15"/>
  <text x="66" y="241" font-size="18" fill="#78716c" text-anchor="middle" font-weight="900">基本</text>
  <text x="100" y="225" font-size="22" fill="#1e293b" font-weight="700">基本達標：連結至少 3 處（符合基準門檻）</text>
  <text x="100" y="251" font-size="16" fill="#57534e">有專人盤點社區資源，有涵蓋住民社區支持和參與的計畫</text>
  <text x="100" y="271" font-size="16" fill="#57534e">連結至少 3 處多元化社區服務網絡，有紀錄可查</text>
  <text x="100" y="291" font-size="16" fill="#57534e">進入「符合基準」的門檻，基本分通過</text>
  <rect x="620" y="183" width="136" height="115" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="234" font-size="16" fill="#78716c" text-anchor="middle">3 處</text>
  <text x="688" y="254" font-size="16" fill="#78716c" text-anchor="middle">門檻</text>
  <rect x="28" y="325" width="744" height="120" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="325" width="6" height="120" rx="2" fill="#d97706"/>
  <circle cx="66" cy="380" r="20" fill="#d97706" opacity="0.15"/>
  <text x="66" y="386" font-size="18" fill="#d97706" text-anchor="middle" font-weight="900">進階</text>
  <text x="100" y="370" font-size="22" fill="#1e293b" font-weight="700">進階達標：連結至少 5 處（更高分數）</text>
  <text x="100" y="396" font-size="16" fill="#57534e">在 3 處基礎上，再增加 2 處多元社區服務網絡連結</text>
  <text x="100" y="416" font-size="16" fill="#57534e">有具體的成效評估記錄，展示連結帶來的實際效益</text>
  <rect x="620" y="333" width="136" height="105" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="381" font-size="16" fill="#d97706" text-anchor="middle">5 處</text>
  <text x="688" y="401" font-size="16" fill="#d97706" text-anchor="middle">加分</text>
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
