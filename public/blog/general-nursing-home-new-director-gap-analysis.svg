<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8" rx="16"/>
  <!-- 標題 -->
  <rect x="0" y="0" width="800" height="64" fill="#d97706" rx="16"/>
  <rect x="0" y="50" width="800" height="14" fill="#d97706"/>
  <text x="400" y="40" font-size="22" font-weight="900" text-anchor="middle" fill="#ffffff">15 項評鑑基準文件缺口分析表</text>
  <!-- 圖例 -->
  <rect x="24" y="80" width="14" height="14" rx="3" fill="#f0fdf4"/>
  <text x="44" y="93" font-size="14" fill="#57534e">有（完整）</text>
  <rect x="148" y="80" width="14" height="14" rx="3" fill="#fef3c7"/>
  <text x="168" y="93" font-size="14" fill="#57534e">部分有</text>
  <rect x="260" y="80" width="14" height="14" rx="3" fill="#fee2e2"/>
  <text x="280" y="93" font-size="14" fill="#57534e">無（需建立）</text>
  <rect x="400" y="80" width="14" height="14" rx="3" fill="#fef9c3"/>
  <text x="420" y="93" font-size="14" fill="#57534e">(!) 高風險（P1）</text>
  <!-- A 類基準 -->
  <text x="24" y="120" font-size="14" font-weight="700" fill="#2563eb">A 類：人員與設備</text>
  <!-- A1 -->
  <rect x="24" y="126" width="180" height="32" rx="6" fill="#f0fdf4"/>
  <text x="44" y="147" font-size="14" fill="#16a34a">A1 人力配置符合規定</text>
  <!-- A2 -->
  <rect x="216" y="126" width="160" height="32" rx="6" fill="#fef3c7"/>
  <text x="236" y="147" font-size="14" fill="#d97706">A2 在職訓練記錄</text>
  <!-- A3 -->
  <rect x="388" y="126" width="180" height="32" rx="6" fill="#f0fdf4"/>
  <text x="408" y="147" font-size="14" fill="#16a34a">A3 設備維護記錄</text>
  <!-- A4/A5 -->
  <rect x="580" y="126" width="196" height="32" rx="6" fill="#fee2e2"/>
  <text x="600" y="147" font-size="14" fill="#dc2626">A4/A5 環境設施記錄</text>
  <!-- B 類基準 -->
  <text x="24" y="180" font-size="14" font-weight="700" fill="#2563eb">B 類：照護品質</text>
  <!-- B1 -->
  <rect x="24" y="186" width="180" height="32" rx="6" fill="#fef3c7"/>
  <text x="44" y="207" font-size="14" fill="#d97706">B1 照護計畫完整性</text>
  <!-- B2 -->
  <rect x="216" y="186" width="160" height="32" rx="6" fill="#fef3c7"/>
  <text x="236" y="207" font-size="14" fill="#d97706">B2 跨專業會議記錄</text>
  <!-- B3 -->
  <rect x="388" y="186" width="180" height="32" rx="6" fill="#fee2e2"/>
  <text x="408" y="207" font-size="14" fill="#dc2626">B3 品質指標月報</text>
  <!-- B4 -->
  <rect x="580" y="186" width="196" height="32" rx="6" fill="#f0fdf4"/>
  <text x="600" y="207" font-size="14" fill="#16a34a">B4 滿意度調查</text>
  <!-- C 類基準 -->
  <text x="24" y="240" font-size="14" font-weight="700" fill="#2563eb">C 類：安全管理</text>
  <!-- C1 -->
  <rect x="24" y="246" width="180" height="32" rx="6" fill="#fef9c3" stroke="#d97706" stroke-width="1.5"/>
  <text x="44" y="267" font-size="14" fill="#d97706" font-weight="700">(!) C1 急救訓練效期</text>
  <!-- C2 -->
  <rect x="216" y="246" width="160" height="32" rx="6" fill="#fef3c7"/>
  <text x="236" y="267" font-size="14" fill="#d97706">C2 疏散通道查核</text>
  <!-- C3 -->
  <rect x="388" y="246" width="180" height="32" rx="6" fill="#fee2e2"/>
  <text x="408" y="267" font-size="14" fill="#dc2626">C3 疏散名冊</text>
  <!-- C4 -->
  <rect x="580" y="246" width="196" height="32" rx="6" fill="#fef9c3" stroke="#d97706" stroke-width="1.5"/>
  <text x="600" y="267" font-size="14" fill="#d97706" font-weight="700">(!) C4 情境演練記錄</text>
  <!-- D 類基準 -->
  <text x="24" y="300" font-size="14" font-weight="700" fill="#2563eb">D 類：創新加分</text>
  <rect x="24" y="306" width="180" height="32" rx="6" fill="#fee2e2"/>
  <text x="44" y="327" font-size="14" fill="#dc2626">D1 創新成效記錄</text>
  <rect x="216" y="306" width="560" height="32" rx="6" fill="#f1f5f9"/>
  <text x="434" y="327" font-size="14" text-anchor="middle" fill="#78716c">（非必要，但影響評鑑等第）</text>
  <!-- 說明區域 -->
  <rect x="24" y="352" width="752" height="120" rx="10" fill="#ffffff" opacity="0.8"/>
  <text x="44" y="376" font-size="14" font-weight="700" fill="#d97706">缺口處理優先級</text>
  <!-- P1 -->
  <rect x="44" y="386" width="28" height="22" rx="4" fill="#dc2626"/>
  <text x="58" y="401" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="700">P1</text>
  <text x="80" y="401" font-size="14" fill="#57534e">立即處理（本週）：訓練效期到期、演練次數不足、上次缺失未改善</text>
  <!-- P2 -->
  <rect x="44" y="414" width="28" height="22" rx="4" fill="#d97706"/>
  <text x="58" y="429" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="700">P2</text>
  <text x="80" y="429" font-size="14" fill="#57534e">本月完成：文件格式修正、SOP 書面化、標示補齊</text>
  <!-- P3 -->
  <rect x="44" y="442" width="28" height="22" rx="4" fill="#2563eb"/>
  <text x="58" y="457" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="700">P3</text>
  <text x="80" y="457" font-size="14" fill="#57534e">評鑑前完成：D1 創新成效報告、現有服務優化記錄</text>
  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end">報告汪 reportwang.com</text>
</svg>
