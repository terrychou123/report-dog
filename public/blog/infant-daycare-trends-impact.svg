<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <rect x="0" y="38" width="800" height="90" fill="white"/>
  <rect x="0" y="38" width="6" height="90" fill="#d97706" rx="2"/>
  <text x="28" y="98" font-size="36" fill="#1e293b" font-weight="700">趨勢對機構的 3 大影響</text>
  <rect x="28" y="166" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="166" width="6" height="90" rx="2" fill="#78716c"/>
  <circle cx="66" cy="211" r="20" fill="#d97706" opacity="0.15"/>
  <text x="66" y="217" font-size="18" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <text x="100" y="210" font-size="28" fill="#1e293b" font-weight="700">文件準備邏輯改變</text>
  <text x="100" y="234" font-size="16" fill="#57534e">從「評鑑前衝刺補齊」轉向「日常持續累積」，最後一個月不趕工</text>
  <rect x="620" y="185" width="136" height="52" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="205" font-size="16" fill="#d97706" text-anchor="middle">日常</text>
  <text x="688" y="225" font-size="16" fill="#d97706" text-anchor="middle">累積</text>
  <rect x="28" y="269" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="269" width="6" height="90" rx="2" fill="#57534e"/>
  <circle cx="66" cy="314" r="20" fill="#78716c" opacity="0.15"/>
  <text x="66" y="320" font-size="18" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <text x="100" y="313" font-size="28" fill="#1e293b" font-weight="700">全員專業能力要求提高</text>
  <text x="100" y="337" font-size="16" fill="#57534e">托育人員需了解評鑑指標，而非只靠主任準備，全員參與</text>
  <rect x="620" y="288" width="136" height="52" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="308" font-size="16" fill="#78716c" text-anchor="middle">全員</text>
  <text x="688" y="328" font-size="16" fill="#78716c" text-anchor="middle">提升</text>
  <rect x="28" y="372" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="372" width="6" height="90" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="417" r="20" fill="#57534e" opacity="0.15"/>
  <text x="66" y="423" font-size="18" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <text x="100" y="416" font-size="28" fill="#1e293b" font-weight="700">機構差距拉大</text>
  <text x="100" y="440" font-size="16" fill="#57534e">重視持續改善的機構評分持續上升，應付式準備的機構原地踏步</text>
  <rect x="620" y="391" width="136" height="52" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="411" font-size="16" fill="#57534e" text-anchor="middle">差距</text>
  <text x="688" y="431" font-size="16" fill="#57534e" text-anchor="middle">擴大</text>
  <text x="760" y="490" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>