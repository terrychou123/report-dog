<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 頂部標題區塊 -->
  <rect x="0" y="0" width="800" height="108" rx="0" fill="#1e293b"/>
  <text x="400" y="52"  font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">不同行動能力病人疏散方式</text>
  <text x="400" y="82"  font-size="14" fill="#a8a29e" text-anchor="middle">疏散計畫需明確含臥床、行動不便病人之疏散方式</text>

  <!-- 列 1 (y=128, H=90)：可自行行走病人 -->
  <rect x="38" y="128" width="724" height="90" rx="10" fill="#fef3c7"/>
  <rect x="38" y="128" width="6" height="90" rx="2" fill="#d97706"/>
  <circle cx="80" cy="173" r="22" fill="#d97706" opacity="0.15"/>
  <text x="80" y="170"  font-size="14" font-weight="700" fill="#d97706" text-anchor="middle">可行走</text>
  <text x="80" y="183"  font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">病人</text>
  <text x="118" y="151"  font-size="15" font-weight="700" fill="#d97706">可自行行走病人</text>
  <text x="118" y="172"  font-size="14" fill="#78716c">引導至緊急出口，確認無人遺漏；護理師帶領高齡或定向感差的病人</text>
  <rect x="622" y="149" width="116" height="26" rx="13" fill="#d97706"/>
  <text x="680" y="167"  font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">自行疏散</text>
  <text x="118" y="200"  font-size="14" fill="#a8a29e">最先引導出場，讓人員能快速返回協助行動不便的病人，避免通道壅塞</text>

  <!-- 列 2 (y=231, H=90)：使用輪椅病人 -->
  <rect x="38" y="231" width="724" height="90" rx="10" fill="#f5f5f4"/>
  <rect x="38" y="231" width="6" height="90" rx="2" fill="#78716c"/>
  <circle cx="80" cy="276" r="22" fill="#78716c" opacity="0.15"/>
  <text x="80" y="273"  font-size="14" font-weight="700" fill="#78716c" text-anchor="middle">輪椅</text>
  <text x="80" y="286"  font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">病人</text>
  <text x="118" y="254"  font-size="15" font-weight="700" fill="#57534e">使用輪椅病人</text>
  <text x="118" y="275"  font-size="14" fill="#78716c">由工作人員推送輪椅疏散，電梯禁用，使用坡道或安全梯，確認輪椅完好</text>
  <rect x="622" y="252" width="116" height="26" rx="13" fill="#78716c"/>
  <text x="680" y="270"  font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">輔具協助</text>
  <text x="118" y="303"  font-size="14" fill="#a8a29e">輪椅存放位置需標示清楚，夜班應確認輪椅數量足夠應對需求病人人數</text>

  <!-- 列 3 (y=334, H=90)：臥床及加護病人 -->
  <rect x="38" y="334" width="724" height="90" rx="10" fill="#f5f5f4"/>
  <rect x="38" y="334" width="6" height="90" rx="2" fill="#57534e"/>
  <circle cx="80" cy="379" r="22" fill="#57534e" opacity="0.15"/>
  <text x="80" y="376"  font-size="14" font-weight="700" fill="#57534e" text-anchor="middle">臥床</text>
  <text x="80" y="389"  font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">加護</text>
  <text x="118" y="357"  font-size="15" font-weight="700" fill="#57534e">臥床及加護病人</text>
  <text x="118" y="378"  font-size="14" fill="#78716c">使用疏散滑板或直接推病床至防煙區，呼吸器病人需2人配合</text>
  <rect x="622" y="355" width="116" height="26" rx="13" fill="#57534e"/>
  <text x="680" y="373"  font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">特殊應變</text>
  <text x="118" y="406"  font-size="14" fill="#a8a29e">無法移動者關閉房門等待救援，水平疏散優先，最後才考慮垂直疏散</text>

  <!-- 浮水印 -->
  <text x="400" y="480"  font-size="14" fill="#a8a29e" text-anchor="middle" opacity="0.7">報告汪 reportwang.com</text>
</svg>
