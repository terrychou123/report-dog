<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- 標題 -->
  <text x="400" y="50" font-size="26" fill="#1e293b" text-anchor="middle" font-weight="700" >E 區創新與 F 加分題總覽</text>
  <!-- N=4: H=62, outer_gap=50, Header y=50, Row y: 160/235/310/385 -->
  <!-- Row 1 E2 -->
  <rect x="50" y="145" width="700" height="62" rx="8" fill="#ffffff"/>
  <rect x="50" y="145" width="6" height="62" rx="3" fill="#9333ea"/>
  <circle cx="85" cy="176" r="16" fill="#9333ea"/>
  <text x="85" y="182" font-size="14" fill="#9333ea" text-anchor="middle" font-weight="700" >E2</text>
  <text x="118" y="169" font-size="17" fill="#1e293b" font-weight="700" >E2. 創新或配合政策執行（最高 +2 分）</text>
  <text x="118" y="191" font-size="14" fill="#57534e" >提供創新或特色照護服務，或配合政策試辦計畫，每項 +0.5 分，最多加 2 分</text>
  <rect x="570" y="153" width="168" height="46" rx="6" fill="#9333ea" opacity="0.10"/>
  <text x="654" y="181" font-size="14" fill="#9333ea" text-anchor="middle" font-weight="600" >最高 +2 分</text>
  <!-- Row 2 F1 -->
  <rect x="50" y="220" width="700" height="62" rx="8" fill="#ffffff"/>
  <rect x="50" y="220" width="6" height="62" rx="2" fill="#d97706"/>
  <circle cx="85" cy="251" r="16" fill="#d97706" opacity="0.15"/>
  <text x="85" y="257" font-size="14" fill="#d97706" text-anchor="middle" font-weight="700" >F1</text>
  <text x="118" y="244" font-size="17" fill="#1e293b" font-weight="700" >F1. 訂有住民牙科診療機制（+1 分）</text>
  <text x="118" y="266" font-size="14" fill="#57534e" >制定牙科診療機制及作業流程，對有需求住民持續協助完成並追蹤</text>
  <rect x="570" y="228" width="168" height="46" rx="6" fill="#d97706" opacity="0.10"/>
  <text x="654" y="256" font-size="14" fill="#d97706" text-anchor="middle" font-weight="600" >+1 分</text>
  <!-- Row 3 F2 -->
  <rect x="50" y="295" width="700" height="62" rx="8" fill="#ffffff"/>
  <rect x="50" y="295" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="85" cy="326" r="16" fill="#78716c" opacity="0.15"/>
  <text x="85" y="332" font-size="14" fill="#78716c" text-anchor="middle" font-weight="700" >F2</text>
  <text x="118" y="319" font-size="17" fill="#1e293b" font-weight="700" >F2. 加入倡導人間懷服務（+0.5 分）</text>
  <text x="118" y="341" font-size="14" fill="#57534e" >定期盤點無家屬或孤立住民，配合倡導關懷人每月 2 次定期拜訪並留有紀錄</text>
  <rect x="570" y="303" width="168" height="46" rx="6" fill="#78716c" opacity="0.10"/>
  <text x="654" y="331" font-size="14" fill="#78716c" text-anchor="middle" font-weight="600" >+0.5 分</text>
  <!-- Row 4 F3 -->
  <rect x="50" y="370" width="700" height="62" rx="8" fill="#ffffff"/>
  <rect x="50" y="370" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="85" cy="401" r="16" fill="#57534e" opacity="0.15"/>
  <text x="85" y="407" font-size="14" fill="#57534e" text-anchor="middle" font-weight="700" >F3</text>
  <text x="118" y="394" font-size="17" fill="#1e293b" font-weight="700" >F3. 提供視聽覺障礙者逃生資訊（+0.5 分）</text>
  <text x="118" y="416" font-size="14" fill="#57534e" >逃生圖設有點字/語音導引，出入口安裝閃光警示燈，現場實務觀察評估</text>
  <rect x="570" y="378" width="168" height="46" rx="6" fill="#57534e" opacity="0.10"/>
  <text x="654" y="406" font-size="14" fill="#57534e" text-anchor="middle" font-weight="600" >+0.5 分</text>
  <!-- 加總標示 -->
  <rect x="50" y="448" width="700" height="36" rx="8" fill="#d97706" opacity="0.08"/>
  <text x="400" y="472" font-size="16" fill="#d97706" text-anchor="middle" font-weight="700" >E2 + F1 + F2 + F3 = 最高加 4 分（優等多一道保險）</text>
  <!-- 浮水印 -->
  <text x="760" y="492" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" >報告汪 reportwang.com</text>
</svg>