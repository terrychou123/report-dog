<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- Header (N=5) -->
  <rect x="29" y="29" width="742" height="76" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="400" y="68" font-size="22" fill="#1e293b" font-weight="700" text-anchor="middle" font-family="sans-serif">個案服務計畫必備 5 大要素</text>
  <text x="400" y="92" font-size="15" fill="#57534e" text-anchor="middle" font-family="sans-serif">評鑑委員抽查 5 份個案資料，這 5 要素缺一不可</text>

  <!-- Row 1 -->
  <rect x="29" y="118" width="742" height="60" rx="8" fill="#ffffff"/>
  <rect x="29" y="118" width="6" height="60" rx="3" fill="#d97706"/>
  <circle cx="66" cy="148" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="154" font-size="16" fill="#d97706" font-weight="700" text-anchor="middle" font-family="sans-serif">1</text>
  <text x="100" y="140" font-size="16" fill="#1e293b" font-weight="700" font-family="sans-serif">多專業評估紀錄</text>
  <text x="100" y="160" font-size="14" fill="#57534e" font-family="sans-serif">護理、社工、照服員各自完成評估並簽名，入住 72 小時內完成</text>
  <rect x="620" y="125" width="136" height="46" rx="6" fill="#d97706" opacity="0.12"/>
  <text x="688" y="149" font-size="14" fill="#d97706" font-weight="700" text-anchor="middle" font-family="sans-serif">必要文件</text>
  <text x="688" y="165" font-size="13" fill="#d97706" text-anchor="middle" font-family="sans-serif">各職類簽名</text>

  <!-- Row 2 -->
  <rect x="29" y="191" width="742" height="60" rx="8" fill="#ffffff"/>
  <rect x="29" y="191" width="6" height="60" rx="3" fill="#78716c"/>
  <circle cx="66" cy="221" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="227" font-size="16" fill="#78716c" font-weight="700" text-anchor="middle" font-family="sans-serif">2</text>
  <text x="100" y="213" font-size="16" fill="#1e293b" font-weight="700" font-family="sans-serif">個別化照護目標</text>
  <text x="100" y="233" font-size="14" fill="#57534e" font-family="sans-serif">載明短期/長期目標及家屬期望，具體可測量（如：增加步行距離）</text>
  <rect x="620" y="198" width="136" height="46" rx="6" fill="#78716c" opacity="0.12"/>
  <text x="688" y="222" font-size="14" fill="#78716c" font-weight="700" text-anchor="middle" font-family="sans-serif">SMART目標</text>
  <text x="688" y="238" font-size="13" fill="#78716c" text-anchor="middle" font-family="sans-serif">可量測</text>

  <!-- Row 3 -->
  <rect x="29" y="264" width="742" height="60" rx="8" fill="#ffffff"/>
  <rect x="29" y="264" width="6" height="60" rx="3" fill="#57534e"/>
  <circle cx="66" cy="294" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="300" font-size="16" fill="#57534e" font-weight="700" text-anchor="middle" font-family="sans-serif">3</text>
  <text x="100" y="286" font-size="16" fill="#1e293b" font-weight="700" font-family="sans-serif">服務措施與頻率</text>
  <text x="100" y="306" font-size="14" fill="#57534e" font-family="sans-serif">各職類負責項目、執行頻率（每日/每週）明確載明</text>
  <rect x="620" y="271" width="136" height="46" rx="6" fill="#57534e" opacity="0.12"/>
  <text x="688" y="295" font-size="14" fill="#57534e" font-weight="700" text-anchor="middle" font-family="sans-serif">明確分工</text>
  <text x="688" y="311" font-size="13" fill="#57534e" text-anchor="middle" font-family="sans-serif">頻率清楚</text>

  <!-- Row 4 -->
  <rect x="29" y="337" width="742" height="60" rx="8" fill="#ffffff"/>
  <rect x="29" y="337" width="6" height="60" rx="3" fill="#a8a29e"/>
  <circle cx="66" cy="367" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="373" font-size="16" fill="#a8a29e" font-weight="700" text-anchor="middle" font-family="sans-serif">4</text>
  <text x="100" y="359" font-size="16" fill="#1e293b" font-weight="700" font-family="sans-serif">執行與評值記錄</text>
  <text x="100" y="379" font-size="14" fill="#57534e" font-family="sans-serif">每月記錄服務執行進度，並載明評值結果（達成/未達/調整）</text>
  <rect x="620" y="344" width="136" height="46" rx="6" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="368" font-size="14" fill="#a8a29e" font-weight="700" text-anchor="middle" font-family="sans-serif">月度記錄</text>
  <text x="688" y="384" font-size="13" fill="#a8a29e" text-anchor="middle" font-family="sans-serif">評值結果</text>

  <!-- Row 5 -->
  <rect x="29" y="410" width="742" height="60" rx="8" fill="#ffffff"/>
  <rect x="29" y="410" width="6" height="60" rx="3" fill="#94a3b8"/>
  <circle cx="66" cy="440" r="16" fill="#94a3b8" opacity="0.15"/>
  <text x="66" y="446" font-size="16" fill="#94a3b8" font-weight="700" text-anchor="middle" font-family="sans-serif">5</text>
  <text x="100" y="432" font-size="16" fill="#1e293b" font-weight="700" font-family="sans-serif">家屬討論修正紀錄</text>
  <text x="100" y="452" font-size="14" fill="#57534e" font-family="sans-serif">半年至少 1 次與家屬共同修正計畫，需有家屬簽名及會議紀錄</text>
  <rect x="620" y="417" width="136" height="46" rx="6" fill="#94a3b8" opacity="0.12"/>
  <text x="688" y="441" font-size="14" fill="#94a3b8" font-weight="700" text-anchor="middle" font-family="sans-serif">半年一次</text>
  <text x="688" y="457" font-size="13" fill="#94a3b8" text-anchor="middle" font-family="sans-serif">家屬簽名</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" font-family="sans-serif">報告汪 reportwang.com</text>
</svg>
