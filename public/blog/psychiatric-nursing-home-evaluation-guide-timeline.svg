<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <text x="40" y="48" font-size="32" font-weight="bold" fill="#1e293b" font-family="'Noto Sans TC', sans-serif">評鑑準備三階段時間軸</text>
  <text x="40" y="78" font-size="22" fill="#57534e" font-family="'Noto Sans TC', sans-serif">從評鑑前3個月到評鑑日的完整準備路徑</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#dedad3" stroke-width="2"/>

  <!-- 時程軸主線 -->
  <line x1="100" y1="290" x2="700" y2="290" stroke="#dedad3" stroke-width="4"/>

  <!-- 節點1：評鑑前3個月 -->
  <circle cx="160" cy="290" r="22" fill="#d97706"/>
  <text x="160" y="296" font-size="18" font-weight="bold" fill="white" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">1</text>
  <!-- 節點1上方說明框 -->
  <rect x="60" y="130" width="200" height="120" rx="10" fill="#d97706" opacity="0.12"/>
  <rect x="60" y="130" width="200" height="5" rx="3" fill="#d97706"/>
  <text x="160" y="162" font-size="16" font-weight="bold" fill="#d97706" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">評鑑前3個月</text>
  <text x="160" y="188" font-size="14" fill="#57534e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">盤點文件缺口</text>
  <text x="160" y="210" font-size="14" fill="#57534e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">補強品質監測紀錄</text>
  <line x1="160" y1="250" x2="160" y2="268" stroke="#d97706" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- 節點2：評鑑前1個月 -->
  <circle cx="400" cy="290" r="22" fill="#78716c"/>
  <text x="400" y="296" font-size="18" font-weight="bold" fill="white" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">2</text>
  <!-- 節點2下方說明框 -->
  <rect x="300" y="330" width="200" height="120" rx="10" fill="#78716c" opacity="0.12"/>
  <rect x="300" y="330" width="200" height="5" rx="3" fill="#78716c"/>
  <text x="400" y="362" font-size="16" font-weight="bold" fill="#78716c" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">評鑑前1個月</text>
  <text x="400" y="388" font-size="14" fill="#57534e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">逐條對照36項基準</text>
  <text x="400" y="410" font-size="14" fill="#57534e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">安全設備全面檢查</text>
  <line x1="400" y1="312" x2="400" y2="330" stroke="#78716c" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- 節點3：評鑑前1週 -->
  <circle cx="640" cy="290" r="22" fill="#57534e"/>
  <text x="640" y="296" font-size="18" font-weight="bold" fill="white" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">3</text>
  <!-- 節點3上方說明框 -->
  <rect x="540" y="130" width="200" height="120" rx="10" fill="#57534e" opacity="0.12"/>
  <rect x="540" y="130" width="200" height="5" rx="3" fill="#57534e"/>
  <text x="640" y="162" font-size="16" font-weight="bold" fill="#57534e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">評鑑前1週</text>
  <text x="640" y="188" font-size="14" fill="#57534e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">整理備審資料夾</text>
  <text x="640" y="210" font-size="14" fill="#57534e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">工作人員情境演練</text>
  <line x1="640" y1="250" x2="640" y2="268" stroke="#57534e" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- 品牌浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-family="'Noto Sans TC', sans-serif">報告汪 reportwang.com</text>
</svg>
