<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- Header -->
  <rect x="28" y="16" width="744" height="60" rx="12" fill="#d97706"/>
  <text x="400" y="53"  font-size="20" fill="white" font-weight="700" text-anchor="middle">5 大角色評鑑分工對應表</text>

  <!-- Row 1: 主管/院長 -->
  <rect x="28" y="118" width="744" height="60" rx="12" fill="white"/>
  <rect x="28" y="118" width="6" height="60" rx="2" fill="#d97706"/>
  <circle cx="66" cy="148" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="154"  font-size="12" fill="white" text-anchor="middle" font-weight="700">院長</text>
  <text x="100" y="142"  font-size="15" fill="#1e293b" font-weight="700">主管 / 院長</text>
  <text x="100" y="163"  font-size="13" fill="#57534e">董事會紀錄（項目 1）、整體協調、財務管理（項目 29）</text>
  <rect x="660" y="125" width="100" height="46" rx="8" fill="#fef3c7"/>
  <text x="710" y="145"  font-size="12" fill="#d97706" text-anchor="middle" font-weight="700">壹 + 肆</text>
  <text x="710" y="162"  font-size="11" fill="#d97706" text-anchor="middle">統籌負責</text>

  <!-- Row 2: 社工 -->
  <rect x="28" y="191" width="744" height="60" rx="12" fill="white"/>
  <rect x="28" y="191" width="6" height="60" rx="2" fill="#78716c"/>
  <circle cx="66" cy="221" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="227"  font-size="12" fill="white" text-anchor="middle" font-weight="700">社工</text>
  <text x="100" y="215"  font-size="15" fill="#1e293b" font-weight="700">社工</text>
  <text x="100" y="236"  font-size="13" fill="#57534e">個案計畫（項目 15, 16, 24）、資源網絡（項目 26）、離院追蹤</text>
  <rect x="660" y="198" width="100" height="46" rx="8" fill="#f5f3f0"/>
  <text x="710" y="218"  font-size="12" fill="#78716c" text-anchor="middle" font-weight="700">參 為主</text>
  <text x="710" y="235"  font-size="11" fill="#78716c" text-anchor="middle">最多項目</text>

  <!-- Row 3: 生輔員 -->
  <rect x="28" y="264" width="744" height="60" rx="12" fill="white"/>
  <rect x="28" y="264" width="6" height="60" rx="2" fill="#57534e"/>
  <circle cx="66" cy="294" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="300"  font-size="12" fill="white" text-anchor="middle" font-weight="700">輔員</text>
  <text x="100" y="288"  font-size="15" fill="#1e293b" font-weight="700">生輔員</text>
  <text x="100" y="309"  font-size="13" fill="#57534e">日誌、交班（項目 15）、在院生活輔導（項目 22）</text>
  <rect x="660" y="271" width="100" height="46" rx="8" fill="#f5f3f0"/>
  <text x="710" y="291"  font-size="12" fill="#57534e" text-anchor="middle" font-weight="700">每日執行</text>
  <text x="710" y="308"  font-size="11" fill="#57534e" text-anchor="middle">現場觀察</text>

  <!-- Row 4: 行政 -->
  <rect x="28" y="337" width="744" height="60" rx="12" fill="white"/>
  <rect x="28" y="337" width="6" height="60" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="367" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="373"  font-size="12" fill="white" text-anchor="middle" font-weight="700">行政</text>
  <text x="100" y="361"  font-size="15" fill="#1e293b" font-weight="700">行政人員</text>
  <text x="100" y="382"  font-size="13" fill="#57534e">人事記錄（項目 3, 4, 5）、訓練紀錄（項目 5）、財務文件（項目 29）</text>
  <rect x="660" y="344" width="100" height="46" rx="8" fill="#f5f3f0"/>
  <text x="710" y="364"  font-size="12" fill="#a8a29e" text-anchor="middle" font-weight="700">壹 + 肆</text>
  <text x="710" y="381"  font-size="11" fill="#a8a29e" text-anchor="middle">文件管理</text>

  <!-- Row 5: 督導 -->
  <rect x="28" y="410" width="744" height="60" rx="12" fill="white"/>
  <rect x="28" y="410" width="6" height="60" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="440" r="16" fill="#94a3b8" opacity="0.15"/>
  <text x="66" y="446"  font-size="12" fill="white" text-anchor="middle" font-weight="700">督導</text>
  <text x="100" y="434"  font-size="15" fill="#1e293b" font-weight="700">督導</text>
  <text x="100" y="455"  font-size="13" fill="#57534e">個案研討（項目 28）、督導紀錄（項目 28）、品質把關</text>
  <rect x="660" y="417" width="100" height="46" rx="8" fill="#f5f3f0"/>
  <text x="710" y="437"  font-size="12" fill="#94a3b8" text-anchor="middle" font-weight="700">項目 28</text>
  <text x="710" y="454"  font-size="11" fill="#94a3b8" text-anchor="middle">品質保證</text>

  <!-- Watermark -->
  <text x="760" y="480"  font-size="16" fill="#d97706" text-anchor="end">報告汪 reportwang.com</text>
</svg>
