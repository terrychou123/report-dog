<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 右側裝飾區塊 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>

  <!-- 右側大文字 B1.3 -->
  <text x="1010" y="195" font-size="120" font-weight="900" fill="#16a34a" text-anchor="middle" opacity="0.85">B1.3</text>
  <text x="1010" y="237" font-size="26" fill="#78716c" text-anchor="middle" font-weight="600">親子關係促進</text>

  <!-- 右側查核項目卡片 -->
  <rect x="840" y="260" width="320" height="56" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="858" y="288" font-size="22" fill="#16a34a" font-weight="700">肌膚接觸指導</text>
  <text x="1025" y="288" font-size="20" fill="#57534e">含產婦選擇記錄</text>

  <rect x="840" y="322" width="320" height="56" rx="10" fill="#16a34a" opacity="0.10" stroke="#e8e5de" stroke-width="1"/>
  <text x="858" y="350" font-size="22" fill="#16a34a" font-weight="700">家屬參與嬰兒照護</text>
  <text x="1055" y="350" font-size="20" fill="#57534e">技能指導</text>

  <rect x="840" y="384" width="320" height="56" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="858" y="412" font-size="22" fill="#d97706" font-weight="700">回覆示教</text>
  <text x="960" y="412" font-size="20" fill="#57534e">每位 2–3 項必填</text>

  <!-- 右側趨勢說明 -->
  <rect x="840" y="450" width="320" height="58" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="1000" y="468" font-size="22" fill="#d97706" text-anchor="middle" font-weight="700">同室率 37.4% → 21.1%</text>
  <text x="1000" y="492" font-size="19" fill="#78716c" text-anchor="middle">下滑趨勢是現實，記錄才是關鍵</text>

  <!-- 右側底部 -->
  <rect x="840" y="518" width="320" height="52" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="1000" y="550" font-size="20" fill="#57534e" text-anchor="middle">積極指導 + 尊重選擇 + 留下記錄</text>

  <rect x="840" y="576" width="320" height="40" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="1000" y="602" font-size="20" fill="#57534e" text-anchor="middle">才是 B1.3 高分的正確路徑</text>

  <!-- 左側主標題 -->
  <text x="60" y="162" font-size="88" font-weight="900" fill="#1e293b">親子同室</text>
  <text x="60" y="260" font-size="88" font-weight="900" fill="#16a34a">推不動？</text>

  <line x1="60" y1="292" x2="780" y2="292" stroke="#dedad3" stroke-width="2"/>

  <text x="60" y="338" font-size="32" fill="#57534e" font-weight="400">B1.3 · 肌膚接觸與家庭參與的紀錄技巧</text>

  <!-- 特色標籤列 -->
  <rect x="60" y="366" width="188" height="52" rx="10" fill="#16a34a" opacity="0.10"/>
  <text x="154" y="401" font-size="26" fill="#16a34a" text-anchor="middle" font-weight="600">肌膚接觸</text>

  <rect x="260" y="366" width="188" height="52" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="354" y="401" font-size="26" fill="#d97706" text-anchor="middle" font-weight="600">家屬參與</text>

  <rect x="460" y="366" width="188" height="52" rx="10" fill="#78716c" opacity="0.12"/>
  <text x="554" y="401" font-size="26" fill="#78716c" text-anchor="middle" font-weight="600">回覆示教</text>

  <!-- 適用對象 -->
  <text x="60" y="452" font-size="28" fill="#94a3b8">護產人員 · 護理主管 · 月子中心管理團隊</text>

  <!-- 底部說明 -->
  <text x="60" y="500" font-size="30" fill="#57534e" font-weight="500">產婦拒絕同室，B1.3 仍可以拿高分</text>
  <text x="60" y="538" font-size="26" fill="#a8a29e">關鍵在護理師有沒有主動指導，並留下完整記錄</text>

  <!-- 浮水印 -->
  <text x="780" y="585" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
