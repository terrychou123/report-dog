<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- 標題 -->
  <text x="400" y="48" font-size="32" fill="#1e293b" text-anchor="middle" font-weight="700">C9 消防安全 4 大核心要求</text>
  <text x="400" y="78" font-size="22" fill="#78716c" text-anchor="middle">一級必要指標 · 逐項確認佐證文件</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#d97706" stroke-width="2"/>

  <!-- 標題列背景 -->
  <rect x="0" y="29" width="800" height="60" fill="white"/>
  <rect x="0" y="29" width="6" height="60" fill="#d97706" rx="2"/>

  <!-- 列 1：半年消防檢修 -->
  <rect x="28" y="118" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="118" width="6" height="60" rx="2" fill="#d97706"/>
  <circle cx="70" cy="148" r="16" fill="#d97706" opacity="0.15"/>
  <text x="70" y="154" font-size="20" fill="white" text-anchor="middle" font-weight="700">1</text>
  <text x="105" y="142" font-size="14" fill="#1e293b" font-weight="600">每半年委託消防設備師（士）辦理消防安全設備檢修申報</text>
  <text x="105" y="162" font-size="14" fill="#57534e">須留存申報書與檢修紀錄，建議保存至少 3 年備查</text>
  <rect x="620" y="126" width="136" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="140" font-size="13" fill="#d97706" text-anchor="middle" font-weight="600">佐證文件</text>
  <text x="688" y="158" font-size="12" fill="#78716c" text-anchor="middle">消防申報書×2</text>

  <!-- 列 2：每月用電檢查 -->
  <rect x="28" y="191" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="191" width="6" height="60" rx="2" fill="#78716c"/>
  <circle cx="70" cy="221" r="16" fill="#78716c" opacity="0.15"/>
  <text x="70" y="227" font-size="20" fill="white" text-anchor="middle" font-weight="700">2</text>
  <text x="105" y="215" font-size="14" fill="#1e293b" font-weight="600">每月自主用電安全檢查</text>
  <text x="105" y="235" font-size="14" fill="#57534e">須有書面記錄，涵蓋延長線、電器設備、配電盤等，不得回溯補填</text>
  <rect x="620" y="199" width="136" height="46" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="213" font-size="13" fill="#78716c" text-anchor="middle" font-weight="600">佐證文件</text>
  <text x="688" y="231" font-size="12" fill="#78716c" text-anchor="middle">月度檢查表×12</text>

  <!-- 列 3：防火管理人資格 -->
  <rect x="28" y="264" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="264" width="6" height="60" rx="2" fill="#57534e"/>
  <circle cx="70" cy="294" r="16" fill="#57534e" opacity="0.15"/>
  <text x="70" y="300" font-size="20" fill="white" text-anchor="middle" font-weight="700">3</text>
  <text x="105" y="288" font-size="14" fill="#1e293b" font-weight="600">防火管理人資格限制</text>
  <text x="105" y="308" font-size="14" fill="#57534e">不得由社工、醫事人員或照服員兼任，須取得消防局核准資格證書</text>
  <rect x="620" y="272" width="136" height="46" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="286" font-size="13" fill="#57534e" text-anchor="middle" font-weight="600">佐證文件</text>
  <text x="688" y="304" font-size="12" fill="#78716c" text-anchor="middle">資格證書影本</text>

  <!-- 列 4：EOP與演練 -->
  <rect x="28" y="337" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="337" width="6" height="60" rx="2" fill="#94a3b8"/>
  <circle cx="70" cy="367" r="16" fill="#94a3b8" opacity="0.15"/>
  <text x="70" y="373" font-size="20" fill="white" text-anchor="middle" font-weight="700">4</text>
  <text x="105" y="361" font-size="14" fill="#1e293b" font-weight="600">防火管理人執行職責紀錄</text>
  <text x="105" y="381" font-size="14" fill="#57534e">須有定期執行消防相關工作的書面紀錄，評鑑委員會詢問職責內容</text>
  <rect x="620" y="345" width="136" height="46" rx="8" fill="#94a3b8" opacity="0.12"/>
  <text x="688" y="359" font-size="13" fill="#57534e" text-anchor="middle" font-weight="600">佐證文件</text>
  <text x="688" y="377" font-size="12" fill="#78716c" text-anchor="middle">執行紀錄彙整</text>

  <!-- 警示框 -->
  <rect x="28" y="415" width="744" height="50" rx="10" fill="#d97706" opacity="0.1" stroke="#d97706" stroke-width="1"/>
  <text x="400" y="435" font-size="14" fill="#d97706" text-anchor="middle" font-weight="600">⚠ 重要提醒</text>
  <text x="400" y="453" font-size="13" fill="#57534e" text-anchor="middle">每月用電檢查紀錄須持續累積，評鑑前補填將被認定為無效佐證</text>

  <!-- 水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
