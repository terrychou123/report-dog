<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題列 -->
  <rect x="30" y="50" width="740" height="62" rx="10" fill="#2563eb"/>
  <text x="400" y="89" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="700" >D8 緩和醫療與臨終照護 4 大要求</text>

  <!-- Row 1 (N=4: y=160) -->
  <rect x="30" y="160" width="740" height="62" rx="8" fill="#ffffff"/>
  <rect x="30" y="160" width="6" height="62" rx="2" fill="#d97706"/>
  <circle cx="66" cy="191" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="197" font-size="14" fill="#d97706" text-anchor="middle" font-weight="700" >1</text>
  <text x="100" y="183" font-size="20" fill="#1e293b" font-weight="700" >護理及社工完成安寧療護教育訓練</text>
  <text x="100" y="207" font-size="16" fill="#57534e" >護理人員與社工人員均須完成安寧療護及病人自主權利法相關教育訓練，並有完訓證明</text>
  <rect x="620" y="168" width="136" height="46" rx="8" fill="#eff6ff" opacity="0.12"/>
  <text x="688" y="196" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="600" >完訓證明備查</text>

  <!-- Row 2 (y=235) -->
  <rect x="30" y="235" width="740" height="62" rx="8" fill="#ffffff"/>
  <rect x="30" y="235" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="66" cy="266" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="272" font-size="14" fill="#78716c" text-anchor="middle" font-weight="700" >2</text>
  <text x="100" y="258" font-size="20" fill="#1e293b" font-weight="700" >提供 DNR 共識討論機制</text>
  <text x="100" y="282" font-size="16" fill="#57534e" >訂有鼓勵服務對象或家屬針對DNR共同討論共識決定的機制，並有實際討論紀錄</text>
  <rect x="620" y="243" width="136" height="46" rx="8" fill="#fef9c3" opacity="0.12"/>
  <text x="688" y="271" font-size="15" fill="#78716c" text-anchor="middle" font-weight="600" >討論紀錄留存</text>

  <!-- Row 3 (y=310) -->
  <rect x="30" y="310" width="740" height="62" rx="8" fill="#ffffff"/>
  <rect x="30" y="310" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="66" cy="341" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="347" font-size="14" fill="#57534e" text-anchor="middle" font-weight="700" >3</text>
  <text x="100" y="333" font-size="20" fill="#1e293b" font-weight="700" >已簽/未簽 DNR 各有作業流程</text>
  <text x="100" y="357" font-size="16" fill="#57534e" >分別訂定已簽訂及未簽訂DNR的處理作業流程，且有實際案例佐證執行情形</text>
  <rect x="620" y="318" width="136" height="46" rx="8" fill="#f0fdf4" opacity="0.12"/>
  <text x="688" y="346" font-size="15" fill="#57534e" text-anchor="middle" font-weight="600" >流程+案例雙備</text>

  <!-- Row 4 (y=385) -->
  <rect x="30" y="385" width="740" height="62" rx="8" fill="#ffffff"/>
  <rect x="30" y="385" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="416" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="422" font-size="14" fill="#a8a29e" text-anchor="middle" font-weight="700" >4</text>
  <text x="100" y="408" font-size="20" fill="#1e293b" font-weight="700" >臨終照護手冊與喪葬協助紀錄</text>
  <text x="100" y="432" font-size="16" fill="#57534e" >提供家屬臨終照護關懷手冊或流程說明，並有協助家屬處理喪葬事宜的完整紀錄</text>
  <rect x="620" y="393" width="136" height="46" rx="8" fill="#fef3c7" opacity="0.12"/>
  <text x="688" y="421" font-size="15" fill="#a8a29e" text-anchor="middle" font-weight="600" >手冊+紀錄備審</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" >報告汪 reportwang.com</text>
</svg>
