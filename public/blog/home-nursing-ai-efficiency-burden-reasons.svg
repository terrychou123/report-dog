<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <rect x="0" y="50" width="800" height="76" fill="white"/>
  <rect x="0" y="50" width="6" height="76" rx="2" fill="#d97706"/>
  <text x="28" y="104" font-size="36" fill="#1e293b" font-weight="700">文書負擔沉重的兩大結構原因</text>
  <rect x="28" y="175" width="744" height="140" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="175" width="6" height="140" rx="2" fill="#78716c"/>
  <circle cx="66" cy="230" r="20" fill="#d97706" opacity="0.15"/>
  <text x="66" y="236" font-size="18" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <text x="100" y="220" font-size="24" fill="#1e293b" font-weight="700">評鑑要求持續增加</text>
  <text x="100" y="246" font-size="16" fill="#57534e">A1–A5、B1–B3 共 8 項基準，每項有多個子條件</text>
  <text x="100" y="266" font-size="16" fill="#57534e">品質指標季報、照護計畫、手冊辦法、合作協議…每份都要時間</text>
  <text x="100" y="290" font-size="16" fill="#57534e">評鑑每 4 年一次，但文件需要日常持續維護才能達標</text>
  <rect x="620" y="183" width="136" height="125" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="224" font-size="16" fill="#d97706" text-anchor="middle">評鑑</text>
  <text x="688" y="244" font-size="16" fill="#d97706" text-anchor="middle">8 項</text>
  <text x="688" y="264" font-size="16" fill="#d97706" text-anchor="middle">基準</text>
  <rect x="28" y="330" width="744" height="120" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="330" width="6" height="120" rx="2" fill="#57534e"/>
  <circle cx="66" cy="385" r="20" fill="#78716c" opacity="0.15"/>
  <text x="66" y="391" font-size="18" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <text x="100" y="375" font-size="24" fill="#1e293b" font-weight="700">個案數增加但護理師數不變</text>
  <text x="100" y="401" font-size="16" fill="#57534e">長照需求持續成長，每位護理師的個案量增加</text>
  <text x="100" y="421" font-size="16" fill="#57534e">每增加一位個案，就多一份訪視記錄和照護計畫更新</text>
  <rect x="620" y="338" width="136" height="105" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="386" font-size="16" fill="#78716c" text-anchor="middle">個案增</text>
  <text x="688" y="406" font-size="16" fill="#78716c" text-anchor="middle">人力不增</text>
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
