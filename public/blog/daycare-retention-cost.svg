<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="450" fill="#f0efe8"/>
  <text x="400" y="46" font-size="21" font-weight="700" fill="#1e293b" text-anchor="middle">第 30 條留任率計算解析</text>
  <rect x="60" y="58" width="48" height="3" rx="1.5" fill="#d97706"/>
  <line x1="116" y1="59.5" x2="740" y2="59.5" stroke="#dedad3" stroke-width="1"/>

  <!-- Formula card -->
  <rect x="52" y="80" width="696" height="72" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="52" y="80" width="696" height="5" rx="2.5" fill="#d97706"/>
  <text x="400" y="115" font-size="18" font-weight="700" fill="#1e293b" text-anchor="middle">留任率 = 年底在職人數 ÷ （年初在職人數 + 全年新進人數）× 100%</text>
  <text x="400" y="140" font-size="12" fill="#64748b" text-anchor="middle">115 年評鑑看的是：111、112、113、114 年度的留任率平均值</text>

  <!-- 3 exclusion items -->
  <rect x="52" y="170" width="210" height="130" rx="12" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="52" y="170" width="210" height="5" rx="2.5" fill="#d97706"/>
  <text x="157" y="200" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">排除情形 1</text>
  <text x="157" y="224" font-size="13" fill="#d97706" text-anchor="middle" font-weight="700">死亡離職</text>
  <text x="157" y="248" font-size="12" fill="#64748b" text-anchor="middle">不計入分子</text>
  <text x="157" y="268" font-size="12" fill="#64748b" text-anchor="middle">也不計入分母</text>

  <rect x="295" y="170" width="210" height="130" rx="12" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="295" y="170" width="210" height="5" rx="2.5" fill="#78716c"/>
  <text x="400" y="200" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">排除情形 2</text>
  <text x="400" y="224" font-size="13" fill="#78716c" text-anchor="middle" font-weight="700">退休離職</text>
  <text x="400" y="248" font-size="12" fill="#64748b" text-anchor="middle">不計入分子</text>
  <text x="400" y="268" font-size="12" fill="#64748b" text-anchor="middle">也不計入分母</text>

  <rect x="538" y="170" width="210" height="130" rx="12" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="538" y="170" width="210" height="5" rx="2.5" fill="#a8a29e"/>
  <text x="643" y="200" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">排除情形 3</text>
  <text x="643" y="224" font-size="13" fill="#78716c" text-anchor="middle" font-weight="700">到職未滿 3 個月即離職</text>
  <text x="643" y="248" font-size="12" fill="#64748b" text-anchor="middle">不計入分子</text>
  <text x="643" y="268" font-size="12" fill="#64748b" text-anchor="middle">也不計入分母</text>

  <!-- Example -->
  <rect x="52" y="316" width="696" height="90" rx="12" fill="white" stroke="#d97706" stroke-width="1.5" opacity="0.7"/>
  <text x="72" y="342" font-size="13" font-weight="700" fill="#1e293b">計算範例（第 30 條）</text>
  <text x="72" y="364" font-size="12" fill="#78716c">年初 10 人，其中 1 人死亡、1 人退休、1 人試用 2 個月離職 → 計算基礎為 7 人</text>
  <text x="72" y="384" font-size="12" fill="#d97706" font-weight="600">若 6 人留任 → 留任率 = 6 ÷ 7 ≈ 85.7%（這 3 人不拉低留任率）</text>

  <text x="760" y="421" font-size="16" fill="#c4bfb8" text-anchor="end" font-weight="400" font-family="'Noto Sans TC', sans-serif">報告汪 reportwang.com</text>
</svg>
