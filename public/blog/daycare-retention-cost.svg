<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"
     font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- Header（y=38, h=90）N=3 -->
  <rect x="0" y="38" width="800" height="90" fill="white"/>
  <rect x="0" y="38" width="6" height="90" fill="#d97706" rx="2"/>
  <text x="28" y="99" font-size="38" fill="#1e293b" font-weight="700">第 30 條留任率計算與評鑑標準</text>

  <!-- ===== Row 1（y=166）H=90 #d97706 計算公式 ===== -->
  <rect x="28" y="166" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="166" width="6" height="90" rx="2" fill="#d97706"/>
  <circle cx="66" cy="211" r="20" fill="#d97706" opacity="0.15"/>
  <text x="66" y="218" font-size="18" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <text x="100" y="205" font-size="28" fill="#1e293b" font-weight="700">留任率計算公式</text>
  <text x="100" y="235" font-size="18" fill="#57534e">（年底在職人數 ÷ 年初在職人數）× 100%，全職與兼職分開計算</text>
  <rect x="620" y="174" width="136" height="52" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="195" font-size="16" fill="#d97706" text-anchor="middle">全職分開</text>
  <text x="688" y="215" font-size="16" fill="#d97706" text-anchor="middle">計算清楚</text>

  <!-- ===== Row 2（y=269）H=90 #78716c 評鑑標準 ===== -->
  <rect x="28" y="269" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="269" width="6" height="90" rx="2" fill="#78716c"/>
  <circle cx="66" cy="314" r="20" fill="#78716c" opacity="0.15"/>
  <text x="66" y="321" font-size="18" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <text x="100" y="308" font-size="28" fill="#1e293b" font-weight="700">評鑑評分標準</text>
  <text x="100" y="338" font-size="18" fill="#57534e">留任率 70% 以上為合格，80% 以上為優良，低於 70% 為主要缺失</text>
  <rect x="620" y="277" width="136" height="52" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="298" font-size="16" fill="#78716c" text-anchor="middle">70% 合格</text>
  <text x="688" y="318" font-size="16" fill="#78716c" text-anchor="middle">80% 優良</text>

  <!-- ===== Row 3（y=372）H=90 #57534e 加分關鍵 ===== -->
  <rect x="28" y="372" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="372" width="6" height="90" rx="2" fill="#57534e"/>
  <circle cx="66" cy="417" r="20" fill="#57534e" opacity="0.15"/>
  <text x="66" y="424" font-size="18" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <text x="100" y="411" font-size="28" fill="#1e293b" font-weight="700">評鑑加分關鍵</text>
  <text x="100" y="441" font-size="18" fill="#57534e">提供年度留任率趨勢圖表、離職原因分析、改善行動說明</text>
  <rect x="620" y="380" width="136" height="52" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="401" font-size="16" fill="#57534e" text-anchor="middle">趨勢圖表</text>
  <text x="688" y="421" font-size="16" fill="#57534e" text-anchor="middle">主動管理</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
