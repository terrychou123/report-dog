<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 頂部標題區塊 -->
  <rect x="0" y="0" width="800" height="108" rx="0" fill="#1e293b"/>
  <text x="400" y="52"  font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">消防安全評鑑三大失分場景</text>
  <text x="400" y="82"  font-size="14" fill="#a8a29e" text-anchor="middle">形式存在但實質不足，是1.5.2最常見的失分模式</text>

  <!-- 列 1 (y=128, H=90)：夜間演練未辦理 -->
  <rect x="38" y="128" width="724" height="90" rx="10" fill="#fef2f2"/>
  <rect x="38" y="128" width="6" height="90" rx="3" fill="#dc2626"/>
  <circle cx="80" cy="173" r="22" fill="#dc2626"/>
  <text x="80" y="170"  font-size="14" font-weight="700" fill="#dc2626" text-anchor="middle">失分</text>
  <text x="80" y="183"  font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">01</text>
  <text x="118" y="151"  font-size="15" font-weight="700" fill="#dc2626">夜間演練未辦理</text>
  <text x="118" y="172"  font-size="14" fill="#78716c">僅辦理日間演練，誤解「2次演練」可都在日間進行；或雖辦理夜間但</text>
  <text x="118" y="190"  font-size="14" fill="#78716c">時間只到晚上8點，未達大夜班</text>
  <rect x="622" y="149" width="116" height="26" rx="13" fill="#dc2626"/>
  <text x="680" y="167"  font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">夜間缺失</text>
  <text x="118" y="210"  font-size="14" fill="#a8a29e">對策：夜間演練需在大夜班期間（晚上10點後）執行，計畫時即確認時段</text>

  <!-- 列 2 (y=231, H=90)：演練紀錄不完整 -->
  <rect x="38" y="231" width="724" height="90" rx="10" fill="#fef3c7"/>
  <rect x="38" y="231" width="6" height="90" rx="2" fill="#d97706"/>
  <circle cx="80" cy="276" r="22" fill="#d97706" opacity="0.15"/>
  <text x="80" y="273"  font-size="14" font-weight="700" fill="#d97706" text-anchor="middle">失分</text>
  <text x="80" y="286"  font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">02</text>
  <text x="118" y="254"  font-size="15" font-weight="700" fill="#d97706">演練紀錄不完整</text>
  <text x="118" y="275"  font-size="14" fill="#78716c">有辦演練但紀錄缺漏：缺疏散時間、缺問題清單、缺改善追蹤，評鑑</text>
  <text x="118" y="293"  font-size="14" fill="#78716c">委員查核文件時發現</text>
  <rect x="622" y="252" width="116" height="26" rx="13" fill="#d97706"/>
  <text x="680" y="270"  font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">文書缺漏</text>
  <text x="118" y="313"  font-size="14" fill="#a8a29e">對策：使用標準演練紀錄表，演練前確認必填欄位，主管簽核後立即歸檔</text>

  <!-- 列 3 (y=334, H=90)：病人疏散計畫形式化 -->
  <rect x="38" y="334" width="724" height="90" rx="10" fill="#f5f5f4"/>
  <rect x="38" y="334" width="6" height="90" rx="2" fill="#78716c"/>
  <circle cx="80" cy="379" r="22" fill="#78716c" opacity="0.15"/>
  <text x="80" y="376"  font-size="14" font-weight="700" fill="#78716c" text-anchor="middle">失分</text>
  <text x="80" y="389"  font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">03</text>
  <text x="118" y="357"  font-size="15" font-weight="700" fill="#57534e">病人疏散計畫形式化</text>
  <text x="118" y="378"  font-size="14" fill="#78716c">疏散計畫只有文字說明，無逃生路線圖，無臥床病人疏散方式，被實地</text>
  <text x="118" y="396"  font-size="14" fill="#78716c">查核發現護理師不知道如何疏散ICU病人</text>
  <rect x="622" y="355" width="116" height="26" rx="13" fill="#78716c"/>
  <text x="680" y="373"  font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">計畫空洞</text>
  <text x="118" y="416"  font-size="14" fill="#a8a29e">對策：疏散計畫需含路線圖、輔具位置、人員分工，並對護理師進行實際演練</text>

  <!-- 浮水印 -->
  <text x="400" y="480"  font-size="14" fill="#a8a29e" text-anchor="middle" opacity="0.7">報告汪 reportwang.com</text>
</svg>
