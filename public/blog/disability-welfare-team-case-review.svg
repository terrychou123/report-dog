  <text x="688" y="145" font-size="16" fill="#d97706" text-anchor="middle">2次</text>
  <text x="688" y="165" font-size="16" fill="#d97706" text-anchor="middle">年度</text>
  <rect x="28" y="191" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="191" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="66" cy="222" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="228" font-size="14" fill="#78716c" text-anchor="middle" font-weight="900">記錄</text>
  <text x="100" y="212" font-size="18" fill="#1e293b" font-weight="700">議程、紀錄、出席名單留存</text>
  <text x="100" y="233" font-size="16" fill="#57534e">完整記錄研討內容、與會職類及個案討論摘要</text>
  <rect x="620" y="199" width="136" height="46" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="218" font-size="16" fill="#78716c" text-anchor="middle">記錄</text>
  <text x="688" y="238" font-size="16" fill="#78716c" text-anchor="middle">保存</text>
  <rect x="28" y="264" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="264" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="295" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="301" font-size="14" fill="#57534e" text-anchor="middle" font-weight="900">個案</text>
  <text x="100" y="285" font-size="18" fill="#1e293b" font-weight="700">涵蓋不同障礙類型個案</text>
  <text x="100" y="306" font-size="16" fill="#57534e">研討個案應多元，不得每次討論同一類型個案</text>
  <rect x="620" y="272" width="136" height="46" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="291" font-size="16" fill="#57534e" text-anchor="middle">多元</text>
  <text x="688" y="311" font-size="16" fill="#57534e" text-anchor="middle">個案</text>
  <rect x="28" y="337" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="337" width="6" height="62" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="368" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="374" font-size="14" fill="#a8a29e" text-anchor="middle" font-weight="900">結論</text>
