<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 右側裝飾區塊 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>

  <!-- 右側大數字 -->
  <text x="1010" y="230" font-size="180" font-weight="900" fill="#d97706" text-anchor="middle" opacity="0.85">15</text>
  <text x="1010" y="272" font-size="28" fill="#78716c" text-anchor="middle" font-weight="600">個常見問題</text>

  <!-- 右側資訊卡片 2×2 -->
  <rect x="840" y="296" width="155" height="86" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="918" y="333" font-size="26" fill="#d97706" text-anchor="middle" font-weight="700">制度篇</text>
  <text x="918" y="364" font-size="22" fill="#a8a29e" text-anchor="middle">評鑑流程</text>

  <rect x="1005" y="296" width="155" height="86" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="1083" y="333" font-size="26" fill="#78716c" text-anchor="middle" font-weight="700">雙版本</text>
  <text x="1083" y="364" font-size="22" fill="#a8a29e" text-anchor="middle">年齡分組</text>

  <rect x="840" y="392" width="155" height="86" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="918" y="429" font-size="26" fill="#78716c" text-anchor="middle" font-weight="700">文件篇</text>
  <text x="918" y="460" font-size="22" fill="#a8a29e" text-anchor="middle">備審文件</text>

  <rect x="1005" y="392" width="155" height="86" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="1083" y="429" font-size="26" fill="#d97706" text-anchor="middle" font-weight="700">等第篇</text>
  <text x="1083" y="460" font-size="22" fill="#a8a29e" text-anchor="middle">優等條件</text>

  <!-- 右側底部標籤 -->
  <rect x="840" y="490" width="320" height="52" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="1000" y="526" font-size="26" fill="#d97706" text-anchor="middle" font-weight="700">112 年度評鑑 FAQ</text>

  <!-- 左側主內容 -->
  <text x="60" y="200" font-size="120" font-weight="900" fill="#1e293b">評鑑FAQ</text>
  <text x="60" y="338" font-size="120" font-weight="900" fill="#d97706">問答集</text>

  <line x1="60" y1="365" x2="780" y2="365" stroke="#dedad3" stroke-width="2"/>

  <text x="60" y="416" font-size="36" fill="#57534e" font-weight="400">第一次受評最常問的 15 個問題</text>

  <!-- 特色標籤列 -->
  <rect x="60" y="452" width="148" height="54" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="134" y="485" font-size="24" fill="#d97706" text-anchor="middle" font-weight="600">評鑑流程</text>

  <rect x="220" y="452" width="148" height="54" rx="10" fill="#78716c" opacity="0.12"/>
  <text x="294" y="485" font-size="24" fill="#78716c" text-anchor="middle" font-weight="600">雙版本選擇</text>

  <rect x="380" y="452" width="148" height="54" rx="10" fill="#57534e" opacity="0.12"/>
  <text x="454" y="485" font-size="24" fill="#57534e" text-anchor="middle" font-weight="600">文件準備</text>

  <rect x="540" y="452" width="148" height="54" rx="10" fill="#a8a29e" opacity="0.12"/>
  <text x="614" y="485" font-size="24" fill="#a8a29e" text-anchor="middle" font-weight="600">等第條件</text>

  <!-- 適用對象說明 -->
  <text x="60" y="558" font-size="26" fill="#94a3b8">適用：首次受評機構、新進社工師、主任</text>

  <!-- 浮水印 -->
  <text x="1140" y="590" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
