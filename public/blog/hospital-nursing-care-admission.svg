<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#fafaf9" />
  <rect x="0" y="0" width="800" height="64" fill="#1c1917" rx="8" />

  <!-- 標題 -->
  <text x="400" y="40" font-family="'Noto Sans TC', sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">病人入院 24 小時護理評估流程</text>
  <text x="400" y="58" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#a8a29e" text-anchor="middle">4 個步驟確保全面性評估完整記錄（2.3.1 重點條文）</text>

  <!-- 步驟1 -->
  <rect x="30" y="90" width="164" height="340" rx="12" fill="#fffbeb" />
  <rect x="30" y="90" width="164" height="8" rx="4" fill="#d97706" />
  <!-- 步驟圓圈 -->
  <circle cx="112" cy="148" r="28" fill="#d97706" />
  <text x="112" y="141" font-family="'Noto Sans TC', sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">STEP</text>
  <text x="112" y="158" font-family="'Noto Sans TC', sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="900">01</text>
  <!-- 步驟標題 -->
  <text x="112" y="200" font-family="'Noto Sans TC', sans-serif" font-size="17" font-weight="700" fill="#92400e" text-anchor="middle">接收入院</text>
  <!-- 說明 -->
  <text x="112" y="232" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#57534e" text-anchor="middle">確認入院資訊</text>
  <text x="112" y="252" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#57534e" text-anchor="middle">備好評估表單</text>
  <text x="112" y="272" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#57534e" text-anchor="middle">核對醫囑與過敏史</text>
  <!-- Pill -->
  <rect x="52" y="390" width="120" height="28" rx="14" fill="#d97706" />
  <text x="112" y="409" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">入院當下</text>

  <!-- 箭頭1 -->
  <text x="206" y="266" font-family="'Noto Sans TC', sans-serif" font-size="26" fill="#d6d3d1" text-anchor="middle">&#8250;</text>

  <!-- 步驟2 -->
  <rect x="214" y="90" width="164" height="340" rx="12" fill="#f5f5f4" />
  <rect x="214" y="90" width="164" height="8" rx="4" fill="#78716c" />
  <circle cx="296" cy="148" r="28" fill="#78716c" />
  <text x="296" y="141" font-family="'Noto Sans TC', sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">STEP</text>
  <text x="296" y="158" font-family="'Noto Sans TC', sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="900">02</text>
  <text x="296" y="200" font-family="'Noto Sans TC', sans-serif" font-size="17" font-weight="700" fill="#44403c" text-anchor="middle">身體評估</text>
  <text x="296" y="232" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#57534e" text-anchor="middle">生命徵象量測</text>
  <text x="296" y="252" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#57534e" text-anchor="middle">身體系統檢查</text>
  <text x="296" y="272" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#57534e" text-anchor="middle">用藥紀錄確認</text>
  <rect x="236" y="390" width="120" height="28" rx="14" fill="#78716c" />
  <text x="296" y="409" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">2 小時內</text>

  <!-- 箭頭2 -->
  <text x="390" y="266" font-family="'Noto Sans TC', sans-serif" font-size="26" fill="#d6d3d1" text-anchor="middle">&#8250;</text>

  <!-- 步驟3 -->
  <rect x="398" y="90" width="164" height="340" rx="12" fill="#f5f5f4" />
  <rect x="398" y="90" width="164" height="8" rx="4" fill="#57534e" />
  <circle cx="480" cy="148" r="28" fill="#57534e" />
  <text x="480" y="141" font-family="'Noto Sans TC', sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">STEP</text>
  <text x="480" y="158" font-family="'Noto Sans TC', sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="900">03</text>
  <text x="480" y="200" font-family="'Noto Sans TC', sans-serif" font-size="17" font-weight="700" fill="#44403c" text-anchor="middle">風險評估</text>
  <text x="480" y="232" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#57534e" text-anchor="middle">跌倒風險篩選</text>
  <text x="480" y="252" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#57534e" text-anchor="middle">壓傷營養評估</text>
  <text x="480" y="272" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#57534e" text-anchor="middle">疼痛心理篩選</text>
  <rect x="420" y="390" width="120" height="28" rx="14" fill="#57534e" />
  <text x="480" y="409" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">6 小時內</text>

  <!-- 箭頭3 -->
  <text x="574" y="266" font-family="'Noto Sans TC', sans-serif" font-size="26" fill="#d6d3d1" text-anchor="middle">&#8250;</text>

  <!-- 步驟4 -->
  <rect x="582" y="90" width="188" height="340" rx="12" fill="#f5f5f4" />
  <rect x="582" y="90" width="188" height="8" rx="4" fill="#a8a29e" />
  <circle cx="676" cy="148" r="28" fill="#a8a29e" />
  <text x="676" y="141" font-family="'Noto Sans TC', sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">STEP</text>
  <text x="676" y="158" font-family="'Noto Sans TC', sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="900">04</text>
  <text x="676" y="200" font-family="'Noto Sans TC', sans-serif" font-size="17" font-weight="700" fill="#44403c" text-anchor="middle">書面紀錄</text>
  <text x="676" y="232" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#57534e" text-anchor="middle">4 面向完整記錄</text>
  <text x="676" y="252" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#57534e" text-anchor="middle">作為照護計畫依據</text>
  <text x="676" y="272" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#57534e" text-anchor="middle">護理師簽名確認</text>
  <rect x="616" y="390" width="120" height="28" rx="14" fill="#a8a29e" />
  <text x="676" y="409" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">24h 內完成</text>

  <!-- 浮水印 -->
  <text x="400" y="480" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#d6d3d1" text-anchor="middle">報告汪 reportwang.com</text>
</svg>
