<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">115 年度老人福利機構評鑑配分比例</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">6 大區塊 · 77 項基準</text>
  <line x1="28" y1="94" x2="772" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- N=6 list template: H=54, inner_gap=10, pad=31 -->
  <!-- Header y=31 (已用標題代替), Row 1 y=108 開始，但因為有header在上，從108開始 -->
  <!-- Rows: y = 108, 172, 236, 300, 364, 428 -->
  <!-- Bar 區域: x=200 到 x=680 (寬480px), 代表最大 40% -->
  <!-- Scale: 480/40 = 12px/percent -->

  <!-- Row 1: A 經營管理效能 20% → bar=240px, 色 #ea580c -->
  <rect x="28" y="95" width="744" height="54" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="95" width="6" height="54" rx="2" fill="#d97706"/>
  <circle cx="66" cy="122" r="16" fill="#ea580c"/>
  <text x="66" y="128" font-size="16" fill="#ea580c" text-anchor="middle" font-weight="900">A</text>
  <text x="100" y="116" font-size="18" fill="#1e293b" font-weight="700">經營管理效能</text>
  <text x="100" y="137" font-size="16" fill="#57534e">15 項</text>
  <rect x="200" y="108" width="240" height="22" rx="4" fill="#ea580c" opacity="0.75"/>
  <text x="448" y="124" font-size="16" fill="#ea580c" font-weight="700">20%</text>
  <rect x="620" y="106" width="136" height="38" rx="8" fill="#ea580c" opacity="0.12"/>
  <text x="688" y="123" font-size="16" fill="#ea580c" text-anchor="middle">A2 A4</text>
  <text x="688" y="139" font-size="14" fill="#ea580c" text-anchor="middle">二級加強</text>

  <!-- Row 2: B 專業照護品質 40% → bar=480px, 色 #16a34a -->
  <rect x="28" y="159" width="744" height="54" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="159" width="6" height="54" rx="2" fill="#78716c"/>
  <circle cx="66" cy="186" r="16" fill="#16a34a"/>
  <text x="66" y="192" font-size="16" fill="#16a34a" text-anchor="middle" font-weight="900">B</text>
  <text x="100" y="180" font-size="18" fill="#1e293b" font-weight="700">專業照護品質</text>
  <text x="100" y="201" font-size="16" fill="#57534e">31 項</text>
  <rect x="200" y="172" width="480" height="22" rx="4" fill="#16a34a" opacity="0.75"/>
  <text x="688" y="188" font-size="16" fill="#16a34a" font-weight="700">40%</text>
  <rect x="620" y="170" width="136" height="38" rx="8" fill="#16a34a" opacity="0.12"/>
  <text x="688" y="187" font-size="16" fill="#16a34a" text-anchor="middle">B2 B10</text>
  <text x="688" y="203" font-size="14" fill="#16a34a" text-anchor="middle">二級加強</text>

  <!-- Row 3: C 安全環境設備 25% → bar=300px, 色 #0d9488 -->
  <rect x="28" y="223" width="744" height="54" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="223" width="6" height="54" rx="2" fill="#57534e"/>
  <circle cx="66" cy="250" r="16" fill="#0d9488"/>
  <text x="66" y="256" font-size="16" fill="#0d9488" text-anchor="middle" font-weight="900">C</text>
  <text x="100" y="244" font-size="18" fill="#1e293b" font-weight="700">安全環境設備</text>
  <text x="100" y="265" font-size="16" fill="#57534e">16 項</text>
  <rect x="200" y="236" width="300" height="22" rx="4" fill="#0d9488" opacity="0.75"/>
  <text x="508" y="252" font-size="16" fill="#0d9488" font-weight="700">25%</text>
  <rect x="620" y="234" width="136" height="38" rx="8" fill="#0d9488" opacity="0.12"/>
  <text x="688" y="251" font-size="16" fill="#0d9488" text-anchor="middle">6 項必要</text>
  <text x="688" y="267" font-size="14" fill="#0d9488" text-anchor="middle">一級指標</text>

  <!-- Row 4: D 個案權益保障 13% → bar=156px, 色 #2563eb -->
  <rect x="28" y="287" width="744" height="54" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="287" width="6" height="54" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="314" r="16" fill="#2563eb"/>
  <text x="66" y="320" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="900">D</text>
  <text x="100" y="308" font-size="18" fill="#1e293b" font-weight="700">個案權益保障</text>
  <text x="100" y="329" font-size="16" fill="#57534e">9 項</text>
  <rect x="200" y="300" width="156" height="22" rx="4" fill="#2563eb" opacity="0.75"/>
  <text x="364" y="316" font-size="16" fill="#2563eb" font-weight="700">13%</text>
  <rect x="620" y="298" width="136" height="38" rx="8" fill="#2563eb" opacity="0.12"/>
  <text x="688" y="315" font-size="16" fill="#2563eb" text-anchor="middle">D1 D6</text>
  <text x="688" y="331" font-size="14" fill="#2563eb" text-anchor="middle">二級加強</text>

  <!-- Row 5: E 服務改進創新 2% → bar=24px, 色 #4f46e5 -->
  <rect x="28" y="351" width="744" height="54" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="351" width="6" height="54" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="378" r="16" fill="#4f46e5"/>
  <text x="66" y="384" font-size="16" fill="#4f46e5" text-anchor="middle" font-weight="900">E</text>
  <text x="100" y="372" font-size="18" fill="#1e293b" font-weight="700">服務改進創新</text>
  <text x="100" y="393" font-size="16" fill="#57534e">3 項</text>
  <rect x="200" y="364" width="24" height="22" rx="4" fill="#4f46e5" opacity="0.75"/>
  <text x="232" y="380" font-size="16" fill="#4f46e5" font-weight="700">2%</text>
  <rect x="620" y="362" width="136" height="38" rx="8" fill="#4f46e5" opacity="0.12"/>
  <text x="688" y="379" font-size="16" fill="#4f46e5" text-anchor="middle">E2 最多</text>
  <text x="688" y="395" font-size="14" fill="#4f46e5" text-anchor="middle">+2 分</text>

  <!-- Row 6: F 加分題 → bar=50px, 色 #9333ea -->
  <rect x="28" y="415" width="744" height="54" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="415" width="6" height="54" rx="2" fill="#6b7280"/>
  <circle cx="66" cy="442" r="16" fill="#9333ea"/>
  <text x="66" y="448" font-size="16" fill="#9333ea" text-anchor="middle" font-weight="900">F</text>
  <text x="100" y="436" font-size="18" fill="#1e293b" font-weight="700">加分題</text>
  <text x="100" y="457" font-size="16" fill="#57534e">3 項</text>
  <rect x="200" y="428" width="50" height="22" rx="4" fill="#9333ea" opacity="0.75"/>
  <text x="258" y="444" font-size="16" fill="#9333ea" font-weight="700">+2 分</text>
  <rect x="620" y="426" width="136" height="38" rx="8" fill="#9333ea" opacity="0.12"/>
  <text x="688" y="443" font-size="16" fill="#9333ea" text-anchor="middle">F1~F3</text>
  <text x="688" y="459" font-size="14" fill="#9333ea" text-anchor="middle">牙科/關懷/逃生</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
