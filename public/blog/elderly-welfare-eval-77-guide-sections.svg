<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">115 年度老人福利機構評鑑配分比例</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">6 大區塊 · 77 項基準</text>
  <line x1="28" y1="94" x2="772" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- N=6 list template: H=54, inner_gap=10, pad=31 -->
  <!-- Header y=31 (已用標題代替), Row 1 y=108 開始，但因為有header在上，從108開始 -->
  <!-- Rows: y = 108, 172, 236, 300, 364, 428 -->
  <!-- Bar 區域: x=200 到 x=680 (寬480px), 代表最大 40% -->
  <!-- Scale: 480/40 = 12px/percent -->

  <!-- Row 1: A 經營管理效能 20% → bar=240px, 色 #ea580c -->
  <rect x="28" y="108" width="744" height="54" rx="8" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="108" width="6" height="54" rx="2" fill="#ea580c"/>
  <circle cx="66" cy="135" r="16" fill="#ea580c" opacity="0.15"/>
  <text x="66" y="141" font-size="16" fill="#ea580c" text-anchor="middle" font-weight="900">A</text>
  <text x="100" y="129" font-size="18" fill="#1e293b" font-weight="700">經營管理效能</text>
  <text x="100" y="150" font-size="14" fill="#57534e">15 項</text>
  <rect x="200" y="121" width="240" height="22" rx="4" fill="#ea580c" opacity="0.75"/>
  <text x="448" y="137" font-size="16" fill="#ea580c" font-weight="700">20%</text>
  <rect x="620" y="119" width="136" height="38" rx="8" fill="#ea580c" opacity="0.12"/>
  <text x="688" y="136" font-size="16" fill="#ea580c" text-anchor="middle">A2 A4</text>
  <text x="688" y="152" font-size="14" fill="#ea580c" text-anchor="middle">二級加強</text>

  <!-- Row 2: B 專業照護品質 40% → bar=480px, 色 #16a34a -->
  <rect x="28" y="172" width="744" height="54" rx="8" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="172" width="6" height="54" rx="2" fill="#16a34a"/>
  <circle cx="66" cy="199" r="16" fill="#16a34a" opacity="0.15"/>
  <text x="66" y="205" font-size="16" fill="#16a34a" text-anchor="middle" font-weight="900">B</text>
  <text x="100" y="193" font-size="18" fill="#1e293b" font-weight="700">專業照護品質</text>
  <text x="100" y="214" font-size="14" fill="#57534e">31 項</text>
  <rect x="200" y="185" width="480" height="22" rx="4" fill="#16a34a" opacity="0.75"/>
  <text x="688" y="201" font-size="16" fill="#16a34a" font-weight="700">40%</text>
  <rect x="620" y="183" width="136" height="38" rx="8" fill="#16a34a" opacity="0.12"/>
  <text x="688" y="200" font-size="16" fill="#16a34a" text-anchor="middle">B2 B10</text>
  <text x="688" y="216" font-size="14" fill="#16a34a" text-anchor="middle">二級加強</text>

  <!-- Row 3: C 安全環境設備 25% → bar=300px, 色 #0d9488 -->
  <rect x="28" y="236" width="744" height="54" rx="8" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="236" width="6" height="54" rx="2" fill="#0d9488"/>
  <circle cx="66" cy="263" r="16" fill="#0d9488" opacity="0.15"/>
  <text x="66" y="269" font-size="16" fill="#0d9488" text-anchor="middle" font-weight="900">C</text>
  <text x="100" y="257" font-size="18" fill="#1e293b" font-weight="700">安全環境設備</text>
  <text x="100" y="278" font-size="14" fill="#57534e">16 項</text>
  <rect x="200" y="249" width="300" height="22" rx="4" fill="#0d9488" opacity="0.75"/>
  <text x="508" y="265" font-size="16" fill="#0d9488" font-weight="700">25%</text>
  <rect x="620" y="247" width="136" height="38" rx="8" fill="#0d9488" opacity="0.12"/>
  <text x="688" y="264" font-size="16" fill="#0d9488" text-anchor="middle">6 項必要</text>
  <text x="688" y="280" font-size="14" fill="#0d9488" text-anchor="middle">一級指標</text>

  <!-- Row 4: D 個案權益保障 13% → bar=156px, 色 #2563eb -->
  <rect x="28" y="300" width="744" height="54" rx="8" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="300" width="6" height="54" rx="2" fill="#2563eb"/>
  <circle cx="66" cy="327" r="16" fill="#2563eb" opacity="0.15"/>
  <text x="66" y="333" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="900">D</text>
  <text x="100" y="321" font-size="18" fill="#1e293b" font-weight="700">個案權益保障</text>
  <text x="100" y="342" font-size="14" fill="#57534e">9 項</text>
  <rect x="200" y="313" width="156" height="22" rx="4" fill="#2563eb" opacity="0.75"/>
  <text x="364" y="329" font-size="16" fill="#2563eb" font-weight="700">13%</text>
  <rect x="620" y="311" width="136" height="38" rx="8" fill="#2563eb" opacity="0.12"/>
  <text x="688" y="328" font-size="16" fill="#2563eb" text-anchor="middle">D1 D6</text>
  <text x="688" y="344" font-size="14" fill="#2563eb" text-anchor="middle">二級加強</text>

  <!-- Row 5: E 服務改進創新 2% → bar=24px, 色 #4f46e5 -->
  <rect x="28" y="364" width="744" height="54" rx="8" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="364" width="6" height="54" rx="2" fill="#4f46e5"/>
  <circle cx="66" cy="391" r="16" fill="#4f46e5" opacity="0.15"/>
  <text x="66" y="397" font-size="16" fill="#4f46e5" text-anchor="middle" font-weight="900">E</text>
  <text x="100" y="385" font-size="18" fill="#1e293b" font-weight="700">服務改進創新</text>
  <text x="100" y="406" font-size="14" fill="#57534e">3 項</text>
  <rect x="200" y="377" width="24" height="22" rx="4" fill="#4f46e5" opacity="0.75"/>
  <text x="232" y="393" font-size="16" fill="#4f46e5" font-weight="700">2%</text>
  <rect x="620" y="375" width="136" height="38" rx="8" fill="#4f46e5" opacity="0.12"/>
  <text x="688" y="392" font-size="16" fill="#4f46e5" text-anchor="middle">E2 最多</text>
  <text x="688" y="408" font-size="14" fill="#4f46e5" text-anchor="middle">+2 分</text>

  <!-- Row 6: F 加分題 → bar=50px, 色 #9333ea -->
  <rect x="28" y="428" width="744" height="54" rx="8" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="428" width="6" height="54" rx="2" fill="#9333ea"/>
  <circle cx="66" cy="455" r="16" fill="#9333ea" opacity="0.15"/>
  <text x="66" y="461" font-size="16" fill="#9333ea" text-anchor="middle" font-weight="900">F</text>
  <text x="100" y="449" font-size="18" fill="#1e293b" font-weight="700">加分題</text>
  <text x="100" y="470" font-size="14" fill="#57534e">3 項</text>
  <rect x="200" y="441" width="50" height="22" rx="4" fill="#9333ea" opacity="0.75"/>
  <text x="258" y="457" font-size="16" fill="#9333ea" font-weight="700">+2 分</text>
  <rect x="620" y="439" width="136" height="38" rx="8" fill="#9333ea" opacity="0.12"/>
  <text x="688" y="456" font-size="16" fill="#9333ea" text-anchor="middle">F1~F3</text>
  <text x="688" y="472" font-size="14" fill="#9333ea" text-anchor="middle">牙科/關懷/逃生</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
