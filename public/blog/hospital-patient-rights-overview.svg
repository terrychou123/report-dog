<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#fafaf9"/>

  <!-- 標題區 -->
  <rect x="0" y="0" width="800" height="108" fill="#1c1917"/>
  <text x="400" y="52"  font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">2.1章三項必要條文一覽</text>
  <text x="400" y="82"  font-size="14" fill="#a8a29e" text-anchor="middle">醫院評鑑病人及家屬權責 — 評鑑委員查核方式與重點項目</text>

  <!-- 列1（y=130，h=90）-->
  <rect x="28" y="130" width="744" height="90" rx="8" fill="#ffffff" stroke="#e7e5e4" stroke-width="1"/>
  <rect x="28" y="130" width="6" height="90" rx="2" fill="#d97706"/>
  <!-- 左側內容 -->
  <text x="52" y="157"  font-size="15" font-weight="700" fill="#d97706">2.1.1</text>
  <text x="98" y="157"  font-size="15" font-weight="700" fill="#1c1917">病人基本權利保障（必要）</text>
  <text x="52" y="178"  font-size="12" fill="#78716c">資料查核＋訪談</text>
  <text x="52" y="198"  font-size="12" fill="#57534e">病人權利書告知簽收、宗教文化習俗尊重、拒絕治療書面程序</text>
  <!-- 右側標籤 -->
  <rect x="660" y="150" width="88" height="30" rx="15" fill="#fef3c7"/>
  <text x="704" y="170"  font-size="12" font-weight="700" fill="#d97706" text-anchor="middle">訪談查核</text>

  <!-- 列2（y=233，h=90）-->
  <rect x="28" y="233" width="744" height="90" rx="8" fill="#ffffff" stroke="#e7e5e4" stroke-width="1"/>
  <rect x="28" y="233" width="6" height="90" rx="2" fill="#78716c"/>
  <text x="52" y="260"  font-size="15" font-weight="700" fill="#78716c">2.1.2</text>
  <text x="98" y="260"  font-size="15" font-weight="700" fill="#1c1917">知情同意作業（必要）</text>
  <text x="52" y="281"  font-size="12" fill="#78716c">資料查核＋訪談</text>
  <text x="52" y="301"  font-size="12" fill="#57534e">書面同意書、四大必備內容（目的/風險/替代方案/後果）、緊急程序、可撤回告知</text>
  <rect x="660" y="253" width="88" height="30" rx="15" fill="#f5f5f4"/>
  <text x="704" y="273"  font-size="12" font-weight="700" fill="#78716c" text-anchor="middle">四大要件</text>

  <!-- 列3（y=336，h=90）-->
  <rect x="28" y="336" width="744" height="90" rx="8" fill="#ffffff" stroke="#e7e5e4" stroke-width="1"/>
  <rect x="28" y="336" width="6" height="90" rx="2" fill="#57534e"/>
  <text x="52" y="363"  font-size="15" font-weight="700" fill="#57534e">2.1.3</text>
  <text x="98" y="363"  font-size="15" font-weight="700" fill="#1c1917">病人隱私保護（必要）</text>
  <text x="52" y="384"  font-size="12" fill="#78716c">資料查核＋實地查核</text>
  <text x="52" y="404"  font-size="12" fill="#57534e">個資保護法合規、身體隱私措施（拉簾/關門）、病歷查閱授權管控</text>
  <rect x="660" y="356" width="88" height="30" rx="15" fill="#e8e6de"/>
  <text x="704" y="376"  font-size="12" font-weight="700" fill="#57534e" text-anchor="middle">實地查核</text>

  <!-- 浮水印 -->
  <text x="400" y="480"  font-size="12" fill="#a8a29e" text-anchor="middle" opacity="0.6">報告汪 reportwang.com</text>
</svg>
