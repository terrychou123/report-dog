<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 裝飾色塊 -->
  <rect x="0" y="0" width="8" height="630" fill="#d97706"/>
  <rect x="0" y="0" width="1200" height="8" fill="#d97706"/>
  <!-- 左側大數字裝飾 -->
  <text x="80" y="420" font-size="320" fill="#e8e5dc" font-weight="700" opacity="0.6">90</text>
  <!-- 主標題 -->
  <text x="80" y="180" font-size="58" fill="#1e293b" font-weight="700">評鑑前 90 天準備時程表</text>
  <!-- 副標題 -->
  <text x="80" y="248" font-size="32" fill="#d97706" font-weight="600">從手忙腳亂到從容應對</text>
  <!-- 說明文字 -->
  <text x="80" y="310" font-size="22" fill="#57534e">住宿型照顧機構評鑑 A/B/C/D 四大構面</text>
  <text x="80" y="342" font-size="22" fill="#57534e">按月分配任務，對應 75 項評鑑基準</text>
  <!-- 三階段標籤 -->
  <rect x="80" y="390" width="200" height="56" rx="8" fill="#d97706"/>
  <text x="180" y="409" font-size="20" fill="#ffffff" font-weight="700" text-anchor="middle">第1個月</text>
  <text x="180" y="429" font-size="16" fill="#ffffff" text-anchor="middle">D-90~D-60</text>
  <rect x="300" y="390" width="200" height="56" rx="8" fill="#78716c"/>
  <text x="400" y="409" font-size="20" fill="#ffffff" font-weight="700" text-anchor="middle">第2個月</text>
  <text x="400" y="429" font-size="16" fill="#ffffff" text-anchor="middle">D-60~D-30</text>
  <rect x="520" y="390" width="200" height="56" rx="8" fill="#57534e"/>
  <text x="620" y="409" font-size="20" fill="#ffffff" font-weight="700" text-anchor="middle">最後一個月</text>
  <text x="620" y="429" font-size="16" fill="#ffffff" text-anchor="middle">D-30~評鑑日</text>
  <!-- 分類標籤 -->
  <rect x="80" y="490" width="100" height="32" rx="16" fill="#fef3c7"/>
  <text x="130" y="511" font-size="16" fill="#d97706" text-anchor="middle" font-weight="600">評鑑準備</text>
  <rect x="196" y="490" width="160" height="32" rx="16" fill="#fef3c7"/>
  <text x="276" y="511" font-size="16" fill="#d97706" text-anchor="middle" font-weight="600">住宿型照顧機構</text>
  <rect x="372" y="490" width="120" height="32" rx="16" fill="#fef3c7"/>
  <text x="432" y="511" font-size="16" fill="#d97706" text-anchor="middle" font-weight="600">114年度評鑑</text>
  <!-- 浮水印 -->
  <text x="1140" y="590" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
