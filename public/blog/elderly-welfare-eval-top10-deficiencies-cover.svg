<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>

  <!-- 右側裝飾區塊 -->
  <rect x="800" y="0" width="400" height="630" fill="#e8e6de"/>

  <!-- 右側大數字裝飾 -->
  <text x="870" y="320" font-size="220" font-weight="900" fill="#d97706" opacity="0.85" font-family="Arial, sans-serif">10</text>
  <text x="870" y="390" font-size="36" fill="#57534e" font-family="Arial, sans-serif" font-weight="600">常見缺失</text>
  <text x="870" y="435" font-size="28" fill="#78716c" font-family="Arial, sans-serif">評鑑委員最在意</text>
  <text x="870" y="475" font-size="28" fill="#78716c" font-family="Arial, sans-serif">的審查重點</text>

  <!-- 左側主內容區 -->
  <!-- 頂部類別標籤 -->
  <rect x="60" y="48" width="180" height="38" rx="19" fill="#d97706"/>
  <text x="150" y="72" font-size="18" fill="white" text-anchor="middle" font-family="Arial, sans-serif" font-weight="600">老人福利機構</text>

  <!-- 主標題第1行 -->
  <text x="60" y="185" font-size="100" font-weight="900" fill="#1e293b" font-family="Arial, sans-serif">老人福利機構</text>

  <!-- 主標題第2行 -->
  <text x="60" y="295" font-size="100" font-weight="900" fill="#d97706" font-family="Arial, sans-serif">評鑑 10 大缺失</text>

  <!-- 分隔線 -->
  <line x1="60" y1="320" x2="740" y2="320" stroke="#d97706" stroke-width="3" opacity="0.6"/>

  <!-- 副標題 -->
  <text x="60" y="368" font-size="38" fill="#57534e" font-family="Arial, sans-serif">過來人親歷分享．補救策略完整指南</text>

  <!-- Pill 標籤群 -->
  <rect x="60" y="408" width="164" height="42" rx="21" fill="#1e293b"/>
  <text x="142" y="434" font-size="18" fill="white" text-anchor="middle" font-family="Arial, sans-serif">常見缺失分析</text>

  <rect x="238" y="408" width="156" height="42" rx="21" fill="#78716c"/>
  <text x="316" y="434" font-size="18" fill="white" text-anchor="middle" font-family="Arial, sans-serif">補救行動清單</text>

  <rect x="408" y="408" width="112" height="42" rx="21" fill="#57534e"/>
  <text x="464" y="434" font-size="18" fill="white" text-anchor="middle" font-family="Arial, sans-serif">預防策略</text>

  <rect x="534" y="408" width="156" height="42" rx="21" fill="#d97706"/>
  <text x="612" y="434" font-size="18" fill="white" text-anchor="middle" font-family="Arial, sans-serif">AI 自我查核</text>

  <!-- 年度標示 -->
  <text x="60" y="510" font-size="28" fill="#a8a29e" font-family="Arial, sans-serif">115年度評鑑適用</text>

  <!-- 浮水印 -->
  <text x="1140" y="590" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400" font-family="Arial, sans-serif">報告汪 reportwang.com</text>
</svg>
