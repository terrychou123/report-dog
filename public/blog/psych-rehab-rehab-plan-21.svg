<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- @template: list-4 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- Header -->
  <rect x="0" y="50" width="800" height="62" fill="white"/>
  <rect x="0" y="50" width="4" height="62" fill="#d97706" rx="2"/>
  <text x="28" y="93" font-size="32" fill="#1e293b" font-weight="700">2.1 復健評估必備四大要素</text>

  <!-- Row 1: 功能性評估 -->
  <rect x="28" y="160" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="160" width="6" height="62" rx="2" fill="#d97706"/>
  <circle cx="66" cy="191" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="197" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <text x="100" y="183" font-size="22" fill="#1e293b" font-weight="700">功能性評估</text>
  <text x="100" y="207" font-size="16" fill="#57534e">日常生活、社交、認知、職業技能；住宿型特別強調 ADL/IADL 獨立生活功能</text>
  <rect x="620" y="168" width="136" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="186" font-size="15" fill="#d97706" text-anchor="middle">入案評估</text>
  <text x="688" y="206" font-size="15" fill="#d97706" text-anchor="middle">標準化工具</text>

  <!-- Row 2: 自殺風險評估（特殊重點警示） -->
  <rect x="28" y="235" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="235" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="66" cy="266" r="16" fill="#dc2626"/>
  <text x="66" y="271" font-size="14" fill="white" text-anchor="middle" font-weight="700">!</text>
  <text x="100" y="258" font-size="22" fill="#1e293b" font-weight="700">自殺及自傷風險評估（精神復健機構特有）</text>
  <text x="100" y="282" font-size="16" fill="#dc2626">需有系統性評估機制、紀錄與後續追蹤——最容易被忽略的必備要素</text>
  <rect x="620" y="243" width="136" height="46" rx="8" fill="#dc2626" opacity="0.12"/>
  <text x="688" y="261" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="700">定期更新</text>
  <text x="688" y="281" font-size="15" fill="#dc2626" text-anchor="middle">追蹤紀錄</text>

  <!-- Row 3: 優勢評估 -->
  <rect x="28" y="310" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="310" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="66" cy="341" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="347" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <text x="100" y="333" font-size="22" fill="#1e293b" font-weight="700">優勢與復元期待評估（CHIME 精神）</text>
  <text x="100" y="357" font-size="16" fill="#57534e">不只評估問題和缺損，也記錄學員的優勢、興趣、復元目標（體現個人復元理念）</text>
  <rect x="620" y="318" width="136" height="46" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="336" font-size="15" fill="#57534e" text-anchor="middle">優勢導向</text>
  <text x="688" y="356" font-size="15" fill="#57534e" text-anchor="middle">非問題聚焦</text>

  <!-- Row 4: 時效要求 -->
  <rect x="28" y="385" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="385" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="416" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="422" font-size="16" fill="#a8a29e" text-anchor="middle" font-weight="900">4</text>
  <text x="100" y="408" font-size="22" fill="#1e293b" font-weight="700">時效要求：入案後 7–14 個工作天內完成</text>
  <text x="100" y="432" font-size="16" fill="#57534e">初次評估需在規定時效內完成，並由合格專業人員（護理師、社工、職能治療師）執行</text>
  <rect x="620" y="393" width="136" height="46" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="411" font-size="15" fill="#a8a29e" text-anchor="middle">7–14天</text>
  <text x="688" y="431" font-size="15" fill="#a8a29e" text-anchor="middle">入案後完成</text>

  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
