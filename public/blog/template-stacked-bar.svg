<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- Header（y=50, h=76）底色白 -->
  <rect x="0" y="50" width="800" height="76" fill="white"/>
  <rect x="0" y="50" width="6" height="76" fill="#d97706"/>
  <text x="28" y="104" font-size="36" fill="#1e293b" font-weight="700">評鑑等級分佈（年度比較）</text>

  <!--
    100% 堆疊水平長條圖（Stacked Horizontal Bar Chart）
    左欄（x=28~212）: 年度標籤
    長條區（x=220~720，w=500）: 依比例堆疊 4 個色段
    3 列（y=175/265/355，h=44 each，row 間距 90px）
    文字垂直置中: text_y = bar_y + 44/2 + font_size×0.35
    ─────────────────────────────────────────────
    刻度線（x=345/470/595）: 代表 25%/50%/75%
    圖例（y=416）: 4 個色塊 + 標籤
  -->

  <!-- 垂直刻度線（25%/50%/75%，虛線，延伸到所有列） -->
  <line x1="345" y1="162" x2="345" y2="403" stroke="#e8e6de" stroke-dasharray="4,3" stroke-width="1"/>
  <line x1="470" y1="162" x2="470" y2="403" stroke="#e8e6de" stroke-dasharray="4,3" stroke-width="1"/>
  <line x1="595" y1="162" x2="595" y2="403" stroke="#e8e6de" stroke-dasharray="4,3" stroke-width="1"/>

  <!-- 刻度標籤（y=161, font-size=14） -->
  <text x="220" y="161" font-size="14" fill="#a8a29e" text-anchor="middle">0%</text>
  <text x="345" y="161" font-size="14" fill="#a8a29e" text-anchor="middle">25%</text>
  <text x="470" y="161" font-size="14" fill="#a8a29e" text-anchor="middle">50%</text>
  <text x="595" y="161" font-size="14" fill="#a8a29e" text-anchor="middle">75%</text>
  <text x="720" y="161" font-size="14" fill="#a8a29e" text-anchor="middle">100%</text>

  <!-- ─── Row 1（2022 年，y=175）───
       40% / 30% / 20% / 10%  →  w=200/150/100/50
       白底（rx=12）先畫，色段疊上，形成外圓角＋內直角效果
       text_y = 175 + 22 + 16×0.35 = 202.6 ≈ 203 -->
  <text x="36" y="203" font-size="16" fill="#1e293b" font-weight="700">2022 年</text>
  <!-- 白底（rx=12，必須在色段之前） -->
  <rect x="220" y="175" width="500" height="44" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <!-- 堆疊色段（rx=0，疊在白底之上） -->
  <rect x="220" y="175" width="200" height="44" fill="#d97706"/>
  <rect x="420" y="175" width="150" height="44" fill="#78716c"/>
  <rect x="570" y="175" width="100" height="44" fill="#57534e"/>
  <rect x="670" y="175" width="50"  height="44" fill="#a8a29e"/>
  <!-- 百分比標籤（最後疊上） -->
  <text x="320" y="202" font-size="14" fill="white" text-anchor="middle" font-weight="600">40%</text>
  <text x="495" y="202" font-size="14" fill="white" text-anchor="middle" font-weight="600">30%</text>
  <text x="620" y="202" font-size="14" fill="white" text-anchor="middle" font-weight="600">20%</text>
  <text x="695" y="202" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="600">10%</text>

  <!-- ─── Row 2（2023 年，y=265）───
       37% / 31% / 22% / 10%  →  w=185/155/110/50 -->
  <text x="36" y="293" font-size="16" fill="#1e293b" font-weight="700">2023 年</text>
  <rect x="220" y="265" width="500" height="44" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="220" y="265" width="185" height="44" fill="#d97706"/>
  <rect x="405" y="265" width="155" height="44" fill="#78716c"/>
  <rect x="560" y="265" width="110" height="44" fill="#57534e"/>
  <rect x="670" y="265" width="50"  height="44" fill="#a8a29e"/>
  <text x="312" y="292" font-size="14" fill="white" text-anchor="middle" font-weight="600">37%</text>
  <text x="482" y="292" font-size="14" fill="white" text-anchor="middle" font-weight="600">31%</text>
  <text x="615" y="292" font-size="14" fill="white" text-anchor="middle" font-weight="600">22%</text>
  <text x="695" y="292" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="600">10%</text>

  <!-- ─── Row 3（2024 年，y=355）───
       33% / 34% / 22% / 11%  →  w=165/170/110/55 -->
  <text x="36" y="383" font-size="16" fill="#1e293b" font-weight="700">2024 年</text>
  <rect x="220" y="355" width="500" height="44" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="220" y="355" width="165" height="44" fill="#d97706"/>
  <rect x="385" y="355" width="170" height="44" fill="#78716c"/>
  <rect x="555" y="355" width="110" height="44" fill="#57534e"/>
  <rect x="665" y="355" width="55"  height="44" fill="#a8a29e"/>
  <text x="302" y="382" font-size="14" fill="white" text-anchor="middle" font-weight="600">33%</text>
  <text x="470" y="382" font-size="14" fill="white" text-anchor="middle" font-weight="600">34%</text>
  <text x="610" y="382" font-size="14" fill="white" text-anchor="middle" font-weight="600">22%</text>
  <text x="692" y="382" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="600">11%</text>

  <!--
    圖例（y=416, h=14 色塊, text y=428）
    4 項目，x=220/325/425/530（間距約 100px）
  -->
  <rect x="220" y="416" width="14" height="14" rx="3" fill="#d97706"/>
  <text x="240" y="428" font-size="14" fill="#57534e">A 優等</text>

  <rect x="325" y="416" width="14" height="14" rx="3" fill="#78716c"/>
  <text x="345" y="428" font-size="14" fill="#57534e">B 佳等</text>

  <rect x="425" y="416" width="14" height="14" rx="3" fill="#57534e"/>
  <text x="445" y="428" font-size="14" fill="#57534e">C 合格</text>

  <rect x="530" y="416" width="14" height="14" rx="3" fill="#a8a29e"/>
  <text x="550" y="428" font-size="14" fill="#57534e">D 待改善</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
