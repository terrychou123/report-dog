<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- 頂部橙色條 -->
  <rect width="800" height="6" fill="#d97706"/>

  <!-- 標題 -->
  <text x="400" y="45" font-size="22" fill="#92400e" font-weight="bold" text-anchor="middle">跌倒事件處理 SOP 流程圖（A1.3）</text>

  <!-- 流程步驟 — 橫向排列 -->
  <!-- 步驟1：發現跌倒 -->
  <rect x="20" y="90" width="110" height="70" fill="#fef3c7" rx="8" stroke="#d97706" stroke-width="2"/>
  <text x="75" y="120" font-size="14" fill="#92400e" font-weight="bold" text-anchor="middle">①</text>
  <text x="75" y="140" font-size="14" fill="#78350f" text-anchor="middle">發現跌倒</text>
  <text x="75" y="155" font-size="14" fill="#a16207" text-anchor="middle">立即到場</text>

  <!-- 箭頭 -->
  <polygon points="135,125 148,118 148,132" fill="#d97706"/>
  <line x1="130" y1="125" x2="148" y2="125" stroke="#d97706" stroke-width="2"/>

  <!-- 步驟2：立即評估 -->
  <rect x="152" y="90" width="110" height="70" fill="#fef3c7" rx="8" stroke="#d97706" stroke-width="2"/>
  <text x="207" y="120" font-size="14" fill="#92400e" font-weight="bold" text-anchor="middle">②</text>
  <text x="207" y="140" font-size="14" fill="#78350f" text-anchor="middle">立即評估</text>
  <text x="207" y="155" font-size="14" fill="#a16207" text-anchor="middle">意識/傷勢</text>

  <!-- 箭頭 -->
  <polygon points="267,125 280,118 280,132" fill="#d97706"/>
  <line x1="262" y1="125" x2="280" y2="125" stroke="#d97706" stroke-width="2"/>

  <!-- 步驟3：通知醫師/家屬 -->
  <rect x="284" y="90" width="110" height="70" fill="#fef3c7" rx="8" stroke="#d97706" stroke-width="2"/>
  <text x="339" y="120" font-size="14" fill="#92400e" font-weight="bold" text-anchor="middle">③</text>
  <text x="339" y="136" font-size="14" fill="#78350f" text-anchor="middle">通知</text>
  <text x="339" y="152" font-size="14" fill="#a16207" text-anchor="middle">醫師/家屬</text>

  <!-- 箭頭 -->
  <polygon points="399,125 412,118 412,132" fill="#d97706"/>
  <line x1="394" y1="125" x2="412" y2="125" stroke="#d97706" stroke-width="2"/>

  <!-- 步驟4：紀錄 -->
  <rect x="416" y="90" width="110" height="70" fill="#fef3c7" rx="8" stroke="#d97706" stroke-width="2"/>
  <text x="471" y="120" font-size="14" fill="#92400e" font-weight="bold" text-anchor="middle">④</text>
  <text x="471" y="140" font-size="14" fill="#78350f" text-anchor="middle">完整記錄</text>
  <text x="471" y="155" font-size="14" fill="#a16207" text-anchor="middle">護理紀錄</text>

  <!-- 箭頭 -->
  <polygon points="531,125 544,118 544,132" fill="#d97706"/>
  <line x1="526" y1="125" x2="544" y2="125" stroke="#d97706" stroke-width="2"/>

  <!-- 步驟5：24hr通報 -->
  <rect x="548" y="80" width="110" height="85" fill="#dc2626" rx="8"/>
  <text x="603" y="110" font-size="14" fill="white" font-weight="bold" text-anchor="middle">⑤</text>
  <text x="603" y="132" font-size="14" fill="white" font-weight="bold" text-anchor="middle">24小時內</text>
  <text x="603" y="150" font-size="14" fill="white" font-weight="bold" text-anchor="middle">通報主管</text>

  <!-- 箭頭 -->
  <polygon points="663,122 676,115 676,129" fill="#d97706"/>
  <line x1="658" y1="122" x2="676" y2="122" stroke="#d97706" stroke-width="2"/>

  <!-- 步驟6：追蹤改善 -->
  <rect x="680" y="90" width="100" height="70" fill="#166534" rx="8"/>
  <text x="730" y="120" font-size="14" fill="white" font-weight="bold" text-anchor="middle">⑥</text>
  <text x="730" y="140" font-size="14" fill="white" text-anchor="middle">追蹤改善</text>
  <text x="730" y="155" font-size="14" fill="#86efac" text-anchor="middle">PDCA</text>

  <!-- 通報內容區 -->
  <rect x="20" y="200" width="360" height="200" fill="white" rx="10" stroke="#d97706" stroke-width="1.5"/>
  <rect x="20" y="200" width="360" height="36" fill="#d97706" rx="10"/>
  <rect x="20" y="218" width="360" height="18" fill="#d97706"/>
  <text x="200" y="232" font-size="15" fill="white" font-weight="bold" text-anchor="middle">通報內容應包含</text>
  <text x="40" y="260" font-size="14" fill="#44403c">• 事件發生時間、地點</text>
  <text x="40" y="282" font-size="14" fill="#44403c">• 住民姓名、病歷號</text>
  <text x="40" y="304" font-size="14" fill="#44403c">• 事件經過描述</text>
  <text x="40" y="326" font-size="14" fill="#44403c">• 立即處置措施</text>
  <text x="40" y="348" font-size="14" fill="#44403c">• 通知醫師/家屬時間</text>
  <text x="40" y="370" font-size="14" fill="#44403c">• 住民目前狀況</text>

  <!-- 追蹤改善區 -->
  <rect x="420" y="200" width="360" height="200" fill="white" rx="10" stroke="#166534" stroke-width="1.5"/>
  <rect x="420" y="200" width="360" height="36" fill="#166534" rx="10"/>
  <rect x="420" y="218" width="360" height="18" fill="#166534"/>
  <text x="600" y="232" font-size="15" fill="white" font-weight="bold" text-anchor="middle">後續追蹤重點</text>
  <text x="440" y="260" font-size="14" fill="#44403c">• 原因分析（人、機、料、法、環）</text>
  <text x="440" y="282" font-size="14" fill="#44403c">• 擬定預防改善措施</text>
  <text x="440" y="304" font-size="14" fill="#44403c">• 指定負責人與完成期限</text>
  <text x="440" y="326" font-size="14" fill="#44403c">• 追蹤改善執行成效</text>
  <text x="440" y="348" font-size="14" fill="#44403c">• 品質指標監測（跌倒率）</text>
  <text x="440" y="370" font-size="14" fill="#44403c">• 個案護理計畫更新</text>

  <!-- 警示標語 -->
  <rect x="20" y="420" width="760" height="55" fill="#fef3c7" rx="8" stroke="#d97706" stroke-width="1.5"/>
  <text x="400" y="445" font-size="14" fill="#92400e" font-weight="bold" text-anchor="middle">評鑑委員抽測重點：「發生跌倒後你們第一步做什麼？幾小時內要通報？通報給誰？」</text>
  <text x="400" y="465" font-size="14" fill="#78716c" text-anchor="middle">護理師需能立即、正確回答，並說明追蹤改善機制</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
