<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 右側裝飾區塊 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>

  <!-- 右側大數字（B1.7 的 5 個基準） -->
  <text x="1010" y="215" font-size="148" font-weight="900" fill="#16a34a" text-anchor="middle" opacity="0.88">5</text>
  <text x="1010" y="257" font-size="26" fill="#78716c" text-anchor="middle" font-weight="600">項評鑑基準全解析</text>

  <!-- 右側 5 個基準清單 -->
  <rect x="840" y="279" width="320" height="44" rx="8" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="858" y="301" font-size="20" fill="#16a34a" font-weight="700">① </text>
  <text x="882" y="301" font-size="20" fill="#57534e">哺乳意願評估 + 個別化計畫</text>

  <rect x="840" y="329" width="320" height="44" rx="8" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="858" y="351" font-size="20" fill="#16a34a" font-weight="700">② </text>
  <text x="882" y="351" font-size="20" fill="#57534e">含乳姿勢 + 哺乳頻率指導</text>

  <rect x="840" y="379" width="320" height="44" rx="8" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="858" y="401" font-size="20" fill="#16a34a" font-weight="700">③ </text>
  <text x="882" y="401" font-size="20" fill="#57534e">嬰兒哺乳 + 體重追蹤記錄</text>

  <rect x="840" y="429" width="320" height="44" rx="8" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="858" y="451" font-size="20" fill="#16a34a" font-weight="700">④ </text>
  <text x="882" y="451" font-size="20" fill="#57534e">配方奶沖泡保存 SOP</text>

  <rect x="840" y="479" width="320" height="44" rx="8" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="858" y="501" font-size="20" fill="#16a34a" font-weight="700">⑤ </text>
  <text x="882" y="501" font-size="20" fill="#57534e">純母乳哺育率統計（每季）</text>

  <!-- 右側底部標籤 -->
  <rect x="840" y="533" width="320" height="52" rx="10" fill="#16a34a" opacity="0.10"/>
  <text x="1000" y="569" font-size="24" fill="#16a34a" text-anchor="middle" font-weight="700">個案紀錄查閱 · 資料查核</text>

  <!-- 左側主標題 -->
  <text x="60" y="178" font-size="96" font-weight="900" fill="#1e293b">純母乳哺育率</text>
  <text x="60" y="284" font-size="96" font-weight="900" fill="#16a34a">怎麼算？</text>

  <line x1="60" y1="316" x2="780" y2="316" stroke="#dedad3" stroke-width="2"/>

  <text x="60" y="362" font-size="36" fill="#57534e" font-weight="400">B1.7 哺乳計畫撰寫 · 個別化三步驟</text>

  <!-- 特色標籤列 -->
  <rect x="60" y="390" width="178" height="52" rx="10" fill="#16a34a" opacity="0.10"/>
  <text x="149" y="425" font-size="26" fill="#16a34a" text-anchor="middle" font-weight="600">計算公式</text>

  <rect x="250" y="390" width="178" height="52" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="339" y="425" font-size="26" fill="#d97706" text-anchor="middle" font-weight="600">個別化計畫</text>

  <rect x="440" y="390" width="178" height="52" rx="10" fill="#78716c" opacity="0.12"/>
  <text x="529" y="425" font-size="26" fill="#78716c" text-anchor="middle" font-weight="600">追蹤記錄</text>

  <!-- 適用對象 -->
  <text x="60" y="472" font-size="28" fill="#94a3b8">適用對象：護產人員 · 護理長 · 品管負責人</text>

  <!-- 底部說明 -->
  <text x="60" y="520" font-size="30" fill="#57534e" font-weight="500">出院時純母乳哺育嬰兒數 ÷ 出院嬰兒總數 × 100%</text>
  <text x="60" y="556" font-size="26" fill="#a8a29e">從評估到追蹤，每份紀錄都是評鑑加分點</text>

  <!-- 浮水印 -->
  <text x="780" y="600" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
