<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <text x="400" y="50" font-size="26" font-weight="700" fill="#1e293b" text-anchor="middle" font-family="sans-serif">B29 個別化飲食：從評估到餐盤的完整照護鏈</text>
  <text x="400" y="76" font-size="16" fill="#57534e" text-anchor="middle" font-family="sans-serif">每個環節均需書面紀錄，任一缺失均可能導致扣分</text>

  <!-- N=4, H=62, outer_gap=50 -->
  <!-- Row 1 (y=160) -->
  <rect x="40" y="110" width="720" height="62" rx="6" fill="#ffffff"/>
  <rect x="40" y="110" width="6" height="62" rx="3" fill="#d97706"/>
  <circle cx="74" cy="141" r="16" fill="#d97706" opacity="0.15"/>
  <text x="74" y="147" font-size="16" font-weight="700" fill="#d97706" text-anchor="middle" font-family="sans-serif">1</text>
  <text x="100" y="133" font-size="16" font-weight="700" fill="#1e293b" font-family="sans-serif">依疾病與宗教設計個別飲食計畫</text>
  <text x="100" y="156" font-size="14" fill="#57534e" font-family="sans-serif">糖尿病→控糖、腎臟病→低磷低鉀、宗教→素食/清真，每份計畫明確對應診斷</text>
  <rect x="596" y="119" width="136" height="46" rx="5" fill="#d97706" opacity="0.12"/>
  <text x="664" y="138" font-size="13" fill="#d97706" text-anchor="middle" font-weight="600" font-family="sans-serif">計畫需</text>
  <text x="664" y="157" font-size="13" fill="#d97706" text-anchor="middle" font-family="sans-serif">對應診斷</text>

  <!-- Row 2 (y=235) -->
  <rect x="40" y="185" width="720" height="62" rx="6" fill="#ffffff"/>
  <rect x="40" y="185" width="6" height="62" rx="3" fill="#78716c"/>
  <circle cx="74" cy="216" r="16" fill="#78716c" opacity="0.15"/>
  <text x="74" y="222" font-size="16" font-weight="700" fill="#78716c" text-anchor="middle" font-family="sans-serif">2</text>
  <text x="100" y="208" font-size="16" font-weight="700" fill="#1e293b" font-family="sans-serif">營養指標異常須有營養師介入紀錄</text>
  <text x="100" y="231" font-size="14" fill="#57534e" font-family="sans-serif">體重/白蛋白/BMI 異常時，需記錄營養師介入的個別化改善措施及追蹤結果</text>
  <rect x="596" y="194" width="136" height="46" rx="5" fill="#78716c" opacity="0.1"/>
  <text x="664" y="213" font-size="13" fill="#78716c" text-anchor="middle" font-weight="600" font-family="sans-serif">異常觸發</text>
  <text x="664" y="232" font-size="13" fill="#78716c" text-anchor="middle" font-family="sans-serif">介入記錄</text>

  <!-- Row 3 (y=310) -->
  <rect x="40" y="260" width="720" height="62" rx="6" fill="#ffffff"/>
  <rect x="40" y="260" width="6" height="62" rx="3" fill="#57534e"/>
  <circle cx="74" cy="291" r="16" fill="#57534e" opacity="0.15"/>
  <text x="74" y="297" font-size="16" font-weight="700" fill="#57534e" text-anchor="middle" font-family="sans-serif">3</text>
  <text x="100" y="283" font-size="16" font-weight="700" fill="#1e293b" font-family="sans-serif">食物質地須與評估結果一致</text>
  <text x="100" y="306" font-size="14" fill="#57534e" font-family="sans-serif">吞嚥困難評估→細碎/軟質；鼻胃管留置→管灌；質地與評估結果不一致即扣分</text>
  <rect x="596" y="269" width="136" height="46" rx="5" fill="#57534e" opacity="0.1"/>
  <text x="664" y="288" font-size="13" fill="#57534e" text-anchor="middle" font-weight="600" font-family="sans-serif">現場察看</text>
  <text x="664" y="307" font-size="13" fill="#57534e" text-anchor="middle" font-family="sans-serif">文件一致</text>

  <!-- Row 4 (y=385) -->
  <rect x="40" y="335" width="720" height="62" rx="6" fill="#ffffff"/>
  <rect x="40" y="335" width="6" height="62" rx="3" fill="#a8a29e"/>
  <circle cx="74" cy="366" r="16" fill="#a8a29e" opacity="0.2"/>
  <text x="74" y="372" font-size="16" font-weight="700" fill="#a8a29e" text-anchor="middle" font-family="sans-serif">4</text>
  <text x="100" y="358" font-size="16" font-weight="700" fill="#1e293b" font-family="sans-serif">每半年膳食滿意度調查</text>
  <text x="100" y="381" font-size="14" fill="#57534e" font-family="sans-serif">需有問卷、統計分析報告、具體改善措施三份文件，不可只有問卷填寫</text>
  <rect x="596" y="344" width="136" height="46" rx="5" fill="#a8a29e" opacity="0.15"/>
  <text x="664" y="363" font-size="13" fill="#78716c" text-anchor="middle" font-weight="600" font-family="sans-serif">每半年</text>
  <text x="664" y="382" font-size="13" fill="#78716c" text-anchor="middle" font-family="sans-serif">含改善措施</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" font-family="sans-serif">報告汪 reportwang.com</text>
</svg>
