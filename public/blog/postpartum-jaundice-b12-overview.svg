<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- Header -->
  <rect x="0" y="29" width="800" height="60" fill="#e8e6de"/>
  <rect x="0" y="29" width="6" height="60" rx="2" fill="#d97706"/>
  <text x="28" y="74" font-size="30" fill="#1e293b" font-weight="700">B1.2 評鑑查核項目總覽</text>
  <!-- Row 1 y=118 H=60 -->
  <rect x="28" y="118" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="118" width="6" height="60" rx="2" fill="#d97706"/>
  <circle cx="66" cy="148" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="154" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <text x="100" y="145" font-size="20" fill="#1e293b" font-weight="700">體重監測</text>
  <text x="100" y="166" font-size="16" fill="#57534e">每日記錄體重並與出生體重對比，記錄差異克數或百分比</text>
  <rect x="620" y="126" width="136" height="44" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="144" font-size="16" fill="#d97706" text-anchor="middle">連續記錄</text>
  <text x="688" y="164" font-size="16" fill="#d97706" text-anchor="middle">趨勢追蹤</text>
  <!-- Row 2 y=191 H=60 -->
  <rect x="28" y="191" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="191" width="6" height="60" rx="2" fill="#78716c"/>
  <circle cx="66" cy="221" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="227" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <text x="100" y="218" font-size="20" fill="#1e293b" font-weight="700">黃疸評估</text>
  <text x="100" y="239" font-size="16" fill="#57534e">黃疸值動態追蹤，照光治療需記錄開始與停止條件</text>
  <rect x="620" y="199" width="136" height="44" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="217" font-size="16" fill="#78716c" text-anchor="middle">TcB/TSB</text>
  <text x="688" y="237" font-size="16" fill="#78716c" text-anchor="middle">動態數值</text>
  <!-- Row 3 y=264 H=60 -->
  <rect x="28" y="264" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="264" width="6" height="60" rx="2" fill="#57534e"/>
  <circle cx="66" cy="294" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="300" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <text x="100" y="291" font-size="20" fill="#1e293b" font-weight="700">餵食情形</text>
  <text x="100" y="312" font-size="16" fill="#57534e">餵食方式、次數、嬰兒吸吮能力評估，避免僅寫「哺乳順利」</text>
  <rect x="620" y="272" width="136" height="44" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="290" font-size="16" fill="#57534e" text-anchor="middle">次數頻率</text>
  <text x="688" y="310" font-size="16" fill="#57534e" text-anchor="middle">吸吮評估</text>
  <!-- Row 4 y=337 H=60 -->
  <rect x="28" y="337" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="337" width="6" height="60" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="367" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="373" font-size="16" fill="#a8a29e" text-anchor="middle" font-weight="900">4</text>
  <text x="100" y="364" font-size="20" fill="#1e293b" font-weight="700">身分辨識</text>
  <text x="100" y="385" font-size="16" fill="#57534e">手腳環佩戴記錄，標示姓名、出生日期、性別、床位號</text>
  <rect x="620" y="345" width="136" height="44" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="363" font-size="16" fill="#a8a29e" text-anchor="middle">每班確認</text>
  <text x="688" y="383" font-size="16" fill="#a8a29e" text-anchor="middle">書面記錄</text>
  <!-- Row 5 y=410 H=60 -->
  <rect x="28" y="410" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="410" width="6" height="60" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="440" r="16" fill="#94a3b8" opacity="0.15"/>
  <text x="66" y="446" font-size="16" fill="#94a3b8" text-anchor="middle" font-weight="900">5</text>
  <text x="100" y="437" font-size="20" fill="#1e293b" font-weight="700">整體評估</text>
  <text x="100" y="458" font-size="16" fill="#57534e">定期評估嬰兒活動力、膚色、臍帶狀況，使用結構化格式</text>
  <rect x="620" y="418" width="136" height="44" rx="8" fill="#94a3b8" opacity="0.12"/>
  <text x="688" y="436" font-size="16" fill="#94a3b8" text-anchor="middle">結構化</text>
  <text x="688" y="456" font-size="16" fill="#94a3b8" text-anchor="middle">定期執行</text>
  <!-- Watermark -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
