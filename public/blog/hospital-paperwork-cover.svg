<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="'Noto Sans TC', sans-serif">
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#fafaf9"/>

  <!-- 右側裝飾區塊 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>

  <!-- 左側主標題區 -->
  <!-- 標題第1行 -->
  <text x="60" y="120"  font-size="62" font-weight="900" fill="#1c1917">評鑑文書地獄</text>
  <!-- 標題第2行（橘色） -->
  <text x="60" y="195"  font-size="62" font-weight="900" fill="#ea580c">如何突破</text>

  <!-- 副標題 -->
  <text x="60" y="248"  font-size="22" fill="#57534e">大拜拜 - AI輔助 - 日常化品質管理</text>

  <!-- 分隔線 -->
  <rect x="60" y="270" width="680" height="3" fill="#ea580c" opacity="0.4"/>

  <!-- 左側特色標籤 -->
  <!-- 標籤1 -->
  <rect x="60" y="295" width="100" height="34" rx="17" fill="#ea580c" opacity="0.12"/>
  <text x="110" y="317"  font-size="15" fill="#ea580c" text-anchor="middle">病歷書寫</text>

  <!-- 標籤2 -->
  <rect x="172" y="295" width="100" height="34" rx="17" fill="#78716c" opacity="0.12"/>
  <text x="222" y="317"  font-size="15" fill="#57534e" text-anchor="middle">護理評估</text>

  <!-- 標籤3 -->
  <rect x="284" y="295" width="100" height="34" rx="17" fill="#78716c" opacity="0.12"/>
  <text x="334" y="317"  font-size="15" fill="#57534e" text-anchor="middle">品質指標</text>

  <!-- 標籤4 -->
  <rect x="60" y="340" width="100" height="34" rx="17" fill="#ea580c" opacity="0.12"/>
  <text x="110" y="362"  font-size="15" fill="#ea580c" text-anchor="middle">AI 文書</text>

  <!-- 標籤5 -->
  <rect x="172" y="340" width="100" height="34" rx="17" fill="#78716c" opacity="0.12"/>
  <text x="222" y="362"  font-size="15" fill="#57534e" text-anchor="middle">定期追蹤</text>

  <!-- 左側說明文字區 -->
  <text x="60" y="415"  font-size="17" fill="#78716c">護理師30%工作時間花在行政文書</text>
  <text x="60" y="445"  font-size="17" fill="#78716c">評鑑季的「大拜拜」即將成為歷史</text>
  <text x="60" y="475"  font-size="17" fill="#78716c">AI輔助 × 日常化品管 × 系統追蹤</text>

  <!-- 右側大數字「30%」 -->
  <text x="870" y="170"  font-size="110" font-weight="900" fill="#ea580c" opacity="0.9">30%</text>
  <!-- 右側說明文字 -->
  <text x="910" y="205"  font-size="18" fill="#78716c">護理師行政時間占比</text>

  <!-- 右側分隔線 -->
  <rect x="848" y="230" width="310" height="2" fill="#c7c3bd"/>

  <!-- 右側卡片：解方列表 -->
  <!-- 解方1 -->
  <rect x="848" y="248" width="310" height="72" rx="8" fill="#ffffff" opacity="0.7"/>
  <rect x="848" y="248" width="6" height="72" rx="3" fill="#ea580c"/>
  <text x="866" y="273"  font-size="17" font-weight="700" fill="#1c1917">AI 輔助文書</text>
  <text x="866" y="305"  font-size="14" fill="#78716c">初稿生成節省70%撰寫時間</text>

  <!-- 解方2 -->
  <rect x="848" y="332" width="310" height="72" rx="8" fill="#ffffff" opacity="0.7"/>
  <rect x="848" y="332" width="6" height="72" rx="2" fill="#78716c"/>
  <text x="866" y="357"  font-size="17" font-weight="700" fill="#1c1917">日常化品管</text>
  <text x="866" y="389"  font-size="14" fill="#78716c">月度例行作業取代評鑑前衝刺</text>

  <!-- 解方3 -->
  <rect x="848" y="416" width="310" height="72" rx="8" fill="#ffffff" opacity="0.7"/>
  <rect x="848" y="416" width="6" height="72" rx="2" fill="#57534e"/>
  <text x="866" y="441"  font-size="17" font-weight="700" fill="#1c1917">定期追蹤系統</text>
  <text x="866" y="473"  font-size="14" fill="#78716c">跨部門可視化，每季自我查核</text>

  <!-- 浮水印 -->
  <text x="600" y="612"  font-size="14" fill="#a8a29e" text-anchor="middle" opacity="0.7">報告汪 reportwang.com</text>
</svg>
