<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題 -->
  <text x="400" y="48" text-anchor="middle" font-size="30" fill="#1e293b" font-weight="700">2.2章三大必要條文的持續改善關係</text>
  <text x="400" y="76" text-anchor="middle" font-size="20" fill="#57534e">品質指標→病安文化→通報分析，形成閉環管理</text>
  <line x1="129" y1="92" x2="671" y2="92" stroke="#dedad3" stroke-width="1"/>

  <!-- N=3 flow，card_w=170, margin=129 -->
  <!-- 箭頭 -->
  <line x1="299" y1="279" x2="315" y2="279" stroke="#c4bfb8" stroke-width="2"/>
  <polygon points="299,273 315,279 299,285" fill="#c4bfb8"/>
  <line x1="485" y1="279" x2="501" y2="279" stroke="#c4bfb8" stroke-width="2"/>
  <polygon points="485,273 501,279 485,285" fill="#c4bfb8"/>

  <!-- Step 01：2.2.1 品質指標 (#d97706) x=129 cx=214 -->
  <rect x="129" y="108" width="170" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="129" y="108" width="170" height="8" rx="4" fill="#d97706"/>
  <rect x="129" y="112" width="170" height="4" fill="#d97706"/>
  <circle cx="214" cy="194" r="43" fill="#fef3c7"/>
  <text x="214" y="183" text-anchor="middle" font-size="16" fill="#d97706" font-weight="700">2.2.1</text>
  <text x="214" y="211" text-anchor="middle" font-size="26" fill="#d97706" font-weight="700">指標</text>
  <text x="214" y="297" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">品質指標</text>
  <text x="214" y="324" text-anchor="middle" font-size="19" fill="#57534e">選定有意義指標</text>
  <text x="214" y="346" text-anchor="middle" font-size="19" fill="#57534e">訂定目標值</text>
  <rect x="142" y="381" width="144" height="36" rx="18" fill="#fef3c7"/>
  <text x="214" y="405" text-anchor="middle" font-size="16" fill="#d97706" font-weight="600">定期分析追蹤</text>

  <!-- Step 02：2.2.2 病安文化 (#78716c) x=315 cx=400 -->
  <rect x="315" y="108" width="170" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="315" y="108" width="170" height="8" rx="4" fill="#78716c"/>
  <rect x="315" y="112" width="170" height="4" fill="#78716c"/>
  <circle cx="400" cy="194" r="43" fill="#f5f5f4"/>
  <text x="400" y="183" text-anchor="middle" font-size="16" fill="#78716c" font-weight="700">2.2.2</text>
  <text x="400" y="211" text-anchor="middle" font-size="26" fill="#78716c" font-weight="700">文化</text>
  <text x="400" y="297" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">病安文化</text>
  <text x="400" y="324" text-anchor="middle" font-size="19" fill="#57534e">不責罰通報</text>
  <text x="400" y="346" text-anchor="middle" font-size="19" fill="#57534e">病安目標推動</text>
  <rect x="328" y="381" width="144" height="36" rx="18" fill="#f5f5f4"/>
  <text x="400" y="405" text-anchor="middle" font-size="16" fill="#78716c" font-weight="600">全員教育訓練</text>

  <!-- Step 03：2.2.3 異常通報 (#57534e) x=501 cx=586 -->
  <rect x="501" y="108" width="170" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="501" y="108" width="170" height="8" rx="4" fill="#57534e"/>
  <rect x="501" y="112" width="170" height="4" fill="#57534e"/>
  <circle cx="586" cy="194" r="43" fill="#f5f0eb"/>
  <text x="586" y="183" text-anchor="middle" font-size="16" fill="#57534e" font-weight="700">2.2.3</text>
  <text x="586" y="211" text-anchor="middle" font-size="26" fill="#57534e" font-weight="700">通報</text>
  <text x="586" y="297" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">異常通報</text>
  <text x="586" y="324" text-anchor="middle" font-size="19" fill="#57534e">RCA根本分析</text>
  <text x="586" y="346" text-anchor="middle" font-size="19" fill="#57534e">改善措施追蹤</text>
  <rect x="514" y="381" width="144" height="36" rx="18" fill="#f5f0eb"/>
  <text x="586" y="405" text-anchor="middle" font-size="16" fill="#57534e" font-weight="600">防止事件再發</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
