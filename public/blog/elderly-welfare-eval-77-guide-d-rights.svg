<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">D 區：個案權益保障 9 項重點</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">社工主責 · 13% 配分 · D1 D6 為二級加強</text>
  <line x1="28" y1="94" x2="772" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- N=4 list: H=62, inner_gap=13, outer_gap=50 -->
  <!-- Row y: 160, 235, 310, 385 -->

  <!-- Row 1: D1 資料保密（二級加強） -->
  <rect x="28" y="160" width="744" height="62" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="160" width="6" height="62" rx="2" fill="#d97706"/>
  <circle cx="66" cy="191" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="197" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">D1</text>
  <text x="100" y="183" font-size="20" fill="#1e293b" font-weight="700">個案資料管理與保密（二級加強）</text>
  <text x="100" y="205" font-size="16" fill="#57534e">系統有明確使用者權限；訂有含肖像權同意書管理辦法；統計分析上傳衛福部</text>
  <rect x="620" y="168" width="136" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="185" font-size="16" fill="#d97706" text-anchor="middle">現場操作</text>
  <text x="688" y="205" font-size="16" fill="#d97706" text-anchor="middle">二級加強</text>

  <!-- Row 2: D2 契約 + D4 申訴 -->
  <rect x="28" y="235" width="744" height="62" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="235" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="66" cy="266" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="272" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">D2</text>
  <text x="100" y="258" font-size="20" fill="#1e293b" font-weight="700">入住契約 ／ D4 申訴意見管道</text>
  <text x="100" y="280" font-size="16" fill="#57534e">契約給予 5 天審閱期；意見申訴流程張貼於明顯處；年度統計分析案件</text>
  <rect x="620" y="243" width="136" height="46" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="260" font-size="16" fill="#78716c" text-anchor="middle">文件+訪談</text>
  <text x="688" y="280" font-size="16" fill="#78716c" text-anchor="middle">服務對象</text>

  <!-- Row 3: D6 住民隱私（二級加強） -->
  <rect x="28" y="310" width="744" height="62" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="310" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="66" cy="341" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="347" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">D6</text>
  <text x="100" y="333" font-size="20" fill="#1e293b" font-weight="700">住民隱私及居家布置（二級加強）</text>
  <text x="100" y="355" font-size="16" fill="#57534e">監視器不得設置於寢室及浴廁；床與床之間設有圍簾；尊重個人物品擺置</text>
  <rect x="620" y="318" width="136" height="46" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="335" font-size="16" fill="#57534e" text-anchor="middle">現場察看</text>
  <text x="688" y="355" font-size="16" fill="#57534e" text-anchor="middle">二級加強</text>

  <!-- Row 4: D8 緩和醫療 DNR -->
  <rect x="28" y="385" width="744" height="62" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="385" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="416" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="422" font-size="16" fill="#a8a29e" text-anchor="middle" font-weight="900">D8</text>
  <text x="100" y="408" font-size="20" fill="#1e293b" font-weight="700">緩和醫療與臨終照護（6 基準項）</text>
  <text x="100" y="430" font-size="16" fill="#57534e">護理與社工完成安寧療護訓練；建立 DNR 作業流程；有實際案例佐證</text>
  <rect x="620" y="393" width="136" height="46" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="410" font-size="16" fill="#1e293b" text-anchor="middle">案例文件</text>
  <text x="688" y="430" font-size="16" fill="#1e293b" text-anchor="middle">護理+社工</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
