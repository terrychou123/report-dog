<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#fafaf9"/>

  <!-- 右側裝飾區塊 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>

  <!-- 右側大數字「2」代表每年2次演練要求 -->
  <text x="870" y="200" font-family="'Noto Sans TC', sans-serif" font-size="160" font-weight="900" fill="#dc2626" opacity="0.18">2</text>

  <!-- 右側標籤標題 -->
  <text x="870" y="260" font-family="'Noto Sans TC', sans-serif" font-size="16" font-weight="700" fill="#44403c">每年至少2次消防演練（含夜間）</text>

  <!-- 右側卡片 1：消防設備維護 -->
  <rect x="858" y="278" width="300" height="72" rx="10" fill="#ffffff"/>
  <rect x="858" y="278" width="6" height="72" rx="3" fill="#dc2626"/>
  <text x="876" y="302" font-family="'Noto Sans TC', sans-serif" font-size="14" font-weight="700" fill="#7f1d1d">消防設備維護</text>
  <text x="876" y="322" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#92400e">設備完善 ▸ 定期檢查 ▸ 有紀錄</text>
  <text x="876" y="340" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#a8a29e">偵測器、滅火器、灑水系統、出口標示燈</text>

  <!-- 右側卡片 2：疏散演練紀錄 -->
  <rect x="858" y="362" width="300" height="72" rx="10" fill="#ffffff"/>
  <rect x="858" y="362" width="6" height="72" rx="3" fill="#d97706"/>
  <text x="876" y="386" font-family="'Noto Sans TC', sans-serif" font-size="14" font-weight="700" fill="#44403c">疏散演練紀錄</text>
  <text x="876" y="406" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#57534e">年度2次 ▸ 含夜間演練 ▸ 完整紀錄</text>
  <text x="876" y="424" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#a8a29e">時間計測、問題清單、改善追蹤、主管簽核</text>

  <!-- 右側卡片 3：臥床病人疏散計畫 -->
  <rect x="858" y="446" width="300" height="72" rx="10" fill="#ffffff"/>
  <rect x="858" y="446" width="6" height="72" rx="3" fill="#78716c"/>
  <text x="876" y="470" font-family="'Noto Sans TC', sans-serif" font-size="14" font-weight="700" fill="#44403c">臥床病人疏散計畫</text>
  <text x="876" y="490" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#57534e">疏散計畫 ▸ 路線圖 ▸ 可執行</text>
  <text x="876" y="508" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#a8a29e">滑板輔具、人員分工、行動不便病人應變</text>

  <!-- 左側頂部標籤 -->
  <rect x="60" y="60" width="116" height="32" rx="16" fill="#dc2626"/>
  <text x="118" y="81" font-family="'Noto Sans TC', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">必要條文</text>

  <!-- 左側主標題 -->
  <text x="60" y="170" font-family="'Noto Sans TC', sans-serif" font-size="72" font-weight="900" fill="#1c1917">醫院消防安全</text>
  <text x="60" y="258" font-family="'Noto Sans TC', sans-serif" font-size="72" font-weight="900" fill="#dc2626">評鑑必要條文</text>

  <!-- 副標題 -->
  <text x="60" y="310" font-family="'Noto Sans TC', sans-serif" font-size="20" fill="#78716c">1.5.2必要條文 × 夜間演練 × 病人疏散計畫</text>

  <!-- 分隔線 -->
  <line x1="60" y1="334" x2="780" y2="334" stroke="#e7e5e4" stroke-width="1.5"/>

  <!-- 特色標籤列 -->
  <rect x="60" y="354" width="88" height="30" rx="15" fill="#fee2e2"/>
  <text x="104" y="374" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#dc2626" text-anchor="middle">必要條文</text>

  <rect x="158" y="354" width="88" height="30" rx="15" fill="#fef3c7"/>
  <text x="202" y="374" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#92400e" text-anchor="middle">夜間演練</text>

  <rect x="256" y="354" width="88" height="30" rx="15" fill="#f5f5f4"/>
  <text x="300" y="374" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#44403c" text-anchor="middle">疏散計畫</text>

  <rect x="354" y="354" width="88" height="30" rx="15" fill="#f0fdf4"/>
  <text x="398" y="374" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#15803d" text-anchor="middle">定期追蹤</text>

  <rect x="452" y="354" width="88" height="30" rx="15" fill="#ffe4e6"/>
  <text x="496" y="374" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#be123c" text-anchor="middle">實地查核</text>

  <!-- 底部說明文字 -->
  <text x="60" y="440" font-family="'Noto Sans TC', sans-serif" font-size="16" fill="#57534e">評鑑委員資料查核＋實地查核雙管齊下，</text>
  <text x="60" y="466" font-family="'Noto Sans TC', sans-serif" font-size="16" fill="#57534e">本文提供消防設備管理到夜間演練的完整攻略。</text>

  <!-- 裝飾圓圈 -->
  <circle cx="740" cy="120" r="50" fill="#dc2626" opacity="0.05"/>
  <circle cx="760" cy="480" r="35" fill="#d97706" opacity="0.08"/>

  <!-- 浮水印 -->
  <text x="600" y="612" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#a8a29e" text-anchor="middle" opacity="0.7">報告汪 reportwang.com</text>
</svg>
