<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- Header -->
  <rect x="0" y="0" width="800" height="90" fill="white"/>
  <rect x="0" y="0" width="6" height="90" fill="#d97706" rx="2"/>
  <text x="28" y="45" font-size="30" fill="#1e293b" font-weight="700">PDCA 持續改善循環</text>
  <text x="28" y="73" font-size="18" fill="#78716c">4 個步驟 × 托嬰中心評鑑改善實務應用</text>

  <!-- 4 cards: N=4, card_w=174, H=62 -->
  <!-- Card layout: 4 cards in a row with arrows -->
  <!-- Card 1: Plan y=160 -->
  <rect x="28" y="160" width="174" height="235" rx="12" fill="white" stroke="#e8e6de" stroke-width="1.5"/>
  <rect x="28" y="160" width="174" height="8" rx="6" fill="#d97706"/>
  <text x="115" y="210" font-size="48" fill="#d97706" text-anchor="middle" font-weight="900">P</text>
  <text x="115" y="250" font-size="24" fill="#1e293b" text-anchor="middle" font-weight="700">Plan</text>
  <text x="115" y="276" font-size="18" fill="#78716c" text-anchor="middle">計畫</text>
  <line x1="50" y1="295" x2="180" y2="295" stroke="#e8e6de" stroke-width="1"/>
  <text x="115" y="318" font-size="14" fill="#57534e" text-anchor="middle">問題描述</text>
  <text x="115" y="338" font-size="14" fill="#57534e" text-anchor="middle">原因分析</text>
  <text x="115" y="358" font-size="14" fill="#57534e" text-anchor="middle">目標設定</text>
  <text x="115" y="378" font-size="14" fill="#d97706" text-anchor="middle" font-weight="600">- 月底完成</text>

  <!-- Arrow 1 -->
  <text x="218" y="285" font-size="28" fill="#a8a29e" text-anchor="middle">-</text>

  <!-- Card 2: Do y=160 -->
  <rect x="232" y="160" width="174" height="235" rx="12" fill="white" stroke="#e8e6de" stroke-width="1.5"/>
  <rect x="232" y="160" width="174" height="8" rx="6" fill="#78716c"/>
  <text x="319" y="210" font-size="48" fill="#78716c" text-anchor="middle" font-weight="900">D</text>
  <text x="319" y="250" font-size="24" fill="#1e293b" text-anchor="middle" font-weight="700">Do</text>
  <text x="319" y="276" font-size="18" fill="#78716c" text-anchor="middle">執行</text>
  <line x1="254" y1="295" x2="384" y2="295" stroke="#e8e6de" stroke-width="1"/>
  <text x="319" y="318" font-size="14" fill="#57534e" text-anchor="middle">指定負責人</text>
  <text x="319" y="338" font-size="14" fill="#57534e" text-anchor="middle">訂定截止日</text>
  <text x="319" y="358" font-size="14" fill="#57534e" text-anchor="middle">逐步執行</text>
  <text x="319" y="378" font-size="14" fill="#78716c" text-anchor="middle" font-weight="600">- 每週回報</text>

  <!-- Arrow 2 -->
  <text x="422" y="285" font-size="28" fill="#a8a29e" text-anchor="middle">-</text>

  <!-- Card 3: Check y=160 -->
  <rect x="436" y="160" width="174" height="235" rx="12" fill="white" stroke="#e8e6de" stroke-width="1.5"/>
  <rect x="436" y="160" width="174" height="8" rx="6" fill="#57534e"/>
  <text x="523" y="210" font-size="48" fill="#57534e" text-anchor="middle" font-weight="900">C</text>
  <text x="523" y="250" font-size="24" fill="#1e293b" text-anchor="middle" font-weight="700">Check</text>
  <text x="523" y="276" font-size="18" fill="#78716c" text-anchor="middle">查核</text>
  <line x1="458" y1="295" x2="588" y2="295" stroke="#e8e6de" stroke-width="1"/>
  <text x="523" y="318" font-size="14" fill="#57534e" text-anchor="middle">成效驗證</text>
  <text x="523" y="338" font-size="14" fill="#57534e" text-anchor="middle">數據確認</text>
  <text x="523" y="358" font-size="14" fill="#57534e" text-anchor="middle">偏差分析</text>
  <text x="523" y="378" font-size="14" fill="#57534e" text-anchor="middle" font-weight="600">- 月底報告</text>

  <!-- Arrow 3 -->
  <text x="626" y="285" font-size="28" fill="#a8a29e" text-anchor="middle">-</text>

  <!-- Card 4: Act y=160 -->
  <rect x="640" y="160" width="134" height="235" rx="12" fill="white" stroke="#e8e6de" stroke-width="1.5"/>
  <rect x="640" y="160" width="134" height="8" rx="6" fill="#94a3b8"/>
  <text x="707" y="210" font-size="48" fill="#94a3b8" text-anchor="middle" font-weight="900">A</text>
  <text x="707" y="250" font-size="24" fill="#1e293b" text-anchor="middle" font-weight="700">Act</text>
  <text x="707" y="276" font-size="18" fill="#78716c" text-anchor="middle">改善</text>
  <line x1="660" y1="295" x2="754" y2="295" stroke="#e8e6de" stroke-width="1"/>
  <text x="707" y="318" font-size="14" fill="#57534e" text-anchor="middle">標準化</text>
  <text x="707" y="338" font-size="14" fill="#57534e" text-anchor="middle">制度化</text>
  <text x="707" y="358" font-size="14" fill="#57534e" text-anchor="middle">下輪循環</text>
  <text x="707" y="378" font-size="14" fill="#94a3b8" text-anchor="middle" font-weight="600">- 持續優化</text>

  <!-- 底部說明 -->
  <rect x="28" y="418" width="744" height="44" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="400" y="446" font-size="16" fill="#78716c" text-anchor="middle">改善計畫包含：問題 + 原因 + 行動 + 負責人 + 截止日 + 驗證方式，六要素缺一不可</text>

  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
