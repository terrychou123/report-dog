<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', sans-serif">
  <rect width="1200" height="630" fill="#f0efe8"/>

  <!-- 右側裝飾區塊 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>

  <!-- 右側大數字 3 -->
  <text x="1010" y="290" text-anchor="middle" font-size="220" fill="#9333ea" font-weight="900" opacity="0.80">3</text>
  <text x="1010" y="338" text-anchor="middle" font-size="24" fill="#78716c" font-weight="600">2.5章三項必要條文</text>

  <!-- 右側資訊卡片 -->
  <rect x="840" y="366" width="320" height="52" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="1000" y="399" text-anchor="middle" font-size="22" fill="#9333ea" font-weight="700">給藥作業安全 2.5.4</text>

  <rect x="840" y="428" width="320" height="52" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="1000" y="461" text-anchor="middle" font-size="22" fill="#d97706" font-weight="700">高警訊藥品管理 2.5.5</text>

  <rect x="840" y="490" width="320" height="52" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="1000" y="523" text-anchor="middle" font-size="22" fill="#78716c" font-weight="700">管制藥品管理 2.5.8</text>

  <!-- 右側底部標籤 -->
  <rect x="840" y="552" width="320" height="46" rx="10" fill="#9333ea" opacity="0.12"/>
  <text x="1000" y="582" text-anchor="middle" font-size="22" fill="#9333ea" font-weight="700">資料查核＋實地查核</text>

  <!-- 左側主標題 -->
  <text x="60" y="208" font-size="100" fill="#1e293b" font-weight="900">用藥安全</text>
  <text x="60" y="320" font-size="88" fill="#9333ea" font-weight="900">三大必要條文</text>

  <!-- 左側分隔線 -->
  <line x1="60" y1="350" x2="780" y2="350" stroke="#dedad3" stroke-width="2"/>

  <!-- 左側副標題 -->
  <text x="60" y="392" font-size="30" fill="#57534e">醫院評鑑2.5章 × 給藥五對 × 高警訊藥品完整攻略</text>

  <!-- 特色標籤列 -->
  <rect x="60" y="420" width="148" height="48" rx="10" fill="#9333ea" opacity="0.12"/>
  <text x="134" y="452" text-anchor="middle" font-size="24" fill="#9333ea" font-weight="600">給藥五對查核</text>

  <rect x="220" y="420" width="148" height="48" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="294" y="452" text-anchor="middle" font-size="24" fill="#d97706" font-weight="600">高警訊標示</text>

  <rect x="380" y="420" width="148" height="48" rx="10" fill="#78716c" opacity="0.12"/>
  <text x="454" y="452" text-anchor="middle" font-size="24" fill="#78716c" font-weight="600">雙重查核</text>

  <rect x="540" y="420" width="148" height="48" rx="10" fill="#dc2626" opacity="0.12"/>
  <text x="614" y="452" text-anchor="middle" font-size="24" fill="#dc2626" font-weight="600">管制藥清點</text>

  <!-- 第二排標籤 -->
  <rect x="60" y="480" width="148" height="48" rx="10" fill="#16a34a" opacity="0.12"/>
  <text x="134" y="512" text-anchor="middle" font-size="24" fill="#16a34a" font-weight="600">浪費量簽名</text>

  <rect x="220" y="480" width="148" height="48" rx="10" fill="#0d9488" opacity="0.12"/>
  <text x="294" y="512" text-anchor="middle" font-size="24" fill="#0d9488" font-weight="600">身分確認</text>

  <rect x="380" y="480" width="148" height="48" rx="10" fill="#4f46e5" opacity="0.12"/>
  <text x="454" y="512" text-anchor="middle" font-size="24" fill="#4f46e5" font-weight="600">實地查核準備</text>

  <!-- 適用對象 -->
  <text x="60" y="562" font-size="24" fill="#a8a29e">適用：護理師、藥師、護理主管、品管人員</text>

  <!-- 浮水印 -->
  <text x="1140" y="612" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
