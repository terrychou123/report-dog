<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1800" height="390" viewBox="0 0 1800 390"
     font-family="'Noto Sans TC', sans-serif">

  <!-- 背景 -->
  <rect width="1800" height="390" fill="#e8e6de"/>

  <!-- 大標題 -->
  <text x="900" y="28" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="700">五種 SVG 模板比較（標題區 y=94 / 內容底 y=450 對齊分類卡片下緣）</text>

  <!-- ===== Panel 0: 流程圖 ===== -->
  <rect x="20" y="42" width="2" height="14" fill="#d97706"/>
  <text x="26" y="53" font-size="13" fill="#1e293b" font-weight="700">流程圖</text>
  <text x="354" y="53" text-anchor="end" font-size="11" fill="#78716c">卡片底 y=450，內容垂直置中</text>
  <image href="template-flow.svg" xlink:href="template-flow.svg"
    x="20" y="60" width="336" height="210"/>
  <!-- 標題區分隔線 y=94 → panel y=60+(94/500)*210=99.5≈100 -->
  <line x1="20" y1="100" x2="356" y2="100" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,2" opacity="0.8"/>
  <!-- 內容底 y=450 → panel y=60+(450/500)*210=249 -->
  <line x1="20" y1="249" x2="356" y2="249" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4,2" opacity="0.8"/>

  <!-- ===== Panel 1: 時程圖 ===== -->
  <rect x="376" y="42" width="2" height="14" fill="#78716c"/>
  <text x="382" y="53" font-size="13" fill="#1e293b" font-weight="700">時程圖</text>
  <text x="710" y="53" text-anchor="end" font-size="11" fill="#78716c">時間軸 y=272，下方卡片底 y=450</text>
  <image href="template-timeline.svg" xlink:href="template-timeline.svg"
    x="376" y="60" width="336" height="210"/>
  <line x1="376" y1="100" x2="712" y2="100" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,2" opacity="0.8"/>
  <line x1="376" y1="249" x2="712" y2="249" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4,2" opacity="0.8"/>

  <!-- ===== Panel 2: 檢核表 ===== -->
  <rect x="732" y="42" width="2" height="14" fill="#57534e"/>
  <text x="738" y="53" font-size="13" fill="#1e293b" font-weight="700">檢核表</text>
  <text x="1066" y="53" text-anchor="end" font-size="11" fill="#78716c">左欄右移 +20px</text>
  <image href="template-checklist.svg" xlink:href="template-checklist.svg"
    x="732" y="60" width="336" height="210"/>
  <line x1="732" y1="100" x2="1068" y2="100" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,2" opacity="0.8"/>

  <!-- ===== Panel 3: 分類卡片 ===== -->
  <rect x="1088" y="42" width="2" height="14" fill="#a8a29e"/>
  <text x="1094" y="53" font-size="13" fill="#1e293b" font-weight="700">分類卡片</text>
  <text x="1422" y="53" text-anchor="end" font-size="11" fill="#78716c">下排卡片底 y=450（基準）</text>
  <image href="template-categories.svg" xlink:href="template-categories.svg"
    x="1088" y="60" width="336" height="210"/>
  <line x1="1088" y1="100" x2="1424" y2="100" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,2" opacity="0.8"/>
  <line x1="1088" y1="249" x2="1424" y2="249" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4,2" opacity="0.8"/>

  <!-- ===== Panel 4: PDCA ===== -->
  <rect x="1444" y="42" width="2" height="14" fill="#94a3b8"/>
  <text x="1450" y="53" font-size="13" fill="#1e293b" font-weight="700">PDCA 循環圖</text>
  <text x="1778" y="53" text-anchor="end" font-size="11" fill="#78716c">主標32px y=48 / 副標22px y=78 / 線y=94</text>
  <image href="template-pdca.svg" xlink:href="template-pdca.svg"
    x="1444" y="60" width="336" height="210"/>
  <line x1="1444" y1="100" x2="1780" y2="100" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,2" opacity="0.8"/>

  <!-- 跨全圖統一標題分隔線（紅色，全部對齊） -->
  <line x1="20" y1="100" x2="1780" y2="100" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="10,5" opacity="0.35"/>
  <!-- 跨全圖內容底對齊線（藍色，流程/時程/分類） -->
  <line x1="20" y1="249" x2="1424" y2="249" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="10,5" opacity="0.4"/>

  <!-- 底部說明 -->
  <rect x="20" y="291" width="1760" height="1" fill="#c4bfb8"/>
  <line x1="36" y1="314" x2="66" y2="314" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,2" opacity="0.8"/>
  <text x="72" y="319" font-size="12" fill="#57534e">— 標題區分隔線 y=94</text>
  <line x1="260" y1="314" x2="290" y2="314" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4,2" opacity="0.8"/>
  <text x="296" y="319" font-size="12" fill="#57534e">— 內容底 y=450（對齊分類卡片下緣）</text>
  <text x="20" y="348" font-size="12" fill="#57534e">✓ 流程圖卡片底=450（內容垂直置中）｜時程圖時間軸 y=272，下方卡片底=450｜分類卡片為基準</text>
</svg>
