<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 右側裝飾區塊 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>

  <!-- 右側裝飾大文字 -->
  <text x="1010" y="190" font-size="80" font-weight="900" fill="#d97706" text-anchor="middle" opacity="0.85">8</text>
  <text x="1010" y="228" font-size="26" fill="#78716c" text-anchor="middle" font-weight="600">vs 75 項基準</text>

  <!-- 右側比較卡片 -->
  <rect x="840" y="250" width="320" height="80" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="1000" y="282" font-size="26" fill="#d97706" text-anchor="middle" font-weight="700">居家護理所</text>
  <text x="1000" y="310" font-size="22" fill="#78716c" text-anchor="middle">8 項基準 · 資料查核為主</text>
  <text x="1000" y="328" font-size="18" fill="#a8a29e" text-anchor="middle">文件品質是關鍵</text>

  <rect x="840" y="342" width="320" height="80" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="1000" y="374" font-size="26" fill="#78716c" text-anchor="middle" font-weight="700">住宿型機構</text>
  <text x="1000" y="402" font-size="22" fill="#78716c" text-anchor="middle">75 項以上 · 現場觀察</text>
  <text x="1000" y="420" font-size="18" fill="#a8a29e" text-anchor="middle">環境設施也被查核</text>

  <rect x="840" y="434" width="320" height="80" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="1000" y="466" font-size="26" fill="#57534e" text-anchor="middle" font-weight="700">日照中心</text>
  <text x="1000" y="494" font-size="22" fill="#78716c" text-anchor="middle">40–45 項 · 活動觀察</text>
  <text x="1000" y="512" font-size="18" fill="#a8a29e" text-anchor="middle">集中式照護評核</text>

  <!-- 浮水印 -->
  <text x="1140" y="590" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>

  <!-- 左側主內容區 -->
  <text x="60" y="190" font-size="100" font-weight="900" fill="#1e293b">居家護理所</text>
  <text x="60" y="318" font-size="100" font-weight="900" fill="#d97706">評鑑差異比較</text>

  <line x1="60" y1="348" x2="780" y2="348" stroke="#dedad3" stroke-width="2"/>

  <text x="60" y="400" font-size="36" fill="#57534e" font-weight="400">與住宿型機構、日照中心的基準差異分析</text>

  <!-- 特色標籤列 -->
  <rect x="60" y="434" width="148" height="54" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="134" y="471" font-size="28" fill="#d97706" text-anchor="middle" font-weight="600">差異比較</text>

  <rect x="220" y="434" width="148" height="54" rx="10" fill="#78716c" opacity="0.12"/>
  <text x="294" y="471" font-size="28" fill="#78716c" text-anchor="middle" font-weight="600">評鑑認識</text>

  <rect x="380" y="434" width="148" height="54" rx="10" fill="#57534e" opacity="0.12"/>
  <text x="454" y="471" font-size="28" fill="#57534e" text-anchor="middle" font-weight="600">8 項基準</text>

  <rect x="540" y="434" width="148" height="54" rx="10" fill="#a8a29e" opacity="0.18"/>
  <text x="614" y="471" font-size="28" fill="#78716c" text-anchor="middle" font-weight="600">115 年度</text>

  <!-- 適用對象 -->
  <text x="60" y="540" font-size="28" fill="#94a3b8">適用對象：初次接觸居家護理所評鑑的護理人員</text>
</svg>
