<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <rect x="0" y="50" width="800" height="76" fill="white"/>
  <rect x="0" y="50" width="6" height="76" rx="2" fill="#d97706"/>
  <text x="28" y="104" font-size="36" fill="#1e293b" font-weight="700">職前 16 小時 vs 每年在職 20 小時</text>
  <rect x="28" y="175" width="744" height="130" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="175" width="6" height="130" rx="2" fill="#d97706"/>
  <circle cx="66" cy="235" r="20" fill="#d97706" opacity="0.15"/>
  <text x="66" y="241" font-size="18" fill="#d97706" text-anchor="middle" font-weight="900">職前</text>
  <text x="100" y="225" font-size="22" fill="#1e293b" font-weight="700">職前訓練：到職後 1 個月內完成 16 小時</text>
  <text x="100" y="251" font-size="16" fill="#57534e">適用所有新進人員（護理師、照服員、社工師、行政等）</text>
  <text x="100" y="271" font-size="16" fill="#57534e">16 小時可分次完成，到職日當天的訓練可計入</text>
  <text x="100" y="291" font-size="16" fill="#57534e">超過 30 個曆日未完成即視為缺失</text>
  <rect x="620" y="183" width="136" height="115" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="234" font-size="16" fill="#d97706" text-anchor="middle">30 天</text>
  <text x="688" y="254" font-size="16" fill="#d97706" text-anchor="middle">16 小時</text>
  <rect x="28" y="325" width="744" height="120" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="325" width="6" height="120" rx="2" fill="#78716c"/>
  <circle cx="66" cy="380" r="20" fill="#78716c" opacity="0.15"/>
  <text x="66" y="386" font-size="18" fill="#78716c" text-anchor="middle" font-weight="900">在職</text>
  <text x="100" y="370" font-size="22" fill="#1e293b" font-weight="700">在職訓練：每人每年 20 小時（含感控 4 小時）</text>
  <text x="100" y="396" font-size="16" fill="#57534e">涵蓋所有工作人員（含兼職、外籍看護工）</text>
  <text x="100" y="416" font-size="16" fill="#57534e">感控訓練 4 小時必須獨立計算，是最常查核的細節</text>
  <rect x="620" y="333" width="136" height="105" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="381" font-size="16" fill="#78716c" text-anchor="middle">20 小時</text>
  <text x="688" y="401" font-size="16" fill="#78716c" text-anchor="middle">感控 4H</text>
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
