<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 右側裝飾區塊 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>

  <!-- 右側裝飾大數字 -->
  <text x="1010" y="219" font-size="160" font-weight="900" fill="#d97706" text-anchor="middle" opacity="0.85">5</text>
  <text x="1010" y="261" font-size="26" fill="#78716c" text-anchor="middle" font-weight="600">甲等機構共同特徵</text>

  <!-- 右側 5 個特徵 pill 列表 -->
  <rect x="840" y="279" width="320" height="46" rx="8" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="860" y="294" font-size="22" fill="#d97706" font-weight="700">01</text>
  <text x="900" y="325" font-size="22" fill="#78716c">品質指標是管理工具</text>

  <rect x="840" y="337" width="320" height="46" rx="8" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="860" y="352" font-size="22" fill="#d97706" font-weight="700">02</text>
  <text x="900" y="383" font-size="22" fill="#78716c">文件管理有系統</text>

  <rect x="840" y="395" width="320" height="46" rx="8" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="860" y="410" font-size="22" fill="#d97706" font-weight="700">03</text>
  <text x="900" y="441" font-size="22" fill="#78716c">PDCA 真實運轉</text>

  <rect x="840" y="453" width="320" height="46" rx="8" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="860" y="468" font-size="22" fill="#d97706" font-weight="700">04</text>
  <text x="900" y="499" font-size="22" fill="#78716c">跨專業合作落實</text>

  <rect x="840" y="511" width="320" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="860" y="526" font-size="22" fill="#d97706" font-weight="700">05</text>
  <text x="900" y="557" font-size="22" fill="#d97706" font-weight="600">全員了解評鑑基準</text>

  <!-- 浮水印 -->
  <text x="1140" y="590" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>

  <!-- 左側主內容區 -->
  <text x="60" y="190" font-size="100" font-weight="900" fill="#1e293b">甲等評鑑機構</text>
  <text x="60" y="318" font-size="100" font-weight="900" fill="#d97706">5 個共同特徵</text>

  <line x1="60" y1="348" x2="780" y2="348" stroke="#dedad3" stroke-width="2"/>

  <text x="60" y="400" font-size="36" fill="#57534e" font-weight="400">從品質監測到全員共識的甲等機構做法</text>

  <!-- 特色標籤列 -->
  <rect x="60" y="434" width="148" height="54" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="134" y="471" font-size="28" fill="#d97706" text-anchor="middle" font-weight="600">品質管理</text>

  <rect x="220" y="434" width="148" height="54" rx="10" fill="#78716c" opacity="0.12"/>
  <text x="294" y="471" font-size="28" fill="#78716c" text-anchor="middle" font-weight="600">PDCA 循環</text>

  <rect x="380" y="434" width="148" height="54" rx="10" fill="#57534e" opacity="0.12"/>
  <text x="454" y="471" font-size="28" fill="#57534e" text-anchor="middle" font-weight="600">甲等評鑑</text>

  <rect x="540" y="434" width="148" height="54" rx="10" fill="#a8a29e" opacity="0.18"/>
  <text x="614" y="471" font-size="28" fill="#78716c" text-anchor="middle" font-weight="600">115 年度</text>

  <!-- 適用對象 -->
  <text x="60" y="540" font-size="28" fill="#94a3b8">適用對象：居家護理所負責人 · 護理長 · 品管人員</text>
