<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- Header -->
  <rect x="40" y="50" width="720" height="62" rx="8" fill="#d97706"/>
  <text x="400" y="88" font-size="22" fill="white" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-weight="700">讓委員留下好印象的 4 大技巧</text>
  <!-- Row 1 -->
  <rect x="40" y="160" width="720" height="62" rx="6" fill="white" stroke="#e8e6de" stroke-width="1.5"/>
  <rect x="40" y="160" width="8" height="62" rx="3" fill="#d97706"/>
  <text x="76" y="185" font-size="14" fill="#d97706" font-family="'Noto Sans TC', sans-serif" font-weight="700">技巧 1</text>
  <text x="160" y="185" font-size="18" fill="#1e293b" font-family="'Noto Sans TC', sans-serif" font-weight="700">主動說明制度</text>
  <text x="160" y="210" font-size="14" fill="#78716c" font-family="'Noto Sans TC', sans-serif">不等委員問，主動導覽各區域制度，展示對自身業務的熟悉度與自信</text>
  <!-- Row 2 -->
  <rect x="40" y="235" width="720" height="62" rx="6" fill="white" stroke="#e8e6de" stroke-width="1.5"/>
  <rect x="40" y="235" width="8" height="62" rx="3" fill="#78716c"/>
  <text x="76" y="260" font-size="14" fill="#78716c" font-family="'Noto Sans TC', sans-serif" font-weight="700">技巧 2</text>
  <text x="160" y="260" font-size="18" fill="#1e293b" font-family="'Noto Sans TC', sans-serif" font-weight="700">文件快速提供</text>
  <text x="160" y="285" font-size="14" fill="#78716c" font-family="'Noto Sans TC', sans-serif">委員要求任何文件，30 秒內取出，文件夾分類清楚有索引，不讓委員等待</text>
  <!-- Row 3 -->
  <rect x="40" y="310" width="720" height="62" rx="6" fill="white" stroke="#e8e6de" stroke-width="1.5"/>
  <rect x="40" y="310" width="8" height="62" rx="3" fill="#57534e"/>
  <text x="76" y="335" font-size="14" fill="#57534e" font-family="'Noto Sans TC', sans-serif" font-weight="700">技巧 3</text>
  <text x="160" y="335" font-size="18" fill="#1e293b" font-family="'Noto Sans TC', sans-serif" font-weight="700">說法前後一致</text>
  <text x="160" y="360" font-size="14" fill="#78716c" font-family="'Noto Sans TC', sans-serif">負責人與托育人員事前溝通說法，避免不一致讓委員產生疑慮</text>
  <!-- Row 4 -->
  <rect x="40" y="385" width="720" height="62" rx="6" fill="white" stroke="#e8e6de" stroke-width="1.5"/>
  <rect x="40" y="385" width="8" height="62" rx="3" fill="#94a3b8"/>
  <text x="76" y="410" font-size="14" fill="#94a3b8" font-family="'Noto Sans TC', sans-serif" font-weight="700">技巧 4</text>
  <text x="160" y="410" font-size="18" fill="#1e293b" font-family="'Noto Sans TC', sans-serif" font-weight="700">坦誠改善計畫</text>
  <text x="160" y="435" font-size="14" fill="#78716c" font-family="'Noto Sans TC', sans-serif">若有尚待改善事項，坦誠說明已知問題與改善時程，委員重視主動改善態度</text>
  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" font-family="'Noto Sans TC', sans-serif">報告汪 reportwang.com</text>
</svg>
