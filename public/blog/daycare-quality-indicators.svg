<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"
     font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- Header（y=29, h=60）-->
  <rect x="0" y="29" width="800" height="60" fill="white"/>
  <rect x="0" y="29" width="6" height="60" fill="#d97706"/>
  <text x="28" y="74" font-size="36" fill="#1e293b" font-weight="700">5 大品管指標範例速覽</text>

  <!-- ===== Row 1（y=118）#d97706 跌倒 ===== -->
  <rect x="28" y="118" width="744" height="60" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="118" width="6" height="60" rx="2" fill="#d97706"/>
  <circle cx="66" cy="148" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="154" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <text x="100" y="145" font-size="20" fill="#1e293b" font-weight="700">跌倒發生率</text>
  <text x="100" y="165" font-size="16" fill="#57534e">統計每月跌倒件數，目標值設定為每月 &lt; 2 件並逐案分析</text>
  <rect x="620" y="126" width="136" height="44" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="143" font-size="16" fill="#d97706" text-anchor="middle">安全照護</text>
  <text x="688" y="163" font-size="16" fill="#d97706" text-anchor="middle">高優先指標</text>

  <!-- ===== Row 2（y=191）#78716c 壓傷 ===== -->
  <rect x="28" y="191" width="744" height="60" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="191" width="6" height="60" rx="2" fill="#78716c"/>
  <circle cx="66" cy="221" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="227" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <text x="100" y="218" font-size="20" fill="#1e293b" font-weight="700">壓傷（壓瘡）發生率</text>
  <text x="100" y="238" font-size="16" fill="#57534e">追蹤新生壓傷件數，目標值設定為每月新生 0 件</text>
  <rect x="620" y="199" width="136" height="44" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="216" font-size="16" fill="#78716c" text-anchor="middle">皮膚照護</text>
  <text x="688" y="236" font-size="16" fill="#78716c" text-anchor="middle">高優先指標</text>

  <!-- ===== Row 3（y=264）#57534e 服藥 ===== -->
  <rect x="28" y="264" width="744" height="60" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="264" width="6" height="60" rx="2" fill="#57534e"/>
  <circle cx="66" cy="294" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="300" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <text x="100" y="291" font-size="20" fill="#1e293b" font-weight="700">服藥遵從率</text>
  <text x="100" y="311" font-size="16" fill="#57534e">監測個案依醫囑服藥比率，目標值設定為每月 &gt; 95%</text>
  <rect x="620" y="272" width="136" height="44" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="289" font-size="16" fill="#57534e" text-anchor="middle">用藥管理</text>
  <text x="688" y="309" font-size="16" fill="#57534e" text-anchor="middle">常見指標</text>

  <!-- ===== Row 4（y=337）#a8a29e 滿意度 ===== -->
  <rect x="28" y="337" width="744" height="60" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="337" width="6" height="60" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="367" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="373" font-size="16" fill="#a8a29e" text-anchor="middle" font-weight="900">4</text>
  <text x="100" y="364" font-size="20" fill="#1e293b" font-weight="700">個案滿意度</text>
  <text x="100" y="384" font-size="16" fill="#57534e">每季調查個案及家屬滿意度，目標值設定為 &gt; 85 分</text>
  <rect x="620" y="345" width="136" height="44" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="362" font-size="16" fill="#a8a29e" text-anchor="middle">服務品質</text>
  <text x="688" y="382" font-size="16" fill="#a8a29e" text-anchor="middle">自訂指標</text>

  <!-- ===== Row 5（y=410）#94a3b8 訓練 ===== -->
  <rect x="28" y="410" width="744" height="60" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="410" width="6" height="60" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="440" r="16" fill="#94a3b8" opacity="0.15"/>
  <text x="66" y="446" font-size="16" fill="#94a3b8" text-anchor="middle" font-weight="900">5</text>
  <text x="100" y="437" font-size="20" fill="#1e293b" font-weight="700">教育訓練達成率</text>
  <text x="100" y="457" font-size="16" fill="#57534e">追蹤每位人員年度訓練時數達標比率，目標值為 100%</text>
  <rect x="620" y="418" width="136" height="44" rx="8" fill="#94a3b8" opacity="0.12"/>
  <text x="688" y="435" font-size="16" fill="#94a3b8" text-anchor="middle">人力發展</text>
  <text x="688" y="455" font-size="16" fill="#94a3b8" text-anchor="middle">自訂指標</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
