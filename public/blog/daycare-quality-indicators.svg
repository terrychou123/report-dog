<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="450" fill="#f0efe8"/>
  <text x="400" y="46" font-size="21" font-weight="700" fill="#1e293b" text-anchor="middle">5 大品管指標範例：直接參考套用</text>
  <rect x="60" y="58" width="48" height="3" rx="1.5" fill="#d97706"/>
  <line x1="116" y1="59.5" x2="740" y2="59.5" stroke="#dedad3" stroke-width="1"/>

  <!-- Header row -->
  <rect x="52" y="74" width="696" height="30" rx="6" fill="#78716c" opacity="0.10"/>
  <text x="120" y="94" font-size="12" fill="#78716c" font-weight="700" text-anchor="middle">指標名稱</text>
  <text x="310" y="94" font-size="12" fill="#78716c" font-weight="700" text-anchor="middle">計算方式</text>
  <text x="490" y="94" font-size="12" fill="#78716c" font-weight="700" text-anchor="middle">建議目標值</text>
  <text x="680" y="94" font-size="12" fill="#78716c" font-weight="700" text-anchor="middle">對應條文</text>
  <line x1="52" y1="104" x2="748" y2="104" stroke="#dedad3" stroke-width="1"/>

  <!-- Row 1 -->
  <rect x="52" y="106" width="696" height="56" rx="0" fill="#d97706" opacity="0.05"/>
  <text x="68" y="126" font-size="13" fill="#1e293b" font-weight="600">跌倒發生率</text>
  <text x="68" y="148" font-size="11" fill="#64748b">當月跌倒件數/在案人日數</text>
  <text x="258" y="126" font-size="12" fill="#64748b">月跌倒件數 ÷</text>
  <text x="258" y="144" font-size="12" fill="#64748b">月在案總人次 × 100%</text>
  <text x="480" y="135" font-size="13" fill="#d97706" font-weight="700" text-anchor="middle">≤ 3%</text>
  <text x="680" y="135" font-size="12" fill="#78716c" text-anchor="middle">第 18、19 條</text>

  <!-- Row 2 -->
  <rect x="52" y="162" width="696" height="56" rx="0" fill="white"/>
  <text x="68" y="182" font-size="13" fill="#1e293b" font-weight="600">個案計畫準時更新率</text>
  <text x="68" y="200" font-size="11" fill="#64748b">每季計畫依時更新比例</text>
  <text x="258" y="182" font-size="12" fill="#64748b">準時更新人數 ÷</text>
  <text x="258" y="200" font-size="12" fill="#64748b">在案總人數 × 100%</text>
  <text x="480" y="191" font-size="13" fill="#d97706" font-weight="700" text-anchor="middle">≥ 95%</text>
  <text x="680" y="191" font-size="12" fill="#78716c" text-anchor="middle">第 7、8 條</text>

  <!-- Row 3 -->
  <rect x="52" y="218" width="696" height="56" rx="0" fill="#d97706" opacity="0.05"/>
  <text x="68" y="238" font-size="13" fill="#1e293b" font-weight="600">用藥記錄完整率</text>
  <text x="68" y="256" font-size="11" fill="#64748b">用藥表格填寫完整比例</text>
  <text x="258" y="238" font-size="12" fill="#64748b">完整記錄件數 ÷</text>
  <text x="258" y="256" font-size="12" fill="#64748b">用藥總件數 × 100%</text>
  <text x="480" y="247" font-size="13" fill="#d97706" font-weight="700" text-anchor="middle">≥ 98%</text>
  <text x="680" y="247" font-size="12" fill="#78716c" text-anchor="middle">第 12、13 條</text>

  <!-- Row 4 -->
  <rect x="52" y="274" width="696" height="56" rx="0" fill="white"/>
  <text x="68" y="294" font-size="13" fill="#1e293b" font-weight="600">家屬滿意度</text>
  <text x="68" y="312" font-size="11" fill="#64748b">年度家屬問卷平均分數</text>
  <text x="258" y="294" font-size="12" fill="#64748b">問卷總分 ÷</text>
  <text x="258" y="312" font-size="12" fill="#64748b">回覆人數</text>
  <text x="480" y="303" font-size="13" fill="#d97706" font-weight="700" text-anchor="middle">≥ 85 分</text>
  <text x="680" y="303" font-size="12" fill="#78716c" text-anchor="middle">第 1、2 條</text>

  <!-- Row 5 -->
  <rect x="52" y="330" width="696" height="56" rx="0" fill="#d97706" opacity="0.05"/>
  <text x="68" y="350" font-size="13" fill="#1e293b" font-weight="600">教育訓練時數達標率</text>
  <text x="68" y="368" font-size="11" fill="#64748b">人員訓練時數符合規定比例</text>
  <text x="258" y="350" font-size="12" fill="#64748b">達標人數 ÷</text>
  <text x="258" y="368" font-size="12" fill="#64748b">在職總人數 × 100%</text>
  <text x="480" y="359" font-size="13" fill="#d97706" font-weight="700" text-anchor="middle">100%</text>
  <text x="680" y="359" font-size="12" fill="#78716c" text-anchor="middle">第 25 條</text>

  <line x1="52" y1="386" x2="748" y2="386" stroke="#dedad3" stroke-width="1"/>
  <text x="400" y="404" font-size="12" fill="#a8a29e" text-anchor="middle">以上為建議範例，機構可依實際服務特性調整指標定義與目標值</text>

  <text x="760" y="421" font-size="16" fill="#c4bfb8" text-anchor="end" font-weight="400" font-family="'Noto Sans TC', sans-serif">報告汪 reportwang.com</text>
</svg>
