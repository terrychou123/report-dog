<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="450" fill="#f0efe8"/>

  <!-- 頂部標題區 -->
  <rect x="0" y="0" width="800" height="56" fill="#e8e6de"/>
  <text x="30" y="30" font-size="17" font-weight="700" fill="#1e293b">日常照護技巧與評鑑紀錄要求對照</text>
  <text x="30" y="50" font-size="12" fill="#78716c">115 年度日間照顧中心評鑑基準——失智照護相關條文</text>

  <!-- 表格標題列 -->
  <rect x="30" y="72" width="740" height="36" rx="6" fill="#1e293b"/>
  <text x="130" y="95" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">照護情境</text>
  <text x="360" y="95" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">需要的紀錄內容</text>
  <text x="590" y="95" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">紀錄時限</text>
  <text x="715" y="95" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">對應條文</text>

  <!-- 分隔線 -->
  <line x1="230" y1="72" x2="230" y2="108" stroke="#e8e6de" stroke-width="1"/>
  <line x1="490" y1="72" x2="490" y2="108" stroke="#e8e6de" stroke-width="1"/>
  <line x1="660" y1="72" x2="660" y2="108" stroke="#e8e6de" stroke-width="1"/>

  <!-- 資料列 1 -->
  <rect x="30" y="110" width="740" height="72" rx="6" fill="#ffffff" opacity="0.8"/>
  <rect x="30" y="110" width="6" height="72" rx="3" fill="#d97706"/>
  <text x="135" y="136" font-size="13" font-weight="600" fill="#1e293b" text-anchor="middle">入案認知評估</text>
  <text x="135" y="154" font-size="11" fill="#57534e" text-anchor="middle">（初次服務時）</text>
  <text x="360" y="136" font-size="13" fill="#1e293b" text-anchor="middle">MMSE 評估紀錄</text>
  <text x="360" y="154" font-size="11" fill="#57534e" text-anchor="middle">含認知功能分數與說明</text>
  <text x="590" y="144" font-size="13" fill="#1e293b" text-anchor="middle">入案時完成</text>
  <rect x="672" y="124" width="86" height="26" rx="6" fill="#d97706" opacity="0.12"/>
  <text x="715" y="141" font-size="14" font-weight="700" fill="#d97706" text-anchor="middle">第 5 條</text>
  <line x1="230" y1="110" x2="230" y2="182" stroke="#dedad3" stroke-width="1"/>
  <line x1="490" y1="110" x2="490" y2="182" stroke="#dedad3" stroke-width="1"/>
  <line x1="660" y1="110" x2="660" y2="182" stroke="#dedad3" stroke-width="1"/>

  <!-- 資料列 2 -->
  <rect x="30" y="188" width="740" height="72" rx="6" fill="#ffffff" opacity="0.8"/>
  <rect x="30" y="188" width="6" height="72" rx="3" fill="#78716c"/>
  <text x="135" y="214" font-size="13" font-weight="600" fill="#1e293b" text-anchor="middle">個別化應對策略</text>
  <text x="135" y="232" font-size="11" fill="#57534e" text-anchor="middle">（制定照顧計畫）</text>
  <text x="360" y="214" font-size="13" fill="#1e293b" text-anchor="middle">照顧計畫書（含應對方式）</text>
  <text x="360" y="232" font-size="11" fill="#57534e" text-anchor="middle">個別化、含家屬意見</text>
  <text x="590" y="206" font-size="13" fill="#1e293b" text-anchor="middle">評估後</text>
  <text x="590" y="222" font-size="13" fill="#1e293b" text-anchor="middle">7 工作天內</text>
  <rect x="666" y="202" width="98" height="26" rx="6" fill="#78716c" opacity="0.12"/>
  <text x="715" y="219" font-size="14" font-weight="700" fill="#78716c" text-anchor="middle">第 6 條</text>
  <line x1="230" y1="188" x2="230" y2="260" stroke="#dedad3" stroke-width="1"/>
  <line x1="490" y1="188" x2="490" y2="260" stroke="#dedad3" stroke-width="1"/>
  <line x1="660" y1="188" x2="660" y2="260" stroke="#dedad3" stroke-width="1"/>

  <!-- 資料列 3 -->
  <rect x="30" y="266" width="740" height="72" rx="6" fill="#ffffff" opacity="0.8"/>
  <rect x="30" y="266" width="6" height="72" rx="3" fill="#94a3b8"/>
  <text x="135" y="292" font-size="13" font-weight="600" fill="#1e293b" text-anchor="middle">策略有效性追蹤</text>
  <text x="135" y="310" font-size="11" fill="#57534e" text-anchor="middle">（持續追蹤評值）</text>
  <text x="360" y="292" font-size="13" fill="#1e293b" text-anchor="middle">追蹤評值紀錄</text>
  <text x="360" y="310" font-size="11" fill="#57534e" text-anchor="middle">含目標達成度、原因分析</text>
  <text x="590" y="300" font-size="13" fill="#1e293b" text-anchor="middle">每 6 個月再評估</text>
  <rect x="666" y="280" width="98" height="26" rx="6" fill="#94a3b8" opacity="0.15"/>
  <text x="715" y="297" font-size="14" font-weight="700" fill="#57534e" text-anchor="middle">第 7 條</text>
  <line x1="230" y1="266" x2="230" y2="338" stroke="#dedad3" stroke-width="1"/>
  <line x1="490" y1="266" x2="490" y2="338" stroke="#dedad3" stroke-width="1"/>
  <line x1="660" y1="266" x2="660" y2="338" stroke="#dedad3" stroke-width="1"/>

  <!-- 資料列 4 -->
  <rect x="30" y="344" width="740" height="72" rx="6" fill="#ffffff" opacity="0.8"/>
  <rect x="30" y="344" width="6" height="72" rx="3" fill="#a8a29e"/>
  <text x="135" y="370" font-size="13" font-weight="600" fill="#1e293b" text-anchor="middle">遊走/安全事件</text>
  <text x="135" y="388" font-size="11" fill="#57534e" text-anchor="middle">（緊急或異常狀況）</text>
  <text x="360" y="370" font-size="13" fill="#1e293b" text-anchor="middle">安全看視紀錄</text>
  <text x="360" y="388" font-size="11" fill="#57534e" text-anchor="middle">含告知家屬紀錄</text>
  <text x="590" y="378" font-size="13" fill="#1e293b" text-anchor="middle">事件當下記錄</text>
  <rect x="666" y="358" width="98" height="26" rx="6" fill="#a8a29e" opacity="0.15"/>
  <text x="715" y="375" font-size="14" font-weight="700" fill="#78716c" text-anchor="middle">第 14 條</text>
  <line x1="230" y1="344" x2="230" y2="416" stroke="#dedad3" stroke-width="1"/>
  <line x1="490" y1="344" x2="490" y2="416" stroke="#dedad3" stroke-width="1"/>
  <line x1="660" y1="344" x2="660" y2="416" stroke="#dedad3" stroke-width="1"/>

  <!-- 浮水印 -->
  <text x="760" y="421" font-size="16" fill="#c4bfb8" text-anchor="end" font-weight="400" font-family="'Noto Sans TC', sans-serif">報告汪 reportwang.com</text>
</svg>
