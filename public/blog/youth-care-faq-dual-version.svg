<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- @template: categories -->
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">雙版本評鑑核心關注點比較</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">2歲以下 vs 2歲以上，準備方向完全不同</text>
  <line x1="28" y1="94" x2="772" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- 左欄標題 -->
  <rect x="28" y="108" width="360" height="44" rx="10" fill="#d97706" opacity="0.15"/>
  <text x="208" y="138" font-size="22" fill="#d97706" text-anchor="middle" font-weight="700">2 歲以下嬰幼兒</text>

  <!-- 右欄標題 -->
