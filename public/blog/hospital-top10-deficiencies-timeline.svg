<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">發現缺失後的30天修補計畫</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">三階段，30天內完成評鑑前緊急修補</text>
  <line x1="129" y1="94" x2="671" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- N=3 置中佈局：card_w=170, margin=129 -->
  <!-- card[0]: x=129 cx=214, card[1]: x=315 cx=400, card[2]: x=501 cx=586 -->
  <!-- arrow_y=279 -->

  <!-- 箭頭 -->
  <line x1="299" y1="279" x2="315" y2="279" stroke="#c4bfb8" stroke-width="2"/>
  <polygon points="299,273 315,279 299,285" fill="#c4bfb8"/>
  <line x1="485" y1="279" x2="501" y2="279" stroke="#c4bfb8" stroke-width="2"/>
  <polygon points="485,273 501,279 485,285" fill="#c4bfb8"/>

  <!-- Step 01：文件整理 (#d97706 琥珀) x=129 cx=214 -->
  <rect x="129" y="108" width="170" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="129" y="108" width="170" height="8" rx="4" fill="#d97706"/>
  <rect x="129" y="112" width="170" height="4" fill="#d97706"/>
  <!-- STEP 圓圈 cy=194 r=43 -->
  <circle cx="214" cy="194" r="43" fill="#fef3c7"/>
  <text x="214" y="183" text-anchor="middle" font-size="17" fill="#d97706" font-weight="700">STEP</text>
  <text x="214" y="211" text-anchor="middle" font-size="28" fill="#d97706" font-weight="700">01</text>
  <!-- H 卡片標題 y=297 -->
  <text x="214" y="297" text-anchor="middle" font-size="35" fill="#1e293b" font-weight="700">文件整理</text>
  <!-- J1 J2 -->
  <text x="214" y="324" text-anchor="middle" font-size="20" fill="#57534e">缺失清單盤查</text>
  <text x="214" y="346" text-anchor="middle" font-size="20" fill="#57534e">補齊歷史文件</text>
  <!-- Pill y=381 -->
  <rect x="142" y="381" width="144" height="36" rx="18" fill="#fef3c7"/>
  <text x="214" y="405" text-anchor="middle" font-size="16" fill="#d97706" font-weight="600">第 1-10 天</text>

  <!-- Step 02：實地補強 (#78716c 暖灰) x=315 cx=400 -->
  <rect x="315" y="108" width="170" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="315" y="108" width="170" height="8" rx="4" fill="#78716c"/>
  <rect x="315" y="112" width="170" height="4" fill="#78716c"/>
  <circle cx="400" cy="194" r="43" fill="#f5f5f4"/>
  <text x="400" y="183" text-anchor="middle" font-size="17" fill="#78716c" font-weight="700">STEP</text>
  <text x="400" y="211" text-anchor="middle" font-size="28" fill="#78716c" font-weight="700">02</text>
  <text x="400" y="297" text-anchor="middle" font-size="35" fill="#1e293b" font-weight="700">實地補強</text>
  <text x="400" y="324" text-anchor="middle" font-size="20" fill="#57534e">現場設施標示</text>
  <text x="400" y="346" text-anchor="middle" font-size="20" fill="#57534e">人員知識訓練</text>
  <rect x="328" y="381" width="144" height="36" rx="18" fill="#f5f5f4"/>
  <text x="400" y="405" text-anchor="middle" font-size="16" fill="#78716c" font-weight="600">第 11-20 天</text>

  <!-- Step 03：模擬確認 (#57534e 深棕) x=501 cx=586 -->
  <rect x="501" y="108" width="170" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="501" y="108" width="170" height="8" rx="4" fill="#57534e"/>
  <rect x="501" y="112" width="170" height="4" fill="#57534e"/>
  <circle cx="586" cy="194" r="43" fill="#f5f0eb"/>
  <text x="586" y="183" text-anchor="middle" font-size="17" fill="#57534e" font-weight="700">STEP</text>
  <text x="586" y="211" text-anchor="middle" font-size="28" fill="#57534e" font-weight="700">03</text>
  <text x="586" y="297" text-anchor="middle" font-size="35" fill="#1e293b" font-weight="700">模擬確認</text>
  <text x="586" y="324" text-anchor="middle" font-size="20" fill="#57534e">內部模擬查核</text>
  <text x="586" y="346" text-anchor="middle" font-size="20" fill="#57534e">最終文件確認</text>
  <rect x="514" y="381" width="144" height="36" rx="18" fill="#f5f0eb"/>
  <text x="586" y="405" text-anchor="middle" font-size="16" fill="#57534e" font-weight="600">第 21-30 天</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
