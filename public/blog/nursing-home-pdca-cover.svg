<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', sans-serif">
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 左側裝飾色塊 -->
  <rect x="0" y="0" width="8" height="630" fill="#d97706"/>
  <!-- 頂部裝飾線 -->
  <rect x="60" y="60" width="480" height="4" fill="#d97706"/>
  <!-- 主標題 -->
  <text x="60" y="148"  font-size="52" font-weight="700" fill="#1e293b">評鑑缺失改善追蹤</text>
  <text x="60" y="216"  font-size="52" font-weight="700" fill="#d97706">用 PDCA 讓委員看到你的進步</text>
  <!-- 副標說明 -->
  <text x="60" y="280"  font-size="26" fill="#57534e">A4 查核缺失改善 × E1 前次建議改善</text>
  <!-- 分隔線 -->
  <rect x="60" y="308" width="560" height="2" fill="#a8a29e"/>
  <!-- 三個重點標籤 -->
  <rect x="60" y="334" width="160" height="44" rx="22" fill="#d97706"/>
  <text x="140" y="362"  font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">PDCA 循環</text>
  <rect x="238" y="334" width="160" height="44" rx="22" fill="#78716c"/>
  <text x="318" y="362"  font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">改善率 100%</text>
  <rect x="416" y="334" width="160" height="44" rx="22" fill="#57534e"/>
  <text x="496" y="362"  font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">文件閉環管理</text>
  <!-- 右側 PDCA 圓形圖示 -->
  <!-- 大圓背景 -->
  <circle cx="900" cy="315" r="220" fill="#ffffff"/>
  <!-- P 扇形 -->
  <path d="M900,315 L900,95 A220,220 0 0,1 1055,205 Z" fill="#d97706" opacity="0.9"/>
  <text x="975" y="175"  font-size="36" font-weight="700" fill="#ffffff" text-anchor="middle">P</text>
  <text x="975" y="210"  font-size="16" fill="#ffffff" text-anchor="middle">計畫</text>
  <!-- D 扇形 -->
  <path d="M900,315 L1120,315 A220,220 0 0,1 1010,510 Z" fill="#78716c" opacity="0.9"/>
  <text x="1020" y="420"  font-size="36" font-weight="700" fill="#ffffff" text-anchor="middle">D</text>
  <text x="1020" y="455"  font-size="16" fill="#ffffff" text-anchor="middle">執行</text>
  <!-- C 扇形 -->
  <path d="M900,315 L745,425 A220,220 0 0,1 680,315 Z" fill="#57534e" opacity="0.9"/>
  <text x="756" y="395"  font-size="36" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>
  <text x="756" y="430"  font-size="16" fill="#ffffff" text-anchor="middle">查核</text>
  <!-- A 扇形 -->
  <path d="M900,315 L900,95 A220,220 0 0,0 680,315 Z" fill="#a8a29e" opacity="0.9"/>
  <text x="820" y="200"  font-size="36" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
  <text x="820" y="235"  font-size="16" fill="#ffffff" text-anchor="middle">行動</text>
  <!-- 中心白圓 -->
  <circle cx="900" cy="315" r="65" fill="#f0efe8"/>
  <text x="900" y="308"  font-size="18" font-weight="700" fill="#d97706" text-anchor="middle">持續</text>
  <text x="900" y="332"  font-size="18" font-weight="700" fill="#d97706" text-anchor="middle">改善</text>
  <!-- 底部標籤 -->
  <text x="60" y="430"  font-size="22" fill="#78716c">住宿型照顧機構評鑑準備系列</text>
  <!-- 數字亮點 -->
  <text x="60" y="520"  font-size="80" font-weight="700" fill="#d97706" opacity="0.15">A4</text>
  <!-- 浮水印 -->
  <text x="1140" y="590" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400" >報告汪 reportwang.com</text>
</svg>
