<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <text x="400" y="72" text-anchor="middle" font-size="36" fill="#1e293b" font-weight="700">全人評估與照護計畫更新三時機</text>
  <text x="400" y="108" text-anchor="middle" font-size="22" fill="#57534e">三種觸發條件缺一不可，評鑑委員必查「需求改變」</text>
  <line x1="129" y1="124" x2="671" y2="124" stroke="#dedad3" stroke-width="1"/>
  <line x1="299" y1="293" x2="315" y2="293" stroke="#c4bfb8" stroke-width="2"/>
  <polygon points="299,287 315,293 299,299" fill="#c4bfb8"/>
  <line x1="485" y1="293" x2="501" y2="293" stroke="#c4bfb8" stroke-width="2"/>
  <polygon points="485,287 501,293 485,299" fill="#c4bfb8"/>
  <!-- Step 1: 收案時 (#d97706) -->
  <rect x="129" y="133" width="170" height="320" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="129" y="133" width="170" height="8" rx="4" fill="#d97706"/>
  <rect x="129" y="137" width="170" height="4" fill="#d97706"/>
  <circle cx="214" cy="213" r="43" fill="#fef3c7"/>
  <text x="214" y="202" text-anchor="middle" font-size="17" fill="#d97706" font-weight="700">時機</text>
  <text x="214" y="230" text-anchor="middle" font-size="28" fill="#d97706" font-weight="700">01</text>
  <text x="214" y="310" text-anchor="middle" font-size="30" fill="#1e293b" font-weight="700">收案時</text>
  <text x="214" y="337" text-anchor="middle" font-size="20" fill="#57534e">新個案收案</text>
  <text x="214" y="359" text-anchor="middle" font-size="20" fill="#57534e">首次全人評估</text>
  <rect x="142" y="388" width="144" height="36" rx="18" fill="#fef3c7"/>
  <text x="214" y="412" text-anchor="middle" font-size="16" fill="#d97706" font-weight="600">必做</text>
  <!-- Step 2: 每6個月 (#78716c) -->
  <rect x="315" y="133" width="170" height="320" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="315" y="133" width="170" height="8" rx="4" fill="#78716c"/>
  <rect x="315" y="137" width="170" height="4" fill="#78716c"/>
  <circle cx="400" cy="213" r="43" fill="#f5f5f4"/>
  <text x="400" y="202" text-anchor="middle" font-size="17" fill="#78716c" font-weight="700">時機</text>
  <text x="400" y="230" text-anchor="middle" font-size="28" fill="#78716c" font-weight="700">02</text>
  <text x="400" y="310" text-anchor="middle" font-size="30" fill="#1e293b" font-weight="700">每 6 個月</text>
  <text x="400" y="337" text-anchor="middle" font-size="20" fill="#57534e">定期重新評估</text>
  <text x="400" y="359" text-anchor="middle" font-size="20" fill="#57534e">更新計畫</text>
  <rect x="328" y="388" width="144" height="36" rx="18" fill="#f5f5f4"/>
  <text x="400" y="412" text-anchor="middle" font-size="16" fill="#78716c" font-weight="600">定期</text>
  <!-- Step 3: 需求改變 (#57534e) -->
  <rect x="501" y="133" width="170" height="320" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="501" y="133" width="170" height="8" rx="4" fill="#57534e"/>
  <rect x="501" y="137" width="170" height="4" fill="#57534e"/>
  <circle cx="586" cy="213" r="43" fill="#f5f0eb"/>
  <text x="586" y="202" text-anchor="middle" font-size="17" fill="#57534e" font-weight="700">時機</text>
  <text x="586" y="230" text-anchor="middle" font-size="28" fill="#57534e" font-weight="700">03</text>
  <text x="586" y="310" text-anchor="middle" font-size="30" fill="#1e293b" font-weight="700">需求改變</text>
  <text x="586" y="337" text-anchor="middle" font-size="20" fill="#57534e">出院/新增管路</text>
  <text x="586" y="359" text-anchor="middle" font-size="20" fill="#57534e">意識改變等</text>
  <rect x="514" y="388" width="144" height="36" rx="18" fill="#f5f0eb"/>
  <text x="586" y="412" text-anchor="middle" font-size="16" fill="#57534e" font-weight="600">必查</text>
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
