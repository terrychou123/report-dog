<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- Header -->
  <rect x="0" y="38" width="800" height="72" fill="white"/>
  <rect x="0" y="38" width="6" height="72" fill="#d97706" rx="2"/>
  <text x="28" y="82" font-size="36" fill="#1e293b" font-weight="700">護理之家評鑑文書負擔分析</text>
  <text x="28" y="104" font-size="18" fill="#57534e">115 年度 15 項基準文書作業時間估算</text>

  <!-- Row 1：B1 照護計畫 -->
  <rect x="28" y="122" width="744" height="58" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="122" width="6" height="58" rx="2" fill="#78716c"/>
  <circle cx="66" cy="151" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="157" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <text x="100" y="146" font-size="20" fill="#1e293b" font-weight="700">B1 照護計畫撰寫＋修訂</text>
  <text x="100" y="168" font-size="16" fill="#57534e">每位住民每次 30–60 分鐘，每季全體修訂</text>
  <rect x="580" y="130" width="180" height="42" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="670" y="148" font-size="16" fill="#d97706" text-anchor="middle">最耗時</text>
  <text x="670" y="166" font-size="16" fill="#d97706" text-anchor="middle">15–30 小時/季</text>

  <!-- Row 2：教育訓練記錄 -->
  <rect x="28" y="192" width="744" height="58" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="192" width="6" height="58" rx="2" fill="#57534e"/>
  <circle cx="66" cy="221" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="227" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <text x="100" y="216" font-size="20" fill="#1e293b" font-weight="700">A 區教育訓練記錄（16H+6H+BLS）</text>
  <text x="100" y="238" font-size="16" fill="#57534e">多人出席簽名收集、時數累計追蹤，易出錯</text>
  <rect x="580" y="200" width="180" height="42" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="670" y="218" font-size="16" fill="#78716c" text-anchor="middle">紙本簽名</text>
  <text x="670" y="236" font-size="16" fill="#78716c" text-anchor="middle">4–8 小時/年</text>

  <!-- Row 3：品質分析報告 -->
  <rect x="28" y="262" width="744" height="58" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="262" width="6" height="58" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="291" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="297" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <text x="100" y="286" font-size="20" fill="#1e293b" font-weight="700">B3 每季品質分析報告</text>
  <text x="100" y="308" font-size="16" fill="#57534e">手工統計跌倒/壓傷數據、計算指標、撰寫分析</text>
  <rect x="580" y="270" width="180" height="42" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="670" y="288" font-size="16" fill="#57534e" text-anchor="middle">統計耗時</text>
  <text x="670" y="306" font-size="16" fill="#57534e" text-anchor="middle">3–6 小時/季</text>

  <!-- Row 4：跨專業會議紀錄 -->
  <rect x="28" y="332" width="744" height="58" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="332" width="6" height="58" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="361" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="367" font-size="16" fill="#a8a29e" text-anchor="middle" font-weight="900">4</text>
  <text x="100" y="356" font-size="20" fill="#1e293b" font-weight="700">B2 跨專業照護計畫會議紀錄</text>
  <text x="100" y="378" font-size="16" fill="#57534e">整合各專業意見、決議追蹤、家屬參與記錄</text>
  <rect x="580" y="340" width="180" height="42" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="670" y="358" font-size="16" fill="#1e293b" text-anchor="middle">每季一次</text>
  <text x="670" y="376" font-size="16" fill="#1e293b" text-anchor="middle">2–4 小時/季</text>

  <!-- Row 5：消防安全 -->
  <rect x="28" y="402" width="744" height="58" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="402" width="6" height="58" rx="2" fill="#6b7280"/>
  <circle cx="66" cy="431" r="16" fill="#94a3b8" opacity="0.15"/>
  <text x="66" y="437" font-size="16" fill="#94a3b8" text-anchor="middle" font-weight="900">5</text>
  <text x="100" y="426" font-size="20" fill="#1e293b" font-weight="700">C 區消防演練記錄、感控計畫等其他文書</text>
  <text x="100" y="448" font-size="16" fill="#57534e">感染管制計畫年度審閱、消防演練紀錄等</text>
  <rect x="580" y="410" width="180" height="42" rx="8" fill="#94a3b8" opacity="0.12"/>
  <text x="670" y="428" font-size="16" fill="#94a3b8" text-anchor="middle">持續維護</text>
  <text x="670" y="446" font-size="16" fill="#94a3b8" text-anchor="middle">10–15 小時/年</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
