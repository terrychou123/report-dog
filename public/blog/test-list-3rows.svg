<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!--
    【3 條】N=3, H=100, gap=20（色塊 80% / 間距 20%）
    H = round(500×0.8 / (N+1)) = round(400/4) = 100
    gap = floor((500 - 4×100) / 5) = floor(100/5) = 20
    驗算：4×100 + 5×20 = 500 ✓

    Header y=20, bottom=120
    Row[0] y = 20+100+20 = 140, bottom=240
    Row[1] y = 140+100+20 = 260, bottom=360
    Row[2] y = 260+100+20 = 380, bottom=480 ✓

    M2 "3 大督導留才核心盲點" = 11字 → 9-14 → font=42
    Header text_y = 20 + round(50 + 42×0.35) = 20+65 = 85

    Row Q/R 垂直置中（等視覺留白，cap_ratio=0.82）：
      Q=26 (≤8字): pad=(100-21.32-24-4.32)/2=25.18 → Q=row_y+47, R=row_y+71
      Q=22 (13+字): pad=(100-18.04-24-4.32)/2=26.82 → Q=row_y+45, R=row_y+69

    圓圈直徑 = 文字區塊總高：
      text_block_h = Q_font×0.82 + baseline_gap + R_font×0.24
      circle r = round(text_block_h/2), cy=row_y+50
      Row1 (Q=26): h=49.64 → r=25, NUM font=22, NUM_y=cy+8=198
      Row2-3 (Q=22): h=46.36 → r=23, NUM font=20, NUM_y=cy+7
    S rect h=50, y=row_y+25, S1=row_y+44, S2=row_y+64 (font=16)

    Q Row1 "督導機制形同虛設" = 8字 → font=26
    Q Row2 "教育訓練時數不足或內容無感" = 13字 → font=22
    Q Row3 "不追蹤留任率數字，只靠感覺" = 13字 → font=22
    R 全部 font=18, baseline_gap=24
  -->

  <!-- Header（y=20, h=100） -->
  <rect x="0" y="20" width="800" height="100" fill="#e8e6de"/>
  <rect x="0" y="20" width="6" height="100" fill="#d97706"/>
  <text x="28" y="85" font-size="42" fill="#1e293b" font-weight="700">3 大督導留才核心盲點</text>

  <!-- Row 1（y=140, H=100, center=190） -->
  <rect x="28" y="140" width="744" height="100" rx="10" fill="#e8e6de"/>
  <rect x="28" y="140" width="6" height="100" rx="2" fill="#d97706"/>
  <circle cx="66" cy="190" r="25" fill="#d97706" opacity="0.15"/>
  <text x="66" y="198" font-size="22" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <!-- Q 26px → row_y+47=187；R 18px → row_y+71=211 -->
  <text x="100" y="187" font-size="26" fill="#1e293b" font-weight="700">督導機制形同虛設</text>
  <text x="100" y="211" font-size="18" fill="#57534e">個督頻率不足、督導內容流於形式，員工問題無法被發現與支持</text>
  <!-- S rect y=165, h=50 -->
  <rect x="620" y="165" width="136" height="50" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="184" font-size="16" fill="#d97706" text-anchor="middle">第 9 條</text>
  <text x="688" y="204" font-size="16" fill="#d97706" text-anchor="middle">個督每半年一次</text>

  <!-- Row 2（y=260, H=100, center=310） -->
  <rect x="28" y="260" width="744" height="100" rx="10" fill="#e8e6de"/>
  <rect x="28" y="260" width="6" height="100" rx="2" fill="#78716c"/>
  <circle cx="66" cy="310" r="23" fill="#78716c" opacity="0.15"/>
  <text x="66" y="317" font-size="20" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <!-- Q 22px → row_y+45=305；R 18px → row_y+69=329 -->
  <text x="100" y="305" font-size="22" fill="#1e293b" font-weight="700">教育訓練時數不足或內容無感</text>
  <text x="100" y="329" font-size="18" fill="#57534e">訓練只是簽到、網路課程超過上限，員工缺乏實質學習與成長</text>
  <!-- S rect y=285, h=50 -->
  <rect x="620" y="285" width="136" height="50" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="304" font-size="16" fill="#78716c" text-anchor="middle">第 29 條</text>
  <text x="688" y="324" font-size="16" fill="#78716c" text-anchor="middle">在職 20 小時</text>

  <!-- Row 3（y=380, H=100, center=430） -->
  <rect x="28" y="380" width="744" height="100" rx="10" fill="#e8e6de"/>
  <rect x="28" y="380" width="6" height="100" rx="2" fill="#57534e"/>
  <circle cx="66" cy="430" r="23" fill="#57534e" opacity="0.15"/>
  <text x="66" y="437" font-size="20" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <!-- Q 22px → row_y+45=425；R 18px → row_y+69=449 -->
  <text x="100" y="425" font-size="22" fill="#1e293b" font-weight="700">不追蹤留任率數字，只靠感覺</text>
  <text x="100" y="449" font-size="18" fill="#57534e">不知道如何計算留任率、離職原因未系統性收集與分析</text>
  <!-- S rect y=405, h=50 -->
  <rect x="620" y="405" width="136" height="50" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="424" font-size="16" fill="#57534e" text-anchor="middle">第 30 條</text>
  <text x="688" y="444" font-size="16" fill="#57534e" text-anchor="middle">前四年度留任率</text>

  <!-- 浮水印 -->
  <text x="760" y="492" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
