<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans TC', sans-serif">
  <!-- @template: list-3 -->
  <!-- Background -->
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- Header -->
  <rect x="28" y="29" width="744" height="60" rx="12" fill="#1e293b"/>
  <text x="400" y="53"  font-size="14" fill="#94a3b8" text-anchor="middle">訪談準備</text>
  <text x="400" y="75"  font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">工作人員訪談常見問題方向與兒少訪談注意事項</text>
  <!-- Section label: 工作人員 -->
  <text x="44" y="108"  font-size="14" font-weight="700" fill="#57534e">工作人員訪談（2–3人，各約15–20分鐘）</text>
  <!-- Q1 -->
  <rect x="28" y="118" width="744" height="55" rx="12" fill="#ffffff"/>
  <rect x="28" y="118" width="6" height="55" rx="2" fill="#d97706"/>
  <circle cx="66" cy="145" r="16" fill="#fef3c7"/>
  <text x="66" y="150"  font-size="14" font-weight="700" fill="#d97706" text-anchor="middle">Q</text>
  <text x="100" y="139"  font-size="14" font-weight="700" fill="#1e293b">如何為個案設定年度輔導目標？</text>
  <text x="100" y="158"  font-size="16" fill="#57534e">測試流程知識——能否說明目標設定、追蹤到評估的完整流程</text>
  <!-- Q2 -->
  <rect x="28" y="183" width="744" height="55" rx="12" fill="#ffffff"/>
  <rect x="28" y="183" width="6" height="55" rx="2" fill="#78716c"/>
  <circle cx="66" cy="210" r="16" fill="#f5f5f4"/>
  <text x="66" y="215"  font-size="14" font-weight="700" fill="#78716c" text-anchor="middle">Q</text>
  <text x="100" y="204"  font-size="14" font-weight="700" fill="#1e293b">最近一次督導討論了什麼主題？</text>
  <text x="100" y="223"  font-size="16" fill="#57534e">測試督導落實度——能否說出具體日期和討論內容</text>
  <!-- Q3 -->
  <rect x="28" y="248" width="744" height="55" rx="12" fill="#ffffff"/>
  <rect x="28" y="248" width="6" height="55" rx="2" fill="#57534e"/>
  <circle cx="66" cy="275" r="16" fill="#f5f5f4"/>
  <text x="66" y="280"  font-size="14" font-weight="700" fill="#57534e" text-anchor="middle">Q</text>
  <text x="100" y="269"  font-size="14" font-weight="700" fill="#1e293b">兒少申訴和零用金管理的處理流程？</text>
  <text x="100" y="288"  font-size="16" fill="#57534e">測試制度執行——知道流程且能說出具體步驟</text>
  <!-- Divider -->
  <line x1="28" y1="318" x2="772" y2="318" stroke="#e2e0d8" stroke-width="1"/>
  <!-- Section label: 兒少訪談 -->
  <text x="44" y="340"  font-size="14" font-weight="700" fill="#57534e">兒少訪談注意事項（通常單獨進行，無工作人員在場）</text>
  <!-- Children interview notes -->
  <rect x="28" y="350" width="355" height="100" rx="12" fill="#fff7ed"/>
  <text x="48" y="372"  font-size="14" font-weight="700" fill="#d97706">委員可能詢問的方向</text>
  <text x="48" y="393"  font-size="14" fill="#57534e">- 知道申訴管道嗎？</text>
  <text x="48" y="413"  font-size="14" fill="#57534e">- 零用金金額和發放情況</text>
  <text x="48" y="433"  font-size="14" fill="#57534e">- 有無受到不公平對待</text>
  <rect x="397" y="350" width="375" height="100" rx="12" fill="#f5f5f4"/>
  <text x="417" y="372"  font-size="14" font-weight="700" fill="#78716c">正確準備方式</text>
  <text x="417" y="393"  font-size="14" fill="#57534e">- 平時讓兒少了解自身權益</text>
  <text x="417" y="413"  font-size="14" fill="#57534e">- 確保服務品質真實良好</text>
  <text x="417" y="433"  font-size="14" fill="#57534e">- 勿教導兒少說特定答案</text>
  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
