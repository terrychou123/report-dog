<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- Header -->
  <rect x="0" y="29" width="800" height="60" fill="#e8e6de"/>
  <rect x="0" y="29" width="6" height="60" rx="2" fill="#d97706"/>
  <text x="28" y="74" font-size="28" fill="#1e293b" font-weight="700">自評表填寫後的下一步 4 動作</text>
  <!-- Row 1 N=4 H=62 -->
  <rect x="28" y="118" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="118" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="66" cy="149" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="155" font-size="14" fill="#d97706" text-anchor="middle" font-weight="900">Step1</text>
  <text x="100" y="139" font-size="20" fill="#1e293b" font-weight="700">找出缺口項目</text>
  <text x="100" y="160" font-size="16" fill="#57534e">列出所有「部分符合」和「不符合」，這就是補件清單</text>
  <rect x="620" y="126" width="136" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="146" font-size="16" fill="#d97706" text-anchor="middle">缺口盤點</text>
  <text x="688" y="162" font-size="16" fill="#d97706" text-anchor="middle">第一步</text>
  <!-- Row 2 -->
  <rect x="28" y="191" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="191" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="66" cy="222" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="228" font-size="14" fill="#78716c" text-anchor="middle" font-weight="900">Step2</text>
  <text x="100" y="212" font-size="20" fill="#1e293b" font-weight="700">排定優先順序</text>
  <text x="100" y="233" font-size="16" fill="#57534e">先處理快速可補（更新清單、補協議書），再做需時間累積的</text>
  <rect x="620" y="199" width="136" height="46" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="219" font-size="16" fill="#78716c" text-anchor="middle">難度評估</text>
  <text x="688" y="235" font-size="16" fill="#78716c" text-anchor="middle">排序補件</text>
  <!-- Row 3 -->
  <rect x="28" y="264" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="264" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="295" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="301" font-size="14" fill="#57534e" text-anchor="middle" font-weight="900">Step3</text>
  <text x="100" y="285" font-size="20" fill="#1e293b" font-weight="700">分工執行</text>
  <text x="100" y="306" font-size="16" fill="#57534e">8 項評鑑項目依負責人分工，各司其職平行推進</text>
  <rect x="620" y="272" width="136" height="46" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="292" font-size="16" fill="#57534e" text-anchor="middle">多人協作</text>
  <text x="688" y="308" font-size="16" fill="#57534e" text-anchor="middle">平行進行</text>
  <!-- Row 4 -->
  <rect x="28" y="337" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="337" width="6" height="62" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="368" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="374" font-size="14" fill="#a8a29e" text-anchor="middle" font-weight="900">Step4</text>
  <text x="100" y="358" font-size="20" fill="#1e293b" font-weight="700">評鑑前 2 週最終確認</text>
  <text x="100" y="379" font-size="16" fill="#57534e">用自評表再做一次最終核對，確保所有文件都已就位</text>
  <rect x="620" y="345" width="136" height="46" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="365" font-size="16" fill="#a8a29e" text-anchor="middle">最終確認</text>
  <text x="688" y="381" font-size="16" fill="#a8a29e" text-anchor="middle">評鑑前2週</text>
  <!-- Watermark -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
