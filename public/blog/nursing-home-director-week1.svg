<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#f0efe8"/>
  <text x="400" y="48" font-family="'Noto Sans TC', sans-serif" font-size="32" font-weight="700" fill="#1e293b" text-anchor="middle">第一週行動計畫</text>
  <text x="400" y="78" font-family="'Noto Sans TC', sans-serif" font-size="22" fill="#78716c" text-anchor="middle">盤點現況——搞清楚在哪裡，才能決定要去哪裡</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#a8a29e" stroke-width="1.5"/>
  <!-- 週標籤 -->
  <rect x="40" y="108" width="100" height="36" rx="18" fill="#d97706"/>
  <text x="90" y="131" font-family="'Noto Sans TC', sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">第 1 週</text>
  <!-- 項目1 -->
  <rect x="40" y="162" width="720" height="64" rx="8" fill="#ffffff"/>
  <rect x="40" y="162" width="6" height="64" rx="3" fill="#d97706"/>
  <circle cx="80" cy="194" r="18" fill="#d97706"/>
  <text x="80" y="200" font-family="'Noto Sans TC', sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="116" y="186" font-family="'Noto Sans TC', sans-serif" font-size="17" font-weight="700" fill="#1e293b">取得前次評鑑報告書</text>
  <text x="116" y="210" font-family="'Noto Sans TC', sans-serif" font-size="15" fill="#57534e">了解得分、委員建議、E1 條需追蹤的改善事項</text>
  <!-- 項目2 -->
  <rect x="40" y="240" width="720" height="64" rx="8" fill="#ffffff"/>
  <rect x="40" y="240" width="6" height="64" rx="3" fill="#78716c"/>
  <circle cx="80" cy="272" r="18" fill="#78716c"/>
  <text x="80" y="278" font-family="'Noto Sans TC', sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="116" y="264" font-family="'Noto Sans TC', sans-serif" font-size="17" font-weight="700" fill="#1e293b">盤點核心文件位置</text>
  <text x="116" y="288" font-family="'Noto Sans TC', sans-serif" font-size="15" fill="#57534e">工作手冊（A1）、年度業務計畫（A3）、危機管理計畫（A6）</text>
  <!-- 項目3 -->
  <rect x="40" y="318" width="720" height="64" rx="8" fill="#ffffff"/>
  <rect x="40" y="318" width="6" height="64" rx="3" fill="#57534e"/>
  <circle cx="80" cy="350" r="18" fill="#57534e"/>
  <text x="80" y="356" font-family="'Noto Sans TC', sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="116" y="342" font-family="'Noto Sans TC', sans-serif" font-size="17" font-weight="700" fill="#1e293b">確認主管機關查核記錄</text>
  <text x="116" y="366" font-family="'Noto Sans TC', sans-serif" font-size="15" fill="#57534e">A4 條：過去 4 年衛福、消防、建管、勞工查核彙整</text>
  <!-- 項目4 -->
  <rect x="40" y="396" width="720" height="64" rx="8" fill="#ffffff"/>
  <rect x="40" y="396" width="6" height="64" rx="3" fill="#94a3b8"/>
  <circle cx="80" cy="428" r="18" fill="#94a3b8"/>
  <text x="80" y="434" font-family="'Noto Sans TC', sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="116" y="420" font-family="'Noto Sans TC', sans-serif" font-size="17" font-weight="700" fill="#1e293b">與前任主管或資深人員訪談</text>
  <text x="116" y="444" font-family="'Noto Sans TC', sans-serif" font-size="15" fill="#57534e">了解近期重大事件、未解決問題、與主管機關未決事項</text>
  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" font-family="'Noto Sans TC', sans-serif">報告汪 reportwang.com</text>
</svg>
