<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">護理人員與照顧服務員配置標準</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">A9、A11 一級必要項目人力比例規定</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- 表頭 y=108 -->
  <rect x="40" y="108" width="720" height="44" rx="0" fill="#e8e4dc"/>
  <text x="152" y="136" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="700">機構類型</text>
  <line x1="264" y1="108" x2="264" y2="152" stroke="#dedad3" stroke-width="1"/>
  <text x="400" y="136" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="700">護理人員（A9）</text>
  <line x1="536" y1="108" x2="536" y2="152" stroke="#dedad3" stroke-width="1"/>
  <text x="648" y="136" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="700">照顧服務員（A11）</text>
  <line x1="40" y1="152" x2="760" y2="152" stroke="#dedad3" stroke-width="1"/>

  <!-- Row 1: 長照型 y=152-212 -->
  <rect x="40" y="152" width="720" height="60" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="40" y="152" width="6" height="60" fill="#d97706"/>
  <text x="152" y="186" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="700">長照型</text>
  <line x1="264" y1="152" x2="264" y2="212" stroke="#dedad3" stroke-width="1"/>
  <text x="400" y="182" text-anchor="middle" font-size="18" fill="#d97706" font-weight="700">1 : 15</text>
  <text x="400" y="202" text-anchor="middle" font-size="14" fill="#57534e">（每 15 位住民配 1 位護理師）</text>
  <line x1="536" y1="152" x2="536" y2="212" stroke="#dedad3" stroke-width="1"/>
  <text x="648" y="182" text-anchor="middle" font-size="18" fill="#d97706" font-weight="700">日 1:5 ／ 夜 1:15</text>

  <!-- Row 2: 養護型 y=212-272 -->
  <rect x="40" y="212" width="720" height="60" fill="#fafaf8" stroke="#e8e6de" stroke-width="1"/>
  <rect x="40" y="212" width="6" height="60" fill="#78716c"/>
  <text x="152" y="246" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="700">養護型</text>
  <line x1="264" y1="212" x2="264" y2="272" stroke="#dedad3" stroke-width="1"/>
  <text x="400" y="242" text-anchor="middle" font-size="18" fill="#78716c" font-weight="700">1 : 20</text>
  <text x="400" y="262" text-anchor="middle" font-size="14" fill="#57534e">（每 20 位住民配 1 位護理師）</text>
  <line x1="536" y1="212" x2="536" y2="272" stroke="#dedad3" stroke-width="1"/>
  <text x="648" y="242" text-anchor="middle" font-size="18" fill="#78716c" font-weight="700">日 1:8 ／ 夜 1:25</text>

  <!-- Row 3: 失智型 y=272-332 -->
  <rect x="40" y="272" width="720" height="60" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="40" y="272" width="6" height="60" fill="#57534e"/>
  <text x="152" y="306" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="700">失智型</text>
  <line x1="264" y1="272" x2="264" y2="332" stroke="#dedad3" stroke-width="1"/>
  <text x="400" y="302" text-anchor="middle" font-size="18" fill="#57534e" font-weight="700">1 : 20</text>
  <text x="400" y="322" text-anchor="middle" font-size="14" fill="#57534e">（每 20 位住民配 1 位護理師）</text>
  <line x1="536" y1="272" x2="536" y2="332" stroke="#dedad3" stroke-width="1"/>
  <text x="648" y="302" text-anchor="middle" font-size="18" fill="#57534e" font-weight="700">日 1:3 ／ 夜 1:15</text>

  <!-- Row 4: 安養型 y=332-392 -->
  <rect x="40" y="332" width="720" height="60" fill="#fafaf8" stroke="#e8e6de" stroke-width="1"/>
  <rect x="40" y="332" width="6" height="60" fill="#a8a29e"/>
  <text x="152" y="366" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="700">安養型</text>
  <line x1="264" y1="332" x2="264" y2="392" stroke="#dedad3" stroke-width="1"/>
  <text x="400" y="362" text-anchor="middle" font-size="18" fill="#a8a29e" font-weight="700">無規定</text>
  <text x="400" y="382" text-anchor="middle" font-size="14" fill="#57534e">（安養機構依實際需求配置）</text>
  <line x1="536" y1="332" x2="536" y2="392" stroke="#dedad3" stroke-width="1"/>
  <text x="648" y="362" text-anchor="middle" font-size="18" fill="#a8a29e" font-weight="700">日 1:15 ／ 夜 1:35</text>

  <!-- 說明 -->
  <text x="46" y="416" font-size="15" fill="#d97706">注意：外籍照服員人數不可超過本國籍照服員及護理人員總人數；全日各班應有本國籍照服員上班</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
