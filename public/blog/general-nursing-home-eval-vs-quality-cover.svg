<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 左半橙色 -->
  <rect x="0" y="0" width="580" height="630" fill="#d97706" opacity="0.07"/>
  <!-- 右半藍色 -->
  <rect x="620" y="0" width="580" height="630" fill="#1e40af" opacity="0.07"/>
  <!-- 中間分隔 -->
  <rect x="590" y="0" width="20" height="630" fill="#f0efe8"/>
  <!-- VS 標誌 -->
  <circle cx="600" cy="315" r="52" fill="#1c1917"/>
  <text x="600" y="328" font-size="28" font-weight="900" text-anchor="middle" fill="#1c1917">VS</text>
  <!-- 左側 - 評鑑 -->
  <text x="280" y="120" font-size="44" font-weight="900" text-anchor="middle" fill="#d97706">定期評鑑</text>
  <rect x="80" y="148" width="400" height="240" rx="14" fill="#ffffff" opacity="0.85"/>
  <!-- 評鑑特色 -->
  <text x="100" y="180" font-size="24" fill="#44403c" font-weight="700">辦理單位</text>
  <text x="100" y="200" font-size="20" fill="#78716c">衛福部護理及健康照護司</text>
  <rect x="100" y="212" width="340" height="1" fill="#e5e7eb"/>
  <text x="100" y="232" font-size="24" fill="#44403c" font-weight="700">頻率</text>
  <text x="100" y="252" font-size="20" fill="#78716c">定期辦理（每 3–4 年一次）</text>
  <rect x="100" y="264" width="340" height="1" fill="#e5e7eb"/>
  <text x="100" y="284" font-size="24" fill="#44403c" font-weight="700">結果形式</text>
  <text x="100" y="304" font-size="20" fill="#78716c">等第判定（優等/甲等/乙等）</text>
  <rect x="100" y="316" width="340" height="1" fill="#e5e7eb"/>
  <text x="100" y="336" font-size="24" fill="#44403c" font-weight="700">強制性</text>
  <text x="100" y="356" font-size="20" fill="#d97706" font-weight="700">強制參與 不通過有行政處分</text>
  <!-- 評鑑標籤 -->
  <rect x="80" y="412" width="200" height="40" rx="20" fill="#d97706"/>
  <text x="180" y="437" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700">強制性 等第公開</text>
  <!-- 右側 - 品質獎勵計畫 -->
  <text x="920" y="120" font-size="44" font-weight="900" text-anchor="middle" fill="#1e40af">品質獎勵計畫</text>
  <rect x="720" y="148" width="400" height="240" rx="14" fill="#ffffff" opacity="0.85"/>
  <!-- 品質計畫特色 -->
  <text x="740" y="180" font-size="24" fill="#44403c" font-weight="700">辦理單位</text>
  <text x="740" y="200" font-size="20" fill="#78716c">衛生福利部（縣市執行）</text>
  <rect x="740" y="212" width="340" height="1" fill="#e5e7eb"/>
  <text x="740" y="232" font-size="24" fill="#44403c" font-weight="700">頻率</text>
  <text x="740" y="252" font-size="20" fill="#78716c">每年申請一次，年度計畫</text>
  <rect x="740" y="264" width="340" height="1" fill="#e5e7eb"/>
  <text x="740" y="284" font-size="24" fill="#44403c" font-weight="700">結果形式</text>
  <text x="740" y="304" font-size="20" fill="#78716c">獎勵金發放（依指標達標程度）</text>
  <rect x="740" y="316" width="340" height="1" fill="#e5e7eb"/>
  <text x="740" y="336" font-size="24" fill="#44403c" font-weight="700">強制性</text>
  <text x="740" y="356" font-size="20" fill="#1e40af" font-weight="700">自願申請 不申請無處罰</text>
  <!-- 品質計畫標籤 -->
  <rect x="720" y="412" width="220" height="40" rx="20" fill="#1e40af"/>
  <text x="830" y="437" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700">自願 獎勵金制度</text>
  <!-- 底部共用說明 -->
  <rect x="80" y="478" width="1040" height="86" rx="12" fill="#ffffff" opacity="0.7"/>
  <text x="600" y="510" font-size="24" font-weight="700" text-anchor="middle" fill="#1c1917">文件重疊（準備一份兩邊都用）</text>
  <text x="300" y="538" font-size="20" text-anchor="middle" fill="#44403c">品質指標追蹤（跌倒/壓傷/感染）</text>
  <text x="600" y="538" font-size="20" text-anchor="middle" fill="#44403c">照護計畫文件</text>
  <text x="900" y="538" font-size="20" text-anchor="middle" fill="#44403c">工作人員訓練記錄</text>
  <text x="600" y="558" font-size="20" text-anchor="middle" fill="#78716c">先完成評鑑準備 - 直接用於品質計畫申請</text>
  <!-- 浮水印 -->
  <text x="1140" y="590" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
