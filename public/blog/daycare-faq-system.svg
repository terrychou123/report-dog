<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"
     font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- Header (y=29, h=60) -->
  <rect x="0" y="29" width="800" height="60" fill="white"/>
  <rect x="0" y="29" width="6" height="60" fill="#d97706" rx="2"/>
  <text x="28" y="74" font-size="32" fill="#1e293b" font-weight="700">評鑑制度類 Q1–Q5 核心解答</text>

  <!-- Row 1 (y=118) #d97706 每3年一次 -->
  <rect x="28" y="118" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="118" width="6" height="60" rx="2" fill="#d97706"/>
  <circle cx="66" cy="148" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="154" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <text x="100" y="145" font-size="20" fill="#1e293b" font-weight="700">評鑑每 3 年辦理一次</text>
  <text x="100" y="166" font-size="16" fill="#57534e">提前數週至數月書面通知，收到後立即啟動備審工作</text>
  <rect x="620" y="126" width="136" height="44" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="138" font-size="16" fill="#d97706" text-anchor="middle">3 年</text>
  <text x="688" y="158" font-size="16" fill="#d97706" text-anchor="middle">週期</text>

  <!-- Row 2 (y=191) #78716c 2-3位委員 -->
  <rect x="28" y="191" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="191" width="6" height="60" rx="2" fill="#78716c"/>
  <circle cx="66" cy="221" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="227" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <text x="100" y="218" font-size="20" fill="#1e293b" font-weight="700">2–3 位委員組成評鑑小組</text>
  <text x="100" y="239" font-size="16" fill="#57534e">分工進行文件審閱・人員訪談・環境查看，約 3–4 小時</text>
  <rect x="620" y="199" width="136" height="44" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="211" font-size="16" fill="#78716c" text-anchor="middle">2-3 位</text>
  <text x="688" y="231" font-size="16" fill="#78716c" text-anchor="middle">委員</text>

  <!-- Row 3 (y=264) #57534e 4個等級 -->
  <rect x="28" y="264" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="264" width="6" height="60" rx="2" fill="#57534e"/>
  <circle cx="66" cy="294" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="300" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <text x="100" y="291" font-size="20" fill="#1e293b" font-weight="700">評鑑結果分 4 個等級</text>
  <text x="100" y="312" font-size="16" fill="#57534e">優等・甲等・乙等・不合格，影響補助申請及社會能見度</text>
  <rect x="620" y="272" width="136" height="44" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="284" font-size="16" fill="#57534e" text-anchor="middle">4 個</text>
  <text x="688" y="304" font-size="16" fill="#57534e" text-anchor="middle">等級</text>

  <!-- Row 4 (y=337) #a8a29e 未通過限期改善 -->
  <rect x="28" y="337" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="337" width="6" height="60" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="367" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="373" font-size="16" fill="#a8a29e" text-anchor="middle" font-weight="900">4</text>
  <text x="100" y="364" font-size="20" fill="#1e293b" font-weight="700">未通過需限期提改善計畫</text>
  <text x="100" y="385" font-size="16" fill="#57534e">主管機關要求期限內改善，積極回應才是正確態度</text>
  <rect x="620" y="345" width="136" height="44" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="357" font-size="16" fill="#a8a29e" text-anchor="middle">限期</text>
  <text x="688" y="377" font-size="16" fill="#a8a29e" text-anchor="middle">改善</text>

  <!-- Row 5 (y=410) #94a3b8 初次另案 -->
  <rect x="28" y="410" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="410" width="6" height="60" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="440" r="16" fill="#94a3b8" opacity="0.15"/>
  <text x="66" y="446" font-size="16" fill="#94a3b8" text-anchor="middle" font-weight="900">5</text>
  <text x="100" y="437" font-size="20" fill="#1e293b" font-weight="700">新設機構初次評鑑另案安排</text>
  <text x="100" y="458" font-size="16" fill="#57534e">未達一個評鑑週期者，依主管機關通知辦理初次評鑑</text>
  <rect x="620" y="418" width="136" height="44" rx="8" fill="#94a3b8" opacity="0.12"/>
  <text x="688" y="430" font-size="16" fill="#94a3b8" text-anchor="middle">初次</text>
  <text x="688" y="450" font-size="16" fill="#94a3b8" text-anchor="middle">另案</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
