<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- @template: list-5 -->
  <rect width="800" height="500" fill="#f0efe8"/>
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">評鑑前30天 缺失改善行動清單</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">依優先順序逐項確認，確保評鑑前補強完畢</text>
  <line x1="28" y1="94" x2="772" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- N=5 列表圖骨架 (H=60, rowY=[118,191,264,337,410]) -->

  <!-- Row 1 (y=118) -->
  <rect x="28" y="118" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="118" width="6" height="60" rx="2" fill="#d97706"/>
  <circle cx="66" cy="148" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="154" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <text x="100" y="140" font-size="21" fill="#1e293b" font-weight="700">優先：住宿型確認3.11開放式管理現況</text>
  <text x="100" y="162" font-size="16" fill="#57534e">檢查門禁措施、外出規定，確保無任何限制住民出入的設施或規定</text>
  <rect x="620" y="126" width="136" height="44" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="144" font-size="15" fill="#d97706" text-anchor="middle">最優先</text>
  <text x="688" y="162" font-size="15" fill="#d97706" text-anchor="middle">立即執行</text>

  <!-- Row 2 (y=191) -->
  <rect x="28" y="191" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="191" width="6" height="60" rx="2" fill="#78716c"/>
  <circle cx="66" cy="221" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="227" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <text x="100" y="213" font-size="21" fill="#1e293b" font-weight="700">PFM預演：讓學員練習回答5-7個關鍵問題</text>
  <text x="100" y="235" font-size="16" fill="#57534e">藥物保管、社區活動、申訴管道、出入自由（住宿型）、工作獎勵金（日間型）</text>
  <rect x="620" y="199" width="136" height="44" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="217" font-size="15" fill="#78716c" text-anchor="middle">提前1個月</text>
  <text x="688" y="235" font-size="15" fill="#78716c" text-anchor="middle">開始預演</text>

  <!-- Row 3 (y=264) -->
  <rect x="28" y="264" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="264" width="6" height="60" rx="2" fill="#57534e"/>
  <circle cx="66" cy="294" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="300" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <text x="100" y="286" font-size="21" fill="#1e293b" font-weight="700">抽查個案：確認復健計畫3個月修正記錄完整</text>
  <text x="100" y="308" font-size="16" fill="#57534e">隨機抽查10份個案，確認每3個月有實質修正內容與三方簽名</text>
  <rect x="620" y="272" width="136" height="44" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="290" font-size="15" fill="#57534e" text-anchor="middle">全面自查</text>
  <text x="688" y="308" font-size="15" fill="#57534e" text-anchor="middle">補齊缺漏</text>

  <!-- Row 4 (y=337) -->
  <rect x="28" y="337" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="337" width="6" height="60" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="367" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="373" font-size="16" fill="#a8a29e" text-anchor="middle" font-weight="900">4</text>
  <text x="100" y="359" font-size="21" fill="#1e293b" font-weight="700">確認消防及緊急應變演練備查文件</text>
  <text x="100" y="381" font-size="16" fill="#57534e">確認衛生局與消防局備查資料均取得，無法找到者立即補辦</text>
  <rect x="620" y="345" width="136" height="44" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="363" font-size="15" fill="#6b7280" text-anchor="middle">每半年</text>
  <text x="688" y="381" font-size="15" fill="#6b7280" text-anchor="middle">備查確認</text>

  <!-- Row 5 (y=410) -->
  <rect x="28" y="410" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="410" width="6" height="60" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="440" r="16" fill="#94a3b8" opacity="0.15"/>
  <text x="66" y="446" font-size="16" fill="#94a3b8" text-anchor="middle" font-weight="900">5</text>
  <text x="100" y="432" font-size="21" fill="#1e293b" font-weight="700">清查年度訓練記錄</text>
  <text x="100" y="454" font-size="16" fill="#57534e">確認CRPD、CEDAW、性騷擾防治課程均已執行，簽到表與內容摘要齊備</text>
  <rect x="620" y="418" width="136" height="44" rx="8" fill="#94a3b8" opacity="0.12"/>
  <text x="688" y="445" font-size="15" fill="#94a3b8" text-anchor="middle">補辦紀錄</text>

  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
