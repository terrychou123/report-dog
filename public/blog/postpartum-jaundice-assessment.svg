<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- Header -->
  <rect x="0" y="29" width="800" height="60" fill="#e8e6de"/>
  <rect x="0" y="29" width="6" height="60" rx="2" fill="#d97706"/>
  <text x="28" y="74" font-size="30" fill="#1e293b" font-weight="700">黃疸評估記錄規範 4 要點</text>
  <!-- Row 1 y=118 H=62 -->
  <rect x="28" y="118" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="118" width="6" height="62" rx="2" fill="#d97706"/>
  <circle cx="66" cy="149" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="155" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <text x="100" y="146" font-size="20" fill="#1e293b" font-weight="700">評估工具與時機</text>
  <text x="100" y="167" font-size="16" fill="#57534e">使用 TcB 或 TSB 測量，入住時及依臨床判斷定期評估</text>
  <rect x="620" y="126" width="136" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="144" font-size="16" fill="#d97706" text-anchor="middle">TcB/TSB</text>
  <text x="688" y="164" font-size="16" fill="#d97706" text-anchor="middle">說明工具</text>
  <!-- Row 2 y=191 H=62 -->
  <rect x="28" y="191" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="191" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="66" cy="222" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="228" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <text x="100" y="219" font-size="20" fill="#1e293b" font-weight="700">動態追蹤記錄</text>
  <text x="100" y="240" font-size="16" fill="#57534e">連續測量記錄顯示趨勢（上升/穩定/下降），非僅記錄單一數值</text>
  <rect x="620" y="199" width="136" height="46" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="217" font-size="16" fill="#78716c" text-anchor="middle">趨勢明確</text>
  <text x="688" y="237" font-size="16" fill="#78716c" text-anchor="middle">連續數值</text>
  <!-- Row 3 y=264 H=62 -->
  <rect x="28" y="264" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="264" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="66" cy="295" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="301" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <text x="100" y="292" font-size="20" fill="#1e293b" font-weight="700">肉眼黃疸評估</text>
  <text x="100" y="313" font-size="16" fill="#57534e">每日記錄肉眼黃疸程度（無/輕度/中度/明顯）及黃疸部位</text>
  <rect x="620" y="272" width="136" height="46" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="290" font-size="16" fill="#57534e" text-anchor="middle">程度分級</text>
  <text x="688" y="310" font-size="16" fill="#57534e" text-anchor="middle">部位記錄</text>
  <!-- Row 4 y=337 H=62 -->
  <rect x="28" y="337" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="337" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="368" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="374" font-size="16" fill="#a8a29e" text-anchor="middle" font-weight="900">4</text>
  <text x="100" y="365" font-size="20" fill="#1e293b" font-weight="700">照光治療完整記錄</text>
  <text x="100" y="386" font-size="16" fill="#57534e">開始/停止條件、每班治療數值，停止後12-24小時追蹤確認</text>
  <rect x="620" y="345" width="136" height="46" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="363" font-size="16" fill="#a8a29e" text-anchor="middle">開始條件</text>
  <text x="688" y="383" font-size="16" fill="#a8a29e" text-anchor="middle">停止追蹤</text>
  <!-- Watermark -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
