<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- @template: list-3 -->
  <rect width="800" height="500" fill="#f0efe8"/>
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">第三章 服務品質 住宿型獨有條目</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">住宿型14條30分（日間型12條29分），多4條</text>
  <line x1="28" y1="94" x2="772" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- 說明文字（非計入 row，保留設計） -->
  <rect x="28" y="108" width="744" height="48" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="60" y="128" font-size="16" fill="#1e293b" font-weight="700">住宿型第三章多出4個條目（3.7、3.8-調序、可3.5、重3.11）</text>
  <text x="60" y="148" font-size="15" fill="#57534e">且日間型3.5（復健基金）必評，住宿型3.5為「可選」項目</text>

  <!-- Row 1: 3.7 財物自主（y=166, S_rectH=52） -->
  <rect x="28" y="166" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="166" width="6" height="90" rx="2" fill="#d97706"/>
  <circle cx="66" cy="199" r="18" fill="#d97706" opacity="0.15"/>
  <!-- Q text_y = 166 + 52/2 + 28*0.35 = 166+26+9.8 = 201.8 ≈ 202 -->
  <text x="66" y="202" font-size="28" fill="#d97706" text-anchor="middle" font-weight="900">3.7</text>
  <text x="100" y="191" font-size="28" fill="#1e293b" font-weight="700">維護住民財物自主管理（PFM）</text>
  <text x="100" y="212" font-size="16" fill="#57534e">住宿型獨有：住民應能自主管理個人財物，評鑑委員直接訪談住民確認</text>
  <text x="100" y="232" font-size="16" fill="#57534e">機構不應代為保管所有住民的金錢，應有適當的財務自主機制</text>
  <rect x="620" y="176" width="136" height="50" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="197" font-size="15" fill="#d97706" text-anchor="middle">住宿型獨有</text>
  <text x="688" y="217" font-size="15" fill="#d97706" text-anchor="middle">PFM訪談</text>

  <!-- Row 2: 重3.11（y=269, S_rectH=52） -->
  <rect x="28" y="269" width="744" height="90" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <rect x="28" y="269" width="6" height="90" rx="2" fill="#78716c"/>
  <circle cx="66" cy="314" r="18" fill="#dc2626"/>
  <!-- Q text_y = 269 + 52/2 + 28*0.35 = 269+26+9.8 = 304.8 ≈ 305 -->
  <text x="66" y="305" font-size="28" fill="white" text-anchor="middle" font-weight="900">!</text>
  <text x="100" y="288" font-size="28" fill="#1e293b" font-weight="700">重3.11 維護住民出入自由（重點項目 + PFM）</text>
  <text x="100" y="308" font-size="15" fill="#dc2626">未達C級 = 整場評鑑不合格！日間型完全無此限制</text>
  <text x="100" y="328" font-size="16" fill="#57534e">機構應採開放式管理，不得以任何設施設備限制住民出入</text>
  <text x="100" y="346" font-size="16" fill="#57534e">評鑑委員直接訪談住民並查看門禁設施</text>
  <rect x="620" y="279" width="136" height="70" rx="8" fill="#dc2626" opacity="0.12"/>
  <text x="688" y="302" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="700">住宿型唯一</text>
  <text x="688" y="322" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="700">重點項目</text>
  <text x="688" y="338" font-size="14" fill="#dc2626" text-anchor="middle">未達C即</text>
  <text x="688" y="352" font-size="14" fill="#dc2626" text-anchor="middle">不合格</text>

  <!-- Row 3: 可選3.5差異（y=372, S_rectH=52） -->
  <rect x="28" y="372" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="372" width="6" height="90" rx="2" fill="#57534e"/>
  <circle cx="66" cy="405" r="18" fill="#57534e" opacity="0.15"/>
  <!-- Q text_y = 372 + 52/2 + 28*0.35 = 372+26+9.8 = 407.8 ≈ 408 -->
  <text x="66" y="408" font-size="28" fill="#57534e" text-anchor="middle" font-weight="900">3.5</text>
  <text x="100" y="394" font-size="28" fill="#1e293b" font-weight="700">復健基金管理：日間型「必評」vs 住宿型「可選」</text>
  <text x="100" y="415" font-size="16" fill="#57534e">日間型3.5必須備審；住宿型可3.5為可選項目（若有辦理仍建議備審）</text>
  <text x="100" y="435" font-size="16" fill="#57534e">備審內容相同：90%工作獎勵、每月公告收支明細、學員代表參與管理委員會</text>
  <rect x="620" y="382" width="136" height="50" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="402" font-size="15" fill="#57534e" text-anchor="middle">日間型必評</text>
  <text x="688" y="422" font-size="15" fill="#57534e" text-anchor="middle">住宿型可選</text>

  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
