<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">第三章 服務品質 住宿型獨有條目</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">住宿型14條30分（日間型12條29分），多4條</text>
  <line x1="28" y1="94" x2="772" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- 說明文字 -->
  <rect x="28" y="108" width="744" height="48" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="108" width="6" height="48" rx="2" fill="#d97706"/>
  <text x="60" y="128" font-size="16" fill="#1e293b" font-weight="700">住宿型第三章多出4個條目（3.7、3.8-調序、可3.5、重3.11）</text>
  <text x="60" y="148" font-size="15" fill="#57534e">且日間型3.5（復健基金）必評，住宿型3.5為「可選」項目</text>

  <!-- Row 1: 3.7 財物自主 -->
  <rect x="28" y="168" width="744" height="66" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="168" width="6" height="66" rx="2" fill="#78716c"/>
  <circle cx="66" cy="201" r="18" fill="#d97706" opacity="0.15"/>
  <text x="66" y="207" font-size="15" fill="#d97706" text-anchor="middle" font-weight="900">3.7</text>
  <text x="100" y="190" font-size="19" fill="#1e293b" font-weight="700">維護住民財物自主管理（PFM）</text>
  <text x="100" y="211" font-size="16" fill="#57534e">住宿型獨有：住民應能自主管理個人財物，評鑑委員直接訪談住民確認</text>
  <text x="100" y="227" font-size="16" fill="#57534e">機構不應代為保管所有住民的金錢，應有適當的財務自主機制</text>
  <rect x="620" y="176" width="136" height="50" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="196" font-size="15" fill="#d97706" text-anchor="middle">住宿型獨有</text>
  <text x="688" y="216" font-size="15" fill="#d97706" text-anchor="middle">PFM訪談</text>

  <!-- Row 2: 重3.11 -->
  <rect x="28" y="246" width="744" height="88" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <rect x="28" y="246" width="6" height="88" rx="2" fill="#57534e"/>
  <circle cx="66" cy="290" r="18" fill="#dc2626"/>
  <polygon points="66,278 60,298 72,298" fill="none" stroke="#dc2626" stroke-width="2"/>
  <text x="66" y="296" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="900">!</text>
  <text x="100" y="268" font-size="19" fill="#1e293b" font-weight="700">重3.11 維護住民出入自由（重點項目 + PFM）</text>
  <text x="100" y="290" font-size="15" fill="#dc2626" font-weight="700">未達C級 = 整場評鑑不合格！日間型完全無此限制</text>
  <text x="100" y="309" font-size="16" fill="#57534e">機構應採開放式管理，不得以任何設施設備限制住民出入</text>
  <text x="100" y="327" font-size="16" fill="#57534e">評鑑委員直接訪談住民並查看門禁設施</text>
  <rect x="620" y="256" width="136" height="68" rx="8" fill="#dc2626" opacity="0.12"/>
  <text x="688" y="280" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="700">住宿型唯一</text>
  <text x="688" y="300" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="700">重點項目</text>
  <text x="688" y="316" font-size="14" fill="#dc2626" text-anchor="middle">未達C即</text>
  <text x="688" y="332" font-size="14" fill="#dc2626" text-anchor="middle">不合格</text>

  <!-- Row 3: 可選3.5差異 -->
  <rect x="28" y="346" width="744" height="66" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="346" width="6" height="66" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="379" r="18" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="385" font-size="14" fill="#a8a29e" text-anchor="middle" font-weight="900">3.5差異</text>
  <text x="100" y="368" font-size="19" fill="#1e293b" font-weight="700">復健基金管理：日間型「必評」vs 住宿型「可選」</text>
  <text x="100" y="389" font-size="16" fill="#57534e">日間型3.5必須備審；住宿型可3.5為可選項目（若有辦理仍建議備審）</text>
  <text x="100" y="406" font-size="16" fill="#57534e">備審內容相同：90%工作獎勵、每月公告收支明細、學員代表參與管理委員會</text>
  <rect x="620" y="354" width="136" height="50" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="374" font-size="15" fill="#6b7280" text-anchor="middle">日間型必評</text>
  <text x="688" y="394" font-size="15" fill="#6b7280" text-anchor="middle">住宿型可選</text>

  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
