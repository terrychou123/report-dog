<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <text x="400" y="50" font-size="26" font-weight="700" fill="#1e293b" text-anchor="middle" >E/F 加分題：最多額外獲得 4 分</text>
  <text x="400" y="76" font-size="16" fill="#57534e" text-anchor="middle" >總分在 87-89 分的機構，加分題是衝破優等門檻的最後機會</text>

  <!-- N=4, H=62, outer_gap=50 -->
  <!-- Row 1 (y=160) -->
  <rect x="40" y="110" width="720" height="62" rx="6" fill="#ffffff"/>
  <rect x="40" y="110" width="6" height="62" rx="2" fill="#d97706"/>
  <circle cx="74" cy="141" r="16" fill="#d97706" opacity="0.15"/>
  <text x="74" y="147" font-size="14" font-weight="700" fill="#d97706" text-anchor="middle" >E2</text>
  <text x="100" y="133" font-size="16" font-weight="700" fill="#1e293b" >E2 創新或配合政策執行（最多 ＋2 分）</text>
  <text x="100" y="156" font-size="16" fill="#57534e" >每項創新措施加 0.5 分，最多 4 項。如導入科技輔助、配合長照試辦計畫、多元族群服務</text>
  <rect x="596" y="119" width="136" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="664" y="133" font-size="15" fill="#d97706" text-anchor="middle" font-weight="700" >＋ 2 分</text>
  <text x="664" y="152" font-size="14" fill="#d97706" text-anchor="middle" >最高加分</text>

  <!-- Row 2 (y=235) -->
  <rect x="40" y="185" width="720" height="62" rx="6" fill="#ffffff"/>
  <rect x="40" y="185" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="74" cy="216" r="16" fill="#78716c" opacity="0.15"/>
  <text x="74" y="222" font-size="14" font-weight="700" fill="#78716c" text-anchor="middle" >F1</text>
  <text x="100" y="208" font-size="16" font-weight="700" fill="#1e293b" >F1 住民牙科診療機制（＋1 分）</text>
  <text x="100" y="231" font-size="16" fill="#57534e" >制定牙科診療作業流程＋特約牙醫合約＋轉介追蹤紀錄，相對容易準備</text>
  <rect x="596" y="194" width="136" height="46" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="664" y="208" font-size="15" fill="#78716c" text-anchor="middle" font-weight="700" >＋ 1 分</text>
  <text x="664" y="227" font-size="14" fill="#78716c" text-anchor="middle" >文件備妥即可</text>

  <!-- Row 3 (y=310) -->
  <rect x="40" y="260" width="720" height="62" rx="6" fill="#ffffff"/>
  <rect x="40" y="260" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="74" cy="291" r="16" fill="#57534e" opacity="0.15"/>
  <text x="74" y="297" font-size="14" font-weight="700" fill="#57534e" text-anchor="middle" >F2</text>
  <text x="100" y="283" font-size="16" font-weight="700" fill="#1e293b" >F2 加入倡導人間懷服務（＋0.5 分）</text>
  <text x="100" y="306" font-size="16" fill="#57534e" >定期盤點無家屬住民，配合關懷人每月 2 次拜訪並留有紀錄，需提前建立合作關係</text>
  <rect x="596" y="269" width="136" height="46" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="664" y="283" font-size="15" fill="#57534e" text-anchor="middle" font-weight="700" >＋ 0.5 分</text>
  <text x="664" y="302" font-size="14" fill="#57534e" text-anchor="middle" >需外部合作</text>

  <!-- Row 4 (y=385) -->
  <rect x="40" y="335" width="720" height="62" rx="6" fill="#ffffff"/>
  <rect x="40" y="335" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="74" cy="366" r="16" fill="#a8a29e" opacity="0.2"/>
  <text x="74" y="372" font-size="14" font-weight="700" fill="#a8a29e" text-anchor="middle" >F3</text>
  <text x="100" y="358" font-size="16" font-weight="700" fill="#1e293b" >F3 視聽覺障礙者逃生資訊（＋0.5 分）</text>
  <text x="100" y="381" font-size="16" fill="#57534e" >避難圖設點字或語音播放＋出入口安裝緊急閃光警示燈，費用不高但加分顯著</text>
  <rect x="596" y="344" width="136" height="46" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="664" y="358" font-size="15" fill="#78716c" text-anchor="middle" font-weight="700" >＋ 0.5 分</text>
  <text x="664" y="377" font-size="14" fill="#78716c" text-anchor="middle" >硬體安裝</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" >報告汪 reportwang.com</text>
</svg>
