<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <text x="400" y="50" font-size="26" font-weight="700" fill="#1e293b" text-anchor="middle" font-family="sans-serif">E/F 加分題：最多額外獲得 4 分</text>
  <text x="400" y="76" font-size="16" fill="#57534e" text-anchor="middle" font-family="sans-serif">總分在 87-89 分的機構，加分題是衝破優等門檻的最後機會</text>

  <!-- N=4, H=62, outer_gap=50 -->
  <!-- Row 1 (y=160) -->
  <rect x="40" y="110" width="720" height="62" rx="6" fill="#ffffff"/>
  <rect x="40" y="110" width="6" height="62" rx="3" fill="#d97706"/>
  <circle cx="74" cy="141" r="16" fill="#d97706" opacity="0.15"/>
  <text x="74" y="147" font-size="14" font-weight="700" fill="#d97706" text-anchor="middle" font-family="sans-serif">E2</text>
  <text x="100" y="133" font-size="16" font-weight="700" fill="#1e293b" font-family="sans-serif">E2 創新或配合政策執行（最多 ＋2 分）</text>
  <text x="100" y="156" font-size="14" fill="#57534e" font-family="sans-serif">每項創新措施加 0.5 分，最多 4 項。如導入科技輔助、配合長照試辦計畫、多元族群服務</text>
  <rect x="596" y="119" width="136" height="46" rx="5" fill="#d97706" opacity="0.15"/>
  <text x="664" y="138" font-size="15" fill="#d97706" text-anchor="middle" font-weight="700" font-family="sans-serif">＋ 2 分</text>
  <text x="664" y="157" font-size="13" fill="#d97706" text-anchor="middle" font-family="sans-serif">最高加分</text>

  <!-- Row 2 (y=235) -->
  <rect x="40" y="185" width="720" height="62" rx="6" fill="#ffffff"/>
  <rect x="40" y="185" width="6" height="62" rx="3" fill="#78716c"/>
  <circle cx="74" cy="216" r="16" fill="#78716c" opacity="0.15"/>
  <text x="74" y="222" font-size="14" font-weight="700" fill="#78716c" text-anchor="middle" font-family="sans-serif">F1</text>
  <text x="100" y="208" font-size="16" font-weight="700" fill="#1e293b" font-family="sans-serif">F1 住民牙科診療機制（＋1 分）</text>
  <text x="100" y="231" font-size="14" fill="#57534e" font-family="sans-serif">制定牙科診療作業流程＋特約牙醫合約＋轉介追蹤紀錄，相對容易準備</text>
  <rect x="596" y="194" width="136" height="46" rx="5" fill="#78716c" opacity="0.12"/>
  <text x="664" y="213" font-size="15" fill="#78716c" text-anchor="middle" font-weight="700" font-family="sans-serif">＋ 1 分</text>
  <text x="664" y="232" font-size="13" fill="#78716c" text-anchor="middle" font-family="sans-serif">文件備妥即可</text>

  <!-- Row 3 (y=310) -->
  <rect x="40" y="260" width="720" height="62" rx="6" fill="#ffffff"/>
  <rect x="40" y="260" width="6" height="62" rx="3" fill="#57534e"/>
  <circle cx="74" cy="291" r="16" fill="#57534e" opacity="0.15"/>
  <text x="74" y="297" font-size="14" font-weight="700" fill="#57534e" text-anchor="middle" font-family="sans-serif">F2</text>
  <text x="100" y="283" font-size="16" font-weight="700" fill="#1e293b" font-family="sans-serif">F2 加入倡導人間懷服務（＋0.5 分）</text>
  <text x="100" y="306" font-size="14" fill="#57534e" font-family="sans-serif">定期盤點無家屬住民，配合關懷人每月 2 次拜訪並留有紀錄，需提前建立合作關係</text>
  <rect x="596" y="269" width="136" height="46" rx="5" fill="#57534e" opacity="0.1"/>
  <text x="664" y="288" font-size="15" fill="#57534e" text-anchor="middle" font-weight="700" font-family="sans-serif">＋ 0.5 分</text>
  <text x="664" y="307" font-size="13" fill="#57534e" text-anchor="middle" font-family="sans-serif">需外部合作</text>

  <!-- Row 4 (y=385) -->
  <rect x="40" y="335" width="720" height="62" rx="6" fill="#ffffff"/>
  <rect x="40" y="335" width="6" height="62" rx="3" fill="#a8a29e"/>
  <circle cx="74" cy="366" r="16" fill="#a8a29e" opacity="0.2"/>
  <text x="74" y="372" font-size="14" font-weight="700" fill="#a8a29e" text-anchor="middle" font-family="sans-serif">F3</text>
  <text x="100" y="358" font-size="16" font-weight="700" fill="#1e293b" font-family="sans-serif">F3 視聽覺障礙者逃生資訊（＋0.5 分）</text>
  <text x="100" y="381" font-size="14" fill="#57534e" font-family="sans-serif">避難圖設點字或語音播放＋出入口安裝緊急閃光警示燈，費用不高但加分顯著</text>
  <rect x="596" y="344" width="136" height="46" rx="5" fill="#a8a29e" opacity="0.15"/>
  <text x="664" y="363" font-size="15" fill="#78716c" text-anchor="middle" font-weight="700" font-family="sans-serif">＋ 0.5 分</text>
  <text x="664" y="382" font-size="13" fill="#78716c" text-anchor="middle" font-family="sans-serif">硬體安裝</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" font-family="sans-serif">報告汪 reportwang.com</text>
</svg>
