<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <text x="40" y="48" font-size="32" fill="#1e293b" font-weight="700">第一個月：15 項基準逐一盤點</text>
  <text x="40" y="76" font-size="22" fill="#57534e">四週分區盤點，找出缺口，建立補強清單</text>
  <line x1="40" y1="92" x2="760" y2="92" stroke="#d97706" stroke-width="2"/>

  <!-- 第1週 -->
  <rect x="40" y="112" width="168" height="310" rx="10" fill="white" stroke="#d97706" stroke-width="2"/>
  <rect x="40" y="112" width="168" height="40" rx="10" fill="#d97706"/>
  <rect x="40" y="132" width="168" height="20" fill="#d97706"/>
  <text x="124" y="124" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">第1週</text>
  <text x="124" y="150" font-size="14" fill="#fef9c3" text-anchor="middle">A 區文件盤點</text>
  <text x="52" y="178" font-size="14" fill="#57534e">負責人月查記錄</text>
  <text x="52" y="198" font-size="14" fill="#57534e">護理師執照效期</text>
  <text x="52" y="218" font-size="14" fill="#57534e">急救訓練記錄</text>
  <text x="52" y="238" font-size="14" fill="#57534e">意外事件記錄</text>
  <text x="52" y="258" font-size="14" fill="#57534e">感控計畫更新日期</text>
  <text x="52" y="308" font-size="14" fill="#d97706" font-weight="600">交付物：</text>
  <text x="52" y="326" font-size="14" fill="#78716c">A 區缺口清單</text>

  <!-- 第2週 -->
  <rect x="220" y="112" width="168" height="310" rx="10" fill="white" stroke="#16a34a" stroke-width="2"/>
  <rect x="220" y="112" width="168" height="40" rx="10" fill="#16a34a"/>
  <rect x="220" y="132" width="168" height="20" fill="#16a34a"/>
  <text x="304" y="124" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">第2週</text>
  <text x="304" y="150" font-size="14" fill="#bbf7d0" text-anchor="middle">B 區抽查</text>
  <text x="232" y="178" font-size="14" fill="#57534e">抽查5-10份個案紀錄</text>
  <text x="232" y="198" font-size="14" fill="#57534e">24hr/72hr初評確認</text>
  <text x="232" y="218" font-size="14" fill="#57534e">照護計畫四要素查核</text>
  <text x="232" y="238" font-size="14" fill="#57534e">評值記錄是否空白</text>
  <text x="232" y="258" font-size="14" fill="#57534e">品質季報完整性</text>
  <text x="232" y="308" font-size="14" fill="#16a34a" font-weight="600">交付物：</text>
  <text x="232" y="326" font-size="14" fill="#78716c">個案記錄缺口清單</text>

  <!-- 第3週 -->
  <rect x="400" y="112" width="168" height="310" rx="10" fill="white" stroke="#2563eb" stroke-width="2"/>
  <rect x="400" y="112" width="168" height="40" rx="10" fill="#2563eb"/>
  <rect x="400" y="132" width="168" height="20" fill="#2563eb"/>
  <text x="484" y="124" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">第3週</text>
  <text x="484" y="150" font-size="14" fill="#bfdbfe" text-anchor="middle">C 區現場盤點</text>
  <text x="412" y="178" font-size="14" fill="#57534e">今年演練次數確認</text>
  <text x="412" y="198" font-size="14" fill="#57534e">夜間演練是否辦理</text>
  <text x="412" y="218" font-size="14" fill="#57534e">疏散通道現場走查</text>
  <text x="412" y="238" font-size="14" fill="#57534e">多情境疏散計畫確認</text>
  <text x="412" y="258" font-size="14" fill="#57534e">消防設備維護效期</text>
  <text x="412" y="308" font-size="14" fill="#2563eb" font-weight="600">交付物：</text>
  <text x="412" y="326" font-size="14" fill="#78716c">C 區缺口清單</text>

  <!-- 第4週 -->
  <rect x="580" y="112" width="180" height="310" rx="10" fill="white" stroke="#7c3aed" stroke-width="2"/>
  <rect x="580" y="112" width="180" height="40" rx="10" fill="#7c3aed"/>
  <rect x="580" y="132" width="180" height="20" fill="#7c3aed"/>
  <text x="670" y="124" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">第4週</text>
  <text x="670" y="150" font-size="14" fill="#e9d5ff" text-anchor="middle">D 區 + 彙整</text>
  <text x="592" y="178" font-size="14" fill="#57534e">D1 創新成效記錄</text>
  <text x="592" y="198" font-size="14" fill="#57534e">D2 口腔照護確認</text>
  <text x="592" y="218" font-size="14" fill="#57534e">D3 近期違規確認</text>
  <text x="592" y="248" font-size="14" fill="#57534e">四區缺口彙整統計</text>
  <text x="592" y="268" font-size="14" fill="#57534e">分工補強任務清單</text>
  <text x="592" y="316" font-size="14" fill="#7c3aed" font-weight="600">交付物：</text>
  <text x="592" y="334" font-size="14" fill="#78716c">完整缺口清單</text>
  <text x="592" y="352" font-size="14" fill="#78716c">第二個月行動計畫</text>

  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
