<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- 標題區 -->
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">115年度精神復健機構評鑑架構</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">日間型與住宿型兩種類型對照</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- 左側：日間型 -->
  <rect x="40" y="108" width="346" height="338" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <!-- 日間型標頭 -->
  <rect x="40" y="108" width="346" height="44" rx="12" fill="#0284c7"/>
  <rect x="40" y="128" width="346" height="24" fill="#0284c7"/>
  <text x="213" y="148" text-anchor="middle" font-size="22" fill="white" font-weight="700">日間型機構</text>
  <!-- 日間型內容 -->
  <text x="213" y="185" text-anchor="middle" font-size="40" fill="#0284c7" font-weight="900">36條</text>
  <text x="213" y="215" text-anchor="middle" font-size="18" fill="#57534e">服務對象稱謂：學員</text>
  <line x1="60" y1="228" x2="366" y2="228" stroke="#e8e6de" stroke-width="1"/>
  <!-- 章節分佈 -->
  <rect x="60" y="240" width="306" height="36" rx="8" fill="#eff6ff"/>
  <text x="80" y="258" font-size="17" fill="#1e293b" font-weight="700">第1章 經營管理</text>
  <text x="346" y="258" text-anchor="end" font-size="17" fill="#0284c7" font-weight="700">34分 / 10條</text>
  <rect x="60" y="284" width="306" height="36" rx="8" fill="#f0fdf4"/>
  <text x="80" y="302" font-size="17" fill="#1e293b" font-weight="700">第2章 復健服務</text>
  <text x="346" y="302" text-anchor="end" font-size="17" fill="#16a34a" font-weight="700">37分 / 14條</text>
  <rect x="60" y="328" width="306" height="36" rx="8" fill="#fff7ed"/>
  <text x="80" y="346" font-size="17" fill="#1e293b" font-weight="700">第3章 服務品質</text>
  <text x="346" y="346" text-anchor="end" font-size="17" fill="#ea580c" font-weight="700">29分 / 12條</text>
  <!-- 特殊項目 -->
  <text x="60" y="388" font-size="15" fill="#57534e">可選：1.2、1.9（共2條）</text>
  <text x="60" y="408" font-size="15" fill="#57534e">試評：2.13、2.14（不計分）</text>
  <text x="60" y="428" font-size="15" fill="#57534e">PFM訪談：2.8、2.12、3.2、3.5、3.6（共5項）</text>

  <!-- 右側：住宿型 -->
  <rect x="414" y="108" width="346" height="338" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <!-- 住宿型標頭 -->
  <rect x="414" y="108" width="346" height="44" rx="12" fill="#7c3aed"/>
  <rect x="414" y="128" width="346" height="24" fill="#7c3aed"/>
  <text x="587" y="148" text-anchor="middle" font-size="22" fill="white" font-weight="700">住宿型機構</text>
  <!-- 住宿型內容 -->
  <text x="587" y="185" text-anchor="middle" font-size="40" fill="#7c3aed" font-weight="900">40條</text>
  <text x="587" y="215" text-anchor="middle" font-size="18" fill="#57534e">服務對象稱謂：住民</text>
  <line x1="434" y1="228" x2="740" y2="228" stroke="#e8e6de" stroke-width="1"/>
  <!-- 章節分佈 -->
  <rect x="434" y="240" width="306" height="36" rx="8" fill="#eff6ff"/>
  <text x="454" y="258" font-size="17" fill="#1e293b" font-weight="700">第1章 經營管理</text>
  <text x="720" y="258" text-anchor="end" font-size="17" fill="#0284c7" font-weight="700">33分 / 12條</text>
  <rect x="434" y="284" width="306" height="36" rx="8" fill="#f0fdf4"/>
  <text x="454" y="302" font-size="17" fill="#1e293b" font-weight="700">第2章 復健服務</text>
  <text x="720" y="302" text-anchor="end" font-size="17" fill="#16a34a" font-weight="700">37分 / 14條</text>
  <rect x="434" y="328" width="306" height="36" rx="8" fill="#fff7ed"/>
  <text x="454" y="346" font-size="17" fill="#1e293b" font-weight="700">第3章 服務品質</text>
  <text x="720" y="346" text-anchor="end" font-size="17" fill="#ea580c" font-weight="700">30分 / 14條</text>
  <!-- 特殊項目 -->
  <text x="434" y="388" font-size="15" fill="#57534e">可選：1.2、1.11、3.5（共3條）</text>
  <text x="434" y="408" font-size="15" fill="#57534e">試評：2.13、2.14、3.14（不計分）</text>
  <text x="434" y="428" font-size="14" fill="#dc2626" font-weight="700">重點：3.11出入自由（未達C即不合格）</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
