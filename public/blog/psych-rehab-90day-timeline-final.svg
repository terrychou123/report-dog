<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- @template: list-4 -->
  <rect width="800" height="500" fill="#f0efe8"/>
  <text x="400" y="48" text-anchor="middle" font-size="30" fill="#1e293b" font-weight="700">評鑑前7天最終確認清單</text>
  <text x="400" y="78" text-anchor="middle" font-size="20" fill="#57534e">這一輪是確認，不是補救——準備好的，上場就贏</text>
  <line x1="28" y1="94" x2="772" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- Row 1 (y=160): 文件確認 -->
  <rect x="28" y="160" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="160" width="6" height="62" rx="2" fill="#d97706"/>
  <circle cx="66" cy="191" r="18" fill="#d97706" opacity="0.15"/>
  <text x="66" y="197" font-size="14" fill="#d97706" text-anchor="middle" font-weight="900">D-7</text>
  <!-- Q text：font-size=22, text_y = 160 + 62/2 + 22×0.35 = 191 + 7.7 ≈ 199，但參考相鄰元素對齊，y 設計為主標題置中 -->
  <text x="100" y="185" font-size="22" fill="#1e293b" font-weight="700">備審文件逐章清零</text>
  <text x="100" y="207" font-size="16" fill="#57534e">三章節負責人各自確認文件完整，索引目錄更新完成，特殊標記（PFM、重點）確認</text>
  <rect x="620" y="168" width="136" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="186" font-size="15" fill="#d97706" text-anchor="middle">文件全清零</text>
  <text x="688" y="206" font-size="15" fill="#d97706" text-anchor="middle">索引完整</text>

  <!-- Row 2 (y=235): 環境整備 -->
  <rect x="28" y="235" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="235" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="66" cy="266" r="18" fill="#78716c" opacity="0.15"/>
  <text x="66" y="272" font-size="14" fill="#78716c" text-anchor="middle" font-weight="900">D-5</text>
  <text x="100" y="260" font-size="22" fill="#1e293b" font-weight="700">空間環境整潔備場</text>
  <text x="100" y="282" font-size="16" fill="#57534e">復健治療空間（1.7）、健身康樂設施（1.8）整潔確認；住宿型廚房（1.10）衛生檢查</text>
  <rect x="620" y="243" width="136" height="46" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="261" font-size="15" fill="#78716c" text-anchor="middle">環境整潔</text>
  <text x="688" y="281" font-size="15" fill="#78716c" text-anchor="middle">家庭化確認</text>

  <!-- Row 3 (y=310): 簡報演練 -->
  <rect x="28" y="310" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="310" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="66" cy="341" r="18" fill="#57534e" opacity="0.15"/>
  <text x="66" y="347" font-size="14" fill="#57534e" text-anchor="middle" font-weight="900">D-3</text>
  <text x="100" y="335" font-size="22" fill="#1e293b" font-weight="700">評鑑簡報最終演練</text>
  <text x="100" y="357" font-size="16" fill="#57534e">機構介紹簡報（10分鐘）由主管演練一次，確認 1.10/1.12 評鑑資料填寫無誤</text>
  <rect x="620" y="318" width="136" height="46" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="336" font-size="15" fill="#57534e" text-anchor="middle">簡報就緒</text>
  <text x="688" y="356" font-size="15" fill="#57534e" text-anchor="middle">動線確認</text>

  <!-- Row 4 (y=385): 評鑑當日 -->
  <rect x="28" y="385" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="385" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="416" r="18" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="422" font-size="14" fill="#a8a29e" text-anchor="middle" font-weight="900">D-Day</text>
  <text x="100" y="410" font-size="22" fill="#1e293b" font-weight="700">評鑑當日：迎接委員注意事項</text>
  <text x="100" y="432" font-size="16" fill="#57534e">學員或住民自然互動（勿刻意迴避 PFM 訪談），工作人員各司其職</text>
  <rect x="620" y="393" width="136" height="46" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="411" font-size="15" fill="#a8a29e" text-anchor="middle">自然應對</text>
  <text x="688" y="431" font-size="15" fill="#a8a29e" text-anchor="middle">各司其職</text>

  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
