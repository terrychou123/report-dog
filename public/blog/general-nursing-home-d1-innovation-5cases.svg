  <text x="288" y="211" font-size="14" fill="#57534e">• 個別化照護依據</text>
  <text x="288" y="229" font-size="14" fill="#57534e">• 家屬滿意度提升</text>
  <text x="288" y="251" font-size="14" fill="#d97706" font-weight="700">評鑑亮點：以人為本</text>
  <!-- 案例3 -->
  <rect x="512" y="86" width="258" height="180" rx="12" fill="#ffffff" opacity="0.95"/>
  <rect x="512" y="86" width="258" height="44" rx="12" fill="#d97706" opacity="0.15"/>
  <rect x="512" y="116" width="258" height="14" fill="#d97706" opacity="0.15"/>
