  <text x="48" y="416" font-size="14" fill="#57534e">• COVID 後延續的創新</text>
  <text x="48" y="436" font-size="14" fill="#d97706" font-weight="700">評鑑亮點：家屬中心創新</text>
  <!-- 案例5 -->
  <rect x="400" y="288" width="370" height="174" rx="12" fill="#ffffff" opacity="0.95"/>
  <rect x="400" y="288" width="370" height="44" rx="12" fill="#57534e" opacity="0.10"/>
  <rect x="400" y="318" width="370" height="14" fill="#57534e" opacity="0.10"/>
  <text x="585" y="323" font-size="36" text-anchor="middle"></text>
  <text x="585" y="350" font-size="15" font-weight="900" text-anchor="middle" fill="#1e293b">工作人員技能競賽</text>
  <text x="418" y="376" font-size="14" fill="#d97706" font-weight="700">成本：極低（時間成本）</text>
  <text x="418" y="396" font-size="14" fill="#57534e">• 移位、口腔照護競賽</text>
  <text x="418" y="416" font-size="14" fill="#57534e">• 提升品質意識文化</text>
  <text x="418" y="436" font-size="14" fill="#d97706" font-weight="700">評鑑亮點：員工參與創新（D1基準）</text>
  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end">報告汪 reportwang.com</text>
