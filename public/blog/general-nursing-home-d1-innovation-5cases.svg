  <text x="46" y="251" font-size="14" fill="#d97706" font-weight="700">評鑑亮點：科技創新</text>
  <!-- 案例2 -->
  <rect x="270" y="86" width="222" height="180" rx="12" fill="#ffffff" opacity="0.95"/>
  <rect x="270" y="86" width="222" height="44" rx="12" fill="#d97706" opacity="0.15"/>
