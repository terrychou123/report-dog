<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8" rx="16"/>
  <!-- 標題區 -->
  <rect x="0" y="0" width="800" height="68" fill="#d97706" rx="16"/>
  <rect x="0" y="52" width="800" height="16" fill="#d97706"/>
  <text x="400" y="43" font-size="22" font-weight="900" text-anchor="middle" fill="#ffffff">D1 創新加分：5 個低成本高效益案例</text>
  <!-- 案例1 -->
  <rect x="28" y="86" width="222" height="180" rx="12" fill="#ffffff" opacity="0.95"/>
