  <text x="139" y="148" font-size="15" font-weight="900" text-anchor="middle" fill="#1e293b">AI 文書工具</text>
  <text x="46" y="174" font-size="14" fill="#d97706" font-weight="700">成本：低</text>
  <text x="46" y="193" font-size="14" fill="#57534e">• 工具訂閱費或免費</text>
  <text x="46" y="211" font-size="14" fill="#57534e">• 護理師文書省 33%</text>
