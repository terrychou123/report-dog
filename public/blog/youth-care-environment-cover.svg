<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="'Noto Sans TC', sans-serif">
  <!-- @template: cover -->
  <defs>
    <style>
      text { font-family: 'Noto Sans TC', sans-serif; }
    </style>
  </defs>
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 右側面板 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>
  <!-- 右側大數字 -->
  <text x="1010" y="400" font-size="260" font-weight="900" fill="#78716c" opacity="0.18" text-anchor="middle">10</text>
  <text x="1010" y="560" font-size="36" font-weight="700" fill="#78716c" text-anchor="middle">項目 7–14</text>
  <text x="1010" y="600" font-size="22" font-weight="400" fill="#a8a29e" text-anchor="middle">環境設施設備</text>
  <!-- 左側主標題區 -->
  <text x="72" y="148" font-size="52" font-weight="900" fill="#1e293b">安置機構</text>
  <text x="72" y="218" font-size="52" font-weight="900" fill="#1e293b">環境安全怎麼查？</text>
  <text x="72" y="300" font-size="30" font-weight="600" fill="#d97706">10 分環境設備區塊的自評重點</text>
  <!-- 分隔線 -->
  <rect x="72" y="328" width="80" height="4" rx="2" fill="#d97706"/>
  <!-- 副說明文字 -->
  <text x="72" y="376" font-size="22" fill="#57534e">貳、建築物環境設施設備（±2 分）</text>
  <text x="72" y="412" font-size="22" fill="#57534e">全部由主管機關依輔導查核評分</text>
  <!-- 標籤 -->
  <rect x="72" y="460" width="148" height="44" rx="22" fill="#d97706"/>
  <text x="146" y="488" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">112年度評鑑</text>
  <rect x="234" y="460" width="148" height="44" rx="22" fill="#78716c"/>
  <text x="308" y="488" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">環境安全</text>
  <!-- 浮水印 -->
  <text x="1140" y="600" font-size="24" fill="#c4bfb8" text-anchor="end">reportwang.com</text>
  <text x="1140" y="590" font-size="24" fill="#c4bfb8" text-anchor="end">報告汪 reportwang.com</text>
</svg>
