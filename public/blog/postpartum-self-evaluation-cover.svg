<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 右側裝飾區塊 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>

  <!-- 右側大數字 17 -->
  <text x="1010" y="195" font-size="138" font-weight="900" fill="#7c3aed" text-anchor="middle" opacity="0.85">17</text>
  <text x="1010" y="237" font-size="26" fill="#78716c" text-anchor="middle" font-weight="600">項評鑑基準</text>

  <!-- 右側 4 區塊摘要 -->
  <rect x="840" y="260" width="155" height="80" rx="10" fill="#d97706" opacity="0.12" stroke="#e8e5de" stroke-width="1"/>
  <text x="918" y="294" font-size="26" fill="#d97706" text-anchor="middle" font-weight="700">A 區</text>
  <text x="918" y="325" font-size="22" fill="#78716c" text-anchor="middle">5 項</text>

  <rect x="1005" y="260" width="155" height="80" rx="10" fill="#16a34a" opacity="0.10" stroke="#e8e5de" stroke-width="1"/>
  <text x="1083" y="294" font-size="26" fill="#16a34a" text-anchor="middle" font-weight="700">B 區</text>
  <text x="1083" y="325" font-size="22" fill="#78716c" text-anchor="middle">8 項</text>

  <rect x="840" y="350" width="155" height="80" rx="10" fill="#2563eb" opacity="0.10" stroke="#e8e5de" stroke-width="1"/>
  <text x="918" y="384" font-size="26" fill="#2563eb" text-anchor="middle" font-weight="700">C 區</text>
  <text x="918" y="415" font-size="22" fill="#78716c" text-anchor="middle">2 項</text>

  <rect x="1005" y="350" width="155" height="80" rx="10" fill="#7c3aed" opacity="0.10" stroke="#e8e5de" stroke-width="1"/>
  <text x="1083" y="384" font-size="26" fill="#7c3aed" text-anchor="middle" font-weight="700">D 區</text>
  <text x="1083" y="415" font-size="22" fill="#78716c" text-anchor="middle">2 項（加分）</text>

  <!-- 右側 AI 功能 -->
  <rect x="840" y="440" width="320" height="56" rx="10" fill="#7c3aed" opacity="0.10"/>
  <text x="1000" y="476" font-size="24" fill="#7c3aed" text-anchor="middle" font-weight="700">AI 自我查核缺失</text>

  <rect x="840" y="503" width="320" height="52" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="1000" y="535" font-size="20" fill="#57534e" text-anchor="middle">自動比對 17 項，找出文件缺漏</text>

  <rect x="840" y="562" width="320" height="46" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="1000" y="591" font-size="20" fill="#57534e" text-anchor="middle">評鑑前 1 個月完成系統檢核</text>

  <!-- 左側主標題 -->
  <text x="60" y="162" font-size="88" font-weight="900" fill="#1e293b">自評表</text>
  <text x="60" y="260" font-size="88" font-weight="900" fill="#7c3aed">怎麼填？</text>

  <line x1="60" y1="292" x2="780" y2="292" stroke="#dedad3" stroke-width="2"/>

  <text x="60" y="338" font-size="33" fill="#57534e" font-weight="400">AI 幫你抓出遺漏的評鑑文件</text>

  <!-- 特色標籤列 -->
  <rect x="60" y="366" width="178" height="52" rx="10" fill="#7c3aed" opacity="0.10"/>
  <text x="149" y="401" font-size="26" fill="#7c3aed" text-anchor="middle" font-weight="600">缺口分析</text>

  <rect x="250" y="366" width="178" height="52" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="339" y="401" font-size="26" fill="#d97706" text-anchor="middle" font-weight="600">文件對應</text>

  <rect x="440" y="366" width="178" height="52" rx="10" fill="#78716c" opacity="0.12"/>
  <text x="529" y="401" font-size="26" fill="#78716c" text-anchor="middle" font-weight="600">誠實自評</text>

  <!-- 適用對象 -->
  <text x="60" y="452" font-size="28" fill="#94a3b8">護理主管 · 機構負責人 · 評鑑準備負責人</text>

  <!-- 底部說明 -->
  <text x="60" y="500" font-size="30" fill="#57534e" font-weight="500">全部填符合，評鑑委員一查就發現落差</text>
  <text x="60" y="538" font-size="26" fill="#a8a29e">17 項基準，每項都要有對應文件支撐自評結果</text>

  <!-- 浮水印 -->
  <text x="780" y="585" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
