<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- 標題列 -->
  <rect x="0" y="29" width="800" height="60" fill="#e8e6de"/>
  <rect x="0" y="29" width="6" height="60" rx="2" fill="#d97706"/>
  <text x="28" y="74" font-size="30" fill="#1e293b" font-weight="700">入住當日標準流程包：技巧 1 ＋ 2</text>
  <!-- Row 1 -->
  <rect x="28" y="118" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="118" width="6" height="62" rx="2" fill="#d97706"/>
  <circle cx="66" cy="149" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="155" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">A</text>
  <text x="100" y="146" font-size="20" fill="#1e293b" font-weight="700">B1.1 產婦初步評估</text>
  <text x="100" y="167" font-size="16" fill="#57534e">生命徵象、傷口、子宮復原、乳房狀況、情緒評估</text>
  <rect x="620" y="126" width="136" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="143" font-size="16" fill="#d97706" text-anchor="middle">入住</text>
  <text x="688" y="163" font-size="16" fill="#d97706" text-anchor="middle">當天完成</text>
  <!-- Row 2 -->
  <rect x="28" y="191" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="191" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="66" cy="222" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="228" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">B</text>
  <text x="100" y="219" font-size="20" fill="#1e293b" font-weight="700">B1.2 嬰兒初步評估</text>
  <text x="100" y="240" font-size="16" fill="#57534e">體重、體溫、黃疸目測、外觀評估、身分辨識核對</text>
  <rect x="620" y="199" width="136" height="46" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="216" font-size="16" fill="#78716c" text-anchor="middle">入住</text>
  <text x="688" y="236" font-size="16" fill="#78716c" text-anchor="middle">當天完成</text>
  <!-- Row 3 -->
  <rect x="28" y="264" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="264" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="66" cy="295" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="301" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">C</text>
  <text x="100" y="292" font-size="20" fill="#1e293b" font-weight="700">EPDS 嵌入情緒評估欄（技巧 2）</text>
  <text x="100" y="313" font-size="16" fill="#57534e">嵌入入住評估表，分數超標需有轉介記錄，三欄格式</text>
  <rect x="620" y="272" width="136" height="46" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="289" font-size="16" fill="#57534e" text-anchor="middle">入住＋</text>
  <text x="688" y="309" font-size="16" fill="#57534e" text-anchor="middle">出院前各一次</text>
  <!-- Row 4 -->
  <rect x="28" y="337" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="337" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="368" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="374" font-size="16" fill="#a8a29e" text-anchor="middle" font-weight="900">D</text>
  <text x="100" y="365" font-size="20" fill="#1e293b" font-weight="700">B1.7 哺乳意願評估與計畫起始</text>
  <text x="100" y="386" font-size="16" fill="#57534e">哺乳方式意願評估，開始建立個別化哺乳計畫</text>
  <rect x="620" y="345" width="136" height="46" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="362" font-size="16" fill="#a8a29e" text-anchor="middle">入住當天</text>
  <text x="688" y="382" font-size="16" fill="#a8a29e" text-anchor="middle">開始記錄</text>
  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
