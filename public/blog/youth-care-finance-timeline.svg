<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- @template: timeline -->

  <!-- 背景：米黃暖色 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題（32px，副標 22px） -->
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">財務查核四次時程與執行單位</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">每次合格 20 分，函文補件扣 2 分，四次取平均</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- 時間軸：y=272，加末端箭頭 -->
  <line x1="60" y1="272" x2="736" y2="272" stroke="#a8a29e" stroke-width="4"/>
  <polygon points="736,265 736,279 752,272" fill="#a8a29e"/>

  <!-- ========== 節點 1：109年 社家署（#d97706 琥珀）上方 ========== -->
  <!-- 上方卡片：y=108，h=100 -->
  <rect x="50" y="108" width="120" height="100" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="50" y="108" width="120" height="8" rx="4" fill="#d97706"/>
  <rect x="50" y="112" width="120" height="4" fill="#d97706"/>
  <text x="110" y="145" text-anchor="middle" font-size="20" fill="#1e293b" font-weight="700">社家署</text>
  <text x="110" y="167" text-anchor="middle" font-size="16" fill="#57534e">全國統一</text>
  <text x="110" y="187" text-anchor="middle" font-size="16" fill="#57534e">財務查核</text>
  <!-- 虛線：卡片底(208) → 圓頂(248) -->
  <line x1="110" y1="208" x2="110" y2="248" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- 實心圓 cy=272 -->
  <circle cx="110" cy="272" r="24" fill="#d97706"/>
  <text x="110" y="280" text-anchor="middle" font-size="20" fill="white" font-weight="700">1</text>
  <!-- 年份標籤（272+24+4=300） -->
  <rect x="75" y="300" width="70" height="22" rx="11" fill="#d97706"/>
  <text x="110" y="315" text-anchor="middle" font-size="14" fill="white" font-weight="700">109 年</text>

  <!-- ========== 節點 2：110年 地方政府（#78716c 暖灰）下方 ========== -->
  <!-- 年份標籤在圓圈上方（272-24-4-22=222） -->
  <rect x="275" y="222" width="70" height="22" rx="11" fill="#78716c"/>
  <text x="310" y="237" text-anchor="middle" font-size="14" fill="white" font-weight="700">110 年</text>
  <!-- 實心圓 cy=272 -->
  <circle cx="310" cy="272" r="24" fill="#78716c"/>
  <text x="310" y="280" text-anchor="middle" font-size="20" fill="white" font-weight="700">2</text>
  <!-- 虛線：圓底(296) → 卡片頂(350) -->
  <line x1="310" y1="296" x2="310" y2="350" stroke="#78716c" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- 下方卡片：y=350，h=100（底=450） -->
  <rect x="250" y="350" width="120" height="100" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="250" y="442" width="120" height="8" rx="4" fill="#78716c"/>
  <rect x="250" y="438" width="120" height="4" fill="#78716c"/>
  <text x="310" y="379" text-anchor="middle" font-size="20" fill="#1e293b" font-weight="700">地方政府</text>
  <text x="310" y="401" text-anchor="middle" font-size="16" fill="#57534e">直轄市或</text>
  <text x="310" y="421" text-anchor="middle" font-size="16" fill="#57534e">縣市政府</text>

  <!-- ========== 節點 3：111年 地方政府（#57534e 深棕）上方 ========== -->
  <rect x="390" y="108" width="120" height="100" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="390" y="108" width="120" height="8" rx="4" fill="#57534e"/>
  <rect x="390" y="112" width="120" height="4" fill="#57534e"/>
  <text x="450" y="145" text-anchor="middle" font-size="20" fill="#1e293b" font-weight="700">地方政府</text>
  <text x="450" y="167" text-anchor="middle" font-size="16" fill="#57534e">直轄市或</text>
  <text x="450" y="187" text-anchor="middle" font-size="16" fill="#57534e">縣市政府</text>
  <line x1="450" y1="208" x2="450" y2="248" stroke="#57534e" stroke-width="1.5" stroke-dasharray="4,3"/>
  <circle cx="450" cy="272" r="24" fill="#57534e"/>
  <text x="450" y="280" text-anchor="middle" font-size="20" fill="white" font-weight="700">3</text>
  <rect x="415" y="300" width="70" height="22" rx="11" fill="#57534e"/>
  <text x="450" y="315" text-anchor="middle" font-size="14" fill="white" font-weight="700">111 年</text>

  <!-- ========== 節點 4：112年 地方政府（#a8a29e 淺灰）下方 ========== -->
  <rect x="615" y="222" width="70" height="22" rx="11" fill="#a8a29e"/>
  <text x="650" y="237" text-anchor="middle" font-size="14" fill="white" font-weight="700">112 年</text>
  <circle cx="650" cy="272" r="24" fill="#a8a29e"/>
  <text x="650" y="280" text-anchor="middle" font-size="20" fill="white" font-weight="700">4</text>
  <line x1="650" y1="296" x2="650" y2="350" stroke="#a8a29e" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="590" y="350" width="120" height="100" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="590" y="442" width="120" height="8" rx="4" fill="#a8a29e"/>
  <rect x="590" y="438" width="120" height="4" fill="#a8a29e"/>
  <text x="650" y="379" text-anchor="middle" font-size="20" fill="#1e293b" font-weight="700">地方政府</text>
  <text x="650" y="401" text-anchor="middle" font-size="16" fill="#57534e">評鑑年度</text>
  <text x="650" y="421" text-anchor="middle" font-size="16" fill="#57534e">最新查核</text>

  <!-- 計分說明 -->
  <text x="400" y="468" text-anchor="middle" font-size="14" fill="#78716c">計分公式：（第1次＋第2次＋第3次＋第4次）÷ 4，全合格 20 分，函文補件扣 2 分</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
