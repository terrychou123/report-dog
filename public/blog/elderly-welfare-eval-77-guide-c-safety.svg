<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">C 區：6 項一級必要指標</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">任一未達標直接影響評鑑結果 · 25% 配分</text>
  <line x1="28" y1="94" x2="772" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- N=6 list: H=54, inner_gap=10, pad=31 -->
  <!-- Row y: 95, 159, 223, 287, 351, 415 -->

  <!-- Row 1: C4 緊急呼叫 -->
  <rect x="28" y="95" width="744" height="54" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="95" width="6" height="54" rx="2" fill="#d97706"/>
  <circle cx="66" cy="122" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="128" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">C4</text>
  <text x="100" y="114" font-size="18" fill="#1e293b" font-weight="700">寢室及浴廁緊急呼叫系統</text>
  <text x="100" y="135" font-size="14" fill="#57534e">浴室、廁所、寢室均設置且功能正常；有人按鈴能立即反應</text>
  <rect x="620" y="103" width="136" height="38" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="120" font-size="16" fill="#d97706" text-anchor="middle">現場測試</text>
  <text x="688" y="136" font-size="14" fill="#d97706" text-anchor="middle">一級必要</text>

  <!-- Row 2: C9 消防安全 -->
  <rect x="28" y="159" width="744" height="54" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="159" width="6" height="54" rx="2" fill="#78716c"/>
  <circle cx="66" cy="186" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="192" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">C9</text>
  <text x="100" y="178" font-size="18" fill="#1e293b" font-weight="700">消防安全設備與防火管理</text>
  <text x="100" y="199" font-size="14" fill="#57534e">建物防火避難每年申報；消防設備每半年檢修；5 年完整申報紀錄</text>
  <rect x="620" y="167" width="136" height="38" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="184" font-size="16" fill="#78716c" text-anchor="middle">5 年紀錄</text>
  <text x="688" y="200" font-size="14" fill="#78716c" text-anchor="middle">一級必要</text>

  <!-- Row 3: C10 疏散避難 -->
  <rect x="28" y="223" width="744" height="54" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="223" width="6" height="54" rx="2" fill="#57534e"/>
  <circle cx="66" cy="250" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="256" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">C10</text>
  <text x="100" y="242" font-size="18" fill="#1e293b" font-weight="700">疏散避難系統與等待救接空間</text>
  <text x="100" y="263" font-size="14" fill="#57534e">雙向逃生路徑；防火門往避難方向開啟；等待救接空間有排煙設計</text>
  <rect x="620" y="231" width="136" height="38" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="248" font-size="16" fill="#57534e" text-anchor="middle">現場觀察</text>
  <text x="688" y="264" font-size="14" fill="#57534e" text-anchor="middle">一級必要</text>

  <!-- Row 4: C11 災害應變計畫 -->
  <rect x="28" y="287" width="744" height="54" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="287" width="6" height="54" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="314" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="320" font-size="16" fill="#a8a29e" text-anchor="middle" font-weight="900">C11</text>
  <text x="100" y="306" font-size="18" fill="#1e293b" font-weight="700">緊急災害應變計畫</text>
  <text x="100" y="327" font-size="14" fill="#57534e">每年複合型演練+夜間演練各 1 次；每月自主檢查用電；每半年委外檢驗</text>
  <rect x="620" y="295" width="136" height="38" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="312" font-size="16" fill="#1e293b" text-anchor="middle">演練紀錄</text>
  <text x="688" y="328" font-size="14" fill="#1e293b" text-anchor="middle">一級必要</text>

  <!-- Row 5: C12 疏散策略 -->
  <rect x="28" y="351" width="744" height="54" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="351" width="6" height="54" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="378" r="16" fill="#94a3b8" opacity="0.15"/>
  <text x="66" y="384" font-size="16" fill="#94a3b8" text-anchor="middle" font-weight="900">C12</text>
  <text x="100" y="370" font-size="18" fill="#1e293b" font-weight="700">疏散策略與照顧人力應變能力</text>
  <text x="100" y="391" font-size="14" fill="#57534e">各樓層張貼 A3 以上逃生圖；外籍看護工及家屬自聘看護工需受防災訓練</text>
  <rect x="620" y="359" width="136" height="38" rx="8" fill="#94a3b8" opacity="0.12"/>
  <text x="688" y="376" font-size="16" fill="#57534e" text-anchor="middle">A3 逃生圖</text>
  <text x="688" y="392" font-size="14" fill="#57534e" text-anchor="middle">一級必要</text>

  <!-- Row 6: C15 護理站 -->
  <rect x="28" y="415" width="744" height="54" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="415" width="6" height="54" rx="2" fill="#6b7280"/>
  <circle cx="66" cy="442" r="16" fill="#6b7280" opacity="0.15"/>
  <text x="66" y="448" font-size="16" fill="#6b7280" text-anchor="middle" font-weight="900">C15</text>
  <text x="100" y="434" font-size="18" fill="#1e293b" font-weight="700">護理站設施設備</text>
  <text x="100" y="455" font-size="14" fill="#57534e">每層樓設置；備急救設備、氧氣瓶在效期；護理人員熟悉使用</text>
  <rect x="620" y="423" width="136" height="38" rx="8" fill="#6b7280" opacity="0.12"/>
  <text x="688" y="440" font-size="16" fill="#57534e" text-anchor="middle">抽驗熟悉度</text>
  <text x="688" y="456" font-size="14" fill="#57534e" text-anchor="middle">一級必要</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
