<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 右側裝飾區塊 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>

  <!-- 右側裝飾大數字（80%） -->
  <text x="1010" y="215" font-size="148" font-weight="900" fill="#d97706" text-anchor="middle" opacity="0.88">80%</text>
  <text x="1010" y="257" font-size="26" fill="#78716c" text-anchor="middle" font-weight="600">疫苗接種率門檻</text>

  <!-- 右側 2×2 資訊卡片 -->
  <rect x="840" y="279" width="155" height="86" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="918" y="316" font-size="26" fill="#d97706" text-anchor="middle" font-weight="700">手部衛生</text>
  <text x="918" y="347" font-size="21" fill="#a8a29e" text-anchor="middle">五時機稽核</text>

  <rect x="1005" y="279" width="155" height="86" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="1083" y="316" font-size="26" fill="#78716c" text-anchor="middle" font-weight="700">訪客管制</text>
  <text x="1083" y="347" font-size="21" fill="#a8a29e" text-anchor="middle">登記記錄</text>

  <rect x="840" y="375" width="155" height="86" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="918" y="412" font-size="26" fill="#d97706" text-anchor="middle" font-weight="700">感染管制</text>
  <text x="918" y="443" font-size="21" fill="#a8a29e" text-anchor="middle">計畫書</text>

  <rect x="1005" y="375" width="155" height="86" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="1083" y="412" font-size="26" fill="#78716c" text-anchor="middle" font-weight="700">傳染病</text>
  <text x="1083" y="443" font-size="21" fill="#a8a29e" text-anchor="middle">應變演練</text>

  <!-- 右側底部標籤 -->
  <rect x="840" y="471" width="320" height="52" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="1000" y="507" font-size="26" fill="#d97706" text-anchor="middle" font-weight="700">現場觀察 · 資料查核</text>

  <!-- 右側底部清單 -->
  <rect x="840" y="533" width="320" height="52" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="1000" y="569" font-size="22" fill="#57534e" text-anchor="middle">含 A2.1 評鑑前自我檢核表</text>

  <!-- 左側主標題 -->
  <text x="60" y="178" font-size="96" font-weight="900" fill="#1e293b">嬰兒室感染管控</text>
  <text x="60" y="284" font-size="96" font-weight="900" fill="#d97706">做對了嗎？</text>

  <line x1="60" y1="316" x2="780" y2="316" stroke="#dedad3" stroke-width="2"/>

  <text x="60" y="362" font-size="38" fill="#57534e" font-weight="400">A2.1 母嬰安全及感染管制 · 6 個核心要求</text>

  <!-- 特色標籤列 -->
  <rect x="60" y="390" width="178" height="52" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="149" y="422" font-size="26" fill="#d97706" text-anchor="middle" font-weight="600">A2.1 全攻略</text>

  <rect x="250" y="390" width="178" height="52" rx="10" fill="#78716c" opacity="0.12"/>
  <text x="339" y="422" font-size="26" fill="#78716c" text-anchor="middle" font-weight="600">115 年度基準</text>

  <rect x="440" y="390" width="178" height="52" rx="10" fill="#57534e" opacity="0.12"/>
  <text x="529" y="422" font-size="26" fill="#57534e" text-anchor="middle" font-weight="600">常見缺失解析</text>

  <!-- 適用對象 -->
  <text x="60" y="472" font-size="28" fill="#94a3b8">產後護理之家感控負責人 · 護理主管 · 負責人</text>

  <!-- 底部說明 -->
  <text x="60" y="520" font-size="30" fill="#57534e" font-weight="500">感染管控品質 = 嬰兒安全保障</text>
  <text x="60" y="556" font-size="26" fill="#a8a29e">讓每一份稽核記錄都成為評鑑的保護盾</text>

  <!-- 浮水印 -->
  <text x="780" y="600" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
