<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- @template: list-N -->
  <rect width="800" height="500" fill="#f0efe8"/>
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">第三章 服務品質 重點備審項目</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">日間型29分／住宿型30分，住宿型3.11為唯一重點項目</text>
  <line x1="28" y1="94" x2="772" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- Row 1 -->
  <rect x="28" y="160" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="160" width="6" height="62" rx="2" fill="#d97706"/>
  <circle cx="66" cy="191" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="198" font-size="22" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <text x="100" y="183" font-size="22" fill="#1e293b" font-weight="700">3.4 紀錄完整並妥善管理（4分，日間型）</text>
  <text x="100" y="204" font-size="16" fill="#57534e">整合各專業紀錄呈現學員復健情形；需有紀錄管理辦法、保密措施及妥善保存</text>
  <rect x="620" y="168" width="136" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="187" font-size="16" fill="#d97706" text-anchor="middle">日間型最高</text>
  <text x="688" y="207" font-size="16" fill="#d97706" text-anchor="middle">單條配分</text>

  <!-- Row 2 -->
  <rect x="28" y="235" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="235" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="66" cy="266" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="273" font-size="22" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <text x="100" y="258" font-size="22" fill="#1e293b" font-weight="700">3.5 復健基金管理（PFM）</text>
  <text x="100" y="279" font-size="16" fill="#57534e">90%應為工作獎勵按月發放；每月公告收支明細；住宿型為可選項目（可免評）</text>
  <rect x="620" y="243" width="136" height="46" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="262" font-size="16" fill="#78716c" text-anchor="middle">PFM直接</text>
  <text x="688" y="282" font-size="16" fill="#78716c" text-anchor="middle">訪談學員</text>

  <!-- Row 3 -->
  <rect x="28" y="310" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="310" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="66" cy="341" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="348" font-size="22" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <text x="100" y="333" font-size="22" fill="#1e293b" font-weight="700">3.6 學員/住民權益維護（PFM）</text>
  <text x="100" y="354" font-size="16" fill="#57534e">申訴流程（含主管機關電話）、性騷擾防治辦法、個資保護；文件需以學員易懂方式呈現</text>
  <rect x="620" y="318" width="136" height="46" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="337" font-size="16" fill="#57534e" text-anchor="middle">PFM直接</text>
  <text x="688" y="357" font-size="16" fill="#57534e" text-anchor="middle">訪談查核</text>

  <!-- Row 4 -->
  <rect x="28" y="385" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="385" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="416" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="423" font-size="22" fill="#a8a29e" text-anchor="middle" font-weight="900">4</text>
  <text x="100" y="408" font-size="22" fill="#1e293b" font-weight="700">3.9 緊急應變演練</text>
  <text x="100" y="429" font-size="16" fill="#57534e">每半年1次複合式緊急應變演練 + 每半年1次自衛消防演練；成果須通過主管機關備查</text>
  <rect x="620" y="393" width="136" height="46" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="412" font-size="16" fill="#6b7280" text-anchor="middle">每半年</text>
  <text x="688" y="432" font-size="16" fill="#6b7280" text-anchor="middle">需備查</text>

  <!-- 住宿型3.11重點提示（浮動標籤，非第5列色條）-->
  <rect x="28" y="454" width="744" height="20" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="400" y="469" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="700">重3.11 住宿型唯一重點項目：維護住民出入自由，未達C級即評鑑不合格！</text>

  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
