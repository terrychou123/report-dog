<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 右側裝飾區塊 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>

  <!-- 右側裝飾大數字 -->
  <text x="1010" y="240" font-size="170" font-weight="900" fill="#d97706" text-anchor="middle" opacity="0.85">124</text>
  <text x="1010" y="278" font-size="26" fill="#78716c" text-anchor="middle" font-weight="600">條評鑑基準</text>

  <!-- 右側 2×2 資訊卡片 -->
  <!-- 上排 y=298, h=84 -->
  <rect x="838" y="298" width="158" height="84" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="917" y="335" font-size="30" fill="#d97706" text-anchor="middle" font-weight="700">必要 20</text>
  <text x="917" y="365" font-size="20" fill="#a8a29e" text-anchor="middle">不可失分條文</text>

  <rect x="1004" y="298" width="158" height="84" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="1083" y="335" font-size="30" fill="#78716c" text-anchor="middle" font-weight="700">重點 42</text>
  <text x="1083" y="365" font-size="20" fill="#a8a29e" text-anchor="middle">嚴格查核條文</text>

  <!-- 下排 y=394, h=84 -->
  <rect x="838" y="394" width="158" height="84" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="917" y="431" font-size="30" fill="#57534e" text-anchor="middle" font-weight="700">15 章</text>
  <text x="917" y="461" font-size="20" fill="#a8a29e" text-anchor="middle">兩大部分</text>

  <rect x="1004" y="394" width="158" height="84" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="1083" y="431" font-size="30" fill="#d97706" text-anchor="middle" font-weight="700">6 個月</text>
  <text x="1083" y="461" font-size="20" fill="#a8a29e" text-anchor="middle">系統化備審</text>

  <!-- 右側底部標籤 -->
  <rect x="838" y="494" width="324" height="50" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="1000" y="526" font-size="26" fill="#d97706" text-anchor="middle" font-weight="700">114年度衛福部評鑑基準</text>

  <!-- 左側主內容區 -->
  <text x="60" y="210" font-size="120" font-weight="900" fill="#1e293b">醫院評鑑</text>
  <text x="60" y="348" font-size="120" font-weight="900" fill="#d97706">完整攻略</text>

  <line x1="60" y1="374" x2="780" y2="374" stroke="#dedad3" stroke-width="2"/>

  <text x="60" y="420" font-size="38" fill="#57534e" font-weight="400">114年度 124條基準全解析</text>

  <!-- 特色標籤列 -->
  <rect x="60" y="454" width="148" height="54" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="134" y="490" font-size="27" fill="#d97706" text-anchor="middle" font-weight="600">醫院評鑑</text>

  <rect x="220" y="454" width="148" height="54" rx="10" fill="#78716c" opacity="0.12"/>
  <text x="294" y="490" font-size="27" fill="#78716c" text-anchor="middle" font-weight="600">區域醫院</text>

  <rect x="380" y="454" width="148" height="54" rx="10" fill="#57534e" opacity="0.12"/>
  <text x="454" y="490" font-size="27" fill="#57534e" text-anchor="middle" font-weight="600">地區醫院</text>

  <rect x="540" y="454" width="148" height="54" rx="10" fill="#a8a29e" opacity="0.12"/>
  <text x="614" y="490" font-size="27" fill="#78716c" text-anchor="middle" font-weight="600">必要條文</text>

  <!-- 適用對象說明 -->
  <text x="60" y="558" font-size="28" fill="#94a3b8">適用對象：醫院品管人員、護理主管、評鑑協調人員</text>

  <!-- 浮水印 -->
  <text x="1140" y="590" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
