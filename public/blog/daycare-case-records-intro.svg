<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="450" fill="#f0efe8"/>
  <text x="400" y="46" font-size="21" font-weight="700" fill="#1e293b" text-anchor="middle">專業個案紀錄的 6 大核心項目</text>
  <rect x="60" y="58" width="48" height="3" rx="1.5" fill="#d97706"/>
  <line x1="116" y1="59.5" x2="740" y2="59.5" stroke="#dedad3" stroke-width="1"/>

  <!-- Top label -->
  <rect x="52" y="78" width="696" height="34" rx="8" fill="#d97706" opacity="0.08"/>
  <text x="400" y="99" font-size="13" fill="#92400e" text-anchor="middle" font-weight="600">對應 115 年度評鑑基準第 5、6、7、8、10、14 條</text>

  <!-- 6 items in 2x3 grid -->
  <!-- Row 1 -->
  <!-- Item 1 -->
  <rect x="52" y="124" width="210" height="90" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="52" y="124" width="210" height="4" rx="2" fill="#d97706"/>
  <text x="72" y="150" font-size="14" font-weight="700" fill="#1e293b">① 入案評估紀錄</text>
  <text x="72" y="170" font-size="12" fill="#57534e">ADL / IADL / MMSE 分數</text>
  <text x="72" y="188" font-size="11" fill="#d97706">第 5 條 ｜ 每 6 個月再評估</text>

  <!-- Item 2 -->
  <rect x="295" y="124" width="210" height="90" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="295" y="124" width="210" height="4" rx="2" fill="#78716c"/>
  <text x="315" y="150" font-size="14" font-weight="700" fill="#1e293b">② 照顧計畫</text>
  <text x="315" y="170" font-size="12" fill="#57534e">7 工作天內 ｜ 具體可衡量目標</text>
  <text x="315" y="188" font-size="11" fill="#78716c">第 6 條 ｜ 含個案家屬意見</text>

  <!-- Item 3 -->
  <rect x="538" y="124" width="210" height="90" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="538" y="124" width="210" height="4" rx="2" fill="#a8a29e"/>
  <text x="558" y="150" font-size="14" font-weight="700" fill="#1e293b">③ 追蹤評值</text>
  <text x="558" y="170" font-size="12" fill="#57534e">目標達成度 + 原因分析</text>
  <text x="558" y="188" font-size="11" fill="#78716c">第 7 條 ｜ 每 3 個月或狀況變化</text>

  <!-- Row 2 -->
  <!-- Item 4 -->
  <rect x="52" y="232" width="210" height="90" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="52" y="232" width="210" height="4" rx="2" fill="#d97706" opacity="0.6"/>
  <text x="72" y="258" font-size="14" font-weight="700" fill="#1e293b">④ 個案討論紀錄</text>
  <text x="72" y="278" font-size="12" fill="#57534e">跨專業 ｜ 決議事項追蹤</text>
  <text x="72" y="296" font-size="11" fill="#d97706">第 8 條 ｜ 每季至少 1 次</text>

  <!-- Item 5 -->
  <rect x="295" y="232" width="210" height="90" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="295" y="232" width="210" height="4" rx="2" fill="#78716c" opacity="0.6"/>
  <text x="315" y="258" font-size="14" font-weight="700" fill="#1e293b">⑤ 紀錄保存管理</text>
  <text x="315" y="278" font-size="12" fill="#57534e">7 年保存 ｜ 結案後追蹤</text>
  <text x="315" y="296" font-size="11" fill="#78716c">第 10 條 ｜ 查閱權限管控</text>

  <!-- Item 6 -->
  <rect x="538" y="232" width="210" height="90" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
