<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"
     font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- Header（y=31, h=54）-->
  <rect x="0" y="31" width="800" height="54" fill="white"/>
  <rect x="0" y="31" width="6" height="54" fill="#d97706"/>
  <text x="28" y="71" font-size="32" fill="#1e293b" font-weight="700">專業個案紀錄 6 大核心項目</text>

  <!-- ===== Row 1（y=95）#d97706 個人基本資料 ===== -->
  <rect x="28" y="95" width="744" height="54" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="95" width="6" height="54" rx="2" fill="#d97706"/>
  <circle cx="66" cy="122" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="128" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <text x="100" y="119" font-size="18" fill="#1e293b" font-weight="700">個人基本資料</text>
  <text x="100" y="138" font-size="14" fill="#57534e">姓名、診斷、家屬聯絡、緊急聯絡人及服務起始資訊</text>
  <rect x="620" y="103" width="136" height="38" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="118" font-size="16" fill="#d97706" text-anchor="middle">基本資訊</text>
  <text x="688" y="134" font-size="14" fill="#d97706" text-anchor="middle">開案建檔</text>

  <!-- ===== Row 2（y=159）#78716c 身心狀況評估 ===== -->
  <rect x="28" y="159" width="744" height="54" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="159" width="6" height="54" rx="2" fill="#78716c"/>
  <circle cx="66" cy="186" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="192" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <text x="100" y="183" font-size="18" fill="#1e293b" font-weight="700">身心狀況評估</text>
  <text x="100" y="202" font-size="14" fill="#57534e">ADL/IADL 評估、認知功能、身體健康、失智症狀等</text>
  <rect x="620" y="167" width="136" height="38" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="182" font-size="16" fill="#78716c" text-anchor="middle">初期評估</text>
  <text x="688" y="198" font-size="14" fill="#78716c" text-anchor="middle">需求盤點</text>

  <!-- ===== Row 3（y=223）#57534e 照顧計畫與目標 ===== -->
  <rect x="28" y="223" width="744" height="54" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="223" width="6" height="54" rx="2" fill="#57534e"/>
  <circle cx="66" cy="250" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="256" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <text x="100" y="247" font-size="18" fill="#1e293b" font-weight="700">照顧計畫與目標</text>
  <text x="100" y="266" font-size="14" fill="#57534e">個別照護目標、服務介入措施、預期成效與計畫更新日期</text>
  <rect x="620" y="231" width="136" height="38" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="246" font-size="16" fill="#57534e" text-anchor="middle">計畫核心</text>
  <text x="688" y="262" font-size="14" fill="#57534e" text-anchor="middle">第 6 條</text>

  <!-- ===== Row 4（y=287）#a8a29e 服務執行紀錄 ===== -->
  <rect x="28" y="287" width="744" height="54" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="287" width="6" height="54" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="314" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="320" font-size="16" fill="#a8a29e" text-anchor="middle" font-weight="900">4</text>
  <text x="100" y="311" font-size="18" fill="#1e293b" font-weight="700">服務執行紀錄</text>
  <text x="100" y="330" font-size="14" fill="#57534e">每次服務內容、出席狀況、特殊情況與工作人員簽名</text>
  <rect x="620" y="295" width="136" height="38" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="310" font-size="16" fill="#a8a29e" text-anchor="middle">執行記錄</text>
  <text x="688" y="326" font-size="14" fill="#a8a29e" text-anchor="middle">第 7 條</text>

  <!-- ===== Row 5（y=351）#94a3b8 追蹤評值結果 ===== -->
  <rect x="28" y="351" width="744" height="54" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="351" width="6" height="54" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="378" r="16" fill="#94a3b8" opacity="0.15"/>
  <text x="66" y="384" font-size="16" fill="#94a3b8" text-anchor="middle" font-weight="900">5</text>
  <text x="100" y="375" font-size="18" fill="#1e293b" font-weight="700">追蹤評值結果</text>
  <text x="100" y="394" font-size="14" fill="#57534e">月度狀況變化、目標達成率、照護計畫調整說明</text>
  <rect x="620" y="359" width="136" height="38" rx="8" fill="#94a3b8" opacity="0.12"/>
  <text x="688" y="374" font-size="16" fill="#94a3b8" text-anchor="middle">持續評估</text>
  <text x="688" y="390" font-size="14" fill="#94a3b8" text-anchor="middle">第 7 條</text>

  <!-- ===== Row 6（y=415）#6b7280 特殊事件紀錄 ===== -->
  <rect x="28" y="415" width="744" height="54" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="415" width="6" height="54" rx="2" fill="#6b7280"/>
  <circle cx="66" cy="442" r="16" fill="#6b7280" opacity="0.15"/>
  <text x="66" y="448" font-size="16" fill="#6b7280" text-anchor="middle" font-weight="900">6</text>
  <text x="100" y="439" font-size="18" fill="#1e293b" font-weight="700">特殊事件紀錄</text>
  <text x="100" y="458" font-size="14" fill="#57534e">意外、跌倒、行為問題、通報處理及後續追蹤說明</text>
  <rect x="620" y="423" width="136" height="38" rx="8" fill="#6b7280" opacity="0.12"/>
  <text x="688" y="438" font-size="16" fill="#6b7280" text-anchor="middle">異常管理</text>
  <text x="688" y="454" font-size="14" fill="#6b7280" text-anchor="middle">即時記錄</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
