  <text x="558" y="296" font-size="11" fill="#dc2626">第 14 條 ｜ 後續追蹤改善</text>

  <!-- Bottom insight -->
  <rect x="52" y="338" width="696" height="62" rx="10" fill="white" stroke="#d97706" stroke-width="1" opacity="0.8"/>
  <text x="76" y="362" font-size="13" font-weight="700" fill="#1e293b">關鍵原則：做了也要寫，寫了要寫得具體</text>
  <text x="76" y="384" font-size="12" fill="#78716c">委員無法憑口頭說明給分——「整體良好」≠ 符合評鑑要求</text>

  <text x="760" y="421" font-size="16" fill="#c4bfb8" text-anchor="end" font-weight="400" font-family="'Noto Sans TC', sans-serif">報告汪 reportwang.com</text>
