<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="450" fill="#f0efe8"/>
  <text x="400" y="46" font-size="21" font-weight="700" fill="#1e293b" text-anchor="middle">評鑑結束 = 下次評鑑的開始：4 大準備方向</text>
  <rect x="60" y="58" width="48" height="3" rx="1.5" fill="#d97706"/>
  <line x1="116" y1="59.5" x2="740" y2="59.5" stroke="#dedad3" stroke-width="1"/>

  <!-- Top banner -->
  <rect x="52" y="78" width="696" height="38" rx="8" fill="#d97706" opacity="0.08"/>
  <text x="400" y="101" font-size="13" fill="#92400e" text-anchor="middle" font-weight="600">高分機構的秘訣：不是評鑑前衝刺，而是平時就在做評鑑的事</text>

  <!-- 4 cards in 2x2 -->
  <!-- Card 1 -->
  <rect x="52" y="136" width="330" height="140" rx="12" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="52" y="136" width="330" height="5" rx="2.5" fill="#d97706"/>
  <text x="72" y="165" font-size="15" fill="#1e293b" font-weight="700">建立日常紀錄習慣</text>
  <text x="72" y="183" font-size="12" fill="#64748b">讓評鑑文件在日常服務中自然產生</text>
  <line x1="68" y1="200" x2="366" y2="200" stroke="#f0ede6" stroke-width="1"/>
  <text x="72" y="220" font-size="12" fill="#78716c">→ 督導紀錄每月確實填寫</text>
  <text x="72" y="240" font-size="12" fill="#78716c">→ 個案計畫每季更新有追蹤</text>
  <text x="72" y="260" font-size="12" fill="#78716c">→ 品管數據每月收集不間斷</text>

  <!-- Card 2 -->
  <rect x="418" y="136" width="330" height="140" rx="12" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="418" y="136" width="330" height="5" rx="2.5" fill="#78716c"/>
  <text x="438" y="165" font-size="15" fill="#1e293b" font-weight="700">定期內部自評</text>
  <text x="438" y="183" font-size="12" fill="#64748b">不等評鑑才知道缺什麼</text>
  <line x1="434" y1="200" x2="732" y2="200" stroke="#f0ede6" stroke-width="1"/>
  <text x="438" y="220" font-size="12" fill="#78716c">→ 每季一次內部自評稽核</text>
  <text x="438" y="240" font-size="12" fill="#78716c">→ 發現問題立即改善</text>
  <text x="438" y="260" font-size="12" fill="#78716c">→ 縮短評鑑前衝刺時間</text>

  <!-- Card 3 -->
  <rect x="52" y="292" width="330" height="120" rx="12" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="52" y="292" width="330" height="5" rx="2.5" fill="#a8a29e"/>
  <text x="72" y="321" font-size="15" fill="#1e293b" font-weight="700">累積評鑑知識庫</text>
  <text x="72" y="339" font-size="12" fill="#64748b">歷次評鑑的寶貴資產</text>
  <line x1="68" y1="356" x2="366" y2="356" stroke="#f0ede6" stroke-width="1"/>
  <text x="72" y="376" font-size="12" fill="#78716c">→ 保存歷次委員問題記錄</text>
  <text x="72" y="394" font-size="12" fill="#78716c">→ 建立機構問答手冊</text>

  <!-- Card 4 -->
  <rect x="418" y="292" width="330" height="120" rx="12" fill="#d97706" opacity="0.06"/>
  <rect x="418" y="292" width="330" height="120" rx="12" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.5"/>
  <rect x="418" y="292" width="330" height="5" rx="2.5" fill="#d97706" opacity="0.7"/>
  <text x="438" y="321" font-size="15" fill="#1e293b" font-weight="700">設定下次目標</text>
  <text x="438" y="339" font-size="12" fill="#64748b">從這次缺失中找到進步方向</text>
  <line x1="434" y1="356" x2="732" y2="356" stroke="#f0ede6" stroke-width="1"/>
  <text x="438" y="376" font-size="12" fill="#d97706">→ 設定提升評分的具體指標</text>
  <text x="438" y="394" font-size="12" fill="#d97706">→ 目標：下次評鑑零缺失</text>

  <text x="760" y="421" font-size="16" fill="#c4bfb8" text-anchor="end" font-weight="400" font-family="'Noto Sans TC', sans-serif">報告汪 reportwang.com</text>
</svg>
