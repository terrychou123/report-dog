<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <text x="40" y="48" font-size="32" font-weight="900" fill="#1e293b" >如何使用自評檢核表</text>
  <text x="40" y="78" font-size="22" fill="#78716c" >評鑑前3個月開始，系統性完成備審準備</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#d97706" stroke-width="2"/>

  <!-- 流程連接線 -->
  <line x1="130" y1="200" x2="670" y2="200" stroke="#e8e6de" stroke-width="4" stroke-dasharray="8,4"/>

  <!-- 步驟1 -->
  <circle cx="130" cy="200" r="38" fill="#d97706" opacity="0.15"/>
  <text x="130" y="196" font-size="22" font-weight="700" fill="white" text-anchor="middle" >步驟</text>
  <text x="130" y="220" font-size="22" font-weight="700" fill="white" text-anchor="middle" >1</text>
  <rect x="60" y="258" width="140" height="92" rx="8" fill="white"/>
  <text x="130" y="284" font-size="18" font-weight="700" fill="#d97706" text-anchor="middle" >下載使用</text>
  <text x="130" y="308" font-size="14" fill="#57534e" text-anchor="middle" >列印或數位工具</text>
  <text x="130" y="330" font-size="14" fill="#57534e" text-anchor="middle" >每人獨立勾選</text>

  <!-- 步驟2 -->
  <circle cx="330" cy="200" r="38" fill="#78716c" opacity="0.15"/>
  <text x="330" y="196" font-size="22" font-weight="700" fill="white" text-anchor="middle" >步驟</text>
  <text x="330" y="220" font-size="22" font-weight="700" fill="white" text-anchor="middle" >2</text>
  <rect x="260" y="258" width="140" height="92" rx="8" fill="white"/>
  <text x="330" y="284" font-size="18" font-weight="700" fill="#78716c" text-anchor="middle" >逐條確認</text>
  <text x="330" y="308" font-size="14" fill="#57534e" text-anchor="middle" >從試扣分項目開始</text>
  <text x="330" y="330" font-size="14" fill="#57534e" text-anchor="middle" >逐條確認文件</text>

  <!-- 步驟3 -->
  <circle cx="530" cy="200" r="38" fill="#57534e" opacity="0.15"/>
  <text x="530" y="196" font-size="22" font-weight="700" fill="white" text-anchor="middle" >步驟</text>
  <text x="530" y="220" font-size="22" font-weight="700" fill="white" text-anchor="middle" >3</text>
  <rect x="460" y="258" width="140" height="92" rx="8" fill="white"/>
  <text x="530" y="284" font-size="18" font-weight="700" fill="#57534e" text-anchor="middle" >標記缺口</text>
  <text x="530" y="308" font-size="14" fill="#57534e" text-anchor="middle" >待確認項目優先補強</text>
  <text x="530" y="330" font-size="14" fill="#57534e" text-anchor="middle" >設定責任人員</text>

  <!-- 步驟4 -->
  <circle cx="670" cy="200" r="38" fill="#a8a29e" opacity="0.15"/>
  <text x="670" y="196" font-size="22" font-weight="700" fill="white" text-anchor="middle" >步驟</text>
  <text x="670" y="220" font-size="22" font-weight="700" fill="white" text-anchor="middle" >4</text>
  <rect x="600" y="258" width="140" height="92" rx="8" fill="white"/>
  <text x="670" y="284" font-size="18" font-weight="700" fill="#a8a29e" text-anchor="middle" >再次核對</text>
  <text x="670" y="308" font-size="14" fill="#57534e" text-anchor="middle" >評鑑前1週最終確認</text>
  <text x="670" y="330" font-size="14" fill="#57534e" text-anchor="middle" >全部打勾完成</text>

  <!-- 提示文字 -->
  <rect x="40" y="390" width="720" height="48" rx="8" fill="#d97706" fill-opacity="0.12"/>
  <text x="400" y="421" font-size="20" fill="#d97706" text-anchor="middle" >建議從評鑑前 3 個月開始，試扣分項目最優先確認</text>

  <!-- 品牌浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" >報告汪 reportwang.com</text>
</svg>
