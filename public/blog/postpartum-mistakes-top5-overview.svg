  <text x="100" y="291" font-size="20" fill="#1e293b" font-weight="700">流感疫苗接種率未達標</text>
  <text x="100" y="312" font-size="16" fill="#57534e">工作人員接種率未達 80% 門檻</text>
  <rect x="620" y="272" width="136" height="44" rx="8" fill="#57534e" opacity="0.12"/>
