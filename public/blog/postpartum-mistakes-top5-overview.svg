  <text x="100" y="145" font-size="20" fill="#1e293b" font-weight="700">品質指標季報缺漏或未分析</text>
  <text x="100" y="166" font-size="16" fill="#57534e">6 項指標只有數字、缺趨勢分析或改善追蹤</text>
  <rect x="620" y="126" width="136" height="44" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="142" font-size="16" fill="#d97706" text-anchor="middle">A2.3</text>
  <text x="688" y="162" font-size="16" fill="#d97706" text-anchor="middle">最常失分</text>

  <rect x="28" y="191" width="744" height="60" rx="12" fill="#e8e6de"/>
