  <text x="100" y="364" font-size="20" fill="#1e293b" font-weight="700">個別化哺乳計畫未確實記錄</text>
  <text x="100" y="385" font-size="16" fill="#57534e">統一格式缺個別化、缺追蹤、純母乳率沒統計</text>
  <rect x="620" y="345" width="136" height="44" rx="8" fill="#a8a29e" opacity="0.12"/>
