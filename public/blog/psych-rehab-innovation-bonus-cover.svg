<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 右側裝飾區塊 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6dc"/>
  <!-- 右側 CHIME 大文字 -->
  <text x="1010" y="215" font-size="130" fill="#d97706" text-anchor="middle" font-weight="700" opacity="0.85">CHIME</text>
  <!-- C→B等 標籤 -->
  <rect x="870" y="248" width="280" height="56" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="1010" y="267" font-size="22" fill="#d97706" text-anchor="middle" font-weight="700">C 等 - B 等卓越策略</text>
  <text x="1010" y="300" font-size="18" fill="#57534e" text-anchor="middle">差距不在文件，在理念體現</text>
  <!-- 可選項目說明 -->
  <text x="1010" y="370" font-size="20" fill="#57534e" text-anchor="middle">可1.9（日間型）</text>
  <text x="1010" y="400" font-size="20" fill="#57534e" text-anchor="middle">可1.11（住宿型）</text>
  <text x="1010" y="440" font-size="18" fill="#57534e" text-anchor="middle">前次評鑑改善項目</text>
  <!-- 加分說明 -->
  <rect x="870" y="470" width="280" height="46" rx="8" fill="#9333ea" opacity="0.10"/>
  <text x="1010" y="498" font-size="20" fill="#9333ea" text-anchor="middle" font-weight="700">加分選項 ＋ 評鑑脫穎而出</text>
  <!-- 左側主要內容 -->
  <rect x="60" y="60" width="196" height="38" rx="19" fill="#9333ea" opacity="0.12"/>
  <text x="158" y="85" font-size="18" fill="#9333ea" text-anchor="middle" font-weight="700">加分策略</text>
  <!-- 主標題 -->
  <text x="60" y="185" font-size="68" fill="#1e293b" font-weight="700">評鑑脫穎而出</text>
  <text x="60" y="270" font-size="64" fill="#d97706" font-weight="700">加分策略全解析</text>
  <!-- 分隔線 -->
  <line x1="60" y1="300" x2="760" y2="300" stroke="#dedad3" stroke-width="2"/>
  <!-- 副標題 -->
  <text x="60" y="345" font-size="28" fill="#57534e">復元導向 ＋ 去機構化</text>
  <text x="60" y="385" font-size="26" fill="#57534e">前次評鑑改善成效展示策略</text>
  <!-- 標籤 Pills -->
  <rect x="60" y="436" width="120" height="36" rx="18" fill="#9333ea" opacity="0.12"/>
  <text x="120" y="459" font-size="16" fill="#9333ea" text-anchor="middle" font-weight="600">加分項目</text>
  <rect x="194" y="436" width="100" height="36" rx="18" fill="#d97706" opacity="0.12"/>
  <text x="244" y="459" font-size="16" fill="#d97706" text-anchor="middle" font-weight="600">CHIME</text>
  <rect x="308" y="436" width="128" height="36" rx="18" fill="#16a34a" opacity="0.12"/>
  <text x="372" y="459" font-size="16" fill="#16a34a" text-anchor="middle" font-weight="600">去機構化</text>
  <rect x="450" y="436" width="148" height="36" rx="18" fill="#78716c" opacity="0.12"/>
  <text x="524" y="459" font-size="16" fill="#78716c" text-anchor="middle" font-weight="600">115年度評鑑</text>
  <!-- 浮水印 -->
  <text x="1140" y="610" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
