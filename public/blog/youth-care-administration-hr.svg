<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans TC', sans-serif">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;display=swap');</style>
  </defs>
  <!-- Background -->
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- Header -->
  <rect x="28" y="29" width="744" height="60" rx="12" fill="#1e293b"/>
  <text x="400" y="53"  font-size="14" fill="#94a3b8" text-anchor="middle">項目 4、5、6 — 共4分（主管機關評分，全年記錄為準）</text>
  <text x="400" y="75"  font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">人力資源三項評鑑關鍵指標</text>
  <!-- Row 1: 項目 4 -->
  <rect x="28" y="118" width="744" height="60" rx="12" fill="#fff7ed"/>
  <rect x="28" y="118" width="6" height="60" rx="2" fill="#d97706"/>
  <circle cx="66" cy="148" r="16" fill="#fef3c7"/>
  <text x="66" y="153"  font-size="16" font-weight="700" fill="#d97706" text-anchor="middle">4</text>
  <text x="100" y="140"  font-size="15" font-weight="700" fill="#1e293b">人員資格（2分）</text>
  <text x="100" y="162"  font-size="13" fill="#57534e">進用符規定（1分）、流失率20%以下（0.5分）、久任獎勵（0.5分）</text>
  <rect x="620" y="129" width="136" height="38" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="152"  font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">全年輔導查核</text>
  <!-- Flow indicator: 人員流動率 -->
  <rect x="28" y="191" width="360" height="52" rx="10" fill="#ffffff"/>
  <text x="48" y="212"  font-size="13" font-weight="700" fill="#1e293b">流動率計算</text>
  <text x="48" y="232"  font-size="13" fill="#57534e">年度離職人數 / 年初在職人數</text>
  <rect x="398" y="191" width="374" height="52" rx="10" fill="#ffffff"/>
  <text x="418" y="212"  font-size="13" font-weight="700" fill="#1e293b">久任獎勵形式</text>
  <text x="418" y="232"  font-size="13" fill="#57534e">年資加薪、特休、進修補助、表揚制度</text>
  <!-- Row 2: 項目 5 -->
  <rect x="28" y="264" width="744" height="60" rx="12" fill="#fff7ed"/>
  <rect x="28" y="264" width="6" height="60" rx="2" fill="#78716c"/>
  <circle cx="66" cy="294" r="16" fill="#f5f5f4"/>
  <text x="66" y="299"  font-size="16" font-weight="700" fill="#78716c" text-anchor="middle">5</text>
  <text x="100" y="286"  font-size="15" font-weight="700" fill="#1e293b">訓練進修（1分）</text>
  <text x="100" y="308"  font-size="13" fill="#57534e">專業人員訓練符規定（0.5）、所有人員完成性侵害防治課程（0.5）</text>
  <rect x="620" y="275" width="136" height="38" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="298"  font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">全員無例外</text>
  <!-- Row 3: 項目 6 -->
  <rect x="28" y="337" width="744" height="60" rx="12" fill="#fff7ed"/>
  <rect x="28" y="337" width="6" height="60" rx="2" fill="#57534e"/>
  <circle cx="66" cy="367" r="16" fill="#f5f5f4"/>
  <text x="66" y="372"  font-size="16" font-weight="700" fill="#57534e" text-anchor="middle">6</text>
  <text x="100" y="359"  font-size="15" font-weight="700" fill="#1e293b">勞動條件（1分）</text>
  <text x="100" y="381"  font-size="13" fill="#57534e">合法工時、加班補償、勞健保投保、勞檢合規</text>
  <rect x="620" y="348" width="136" height="38" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="371"  font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">勞檢紀錄</text>
  <!-- Warning bar -->
  <rect x="28" y="412" width="744" height="48" rx="12" fill="#fef2f2"/>
  <text x="400" y="441"  font-size="15" font-weight="700" fill="#b91c1c" text-anchor="middle">注意：項目4、5、6評鑑當天無法補救，需貫穿全年落實</text>
  <!-- Watermark -->
  <text x="760" y="480"  font-size="16" fill="#d97706" text-anchor="end" opacity="0.6">報告汪</text>
</svg>
