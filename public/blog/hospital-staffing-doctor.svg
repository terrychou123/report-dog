<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區塊 -->
  <rect x="0" y="0" width="800" height="110" fill="#1e293b"/>
  <text x="400" y="52"  font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle">醫師人力（1.3.1）三大查核重點</text>
  <text x="400" y="84"  font-size="14" fill="#a8a29e" text-anchor="middle">必要條文／資料查核—各科別醫師配置符合醫療法規定</text>

  <!-- 列1：各科別人力符合法規 -->
  <rect x="38" y="128" width="724" height="90" rx="10" fill="#fef3c7"/>
  <rect x="38" y="128" width="8" height="90" rx="4" fill="#d97706"/>
  <text x="62" y="160"  font-size="15" font-weight="800" fill="#d97706">各科別人力符合法規</text>
  <text x="62" y="183"  font-size="14" fill="#57534e">依醫療法及醫院設置標準，各科別醫師數量與資格符合規定，有書面清冊可供查核</text>
  <text x="62" y="204"  font-size="14" fill="#a8a29e">核心文件：醫師名冊、科別配置表</text>
  <!-- 右側標籤 -->
  <rect x="630" y="148" width="114" height="36" rx="18" fill="#d97706"/>
  <text x="687" y="171"  font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle">人數合規</text>

  <!-- 列2：執業執照有效登記 -->
  <rect x="38" y="231" width="724" height="90" rx="12" fill="#f0efe8" stroke="#e8e6de" stroke-width="1"/>
  <rect x="38" y="231" width="8" height="90" rx="4" fill="#78716c"/>
  <text x="62" y="263"  font-size="15" font-weight="800" fill="#78716c">執業執照有效登記</text>
  <text x="62" y="286"  font-size="14" fill="#57534e">所有醫師執業執照在有效期內，執業登記院所與實際執業地點一致，無跨院所違規</text>
  <text x="62" y="307"  font-size="14" fill="#a8a29e">核心文件：執業執照影本、執業登記清冊</text>
  <!-- 右側標籤 -->
  <rect x="618" y="251" width="132" height="36" rx="18" fill="#78716c"/>
  <text x="684" y="274"  font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle">執照管理</text>

  <!-- 列3：值班排班符合規定 -->
  <rect x="38" y="334" width="724" height="90" rx="12" fill="#f0efe8" stroke="#e8e6de" stroke-width="1"/>
  <rect x="38" y="334" width="8" height="90" rx="4" fill="#57534e"/>
  <text x="62" y="366"  font-size="15" font-weight="800" fill="#57534e">值班排班符合規定</text>
  <text x="62" y="389"  font-size="14" fill="#57534e">值班醫師排班符合相關法規（含 PGY、住院醫師值班規定），班表記錄完整可查核</text>
  <text x="62" y="410"  font-size="14" fill="#a8a29e">核心文件：值班班表、排班紀錄</text>
  <!-- 右側標籤 -->
  <rect x="618" y="354" width="126" height="36" rx="18" fill="#57534e"/>
  <text x="681" y="377"  font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle">排班合規</text>

  <!-- 浮水印 -->
  <text x="400" y="480"  font-size="14" fill="#a8a29e" text-anchor="middle">報告汪 reportwang.com</text>
</svg>
