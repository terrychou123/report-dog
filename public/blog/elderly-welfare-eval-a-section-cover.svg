<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>

  <!-- 左側裝飾色塊 -->
  <rect x="0" y="0" width="8" height="630" fill="#ea580c"/>

  <!-- 頂部裝飾線 -->
  <rect x="60" y="60" width="480" height="6" fill="#ea580c" rx="3"/>

  <!-- 主標題第1行 -->
  <text x="60" y="180"  font-size="100" font-weight="900" fill="#1e293b">A 區經營管理</text>

  <!-- 主標題第2行 -->
  <text x="60" y="300"  font-size="100" font-weight="900" fill="#ea580c">15 項深度解析</text>

  <!-- 副標題 -->
  <text x="60" y="370"  font-size="38" font-weight="500" fill="#57534e">A2/A4 二級加強避雷，20% 配分穩拿</text>

  <!-- Pill 標籤 -->
  <!-- Pill 1: A2/A4避雷 -->
  <rect x="60" y="420" width="160" height="44" rx="22" fill="#ea580c"/>
  <text x="140" y="448"  font-size="20" font-weight="600" fill="white" text-anchor="middle">A2/A4避雷</text>

  <!-- Pill 2: 人力法規 -->
  <rect x="236" y="420" width="130" height="44" rx="22" fill="#78716c"/>
  <text x="301" y="448"  font-size="20" font-weight="600" fill="white" text-anchor="middle">人力法規</text>

  <!-- Pill 3: 訓練時數 -->
  <rect x="382" y="420" width="130" height="44" rx="22" fill="#57534e"/>
  <text x="447" y="448"  font-size="20" font-weight="600" fill="white" text-anchor="middle">訓練時數</text>

  <!-- Pill 4: 多人協作 -->
  <rect x="528" y="420" width="130" height="44" rx="22" fill="#a8a29e"/>
  <text x="593" y="448"  font-size="20" font-weight="600" fill="white" text-anchor="middle">多人協作</text>

  <!-- 右側裝飾區塊 -->
  <rect x="840" y="120" width="300" height="280" rx="24" fill="white" opacity="0.7"/>

  <!-- 大字 20% -->
  <text x="990" y="281"  font-size="160" font-weight="900" fill="#ea580c" text-anchor="middle">20%</text>

  <!-- 說明文字 -->
  <text x="990" y="351"  font-size="36" font-weight="500" fill="#57534e" text-anchor="middle">配分佔比</text>

  <!-- 底部裝飾線 -->
  <rect x="60" y="540" width="700" height="4" fill="#e8e6de" rx="2"/>

  <!-- 年度標示 -->
  <text x="60" y="575"  font-size="26" fill="#a8a29e" font-weight="400">115年度老人福利機構評鑑</text>

  <!-- 浮水印 -->
  <text x="1140" y="590" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400" >報告汪 reportwang.com</text>
</svg>
