<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <rect x="0" y="50" width="800" height="76" fill="white"/>
  <rect x="0" y="50" width="6" height="76" rx="2" fill="#d97706"/>
  <text x="28" y="104" font-size="36" fill="#1e293b" font-weight="700">子項五六：用藥反應監測與管制藥銷燬</text>
  <rect x="28" y="175" width="744" height="130" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="175" width="6" height="130" rx="2" fill="#57534e"/>
  <circle cx="66" cy="235" r="20" fill="#57534e" opacity="0.15"/>
  <text x="66" y="241" font-size="18" fill="#57534e" text-anchor="middle" font-weight="900">監測</text>
  <text x="100" y="225" font-size="22" fill="#1e293b" font-weight="700">子項五：用藥反應系統化觀察</text>
  <text x="100" y="251" font-size="16" fill="#57534e">精神科藥物副作用需主動觀察：錐體外系症狀（靜坐不能、遲動）</text>
  <text x="100" y="271" font-size="16" fill="#57534e">代謝症候群（體重增加、血糖、血脂）需定期監測並記錄</text>
  <text x="100" y="291" font-size="16" fill="#57534e">副作用觀察記錄、必要時與醫師藥師諮詢，有追蹤記錄</text>
  <rect x="620" y="183" width="136" height="115" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="234" font-size="16" fill="#57534e" text-anchor="middle">主動</text>
  <text x="688" y="254" font-size="16" fill="#57534e" text-anchor="middle">觀察</text>
  <rect x="28" y="325" width="744" height="120" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="325" width="6" height="120" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="380" r="20" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="386" font-size="18" fill="#a8a29e" text-anchor="middle" font-weight="900">銷燬</text>
  <text x="100" y="370" font-size="22" fill="#1e293b" font-weight="700">子項六：管制藥品須送合法機構回收</text>
  <text x="100" y="396" font-size="16" fill="#57534e">住民過世或出院後的剩餘管制藥品，不能直接丟棄</text>
  <text x="100" y="416" font-size="16" fill="#57534e">需送交健保特約藥局或醫療院所，有記錄可查，是常被忽略的缺失</text>
  <rect x="620" y="333" width="136" height="105" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="381" font-size="16" fill="#a8a29e" text-anchor="middle">合法</text>
  <text x="688" y="401" font-size="16" fill="#a8a29e" text-anchor="middle">回收</text>
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
