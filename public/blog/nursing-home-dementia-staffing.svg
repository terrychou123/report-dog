<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- 標題 -->
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">失智型機構人力配置標準</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">A11 照顧服務員（一級必要）配置比例</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- 表格標頭 -->
  <rect x="40" y="110" width="720" height="46" rx="6" fill="#d97706"/>
  <text x="160" y="140" text-anchor="middle" font-size="16" fill="#fff" font-weight="700">機構類型</text>
  <text x="360" y="140" text-anchor="middle" font-size="16" fill="#fff" font-weight="700">日班（白天）</text>
  <text x="540" y="140" text-anchor="middle" font-size="16" fill="#fff" font-weight="700">夜班（夜間）</text>
  <text x="700" y="140" text-anchor="middle" font-size="16" fill="#fff" font-weight="700">備註</text>

  <!-- 失智型（強調） -->
  <rect x="40" y="156" width="720" height="52" rx="0" fill="#fef3c7"/>
  <rect x="40" y="156" width="4" height="52" fill="#d97706"/>
  <text x="160" y="172" text-anchor="middle" font-size="16" fill="#d97706" font-weight="700">失智型</text>
  <text x="160" y="196" text-anchor="middle" font-size="14" fill="#d97706">（本文重點）</text>
  <text x="360" y="187" text-anchor="middle" font-size="22" fill="#d97706" font-weight="700">1 : 3</text>
  <text x="540" y="187" text-anchor="middle" font-size="22" fill="#d97706" font-weight="700">1 : 15</text>
  <text x="700" y="187" text-anchor="middle" font-size="14" fill="#d97706">一級必要</text>

  <!-- 長照型 -->
  <rect x="40" y="208" width="720" height="48" rx="0" fill="#fff"/>
  <rect x="40" y="208" width="4" height="48" fill="#78716c"/>
  <text x="160" y="238" text-anchor="middle" font-size="15" fill="#57534e" font-weight="600">長照型</text>
  <text x="360" y="238" text-anchor="middle" font-size="18" fill="#57534e">1 : 5</text>
  <text x="540" y="238" text-anchor="middle" font-size="18" fill="#57534e">1 : 15</text>
  <text x="700" y="238" text-anchor="middle" font-size="14" fill="#78716c">一級必要</text>

  <!-- 養護型 -->
  <rect x="40" y="256" width="720" height="48" rx="0" fill="#fafaf8"/>
  <rect x="40" y="256" width="4" height="48" fill="#78716c"/>
  <text x="160" y="286" text-anchor="middle" font-size="15" fill="#57534e" font-weight="600">養護型</text>
  <text x="360" y="286" text-anchor="middle" font-size="18" fill="#57534e">1 : 8</text>
  <text x="540" y="286" text-anchor="middle" font-size="18" fill="#57534e">1 : 25</text>
  <text x="700" y="286" text-anchor="middle" font-size="14" fill="#78716c">一級必要</text>

  <!-- 安養型 -->
  <rect x="40" y="304" width="720" height="48" rx="0" fill="#fff"/>
  <rect x="40" y="304" width="4" height="48" fill="#a8a29e"/>
  <text x="160" y="334" text-anchor="middle" font-size="15" fill="#57534e" font-weight="600">安養型</text>
  <text x="360" y="334" text-anchor="middle" font-size="18" fill="#57534e">1 : 15</text>
  <text x="540" y="334" text-anchor="middle" font-size="18" fill="#57534e">1 : 35</text>
  <text x="700" y="334" text-anchor="middle" font-size="14" fill="#78716c">一級必要</text>

  <!-- 護理人員補充說明 -->
  <rect x="40" y="368" width="720" height="80" rx="8" fill="#fff" stroke="#e5e3dc" stroke-width="1"/>
  <text x="400" y="392" text-anchor="middle" font-size="15" fill="#1e293b" font-weight="700">護理人員配置（A9 一級必要）</text>
  <text x="400" y="415" text-anchor="middle" font-size="14" fill="#57534e">失智型 1:20 ／ 長照型 1:15 ／ 養護型 1:20</text>
  <text x="400" y="437" text-anchor="middle" font-size="14" fill="#d97706">* 全日均應有護理人員上班，且完成執業登錄</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
