<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- N=4 列表圖：H=62, inner_gap=13, outer_gap=50 -->
  <!-- Header y=50, Row 1/2/3/4 y=160/235/310/385 -->

  <!-- Header（y=50, h=76） -->
  <rect x="0" y="50" width="800" height="76" fill="white"/>
  <rect x="0" y="50" width="6" height="76" fill="#dc2626"/>
  <text x="28" y="104" font-size="36" fill="#1e293b" font-weight="700">2.7.2實地查核常見失分場景</text>

  <!-- ===== Row 1（y=160）稽核率偏低 #dc2626 ===== -->
  <rect x="28" y="160" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="160" width="6" height="62" rx="2" fill="#dc2626"/>
  <circle cx="66" cy="191" r="16" fill="#dc2626"/>
  <text x="66" y="197" font-size="16" fill="#dc2626" text-anchor="middle" font-weight="900">失分1</text>
  <text x="100" y="184" font-size="20" fill="#1e293b" font-weight="700">稽核執行率長期偏低（未達目標且無改善計畫）</text>
  <text x="100" y="208" font-size="16" fill="#57534e">改善：立即設定目標值（如85%）+ 制定改善計畫 + 在品管委員會提出改善追蹤</text>
  <rect x="620" y="168" width="136" height="46" rx="8" fill="#dc2626" opacity="0.12"/>
  <text x="688" y="181" font-size="16" fill="#dc2626" text-anchor="middle">趨勢+計畫</text>
  <text x="688" y="201" font-size="16" fill="#dc2626" text-anchor="middle">比數字重要</text>

  <!-- ===== Row 2（y=235）五大時機不熟 #d97706 ===== -->
  <rect x="28" y="235" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="235" width="6" height="62" rx="2" fill="#d97706"/>
  <circle cx="66" cy="266" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="272" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">失分2</text>
  <text x="100" y="259" font-size="20" fill="#1e293b" font-weight="700">護理師當場答不出五大時機</text>
  <text x="100" y="283" font-size="16" fill="#57534e">改善：評鑑前1個月由感控護理師巡迴口頭測驗，不能只有上課記錄，要確認實際記憶</text>
  <rect x="620" y="243" width="136" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="256" font-size="16" fill="#d97706" text-anchor="middle">巡迴測驗</text>
  <text x="688" y="276" font-size="16" fill="#d97706" text-anchor="middle">確認記憶</text>

  <!-- ===== Row 3（y=310）PPE備品不足 #78716c ===== -->
  <rect x="28" y="310" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="310" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="66" cy="341" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="347" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">失分3</text>
  <text x="100" y="334" font-size="20" fill="#1e293b" font-weight="700">隔離病房外PPE備品不足或未放置</text>
  <text x="100" y="358" font-size="16" fill="#57534e">改善：評鑑前走查所有隔離病房，確認床旁/門外有手套、隔離衣、口罩備品並標示清楚</text>
  <rect x="620" y="318" width="136" height="46" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="331" font-size="16" fill="#78716c" text-anchor="middle">走查確認</text>
  <text x="688" y="351" font-size="16" fill="#78716c" text-anchor="middle">備品充足</text>

  <!-- ===== Row 4（y=385）現場觀察失誤 #57534e ===== -->
  <rect x="28" y="385" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="385" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="66" cy="416" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="422" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">失分4</text>
  <text x="100" y="409" font-size="20" fill="#1e293b" font-weight="700">評鑑委員在場時護理師未執行手部衛生</text>
  <text x="100" y="433" font-size="16" fill="#57534e">唯一有效準備：讓手部衛生成為日常習慣，而非評鑑前特別注意——評鑑委員通常不預告到訪</text>
  <rect x="620" y="393" width="136" height="46" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="406" font-size="16" fill="#57534e" text-anchor="middle">日常習慣</text>
  <text x="688" y="426" font-size="16" fill="#57534e" text-anchor="middle">才是根本</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
