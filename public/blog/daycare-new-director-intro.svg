  <text x="307" y="222" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">人事負責人</text>
  <text x="307" y="244" font-size="12" fill="#64748b" text-anchor="middle">人力盤點</text>
  <text x="307" y="264" font-size="12" fill="#64748b" text-anchor="middle">教育訓練</text>
  <text x="307" y="284" font-size="11" fill="#78716c" text-anchor="middle">第 28、29、30 條</text>

  <rect x="404" y="126" width="158" height="200" rx="12" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="404" y="126" width="158" height="5" rx="2.5" fill="#a8a29e"/>
  <circle cx="483" cy="176" r="26" fill="#a8a29e" opacity="0.12"/>
  <text x="483" y="184" font-size="26" text-anchor="middle" fill="#78716c">💰</text>
  <text x="483" y="222" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">財務監控者</text>
  <text x="483" y="244" font-size="12" fill="#64748b" text-anchor="middle">獨立帳戶</text>
  <text x="483" y="264" font-size="12" fill="#64748b" text-anchor="middle">收支帳冊</text>
  <text x="483" y="284" font-size="11" fill="#78716c" text-anchor="middle">第 34 條</text>

  <rect x="580" y="126" width="168" height="200" rx="12" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="580" y="126" width="168" height="5" rx="2.5" fill="#d97706" opacity="0.6"/>
  <circle cx="664" cy="176" r="26" fill="#d97706" opacity="0.10"/>
  <text x="664" y="184" font-size="26" text-anchor="middle" fill="#d97706">🎓</text>
  <text x="664" y="222" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">督導者</text>
  <text x="664" y="244" font-size="12" fill="#64748b" text-anchor="middle">個別督導</text>
  <text x="664" y="264" font-size="12" fill="#64748b" text-anchor="middle">品管指標</text>
  <text x="664" y="284" font-size="11" fill="#d97706" text-anchor="middle">第 9、22、31 條</text>

  <!-- Bottom tips -->
  <rect x="52" y="342" width="696" height="62" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="52" y="342" width="696" height="5" rx="2.5" fill="#d97706" opacity="0.4"/>
  <text x="76" y="368" font-size="13" font-weight="700" fill="#1e293b">本文解決的問題</text>
  <text x="76" y="390" font-size="12" fill="#78716c">對照 115 年度評鑑基準，拆解第一年最該建立的 10 件事，讓你有清楚的行動清單</text>

  <text x="760" y="421" font-size="16" fill="#c4bfb8" text-anchor="end" font-weight="400" font-family="'Noto Sans TC', sans-serif">報告汪 reportwang.com</text>
