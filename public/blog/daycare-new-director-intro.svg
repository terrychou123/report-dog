<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"
     font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">新手主任面臨的 4 大挑戰</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">理解困難所在，才能針對性地突破</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- 左上卡片（#d97706，x=40, y=104, w=346, h=168）-->
  <rect x="40" y="104" width="346" height="168" rx="12" fill="white"/>
  <rect x="40" y="104" width="346" height="44" rx="12" fill="#d97706"/>
  <rect x="40" y="128" width="346" height="20" fill="#d97706"/>
  <circle cx="68" cy="126" r="9" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
  <circle cx="68" cy="126" r="3" fill="white"/>
  <text x="213" y="143" text-anchor="middle" font-size="15" fill="white" font-weight="700">角色定位混亂</text>
  <text x="60" y="172" font-size="14" fill="#57534e">• 同時兼任督導、行政、照護角色</text>
  <text x="60" y="192" font-size="14" fill="#57534e">• 不知哪些事要親自決定</text>
  <text x="60" y="212" font-size="14" fill="#57534e">• 從照服員晉升時轉換困難</text>
  <text x="60" y="232" font-size="14" fill="#57534e">• 與同事角色關係難以重新定位</text>
  <rect x="56" y="246" width="70" height="20" rx="10" fill="#fef3c7"/>
  <text x="91" y="260" text-anchor="middle" font-size="14" fill="#d97706" font-weight="600">角色挑戰</text>

  <!-- 右上卡片（#78716c，x=414, y=104, w=346, h=168）-->
  <rect x="414" y="104" width="346" height="168" rx="12" fill="white"/>
  <rect x="414" y="104" width="346" height="44" rx="12" fill="#78716c"/>
  <rect x="414" y="128" width="346" height="20" fill="#78716c"/>
  <rect x="438" y="117" width="18" height="18" rx="3" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
  <line x1="441" y1="126" x2="453" y2="126" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
  <text x="587" y="143" text-anchor="middle" font-size="15" fill="white" font-weight="700">文件行政壓力</text>
  <text x="434" y="172" font-size="14" fill="#57534e">• 個案文件量龐大難以掌握</text>
  <text x="434" y="192" font-size="14" fill="#57534e">• 不知哪些是評鑑必查文件</text>
  <text x="434" y="212" font-size="14" fill="#57534e">• 各種記錄表單不熟悉格式</text>
  <text x="434" y="232" font-size="14" fill="#57534e">• 文件填寫錯誤難以補救</text>
  <rect x="430" y="246" width="70" height="20" rx="10" fill="#f5f5f4"/>
  <text x="465" y="260" text-anchor="middle" font-size="14" fill="#78716c" font-weight="600">文件挑戰</text>

  <!-- 左下卡片（#57534e，x=40, y=288, w=346, h=162）-->
  <rect x="40" y="288" width="346" height="162" rx="12" fill="white"/>
  <rect x="40" y="288" width="346" height="44" rx="12" fill="#57534e"/>
  <rect x="40" y="312" width="346" height="20" fill="#57534e"/>
  <line x1="60" y1="309" x2="68" y2="317" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-linecap="round"/>
  <line x1="68" y1="317" x2="84" y2="301" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-linecap="round"/>
  <text x="213" y="327" text-anchor="middle" font-size="15" fill="white" font-weight="700">人力管理困難</text>
  <text x="60" y="356" font-size="14" fill="#57534e">• 招募合格照服員不容易</text>
  <text x="60" y="376" font-size="14" fill="#57534e">• 排班與請假管理複雜</text>
  <text x="60" y="396" font-size="14" fill="#57534e">• 訓練時數管控易被忽略</text>
  <text x="60" y="416" font-size="14" fill="#57534e">• 評鑑前才發現人員不足</text>
  <rect x="56" y="430" width="70" height="20" rx="10" fill="#f5f0eb"/>
  <text x="91" y="444" text-anchor="middle" font-size="14" fill="#57534e" font-weight="600">人力挑戰</text>

  <!-- 右下卡片（#a8a29e，x=414, y=288, w=346, h=162）-->
  <rect x="414" y="288" width="346" height="162" rx="12" fill="white"/>
  <rect x="414" y="288" width="346" height="44" rx="12" fill="#a8a29e"/>
  <rect x="414" y="312" width="346" height="20" fill="#a8a29e"/>
  <circle cx="440" cy="310" r="8" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
  <line x1="440" y1="302" x2="440" y2="307" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
  <circle cx="440" cy="314" r="2" fill="rgba(255,255,255,0.7)"/>
  <text x="587" y="327" text-anchor="middle" font-size="15" fill="white" font-weight="700">法規落差感</text>
  <text x="434" y="356" font-size="14" fill="#57534e">• 評鑑條文多且難以全數掌握</text>
  <text x="434" y="376" font-size="14" fill="#57534e">• 不知道委員最在意哪幾條</text>
  <text x="434" y="396" font-size="14" fill="#57534e">• 制度規範未及時更新</text>
  <text x="434" y="416" font-size="14" fill="#57534e">• 自評與委員標準有落差</text>
  <rect x="430" y="430" width="70" height="20" rx="10" fill="#f5f5f4"/>
  <text x="465" y="444" text-anchor="middle" font-size="14" fill="#a8a29e" font-weight="600">法規挑戰</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
