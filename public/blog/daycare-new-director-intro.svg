  <text x="131" y="244" font-size="12" fill="#64748b" text-anchor="middle">工作手冊</text>
  <text x="131" y="264" font-size="12" fill="#64748b" text-anchor="middle">業務計畫</text>
  <text x="131" y="284" font-size="11" fill="#d97706" text-anchor="middle">第 23、24 條</text>

  <rect x="228" y="126" width="158" height="200" rx="12" fill="white" stroke="#e8e5de" stroke-width="1"/>
