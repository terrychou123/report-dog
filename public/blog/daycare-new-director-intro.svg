<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="450" fill="#f0efe8"/>
  <text x="400" y="46" font-size="21" font-weight="700" fill="#1e293b" text-anchor="middle">新手主任面臨的挑戰：4 大角色同時壓上</text>
  <rect x="60" y="58" width="48" height="3" rx="1.5" fill="#d97706"/>
  <line x1="116" y1="59.5" x2="740" y2="59.5" stroke="#dedad3" stroke-width="1"/>

  <!-- Top banner -->
  <rect x="52" y="78" width="696" height="34" rx="8" fill="#d97706" opacity="0.08"/>
  <text x="400" y="99" font-size="13" fill="#92400e" text-anchor="middle" font-weight="600">「從哪裡開始？」是每一位新任主任上任第一天都有的感受</text>

  <!-- 4 role cards -->
  <rect x="52" y="126" width="158" height="200" rx="12" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="52" y="126" width="158" height="5" rx="2.5" fill="#d97706"/>
  <circle cx="131" cy="176" r="26" fill="#d97706" opacity="0.10"/>
