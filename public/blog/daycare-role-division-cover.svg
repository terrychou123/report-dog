<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 右側裝飾區塊 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>

  <!-- 右側裝飾大數字（4 大職類，頂部≈y=104） -->
  <text x="1010" y="232" font-size="180" font-weight="900" fill="#d97706" text-anchor="middle" opacity="0.85">4</text>
  <text x="1010" y="274" font-size="28" fill="#78716c" text-anchor="middle" font-weight="600">大職類備審分工</text>

  <!-- 右側 2×2 資訊卡片（row1 y=299, row2 y=395, h=86） -->
  <rect x="840" y="299" width="155" height="86" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="918" y="336" font-size="28" fill="#d97706" text-anchor="middle" font-weight="700">社工師</text>
  <text x="918" y="367" font-size="22" fill="#a8a29e" text-anchor="middle">個案管理文件</text>

  <rect x="1005" y="299" width="155" height="86" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="1083" y="336" font-size="28" fill="#78716c" text-anchor="middle" font-weight="700">護理師</text>
  <text x="1083" y="367" font-size="22" fill="#a8a29e" text-anchor="middle">照護紀錄文件</text>

  <rect x="840" y="395" width="155" height="86" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="918" y="432" font-size="28" fill="#78716c" text-anchor="middle" font-weight="700">照服員</text>
  <text x="918" y="463" font-size="22" fill="#a8a29e" text-anchor="middle">服務執行紀錄</text>

  <rect x="1005" y="395" width="155" height="86" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="1083" y="432" font-size="28" fill="#d97706" text-anchor="middle" font-weight="700">行政主任</text>
  <text x="1083" y="463" font-size="22" fill="#a8a29e" text-anchor="middle">制度與督導</text>

  <!-- 右側底部標籤（y=491, h=52） -->
  <rect x="840" y="491" width="320" height="52" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="1000" y="527" font-size="28" fill="#d97706" text-anchor="middle" font-weight="700">115 年度臺北市版</text>

  <!-- 左側主內容區 -->
  <text x="60" y="200" font-size="120" font-weight="900" fill="#1e293b">評鑑分工</text>
  <text x="60" y="338" font-size="120" font-weight="900" fill="#d97706">誰備什麼</text>

  <line x1="60" y1="365" x2="780" y2="365" stroke="#dedad3" stroke-width="2"/>

  <text x="60" y="416" font-size="38" fill="#57534e" font-weight="400">社工 · 護理師 · 照服員 · 行政主任 備審清單</text>

  <!-- 特色標籤列（pill 高 54px） -->
  <rect x="60" y="450" width="148" height="54" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="134" y="487" font-size="28" fill="#d97706" text-anchor="middle" font-weight="600">四職類分工</text>

  <rect x="220" y="450" width="148" height="54" rx="10" fill="#78716c" opacity="0.12"/>
  <text x="294" y="487" font-size="28" fill="#78716c" text-anchor="middle" font-weight="600">文件清單</text>

  <rect x="380" y="450" width="148" height="54" rx="10" fill="#57534e" opacity="0.12"/>
  <text x="454" y="487" font-size="28" fill="#57534e" text-anchor="middle" font-weight="600">完整備審</text>

  <!-- 適用對象說明 -->
  <text x="60" y="558" font-size="28" fill="#94a3b8">適用對象：日照主任 · 社工 · 護理師 · 評鑑準備團隊</text>

  <!-- 浮水印 -->
  <text x="1140" y="590" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
