<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!--
    【5 條】N=5, H=67, gap=14（色塊 80% / 間距 20%）
    H = round(500×0.8 / (N+1)) = round(400/6) = 67
    gap = floor((500 - 6×67) / 7) = floor(98/7) = 14
    驗算：6×67 + 7×14 = 402+98 = 500 ✓

    Header y=14, bottom=81
    Row[0] y = 14+67+14 = 95,  bottom=162
    Row[1] y = 95+67+14 = 176, bottom=243
    Row[2] y = 176+67+14 = 257, bottom=324
    Row[3] y = 257+67+14 = 338, bottom=405
    Row[4] y = 338+67+14 = 419, bottom=486, 底部留白=14 ✓

    M2 "5 大督導留才盲點 × 對應評鑑條文" ≈ 15字 → 15-20 → H 60-74 → font=32
    Header text_y = 14 + round(33.5 + 32×0.35) = 14 + round(44.7) = 59

    Row Q/R 垂直置中（等視覺留白，cap_ratio=0.82）：
      pad = (H - Q_font×0.82 - baseline_gap - R_font×0.24) / 2
      Q_y = row_y + round(pad + Q_font×0.82)
      R_y = Q_y + baseline_gap

      Q=22: pad=(67-18.04-20-3.84)/2=12.56 → offset=round(12.56+18.04)=31
      Q=20: pad=(67-16.40-20-3.84)/2=13.38 → offset=round(13.38+16.40)=30
      Q=18: pad=(67-14.76-20-3.84)/2=14.20 → offset=round(14.20+14.76)=29

    圓圈直徑 = 文字區塊總高：
      text_block_h = Q_font×0.82 + baseline_gap + R_font×0.24
      Row1 (Q=22): h=41.88 → r=21, NUM font=18, NUM_y=cy+6
      Row2-3 (Q=18): h=38.60 → r=19, NUM font=16, NUM_y=cy+6
      Row4-5 (Q=20): h=40.24 → r=20, NUM font=18, NUM_y=cy+6
    S rect h=47, y=row_y+10, S1=row_y+28, S2=row_y+48 (font=16)

    Q Row1 "督導機制形同虛設" = 8字 → ≤8 → font=22
    Q Row2 "教育訓練時數不足或內容無感" = 13字 → 13+ → font=18
    Q Row3 "不追蹤留任率數字，只靠感覺" = 13字 → 13+ → font=18
    Q Row4 "主任自己缺乏持續學習" = 10字 → 9-12 → font=20
    Q Row5 "健康管理制度不完善" = 9字 → 9-12 → font=20
    R 全部 font=16, baseline_gap=20
  -->

  <!-- Header（y=14, h=67） -->
  <rect x="0" y="14" width="800" height="67" fill="#e8e6de"/>
  <rect x="0" y="14" width="6" height="67" fill="#d97706"/>
  <text x="28" y="59" font-size="32" fill="#1e293b" font-weight="700">5 大督導留才盲點 × 對應評鑑條文</text>

  <!-- Row 1（y=95, H=67, center=129） -->
  <rect x="28" y="95" width="744" height="67" rx="10" fill="#e8e6de"/>
  <rect x="28" y="95" width="6" height="67" rx="2" fill="#d97706"/>
  <circle cx="66" cy="129" r="21" fill="#d97706" opacity="0.15"/>
  <text x="66" y="135" font-size="18" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <!-- Q 22px → row_y+31=126；R 16px → row_y+51=146 -->
  <text x="100" y="126" font-size="22" fill="#1e293b" font-weight="700">督導機制形同虛設</text>
  <text x="100" y="146" font-size="16" fill="#57534e">個督頻率不足、督導內容流於形式，員工問題無法被發現與支持</text>
  <!-- S rect y=105, h=47 -->
  <rect x="620" y="105" width="136" height="47" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="123" font-size="16" fill="#d97706" text-anchor="middle">第 9 條</text>
  <text x="688" y="143" font-size="16" fill="#d97706" text-anchor="middle">個督每半年一次</text>

  <!-- Row 2（y=176, H=67, center=210） -->
  <rect x="28" y="176" width="744" height="67" rx="10" fill="#e8e6de"/>
  <rect x="28" y="176" width="6" height="67" rx="2" fill="#78716c"/>
  <circle cx="66" cy="210" r="19" fill="#78716c" opacity="0.15"/>
  <text x="66" y="216" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <!-- Q 18px → row_y+29=205；R 16px → row_y+49=225 -->
  <text x="100" y="205" font-size="18" fill="#1e293b" font-weight="700">教育訓練時數不足或內容無感</text>
  <text x="100" y="225" font-size="16" fill="#57534e">訓練只是簽到、網路課程超過上限，員工缺乏實質學習與成長</text>
  <!-- S rect y=186, h=47 -->
  <rect x="620" y="186" width="136" height="47" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="204" font-size="16" fill="#78716c" text-anchor="middle">第 29 條</text>
  <text x="688" y="224" font-size="16" fill="#78716c" text-anchor="middle">在職 20 小時</text>

  <!-- Row 3（y=257, H=67, center=291） -->
  <rect x="28" y="257" width="744" height="67" rx="10" fill="#e8e6de"/>
  <rect x="28" y="257" width="6" height="67" rx="2" fill="#57534e"/>
  <circle cx="66" cy="291" r="19" fill="#57534e" opacity="0.15"/>
  <text x="66" y="297" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <!-- Q 18px → row_y+29=286；R 16px → row_y+49=306 -->
  <text x="100" y="286" font-size="18" fill="#1e293b" font-weight="700">不追蹤留任率數字，只靠感覺</text>
  <text x="100" y="306" font-size="16" fill="#57534e">不知道如何計算留任率、離職原因未系統性收集與分析</text>
  <!-- S rect y=267, h=47 -->
  <rect x="620" y="267" width="136" height="47" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="285" font-size="16" fill="#57534e" text-anchor="middle">第 30 條</text>
  <text x="688" y="305" font-size="16" fill="#57534e" text-anchor="middle">前四年度留任率</text>

  <!-- Row 4（y=338, H=67, center=372） -->
  <rect x="28" y="338" width="744" height="67" rx="10" fill="#e8e6de"/>
  <rect x="28" y="338" width="6" height="67" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="372" r="20" fill="#a8a29e" opacity="0.2"/>
  <text x="66" y="378" font-size="18" fill="#a8a29e" text-anchor="middle" font-weight="900">4</text>
  <!-- Q 20px → row_y+30=368；R 16px → row_y+50=388 -->
  <text x="100" y="368" font-size="20" fill="#1e293b" font-weight="700">主任自己缺乏持續學習</text>
  <text x="100" y="388" font-size="16" fill="#57534e">主任忙於日常事務，未安排管理進修，缺乏新管理知能輸入</text>
  <!-- S rect y=348, h=47 -->
  <rect x="620" y="348" width="136" height="47" rx="8" fill="#a8a29e" opacity="0.15"/>
  <text x="688" y="366" font-size="16" fill="#78716c" text-anchor="middle">第 31 條</text>
  <text x="688" y="386" font-size="16" fill="#78716c" text-anchor="middle">負責人每年 4 小時</text>

  <!-- Row 5（y=419, H=67, center=453） -->
  <rect x="28" y="419" width="744" height="67" rx="10" fill="#e8e6de"/>
  <rect x="28" y="419" width="6" height="67" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="453" r="20" fill="#94a3b8" opacity="0.2"/>
  <text x="66" y="459" font-size="18" fill="#94a3b8" text-anchor="middle" font-weight="900">5</text>
  <!-- Q 20px → row_y+30=449；R 16px → row_y+50=469 -->
  <text x="100" y="449" font-size="20" fill="#1e293b" font-weight="700">健康管理制度不完善</text>
  <text x="100" y="469" font-size="16" fill="#57534e">健檢報告未追蹤異常值，員工以為健康就不需要每年受檢</text>
  <!-- S rect y=429, h=47 -->
  <rect x="620" y="429" width="136" height="47" rx="8" fill="#94a3b8" opacity="0.15"/>
  <text x="688" y="447" font-size="16" fill="#64748b" text-anchor="middle">第 32 條</text>
  <text x="688" y="467" font-size="16" fill="#64748b" text-anchor="middle">每年健檢</text>

  <!-- 浮水印 -->
  <text x="760" y="492" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
