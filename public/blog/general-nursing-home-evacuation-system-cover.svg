<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 左側色塊 -->
  <rect x="0" y="0" width="500" height="630" fill="#1e40af" opacity="0.06"/>
  <rect x="60" y="60" width="6" height="510" fill="#1e40af" opacity="0.4"/>
  <!-- 大字裝飾 -->
  <text x="100" y="330" font-size="200" font-weight="900" fill="#1e40af" opacity="0.1" letter-spacing="-5">C2C3</text>
  <!-- 主標題 -->
  <text x="90" y="155" font-size="50" font-weight="900" fill="#1c1917">護理之家</text>
  <text x="90" y="218" font-size="50" font-weight="900" fill="#1e40af">疏散避難系統</text>
  <text x="90" y="280" font-size="32" font-weight="700" fill="#44403c">實務完整指南</text>
  <!-- 副標題 -->
  <text x="90" y="336" font-size="22" fill="#78716c">等待救援空間設置 × 個別化疏散策略</text>
  <rect x="90" y="356" width="120" height="4" fill="#1e40af" rx="2"/>
  <!-- C2 卡片 -->
  <rect x="540" y="70" width="280" height="220" rx="14" fill="#1e40af" opacity="0.85"/>
  <text x="680" y="115" font-size="52" font-weight="900" text-anchor="middle" fill="#ffffff">C2</text>
  <text x="680" y="148" font-size="24" text-anchor="middle" fill="#bfdbfe" font-weight="700">疏散避難系統</text>
  <text x="680" y="175" font-size="20" text-anchor="middle" fill="#e0f2fe">實地查核</text>
  <rect x="564" y="190" width="232" height="1" fill="#ffffff" opacity="0.3"/>
  <text x="680" y="214" font-size="20" text-anchor="middle" fill="#bfdbfe">[v] 通道暢通無障礙物</text>
  <text x="680" y="234" font-size="20" text-anchor="middle" fill="#bfdbfe">[v] 等待救援空間設置</text>
  <text x="680" y="254" font-size="20" text-anchor="middle" fill="#bfdbfe">[v] 緊急照明設備正常</text>
  <!-- C3 卡片 -->
  <rect x="840" y="70" width="280" height="220" rx="14" fill="#d97706" opacity="0.85"/>
  <text x="980" y="115" font-size="52" font-weight="900" text-anchor="middle" fill="#ffffff">C3</text>
  <text x="980" y="148" font-size="24" text-anchor="middle" fill="#fef3c7" font-weight="700">個別化疏散策略</text>
  <text x="980" y="175" font-size="20" text-anchor="middle" fill="#fde68a">資料查核＋實地抽測</text>
  <rect x="864" y="190" width="232" height="1" fill="#ffffff" opacity="0.3"/>
  <text x="980" y="214" font-size="20" text-anchor="middle" fill="#fef3c7">[v] 步行 / 輪椅 / 擔架分級</text>
  <text x="980" y="234" font-size="20" text-anchor="middle" fill="#fef3c7">[v] 疏散後持續照顧 SOP</text>
  <text x="980" y="254" font-size="20" text-anchor="middle" fill="#fef3c7">[v] 工作人員抽測能力</text>
  <!-- 底部資訊區 -->
  <rect x="540" y="320" width="580" height="120" rx="12" fill="#ffffff" opacity="0.75"/>
  <text x="570" y="355" font-size="24" font-weight="700" fill="#1e40af">評鑑查核方式對比</text>
  <text x="570" y="380" font-size="20" fill="#44403c">C2 實地查核：委員當場走訪通道與設備</text>
  <text x="570" y="400" font-size="20" fill="#44403c">C3 資料查核：審閱個別化疏散名冊文件</text>
  <text x="570" y="420" font-size="20" fill="#44403c">C3 實地抽測：現場抽問工作人員個別住民疏散方式</text>
  <!-- 底部裝飾 -->
  <circle cx="1130" cy="570" r="150" fill="#1e40af" opacity="0.05"/>
  <!-- 標籤 -->
  <rect x="90" y="390" width="140" height="36" rx="18" fill="#1e40af"/>
  <text x="160" y="413" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700">115年度評鑑基準</text>
  <rect x="250" y="390" width="140" height="36" rx="18" fill="#d97706"/>
  <text x="320" y="413" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700">安全管理 C 區</text>
  <!-- 浮水印 -->
  <text x="1140" y="590" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
