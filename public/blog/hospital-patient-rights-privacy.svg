<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#fafaf9"/>

  <!-- 標題區 -->
  <rect x="0" y="0" width="800" height="108" fill="#1c1917"/>
  <text x="400" y="52" font-family="'Noto Sans TC', sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">病人隱私保護三大面向（2.1.3）</text>
  <text x="400" y="82" font-family="'Noto Sans TC', sans-serif" font-size="14" fill="#a8a29e" text-anchor="middle">必要條文 — 資料查核＋實地查核，評鑑委員親自到病房觀察</text>

  <!-- 列1（y=130，h=90）-->
  <rect x="28" y="130" width="744" height="90" rx="8" fill="#ffffff" stroke="#e7e5e4" stroke-width="1"/>
  <rect x="28" y="130" width="6" height="90" rx="3" fill="#d97706"/>
  <text x="52" y="157" font-family="'Noto Sans TC', sans-serif" font-size="14" font-weight="700" fill="#d97706">個人資料保護</text>
  <text x="52" y="178" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#57534e">病人個資依個資法保護，未授權不得外洩；病歷、健保卡號、診斷等資料有存取管控記錄</text>
  <text x="52" y="200" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#a8a29e">評鑑委員查核：資訊系統授權機制、個資保護政策文件</text>
  <rect x="660" y="150" width="88" height="30" rx="15" fill="#fef3c7"/>
  <text x="704" y="170" font-family="'Noto Sans TC', sans-serif" font-size="12" font-weight="700" fill="#d97706" text-anchor="middle">個資合規</text>

  <!-- 列2（y=233，h=90）-->
  <rect x="28" y="233" width="744" height="90" rx="8" fill="#ffffff" stroke="#e7e5e4" stroke-width="1"/>
  <rect x="28" y="233" width="6" height="90" rx="3" fill="#78716c"/>
  <text x="52" y="260" font-family="'Noto Sans TC', sans-serif" font-size="14" font-weight="700" fill="#78716c">身體隱私保護</text>
  <text x="52" y="281" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#57534e">診察、護理操作、換藥時拉簾或關門；多人病室有隔簾；不在公共場所討論病情</text>
  <text x="52" y="303" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#a8a29e">評鑑委員實地查核：直接觀察病房操作，是現場最常見的失分點</text>
  <rect x="660" y="253" width="88" height="30" rx="15" fill="#f5f5f4"/>
  <text x="704" y="273" font-family="'Noto Sans TC', sans-serif" font-size="12" font-weight="700" fill="#78716c" text-anchor="middle">實地查核</text>

  <!-- 列3（y=336，h=90）-->
  <rect x="28" y="336" width="744" height="90" rx="8" fill="#ffffff" stroke="#e7e5e4" stroke-width="1"/>
  <rect x="28" y="336" width="6" height="90" rx="3" fill="#57534e"/>
  <text x="52" y="363" font-family="'Noto Sans TC', sans-serif" font-size="14" font-weight="700" fill="#57534e">病歷資訊查閱管控</text>
  <text x="52" y="384" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#57534e">病歷查閱有授權機制，僅照護相關醫療人員可查閱；護理站電腦螢幕不朝向走廊</text>
  <text x="52" y="406" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#a8a29e">評鑑委員查核：確認系統存取記錄、觀察護理站電腦擺放方向</text>
  <rect x="660" y="356" width="88" height="30" rx="15" fill="#e8e6de"/>
  <text x="704" y="376" font-family="'Noto Sans TC', sans-serif" font-size="12" font-weight="700" fill="#57534e" text-anchor="middle">查閱管控</text>

  <!-- 浮水印 -->
  <text x="400" y="480" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#a8a29e" text-anchor="middle" opacity="0.6">報告汪 reportwang.com</text>
</svg>
