<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <text x="400" y="48"  font-size="32" font-weight="700" fill="#1e293b" text-anchor="middle">數位化導入準備清單</text>
  <text x="400" y="78"  font-size="22" fill="#78716c" text-anchor="middle">開始導入前確認這 6 件事</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#a8a29e" stroke-width="1.5"/>
  <rect x="40" y="114" width="720" height="44" rx="6" fill="#ffffff"/>
  <rect x="40" y="114" width="4" height="44" rx="2" fill="#d97706"/>
  <rect x="54" y="124" width="24" height="24" rx="4" fill="#d97706" opacity="0.15"/>
  <text x="56" y="141"  font-size="18" fill="#d97706">&#10003;</text>
  <text x="92" y="133"  font-size="15" font-weight="700" fill="#1e293b">確認現有文件清單（75 條各對應哪些文件）</text>
  <text x="92" y="151"  font-size="14" fill="#78716c">盤點文件數量、負責人、存放位置</text>
  <rect x="40" y="166" width="720" height="44" rx="6" fill="#f8f7f5"/>
  <rect x="40" y="166" width="4" height="44" rx="2" fill="#d97706"/>
  <rect x="54" y="176" width="24" height="24" rx="4" fill="#d97706" opacity="0.15"/>
  <text x="56" y="193"  font-size="18" fill="#d97706">&#10003;</text>
  <text x="92" y="185"  font-size="15" font-weight="700" fill="#1e293b">選擇符合機構規模與預算的數位平台</text>
  <text x="92" y="203"  font-size="14" fill="#78716c">考量是否需要 AI 輔助、多人協作、定期追蹤等功能</text>
  <rect x="40" y="218" width="720" height="44" rx="6" fill="#ffffff"/>
  <rect x="40" y="218" width="4" height="44" rx="2" fill="#78716c"/>
  <rect x="54" y="228" width="24" height="24" rx="4" fill="#78716c" opacity="0.15"/>
  <text x="56" y="245"  font-size="18" fill="#78716c">&#10003;</text>
  <text x="92" y="237"  font-size="15" font-weight="700" fill="#1e293b">訂定資訊管理規範（B3 條要求）</text>
  <text x="92" y="255"  font-size="14" fill="#78716c">使用者權限、密碼管理、資料備份機制</text>
  <rect x="40" y="270" width="720" height="44" rx="6" fill="#f8f7f5"/>
  <rect x="40" y="270" width="4" height="44" rx="2" fill="#78716c"/>
  <rect x="54" y="280" width="24" height="24" rx="4" fill="#78716c" opacity="0.15"/>
  <text x="56" y="297"  font-size="18" fill="#78716c">&#10003;</text>
  <text x="92" y="289"  font-size="15" font-weight="700" fill="#1e293b">確認系統符合衛福部 LTMS 整合需求</text>
  <text x="92" y="307"  font-size="14" fill="#78716c">B3 查核以衛福部系統為主，輔助系統需能配合</text>
  <rect x="40" y="322" width="720" height="44" rx="6" fill="#ffffff"/>
  <rect x="40" y="322" width="4" height="44" rx="2" fill="#57534e"/>
  <rect x="54" y="332" width="24" height="24" rx="4" fill="#57534e" opacity="0.15"/>
  <text x="56" y="349"  font-size="18" fill="#57534e">&#10003;</text>
  <text x="92" y="341"  font-size="15" font-weight="700" fill="#1e293b">安排工作人員操作訓練</text>
  <text x="92" y="359"  font-size="14" fill="#78716c">確保所有需要使用系統的工作人員都熟悉基本操作</text>
  <rect x="40" y="374" width="720" height="44" rx="6" fill="#f8f7f5"/>
  <rect x="40" y="374" width="4" height="44" rx="2" fill="#57534e"/>
  <rect x="54" y="384" width="24" height="24" rx="4" fill="#57534e" opacity="0.15"/>
  <text x="56" y="401"  font-size="18" fill="#57534e">&#10003;</text>
  <text x="92" y="393"  font-size="15" font-weight="700" fill="#1e293b">設定雙軌並行的過渡期（紙本 + 數位）</text>
  <text x="92" y="411"  font-size="14" fill="#78716c">確認系統穩定後再完全轉換，降低風險</text>
  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" >報告汪 reportwang.com</text>
</svg>
