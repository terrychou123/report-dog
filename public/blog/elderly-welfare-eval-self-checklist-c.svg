<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- Header y=29, h=60（警示紅色） -->
  <rect x="40" y="29" width="720" height="60" rx="10" fill="#dc2626"/>
  <text x="400" y="55" font-size="22" font-weight="700" fill="#ffffff" font-family="sans-serif" text-anchor="middle">C 區：安全環境設備 — 5 大必要指標自評（C1–C16）</text>
  <text x="400" y="78" font-size="15" fill="#fecaca" font-family="sans-serif" text-anchor="middle">本區含多個一級必要指標，不符合對評鑑結果影響重大</text>

  <!-- N=5 版型：H=60, inner_gap=13, outer_gap=29 -->
  <!-- Row1 y=118 -->
  <rect x="40" y="118" width="720" height="60" rx="8" fill="#fff1f2"/>
  <rect x="40" y="118" width="6" height="60" rx="3" fill="#dc2626"/>
  <circle cx="66" cy="148" r="16" fill="#dc2626"/>
  <text x="66" y="154" font-size="14" font-weight="700" fill="#ffffff" font-family="sans-serif" text-anchor="middle">C4</text>
  <text x="100" y="140" font-size="18" font-weight="700" fill="#dc2626" font-family="sans-serif">【一級必要】緊急呼叫系統實地測試</text>
  <text x="100" y="161" font-size="14" fill="#57534e" font-family="sans-serif">浴室、廁所、寢室均安裝；按鈴後服務員須立即反應</text>
  <rect x="620" y="129" width="128" height="38" rx="6" fill="#dc2626"/>
  <text x="684" y="153" font-size="14" font-weight="700" fill="#ffffff" font-family="sans-serif" text-anchor="middle">現場測試</text>

  <!-- Row2 y=191 -->
  <rect x="40" y="191" width="720" height="60" rx="8" fill="#fff1f2"/>
  <rect x="40" y="191" width="6" height="60" rx="3" fill="#dc2626"/>
  <circle cx="66" cy="221" r="16" fill="#dc2626"/>
  <text x="66" y="227" font-size="14" font-weight="700" fill="#ffffff" font-family="sans-serif" text-anchor="middle">C9</text>
  <text x="100" y="213" font-size="18" font-weight="700" fill="#dc2626" font-family="sans-serif">【一級必要】防火避難申報＋消防檢修</text>
  <text x="100" y="234" font-size="14" fill="#57534e" font-family="sans-serif">建物公安申報合格；消防設備每半年檢修；備近5年紀錄</text>
  <rect x="620" y="202" width="128" height="38" rx="6" fill="#dc2626"/>
  <text x="684" y="226" font-size="14" font-weight="700" fill="#ffffff" font-family="sans-serif" text-anchor="middle">每半年</text>

  <!-- Row3 y=264 -->
  <rect x="40" y="264" width="720" height="60" rx="8" fill="#fff1f2"/>
  <rect x="40" y="264" width="6" height="60" rx="3" fill="#dc2626"/>
  <circle cx="66" cy="294" r="16" fill="#dc2626"/>
  <text x="66" y="300" font-size="14" font-weight="700" fill="#ffffff" font-family="sans-serif" text-anchor="middle">C12</text>
  <text x="100" y="286" font-size="18" font-weight="700" fill="#dc2626" font-family="sans-serif">【一級必要】各樓層A3以上逃生圖</text>
  <text x="100" y="307" font-size="14" fill="#57534e" font-family="sans-serif">需標示所在位置、防火區劃、等待救接空間；方向必須正確</text>
  <rect x="620" y="275" width="128" height="38" rx="6" fill="#dc2626"/>
  <text x="684" y="299" font-size="14" font-weight="700" fill="#ffffff" font-family="sans-serif" text-anchor="middle">實地核查</text>

  <!-- Row4 y=337 -->
  <rect x="40" y="337" width="720" height="60" rx="8" fill="#fff1f2"/>
  <rect x="40" y="337" width="6" height="60" rx="3" fill="#dc2626"/>
  <circle cx="66" cy="367" r="16" fill="#dc2626"/>
  <text x="66" y="373" font-size="14" font-weight="700" fill="#ffffff" font-family="sans-serif" text-anchor="middle">C15</text>
  <text x="100" y="359" font-size="18" font-weight="700" fill="#dc2626" font-family="sans-serif">【一級必要】每層護理站＋急救設備效期</text>
  <text x="100" y="380" font-size="14" fill="#57534e" font-family="sans-serif">每層樓設護理站；氧氣瓶在效期內；護理人員熟悉使用</text>
  <rect x="620" y="348" width="128" height="38" rx="6" fill="#dc2626"/>
  <text x="684" y="372" font-size="14" font-weight="700" fill="#ffffff" font-family="sans-serif" text-anchor="middle">抽測人員</text>

  <!-- Row5 y=410 -->
  <rect x="40" y="410" width="720" height="60" rx="8" fill="#fff1f2"/>
  <rect x="40" y="410" width="6" height="60" rx="3" fill="#dc2626"/>
  <circle cx="66" cy="440" r="16" fill="#dc2626"/>
  <text x="66" y="446" font-size="14" font-weight="700" fill="#ffffff" font-family="sans-serif" text-anchor="middle">C11</text>
  <text x="100" y="432" font-size="18" font-weight="700" fill="#dc2626" font-family="sans-serif">【一級必要】夜間演練＋複合型演練各1次</text>
  <text x="100" y="453" font-size="14" fill="#57534e" font-family="sans-serif">每年各執行1次；需有演練腳本、照片、檢討會議紀錄</text>
  <rect x="620" y="421" width="128" height="38" rx="6" fill="#dc2626"/>
  <text x="684" y="445" font-size="14" font-weight="700" fill="#ffffff" font-family="sans-serif" text-anchor="middle">每年必辦</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" font-family="sans-serif">報告汪 reportwang.com</text>
</svg>
