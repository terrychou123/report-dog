<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- Header y=29, h=60（警示紅色） -->
  <rect x="40" y="29" width="720" height="60" rx="10" fill="#dc2626"/>
  <text x="400" y="55" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">C 區：安全環境設備 — 5 大必要指標自評（C1–C16）</text>
  <text x="400" y="78" font-size="15" fill="#fecaca" text-anchor="middle">本區含多個一級必要指標，不符合對評鑑結果影響重大</text>

  <!-- N=5 版型：H=60, inner_gap=13, outer_gap=29 -->
  <!-- Row1 y=118 -->
  <rect x="28" y="118" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="118" width="6" height="60" rx="2" fill="#d97706"/>
  <circle cx="66" cy="148" r="16" fill="#dc2626"/>
  <text x="66" y="154" font-size="16" font-weight="900" fill="#dc2626" text-anchor="middle">C4</text>
  <text x="100" y="145" font-size="20" font-weight="700" fill="#dc2626">【一級必要】緊急呼叫系統實地測試</text>
  <text x="100" y="166" font-size="16" fill="#57534e">浴室、廁所、寢室均安裝；按鈴後服務員須立即反應</text>
  <rect x="620" y="126" width="136" height="44" rx="8" fill="#dc2626" opacity="0.12"/>
  <text x="688" y="154" font-size="16" fill="#dc2626" text-anchor="middle">現場測試</text>

  <!-- Row2 y=191 -->
  <rect x="28" y="191" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="191" width="6" height="60" rx="2" fill="#78716c"/>
  <circle cx="66" cy="221" r="16" fill="#dc2626"/>
  <text x="66" y="227" font-size="16" font-weight="900" fill="#dc2626" text-anchor="middle">C9</text>
  <text x="100" y="218" font-size="20" font-weight="700" fill="#dc2626">【一級必要】防火避難申報＋消防檢修</text>
  <text x="100" y="239" font-size="16" fill="#57534e">建物公安申報合格；消防設備每半年檢修；備近5年紀錄</text>
  <rect x="620" y="199" width="136" height="44" rx="8" fill="#dc2626" opacity="0.12"/>
  <text x="688" y="227" font-size="16" fill="#dc2626" text-anchor="middle">每半年</text>

  <!-- Row3 y=264 -->
  <rect x="28" y="264" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="264" width="6" height="60" rx="2" fill="#57534e"/>
  <circle cx="66" cy="294" r="16" fill="#dc2626"/>
  <text x="66" y="300" font-size="16" font-weight="900" fill="#dc2626" text-anchor="middle">C12</text>
  <text x="100" y="291" font-size="20" font-weight="700" fill="#dc2626">【一級必要】各樓層A3以上逃生圖</text>
  <text x="100" y="312" font-size="16" fill="#57534e">需標示所在位置、防火區劃、等待救接空間；方向必須正確</text>
  <rect x="620" y="272" width="136" height="44" rx="8" fill="#dc2626" opacity="0.12"/>
  <text x="688" y="300" font-size="16" fill="#dc2626" text-anchor="middle">實地核查</text>

  <!-- Row4 y=337 -->
  <rect x="28" y="337" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="337" width="6" height="60" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="367" r="16" fill="#dc2626"/>
  <text x="66" y="373" font-size="16" font-weight="900" fill="#dc2626" text-anchor="middle">C15</text>
  <text x="100" y="364" font-size="20" font-weight="700" fill="#dc2626">【一級必要】每層護理站＋急救設備效期</text>
  <text x="100" y="385" font-size="16" fill="#57534e">每層樓設護理站；氧氣瓶在效期內；護理人員熟悉使用</text>
  <rect x="620" y="345" width="136" height="44" rx="8" fill="#dc2626" opacity="0.12"/>
  <text x="688" y="373" font-size="16" fill="#dc2626" text-anchor="middle">抽測人員</text>

  <!-- Row5 y=410 -->
  <rect x="28" y="410" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="410" width="6" height="60" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="440" r="16" fill="#dc2626"/>
  <text x="66" y="446" font-size="16" font-weight="900" fill="#dc2626" text-anchor="middle">C11</text>
  <text x="100" y="437" font-size="20" font-weight="700" fill="#dc2626">【一級必要】夜間演練＋複合型演練各1次</text>
  <text x="100" y="458" font-size="16" fill="#57534e">每年各執行1次；需有演練腳本、照片、檢討會議紀錄</text>
  <rect x="620" y="418" width="136" height="44" rx="8" fill="#dc2626" opacity="0.12"/>
  <text x="688" y="446" font-size="16" fill="#dc2626" text-anchor="middle">每年必辦</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
