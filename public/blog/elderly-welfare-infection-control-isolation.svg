<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- Header (N=4) -->
  <rect x="50" y="50" width="700" height="76" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="400" y="89" font-size="22" fill="#1e293b" font-weight="700" text-anchor="middle" font-family="sans-serif">隔離措施 4 步驟</text>
  <text x="400" y="113" font-size="15" fill="#57534e" text-anchor="middle" font-family="sans-serif">發現疑似感染個案後，需依標準流程立即啟動隔離措施</text>

  <!-- Row 1 -->
  <rect x="50" y="160" width="700" height="62" rx="8" fill="#ffffff"/>
  <rect x="50" y="160" width="6" height="62" rx="3" fill="#d97706"/>
  <circle cx="87" cy="191" r="16" fill="#d97706" opacity="0.15"/>
  <text x="87" y="197" font-size="16" fill="#d97706" font-weight="700" text-anchor="middle" font-family="sans-serif">1</text>
  <text x="120" y="182" font-size="16" fill="#1e293b" font-weight="700" font-family="sans-serif">立即通知相關人員</text>
  <text x="120" y="202" font-size="14" fill="#57534e" font-family="sans-serif">通知護理長/主管、安排專責照護工作人員、聯繫家屬告知狀況</text>
  <rect x="620" y="167" width="115" height="46" rx="6" fill="#d97706" opacity="0.12"/>
  <text x="677" y="191" font-size="14" fill="#d97706" font-weight="700" text-anchor="middle" font-family="sans-serif">即時通報</text>
  <text x="677" y="207" font-size="13" fill="#d97706" text-anchor="middle" font-family="sans-serif">第一步</text>

  <!-- Row 2 -->
  <rect x="50" y="235" width="700" height="62" rx="8" fill="#ffffff"/>
  <rect x="50" y="235" width="6" height="62" rx="3" fill="#78716c"/>
  <circle cx="87" cy="266" r="16" fill="#78716c" opacity="0.15"/>
  <text x="87" y="272" font-size="16" fill="#78716c" font-weight="700" text-anchor="middle" font-family="sans-serif">2</text>
  <text x="120" y="257" font-size="16" fill="#1e293b" font-weight="700" font-family="sans-serif">個案與他人區隔</text>
  <text x="120" y="277" font-size="14" fill="#57534e" font-family="sans-serif">移送至隔離空間（須有獨立空調、衛浴設備），依動線安排確保感控原則</text>
  <rect x="620" y="242" width="115" height="46" rx="6" fill="#78716c" opacity="0.12"/>
  <text x="677" y="266" font-size="14" fill="#78716c" font-weight="700" text-anchor="middle" font-family="sans-serif">空間隔離</text>
  <text x="677" y="282" font-size="13" fill="#78716c" text-anchor="middle" font-family="sans-serif">獨立設施</text>

  <!-- Row 3 -->
  <rect x="50" y="310" width="700" height="62" rx="8" fill="#ffffff"/>
  <rect x="50" y="310" width="6" height="62" rx="3" fill="#57534e"/>
  <circle cx="87" cy="341" r="16" fill="#57534e" opacity="0.15"/>
  <text x="87" y="347" font-size="16" fill="#57534e" font-weight="700" text-anchor="middle" font-family="sans-serif">3</text>
  <text x="120" y="332" font-size="16" fill="#1e293b" font-weight="700" font-family="sans-serif">防護裝備使用與記錄</text>
  <text x="120" y="352" font-size="14" fill="#57534e" font-family="sans-serif">進入隔離區域工作人員正確穿戴口罩、手套等防護裝備，並記錄進出時間</text>
  <rect x="620" y="317" width="115" height="46" rx="6" fill="#57534e" opacity="0.12"/>
  <text x="677" y="341" font-size="14" fill="#57534e" font-weight="700" text-anchor="middle" font-family="sans-serif">防護裝備</text>
  <text x="677" y="357" font-size="13" fill="#57534e" text-anchor="middle" font-family="sans-serif">正確穿戴</text>

  <!-- Row 4 -->
  <rect x="50" y="385" width="700" height="62" rx="8" fill="#ffffff"/>
  <rect x="50" y="385" width="6" height="62" rx="3" fill="#a8a29e"/>
  <circle cx="87" cy="416" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="87" y="422" font-size="16" fill="#a8a29e" font-weight="700" text-anchor="middle" font-family="sans-serif">4</text>
  <text x="120" y="407" font-size="16" fill="#1e293b" font-weight="700" font-family="sans-serif">區域清潔消毒與解除</text>
  <text x="120" y="427" font-size="14" fill="#57534e" font-family="sans-serif">隔離結束後依 SOP 進行清潔消毒，記錄消毒日期、範圍及使用消毒劑</text>
  <rect x="620" y="392" width="115" height="46" rx="6" fill="#a8a29e" opacity="0.12"/>
  <text x="677" y="416" font-size="14" fill="#a8a29e" font-weight="700" text-anchor="middle" font-family="sans-serif">清消記錄</text>
  <text x="677" y="432" font-size="13" fill="#a8a29e" text-anchor="middle" font-family="sans-serif">解除流程</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" font-family="sans-serif">報告汪 reportwang.com</text>
</svg>
