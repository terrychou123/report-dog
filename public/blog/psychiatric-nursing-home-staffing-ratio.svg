<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <text x="40" y="48" font-size="32" font-weight="bold" fill="#1e293b" >精神護理之家各類人員設置規範</text>
  <text x="40" y="78" font-size="22" fill="#57534e" >依護理機構設置標準及評鑑基準規定</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#dedad3" stroke-width="2"/>

  <!-- 行1 護理人員 -->
  <rect x="30" y="110" width="6" height="80" rx="2" fill="#d97706"/>
  <rect x="44" y="110" width="716" height="80" rx="6" fill="white" opacity="0.7"/>
  <text x="66" y="142" font-size="20" font-weight="bold" fill="#d97706" >護理人員</text>
  <rect x="180" y="122" width="120" height="30" rx="15" fill="#d97706"/>
  <text x="240" y="142" font-size="14" fill="white" text-anchor="middle" >試扣分項目</text>
  <text x="66" y="174" font-size="15" fill="#57534e" >每班至少1人在班，24小時均需在班（不得電話on-call）</text>

  <!-- 行2 照顧服務員 -->
  <rect x="30" y="202" width="6" height="80" rx="2" fill="#78716c"/>
  <rect x="44" y="202" width="716" height="80" rx="6" fill="white" opacity="0.7"/>
  <text x="66" y="233" font-size="20" font-weight="bold" fill="#78716c" >照顧服務員</text>
  <text x="66" y="265" font-size="15" fill="#57534e" >依床數按比例配置，資格需符合規定（訓練課程結訓）</text>

  <!-- 行3 職能治療師 -->
  <rect x="30" y="294" width="6" height="80" rx="2" fill="#57534e"/>
  <rect x="44" y="294" width="716" height="80" rx="6" fill="white" opacity="0.7"/>
  <text x="66" y="325" font-size="20" font-weight="bold" fill="#57534e" >職能治療師</text>
  <text x="66" y="357" font-size="15" fill="#57534e" >200床以下每20床4小時/週；200床以上每200床1人</text>

  <!-- 行4 臨床心理師 -->
  <rect x="30" y="386" width="6" height="80" rx="2" fill="#a8a29e"/>
  <rect x="44" y="386" width="716" height="80" rx="6" fill="white" opacity="0.7"/>
  <text x="66" y="417" font-size="20" font-weight="bold" fill="#a8a29e" >臨床心理師</text>
  <text x="66" y="449" font-size="15" fill="#57534e" >200床以下每20床4小時/週；200床以上每200床1人</text>

  <!-- 品牌浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" >報告汪 reportwang.com</text>
</svg>
