<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- @template: list-4 -->
  <rect width="800" height="500" fill="#f0efe8"/>
  <text x="400" y="48" text-anchor="middle" font-size="30" fill="#1e293b" font-weight="700">日間型 2.3 社區生活化服務設計四要素</text>
  <text x="400" y="78" text-anchor="middle" font-size="20" fill="#57534e">評鑑委員從訪談與文件就能看出機構社區化程度</text>
  <line x1="28" y1="94" x2="772" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- Row 1: 真實社區外出 (rowY=160, H=62) -->
  <rect x="28" y="160" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="160" width="6" height="62" rx="2" fill="#d97706"/>
  <circle cx="66" cy="191" r="18" fill="#d97706" opacity="0.15"/>
  <!-- text_y = 160+31+22*0.35=198.7≈199 -->
  <text x="66" y="199" font-size="22" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <text x="100" y="180" font-size="22" fill="#1e293b" font-weight="700">真實社區場所外出（非機構周邊散步）</text>
  <text x="100" y="207" font-size="16" fill="#57534e">市場、圖書館、超商、社區活動中心、家庭拜訪，每次有目的地和目標說明</text>
  <!-- S-box: y=160+8=168, rectH=46 -->
  <rect x="620" y="168" width="136" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="186" font-size="15" fill="#d97706" text-anchor="middle">每月紀錄</text>
  <text x="688" y="204" font-size="15" fill="#d97706" text-anchor="middle">地點＋目的</text>

  <!-- Row 2: 社區資源連結 (rowY=235, H=62) -->
  <rect x="28" y="235" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="235" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="66" cy="266" r="18" fill="#78716c" opacity="0.15"/>
  <!-- text_y = 235+31+7.7=273.7≈274 -->
  <text x="66" y="274" font-size="22" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <text x="100" y="255" font-size="22" fill="#1e293b" font-weight="700">社區資源連結（主動建立關係，非只辦活動）</text>
  <text x="100" y="282" font-size="16" fill="#57534e">與就業服務站、身障服務、社區照顧關懷據點、家庭支持等建立合作連結並有紀錄</text>
  <!-- S-box: y=235+8=243 -->
  <rect x="620" y="243" width="136" height="46" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="261" font-size="15" fill="#78716c" text-anchor="middle">連結清單</text>
  <text x="688" y="279" font-size="15" fill="#78716c" text-anchor="middle">合作紀錄</text>

  <!-- Row 3: 多元服務類型 (rowY=310, H=62) -->
  <rect x="28" y="310" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="310" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="66" cy="341" r="18" fill="#57534e" opacity="0.15"/>
  <!-- text_y = 310+31+7.7=348.7≈349 -->
  <text x="66" y="349" font-size="22" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <text x="100" y="330" font-size="22" fill="#1e293b" font-weight="700">多元服務類型（至少3種以上不同取向）</text>
  <text x="100" y="357" font-size="16" fill="#57534e">生活技能訓練、藝術治療、運動復健、職業準備、心理支持——不同課程服務不同目標</text>
  <!-- S-box: y=310+8=318 -->
  <rect x="620" y="318" width="136" height="46" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="336" font-size="15" fill="#57534e" text-anchor="middle">課程計畫書</text>
  <text x="688" y="354" font-size="15" fill="#57534e" text-anchor="middle">類型說明</text>

  <!-- Row 4: 個別化連結 (rowY=385, H=62) -->
  <rect x="28" y="385" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="385" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="416" r="18" fill="#a8a29e" opacity="0.15"/>
  <!-- text_y = 385+31+7.7=423.7≈424 -->
  <text x="66" y="424" font-size="22" fill="#a8a29e" text-anchor="middle" font-weight="900">4</text>
  <text x="100" y="405" font-size="22" fill="#1e293b" font-weight="700">個別化連結（每項服務都有復健目標依據）</text>
  <text x="100" y="432" font-size="16" fill="#57534e">課程設計說明哪些學員適合、對應哪個 2.2 復健目標，不是所有人上同樣的課</text>
  <!-- S-box: y=385+8=393 -->
  <rect x="620" y="393" width="136" height="46" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="411" font-size="15" fill="#a8a29e" text-anchor="middle">服務連結</text>
  <text x="688" y="429" font-size="15" fill="#a8a29e" text-anchor="middle">個別計畫</text>

  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
