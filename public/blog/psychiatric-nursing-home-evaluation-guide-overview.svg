<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <text x="40" y="48" font-size="32" font-weight="bold" fill="#1e293b" font-family="'Noto Sans TC', sans-serif">115年度精神護理之家評鑑 5大面向總覽</text>
  <text x="40" y="78" font-size="22" fill="#57534e" font-family="'Noto Sans TC', sans-serif">36項基準，涵蓋A到E五大面向</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#dedad3" stroke-width="2"/>

  <!-- 4欄卡片 -->
  <!-- 卡片1 A面向 -->
  <rect x="30" y="115" width="170" height="320" rx="12" fill="#d97706" opacity="0.12"/>
  <rect x="30" y="115" width="170" height="8" rx="4" fill="#d97706"/>
  <text x="115" y="160" font-size="18" font-weight="bold" fill="#d97706" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">A 經營管理效能</text>
  <line x1="50" y1="175" x2="180" y2="175" stroke="#dedad3" stroke-width="1.5"/>
  <text x="115" y="205" font-size="32" font-weight="bold" fill="#d97706" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">9</text>
  <text x="115" y="230" font-size="16" fill="#57534e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">項指標</text>
  <text x="115" y="270" font-size="15" fill="#57534e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">業務計畫</text>
  <text x="115" y="295" font-size="15" fill="#57534e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">人員配置</text>
  <text x="115" y="320" font-size="15" fill="#57534e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">訓練管理</text>

  <!-- 卡片2 B面向 -->
  <rect x="215" y="115" width="170" height="320" rx="12" fill="#78716c" opacity="0.12"/>
  <rect x="215" y="115" width="170" height="8" rx="4" fill="#78716c"/>
  <text x="300" y="160" font-size="18" font-weight="bold" fill="#78716c" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">B 專業照護品質</text>
  <line x1="235" y1="175" x2="365" y2="175" stroke="#dedad3" stroke-width="1.5"/>
  <text x="300" y="205" font-size="32" font-weight="bold" fill="#78716c" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">21</text>
  <text x="300" y="230" font-size="16" fill="#57534e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">項指標</text>
  <text x="300" y="270" font-size="15" fill="#57534e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">照護計畫</text>
  <text x="300" y="295" font-size="15" fill="#57534e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">感染控制</text>
  <text x="300" y="320" font-size="15" fill="#57534e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">品質監測</text>

  <!-- 卡片3 C面向 -->
  <rect x="400" y="115" width="170" height="320" rx="12" fill="#57534e" opacity="0.12"/>
  <rect x="400" y="115" width="170" height="8" rx="4" fill="#57534e"/>
  <text x="485" y="160" font-size="18" font-weight="bold" fill="#57534e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">C 安全維護設施</text>
  <line x1="420" y1="175" x2="550" y2="175" stroke="#dedad3" stroke-width="1.5"/>
  <text x="485" y="205" font-size="32" font-weight="bold" fill="#57534e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">3</text>
  <text x="485" y="230" font-size="16" fill="#57534e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">項指標</text>
  <text x="485" y="270" font-size="15" fill="#57534e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">避難逃生</text>
  <text x="485" y="295" font-size="15" fill="#57534e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">消防演練</text>

  <!-- 卡片4 D/E面向 -->
  <rect x="585" y="115" width="185" height="320" rx="12" fill="#a8a29e" opacity="0.12"/>
  <rect x="585" y="115" width="185" height="8" rx="4" fill="#a8a29e"/>
  <text x="677" y="160" font-size="18" font-weight="bold" fill="#a8a29e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">D住民權益+E創新</text>
  <line x1="605" y1="175" x2="750" y2="175" stroke="#dedad3" stroke-width="1.5"/>
  <text x="677" y="205" font-size="32" font-weight="bold" fill="#a8a29e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">3</text>
  <text x="677" y="230" font-size="16" fill="#57534e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">項指標</text>
  <text x="677" y="270" font-size="15" fill="#57534e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">權益保障</text>
  <text x="677" y="295" font-size="15" fill="#57534e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">安寧療護</text>
  <text x="677" y="320" font-size="15" fill="#57534e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">創新措施</text>

  <!-- 品牌浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-family="'Noto Sans TC', sans-serif">報告汪 reportwang.com</text>
