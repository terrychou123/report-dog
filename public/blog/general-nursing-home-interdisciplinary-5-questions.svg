<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <rect x="0" y="29" width="800" height="60" fill="#e8e6de"/>
  <rect x="0" y="29" width="6" height="60" rx="2" fill="#d97706"/>
  <text x="28" y="74" font-size="30" fill="#1e293b" font-weight="700">評鑑委員 B2 現場最常問的五個問題</text>
  <rect x="28" y="118" width="744" height="60" rx="12" fill="#e8e6de"/>
  <rect x="28" y="118" width="6" height="60" rx="2" fill="#d97706"/>
  <circle cx="66" cy="148" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="154" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <text x="100" y="145" font-size="20" fill="#1e293b" font-weight="700">「這位住民上次跨專業會議討論了什麼？」</text>
  <text x="100" y="166" font-size="16" fill="#57534e">快速調閱對應會議記錄段落，說明照護問題與決定</text>
  <rect x="620" y="126" width="136" height="44" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="142" font-size="16" fill="#d97706" text-anchor="middle">快速</text>
  <text x="688" y="162" font-size="16" fill="#d97706" text-anchor="middle">調閱</text>
  <rect x="28" y="191" width="744" height="60" rx="12" fill="#e8e6de"/>
  <rect x="28" y="191" width="6" height="60" rx="2" fill="#78716c"/>
  <circle cx="66" cy="221" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="227" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <text x="100" y="218" font-size="20" fill="#1e293b" font-weight="700">「家屬有參與嗎？怎麼知會？」</text>
  <text x="100" y="239" font-size="16" fill="#57534e">說明家屬通知方式和參與記錄，無法出席者的替代做法</text>
  <rect x="620" y="199" width="136" height="44" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="215" font-size="16" fill="#78716c" text-anchor="middle">家屬</text>
  <text x="688" y="235" font-size="16" fill="#78716c" text-anchor="middle">記錄</text>
  <rect x="28" y="264" width="744" height="60" rx="12" fill="#e8e6de"/>
  <rect x="28" y="264" width="6" height="60" rx="2" fill="#57534e"/>
  <circle cx="66" cy="294" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="300" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <text x="100" y="291" font-size="20" fill="#1e293b" font-weight="700">「照護計畫有依評估結果修訂嗎？」</text>
  <text x="100" y="312" font-size="16" fill="#57534e">需顯示 ADL/認知評估結果如何驅動計畫修訂</text>
  <rect x="620" y="272" width="136" height="44" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="288" font-size="16" fill="#57534e" text-anchor="middle">評估</text>
  <text x="688" y="308" font-size="16" fill="#57534e" text-anchor="middle">驅動</text>
  <rect x="28" y="337" width="744" height="60" rx="12" fill="#e8e6de"/>
  <rect x="28" y="337" width="6" height="60" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="367" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="373" font-size="16" fill="#a8a29e" text-anchor="middle" font-weight="900">4</text>
  <text x="100" y="364" font-size="20" fill="#1e293b" font-weight="700">「出席的有哪些專業領域？」</text>
  <text x="100" y="385" font-size="16" fill="#57534e">說明三種以上不同領域，並指出會議記錄中的職稱標示</text>
  <rect x="620" y="345" width="136" height="44" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="361" font-size="16" fill="#a8a29e" text-anchor="middle">三種</text>
  <text x="688" y="381" font-size="16" fill="#a8a29e" text-anchor="middle">領域</text>
  <rect x="28" y="410" width="744" height="60" rx="12" fill="#e8e6de"/>
  <rect x="28" y="410" width="6" height="60" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="440" r="16" fill="#94a3b8" opacity="0.15"/>
  <text x="66" y="446" font-size="16" fill="#94a3b8" text-anchor="middle" font-weight="900">5</text>
  <text x="100" y="437" font-size="20" fill="#1e293b" font-weight="700">「如何確保會議決策確實執行？」</text>
  <text x="100" y="458" font-size="16" fill="#57534e">說明會議決議追蹤機制，下次會議有確認上次決議執行狀況</text>
  <rect x="620" y="418" width="136" height="44" rx="8" fill="#94a3b8" opacity="0.12"/>
  <text x="688" y="434" font-size="16" fill="#94a3b8" text-anchor="middle">追蹤</text>
  <text x="688" y="454" font-size="16" fill="#94a3b8" text-anchor="middle">機制</text>
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
