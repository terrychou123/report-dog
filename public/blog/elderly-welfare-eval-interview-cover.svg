<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>

  <!-- 左側裝飾色塊 -->
  <rect x="0" y="0" width="8" height="630" fill="#d97706"/>

  <!-- 主標題第1行：黑色 -->
  <text x="80" y="175" font-size="100" font-weight="900" fill="#1e293b" >評鑑委員會</text>

  <!-- 主標題第2行：琥珀色 -->
  <text x="80" y="290" font-size="100" font-weight="900" fill="#d97706" >問什麼？</text>

  <!-- 副標題 -->
  <text x="80" y="360" font-size="38" fill="#57534e" >6 大區塊常見訪談問題，人員分工備答不慌張</text>

  <!-- Pills 標籤列 -->
  <!-- pill 1 -->
  <rect x="80" y="400" width="188" height="44" rx="22" fill="#d97706" opacity="0.15"/>
  <text x="174" y="428" font-size="20" fill="#d97706" font-weight="700"  text-anchor="middle">A-F區訪談題</text>

  <!-- pill 2 -->
  <rect x="282" y="400" width="148" height="44" rx="22" fill="#d97706" opacity="0.15"/>
  <text x="356" y="428" font-size="20" fill="#d97706" font-weight="700"  text-anchor="middle">現場應對</text>

  <!-- pill 3 -->
  <rect x="444" y="400" width="148" height="44" rx="22" fill="#d97706" opacity="0.15"/>
  <text x="518" y="428" font-size="20" fill="#d97706" font-weight="700"  text-anchor="middle">應答技巧</text>

  <!-- pill 4 -->
  <rect x="606" y="400" width="120" height="44" rx="22" fill="#d97706" opacity="0.15"/>
  <text x="666" y="428" font-size="20" fill="#d97706" font-weight="700"  text-anchor="middle">多人協作</text>

  <!-- 右側區塊標示裝飾 -->
  <text x="920" y="195" font-size="52" font-weight="900" fill="#d97706"  text-anchor="middle">A  B  C</text>
  <text x="920" y="270" font-size="52" font-weight="900" fill="#78716c"  text-anchor="middle">D  E  F</text>
  <text x="920" y="335" font-size="30" fill="#57534e"  text-anchor="middle">六大區塊</text>
  <text x="920" y="375" font-size="30" fill="#57534e"  text-anchor="middle">全面備答</text>

  <!-- 裝飾線條 -->
  <line x1="80" y1="475" x2="760" y2="475" stroke="#d97706" stroke-width="2" opacity="0.3"/>

  <!-- 底部說明 -->
  <text x="80" y="520" font-size="26" fill="#78716c" >115年度老人福利機構評鑑 ✦ 主管訪談 ✦ 工作人員訪談 ✦ 服務對象訪談</text>

  <!-- 浮水印 -->
  <text x="1140" y="590" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400" >報告汪 reportwang.com</text>
</svg>
