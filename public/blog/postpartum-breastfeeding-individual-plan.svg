<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- Header -->
  <rect x="0" y="29" width="800" height="60" fill="#e8e6de"/>
  <rect x="0" y="29" width="6" height="60" rx="2" fill="#d97706"/>
  <text x="28" y="74" font-size="30" fill="#1e293b" font-weight="700">個別化哺乳計畫 4 個必填要素</text>
  <!-- Row 1 -->
  <rect x="28" y="118" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="118" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="66" cy="149" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="155" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <text x="100" y="146" font-size="20" fill="#1e293b" font-weight="700">入住評估記錄</text>
  <text x="100" y="167" font-size="16" fill="#57534e">評估哺乳意願、能力、乳頭形狀、乳房狀態及初乳狀況</text>
  <rect x="620" y="126" width="136" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="143" font-size="16" fill="#d97706" text-anchor="middle">入住護理</text>
  <text x="688" y="163" font-size="16" fill="#d97706" text-anchor="middle">評估單</text>
  <!-- Row 2 -->
  <rect x="28" y="196" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="196" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="66" cy="227" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="233" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <text x="100" y="224" font-size="20" fill="#1e293b" font-weight="700">個別化哺育計畫</text>
  <text x="100" y="245" font-size="16" fill="#57534e">哺育方式、護理介入重點、哺乳頻率、體重監測計畫</text>
  <rect x="620" y="204" width="136" height="46" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="221" font-size="16" fill="#78716c" text-anchor="middle">護理計畫</text>
  <text x="688" y="241" font-size="16" fill="#78716c" text-anchor="middle">欄位</text>
  <!-- Row 3 -->
  <rect x="28" y="274" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="274" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="305" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="311" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <text x="100" y="302" font-size="20" fill="#1e293b" font-weight="700">持續追蹤記錄</text>
  <text x="100" y="323" font-size="16" fill="#57534e">每次哺乳評估後更新：哺乳情形、嬰兒體重與前次差異</text>
  <rect x="620" y="282" width="136" height="46" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="299" font-size="16" fill="#57534e" text-anchor="middle">護理</text>
  <text x="688" y="319" font-size="16" fill="#57534e" text-anchor="middle">記錄</text>
  <!-- Row 4 -->
  <rect x="28" y="352" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="352" width="6" height="62" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="383" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="389" font-size="16" fill="#a8a29e" text-anchor="middle" font-weight="900">4</text>
  <text x="100" y="380" font-size="20" fill="#1e293b" font-weight="700">計畫調整記錄</text>
  <text x="100" y="401" font-size="16" fill="#57534e">哺乳情形改變時更新護理計畫，記錄調整原因（個別化核心）</text>
  <rect x="620" y="360" width="136" height="46" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="377" font-size="16" fill="#a8a29e" text-anchor="middle">計畫</text>
  <text x="688" y="397" font-size="16" fill="#a8a29e" text-anchor="middle">更新</text>
  <!-- Watermark -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
