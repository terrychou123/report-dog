<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <rect x="0" y="38" width="800" height="90" fill="#e8e6de"/>
  <rect x="0" y="38" width="6" height="90" rx="2" fill="#d97706"/>
  <text x="28" y="98" font-size="36" fill="#1e293b" font-weight="700">缺失第二名：品質監測指標未逐月追蹤</text>
  <rect x="28" y="166" width="744" height="90" rx="12" fill="#e8e6de"/>
  <rect x="28" y="166" width="6" height="90" rx="2" fill="#57534e"/>
  <circle cx="66" cy="211" r="20" fill="#57534e" opacity="0.15"/>
  <text x="66" y="217" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">失分</text>
  <text x="100" y="210" font-size="28" fill="#1e293b" font-weight="700">只有季報或半年報，缺少逐月數據</text>
  <text x="100" y="234" font-size="18" fill="#57534e">部分月份空白，委員無法確認持續監測，判定不符合</text>
  <rect x="620" y="185" width="136" height="52" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="205" font-size="16" fill="#57534e" text-anchor="middle">月份</text>
  <text x="688" y="225" font-size="16" fill="#57534e" text-anchor="middle">空白</text>
  <rect x="28" y="269" width="744" height="90" rx="12" fill="#e8e6de"/>
  <rect x="28" y="269" width="6" height="90" rx="2" fill="#d97706"/>
  <circle cx="66" cy="314" r="20" fill="#d97706" opacity="0.15"/>
  <text x="66" y="320" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">解法</text>
  <text x="100" y="313" font-size="28" fill="#1e293b" font-weight="700">建立每月固定填報機制</text>
  <text x="100" y="337" font-size="18" fill="#57534e">無事件發生的月份也需要「零事件確認記錄」，避免空白</text>
  <rect x="620" y="288" width="136" height="52" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="308" font-size="16" fill="#d97706" text-anchor="middle">零案</text>
  <text x="688" y="328" font-size="16" fill="#d97706" text-anchor="middle">也要記</text>
  <rect x="28" y="372" width="744" height="90" rx="12" fill="#e8e6de"/>
  <rect x="28" y="372" width="6" height="90" rx="2" fill="#78716c"/>
  <circle cx="66" cy="417" r="20" fill="#78716c" opacity="0.15"/>
  <text x="66" y="423" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">六項</text>
  <text x="100" y="416" font-size="28" fill="#1e293b" font-weight="700">B1.7 六大品質指標均需每月追蹤</text>
  <text x="100" y="440" font-size="18" fill="#57534e">跌倒、壓傷、約束、感染、非計畫住院、非計畫體重改變</text>
  <rect x="620" y="391" width="136" height="52" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="411" font-size="16" fill="#78716c" text-anchor="middle">六項</text>
  <text x="688" y="431" font-size="16" fill="#78716c" text-anchor="middle">每月</text>
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
