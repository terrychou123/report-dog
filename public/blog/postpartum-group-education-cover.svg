<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 右側裝飾區塊 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>

  <!-- 右側大文字 B1.4 -->
  <text x="1010" y="195" font-size="120" font-weight="900" fill="#16a34a" text-anchor="middle" opacity="0.85">B1.4</text>
  <text x="1010" y="237" font-size="26" fill="#78716c" text-anchor="middle" font-weight="600">團體衛教課程</text>

  <!-- 右側 3 個查核層次卡片 -->
  <rect x="840" y="260" width="320" height="62" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="858" y="282" font-size="18" fill="#a8a29e" font-weight="500">計畫層次</text>
  <text x="858" y="313" font-size="22" fill="#16a34a" font-weight="700">年度課程計畫書</text>

  <rect x="840" y="330" width="320" height="62" rx="10" fill="#16a34a" opacity="0.10" stroke="#e8e5de" stroke-width="1"/>
  <text x="858" y="352" font-size="18" fill="#a8a29e" font-weight="500">執行層次</text>
  <text x="858" y="383" font-size="22" fill="#16a34a" font-weight="700">出席紀錄（產婦簽名）</text>

  <rect x="840" y="400" width="320" height="62" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="858" y="422" font-size="18" fill="#a8a29e" font-weight="500">品質層次</text>
  <text x="858" y="453" font-size="22" fill="#d97706" font-weight="700">教材多元 + 定期更新</text>

  <!-- 右側課程主題範例 -->
  <rect x="840" y="472" width="320" height="46" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="1000" y="503" font-size="22" fill="#d97706" text-anchor="middle" font-weight="700">建議 6–8 個衛教主題</text>

  <!-- 右側底部 -->
  <rect x="840" y="526" width="320" height="52" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="1000" y="558" font-size="20" fill="#57534e" text-anchor="middle">含示教回覆成效評估</text>

  <!-- 左側主標題 -->
  <text x="60" y="165" font-size="88" font-weight="900" fill="#1e293b">團體衛教</text>
  <text x="60" y="261" font-size="88" font-weight="900" fill="#16a34a">課程怎麼規劃？</text>

  <line x1="60" y1="293" x2="780" y2="293" stroke="#dedad3" stroke-width="2"/>

  <text x="60" y="339" font-size="34" fill="#57534e" font-weight="400">B1.4 · 評鑑委員最在意的 3 種記錄</text>

  <!-- 特色標籤列 -->
  <rect x="60" y="367" width="178" height="52" rx="10" fill="#16a34a" opacity="0.10"/>
  <text x="149" y="402" font-size="26" fill="#16a34a" text-anchor="middle" font-weight="600">課程計畫</text>

  <rect x="250" y="367" width="178" height="52" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="339" y="402" font-size="26" fill="#d97706" text-anchor="middle" font-weight="600">出席紀錄</text>

  <rect x="440" y="367" width="178" height="52" rx="10" fill="#78716c" opacity="0.12"/>
  <text x="529" y="402" font-size="26" fill="#78716c" text-anchor="middle" font-weight="600">教材品質</text>

  <!-- 適用對象 -->
  <text x="60" y="455" font-size="28" fill="#94a3b8">護產人員 · 護理主管 · 衛教負責人</text>

  <!-- 底部說明 -->
  <text x="60" y="503" font-size="30" fill="#57534e" font-weight="500">有課有教不夠，出席紀錄沒有簽名就是缺失</text>
  <text x="60" y="541" font-size="26" fill="#a8a29e">3 個查核層次，每層都要有對應的文件為佐證</text>

  <!-- 浮水印 -->
  <text x="780" y="588" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
