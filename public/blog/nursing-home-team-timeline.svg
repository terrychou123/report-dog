<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <rect x="0" y="0" width="800" height="94" fill="white"/>
  <rect x="0" y="0" width="6" height="94" fill="#d97706"/>
  <text x="400" y="48" font-size="32" font-weight="700" fill="#1e293b" text-anchor="middle">多職種協作時程</text>
  <text x="400" y="78" font-size="22" fill="#78716c" text-anchor="middle">評鑑前12週倒數準備計畫</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- 時間軸橫線 -->
  <line x1="40" y1="272" x2="760" y2="272" stroke="#dedad3" stroke-width="2"/>

  <!-- 節點1（上方）：第12-8週 -->
  <rect x="40" y="108" width="155" height="100" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="118" y="134" font-size="16" fill="#d97706" text-anchor="middle" font-weight="700">第12-8週</text>
  <text x="118" y="158" font-size="14" fill="#57534e" text-anchor="middle">召開啟動會議</text>
  <text x="118" y="178" font-size="14" fill="#57534e" text-anchor="middle">確認分工表</text>
  <text x="118" y="198" font-size="14" fill="#57534e" text-anchor="middle">盤點現有文件</text>
  <!-- 虛線：卡片底到圓頂 -->
  <line x1="118" y1="208" x2="118" y2="248" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,3"/>
  <circle cx="118" cy="272" r="24" fill="#d97706" opacity="0.15" stroke="#d97706" stroke-width="2"/>
  <text x="118" y="279" font-size="16" fill="#d97706" text-anchor="middle" font-weight="700">準備期</text>

  <!-- 節點2（下方）：第8-4週 -->
  <circle cx="307" cy="272" r="24" fill="#78716c" opacity="0.15" stroke="#78716c" stroke-width="2"/>
  <text x="307" y="279" font-size="16" fill="#78716c" text-anchor="middle" font-weight="700">執行期</text>
  <!-- 虛線：圓底到卡頂 -->
  <line x1="307" y1="296" x2="307" y2="350" stroke="#78716c" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="229" y="350" width="155" height="100" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="307" y="376" font-size="16" fill="#78716c" text-anchor="middle" font-weight="700">第8-4週</text>
  <text x="307" y="400" font-size="14" fill="#57534e" text-anchor="middle">各自整理文件</text>
  <text x="307" y="420" font-size="14" fill="#57534e" text-anchor="middle">每週進度對齊</text>
  <text x="307" y="440" font-size="14" fill="#57534e" text-anchor="middle">B5跨專業聯繫</text>

  <!-- 節點3（上方）：第4-2週 -->
  <rect x="418" y="108" width="155" height="100" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="495" y="134" font-size="16" fill="#57534e" text-anchor="middle" font-weight="700">第4-2週</text>
  <text x="495" y="158" font-size="14" fill="#57534e" text-anchor="middle">跨職種交叉確認</text>
  <text x="495" y="178" font-size="14" fill="#57534e" text-anchor="middle">補齊缺漏文件</text>
  <text x="495" y="198" font-size="14" fill="#57534e" text-anchor="middle">模擬訪談問答</text>
  <!-- 虛線 -->
  <line x1="495" y1="208" x2="495" y2="248" stroke="#57534e" stroke-width="1.5" stroke-dasharray="4,3"/>
  <circle cx="495" cy="272" r="24" fill="#57534e" opacity="0.15" stroke="#57534e" stroke-width="2"/>
  <text x="495" y="279" font-size="16" fill="#57534e" text-anchor="middle" font-weight="700">衝刺期</text>

  <!-- 節點4（下方）：評鑑前1週 -->
  <circle cx="682" cy="272" r="24" fill="#a8a29e" opacity="0.15" stroke="#a8a29e" stroke-width="2"/>
  <text x="682" y="279" font-size="16" fill="#78716c" text-anchor="middle" font-weight="700">最終週</text>
  <!-- 虛線 -->
  <line x1="682" y1="296" x2="682" y2="350" stroke="#a8a29e" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="607" y="350" width="155" height="100" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="682" y="376" font-size="16" fill="#78716c" text-anchor="middle" font-weight="700">評鑑前1週</text>
  <text x="682" y="400" font-size="14" fill="#57534e" text-anchor="middle">整合演練彩排</text>
  <text x="682" y="420" font-size="14" fill="#57534e" text-anchor="middle">文件確認可取得</text>
  <text x="682" y="440" font-size="14" fill="#57534e" text-anchor="middle">全員心態調整</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
