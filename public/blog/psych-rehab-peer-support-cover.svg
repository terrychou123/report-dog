<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', sans-serif">
  <!-- @template: cover -->
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 右側裝飾區塊 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>
  <!-- 右側試評 2.14 -->
  <text x="1010" y="205" font-size="100" fill="#9333ea" text-anchor="middle" font-weight="700" opacity="0.85">試2.14</text>
  <!-- 試評標籤 -->
  <rect x="870" y="230" width="280" height="46" rx="10" fill="#9333ea" opacity="0.12"/>
  <text x="1010" y="261" font-size="22" fill="#9333ea" text-anchor="middle" font-weight="700">試評條目（不計分）</text>
  <text x="1010" y="320" font-size="20" fill="#57534e" text-anchor="middle">有罹病經驗的康復者</text>
  <text x="1010" y="350" font-size="20" fill="#57534e" text-anchor="middle">擔任同儕支持者</text>
  <!-- CHIME 標籤 -->
  <rect x="870" y="390" width="280" height="80" rx="12" fill="#d97706" opacity="0.08"/>
  <text x="1010" y="422" font-size="20" fill="#d97706" text-anchor="middle" font-weight="700">CHIME 理念</text>
  <text x="1010" y="453" font-size="16" fill="#57534e" text-anchor="middle">Hope ‧ Connectedness</text>
  <text x="1010" y="462" font-size="16" fill="#57534e" text-anchor="middle">Identity ‧ Meaning</text>
