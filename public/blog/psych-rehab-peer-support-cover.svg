  <rect x="60" y="440" width="120" height="36" rx="18" fill="#9333ea" opacity="0.12"/>
  <text x="120" y="463" font-size="16" fill="#9333ea" text-anchor="middle" font-weight="600">試評2.14</text>
  <rect x="194" y="440" width="100" height="36" rx="18" fill="#d97706" opacity="0.12"/>
  <text x="244" y="463" font-size="16" fill="#d97706" text-anchor="middle" font-weight="600">CHIME</text>
  <rect x="308" y="440" width="120" height="36" rx="18" fill="#16a34a" opacity="0.12"/>
  <text x="368" y="463" font-size="16" fill="#16a34a" text-anchor="middle" font-weight="600">個人復元</text>
  <rect x="442" y="440" width="148" height="36" rx="18" fill="#78716c" opacity="0.12"/>
  <text x="516" y="463" font-size="16" fill="#78716c" text-anchor="middle" font-weight="600">115年度評鑑</text>
