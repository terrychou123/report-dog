  <text x="158" y="85" font-size="18" fill="#9333ea" text-anchor="middle" font-weight="700">復健服務</text>
  <!-- 主標題 -->
  <text x="60" y="185" font-size="76" fill="#1e293b" font-weight="700">同儕支持</text>
  <text x="60" y="275" font-size="64" fill="#9333ea" font-weight="700">Peer Support</text>
  <!-- 分隔線 -->
  <line x1="60" y1="305" x2="760" y2="305" stroke="#dedad3" stroke-width="2"/>
  <!-- 副標題 -->
  <text x="60" y="352" font-size="28" fill="#57534e">有罹病經驗的康復者以自身故事</text>
  <text x="60" y="392" font-size="26" fill="#57534e">陪伴仍在復元路上的服務對象</text>
