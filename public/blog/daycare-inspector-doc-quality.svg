<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"
     font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">好文件 vs 扣分文件特徵對比</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">了解委員閱讀邏輯，讓每份文件都說出服務故事</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- 上排左：好文件—具體描述 (#d97706) x=40 y=104 w=346 h=168 -->
  <rect x="40" y="104" width="346" height="168" rx="12" fill="white"/>
  <rect x="40" y="104" width="346" height="44" rx="12" fill="#d97706"/>
  <rect x="40" y="128" width="346" height="20" fill="#d97706"/>
  <text x="213" y="144" text-anchor="middle" font-size="16" fill="white" font-weight="700">好文件特徵① 具體描述</text>
  <text x="60" y="176" font-size="14" fill="#57534e">• 有姓名・日期・具體數字</text>
  <text x="60" y="196" font-size="14" fill="#57534e">• 資訊完整可核對查閱</text>
  <text x="60" y="216" font-size="14" fill="#57534e">• 個案有個別化差異內容</text>
  <rect x="56" y="242" width="90" height="20" rx="10" fill="#fef3c7"/>
  <text x="101" y="256" text-anchor="middle" font-size="14" fill="#d97706" font-weight="600">高分文件</text>

  <!-- 上排右：好文件—改善軌跡 (#78716c) x=414 y=104 w=346 h=168 -->
  <rect x="414" y="104" width="346" height="168" rx="12" fill="white"/>
  <rect x="414" y="104" width="346" height="44" rx="12" fill="#78716c"/>
  <rect x="414" y="128" width="346" height="20" fill="#78716c"/>
  <text x="587" y="144" text-anchor="middle" font-size="16" fill="white" font-weight="700">好文件特徵② 改善軌跡</text>
  <text x="434" y="176" font-size="14" fill="#57534e">• 問題→對策→成效，閉環呈現</text>
  <text x="434" y="196" font-size="14" fill="#57534e">• 各文件之間相互呼應</text>
  <text x="434" y="216" font-size="14" fill="#57534e">• 展示持續改善的態度</text>
  <rect x="430" y="242" width="90" height="20" rx="10" fill="#f5f5f4"/>
  <text x="475" y="256" text-anchor="middle" font-size="14" fill="#78716c" font-weight="600">閉環紀錄</text>

  <!-- 下排左：扣分—格式制式 (#57534e) x=40 y=288 w=346 h=162 -->
  <rect x="40" y="288" width="346" height="162" rx="12" fill="white"/>
  <rect x="40" y="288" width="346" height="44" rx="12" fill="#57534e"/>
  <rect x="40" y="312" width="346" height="20" fill="#57534e"/>
  <text x="213" y="328" text-anchor="middle" font-size="16" fill="white" font-weight="700">扣分特徵① 格式制式</text>
  <text x="60" y="360" font-size="14" fill="#57534e">• 每份文件複製貼上</text>
  <text x="60" y="380" font-size="14" fill="#57534e">• 不同個案描述幾乎相同</text>
  <text x="60" y="400" font-size="14" fill="#57534e">• 制式勾選無文字說明</text>
  <rect x="56" y="420" width="90" height="20" rx="10" fill="#f5f0eb"/>
  <text x="101" y="434" text-anchor="middle" font-size="14" fill="#57534e" font-weight="600">常見失分</text>

  <!-- 下排右：扣分—紀錄問題 (#a8a29e) x=414 y=288 w=346 h=162 -->
  <rect x="414" y="288" width="346" height="162" rx="12" fill="white"/>
  <rect x="414" y="288" width="346" height="44" rx="12" fill="#a8a29e"/>
  <rect x="414" y="312" width="346" height="20" fill="#a8a29e"/>
  <text x="587" y="328" text-anchor="middle" font-size="16" fill="white" font-weight="700">扣分特徵② 紀錄問題</text>
  <text x="434" y="360" font-size="14" fill="#57534e">• 日期集中在評鑑前兩週</text>
  <text x="434" y="380" font-size="14" fill="#57534e">• 前後文件邏輯不一致</text>
  <text x="434" y="400" font-size="14" fill="#57534e">• 訪談答案與文件矛盾</text>
  <rect x="430" y="420" width="90" height="20" rx="10" fill="#f5f5f4"/>
  <text x="475" y="434" text-anchor="middle" font-size="14" fill="#a8a29e" font-weight="600">避免雷點</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
