<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <text x="40" y="48" font-size="32" font-weight="900" fill="#1e293b" font-family="'Noto Sans TC', sans-serif">復健作業活動月度規劃流程</text>
  <text x="40" y="78" font-size="22" fill="#78716c" font-family="'Noto Sans TC', sans-serif">從同意書到時數記錄的完整管理循環</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#d97706" stroke-width="2"/>

  <!-- 水平時間軸 -->
  <line x1="100" y1="230" x2="700" y2="230" stroke="#d97706" stroke-width="3"/>

  <!-- 節點1 上方文字 -->
  <rect x="30" y="120" width="200" height="80" rx="8" fill="white"/>
  <text x="130" y="146" font-size="18" font-weight="700" fill="#d97706" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">月初規劃</text>
  <text x="130" y="168" font-size="14" fill="#57534e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">評估住民需求</text>
  <text x="130" y="188" font-size="14" fill="#57534e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">規劃當月復健計畫</text>
  <!-- 節點1 連接線 -->
  <line x1="130" y1="200" x2="130" y2="230" stroke="#d97706" stroke-width="2" stroke-dasharray="4,3"/>
  <!-- 節點1 圓點 -->
  <circle cx="130" cy="230" r="16" fill="#d97706"/>
  <text x="130" y="235" font-size="14" font-weight="700" fill="white" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">1</text>
  <!-- 節點1 月份 -->
  <text x="130" y="258" font-size="16" fill="#d97706" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">月初</text>

  <!-- 節點2 下方文字 -->
  <!-- 節點2 圓點 -->
  <circle cx="400" cy="230" r="16" fill="#78716c"/>
  <text x="400" y="235" font-size="14" font-weight="700" fill="white" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">2</text>
  <!-- 節點2 月份 -->
  <text x="400" y="258" font-size="16" fill="#78716c" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">月中</text>
  <!-- 節點2 連接線 -->
  <line x1="400" y1="274" x2="400" y2="296" stroke="#78716c" stroke-width="2" stroke-dasharray="4,3"/>
  <rect x="300" y="296" width="200" height="80" rx="8" fill="white"/>
  <text x="400" y="322" font-size="18" font-weight="700" fill="#78716c" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">執行記錄</text>
  <text x="400" y="344" font-size="14" fill="#57534e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">每次記錄時數</text>
  <text x="400" y="364" font-size="14" fill="#57534e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">住民參與情形</text>

  <!-- 節點3 上方文字 -->
  <rect x="570" y="120" width="200" height="80" rx="8" fill="white"/>
  <text x="670" y="146" font-size="18" font-weight="700" fill="#57534e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">月底結算</text>
  <text x="670" y="168" font-size="14" fill="#57534e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">統計時數（上限15小時）</text>
  <text x="670" y="188" font-size="14" fill="#57534e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">核算獎勵金發放</text>
  <!-- 節點3 連接線 -->
  <line x1="670" y1="200" x2="670" y2="230" stroke="#57534e" stroke-width="2" stroke-dasharray="4,3"/>
  <!-- 節點3 圓點 -->
  <circle cx="670" cy="230" r="16" fill="#57534e"/>
  <text x="670" y="235" font-size="14" font-weight="700" fill="white" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">3</text>
  <!-- 節點3 月份 -->
  <text x="670" y="258" font-size="16" fill="#57534e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">月底</text>

  <!-- 提示文字 -->
  <rect x="40" y="410" width="720" height="48" rx="8" fill="#d97706" fill-opacity="0.12"/>
  <text x="400" y="441" font-size="20" fill="#d97706" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">每月時數不超過15小時，超過部分不得計入獎勵金</text>

  <!-- 品牌浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-family="'Noto Sans TC', sans-serif">報告汪 reportwang.com</text>
</svg>
