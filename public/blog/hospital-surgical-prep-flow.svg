<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#fafaf9"/>

  <!-- 標題區塊 -->
  <rect x="0" y="0" width="800" height="80" fill="#1c1917"/>
  <text x="400" y="35"  font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">手術安全評鑑準備四步驟</text>
  <text x="400" y="60"  font-size="13" fill="#a8a29e" text-anchor="middle">從文書建立到現場設備，確保3項必要條文全過關</text>

  <!-- 步驟1 -->
  <rect x="40" y="110" width="160" height="310" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <rect x="40" y="110" width="160" height="8" rx="4" fill="#d97706"/>
  <rect x="100" y="100" width="40" height="20" rx="10" fill="#d97706"/>
  <text x="120" y="114"  font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">STEP 01</text>
  <text x="120" y="158"  font-size="15" font-weight="900" fill="#d97706" text-anchor="middle">文書稽核</text>
  <rect x="60" y="172" width="120" height="1.5" fill="#e8e6de"/>
  <text x="120" y="198"  font-size="11" fill="#57534e" text-anchor="middle">抽查近3個月</text>
  <text x="120" y="216"  font-size="11" fill="#57534e" text-anchor="middle">手術查核表</text>
  <text x="120" y="234"  font-size="11" fill="#57534e" text-anchor="middle">確認三個時間點</text>
  <text x="120" y="252"  font-size="11" fill="#57534e" text-anchor="middle">完整、簽名齊全</text>
  <rect x="70" y="375" width="100" height="24" rx="12" fill="#fef3c7"/>
  <text x="120" y="391"  font-size="11" fill="#d97706" text-anchor="middle">每月抽查</text>

  <!-- 箭頭1 -->
  <polygon points="213,259 227,265 213,271" fill="#9333ea"/>
  <line x1="200" y1="265" x2="226" y2="265" stroke="#9333ea" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- 步驟2 -->
  <rect x="228" y="110" width="160" height="310" rx="12" fill="#ffffff" stroke="#78716c" stroke-width="2"/>
  <rect x="228" y="110" width="160" height="8" rx="4" fill="#78716c"/>
  <rect x="288" y="100" width="40" height="20" rx="10" fill="#78716c"/>
  <text x="308" y="114"  font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">STEP 02</text>
  <text x="308" y="158"  font-size="15" font-weight="900" fill="#78716c" text-anchor="middle">訪談演練</text>
  <rect x="248" y="172" width="120" height="1.5" fill="#e8e6de"/>
  <text x="308" y="198"  font-size="11" fill="#57534e" text-anchor="middle">請手術室護理師</text>
  <text x="308" y="216"  font-size="11" fill="#57534e" text-anchor="middle">演示Time Out</text>
  <text x="308" y="234"  font-size="11" fill="#57534e" text-anchor="middle">確認能正確回答</text>
  <text x="308" y="252"  font-size="11" fill="#57534e" text-anchor="middle">評鑑委員問題</text>
  <rect x="258" y="375" width="100" height="24" rx="12" fill="#f5f5f4"/>
  <text x="308" y="391"  font-size="11" fill="#78716c" text-anchor="middle">評鑑前演練</text>

  <!-- 箭頭2 -->
  <polygon points="401,259 415,265 401,271" fill="#9333ea"/>
  <line x1="388" y1="265" x2="414" y2="265" stroke="#9333ea" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- 步驟3 -->
  <rect x="416" y="110" width="160" height="310" rx="12" fill="#ffffff" stroke="#57534e" stroke-width="2"/>
  <rect x="416" y="110" width="160" height="8" rx="4" fill="#57534e"/>
  <rect x="476" y="100" width="40" height="20" rx="10" fill="#57534e"/>
  <text x="496" y="114"  font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">STEP 03</text>
  <text x="496" y="158"  font-size="15" font-weight="900" fill="#57534e" text-anchor="middle">設備確認</text>
  <rect x="436" y="172" width="120" height="1.5" fill="#e8e6de"/>
  <text x="496" y="198"  font-size="11" fill="#57534e" text-anchor="middle">實地查核困難</text>
  <text x="496" y="216"  font-size="11" fill="#57534e" text-anchor="middle">插管推車設備</text>
  <text x="496" y="234"  font-size="11" fill="#57534e" text-anchor="middle">確認最近一次</text>
  <text x="496" y="252"  font-size="11" fill="#57534e" text-anchor="middle">檢查紀錄日期</text>
  <rect x="446" y="375" width="100" height="24" rx="12" fill="#f5f5f4"/>
  <text x="496" y="391"  font-size="11" fill="#57534e" text-anchor="middle">實地查核</text>

  <!-- 箭頭3 -->
  <polygon points="589,259 603,265 589,271" fill="#9333ea"/>
  <line x1="576" y1="265" x2="602" y2="265" stroke="#9333ea" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- 步驟4 -->
  <rect x="604" y="110" width="160" height="310" rx="12" fill="#ffffff" stroke="#a8a29e" stroke-width="2"/>
  <rect x="604" y="110" width="160" height="8" rx="4" fill="#a8a29e"/>
  <rect x="664" y="100" width="40" height="20" rx="10" fill="#a8a29e"/>
  <text x="684" y="114"  font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">STEP 04</text>
  <text x="684" y="158"  font-size="15" font-weight="900" fill="#a8a29e" text-anchor="middle">紀錄整理</text>
  <rect x="624" y="172" width="120" height="1.5" fill="#e8e6de"/>
  <text x="684" y="198"  font-size="11" fill="#57534e" text-anchor="middle">麻醉前評估紀錄</text>
  <text x="684" y="216"  font-size="11" fill="#57534e" text-anchor="middle">麻醉紀錄建立</text>
  <text x="684" y="234"  font-size="11" fill="#57534e" text-anchor="middle">索引，確認可</text>
  <text x="684" y="252"  font-size="11" fill="#57534e" text-anchor="middle">快速調閱</text>
  <rect x="634" y="375" width="100" height="24" rx="12" fill="#fafaf9" stroke="#d6d3d1" stroke-width="1"/>
  <text x="684" y="391"  font-size="11" fill="#a8a29e" text-anchor="middle">文件整備</text>

  <!-- 浮水印 -->
  <text x="400" y="480"  font-size="11" fill="#a8a29e" text-anchor="middle" opacity="0.6">報告汪 reportwang.com</text>
</svg>
