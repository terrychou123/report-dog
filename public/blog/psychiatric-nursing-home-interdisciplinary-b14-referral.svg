<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <rect x="0" y="50" width="800" height="76" fill="white"/>
  <rect x="0" y="50" width="6" height="76" rx="2" fill="#d97706"/>
  <text x="28" y="104" font-size="36" fill="#1e293b" font-weight="700">B1.4 轉介照會：機制文件 vs 執行記錄</text>
  <rect x="28" y="175" width="744" height="130" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="175" width="6" height="130" rx="2" fill="#d97706"/>
  <circle cx="66" cy="235" r="20" fill="#d97706" opacity="0.15"/>
  <text x="66" y="241" font-size="18" fill="#d97706" text-anchor="middle" font-weight="900">SOP</text>
  <text x="100" y="225" font-size="22" fill="#1e293b" font-weight="700">機制文件（SOP）：轉介流程書面化</text>
  <text x="100" y="251" font-size="16" fill="#57534e">何種情況啟動轉介、向哪個專業、誰申請誰審核、如何聯繫</text>
  <text x="100" y="271" font-size="16" fill="#57534e">轉介後的追蹤回報機制：轉介出去的住民後續怎麼追蹤</text>
  <rect x="620" y="183" width="136" height="115" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="234" font-size="16" fill="#d97706" text-anchor="middle">流程</text>
  <text x="688" y="254" font-size="16" fill="#d97706" text-anchor="middle">書面</text>
  <rect x="28" y="325" width="744" height="120" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="325" width="6" height="120" rx="2" fill="#78716c"/>
  <circle cx="66" cy="380" r="20" fill="#78716c" opacity="0.15"/>
  <text x="66" y="386" font-size="18" fill="#78716c" text-anchor="middle" font-weight="900">記錄</text>
  <text x="100" y="370" font-size="22" fill="#1e293b" font-weight="700">執行記錄：每次轉介/照會的書面紀錄</text>
  <text x="100" y="396" font-size="16" fill="#57534e">住民資料、轉介原因、轉介對象、轉介日期、後續追蹤結果</text>
  <text x="100" y="416" font-size="16" fill="#57534e">委員隨機抽查 1-2 位住民的轉介記錄核對完整性</text>
  <rect x="620" y="333" width="136" height="105" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="381" font-size="16" fill="#78716c" text-anchor="middle">每次</text>
  <text x="688" y="401" font-size="16" fill="#78716c" text-anchor="middle">記錄</text>
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
