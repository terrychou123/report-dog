  <text x="688" y="217" font-size="16" fill="#78716c" text-anchor="middle">C區</text>
  <text x="688" y="237" font-size="16" fill="#78716c" text-anchor="middle">必查</text>
  <rect x="28" y="264" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="264" width="6" height="60" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="294" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="300" font-size="14" fill="#57534e" text-anchor="middle" font-weight="900">盲點3</text>
  <text x="100" y="284" font-size="18" fill="#1e293b" font-weight="700">A區人力配置以為符合</text>
  <text x="100" y="305" font-size="16" fill="#57534e">A7-A11五大職類需按法規比例配置，需建立監控機制</text>
  <rect x="620" y="272" width="136" height="44" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="290" font-size="16" fill="#57534e" text-anchor="middle">人力</text>
