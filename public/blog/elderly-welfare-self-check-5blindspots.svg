  <text x="688" y="383" font-size="16" fill="#a8a29e" text-anchor="middle">機制</text>
  <rect x="28" y="410" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="410" width="6" height="60" rx="2" fill="#6b7280"/>
  <circle cx="66" cy="440" r="16" fill="#94a3b8" opacity="0.15"/>
  <text x="66" y="446" font-size="14" fill="#94a3b8" text-anchor="middle" font-weight="900">盲點5</text>
  <text x="100" y="430" font-size="18" fill="#1e293b" font-weight="700">加分題不準備直接放棄</text>
  <text x="100" y="451" font-size="16" fill="#57534e">E2創新服務、F1牙科是可規劃的加分來源</text>
