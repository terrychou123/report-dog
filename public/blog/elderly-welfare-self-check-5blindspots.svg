  <text x="100" y="138" font-size="18" fill="#1e293b" font-weight="700">B區監測記錄只有數字缺分析</text>
  <text x="100" y="159" font-size="16" fill="#57534e">B13-B19七大監測需有PDCA改善記錄，非只填數字</text>
  <rect x="620" y="126" width="136" height="44" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="144" font-size="16" fill="#d97706" text-anchor="middle">缺</text>
  <text x="688" y="164" font-size="16" fill="#d97706" text-anchor="middle">分析</text>
  <rect x="28" y="191" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="191" width="6" height="60" rx="2" fill="#57534e"/>
  <circle cx="66" cy="221" r="16" fill="#78716c" opacity="0.15"/>
