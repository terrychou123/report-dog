  <text x="100" y="211" font-size="18" fill="#1e293b" font-weight="700">C區一級指標假設沒問題</text>
  <text x="100" y="232" font-size="16" fill="#57534e">C1-C6一級必要指標需逐一確認，不可假設無誤</text>
