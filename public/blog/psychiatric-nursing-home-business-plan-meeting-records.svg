<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <rect x="0" y="38" width="800" height="90" fill="#e8e6de"/>
  <rect x="0" y="38" width="6" height="90" rx="2" fill="#d97706"/>
  <text x="28" y="98" font-size="36" fill="#1e293b" font-weight="700">監督/經營團隊定期會議三大要點</text>
  <rect x="28" y="166" width="744" height="90" rx="12" fill="#e8e6de"/>
  <rect x="28" y="166" width="6" height="90" rx="2" fill="#d97706"/>
  <circle cx="66" cy="211" r="20" fill="#d97706" opacity="0.15"/>
  <text x="66" y="217" font-size="18" fill="#d97706" text-anchor="middle" font-weight="900">頻率</text>
  <text x="100" y="210" font-size="28" fill="#1e293b" font-weight="700">定期召開（至少每季或半年一次）</text>
  <text x="100" y="234" font-size="18" fill="#57534e">若只在評鑑前才召開，委員可能質疑會議的真實性</text>
  <rect x="620" y="185" width="136" height="52" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="205" font-size="16" fill="#d97706" text-anchor="middle">定期</text>
  <text x="688" y="225" font-size="16" fill="#d97706" text-anchor="middle">真實</text>
  <rect x="28" y="269" width="744" height="90" rx="12" fill="#e8e6de"/>
  <rect x="28" y="269" width="6" height="90" rx="2" fill="#78716c"/>
  <circle cx="66" cy="314" r="20" fill="#78716c" opacity="0.15"/>
  <text x="66" y="320" font-size="18" fill="#78716c" text-anchor="middle" font-weight="900">記錄</text>
  <text x="100" y="313" font-size="28" fill="#1e293b" font-weight="700">會議記錄格式：日期、人員、議題、決議</text>
  <text x="100" y="337" font-size="18" fill="#57534e">出席人員含姓名和職稱，有討論內容和決議事項，主持人簽名</text>
  <rect x="620" y="288" width="136" height="52" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="308" font-size="16" fill="#78716c" text-anchor="middle">格式</text>
  <text x="688" y="328" font-size="16" fill="#78716c" text-anchor="middle">完整</text>
  <rect x="28" y="372" width="744" height="90" rx="12" fill="#e8e6de"/>
  <rect x="28" y="372" width="6" height="90" rx="2" fill="#57534e"/>
  <circle cx="66" cy="417" r="20" fill="#57534e" opacity="0.15"/>
  <text x="66" y="423" font-size="18" fill="#57534e" text-anchor="middle" font-weight="900">內容</text>
  <text x="100" y="416" font-size="28" fill="#1e293b" font-weight="700">有討論宗旨、願景、目標修訂</text>
  <text x="100" y="440" font-size="18" fill="#57534e">會議議題要包含計畫執行成效檢討和目標調整，非純粹行政報告</text>
  <rect x="620" y="391" width="136" height="52" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="411" font-size="16" fill="#57534e" text-anchor="middle">目標</text>
  <text x="688" y="431" font-size="16" fill="#57534e" text-anchor="middle">討論</text>
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
