<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#f0efe8"/>
  <text x="400" y="48" font-family="'Noto Sans TC', sans-serif" font-size="32" font-weight="700" fill="#1e293b" text-anchor="middle">管理類訪談問題</text>
  <text x="400" y="78" font-family="'Noto Sans TC', sans-serif" font-size="22" fill="#78716c" text-anchor="middle">委員最常問主任（院長）的四類問題與答題方向</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#a8a29e" stroke-width="1.5"/>
  <!-- Q1 -->
  <rect x="40" y="118" width="720" height="72" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <rect x="40" y="118" width="64" height="72" rx="8" fill="#d97706"/>
  <text x="72" y="160" font-family="'Noto Sans TC', sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">A3</text>
  <text x="125" y="144" font-family="'Noto Sans TC', sans-serif" font-size="15" font-weight="700" fill="#d97706">Q：今年年度業務計畫重點是什麼？執行現況如何？</text>
  <text x="125" y="170" font-family="'Noto Sans TC', sans-serif" font-size="14" fill="#57534e">答：說明計畫訂定時間（前一年度）、重點項目、目前執行進度與具體績效</text>
  <!-- Q2 -->
  <rect x="40" y="204" width="720" height="72" rx="8" fill="#ffffff" stroke="#78716c" stroke-width="1.5"/>
  <rect x="40" y="204" width="64" height="72" rx="8" fill="#78716c"/>
  <text x="72" y="246" font-family="'Noto Sans TC', sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">A6</text>
  <text x="125" y="230" font-family="'Noto Sans TC', sans-serif" font-size="15" font-weight="700" fill="#78716c">Q：最近一次發生緊急事件是什麼？如何處理的？</text>
  <text x="125" y="256" font-family="'Noto Sans TC', sans-serif" font-size="14" fill="#57534e">答：依危機管理計畫說明處理程序、分析報告與半年定期檢討機制</text>
  <!-- Q3 -->
  <rect x="40" y="290" width="720" height="72" rx="8" fill="#ffffff" stroke="#57534e" stroke-width="1.5"/>
  <rect x="40" y="290" width="64" height="72" rx="8" fill="#57534e"/>
  <text x="72" y="332" font-family="'Noto Sans TC', sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">A7</text>
  <text x="125" y="316" font-family="'Noto Sans TC', sans-serif" font-size="15" font-weight="700" fill="#57534e">Q：您如何實際參與機構的照護品質管理？</text>
  <text x="125" y="342" font-family="'Noto Sans TC', sans-serif" font-size="14" fill="#57534e">答：具體說明品質會議主持頻率、服務紀錄抽查、與護理長社工的定期溝通</text>
  <!-- Q4 -->
  <rect x="40" y="376" width="720" height="72" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="40" y="376" width="64" height="72" rx="8" fill="#94a3b8"/>
  <text x="72" y="418" font-family="'Noto Sans TC', sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">A4</text>
  <text x="125" y="402" font-family="'Noto Sans TC', sans-serif" font-size="15" font-weight="700" fill="#94a3b8">Q：過去 4 年主管機關查核有無缺失？如何改善？</text>
  <text x="125" y="428" font-family="'Noto Sans TC', sans-serif" font-size="14" fill="#57534e">答：說明各機關查核記錄、缺失改善率（達 100% 才計 A 分）、改善佐證文件</text>
  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" font-family="'Noto Sans TC', sans-serif">報告汪 reportwang.com</text>
</svg>
