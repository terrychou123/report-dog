<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 右側裝飾區塊 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>

  <!-- 右側大文字 A2.3 -->
  <text x="1010" y="192" font-size="120" font-weight="900" fill="#d97706" text-anchor="middle" opacity="0.85">A2.3</text>
  <text x="1010" y="234" font-size="26" fill="#78716c" text-anchor="middle" font-weight="600">品質管理機制</text>

  <!-- 右側 PDCA 四象限 -->
  <rect x="840" y="258" width="152" height="88" rx="10" fill="#d97706" opacity="0.15" stroke="#e8e5de" stroke-width="1"/>
  <text x="916" y="293" font-size="30" fill="#d97706" text-anchor="middle" font-weight="900">P</text>
  <text x="916" y="323" font-size="21" fill="#78716c" text-anchor="middle">計畫</text>

  <rect x="1008" y="258" width="152" height="88" rx="10" fill="#16a34a" opacity="0.12" stroke="#e8e5de" stroke-width="1"/>
  <text x="1084" y="293" font-size="30" fill="#16a34a" text-anchor="middle" font-weight="900">D</text>
  <text x="1084" y="323" font-size="21" fill="#78716c" text-anchor="middle">執行</text>

  <rect x="840" y="356" width="152" height="88" rx="10" fill="#2563eb" opacity="0.10" stroke="#e8e5de" stroke-width="1"/>
  <text x="916" y="391" font-size="30" fill="#2563eb" text-anchor="middle" font-weight="900">C</text>
  <text x="916" y="421" font-size="21" fill="#78716c" text-anchor="middle">確認</text>

  <rect x="1008" y="356" width="152" height="88" rx="10" fill="#7c3aed" opacity="0.10" stroke="#e8e5de" stroke-width="1"/>
  <text x="1084" y="391" font-size="30" fill="#7c3aed" text-anchor="middle" font-weight="900">A</text>
  <text x="1084" y="421" font-size="21" fill="#78716c" text-anchor="middle">標準化</text>

  <!-- 右側品質指標 -->
  <rect x="840" y="454" width="320" height="52" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="1000" y="490" font-size="24" fill="#d97706" text-anchor="middle" font-weight="700">6 項品質指標季報</text>

  <rect x="840" y="513" width="320" height="52" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="1000" y="545" font-size="22" fill="#57534e" text-anchor="middle">指標→分析→改善→追蹤</text>

  <rect x="840" y="572" width="320" height="44" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="1000" y="600" font-size="20" fill="#57534e" text-anchor="middle">含滿意度調查</text>

  <!-- 左側主標題 -->
  <text x="60" y="158" font-size="96" font-weight="900" fill="#1e293b">PDCA</text>
  <text x="60" y="266" font-size="96" font-weight="900" fill="#d97706">品質持續改善</text>

  <line x1="60" y1="298" x2="780" y2="298" stroke="#dedad3" stroke-width="2"/>

  <text x="60" y="344" font-size="34" fill="#57534e" font-weight="400">A2.3 · 讓評鑑準備成為日常管理的一部分</text>

  <!-- 特色標籤列 -->
  <rect x="60" y="372" width="178" height="52" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="149" y="404" font-size="26" fill="#d97706" text-anchor="middle" font-weight="600">指標分析</text>

  <rect x="250" y="372" width="178" height="52" rx="10" fill="#16a34a" opacity="0.10"/>
  <text x="339" y="404" font-size="26" fill="#16a34a" text-anchor="middle" font-weight="600">改善行動</text>

  <rect x="440" y="372" width="178" height="52" rx="10" fill="#78716c" opacity="0.12"/>
  <text x="529" y="404" font-size="26" fill="#78716c" text-anchor="middle" font-weight="600">成效追蹤</text>

  <!-- 適用對象 -->
  <text x="60" y="458" font-size="28" fill="#94a3b8">品管負責人 · 護理主管 · 機構負責人</text>

  <!-- 底部說明 -->
  <text x="60" y="506" font-size="30" fill="#57534e" font-weight="500">評鑑委員不只看數字，更看改善行動和成效追蹤</text>
  <text x="60" y="544" font-size="26" fill="#a8a29e">每季 PDCA 循環，讓品質管理從應付變成資產</text>

  <!-- 浮水印 -->
  <text x="780" y="592" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
