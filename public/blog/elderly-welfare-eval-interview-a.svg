<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <rect x="0" y="0" width="800" height="90" fill="#1e293b"/>
  <text x="400" y="44" font-size="22" font-weight="700" fill="#ffffff"  text-anchor="middle">A 區常見訪談問題</text>
  <text x="400" y="72" font-size="15" fill="#94a3b8"  text-anchor="middle">經營管理效能・行政主管負責應答</text>

  <!-- N=4，Row y: 160/235/310/385，H=62，outer_gap=50 -->

  <!-- Row 1 -->
  <rect x="29" y="148" width="742" height="62" rx="6" fill="#ffffff"/>
  <rect x="29" y="148" width="6" height="62" rx="2" fill="#d97706"/>
  <circle cx="66" cy="179" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="184" font-size="14" font-weight="700" fill="#d97706"  text-anchor="middle">A1</text>
  <text x="100" y="170" font-size="15" font-weight="700" fill="#1e293b" >工作手冊多久修訂一次？上次改了哪些內容？</text>
  <text x="100" y="193" font-size="16" fill="#57534e" >備答：說出最近修訂日期與具體內容，能即時調出修訂紀錄</text>
  <rect x="620" y="161" width="136" height="36" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="184" font-size="14" font-weight="700" fill="#d97706"  text-anchor="middle">每年>=1次</text>

  <!-- Row 2 -->
  <rect x="29" y="223" width="742" height="62" rx="6" fill="#ffffff"/>
  <rect x="29" y="223" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="66" cy="254" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="259" font-size="14" font-weight="700" fill="#78716c"  text-anchor="middle">A11</text>
  <text x="100" y="245" font-size="15" font-weight="700" fill="#1e293b" >外籍看護工與本國照服員比例如何？</text>
  <text x="100" y="268" font-size="16" fill="#57534e" >備答：立即說出總人數、外籍人數、比例，備妥人力配置表</text>
  <rect x="620" y="236" width="136" height="36" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="259" font-size="14" font-weight="700" fill="#78716c"  text-anchor="middle">外籍≤1/2</text>

  <!-- Row 3 -->
  <rect x="29" y="298" width="742" height="62" rx="6" fill="#ffffff"/>
  <rect x="29" y="298" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="66" cy="329" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="334" font-size="14" font-weight="700" fill="#57534e"  text-anchor="middle">A13</text>
  <text x="100" y="320" font-size="15" font-weight="700" fill="#1e293b" >新進員工職前訓練如何安排？有哪些必要課程？</text>
  <text x="100" y="343" font-size="16" fill="#57534e" >備答：到職1個月內16小時，含感染管制4h、個案權益2h</text>
  <rect x="620" y="311" width="136" height="36" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="334" font-size="14" font-weight="700" fill="#57534e"  text-anchor="middle">1月內16h</text>

  <!-- Row 4 -->
  <rect x="29" y="373" width="742" height="62" rx="6" fill="#ffffff"/>
  <rect x="29" y="373" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="404" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="409" font-size="14" font-weight="700" fill="#a8a29e"  text-anchor="middle">A4</text>
  <text x="100" y="395" font-size="15" font-weight="700" fill="#1e293b" >查核缺失改善情形如何？有影響最終等級嗎？</text>
  <text x="100" y="418" font-size="16" fill="#57534e" >備答：近4年查核無缺失，或缺失已全數改善（改善率100%）</text>
  <rect x="620" y="386" width="136" height="36" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="409" font-size="14" font-weight="700" fill="#a8a29e"  text-anchor="middle">二級加強</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" >報告汪 reportwang.com</text>
</svg>
