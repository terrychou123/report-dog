<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">數位化前後對比</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">傳統手工文書 vs. 數位化工作模式</text>
  <line x1="28" y1="94" x2="772" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- 中央分隔線 -->
  <line x1="400" y1="100" x2="400" y2="450" stroke="#dedad3" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- 左欄標題：傳統方式 -->
  <rect x="40" y="106" width="340" height="52" rx="8" fill="#a8a29e" opacity="0.2"/>
  <text x="210" y="138" text-anchor="middle" font-size="24" fill="#78716c" font-weight="700">傳統手工方式</text>

  <!-- 右欄標題：數位化方式 -->
  <rect x="420" y="106" width="340" height="52" rx="8" fill="#d97706" opacity="0.15"/>
  <text x="590" y="138" text-anchor="middle" font-size="24" fill="#d97706" font-weight="700">數位化方式</text>

  <!-- 項目 1：照護計畫 -->
  <rect x="40" y="170" width="340" height="56" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="60" y="196" font-size="18" fill="#78716c" font-weight="700">照護計畫撰寫</text>
  <text x="60" y="216" font-size="16" fill="#57534e">從頭手打，每份 30–60 分鐘</text>

  <rect x="420" y="170" width="340" height="56" rx="8" fill="white" stroke="#d97706" stroke-width="1"/>
  <text x="440" y="196" font-size="18" fill="#d97706" font-weight="700">AI 生成初稿</text>
  <text x="440" y="216" font-size="16" fill="#57534e">輸入評估→初稿 5 分鐘，修改 5 分鐘</text>

  <!-- 項目 2：訓練記錄 -->
  <rect x="40" y="238" width="340" height="56" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="60" y="264" font-size="18" fill="#78716c" font-weight="700">訓練出席簽名</text>
  <text x="60" y="284" font-size="16" fill="#57534e">逐一收集紙本，掃描存檔費時</text>

  <rect x="420" y="238" width="340" height="56" rx="8" fill="white" stroke="#d97706" stroke-width="1"/>
  <text x="440" y="264" font-size="18" fill="#d97706" font-weight="700">電子簽名即時收集</text>
  <text x="440" y="284" font-size="16" fill="#57534e">手機點選，時數自動累計追蹤</text>

  <!-- 項目 3：品質統計 -->
  <rect x="40" y="306" width="340" height="56" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="60" y="332" font-size="18" fill="#78716c" font-weight="700">品質指標統計</text>
  <text x="60" y="352" font-size="16" fill="#57534e">翻查記錄，人工逐筆計算，易出錯</text>

  <rect x="420" y="306" width="340" height="56" rx="8" fill="white" stroke="#d97706" stroke-width="1"/>
  <text x="440" y="332" font-size="18" fill="#d97706" font-weight="700">自動統計匯出</text>
  <text x="440" y="352" font-size="16" fill="#57534e">事件記錄自動計算發生率</text>

  <!-- 項目 4：評鑑前查核 -->
  <rect x="40" y="374" width="340" height="56" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="60" y="400" font-size="18" fill="#78716c" font-weight="700">評鑑前文件核查</text>
  <text x="60" y="420" font-size="16" fill="#57534e">逐條人工核對，容易遺漏缺失</text>

  <rect x="420" y="374" width="340" height="56" rx="8" fill="white" stroke="#d97706" stroke-width="1"/>
  <text x="440" y="400" font-size="18" fill="#d97706" font-weight="700">AI 自動比對缺失</text>
  <text x="440" y="420" font-size="16" fill="#57534e">上傳文件→秒出缺失清單</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
