<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 右側裝飾區塊 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>

  <!-- 右側大數字 -->
  <text x="1010" y="240" font-size="180" font-weight="900" fill="#d97706" text-anchor="middle" opacity="0.85">75</text>
  <text x="1010" y="280" font-size="28" fill="#78716c" text-anchor="middle" font-weight="600">項評鑑指標</text>

  <!-- 右側 2×2 資訊卡片 row1 y=305 row2 y=400 h=86 -->
  <rect x="840" y="305" width="155" height="80" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="918" y="341" font-size="28" fill="#d97706" text-anchor="middle" font-weight="700">9 項</text>
  <text x="918" y="369" font-size="20" fill="#a8a29e" text-anchor="middle">一級必要</text>

  <rect x="1005" y="305" width="155" height="80" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="1083" y="341" font-size="28" fill="#78716c" text-anchor="middle" font-weight="700">8 項</text>
  <text x="1083" y="369" font-size="20" fill="#a8a29e" text-anchor="middle">二級加強</text>

  <rect x="840" y="398" width="155" height="80" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="918" y="434" font-size="28" fill="#57534e" text-anchor="middle" font-weight="700">5 大</text>
  <text x="918" y="462" font-size="20" fill="#a8a29e" text-anchor="middle">評鑑區塊</text>

  <rect x="1005" y="398" width="155" height="80" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="1083" y="434" font-size="28" fill="#a8a29e" text-anchor="middle" font-weight="700">4年</text>
  <text x="1083" y="462" font-size="20" fill="#a8a29e" text-anchor="middle">評鑑週期</text>

  <!-- 右側底部標籤 -->
  <rect x="840" y="494" width="320" height="50" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="1000" y="528" font-size="26" fill="#d97706" text-anchor="middle" font-weight="700">114年度臺北市評鑑基準</text>

  <!-- 左側主內容區 -->
  <text x="60" y="200" font-size="120" font-weight="900" fill="#1e293b">住宿型機構</text>
  <text x="60" y="335" font-size="120" font-weight="900" fill="#d97706">評鑑攻略</text>

  <line x1="60" y1="365" x2="780" y2="365" stroke="#dedad3" stroke-width="2"/>

  <text x="60" y="412" font-size="38" fill="#57534e" font-weight="400">5 大區塊完整解析，快速掌握備審重點</text>

  <!-- 標籤列 -->
  <rect x="60" y="448" width="168" height="50" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="144" y="482" font-size="26" fill="#d97706" text-anchor="middle" font-weight="600">AI 自我查核</text>

  <rect x="242" y="448" width="148" height="50" rx="10" fill="#78716c" opacity="0.12"/>
  <text x="316" y="482" font-size="26" fill="#78716c" text-anchor="middle" font-weight="600">75 項全解析</text>

  <rect x="404" y="448" width="148" height="50" rx="10" fill="#57534e" opacity="0.12"/>
  <text x="478" y="482" font-size="26" fill="#57534e" text-anchor="middle" font-weight="600">備審指引</text>

  <!-- 適用對象說明 -->
  <text x="60" y="552" font-size="28" fill="#94a3b8">適用：護理之家、長期照顧機構、養護機構、安養機構</text>

  <!-- 浮水印 -->
  <text x="1140" y="590" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
