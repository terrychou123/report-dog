<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 右側裝飾區塊 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6dc"/>
  <!-- 右側 2.12 + 試2.13 -->
  <text x="1010" y="195" font-size="110" fill="#16a34a" text-anchor="middle" font-weight="700" opacity="0.85">2.12</text>
  <!-- PFM 標籤 -->
  <rect x="880" y="220" width="260" height="40" rx="8" fill="#16a34a" opacity="0.12"/>
  <text x="1010" y="247" font-size="20" fill="#16a34a" text-anchor="middle" font-weight="700">PFM 訪談項目</text>
  <line x1="870" y1="280" x2="1150" y2="280" stroke="#dedad3" stroke-width="1.5"/>
  <!-- 試評 2.13 -->
  <text x="1010" y="360" font-size="90" fill="#0d9488" text-anchor="middle" font-weight="700" opacity="0.75">試2.13</text>
  <rect x="880" y="385" width="260" height="40" rx="8" fill="#0d9488" opacity="0.12"/>
  <text x="1010" y="412" font-size="20" fill="#0d9488" text-anchor="middle" font-weight="700">試評（不計分）</text>
  <text x="1010" y="472" font-size="18" fill="#57534e" text-anchor="middle">社區融合 ＋ 社會參與</text>
  <!-- 左側主要內容 -->
  <rect x="60" y="60" width="160" height="38" rx="19" fill="#16a34a" opacity="0.12"/>
  <text x="140" y="85" font-size="18" fill="#16a34a" text-anchor="middle" font-weight="700">復健服務</text>
  <!-- 主標題 -->
  <text x="60" y="185" font-size="76" fill="#1e293b" font-weight="700">社區融合</text>
  <text x="60" y="275" font-size="76" fill="#16a34a" font-weight="700">社會參與</text>
  <!-- 分隔線 -->
  <line x1="60" y1="305" x2="760" y2="305" stroke="#dedad3" stroke-width="2"/>
  <!-- 副標題 -->
  <text x="60" y="352" font-size="28" fill="#57534e">2.12 PFM 訪談：真實外出 ＋ 紀錄</text>
  <text x="60" y="392" font-size="26" fill="#57534e">試評 2.13 社會參與實務推動方法</text>
  <!-- 標籤 Pills -->
  <rect x="60" y="440" width="120" height="36" rx="18" fill="#16a34a" opacity="0.12"/>
  <text x="120" y="463" font-size="16" fill="#16a34a" text-anchor="middle" font-weight="600">PFM訪談</text>
  <rect x="194" y="440" width="120" height="36" rx="18" fill="#0d9488" opacity="0.12"/>
  <text x="254" y="463" font-size="16" fill="#0d9488" text-anchor="middle" font-weight="600">試評2.13</text>
  <rect x="328" y="440" width="128" height="36" rx="18" fill="#16a34a" opacity="0.12"/>
  <text x="392" y="463" font-size="16" fill="#16a34a" text-anchor="middle" font-weight="600">外出紀錄</text>
  <rect x="470" y="440" width="148" height="36" rx="18" fill="#78716c" opacity="0.12"/>
  <text x="544" y="463" font-size="16" fill="#78716c" text-anchor="middle" font-weight="600">115年度評鑑</text>
  <!-- 浮水印 -->
  <text x="1140" y="610" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
