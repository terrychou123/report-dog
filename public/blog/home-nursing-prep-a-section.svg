  <text x="100" y="378" font-size="16" fill="#57534e">生命徵象惡化、跌倒、造廔口異常、管路異常處理辦法</text>
  <rect x="620" y="345" width="136" height="44" rx="8" fill="#a8a29e" opacity="0.12"/>
