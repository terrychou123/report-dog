  <text x="100" y="138" font-size="20" fill="#1e293b" font-weight="700">社區資源盤點與運用</text>
  <text x="100" y="159" font-size="16" fill="#57534e">資源清單年度更新 + 轉介記錄 + 接受社區轉介機制</text>
