<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- Header y=50, h=76 -->
  <rect x="30" y="50" width="740" height="76" rx="8" fill="#1e293b"/>
  <text x="400" y="84" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="sans-serif">報告汪如何輔助 90 天評鑑準備</text>
  <text x="400" y="112" font-size="15" fill="#94a3b8" text-anchor="middle" font-family="sans-serif">四大核心功能，讓準備工作更有效率、更有條理</text>

  <!-- Row1 y=160, h=62 -->
  <rect x="30" y="160" width="740" height="62" rx="6" fill="#ffffff"/>
  <rect x="30" y="160" width="6" height="62" rx="3" fill="#d97706"/>
  <circle cx="66" cy="191" r="16" fill="#d97706"/>
  <text x="66" y="196" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="sans-serif">AI</text>
  <text x="100" y="180" font-size="19" font-weight="700" fill="#1e293b" font-family="sans-serif">AI 查核：一鍵掃描 77 項，自動找出缺失</text>
  <text x="100" y="200" font-size="15" fill="#57534e" font-family="sans-serif">輸入現況資料後，AI 依評鑑指標逐項比對，紅燈項目即時列出</text>
  <rect x="620" y="169" width="136" height="44" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="688" y="188" font-size="13" fill="#d97706" text-anchor="middle" font-family="sans-serif">適用時機</text>
  <text x="688" y="206" font-size="13" fill="#92400e" text-anchor="middle" font-family="sans-serif">第 1 週盤點</text>

  <!-- Row2 y=235, h=62 -->
  <rect x="30" y="235" width="740" height="62" rx="6" fill="#ffffff"/>
  <rect x="30" y="235" width="6" height="62" rx="3" fill="#78716c"/>
  <circle cx="66" cy="266" r="16" fill="#78716c"/>
  <text x="66" y="271" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="sans-serif">TR</text>
  <text x="100" y="255" font-size="19" font-weight="700" fill="#1e293b" font-family="sans-serif">定期追蹤：設定指標任務，到期自動提醒</text>
  <text x="100" y="275" font-size="15" fill="#57534e" font-family="sans-serif">為每個補強項目設定截止日，系統追蹤進度並發送提醒通知</text>
  <rect x="620" y="244" width="136" height="44" rx="6" fill="#f5f5f4" stroke="#78716c" stroke-width="1.5"/>
  <text x="688" y="263" font-size="13" fill="#78716c" text-anchor="middle" font-family="sans-serif">適用時機</text>
  <text x="688" y="281" font-size="13" fill="#44403c" text-anchor="middle" font-family="sans-serif">全 12 週持續</text>

  <!-- Row3 y=310, h=62 -->
  <rect x="30" y="310" width="740" height="62" rx="6" fill="#ffffff"/>
  <rect x="30" y="310" width="6" height="62" rx="3" fill="#57534e"/>
  <circle cx="66" cy="341" r="16" fill="#57534e"/>
  <text x="66" y="346" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="sans-serif">TM</text>
  <text x="100" y="330" font-size="19" font-weight="700" fill="#1e293b" font-family="sans-serif">協作分工：標記負責人，跨部門同步進度</text>
  <text x="100" y="350" font-size="15" fill="#57534e" font-family="sans-serif">社工、護理、照服、行政各自看到自己的任務，減少漏漏球</text>
  <rect x="620" y="319" width="136" height="44" rx="6" fill="#f0efe8" stroke="#57534e" stroke-width="1.5"/>
  <text x="688" y="338" font-size="13" fill="#57534e" text-anchor="middle" font-family="sans-serif">適用時機</text>
  <text x="688" y="356" font-size="13" fill="#44403c" text-anchor="middle" font-family="sans-serif">第 9 週分工</text>

  <!-- Row4 y=385, h=62 -->
  <rect x="30" y="385" width="740" height="62" rx="6" fill="#ffffff"/>
  <rect x="30" y="385" width="6" height="62" rx="3" fill="#a8a29e"/>
  <circle cx="66" cy="416" r="16" fill="#a8a29e"/>
  <text x="66" y="421" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="sans-serif">DC</text>
  <text x="100" y="405" font-size="19" font-weight="700" fill="#1e293b" font-family="sans-serif">文件管理：集中存放，評鑑當天快速調閱</text>
  <text x="100" y="425" font-size="15" fill="#57534e" font-family="sans-serif">所有評鑑文件統一上傳，依指標分類，委員要什麼立即找到</text>
  <rect x="620" y="394" width="136" height="44" rx="6" fill="#f5f5f4" stroke="#a8a29e" stroke-width="1.5"/>
  <text x="688" y="413" font-size="13" fill="#78716c" text-anchor="middle" font-family="sans-serif">適用時機</text>
  <text x="688" y="431" font-size="13" fill="#44403c" text-anchor="middle" font-family="sans-serif">第 12 週衝刺</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" font-family="sans-serif">報告汪 reportwang.com</text>
</svg>
