<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- Header y=50, h=76 -->
  <rect x="30" y="50" width="740" height="76" rx="8" fill="#1e293b"/>
  <text x="400" y="84" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">報告汪如何輔助 90 天評鑑準備</text>
  <text x="400" y="112" font-size="15" fill="#94a3b8" text-anchor="middle">四大核心功能，讓準備工作更有效率、更有條理</text>

  <!-- Row1 y=160, h=62 -->
  <rect x="28" y="160" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="160" width="6" height="62" rx="2" fill="#d97706"/>
  <circle cx="66" cy="191" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="197" font-size="16" font-weight="900" fill="#d97706" text-anchor="middle">AI</text>
  <text x="100" y="188" font-size="18" font-weight="700" fill="#1e293b">AI 查核：一鍵掃描 77 項，自動找出缺失</text>
  <text x="100" y="208" font-size="16" fill="#57534e">輸入現況資料後，AI 依評鑑指標逐項比對，紅燈項目即時列出</text>
  <rect x="620" y="168" width="136" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="187" font-size="16" fill="#d97706" text-anchor="middle">適用時機</text>
  <text x="688" y="207" font-size="16" fill="#d97706" text-anchor="middle">第 1 週盤點</text>

  <!-- Row2 y=235, h=62 -->
  <rect x="28" y="235" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="235" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="66" cy="266" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="272" font-size="16" font-weight="900" fill="#78716c" text-anchor="middle">TR</text>
  <text x="100" y="263" font-size="18" font-weight="700" fill="#1e293b">定期追蹤：設定指標任務，到期自動提醒</text>
  <text x="100" y="283" font-size="16" fill="#57534e">為每個補強項目設定截止日，系統追蹤進度並發送提醒通知</text>
  <rect x="620" y="243" width="136" height="46" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="262" font-size="16" fill="#78716c" text-anchor="middle">適用時機</text>
  <text x="688" y="282" font-size="16" fill="#78716c" text-anchor="middle">全 12 週持續</text>

  <!-- Row3 y=310, h=62 -->
  <rect x="28" y="310" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="310" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="66" cy="341" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="347" font-size="16" font-weight="900" fill="#57534e" text-anchor="middle">TM</text>
  <text x="100" y="338" font-size="18" font-weight="700" fill="#1e293b">協作分工：標記負責人，跨部門同步進度</text>
  <text x="100" y="358" font-size="16" fill="#57534e">社工、護理、照服、行政各自看到自己的任務，減少漏漏球</text>
  <rect x="620" y="318" width="136" height="46" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="337" font-size="16" fill="#57534e" text-anchor="middle">適用時機</text>
  <text x="688" y="357" font-size="16" fill="#57534e" text-anchor="middle">第 9 週分工</text>

  <!-- Row4 y=385, h=62 -->
  <rect x="28" y="385" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="385" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="416" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="422" font-size="16" font-weight="900" fill="#a8a29e" text-anchor="middle">DC</text>
  <text x="100" y="413" font-size="18" font-weight="700" fill="#1e293b">文件管理：集中存放，評鑑當天快速調閱</text>
  <text x="100" y="433" font-size="16" fill="#57534e">所有評鑑文件統一上傳，依指標分類，委員要什麼立即找到</text>
  <rect x="620" y="393" width="136" height="46" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="412" font-size="16" fill="#a8a29e" text-anchor="middle">適用時機</text>
  <text x="688" y="432" font-size="16" fill="#a8a29e" text-anchor="middle">第 12 週衝刺</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
