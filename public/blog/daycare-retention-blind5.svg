<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="450" fill="#f0efe8"/>
  <text x="400" y="46" font-size="21" font-weight="700" fill="#1e293b" text-anchor="middle">盲點 5：健康管理制度不完善（第 32 條）</text>
  <rect x="60" y="58" width="48" height="3" rx="1.5" fill="#d97706"/>
  <line x1="116" y1="59.5" x2="740" y2="59.5" stroke="#dedad3" stroke-width="1"/>

  <!-- Top: Requirements -->
  <rect x="52" y="82" width="696" height="86" rx="12" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="52" y="82" width="696" height="5" rx="2.5" fill="#d97706"/>
  <text x="76" y="108" font-size="13" font-weight="700" fill="#1e293b">第 32 條健檢要求</text>
  <text x="76" y="130" font-size="12" fill="#64748b">新進人員：到職前健檢（胸部X光、血液常規、尿液、B型肝炎表面抗原及抗體）</text>
  <text x="76" y="152" font-size="12" fill="#64748b">在職人員：每年定期健檢 ｜ 醫師判讀核章 ｜ 效期 6 個月</text>

  <!-- Bottom: 3 action items -->
  <!-- Action 1 -->
  <rect x="52" y="182" width="210" height="210" rx="12" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="52" y="182" width="210" height="5" rx="2.5" fill="#d97706"/>
  <text x="157" y="212" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">建立追蹤清單</text>
  <line x1="68" y1="224" x2="246" y2="224" stroke="#f0ede6" stroke-width="1"/>
  <text x="72" y="248" font-size="12" fill="#64748b">□ 每位員工健檢日期</text>
  <text x="72" y="270" font-size="12" fill="#64748b">□ 健檢結果摘要</text>
  <text x="72" y="292" font-size="12" fill="#64748b">□ 有無異常值</text>
  <text x="72" y="314" font-size="12" fill="#64748b">□ 後續追蹤狀況</text>
  <text x="72" y="336" font-size="11" fill="#d97706" font-weight="600">到期提醒機制</text>
  <text x="72" y="356" font-size="11" fill="#78716c">提前一個月通知</text>

  <!-- Action 2 -->
  <rect x="295" y="182" width="210" height="210" rx="12" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="295" y="182" width="210" height="5" rx="2.5" fill="#78716c"/>
  <text x="400" y="212" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">異常值處理</text>
  <line x1="311" y1="224" x2="489" y2="224" stroke="#f0ede6" stroke-width="1"/>
  <text x="311" y="248" font-size="12" fill="#64748b">健檢有異常值</text>
  <text x="311" y="268" font-size="12" fill="#64748b">→ 建立輔導紀錄</text>
  <text x="311" y="288" font-size="12" fill="#64748b">→ 告知結果</text>
  <text x="311" y="308" font-size="12" fill="#64748b">→ 協助就醫建議</text>
  <line x1="311" y1="326" x2="489" y2="326" stroke="#f0ede6" stroke-width="1"/>
  <text x="311" y="348" font-size="11" fill="#dc2626">注意：B型肝炎帶原</text>
  <text x="311" y="368" font-size="11" fill="#dc2626">不得作為解僱事由</text>

  <!-- Action 3 -->
  <rect x="538" y="182" width="210" height="210" rx="12" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="538" y="182" width="210" height="5" rx="2.5" fill="#a8a29e"/>
  <text x="643" y="212" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">建立關懷文化</text>
  <line x1="554" y1="224" x2="732" y2="224" stroke="#f0ede6" stroke-width="1"/>
  <text x="554" y="248" font-size="12" fill="#64748b">主動提醒健檢到期</text>
  <text x="554" y="268" font-size="12" fill="#64748b">主任代為預約健檢</text>
  <text x="554" y="288" font-size="12" fill="#64748b">員工感受到被關心</text>
  <line x1="554" y1="308" x2="732" y2="308" stroke="#f0ede6" stroke-width="1"/>
  <text x="554" y="330" font-size="12" fill="#d97706" font-weight="600">健康管理 = 關懷</text>
  <text x="554" y="350" font-size="12" fill="#78716c">而不是催繳文件</text>
  <text x="554" y="370" font-size="11" fill="#78716c">歸屬感自然不同</text>

  <text x="760" y="421" font-size="16" fill="#c4bfb8" text-anchor="end" font-weight="400" font-family="'Noto Sans TC', sans-serif">報告汪 reportwang.com</text>
</svg>
