<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#f0f9ff"/>
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9"/>
      <stop offset="100%" style="stop-color:#0284c7"/>
    </linearGradient>
    <linearGradient id="card2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="card3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="360" fill="url(#bg)"/>

  <!-- 標題 -->
  <text x="400" y="38" font-family="sans-serif" font-size="20" fill="#1e293b" text-anchor="middle" font-weight="bold">15 大問題分三類，對症下藥備評鑑</text>
  <rect x="330" y="46" width="140" height="3" rx="1.5" fill="#0ea5e9"/>

  <!-- ===== 卡片 1：制度類 ===== -->
  <rect x="30" y="62" width="228" height="276" rx="16" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <!-- 頂部色塊 -->
  <rect x="30" y="62" width="228" height="80" rx="16" fill="url(#card1)"/>
  <rect x="30" y="122" width="228" height="20" fill="url(#card1)"/>
  <!-- 類別圖示 -->
  <circle cx="80" cy="95" r="22" fill="white" opacity="0.2"/>
  <text x="80" y="103" font-family="sans-serif" font-size="22" text-anchor="middle">🏛</text>
  <!-- 標題文字 -->
  <text x="144" y="93" font-family="sans-serif" font-size="19" fill="white" text-anchor="middle" font-weight="bold">制度類問題</text>
  <text x="144" y="116" font-family="sans-serif" font-size="11" fill="#bae6fd" text-anchor="middle">Policy Questions · Q1-Q5</text>
  <!-- 說明 -->
  <text x="144" y="158" font-family="sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">評鑑幾年一次？</text>
  <text x="144" y="175" font-family="sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">委員如何組成？</text>

  <!-- 5 個問題點 -->
  <rect x="50" y="194" width="188" height="32" rx="8" fill="#f0f9ff"/>
  <circle cx="68" cy="210" r="8" fill="#0ea5e9"/>
  <text x="68" y="214" font-family="sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="bold">Q1</text>
  <text x="84" y="214" font-family="sans-serif" font-size="11.5" fill="#1e293b">評鑑週期與頻率</text>

  <rect x="50" y="232" width="188" height="32" rx="8" fill="#f0f9ff"/>
  <circle cx="68" cy="248" r="8" fill="#0ea5e9"/>
  <text x="68" y="252" font-family="sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="bold">Q2</text>
  <text x="84" y="252" font-family="sans-serif" font-size="11.5" fill="#1e293b">委員資格組成</text>

  <rect x="50" y="270" width="188" height="32" rx="8" fill="#f0f9ff"/>
  <circle cx="68" cy="286" r="8" fill="#0ea5e9"/>
  <text x="68" y="290" font-family="sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="bold">Q3</text>
  <text x="84" y="290" font-family="sans-serif" font-size="11.5" fill="#1e293b">評鑑結果等級</text>

  <rect x="50" y="308" width="188" height="32" rx="8" fill="#f8fafc"/>
  <circle cx="68" cy="324" r="8" fill="#94a3b8"/>
  <text x="68" y="328" font-family="sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="bold">Q4</text>
  <text x="84" y="328" font-family="sans-serif" font-size="11.5" fill="#64748b">申覆與複評機制</text>

  <text x="144" y="344" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">...及更多制度問題</text>

  <!-- ===== 卡片 2：文件類 ===== -->
  <rect x="286" y="62" width="228" height="276" rx="16" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="286" y="62" width="228" height="80" rx="16" fill="url(#card2)"/>
  <rect x="286" y="122" width="228" height="20" fill="url(#card2)"/>
  <circle cx="336" cy="95" r="22" fill="white" opacity="0.2"/>
  <text x="336" y="103" font-family="sans-serif" font-size="22" text-anchor="middle">📋</text>
  <text x="400" y="93" font-family="sans-serif" font-size="19" fill="white" text-anchor="middle" font-weight="bold">文件類問題</text>
  <text x="400" y="116" font-family="sans-serif" font-size="11" fill="#a7f3d0" text-anchor="middle">Document Questions · Q6-Q10</text>
  <text x="400" y="158" font-family="sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">哪些文件必備？</text>
  <text x="400" y="175" font-family="sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">格式有無規定？</text>

  <rect x="306" y="194" width="188" height="32" rx="8" fill="#f0fdf4"/>
  <circle cx="324" cy="210" r="8" fill="#10b981"/>
  <text x="324" y="214" font-family="sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="bold">Q6</text>
  <text x="340" y="214" font-family="sans-serif" font-size="11.5" fill="#1e293b">必備文件清單</text>

  <rect x="306" y="232" width="188" height="32" rx="8" fill="#f0fdf4"/>
  <circle cx="324" cy="248" r="8" fill="#10b981"/>
  <text x="324" y="252" font-family="sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="bold">Q7</text>
  <text x="340" y="252" font-family="sans-serif" font-size="11.5" fill="#1e293b">照顧計畫書格式</text>

  <rect x="306" y="270" width="188" height="32" rx="8" fill="#f0fdf4"/>
  <circle cx="324" cy="286" r="8" fill="#10b981"/>
  <text x="324" y="290" font-family="sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="bold">Q8</text>
  <text x="340" y="290" font-family="sans-serif" font-size="11.5" fill="#1e293b">保存年限規定</text>

  <rect x="306" y="308" width="188" height="32" rx="8" fill="#f8fafc"/>
  <circle cx="324" cy="324" r="8" fill="#94a3b8"/>
  <text x="324" y="328" font-family="sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="bold">Q9</text>
  <text x="340" y="328" font-family="sans-serif" font-size="11.5" fill="#64748b">電子化文件規範</text>

  <text x="400" y="344" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">...及更多文件問題</text>

  <!-- ===== 卡片 3：現場類 ===== -->
  <rect x="542" y="62" width="228" height="276" rx="16" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="542" y="62" width="228" height="80" rx="16" fill="url(#card3)"/>
  <rect x="542" y="122" width="228" height="20" fill="url(#card3)"/>
  <circle cx="592" cy="95" r="22" fill="white" opacity="0.2"/>
  <text x="592" y="103" font-family="sans-serif" font-size="22" text-anchor="middle">🏢</text>
  <text x="656" y="93" font-family="sans-serif" font-size="19" fill="white" text-anchor="middle" font-weight="bold">現場類問題</text>
  <text x="656" y="116" font-family="sans-serif" font-size="11" fill="#fde68a" text-anchor="middle">On-site Questions · Q11-Q15</text>
  <text x="656" y="158" font-family="sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">當天流程？</text>
  <text x="656" y="175" font-family="sans-serif" font-size="12.5" fill="#64748b" text-anchor="middle">委員問什麼？</text>

  <rect x="562" y="194" width="188" height="32" rx="8" fill="#fffbeb"/>
  <circle cx="580" cy="210" r="8" fill="#f59e0b"/>
  <text x="580" y="214" font-family="sans-serif" font-size="9" fill="white" text-anchor="middle" font-weight="bold">Q11</text>
  <text x="596" y="214" font-family="sans-serif" font-size="11.5" fill="#1e293b">評鑑當日流程</text>

  <rect x="562" y="232" width="188" height="32" rx="8" fill="#fffbeb"/>
  <circle cx="580" cy="248" r="8" fill="#f59e0b"/>
  <text x="580" y="252" font-family="sans-serif" font-size="9" fill="white" text-anchor="middle" font-weight="bold">Q12</text>
  <text x="596" y="252" font-family="sans-serif" font-size="11.5" fill="#1e293b">常見訪談問題</text>

  <rect x="562" y="270" width="188" height="32" rx="8" fill="#fffbeb"/>
  <circle cx="580" cy="286" r="8" fill="#f59e0b"/>
  <text x="580" y="290" font-family="sans-serif" font-size="9" fill="white" text-anchor="middle" font-weight="bold">Q13</text>
  <text x="596" y="290" font-family="sans-serif" font-size="11.5" fill="#1e293b">環境缺失改善</text>

  <rect x="562" y="308" width="188" height="32" rx="8" fill="#fef9f0"/>
  <circle cx="580" cy="324" r="8" fill="#94a3b8"/>
  <text x="580" y="328" font-family="sans-serif" font-size="9" fill="white" text-anchor="middle" font-weight="bold">Q14</text>
  <text x="596" y="328" font-family="sans-serif" font-size="11.5" fill="#64748b">委員評分標準</text>

  <text x="656" y="344" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">...及更多現場問題</text>

  <!-- 總計標籤 -->
  <rect x="340" y="344" width="120" height="10" rx="5" fill="transparent"/>
  <text x="400" y="354" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">共 15 題，三類各 5 題</text>
</svg>
