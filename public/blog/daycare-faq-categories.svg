<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"
     font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">日照評鑑常見問題 3 大分類</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">制度類・文件類・現場類，15 題集中查閱不用再到處找</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- 上排左：評鑑制度類 (#d97706) x=40 y=104 w=346 h=168 -->
  <rect x="40" y="104" width="346" height="168" rx="12" fill="white"/>
  <rect x="40" y="104" width="346" height="44" rx="12" fill="#d97706"/>
  <rect x="40" y="128" width="346" height="20" fill="#d97706"/>
  <text x="213" y="144" text-anchor="middle" font-size="16" fill="white" font-weight="700">評鑑制度類（Q1–Q5）</text>
  <text x="60" y="176" font-size="14" fill="#57534e">• 評鑑每 3 年辦理一次</text>
  <text x="60" y="196" font-size="14" fill="#57534e">• 2–3 位委員到場查核</text>
  <text x="60" y="216" font-size="14" fill="#57534e">• 未通過需限期改善提計畫</text>
  <rect x="56" y="242" width="90" height="20" rx="10" fill="#fef3c7"/>
  <text x="101" y="256" text-anchor="middle" font-size="14" fill="#d97706" font-weight="600">Q1–Q5</text>

  <!-- 上排右：文件準備類 (#78716c) x=414 y=104 w=346 h=168 -->
  <rect x="414" y="104" width="346" height="168" rx="12" fill="white"/>
  <rect x="414" y="104" width="346" height="44" rx="12" fill="#78716c"/>
  <rect x="414" y="128" width="346" height="20" fill="#78716c"/>
  <text x="587" y="144" text-anchor="middle" font-size="16" fill="white" font-weight="700">文件準備類（Q6–Q10）</text>
  <text x="434" y="176" font-size="14" fill="#57534e">• 照顧計畫 7 工作天內完成</text>
  <text x="434" y="196" font-size="14" fill="#57534e">• 在職訓練 20 小時以上</text>
  <text x="434" y="216" font-size="14" fill="#57534e">• 品管指標需自訂至少 2 項</text>
  <rect x="430" y="242" width="90" height="20" rx="10" fill="#f5f5f4"/>
  <text x="475" y="256" text-anchor="middle" font-size="14" fill="#78716c" font-weight="600">Q6–Q10</text>

  <!-- 下排左：現場評鑑類 (#57534e) x=40 y=288 w=346 h=162 -->
  <rect x="40" y="288" width="346" height="162" rx="12" fill="white"/>
  <rect x="40" y="288" width="346" height="44" rx="12" fill="#57534e"/>
  <rect x="40" y="312" width="346" height="20" fill="#57534e"/>
  <text x="213" y="328" text-anchor="middle" font-size="16" fill="white" font-weight="700">現場評鑑類（Q11–Q15）</text>
  <text x="60" y="360" font-size="14" fill="#57534e">• 評鑑當日約 3–4 小時</text>
  <text x="60" y="380" font-size="14" fill="#57534e">• 4 職類人員均需在場</text>
  <text x="60" y="400" font-size="14" fill="#57534e">• 環境查看是最難補救的</text>
  <rect x="56" y="420" width="90" height="20" rx="10" fill="#f5f0eb"/>
  <text x="101" y="434" text-anchor="middle" font-size="14" fill="#57534e" font-weight="600">Q11–Q15</text>

  <!-- 下排右：通用備審技巧 (#a8a29e) x=414 y=288 w=346 h=162 -->
  <rect x="414" y="288" width="346" height="162" rx="12" fill="white"/>
  <rect x="414" y="288" width="346" height="44" rx="12" fill="#a8a29e"/>
  <rect x="414" y="312" width="346" height="20" fill="#a8a29e"/>
  <text x="587" y="328" text-anchor="middle" font-size="16" fill="white" font-weight="700">通用備審技巧</text>
  <text x="434" y="360" font-size="14" fill="#57534e">• 日常有做、日常有記</text>
  <text x="434" y="380" font-size="14" fill="#57534e">• 文件有改善軌跡才有故事性</text>
  <text x="434" y="400" font-size="14" fill="#57534e">• 誠實說明現況勝過隱瞞</text>
  <rect x="430" y="420" width="90" height="20" rx="10" fill="#f5f5f4"/>
  <text x="475" y="434" text-anchor="middle" font-size="14" fill="#a8a29e" font-weight="600">備審心法</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
