<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 右側裝飾區塊 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>

  <!-- 右側裝飾大數字 -->
  <text x="1010" y="219" font-size="130" font-weight="900" fill="#d97706" text-anchor="middle" opacity="0.85">60%</text>
  <text x="1010" y="261" font-size="26" fill="#78716c" text-anchor="middle" font-weight="600">文書時間可省下</text>

  <!-- 右側直列標籤 -->
  <rect x="840" y="283" width="320" height="56" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="1000" y="302" font-size="24" fill="#d97706" text-anchor="middle" font-weight="700">14,423 人</text>
  <text x="1000" y="336" font-size="20" fill="#a8a29e" text-anchor="middle">2026 年護理人力缺口</text>

  <rect x="840" y="351" width="320" height="56" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="1000" y="370" font-size="24" fill="#78716c" text-anchor="middle" font-weight="700">護理師心聲</text>
  <text x="1000" y="404" font-size="20" fill="#a8a29e" text-anchor="middle">文書時間超過照護時間</text>

  <!-- 右側底部標籤 -->
  <rect x="840" y="421" width="320" height="52" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="1000" y="457" font-size="26" fill="#d97706" text-anchor="middle" font-weight="700">AI 工具讓時間還給個案</text>

  <rect x="840" y="485" width="320" height="52" rx="10" fill="#78716c" opacity="0.10"/>
  <text x="1000" y="517" font-size="24" fill="#78716c" text-anchor="middle" font-weight="600">評鑑季不再是夢魘</text>

  <rect x="840" y="549" width="320" height="52" rx="10" fill="#57534e" opacity="0.08"/>
  <text x="1000" y="581" font-size="22" fill="#57534e" text-anchor="middle" font-weight="600">數位轉型 · 流程簡化 · 合理分工</text>

  <!-- 左側主內容區 -->
  <text x="60" y="185" font-size="95" font-weight="900" fill="#1e293b">護理師不是</text>
  <text x="60" y="305" font-size="95" font-weight="900" fill="#d97706">來寫報告的</text>

  <line x1="60" y1="335" x2="780" y2="335" stroke="#dedad3" stroke-width="2"/>

  <text x="60" y="388" font-size="36" fill="#57534e" font-weight="400">文書負擔的真相 · 數位工具的解方</text>

  <!-- 特色標籤列 -->
  <rect x="60" y="424" width="148" height="54" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="134" y="461" font-size="28" fill="#d97706" text-anchor="middle" font-weight="600">護理心聲</text>

  <rect x="220" y="424" width="148" height="54" rx="10" fill="#78716c" opacity="0.12"/>
  <text x="294" y="461" font-size="28" fill="#78716c" text-anchor="middle" font-weight="600">文書減量</text>

  <rect x="380" y="424" width="148" height="54" rx="10" fill="#57534e" opacity="0.12"/>
  <text x="454" y="461" font-size="28" fill="#57534e" text-anchor="middle" font-weight="600">AI 工具</text>

  <rect x="540" y="424" width="148" height="54" rx="10" fill="#a8a29e" opacity="0.18"/>
  <text x="614" y="461" font-size="28" fill="#78716c" text-anchor="middle" font-weight="600">居家護理</text>

  <!-- 適用對象 -->
  <text x="60" y="536" font-size="28" fill="#94a3b8">適用對象：居家護理所負責人 · 護理師 · 關心長照的你</text>

  <!-- 引言裝飾 -->
  <rect x="60" y="558" width="700" height="44" rx="8" fill="#d97706" opacity="0.07"/>
  <text x="80" y="587" font-size="24" fill="#78716c" font-weight="400">「我選擇當護理師，是想照顧病人，不是來寫報告的。」</text>

  <!-- 浮水印 -->
  <text x="1140" y="618" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
