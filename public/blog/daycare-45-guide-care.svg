<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="450" fill="#f0efe8"/>
  <text x="400" y="46" font-size="21" font-weight="700" fill="#1e293b" text-anchor="middle">貳、專業照護品質：3 大面向（共 18 條）</text>
  <rect x="60" y="58" width="48" height="3" rx="1.5" fill="#d97706"/>
  <line x1="116" y1="59.5" x2="740" y2="59.5" stroke="#dedad3" stroke-width="1"/>

  <!-- 3 large category cards, horizontal layout -->
  <!-- Card 1: 評估與處遇計畫 -->
  <rect x="52" y="84" width="212" height="290" rx="14" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="52" y="84" width="212" height="6" rx="3" fill="#d97706"/>
  <text x="158" y="122" font-size="15" fill="#78716c" text-anchor="middle" font-weight="700">評估與處遇計畫</text>
  <text x="158" y="145" font-size="32" font-weight="900" fill="#d97706" text-anchor="middle">8</text>
  <text x="158" y="166" font-size="12" fill="#94a3b8" text-anchor="middle">條評鑑基準</text>
  <line x1="72" y1="182" x2="244" y2="182" stroke="#f0ede6" stroke-width="1"/>
  <text x="82" y="204" font-size="12" fill="#1e293b" font-weight="600">▸ 個別照顧計畫</text>
  <text x="82" y="222" font-size="12" fill="#64748b">  制訂、執行、追蹤</text>
  <text x="82" y="246" font-size="12" fill="#1e293b" font-weight="600">▸ 需求評估</text>
  <text x="82" y="264" font-size="12" fill="#64748b">  ADL/IADL/認知功能</text>
  <text x="82" y="288" font-size="12" fill="#1e293b" font-weight="600">▸ 多專業團隊合作</text>
  <text x="82" y="306" font-size="12" fill="#64748b">  職能/護理/社工協作</text>
  <text x="82" y="330" font-size="12" fill="#1e293b" font-weight="600">▸ 出所追蹤管理</text>
  <text x="82" y="348" font-size="12" fill="#64748b">  離所原因記錄</text>

  <!-- Card 2: 健康照顧管理 -->
  <rect x="294" y="84" width="212" height="290" rx="14" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="294" y="84" width="212" height="6" rx="3" fill="#78716c"/>
  <text x="400" y="122" font-size="15" fill="#78716c" text-anchor="middle" font-weight="700">健康照顧管理</text>
  <text x="400" y="145" font-size="32" font-weight="900" fill="#d97706" text-anchor="middle">6</text>
  <text x="400" y="166" font-size="12" fill="#94a3b8" text-anchor="middle">條評鑑基準</text>
  <line x1="314" y1="182" x2="486" y2="182" stroke="#f0ede6" stroke-width="1"/>
  <text x="324" y="204" font-size="12" fill="#1e293b" font-weight="600">▸ 用藥安全管理</text>
  <text x="324" y="222" font-size="12" fill="#64748b">  藥物核對、紀錄</text>
  <text x="324" y="246" font-size="12" fill="#1e293b" font-weight="600">▸ 感染管制</text>
  <text x="324" y="264" font-size="12" fill="#64748b">  洗手、隔離措施</text>
  <text x="324" y="288" font-size="12" fill="#1e293b" font-weight="600">▸ 跌倒預防</text>
  <text x="324" y="306" font-size="12" fill="#64748b">  風險評估、環境調整</text>
  <text x="324" y="330" font-size="12" fill="#1e293b" font-weight="600">▸ 異常事件通報</text>
  <text x="324" y="348" font-size="12" fill="#64748b">  事故報告、改善</text>

  <!-- Card 3: 照護品質監測 -->
  <rect x="536" y="84" width="212" height="290" rx="14" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="536" y="84" width="212" height="6" rx="3" fill="#a8a29e"/>
  <text x="642" y="122" font-size="15" fill="#78716c" text-anchor="middle" font-weight="700">照護品質監測</text>
  <text x="642" y="145" font-size="32" font-weight="900" fill="#d97706" text-anchor="middle">4</text>
  <text x="642" y="166" font-size="12" fill="#94a3b8" text-anchor="middle">條評鑑基準</text>
  <line x1="556" y1="182" x2="728" y2="182" stroke="#f0ede6" stroke-width="1"/>
  <text x="566" y="204" font-size="12" fill="#1e293b" font-weight="600">▸ 品管指標設定</text>
  <text x="566" y="222" font-size="12" fill="#64748b">  自訂指標、目標值</text>
  <text x="566" y="246" font-size="12" fill="#1e293b" font-weight="600">▸ PDCA 管理循環</text>
  <text x="566" y="264" font-size="12" fill="#64748b">  Plan→Do→Check→Act</text>
  <text x="566" y="288" font-size="12" fill="#1e293b" font-weight="600">▸ 數據追蹤記錄</text>
  <text x="566" y="306" font-size="12" fill="#64748b">  月報、趨勢分析</text>
  <text x="566" y="330" font-size="12" fill="#1e293b" font-weight="600">▸ 改善措施執行</text>
  <text x="566" y="348" font-size="12" fill="#64748b">  對策落實、成效評估</text>

  <text x="760" y="421" font-size="16" fill="#c4bfb8" text-anchor="end" font-weight="400" font-family="'Noto Sans TC', sans-serif">報告汪 reportwang.com</text>
</svg>
