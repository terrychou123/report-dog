<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"
     font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">貳、專業照護品質（第 5–22 條）</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">評估處遇 - 健康照顧 - 品質監測，共 18 條核心項目</text>
  <line x1="129" y1="94" x2="671" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- 箭頭 N=3, arrow_y=279 -->
  <!-- 0→1: card 0 right edge=129+170=299, card 1 left=315 → 16px gap -->
  <line x1="299" y1="279" x2="315" y2="279" stroke="#c4bfb8" stroke-width="2"/>
  <polygon points="299,273 315,279 299,285" fill="#c4bfb8"/>
  <!-- 1→2: card 1 right edge=315+170=485, card 2 left=501 -->
  <line x1="485" y1="279" x2="501" y2="279" stroke="#c4bfb8" stroke-width="2"/>
  <polygon points="485,273 501,279 485,285" fill="#c4bfb8"/>

  <!-- Step 1: 評估處遇 #d97706, card x=129 cx=214, r=43 -->
  <rect x="129" y="108" width="170" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="129" y="108" width="170" height="8" rx="4" fill="#d97706"/>
  <rect x="129" y="112" width="170" height="4" fill="#d97706"/>
  <circle cx="214" cy="194" r="43" fill="#fef3c7"/>
  <text x="214" y="183" text-anchor="middle" font-size="17" fill="#d97706" font-weight="700">STEP</text>
  <text x="214" y="212" text-anchor="middle" font-size="28" fill="#d97706" font-weight="700">01</text>
  <text x="214" y="297" text-anchor="middle" font-size="28" fill="#1e293b" font-weight="700">評估處遇</text>
  <text x="214" y="324" text-anchor="middle" font-size="18" fill="#57534e">評估計畫</text>
  <text x="214" y="346" text-anchor="middle" font-size="18" fill="#57534e">追蹤督導</text>
  <rect x="140" y="381" width="148" height="36" rx="18" fill="#fef3c7"/>
  <text x="214" y="405" text-anchor="middle" font-size="16" fill="#d97706" font-weight="600">第 5–10 條</text>

  <!-- Step 2: 健康照顧 #78716c, card x=315 cx=400, r=43 -->
  <rect x="315" y="108" width="170" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="315" y="108" width="170" height="8" rx="4" fill="#78716c"/>
  <rect x="315" y="112" width="170" height="4" fill="#78716c"/>
  <circle cx="400" cy="194" r="43" fill="#f5f5f4"/>
  <text x="400" y="183" text-anchor="middle" font-size="17" fill="#78716c" font-weight="700">STEP</text>
  <text x="400" y="212" text-anchor="middle" font-size="28" fill="#78716c" font-weight="700">02</text>
  <text x="400" y="297" text-anchor="middle" font-size="28" fill="#1e293b" font-weight="700">健康照顧</text>
  <text x="400" y="324" text-anchor="middle" font-size="18" fill="#57534e">服藥活動</text>
  <text x="400" y="346" text-anchor="middle" font-size="18" fill="#57534e">防疫健檢</text>
  <rect x="326" y="381" width="148" height="36" rx="18" fill="#f5f5f4"/>
  <text x="400" y="405" text-anchor="middle" font-size="16" fill="#78716c" font-weight="600">第 11–21 條</text>

  <!-- Step 3: 品質監測 #57534e, card x=501 cx=586, r=43 -->
  <rect x="501" y="108" width="170" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="501" y="108" width="170" height="8" rx="4" fill="#57534e"/>
  <rect x="501" y="112" width="170" height="4" fill="#57534e"/>
  <circle cx="586" cy="194" r="43" fill="#f5f0eb"/>
  <text x="586" y="183" text-anchor="middle" font-size="17" fill="#57534e" font-weight="700">STEP</text>
  <text x="586" y="212" text-anchor="middle" font-size="28" fill="#57534e" font-weight="700">03</text>
  <text x="586" y="297" text-anchor="middle" font-size="28" fill="#1e293b" font-weight="700">品質監測</text>
  <text x="586" y="324" text-anchor="middle" font-size="18" fill="#57534e">品管指標</text>
  <text x="586" y="346" text-anchor="middle" font-size="18" fill="#57534e">異常分析</text>
  <rect x="512" y="381" width="148" height="36" rx="18" fill="#f5f0eb"/>
  <text x="586" y="405" text-anchor="middle" font-size="16" fill="#57534e" font-weight="600">第 22 條</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
