<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans TC', sans-serif">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&amp;display=swap');</style>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- Right panel -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>
  <!-- Left content area -->
  <!-- Category badge -->
  <rect x="60" y="60" width="140" height="38" rx="19" fill="#d97706"/>
  <text x="130" y="84"  font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">評鑑準備</text>
  <!-- Main title -->
  <text x="60" y="165"  font-size="48" font-weight="900" fill="#1e293b">行政組織與</text>
  <text x="60" y="225"  font-size="48" font-weight="900" fill="#1e293b">經營管理</text>
  <!-- Subtitle -->
  <text x="60" y="285"  font-size="22" font-weight="500" fill="#57534e">評鑑前 6 題的快速準備法</text>
  <!-- Divider line -->
  <rect x="60" y="315" width="80" height="4" rx="2" fill="#d97706"/>
  <!-- Description lines -->
  <text x="60" y="360"  font-size="18" fill="#78716c">項目 1–3 由評鑑人員現場查核</text>
  <text x="60" y="390"  font-size="18" fill="#78716c">項目 4–6 由主管機關全年紀錄評分</text>
  <!-- Tags row -->
  <rect x="60" y="440" width="116" height="36" rx="18" fill="#fef3c7"/>
  <text x="118" y="462"  font-size="14" fill="#d97706" text-anchor="middle">董事會</text>
  <rect x="188" y="440" width="116" height="36" rx="18" fill="#fef3c7"/>
  <text x="246" y="462"  font-size="14" fill="#d97706" text-anchor="middle">員工手冊</text>
  <rect x="316" y="440" width="116" height="36" rx="18" fill="#fef3c7"/>
  <text x="374" y="462"  font-size="14" fill="#d97706" text-anchor="middle">112年度</text>
  <!-- Brand -->
  <text x="60" y="560"  font-size="18" font-weight="700" fill="#a8a29e">報告汪 reportwang.com</text>
  <!-- Right panel: big number -->
  <text x="1010" y="260"  font-size="200" font-weight="900" fill="#d97706" text-anchor="middle" opacity="0.18">10</text>
  <text x="1010" y="340"  font-size="32" font-weight="700" fill="#1e293b" text-anchor="middle">分</text>
  <text x="1010" y="385"  font-size="20" fill="#57534e" text-anchor="middle">行政組織管理</text>
  <text x="1010" y="415"  font-size="20" fill="#57534e" text-anchor="middle">總配分</text>
  <!-- Right panel decorative items -->
  <rect x="880" y="460" width="260" height="52" rx="12" fill="#ffffff" opacity="0.6"/>
  <text x="1010" y="491"  font-size="16" fill="#1e293b" text-anchor="middle">6 個項目逐一解析</text>
  <rect x="880" y="524" width="260" height="52" rx="12" fill="#ffffff" opacity="0.6"/>
  <text x="1010" y="555"  font-size="16" fill="#1e293b" text-anchor="middle">兒少安置機構 112年度</text>
  <!-- Watermark -->
  <text x="1140" y="600"  font-size="24" fill="#c4bfb8" text-anchor="end" opacity="0.8">報告汪</text>
</svg>
