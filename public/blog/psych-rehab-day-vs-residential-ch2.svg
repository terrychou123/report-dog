<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- @template: custom -->
  <rect width="800" height="500" fill="#f0efe8"/>
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">第二章 復健服務 關鍵差異</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">兩種類型均37分，但2.3條目重點完全不同</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- 中央：2.3差異對比（最重要） -->
  <rect x="40" y="108" width="346" height="168" rx="12" fill="white" stroke="#0284c7" stroke-width="2"/>
  <rect x="40" y="108" width="346" height="40" rx="12" fill="#0284c7"/>
  <rect x="40" y="128" width="346" height="20" fill="#0284c7"/>
  <text x="213" y="135" text-anchor="middle" font-size="19" fill="white" font-weight="700">日間型 2.3（4分）</text>
  <text x="60" y="168" font-size="17" fill="#1e293b" font-weight="700">社區生活化多元復健服務</text>
  <text x="60" y="190" font-size="15" fill="#57534e">依個別化復健目標提供多元服務</text>
  <text x="60" y="210" font-size="15" fill="#57534e">強調外出、社區活動、資源連結</text>
  <text x="60" y="230" font-size="15" fill="#57534e">防疫期間可透過視訊提供服務</text>
  <rect x="80" y="248" width="270" height="20" rx="10" fill="#eff6ff"/>
  <text x="215" y="263" text-anchor="middle" font-size="15" fill="#0284c7" font-weight="700">核心：社區融合與多元活動</text>

  <rect x="414" y="108" width="346" height="168" rx="12" fill="white" stroke="#7c3aed" stroke-width="2"/>
  <rect x="414" y="108" width="346" height="40" rx="12" fill="#7c3aed"/>
  <rect x="414" y="128" width="346" height="20" fill="#7c3aed"/>
  <text x="587" y="135" text-anchor="middle" font-size="19" fill="white" font-weight="700">住宿型 2.3（6分，最高）</text>
  <text x="434" y="168" font-size="17" fill="#1e293b" font-weight="700">個別化獨立生活功能訓練</text>
  <text x="434" y="190" font-size="15" fill="#57534e">日常生活技能、自我照顧為主</text>
  <text x="434" y="210" font-size="15" fill="#57534e">個別化課程，非團體活動為主</text>
  <text x="434" y="230" font-size="15" fill="#57534e">住宿型全評鑑配分最高單條</text>
  <rect x="454" y="248" width="270" height="20" rx="10" fill="#f5f3ff"/>
  <text x="589" y="263" text-anchor="middle" font-size="15" fill="#7c3aed" font-weight="700">核心：獨立生活技能訓練</text>

  <!-- 共同條目說明 -->
  <rect x="40" y="290" width="720" height="50" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="40" y="290" width="6" height="50" rx="2" fill="#16a34a"/>
  <text x="80" y="311" font-size="17" fill="#1e293b" font-weight="700">共同條目（14條中的12條相同）：</text>
  <text x="80" y="331" font-size="15" fill="#57534e">2.1復健評估、2.2復健計畫、2.4-2.12均相同（2.6名稱略有差異：日間型「工作復健訓練」vs 住宿型「職前準備、工作轉介」）</text>

  <!-- 試評項目 -->
  <rect x="40" y="352" width="346" height="96" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="60" y="378" font-size="17" fill="#1e293b" font-weight="700">試評項目（不計分，共有）</text>
  <text x="60" y="400" font-size="15" fill="#57534e">試2.13 社會參與：公民活動、倡議活動</text>
  <text x="60" y="420" font-size="15" fill="#57534e">試2.14 同儕支持：自然形成社群機會</text>
  <rect x="60" y="432" width="290" height="10" rx="5" fill="#f0fdf4"/>
  <text x="205" y="441" text-anchor="middle" font-size="14" fill="#16a34a">建議準備，未來可能轉為計分項目</text>

  <rect x="414" y="352" width="346" height="96" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="434" y="378" font-size="17" fill="#1e293b" font-weight="700">住宿型另有試評3.14</text>
  <text x="434" y="400" font-size="15" fill="#57534e">試3.14 訪客管理規範（不計分）</text>
  <text x="434" y="420" font-size="15" fill="#57534e">住宿型獨有，規範訪客衛生措施</text>
  <rect x="434" y="432" width="290" height="10" rx="5" fill="#f5f3ff"/>
  <text x="579" y="441" text-anchor="middle" font-size="14" fill="#7c3aed">住宿型獨有試評條目</text>

  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
