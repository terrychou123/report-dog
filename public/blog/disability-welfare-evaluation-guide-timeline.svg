<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">評鑑準備 90 天倒數計畫</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">三階段系統化備審・每項指標按時完成</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- 時間軸：y=272 -->
  <line x1="60" y1="272" x2="736" y2="272" stroke="#a8a29e" stroke-width="4"/>
  <polygon points="736,265 736,279 752,272" fill="#a8a29e"/>

  <!-- Step 1: 第1-4週 (上方, cx=130) -->
  <rect x="70" y="108" width="120" height="100" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="70" y="108" width="120" height="8" rx="4" fill="#d97706"/>
  <rect x="70" y="112" width="120" height="4" fill="#d97706"/>
  <text x="130" y="145" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="700">自評階段</text>
  <text x="130" y="166" text-anchor="middle" font-size="14" fill="#57534e">逐條對照</text>
  <text x="130" y="184" text-anchor="middle" font-size="14" fill="#57534e">49項自評</text>
  <line x1="130" y1="208" x2="130" y2="248" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,3"/>
  <circle cx="130" cy="272" r="24" fill="#d97706" opacity="0.15"/>
  <text x="130" y="280" text-anchor="middle" font-size="18" fill="white" font-weight="700">1</text>
  <rect x="96" y="300" width="68" height="22" rx="11" fill="#d97706"/>
  <text x="130" y="315" text-anchor="middle" font-size="14" fill="white" font-weight="700">W1–W4</text>

  <!-- Step 2: 第5-8週 (下方, cx=310) -->
  <rect x="96" y="222" width="68" height="22" rx="11" fill="#78716c"/>
  <text x="130" y="237" text-anchor="middle" font-size="14" fill="white" font-weight="700">W5–W8</text>

  <rect x="250" y="108" width="120" height="100" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="250" y="108" width="120" height="8" rx="4" fill="#78716c"/>
  <rect x="250" y="112" width="120" height="4" fill="#78716c"/>
  <text x="310" y="145" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="700">補強階段</text>
  <text x="310" y="166" text-anchor="middle" font-size="14" fill="#57534e">補齊文件</text>
  <text x="310" y="184" text-anchor="middle" font-size="14" fill="#57534e">ISP/消防優先</text>
  <line x1="310" y1="208" x2="310" y2="248" stroke="#78716c" stroke-width="1.5" stroke-dasharray="4,3"/>
  <circle cx="310" cy="272" r="24" fill="#78716c" opacity="0.15"/>
  <text x="310" y="280" text-anchor="middle" font-size="18" fill="white" font-weight="700">2</text>
  <rect x="276" y="300" width="68" height="22" rx="11" fill="#78716c"/>
  <text x="310" y="315" text-anchor="middle" font-size="14" fill="white" font-weight="700">W5–W8</text>

  <!-- Step 3: 第9-11週 (上方, cx=490) -->
  <rect x="430" y="108" width="120" height="100" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="430" y="108" width="120" height="8" rx="4" fill="#57534e"/>
  <rect x="430" y="112" width="120" height="4" fill="#57534e"/>
  <text x="490" y="145" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="700">模擬評鑑</text>
  <text x="490" y="166" text-anchor="middle" font-size="14" fill="#57534e">角色扮演</text>
  <text x="490" y="184" text-anchor="middle" font-size="14" fill="#57534e">逐條清查</text>
  <line x1="490" y1="208" x2="490" y2="248" stroke="#57534e" stroke-width="1.5" stroke-dasharray="4,3"/>
  <circle cx="490" cy="272" r="24" fill="#57534e" opacity="0.15"/>
  <text x="490" y="280" text-anchor="middle" font-size="18" fill="white" font-weight="700">3</text>
  <rect x="456" y="300" width="68" height="22" rx="11" fill="#57534e"/>
  <text x="490" y="315" text-anchor="middle" font-size="14" fill="white" font-weight="700">W9–W11</text>

  <!-- Step 4: 最後1週 (下方, cx=670) -->
  <rect x="436" y="222" width="68" height="22" rx="11" fill="#a8a29e"/>
  <text x="470" y="237" text-anchor="middle" font-size="14" fill="white" font-weight="700">最後1週</text>

  <rect x="610" y="350" width="120" height="100" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="610" y="442" width="120" height="8" rx="4" fill="#a8a29e"/>
  <rect x="610" y="438" width="120" height="4" fill="#a8a29e"/>
  <text x="670" y="379" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="700">最終確認</text>
  <text x="670" y="401" text-anchor="middle" font-size="14" fill="#57534e">資料索引</text>
  <text x="670" y="421" text-anchor="middle" font-size="14" fill="#57534e">環境整潔</text>
  <line x1="670" y1="296" x2="670" y2="350" stroke="#a8a29e" stroke-width="1.5" stroke-dasharray="4,3"/>
  <circle cx="670" cy="272" r="24" fill="#a8a29e" opacity="0.15"/>
  <text x="670" y="280" text-anchor="middle" font-size="18" fill="white" font-weight="700">4</text>
  <rect x="636" y="222" width="68" height="22" rx="11" fill="#a8a29e"/>
  <text x="670" y="237" text-anchor="middle" font-size="14" fill="white" font-weight="700">最後1週</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
