<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', sans-serif">
  <!-- @template: cover -->
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 右側裝飾區塊 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>
  <!-- 右側大數字 -->
  <text x="1010" y="220" font-size="170" fill="#d97706" text-anchor="middle" font-weight="700" opacity="0.85">1.3</text>
  <!-- 說明標籤 -->
  <rect x="870" y="270" width="280" height="50" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="1010" y="302" font-size="24" fill="#d97706" text-anchor="middle" font-weight="700">督導與教育訓練</text>
  <text x="1010" y="365" font-size="20" fill="#57534e" text-anchor="middle">第1章 經營管理</text>
  <text x="1010" y="400" font-size="20" fill="#57534e" text-anchor="middle">日間型 ＋ 住宿型</text>
  <text x="1010" y="450" font-size="20" fill="#57534e" text-anchor="middle">新人必讀</text>
  <!-- 左側主要內容 -->
  <rect x="60" y="60" width="160" height="38" rx="19" fill="#2563eb" opacity="0.12"/>
  <text x="140" y="85" font-size="18" fill="#2563eb" text-anchor="middle" font-weight="700">經營管理</text>
  <!-- 主標題 -->
  <text x="60" y="185" font-size="76" fill="#1e293b" font-weight="700">新人不慌</text>
  <text x="60" y="275" font-size="64" fill="#d97706" font-weight="700">督導 ＆ 教育訓練</text>
  <!-- 分隔線 -->
  <line x1="60" y1="305" x2="760" y2="305" stroke="#dedad3" stroke-width="2"/>
  <!-- 副標題 -->
  <text x="60" y="352" font-size="28" fill="#57534e">從督導制度到年度訓練計畫</text>
  <text x="60" y="392" font-size="26" fill="#57534e">快速了解你在評鑑中的角色</text>
  <!-- 標籤 Pills -->
  <rect x="60" y="440" width="120" height="36" rx="18" fill="#2563eb" opacity="0.12"/>
  <text x="120" y="463" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="600">第1.3條</text>
  <rect x="194" y="440" width="128" height="36" rx="18" fill="#d97706" opacity="0.12"/>
  <text x="258" y="463" font-size="16" fill="#d97706" text-anchor="middle" font-weight="600">督導制度</text>
  <rect x="336" y="440" width="128" height="36" rx="18" fill="#d97706" opacity="0.12"/>
  <text x="400" y="463" font-size="16" fill="#d97706" text-anchor="middle" font-weight="600">教育訓練</text>
  <rect x="478" y="440" width="148" height="36" rx="18" fill="#78716c" opacity="0.12"/>
  <text x="552" y="463" font-size="16" fill="#78716c" text-anchor="middle" font-weight="600">115年度評鑑</text>
  <!-- 浮水印 -->
  <text x="1140" y="590" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
