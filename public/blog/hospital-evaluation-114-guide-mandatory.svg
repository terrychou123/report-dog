<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">20項必要條文章節分布</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">橫跨8個章節，感染管制、手術、用藥安全各3項</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- 上排 4 個章節卡片 -->
  <!-- 卡片寬 168px，間距 10px，起始 x=28 -->
  <!-- 1.3人力資源 -->
  <rect x="28" y="108" width="168" height="150" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="108" width="168" height="8" rx="4" fill="#2563eb"/>
  <rect x="28" y="112" width="168" height="4" fill="#2563eb"/>
  <text x="112" y="140" text-anchor="middle" font-size="16" fill="#2563eb" font-weight="700">1.3 人力資源</text>
  <rect x="44" y="152" width="136" height="36" rx="8" fill="#2563eb" opacity="0.12"/>
  <text x="112" y="176" text-anchor="middle" font-size="28" fill="#2563eb" font-weight="900">3 項</text>
  <text x="112" y="210" text-anchor="middle" font-size="14" fill="#57534e">醫師、護理、</text>
  <text x="112" y="228" text-anchor="middle" font-size="14" fill="#57534e">醫事人員配置</text>
  <text x="112" y="246" text-anchor="middle" font-size="14" fill="#57534e">1.3.1 / 1.3.2 / 1.3.3</text>

  <!-- 1.4病歷資訊 -->
  <rect x="206" y="108" width="168" height="150" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="206" y="108" width="168" height="8" rx="4" fill="#0d9488"/>
  <rect x="206" y="112" width="168" height="4" fill="#0d9488"/>
  <text x="290" y="140" text-anchor="middle" font-size="16" fill="#0d9488" font-weight="700">1.4 病歷資訊</text>
  <rect x="222" y="152" width="136" height="36" rx="8" fill="#0d9488" opacity="0.12"/>
  <text x="290" y="176" text-anchor="middle" font-size="28" fill="#0d9488" font-weight="900">1 項</text>
  <text x="290" y="210" text-anchor="middle" font-size="14" fill="#57534e">病歷書寫</text>
  <text x="290" y="228" text-anchor="middle" font-size="14" fill="#57534e">與管理</text>
  <text x="290" y="246" text-anchor="middle" font-size="14" fill="#57534e">1.4.1</text>

  <!-- 1.5安全環境 -->
  <rect x="384" y="108" width="168" height="150" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="384" y="108" width="168" height="8" rx="4" fill="#4f46e5"/>
  <rect x="384" y="112" width="168" height="4" fill="#4f46e5"/>
  <text x="468" y="140" text-anchor="middle" font-size="16" fill="#4f46e5" font-weight="700">1.5 安全環境</text>
  <rect x="400" y="152" width="136" height="36" rx="8" fill="#4f46e5" opacity="0.12"/>
  <text x="468" y="176" text-anchor="middle" font-size="28" fill="#4f46e5" font-weight="900">1 項</text>
  <text x="468" y="210" text-anchor="middle" font-size="14" fill="#57534e">消防安全</text>
  <text x="468" y="228" text-anchor="middle" font-size="14" fill="#57534e">管理</text>
  <text x="468" y="246" text-anchor="middle" font-size="14" fill="#57534e">1.5.2</text>

  <!-- 2.1病人權責 -->
  <rect x="562" y="108" width="168" height="150" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="562" y="108" width="168" height="8" rx="4" fill="#d97706"/>
  <rect x="562" y="112" width="168" height="4" fill="#d97706"/>
  <text x="646" y="140" text-anchor="middle" font-size="16" fill="#d97706" font-weight="700">2.1 病人權責</text>
  <rect x="578" y="152" width="136" height="36" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="646" y="176" text-anchor="middle" font-size="28" fill="#d97706" font-weight="900">3 項</text>
  <text x="646" y="210" text-anchor="middle" font-size="14" fill="#57534e">病人權利、</text>
  <text x="646" y="228" text-anchor="middle" font-size="14" fill="#57534e">知情同意、隱私</text>
  <text x="646" y="246" text-anchor="middle" font-size="14" fill="#57534e">2.1.1 / 2.1.2 / 2.1.3</text>

  <!-- 下排 4 個章節卡片 y=276 -->
  <!-- 2.2品質安全 -->
  <rect x="28" y="280" width="168" height="150" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="280" width="168" height="8" rx="4" fill="#16a34a"/>
  <rect x="28" y="284" width="168" height="4" fill="#16a34a"/>
  <text x="112" y="312" text-anchor="middle" font-size="16" fill="#16a34a" font-weight="700">2.2 品質安全</text>
  <rect x="44" y="324" width="136" height="36" rx="8" fill="#16a34a" opacity="0.12"/>
  <text x="112" y="348" text-anchor="middle" font-size="28" fill="#16a34a" font-weight="900">3 項</text>
  <text x="112" y="382" text-anchor="middle" font-size="14" fill="#57534e">品質指標、</text>
  <text x="112" y="400" text-anchor="middle" font-size="14" fill="#57534e">病安文化、通報</text>
  <text x="112" y="418" text-anchor="middle" font-size="14" fill="#57534e">2.2.1 / 2.2.2 / 2.2.3</text>

  <!-- 2.5用藥安全 -->
  <rect x="206" y="280" width="168" height="150" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="206" y="280" width="168" height="8" rx="4" fill="#9333ea"/>
  <rect x="206" y="284" width="168" height="4" fill="#9333ea"/>
  <text x="290" y="312" text-anchor="middle" font-size="16" fill="#9333ea" font-weight="700">2.5 用藥安全</text>
  <rect x="222" y="324" width="136" height="36" rx="8" fill="#9333ea" opacity="0.12"/>
  <text x="290" y="348" text-anchor="middle" font-size="28" fill="#9333ea" font-weight="900">3 項</text>
  <text x="290" y="382" text-anchor="middle" font-size="14" fill="#57534e">給藥安全、</text>
  <text x="290" y="400" text-anchor="middle" font-size="14" fill="#57534e">高警訊、管制藥</text>
  <text x="290" y="418" text-anchor="middle" font-size="14" fill="#57534e">2.5.4 / 2.5.5 / 2.5.8</text>

  <!-- 2.6麻醉手術 -->
  <rect x="384" y="280" width="168" height="150" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="384" y="280" width="168" height="8" rx="4" fill="#ea580c"/>
  <rect x="384" y="284" width="168" height="4" fill="#ea580c"/>
  <text x="468" y="312" text-anchor="middle" font-size="16" fill="#ea580c" font-weight="700">2.6 麻醉手術</text>
  <rect x="400" y="324" width="136" height="36" rx="8" fill="#ea580c" opacity="0.12"/>
  <text x="468" y="348" text-anchor="middle" font-size="28" fill="#ea580c" font-weight="900">3 項</text>
  <text x="468" y="382" text-anchor="middle" font-size="14" fill="#57534e">手術查核、</text>
  <text x="468" y="400" text-anchor="middle" font-size="14" fill="#57534e">麻醉前評估、麻醉</text>
  <text x="468" y="418" text-anchor="middle" font-size="14" fill="#57534e">2.6.1 / 2.6.2 / 2.6.3</text>

  <!-- 2.7感染管制 -->
  <rect x="562" y="280" width="168" height="150" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="562" y="280" width="168" height="8" rx="4" fill="#dc2626"/>
  <rect x="562" y="284" width="168" height="4" fill="#dc2626"/>
  <text x="646" y="312" text-anchor="middle" font-size="16" fill="#dc2626" font-weight="700">2.7 感染管制</text>
  <rect x="578" y="324" width="136" height="36" rx="8" fill="#dc2626" opacity="0.12"/>
  <text x="646" y="348" text-anchor="middle" font-size="28" fill="#dc2626" font-weight="900">3 項</text>
  <text x="646" y="382" text-anchor="middle" font-size="14" fill="#57534e">感控組織、</text>
  <text x="646" y="400" text-anchor="middle" font-size="14" fill="#57534e">標準防護、HAI監測</text>
  <text x="646" y="418" text-anchor="middle" font-size="14" fill="#57534e">全章皆為必要條文</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
