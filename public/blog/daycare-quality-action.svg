<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="450" fill="#f0efe8"/>
  <text x="400" y="46" font-size="21" font-weight="700" fill="#1e293b" text-anchor="middle">品管指標改善行動：6 步驟落實計畫</text>
  <rect x="60" y="58" width="48" height="3" rx="1.5" fill="#d97706"/>
  <line x1="116" y1="59.5" x2="740" y2="59.5" stroke="#dedad3" stroke-width="1"/>

  <!-- 6 steps in 2 rows of 3 -->
  <!-- Row 1 -->
  <!-- Step 1 -->
  <rect x="52" y="82" width="208" height="154" rx="12" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="52" y="82" width="208" height="5" rx="2.5" fill="#d97706"/>
  <circle cx="84" cy="114" r="18" fill="#d97706" opacity="0.12"/>
  <text x="84" y="120" font-size="16" font-weight="900" fill="#d97706" text-anchor="middle">1</text>
  <text x="116" y="110" font-size="14" fill="#1e293b" font-weight="700">確認未達標項目</text>
  <text x="116" y="128" font-size="12" fill="#57534e">對照月報數據</text>
  <line x1="68" y1="146" x2="244" y2="146" stroke="#f0ede6" stroke-width="1"/>
  <text x="68" y="165" font-size="12" fill="#78716c">比較實際值與目標值</text>
  <text x="68" y="183" font-size="12" fill="#78716c">列出所有未達標指標</text>
  <text x="68" y="201" font-size="12" fill="#78716c">標示缺口大小排序</text>
  <text x="68" y="219" font-size="11" fill="#d97706">→ 產出：問題清單</text>

  <!-- Step 2 -->
  <rect x="296" y="82" width="208" height="154" rx="12" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="296" y="82" width="208" height="5" rx="2.5" fill="#78716c"/>
  <circle cx="328" cy="114" r="18" fill="#78716c" opacity="0.12"/>
  <text x="328" y="120" font-size="16" font-weight="900" fill="#d97706" text-anchor="middle">2</text>
  <text x="360" y="110" font-size="14" fill="#1e293b" font-weight="700">分析根本原因</text>
  <text x="360" y="128" font-size="12" fill="#57534e">品管會議討論</text>
  <line x1="312" y1="146" x2="488" y2="146" stroke="#f0ede6" stroke-width="1"/>
  <text x="312" y="165" font-size="12" fill="#78716c">使用魚骨圖分析</text>
  <text x="312" y="183" font-size="12" fill="#78716c">人員/流程/環境</text>
  <text x="312" y="201" font-size="12" fill="#78716c">找出真正原因</text>
  <text x="312" y="219" font-size="11" fill="#d97706">→ 產出：原因說明</text>

  <!-- Step 3 -->
  <rect x="540" y="82" width="208" height="154" rx="12" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="540" y="82" width="208" height="5" rx="2.5" fill="#a8a29e"/>
  <circle cx="572" cy="114" r="18" fill="#a8a29e" opacity="0.15"/>
  <text x="572" y="120" font-size="16" font-weight="900" fill="#d97706" text-anchor="middle">3</text>
  <text x="604" y="110" font-size="14" fill="#1e293b" font-weight="700">制訂改善對策</text>
  <text x="604" y="128" font-size="12" fill="#57534e">具體可執行方案</text>
  <line x1="556" y1="146" x2="732" y2="146" stroke="#f0ede6" stroke-width="1"/>
  <text x="556" y="165" font-size="12" fill="#78716c">對策需具體明確</text>
  <text x="556" y="183" font-size="12" fill="#78716c">指定負責人</text>
  <text x="556" y="201" font-size="12" fill="#78716c">設定完成期限</text>
  <text x="556" y="219" font-size="11" fill="#d97706">→ 產出：改善計畫</text>

  <!-- Row 2 -->
  <!-- Step 4 -->
  <rect x="52" y="252" width="208" height="148" rx="12" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="52" y="252" width="208" height="5" rx="2.5" fill="#d97706"/>
  <circle cx="84" cy="282" r="18" fill="#d97706" opacity="0.12"/>
  <text x="84" y="288" font-size="16" font-weight="900" fill="#d97706" text-anchor="middle">4</text>
  <text x="116" y="278" font-size="14" fill="#1e293b" font-weight="700">執行改善措施</text>
  <text x="116" y="296" font-size="12" fill="#57534e">落實行動計畫</text>
  <line x1="68" y1="312" x2="244" y2="312" stroke="#f0ede6" stroke-width="1"/>
  <text x="68" y="331" font-size="12" fill="#78716c">按時程執行對策</text>
  <text x="68" y="349" font-size="12" fill="#78716c">記錄執行過程</text>
  <text x="68" y="367" font-size="12" fill="#78716c">即時回報進度</text>
  <text x="68" y="385" font-size="11" fill="#d97706">→ 產出：執行紀錄</text>

  <!-- Step 5 -->
  <rect x="296" y="252" width="208" height="148" rx="12" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="296" y="252" width="208" height="5" rx="2.5" fill="#78716c"/>
  <circle cx="328" cy="282" r="18" fill="#78716c" opacity="0.12"/>
  <text x="328" y="288" font-size="16" font-weight="900" fill="#d97706" text-anchor="middle">5</text>
  <text x="360" y="278" font-size="14" fill="#1e293b" font-weight="700">追蹤成效確認</text>
  <text x="360" y="296" font-size="12" fill="#57534e">下月數據驗證</text>
  <line x1="312" y1="312" x2="488" y2="312" stroke="#f0ede6" stroke-width="1"/>
  <text x="312" y="331" font-size="12" fill="#78716c">次月繼續收集數據</text>
  <text x="312" y="349" font-size="12" fill="#78716c">與改善前比較</text>
  <text x="312" y="367" font-size="12" fill="#78716c">確認是否回到標準</text>
  <text x="312" y="385" font-size="11" fill="#d97706">→ 產出：成效評估</text>

  <!-- Step 6 -->
  <rect x="540" y="252" width="208" height="148" rx="12" fill="#d97706" opacity="0.06"/>
  <rect x="540" y="252" width="208" height="148" rx="12" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.4"/>
  <rect x="540" y="252" width="208" height="5" rx="2.5" fill="#d97706" opacity="0.7"/>
  <circle cx="572" cy="282" r="18" fill="#d97706" opacity="0.15"/>
  <text x="572" y="288" font-size="16" font-weight="900" fill="#d97706" text-anchor="middle">6</text>
  <text x="604" y="278" font-size="14" fill="#1e293b" font-weight="700">標準化與循環</text>
  <text x="604" y="296" font-size="12" fill="#57534e">鞏固改善成果</text>
  <line x1="556" y1="312" x2="732" y2="312" stroke="#f0ede6" stroke-width="1"/>
  <text x="556" y="331" font-size="12" fill="#78716c">更新 SOP 流程</text>
  <text x="556" y="349" font-size="12" fill="#78716c">納入日常作業</text>
  <text x="556" y="367" font-size="12" fill="#78716c">下次指標設定參考</text>
  <text x="556" y="385" font-size="11" fill="#d97706">→ 持續 PDCA 循環</text>

  <text x="760" y="421" font-size="16" fill="#c4bfb8" text-anchor="end" font-weight="400" font-family="'Noto Sans TC', sans-serif">報告汪 reportwang.com</text>
</svg>
