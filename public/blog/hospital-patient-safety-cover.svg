<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', sans-serif">
  <rect width="1200" height="630" fill="#f0efe8"/>

  <!-- 右側裝飾區塊 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>

  <!-- 右側大數字 3 -->
  <text x="1010" y="290" text-anchor="middle" font-size="220" fill="#d97706" font-weight="900" opacity="0.85">3</text>
  <text x="1010" y="338" text-anchor="middle" font-size="26" fill="#78716c" font-weight="600">2.2章全數為必要條文</text>

  <!-- 右側資訊卡片 -->
  <rect x="840" y="366" width="320" height="52" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="1000" y="399" text-anchor="middle" font-size="26" fill="#d97706" font-weight="700">品質指標管理 2.2.1</text>

  <rect x="840" y="428" width="320" height="52" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="1000" y="461" text-anchor="middle" font-size="26" fill="#78716c" font-weight="700">病安文化推動 2.2.2</text>

  <rect x="840" y="490" width="320" height="52" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="1000" y="523" text-anchor="middle" font-size="26" fill="#57534e" font-weight="700">異常事件通報 2.2.3</text>

  <!-- 右側底部標籤 -->
  <rect x="840" y="552" width="320" height="46" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="1000" y="582" text-anchor="middle" font-size="26" fill="#d97706" font-weight="700">資料查核＋訪談</text>

  <!-- 左側主標題 -->
  <text x="60" y="210" font-size="112" fill="#1e293b" font-weight="900">病人安全</text>
  <text x="60" y="330" font-size="100" fill="#d97706" font-weight="900">文化怎麼建？</text>

  <!-- 左側分隔線 -->
  <line x1="60" y1="358" x2="780" y2="358" stroke="#dedad3" stroke-width="2"/>

  <!-- 左側副標題 -->
  <text x="60" y="400" font-size="34" fill="#57534e">醫院評鑑2.2章病安目標與通報制度完整解析</text>

  <!-- 特色標籤列 -->
  <rect x="60" y="428" width="184" height="48" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="152" y="460" text-anchor="middle" font-size="26" fill="#d97706" font-weight="600">不責罰通報文化</text>

  <rect x="256" y="428" width="148" height="48" rx="10" fill="#78716c" opacity="0.12"/>
  <text x="330" y="460" text-anchor="middle" font-size="26" fill="#78716c" font-weight="600">RCA品質</text>

  <rect x="416" y="428" width="148" height="48" rx="10" fill="#57534e" opacity="0.12"/>
  <text x="490" y="460" text-anchor="middle" font-size="26" fill="#57534e" font-weight="600">病安委員會</text>

  <rect x="576" y="428" width="148" height="48" rx="10" fill="#0d9488" opacity="0.12"/>
  <text x="650" y="460" text-anchor="middle" font-size="26" fill="#0d9488" font-weight="600">PDCA追蹤</text>

  <!-- 第二排標籤 -->
  <rect x="60" y="488" width="148" height="48" rx="10" fill="#16a34a" opacity="0.12"/>
  <text x="134" y="520" text-anchor="middle" font-size="26" fill="#16a34a" font-weight="600">病安目標</text>

  <rect x="220" y="488" width="148" height="48" rx="10" fill="#4f46e5" opacity="0.12"/>
  <text x="294" y="520" text-anchor="middle" font-size="26" fill="#4f46e5" font-weight="600">改善追蹤</text>

  <rect x="380" y="488" width="184" height="48" rx="10" fill="#9333ea" opacity="0.12"/>
  <text x="472" y="520" text-anchor="middle" font-size="26" fill="#9333ea" font-weight="600">定期追蹤機制</text>

  <!-- 適用對象 -->
  <text x="60" y="570" font-size="26" fill="#a8a29e">適用：醫院品管人員、病安委員會、全院護理師</text>

  <!-- 浮水印 -->
  <text x="1140" y="612" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
