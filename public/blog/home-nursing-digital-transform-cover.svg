<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 右側裝飾區塊 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>

  <!-- 右側裝飾大文字 -->
  <text x="1010" y="208" font-size="110" font-weight="900" fill="#d97706" text-anchor="middle" opacity="0.85">3.0</text>
  <text x="1010" y="250" font-size="26" fill="#78716c" text-anchor="middle" font-weight="600">長照 3.0 政策</text>

  <!-- 右側 3 個數位化步驟 -->
  <rect x="840" y="270" width="320" height="56" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="868" y="291" font-size="24" fill="#d97706" font-weight="700">STEP 1</text>
  <text x="960" y="322" font-size="22" fill="#78716c">雲端文件管理</text>
  <text x="960" y="318" font-size="18" fill="#a8a29e">依基準建立資料夾</text>

  <rect x="840" y="338" width="320" height="56" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="868" y="359" font-size="24" fill="#d97706" font-weight="700">STEP 2</text>
  <text x="960" y="390" font-size="22" fill="#78716c">AI 輔助撰寫報告</text>
  <text x="960" y="386" font-size="18" fill="#a8a29e">評鑑初稿快速完成</text>

  <rect x="840" y="406" width="320" height="56" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="868" y="427" font-size="24" fill="#d97706" font-weight="700">STEP 3</text>
  <text x="960" y="458" font-size="22" fill="#78716c">品質指標定期追蹤</text>
  <text x="960" y="454" font-size="18" fill="#a8a29e">提醒不漏追</text>

  <!-- 右側底部標籤 -->
  <rect x="840" y="476" width="320" height="52" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="1000" y="512" font-size="26" fill="#d97706" text-anchor="middle" font-weight="700">從報告文書開始轉型</text>

  <rect x="840" y="540" width="320" height="52" rx="10" fill="#78716c" opacity="0.10"/>
  <text x="1000" y="574" font-size="24" fill="#78716c" text-anchor="middle" font-weight="600">人力短缺的解方</text>

  <!-- 浮水印 -->
  <text x="1140" y="590" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>

  <!-- 左側主內容區 -->
  <text x="60" y="190" font-size="100" font-weight="900" fill="#1e293b">居家護理所</text>
  <text x="60" y="318" font-size="100" font-weight="900" fill="#d97706">數位轉型指南</text>

  <line x1="60" y1="348" x2="780" y2="348" stroke="#dedad3" stroke-width="2"/>

  <text x="60" y="400" font-size="36" fill="#57534e" font-weight="400">長照 3.0 政策下的數位化切入路徑</text>

  <!-- 特色標籤列 -->
  <rect x="60" y="434" width="148" height="54" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="134" y="471" font-size="28" fill="#d97706" text-anchor="middle" font-weight="600">長照 3.0</text>

  <rect x="220" y="434" width="148" height="54" rx="10" fill="#78716c" opacity="0.12"/>
  <text x="294" y="471" font-size="28" fill="#78716c" text-anchor="middle" font-weight="600">數位轉型</text>

  <rect x="380" y="434" width="148" height="54" rx="10" fill="#57534e" opacity="0.12"/>
  <text x="454" y="471" font-size="28" fill="#57534e" text-anchor="middle" font-weight="600">AI 工具</text>

  <rect x="540" y="434" width="148" height="54" rx="10" fill="#a8a29e" opacity="0.18"/>
  <text x="614" y="471" font-size="28" fill="#78716c" text-anchor="middle" font-weight="600">2026 年</text>

  <!-- 適用對象 -->
  <text x="60" y="540" font-size="28" fill="#94a3b8">適用對象：居家護理所負責人 · 護理長</text>
</svg>
