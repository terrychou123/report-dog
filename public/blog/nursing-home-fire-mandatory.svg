<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- 標題列 -->
  <text x="400" y="48" font-size="32" fill="#1e293b" text-anchor="middle" font-weight="700">C 區塊一級必要指標一覽</text>
  <text x="400" y="78" font-size="22" fill="#78716c" text-anchor="middle">任一未達標，評鑑等級直接降等</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#d97706" stroke-width="2"/>

  <!-- 卡片 1：C9 消防設備 -->
  <rect x="40" y="104" width="346" height="168" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="40" y="104" width="346" height="44" rx="12" fill="#d97706"/>
  <rect x="40" y="128" width="346" height="20" fill="#d97706"/>
  <text x="213" y="133" text-anchor="middle" font-size="15" fill="white" font-weight="700">C9 消防安全設備</text>
  <text x="60" y="176" font-size="14" fill="#57534e">• 每半年委消防設備師檢修申報</text>
  <text x="60" y="196" font-size="14" fill="#57534e">• 每月自主用電安全檢查（書面）</text>
  <text x="60" y="216" font-size="14" fill="#57534e">• 防火管理人不得由社工/醫事/</text>
  <text x="76" y="236" font-size="14" fill="#57534e">  照服員擔任</text>
  <!-- 底部標籤 -->
  <rect x="60" y="248" width="120" height="20" rx="10" fill="#d97706" opacity="0.15"/>
  <text x="120" y="262" font-size="12" fill="#d97706" text-anchor="middle" font-weight="600">一級必要</text>

  <!-- 卡片 2：C10/C12 疏散 -->
  <rect x="414" y="104" width="346" height="168" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="414" y="104" width="346" height="44" rx="12" fill="#78716c"/>
  <rect x="414" y="128" width="346" height="20" fill="#78716c"/>
  <text x="587" y="133" text-anchor="middle" font-size="15" fill="white" font-weight="700">C10/C12 疏散路徑與避難圖</text>
  <text x="434" y="176" font-size="14" fill="#57534e">• 雙向疏散路徑（走道暢通）</text>
  <text x="434" y="196" font-size="14" fill="#57534e">• 防火門往避難方向開啟</text>
  <text x="434" y="216" font-size="14" fill="#57534e">• 各樓層出入口 A3 以上避難圖</text>
  <text x="434" y="236" font-size="14" fill="#57534e">• 避難圖定期更新</text>
  <rect x="434" y="248" width="120" height="20" rx="10" fill="#78716c" opacity="0.15"/>
  <text x="494" y="262" font-size="12" fill="#78716c" text-anchor="middle" font-weight="600">一級必要</text>

  <!-- 卡片 3：C11 EOP -->
  <rect x="40" y="288" width="346" height="162" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="40" y="288" width="346" height="44" rx="12" fill="#57534e"/>
  <rect x="40" y="312" width="346" height="20" fill="#57534e"/>
  <text x="213" y="317" text-anchor="middle" font-size="15" fill="white" font-weight="700">C11 緊急應變演練（EOP）</text>
  <text x="60" y="358" font-size="14" fill="#57534e">• 每年至少 2 次演練</text>
  <text x="60" y="378" font-size="14" fill="#57534e">• 含 1 次複合型災害演練</text>
  <text x="60" y="398" font-size="14" fill="#57534e">• 含 1 次夜間演練</text>
  <text x="60" y="418" font-size="14" fill="#57534e">• 演練後有書面檢討報告</text>
  <rect x="60" y="420" width="120" height="20" rx="10" fill="#57534e" opacity="0.15"/>
  <text x="120" y="434" font-size="12" fill="#57534e" text-anchor="middle" font-weight="600">一級必要</text>

  <!-- 卡片 4：C15 護理站 -->
  <rect x="414" y="288" width="346" height="162" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="414" y="288" width="346" height="44" rx="12" fill="#94a3b8"/>
  <rect x="414" y="312" width="346" height="20" fill="#94a3b8"/>
  <text x="587" y="317" text-anchor="middle" font-size="15" fill="white" font-weight="700">C15 護理站急救設備</text>
  <text x="434" y="358" font-size="14" fill="#57534e">• 每層樓均設置護理站</text>
  <text x="434" y="378" font-size="14" fill="#57534e">• 備有基本急救設備（AED 等）</text>
  <text x="434" y="398" font-size="14" fill="#57534e">• 設備在效期內</text>
  <text x="434" y="418" font-size="14" fill="#57534e">• 擺放位置易取用</text>
  <rect x="434" y="420" width="120" height="20" rx="10" fill="#94a3b8" opacity="0.25"/>
  <text x="494" y="434" font-size="12" fill="#57534e" text-anchor="middle" font-weight="600">一級必要</text>

  <!-- 水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
