<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- Header（y=29, h=60）-->
  <rect x="0" y="29" width="800" height="60" fill="white"/>
  <rect x="0" y="29" width="6" height="60" fill="#57534e"/>
  <text x="28" y="68" font-size="36" fill="#1e293b" font-weight="700">健康安全類 5 大缺失</text>

  <!-- Row 0：食物樣品保存不當（y=118）#d97706 -->
  <rect x="28" y="118" width="744" height="60" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="118" width="6" height="60" rx="2" fill="#d97706"/>
  <circle cx="66" cy="148" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="154" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">6</text>
  <text x="100" y="145" font-size="20" fill="#1e293b" font-weight="700">食物樣品保存不當（第44項）</text>
  <text x="100" y="166" font-size="16" fill="#57534e">缺失：未密封或未標示日期，或溫度超標（需7°C以下保存48小時備查）</text>
  <rect x="620" y="126" width="136" height="44" rx="8" fill="#dc2626" opacity="0.10"/>
  <text x="688" y="142" font-size="16" fill="#dc2626" text-anchor="middle">衛生缺失</text>
  <text x="688" y="162" font-size="16" fill="#dc2626" text-anchor="middle">第44項</text>

  <!-- Row 1：冰箱無溫度計（y=191）#78716c -->
  <rect x="28" y="191" width="744" height="60" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="191" width="6" height="60" rx="2" fill="#78716c"/>
  <circle cx="66" cy="221" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="227" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">7</text>
  <text x="100" y="218" font-size="20" fill="#1e293b" font-weight="700">冰箱無溫度計或溫度超標（第46項）</text>
  <text x="100" y="239" font-size="16" fill="#57534e">缺失：冰箱冷藏室無溫度計，或溫度計顯示超過7°C；冷凍室高於-18°C</text>
  <rect x="620" y="199" width="136" height="44" rx="8" fill="#dc2626" opacity="0.10"/>
  <text x="688" y="215" font-size="16" fill="#dc2626" text-anchor="middle">設備缺失</text>
  <text x="688" y="235" font-size="16" fill="#dc2626" text-anchor="middle">第46項</text>

  <!-- Row 2：1歲以內使用枕頭（y=264）#57534e -->
  <rect x="28" y="264" width="744" height="60" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="264" width="6" height="60" rx="2" fill="#57534e"/>
  <circle cx="66" cy="294" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="300" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">8</text>
  <text x="100" y="291" font-size="20" fill="#1e293b" font-weight="700">1歲以內使用枕頭（第55項）</text>
  <text x="100" y="312" font-size="16" fill="#57534e">缺失：睡床上擺有枕頭。1歲以內應保持仰睡姿勢且不使用枕頭（防窒息規定）</text>
  <rect x="620" y="272" width="136" height="44" rx="8" fill="#dc2626" opacity="0.10"/>
  <text x="688" y="288" font-size="16" fill="#dc2626" text-anchor="middle">安全缺失</text>
  <text x="688" y="308" font-size="16" fill="#dc2626" text-anchor="middle">第55項</text>

  <!-- Row 3：給藥未落實五對原則（y=337）#a8a29e -->
  <rect x="28" y="337" width="744" height="60" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="337" width="6" height="60" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="367" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="373" font-size="16" fill="#a8a29e" text-anchor="middle" font-weight="900">9</text>
  <text x="100" y="364" font-size="20" fill="#1e293b" font-weight="700">給藥未落實五對原則（第59項）</text>
  <text x="100" y="385" font-size="16" fill="#57534e">缺失：無委託藥單、給藥紀錄不完整，或未遵循五對原則（嬰幼兒、藥物、劑量、時間、途徑）</text>
  <rect x="620" y="345" width="136" height="44" rx="8" fill="#dc2626" opacity="0.10"/>
  <text x="688" y="361" font-size="16" fill="#dc2626" text-anchor="middle">照護缺失</text>
  <text x="688" y="381" font-size="16" fill="#dc2626" text-anchor="middle">第59項</text>

  <!-- Row 4：感染管制手冊未更新（y=410）#94a3b8 -->
  <rect x="28" y="410" width="744" height="60" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="410" width="6" height="60" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="440" r="16" fill="#94a3b8" opacity="0.15"/>
  <text x="66" y="446" font-size="16" fill="#94a3b8" text-anchor="middle" font-weight="900">10</text>
  <text x="100" y="437" font-size="20" fill="#1e293b" font-weight="700">感染管制手冊未更新至最新版（第60項）</text>
  <text x="100" y="458" font-size="16" fill="#57534e">缺失：使用舊版感染管制手冊；需依疾管署公告最新版「托嬰中心感染管制手冊」修訂</text>
  <rect x="620" y="418" width="136" height="44" rx="8" fill="#dc2626" opacity="0.10"/>
  <text x="688" y="434" font-size="16" fill="#dc2626" text-anchor="middle">制度缺失</text>
  <text x="688" y="454" font-size="16" fill="#dc2626" text-anchor="middle">第60項</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
