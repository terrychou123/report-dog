<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 左側裝飾色條 -->
  <rect x="0" y="0" width="8" height="630" fill="#d97706"/>
  <!-- 右側裝飾圓形 -->
  <circle cx="980" cy="280" r="240" fill="#9333ea" opacity="0.06"/>
  <circle cx="980" cy="280" r="170" fill="#9333ea" opacity="0.06"/>
  <!-- 右側大數字 +4 -->
  <text x="980" y="340" font-size="200" fill="#9333ea" opacity="0.18" text-anchor="middle" font-weight="900" font-family="sans-serif">+4</text>
  <text x="980" y="400" font-size="36" fill="#9333ea" opacity="0.35" text-anchor="middle" font-weight="600" font-family="sans-serif">最高加分</text>
  <!-- 主標題第1行 -->
  <text x="80" y="200" font-size="100" fill="#1e293b" font-weight="900" font-family="sans-serif">評鑑加分題</text>
  <!-- 主標題第2行 -->
  <text x="80" y="315" font-size="100" fill="#d97706" font-weight="900" font-family="sans-serif">全攻略</text>
  <!-- 副標題 -->
  <text x="80" y="378" font-size="38" fill="#57534e" font-weight="400" font-family="sans-serif">E2 + F1-F3，最高加 4 分，優等多一道保險</text>
  <!-- Pills -->
  <rect x="80" y="418" width="180" height="44" rx="22" fill="#9333ea" opacity="0.12"/>
  <text x="170" y="446" font-size="20" fill="#9333ea" text-anchor="middle" font-weight="600" font-family="sans-serif">E2 創新服務</text>
  <rect x="276" y="418" width="180" height="44" rx="22" fill="#d97706" opacity="0.15"/>
  <text x="366" y="446" font-size="20" fill="#d97706" text-anchor="middle" font-weight="600" font-family="sans-serif">F1 牙科診療</text>
  <rect x="472" y="418" width="180" height="44" rx="22" fill="#d97706" opacity="0.15"/>
  <text x="562" y="446" font-size="20" fill="#d97706" text-anchor="middle" font-weight="600" font-family="sans-serif">F2 人間懷服務</text>
  <rect x="668" y="418" width="180" height="44" rx="22" fill="#d97706" opacity="0.15"/>
  <text x="758" y="446" font-size="20" fill="#d97706" text-anchor="middle" font-weight="600" font-family="sans-serif">F3 逃生資訊</text>
  <!-- 浮水印 -->
  <text x="1140" y="590" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400" font-family="sans-serif">報告汪 reportwang.com</text>
</svg>