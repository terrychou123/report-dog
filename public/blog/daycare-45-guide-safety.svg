<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"
     font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- Header (y=31, h=54) N=6 header_gap=10, pad=31 -->
  <rect x="0" y="31" width="800" height="54" fill="white"/>
  <rect x="0" y="31" width="6" height="54" fill="#d97706"/>
  <text x="28" y="71" font-size="32" fill="#1e293b" font-weight="700">肆、安全環境設備（第 38–43 條）</text>

  <!-- N=6: H=54, inner_gap=10, pad=31, header_gap=10
       Header y=31, Row y: 95, 159, 223, 287, 351, 415
       Q_font=18, R_font=14, circle_r=16, Q_off=+24, R_off=+43, cy=+27, S rect +8 (h=38), S1 +21, S2 +41 -->

  <!-- Row 1 y=95, H=54, #d97706 琥珀 — 第38條 高齡友善環境 -->
  <rect x="28" y="95" width="744" height="54" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="95" width="6" height="54" rx="2" fill="#d97706"/>
  <circle cx="66" cy="122" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="128" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <text x="100" y="119" font-size="18" fill="#1e293b" font-weight="700">第 38 條　高齡友善環境</text>
  <text x="100" y="138" font-size="14" fill="#57534e">空間配置合理、標示清楚（字體夠大）、桌椅高度適合長者</text>
  <rect x="620" y="103" width="136" height="38" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="116" font-size="16" fill="#d97706" text-anchor="middle">實地</text>
  <text x="688" y="136" font-size="16" fill="#d97706" text-anchor="middle">查看</text>

  <!-- Row 2 y=159, H=54, #78716c 暖灰 — 第39條 盥洗衛生設備 -->
  <rect x="28" y="159" width="744" height="54" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="159" width="6" height="54" rx="2" fill="#78716c"/>
  <circle cx="66" cy="186" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="192" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <text x="100" y="183" font-size="18" fill="#1e293b" font-weight="700">第 39 條　盥洗衛生設備</text>
  <text x="100" y="202" font-size="14" fill="#57534e">衛浴淨寬 80 公分、防滑扶手、緊急呼叫系統、輪椅空間</text>
  <rect x="620" y="167" width="136" height="38" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="180" font-size="16" fill="#78716c" text-anchor="middle">實地</text>
  <text x="688" y="200" font-size="16" fill="#78716c" text-anchor="middle">查看</text>

  <!-- Row 3 y=223, H=54, #57534e 深棕 — 第40條 休息場所 -->
  <rect x="28" y="223" width="744" height="54" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="223" width="6" height="54" rx="2" fill="#57534e"/>
  <circle cx="66" cy="250" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="256" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <text x="100" y="247" font-size="18" fill="#1e293b" font-weight="700">第 40 條　休息場所</text>
  <text x="100" y="266" font-size="14" fill="#57534e">依服務對象需求安排適當休息場所，注意個別隱私</text>
  <rect x="620" y="231" width="136" height="38" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="244" font-size="16" fill="#57534e" text-anchor="middle">環境</text>
  <text x="688" y="264" font-size="16" fill="#57534e" text-anchor="middle">整備</text>

  <!-- Row 4 y=287, H=54, #a8a29e 淺灰 — 第41條 飲用水 -->
  <rect x="28" y="287" width="744" height="54" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="287" width="6" height="54" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="314" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="320" font-size="16" fill="#a8a29e" text-anchor="middle" font-weight="900">4</text>
  <text x="100" y="311" font-size="18" fill="#1e293b" font-weight="700">第 41 條　飲用水</text>
  <text x="100" y="330" font-size="14" fill="#57534e">每 3 個月檢測大腸桿菌群；水塔每半年清洗並留記錄</text>
  <rect x="620" y="295" width="136" height="38" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="308" font-size="16" fill="#a8a29e" text-anchor="middle">文件</text>
  <text x="688" y="328" font-size="16" fill="#a8a29e" text-anchor="middle">查驗</text>

  <!-- Row 5 y=351, H=54, #94a3b8 藍灰 — 第42條 廚房衛生 -->
  <rect x="28" y="351" width="744" height="54" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="351" width="6" height="54" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="378" r="16" fill="#94a3b8" opacity="0.15"/>
  <text x="66" y="384" font-size="16" fill="#94a3b8" text-anchor="middle" font-weight="900">5</text>
  <text x="100" y="375" font-size="18" fill="#1e293b" font-weight="700">第 42 條　廚房衛生</text>
  <text x="100" y="394" font-size="14" fill="#57534e">食物留存 125g 冷藏 48 小時，廚房作業規範、生熟食分開</text>
  <rect x="620" y="359" width="136" height="38" rx="8" fill="#94a3b8" opacity="0.12"/>
  <text x="688" y="372" font-size="16" fill="#94a3b8" text-anchor="middle">現場</text>
  <text x="688" y="392" font-size="16" fill="#94a3b8" text-anchor="middle">查看</text>

  <!-- Row 6 y=415, H=54, #6b7280 中灰 — 第43條 環境清潔 -->
  <rect x="28" y="415" width="744" height="54" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="415" width="6" height="54" rx="2" fill="#6b7280"/>
  <circle cx="66" cy="442" r="16" fill="#6b7280" opacity="0.15"/>
  <text x="66" y="448" font-size="16" fill="#6b7280" text-anchor="middle" font-weight="900">6</text>
  <text x="100" y="439" font-size="18" fill="#1e293b" font-weight="700">第 43 條　環境清潔與病媒防治</text>
  <text x="100" y="458" font-size="14" fill="#57534e">每 3 個月消毒並留記錄，委外病媒防治需有合約佐證</text>
  <rect x="620" y="423" width="136" height="38" rx="8" fill="#6b7280" opacity="0.12"/>
  <text x="688" y="436" font-size="16" fill="#6b7280" text-anchor="middle">定期</text>
  <text x="688" y="456" font-size="16" fill="#6b7280" text-anchor="middle">紀錄</text>

  <!-- 浮水印 -->
  <text x="760" y="490" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
