<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans TC', sans-serif">
  <!-- @template: list-4 -->
  <!-- Background -->
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- Header -->
  <rect x="28" y="29" width="744" height="60" rx="12" fill="#1e293b"/>
  <text x="400" y="53"  font-size="14" fill="#94a3b8" text-anchor="middle">項目 31 — 最多 +4 分</text>
  <text x="400" y="75"  font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">收容個案多元化加分階梯</text>
  <!-- Tier 1 -->
  <rect x="28" y="118" width="744" height="60" rx="12" fill="#f5f5f4"/>
  <rect x="28" y="118" width="6" height="60" rx="3" fill="#e8e4dc"/>
  <circle cx="66" cy="148" r="16" fill="#f5f5f4"/>
  <text x="66" y="153"  font-size="14" font-weight="700" fill="#78716c" text-anchor="middle">T1</text>
  <text x="100" y="140"  font-size="15" font-weight="700" fill="#1e293b">安置特殊需求兒少 2 名以下</text>
  <text x="100" y="162"  font-size="16" fill="#57534e">身心障礙、重大傷病、藥物濫用、問題行為等，需有書面認定文件</text>
  <rect x="620" y="129" width="136" height="38" rx="8" fill="#e8e4dc" opacity="0.12"/>
  <text x="688" y="152"  font-size="16" font-weight="700" fill="#57534e" text-anchor="middle">+1 分</text>
  <!-- Tier 2 -->
  <rect x="28" y="191" width="744" height="60" rx="12" fill="#f5f5f4"/>
  <rect x="28" y="191" width="6" height="60" rx="2" fill="#d97706"/>
  <circle cx="66" cy="221" r="16" fill="#f5f0eb"/>
  <text x="66" y="226"  font-size="14" font-weight="700" fill="#78716c" text-anchor="middle">T2</text>
  <text x="100" y="213"  font-size="15" font-weight="700" fill="#1e293b">安置特殊需求兒少 3 名以上</text>
  <text x="100" y="235"  font-size="16" fill="#57534e">達到 3 名的門檻即可升至此級，紀錄完整性為關鍵</text>
  <rect x="620" y="202" width="136" height="38" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="225"  font-size="16" font-weight="700" fill="#57534e" text-anchor="middle">+2 分</text>
  <!-- Tier 3 -->
  <rect x="28" y="264" width="744" height="60" rx="12" fill="#f5f0eb"/>
  <rect x="28" y="264" width="6" height="60" rx="2" fill="#78716c"/>
  <circle cx="66" cy="294" r="16" fill="#e8e4dc"/>
  <text x="66" y="299"  font-size="14" font-weight="700" fill="#57534e" text-anchor="middle">T3</text>
  <text x="100" y="286"  font-size="15" font-weight="700" fill="#1e293b">安置特殊需求兒少 5 名以上</text>
  <text x="100" y="308"  font-size="16" fill="#57534e">最高階，每位個案需有特殊需求類型說明與服務紀錄</text>
  <rect x="620" y="275" width="136" height="38" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="298"  font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">+3 分</text>
  <!-- Resource development -->
  <rect x="28" y="337" width="744" height="60" rx="12" fill="#fef3c7"/>
  <rect x="28" y="337" width="6" height="60" rx="2" fill="#57534e"/>
  <circle cx="66" cy="367" r="16" fill="#fde68a"/>
  <text x="66" y="372"  font-size="14" font-weight="700" fill="#d97706" text-anchor="middle">+</text>
  <text x="100" y="357"  font-size="15" font-weight="700" fill="#1e293b">開發資源及服務（加分）</text>
  <text x="100" y="379"  font-size="16" fill="#57534e">針對特殊需求兒少主動連結外部資源，有實際運用紀錄</text>
  <rect x="620" y="348" width="136" height="38" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="371"  font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">+1 分</text>
  <!-- Summary bar -->
  <rect x="28" y="412" width="744" height="48" rx="12" fill="#1e293b"/>
  <text x="400" y="441"  font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">最佳策略：5名以上特殊需求個案（+3）+ 資源開發紀錄（+1）= 滿分 4 分</text>
  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
