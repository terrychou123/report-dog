<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 Header y=31 h=54 -->
  <rect x="24" y="31" width="752" height="54" rx="8" fill="#1e293b"/>
  <text x="400" y="65" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="sans-serif">六大區塊備審文件數量概覽</text>

  <!-- Row1 y=95 A區 -->
  <rect x="24" y="95" width="752" height="54" rx="6" fill="#ffffff"/>
  <rect x="24" y="95" width="6" height="54" rx="3" fill="#d97706"/>
  <circle cx="66" cy="122" r="16" fill="#d97706"/>
  <text x="66" y="127" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="sans-serif">A</text>
  <text x="100" y="116" font-size="20" font-weight="700" fill="#1e293b" font-family="sans-serif">A 區：經營管理效能</text>
  <text x="100" y="138" font-size="16" fill="#57534e" font-family="sans-serif">工作手冊、業務計畫、人事資料、查核改善、訓練記錄</text>
  <rect x="620" y="108" width="136" height="32" rx="6" fill="#fef3c7"/>
  <text x="688" y="129" font-size="18" font-weight="700" fill="#d97706" text-anchor="middle" font-family="sans-serif">15 項指標</text>

  <!-- Row2 y=159 B區 -->
  <rect x="24" y="159" width="752" height="54" rx="6" fill="#ffffff"/>
  <rect x="24" y="159" width="6" height="54" rx="3" fill="#78716c"/>
  <circle cx="66" cy="186" r="16" fill="#78716c"/>
  <text x="66" y="191" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="sans-serif">B</text>
  <text x="100" y="180" font-size="20" font-weight="700" fill="#1e293b" font-family="sans-serif">B 區：專業照護品質</text>
  <text x="100" y="202" font-size="16" fill="#57534e" font-family="sans-serif">個案服務計畫、防疫SOP、藥品管理、七大監測PDCA、照護記錄</text>
  <rect x="620" y="172" width="136" height="32" rx="6" fill="#f5f5f4"/>
  <text x="688" y="193" font-size="18" font-weight="700" fill="#78716c" text-anchor="middle" font-family="sans-serif">24 項指標</text>

  <!-- Row3 y=223 C區 -->
  <rect x="24" y="223" width="752" height="54" rx="6" fill="#ffffff"/>
  <rect x="24" y="223" width="6" height="54" rx="3" fill="#57534e"/>
  <circle cx="66" cy="250" r="16" fill="#57534e"/>
  <text x="66" y="255" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="sans-serif">C</text>
  <text x="100" y="244" font-size="20" font-weight="700" fill="#1e293b" font-family="sans-serif">C 區：安全環境設備</text>
  <text x="100" y="266" font-size="16" fill="#57534e" font-family="sans-serif">消防申報（5年）、緊急演練紀錄、逃生圖、護理站設備效期</text>
  <rect x="620" y="236" width="136" height="32" rx="6" fill="#f5f5f4"/>
  <text x="688" y="257" font-size="18" font-weight="700" fill="#57534e" text-anchor="middle" font-family="sans-serif">16 項指標</text>

  <!-- Row4 y=287 D區 -->
  <rect x="24" y="287" width="752" height="54" rx="6" fill="#ffffff"/>
  <rect x="24" y="287" width="6" height="54" rx="3" fill="#a8a29e"/>
  <circle cx="66" cy="314" r="16" fill="#a8a29e"/>
  <text x="66" y="319" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="sans-serif">D</text>
  <text x="100" y="308" font-size="20" font-weight="700" fill="#1e293b" font-family="sans-serif">D 區：個案權益保障</text>
  <text x="100" y="330" font-size="16" fill="#57534e" font-family="sans-serif">個資系統權限、入住契約（5天審閱）、申訴統計、DNR流程</text>
  <rect x="620" y="300" width="136" height="32" rx="6" fill="#f5f5f4"/>
  <text x="688" y="321" font-size="18" font-weight="700" fill="#a8a29e" text-anchor="middle" font-family="sans-serif">11 項指標</text>

  <!-- Row5 y=351 E區 -->
  <rect x="24" y="351" width="752" height="54" rx="6" fill="#ffffff"/>
  <rect x="24" y="351" width="6" height="54" rx="3" fill="#94a3b8"/>
  <circle cx="66" cy="378" r="16" fill="#94a3b8"/>
  <text x="66" y="383" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="sans-serif">E</text>
  <text x="100" y="372" font-size="20" font-weight="700" fill="#1e293b" font-family="sans-serif">E 區：服務創新（加分）</text>
  <text x="100" y="394" font-size="16" fill="#57534e" font-family="sans-serif">品質改善PDCA成果、創新服務報告（最多加2分）</text>
  <rect x="620" y="364" width="136" height="32" rx="6" fill="#f0f9ff"/>
  <text x="688" y="385" font-size="18" font-weight="700" fill="#94a3b8" text-anchor="middle" font-family="sans-serif">加分最多+2</text>

  <!-- Row6 y=415 F區 -->
  <rect x="24" y="415" width="752" height="54" rx="6" fill="#ffffff"/>
  <rect x="24" y="415" width="6" height="54" rx="3" fill="#6b7280"/>
  <circle cx="66" cy="442" r="16" fill="#6b7280"/>
  <text x="66" y="447" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="sans-serif">F</text>
  <text x="100" y="436" font-size="20" font-weight="700" fill="#1e293b" font-family="sans-serif">F 區：加分項目</text>
  <text x="100" y="458" font-size="16" fill="#57534e" font-family="sans-serif">人才培育、智慧照護導入、在地安老服務（各0.5分～1分）</text>
  <rect x="620" y="428" width="136" height="32" rx="6" fill="#f5f5f4"/>
  <text x="688" y="449" font-size="18" font-weight="700" fill="#6b7280" text-anchor="middle" font-family="sans-serif">加分最多+2</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" font-family="sans-serif">報告汪 reportwang.com</text>
</svg>
