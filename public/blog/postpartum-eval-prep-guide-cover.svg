<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 右側裝飾區塊 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>

  <!-- 右側裝飾大數字（17 項基準） -->
  <text x="1010" y="230" font-size="168" font-weight="900" fill="#d97706" text-anchor="middle" opacity="0.88">17</text>
  <text x="1010" y="272" font-size="28" fill="#78716c" text-anchor="middle" font-weight="600">項評鑑基準全解析</text>

  <!-- 右側 2×2 資訊卡片 -->
  <rect x="840" y="299" width="155" height="86" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="918" y="328" font-size="28" fill="#d97706" text-anchor="middle" font-weight="700">A 區 5 項</text>
  <text x="918" y="359" font-size="22" fill="#a8a29e" text-anchor="middle">行政組織</text>

  <rect x="1005" y="299" width="155" height="86" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="1083" y="328" font-size="28" fill="#16a34a" text-anchor="middle" font-weight="700">B 區 8 項</text>
  <text x="1083" y="359" font-size="22" fill="#a8a29e" text-anchor="middle">專業服務</text>

  <rect x="840" y="395" width="155" height="86" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="918" y="424" font-size="28" fill="#2563eb" text-anchor="middle" font-weight="700">C 區 2 項</text>
  <text x="918" y="455" font-size="22" fill="#a8a29e" text-anchor="middle">環境安全</text>

  <rect x="1005" y="395" width="155" height="86" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="1083" y="424" font-size="28" fill="#7c3aed" text-anchor="middle" font-weight="700">D 區 2 項</text>
  <text x="1083" y="455" font-size="22" fill="#a8a29e" text-anchor="middle">特別事項</text>

  <!-- 右側底部標籤 -->
  <rect x="840" y="491" width="320" height="52" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="1000" y="527" font-size="28" fill="#d97706" text-anchor="middle" font-weight="700">逐項解析 · 含常見失分點</text>

  <!-- 左側主標題 -->
  <text x="60" y="198" font-size="112" font-weight="900" fill="#1e293b">產後護理之家</text>
  <text x="60" y="334" font-size="112" font-weight="900" fill="#d97706">評鑑準備懶人包</text>

  <line x1="60" y1="362" x2="780" y2="362" stroke="#dedad3" stroke-width="2"/>

  <text x="60" y="412" font-size="36" fill="#57534e" font-weight="400">115 年度 · 4 大類 17 項基準 · 月子中心完整版</text>

  <!-- 特色標籤列 -->
  <rect x="60" y="447" width="148" height="54" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="134" y="484" font-size="28" fill="#d97706" text-anchor="middle" font-weight="600">A 行政組織</text>

  <rect x="220" y="447" width="148" height="54" rx="10" fill="#16a34a" opacity="0.12"/>
  <text x="294" y="484" font-size="28" fill="#16a34a" text-anchor="middle" font-weight="600">B 專業服務</text>

  <rect x="380" y="447" width="148" height="54" rx="10" fill="#2563eb" opacity="0.12"/>
  <text x="454" y="484" font-size="28" fill="#2563eb" text-anchor="middle" font-weight="600">C 環境安全</text>

  <rect x="540" y="447" width="148" height="54" rx="10" fill="#7c3aed" opacity="0.12"/>
  <text x="614" y="484" font-size="28" fill="#7c3aed" text-anchor="middle" font-weight="600">D 特別事項</text>

  <!-- 適用對象 -->
  <text x="60" y="554" font-size="28" fill="#94a3b8">適用對象：產後護理之家負責人 · 護理師 · 品管人員</text>

  <!-- 浮水印 -->
  <text x="1140" y="590" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
