<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans TC', sans-serif">
  <!-- 主背景 -->
  <rect width="800" height="450" fill="#f0efe8"/>

  <!-- 頂部標題區域 -->
  <rect x="0" y="0" width="800" height="62" fill="#1e293b"/>
  <text x="400" y="30" font-size="19" font-weight="700" fill="#f0efe8" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">常見 NG 寫法一覽</text>
  <text x="400" y="50" font-size="13" fill="#94a3b8" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">這些寫法評鑑時會被委員標記——請對照修正</text>

  <!-- NG 條目 1 -->
  <rect x="20" y="76" width="370" height="68" rx="10" fill="#e8e6de"/>
  <rect x="20" y="76" width="5" height="68" rx="2" fill="#e57373"/>
  <!-- 條文標籤 -->
  <rect x="340" y="82" width="44" height="20" rx="10" fill="#d97706" opacity="0.18"/>
  <text x="362" y="96" font-size="11" fill="#d97706" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">第5條</text>
  <!-- NG 序號 -->
  <rect x="30" y="84" width="22" height="22" rx="11" fill="#e57373"/>
  <text x="41" y="100" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">1</text>
  <!-- NG 內容 -->
  <text x="60" y="100" font-size="13" font-weight="700" fill="#1e293b" font-family="'Noto Sans TC', sans-serif">評估欄只寫「整體良好」</text>
  <text x="60" y="118" font-size="12" fill="#64748b" font-family="'Noto Sans TC', sans-serif">需包含 ADL、IADL、MMSE 分數與標準化工具</text>
  <text x="60" y="135" font-size="12" fill="#78716c" font-family="'Noto Sans TC', sans-serif">每 6 個月須重新評估並記錄</text>

  <!-- NG 條目 2 -->
  <rect x="410" y="76" width="370" height="68" rx="10" fill="#e8e6de"/>
  <rect x="410" y="76" width="5" height="68" rx="2" fill="#e57373"/>
  <rect x="730" y="82" width="44" height="20" rx="10" fill="#64748b" opacity="0.18"/>
  <text x="752" y="96" font-size="11" fill="#64748b" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">第6條</text>
  <rect x="420" y="84" width="22" height="22" rx="11" fill="#e57373"/>
  <text x="431" y="100" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">2</text>
  <text x="450" y="100" font-size="13" font-weight="700" fill="#1e293b" font-family="'Noto Sans TC', sans-serif">所有個案照顧計畫幾乎相同</text>
  <text x="450" y="118" font-size="12" fill="#64748b" font-family="'Noto Sans TC', sans-serif">不可套用制式模板，需依個案需求個別訂定</text>
  <text x="450" y="135" font-size="12" fill="#78716c" font-family="'Noto Sans TC', sans-serif">需含個案及家屬意見、簽名確認</text>

  <!-- NG 條目 3 -->
  <rect x="20" y="156" width="370" height="68" rx="10" fill="#e8e6de"/>
  <rect x="20" y="156" width="5" height="68" rx="2" fill="#e57373"/>
  <rect x="340" y="162" width="44" height="20" rx="10" fill="#d97706" opacity="0.18"/>
  <text x="362" y="176" font-size="11" fill="#d97706" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">第7條</text>
  <rect x="30" y="164" width="22" height="22" rx="11" fill="#e57373"/>
  <text x="41" y="180" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">3</text>
  <text x="60" y="180" font-size="13" font-weight="700" fill="#1e293b" font-family="'Noto Sans TC', sans-serif">評值欄只寫「繼續執行」</text>
  <text x="60" y="198" font-size="12" fill="#64748b" font-family="'Noto Sans TC', sans-serif">需記錄目標達成率（如：7/10次成功）</text>
  <text x="60" y="215" font-size="12" fill="#78716c" font-family="'Noto Sans TC', sans-serif">未達成目標須分析原因並修正計畫</text>

  <!-- NG 條目 4 -->
  <rect x="410" y="156" width="370" height="68" rx="10" fill="#e8e6de"/>
  <rect x="410" y="156" width="5" height="68" rx="2" fill="#e57373"/>
  <rect x="730" y="162" width="44" height="20" rx="10" fill="#64748b" opacity="0.18"/>
  <text x="752" y="176" font-size="11" fill="#64748b" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">第8條</text>
  <rect x="420" y="164" width="22" height="22" rx="11" fill="#e57373"/>
  <text x="431" y="180" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">4</text>
  <text x="450" y="180" font-size="13" font-weight="700" fill="#1e293b" font-family="'Noto Sans TC', sans-serif">個案討論只列出席名單</text>
  <text x="450" y="198" font-size="12" fill="#64748b" font-family="'Noto Sans TC', sans-serif">需有實質討論內容、決議事項記錄</text>
  <text x="450" y="215" font-size="12" fill="#78716c" font-family="'Noto Sans TC', sans-serif">每季須辦理跨專業討論並追蹤前次決議</text>

  <!-- NG 條目 5 -->
  <rect x="20" y="236" width="370" height="68" rx="10" fill="#e8e6de"/>
  <rect x="20" y="236" width="5" height="68" rx="2" fill="#e57373"/>
  <rect x="340" y="242" width="44" height="20" rx="10" fill="#78716c" opacity="0.18"/>
  <text x="362" y="256" font-size="11" fill="#78716c" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">第14條</text>
  <rect x="30" y="244" width="22" height="22" rx="11" fill="#e57373"/>
  <text x="41" y="260" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">5</text>
  <text x="60" y="260" font-size="13" font-weight="700" fill="#1e293b" font-family="'Noto Sans TC', sans-serif">跌倒事件後無事件紀錄</text>
  <text x="60" y="278" font-size="12" fill="#64748b" font-family="'Noto Sans TC', sans-serif">安全事件（跌倒、哽噎等）需有專屬紀錄</text>
  <text x="60" y="295" font-size="12" fill="#78716c" font-family="'Noto Sans TC', sans-serif">須記錄通知家屬時間、後續追蹤措施</text>

  <!-- NG 條目 6 -->
  <rect x="410" y="236" width="370" height="68" rx="10" fill="#e8e6de"/>
  <rect x="410" y="236" width="5" height="68" rx="2" fill="#e57373"/>
  <rect x="730" y="242" width="44" height="20" rx="10" fill="#d97706" opacity="0.18"/>
  <text x="752" y="256" font-size="11" fill="#d97706" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">第10條</text>
  <rect x="420" y="244" width="22" height="22" rx="11" fill="#e57373"/>
  <text x="431" y="260" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">6</text>
  <text x="450" y="260" font-size="13" font-weight="700" fill="#1e293b" font-family="'Noto Sans TC', sans-serif">紀錄無日期、無簽名</text>
  <text x="450" y="278" font-size="12" fill="#64748b" font-family="'Noto Sans TC', sans-serif">每筆紀錄需有日期、書寫者簽名</text>
  <text x="450" y="295" font-size="12" fill="#78716c" font-family="'Noto Sans TC', sans-serif">轉介/結案紀錄至少保存 7 年，需標示查閱權限</text>

  <!-- 底部彙整提示 -->
  <rect x="20" y="316" width="760" height="100" rx="12" fill="#e8e6de"/>
  <rect x="20" y="316" width="6" height="100" rx="3" fill="#d97706"/>
  <text x="40" y="340" font-size="14" font-weight="700" fill="#1e293b" font-family="'Noto Sans TC', sans-serif">自我檢查要點</text>
  <text x="40" y="360" font-size="12" fill="#64748b" font-family="'Noto Sans TC', sans-serif">□ 每份個案紀錄是否包含標準化評估工具分數？（第5條）</text>
  <text x="40" y="378" font-size="12" fill="#64748b" font-family="'Noto Sans TC', sans-serif">□ 照顧計畫目標是否具體、可衡量，且有個案/家屬簽名？（第6條）</text>
  <text x="400" y="360" font-size="12" fill="#64748b" font-family="'Noto Sans TC', sans-serif">□ 追蹤評值是否包含達成率與未達成原因分析？（第7條）</text>
  <text x="400" y="378" font-size="12" fill="#64748b" font-family="'Noto Sans TC', sans-serif">□ 每筆紀錄是否有日期與書寫者簽名？（第10條）</text>
  <text x="40" y="404" font-size="12" fill="#78716c" font-family="'Noto Sans TC', sans-serif">□ 安全事件是否即時記錄並通知家屬？（第14條）</text>
  <text x="400" y="404" font-size="12" fill="#78716c" font-family="'Noto Sans TC', sans-serif">□ 個案討論紀錄是否有實質內容與決議追蹤？（第8條）</text>

  <!-- 浮水印 -->
  <text x="756" y="442" font-size="13" fill="#c4bfb8" text-anchor="end" font-family="'Noto Sans TC', sans-serif">報告汪 reportwang.com</text>
</svg>
