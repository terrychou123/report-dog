<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"
     font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">個案紀錄常見 NG 四種類型</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">認識失分地雷，評鑑前提前修正</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- 左上卡片（#d97706）NG1 內容主觀空泛 -->
  <rect x="40" y="104" width="346" height="168" rx="12" fill="white"/>
  <rect x="40" y="104" width="346" height="44" rx="12" fill="#d97706"/>
  <rect x="40" y="128" width="346" height="20" fill="#d97706"/>
  <circle cx="68" cy="126" r="9" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
  <circle cx="68" cy="126" r="3" fill="white"/>
  <text x="213" y="133" text-anchor="middle" font-size="15" fill="white" font-weight="700">NG 1：內容主觀空泛</text>
  <text x="60" y="172" font-size="14" fill="#57534e">• 只寫「狀況穩定」「情緒尚好」</text>
  <text x="60" y="192" font-size="14" fill="#57534e">• 無具體行為或量化觀察描述</text>
  <text x="60" y="212" font-size="14" fill="#57534e">• 讓評鑑委員無從核實紀錄真實性</text>
  <text x="60" y="232" font-size="14" fill="#57534e">• 改正：改用5W1H客觀描述格式</text>
  <rect x="56" y="246" width="80" height="20" rx="10" fill="#fef3c7"/>
  <text x="96" y="260" text-anchor="middle" font-size="14" fill="#d97706" font-weight="600">高扣分風險</text>

  <!-- 右上卡片（#78716c）NG2 時間記錄不完整 -->
  <rect x="414" y="104" width="346" height="168" rx="12" fill="white"/>
  <rect x="414" y="104" width="346" height="44" rx="12" fill="#78716c"/>
  <rect x="414" y="128" width="346" height="20" fill="#78716c"/>
  <rect x="438" y="117" width="18" height="18" rx="3" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
  <line x1="441" y1="126" x2="453" y2="126" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
  <text x="587" y="133" text-anchor="middle" font-size="15" fill="white" font-weight="700">NG 2：時間記錄不完整</text>
  <text x="434" y="172" font-size="14" fill="#57534e">• 未標記記錄時間或書寫日期</text>
  <text x="434" y="192" font-size="14" fill="#57534e">• 工作人員未簽名確認</text>
  <text x="434" y="212" font-size="14" fill="#57534e">• 無法證明記錄的即時性</text>
  <text x="434" y="232" font-size="14" fill="#57534e">• 改正：記錄格式加入時間欄位</text>
  <rect x="430" y="246" width="80" height="20" rx="10" fill="#f5f5f4"/>
  <text x="470" y="260" text-anchor="middle" font-size="14" fill="#78716c" font-weight="600">形式缺失</text>

  <!-- 左下卡片（#57534e）NG3 計畫未更新 -->
  <rect x="40" y="288" width="346" height="162" rx="12" fill="white"/>
  <rect x="40" y="288" width="346" height="44" rx="12" fill="#57534e"/>
  <rect x="40" y="312" width="346" height="20" fill="#57534e"/>
  <line x1="60" y1="309" x2="68" y2="317" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-linecap="round"/>
  <line x1="68" y1="317" x2="84" y2="301" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-linecap="round"/>
  <text x="213" y="317" text-anchor="middle" font-size="15" fill="white" font-weight="700">NG 3：照顧計畫未動態更新</text>
  <text x="60" y="356" font-size="14" fill="#57534e">• 開案後計畫就沒有再修改</text>
  <text x="60" y="376" font-size="14" fill="#57534e">• 不反映個案身心狀況的變化</text>
  <text x="60" y="396" font-size="14" fill="#57534e">• 評鑑標準要求計畫動態調整</text>
  <text x="60" y="416" font-size="14" fill="#57534e">• 改正：每月評值後更新計畫</text>
  <rect x="56" y="430" width="80" height="20" rx="10" fill="#f5f0eb"/>
  <text x="96" y="444" text-anchor="middle" font-size="14" fill="#57534e" font-weight="600">重大缺失</text>

  <!-- 右下卡片（#a8a29e）NG4 特殊事件未記錄 -->
  <rect x="414" y="288" width="346" height="162" rx="12" fill="white"/>
  <rect x="414" y="288" width="346" height="44" rx="12" fill="#a8a29e"/>
  <rect x="414" y="312" width="346" height="20" fill="#a8a29e"/>
  <circle cx="440" cy="310" r="8" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
  <line x1="440" y1="302" x2="440" y2="307" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
  <circle cx="440" cy="314" r="2" fill="rgba(255,255,255,0.7)"/>
  <text x="587" y="317" text-anchor="middle" font-size="15" fill="white" font-weight="700">NG 4：特殊事件未書面化</text>
  <text x="434" y="356" font-size="14" fill="#57534e">• 跌倒、拒服務僅口頭告知</text>
  <text x="434" y="376" font-size="14" fill="#57534e">• 未書面記錄留存備查</text>
  <text x="434" y="396" font-size="14" fill="#57534e">• 發生糾紛時無文件保護機構</text>
  <text x="434" y="416" font-size="14" fill="#57534e">• 改正：建立事件記錄表單</text>
  <rect x="430" y="430" width="80" height="20" rx="10" fill="#f5f5f4"/>
  <text x="470" y="444" text-anchor="middle" font-size="14" fill="#a8a29e" font-weight="600">法律風險</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
