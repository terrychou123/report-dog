<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#f0efe8"/>
  <text x="400" y="48" font-family="'Noto Sans TC', sans-serif" font-size="32" font-weight="700" fill="#1e293b" text-anchor="middle">人力不足應對流程</text>
  <text x="400" y="78" font-family="'Noto Sans TC', sans-serif" font-size="22" fill="#78716c" text-anchor="middle">照服員緊急不足時的四步驟處理</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#a8a29e" stroke-width="1.5"/>
  <!-- 步驟1 -->
  <rect x="60" y="130" width="155" height="170" rx="14" fill="#d97706"/>
  <text x="137" y="190" font-family="'Noto Sans TC', sans-serif" font-size="36" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="137" y="226" font-family="'Noto Sans TC', sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">立即通報</text>
  <text x="137" y="252" font-family="'Noto Sans TC', sans-serif" font-size="14" fill="#fff3cd" text-anchor="middle">通報護理長</text>
  <text x="137" y="272" font-family="'Noto Sans TC', sans-serif" font-size="14" fill="#fff3cd" text-anchor="middle">及業務負責人</text>
  <!-- 箭頭 -->
  <text x="238" y="222" font-family="'Noto Sans TC', sans-serif" font-size="28" fill="#78716c" text-anchor="middle">&#8594;</text>
  <!-- 步驟2 -->
  <rect x="255" y="130" width="155" height="170" rx="14" fill="#78716c"/>
  <text x="332" y="190" font-family="'Noto Sans TC', sans-serif" font-size="36" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="332" y="226" font-family="'Noto Sans TC', sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">緊急召回</text>
  <text x="332" y="252" font-family="'Noto Sans TC', sans-serif" font-size="14" fill="#d4ccc8" text-anchor="middle">依 A6 危機管理</text>
  <text x="332" y="272" font-family="'Noto Sans TC', sans-serif" font-size="14" fill="#d4ccc8" text-anchor="middle">緊急人力調度</text>
  <!-- 箭頭 -->
  <text x="433" y="222" font-family="'Noto Sans TC', sans-serif" font-size="28" fill="#57534e" text-anchor="middle">&#8594;</text>
  <!-- 步驟3 -->
  <rect x="450" y="130" width="155" height="170" rx="14" fill="#57534e"/>
  <text x="527" y="190" font-family="'Noto Sans TC', sans-serif" font-size="36" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="527" y="226" font-family="'Noto Sans TC', sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">記錄說明</text>
  <text x="527" y="252" font-family="'Noto Sans TC', sans-serif" font-size="14" fill="#d4ccc8" text-anchor="middle">在值班記錄中</text>
  <text x="527" y="272" font-family="'Noto Sans TC', sans-serif" font-size="14" fill="#d4ccc8" text-anchor="middle">說明原因及緩和</text>
  <!-- 箭頭 -->
  <text x="628" y="222" font-family="'Noto Sans TC', sans-serif" font-size="28" fill="#94a3b8" text-anchor="middle">&#8594;</text>
  <!-- 步驟4 -->
  <rect x="645" y="130" width="115" height="170" rx="14" fill="#94a3b8"/>
  <text x="702" y="190" font-family="'Noto Sans TC', sans-serif" font-size="36" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="702" y="226" font-family="'Noto Sans TC', sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">根本改善</text>
  <text x="702" y="252" font-family="'Noto Sans TC', sans-serif" font-size="14" fill="#e2e8f0" text-anchor="middle">調整人力</text>
  <text x="702" y="272" font-family="'Noto Sans TC', sans-serif" font-size="14" fill="#e2e8f0" text-anchor="middle">結構避免</text>
  <text x="702" y="292" font-family="'Noto Sans TC', sans-serif" font-size="14" fill="#e2e8f0" text-anchor="middle">系統性不足</text>
  <!-- 底部說明 -->
  <rect x="40" y="322" width="720" height="60" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="60" y="344" font-family="'Noto Sans TC', sans-serif" font-size="15" font-weight="700" fill="#d97706">重要提醒：</text>
  <text x="170" y="344" font-family="'Noto Sans TC', sans-serif" font-size="15" fill="#57534e">A6 條危機管理計畫應包含緊急人力調度機制（如備用人員名單、緊急召回條件）</text>
  <text x="60" y="370" font-family="'Noto Sans TC', sans-serif" font-size="15" fill="#57534e">委員查核 4 年記錄，若屢次發生人力不足，將視為系統性問題而非個案</text>
  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" font-family="'Noto Sans TC', sans-serif">報告汪 reportwang.com</text>
</svg>
