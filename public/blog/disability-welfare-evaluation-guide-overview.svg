<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">109年度評鑑三大面向架構</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">共 49 項指標・3 大面向・1 項核心指標</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- 三欄卡片 (各寬 220px, 間距 20px, 起點 x=30) -->
  <!-- 第1欄：行政組織及經營管理 x=30 -->
  <rect x="30" y="108" width="220" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="30" y="108" width="220" height="8" rx="4" fill="#d97706"/>
  <rect x="30" y="112" width="220" height="4" fill="#d97706"/>
  <!-- 圓形數字 -->
  <circle cx="140" cy="195" r="44" fill="#fef3c7"/>
  <text x="140" y="183" text-anchor="middle" font-size="14" fill="#d97706" font-weight="700">面向</text>
  <text x="140" y="210" text-anchor="middle" font-size="36" fill="#d97706" font-weight="700">一</text>
  <!-- 標題與說明 -->
  <text x="140" y="275" text-anchor="middle" font-size="20" fill="#1e293b" font-weight="700">行政組織</text>
  <text x="140" y="298" text-anchor="middle" font-size="20" fill="#1e293b" font-weight="700">經營管理</text>
  <text x="140" y="325" text-anchor="middle" font-size="16" fill="#57534e">含會計及財務管理</text>
  <text x="140" y="348" text-anchor="middle" font-size="16" fill="#57534e">共 11 項指標</text>
  <!-- Pill -->
  <rect x="66" y="374" width="148" height="36" rx="18" fill="#fef3c7"/>
  <text x="140" y="398" text-anchor="middle" font-size="16" fill="#d97706" font-weight="600">最高分：8分</text>

  <!-- 第2欄：環境設施及安全維護 x=270 -->
  <rect x="270" y="108" width="220" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="270" y="108" width="220" height="8" rx="4" fill="#57534e"/>
  <rect x="270" y="112" width="220" height="4" fill="#57534e"/>
  <circle cx="380" cy="195" r="44" fill="#f5f0eb"/>
  <text x="380" y="183" text-anchor="middle" font-size="14" fill="#57534e" font-weight="700">面向</text>
  <text x="380" y="210" text-anchor="middle" font-size="36" fill="#57534e" font-weight="700">二</text>
  <text x="380" y="275" text-anchor="middle" font-size="20" fill="#1e293b" font-weight="700">環境設施</text>
  <text x="380" y="298" text-anchor="middle" font-size="20" fill="#1e293b" font-weight="700">安全維護</text>
  <text x="380" y="325" text-anchor="middle" font-size="16" fill="#57534e">含5項不計分新指標</text>
  <text x="380" y="348" text-anchor="middle" font-size="16" fill="#57534e">共 20 項指標</text>
  <rect x="306" y="374" width="148" height="36" rx="18" fill="#f5f0eb"/>
  <text x="380" y="398" text-anchor="middle" font-size="16" fill="#57534e" font-weight="600">核心指標：3105</text>

  <!-- 第3欄：專業服務 x=510 -->
  <rect x="510" y="108" width="220" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="510" y="108" width="220" height="8" rx="4" fill="#78716c"/>
  <rect x="510" y="112" width="220" height="4" fill="#78716c"/>
  <circle cx="620" cy="195" r="44" fill="#f5f5f4"/>
  <text x="620" y="183" text-anchor="middle" font-size="14" fill="#78716c" font-weight="700">面向</text>
  <text x="620" y="210" text-anchor="middle" font-size="36" fill="#78716c" font-weight="700">三</text>
  <text x="620" y="275" text-anchor="middle" font-size="20" fill="#1e293b" font-weight="700">專業服務</text>
  <text x="620" y="298" text-anchor="middle" font-size="20" fill="#1e293b" font-weight="700">個別化計畫</text>
  <text x="620" y="325" text-anchor="middle" font-size="16" fill="#57534e">ISP 為核心重點</text>
  <text x="620" y="348" text-anchor="middle" font-size="16" fill="#57534e">共 18 項指標</text>
  <rect x="546" y="374" width="148" height="36" rx="18" fill="#f5f5f4"/>
  <text x="620" y="398" text-anchor="middle" font-size="16" fill="#78716c" font-weight="600">ISP：12 分</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
