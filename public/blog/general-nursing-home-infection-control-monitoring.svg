<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">傳染病監測記錄 3 大欄位</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">最容易空白的部分——評鑑常見缺失</text>
  <line x1="28" y1="94" x2="772" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- N=3 直列清單 (H=90, outer_gap=38, inner_gap=13) -->
  <!-- Header y=38 -->
  <rect x="0" y="38" width="800" height="90" fill="white"/>
  <rect x="0" y="38" width="6" height="90" fill="#16a34a"/>
  <text x="28" y="92" font-size="34" fill="#1e293b" font-weight="700">傳染病監測記錄完整性自查表</text>

  <!-- Row 1：住民感染事件記錄（y=166, H=90） -->
  <rect x="28" y="166" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="166" width="6" height="90" rx="2" fill="#d97706"/>
  <circle cx="66" cy="211" r="20" fill="#d97706" opacity="0.15"/>
  <text x="66" y="218" font-size="18" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <text x="100" y="200" font-size="22" fill="#1e293b" font-weight="700">住民感染事件記錄</text>
  <text x="100" y="224" font-size="16" fill="#57534e">發現日期、感染類型、受影響住民名單、隔離措施啟動時間、症狀消退日期</text>
  <rect x="620" y="174" width="136" height="52" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="196" font-size="16" fill="#d97706" text-anchor="middle">每件事件</text>
  <text x="688" y="216" font-size="16" fill="#d97706" text-anchor="middle">一份記錄</text>

  <!-- Row 2：工作人員監測（y=269, H=90） -->
  <rect x="28" y="269" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="269" width="6" height="90" rx="2" fill="#78716c"/>
  <circle cx="66" cy="314" r="20" fill="#78716c" opacity="0.15"/>
  <text x="66" y="321" font-size="18" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <text x="100" y="303" font-size="22" fill="#1e293b" font-weight="700">工作人員傳染病監測</text>
  <text x="100" y="327" font-size="16" fill="#57534e">工作人員感染通報記錄、返回工作條件確認、疫苗接種狀況建檔</text>
  <rect x="620" y="277" width="136" height="52" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="299" font-size="16" fill="#78716c" text-anchor="middle">含疫苗接種</text>
  <text x="688" y="319" font-size="16" fill="#78716c" text-anchor="middle">建檔記錄</text>

  <!-- Row 3：追蹤改善記錄（y=372, H=90） -->
  <rect x="28" y="372" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="372" width="6" height="90" rx="2" fill="#16a34a"/>
  <circle cx="66" cy="417" r="20" fill="#16a34a"/>
  <text x="66" y="424" font-size="18" fill="#16a34a" text-anchor="middle" font-weight="900">3</text>
  <text x="100" y="406" font-size="22" fill="#1e293b" font-weight="700">追蹤改善機制（最常空白！）</text>
  <text x="100" y="430" font-size="16" fill="#57534e">感染事件分析→改善措施→執行確認→成效追蹤，四步驟缺一不可</text>
  <rect x="620" y="380" width="136" height="52" rx="8" fill="#16a34a" opacity="0.12"/>
  <text x="688" y="402" font-size="16" fill="#16a34a" text-anchor="middle">改善措施</text>
  <text x="688" y="422" font-size="16" fill="#16a34a" text-anchor="middle">追蹤不得空白</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
