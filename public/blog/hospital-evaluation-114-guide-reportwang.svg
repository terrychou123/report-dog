<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">報告汪四大功能對應評鑑備審</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">從自評查核到文件撰寫，全程支援醫院評鑑準備</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- 2×2 卡片佈局：上排 y=104, 下排 y=286, 卡片 w=362, h=170 -->
  <!-- 左欄 x=28, 右欄 x=410, 間距20 -->

  <!-- 卡片1：AI 自我查核（左上） -->
  <rect x="28" y="104" width="362" height="170" rx="12" fill="white"/>
  <rect x="28" y="104" width="362" height="44" rx="12" fill="#d97706"/>
  <rect x="28" y="128" width="362" height="20" fill="#d97706"/>
  <!-- 圖示 -->
  <rect x="52" y="115" width="18" height="18" rx="3" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1.5"/>
  <path d="M 56,124 L 60,129 L 68,116" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="209" y="131" text-anchor="middle" font-size="18" fill="white" font-weight="700">AI 輔助自我查核</text>
  <text x="48" y="172" font-size="15" fill="#57534e">• 對照 124 條基準逐條產生查核清單</text>
  <text x="48" y="194" font-size="15" fill="#57534e">• 自動標記 20 項必要條文缺口</text>
  <text x="48" y="216" font-size="15" fill="#57534e">• 優先顯示最高風險條文狀態</text>
  <rect x="44" y="244" width="120" height="22" rx="11" fill="#fef3c7"/>
  <text x="104" y="259" text-anchor="middle" font-size="14" fill="#d97706" font-weight="600">評鑑前 6 個月啟動</text>
  <rect x="174" y="244" width="100" height="22" rx="11" fill="#fef3c7"/>
  <text x="224" y="259" text-anchor="middle" font-size="14" fill="#d97706" font-weight="600">不漏任何條文</text>

  <!-- 卡片2：AI 報告撰寫（右上） -->
  <rect x="410" y="104" width="362" height="170" rx="12" fill="white"/>
  <rect x="410" y="104" width="362" height="44" rx="12" fill="#78716c"/>
  <rect x="410" y="128" width="362" height="20" fill="#78716c"/>
  <!-- 圖示 -->
  <rect x="434" y="113" width="14" height="18" rx="2" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1.5"/>
  <line x1="437" y1="120" x2="445" y2="120" stroke="rgba(255,255,255,0.7)" stroke-width="1"/>
  <line x1="437" y1="124" x2="445" y2="124" stroke="rgba(255,255,255,0.7)" stroke-width="1"/>
  <text x="591" y="131" text-anchor="middle" font-size="18" fill="white" font-weight="700">AI 輔助報告撰寫</text>
  <text x="430" y="172" font-size="15" fill="#57534e">• 協助撰寫 RCA 根本原因分析報告</text>
  <text x="430" y="194" font-size="15" fill="#57534e">• 生成感控年度計畫書初稿</text>
  <text x="430" y="216" font-size="15" fill="#57534e">• 品質改善計畫文件快速建立</text>
  <rect x="426" y="244" width="120" height="22" rx="11" fill="#f5f5f4"/>
  <text x="486" y="259" text-anchor="middle" font-size="14" fill="#78716c" font-weight="600">節省 50% 文書時間</text>
  <rect x="556" y="244" width="100" height="22" rx="11" fill="#f5f5f4"/>
  <text x="606" y="259" text-anchor="middle" font-size="14" fill="#78716c" font-weight="600">符合評鑑格式</text>

  <!-- 卡片3：多人協作（左下） -->
  <rect x="28" y="286" width="362" height="164" rx="12" fill="white"/>
  <rect x="28" y="286" width="362" height="44" rx="12" fill="#57534e"/>
  <rect x="28" y="310" width="362" height="20" fill="#57534e"/>
  <!-- 圖示：兩個人形 -->
  <circle cx="55" cy="302" r="7" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1.5"/>
  <path d="M 46,318 Q 55,312 64,318" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1.5"/>
  <circle cx="67" cy="302" r="7" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1.5"/>
  <path d="M 58,318 Q 67,312 76,318" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1.5"/>
  <text x="209" y="313" text-anchor="middle" font-size="18" fill="white" font-weight="700">多人協作</text>
  <text x="48" y="354" font-size="15" fill="#57534e">• 品管、護理、感控、藥劑同步準備</text>
  <text x="48" y="376" font-size="15" fill="#57534e">• 各科備審進度透明可追蹤</text>
  <text x="48" y="398" font-size="15" fill="#57534e">• 文件版本統一，杜絕資訊落差</text>
  <rect x="44" y="420" width="120" height="22" rx="11" fill="#f5f0eb"/>
  <text x="104" y="435" text-anchor="middle" font-size="14" fill="#57534e" font-weight="600">跨科部協同備審</text>

  <!-- 卡片4：定期追蹤（右下） -->
  <rect x="410" y="286" width="362" height="164" rx="12" fill="white"/>
  <rect x="410" y="286" width="362" height="44" rx="12" fill="#a8a29e"/>
  <rect x="410" y="310" width="362" height="20" fill="#a8a29e"/>
  <!-- 圖示：時鐘 -->
  <circle cx="437" cy="302" r="9" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1.5"/>
  <line x1="437" y1="296" x2="437" y2="302" stroke="rgba(255,255,255,0.7)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="437" y1="302" x2="441" y2="306" stroke="rgba(255,255,255,0.7)" stroke-width="1.5" stroke-linecap="round"/>
  <text x="591" y="313" text-anchor="middle" font-size="18" fill="white" font-weight="700">定期追蹤</text>
  <text x="430" y="354" font-size="15" fill="#57534e">• 設定感控委員會季報更新提醒</text>
  <text x="430" y="376" font-size="15" fill="#57534e">• 品質指標月報自動化追蹤</text>
  <text x="430" y="398" font-size="15" fill="#57534e">• 消防演練年度計畫提前通知</text>
  <rect x="426" y="420" width="130" height="22" rx="11" fill="#f5f5f4"/>
  <text x="491" y="435" text-anchor="middle" font-size="14" fill="#78716c" font-weight="600">告別評鑑前手忙腳亂</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
