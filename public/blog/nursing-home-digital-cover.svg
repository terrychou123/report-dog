  <text x="60" y="268"  font-size="24" fill="#57534e">B3 資訊化建置 × 多人協作 × AI 文書輔助</text>
  <rect x="60" y="294" width="600" height="2" fill="#a8a29e"/>
  <rect x="60" y="318" width="130" height="44" rx="22" fill="#d97706"/>
  <text x="125" y="346"  font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">文件分類搜尋</text>
  <rect x="206" y="318" width="130" height="44" rx="22" fill="#78716c"/>
