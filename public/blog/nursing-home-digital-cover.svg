  <rect x="352" y="318" width="130" height="44" rx="22" fill="#57534e"/>
  <text x="417" y="346"  font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">多人協作分工</text>
  <rect x="498" y="318" width="130" height="44" rx="22" fill="#94a3b8"/>
  <text x="563" y="346"  font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">AI 輔助撰寫</text>
  <!-- 右側箭頭圖示 -->
  <rect x="720" y="150" width="180" height="120" rx="14" fill="#ffffff" stroke="#a8a29e" stroke-width="2"/>
  <text x="810" y="193"  font-size="32" fill="#78716c" text-anchor="middle">紙本</text>
  <text x="810" y="249"  font-size="24" fill="#a8a29e" text-anchor="middle">散落、費時</text>
