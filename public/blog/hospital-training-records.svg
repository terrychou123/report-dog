<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <rect x="0" y="0" width="800" height="110" fill="#f5f5f4"/>
  <text x="400" y="52" text-anchor="middle" font-size="24" font-weight="900" fill="#1e293b">教育訓練文書管理三大要件</text>
  <text x="400" y="84" text-anchor="middle" font-size="14" fill="#78716c">計畫書類 · 出席紀錄類 · 評估學分類——三類文書分別管理，評鑑時快速調閱</text>

  <!-- 列1：計畫書類文件 y=166 -->
  <rect x="38" y="132" width="724" height="90" rx="12" fill="#ffffff" stroke="#e8e6de" stroke-width="1.5"/>
  <rect x="38" y="132" width="10" height="90" rx="5" fill="#d97706"/>
  <text x="64" y="168" font-size="17" font-weight="700" fill="#d97706">01</text>
  <text x="96" y="168" font-size="17" font-weight="700" fill="#1e293b">計畫書類文件</text>
  <text x="64" y="196" font-size="14" fill="#78716c">年度在職訓練計畫書、職前訓練計畫書，有主管核准、</text>
  <text x="64" y="214" font-size="14" fill="#78716c">有版本控制、評鑑前可快速取出</text>
  <rect x="638" y="152" width="88" height="30" rx="15" fill="#fef3c7"/>
  <text x="682" y="172" text-anchor="middle" font-size="14" fill="#d97706" font-weight="700">計畫留存</text>

  <!-- 列2：出席與紀錄類文件 y=269 -->
  <rect x="38" y="235" width="724" height="90" rx="12" fill="#ffffff" stroke="#e8e6de" stroke-width="1.5"/>
  <rect x="38" y="235" width="10" height="90" rx="5" fill="#78716c"/>
  <text x="64" y="271" font-size="17" font-weight="700" fill="#78716c">02</text>
  <text x="96" y="271" font-size="17" font-weight="700" fill="#1e293b">出席與紀錄類文件</text>
  <text x="64" y="299" font-size="14" fill="#78716c">每場訓練的簽到表（含姓名、職類、日期）、訓練主題、</text>
  <text x="64" y="317" font-size="14" fill="#78716c">講師資格，按職類分類歸檔</text>
  <rect x="638" y="255" width="88" height="30" rx="15" fill="#f5f5f4"/>
  <text x="682" y="275" text-anchor="middle" font-size="14" fill="#78716c" font-weight="700">出席留存</text>

  <!-- 列3：評估與學分類文件 y=372 -->
  <rect x="38" y="338" width="724" height="90" rx="12" fill="#ffffff" stroke="#e8e6de" stroke-width="1.5"/>
  <rect x="38" y="338" width="10" height="90" rx="5" fill="#57534e"/>
  <text x="64" y="374" font-size="17" font-weight="700" fill="#57534e">03</text>
  <text x="96" y="374" font-size="17" font-weight="700" fill="#1e293b">評估與學分類文件</text>
  <text x="64" y="402" font-size="14" fill="#78716c">訓練效果評估結果、CME/繼續教育學分完成證明，</text>
  <text x="64" y="420" font-size="14" fill="#78716c">建立個人訓練履歷</text>
  <rect x="638" y="358" width="88" height="30" rx="15" fill="#f5f5f4"/>
  <text x="682" y="378" text-anchor="middle" font-size="14" fill="#57534e" font-weight="700">學分留存</text>

  <!-- 浮水印 -->
  <text x="400" y="480" text-anchor="middle" font-size="14" fill="#a8a29e" opacity="0.6">報告汪 reportwang.com</text>
</svg>
