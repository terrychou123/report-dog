<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <rect x="0" y="29" width="800" height="60" fill="#e8e6de"/>
  <rect x="0" y="29" width="6" height="60" rx="2" fill="#d97706"/>
  <text x="28" y="74" font-size="30" fill="#1e293b" font-weight="700">評鑑前 1 個月最後衝刺確認清單</text>
  <rect x="28" y="118" width="744" height="60" rx="12" fill="#e8e6de"/>
  <rect x="28" y="118" width="6" height="60" rx="2" fill="#78716c"/>
  <circle cx="66" cy="148" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="154" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <text x="100" y="145" font-size="20" fill="#1e293b" font-weight="700">全體護理師執照效期確認（全部有效且機構相符）</text>
  <text x="100" y="166" font-size="16" fill="#57534e">執照若過期，評鑑當日不得執業且 A1.1 直接缺失</text>
  <rect x="620" y="126" width="136" height="44" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="142" font-size="16" fill="#d97706" text-anchor="middle">高優先</text>
  <text x="688" y="162" font-size="16" fill="#d97706" text-anchor="middle">必查</text>
  <rect x="28" y="191" width="744" height="60" rx="12" fill="#e8e6de"/>
  <rect x="28" y="191" width="6" height="60" rx="2" fill="#57534e"/>
  <circle cx="66" cy="221" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="227" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <text x="100" y="218" font-size="20" fill="#1e293b" font-weight="700">近 3 個月負責人查核紀錄完整性確認</text>
  <text x="100" y="239" font-size="16" fill="#57534e">每月均有且內容具體，非空洞的「視察正常」</text>
  <rect x="620" y="199" width="136" height="44" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="215" font-size="16" fill="#78716c" text-anchor="middle">3 個月</text>
  <text x="688" y="235" font-size="16" fill="#78716c" text-anchor="middle">完整</text>
  <rect x="28" y="264" width="744" height="60" rx="12" fill="#e8e6de"/>
  <rect x="28" y="264" width="6" height="60" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="294" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="300" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <text x="100" y="291" font-size="20" fill="#1e293b" font-weight="700">抽測護理師：A1.3 通報流程口頭說明</text>
  <text x="100" y="312" font-size="16" fill="#57534e">特別確認「24 小時通報」流程，護理師應能流暢說明</text>
  <rect x="620" y="272" width="136" height="44" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="288" font-size="16" fill="#57534e" text-anchor="middle">口頭</text>
  <text x="688" y="308" font-size="16" fill="#57534e" text-anchor="middle">抽測</text>
  <rect x="28" y="337" width="744" height="60" rx="12" fill="#e8e6de"/>
  <rect x="28" y="337" width="6" height="60" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="367" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="373" font-size="16" fill="#a8a29e" text-anchor="middle" font-weight="900">4</text>
  <text x="100" y="364" font-size="20" fill="#1e293b" font-weight="700">在職訓練年度時數確認（達 16 小時）</text>
  <text x="100" y="385" font-size="16" fill="#57534e">含簽到表與教材，未達者安排補訓</text>
  <rect x="620" y="345" width="136" height="44" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="361" font-size="16" fill="#a8a29e" text-anchor="middle">16 小時</text>
  <text x="688" y="381" font-size="16" fill="#a8a29e" text-anchor="middle">達標</text>
  <rect x="28" y="410" width="744" height="60" rx="12" fill="#e8e6de"/>
  <rect x="28" y="410" width="6" height="60" rx="2" fill="#6b7280"/>
  <circle cx="66" cy="440" r="16" fill="#94a3b8" opacity="0.15"/>
  <text x="66" y="446" font-size="16" fill="#94a3b8" text-anchor="middle" font-weight="900">5</text>
  <text x="100" y="437" font-size="20" fill="#1e293b" font-weight="700">B1：近期跨專業會議記錄完整</text>
  <text x="100" y="458" font-size="16" fill="#57534e">確認本年度次數、三種領域人員均有出席</text>
  <rect x="620" y="418" width="136" height="44" rx="8" fill="#94a3b8" opacity="0.12"/>
  <text x="688" y="434" font-size="16" fill="#94a3b8" text-anchor="middle">三種</text>
  <text x="688" y="454" font-size="16" fill="#94a3b8" text-anchor="middle">領域</text>
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
