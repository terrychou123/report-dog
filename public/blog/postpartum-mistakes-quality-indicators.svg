<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <rect x="0" y="29" width="800" height="60" fill="#e8e6de"/>
  <rect x="0" y="29" width="6" height="60" rx="2" fill="#d97706"/>
  <text x="28" y="74" font-size="30" fill="#1e293b" font-weight="700">A2.3 品質指標季報：四個必填要素</text>

  <rect x="28" y="118" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="118" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="66" cy="149" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="155" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <text x="100" y="146" font-size="20" fill="#1e293b" font-weight="700">本季 6 項指標數值</text>
  <text x="100" y="167" font-size="16" fill="#57534e">嬰兒紅臀/乳腺炎/純母乳率/體重回升/黃疸照光/滿意度</text>
  <rect x="620" y="126" width="136" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="143" font-size="16" fill="#d97706" text-anchor="middle">6 項</text>
  <text x="688" y="163" font-size="16" fill="#d97706" text-anchor="middle">每季</text>

  <rect x="28" y="193" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="193" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="66" cy="224" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="230" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <text x="100" y="221" font-size="20" fill="#1e293b" font-weight="700">與前季數據比較</text>
  <text x="100" y="242" font-size="16" fill="#57534e">趨勢方向（上升/下降/持平），指出異常變化</text>
  <rect x="620" y="201" width="136" height="46" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="218" font-size="16" fill="#78716c" text-anchor="middle">趨勢</text>
  <text x="688" y="238" font-size="16" fill="#78716c" text-anchor="middle">比較</text>

  <rect x="28" y="268" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="268" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="299" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="305" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <text x="100" y="296" font-size="20" fill="#1e293b" font-weight="700">異常原因說明</text>
  <text x="100" y="317" font-size="16" fill="#57534e">說明指標偏高/偏低的原因（人力、個案特性等）</text>
  <rect x="620" y="276" width="136" height="46" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="293" font-size="16" fill="#57534e" text-anchor="middle">原因</text>
  <text x="688" y="313" font-size="16" fill="#57534e" text-anchor="middle">分析</text>

  <rect x="28" y="343" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="343" width="6" height="62" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="374" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="380" font-size="16" fill="#a8a29e" text-anchor="middle" font-weight="900">4</text>
  <text x="100" y="371" font-size="20" fill="#1e293b" font-weight="700">改善措施與追蹤結果</text>
  <text x="100" y="392" font-size="16" fill="#57534e">改善行動、負責人、完成期限，下季追蹤是否改善</text>
  <rect x="620" y="351" width="136" height="46" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="368" font-size="16" fill="#a8a29e" text-anchor="middle">改善</text>
  <text x="688" y="388" font-size="16" fill="#a8a29e" text-anchor="middle">追蹤</text>

  <rect x="28" y="420" width="744" height="36" rx="8" fill="#fef3c7"/>
  <text x="400" y="444" font-size="16" fill="#d97706" text-anchor="middle">缺少任一要素，評鑑委員即認定「季報不完整」而扣分</text>

  <text x="760" y="490" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
