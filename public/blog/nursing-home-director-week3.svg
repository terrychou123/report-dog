<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <text x="400" y="48"  font-size="32" font-weight="700" fill="#1e293b" text-anchor="middle">第三週行動計畫</text>
  <text x="400" y="78"  font-size="22" fill="#78716c" text-anchor="middle">建立跨專業協作與危機管理機制</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#a8a29e" stroke-width="1.5"/>
  <rect x="40" y="108" width="100" height="36" rx="18" fill="#57534e"/>
  <text x="90" y="131"  font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">第 3 週</text>
  <!-- 項目1 -->
  <rect x="40" y="162" width="720" height="64" rx="8" fill="#ffffff"/>
  <rect x="40" y="162" width="6" height="64" rx="2" fill="#d97706"/>
  <circle cx="80" cy="194" r="18" fill="#d97706" opacity="0.15"/>
  <text x="80" y="200"  font-size="16" font-weight="700" fill="#d97706" text-anchor="middle">1</text>
  <text x="116" y="186"  font-size="17" font-weight="700" fill="#1e293b">確認 A6 危機管理計畫</text>
  <text x="116" y="210"  font-size="15" fill="#57534e">涵蓋至少 3 項風險（策略、天然災害、意外事件），每半年定期檢討</text>
  <!-- 項目2 -->
  <rect x="40" y="240" width="720" height="64" rx="8" fill="#ffffff"/>
  <rect x="40" y="240" width="6" height="64" rx="2" fill="#78716c"/>
  <circle cx="80" cy="272" r="18" fill="#78716c" opacity="0.15"/>
  <text x="80" y="278"  font-size="16" font-weight="700" fill="#78716c" text-anchor="middle">2</text>
  <text x="116" y="264"  font-size="17" font-weight="700" fill="#1e293b">主持第一次品質會議（B1）</text>
  <text x="116" y="288"  font-size="15" fill="#57534e">讓主管名字出現在會議紀錄，展現「實際參與行政與照護品質管理」</text>
  <!-- 項目3 -->
  <rect x="40" y="318" width="720" height="64" rx="8" fill="#ffffff"/>
  <rect x="40" y="318" width="6" height="64" rx="2" fill="#57534e"/>
  <circle cx="80" cy="350" r="18" fill="#57534e" opacity="0.15"/>
  <text x="80" y="356"  font-size="16" font-weight="700" fill="#57534e" text-anchor="middle">3</text>
  <text x="116" y="342"  font-size="17" font-weight="700" fill="#1e293b">確認 A14 在職訓練計畫執行狀況</text>
  <text x="116" y="366"  font-size="15" fill="#57534e">每人每年 20 小時（感染管制至少 4 小時），確認記錄是否完整</text>
  <!-- 項目4 -->
  <rect x="40" y="396" width="720" height="64" rx="8" fill="#ffffff"/>
  <rect x="40" y="396" width="6" height="64" rx="2" fill="#a8a29e"/>
  <circle cx="80" cy="428" r="18" fill="#94a3b8" opacity="0.15"/>
  <text x="80" y="434"  font-size="16" font-weight="700" fill="#94a3b8" text-anchor="middle">4</text>
  <text x="116" y="420"  font-size="17" font-weight="700" fill="#1e293b">更新對外聯繫機制與緊急聯絡名單</text>
  <text x="116" y="444"  font-size="15" fill="#57534e">特約醫師（B9）、主管機關窗口、工作手冊緊急聯繫名單更新</text>
  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" >報告汪 reportwang.com</text>
</svg>
