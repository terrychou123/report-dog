<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <text x="40" y="48" font-size="32" fill="#1e293b" font-weight="700">B 區：專業服務與生活照顧</text>
  <text x="40" y="76" font-size="22" fill="#57534e">評鑑核心 · 個案記錄必查 · 三題全覆蓋</text>
  <line x1="40" y1="92" x2="760" y2="92" stroke="#16a34a" stroke-width="2"/>

  <!-- B1 -->
  <rect x="40" y="110" width="228" height="330" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <rect x="40" y="110" width="228" height="46" rx="10" fill="#16a34a"/>
  <rect x="40" y="134" width="228" height="22" fill="#16a34a"/>
  <text x="154" y="125" font-size="18" fill="#fff" font-weight="700" text-anchor="middle">B1 個別化照護計畫</text>
  <text x="154" y="154" font-size="14" fill="#bbf7d0" text-anchor="middle">文件量最大 · 必查核心</text>
  <text x="56" y="186" font-size="14" fill="#57534e" font-weight="600">四時序要求：</text>
  <text x="56" y="206" font-size="14" fill="#57534e">1 24hr 初步護理評估</text>
  <text x="56" y="226" font-size="14" fill="#57534e">2 72hr 完整評估（四面向）</text>
  <text x="56" y="246" font-size="14" fill="#57534e">3 個別化計畫+跨專業簽名</text>
  <text x="56" y="266" font-size="14" fill="#57534e">4 每3個月修訂+評值記錄</text>
  <text x="56" y="298" font-size="14" fill="#dc2626" font-weight="600">最常見失分：</text>
  <text x="56" y="318" font-size="14" fill="#dc2626">• 評值記錄空白</text>
  <text x="56" y="338" font-size="14" fill="#dc2626">• 計畫超3個月未修訂</text>
  <text x="56" y="358" font-size="14" fill="#dc2626">• 缺跨專業簽名</text>

  <!-- B2 -->
  <rect x="286" y="110" width="228" height="330" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <rect x="286" y="110" width="228" height="46" rx="10" fill="#16a34a"/>
  <rect x="286" y="134" width="228" height="22" fill="#16a34a"/>
  <text x="400" y="125" font-size="18" fill="#fff" font-weight="700" text-anchor="middle">B2 跨專業整合照顧</text>
  <text x="400" y="154" font-size="14" fill="#bbf7d0" text-anchor="middle">真正跨領域 · 非湊人數</text>
  <text x="302" y="186" font-size="14" fill="#57534e" font-weight="600">四大要求：</text>
  <text x="302" y="206" font-size="14" fill="#57534e">1 每3個月召開跨專業會議</text>
  <text x="302" y="226" font-size="14" fill="#57534e">2 至少3種不同領域人員</text>
  <text x="302" y="246" font-size="14" fill="#57534e">3 住民/家屬參與記錄</text>
  <text x="302" y="266" font-size="14" fill="#57534e">4 ADL/認知功能定期評估</text>
  <text x="302" y="298" font-size="14" fill="#dc2626" font-weight="600">最常見失分：</text>
  <text x="302" y="318" font-size="14" fill="#dc2626">• 出席人員同屬護理領域</text>
  <text x="302" y="338" font-size="14" fill="#dc2626">• ADL退步未調整計畫</text>

  <!-- B3 -->
  <rect x="532" y="110" width="228" height="330" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <rect x="532" y="110" width="228" height="46" rx="10" fill="#16a34a"/>
  <rect x="532" y="134" width="228" height="22" fill="#16a34a"/>
  <text x="646" y="125" font-size="18" fill="#fff" font-weight="700" text-anchor="middle">B3 品質監測指標</text>
  <text x="646" y="154" font-size="14" fill="#bbf7d0" text-anchor="middle">數字+分析+改善</text>
  <text x="548" y="186" font-size="14" fill="#57534e" font-weight="600">監測指標（含）：</text>
  <text x="548" y="206" font-size="14" fill="#57534e">• 跌倒發生率</text>
  <text x="548" y="226" font-size="14" fill="#57534e">• 壓傷發生率</text>
  <text x="548" y="246" font-size="14" fill="#57534e">• 導管相關感染率</text>
  <text x="548" y="266" font-size="14" fill="#57534e">• 每季彙整分析報告</text>
  <text x="548" y="286" font-size="14" fill="#57534e">• 未達標有改善計畫</text>
  <text x="548" y="316" font-size="14" fill="#dc2626" font-weight="600">最常見失分：</text>
  <text x="548" y="336" font-size="14" fill="#dc2626">• 季報只有數字無分析</text>
  <text x="548" y="356" font-size="14" fill="#dc2626">• 無閾值（目標值）設定</text>

  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
