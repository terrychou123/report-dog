<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- 標題區 -->
  <text x="40" y="48" font-size="32" fill="#1e293b" font-weight="700">72 小時初評 4 大要素</text>
  <text x="40" y="78" font-size="22" fill="#57534e">B2 規定：入住後72小時內必須完成</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#d97706" stroke-width="2"/>

  <!-- 醒目時鐘提示 -->
  <rect x="40" y="108" width="720" height="46" rx="8" fill="#d97706"/>
  <text x="400" y="137" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">從入住當日起算 72 小時，不論週末假日均需完成</text>

  <!-- 要素 1 -->
  <rect x="40" y="168" width="340" height="140" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <rect x="40" y="168" width="340" height="46" rx="10" fill="#d97706"/>
  <rect x="40" y="194" width="340" height="20" fill="#d97706"/>
  <text x="210" y="196" font-size="17" fill="#ffffff" font-weight="700" text-anchor="middle">要素1：全面身體評估</text>
  <text x="58" y="232" font-size="14" fill="#57534e">ADL 功能評估（Barthel Index）</text>
  <text x="58" y="254" font-size="14" fill="#57534e">認知功能篩檢（MMSE/CDR）</text>
  <text x="58" y="276" font-size="14" fill="#57534e">生命徵象、皮膚狀況、疼痛評估</text>
  <text x="58" y="298" font-size="14" fill="#d97706">含基礎身體測量（體重/身高）</text>

  <!-- 要素 2 -->
  <rect x="420" y="168" width="340" height="140" rx="10" fill="#ffffff" stroke="#78716c" stroke-width="2"/>
  <rect x="420" y="168" width="340" height="46" rx="10" fill="#78716c"/>
  <rect x="420" y="194" width="340" height="20" fill="#78716c"/>
  <text x="590" y="196" font-size="17" fill="#ffffff" font-weight="700" text-anchor="middle">要素2：跌倒風險評估</text>
  <text x="438" y="232" font-size="14" fill="#57534e">Morse Fall Scale 或同等工具</text>
  <text x="438" y="254" font-size="14" fill="#57534e">評分結果 + 風險等級判定</text>
  <text x="438" y="276" font-size="14" fill="#57534e">高風險者須立即啟動預防措施</text>
  <text x="438" y="298" font-size="14" fill="#78716c">須有護理師親筆簽名確認</text>

  <!-- 要素 3 -->
  <rect x="40" y="322" width="340" height="130" rx="10" fill="#ffffff" stroke="#57534e" stroke-width="2"/>
  <rect x="40" y="322" width="340" height="46" rx="10" fill="#57534e"/>
  <rect x="40" y="348" width="340" height="20" fill="#57534e"/>
  <text x="210" y="350" font-size="17" fill="#ffffff" font-weight="700" text-anchor="middle">要素3：壓損風險評估</text>
  <text x="58" y="386" font-size="14" fill="#57534e">Braden Scale（滿分23分）</text>
  <text x="58" y="408" font-size="14" fill="#57534e">18分以下為高風險</text>
  <text x="58" y="430" font-size="14" fill="#57534e">須記錄目前皮膚狀況與評分</text>

  <!-- 要素 4 -->
  <rect x="420" y="322" width="340" height="130" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="420" y="322" width="340" height="46" rx="10" fill="#94a3b8"/>
  <rect x="420" y="348" width="340" height="20" fill="#94a3b8"/>
  <text x="590" y="350" font-size="17" fill="#ffffff" font-weight="700" text-anchor="middle">要素4：營養狀況評估</text>
  <text x="438" y="386" font-size="14" fill="#57534e">MNA（迷你營養評估）或 MUST</text>
  <text x="438" y="408" font-size="14" fill="#57534e">體重/BMI/近期體重變化</text>
  <text x="438" y="430" font-size="14" fill="#57534e">異常者須轉介營養師介入</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
