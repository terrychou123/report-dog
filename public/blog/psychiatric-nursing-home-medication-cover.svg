<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 右側裝飾區 -->
  <rect x="700" y="0" width="500" height="630" fill="#e8e6de"/>

  <!-- 特色標籤 -->
  <rect x="60" y="60" width="80" height="32" rx="16" fill="#d97706"/>
  <text x="100" y="81" font-size="16" fill="white" text-anchor="middle" >B1.6</text>
  <rect x="152" y="60" width="100" height="32" rx="16" fill="#78716c"/>
  <text x="202" y="81" font-size="16" fill="white" text-anchor="middle" >用藥安全</text>
  <rect x="264" y="60" width="100" height="32" rx="16" fill="#57534e"/>
  <text x="314" y="81" font-size="16" fill="white" text-anchor="middle" >管制藥品</text>

  <!-- 主標題第1行 -->
  <text x="60" y="220" font-size="120" fill="#1e293b"  font-weight="700">用藥安全</text>
  <!-- 主標題第2行 -->
  <text x="60" y="360" font-size="110" fill="#d97706"  font-weight="700">三讀五對</text>

  <!-- 副標題 -->
  <text x="60" y="430" font-size="36" fill="#57534e" >B1.6管制藥品管理與藥事服務評鑑重點</text>

  <!-- 分隔線 -->
  <line x1="60" y1="460" x2="620" y2="460" stroke="#dedad3" stroke-width="2"/>

  <!-- 右側大數字 -->
  <text x="950" y="260" font-size="220" fill="#d97706" text-anchor="middle"  font-weight="700" opacity="0.12">7</text>
  <text x="950" y="260" font-size="200" fill="#d97706" text-anchor="middle"  font-weight="700">7</text>
  <text x="950" y="310" font-size="28" fill="#78716c" text-anchor="middle" >評鑑子項目</text>

  <!-- 右側 pill 標籤 -->
  <rect x="780" y="370" width="170" height="40" rx="20" fill="#d97706"/>
  <text x="865" y="396" font-size="18" fill="white" text-anchor="middle" >藥品儲存</text>

  <rect x="780" y="422" width="170" height="40" rx="20" fill="#78716c"/>
  <text x="865" y="448" font-size="18" fill="white" text-anchor="middle" >三讀五對</text>

  <rect x="780" y="474" width="170" height="40" rx="20" fill="#57534e"/>
  <text x="865" y="500" font-size="18" fill="white" text-anchor="middle" >用藥反應</text>

  <rect x="780" y="526" width="170" height="40" rx="20" fill="#a8a29e"/>
  <text x="865" y="552" font-size="18" fill="white" text-anchor="middle" >管制藥銷燬</text>

  <!-- 品牌浮水印 -->
  <text x="1140" y="590" font-size="24" fill="#c4bfb8" text-anchor="end" >報告汪 reportwang.com</text>
