<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"
     font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- Header（y=50, h=76）-->
  <rect x="0" y="50" width="800" height="76" fill="white"/>
  <rect x="0" y="50" width="6" height="76" fill="#d97706" rx="2"/>
  <text x="28" y="104" font-size="36" fill="#1e293b" font-weight="700">個案紀錄保存 4 大規範（第 10 條）</text>

  <!-- ===== Row 1（y=160）#d97706 保存年限 ===== -->
  <rect x="28" y="160" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="160" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="66" cy="191" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="197" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <text x="100" y="188" font-size="22" fill="#1e293b" font-weight="700">保存年限要求</text>
  <text x="100" y="208" font-size="16" fill="#57534e">依規定保存至少 7 年，未成年個案或有糾紛者須依法延長保存</text>
  <rect x="620" y="168" width="136" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="187" font-size="16" fill="#d97706" text-anchor="middle">最少 7 年</text>
  <text x="688" y="207" font-size="16" fill="#d97706" text-anchor="middle">依法保存</text>

  <!-- ===== Row 2（y=235）#78716c 安全保存方式 ===== -->
  <rect x="28" y="235" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="235" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="66" cy="266" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="272" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <text x="100" y="263" font-size="22" fill="#1e293b" font-weight="700">安全保存方式</text>
  <text x="100" y="283" font-size="16" fill="#57534e">紙本須上鎖保管，電子檔案加密存取，防止資料外洩或未授權查閱</text>
  <rect x="620" y="243" width="136" height="46" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="262" font-size="16" fill="#78716c" text-anchor="middle">加密保管</text>
  <text x="688" y="282" font-size="16" fill="#78716c" text-anchor="middle">防止外洩</text>

  <!-- ===== Row 3（y=310）#57534e 查閱權限管理 ===== -->
  <rect x="28" y="310" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="310" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="341" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="347" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <text x="100" y="338" font-size="22" fill="#1e293b" font-weight="700">查閱權限管理</text>
  <text x="100" y="358" font-size="16" fill="#57534e">僅授權人員可查閱，每次查閱均需留存查閱記錄，保護個案隱私</text>
  <rect x="620" y="318" width="136" height="46" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="337" font-size="16" fill="#57534e" text-anchor="middle">授權管控</text>
  <text x="688" y="357" font-size="16" fill="#57534e" text-anchor="middle">隱私保護</text>

  <!-- ===== Row 4（y=385）#a8a29e 結案移交規定 ===== -->
  <rect x="28" y="385" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="385" width="6" height="62" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="416" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="422" font-size="16" fill="#a8a29e" text-anchor="middle" font-weight="900">4</text>
  <text x="100" y="413" font-size="22" fill="#1e293b" font-weight="700">結案移交規定</text>
  <text x="100" y="433" font-size="16" fill="#57534e">個案轉介或結案時，依規定辦理文件移交，並留存移交記錄</text>
  <rect x="620" y="393" width="136" height="46" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="412" font-size="16" fill="#a8a29e" text-anchor="middle">移交程序</text>
  <text x="688" y="432" font-size="16" fill="#a8a29e" text-anchor="middle">留存記錄</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
