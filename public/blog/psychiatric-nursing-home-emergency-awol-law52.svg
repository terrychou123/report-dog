<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <rect x="0" y="38" width="800" height="90" fill="#e8e6de"/>
  <rect x="0" y="38" width="6" height="90" rx="2" fill="#d97706"/>
  <text x="28" y="98" font-size="36" fill="#1e293b" font-weight="700">精神衛生法第 52 條擅離院通報義務</text>
  <rect x="28" y="166" width="744" height="90" rx="12" fill="#e8e6de"/>
  <rect x="28" y="166" width="6" height="90" rx="2" fill="#d97706"/>
  <circle cx="66" cy="211" r="20" fill="#d97706" opacity="0.15"/>
  <text x="66" y="217" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <text x="100" y="210" font-size="28" fill="#1e293b" font-weight="700">不假外出：立即通知保護人</text>
  <text x="100" y="234" font-size="18" fill="#57534e">應即通知法定代理人或保護義務人，通知需有記錄（通話紀錄等）</text>
  <rect x="620" y="185" width="136" height="52" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="205" font-size="16" fill="#d97706" text-anchor="middle">立即</text>
  <text x="688" y="225" font-size="16" fill="#d97706" text-anchor="middle">通知</text>
  <rect x="28" y="269" width="744" height="90" rx="12" fill="#e8e6de"/>
  <rect x="28" y="269" width="6" height="90" rx="2" fill="#78716c"/>
  <circle cx="66" cy="314" r="20" fill="#78716c" opacity="0.15"/>
  <text x="66" y="320" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <text x="100" y="313" font-size="28" fill="#1e293b" font-weight="700">行蹤不明：即報警察機關</text>
  <text x="100" y="337" font-size="18" fill="#57534e">無法確認住民下落，確認行蹤不明後應盡速通報，不能拖延</text>
  <rect x="620" y="288" width="136" height="52" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="308" font-size="16" fill="#78716c" text-anchor="middle">盡速</text>
  <text x="688" y="328" font-size="16" fill="#78716c" text-anchor="middle">報警</text>
  <rect x="28" y="372" width="744" height="90" rx="12" fill="#e8e6de"/>
  <rect x="28" y="372" width="6" height="90" rx="2" fill="#57534e"/>
  <circle cx="66" cy="417" r="20" fill="#57534e" opacity="0.15"/>
  <text x="66" y="423" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <text x="100" y="416" font-size="28" fill="#1e293b" font-weight="700">所有通報均需有書面記錄</text>
  <text x="100" y="440" font-size="18" fill="#57534e">通話記錄、簡訊截圖、警察受理號碼均為評鑑委員查核依據</text>
  <rect x="620" y="391" width="136" height="52" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="411" font-size="16" fill="#57534e" text-anchor="middle">書面</text>
  <text x="688" y="431" font-size="16" fill="#57534e" text-anchor="middle">記錄</text>
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
