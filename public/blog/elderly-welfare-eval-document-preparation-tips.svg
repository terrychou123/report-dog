<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 Header y=29 h=60 -->
  <rect x="28" y="29" width="744" height="60" rx="8" fill="#1e293b"/>
  <text x="400" y="66" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">5 大文件整理技巧｜報告汪功能輔助</text>

  <!-- N=5 版型：H=60, inner_gap=13, outer_gap=29 -->
  <!-- Row1 y=118 標籤分類 -->
  <rect x="28" y="118" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="118" width="6" height="60" rx="2" fill="#d97706"/>
  <circle cx="66" cy="148" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="154" font-size="16" font-weight="900" fill="#d97706" text-anchor="middle">1</text>
  <text x="100" y="145" font-size="20" font-weight="700" fill="#1e293b">用「標籤」功能分類六大區塊文件</text>
  <text x="100" y="166" font-size="16" fill="#57534e">建立 A/B/C/D/E/F 六個標籤資料夾，一鍵找到對應備審文件</text>
  <rect x="620" y="126" width="136" height="44" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="154" font-size="16" fill="#d97706" text-anchor="middle">報告汪標籤</text>

  <!-- Row2 y=191 AI生成PDCA -->
  <rect x="28" y="191" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="191" width="6" height="60" rx="2" fill="#78716c"/>
  <circle cx="66" cy="221" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="227" font-size="16" font-weight="900" fill="#78716c" text-anchor="middle">2</text>
  <text x="100" y="218" font-size="20" font-weight="700" fill="#1e293b">AI 報告撰寫功能產生 PDCA 分析報告</text>
  <text x="100" y="239" font-size="16" fill="#57534e">輸入監測數據，AI 自動生成 B13-B19 七大監測季度統計分析報告初稿</text>
  <rect x="620" y="199" width="136" height="44" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="227" font-size="16" fill="#78716c" text-anchor="middle">AI撰寫</text>

  <!-- Row3 y=264 多人協作 -->
  <rect x="28" y="264" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="264" width="6" height="60" rx="2" fill="#57534e"/>
  <circle cx="66" cy="294" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="300" font-size="16" font-weight="900" fill="#57534e" text-anchor="middle">3</text>
  <text x="100" y="291" font-size="20" font-weight="700" fill="#1e293b">多人協作分工，各負責人上傳對應文件</text>
  <text x="100" y="312" font-size="16" fill="#57534e">護理長負責B區、社工負責D區、主任負責A區，各自登入上傳，不互相干擾</text>
  <rect x="620" y="272" width="136" height="44" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="300" font-size="16" fill="#57534e" text-anchor="middle">協作共享</text>

  <!-- Row4 y=337 追蹤效期 -->
  <rect x="28" y="337" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="337" width="6" height="60" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="367" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="373" font-size="16" font-weight="900" fill="#a8a29e" text-anchor="middle">4</text>
  <text x="100" y="364" font-size="20" font-weight="700" fill="#1e293b">定期追蹤功能提醒文件更新時效</text>
  <text x="100" y="385" font-size="16" fill="#57534e">設定訓練時數到期、消防申報到期、藥品效期等提醒，不再漏失更新</text>
  <rect x="620" y="345" width="136" height="44" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="373" font-size="16" fill="#a8a29e" text-anchor="middle">追蹤提醒</text>

  <!-- Row5 y=410 自我查核 -->
  <rect x="28" y="410" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="410" width="6" height="60" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="440" r="16" fill="#94a3b8" opacity="0.15"/>
  <text x="66" y="446" font-size="16" font-weight="900" fill="#94a3b8" text-anchor="middle">5</text>
  <text x="100" y="437" font-size="20" font-weight="700" fill="#1e293b">評鑑前 AI 自我查核，逐項比對缺失風險</text>
  <text x="100" y="458" font-size="16" fill="#57534e">上傳現有文件，AI 對照 77 項評鑑指標自動分析是否符合評鑑要求</text>
  <rect x="620" y="418" width="136" height="44" rx="8" fill="#94a3b8" opacity="0.12"/>
  <text x="688" y="446" font-size="16" fill="#94a3b8" text-anchor="middle">AI查核</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
