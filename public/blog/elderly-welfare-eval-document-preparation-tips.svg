<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 Header y=29 h=60 -->
  <rect x="24" y="29" width="752" height="60" rx="8" fill="#1e293b"/>
  <text x="400" y="66" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="sans-serif">5 大文件整理技巧｜報告汪功能輔助</text>

  <!-- Row1 y=118 標籤分類 -->
  <rect x="24" y="118" width="752" height="60" rx="6" fill="#ffffff"/>
  <rect x="24" y="118" width="6" height="60" rx="3" fill="#d97706"/>
  <circle cx="66" cy="148" r="16" fill="#d97706"/>
  <text x="66" y="153" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="sans-serif">1</text>
  <text x="100" y="141" font-size="20" font-weight="700" fill="#1e293b" font-family="sans-serif">用「標籤」功能分類六大區塊文件</text>
  <text x="100" y="163" font-size="16" fill="#57534e" font-family="sans-serif">建立 A/B/C/D/E/F 六個標籤資料夾，一鍵找到對應備審文件</text>
  <rect x="620" y="129" width="136" height="38" rx="6" fill="#fef3c7"/>
  <text x="688" y="153" font-size="16" font-weight="700" fill="#d97706" text-anchor="middle" font-family="sans-serif">報告汪標籤</text>

  <!-- Row2 y=191 AI生成PDCA -->
  <rect x="24" y="191" width="752" height="60" rx="6" fill="#ffffff"/>
  <rect x="24" y="191" width="6" height="60" rx="3" fill="#78716c"/>
  <circle cx="66" cy="221" r="16" fill="#78716c"/>
  <text x="66" y="226" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="sans-serif">2</text>
  <text x="100" y="214" font-size="20" font-weight="700" fill="#1e293b" font-family="sans-serif">AI 報告撰寫功能產生 PDCA 分析報告</text>
  <text x="100" y="236" font-size="16" fill="#57534e" font-family="sans-serif">輸入監測數據，AI 自動生成 B13-B19 七大監測季度統計分析報告初稿</text>
  <rect x="620" y="202" width="136" height="38" rx="6" fill="#f5f5f4"/>
  <text x="688" y="226" font-size="16" font-weight="700" fill="#78716c" text-anchor="middle" font-family="sans-serif">AI撰寫</text>

  <!-- Row3 y=264 多人協作 -->
  <rect x="24" y="264" width="752" height="60" rx="6" fill="#ffffff"/>
  <rect x="24" y="264" width="6" height="60" rx="3" fill="#57534e"/>
  <circle cx="66" cy="294" r="16" fill="#57534e"/>
  <text x="66" y="299" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="sans-serif">3</text>
  <text x="100" y="287" font-size="20" font-weight="700" fill="#1e293b" font-family="sans-serif">多人協作分工，各負責人上傳對應文件</text>
  <text x="100" y="309" font-size="16" fill="#57534e" font-family="sans-serif">護理長負責B區、社工負責D區、主任負責A區，各自登入上傳，不互相干擾</text>
  <rect x="620" y="275" width="136" height="38" rx="6" fill="#f5f5f4"/>
  <text x="688" y="299" font-size="16" font-weight="700" fill="#57534e" text-anchor="middle" font-family="sans-serif">協作共享</text>

  <!-- Row4 y=337 追蹤效期 -->
  <rect x="24" y="337" width="752" height="60" rx="6" fill="#ffffff"/>
  <rect x="24" y="337" width="6" height="60" rx="3" fill="#a8a29e"/>
  <circle cx="66" cy="367" r="16" fill="#a8a29e"/>
  <text x="66" y="372" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="sans-serif">4</text>
  <text x="100" y="360" font-size="20" font-weight="700" fill="#1e293b" font-family="sans-serif">定期追蹤功能提醒文件更新時效</text>
  <text x="100" y="382" font-size="16" fill="#57534e" font-family="sans-serif">設定訓練時數到期、消防申報到期、藥品效期等提醒，不再漏失更新</text>
  <rect x="620" y="348" width="136" height="38" rx="6" fill="#f5f5f4"/>
  <text x="688" y="372" font-size="16" font-weight="700" fill="#a8a29e" text-anchor="middle" font-family="sans-serif">追蹤提醒</text>

  <!-- Row5 y=410 自我查核 -->
  <rect x="24" y="410" width="752" height="60" rx="6" fill="#ffffff"/>
  <rect x="24" y="410" width="6" height="60" rx="3" fill="#94a3b8"/>
  <circle cx="66" cy="440" r="16" fill="#94a3b8"/>
  <text x="66" y="445" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="sans-serif">5</text>
  <text x="100" y="433" font-size="20" font-weight="700" fill="#1e293b" font-family="sans-serif">評鑑前 AI 自我查核，逐項比對缺失風險</text>
  <text x="100" y="455" font-size="16" fill="#57534e" font-family="sans-serif">上傳現有文件，AI 對照 77 項評鑑指標自動分析是否符合評鑑要求</text>
  <rect x="620" y="421" width="136" height="38" rx="6" fill="#f0f9ff"/>
  <text x="688" y="445" font-size="16" font-weight="700" fill="#94a3b8" text-anchor="middle" font-family="sans-serif">AI查核</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" font-family="sans-serif">報告汪 reportwang.com</text>
</svg>
