<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 右側裝飾區塊 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>

  <!-- 右側裝飾 -->
  <text x="1010" y="200" font-size="72" font-weight="900" fill="#d97706" text-anchor="middle" opacity="0.85">自評</text>
  <text x="1010" y="262" font-size="72" font-weight="900" fill="#d97706" text-anchor="middle" opacity="0.85">升級</text>
  <text x="1010" y="296" font-size="22" fill="#78716c" text-anchor="middle" font-weight="500">Excel - AI 自動查核</text>

  <!-- 右側進化路徑卡片 -->
  <rect x="840" y="320" width="320" height="62" rx="8" fill="white" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="860" y="339" font-size="18" fill="#78716c" font-weight="700"> Excel 自評表</text>
  <text x="860" y="373" font-size="16" fill="#94a3b8">15 項 · 三段式評估 · 缺口盤點</text>

  <!-- 箭頭 -->
  <text x="1000" y="400" font-size="28" fill="#d97706" text-anchor="middle">| 升級</text>

  <rect x="840" y="414" width="320" height="62" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="860" y="433" font-size="18" fill="#d97706" font-weight="700"> AI 自動查核</text>
  <text x="860" y="467" font-size="16" fill="#57534e">逐條比對 · 自動標示缺失</text>

  <!-- 右側底部 -->
  <rect x="840" y="490" width="320" height="50" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="1000" y="521" font-size="24" fill="#d97706" text-anchor="middle" font-weight="700">附 Excel 免費下載</text>

  <!-- 左側主標題 -->
  <text x="60" y="190" font-size="92" font-weight="900" fill="#1e293b">一般護理之家</text>
  <text x="60" y="296" font-size="80" font-weight="900" fill="#d97706">評鑑自評表攻略</text>

  <line x1="60" y1="326" x2="790" y2="326" stroke="#dedad3" stroke-width="2"/>

  <text x="60" y="372" font-size="38" fill="#57534e" font-weight="400">從打勾到真正找出缺口的進化指南</text>

  <!-- 特色標籤 -->
  <rect x="60" y="404" width="210" height="52" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="165" y="440" font-size="28" fill="#d97706" text-anchor="middle" font-weight="600">15 項完整清單</text>

  <rect x="280" y="404" width="210" height="52" rx="10" fill="#16a34a" opacity="0.12"/>
  <text x="385" y="440" font-size="28" fill="#16a34a" text-anchor="middle" font-weight="600">三段式評估法</text>

  <rect x="500" y="404" width="210" height="52" rx="10" fill="#2563eb" opacity="0.12"/>
  <text x="605" y="440" font-size="28" fill="#2563eb" text-anchor="middle" font-weight="600">AI 查核升級</text>

  <!-- 適用對象 -->
  <text x="60" y="540" font-size="26" fill="#94a3b8">適用對象：護理長 · 評鑑負責人 · 希望系統性盤點評鑑準備的工作人員</text>

  <!-- 浮水印 -->
  <text x="1140" y="590" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
