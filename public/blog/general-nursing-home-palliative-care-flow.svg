<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8" rx="16"/>
  <rect x="20" y="20" width="760" height="460" fill="white" rx="12"/>

  <!-- 標題 -->
  <rect x="20" y="20" width="760" height="60" fill="#2563eb" rx="12"/>
  <rect x="20" y="60" width="760" height="20" fill="#2563eb"/>
  <text x="400" y="58" font-size="22" font-weight="700" fill="white" text-anchor="middle">AD 預立醫療決定辦理流程</text>

  <!-- 流程步驟 -->
  <!-- 步驟 1 -->
  <rect x="50" y="120" width="160" height="130" rx="12" fill="#eff6ff"/>
  <rect x="50" y="120" width="160" height="8" rx="4" fill="#2563eb"/>
  <text x="130" y="168" font-size="28" font-weight="900" fill="#2563eb" text-anchor="middle">1</text>
  <text x="130" y="200" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">護理之家</text>
  <text x="130" y="222" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">提供資訊</text>
  <text x="130" y="242" font-size="14" fill="#57534e" text-anchor="middle">入住時說明安寧</text>

  <!-- 箭頭 -->
  <line x1="210" y1="185" x2="255" y2="185" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- 步驟 2 -->
  <rect x="255" y="120" width="160" height="130" rx="12" fill="#f0fdf4"/>
  <rect x="255" y="120" width="160" height="8" rx="4" fill="#16a34a"/>
  <text x="335" y="168" font-size="28" font-weight="900" fill="#16a34a" text-anchor="middle">2</text>
  <text x="335" y="200" font-size="15" font-weight="700" fill="#16a34a" text-anchor="middle">住民表達</text>
  <text x="335" y="222" font-size="15" font-weight="700" fill="#16a34a" text-anchor="middle">意願</text>
  <text x="335" y="242" font-size="14" fill="#57534e" text-anchor="middle">記錄知情意願</text>

  <!-- 箭頭 -->
  <line x1="415" y1="185" x2="460" y2="185" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow2)"/>

  <!-- 步驟 3 -->
  <rect x="460" y="120" width="160" height="130" rx="12" fill="#faf5ff"/>
  <rect x="460" y="120" width="160" height="8" rx="4" fill="#9333ea"/>
  <text x="540" y="168" font-size="28" font-weight="900" fill="#9333ea" text-anchor="middle">3</text>
  <text x="540" y="200" font-size="15" font-weight="700" fill="#9333ea" text-anchor="middle">轉介辦理</text>
  <text x="540" y="222" font-size="14" fill="#57534e" text-anchor="middle">衛生所 / 醫院</text>
  <text x="540" y="242" font-size="14" fill="#57534e" text-anchor="middle">諮詢預約</text>

  <!-- 箭頭 -->
  <line x1="620" y1="185" x2="665" y2="185" stroke="#9333ea" stroke-width="3" marker-end="url(#arrow3)"/>

  <!-- 步驟 4 -->
  <rect x="590" y="120" width="160" height="130" rx="12" fill="#fef3c7"/>
  <rect x="590" y="120" width="160" height="8" rx="4" fill="#d97706"/>
  <text x="670" y="168" font-size="28" font-weight="900" fill="#d97706" text-anchor="middle">4</text>
  <text x="670" y="200" font-size="15" font-weight="700" fill="#d97706" text-anchor="middle">記錄存檔</text>
  <text x="670" y="222" font-size="14" fill="#57534e" text-anchor="middle">AD 完成記錄</text>
  <text x="670" y="242" font-size="14" fill="#57534e" text-anchor="middle">納入個案資料</text>

  <!-- 說明區塊 -->
  <rect x="50" y="285" width="700" height="155" rx="12" fill="#fafaf8"/>
  <rect x="50" y="285" width="4" height="155" rx="2" fill="#2563eb"/>
  <text x="70" y="315" font-size="15" font-weight="700" fill="#1e293b">記錄要點說明</text>
  <text x="70" y="342" font-size="14" fill="#57534e">• 是否已提供安寧療護相關資訊：[ ] 是 [ ] 否（原因：___）</text>
  <text x="70" y="366" font-size="14" fill="#57534e">• 住民意願：[ ] 有意願辦理 AD [ ] 暫無意願 [ ] 無決策能力（由家屬代為決定）</text>
  <text x="70" y="390" font-size="14" fill="#57534e">• 有意願者：[ ] 已轉介衛生所 [ ] 已轉介醫院 [ ] 已完成 AD 簽署（附影本）</text>
  <text x="70" y="414" font-size="14" fill="#57534e">• 說明日期：____ 年 __ 月 __ 日　說明人員：___________</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow2" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrow3" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/>
    </marker>
  </defs>
</svg>
