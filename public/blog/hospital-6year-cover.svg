<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="'Noto Sans TC', sans-serif">
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#fafaf9"/>

  <!-- 左側主要內容區 -->
  <!-- 頂部標籤列 -->
  <rect x="60" y="60" width="110" height="32" rx="16" fill="#e0e7ff"/>
  <text x="115" y="81" text-anchor="middle" font-size="14" fill="#4f46e5" font-weight="700">醫院評鑑</text>

  <rect x="182" y="60" width="100" height="32" rx="16" fill="#fef9c3"/>
  <text x="232" y="81" text-anchor="middle" font-size="14" fill="#ca8a04" font-weight="700">政策更新</text>

  <!-- 主標題 -->
  <text x="60" y="158" font-size="52" font-weight="900" fill="#1c1917" letter-spacing="-1">醫院評鑑改革</text>
  <text x="60" y="222" font-size="52" font-weight="900" fill="#4f46e5" letter-spacing="-1">4年-6年</text>

  <!-- 副標題 -->
  <text x="60" y="272" font-size="19" fill="#57534e" font-weight="500">週期延長 × 持續品管 × AI自我查核 × 118年準備</text>

  <!-- 分隔線 -->
  <line x1="60" y1="300" x2="480" y2="300" stroke="#e7e5e4" stroke-width="2"/>

  <!-- 特色標籤群組 -->
  <rect x="60" y="320" width="88" height="34" rx="8" fill="#e0e7ff"/>
  <text x="104" y="342" text-anchor="middle" font-size="14" fill="#4f46e5" font-weight="600">評鑑改革</text>

  <rect x="158" y="320" width="88" height="34" rx="8" fill="#fef3c7"/>
  <text x="202" y="342" text-anchor="middle" font-size="14" fill="#d97706" font-weight="600">6年週期</text>

  <rect x="256" y="320" width="88" height="34" rx="8" fill="#e0e7ff"/>
  <text x="300" y="342" text-anchor="middle" font-size="14" fill="#4f46e5" font-weight="600">持續品管</text>

  <rect x="60" y="364" width="104" height="34" rx="8" fill="#f5f5f4"/>
  <text x="112" y="386" text-anchor="middle" font-size="14" fill="#57534e" font-weight="600">AI自我查核</text>

  <rect x="174" y="364" width="88" height="34" rx="8" fill="#dcfce7"/>
  <text x="218" y="386" text-anchor="middle" font-size="14" fill="#16a34a" font-weight="600">118年備考</text>

  <!-- 底部說明 -->
  <text x="60" y="450" font-size="16" fill="#a8a29e">評鑑週期改革帶來品管思維根本轉變</text>
  <text x="60" y="474" font-size="16" fill="#a8a29e">從週期性衝刺走向持續性品質監測</text>

  <!-- 右側裝飾區塊 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de" rx="0"/>

  <!-- 右側大數字「6」 -->
  <text x="1010" y="210" text-anchor="middle" font-size="180" font-weight="900" fill="#4f46e5" opacity="0.12">6</text>
  <text x="1010" y="200" text-anchor="middle" font-size="140" font-weight="900" fill="#4f46e5">6</text>

  <!-- 右側小標 -->
  <text x="1010" y="230" text-anchor="middle" font-size="17" fill="#57534e" font-weight="600">年評鑑週期</text>

  <!-- 右側3個卡片 -->
  <!-- 卡片1 -->
  <rect x="848" y="260" width="304" height="78" rx="10" fill="#ffffff"/>
  <rect x="848" y="260" width="8" height="78" rx="4" fill="#4f46e5"/>
  <text x="872" y="290" font-size="15" font-weight="700" fill="#1c1917">4年-6年週期改革</text>
  <rect x="872" y="300" width="68" height="22" rx="11" fill="#e0e7ff"/>
  <text x="906" y="320" text-anchor="middle" font-size="14" fill="#4f46e5" font-weight="700">政策改革</text>
  <text x="948" y="316" font-size="14" fill="#78716c">衛福部推動</text>

  <!-- 卡片2 -->
  <rect x="848" y="350" width="304" height="78" rx="10" fill="#ffffff"/>
  <rect x="848" y="350" width="8" height="78" rx="4" fill="#d97706"/>
  <text x="872" y="380" font-size="15" font-weight="700" fill="#1c1917">118年預計下輪評鑑</text>
  <rect x="872" y="390" width="68" height="22" rx="11" fill="#fef3c7"/>
  <text x="906" y="410" text-anchor="middle" font-size="14" fill="#d97706" font-weight="700">2029年</text>
  <text x="948" y="406" font-size="14" fill="#78716c">正式評鑑</text>

  <!-- 卡片3 -->
  <rect x="848" y="440" width="304" height="78" rx="10" fill="#ffffff"/>
  <rect x="848" y="440" width="8" height="78" rx="4" fill="#16a34a"/>
  <text x="872" y="470" font-size="15" font-weight="700" fill="#1c1917">持續性品質監測</text>
  <rect x="872" y="480" width="68" height="22" rx="11" fill="#dcfce7"/>
  <text x="906" y="500" text-anchor="middle" font-size="14" fill="#16a34a" font-weight="700">日常品管</text>
  <text x="948" y="496" font-size="14" fill="#78716c">取代集中備審</text>

  <!-- 浮水印 -->
  <text x="600" y="612" text-anchor="middle" font-size="14" fill="#a8a29e" opacity="0.6">報告汪 reportwang.com</text>
</svg>
