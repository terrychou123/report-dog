  <rect x="420" y="341" width="20" height="20" rx="3" fill="#f0efe8" stroke="#a8a29e" stroke-width="1"/>
  <path d="M 424,351 L 428,356 L 437,344" fill="none" stroke="#a8a29e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="450" y="357" font-family="'Noto Sans TC', sans-serif" font-size="18" fill="#1e293b">書面評估報告完成</text>

  <!-- 勾選項目 y=371 改善計畫已制定 -->
  <rect x="420" y="371" width="20" height="20" rx="3" fill="#f0efe8" stroke="#a8a29e" stroke-width="1"/>
  <path d="M 424,381 L 428,386 L 437,374" fill="none" stroke="#a8a29e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="450" y="387" font-family="'Noto Sans TC', sans-serif" font-size="18" fill="#1e293b">改善計畫已制定</text>

  <!-- 未勾選項目 y=401 自評結果已呈報 -->
  <rect x="420" y="401" width="20" height="20" rx="3" fill="#f0efe8" stroke="#a8a29e" stroke-width="1"/>
  <text x="450" y="417" font-family="'Noto Sans TC', sans-serif" font-size="18" fill="#1e293b">自評結果已呈報</text>

  <!-- 底部分隔線與圖例 -->
