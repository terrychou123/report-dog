  <!-- 圖例 已勾選 -->
  <rect x="40" y="445" width="16" height="16" rx="3" fill="#f0efe8" stroke="#a8a29e" stroke-width="1"/>
  <path d="M 44,453 L 48,458 L 57,446" fill="none" stroke="#57534e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="62" y="459" font-family="'Noto Sans TC', sans-serif" font-size="15" fill="#57534e">已完成</text>
  <!-- 圖例 未勾選 -->
  <rect x="130" y="445" width="16" height="16" rx="3" fill="#f0efe8" stroke="#a8a29e" stroke-width="1"/>
  <text x="152" y="459" font-family="'Noto Sans TC', sans-serif" font-size="15" fill="#57534e">待完成</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-family="'Noto Sans TC', sans-serif" font-size="16" fill="#c4bfb8" text-anchor="end">報告汪 reportwang.com</text>
</svg>
