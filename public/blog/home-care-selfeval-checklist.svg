<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題 -->
  <text x="400" y="48" font-family="'Noto Sans TC', sans-serif" font-size="28" font-weight="700" fill="#1e293b" text-anchor="middle">品質自我檢核表（項目27-30）</text>
  <text x="400" y="78" font-family="'Noto Sans TC', sans-serif" font-size="20" fill="#57534e" text-anchor="middle">評鑑前按欄位逐一確認品質管理閉環</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#dedad3" stroke-width="1.5"/>

  <!-- 垂直分隔線 -->
  <line x1="400" y1="98" x2="400" y2="432" stroke="#dedad3" stroke-width="1.5"/>

  <!-- ===== 左欄 ===== -->

  <!-- 分類：品質改善（項27） -->
  <rect x="64" y="110" width="4" height="26" rx="2" fill="#d97706"/>
  <text x="78" y="129" font-family="'Noto Sans TC', sans-serif" font-size="18" font-weight="700" fill="#d97706">品質改善（項27）</text>

  <!-- 勾選項目 y=147 已建立品質改善計畫 -->
  <rect x="64" y="147" width="20" height="20" rx="3" fill="#f0efe8" stroke="#a8a29e" stroke-width="1"/>
  <path d="M 68,157 L 72,162 L 81,150" fill="none" stroke="#d97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="94" y="163" font-family="'Noto Sans TC', sans-serif" font-size="18" fill="#1e293b">已建立品質改善計畫</text>

  <!-- 勾選項目 y=177 缺失問題已記錄在案 -->
  <rect x="64" y="177" width="20" height="20" rx="3" fill="#f0efe8" stroke="#a8a29e" stroke-width="1"/>
