  <rect x="420" y="237" width="20" height="20" rx="3" fill="#f0efe8" stroke="#a8a29e" stroke-width="1"/>
  <text x="450" y="253" font-family="'Noto Sans TC', sans-serif" font-size="18" fill="#1e293b">調查報告已存檔備查</text>

