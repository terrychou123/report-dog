  <rect x="420" y="207" width="20" height="20" rx="3" fill="#f0efe8" stroke="#a8a29e" stroke-width="1"/>
  <path d="M 424,217 L 428,222 L 437,210" fill="none" stroke="#78716c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="450" y="223" font-family="'Noto Sans TC', sans-serif" font-size="18" fill="#1e293b">不滿意項目已改善</text>

