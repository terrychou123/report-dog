  <rect x="64" y="207" width="20" height="20" rx="3" fill="#f0efe8" stroke="#a8a29e" stroke-width="1"/>
  <path d="M 68,217 L 72,222 L 81,210" fill="none" stroke="#d97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="94" y="223" font-family="'Noto Sans TC', sans-serif" font-size="18" fill="#1e293b">改善措施已執行追蹤</text>

