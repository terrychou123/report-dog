<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題列 -->
  <rect x="30" y="50" width="740" height="62" rx="10" fill="#d97706"/>
  <text x="400" y="89" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="700" >七大監測 PDCA 循環 4 步驟</text>

  <!-- Row 1: Plan -->
  <rect x="30" y="160" width="740" height="62" rx="8" fill="#ffffff"/>
  <rect x="30" y="160" width="6" height="62" rx="2" fill="#d97706"/>
  <circle cx="66" cy="191" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="197" font-size="14" fill="#d97706" text-anchor="middle" font-weight="700" >P</text>
  <text x="100" y="183" font-size="20" fill="#1e293b" font-weight="700" >Plan — 訂定預防評估措施與處理辦法</text>
  <text x="100" y="207" font-size="16" fill="#57534e" >每項監測訂有書面處理辦法及流程，包含評估工具選用、高風險篩選標準、介入措施</text>
  <rect x="620" y="168" width="136" height="46" rx="8" fill="#fef3c7" opacity="0.12"/>
  <text x="688" y="196" font-size="15" fill="#d97706" text-anchor="middle" font-weight="600" >書面辦法完備</text>

  <!-- Row 2: Do -->
  <rect x="30" y="235" width="740" height="62" rx="8" fill="#ffffff"/>
  <rect x="30" y="235" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="66" cy="266" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="272" font-size="14" fill="#78716c" text-anchor="middle" font-weight="700" >D</text>
  <text x="100" y="258" font-size="20" fill="#1e293b" font-weight="700" >Do — 確實執行並完整記錄監測紀錄</text>
  <text x="100" y="282" font-size="16" fill="#57534e" >每月統計各監測項目發生件數、逐案記錄分析、處置紀錄隨個案記錄保存</text>
  <rect x="620" y="243" width="136" height="46" rx="8" fill="#eff6ff" opacity="0.12"/>
  <text x="688" y="271" font-size="15" fill="#78716c" text-anchor="middle" font-weight="600" >月統計完整</text>

  <!-- Row 3: Check -->
  <rect x="30" y="310" width="740" height="62" rx="8" fill="#ffffff"/>
  <rect x="30" y="310" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="66" cy="341" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="347" font-size="14" fill="#57534e" text-anchor="middle" font-weight="700" >C</text>
  <text x="100" y="333" font-size="20" fill="#1e293b" font-weight="700" >Check — 每季進行統計分析與檢討</text>
  <text x="100" y="357" font-size="16" fill="#57534e" >每季彙整監測數據，分析發生趨勢、高風險族群特徵，並與上季比較改善成效</text>
  <rect x="620" y="318" width="136" height="46" rx="8" fill="#f0fdf4" opacity="0.12"/>
  <text x="688" y="346" font-size="15" fill="#57534e" text-anchor="middle" font-weight="600" >季報告必備</text>

  <!-- Row 4: Act -->
  <rect x="30" y="385" width="740" height="62" rx="8" fill="#ffffff"/>
  <rect x="30" y="385" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="416" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="422" font-size="14" fill="#a8a29e" text-anchor="middle" font-weight="700" >A</text>
  <text x="100" y="408" font-size="20" fill="#1e293b" font-weight="700" >Act — 提出具體改善方案並追蹤執行</text>
  <text x="100" y="432" font-size="16" fill="#57534e" >針對分析結果提出具體改善對策、執行期限與負責人，下季追蹤成效並更新辦法</text>
  <rect x="620" y="393" width="136" height="46" rx="8" fill="#fef3c7" opacity="0.12"/>
  <text x="688" y="421" font-size="15" fill="#a8a29e" text-anchor="middle" font-weight="600" >改善追蹤閉環</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" >報告汪 reportwang.com</text>
</svg>
