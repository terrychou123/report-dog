<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>

  <!-- 左側色塊 -->
  <rect x="0" y="0" width="480" height="630" fill="#dc2626" rx="0"/>
  <rect x="460" y="0" width="40" height="630" fill="#fef2f2" rx="0"/>

  <!-- 大字 A1.2 -->
  <text x="60" y="200" font-size="140" font-weight="900" fill="white" opacity="0.15">A1.2</text>
  <text x="60" y="320" font-size="80" font-weight="900" fill="white">A1.2</text>
  <text x="60" y="390" font-size="28" fill="#fef2f2">人力配置與急救訓練</text>
  <text x="60" y="440" font-size="22" fill="#fef2f2">Staffing &amp; CPR Training</text>

  <!-- 右側標題 -->
  <text x="540" y="120" font-size="38" font-weight="900" fill="#dc2626">護理之家</text>
  <text x="540" y="175" font-size="35" font-weight="900" fill="#dc2626">人力配置與急救訓練</text>
  <text x="540" y="230" font-size="24" fill="#dc2626">A1.2 評鑑基準 · BLS/AED 訓練</text>
  <text x="540" y="270" font-size="20" fill="#57534e">115 年度評鑑基準完整解析</text>

  <!-- 4項要素卡片 -->
  <rect x="540" y="310" width="290" height="110" rx="12" fill="white" filter="url(#shadow)"/>
  <rect x="540" y="310" width="8" height="110" rx="4" fill="#dc2626"/>
  <text x="562" y="350" font-size="24" font-weight="700" fill="#dc2626">1 護理主管資格</text>
  <text x="562" y="375" font-size="20" fill="#57534e">護理師執照</text>
  <text x="562" y="398" font-size="20" fill="#57534e">護理行政 3 年經驗</text>

  <rect x="850" y="310" width="290" height="110" rx="12" fill="white" filter="url(#shadow)"/>
  <rect x="850" y="310" width="8" height="110" rx="4" fill="#ea580c"/>
  <text x="872" y="358" font-size="24" font-weight="700" fill="#dc2626">2 急救訓練效期管理</text>
  <text x="872" y="389" font-size="20" fill="#57534e">每 2 年 1 次 · 8 小時以上</text>
  <text x="872" y="398" font-size="20" fill="#57534e">含 BLS + AED 操作</text>

  <rect x="540" y="440" width="290" height="110" rx="12" fill="white" filter="url(#shadow)"/>
  <rect x="540" y="440" width="8" height="110" rx="4" fill="#d97706"/>
  <text x="562" y="480" font-size="24" font-weight="700" fill="#dc2626">3 新進護理人員訓練</text>
  <text x="562" y="505" font-size="20" fill="#57534e">訓練計畫書</text>
  <text x="562" y="528" font-size="20" fill="#57534e">訓練記錄 + 考核</text>

  <rect x="850" y="440" width="290" height="110" rx="12" fill="white" filter="url(#shadow)"/>
  <rect x="850" y="440" width="8" height="110" rx="4" fill="#16a34a"/>
  <text x="872" y="488" font-size="24" font-weight="700" fill="#dc2626">4 照服員配置與持證</text>
  <text x="872" y="519" font-size="20" fill="#57534e">比例符合規定</text>
  <text x="872" y="528" font-size="20" fill="#57534e">訓練結業證明書管理</text>

  <!-- 浮水印 -->
  <text x="1140" y="590" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>

  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0003"/>
    </filter>
  </defs>
</svg>
