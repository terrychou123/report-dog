<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 Header y=50 h=76 -->
  <rect x="28" y="50" width="744" height="76" rx="8" fill="#1e293b"/>
  <text x="400" y="82" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">A+B 區重點備審文件</text>
  <text x="400" y="110" font-size="16" fill="#94a3b8" text-anchor="middle">行政管理 + 專業照護品質</text>

  <!-- N=4 版型：H=62 -->
  <!-- Row1 y=160 A1/A3 工作手冊與業務計畫 -->
  <rect x="28" y="160" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="160" width="6" height="62" rx="2" fill="#d97706"/>
  <circle cx="66" cy="191" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="197" font-size="16" font-weight="900" fill="#d97706" text-anchor="middle">A1</text>
  <text x="100" y="188" font-size="18" font-weight="700" fill="#1e293b">工作手冊 + 業務計畫書（A1、A3）</text>
  <text x="100" y="208" font-size="16" fill="#57534e">含組織架構、業務執掌、年度計畫、績效紀錄及每年審閱修訂紀錄</text>
  <rect x="620" y="168" width="136" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="197" font-size="16" fill="#d97706" text-anchor="middle">行政/主管</text>

  <!-- Row2 y=235 A7-A11 五大職類人事 -->
  <rect x="28" y="235" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="235" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="66" cy="266" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="272" font-size="16" font-weight="900" fill="#78716c" text-anchor="middle">A7</text>
  <text x="100" y="263" font-size="18" font-weight="700" fill="#1e293b">五大職類人事資料（A7–A11）</text>
  <text x="100" y="283" font-size="16" fill="#57534e">業務負責人、社工、護理、兼任專業人員、照服員：資格證件＋排班表＋勞健保</text>
  <rect x="620" y="243" width="136" height="46" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="272" font-size="16" fill="#78716c" text-anchor="middle">五職類</text>

  <!-- Row3 y=310 A13-A14 訓練記錄 -->
  <rect x="28" y="310" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="310" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="66" cy="341" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="347" font-size="16" font-weight="900" fill="#57534e" text-anchor="middle">A13</text>
  <text x="100" y="338" font-size="18" font-weight="700" fill="#1e293b">職前16H + 在職20H訓練記錄（A13、A14）</text>
  <text x="100" y="358" font-size="16" fill="#57534e">各類訓練正本、急救完訓文件（BLS/CPR效期內）、機構外訓練心得報告</text>
  <rect x="620" y="318" width="136" height="46" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="347" font-size="16" fill="#57534e" text-anchor="middle">逐人統計</text>

  <!-- Row4 y=385 B2/B13-19 -->
  <rect x="28" y="385" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="385" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="416" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="422" font-size="16" font-weight="900" fill="#a8a29e" text-anchor="middle">B2</text>
  <text x="100" y="413" font-size="18" font-weight="700" fill="#1e293b">個案服務計畫 + 七大監測PDCA（B2、B13–B19）</text>
  <text x="100" y="433" font-size="16" fill="#57534e">72H內評估、每季照護計畫更新、七大監測逐案分析及季度統計分析報告</text>
  <rect x="620" y="393" width="136" height="46" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="422" font-size="16" fill="#a8a29e" text-anchor="middle">二級加強</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
