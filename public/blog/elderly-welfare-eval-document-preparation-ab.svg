<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 Header y=50 h=76 -->
  <rect x="24" y="50" width="752" height="76" rx="8" fill="#1e293b"/>
  <text x="400" y="82" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="sans-serif">A+B 區重點備審文件</text>
  <text x="400" y="110" font-size="16" fill="#94a3b8" text-anchor="middle" font-family="sans-serif">行政管理 + 專業照護品質</text>

  <!-- Row1 y=160 A1/A3 工作手冊與業務計畫 -->
  <rect x="24" y="160" width="752" height="62" rx="6" fill="#ffffff"/>
  <rect x="24" y="160" width="6" height="62" rx="3" fill="#d97706"/>
  <circle cx="66" cy="191" r="16" fill="#d97706"/>
  <text x="66" y="196" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="sans-serif">A1</text>
  <text x="100" y="183" font-size="20" font-weight="700" fill="#1e293b" font-family="sans-serif">工作手冊 + 業務計畫書（A1、A3）</text>
  <text x="100" y="207" font-size="16" fill="#57534e" font-family="sans-serif">含組織架構、業務執掌、年度計畫、績效紀錄及每年審閱修訂紀錄</text>
  <rect x="620" y="171" width="136" height="40" rx="6" fill="#fef3c7"/>
  <text x="688" y="196" font-size="16" font-weight="700" fill="#d97706" text-anchor="middle" font-family="sans-serif">行政/主管</text>

  <!-- Row2 y=235 A7-A11 五大職類人事 -->
  <rect x="24" y="235" width="752" height="62" rx="6" fill="#ffffff"/>
  <rect x="24" y="235" width="6" height="62" rx="3" fill="#78716c"/>
  <circle cx="66" cy="266" r="16" fill="#78716c"/>
  <text x="66" y="271" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="sans-serif">A7</text>
  <text x="100" y="258" font-size="20" font-weight="700" fill="#1e293b" font-family="sans-serif">五大職類人事資料（A7–A11）</text>
  <text x="100" y="282" font-size="16" fill="#57534e" font-family="sans-serif">業務負責人、社工、護理、兼任專業人員、照服員：資格證件＋排班表＋勞健保</text>
  <rect x="620" y="246" width="136" height="40" rx="6" fill="#f5f5f4"/>
  <text x="688" y="271" font-size="16" font-weight="700" fill="#78716c" text-anchor="middle" font-family="sans-serif">五職類</text>

  <!-- Row3 y=310 A13-A14 訓練記錄 -->
  <rect x="24" y="310" width="752" height="62" rx="6" fill="#ffffff"/>
  <rect x="24" y="310" width="6" height="62" rx="3" fill="#57534e"/>
  <circle cx="66" cy="341" r="16" fill="#57534e"/>
  <text x="66" y="346" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="sans-serif">A13</text>
  <text x="100" y="333" font-size="20" font-weight="700" fill="#1e293b" font-family="sans-serif">職前16H + 在職20H訓練記錄（A13、A14）</text>
  <text x="100" y="357" font-size="16" fill="#57534e" font-family="sans-serif">各類訓練正本、急救完訓文件（BLS/CPR效期內）、機構外訓練心得報告</text>
  <rect x="620" y="321" width="136" height="40" rx="6" fill="#f5f5f4"/>
  <text x="688" y="346" font-size="16" font-weight="700" fill="#57534e" text-anchor="middle" font-family="sans-serif">逐人統計</text>

  <!-- Row4 y=385 B2/B13-19 -->
  <rect x="24" y="385" width="752" height="62" rx="6" fill="#ffffff"/>
  <rect x="24" y="385" width="6" height="62" rx="3" fill="#a8a29e"/>
  <circle cx="66" cy="416" r="16" fill="#a8a29e"/>
  <text x="66" y="421" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="sans-serif">B2</text>
  <text x="100" y="408" font-size="20" font-weight="700" fill="#1e293b" font-family="sans-serif">個案服務計畫 + 七大監測PDCA（B2、B13–B19）</text>
  <text x="100" y="432" font-size="16" fill="#57534e" font-family="sans-serif">72H內評估、每季照護計畫更新、七大監測逐案分析及季度統計分析報告</text>
  <rect x="620" y="396" width="136" height="40" rx="6" fill="#fef9ee"/>
  <text x="688" y="421" font-size="16" font-weight="700" fill="#a8a29e" text-anchor="middle" font-family="sans-serif">二級加強</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" font-family="sans-serif">報告汪 reportwang.com</text>
</svg>
