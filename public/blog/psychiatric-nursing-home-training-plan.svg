<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題 -->
  <text x="400" y="48" font-size="32" fill="#1e293b" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-weight="700">年度訓練計畫規劃流程</text>
  <text x="400" y="78" font-size="22" fill="#78716c" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">從需求評估到訓練記錄存檔的完整流程</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#dedad3" stroke-width="2"/>

  <!-- 步驟1 -->
  <rect x="40" y="120" width="155" height="300" rx="12" fill="#d97706"/>
  <text x="117" y="185" font-size="18" fill="white" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-weight="700">需求評估</text>
  <line x1="60" y1="200" x2="175" y2="200" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  <text x="117" y="228" font-size="14" fill="rgba(255,255,255,0.95)" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">依機構發展</text>
  <text x="117" y="250" font-size="14" fill="rgba(255,255,255,0.9)" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">與服務方向，</text>
  <text x="117" y="272" font-size="14" fill="rgba(255,255,255,0.9)" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">確認各職類</text>
  <text x="117" y="294" font-size="14" fill="rgba(255,255,255,0.9)" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">訓練需求</text>

  <!-- 箭頭1 -->
  <polygon points="210,270 225,260 225,280" fill="#57534e"/>
  <line x1="195" y1="270" x2="225" y2="270" stroke="#57534e" stroke-width="2"/>

  <!-- 步驟2 -->
  <rect x="230" y="120" width="155" height="300" rx="12" fill="#78716c"/>
  <text x="307" y="185" font-size="18" fill="white" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-weight="700">計畫訂定</text>
  <line x1="250" y1="200" x2="365" y2="200" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  <text x="307" y="228" font-size="14" fill="rgba(255,255,255,0.95)" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">內部訓練+</text>
  <text x="307" y="250" font-size="14" fill="rgba(255,255,255,0.9)" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">外部訓練辦法，</text>
  <text x="307" y="272" font-size="14" fill="rgba(255,255,255,0.9)" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">確保感控</text>
  <text x="307" y="294" font-size="14" fill="rgba(255,255,255,0.9)" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">4小時達標</text>

  <!-- 箭頭2 -->
  <polygon points="400,270 415,260 415,280" fill="#57534e"/>
  <line x1="385" y1="270" x2="415" y2="270" stroke="#57534e" stroke-width="2"/>

  <!-- 步驟3 -->
  <rect x="420" y="120" width="155" height="300" rx="12" fill="#57534e"/>
  <text x="497" y="185" font-size="18" fill="white" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-weight="700">執行記錄</text>
  <line x1="440" y1="200" x2="555" y2="200" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  <text x="497" y="228" font-size="14" fill="rgba(255,255,255,0.95)" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">每次訓練</text>
  <text x="497" y="250" font-size="14" fill="rgba(255,255,255,0.9)" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">記錄時數、</text>
  <text x="497" y="272" font-size="14" fill="rgba(255,255,255,0.9)" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">內容、</text>
  <text x="497" y="294" font-size="14" fill="rgba(255,255,255,0.9)" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">出席人員</text>

  <!-- 箭頭3 -->
  <polygon points="590,270 605,260 605,280" fill="#57534e"/>
  <line x1="575" y1="270" x2="605" y2="270" stroke="#57534e" stroke-width="2"/>

  <!-- 步驟4 -->
  <rect x="610" y="120" width="150" height="300" rx="12" fill="#a8a29e"/>
  <text x="685" y="185" font-size="18" fill="white" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-weight="700">年度彙整</text>
  <line x1="630" y1="200" x2="740" y2="200" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  <text x="685" y="228" font-size="14" fill="rgba(255,255,255,0.95)" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">統計每人時數，</text>
  <text x="685" y="250" font-size="14" fill="rgba(255,255,255,0.9)" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">確認20小時</text>
  <text x="685" y="272" font-size="14" fill="rgba(255,255,255,0.9)" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">達標，</text>
  <text x="685" y="294" font-size="14" fill="rgba(255,255,255,0.9)" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">BLS達50%</text>

  <!-- 品牌浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-family="'Noto Sans TC', sans-serif">報告汪 reportwang.com</text>
</svg>
