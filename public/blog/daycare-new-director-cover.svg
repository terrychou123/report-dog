<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans TC', sans-serif">
  <!-- 主背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>

  <!-- 右側裝飾塊 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>

  <!-- 右側裝飾大數字 "10" -->
  <text x="990" y="200" font-size="180" font-weight="900" fill="#dedad3" text-anchor="middle" letter-spacing="-8">10</text>
  <text x="990" y="240" font-size="18" fill="#a8a29e" text-anchor="middle">件第一年必懂的事</text>

  <!-- 右側 4 個小圖示卡片 -->
  <rect x="845" y="270" width="155" height="64" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="923" y="298" font-size="13" fill="#78716c" text-anchor="middle" font-weight="700">業務計畫</text>
  <text x="923" y="318" font-size="11" fill="#a8a29e" text-anchor="middle">第 23 條</text>

  <rect x="1010" y="270" width="155" height="64" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="1088" y="298" font-size="13" fill="#78716c" text-anchor="middle" font-weight="700">工作手冊</text>
  <text x="1088" y="318" font-size="11" fill="#a8a29e" text-anchor="middle">第 24 條</text>

  <rect x="845" y="348" width="155" height="64" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="923" y="376" font-size="13" fill="#78716c" text-anchor="middle" font-weight="700">教育訓練</text>
  <text x="923" y="396" font-size="11" fill="#a8a29e" text-anchor="middle">第 29 條</text>

  <rect x="1010" y="348" width="155" height="64" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="1088" y="376" font-size="13" fill="#78716c" text-anchor="middle" font-weight="700">督導機制</text>
  <text x="1088" y="396" font-size="11" fill="#a8a29e" text-anchor="middle">第 9 條</text>

  <!-- 右側底部標籤 -->
  <rect x="845" y="430" width="320" height="40" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="1005" y="455" font-size="14" fill="#d97706" text-anchor="middle" font-weight="700">115 年度評鑑基準對照版</text>

  <!-- 左側內容區 -->
  <!-- tag 標籤 -->
  <rect x="60" y="60" width="100" height="30" rx="6" fill="#e8e6de"/>
  <text x="110" y="80" font-size="13" fill="#78716c" text-anchor="middle" font-weight="600">管理指南</text>

  <!-- 主標題 -->
  <text x="60" y="175" font-size="58" font-weight="900" fill="#1e293b">日照中心</text>
  <text x="60" y="250" font-size="58" font-weight="900" fill="#d97706">新手主任指南</text>

  <!-- 水平分隔線 -->
  <line x1="60" y1="278" x2="760" y2="278" stroke="#dedad3" stroke-width="2"/>

  <!-- 副標題 -->
  <text x="60" y="316" font-size="20" fill="#64748b">115 年度 · 對照評鑑基準 · 上任第一年必懂 10 件事</text>

  <!-- 下方特色說明列 -->
  <!-- 卡片1：人力管理 -->
  <rect x="60" y="360" width="158" height="72" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="139" y="389" font-size="13" fill="#d97706" text-anchor="middle" font-weight="700">人力管理</text>
  <text x="139" y="408" font-size="11" fill="#64748b" text-anchor="middle">設置標準</text>
  <text x="139" y="423" font-size="11" fill="#94a3b8" text-anchor="middle">第 28–32 條</text>

  <!-- 卡片2：財務制度 -->
  <rect x="232" y="360" width="158" height="72" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="311" y="389" font-size="13" fill="#d97706" text-anchor="middle" font-weight="700">財務制度</text>
  <text x="311" y="408" font-size="11" fill="#64748b" text-anchor="middle">獨立會計</text>
  <text x="311" y="423" font-size="11" fill="#94a3b8" text-anchor="middle">第 34 條</text>

  <!-- 卡片3：品管指標 -->
  <rect x="404" y="360" width="158" height="72" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="483" y="389" font-size="13" fill="#d97706" text-anchor="middle" font-weight="700">品管指標</text>
  <text x="483" y="408" font-size="11" fill="#64748b" text-anchor="middle">自訂 2 項</text>
  <text x="483" y="423" font-size="11" fill="#94a3b8" text-anchor="middle">第 22 條</text>

  <!-- 卡片4：督導品管 -->
  <rect x="576" y="360" width="158" height="72" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="655" y="389" font-size="13" fill="#d97706" text-anchor="middle" font-weight="700">督導品管</text>
  <text x="655" y="408" font-size="11" fill="#64748b" text-anchor="middle">個督＋團督</text>
  <text x="655" y="423" font-size="11" fill="#94a3b8" text-anchor="middle">第 9 條</text>

  <!-- 來源說明 -->
  <text x="60" y="490" font-size="14" fill="#a8a29e">資料來源：臺北市 115 年度日間照顧機構評鑑基準</text>

  <!-- 底部橫線 -->
  <line x1="60" y1="510" x2="760" y2="510" stroke="#dedad3" stroke-width="1"/>

  <!-- 品牌標示 -->
  <text x="60" y="540" font-size="15" fill="#78716c" font-weight="600">報告汪 reportwang.com</text>

  <!-- 浮水印 -->
  <text x="1140" y="618" font-size="13" fill="#c4bfb8" text-anchor="end">報告汪 reportwang.com</text>
</svg>
