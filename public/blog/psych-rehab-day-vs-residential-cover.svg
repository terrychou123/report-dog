<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', sans-serif">
  <rect width="1200" height="630" fill="#f0efe8"/>
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>

  <!-- 右側：雙欄比較 -->
  <text x="1010" y="155" font-size="28" fill="#78716c" text-anchor="middle" font-weight="600">日間型 vs 住宿型</text>

  <rect x="840" y="170" width="155" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="918" y="211" font-size="32" fill="#0284c7" text-anchor="middle" font-weight="900">36條</text>
  <text x="918" y="242" font-size="20" fill="#a8a29e" text-anchor="middle">日間型</text>
  <text x="918" y="251" font-size="16" fill="#a8a29e" text-anchor="middle">學員</text>

  <rect x="1005" y="170" width="155" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="1083" y="211" font-size="32" fill="#7c3aed" text-anchor="middle" font-weight="900">40條</text>
  <text x="1083" y="242" font-size="20" fill="#a8a29e" text-anchor="middle">住宿型</text>
  <text x="1083" y="251" font-size="16" fill="#a8a29e" text-anchor="middle">住民</text>

  <rect x="840" y="275" width="320" height="56" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="1000" y="295" font-size="22" fill="#d97706" text-anchor="middle" font-weight="700">住宿型多4條</text>
  <text x="1000" y="326" font-size="18" fill="#a8a29e" text-anchor="middle">第一章+2、第三章+2</text>

  <rect x="840" y="344" width="320" height="56" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="1000" y="364" font-size="22" fill="#78716c" text-anchor="middle" font-weight="700">PFM：5項-7項</text>
  <text x="1000" y="395" font-size="18" fill="#a8a29e" text-anchor="middle">住宿型多3.7、3.11</text>

  <rect x="840" y="413" width="320" height="64" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="1000" y="437" font-size="22" fill="#dc2626" text-anchor="middle" font-weight="700">住宿型重點項目</text>
  <text x="1000" y="468" font-size="16" fill="#dc2626" text-anchor="middle">3.11出入自由</text>
  <text x="1000" y="474" font-size="16" fill="#dc2626" text-anchor="middle">未達C即不合格</text>

  <!-- 左側主標題 -->
  <text x="60" y="175" font-size="100" font-weight="900" fill="#1e293b">日間型</text>
  <text x="60" y="298" font-size="100" font-weight="900" fill="#d97706">vs住宿型</text>

  <line x1="60" y1="326" x2="780" y2="326" stroke="#dedad3" stroke-width="2"/>
  <text x="60" y="376" font-size="36" fill="#57534e" font-weight="400">精神復健機構評鑑 36條與40條差異全解析</text>

  <rect x="60" y="410" width="175" height="50" rx="10" fill="#0284c7" opacity="0.12"/>
  <text x="148" y="442" font-size="26" fill="#0284c7" text-anchor="middle" font-weight="600">日間型36條</text>

  <rect x="247" y="410" width="175" height="50" rx="10" fill="#7c3aed" opacity="0.12"/>
  <text x="335" y="442" font-size="26" fill="#7c3aed" text-anchor="middle" font-weight="600">住宿型40條</text>

  <rect x="434" y="410" width="175" height="50" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="522" y="442" font-size="26" fill="#d97706" text-anchor="middle" font-weight="600">差異對照</text>

  <text x="60" y="530" font-size="26" fill="#94a3b8">115年度評鑑｜適用：精神復健機構主管、督導、評鑑準備小組</text>
  <text x="1140" y="590" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
