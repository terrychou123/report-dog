<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- Header y=29 h=90 -->
  <rect x="0" y="29" width="800" height="90" fill="white"/>
  <rect x="0" y="29" width="6" height="90" fill="#d97706" rx="2"/>
  <text x="28" y="84" font-size="40" fill="#1e293b" font-weight="700">3105 核心指標必備文件清單</text>

  <!-- Row 1 (y=137) 消防設備申報 #d97706 -->
  <rect x="28" y="137" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="137" width="6" height="62" rx="2" fill="#d97706"/>
  <circle cx="66" cy="168" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="174" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <text x="100" y="162" font-size="22" fill="#1e293b" font-weight="700">消防安全設備半年檢修申報</text>
  <text x="100" y="185" font-size="16" fill="#57534e">每半年一份申報記錄，共至少 6 份（3年），需有主管機關收文證明</text>
  <rect x="620" y="145" width="136" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="162" font-size="16" fill="#d97706" text-anchor="middle">頻率</text>
  <text x="688" y="182" font-size="16" fill="#d97706" text-anchor="middle">每半年一次</text>

  <!-- Row 2 (y=212) 防火管理人 #78716c -->
  <rect x="28" y="212" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="212" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="66" cy="243" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="249" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <text x="100" y="237" font-size="22" fill="#1e293b" font-weight="700">防火管理人訓練合格證書</text>
  <text x="100" y="260" font-size="16" fill="#57534e">機構應指定防火管理人，確認合格證書有效期限未到期</text>
  <rect x="620" y="220" width="136" height="46" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="237" font-size="16" fill="#78716c" text-anchor="middle">證書有效</text>
  <text x="688" y="257" font-size="16" fill="#78716c" text-anchor="middle">需未過期</text>

  <!-- Row 3 (y=287) 月用電自主 #57534e -->
  <rect x="28" y="287" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="287" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="66" cy="318" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="324" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <text x="100" y="312" font-size="22" fill="#1e293b" font-weight="700">月用電設備自主檢查紀錄（新增）</text>
  <text x="100" y="335" font-size="16" fill="#57534e">109年度新增要求，每月一份，需連續不中斷，有簽名確認</text>
  <rect x="620" y="295" width="136" height="46" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="312" font-size="16" fill="#57534e" text-anchor="middle">每月一份</text>
  <text x="688" y="332" font-size="16" fill="#57534e" text-anchor="middle">109年新增</text>

  <!-- Row 4 (y=362) 建築公安申報 #a8a29e -->
  <rect x="28" y="362" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="362" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="393" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="399" font-size="16" fill="#a8a29e" text-anchor="middle" font-weight="900">4</text>
  <text x="100" y="387" font-size="22" fill="#1e293b" font-weight="700">建築物公共安全檢查簽證申報</text>
  <text x="100" y="410" font-size="16" fill="#57534e">依建管法規定期辦理建築公安申報，保存申報回執與相關文件</text>
  <rect x="620" y="370" width="136" height="46" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="387" font-size="16" fill="#a8a29e" text-anchor="middle">依法定</text>
  <text x="688" y="407" font-size="16" fill="#a8a29e" text-anchor="middle">週期辦理</text>

  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
