<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <rect x="0" y="29" width="800" height="60" fill="#e8e6de"/>
  <rect x="0" y="29" width="6" height="60" rx="2" fill="#d97706"/>
  <text x="28" y="74" font-size="28" fill="#1e293b" font-weight="700">自評表常見四大填寫問題</text>
  <rect x="28" y="118" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="118" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="66" cy="149" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="155" font-size="14" fill="#d97706" text-anchor="middle" font-weight="900">問題1</text>
  <text x="100" y="139" font-size="18" fill="#1e293b" font-weight="700">只填「有」，沒有指向具體文件</text>
  <text x="100" y="160" font-size="16" fill="#57534e">「有」應附上文件位置或頁碼，讓委員可直接查閱</text>
  <rect x="620" y="126" width="136" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="145" font-size="16" fill="#d97706" text-anchor="middle">具體</text>
  <text x="688" y="165" font-size="16" fill="#d97706" text-anchor="middle">指向</text>
  <rect x="28" y="191" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="191" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="66" cy="222" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="228" font-size="14" fill="#78716c" text-anchor="middle" font-weight="900">問題2</text>
  <text x="100" y="212" font-size="18" fill="#1e293b" font-weight="700">以口頭回答代替書面文件</text>
  <text x="100" y="233" font-size="16" fill="#57534e">評鑑委員查核的是書面文件，非口頭說明</text>
  <rect x="620" y="199" width="136" height="46" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="218" font-size="16" fill="#78716c" text-anchor="middle">書面</text>
  <text x="688" y="238" font-size="16" fill="#78716c" text-anchor="middle">文件</text>
  <rect x="28" y="264" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="264" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="295" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="301" font-size="14" fill="#57534e" text-anchor="middle" font-weight="900">問題3</text>
  <text x="100" y="285" font-size="18" fill="#1e293b" font-weight="700">評分虛高，與實際文件不符</text>
  <text x="100" y="306" font-size="16" fill="#57534e">自評分數若高於實際備妥文件，委員現場查核會出問題</text>
  <rect x="620" y="272" width="136" height="46" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="291" font-size="16" fill="#57534e" text-anchor="middle">實際</text>
  <text x="688" y="311" font-size="16" fill="#57534e" text-anchor="middle">對應</text>
  <rect x="28" y="337" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="337" width="6" height="62" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="368" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="374" font-size="14" fill="#a8a29e" text-anchor="middle" font-weight="900">問題4</text>
  <text x="100" y="358" font-size="18" fill="#1e293b" font-weight="700">全部填寫「完成」卻無法出示文件</text>
  <text x="100" y="379" font-size="16" fill="#57534e">未備妥的項目應填「部分完成」並列補強計畫</text>
  <rect x="620" y="345" width="136" height="46" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="364" font-size="16" fill="#a8a29e" text-anchor="middle">誠實</text>
  <text x="688" y="384" font-size="16" fill="#a8a29e" text-anchor="middle">填寫</text>
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>