<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <text x="400" y="48"  font-size="32" font-weight="700" fill="#1e293b" text-anchor="middle">年度缺失改善管理時程</text>
  <text x="400" y="78"  font-size="22" fill="#78716c" text-anchor="middle">與評鑑週期同步，全年無縫銜接</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#a8a29e" stroke-width="1.5"/>
  <!-- 時間軸 -->
  <line x1="80" y1="200" x2="720" y2="200" stroke="#a8a29e" stroke-width="3"/>
  <!-- Q1 -->
  <circle cx="120" cy="200" r="18" fill="#d97706" opacity="0.15"/>
  <text x="120" y="170"  font-size="15" font-weight="700" fill="#d97706" text-anchor="middle">Q1</text>
  <text x="120" y="158"  font-size="12" fill="#78716c" text-anchor="middle">1-3 月</text>
  <text x="120" y="230"  font-size="13" fill="#57534e" text-anchor="middle">年度缺失</text>
  <text x="120" y="246"  font-size="13" fill="#57534e" text-anchor="middle">盤點與分析</text>
  <text x="120" y="262"  font-size="13" fill="#57534e" text-anchor="middle">預防計畫制定</text>
  <!-- Q2 -->
  <circle cx="300" cy="200" r="18" fill="#78716c" opacity="0.15"/>
  <text x="300" y="170"  font-size="15" font-weight="700" fill="#78716c" text-anchor="middle">Q2</text>
  <text x="300" y="158"  font-size="12" fill="#78716c" text-anchor="middle">4-6 月</text>
  <text x="300" y="230"  font-size="13" fill="#57534e" text-anchor="middle">執行改善計畫</text>
  <text x="300" y="246"  font-size="13" fill="#57534e" text-anchor="middle">第一次內部</text>
  <text x="300" y="262"  font-size="13" fill="#57534e" text-anchor="middle">自查演練</text>
  <!-- Q3 -->
  <circle cx="480" cy="200" r="18" fill="#57534e" opacity="0.15"/>
  <text x="480" y="170"  font-size="15" font-weight="700" fill="#57534e" text-anchor="middle">Q3</text>
  <text x="480" y="158"  font-size="12" fill="#78716c" text-anchor="middle">7-9 月</text>
  <text x="480" y="230"  font-size="13" fill="#57534e" text-anchor="middle">文件整備</text>
  <text x="480" y="246"  font-size="13" fill="#57534e" text-anchor="middle">第二次內部</text>
  <text x="480" y="262"  font-size="13" fill="#57534e" text-anchor="middle">自查（含夜間）</text>
  <!-- Q4 -->
  <circle cx="660" cy="200" r="18" fill="#d97706" opacity="0.15"/>
  <text x="660" y="170"  font-size="15" font-weight="700" fill="#d97706" text-anchor="middle">Q4</text>
  <text x="660" y="158"  font-size="12" fill="#78716c" text-anchor="middle">10-12 月</text>
  <text x="660" y="230"  font-size="13" fill="#57534e" text-anchor="middle">全年缺失台帳</text>
  <text x="660" y="246"  font-size="13" fill="#57534e" text-anchor="middle">更新完成</text>
  <text x="660" y="262"  font-size="13" fill="#57534e" text-anchor="middle">下年度計畫起草</text>
  <!-- 重要提示 -->
  <rect x="40" y="310" width="720" height="80" rx="10" fill="#d97706" opacity="0.1"/>
  <text x="60" y="338"  font-size="15" font-weight="700" fill="#d97706">評鑑週期注意：</text>
  <text x="218" y="338"  font-size="15" fill="#57534e">A4 需要「過去 4 年」的缺失改善記錄，因此缺失台帳需長期維護</text>
  <text x="60" y="362"  font-size="15" fill="#57534e">即使本年度沒有任何缺失，也需保存各機關查核的「無缺失」書面確認</text>
  <text x="60" y="385"  font-size="15" fill="#57534e">建議每年底更新缺失台帳，確認 4 年窗口內的所有記錄均完整可查</text>
  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" >報告汪 reportwang.com</text>
</svg>
