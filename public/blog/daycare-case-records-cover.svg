<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 右側裝飾區塊 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>

  <!-- 右側裝飾大數字（200px，頂部≈y=104） -->
  <text x="1010" y="254" font-size="200" font-weight="900" fill="#d97706" text-anchor="middle" opacity="0.85">6</text>
  <text x="1010" y="292" font-size="28" fill="#78716c" text-anchor="middle" font-weight="600">大核心紀錄項目</text>

  <!-- 右側直列 pill 標籤（4 個，各 56px，gap 8px） -->
  <rect x="840" y="316" width="330" height="56" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="1005" y="354" font-size="28" fill="#d97706" text-anchor="middle" font-weight="700">入案評估紀錄（第 5 條）</text>

  <rect x="840" y="380" width="330" height="56" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="1005" y="418" font-size="28" fill="#78716c" text-anchor="middle" font-weight="600">照顧計畫更新（第 6 條）</text>

  <rect x="840" y="444" width="330" height="56" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="1005" y="482" font-size="28" fill="#78716c" text-anchor="middle" font-weight="600">追蹤評值紀錄（第 7 條）</text>

  <rect x="840" y="508" width="330" height="56" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="1005" y="546" font-size="28" fill="#a8a29e" text-anchor="middle" font-weight="600">緊急事件紀錄（第 10 條）</text>

  <!-- 左側主內容區 -->
  <text x="60" y="200" font-size="120" font-weight="900" fill="#1e293b">個案紀錄</text>
  <text x="60" y="338" font-size="110" font-weight="900" fill="#d97706">怎麼寫才達標？</text>

  <line x1="60" y1="365" x2="780" y2="365" stroke="#dedad3" stroke-width="2"/>

  <text x="60" y="416" font-size="38" fill="#57534e" font-weight="400">第 5–10 條 · 範例模板 · 常見 NG 對照</text>

  <!-- 特色標籤列（pill 高 54px） -->
  <rect x="60" y="450" width="148" height="54" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="134" y="487" font-size="28" fill="#d97706" text-anchor="middle" font-weight="600">入案評估</text>

  <rect x="220" y="450" width="148" height="54" rx="10" fill="#78716c" opacity="0.12"/>
  <text x="294" y="487" font-size="28" fill="#78716c" text-anchor="middle" font-weight="600">照顧計畫</text>

  <rect x="380" y="450" width="148" height="54" rx="10" fill="#57534e" opacity="0.12"/>
  <text x="454" y="487" font-size="28" fill="#57534e" text-anchor="middle" font-weight="600">追蹤評值</text>

  <rect x="540" y="450" width="148" height="54" rx="10" fill="#a8a29e" opacity="0.18"/>
  <text x="614" y="487" font-size="28" fill="#78716c" text-anchor="middle" font-weight="600">紀錄保存</text>

  <!-- 適用對象 -->
  <text x="60" y="558" font-size="28" fill="#94a3b8">適用對象：社工 · 照服員 · 日照主任 · 評鑑準備</text>

  <!-- 浮水印 -->
  <text x="1140" y="590" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
