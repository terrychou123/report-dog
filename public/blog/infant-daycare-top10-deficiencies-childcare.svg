<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- Header（y=38, H=90）-->
  <rect x="0" y="38" width="800" height="90" fill="white"/>
  <rect x="0" y="38" width="6" height="90" fill="#78716c" rx="2"/>
  <text x="28" y="95" font-size="36" fill="#1e293b" font-weight="700">托育活動類 2 大缺失</text>

  <!-- Row 0：寶寶日誌未每日記錄（y=166）#d97706 -->
  <rect x="28" y="166" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="166" width="6" height="90" rx="2" fill="#d97706"/>
  <circle cx="66" cy="211" r="20" fill="#d97706" opacity="0.15"/>
  <text x="66" y="217" font-size="18" fill="#d97706" text-anchor="middle" font-weight="900">4</text>
  <text x="100" y="200" font-size="26" fill="#1e293b" font-weight="700">寶寶日誌未每日記錄（第35項）</text>
  <text x="100" y="224" font-size="16" fill="#57534e">缺失：日誌有中斷、內容僅記錄「今日一切正常」、未含個別發展表現</text>
  <text x="100" y="244" font-size="16" fill="#d97706" font-weight="600">正確：每日與嬰幼兒家庭保持聯繫，內容含個別嬰幼兒成長與發展表現</text>
  <rect x="620" y="185" width="136" height="52" rx="8" fill="#dc2626" opacity="0.12"/>
  <text x="688" y="207" font-size="16" fill="#dc2626" text-anchor="middle">文書缺失</text>
  <text x="688" y="227" font-size="16" fill="#dc2626" text-anchor="middle">第35項</text>

  <!-- Row 1：睡眠床距不足（y=269）#78716c -->
  <rect x="28" y="269" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="269" width="6" height="90" rx="2" fill="#78716c"/>
  <circle cx="66" cy="314" r="20" fill="#78716c" opacity="0.15"/>
  <text x="66" y="320" font-size="18" fill="#78716c" text-anchor="middle" font-weight="900">5</text>
  <text x="100" y="303" font-size="26" fill="#1e293b" font-weight="700">睡眠床距不足30公分（第15項）</text>
  <text x="100" y="327" font-size="16" fill="#57534e">缺失：睡眠區床位間距不足，嬰幼兒可能相互干擾或有安全疑慮</text>
  <text x="100" y="347" font-size="16" fill="#78716c" font-weight="600">正確：床位間距30公分以上，或以隔板區隔，符合安全舒適原則</text>
  <rect x="620" y="288" width="136" height="52" rx="8" fill="#dc2626" opacity="0.12"/>
  <text x="688" y="310" font-size="16" fill="#dc2626" text-anchor="middle">環境缺失</text>
  <text x="688" y="330" font-size="16" fill="#dc2626" text-anchor="middle">第15項</text>

  <!-- 托育活動提示 -->
  <rect x="28" y="376" width="744" height="88" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="52" y="404" font-size="18" fill="#1e293b" font-weight="700">托育活動類缺失的共同特徵</text>
  <text x="52" y="428" font-size="16" fill="#57534e">評鑑委員採「實地觀察」查核托育活動，無法在評鑑前臨時補做或模擬。</text>
  <text x="52" y="450" font-size="16" fill="#57534e">這類缺失需要靠日常習慣的長期建立，而非文件補充，是最難短期改善的項目。</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
