<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <!-- 背景：米黃暖色 -->
  <rect width="800" height="400" fill="#f0efe8"/>

  <!-- 主卡片 -->
  <rect x="30" y="20" width="740" height="360" rx="20" fill="white" stroke="#e8e5de" stroke-width="1"/>

  <!-- 頂部 header -->
  <rect x="30" y="20" width="740" height="62" rx="20" fill="#78716c"/>
  <rect x="30" y="62" width="740" height="20" fill="#78716c"/>

  <!-- 書籤圖示 -->
  <rect x="60" y="30" width="30" height="40" rx="3" fill="white" opacity="0.25"/>
  <polygon points="60,70 75,60 90,70" fill="#78716c"/>

  <!-- 標題 -->
  <text x="400" y="56" font-family="sans-serif" font-size="22" fill="white" text-anchor="middle" font-weight="bold">重點速查卡</text>
  <text x="400" y="74" font-family="sans-serif" font-size="12" fill="#dedad3" text-anchor="middle">日間照顧中心評鑑關鍵數字一覽</text>

  <!-- 副標題小標 -->
  <text x="60" y="118" font-family="sans-serif" font-size="14" fill="#64748b" font-weight="bold">快速查閱評鑑重要規定，準備不遺漏</text>
  <rect x="60" y="124" width="680" height="1.5" fill="#dedad3"/>

  <!-- 六項目 2×3 佈局 -->

  <!-- 第一列：左 -->
  <rect x="50" y="138" width="330" height="70" rx="12" fill="#f0efe8" stroke="#dedad3" stroke-width="1.5"/>
  <!-- 左色條 -->
  <rect x="50" y="138" width="6" height="70" rx="3" fill="#94a3b8"/>
  <!-- 標籤 -->
  <rect x="64" y="148" width="90" height="20" rx="10" fill="#94a3b8"/>
  <text x="109" y="162" font-family="sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="bold">評鑑週期</text>
  <!-- 數值 -->
  <text x="64" y="192" font-family="sans-serif" font-size="24" fill="#94a3b8" font-weight="bold">每 4 年</text>
  <text x="168" y="192" font-family="sans-serif" font-size="14" fill="#64748b">一次（臺北市）</text>

  <!-- 第一列：右 -->
  <rect x="420" y="138" width="330" height="70" rx="12" fill="#f0efe8" stroke="#dedad3" stroke-width="1.5"/>
  <rect x="420" y="138" width="6" height="70" rx="3" fill="#a8a29e"/>
  <rect x="434" y="148" width="90" height="20" rx="10" fill="#a8a29e"/>
  <text x="479" y="162" font-family="sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="bold">正式基準</text>
  <text x="434" y="192" font-family="sans-serif" font-size="24" fill="#a8a29e" font-weight="bold">43 項</text>
  <text x="510" y="192" font-family="sans-serif" font-size="14" fill="#64748b">+ 加分題 2 項</text>

  <!-- 第二列：左 -->
  <rect x="50" y="220" width="330" height="70" rx="12" fill="#f0efe8" stroke="#dedad3" stroke-width="1.5"/>
  <rect x="50" y="220" width="6" height="70" rx="3" fill="#d97706"/>
  <rect x="64" y="230" width="90" height="20" rx="10" fill="#d97706"/>
  <text x="109" y="244" font-family="sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="bold">照顧計畫</text>
  <text x="64" y="274" font-family="sans-serif" font-size="24" fill="#d97706" font-weight="bold">7 工作天</text>
  <text x="200" y="274" font-family="sans-serif" font-size="14" fill="#64748b">內完成</text>

  <!-- 第二列：右 -->
  <rect x="420" y="220" width="330" height="70" rx="12" fill="#f0efe8" stroke="#dedad3" stroke-width="1.5"/>
  <rect x="420" y="220" width="6" height="70" rx="3" fill="#78716c"/>
  <rect x="434" y="230" width="90" height="20" rx="10" fill="#78716c"/>
  <text x="479" y="244" font-family="sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="bold">督導要求</text>
  <text x="434" y="270" font-family="sans-serif" font-size="13" fill="#78716c" font-weight="bold">個督每半年</text>
  <text x="434" y="288" font-family="sans-serif" font-size="13" fill="#64748b">團督每季一次</text>

  <!-- 第三列：左 -->
  <rect x="50" y="302" width="330" height="70" rx="12" fill="#f0efe8" stroke="#dedad3" stroke-width="1.5"/>
  <rect x="50" y="302" width="6" height="70" rx="3" fill="#a3a3a3"/>
  <rect x="64" y="312" width="90" height="20" rx="10" fill="#a3a3a3"/>
  <text x="109" y="326" font-family="sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="bold">在職訓練</text>
  <text x="64" y="356" font-family="sans-serif" font-size="24" fill="#a3a3a3" font-weight="bold">20 小時</text>
  <text x="200" y="356" font-family="sans-serif" font-size="14" fill="#64748b">/ 年（最低標準）</text>

  <!-- 第三列：右 -->
  <rect x="420" y="302" width="330" height="70" rx="12" fill="#f0efe8" stroke="#dedad3" stroke-width="1.5"/>
  <rect x="420" y="302" width="6" height="70" rx="3" fill="#94a3b8"/>
  <rect x="434" y="312" width="90" height="20" rx="10" fill="#94a3b8"/>
  <text x="479" y="326" font-family="sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="bold">品管指標</text>
  <text x="434" y="356" font-family="sans-serif" font-size="24" fill="#94a3b8" font-weight="bold">至少 2 項</text>
  <text x="562" y="356" font-family="sans-serif" font-size="14" fill="#64748b">自訂</text>

  <!-- 底部提示 -->
  <text x="400" y="392" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">以上數據以臺北市 115 年評鑑基準為主，各縣市規定可能有差異，請以主管機關公告為準</text>

  <!-- 浮水印 -->
  <text x="770" y="397" text-anchor="end" font-family="sans-serif" font-size="10" fill="#c4bfb8">報告汪 reportwang.com</text>
</svg>
