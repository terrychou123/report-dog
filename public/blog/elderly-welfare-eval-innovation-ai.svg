<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- 標題 -->
  <text x="400" y="50" font-size="26" fill="#1e293b" text-anchor="middle" font-weight="700" >報告汪 AI 輔助加分規劃 — 4 大功能</text>
  <!-- N=4: H=62, outer_gap=50, Row y: 145/220/295/370 -->
  <!-- Row 1 -->
  <rect x="50" y="145" width="700" height="62" rx="8" fill="#ffffff"/>
  <rect x="50" y="145" width="6" height="62" rx="2" fill="#d97706"/>
  <circle cx="85" cy="176" r="16" fill="#d97706" opacity="0.15"/>
  <text x="85" y="182" font-size="16" fill="#d97706" text-anchor="middle" font-weight="700" >1</text>
  <text x="118" y="169" font-size="17" fill="#1e293b" font-weight="700" >E2 創新服務成效報告撰寫</text>
  <text x="118" y="191" font-size="14" fill="#57534e" >AI 輔助整理創新服務執行紀錄，自動生成「創新措施說明書」與成效摘要，符合評鑑格式</text>
  <rect x="570" y="153" width="168" height="46" rx="6" fill="#d97706" opacity="0.10"/>
  <text x="654" y="181" font-size="14" fill="#d97706" text-anchor="middle" font-weight="600" >AI 報告撰寫</text>
  <!-- Row 2 -->
  <rect x="50" y="220" width="700" height="62" rx="8" fill="#ffffff"/>
  <rect x="50" y="220" width="6" height="62" rx="3" fill="#9333ea"/>
  <circle cx="85" cy="251" r="16" fill="#9333ea"/>
  <text x="85" y="257" font-size="16" fill="#9333ea" text-anchor="middle" font-weight="700" >2</text>
  <text x="118" y="244" font-size="17" fill="#1e293b" font-weight="700" >F1-F3 佐證文件彙整</text>
  <text x="118" y="266" font-size="14" fill="#57534e" >多人協作功能讓護理、社工、行政同步上傳佐證資料，AI 分析文件完整度與缺口</text>
  <rect x="570" y="228" width="168" height="46" rx="6" fill="#9333ea" opacity="0.10"/>
  <text x="654" y="256" font-size="14" fill="#9333ea" text-anchor="middle" font-weight="600" >多人協作</text>
  <!-- Row 3 -->
  <rect x="50" y="295" width="700" height="62" rx="8" fill="#ffffff"/>
  <rect x="50" y="295" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="85" cy="326" r="16" fill="#78716c" opacity="0.15"/>
  <text x="85" y="332" font-size="16" fill="#78716c" text-anchor="middle" font-weight="700" >3</text>
  <text x="118" y="319" font-size="17" fill="#1e293b" font-weight="700" >加分項目追蹤提醒</text>
  <text x="118" y="341" font-size="14" fill="#57534e" >設定F2每月拜訪紀錄提醒、F1牙科追蹤清冊更新提醒，確保評鑑前文件完整無缺</text>
  <rect x="570" y="303" width="168" height="46" rx="6" fill="#78716c" opacity="0.10"/>
  <text x="654" y="331" font-size="14" fill="#78716c" text-anchor="middle" font-weight="600" >追蹤提醒</text>
  <!-- Row 4 -->
  <rect x="50" y="370" width="700" height="62" rx="8" fill="#ffffff"/>
  <rect x="50" y="370" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="85" cy="401" r="16" fill="#57534e" opacity="0.15"/>
  <text x="85" y="407" font-size="16" fill="#57534e" text-anchor="middle" font-weight="700" >4</text>
  <text x="118" y="394" font-size="17" fill="#1e293b" font-weight="700" >跨機構評鑑成效對比分析</text>
  <text x="118" y="416" font-size="14" fill="#57534e" >報告汪評估功能可比較各加分項目執行成效，協助決策優先投入資源建置哪項加分題</text>
  <rect x="570" y="378" width="168" height="46" rx="6" fill="#57534e" opacity="0.10"/>
  <text x="654" y="406" font-size="14" fill="#57534e" text-anchor="middle" font-weight="600" >AI 評估分析</text>
  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" >報告汪 reportwang.com</text>
</svg>