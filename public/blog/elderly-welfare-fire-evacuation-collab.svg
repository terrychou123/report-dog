<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <rect x="0" y="0" width="800" height="90" fill="#0d9488"/>
  <text x="400" y="38" font-size="22" font-weight="bold" fill="white" text-anchor="middle" >多人協作分工：讓消防演練準備不再全靠一人</text>
  <text x="400" y="68" font-size="16" fill="#ccfbf1" text-anchor="middle" >報告汪多人協作功能 ｜ 115年度老人福利機構評鑑備審</text>

  <!-- N=4 版型 -->

  <!-- Row 1 -->
  <rect x="30" y="110" width="740" height="62" rx="8" fill="white"/>
  <rect x="30" y="110" width="6" height="62" rx="2" fill="#d97706"/>
  <circle cx="66" cy="141" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="146" font-size="14" font-weight="bold" fill="white" text-anchor="middle" >1</text>
  <text x="100" y="134" font-size="17" font-weight="bold" fill="#1e293b" >行政人員負責：C9 消防申報紀錄整理</text>
  <text x="100" y="156" font-size="16" fill="#57534e" >整理5年申報紀錄；確認建築公安申報合格；追蹤下次半年檢修申報日期</text>
  <rect x="620" y="121" width="136" height="40" rx="8" fill="#fffbeb" opacity="0.12"/>
  <text x="688" y="146" font-size="14" fill="#d97706" text-anchor="middle" >行政主管</text>

  <!-- Row 2 -->
  <rect x="30" y="185" width="740" height="62" rx="8" fill="white"/>
  <rect x="30" y="185" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="66" cy="216" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="221" font-size="14" font-weight="bold" fill="white" text-anchor="middle" >2</text>
  <text x="100" y="209" font-size="17" font-weight="bold" fill="#1e293b" >護理長負責：C10 疏散路徑現場巡查</text>
  <text x="100" y="231" font-size="16" fill="#57534e" >定期確認走道防火門暢通；測試排煙設備連動；逃生路徑無阻礙；拍照留存紀錄</text>
  <rect x="620" y="196" width="136" height="40" rx="8" fill="#f0fdf4" opacity="0.12"/>
  <text x="688" y="221" font-size="14" fill="#0d9488" text-anchor="middle" >護理長</text>

  <!-- Row 3 -->
  <rect x="30" y="260" width="740" height="62" rx="8" fill="white"/>
  <rect x="30" y="260" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="66" cy="291" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="296" font-size="14" font-weight="bold" fill="white" text-anchor="middle" >3</text>
  <text x="100" y="284" font-size="17" font-weight="bold" fill="#1e293b" >防火管理人負責：C11 演練計畫執行</text>
  <text x="100" y="306" font-size="16" fill="#57534e" >規劃複合型及夜間演練時間表；統籌演練執行與後續文件；每月用電設備自主檢查</text>
  <rect x="620" y="271" width="136" height="40" rx="8" fill="#fef2f2" opacity="0.12"/>
  <text x="688" y="296" font-size="14" fill="#dc2626" text-anchor="middle" >防火管理人</text>

  <!-- Row 4 -->
  <rect x="30" y="335" width="740" height="62" rx="8" fill="white"/>
  <rect x="30" y="335" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="366" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="371" font-size="14" font-weight="bold" fill="white" text-anchor="middle" >4</text>
  <text x="100" y="359" font-size="17" font-weight="bold" fill="#1e293b" >社工負責：C12 外籍人員訓練協調</text>
  <text x="100" y="381" font-size="16" fill="#57534e" >協調外籍看護工訓練時間；準備多語言教材；收集簽到表；更新各樓層逃生圖</text>
  <rect x="620" y="346" width="136" height="40" rx="8" fill="#fafaf9" opacity="0.12"/>
  <text x="688" y="371" font-size="14" fill="#78716c" text-anchor="middle" >社工</text>

  <!-- 底部說明 -->
  <text x="30" y="440" font-size="14" fill="#78716c" >報告汪多人協作功能可設定分工角色，各自更新進度，管理者統一查看</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" >報告汪 reportwang.com</text>
</svg>
