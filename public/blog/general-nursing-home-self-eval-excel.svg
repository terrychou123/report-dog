<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <text x="40" y="48" font-size="32" fill="#1e293b" font-weight="700">Excel 自評表結構</text>
  <text x="40" y="76" font-size="22" fill="#57534e">6 欄位設計——讓每個人知道自己該做什麼</text>
  <line x1="40" y1="92" x2="760" y2="92" stroke="#16a34a" stroke-width="2"/>

  <!-- 表格標題列 -->
  <rect x="40" y="110" width="720" height="36" rx="4" fill="#1e293b"/>
  <text x="80" y="133" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">項目編號</text>
  <line x1="120" y1="110" x2="120" y2="146" stroke="#1e293b" stroke-width="1"/>
  <text x="230" y="133" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">基準名稱</text>
  <line x1="340" y1="110" x2="340" y2="146" stroke="#1e293b" stroke-width="1"/>
  <text x="410" y="133" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">自評結果</text>
  <line x1="480" y1="110" x2="480" y2="146" stroke="#1e293b" stroke-width="1"/>
  <text x="560" y="133" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">佐證文件</text>
  <line x1="640" y1="110" x2="640" y2="146" stroke="#1e293b" stroke-width="1"/>
  <text x="680" y="133" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">負責人</text>
  <line x1="720" y1="110" x2="720" y2="146" stroke="#1e293b" stroke-width="1"/>
  <text x="750" y="133" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">完成日</text>

  <!-- 資料列 1 — 綠色達成 -->
  <rect x="40" y="146" width="720" height="36" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="80" y="169" font-size="14" fill="#57534e" text-anchor="middle">A1.1</text>
  <line x1="120" y1="146" x2="120" y2="182" stroke="#e2e8f0" stroke-width="1"/>
  <text x="230" y="169" font-size="14" fill="#57534e" text-anchor="middle">負責人管理查核</text>
  <line x1="340" y1="146" x2="340" y2="182" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="350" y="153" width="120" height="22" rx="4" fill="#f0fdf4"/>
  <text x="410" y="168" font-size="14" fill="#16a34a" text-anchor="middle" font-weight="700">[v] 達成</text>
  <line x1="480" y1="146" x2="480" y2="182" stroke="#e2e8f0" stroke-width="1"/>
  <text x="560" y="169" font-size="14" fill="#57534e" text-anchor="middle">督導記錄、查核表</text>
  <line x1="640" y1="146" x2="640" y2="182" stroke="#e2e8f0" stroke-width="1"/>
  <text x="680" y="169" font-size="14" fill="#57534e" text-anchor="middle">護理長</text>
  <line x1="720" y1="146" x2="720" y2="182" stroke="#e2e8f0" stroke-width="1"/>
  <text x="750" y="169" font-size="14" fill="#57534e" text-anchor="middle">已完成</text>

  <!-- 資料列 2 — 橙色部分達成 -->
  <rect x="40" y="182" width="720" height="36" fill="#fafaf8" stroke="#e2e8f0" stroke-width="1"/>
  <text x="80" y="205" font-size="14" fill="#57534e" text-anchor="middle">B1</text>
  <line x1="120" y1="182" x2="120" y2="218" stroke="#e2e8f0" stroke-width="1"/>
  <text x="230" y="205" font-size="14" fill="#57534e" text-anchor="middle">個別化照護計畫</text>
  <line x1="340" y1="182" x2="340" y2="218" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="350" y="189" width="120" height="22" rx="4" fill="#fef9c3"/>
  <text x="410" y="204" font-size="14" fill="#d97706" text-anchor="middle" font-weight="700">^ 部分達成</text>
  <line x1="480" y1="182" x2="480" y2="218" stroke="#e2e8f0" stroke-width="1"/>
  <text x="560" y="205" font-size="14" fill="#57534e" text-anchor="middle">照護計畫表（補中）</text>
  <line x1="640" y1="182" x2="640" y2="218" stroke="#e2e8f0" stroke-width="1"/>
  <text x="680" y="205" font-size="14" fill="#57534e" text-anchor="middle">責任護理師</text>
  <line x1="720" y1="182" x2="720" y2="218" stroke="#e2e8f0" stroke-width="1"/>
  <text x="750" y="205" font-size="14" fill="#d97706" text-anchor="middle">3/25</text>

  <!-- 資料列 3 — 紅色未達成 -->
  <rect x="40" y="218" width="720" height="36" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="80" y="241" font-size="14" fill="#57534e" text-anchor="middle">C4</text>
  <line x1="120" y1="218" x2="120" y2="254" stroke="#e2e8f0" stroke-width="1"/>
  <text x="230" y="241" font-size="14" fill="#57534e" text-anchor="middle">情境式消防演練</text>
  <line x1="340" y1="218" x2="340" y2="254" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="350" y="225" width="120" height="22" rx="4" fill="#fee2e2"/>
  <text x="410" y="240" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="700">[x] 未達成</text>
  <line x1="480" y1="218" x2="480" y2="254" stroke="#e2e8f0" stroke-width="1"/>
  <text x="560" y="241" font-size="14" fill="#dc2626" text-anchor="middle">演練記錄（待辦）</text>
  <line x1="640" y1="218" x2="640" y2="254" stroke="#e2e8f0" stroke-width="1"/>
  <text x="680" y="241" font-size="14" fill="#57534e" text-anchor="middle">消防組長</text>
  <line x1="720" y1="218" x2="720" y2="254" stroke="#e2e8f0" stroke-width="1"/>
  <text x="750" y="241" font-size="14" fill="#dc2626" text-anchor="middle">3/31</text>

  <!-- 省略列 -->
  <rect x="40" y="254" width="720" height="24" fill="#f0efe8" stroke="#e2e8f0" stroke-width="1"/>
  <text x="400" y="271" font-size="14" fill="#94a3b8" text-anchor="middle">…… 共 15 項基準，A1.1 ～ D3 ……</text>

  <!-- 統計區 -->
  <rect x="40" y="296" width="720" height="80" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="400" y="318" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">自評統計摘要</text>

  <rect x="80" y="328" width="160" height="34" rx="6" fill="#f0fdf4"/>
  <text x="160" y="350" font-size="14" fill="#16a34a" text-anchor="middle" font-weight="700">達成 8 項（53%）</text>

  <rect x="280" y="328" width="160" height="34" rx="6" fill="#fef9c3"/>
  <text x="360" y="350" font-size="14" fill="#d97706" text-anchor="middle" font-weight="700">部分 4 項（27%）</text>

  <rect x="480" y="328" width="160" height="34" rx="6" fill="#fee2e2"/>
  <text x="560" y="350" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="700">未達成 3 項（20%）</text>

  <rect x="40" y="394" width="720" height="46" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="400" y="414" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="600">建議做法：先集中資源補強「未達成」3項，再處理「部分達成」4項</text>
  <text x="400" y="432" font-size="14" fill="#2563eb" text-anchor="middle">評鑑前 1 個月所有項目應達到「達成」或「部分達成」</text>

  <text x="760" y="490" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
