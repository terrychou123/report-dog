<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- Header -->
  <rect x="0" y="0" width="800" height="100" fill="white"/>
  <rect x="0" y="0" width="6" height="100" fill="#d97706" rx="2"/>
  <text x="28" y="52" font-size="30" fill="#1e293b" font-weight="700">環境安全 5 大改善要點</text>
  <text x="28" y="82" font-size="18" fill="#78716c">低預算優先確認項目（臺北市114-116年度指標）</text>

  <!-- Row 1：燈光亮度 y=118 -->
  <rect x="28" y="118" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="118" width="6" height="60" rx="2" fill="#78716c"/>
  <circle cx="66" cy="148" r="18" fill="#d97706" opacity="0.15"/>
  <text x="66" y="154" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <text x="100" y="140" font-size="22" fill="#1e293b" font-weight="700">燈光亮度確認</text>
  <text x="100" y="164" font-size="16" fill="#57534e">每月記錄活動區、睡眠區、走廊照明狀況，更換不亮燈管即可，成本極低</text>

  <!-- Row 2：地板防滑 y=191 -->
  <rect x="28" y="191" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="191" width="6" height="60" rx="2" fill="#57534e"/>
  <circle cx="66" cy="221" r="18" fill="#78716c" opacity="0.15"/>
  <text x="66" y="227" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <text x="100" y="213" font-size="22" fill="#1e293b" font-weight="700">地板防滑貼補強</text>
  <text x="100" y="237" font-size="16" fill="#57534e">入口、廁所、廚房加貼防滑貼條；每季檢查紀錄，費用每處約 200-500 元</text>

  <!-- Row 3：家具圓角 y=264 -->
  <rect x="28" y="264" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="264" width="6" height="60" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="294" r="18" fill="#57534e" opacity="0.15"/>
  <text x="66" y="300" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <text x="100" y="286" font-size="22" fill="#1e293b" font-weight="700">家具圓角防護套</text>
  <text x="100" y="310" font-size="16" fill="#57534e">桌角、櫃角加裝矽膠防撞角；建立家具安全檢查表，每月巡查一次並簽名</text>

  <!-- Row 4：插座防護 y=337 -->
  <rect x="28" y="337" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="337" width="6" height="60" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="367" r="18" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="373" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">4</text>
  <text x="100" y="359" font-size="22" fill="#1e293b" font-weight="700">插座安全防護蓋</text>
  <text x="100" y="383" font-size="16" fill="#57534e">嬰幼兒可及範圍所有插座安裝防護蓋；每學期拍照存檔作為佐證文件</text>

  <!-- Row 5：窗戶高度欄杆 y=410 -->
  <rect x="28" y="410" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="410" width="6" height="60" rx="2" fill="#6b7280"/>
  <circle cx="66" cy="440" r="18" fill="#94a3b8" opacity="0.15"/>
  <text x="66" y="446" font-size="16" fill="#94a3b8" text-anchor="middle" font-weight="900">5</text>
  <text x="100" y="432" font-size="22" fill="#1e293b" font-weight="700">窗戶高度與欄杆確認</text>
  <text x="100" y="456" font-size="16" fill="#57534e">確認窗戶底部距地板高度符合安全標準；有欄杆的需確認間距小於 10 公分</text>

  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
