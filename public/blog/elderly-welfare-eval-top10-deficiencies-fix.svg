<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題 -->
  <text x="400" y="46" font-size="26" font-weight="700" fill="#1e293b" text-anchor="middle" >缺失補救 4 步驟：發現問題到改善完成</text>
  <text x="400" y="74" font-size="16" fill="#57534e" text-anchor="middle" >評鑑發現缺失後，依此流程系統性補救，確保改善率達 100%</text>

  <!-- 步驟1 -->
  <rect x="40" y="105" width="330" height="148" rx="12" fill="white"/>
  <rect x="40" y="105" width="330" height="6" rx="3" fill="#d97706"/>
  <!-- 步驟圓圈 -->
  <circle cx="72" cy="148" r="22" fill="#d97706" opacity="0.15"/>
  <text x="72" y="155" font-size="20" fill="#d97706" text-anchor="middle" font-weight="700" >01</text>
  <text x="108" y="138" font-size="19" font-weight="700" fill="#1e293b" >問題診斷</text>
  <text x="55" y="172" font-size="14" fill="#57534e" >確認缺失條款對應指標</text>
  <text x="55" y="192" font-size="14" fill="#57534e" >判定是文件缺失或實務不符</text>
  <text x="55" y="212" font-size="14" fill="#57534e" >確認缺失是否為一級必要</text>
  <text x="55" y="232" font-size="14" fill="#dc2626" >一級必要缺失 = 最優先處理</text>

  <!-- 步驟2 -->
  <rect x="430" y="105" width="330" height="148" rx="12" fill="white"/>
  <rect x="430" y="105" width="330" height="6" rx="3" fill="#78716c"/>
  <circle cx="462" cy="148" r="22" fill="#78716c" opacity="0.15"/>
  <text x="462" y="155" font-size="20" fill="#78716c" text-anchor="middle" font-weight="700" >02</text>
  <text x="498" y="138" font-size="19" font-weight="700" fill="#1e293b" >行動計畫</text>
  <text x="445" y="172" font-size="14" fill="#57534e" >訂定具體改善措施與時程</text>
  <text x="445" y="192" font-size="14" fill="#57534e" >指派責任人員與督導機制</text>
  <text x="445" y="212" font-size="14" fill="#57534e" >準備改善前後對照文件</text>
  <text x="445" y="232" font-size="14" fill="#57534e" >設定驗收時間點與查核標準</text>

  <!-- 箭頭1 -->
  <polygon points="385,178 415,165 415,192" fill="#d97706" opacity="0.7"/>

  <!-- 步驟3 -->
  <rect x="40" y="290" width="330" height="148" rx="12" fill="white"/>
  <rect x="40" y="290" width="330" height="6" rx="3" fill="#57534e"/>
  <circle cx="72" cy="333" r="22" fill="#57534e" opacity="0.15"/>
  <text x="72" y="340" font-size="20" fill="#57534e" text-anchor="middle" font-weight="700" >03</text>
  <text x="108" y="323" font-size="19" font-weight="700" fill="#1e293b" >執行改善</text>
  <text x="55" y="357" font-size="14" fill="#57534e" >補齊文件並加蓋日期章</text>
  <text x="55" y="377" font-size="14" fill="#57534e" >照片或影片記錄改善過程</text>
  <text x="55" y="397" font-size="14" fill="#57534e" >工作人員教育訓練補辦</text>
  <text x="55" y="417" font-size="14" fill="#57534e" >硬體設施缺失通報維修廠商</text>

  <!-- 箭頭2（向下）-->
  <polygon points="205,258 192,286 218,286" fill="#78716c" opacity="0.7"/>

  <!-- 步驟4 -->
  <rect x="430" y="290" width="330" height="148" rx="12" fill="white"/>
  <rect x="430" y="290" width="330" height="6" rx="3" fill="#a8a29e"/>
  <circle cx="462" cy="333" r="22" fill="#a8a29e" opacity="0.15"/>
  <text x="462" y="340" font-size="20" fill="#78716c" text-anchor="middle" font-weight="700" >04</text>
  <text x="498" y="323" font-size="19" font-weight="700" fill="#1e293b" >驗收追蹤</text>
  <text x="445" y="357" font-size="14" fill="#57534e" >業務負責人或品管委員會審查</text>
  <text x="445" y="377" font-size="14" fill="#57534e" >確認改善紀錄建檔完整</text>
  <text x="445" y="397" font-size="14" fill="#57534e" >納入下次品管會議議題</text>
  <text x="445" y="417" font-size="14" fill="#d97706" >AI 自我查核工具再次掃描</text>

  <!-- 箭頭3 -->
  <polygon points="385,362 415,349 415,376" fill="#57534e" opacity="0.7"/>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" >報告汪 reportwang.com</text>
</svg>
