<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <rect x="0" y="29" width="800" height="60" fill="#e8e6de"/>
  <rect x="0" y="29" width="6" height="60" rx="2" fill="#d97706"/>
  <text x="28" y="74" font-size="30" fill="#1e293b" font-weight="700">衛教課程出席記錄三大規範</text>
  <rect x="28" y="166" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="166" width="6" height="90" rx="2" fill="#78716c"/>
  <circle cx="66" cy="211" r="20" fill="#d97706" opacity="0.15"/>
  <text x="66" y="217" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <text x="100" y="200" font-size="20" fill="#1e293b" font-weight="700">出席名單必須親簽</text>
  <text x="100" y="224" font-size="16" fill="#57534e">每位參加者親自簽名，不可由他人代簽或事後補簽</text>
  <text x="100" y="244" font-size="16" fill="#57534e">名單保留課程名稱、日期、地點等基本資訊</text>
  <rect x="620" y="178" width="136" height="66" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="208" font-size="16" fill="#d97706" text-anchor="middle">親簽</text>
  <text x="688" y="228" font-size="16" fill="#d97706" text-anchor="middle">記錄</text>
  <rect x="28" y="272" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="272" width="6" height="90" rx="2" fill="#57534e"/>
  <circle cx="66" cy="317" r="20" fill="#78716c" opacity="0.15"/>
  <text x="66" y="323" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <text x="100" y="306" font-size="20" fill="#1e293b" font-weight="700">學習成效評估記錄</text>
  <text x="100" y="330" font-size="16" fill="#57534e">問卷、測驗或示教回饋的結果記錄，顯示課程有效性</text>
  <text x="100" y="350" font-size="16" fill="#57534e">評估結果彙整後納入課程改善參考</text>
  <rect x="620" y="284" width="136" height="66" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="314" font-size="16" fill="#78716c" text-anchor="middle">成效</text>
  <text x="688" y="334" font-size="16" fill="#78716c" text-anchor="middle">紀錄</text>
  <rect x="28" y="378" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="378" width="6" height="90" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="423" r="20" fill="#57534e" opacity="0.15"/>
  <text x="66" y="429" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <text x="100" y="412" font-size="20" fill="#1e293b" font-weight="700">教材現況記錄（版本與更新日期）</text>
  <text x="100" y="436" font-size="16" fill="#57534e">書面或影片教材標示版本號與最後更新日期</text>
  <text x="100" y="456" font-size="16" fill="#57534e">確認教材內容符合現行護理實務標準</text>
  <rect x="620" y="390" width="136" height="66" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="420" font-size="16" fill="#57534e" text-anchor="middle">教材</text>
  <text x="688" y="440" font-size="16" fill="#57534e" text-anchor="middle">版本</text>
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
