<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">壹、行政組織與經營管理（10分）</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">6 項目分工：評鑑人員（1–3）× 主管機關（4–6）</text>
  <line x1="28" y1="94" x2="772" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- 左欄：評鑑人員負責 -->
  <!-- 區段標題 -->
  <rect x="40" y="108" width="6" height="24" rx="3" fill="#d97706"/>
  <text x="54" y="125" font-size="20" fill="#1e293b" font-weight="700">評鑑人員負責（項目 1–3，6 分）</text>

  <!-- 項目1 -->
  <rect x="40" y="136" width="336" height="72" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="40" y="136" width="6" height="72" rx="2" fill="#d97706"/>
  <text x="60" y="157" font-size="18" fill="#1e293b" font-weight="700">1. 董(理)事會功能與運作 ─ 2分</text>
  <text x="60" y="176" font-size="15" fill="#57534e">董事會議紀錄、改選文件</text>
  <text x="60" y="196" font-size="15" fill="#57534e">財產目錄、捐助章程備齊</text>

  <!-- 項目2 -->
  <rect x="40" y="216" width="336" height="72" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="40" y="216" width="6" height="72" rx="2" fill="#d97706"/>
  <text x="60" y="237" font-size="18" fill="#1e293b" font-weight="700">2. 行政組織架構與業務運作 ─ 2分</text>
  <text x="60" y="256" font-size="15" fill="#57534e">填報社家署全國兒少追蹤系統 1分</text>
  <text x="60" y="276" font-size="15" fill="#57534e">行政會議紀錄 0.3分＋組織架構圖 0.2分</text>

  <!-- 項目3 -->
  <rect x="40" y="296" width="336" height="72" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="40" y="296" width="6" height="72" rx="2" fill="#d97706"/>
  <text x="60" y="317" font-size="18" fill="#1e293b" font-weight="700">3. 員工手冊及人事制度 ─ 2分</text>
  <text x="60" y="336" font-size="15" fill="#57534e">5項各0.4分：差勤、績效、申訴</text>
  <text x="60" y="356" font-size="15" fill="#57534e">薪資管理、員工手冊職掌分工</text>

  <!-- 右欄：主管機關負責 -->
  <rect x="424" y="108" width="6" height="24" rx="3" fill="#0d9488"/>
  <text x="438" y="125" font-size="20" fill="#1e293b" font-weight="700">主管機關評分（項目 4–6，4 分）</text>

  <!-- 項目4 -->
  <rect x="424" y="136" width="336" height="72" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="424" y="136" width="6" height="72" rx="2" fill="#0d9488"/>
  <text x="444" y="157" font-size="18" fill="#1e293b" font-weight="700">4. 人員資格與人數 ─ 2分</text>
  <text x="444" y="176" font-size="15" fill="#57534e">依輔導查核表評分；流動率</text>
  <text x="444" y="196" font-size="15" fill="#57534e">20%以下優、21–30%可、31%+待加強</text>

  <!-- 項目5 -->
  <rect x="424" y="216" width="336" height="72" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="424" y="216" width="6" height="72" rx="2" fill="#0d9488"/>
  <text x="444" y="237" font-size="18" fill="#1e293b" font-weight="700">5. 訓練進修 ─ 1分</text>
  <text x="444" y="256" font-size="15" fill="#57534e">專業人員訓練每年符合規定 0.5分</text>
  <text x="444" y="276" font-size="15" fill="#57534e">性侵害防治課程全員完成 0.5分</text>

  <!-- 項目6 -->
  <rect x="424" y="296" width="336" height="72" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="424" y="296" width="6" height="72" rx="2" fill="#0d9488"/>
  <text x="444" y="317" font-size="18" fill="#1e293b" font-weight="700">6. 勞動條件 ─ 1分</text>
  <text x="444" y="336" font-size="15" fill="#57534e">109–112年輔導查核勞動條件</text>
  <text x="444" y="356" font-size="15" fill="#57534e">每年均符合規定方可得分</text>

  <!-- 中間分隔線 -->
  <line x1="400" y1="108" x2="400" y2="390" stroke="#dedad3" stroke-width="1"/>

  <!-- 底部提示 -->
  <rect x="40" y="390" width="720" height="48" rx="10" fill="#fef3c7"/>
  <text x="400" y="415" font-size="17" fill="#d97706" text-anchor="middle" font-weight="700">提示：項目 4–6 依輔導查核歷年結果計分，平時積極配合查核才是關鍵</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
