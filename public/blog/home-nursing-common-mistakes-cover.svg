<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 右側裝飾區塊 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>

  <!-- 右側裝飾大數字 -->
  <text x="1010" y="239" font-size="180" font-weight="900" fill="#d97706" text-anchor="middle" opacity="0.85">10</text>
  <text x="1010" y="281" font-size="28" fill="#78716c" text-anchor="middle" font-weight="600">個常見缺失類型</text>

  <!-- 右側直列 pill 標籤（代表缺失分布） -->
  <rect x="840" y="303" width="320" height="56" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="1000" y="333" font-size="24" fill="#d97706" text-anchor="middle" font-weight="700">A 構面 · 6 個高頻缺失</text>
  <text x="1000" y="354" font-size="20" fill="#a8a29e" text-anchor="middle">感染管制 · 品質指標 · 訪視安全</text>

  <rect x="840" y="371" width="320" height="56" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="1000" y="401" font-size="24" fill="#78716c" text-anchor="middle" font-weight="700">B 構面 · 4 個高頻缺失</text>
  <text x="1000" y="422" font-size="20" fill="#a8a29e" text-anchor="middle">B1 協議缺失 · B2 評估不完整</text>

  <!-- 右側底部標籤 -->
  <rect x="840" y="441" width="320" height="52" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="1000" y="477" font-size="28" fill="#d97706" text-anchor="middle" font-weight="700">每項附防範方法</text>

  <rect x="840" y="505" width="320" height="52" rx="10" fill="#57534e" opacity="0.10"/>
  <text x="1000" y="541" font-size="26" fill="#57534e" text-anchor="middle" font-weight="700">評鑑前逐項核對 · 降低失分風險</text>

  <!-- 左側主內容區 -->
  <text x="60" y="200" font-size="110" font-weight="900" fill="#1e293b">評鑑常見缺失</text>
  <text x="60" y="338" font-size="110" font-weight="900" fill="#d97706">10 個踩坑經驗</text>

  <line x1="60" y1="365" x2="780" y2="365" stroke="#dedad3" stroke-width="2"/>

  <text x="60" y="416" font-size="38" fill="#57534e" font-weight="400">居家護理所 · 過來人整理 · 附改善方法</text>

  <!-- 特色標籤列 -->
  <rect x="60" y="450" width="148" height="54" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="134" y="483" font-size="28" fill="#d97706" text-anchor="middle" font-weight="600">常見缺失</text>

  <rect x="220" y="450" width="148" height="54" rx="10" fill="#78716c" opacity="0.12"/>
  <text x="294" y="483" font-size="28" fill="#78716c" text-anchor="middle" font-weight="600">防範方法</text>

  <rect x="380" y="450" width="148" height="54" rx="10" fill="#57534e" opacity="0.12"/>
  <text x="454" y="483" font-size="28" fill="#57534e" text-anchor="middle" font-weight="600">評鑑失分</text>

  <rect x="540" y="450" width="148" height="54" rx="10" fill="#a8a29e" opacity="0.18"/>
  <text x="614" y="483" font-size="28" fill="#78716c" text-anchor="middle" font-weight="600">居家護理所</text>

  <!-- 適用對象 -->
  <text x="60" y="558" font-size="28" fill="#94a3b8">適用對象：居家護理所負責人 · 評鑑準備人員</text>

  <!-- 浮水印 -->
  <text x="1140" y="590" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
