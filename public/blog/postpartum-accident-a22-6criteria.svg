<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- Header -->
  <rect x="0" y="29" width="800" height="60" fill="#e8e6de"/>
  <rect x="0" y="29" width="6" height="60" rx="2" fill="#d97706"/>
  <text x="28" y="74" font-size="30" fill="#1e293b" font-weight="700">A2.2 的 6 個評鑑基準</text>
  <!-- Row 1 -->
  <rect x="28" y="118" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="118" width="6" height="60" rx="2" fill="#d97706"/>
  <circle cx="66" cy="148" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="154" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">①</text>
  <text x="100" y="143" font-size="20" fill="#1e293b" font-weight="700">7 類意外事件 SOP</text>
  <text x="100" y="165" font-size="16" fill="#57534e">跌倒、燙傷、嬰兒抱錯、嬰兒誘拐、藥物錯誤、設備故障、重大事故</text>
  <rect x="620" y="124" width="136" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="141" font-size="16" fill="#d97706" text-anchor="middle">資料</text>
  <text x="688" y="161" font-size="16" fill="#d97706" text-anchor="middle">查核</text>
  <!-- Row 2 -->
  <rect x="28" y="191" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="191" width="6" height="60" rx="2" fill="#78716c"/>
  <circle cx="66" cy="221" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="227" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">②</text>
  <text x="100" y="216" font-size="20" fill="#1e293b" font-weight="700">24 小時通報</text>
  <text x="100" y="238" font-size="16" fill="#57534e">事件後 24 小時內書面通報，依規定陳報主管機關</text>
  <rect x="620" y="197" width="136" height="46" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="214" font-size="16" fill="#78716c" text-anchor="middle">資料</text>
  <text x="688" y="234" font-size="16" fill="#78716c" text-anchor="middle">查核</text>
  <!-- Row 3 -->
  <rect x="28" y="264" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="264" width="6" height="60" rx="2" fill="#57534e"/>
  <circle cx="66" cy="294" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="300" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">③</text>
  <text x="100" y="289" font-size="20" fill="#1e293b" font-weight="700">追蹤改善記錄</text>
  <text x="100" y="311" font-size="16" fill="#57534e">事件後有追蹤改善措施，有書面追蹤記錄</text>
  <rect x="620" y="270" width="136" height="46" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="287" font-size="16" fill="#57534e" text-anchor="middle">資料</text>
  <text x="688" y="307" font-size="16" fill="#57534e" text-anchor="middle">查核</text>
  <!-- Row 4 -->
  <rect x="28" y="337" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="337" width="6" height="60" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="367" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="373" font-size="16" fill="#a8a29e" text-anchor="middle" font-weight="900">④</text>
  <text x="100" y="362" font-size="20" fill="#1e293b" font-weight="700">工作人員演練</text>
  <text x="100" y="384" font-size="16" fill="#57534e">熟知意外事件處理流程，定期演練並有演練紀錄</text>
  <rect x="620" y="343" width="136" height="46" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="360" font-size="16" fill="#a8a29e" text-anchor="middle">資料+</text>
  <text x="688" y="380" font-size="16" fill="#a8a29e" text-anchor="middle">現場訪談</text>
  <!-- Row 5 -->
  <rect x="28" y="410" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="410" width="6" height="60" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="440" r="16" fill="#94a3b8" opacity="0.15"/>
  <text x="66" y="446" font-size="16" fill="#94a3b8" text-anchor="middle" font-weight="900">⑤⑥</text>
  <text x="100" y="435" font-size="20" fill="#1e293b" font-weight="700">急救設備維護 + 緊急通知家屬</text>
  <text x="100" y="457" font-size="16" fill="#57534e">AED/急救箱定期維護有記錄；緊急事件即時通知家屬有書面記錄</text>
  <rect x="620" y="416" width="136" height="46" rx="8" fill="#94a3b8" opacity="0.12"/>
  <text x="688" y="433" font-size="16" fill="#94a3b8" text-anchor="middle">現場+</text>
  <text x="688" y="453" font-size="16" fill="#94a3b8" text-anchor="middle">資料查核</text>
  <!-- Watermark -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
