<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!--
    【ref-list-6.svg — 6 列直列清單參考範本（兩層間距 + 自適應字型版）】
    結構：pad | Header(54) | header_gap | Row1(54) | inner×5 | Row6(54) | pad
    公式：2×31 + 10 + 7×54 + 5×10 = 62+10+378+50 = 500 ✓
      pad（上下留白）= 31，header_gap（Header↔Row1）= 10，inner（列間）= 10

    自適應字型：Q_font = 18, R_font = 14, circle_r = 16
    S_rect_h = clamp(34, H-16, 52) = 38

    Header y=31, h=54, text_y=73
    Row[0] y = 31+54+10 = 95
    Row[1] y = 95+54+10 = 159
    Row[2] y = 159+54+10 = 223
    Row[3] y = 223+54+10 = 287
    Row[4] y = 287+54+10 = 351
    Row[5] y = 351+54+10 = 415
    Row[5] bottom = 469, 底部留白=31=pad ✓

    Row 內垂直置中（H=54, Q_font=18, R_font=14）：
      cy = row_y+27, NUM y = row_y+33 (r=16)
      Q offset+24, R offset+43
      S_rect_y = row_y+8, h=38, S1=row_y+21, S2=row_y+41
    浮水印 y=488
  -->

  <!-- Header（y=31, h=54） -->
  <rect x="0" y="31" width="800" height="54" fill="#e8e6de"/>
  <rect x="0" y="31" width="6" height="54" fill="#d97706" rx="2"/>
  <!-- M2_font=36（9字） -->
  <text x="28" y="73" font-size="36" fill="#1e293b" font-weight="700">6 大評鑑準備清單</text>

  <!-- Row 1（y=95, H=54, cy=122, #d97706 琥珀） -->
  <rect x="28" y="95" width="744" height="54" rx="12" fill="#e8e6de"/>
  <rect x="28" y="95" width="6" height="54" rx="2" fill="#d97706"/>
  <circle cx="66" cy="122" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="128" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <!-- Q 18px offset+24 → 119; R 14px offset+43 → 138 -->
  <text x="100" y="119" font-size="18" fill="#1e293b" font-weight="700">督導機制不完整</text>
  <text x="100" y="138" font-size="14" fill="#57534e">個別督導頻率不足，員工問題無法及時被發現與支持</text>
  <!-- S rect y=103, h=38 -->
  <rect x="620" y="103" width="136" height="38" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="116" font-size="14" fill="#d97706" text-anchor="middle">第 9 條</text>
  <text x="688" y="134" font-size="14" fill="#d97706" text-anchor="middle">每半年個督一次</text>

  <!-- Row 2（y=159, H=54, cy=186, #78716c 暖灰） -->
  <rect x="28" y="159" width="744" height="54" rx="12" fill="#e8e6de"/>
  <rect x="28" y="159" width="6" height="54" rx="2" fill="#78716c"/>
  <circle cx="66" cy="186" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="192" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <!-- Q offset+24 → 183; R offset+43 → 202 -->
  <text x="100" y="183" font-size="18" fill="#1e293b" font-weight="700">教育訓練流於形式</text>
  <text x="100" y="202" font-size="14" fill="#57534e">訓練只是簽到，缺乏實質學習，員工成長動力低落</text>
  <!-- S rect y=167, h=38 -->
  <rect x="620" y="167" width="136" height="38" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="180" font-size="14" fill="#78716c" text-anchor="middle">第 29 條</text>
  <text x="688" y="198" font-size="14" fill="#78716c" text-anchor="middle">在職 20 小時</text>

  <!-- Row 3（y=223, H=54, cy=250, #57534e 深棕） -->
  <rect x="28" y="223" width="744" height="54" rx="12" fill="#e8e6de"/>
  <rect x="28" y="223" width="6" height="54" rx="2" fill="#57534e"/>
  <circle cx="66" cy="250" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="256" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <!-- Q offset+24 → 247; R offset+43 → 266 -->
  <text x="100" y="247" font-size="18" fill="#1e293b" font-weight="700">留任率未追蹤管理</text>
  <text x="100" y="266" font-size="14" fill="#57534e">不知如何計算離職率，缺乏系統性的離職原因分析</text>
  <!-- S rect y=231, h=38 -->
  <rect x="620" y="231" width="136" height="38" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="244" font-size="14" fill="#57534e" text-anchor="middle">第 30 條</text>
  <text x="688" y="262" font-size="14" fill="#57534e" text-anchor="middle">前四年度留任率</text>

  <!-- Row 4（y=287, H=54, cy=314, #a8a29e 淺灰） -->
  <rect x="28" y="287" width="744" height="54" rx="12" fill="#e8e6de"/>
  <rect x="28" y="287" width="6" height="54" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="314" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="320" font-size="16" fill="#a8a29e" text-anchor="middle" font-weight="900">4</text>
  <!-- Q offset+24 → 311; R offset+43 → 330 -->
  <text x="100" y="311" font-size="18" fill="#1e293b" font-weight="700">主任缺乏持續進修</text>
  <text x="100" y="330" font-size="14" fill="#57534e">管理者忙於日常業務，未安排進修，缺乏新管理知能</text>
  <!-- S rect y=295, h=38 -->
  <rect x="620" y="295" width="136" height="38" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="308" font-size="14" fill="#a8a29e" text-anchor="middle">第 31 條</text>
  <text x="688" y="326" font-size="14" fill="#a8a29e" text-anchor="middle">每年 4 小時</text>

  <!-- Row 5（y=351, H=54, cy=378, #94a3b8 藍灰） -->
  <rect x="28" y="351" width="744" height="54" rx="12" fill="#e8e6de"/>
  <rect x="28" y="351" width="6" height="54" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="378" r="16" fill="#94a3b8" opacity="0.15"/>
  <text x="66" y="384" font-size="16" fill="#94a3b8" text-anchor="middle" font-weight="900">5</text>
  <!-- Q offset+24 → 375; R offset+43 → 394 -->
  <text x="100" y="375" font-size="18" fill="#1e293b" font-weight="700">健康管理制度不足</text>
  <text x="100" y="394" font-size="14" fill="#57534e">健檢報告未追蹤異常值，員工誤以為健康可跳過年度檢查</text>
  <!-- S rect y=359, h=38 -->
  <rect x="620" y="359" width="136" height="38" rx="8" fill="#94a3b8" opacity="0.12"/>
  <text x="688" y="372" font-size="14" fill="#94a3b8" text-anchor="middle">第 32 條</text>
  <text x="688" y="390" font-size="14" fill="#94a3b8" text-anchor="middle">每年健檢</text>

  <!-- Row 6（y=415, H=54, cy=442, #6b7280 藍） -->
  <rect x="28" y="415" width="744" height="54" rx="12" fill="#e8e6de"/>
  <rect x="28" y="415" width="6" height="54" rx="2" fill="#6b7280"/>
  <circle cx="66" cy="442" r="16" fill="#6b7280" opacity="0.15"/>
  <text x="66" y="448" font-size="16" fill="#6b7280" text-anchor="middle" font-weight="900">6</text>
  <!-- Q offset+24 → 439; R offset+43 → 458 -->
  <text x="100" y="439" font-size="18" fill="#1e293b" font-weight="700">家屬溝通機制薄弱</text>
  <text x="100" y="458" font-size="14" fill="#57534e">滿意度調查流於形式，家屬意見未有系統性回應與追蹤</text>
  <!-- S rect y=423, h=38 -->
  <rect x="620" y="423" width="136" height="38" rx="8" fill="#6b7280" opacity="0.12"/>
  <text x="688" y="436" font-size="14" fill="#6b7280" text-anchor="middle">第 15 條</text>
  <text x="688" y="454" font-size="14" fill="#6b7280" text-anchor="middle">年度滿意度調查</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
