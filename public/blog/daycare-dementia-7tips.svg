<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"
     font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">7 個應對技巧 4 大面向分類</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">情緒→轉移→需求→安全，四階段循序應對</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- 左上卡片（#d97706，情緒同理）-->
  <rect x="40" y="104" width="346" height="168" rx="12" fill="white"/>
  <rect x="40" y="104" width="346" height="44" rx="12" fill="#d97706"/>
  <rect x="40" y="128" width="346" height="20" fill="#d97706"/>
  <circle cx="68" cy="126" r="9" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
  <circle cx="68" cy="126" r="3" fill="white" opacity="0.8"/>
  <text x="213" y="133" text-anchor="middle" font-size="15" fill="white" font-weight="700">情緒同理（技巧 1）</text>
  <text x="60" y="172" font-size="14" fill="#57534e">• 接納情緒，不否定「想回家」</text>
  <text x="60" y="192" font-size="14" fill="#57534e">• 同理地回應：「您想回家啊」</text>
  <text x="60" y="212" font-size="14" fill="#57534e">• 避免爭辯「這裡就是您的家」</text>
  <text x="60" y="232" font-size="14" fill="#57534e">• 讓個案感受被理解、被尊重</text>
  <rect x="56" y="246" width="80" height="20" rx="10" fill="#fef3c7"/>
  <text x="96" y="260" text-anchor="middle" font-size="14" fill="#d97706" font-weight="600">第一步驟</text>

  <!-- 右上卡片（#78716c，活動轉移）-->
  <rect x="414" y="104" width="346" height="168" rx="12" fill="white"/>
  <rect x="414" y="104" width="346" height="44" rx="12" fill="#78716c"/>
  <rect x="414" y="128" width="346" height="20" fill="#78716c"/>
  <rect x="438" y="117" width="18" height="18" rx="3" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
  <line x1="441" y1="126" x2="453" y2="126" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
  <text x="587" y="133" text-anchor="middle" font-size="15" fill="white" font-weight="700">活動轉移（技巧 2–3）</text>
  <text x="434" y="172" font-size="14" fill="#57534e">• 引導個案參與喜歡的活動</text>
  <text x="434" y="192" font-size="14" fill="#57534e">• 音樂、摺紙、懷舊物品等</text>
  <text x="434" y="212" font-size="14" fill="#57534e">• 創造熟悉的家庭感情境</text>
  <text x="434" y="232" font-size="14" fill="#57534e">• 根據個案生命史個別設計</text>
  <rect x="430" y="246" width="80" height="20" rx="10" fill="#f5f5f4"/>
  <text x="470" y="260" text-anchor="middle" font-size="14" fill="#78716c" font-weight="600">第二步驟</text>

  <!-- 左下卡片（#57534e，需求評估）-->
  <rect x="40" y="288" width="346" height="162" rx="12" fill="white"/>
  <rect x="40" y="288" width="346" height="44" rx="12" fill="#57534e"/>
  <rect x="40" y="312" width="346" height="20" fill="#57534e"/>
  <line x1="60" y1="309" x2="68" y2="317" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-linecap="round"/>
  <line x1="68" y1="317" x2="84" y2="301" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-linecap="round"/>
  <text x="213" y="317" text-anchor="middle" font-size="15" fill="white" font-weight="700">需求評估（技巧 4–5）</text>
  <text x="60" y="356" font-size="14" fill="#57534e">• 觀察是否有疼痛或身體不適</text>
  <text x="60" y="376" font-size="14" fill="#57534e">• 確認如廁、飢餓等基本需求</text>
  <text x="60" y="396" font-size="14" fill="#57534e">• 評估是否有孤獨或焦慮情緒</text>
  <text x="60" y="416" font-size="14" fill="#57534e">• 調整照護計畫回應潛在需求</text>
  <rect x="56" y="430" width="80" height="20" rx="10" fill="#f5f0eb"/>
  <text x="96" y="444" text-anchor="middle" font-size="14" fill="#57534e" font-weight="600">第三步驟</text>

  <!-- 右下卡片（#a8a29e，安全追蹤）-->
  <rect x="414" y="288" width="346" height="162" rx="12" fill="white"/>
  <rect x="414" y="288" width="346" height="44" rx="12" fill="#a8a29e"/>
  <rect x="414" y="312" width="346" height="20" fill="#a8a29e"/>
  <circle cx="440" cy="310" r="8" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
  <line x1="440" y1="302" x2="440" y2="307" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
  <circle cx="440" cy="314" r="2" fill="rgba(255,255,255,0.7)"/>
  <text x="587" y="317" text-anchor="middle" font-size="15" fill="white" font-weight="700">安全追蹤（技巧 6–7）</text>
  <text x="434" y="356" font-size="14" fill="#57534e">• 維持安全視距，防止走失</text>
  <text x="434" y="376" font-size="14" fill="#57534e">• 完整記錄事件經過與應對</text>
  <text x="434" y="396" font-size="14" fill="#57534e">• 定期評值更新照護計畫</text>
  <text x="434" y="416" font-size="14" fill="#57534e">• 通知家屬並共同討論對策</text>
  <rect x="430" y="430" width="80" height="20" rx="10" fill="#f5f5f4"/>
  <text x="470" y="444" text-anchor="middle" font-size="14" fill="#a8a29e" font-weight="600">第四步驟</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
