  <polygon points="736,265 736,279 752,272" fill="#a8a29e"/>

  <!-- 節點1：評鑑前3個月（上方） -->
  <rect x="30" y="108" width="140" height="100" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
