  <circle cx="256" cy="272" r="24" fill="#78716c"/>
  <text x="256" y="280" text-anchor="middle" font-size="20" fill="white" font-weight="700">2</text>
  <line x1="256" y1="296" x2="256" y2="350" stroke="#78716c" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="186" y="350" width="140" height="100" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="186" y="442" width="140" height="8" rx="4" fill="#78716c"/>
