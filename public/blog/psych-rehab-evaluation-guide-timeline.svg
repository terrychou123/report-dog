  <text x="568" y="280" text-anchor="middle" font-size="20" fill="white" font-weight="700">4</text>
  <line x1="568" y1="296" x2="568" y2="350" stroke="#a8a29e" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="498" y="350" width="140" height="100" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
