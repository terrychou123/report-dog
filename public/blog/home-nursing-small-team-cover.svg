<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 右側裝飾區塊 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>

  <!-- 右側裝飾大數字 -->
  <text x="1010" y="219" font-size="160" font-weight="900" fill="#d97706" text-anchor="middle" opacity="0.85">3</text>
  <text x="1010" y="261" font-size="26" fill="#78716c" text-anchor="middle" font-weight="600">人小機構的生存指南</text>

  <!-- 右側 3 步驟 -->
  <rect x="840" y="283" width="320" height="56" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="868" y="313" font-size="24" fill="#d97706" font-weight="700">STEP 1</text>
  <text x="960" y="313" font-size="22" fill="#78716c">先盤點</text>
  <text x="960" y="331" font-size="18" fill="#a8a29e">不要先寫</text>

  <rect x="840" y="351" width="320" height="56" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="868" y="381" font-size="24" fill="#d97706" font-weight="700">STEP 2</text>
  <text x="960" y="381" font-size="22" fill="#78716c">依優先分工</text>
  <text x="960" y="399" font-size="18" fill="#a8a29e">每人負責一塊</text>

  <rect x="840" y="419" width="320" height="56" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="868" y="449" font-size="24" fill="#d97706" font-weight="700">STEP 3</text>
  <text x="960" y="449" font-size="22" fill="#78716c">設定截止日</text>
  <text x="960" y="467" font-size="18" fill="#a8a29e">提前 12 週啟動</text>

  <!-- 右側底部標籤 -->
  <rect x="840" y="489" width="320" height="52" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="1000" y="525" font-size="26" fill="#d97706" text-anchor="middle" font-weight="700">多人協作 · 分工不亂</text>

  <rect x="840" y="553" width="320" height="52" rx="10" fill="#78716c" opacity="0.10"/>
  <text x="1000" y="589" font-size="24" fill="#78716c" text-anchor="middle" font-weight="600">小機構也能系統準備評鑑</text>

  <!-- 左側主內容區 -->
  <text x="60" y="185" font-size="100" font-weight="900" fill="#1e293b">3 人居家護理所</text>
  <text x="60" y="318" font-size="100" font-weight="900" fill="#d97706">撐過評鑑季</text>

  <line x1="60" y1="348" x2="780" y2="348" stroke="#dedad3" stroke-width="2"/>

  <text x="60" y="400" font-size="36" fill="#57534e" font-weight="400">小型機構分工策略 · 評鑑準備 12 週計畫</text>

  <!-- 特色標籤列 -->
  <rect x="60" y="434" width="148" height="54" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="134" y="471" font-size="28" fill="#d97706" text-anchor="middle" font-weight="600">分工策略</text>

  <rect x="220" y="434" width="148" height="54" rx="10" fill="#78716c" opacity="0.12"/>
  <text x="294" y="471" font-size="28" fill="#78716c" text-anchor="middle" font-weight="600">多人協作</text>

  <rect x="380" y="434" width="148" height="54" rx="10" fill="#57534e" opacity="0.12"/>
  <text x="454" y="471" font-size="28" fill="#57534e" text-anchor="middle" font-weight="600">小型機構</text>

  <rect x="540" y="434" width="148" height="54" rx="10" fill="#a8a29e" opacity="0.18"/>
  <text x="614" y="471" font-size="28" fill="#78716c" text-anchor="middle" font-weight="600">評鑑季</text>

  <!-- 適用對象 -->
  <text x="60" y="540" font-size="28" fill="#94a3b8">適用對象：小型居家護理所負責人 · 護理長</text>

  <!-- 浮水印 -->
  <text x="1140" y="590" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
