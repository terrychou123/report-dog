<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"
     font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">評鑑前 5 大地雷確認清單</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">照護計畫・追蹤評值・督導管理・品管訓練</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- 左欄 Section 1：照護計畫（第 6 條）#d97706 -->
  <rect x="60" y="108" width="6" height="24" rx="2" fill="#d97706"/>
  <text x="74" y="125" font-size="18" fill="#1e293b" font-weight="700">照護計畫（第 6 條）</text>

  <!-- 左欄 Item 1：已確認（✓）-->
  <rect x="64" y="140" width="20" height="20" rx="3" fill="#f0efe8" stroke="#a8a29e" stroke-width="1"/>
  <path d="M 68,150 L 72,155 L 81,143" fill="none" stroke="#d97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="94" y="156" font-size="18" fill="#1e293b">照顧計畫 7 工作天內完成</text>

  <!-- 左欄 Item 2：待確認 -->
  <rect x="64" y="180" width="20" height="20" rx="3" fill="none" stroke="#a8a29e" stroke-width="1.5"/>
  <text x="94" y="196" font-size="18" fill="#1e293b">計畫與評估一致無脫節</text>

  <!-- 左欄 Item 3：待確認 -->
  <rect x="64" y="220" width="20" height="20" rx="3" fill="none" stroke="#a8a29e" stroke-width="1.5"/>
  <text x="94" y="236" font-size="18" fill="#1e293b">家屬參與過程有記錄</text>

  <!-- 左欄 Section 2：追蹤評值（第 7 條）#57534e -->
  <rect x="60" y="262" width="6" height="24" rx="2" fill="#57534e"/>
  <text x="74" y="279" font-size="18" fill="#1e293b" font-weight="700">追蹤評值（第 7 條）</text>

  <!-- 左欄 Item 4 -->
  <rect x="64" y="294" width="20" height="20" rx="3" fill="none" stroke="#a8a29e" stroke-width="1.5"/>
  <text x="94" y="310" font-size="18" fill="#1e293b">追蹤評值有固定週期</text>

  <!-- 左欄 Item 5 -->
  <rect x="64" y="334" width="20" height="20" rx="3" fill="none" stroke="#a8a29e" stroke-width="1.5"/>
  <text x="94" y="350" font-size="18" fill="#1e293b">未達成有原因分析記錄</text>

  <!-- 左欄 Item 6 -->
  <rect x="64" y="374" width="20" height="20" rx="3" fill="none" stroke="#a8a29e" stroke-width="1.5"/>
  <text x="94" y="390" font-size="18" fill="#1e293b">計畫修正方向有記錄</text>

  <!-- 垂直分隔線 -->
  <line x1="400" y1="98" x2="400" y2="432" stroke="#dedad3" stroke-width="1"/>

  <!-- 右欄 Section 1：督導管理（第 9 條）#78716c -->
  <rect x="416" y="108" width="6" height="24" rx="2" fill="#78716c"/>
  <text x="430" y="125" font-size="18" fill="#1e293b" font-weight="700">督導管理（第 9 條）</text>

  <!-- 右欄 Item 1 -->
  <rect x="420" y="140" width="20" height="20" rx="3" fill="none" stroke="#a8a29e" stroke-width="1.5"/>
  <text x="450" y="156" font-size="18" fill="#1e293b">個督每半年一次已完成</text>

  <!-- 右欄 Item 2 -->
  <rect x="420" y="180" width="20" height="20" rx="3" fill="none" stroke="#a8a29e" stroke-width="1.5"/>
  <text x="450" y="196" font-size="18" fill="#1e293b">團督每季一次已完成</text>

  <!-- 右欄 Item 3 -->
  <rect x="420" y="220" width="20" height="20" rx="3" fill="none" stroke="#a8a29e" stroke-width="1.5"/>
  <text x="450" y="236" font-size="18" fill="#1e293b">督導紀錄內容充實</text>

  <!-- 右欄 Section 2：品管訓練（第 22・29 條）#a8a29e -->
  <rect x="416" y="262" width="6" height="24" rx="2" fill="#a8a29e"/>
  <text x="430" y="279" font-size="18" fill="#1e293b" font-weight="700">品管訓練（第 22・29 條）</text>

  <!-- 右欄 Item 4 -->
  <rect x="420" y="294" width="20" height="20" rx="3" fill="none" stroke="#a8a29e" stroke-width="1.5"/>
  <text x="450" y="310" font-size="18" fill="#1e293b">品管指標已自訂兩項以上</text>

  <!-- 右欄 Item 5 -->
  <rect x="420" y="334" width="20" height="20" rx="3" fill="none" stroke="#a8a29e" stroke-width="1.5"/>
  <text x="450" y="350" font-size="18" fill="#1e293b">年度教育訓練達 20 小時</text>

  <!-- 右欄 Item 6 -->
  <rect x="420" y="374" width="20" height="20" rx="3" fill="none" stroke="#a8a29e" stroke-width="1.5"/>
  <text x="450" y="390" font-size="18" fill="#1e293b">必要課程類別均已涵蓋</text>

  <!-- 底部分隔線 -->
  <line x1="40" y1="433" x2="760" y2="433" stroke="#dedad3" stroke-width="1"/>

  <!-- 圖例 -->
  <rect x="75" y="443" width="18" height="18" rx="3" fill="#f0efe8" stroke="#a8a29e" stroke-width="1"/>
  <path d="M 78,453 L 82,458 L 91,446" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="102" y="458" font-size="18" fill="#57534e">已確認完成</text>

  <rect x="230" y="443" width="18" height="18" rx="3" fill="none" stroke="#a8a29e" stroke-width="1.5"/>
  <text x="257" y="458" font-size="18" fill="#57534e">待確認項目</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
