<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8" rx="16"/>
  <rect x="20" y="20" width="760" height="460" fill="white" rx="12"/>

  <!-- 標題列 -->
  <rect x="20" y="20" width="760" height="60" fill="#dc2626" rx="12"/>
  <rect x="20" y="60" width="760" height="20" fill="#dc2626"/>
  <text x="400" y="58" font-size="22" font-weight="700" fill="white" text-anchor="middle">A1.2 四項基準概覽——人員配置與急救訓練</text>

  <!-- 卡片1 護理主管 -->
  <rect x="45" y="105" width="330" height="160" rx="14" fill="#fee2e2"/>
  <rect x="45" y="105" width="330" height="10" rx="5" fill="#dc2626"/>
  <text x="55" y="138" font-size="36" font-weight="900" fill="#dc2626">1</text>
  <text x="105" y="138" font-size="18" font-weight="700" fill="#dc2626">護理主管（護理長）資格</text>
  <line x1="60" y1="150" x2="360" y2="150" stroke="#fef2f2" stroke-width="1"/>
  <text x="60" y="172" font-size="14" fill="#1e293b">* 具護理師執照</text>
  <text x="60" y="194" font-size="14" fill="#1e293b">* 護理行政工作 3 年以上經驗</text>
  <text x="60" y="216" font-size="14" fill="#1e293b">* 需有代理護理長名單備查</text>
  <text x="60" y="238" font-size="14" fill="#dc2626" font-weight="700">查核：聘用文件 + 執照正本/影本</text>

  <!-- 卡片2 急救訓練 -->
  <rect x="420" y="105" width="330" height="160" rx="14" fill="#fff7ed"/>
  <rect x="420" y="105" width="330" height="10" rx="5" fill="#ea580c"/>
  <text x="430" y="138" font-size="36" font-weight="900" fill="#ea580c">2</text>
  <text x="480" y="138" font-size="18" font-weight="700" fill="#d97706">護理人員急救訓練</text>
  <line x1="435" y1="150" x2="735" y2="150" stroke="#fff7ed" stroke-width="1"/>
  <text x="435" y="172" font-size="14" fill="#1e293b">* 每 <tspan font-weight="900" fill="#ea580c">2年</tspan> 至少 1 次</text>
  <text x="435" y="194" font-size="14" fill="#1e293b">* 每次 <tspan font-weight="900" fill="#ea580c">8 小時</tspan> 以上</text>
  <text x="435" y="216" font-size="14" fill="#1e293b">* 必須含 BLS + AED 操作訓練</text>
  <text x="435" y="238" font-size="14" fill="#ea580c" font-weight="700">查核：訓練證書（效期確認）</text>

  <!-- 卡片3 新進訓練 -->
  <rect x="45" y="285" width="330" height="155" rx="14" fill="#fef3c7"/>
  <rect x="45" y="285" width="330" height="10" rx="5" fill="#d97706"/>
  <text x="55" y="318" font-size="36" font-weight="900" fill="#d97706">3</text>
  <text x="105" y="318" font-size="18" font-weight="700" fill="#d97706">新進護理人員訓練</text>
  <line x1="60" y1="330" x2="360" y2="330" stroke="#fef3c7" stroke-width="1"/>
  <text x="60" y="352" font-size="14" fill="#1e293b">* 需有年度訓練計畫書</text>
  <text x="60" y="374" font-size="14" fill="#1e293b">* 訓練記錄含考核評量</text>
  <text x="60" y="396" font-size="14" fill="#1e293b">* 新進人員到職 1 個月內完成</text>
  <text x="60" y="418" font-size="14" fill="#d97706" font-weight="700">查核：訓練計畫 + 個別訓練記錄</text>

  <!-- 卡片4 照服員 -->
  <rect x="420" y="285" width="330" height="155" rx="14" fill="#f0fdf4"/>
  <rect x="420" y="285" width="330" height="10" rx="5" fill="#16a34a"/>
  <text x="430" y="318" font-size="36" font-weight="900" fill="#16a34a">4</text>
  <text x="480" y="318" font-size="18" font-weight="700" fill="#16a34a">照服員配置與持證</text>
  <line x1="435" y1="330" x2="735" y2="330" stroke="#a7f3d0" stroke-width="1"/>
  <text x="435" y="352" font-size="14" fill="#1e293b">* 依規定照服員人數配置</text>
  <text x="435" y="374" font-size="14" fill="#1e293b">* 持有照顧服務員訓練結業證書</text>
  <text x="435" y="396" font-size="14" fill="#1e293b">* 新進照服員 3 個月內完成訓練</text>
  <text x="435" y="418" font-size="14" fill="#16a34a" font-weight="700">查核：花名冊 + 結業證書影本</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end">報告汪 reportwang.com</text>
</svg>
