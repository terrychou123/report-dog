<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>

  <!-- 右側裝飾區 -->
  <rect x="800" y="0" width="400" height="630" fill="#e8e6de"/>

  <!-- 主標題第1行 -->
  <text x="60" y="165" font-size="110" font-weight="bold" fill="#1e293b" font-family="'Noto Sans TC', sans-serif">評鑑10大缺失</text>
  <!-- 主標題第2行 -->
  <text x="60" y="285" font-size="120" font-weight="bold" fill="#d97706" font-family="'Noto Sans TC', sans-serif">一次避開</text>

  <!-- 分隔線 -->
  <line x1="60" y1="312" x2="760" y2="312" stroke="#dedad3" stroke-width="2"/>

  <!-- 副標題 -->
  <text x="60" y="357" font-size="36" fill="#57534e" font-family="'Noto Sans TC', sans-serif">從約束記錄到護理人力的改善指南</text>

  <!-- 特色標籤列 -->
  <rect x="60" y="388" width="140" height="40" rx="20" fill="#d97706"/>
  <text x="130" y="413" font-size="20" fill="white" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">10大缺失</text>

  <rect x="215" y="388" width="140" height="40" rx="20" fill="#78716c"/>
  <text x="285" y="413" font-size="20" fill="white" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">改善對策</text>

  <rect x="370" y="388" width="140" height="40" rx="20" fill="#57534e"/>
  <text x="440" y="413" font-size="20" fill="white" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">115年度</text>

  <!-- 適用對象說明 -->
  <text x="60" y="472" font-size="26" fill="#57534e" font-family="'Noto Sans TC', sans-serif">適用對象：精神護理之家主任、護理長、行政人員</text>

  <!-- 右側裝飾大數字 -->
  <text x="855" y="270" font-size="200" font-weight="bold" fill="#d97706" font-family="'Noto Sans TC', sans-serif" opacity="0.9">10</text>
  <!-- 右側說明文字 -->
  <text x="990" y="315" font-size="28" fill="#57534e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">常見缺失</text>

  <!-- 右側直列 pill -->
  <rect x="840" y="345" width="310" height="44" rx="22" fill="white" opacity="0.8"/>
  <text x="995" y="373" font-size="20" fill="#d97706" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">護理人力</text>

  <rect x="840" y="400" width="310" height="44" rx="22" fill="white" opacity="0.8"/>
  <text x="995" y="428" font-size="20" fill="#78716c" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">品質監測</text>

  <rect x="840" y="455" width="310" height="44" rx="22" fill="white" opacity="0.8"/>
  <text x="995" y="483" font-size="20" fill="#57534e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">約束記錄</text>

  <rect x="840" y="510" width="310" height="44" rx="22" fill="white" opacity="0.8"/>
  <text x="995" y="538" font-size="20" fill="#a8a29e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">感控計畫</text>

  <!-- 品牌浮水印 -->
  <text x="1140" y="590" font-size="24" fill="#c4bfb8" text-anchor="end" font-family="'Noto Sans TC', sans-serif">報告汪 reportwang.com</text>
</svg>
