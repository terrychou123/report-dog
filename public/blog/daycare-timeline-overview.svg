<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"
     font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">評鑑前 3 個月行動計畫</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">從盤點缺口到全員備戰，三個階段系統化推進</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- 上排左：第 3 個月：奠基 (#d97706) x=40 y=104 w=346 h=168 -->
  <rect x="40" y="104" width="346" height="168" rx="12" fill="white"/>
  <rect x="40" y="104" width="346" height="44" rx="12" fill="#d97706"/>
  <rect x="40" y="128" width="346" height="20" fill="#d97706"/>
  <text x="213" y="133" text-anchor="middle" font-size="16" fill="white" font-weight="700">第 3 個月：奠基</text>
  <text x="60" y="176" font-size="14" fill="#57534e">• 個案文件逐一盤點與確認</text>
  <text x="60" y="196" font-size="14" fill="#57534e">• 教育訓練時數與督導紀錄</text>
  <text x="60" y="216" font-size="14" fill="#57534e">• 品管指標現況確認</text>
  <rect x="56" y="242" width="80" height="20" rx="10" fill="#fef3c7"/>
  <text x="96" y="256" text-anchor="middle" font-size="14" fill="#d97706" font-weight="600">-3 個月</text>

  <!-- 上排右：第 2 個月：補強 (#78716c) x=414 y=104 w=346 h=168 -->
  <rect x="414" y="104" width="346" height="168" rx="12" fill="white"/>
  <rect x="414" y="104" width="346" height="44" rx="12" fill="#78716c"/>
  <rect x="414" y="128" width="346" height="20" fill="#78716c"/>
  <text x="587" y="133" text-anchor="middle" font-size="16" fill="white" font-weight="700">第 2 個月：補強</text>
  <text x="434" y="176" font-size="14" fill="#57534e">• 補足個案文件缺漏</text>
  <text x="434" y="196" font-size="14" fill="#57534e">• 補課達到 20 小時訓練</text>
  <text x="434" y="216" font-size="14" fill="#57534e">• 前次評鑑改善追蹤確認</text>
  <rect x="430" y="242" width="80" height="20" rx="10" fill="#f5f5f4"/>
  <text x="470" y="256" text-anchor="middle" font-size="14" fill="#78716c" font-weight="600">-2 個月</text>

  <!-- 下排左：第 1 個月：備戰 (#57534e) x=40 y=288 w=346 h=162 -->
  <rect x="40" y="288" width="346" height="162" rx="12" fill="white"/>
  <rect x="40" y="288" width="346" height="44" rx="12" fill="#57534e"/>
  <rect x="40" y="312" width="346" height="20" fill="#57534e"/>
  <text x="213" y="317" text-anchor="middle" font-size="16" fill="white" font-weight="700">第 1 個月：備戰</text>
  <text x="60" y="360" font-size="14" fill="#57534e">• 召開全員評鑑說明會</text>
  <text x="60" y="380" font-size="14" fill="#57534e">• 模擬委員訪談演練</text>
  <text x="60" y="400" font-size="14" fill="#57534e">• 環境設備最終確認</text>
  <rect x="56" y="424" width="80" height="20" rx="10" fill="#f5f0eb"/>
  <text x="96" y="438" text-anchor="middle" font-size="14" fill="#57534e" font-weight="600">-1 個月</text>

  <!-- 下排右：最後 1 週：決戰 (#a8a29e) x=414 y=288 w=346 h=162 -->
  <rect x="414" y="288" width="346" height="162" rx="12" fill="white"/>
  <rect x="414" y="288" width="346" height="44" rx="12" fill="#a8a29e"/>
  <rect x="414" y="312" width="346" height="20" fill="#a8a29e"/>
  <text x="587" y="317" text-anchor="middle" font-size="16" fill="white" font-weight="700">最後 1 週：決戰</text>
  <text x="434" y="360" font-size="14" fill="#57534e">• 每日逐項確認清單</text>
  <text x="434" y="380" font-size="14" fill="#57534e">• 文件整理與分類</text>
  <text x="434" y="400" font-size="14" fill="#57534e">• 人員分工與接待準備</text>
  <rect x="430" y="424" width="80" height="20" rx="10" fill="#f5f5f4"/>
  <text x="470" y="438" text-anchor="middle" font-size="14" fill="#a8a29e" font-weight="600">最後 1 週</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
