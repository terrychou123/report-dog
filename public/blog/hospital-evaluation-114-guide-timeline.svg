<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">6 個月備審四階段時間表</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">感控與必要條文優先，勿等評鑑前才衝刺</text>
  <line x1="28" y1="94" x2="772" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- N=4 流程圖，card_w=174, arrow_gap=16 -->
  <!-- card x: 28, 218, 408, 598, cx: 115, 305, 495, 685 -->

  <!-- 箭頭 (arrow_y=279) -->
  <line x1="202" y1="279" x2="218" y2="279" stroke="#c4bfb8" stroke-width="2"/>
  <polygon points="202,273 218,279 202,285" fill="#c4bfb8"/>
  <line x1="392" y1="279" x2="408" y2="279" stroke="#c4bfb8" stroke-width="2"/>
  <polygon points="392,273 408,279 392,285" fill="#c4bfb8"/>
  <line x1="582" y1="279" x2="598" y2="279" stroke="#c4bfb8" stroke-width="2"/>
  <polygon points="582,273 598,279 582,285" fill="#c4bfb8"/>

  <!-- Step 1：自評階段 (#d97706 琥珀) -->
  <rect x="28" y="108" width="174" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="108" width="174" height="8" rx="4" fill="#d97706"/>
  <rect x="28" y="112" width="174" height="4" fill="#d97706"/>
  <circle cx="115" cy="201" r="44" fill="#fef3c7"/>
  <text x="115" y="190" text-anchor="middle" font-size="16" fill="#d97706" font-weight="700">STEP</text>
  <text x="115" y="220" text-anchor="middle" font-size="26" fill="#d97706" font-weight="700">01</text>
  <text x="115" y="290" text-anchor="middle" font-size="20" fill="#1e293b" font-weight="700">自評階段</text>
  <text x="115" y="316" text-anchor="middle" font-size="15" fill="#57534e">組成備審小組</text>
  <text x="115" y="336" text-anchor="middle" font-size="15" fill="#57534e">逐條自評 124 條</text>
  <text x="115" y="356" text-anchor="middle" font-size="15" fill="#57534e">確認必要條文</text>
  <rect x="41" y="382" width="148" height="36" rx="18" fill="#fef3c7"/>
  <text x="115" y="406" text-anchor="middle" font-size="16" fill="#d97706" font-weight="600">評鑑前 6 個月</text>

  <!-- Step 2：補強階段 (#78716c 暖灰) -->
  <rect x="218" y="108" width="174" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="218" y="108" width="174" height="8" rx="4" fill="#78716c"/>
  <rect x="218" y="112" width="174" height="4" fill="#78716c"/>
  <circle cx="305" cy="201" r="44" fill="#f5f5f4"/>
  <text x="305" y="190" text-anchor="middle" font-size="16" fill="#78716c" font-weight="700">STEP</text>
  <text x="305" y="220" text-anchor="middle" font-size="26" fill="#78716c" font-weight="700">02</text>
  <text x="305" y="290" text-anchor="middle" font-size="20" fill="#1e293b" font-weight="700">補強階段</text>
  <text x="305" y="316" text-anchor="middle" font-size="15" fill="#57534e">優先補強感控</text>
  <text x="305" y="336" text-anchor="middle" font-size="15" fill="#57534e">手部衛生稽核</text>
  <text x="305" y="356" text-anchor="middle" font-size="15" fill="#57534e">消防演練完成</text>
  <rect x="231" y="382" width="148" height="36" rx="18" fill="#f5f5f4"/>
  <text x="305" y="406" text-anchor="middle" font-size="16" fill="#78716c" font-weight="600">評鑑前 4-5 個月</text>

  <!-- Step 3：深化模擬 (#57534e 深棕) -->
  <rect x="408" y="108" width="174" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="408" y="108" width="174" height="8" rx="4" fill="#57534e"/>
  <rect x="408" y="112" width="174" height="4" fill="#57534e"/>
  <circle cx="495" cy="201" r="44" fill="#f5f0eb"/>
  <text x="495" y="190" text-anchor="middle" font-size="16" fill="#57534e" font-weight="700">STEP</text>
  <text x="495" y="220" text-anchor="middle" font-size="26" fill="#57534e" font-weight="700">03</text>
  <text x="495" y="290" text-anchor="middle" font-size="20" fill="#1e293b" font-weight="700">深化模擬</text>
  <text x="495" y="316" text-anchor="middle" font-size="15" fill="#57534e">內部模擬查核</text>
  <text x="495" y="336" text-anchor="middle" font-size="15" fill="#57534e">補強常見失分點</text>
  <text x="495" y="356" text-anchor="middle" font-size="15" fill="#57534e">RCA 案例整理</text>
  <rect x="421" y="382" width="148" height="36" rx="18" fill="#f5f0eb"/>
  <text x="495" y="406" text-anchor="middle" font-size="16" fill="#57534e" font-weight="600">評鑑前 2-3 個月</text>

  <!-- Step 4：精修確認 (#a8a29e 淺灰) -->
  <rect x="598" y="108" width="174" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="598" y="108" width="174" height="8" rx="4" fill="#a8a29e"/>
  <rect x="598" y="112" width="174" height="4" fill="#a8a29e"/>
  <circle cx="685" cy="201" r="44" fill="#f5f5f4"/>
  <text x="685" y="190" text-anchor="middle" font-size="16" fill="#78716c" font-weight="700">STEP</text>
  <text x="685" y="220" text-anchor="middle" font-size="26" fill="#78716c" font-weight="700">04</text>
  <text x="685" y="290" text-anchor="middle" font-size="20" fill="#1e293b" font-weight="700">精修確認</text>
  <text x="685" y="316" text-anchor="middle" font-size="15" fill="#57534e">備審索引目錄</text>
  <text x="685" y="336" text-anchor="middle" font-size="15" fill="#57534e">全員政策宣導</text>
  <text x="685" y="356" text-anchor="middle" font-size="15" fill="#57534e">必要條文最終確認</text>
  <rect x="611" y="382" width="148" height="36" rx="18" fill="#f5f5f4"/>
  <text x="685" y="406" text-anchor="middle" font-size="16" fill="#78716c" font-weight="600">評鑑前 1 個月</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
