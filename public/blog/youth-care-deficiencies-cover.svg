<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="'Noto Sans TC', sans-serif">
  <rect width="1200" height="630" fill="#f0efe8"/>
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>

  <!-- Left panel content -->
  <text x="60" y="90"  font-size="20" fill="#d97706" font-weight="700">112年度兒少安置機構評鑑</text>
  <text x="60" y="160"  font-size="52" fill="#1e293b" font-weight="900">最常被扣分的</text>
  <text x="60" y="230"  font-size="52" fill="#1e293b" font-weight="900">8 個項目</text>
  <text x="60" y="300"  font-size="30" fill="#d97706" font-weight="700">你中了幾個？</text>

  <text x="60" y="370"  font-size="18" fill="#57534e">從輔導目標到財務管理，</text>
  <text x="60" y="400"  font-size="18" fill="#57534e">逐項分析失分原因與補救策略</text>

  <!-- Tag badges -->
  <rect x="60" y="440" width="130" height="38" rx="19" fill="#d97706"/>
  <text x="125" y="464"  font-size="15" fill="white" text-anchor="middle">評鑑準備</text>

  <rect x="205" y="440" width="130" height="38" rx="19" fill="#78716c"/>
  <text x="270" y="464"  font-size="15" fill="white" text-anchor="middle">常見缺失</text>

  <rect x="350" y="440" width="130" height="38" rx="19" fill="#94a3b8"/>
  <text x="415" y="464"  font-size="15" fill="white" text-anchor="middle">自我改善</text>

  <!-- Right panel illustration -->
  <text x="1010" y="120"  font-size="90" fill="#d97706" font-weight="900" text-anchor="middle">8</text>
  <text x="1010" y="175"  font-size="22" fill="#57534e" text-anchor="middle">個高風險項目</text>

  <!-- Decorative circles -->
  <circle cx="1010" cy="280" r="60" fill="none" stroke="#d97706" stroke-width="3"/>
  <circle cx="1010" cy="280" r="45" fill="none" stroke="#d97706" stroke-width="1.5"/>
  <text x="1010" y="271"  font-size="16" fill="#1e293b" text-anchor="middle">項目 16</text>
  <text x="1010" y="293"  font-size="14" fill="#d97706" text-anchor="middle">15分 高配分</text>

  <circle cx="920" cy="420" r="40" fill="none" stroke="#78716c" stroke-width="2"/>
  <text x="920" y="415"  font-size="13" fill="#57534e" text-anchor="middle">項目 22</text>
  <text x="920" y="432"  font-size="13" fill="#57534e" text-anchor="middle">15分</text>

  <circle cx="1095" cy="420" r="40" fill="none" stroke="#78716c" stroke-width="2"/>
  <text x="1095" y="415"  font-size="13" fill="#57534e" text-anchor="middle">項目 29</text>
  <text x="1095" y="432"  font-size="13" fill="#57534e" text-anchor="middle">20分</text>

  <!-- Watermark -->
  <text x="1140" y="600"  font-size="24" fill="#c4bfb8" text-anchor="end">報告汪 reportwang.com</text>
</svg>
