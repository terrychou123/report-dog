<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題 -->
  <text x="400" y="48" font-size="32" fill="#1e293b" text-anchor="middle"  font-weight="700">藥品儲存管理要求</text>
  <text x="400" y="78" font-size="22" fill="#78716c" text-anchor="middle" >評鑑委員實地察看的藥品管理重點</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#dedad3" stroke-width="2"/>

  <!-- 行1 -->
  <rect x="40" y="114" width="720" height="80" rx="10" fill="white"/>
  <rect x="40" y="114" width="8" height="80" rx="4" fill="#d97706"/>
  <text x="72" y="148" font-size="20" fill="#d97706"  font-weight="700">分區儲存</text>
  <text x="72" y="176" font-size="16" fill="#57534e" >一般藥品與管制藥品分開，均在有效期限內</text>

  <!-- 行2 -->
  <rect x="40" y="206" width="720" height="80" rx="10" fill="white"/>
  <rect x="40" y="206" width="8" height="80" rx="4" fill="#78716c"/>
  <text x="72" y="240" font-size="20" fill="#78716c"  font-weight="700">標示清楚</text>
  <text x="72" y="268" font-size="16" fill="#57534e" >每位住民藥品標示姓名、服用時間及劑量</text>

  <!-- 行3 -->
  <rect x="40" y="298" width="720" height="80" rx="10" fill="white"/>
  <rect x="40" y="298" width="8" height="80" rx="4" fill="#57534e"/>
  <text x="72" y="332" font-size="20" fill="#57534e"  font-weight="700">管制藥品上鎖</text>
  <text x="72" y="360" font-size="16" fill="#57534e" >依管制藥品管理條例設置，非專業人員不易取得</text>

  <!-- 行4 -->
  <rect x="40" y="390" width="720" height="80" rx="10" fill="white"/>
  <rect x="40" y="390" width="8" height="80" rx="4" fill="#a8a29e"/>
  <text x="72" y="424" font-size="20" fill="#a8a29e"  font-weight="700">銷燬記錄</text>
  <text x="72" y="452" font-size="16" fill="#57534e" >不再使用之管制藥品送交藥局回收，有銷燬紀錄</text>

  <!-- 品牌浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" >報告汪 reportwang.com</text>
</svg>
