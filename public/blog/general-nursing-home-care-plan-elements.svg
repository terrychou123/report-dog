<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <text x="40" y="48" font-size="32" fill="#1e293b" font-weight="700">照護計畫四大核心要素</text>
  <text x="40" y="76" font-size="22" fill="#57534e">問題 - 目標 - 措施 - 評值，環環相扣不能斷</text>
  <line x1="40" y1="92" x2="760" y2="92" stroke="#16a34a" stroke-width="2"/>

  <!-- 照護問題 -->
  <rect x="40" y="112" width="168" height="300" rx="10" fill="white" stroke="#16a34a" stroke-width="2"/>
  <rect x="40" y="112" width="168" height="44" rx="10" fill="#16a34a"/>
  <rect x="40" y="132" width="168" height="24" fill="#16a34a"/>
  <text x="124" y="127" font-size="17" fill="#fff" font-weight="700" text-anchor="middle">照護問題</text>
  <text x="124" y="152" font-size="14" fill="#f0fdf4" text-anchor="middle">依評估結果識別</text>
  <text x="56" y="182" font-size="14" fill="#57534e" font-weight="600">好的問題描述：</text>
  <text x="56" y="202" font-size="14" fill="#57534e">• 含評估量表分數</text>
  <text x="56" y="222" font-size="14" fill="#57534e"> Morse 70/Braden 16</text>
  <text x="56" y="242" font-size="14" fill="#57534e">• 含原因說明</text>
  <text x="56" y="262" font-size="14" fill="#57534e"> 「因下肢肌力退化</text>
  <text x="56" y="308" font-size="14" fill="#dc2626">[x] 不好示範：</text>
  <text x="56" y="328" font-size="14" fill="#dc2626">「有跌倒風險」（太籠統）</text>

  <!-- 照護目標 -->
  <rect x="222" y="112" width="168" height="300" rx="10" fill="white" stroke="#d97706" stroke-width="2"/>
  <rect x="222" y="112" width="168" height="44" rx="10" fill="#d97706"/>
  <rect x="222" y="132" width="168" height="24" fill="#d97706"/>
  <text x="306" y="127" font-size="17" fill="#fff" font-weight="700" text-anchor="middle">照護目標</text>
  <text x="306" y="152" font-size="14" fill="#fef9c3" text-anchor="middle">具體可測量</text>
  <text x="238" y="182" font-size="14" fill="#57534e" font-weight="600">好的目標描述：</text>
  <text x="238" y="202" font-size="14" fill="#57534e">• 有時間框架</text>
  <text x="238" y="222" font-size="14" fill="#57534e"> 「3個月內」</text>
  <text x="238" y="242" font-size="14" fill="#57534e">• 有具體數值</text>
  <text x="238" y="262" font-size="14" fill="#57534e">「跌倒次數&lt;=1次」</text>
  <text x="238" y="312" font-size="14" fill="#dc2626">[x] 不好示範：</text>
  <text x="238" y="332" font-size="14" fill="#dc2626">「維持安全」（無法評值）</text>

  <!-- 照護措施 -->
  <rect x="404" y="112" width="168" height="300" rx="10" fill="white" stroke="#2563eb" stroke-width="2"/>
  <rect x="404" y="112" width="168" height="44" rx="10" fill="#2563eb"/>
  <rect x="404" y="132" width="168" height="24" fill="#2563eb"/>
  <text x="488" y="127" font-size="17" fill="#fff" font-weight="700" text-anchor="middle">照護措施</text>
  <text x="488" y="152" font-size="14" fill="#eff6ff" text-anchor="middle">誰·做什麼·多久</text>
  <text x="420" y="182" font-size="14" fill="#57534e" font-weight="600">好的措施描述：</text>
  <text x="420" y="202" font-size="14" fill="#57534e">• 明確執行者</text>
  <text x="420" y="222" font-size="14" fill="#57534e"> 「護理師/照服員」</text>
  <text x="420" y="242" font-size="14" fill="#57534e">• 具體行動</text>
  <text x="420" y="262" font-size="14" fill="#57534e"> 「每班確認床欄」</text>
  <text x="420" y="282" font-size="14" fill="#57534e">• 執行頻率</text>
  <text x="420" y="330" font-size="14" fill="#dc2626">[x] 不好示範：「注意安全」</text>

  <!-- 評值記錄 -->
  <rect x="586" y="112" width="174" height="300" rx="10" fill="white" stroke="#dc2626" stroke-width="2"/>
  <rect x="586" y="112" width="174" height="44" rx="10" fill="#dc2626"/>
  <rect x="586" y="132" width="174" height="24" fill="#dc2626"/>
  <text x="673" y="127" font-size="17" fill="#fff" font-weight="700" text-anchor="middle">評值記錄</text>
  <text x="673" y="152" font-size="14" fill="#fee2e2" text-anchor="middle">最常被空白</text>
  <text x="600" y="182" font-size="14" fill="#57534e" font-weight="600">好的評值描述：</text>
  <text x="600" y="202" font-size="14" fill="#57534e">• 目標達成與否</text>
  <text x="600" y="222" font-size="14" fill="#57534e"> 「達成/未達成」</text>
  <text x="600" y="242" font-size="14" fill="#57534e">• 具體成效數據</text>
  <text x="600" y="262" font-size="14" fill="#57534e"> 「本季跌倒0次」</text>
  <text x="600" y="308" font-size="14" fill="#dc2626">[x] 最常見問題：</text>
  <text x="600" y="328" font-size="14" fill="#dc2626">「持續照護中」（空洞）</text>

  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
