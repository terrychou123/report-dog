<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="'Noto Sans TC', sans-serif">
  <!-- @template: cover -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- Left content area -->
  <rect x="0" y="0" width="820" height="630" fill="#f0efe8"/>
  <!-- Right panel -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>
  <!-- Accent bar -->
  <rect x="60" y="80" width="8" height="80" fill="#d97706"/>
  <!-- Main title -->
  <text x="88" y="130"  font-size="48" font-weight="700" fill="#1e293b">離院追蹤輔導</text>
  <text x="88" y="185"  font-size="36" font-weight="500" fill="#57534e">怎麼記錄才過評鑑？</text>
  <!-- Subtitle -->
  <text x="88" y="255"  font-size="24" fill="#78716c">評鑑項目 23、24 的準備重點與範例</text>
  <!-- Chips -->
  <rect x="88" y="295" width="220" height="44" rx="22" fill="#d97706"/>
  <text x="198" y="323"  font-size="18" font-weight="600" fill="white" text-anchor="middle">項目 23（4 分）</text>
  <rect x="324" y="295" width="220" height="44" rx="22" fill="#78716c"/>
  <text x="434" y="323"  font-size="18" font-weight="600" fill="white" text-anchor="middle">項目 24（9 分）</text>
  <rect x="560" y="295" width="160" height="44" rx="22" fill="#94a3b8"/>
  <text x="640" y="323"  font-size="18" font-weight="600" fill="white" text-anchor="middle">112年度</text>
  <!-- Info lines -->
  <text x="88" y="410"  font-size="20" fill="#57534e">離院準備 ／ 獨立生活技巧訓練</text>
  <text x="88" y="450"  font-size="20" fill="#57534e">追蹤輔導記錄 ／ 生涯輔導</text>
  <!-- Right panel -->
  <text x="1010" y="230"  font-size="130" font-weight="900" fill="#d97706" text-anchor="middle">23</text>
  <text x="1010" y="310"  font-size="50" font-weight="900" fill="#78716c" text-anchor="middle">24</text>
  <text x="1010" y="370"  font-size="22" fill="#a8a29e" text-anchor="middle">評鑑項目</text>
  <text x="1010" y="420"  font-size="20" fill="#a8a29e" text-anchor="middle">離院追蹤輔導</text>
  <!-- Watermark -->
  <text x="1140" y="600" font-size="24"  fill="#c4bfb8" text-anchor="end">報告汪 reportwang.com</text>
</svg>
