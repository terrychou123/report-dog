<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- Header 區塊 -->
  <rect x="0" y="50" width="800" height="76" fill="white"/>
  <!-- Header 左側色條 -->
  <rect x="0" y="50" width="6" height="76" fill="#d97706" rx="2"/>
  <!-- Header 文字（8字，font-size=44） -->
  <text x="28" y="107" font-size="44" fill="#1e293b" font-weight="700" >紀錄撰寫 4 大技巧</text>

  <!-- Row 1 (y=160, color=#d97706) -->
  <rect x="28" y="160" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="160" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="66" cy="191" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="197" font-size="16" font-weight="900" text-anchor="middle" fill="#d97706" >1</text>
  <text x="100" y="188" font-size="22" fill="#1e293b" font-weight="700" >用事實取代感受</text>
  <text x="100" y="208" font-size="16" fill="#57534e" >寫「個案主訴腰痛」而非「感覺很不舒服」</text>
  <rect x="620" y="168" width="136" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="187" font-size="16" text-anchor="middle" fill="#d97706" font-weight="700" >客觀紀錄</text>
  <text x="688" y="207" font-size="16" text-anchor="middle" fill="#d97706" >評委要求</text>

  <!-- Row 2 (y=235, color=#78716c) -->
  <rect x="28" y="235" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="235" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="66" cy="266" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="272" font-size="16" font-weight="900" text-anchor="middle" fill="#78716c" >2</text>
  <text x="100" y="263" font-size="22" fill="#1e293b" font-weight="700" >當下立即填寫</text>
  <text x="100" y="283" font-size="16" fill="#57534e" >服務完成後立即記錄，勿事後回憶補寫</text>
  <rect x="620" y="243" width="136" height="46" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="262" font-size="16" text-anchor="middle" fill="#78716c" font-weight="700" >即時原則</text>
  <text x="688" y="282" font-size="16" text-anchor="middle" fill="#78716c" >品質保證</text>

  <!-- Row 3 (y=310, color=#57534e) -->
  <rect x="28" y="310" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="310" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="341" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="347" font-size="16" font-weight="900" text-anchor="middle" fill="#57534e" >3</text>
  <text x="100" y="338" font-size="22" fill="#1e293b" font-weight="700" >異常立即通報</text>
  <text x="100" y="358" font-size="16" fill="#57534e" >發現異常即時記錄並通報督導主管</text>
  <rect x="620" y="318" width="136" height="46" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="337" font-size="16" text-anchor="middle" fill="#57534e" font-weight="700" >通報機制</text>
  <text x="688" y="357" font-size="16" text-anchor="middle" fill="#57534e" >法規要求</text>

  <!-- Row 4 (y=385, color=#a8a29e) -->
  <rect x="28" y="385" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="385" width="6" height="62" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="416" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="422" font-size="16" font-weight="900" text-anchor="middle" fill="#a8a29e" >4</text>
  <text x="100" y="413" font-size="22" fill="#1e293b" font-weight="700" >統一格式維護</text>
  <text x="100" y="433" font-size="16" fill="#57534e" >使用機構標準格式，欄位完整不留空</text>
  <rect x="620" y="393" width="136" height="46" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="412" font-size="16" text-anchor="middle" fill="#a8a29e" font-weight="700" >格式規範</text>
  <text x="688" y="432" font-size="16" text-anchor="middle" fill="#a8a29e" >一致呈現</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" >報告汪 reportwang.com</text>
</svg>
