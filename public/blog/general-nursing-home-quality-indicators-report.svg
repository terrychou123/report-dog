<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">每季品質分析報告格式</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">評鑑委員必查——數字、分析、改善三部分缺一不可</text>
  <line x1="28" y1="94" x2="772" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- 報告格式表格 -->
  <!-- 表頭 -->
  <rect x="28" y="106" width="744" height="42" rx="0" fill="#e8e4dc"/>
  <rect x="28" y="106" width="744" height="42" rx="8" fill="#e8e4dc"/>
  <text x="130" y="133" font-size="18" fill="#1e293b" text-anchor="middle" font-weight="700">欄位名稱</text>
  <line x1="228" y1="106" x2="228" y2="450" stroke="#dedad3" stroke-width="1"/>
  <text x="450" y="133" font-size="18" fill="#1e293b" text-anchor="middle" font-weight="700">應填寫內容</text>
  <line x1="620" y1="106" x2="620" y2="450" stroke="#dedad3" stroke-width="1"/>
  <text x="710" y="133" font-size="18" fill="#1e293b" text-anchor="middle" font-weight="700">評鑑重點</text>

  <!-- 列 1：統計週期 -->
  <rect x="28" y="148" width="744" height="54" fill="white"/>
  <line x1="28" y1="202" x2="772" y2="202" stroke="#dedad3" stroke-width="1"/>
  <text x="128" y="180" font-size="16" fill="#57534e" text-anchor="middle">統計週期</text>
  <text x="350" y="170" font-size="16" fill="#57534e" text-anchor="middle">季度起訖日期（如 115/1/1–3/31）</text>
  <text x="350" y="192" font-size="16" fill="#57534e" text-anchor="middle">平均在住住民數、人日數</text>
  <rect x="626" y="156" width="138" height="38" rx="6" fill="#d97706" opacity="0.12"/>
  <text x="695" y="180" font-size="16" fill="#d97706" text-anchor="middle" font-weight="700">確認每季皆有</text>

  <!-- 列 2：指標數值 -->
  <rect x="28" y="202" width="744" height="54" fill="#fafaf8"/>
  <line x1="28" y1="256" x2="772" y2="256" stroke="#dedad3" stroke-width="1"/>
  <text x="128" y="234" font-size="16" fill="#57534e" text-anchor="middle">指標數值表</text>
  <text x="350" y="222" font-size="16" fill="#57534e" text-anchor="middle">本季指標值 / 上季值 / 年度目標值</text>
  <text x="350" y="244" font-size="16" fill="#57534e" text-anchor="middle">5 大指標逐一列出，含計算過程</text>
  <rect x="626" y="210" width="138" height="38" rx="6" fill="#d97706" opacity="0.12"/>
  <text x="695" y="234" font-size="16" fill="#d97706" text-anchor="middle" font-weight="700">附計算公式</text>

  <!-- 列 3：趨勢圖 -->
  <rect x="28" y="256" width="744" height="54" fill="white"/>
  <line x1="28" y1="310" x2="772" y2="310" stroke="#dedad3" stroke-width="1"/>
  <text x="128" y="288" font-size="16" fill="#57534e" text-anchor="middle">趨勢比較圖</text>
  <text x="350" y="276" font-size="16" fill="#57534e" text-anchor="middle">近 4 季折線圖或長條圖</text>
  <text x="350" y="298" font-size="16" fill="#57534e" text-anchor="middle">視覺化呈現改善趨勢方向</text>
  <rect x="626" y="264" width="138" height="38" rx="6" fill="#78716c" opacity="0.12"/>
  <text x="695" y="288" font-size="16" fill="#78716c" text-anchor="middle" font-weight="700">加分呈現</text>

  <!-- 列 4：原因分析 -->
  <rect x="28" y="310" width="744" height="54" fill="#fafaf8"/>
  <line x1="28" y1="364" x2="772" y2="364" stroke="#dedad3" stroke-width="1"/>
  <text x="128" y="342" font-size="16" fill="#57534e" text-anchor="middle">原因分析</text>
  <text x="350" y="330" font-size="16" fill="#57534e" text-anchor="middle">高於目標值的指標，逐一分析可能原因</text>
  <text x="350" y="352" font-size="16" fill="#57534e" text-anchor="middle">具體到事件類型、時間、發生情境</text>
  <rect x="626" y="318" width="138" height="38" rx="6" fill="#d97706" opacity="0.15"/>
  <text x="695" y="342" font-size="16" fill="#d97706" text-anchor="middle" font-weight="700">最重要！</text>

  <!-- 列 5：改善措施 + 追蹤 -->
  <rect x="28" y="364" width="744" height="54" fill="white"/>
  <line x1="28" y1="418" x2="772" y2="418" stroke="#dedad3" stroke-width="1"/>
  <text x="128" y="395" font-size="16" fill="#57534e" text-anchor="middle">改善措施</text>
  <text x="350" y="384" font-size="16" fill="#57534e" text-anchor="middle">具體行動 + 執行日期 + 負責人員</text>
  <text x="350" y="405" font-size="16" fill="#57534e" text-anchor="middle">下季追蹤預計日期</text>
  <rect x="626" y="372" width="138" height="38" rx="6" fill="#d97706" opacity="0.15"/>
  <text x="695" y="396" font-size="16" fill="#d97706" text-anchor="middle" font-weight="700">追蹤記錄</text>

  <!-- 底部邊框 -->
  <rect x="28" y="106" width="744" height="312" rx="8" fill="none" stroke="#dedad3" stroke-width="1.5"/>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
