<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <rect x="0" y="0" width="800" height="90" fill="#1e293b"/>
  <text x="400" y="44" font-size="22" font-weight="700" fill="#ffffff"  text-anchor="middle">B2 個案服務計畫 AI 輔助流程</text>
  <text x="400" y="72" font-size="15" fill="#94a3b8"  text-anchor="middle">二級加強項目・社工節省 60% 撰寫時間</text>

  <!-- N=4，Row y: 160/235/310/385，H=62，outer_gap=50 -->

  <!-- Row 1 -->
  <rect x="29" y="148" width="742" height="62" rx="6" fill="#ffffff"/>
  <rect x="29" y="148" width="6" height="62" rx="2" fill="#d97706"/>
  <circle cx="66" cy="179" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="184" font-size="15" font-weight="700" fill="#d97706"  text-anchor="middle">1</text>
  <text x="100" y="170" font-size="16" font-weight="700" fill="#1e293b" >社工輸入個案評估數據</text>
  <text x="100" y="193" font-size="16" fill="#57534e" >功能狀態、疾病診斷、家屬需求、入住日期等基本資料</text>
  <rect x="620" y="161" width="136" height="36" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="184" font-size="14" font-weight="700" fill="#d97706"  text-anchor="middle">入住 72 小時內</text>

  <!-- Row 2 -->
  <rect x="29" y="223" width="742" height="62" rx="6" fill="#ffffff"/>
  <rect x="29" y="223" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="66" cy="254" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="259" font-size="15" font-weight="700" fill="#78716c"  text-anchor="middle">2</text>
  <text x="100" y="245" font-size="16" font-weight="700" fill="#1e293b" >AI 生成符合 B2 指標格式的計畫初稿</text>
  <text x="100" y="268" font-size="16" fill="#57534e" >自動填入身體/心理/社會需求評估、照護目標、服務措施</text>
  <rect x="620" y="236" width="136" height="36" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="259" font-size="14" font-weight="700" fill="#78716c"  text-anchor="middle">分鐘內完成</text>

  <!-- Row 3 -->
  <rect x="29" y="298" width="742" height="62" rx="6" fill="#ffffff"/>
  <rect x="29" y="298" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="66" cy="329" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="334" font-size="15" font-weight="700" fill="#57534e"  text-anchor="middle">3</text>
  <text x="100" y="320" font-size="16" font-weight="700" fill="#1e293b" >社工審閱修正個別細節</text>
  <text x="100" y="343" font-size="16" fill="#57534e" >確認內容符合個案實際狀況，補充個別化照護細節</text>
  <rect x="620" y="311" width="136" height="36" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="334" font-size="14" font-weight="700" fill="#57534e"  text-anchor="middle">專業確認</text>

  <!-- Row 4 -->
  <rect x="29" y="373" width="742" height="62" rx="6" fill="#ffffff"/>
  <rect x="29" y="373" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="404" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="409" font-size="15" font-weight="700" fill="#a8a29e"  text-anchor="middle">4</text>
  <text x="100" y="395" font-size="16" font-weight="700" fill="#1e293b" >定期評估更新（每 3 個月）</text>
  <text x="100" y="418" font-size="16" fill="#57534e" >AI 提示到期日，社工更新評估數據後重新生成修訂版</text>
  <rect x="620" y="386" width="136" height="36" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="409" font-size="14" font-weight="700" fill="#a8a29e"  text-anchor="middle">版本自動留存</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" >報告汪 reportwang.com</text>
</svg>
