<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <rect x="0" y="0" width="800" height="110" fill="#f5f5f4"/>
  <text x="400" y="52" text-anchor="middle" font-size="26" font-weight="900" fill="#1e293b">教育訓練三軌架構</text>
  <text x="400" y="84" text-anchor="middle" font-size="15" fill="#78716c">職前訓練軌 · 在職訓練軌 · 繼續教育軌——各軌文書要求不同，需分別管理</text>

  <!-- 列1：職前訓練軌 y=166 -->
  <rect x="38" y="132" width="724" height="90" rx="12" fill="#ffffff" stroke="#e8e6de" stroke-width="1.5"/>
  <rect x="38" y="132" width="10" height="90" rx="5" fill="#d97706"/>
  <text x="68" y="168" font-size="17" font-weight="700" fill="#d97706">第一軌</text>
  <text x="68" y="192" font-size="16" font-weight="700" fill="#1e293b">職前訓練（1.3.5重點）</text>
  <text x="220" y="168" font-size="14" fill="#78716c">新進人員到職時完成，涵蓋院內政策、病安、感控等核心主題，</text>
  <text x="220" y="190" font-size="14" fill="#78716c">有效果評估紀錄</text>
  <!-- 右側標籤 -->
  <rect x="638" y="152" width="88" height="30" rx="15" fill="#fef3c7"/>
  <text x="682" y="172" text-anchor="middle" font-size="14" fill="#d97706" font-weight="700">到職完成</text>

  <!-- 列2：在職訓練軌 y=269 -->
  <rect x="38" y="235" width="724" height="90" rx="12" fill="#ffffff" stroke="#e8e6de" stroke-width="1.5"/>
  <rect x="38" y="235" width="10" height="90" rx="5" fill="#78716c"/>
  <text x="68" y="271" font-size="17" font-weight="700" fill="#78716c">第二軌</text>
  <text x="68" y="295" font-size="16" font-weight="700" fill="#1e293b">在職教育（1.3.6重點）</text>
  <text x="220" y="271" font-size="14" fill="#78716c">全體員工年度訓練計畫，各職類達到規定時數，</text>
  <text x="220" y="293" font-size="14" fill="#78716c">年度成效評估與計畫修訂</text>
  <!-- 右側標籤 -->
  <rect x="638" y="255" width="88" height="30" rx="15" fill="#f5f5f4"/>
  <text x="682" y="275" text-anchor="middle" font-size="14" fill="#78716c" font-weight="700">年度計畫</text>

  <!-- 列3：繼續教育軌 y=372 -->
  <rect x="38" y="338" width="724" height="90" rx="12" fill="#ffffff" stroke="#e8e6de" stroke-width="1.5"/>
  <rect x="38" y="338" width="10" height="90" rx="5" fill="#57534e"/>
  <text x="68" y="374" font-size="17" font-weight="700" fill="#57534e">第三軌</text>
  <text x="68" y="398" font-size="16" font-weight="700" fill="#1e293b">繼續教育（1.3.7-1.3.8一般）</text>
  <text x="260" y="374" font-size="14" fill="#78716c">醫師CME學分、護理師繼續教育學分，</text>
  <text x="260" y="396" font-size="14" fill="#78716c">醫院追蹤並有紀錄</text>
  <!-- 右側標籤 -->
  <rect x="638" y="358" width="88" height="30" rx="15" fill="#f5f5f4"/>
  <text x="682" y="378" text-anchor="middle" font-size="14" fill="#57534e" font-weight="700">學分追蹤</text>

  <!-- 浮水印 -->
  <text x="400" y="480" text-anchor="middle" font-size="14" fill="#a8a29e" opacity="0.6">報告汪 reportwang.com</text>
</svg>
