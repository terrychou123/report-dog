<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="450" fill="#f0efe8"/>
  <text x="400" y="46" font-size="21" font-weight="700" fill="#1e293b" text-anchor="middle">自評表 壹、個案權益保障：核心自評重點</text>
  <rect x="60" y="58" width="48" height="3" rx="1.5" fill="#d97706"/>
  <line x1="116" y1="59.5" x2="740" y2="59.5" stroke="#dedad3" stroke-width="1"/>

  <!-- Left panel: intro -->
  <rect x="52" y="80" width="210" height="300" rx="12" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="52" y="80" width="210" height="5" rx="2.5" fill="#d97706"/>
  <text x="157" y="115" font-size="14" fill="#78716c" text-anchor="middle" font-weight="700">壹大項重點</text>
  <text x="157" y="155" font-size="46" font-weight="900" fill="#d97706" text-anchor="middle">4</text>
  <text x="157" y="176" font-size="13" fill="#64748b" text-anchor="middle">條評鑑基準</text>
  <line x1="68" y1="196" x2="246" y2="196" stroke="#f0ede6" stroke-width="1"/>
  <text x="157" y="220" font-size="12" fill="#64748b" text-anchor="middle">自評時建議逐條</text>
  <text x="157" y="238" font-size="12" fill="#64748b" text-anchor="middle">對照文件清單</text>
  <text x="157" y="268" font-size="13" fill="#d97706" text-anchor="middle" font-weight="600">常見扣分原因：</text>
  <text x="157" y="288" font-size="12" fill="#a8a29e" text-anchor="middle">同意書日期有誤</text>
  <text x="157" y="306" font-size="12" fill="#a8a29e" text-anchor="middle">個資未加密保管</text>
  <text x="157" y="324" font-size="12" fill="#a8a29e" text-anchor="middle">申訴紀錄不完整</text>

  <!-- Right panel: checklist items -->
  <rect x="280" y="80" width="468" height="300" rx="12" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="291" y="107" font-size="14" fill="#78716c" font-weight="700">自評核心項目</text>
  <line x1="291" y1="118" x2="734" y2="118" stroke="#f0ede6" stroke-width="1"/>

  <!-- Checklist rows -->
  <rect x="296" y="130" width="438" height="34" rx="6" fill="#d97706" opacity="0.06"/>
  <circle cx="316" cy="147" r="8" fill="none" stroke="#d97706" stroke-width="1.5"/>
  <text x="316" y="152" font-size="9" fill="#d97706" text-anchor="middle">✓</text>
  <text x="336" y="143" font-size="13" fill="#1e293b" font-weight="600">服務說明同意書：</text>
  <text x="336" y="158" font-size="12" fill="#64748b">家屬親簽、日期完整、條款清晰</text>

  <rect x="296" y="172" width="438" height="34" rx="6" fill="#f8f7f2"/>
  <circle cx="316" cy="189" r="8" fill="none" stroke="#78716c" stroke-width="1.5"/>
  <text x="336" y="185" font-size="13" fill="#1e293b" font-weight="600">個案隱私規範文件：</text>
  <text x="336" y="200" font-size="12" fill="#64748b">個資保護規則書面化、上鎖保管</text>

  <rect x="296" y="214" width="438" height="34" rx="6" fill="#d97706" opacity="0.06"/>
  <circle cx="316" cy="231" r="8" fill="none" stroke="#d97706" stroke-width="1.5"/>
  <text x="336" y="227" font-size="13" fill="#1e293b" font-weight="600">服務尊嚴說明：</text>
  <text x="336" y="242" font-size="12" fill="#64748b">活動自主選擇、服務拒絕權說明</text>

  <rect x="296" y="256" width="438" height="34" rx="6" fill="#f8f7f2"/>
  <circle cx="316" cy="273" r="8" fill="none" stroke="#78716c" stroke-width="1.5"/>
  <text x="336" y="269" font-size="13" fill="#1e293b" font-weight="600">申訴管道公告：</text>
  <text x="336" y="284" font-size="12" fill="#64748b">申訴表單、流程圖文張貼、案件記錄</text>

  <rect x="296" y="298" width="438" height="34" rx="6" fill="#d97706" opacity="0.06"/>
  <circle cx="316" cy="315" r="8" fill="none" stroke="#d97706" stroke-width="1.5"/>
  <text x="336" y="311" font-size="13" fill="#1e293b" font-weight="600">年度滿意度調查：</text>
  <text x="336" y="326" font-size="12" fill="#64748b">施測記錄、結果分析、改善行動</text>

  <!-- Bottom tip -->
  <rect x="52" y="394" width="696" height="36" rx="8" fill="#78716c" opacity="0.08"/>
  <text x="400" y="416" font-size="13" fill="#44403c" text-anchor="middle">💡 自評時對照「115年度評鑑基準說明書」第1-4條，確認每條文件完整性</text>

  <text x="760" y="421" font-size="16" fill="#c4bfb8" text-anchor="end" font-weight="400" font-family="'Noto Sans TC', sans-serif">報告汪 reportwang.com</text>
</svg>
