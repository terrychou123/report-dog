<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <text x="40" y="48" font-size="32" font-weight="bold" fill="#1e293b" >約束使用標準流程</text>
  <text x="40" y="78" font-size="22" fill="#57534e" >從評估需求到解除後追蹤的完整SOP</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#dedad3" stroke-width="2"/>

  <!-- 步驟1 -->
  <rect x="30" y="130" width="160" height="290" rx="12" fill="#d97706" opacity="0.12"/>
  <rect x="30" y="130" width="160" height="6" rx="3" fill="#d97706"/>
  <circle cx="110" cy="190" r="28" fill="#d97706" opacity="0.15"/>
  <text x="110" y="198" font-size="22" font-weight="bold" fill="white" text-anchor="middle" >1</text>
  <text x="110" y="242" font-size="17" font-weight="bold" fill="#d97706" text-anchor="middle" >評估需求</text>
  <text x="110" y="272" font-size="14" fill="#57534e" text-anchor="middle" >確認約束</text>
  <text x="110" y="294" font-size="14" fill="#57534e" text-anchor="middle" >必要性</text>
  <text x="110" y="316" font-size="14" fill="#57534e" text-anchor="middle" >評估替代方案</text>

  <!-- 箭頭1 -->
  <polygon points="204,270 224,255 224,285" fill="#dedad3"/>
  <line x1="190" y1="270" x2="224" y2="270" stroke="#dedad3" stroke-width="3"/>

  <!-- 步驟2 -->
  <rect x="229" y="130" width="160" height="290" rx="12" fill="#78716c" opacity="0.12"/>
  <rect x="229" y="130" width="160" height="6" rx="3" fill="#78716c"/>
  <circle cx="309" cy="190" r="28" fill="#78716c" opacity="0.15"/>
  <text x="309" y="198" font-size="22" font-weight="bold" fill="white" text-anchor="middle" >2</text>
  <text x="309" y="242" font-size="17" font-weight="bold" fill="#78716c" text-anchor="middle" >知情同意</text>
  <text x="309" y="272" font-size="14" fill="#57534e" text-anchor="middle" >告知住民</text>
  <text x="309" y="294" font-size="14" fill="#57534e" text-anchor="middle" >及家屬</text>
  <text x="309" y="316" font-size="14" fill="#57534e" text-anchor="middle" >取得同意書</text>

  <!-- 箭頭2 -->
  <polygon points="403,270 423,255 423,285" fill="#dedad3"/>
  <line x1="389" y1="270" x2="423" y2="270" stroke="#dedad3" stroke-width="3"/>

  <!-- 步驟3 -->
  <rect x="428" y="130" width="160" height="290" rx="12" fill="#57534e" opacity="0.12"/>
  <rect x="428" y="130" width="160" height="6" rx="3" fill="#57534e"/>
  <circle cx="508" cy="190" r="28" fill="#57534e" opacity="0.15"/>
  <text x="508" y="198" font-size="22" font-weight="bold" fill="white" text-anchor="middle" >3</text>
  <text x="508" y="242" font-size="17" font-weight="bold" fill="#57534e" text-anchor="middle" >執行記錄</text>
  <text x="508" y="272" font-size="14" fill="#57534e" text-anchor="middle" >使用時間</text>
  <text x="508" y="294" font-size="14" fill="#57534e" text-anchor="middle" >方式與</text>
  <text x="508" y="316" font-size="14" fill="#57534e" text-anchor="middle" >住民反應</text>

  <!-- 箭頭3 -->
  <polygon points="602,270 622,255 622,285" fill="#dedad3"/>
  <line x1="588" y1="270" x2="622" y2="270" stroke="#dedad3" stroke-width="3"/>

  <!-- 步驟4 -->
  <rect x="627" y="130" width="143" height="290" rx="12" fill="#a8a29e" opacity="0.12"/>
  <rect x="627" y="130" width="143" height="6" rx="3" fill="#a8a29e"/>
  <circle cx="698" cy="190" r="28" fill="#a8a29e" opacity="0.15"/>
  <text x="698" y="198" font-size="22" font-weight="bold" fill="white" text-anchor="middle" >4</text>
  <text x="698" y="242" font-size="17" font-weight="bold" fill="#a8a29e" text-anchor="middle" >解除追蹤</text>
  <text x="698" y="272" font-size="14" fill="#57534e" text-anchor="middle" >定期評估</text>
  <text x="698" y="294" font-size="14" fill="#57534e" text-anchor="middle" >是否解除</text>
  <text x="698" y="316" font-size="14" fill="#57534e" text-anchor="middle" >記錄後續照護</text>

  <!-- 品牌浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" >報告汪 reportwang.com</text>
</svg>
