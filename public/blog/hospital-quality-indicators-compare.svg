<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題 -->
  <text x="400" y="48" text-anchor="middle" font-size="30" fill="#1e293b" font-weight="700">目標值設定的三種方法比較</text>
  <text x="400" y="76" text-anchor="middle" font-size="20" fill="#57534e">引用外部基準對評鑑委員說服力最強</text>
  <line x1="129" y1="92" x2="671" y2="92" stroke="#dedad3" stroke-width="1"/>

  <!-- N=3 flow，card_w=170, margin=129 -->

  <!-- Step 01：全國基準值 (#d97706) x=129 cx=214 -->
  <rect x="129" y="108" width="170" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="129" y="108" width="170" height="8" rx="4" fill="#d97706"/>
  <rect x="129" y="112" width="170" height="4" fill="#d97706"/>
  <circle cx="214" cy="194" r="43" fill="#fef3c7"/>
  <text x="214" y="183" text-anchor="middle" font-size="16" fill="#d97706" font-weight="700">方法</text>
  <text x="214" y="211" text-anchor="middle" font-size="26" fill="#d97706" font-weight="700">01</text>
  <text x="214" y="297" text-anchor="middle" font-size="28" fill="#1e293b" font-weight="700">全國基準值</text>
  <text x="214" y="324" text-anchor="middle" font-size="18" fill="#57534e">台灣感控學會標竿值</text>
  <text x="214" y="346" text-anchor="middle" font-size="18" fill="#57534e">衛福部病安目標值</text>
  <rect x="142" y="381" width="144" height="36" rx="18" fill="#fef3c7"/>
  <text x="214" y="405" text-anchor="middle" font-size="16" fill="#d97706" font-weight="600">說服力最強</text>

  <!-- Step 02：歷史趨勢 (#78716c) x=315 cx=400 -->
  <rect x="315" y="108" width="170" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="315" y="108" width="170" height="8" rx="4" fill="#78716c"/>
  <rect x="315" y="112" width="170" height="4" fill="#78716c"/>
  <circle cx="400" cy="194" r="43" fill="#f5f5f4"/>
  <text x="400" y="183" text-anchor="middle" font-size="16" fill="#78716c" font-weight="700">方法</text>
  <text x="400" y="211" text-anchor="middle" font-size="26" fill="#78716c" font-weight="700">02</text>
  <text x="400" y="297" text-anchor="middle" font-size="28" fill="#1e293b" font-weight="700">歷史趨勢</text>
  <text x="400" y="324" text-anchor="middle" font-size="18" fill="#57534e">比去年同期改善</text>
  <text x="400" y="346" text-anchor="middle" font-size="18" fill="#57534e">需說明設定依據</text>
  <rect x="328" y="381" width="144" height="36" rx="18" fill="#f5f5f4"/>
  <text x="400" y="405" text-anchor="middle" font-size="16" fill="#78716c" font-weight="600">需搭配歷史數據</text>

  <!-- Step 03：衛福部病安目標 (#57534e) x=501 cx=586 -->
  <rect x="501" y="108" width="170" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="501" y="108" width="170" height="8" rx="4" fill="#57534e"/>
  <rect x="501" y="112" width="170" height="4" fill="#57534e"/>
  <circle cx="586" cy="194" r="43" fill="#f5f0eb"/>
  <text x="586" y="183" text-anchor="middle" font-size="16" fill="#57534e" font-weight="700">方法</text>
  <text x="586" y="211" text-anchor="middle" font-size="26" fill="#57534e" font-weight="700">03</text>
  <text x="586" y="297" text-anchor="middle" font-size="28" fill="#1e293b" font-weight="700">病安目標值</text>
  <text x="586" y="324" text-anchor="middle" font-size="18" fill="#57534e">衛福部年度目標值</text>
  <text x="586" y="346" text-anchor="middle" font-size="18" fill="#57534e">直接引用官方數字</text>
  <rect x="514" y="381" width="144" height="36" rx="18" fill="#f5f0eb"/>
  <text x="586" y="405" text-anchor="middle" font-size="16" fill="#57534e" font-weight="600">適用對應條目</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
