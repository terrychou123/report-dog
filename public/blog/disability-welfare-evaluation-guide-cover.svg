<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 右側裝飾區塊 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>

  <!-- 右側裝飾大數字 -->
  <text x="1010" y="235" font-size="180" font-weight="900" fill="#d97706" text-anchor="middle" opacity="0.85">49</text>
  <text x="1010" y="275" font-size="28" fill="#78716c" text-anchor="middle" font-weight="600">項評鑑指標</text>

  <!-- 右側 2×2 資訊卡片 (row1 y=299, row2 y=395) -->
  <rect x="840" y="299" width="155" height="86" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="918" y="335" font-size="26" fill="#d97706" text-anchor="middle" font-weight="700">3大面向</text>
  <text x="918" y="366" font-size="20" fill="#a8a29e" text-anchor="middle">行/環/專</text>

  <rect x="1005" y="299" width="155" height="86" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="1083" y="335" font-size="26" fill="#78716c" text-anchor="middle" font-weight="700">109年度</text>
  <text x="1083" y="366" font-size="20" fill="#a8a29e" text-anchor="middle">官方指標</text>

  <rect x="840" y="395" width="155" height="86" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="918" y="431" font-size="26" fill="#57534e" text-anchor="middle" font-weight="700">核心指標</text>
  <text x="918" y="462" font-size="20" fill="#a8a29e" text-anchor="middle">3105 消防</text>

  <rect x="1005" y="395" width="155" height="86" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="1083" y="431" font-size="26" fill="#d97706" text-anchor="middle" font-weight="700">ISP 計畫</text>
  <text x="1083" y="462" font-size="20" fill="#a8a29e" text-anchor="middle">12分重點</text>

  <!-- 右側底部標籤 -->
  <rect x="840" y="491" width="320" height="52" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="1000" y="524" font-size="26" fill="#d97706" text-anchor="middle" font-weight="700">衛福部社家署公告</text>

  <!-- 左側主內容區 -->
  <text x="60" y="205" font-size="120" font-weight="900" fill="#1e293b">評鑑準備</text>
  <text x="60" y="340" font-size="110" font-weight="900" fill="#d97706">完整攻略</text>

  <line x1="60" y1="368" x2="780" y2="368" stroke="#dedad3" stroke-width="2"/>

  <text x="60" y="415" font-size="36" fill="#57534e" font-weight="400">109年度身心障礙福利機構評鑑・49項指標</text>

  <!-- 特色標籤列 -->
  <rect x="60" y="448" width="148" height="50" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="134" y="479" font-size="26" fill="#d97706" text-anchor="middle" font-weight="600">行政管理</text>

  <rect x="220" y="448" width="148" height="50" rx="10" fill="#78716c" opacity="0.12"/>
  <text x="294" y="479" font-size="26" fill="#78716c" text-anchor="middle" font-weight="600">環境設施</text>

  <rect x="380" y="448" width="148" height="50" rx="10" fill="#57534e" opacity="0.12"/>
  <text x="454" y="479" font-size="26" fill="#57534e" text-anchor="middle" font-weight="600">專業服務</text>

  <rect x="540" y="448" width="148" height="50" rx="10" fill="#a8a29e" opacity="0.12"/>
  <text x="614" y="479" font-size="26" fill="#a8a29e" text-anchor="middle" font-weight="600">AI自我查核</text>

  <!-- 適用對象說明 -->
  <text x="60" y="552" font-size="28" fill="#94a3b8">適用：機構社工・教保員・護理師・機構主任</text>

  <!-- 浮水印 -->
  <text x="1140" y="592" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
