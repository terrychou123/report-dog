<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <rect x="0" y="38" width="800" height="90" fill="#e8e6de"/>
  <rect x="0" y="38" width="6" height="90" rx="2" fill="#d97706"/>
  <text x="28" y="98" font-size="36" fill="#1e293b" font-weight="700">子項六：膳食滿意度調查三大要點</text>
  <rect x="28" y="166" width="744" height="90" rx="12" fill="#e8e6de"/>
  <rect x="28" y="166" width="6" height="90" rx="2" fill="#d97706"/>
  <circle cx="66" cy="211" r="20" fill="#d97706" opacity="0.15"/>
  <text x="66" y="217" font-size="18" fill="#d97706" text-anchor="middle" font-weight="900">頻率</text>
  <text x="100" y="210" font-size="28" fill="#1e293b" font-weight="700">每年至少 2 次，時間分散</text>
  <text x="100" y="234" font-size="18" fill="#57534e">建議分散在上下半年（如3月和9月），避免評鑑前一個月才做</text>
  <rect x="620" y="185" width="136" height="52" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="205" font-size="16" fill="#d97706" text-anchor="middle">2 次</text>
  <text x="688" y="225" font-size="16" fill="#d97706" text-anchor="middle">分散</text>
  <rect x="28" y="269" width="744" height="90" rx="12" fill="#e8e6de"/>
  <rect x="28" y="269" width="6" height="90" rx="2" fill="#78716c"/>
  <circle cx="66" cy="314" r="20" fill="#78716c" opacity="0.15"/>
  <text x="66" y="320" font-size="18" fill="#78716c" text-anchor="middle" font-weight="900">對象</text>
  <text x="100" y="313" font-size="28" fill="#1e293b" font-weight="700">精神科住民的特殊表達限制</text>
  <text x="100" y="337" font-size="18" fill="#57534e">部分住民因精神症狀影響表達，可結合家屬、工作人員觀察作為補充</text>
  <rect x="620" y="288" width="136" height="52" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="308" font-size="16" fill="#78716c" text-anchor="middle">多元</text>
  <text x="688" y="328" font-size="16" fill="#78716c" text-anchor="middle">來源</text>
  <rect x="28" y="372" width="744" height="90" rx="12" fill="#e8e6de"/>
  <rect x="28" y="372" width="6" height="90" rx="2" fill="#57534e"/>
  <circle cx="66" cy="417" r="20" fill="#57534e" opacity="0.15"/>
  <text x="66" y="423" font-size="18" fill="#57534e" text-anchor="middle" font-weight="900">改善</text>
  <text x="100" y="416" font-size="28" fill="#1e293b" font-weight="700">調查後需有改善措施並落實</text>
  <text x="100" y="440" font-size="18" fill="#57534e">PDCA 精神：調查、分析、改善、再評估，有書面記錄</text>
  <rect x="620" y="391" width="136" height="52" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="411" font-size="16" fill="#57534e" text-anchor="middle">PDCA</text>
  <text x="688" y="431" font-size="16" fill="#57534e" text-anchor="middle">閉環</text>
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
