<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題 -->
  <text x="400" y="48" font-size="32" fill="#1e293b" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-weight="700">跨專業聯繫會議紀錄必備要素</text>
  <text x="400" y="78" font-size="22" fill="#78716c" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">B1.4要求每3個月召開，紀錄需含以下內容</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#dedad3" stroke-width="2"/>

  <!-- 行1 -->
  <rect x="40" y="114" width="720" height="80" rx="10" fill="white"/>
  <rect x="40" y="114" width="8" height="80" rx="4" fill="#d97706"/>
  <text x="72" y="148" font-size="20" fill="#d97706" font-family="'Noto Sans TC', sans-serif" font-weight="700">基本資訊</text>
  <text x="72" y="176" font-size="16" fill="#57534e" font-family="'Noto Sans TC', sans-serif">會議日期、出席人員、討論個案</text>

  <!-- 行2 -->
  <rect x="40" y="206" width="720" height="80" rx="10" fill="white"/>
  <rect x="40" y="206" width="8" height="80" rx="4" fill="#78716c"/>
  <text x="72" y="240" font-size="20" fill="#78716c" font-family="'Noto Sans TC', sans-serif" font-weight="700">各專業意見</text>
  <text x="72" y="268" font-size="16" fill="#57534e" font-family="'Noto Sans TC', sans-serif">護理、醫療、職能治療、心理、社工各自說明</text>

  <!-- 行3 -->
  <rect x="40" y="298" width="720" height="80" rx="10" fill="white"/>
  <rect x="40" y="298" width="8" height="80" rx="4" fill="#57534e"/>
  <text x="72" y="332" font-size="20" fill="#57534e" font-family="'Noto Sans TC', sans-serif" font-weight="700">照護目標調整</text>
  <text x="72" y="360" font-size="16" fill="#57534e" font-family="'Noto Sans TC', sans-serif">依會議結論修訂個案照護計畫</text>

  <!-- 行4 -->
  <rect x="40" y="390" width="720" height="80" rx="10" fill="white"/>
  <rect x="40" y="390" width="8" height="80" rx="4" fill="#a8a29e"/>
  <text x="72" y="424" font-size="20" fill="#a8a29e" font-family="'Noto Sans TC', sans-serif" font-weight="700">後續追蹤</text>
  <text x="72" y="452" font-size="16" fill="#57534e" font-family="'Noto Sans TC', sans-serif">責任人、完成時限、下次評估時間</text>

  <!-- 品牌浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-family="'Noto Sans TC', sans-serif">報告汪 reportwang.com</text>
</svg>
