<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 頂部金色條 -->
  <rect width="1200" height="8" fill="#b45309"/>
  <!-- 左側裝飾線 -->
  <rect x="60" y="40" width="6" height="550" fill="#d97706" rx="2"/>

  <!-- 大標題區 -->
  <text x="100" y="120" font-size="28" fill="#92400e" font-weight="bold">115年度 一般護理之家評鑑</text>
  <text x="100" y="200" font-size="72" fill="#b45309" font-weight="900">評鑑等第</text>
  <text x="100" y="280" font-size="72" fill="#d97706" font-weight="900">升等策略</text>
  <text x="100" y="340" font-size="38" fill="#78716c">從合格到優等的關鍵差距</text>
  <text x="100" y="390" font-size="26" fill="#a8a29e">精準備考・資源最佳化分配</text>

  <!-- 梯形升級圖 -->
  <!-- 不合格 -->
  <rect x="640" y="500" width="140" height="50" fill="#fca5a5" rx="6"/>
  <text x="710" y="531" font-size="17" fill="#991b1b" font-weight="bold" text-anchor="middle">不合格</text>

  <!-- 合格 -->
  <rect x="640" y="420" width="180" height="50" fill="#fed7aa" rx="6"/>
  <text x="730" y="451" font-size="17" fill="#92400e" font-weight="bold" text-anchor="middle">合格</text>
  <!-- 箭頭 -->
  <polygon points="730,415 720,422 740,422" fill="#d97706"/>

  <!-- 甲等 -->
  <rect x="640" y="335" width="220" height="50" fill="#fde68a" rx="6"/>
  <text x="750" y="366" font-size="17" fill="#78350f" font-weight="bold" text-anchor="middle">甲等</text>
  <!-- 箭頭 -->
  <polygon points="750,330 740,337 760,337" fill="#d97706"/>

  <!-- 優等 -->
  <rect x="640" y="245" width="260" height="55" fill="#fbbf24" rx="8" stroke="#b45309" stroke-width="2"/>
  <text x="770" y="280" font-size="20" fill="#78350f" font-weight="bold" text-anchor="middle">★ 優等</text>
  <!-- 箭頭 -->
  <polygon points="770,240 758,248 782,248" fill="#b45309"/>

  <!-- 右側裝飾標籤 -->
  <rect x="920" y="248" width="160" height="30" fill="#fef3c7" rx="6"/>
  <text x="1000" y="268" font-size="14" fill="#92400e" text-anchor="middle">D1 創新加分</text>
  <line x1="900" y1="263" x2="920" y2="263" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4"/>

  <rect x="920" y="340" width="160" height="30" fill="#fef3c7" rx="6"/>
  <text x="1000" y="360" font-size="14" fill="#92400e" text-anchor="middle">B 區照護品質</text>
  <line x1="860" y1="360" x2="920" y2="360" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4"/>

  <rect x="920" y="425" width="160" height="30" fill="#fef3c7" rx="6"/>
  <text x="1000" y="445" font-size="14" fill="#92400e" text-anchor="middle">A 區行政基礎</text>
  <line x1="820" y1="445" x2="920" y2="445" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4"/>

  <!-- 浮水印 -->
  <text x="1140" y="590" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
