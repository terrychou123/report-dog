<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">文書品質 PDCA 持續改善循環</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">日常維護文書，讓評鑑只是確認而非衝刺</text>
  <line x1="28" y1="94" x2="772" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- PDCA 弧形，圓心 cx=400, cy=285 -->
  <!-- Plan 弧（#d97706 琥珀） -->
  <path d="M 431 159 A 130 130 0 0 1 530 276 L 545 275 L 498 302 L 453 281 L 468 280 A 68 68 0 0 0 416 219 Z" fill="#d97706"/>
  <!-- Do 弧（#78716c 暖灰） -->
  <path d="M 526 316 A 130 130 0 0 1 409 415 L 410 430 L 383 383 L 404 338 L 405 353 A 68 68 0 0 0 466 301 Z" fill="#78716c"/>
  <!-- Check 弧（#57534e 深棕） -->
  <path d="M 369 411 A 130 130 0 0 1 270 294 L 255 295 L 303 268 L 347 289 L 332 290 A 68 68 0 0 0 384 351 Z" fill="#57534e"/>
  <!-- Act 弧（#a8a29e 淺灰） -->
  <path d="M 274 254 A 130 130 0 0 1 391 155 L 390 140 L 417 188 L 396 232 L 395 217 A 68 68 0 0 0 334 269 Z" fill="#a8a29e"/>

  <!-- 弧中字母 -->
  <text x="476" y="231" font-size="30" fill="white" text-anchor="middle" font-weight="700">P</text>
  <text x="464" y="371" font-size="30" fill="white" text-anchor="middle" font-weight="700">D</text>
  <text x="324" y="359" font-size="30" fill="white" text-anchor="middle" font-weight="700">C</text>
  <text x="336" y="219" font-size="30" fill="white" text-anchor="middle" font-weight="700">A</text>

  <!-- 中央文字 -->
  <text x="400" y="278" font-size="22" fill="#1e293b" text-anchor="middle" font-weight="700">PDCA</text>
  <text x="400" y="302" font-size="22" fill="#1e293b" text-anchor="middle" font-weight="700">Cycle</text>

  <!-- 右上說明 Plan -->
  <rect x="545" y="118" width="6" height="24" rx="2" fill="#d97706"/>
  <text x="559" y="136" font-size="20" fill="#1e293b" font-weight="700">P 規劃（每季）</text>
  <line x1="555" y1="143" x2="755" y2="143" stroke="#d97706" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="555" y="162" font-size="17" fill="#57534e">制定文件更新計畫</text>
  <text x="555" y="183" font-size="17" fill="#57534e">確認評鑑重點文件清單</text>

  <!-- 右下說明 Do -->
  <rect x="545" y="365" width="6" height="24" rx="2" fill="#57534e"/>
  <text x="559" y="383" font-size="20" fill="#1e293b" font-weight="700">D 執行（每月）</text>
  <line x1="555" y1="390" x2="755" y2="390" stroke="#78716c" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="555" y="409" font-size="17" fill="#57534e">工作人員持續填寫紀錄</text>
  <text x="555" y="430" font-size="17" fill="#57534e">月底確認各類文件完整</text>

  <!-- 左下說明 Check -->
  <rect x="36" y="365" width="6" height="24" rx="2" fill="#a8a29e"/>
  <text x="50" y="383" font-size="20" fill="#1e293b" font-weight="700">C 查核（每月）</text>
  <line x1="46" y1="390" x2="246" y2="390" stroke="#57534e" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="46" y="409" font-size="17" fill="#57534e">月底文件健康度評分</text>
  <text x="46" y="430" font-size="17" fill="#57534e">找出弱項並記錄</text>

  <!-- 左上說明 Act -->
  <rect x="36" y="118" width="6" height="24" rx="2" fill="#78716c"/>
  <text x="50" y="136" font-size="20" fill="#1e293b" font-weight="700">A 改善（每季）</text>
  <line x1="46" y1="143" x2="246" y2="143" stroke="#a8a29e" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="46" y="162" font-size="17" fill="#57534e">針對弱項改善格式或流程</text>
  <text x="46" y="183" font-size="17" fill="#57534e">更新分工責任清單</text>

  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
