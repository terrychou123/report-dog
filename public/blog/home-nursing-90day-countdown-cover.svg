<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 右側裝飾區塊 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>

  <!-- 右側裝飾大數字 -->
  <text x="1010" y="219" font-size="150" font-weight="900" fill="#d97706" text-anchor="middle" opacity="0.85">12</text>
  <text x="1010" y="261" font-size="26" fill="#78716c" text-anchor="middle" font-weight="600">週倒數計畫</text>

  <!-- 右側 3 個階段時程條 -->
  <rect x="840" y="283" width="320" height="70" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="840" y="283" width="7" height="70" rx="2" fill="#d97706"/>
  <text x="862" y="305" font-size="24" fill="#d97706" font-weight="700">第 1–4 週</text>
  <text x="862" y="333" font-size="20" fill="#78716c">差距盤點 · 補強急迫缺口</text>

  <rect x="840" y="367" width="320" height="70" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="840" y="367" width="7" height="70" rx="2" fill="#78716c"/>
  <text x="862" y="389" font-size="24" fill="#78716c" font-weight="700">第 5–8 週</text>
  <text x="862" y="417" font-size="20" fill="#78716c">文件補強 · 系統整理</text>

  <rect x="840" y="451" width="320" height="70" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="840" y="451" width="7" height="70" rx="2" fill="#57534e"/>
  <text x="862" y="473" font-size="24" fill="#57534e" font-weight="700">第 9–12 週</text>
  <text x="862" y="501" font-size="20" fill="#78716c">自評確認 · 模擬演練</text>

  <!-- 右側底部標籤 -->
  <rect x="840" y="535" width="320" height="52" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="1000" y="571" font-size="26" fill="#d97706" text-anchor="middle" font-weight="700">每週明確任務 · 準備不慌亂</text>

  <!-- 浮水印 -->
  <text x="1140" y="590" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>

  <!-- 左側主內容區 -->
  <text x="60" y="190" font-size="110" font-weight="900" fill="#1e293b">評鑑前 90 天</text>
  <text x="60" y="318" font-size="110" font-weight="900" fill="#d97706">倒數計畫</text>

  <line x1="60" y1="348" x2="780" y2="348" stroke="#dedad3" stroke-width="2"/>

  <text x="60" y="400" font-size="36" fill="#57534e" font-weight="400">12 週工作清單 · 每週該完成什麼？</text>

  <!-- 特色標籤列 -->
  <rect x="60" y="434" width="148" height="54" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="134" y="471" font-size="28" fill="#d97706" text-anchor="middle" font-weight="600">12 週計畫</text>

  <rect x="220" y="434" width="148" height="54" rx="10" fill="#78716c" opacity="0.12"/>
  <text x="294" y="471" font-size="28" fill="#78716c" text-anchor="middle" font-weight="600">差距盤點</text>

  <rect x="380" y="434" width="148" height="54" rx="10" fill="#57534e" opacity="0.12"/>
  <text x="454" y="471" font-size="28" fill="#57534e" text-anchor="middle" font-weight="600">模擬演練</text>

  <rect x="540" y="434" width="148" height="54" rx="10" fill="#a8a29e" opacity="0.18"/>
  <text x="614" y="471" font-size="28" fill="#78716c" text-anchor="middle" font-weight="600">115 年度</text>

  <!-- 適用對象 -->
  <text x="60" y="540" font-size="28" fill="#94a3b8">適用對象：居家護理所負責人 · 護理長</text>
</svg>
