<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- Header -->
  <rect x="0" y="29" width="800" height="60" fill="#e8e6de"/>
  <rect x="0" y="29" width="6" height="60" rx="2" fill="#d97706"/>
  <text x="28" y="74" font-size="28" fill="#1e293b" font-weight="700">多重需求評估轉化為 ISP 目標三步驟</text>
  <!-- Row 1: y=166, H=90 -->
  <rect x="28" y="166" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1.5"/>
  <rect x="28" y="166" width="6" height="90" rx="2" fill="#d97706"/>
  <circle cx="66" cy="211" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="206" font-size="20" fill="#d97706" font-weight="700" text-anchor="middle">1</text>
  <text x="66" y="226" font-size="14" fill="#78716c" text-anchor="middle">評估需求</text>
  <text x="96" y="201" font-size="20" fill="#1e293b" font-weight="700">評估發現需求（4101）</text>
  <text x="96" y="228" font-size="16" fill="#57534e">依障礙類型選用適齡適性工具，涵蓋六大需求面向：</text>
  <text x="96" y="249" font-size="16" fill="#57534e">生理健康、心理情緒、日常生活、社交溝通、學習技能、社區融合</text>
  <rect x="620" y="177" width="136" height="68" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="204" font-size="14" fill="#d97706" font-weight="700" text-anchor="middle">4101</text>
  <text x="688" y="222" font-size="14" fill="#d97706" text-anchor="middle">適齡適性</text>
  <text x="688" y="240" font-size="14" fill="#d97706" text-anchor="middle">評估工具</text>
  <!-- Row 2: y=269, H=90 -->
  <rect x="28" y="269" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1.5"/>
  <rect x="28" y="269" width="6" height="90" rx="2" fill="#78716c"/>
  <circle cx="66" cy="314" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="309" font-size="20" fill="#78716c" font-weight="700" text-anchor="middle">2</text>
  <text x="66" y="329" font-size="14" fill="#78716c" text-anchor="middle">確認優先</text>
  <text x="96" y="304" font-size="20" fill="#1e293b" font-weight="700">確認優先順序（4102）</text>
  <text x="96" y="331" font-size="16" fill="#57534e">與服務對象或家屬共同討論，確認最重要的改善方向，</text>
  <text x="96" y="352" font-size="16" fill="#57534e">並記錄當事人意見（以服務對象為中心原則）</text>
  <rect x="620" y="280" width="136" height="68" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="307" font-size="14" fill="#78716c" font-weight="700" text-anchor="middle">4102</text>
  <text x="688" y="325" font-size="14" fill="#78716c" text-anchor="middle">當事人</text>
  <text x="688" y="343" font-size="14" fill="#78716c" text-anchor="middle">參與確認</text>
  <!-- Row 3: y=372, H=90 -->
  <rect x="28" y="372" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1.5"/>
  <rect x="28" y="372" width="6" height="90" rx="2" fill="#57534e"/>
  <circle cx="66" cy="417" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="412" font-size="20" fill="#57534e" font-weight="700" text-anchor="middle">3</text>
  <text x="66" y="432" font-size="14" fill="#78716c" text-anchor="middle">設定目標</text>
  <text x="96" y="407" font-size="20" fill="#1e293b" font-weight="700">設定 SMART 目標並規劃介入策略</text>
  <text x="96" y="434" font-size="16" fill="#57534e">明確、可量化、有時間限制的目標陳述，含執行人員、頻率、</text>
  <text x="96" y="455" font-size="16" fill="#57534e">成效指標，避免「增進能力」等籠統描述</text>
  <rect x="620" y="383" width="136" height="68" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="410" font-size="14" fill="#57534e" font-weight="700" text-anchor="middle">SMART</text>
  <text x="688" y="428" font-size="14" fill="#57534e" text-anchor="middle">目標格式</text>
  <text x="688" y="446" font-size="14" fill="#57534e" text-anchor="middle">4102</text>
  <!-- Watermark -->
  <text x="760" y="488" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
