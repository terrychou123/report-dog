<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <rect x="0" y="0" width="800" height="90" fill="#0d9488"/>
  <text x="400" y="38" font-size="22" font-weight="bold" fill="white" text-anchor="middle" font-family="sans-serif">C11-C12 緊急應變計畫與疏散策略（一級必要）</text>
  <text x="400" y="68" font-size="16" fill="#ccfbf1" text-anchor="middle" font-family="sans-serif">年度演練規範 ｜ 115年度老人福利機構評鑑</text>

  <!-- N=4 版型 -->

  <!-- Row 1: C11 年度演練 -->
  <rect x="30" y="110" width="740" height="62" rx="8" fill="white"/>
  <rect x="30" y="110" width="6" height="62" rx="3" fill="#d97706"/>
  <circle cx="66" cy="141" r="16" fill="#d97706"/>
  <text x="66" y="146" font-size="13" font-weight="bold" fill="white" text-anchor="middle" font-family="sans-serif">C11</text>
  <text x="100" y="134" font-size="17" font-weight="bold" fill="#1e293b" font-family="sans-serif">每年實施緊急災害應變演練</text>
  <text x="100" y="156" font-size="13" fill="#57534e" font-family="sans-serif">每年至少：複合型緊急災害應變演練 1 次＋夜間演練 1 次；備有演練腳本及照片</text>
  <rect x="620" y="121" width="136" height="40" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="688" y="146" font-size="13" fill="#dc2626" text-anchor="middle" font-family="sans-serif">每年 2 次</text>

  <!-- Row 2: C11 月度自主檢查 -->
  <rect x="30" y="185" width="740" height="62" rx="8" fill="white"/>
  <rect x="30" y="185" width="6" height="62" rx="3" fill="#78716c"/>
  <circle cx="66" cy="216" r="16" fill="#78716c"/>
  <text x="66" y="221" font-size="13" font-weight="bold" fill="white" text-anchor="middle" font-family="sans-serif">C11</text>
  <text x="100" y="209" font-size="17" font-weight="bold" fill="#1e293b" font-family="sans-serif">每月自主檢查用電設備安全</text>
  <text x="100" y="231" font-size="13" fill="#57534e" font-family="sans-serif">每月自主檢查機構內部用電設備安全並有紀錄；每半年委託業者定期檢驗</text>
  <rect x="620" y="196" width="136" height="40" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="688" y="221" font-size="13" fill="#d97706" text-anchor="middle" font-family="sans-serif">月度查核</text>

  <!-- Row 3: C12 逃生圖 -->
  <rect x="30" y="260" width="740" height="62" rx="8" fill="white"/>
  <rect x="30" y="260" width="6" height="62" rx="3" fill="#57534e"/>
  <circle cx="66" cy="291" r="16" fill="#57534e"/>
  <text x="66" y="296" font-size="13" font-weight="bold" fill="white" text-anchor="middle" font-family="sans-serif">C12</text>
  <text x="100" y="284" font-size="17" font-weight="bold" fill="#1e293b" font-family="sans-serif">各樓層張貼 A3 以上逃生平面圖</text>
  <text x="100" y="306" font-size="13" fill="#57534e" font-family="sans-serif">各樓層出入口、樓梯間張貼緊急避難圖；具比例尺；標示現在位置與方向</text>
  <rect x="620" y="271" width="136" height="40" rx="6" fill="#f0fdf4" stroke="#0d9488" stroke-width="1.5"/>
  <text x="688" y="296" font-size="13" fill="#0d9488" text-anchor="middle" font-family="sans-serif">A3 以上</text>

  <!-- Row 4: C12 外籍照護人員訓練 -->
  <rect x="30" y="335" width="740" height="62" rx="8" fill="white"/>
  <rect x="30" y="335" width="6" height="62" rx="3" fill="#a8a29e"/>
  <circle cx="66" cy="366" r="16" fill="#a8a29e"/>
  <text x="66" y="371" font-size="13" font-weight="bold" fill="white" text-anchor="middle" font-family="sans-serif">C12</text>
  <text x="100" y="359" font-size="17" font-weight="bold" fill="#1e293b" font-family="sans-serif">各類照護人員防救災教育訓練</text>
  <text x="100" y="381" font-size="13" fill="#57534e" font-family="sans-serif">含防火管理人、照服員、護理師、替代役、外籍看護工及家屬參與；有紀錄</text>
  <rect x="620" y="346" width="136" height="40" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="688" y="371" font-size="13" fill="#dc2626" text-anchor="middle" font-family="sans-serif">含外籍人員</text>

  <!-- 底部說明 -->
  <text x="30" y="440" font-size="14" fill="#78716c" font-family="sans-serif">演練後需備有檢討會議紀錄及修正後之應變計畫，缺一不可</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" font-family="sans-serif">報告汪 reportwang.com</text>
</svg>
