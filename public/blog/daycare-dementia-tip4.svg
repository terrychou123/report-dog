<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="450" fill="#f0efe8"/>
  <text x="400" y="46" font-size="21" font-weight="700" fill="#1e293b" text-anchor="middle">技巧 4：辨識潛在需求——3 項快速確認</text>
  <rect x="60" y="58" width="48" height="3" rx="1.5" fill="#d97706"/>
  <line x1="116" y1="59.5" x2="740" y2="59.5" stroke="#dedad3" stroke-width="1"/>

  <!-- Tag -->
  <rect x="52" y="78" width="696" height="34" rx="8" fill="#d97706" opacity="0.08"/>
  <text x="400" y="99" font-size="13" fill="#92400e" text-anchor="middle" font-weight="600">「我要回家」有時只是「我肚子有點空空的」——對應評鑑第 5 條身心狀況評估</text>

  <!-- 3 check items horizontal -->
  <!-- Check 1 -->
  <rect x="52" y="126" width="210" height="170" rx="12" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="52" y="126" width="210" height="5" rx="2.5" fill="#d97706"/>
  <circle cx="157" cy="172" r="26" fill="#d97706" opacity="0.10"/>
  <text x="157" y="180" font-size="22" font-weight="900" fill="#d97706" text-anchor="middle">1</text>
  <text x="157" y="216" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">飢餓 / 進食</text>
  <line x1="68" y1="228" x2="246" y2="228" stroke="#f0ede6" stroke-width="1"/>
  <text x="157" y="250" font-size="12" fill="#64748b" text-anchor="middle">距上次進食多久？</text>
  <text x="157" y="272" font-size="12" fill="#64748b" text-anchor="middle">是否已超過 2–3 小時</text>

  <!-- Check 2 -->
  <rect x="295" y="126" width="210" height="170" rx="12" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="295" y="126" width="210" height="5" rx="2.5" fill="#78716c"/>
  <circle cx="400" cy="172" r="26" fill="#78716c" opacity="0.10"/>
  <text x="400" y="180" font-size="22" font-weight="900" fill="#d97706" text-anchor="middle">2</text>
  <text x="400" y="216" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">如廁需求</text>
  <line x1="311" y1="228" x2="489" y2="228" stroke="#f0ede6" stroke-width="1"/>
  <text x="400" y="250" font-size="12" fill="#64748b" text-anchor="middle">上次如廁是什麼時候？</text>
  <text x="400" y="272" font-size="12" fill="#64748b" text-anchor="middle">是否超過 2 小時</text>

  <!-- Check 3 -->
  <rect x="538" y="126" width="210" height="170" rx="12" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="538" y="126" width="210" height="5" rx="2.5" fill="#a8a29e"/>
  <circle cx="643" cy="172" r="26" fill="#a8a29e" opacity="0.12"/>
  <text x="643" y="180" font-size="22" font-weight="900" fill="#d97706" text-anchor="middle">3</text>
  <text x="643" y="216" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">疼痛跡象</text>
  <line x1="558" y1="228" x2="732" y2="228" stroke="#f0ede6" stroke-width="1"/>
  <text x="643" y="250" font-size="12" fill="#64748b" text-anchor="middle">皺眉、拒絕移動</text>
  <text x="643" y="272" font-size="12" fill="#64748b" text-anchor="middle">某部位特殊不適表現</text>

  <!-- Bottom record guide -->
  <rect x="52" y="314" width="696" height="90" rx="12" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="52" y="314" width="696" height="5" rx="2.5" fill="#d97706" opacity="0.5"/>
  <text x="76" y="340" font-size="13" font-weight="700" fill="#1e293b">第 5 條評鑑紀錄範例</text>
  <text x="76" y="362" font-size="12" fill="#78716c">「個案出現想回家情緒，排查後發現距上次如廁已 2.5 小時</text>
  <text x="76" y="380" font-size="12" fill="#78716c">→ 協助如廁後情緒安定，此為身心狀況評估功能性紀錄」</text>
  <text x="76" y="396" font-size="11" fill="#d97706" font-weight="600">💡 只需 2 分鐘，卻能篩選出身體不適引發的行為</text>

  <text x="760" y="421" font-size="16" fill="#c4bfb8" text-anchor="end" font-weight="400" font-family="'Noto Sans TC', sans-serif">報告汪 reportwang.com</text>
</svg>
