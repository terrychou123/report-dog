<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"
     font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">辨識潛在需求 3 步驟</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">從觀察到回應，找出「想回家」背後的真實需求</text>
  <line x1="129" y1="94" x2="671" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- 箭頭 -->
  <line x1="299" y1="279" x2="315" y2="279" stroke="#c4bfb8" stroke-width="2"/>
  <polygon points="299,273 315,279 299,285" fill="#c4bfb8"/>
  <line x1="485" y1="279" x2="501" y2="279" stroke="#c4bfb8" stroke-width="2"/>
  <polygon points="485,273 501,279 485,285" fill="#c4bfb8"/>

  <!-- Step 1：觀察身體狀況（#d97706 琥珀）card x=129 cx=214 -->
  <rect x="129" y="108" width="170" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="129" y="108" width="170" height="8" rx="4" fill="#d97706"/>
  <rect x="129" y="112" width="170" height="4" fill="#d97706"/>
  <circle cx="214" cy="196" r="43" fill="#fef3c7"/>
  <text x="214" y="185" text-anchor="middle" font-size="17" fill="#d97706" font-weight="700">STEP</text>
  <text x="214" y="213" text-anchor="middle" font-size="28" fill="#d97706" font-weight="700">01</text>
  <text x="214" y="293" text-anchor="middle" font-size="23" fill="#1e293b" font-weight="700">觀察身體狀況</text>
  <text x="214" y="317" text-anchor="middle" font-size="15" fill="#57534e">檢查是否疼痛不適</text>
  <text x="214" y="339" text-anchor="middle" font-size="15" fill="#57534e">留意飢渴如廁需求</text>
  <rect x="142" y="376" width="144" height="36" rx="18" fill="#fef3c7"/>
  <text x="214" y="400" text-anchor="middle" font-size="16" fill="#d97706" font-weight="600">身體評估</text>

  <!-- Step 2：詢問基本需求（#78716c 暖灰）card x=315 cx=400 -->
  <rect x="315" y="108" width="170" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="315" y="108" width="170" height="8" rx="4" fill="#78716c"/>
  <rect x="315" y="112" width="170" height="4" fill="#78716c"/>
  <circle cx="400" cy="196" r="43" fill="#f5f5f4"/>
  <text x="400" y="185" text-anchor="middle" font-size="17" fill="#78716c" font-weight="700">STEP</text>
  <text x="400" y="213" text-anchor="middle" font-size="28" fill="#78716c" font-weight="700">02</text>
  <text x="400" y="293" text-anchor="middle" font-size="23" fill="#1e293b" font-weight="700">詢問基本需求</text>
  <text x="400" y="317" text-anchor="middle" font-size="15" fill="#57534e">用簡單詞彙問候個案</text>
  <text x="400" y="339" text-anchor="middle" font-size="15" fill="#57534e">觀察眼神與手勢反應</text>
  <rect x="328" y="376" width="144" height="36" rx="18" fill="#f5f5f4"/>
  <text x="400" y="400" text-anchor="middle" font-size="16" fill="#78716c" font-weight="600">溝通技巧</text>

  <!-- Step 3：調整照護回應（#57534e 深棕）card x=501 cx=586 -->
  <rect x="501" y="108" width="170" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="501" y="108" width="170" height="8" rx="4" fill="#57534e"/>
  <rect x="501" y="112" width="170" height="4" fill="#57534e"/>
  <circle cx="586" cy="196" r="43" fill="#f5f0eb"/>
  <text x="586" y="185" text-anchor="middle" font-size="17" fill="#57534e" font-weight="700">STEP</text>
  <text x="586" y="213" text-anchor="middle" font-size="28" fill="#57534e" font-weight="700">03</text>
  <text x="586" y="293" text-anchor="middle" font-size="23" fill="#1e293b" font-weight="700">調整照護回應</text>
  <text x="586" y="317" text-anchor="middle" font-size="15" fill="#57534e">立即處理生理需求</text>
  <text x="586" y="339" text-anchor="middle" font-size="15" fill="#57534e">記錄潛在觸發因子</text>
  <rect x="514" y="376" width="144" height="36" rx="18" fill="#f5f0eb"/>
  <text x="586" y="400" text-anchor="middle" font-size="16" fill="#57534e" font-weight="600">個別化回應</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
