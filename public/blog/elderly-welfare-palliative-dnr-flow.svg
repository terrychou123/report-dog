<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- 標題 -->
  <text x="400" y="50" font-size="26" fill="#1e293b" text-anchor="middle" font-weight="700" >DNR 建置流程 — 4 大步驟</text>
  <!-- N=4: H=62, outer_gap=50, Header y=50, Row y: 160/235/310/385 -->
  <!-- Row 1 -->
  <rect x="50" y="145" width="700" height="62" rx="8" fill="#ffffff"/>
  <rect x="50" y="145" width="6" height="62" rx="2" fill="#d97706"/>
  <circle cx="85" cy="176" r="16" fill="#d97706" opacity="0.15"/>
  <text x="85" y="182" font-size="16" fill="#d97706" text-anchor="middle" font-weight="700" >1</text>
  <text x="118" y="169" font-size="17" fill="#1e293b" font-weight="700" >入住時主動討論</text>
  <text x="118" y="191" font-size="14" fill="#57534e" >入住評估時與個案及家屬討論 DNR 意願，說明病人自主權利法</text>
  <rect x="570" y="153" width="168" height="46" rx="6" fill="#d97706" opacity="0.10"/>
  <text x="654" y="181" font-size="14" fill="#d97706" text-anchor="middle" font-weight="600" >入住第一週</text>
  <!-- Row 2 -->
  <rect x="50" y="220" width="700" height="62" rx="8" fill="#ffffff"/>
  <rect x="50" y="220" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="85" cy="251" r="16" fill="#78716c" opacity="0.15"/>
  <text x="85" y="257" font-size="16" fill="#78716c" text-anchor="middle" font-weight="700" >2</text>
  <text x="118" y="244" font-size="17" fill="#1e293b" font-weight="700" >醫師診斷與意願書簽署</text>
  <text x="118" y="266" font-size="14" fill="#57534e" >由特約醫師診察後，協助個案（有行為能力）或家屬填寫 DNR 意願書</text>
  <rect x="570" y="228" width="168" height="46" rx="6" fill="#78716c" opacity="0.10"/>
  <text x="654" y="256" font-size="14" fill="#78716c" text-anchor="middle" font-weight="600" >醫師主導</text>
  <!-- Row 3 -->
  <rect x="50" y="295" width="700" height="62" rx="8" fill="#ffffff"/>
  <rect x="50" y="295" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="85" cy="326" r="16" fill="#57534e" opacity="0.15"/>
  <text x="85" y="332" font-size="16" fill="#57534e" text-anchor="middle" font-weight="700" >3</text>
  <text x="118" y="319" font-size="17" fill="#1e293b" font-weight="700" >意願書存放與全員周知</text>
  <text x="118" y="341" font-size="14" fill="#57534e" >意願書置於護理站明顯位置，全員（含外籍看護）均知曉 DNR 狀態</text>
  <rect x="570" y="303" width="168" height="46" rx="6" fill="#57534e" opacity="0.10"/>
  <text x="654" y="331" font-size="14" fill="#57534e" text-anchor="middle" font-weight="600" >標示明顯</text>
  <!-- Row 4 -->
  <rect x="50" y="370" width="700" height="62" rx="8" fill="#ffffff"/>
  <rect x="50" y="370" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="85" cy="401" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="85" y="407" font-size="16" fill="#a8a29e" text-anchor="middle" font-weight="700" >4</text>
  <text x="118" y="394" font-size="17" fill="#1e293b" font-weight="700" >定期複核意願</text>
  <text x="118" y="416" font-size="14" fill="#57534e" >定期（至少每年或病情顯著變化時）重新與個案/家屬確認 DNR 意願</text>
  <rect x="570" y="378" width="168" height="46" rx="6" fill="#a8a29e" opacity="0.10"/>
  <text x="654" y="406" font-size="14" fill="#a8a29e" text-anchor="middle" font-weight="600" >每年複核</text>
  <!-- 箭頭連接 -->
  <line x1="400" y1="207" x2="400" y2="220" stroke="#d97706" stroke-width="2" stroke-dasharray="4,3" opacity="0.5"/>
  <line x1="400" y1="282" x2="400" y2="295" stroke="#d97706" stroke-width="2" stroke-dasharray="4,3" opacity="0.5"/>
  <line x1="400" y1="357" x2="400" y2="370" stroke="#d97706" stroke-width="2" stroke-dasharray="4,3" opacity="0.5"/>
  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" >報告汪 reportwang.com</text>
</svg>