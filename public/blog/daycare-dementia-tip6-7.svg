<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"
     font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">技巧 6–7：安全看視與追蹤評值</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">確保人身安全，持續記錄與更新照護計畫</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- 左上卡片（#d97706，技巧6 安全看視）x=40 y=104 w=346 h=168 -->
  <rect x="40" y="104" width="346" height="168" rx="12" fill="white"/>
  <rect x="40" y="104" width="346" height="44" rx="12" fill="#d97706"/>
  <rect x="40" y="128" width="346" height="20" fill="#d97706"/>
  <circle cx="68" cy="126" r="9" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
  <circle cx="68" cy="126" r="3" fill="white" opacity="0.8"/>
  <text x="213" y="133" text-anchor="middle" font-size="15" fill="white" font-weight="700">技巧 6：安全看視</text>
  <text x="60" y="172" font-size="14" fill="#57534e">• 保持 5–10 步安全視距</text>
  <text x="60" y="192" font-size="14" fill="#57534e">• 確認出入口安全設施</text>
  <text x="60" y="212" font-size="14" fill="#57534e">• 準備緊急聯絡與定位資訊</text>
  <text x="60" y="232" font-size="14" fill="#57534e">• 建立走失通報標準程序</text>
  <rect x="56" y="246" width="80" height="20" rx="10" fill="#fef3c7"/>
  <text x="96" y="260" text-anchor="middle" font-size="14" fill="#d97706" font-weight="600">人身安全</text>

  <!-- 右上卡片（#78716c，技巧7 追蹤評值）x=414 y=104 w=346 h=168 -->
  <rect x="414" y="104" width="346" height="168" rx="12" fill="white"/>
  <rect x="414" y="104" width="346" height="44" rx="12" fill="#78716c"/>
  <rect x="414" y="128" width="346" height="20" fill="#78716c"/>
  <rect x="438" y="117" width="18" height="18" rx="3" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
  <line x1="441" y1="126" x2="453" y2="126" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
  <text x="587" y="133" text-anchor="middle" font-size="15" fill="white" font-weight="700">技巧 7：追蹤評值</text>
  <text x="434" y="172" font-size="14" fill="#57534e">• 記錄事件時間、地點與情境</text>
  <text x="434" y="192" font-size="14" fill="#57534e">• 記錄應對方式與個案反應</text>
  <text x="434" y="212" font-size="14" fill="#57534e">• 每月彙整事件頻率趨勢</text>
  <text x="434" y="232" font-size="14" fill="#57534e">• 定期更新個別照護計畫</text>
  <rect x="430" y="246" width="80" height="20" rx="10" fill="#f5f5f4"/>
  <text x="470" y="260" text-anchor="middle" font-size="14" fill="#78716c" font-weight="600">持續改善</text>

  <!-- 左下卡片（#57534e，評鑑第6條）x=40 y=288 w=346 h=162 -->
  <rect x="40" y="288" width="346" height="162" rx="12" fill="white"/>
  <rect x="40" y="288" width="346" height="44" rx="12" fill="#57534e"/>
  <rect x="40" y="312" width="346" height="20" fill="#57534e"/>
  <line x1="60" y1="309" x2="68" y2="317" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-linecap="round"/>
  <line x1="68" y1="317" x2="84" y2="301" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-linecap="round"/>
  <text x="213" y="317" text-anchor="middle" font-size="15" fill="white" font-weight="700">評鑑關聯：第 6 條</text>
  <text x="60" y="356" font-size="14" fill="#57534e">• 對應失智照顧技術條文</text>
  <text x="60" y="376" font-size="14" fill="#57534e">• 展示工作人員安全看視訓練</text>
  <text x="60" y="396" font-size="14" fill="#57534e">• 走失預防有書面措施佐證</text>
  <text x="60" y="416" font-size="14" fill="#57534e">• 緊急應對程序需書面化</text>
  <rect x="56" y="430" width="80" height="20" rx="10" fill="#f5f0eb"/>
  <text x="96" y="444" text-anchor="middle" font-size="14" fill="#57534e" font-weight="600">評鑑加分</text>

  <!-- 右下卡片（#a8a29e，評鑑第4條）x=414 y=288 w=346 h=162 -->
  <rect x="414" y="288" width="346" height="162" rx="12" fill="white"/>
  <rect x="414" y="288" width="346" height="44" rx="12" fill="#a8a29e"/>
  <rect x="414" y="312" width="346" height="20" fill="#a8a29e"/>
  <circle cx="440" cy="310" r="8" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
  <line x1="440" y1="302" x2="440" y2="307" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
  <circle cx="440" cy="314" r="2" fill="rgba(255,255,255,0.7)"/>
  <text x="587" y="317" text-anchor="middle" font-size="15" fill="white" font-weight="700">評鑑關聯：第 4 條</text>
  <text x="434" y="356" font-size="14" fill="#57534e">• 對應個案照護記錄條文</text>
  <text x="434" y="376" font-size="14" fill="#57534e">• 記錄需有改善計畫依據</text>
  <text x="434" y="396" font-size="14" fill="#57534e">• 展示持續評值機制完整</text>
  <text x="434" y="416" font-size="14" fill="#57534e">• 異常個案有追蹤後記錄</text>
  <rect x="430" y="430" width="80" height="20" rx="10" fill="#f5f5f4"/>
  <text x="470" y="444" text-anchor="middle" font-size="14" fill="#a8a29e" font-weight="600">條文符合</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
