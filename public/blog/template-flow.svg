<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區（主標 y=48, 副標 y=78, 分隔線 y=94） -->
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">評鑑準備 4 大關鍵步驟</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">掌握流程、提前佈局，讓評鑑不再慌亂</text>
  <line x1="28" y1="94" x2="772" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- 箭頭（卡片中心 y=(108+450)/2=279） -->
  <line x1="202" y1="279" x2="218" y2="279" stroke="#c4bfb8" stroke-width="2"/>
  <polygon points="202,273 218,279 202,285" fill="#c4bfb8"/>
  <line x1="392" y1="279" x2="408" y2="279" stroke="#c4bfb8" stroke-width="2"/>
  <polygon points="392,273 408,279 392,285" fill="#c4bfb8"/>
  <line x1="582" y1="279" x2="598" y2="279" stroke="#c4bfb8" stroke-width="2"/>
  <polygon points="582,273 598,279 582,285" fill="#c4bfb8"/>

  <!-- Step 1（#d97706 琥珀）x=28, cx=115 — 卡片底=450 -->
  <!-- height=342，內容 +27 from 原始值，置中於 y=120~450 -->
  <rect x="28" y="108" width="174" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="108" width="174" height="8" rx="4" fill="#d97706"/>
  <rect x="28" y="112" width="174" height="4" fill="#d97706"/>
  <circle cx="115" cy="201" r="44" fill="#fef3c7"/>
  <text x="115" y="190" text-anchor="middle" font-size="18" fill="#d97706" font-weight="700">STEP</text>
  <text x="115" y="219" text-anchor="middle" font-size="29" fill="#d97706" font-weight="700">01</text>
  <text x="115" y="299" text-anchor="middle" font-size="22" fill="#1e293b" font-weight="700">自我評估</text>
  <text x="115" y="327" text-anchor="middle" font-size="15" fill="#57534e">盤點現有文件</text>
  <text x="115" y="349" text-anchor="middle" font-size="15" fill="#57534e">與執行落差</text>
  <rect x="41" y="377" width="148" height="36" rx="18" fill="#fef3c7"/>
  <text x="115" y="401" text-anchor="middle" font-size="16" fill="#d97706" font-weight="600">評鑑前 90 天</text>

  <!-- Step 2（#78716c 暖灰）x=218, cx=305 -->
  <rect x="218" y="108" width="174" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="218" y="108" width="174" height="8" rx="4" fill="#78716c"/>
  <rect x="218" y="112" width="174" height="4" fill="#78716c"/>
  <circle cx="305" cy="201" r="44" fill="#f5f5f4"/>
  <text x="305" y="190" text-anchor="middle" font-size="18" fill="#78716c" font-weight="700">STEP</text>
  <text x="305" y="219" text-anchor="middle" font-size="29" fill="#78716c" font-weight="700">02</text>
  <text x="305" y="299" text-anchor="middle" font-size="22" fill="#1e293b" font-weight="700">制定計畫</text>
  <text x="305" y="327" text-anchor="middle" font-size="15" fill="#57534e">分工負責人</text>
  <text x="305" y="349" text-anchor="middle" font-size="15" fill="#57534e">與截止日期</text>
  <rect x="231" y="377" width="148" height="36" rx="18" fill="#f5f5f4"/>
  <text x="305" y="401" text-anchor="middle" font-size="16" fill="#78716c" font-weight="600">評鑑前 60 天</text>

  <!-- Step 3（#57534e 深棕）x=408, cx=495 -->
  <rect x="408" y="108" width="174" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="408" y="108" width="174" height="8" rx="4" fill="#57534e"/>
  <rect x="408" y="112" width="174" height="4" fill="#57534e"/>
  <circle cx="495" cy="201" r="44" fill="#f5f0eb"/>
  <text x="495" y="190" text-anchor="middle" font-size="18" fill="#57534e" font-weight="700">STEP</text>
  <text x="495" y="219" text-anchor="middle" font-size="29" fill="#57534e" font-weight="700">03</text>
  <text x="495" y="299" text-anchor="middle" font-size="22" fill="#1e293b" font-weight="700">文件整備</text>
  <text x="495" y="327" text-anchor="middle" font-size="15" fill="#57534e">補齊紀錄表單</text>
  <text x="495" y="349" text-anchor="middle" font-size="15" fill="#57534e">與政策規範</text>
  <rect x="421" y="377" width="148" height="36" rx="18" fill="#f5f0eb"/>
  <text x="495" y="401" text-anchor="middle" font-size="16" fill="#57534e" font-weight="600">評鑑前 30 天</text>

  <!-- Step 4（#a8a29e 淺灰）x=598, cx=685 -->
  <rect x="598" y="108" width="174" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="598" y="108" width="174" height="8" rx="4" fill="#a8a29e"/>
  <rect x="598" y="112" width="174" height="4" fill="#a8a29e"/>
  <circle cx="685" cy="201" r="44" fill="#f5f5f4"/>
  <text x="685" y="190" text-anchor="middle" font-size="18" fill="#a8a29e" font-weight="700">STEP</text>
  <text x="685" y="219" text-anchor="middle" font-size="29" fill="#a8a29e" font-weight="700">04</text>
  <text x="685" y="299" text-anchor="middle" font-size="22" fill="#1e293b" font-weight="700">模擬演練</text>
  <text x="685" y="327" text-anchor="middle" font-size="15" fill="#57534e">內部自評與</text>
  <text x="685" y="349" text-anchor="middle" font-size="15" fill="#57534e">弱點改善</text>
  <rect x="611" y="377" width="148" height="36" rx="18" fill="#f5f5f4"/>
  <text x="685" y="401" text-anchor="middle" font-size="16" fill="#a8a29e" font-weight="600">評鑑前 7 天</text>

  <!-- 浮水印（不移動） -->
  <text x="760" y="480" font-size="16" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
