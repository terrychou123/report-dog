<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460">

  <!-- 背景：米黃暖色 -->
  <rect width="800" height="460" fill="#f0efe8"/>

  <!-- 標題 -->
  <text x="400" y="38" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="20" fill="#1e293b" font-weight="700">評鑑準備 4 個步驟</text>
  <text x="400" y="58" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#57534e">從基準研讀到模擬演練的完整規劃流程</text>
  <line x1="60" y1="72" x2="740" y2="72" stroke="#dedad3" stroke-width="1"/>

  <!-- Step 1：了解基準（藍） -->
  <rect x="40" y="90" width="162" height="300" rx="12" fill="white"/>
  <rect x="40" y="90" width="162" height="8" rx="4" fill="#2563eb"/>
  <rect x="40" y="94" width="162" height="4" fill="#2563eb"/>
  <circle cx="121" cy="144" r="28" fill="#eff6ff"/>
  <text x="121" y="138" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#2563eb" font-weight="700">STEP</text>
  <text x="121" y="155" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="18" fill="#2563eb" font-weight="700">01</text>
  <text x="121" y="197" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="16" fill="#1e293b" font-weight="700">了解基準</text>
  <line x1="60" y1="210" x2="182" y2="210" stroke="#f0ede6" stroke-width="1"/>
  <text x="121" y="234" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#57534e">研讀評鑑基準手冊</text>
  <text x="121" y="254" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#57534e">標記重點條文要求</text>
  <text x="121" y="274" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#57534e">建立現況對照清單</text>
  <rect x="64" y="350" width="114" height="24" rx="12" fill="#eff6ff"/>
  <text x="121" y="366" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#2563eb" font-weight="600">第 1–2 週</text>

  <!-- 箭頭 1→2 -->
  <polygon points="210,235 224,229 224,241" fill="#cbd5e1"/>
  <line x1="202" y1="235" x2="213" y2="235" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Step 2：分工規劃（綠） -->
  <rect x="222" y="90" width="162" height="300" rx="12" fill="white"/>
  <rect x="222" y="90" width="162" height="8" rx="4" fill="#16a34a"/>
  <rect x="222" y="94" width="162" height="4" fill="#16a34a"/>
  <circle cx="303" cy="144" r="28" fill="#f0fdf4"/>
  <text x="303" y="138" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#16a34a" font-weight="700">STEP</text>
  <text x="303" y="155" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="18" fill="#16a34a" font-weight="700">02</text>
  <text x="303" y="197" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="16" fill="#1e293b" font-weight="700">分工規劃</text>
  <line x1="242" y1="210" x2="364" y2="210" stroke="#f0ede6" stroke-width="1"/>
  <text x="303" y="234" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#57534e">指派各面向負責人</text>
  <text x="303" y="254" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#57534e">建立任務追蹤清單</text>
  <text x="303" y="274" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#57534e">設定完成里程碑</text>
  <rect x="246" y="350" width="114" height="24" rx="12" fill="#f0fdf4"/>
  <text x="303" y="366" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#16a34a" font-weight="600">第 3–4 週</text>

  <!-- 箭頭 2→3 -->
  <polygon points="392,235 406,229 406,241" fill="#cbd5e1"/>
  <line x1="384" y1="235" x2="395" y2="235" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Step 3：資料蒐集（橘） -->
  <rect x="404" y="90" width="162" height="300" rx="12" fill="white"/>
  <rect x="404" y="90" width="162" height="8" rx="4" fill="#ea580c"/>
  <rect x="404" y="94" width="162" height="4" fill="#ea580c"/>
  <circle cx="485" cy="144" r="28" fill="#fff7ed"/>
  <text x="485" y="138" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#ea580c" font-weight="700">STEP</text>
  <text x="485" y="155" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="18" fill="#ea580c" font-weight="700">03</text>
  <text x="485" y="197" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="16" fill="#1e293b" font-weight="700">資料蒐集</text>
  <line x1="424" y1="210" x2="546" y2="210" stroke="#f0ede6" stroke-width="1"/>
  <text x="485" y="234" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#57534e">彙整佐證文件資料</text>
  <text x="485" y="254" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#57534e">填寫 Excel 自評表格</text>
  <text x="485" y="274" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#57534e">建立文件索引備查</text>
  <rect x="428" y="350" width="114" height="24" rx="12" fill="#fff7ed"/>
  <text x="485" y="366" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#ea580c" font-weight="600">第 5–8 週</text>

  <!-- 箭頭 3→4 -->
  <polygon points="574,235 588,229 588,241" fill="#cbd5e1"/>
  <line x1="566" y1="235" x2="577" y2="235" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Step 4：模擬演練（青） -->
  <rect x="586" y="90" width="162" height="300" rx="12" fill="white"/>
  <rect x="586" y="90" width="162" height="8" rx="4" fill="#0d9488"/>
  <rect x="586" y="94" width="162" height="4" fill="#0d9488"/>
  <circle cx="667" cy="144" r="28" fill="#f0fdfa"/>
  <text x="667" y="138" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#0d9488" font-weight="700">STEP</text>
  <text x="667" y="155" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="18" fill="#0d9488" font-weight="700">04</text>
  <text x="667" y="197" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="16" fill="#1e293b" font-weight="700">模擬演練</text>
  <line x1="606" y1="210" x2="728" y2="210" stroke="#f0ede6" stroke-width="1"/>
  <text x="667" y="234" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#57534e">進行內部模擬訪視</text>
  <text x="667" y="254" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#57534e">修正缺漏問題項目</text>
  <text x="667" y="274" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#57534e">確認全員熟悉流程</text>
  <rect x="610" y="350" width="114" height="24" rx="12" fill="#f0fdfa"/>
  <text x="667" y="366" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#0d9488" font-weight="600">第 9–12 週</text>

  <!-- 浮水印 -->
  <text x="760" y="431" font-size="16" fill="#c4bfb8" text-anchor="end" font-weight="400" font-family="'Noto Sans TC', sans-serif">報告汪 reportwang.com</text>
</svg>
