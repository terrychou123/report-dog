<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- Header -->
  <rect x="0" y="29" width="800" height="60" fill="#e8e6de"/>
  <rect x="0" y="29" width="6" height="60" rx="2" fill="#d97706"/>
  <text x="28" y="74" font-size="28" fill="#1e293b" font-weight="700">三年月均值計算三步驟（1106 評核基準）</text>
  <!-- Row 1: y=166, H=90 -->
  <rect x="28" y="166" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1.5"/>
  <rect x="28" y="166" width="6" height="90" rx="2" fill="#d97706"/>
  <circle cx="66" cy="211" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="206" font-size="20" fill="#d97706" font-weight="700" text-anchor="middle">1</text>
  <text x="66" y="226" font-size="14" fill="#78716c" text-anchor="middle">蒐集數據</text>
  <text x="96" y="201" font-size="20" fill="#1e293b" font-weight="700">列出三年每月服務人數</text>
  <text x="96" y="228" font-size="16" fill="#57534e">蒐集 106 年 1 月至 108 年 12 月，共 36 個月的服務對象人數，</text>
  <text x="96" y="249" font-size="16" fill="#57534e">每月在籍且接受服務的人數為計算基礎</text>
  <rect x="620" y="177" width="136" height="68" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="204" font-size="14" fill="#d97706" font-weight="700" text-anchor="middle">106-108</text>
  <text x="688" y="222" font-size="14" fill="#d97706" text-anchor="middle">共 36 個月</text>
  <text x="688" y="240" font-size="14" fill="#d97706" text-anchor="middle">每月記錄</text>
  <!-- Row 2: y=269, H=90 -->
  <rect x="28" y="269" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1.5"/>
  <rect x="28" y="269" width="6" height="90" rx="2" fill="#78716c"/>
  <circle cx="66" cy="314" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="309" font-size="20" fill="#78716c" font-weight="700" text-anchor="middle">2</text>
  <text x="66" y="329" font-size="14" fill="#78716c" text-anchor="middle">計算均值</text>
  <text x="96" y="304" font-size="20" fill="#1e293b" font-weight="700">計算三年平均月服務人數</text>
  <text x="96" y="331" font-size="16" fill="#57534e">36 個月服務人數加總 ÷ 36 = 月均值（無條件保留小數）</text>
  <text x="96" y="352" font-size="16" fill="#57534e">範例：月均值 95 人（社工師 95 ÷ 80 = 1.19，無條件進位 = 2 名）</text>
  <rect x="620" y="280" width="136" height="68" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="307" font-size="14" fill="#78716c" font-weight="700" text-anchor="middle">總人數 ÷ 36</text>
  <text x="688" y="325" font-size="14" fill="#78716c" text-anchor="middle">= 月均值</text>
  <text x="688" y="343" font-size="14" fill="#78716c" text-anchor="middle">無條件進位</text>
  <!-- Row 3: y=372, H=90 -->
  <rect x="28" y="372" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1.5"/>
  <rect x="28" y="372" width="6" height="90" rx="2" fill="#57534e"/>
  <circle cx="66" cy="417" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="412" font-size="20" fill="#57534e" font-weight="700" text-anchor="middle">3</text>
  <text x="66" y="432" font-size="14" fill="#78716c" text-anchor="middle">核對人力</text>
  <text x="96" y="407" font-size="20" fill="#1e293b" font-weight="700">核對各月實際在職人力是否達標</text>
  <text x="96" y="434" font-size="16" fill="#57534e">依月均值計算各類法定人力後，逐月確認實際在職人數，</text>
  <text x="96" y="455" font-size="16" fill="#57534e">任一月份低於法定需求即有被扣分風險</text>
  <rect x="620" y="383" width="136" height="68" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="410" font-size="14" fill="#57534e" font-weight="700" text-anchor="middle">逐月核對</text>
  <text x="688" y="428" font-size="14" fill="#57534e" text-anchor="middle">缺口即</text>
  <text x="688" y="446" font-size="14" fill="#57534e" text-anchor="middle">扣分風險</text>
  <!-- Watermark -->
  <text x="760" y="488" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
