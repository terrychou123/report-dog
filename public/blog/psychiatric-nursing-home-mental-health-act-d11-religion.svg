<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <rect x="0" y="38" width="800" height="90" fill="#e8e6de"/>
  <rect x="0" y="38" width="6" height="90" rx="2" fill="#d97706"/>
  <text x="28" y="98" font-size="36" fill="#1e293b" font-weight="700">修法對 D1.1 住民信仰和精神照護的影響</text>
  <rect x="28" y="166" width="744" height="90" rx="12" fill="#e8e6de"/>
  <rect x="28" y="166" width="6" height="90" rx="2" fill="#d97706"/>
  <circle cx="66" cy="211" r="20" fill="#d97706" opacity="0.15"/>
  <text x="66" y="217" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">強化</text>
  <text x="100" y="210" font-size="28" fill="#1e293b" font-weight="700">「以當事人為中心」更加明確</text>
  <text x="100" y="234" font-size="18" fill="#57534e">修法後精神衛生法強調個別需求的尊重，呼應 D1.1 個別化心靈關懷</text>
  <rect x="620" y="185" width="136" height="52" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="205" font-size="16" fill="#d97706" text-anchor="middle">以人</text>
  <text x="688" y="225" font-size="16" fill="#d97706" text-anchor="middle">為中心</text>
  <rect x="28" y="269" width="744" height="90" rx="12" fill="#e8e6de"/>
  <rect x="28" y="269" width="6" height="90" rx="2" fill="#78716c"/>
  <circle cx="66" cy="314" r="20" fill="#78716c" opacity="0.15"/>
  <text x="66" y="320" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">要求</text>
  <text x="100" y="313" font-size="28" fill="#1e293b" font-weight="700">照護計畫需納入精神照護需求</text>
  <text x="100" y="337" font-size="18" fill="#57534e">住民的信仰、心靈需求、自我認同等需在個別化照護計畫中體現</text>
  <rect x="620" y="288" width="136" height="52" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="308" font-size="16" fill="#78716c" text-anchor="middle">計畫</text>
  <text x="688" y="328" font-size="16" fill="#78716c" text-anchor="middle">體現</text>
  <rect x="28" y="372" width="744" height="90" rx="12" fill="#e8e6de"/>
  <rect x="28" y="372" width="6" height="90" rx="2" fill="#57534e"/>
  <circle cx="66" cy="417" r="20" fill="#57534e" opacity="0.15"/>
  <text x="66" y="423" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">實務</text>
  <text x="100" y="416" font-size="28" fill="#1e293b" font-weight="700">心靈關懷服務記錄要有個別性</text>
  <text x="100" y="440" font-size="18" fill="#57534e">不能所有住民都是相同的心靈關懷服務，需展示「這位住民的」特殊需求</text>
  <rect x="620" y="391" width="136" height="52" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="411" font-size="16" fill="#57534e" text-anchor="middle">個別</text>
  <text x="688" y="431" font-size="16" fill="#57534e" text-anchor="middle">記錄</text>
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
