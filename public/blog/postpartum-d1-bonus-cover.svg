<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 右側裝飾區塊 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>

  <!-- 右側大文字 D1 -->
  <text x="1010" y="195" font-size="138" font-weight="900" fill="#7c3aed" text-anchor="middle" opacity="0.85">D1</text>
  <text x="1010" y="237" font-size="26" fill="#78716c" text-anchor="middle" font-weight="600">配合政策執行（加分項）</text>

  <!-- 右側 3 個加分來源 -->
  <rect x="840" y="260" width="320" height="60" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="858" y="276" font-size="18" fill="#a8a29e" font-weight="500">加分來源 1</text>
  <text x="858" y="303" font-size="22" fill="#7c3aed" font-weight="700">母嬰親善認證</text>

  <rect x="840" y="326" width="320" height="60" rx="10" fill="#7c3aed" opacity="0.10" stroke="#e8e5de" stroke-width="1"/>
  <text x="858" y="342" font-size="18" fill="#a8a29e" font-weight="500">加分來源 2</text>
  <text x="858" y="369" font-size="22" fill="#7c3aed" font-weight="700">配合主管機關政策</text>

  <rect x="840" y="392" width="320" height="60" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="858" y="408" font-size="18" fill="#a8a29e" font-weight="500">加分來源 3</text>
  <text x="858" y="435" font-size="22" fill="#d97706" font-weight="700">創新服務方案</text>

  <!-- 右側提示 -->
  <rect x="840" y="462" width="320" height="56" rx="10" fill="#7c3aed" opacity="0.10"/>
  <text x="1000" y="498" font-size="24" fill="#7c3aed" text-anchor="middle" font-weight="700">D2 試評扣分項</text>
  <text x="1000" y="524" font-size="20" fill="#78716c" text-anchor="middle">重大違規才適用</text>

  <rect x="840" y="528" width="320" height="52" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="1000" y="560" font-size="20" fill="#57534e" text-anchor="middle">有做沒申報 = 錯失加分</text>

  <rect x="840" y="586" width="320" height="38" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="1000" y="611" font-size="20" fill="#57534e" text-anchor="middle">主動申報才能拿分</text>

  <!-- 左側主標題 -->
  <text x="60" y="162" font-size="88" font-weight="900" fill="#1e293b">D 類加分項</text>
  <text x="60" y="260" font-size="88" font-weight="900" fill="#7c3aed">怎麼拿？</text>

  <line x1="60" y1="292" x2="780" y2="292" stroke="#dedad3" stroke-width="2"/>

  <text x="60" y="338" font-size="33" fill="#57534e" font-weight="400">母嬰親善認證 × 政策配合 × 創新服務</text>

  <!-- 特色標籤列 -->
  <rect x="60" y="366" width="188" height="52" rx="10" fill="#7c3aed" opacity="0.10"/>
  <text x="154" y="401" font-size="26" fill="#7c3aed" text-anchor="middle" font-weight="600">母嬰認證</text>

  <rect x="260" y="366" width="188" height="52" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="354" y="401" font-size="26" fill="#d97706" text-anchor="middle" font-weight="600">創新服務</text>

  <rect x="460" y="366" width="188" height="52" rx="10" fill="#78716c" opacity="0.12"/>
  <text x="554" y="401" font-size="26" fill="#78716c" text-anchor="middle" font-weight="600">申報文件</text>

  <!-- 適用對象 -->
  <text x="60" y="452" font-size="28" fill="#94a3b8">機構負責人 · 護理主管 · 評鑑準備負責人</text>

  <!-- 底部說明 -->
  <text x="60" y="500" font-size="30" fill="#57534e" font-weight="500">D1 是從甲等跳升優等的關鍵加分項</text>
  <text x="60" y="538" font-size="26" fill="#a8a29e">3 大加分來源，多數機構有做卻沒有主動申報</text>

  <!-- 浮水印 -->
  <text x="780" y="590" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
