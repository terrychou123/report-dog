  <circle cx="66" cy="417" r="20" fill="#57534e" opacity="0.15"/>
  <text x="66" y="423" font-size="18" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <text x="100" y="416" font-size="28" fill="#1e293b" font-weight="700">定期風險評估紀錄</text>
  <text x="100" y="440" font-size="18" fill="#57534e">說明機構有持續進行訪視前的安全評估與衛教措施</text>
