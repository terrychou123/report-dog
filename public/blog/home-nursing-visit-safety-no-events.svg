  <text x="100" y="210" font-size="28" fill="#1e293b" font-weight="700">「本期無安全事件」說明書</text>
  <text x="100" y="234" font-size="18" fill="#57534e">由護理長簽名確認，說明本評鑑期間無通報事件</text>
  <rect x="620" y="185" width="136" height="52" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="205" font-size="16" fill="#d97706" text-anchor="middle">護理長</text>
  <text x="688" y="225" font-size="16" fill="#d97706" text-anchor="middle">簽名</text>
  <rect x="28" y="269" width="744" height="90" rx="12" fill="#e8e6de"/>
  <rect x="28" y="269" width="6" height="90" rx="2" fill="#78716c"/>
  <circle cx="66" cy="314" r="20" fill="#78716c" opacity="0.15"/>
  <text x="66" y="320" font-size="18" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <text x="100" y="313" font-size="28" fill="#1e293b" font-weight="700">預防性安全管理辦法</text>
  <text x="100" y="337" font-size="18" fill="#57534e">雖無事件，辦法仍需存在且有效，顯示機構持續管理</text>
  <rect x="620" y="288" width="136" height="52" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="308" font-size="16" fill="#78716c" text-anchor="middle">辦法</text>
  <text x="688" y="328" font-size="16" fill="#78716c" text-anchor="middle">有效</text>
  <rect x="28" y="372" width="744" height="90" rx="12" fill="#e8e6de"/>
