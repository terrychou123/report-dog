<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- Header (N=4) -->
  <rect x="50" y="50" width="700" height="76" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="400" y="89" font-size="22" fill="#1e293b" font-weight="700" text-anchor="middle" font-family="sans-serif">感染監測與通報流程</text>
  <text x="400" y="113" font-size="15" fill="#57534e" text-anchor="middle" font-family="sans-serif">B10 要求完整紀錄並依規定按時通報衛生主管機關</text>

  <!-- Row 1 -->
  <rect x="50" y="160" width="700" height="62" rx="8" fill="#ffffff"/>
  <rect x="50" y="160" width="6" height="62" rx="3" fill="#d97706"/>
  <circle cx="87" cy="191" r="16" fill="#d97706" opacity="0.15"/>
  <text x="87" y="197" font-size="16" fill="#d97706" font-weight="700" text-anchor="middle" font-family="sans-serif">1</text>
  <text x="120" y="182" font-size="16" fill="#1e293b" font-weight="700" font-family="sans-serif">每日體溫監測記錄</text>
  <text x="120" y="202" font-size="14" fill="#57534e" font-family="sans-serif">工作人員與服務對象每日至少量測 1 次體溫，完整記錄並按時上網登載</text>
  <rect x="620" y="167" width="115" height="46" rx="6" fill="#d97706" opacity="0.12"/>
  <text x="677" y="191" font-size="14" fill="#d97706" font-weight="700" text-anchor="middle" font-family="sans-serif">每日量測</text>
  <text x="677" y="207" font-size="13" fill="#d97706" text-anchor="middle" font-family="sans-serif">上網登載</text>

  <!-- Row 2 -->
  <rect x="50" y="235" width="700" height="62" rx="8" fill="#ffffff"/>
  <rect x="50" y="235" width="6" height="62" rx="3" fill="#78716c"/>
  <circle cx="87" cy="266" r="16" fill="#78716c" opacity="0.15"/>
  <text x="87" y="272" font-size="16" fill="#78716c" font-weight="700" text-anchor="middle" font-family="sans-serif">2</text>
  <text x="120" y="257" font-size="16" fill="#1e293b" font-weight="700" font-family="sans-serif">疑似感染個案評估與通報</text>
  <text x="120" y="277" font-size="14" fill="#57534e" font-family="sans-serif">發現疑似呼吸道/腸道/不明原因發燒個案，依通報辦法按時向衛生局通報</text>
  <rect x="620" y="242" width="115" height="46" rx="6" fill="#78716c" opacity="0.12"/>
  <text x="677" y="266" font-size="14" fill="#78716c" font-weight="700" text-anchor="middle" font-family="sans-serif">疑似通報</text>
  <text x="677" y="282" font-size="13" fill="#78716c" text-anchor="middle" font-family="sans-serif">按時完成</text>

  <!-- Row 3 -->
  <rect x="50" y="310" width="700" height="62" rx="8" fill="#ffffff"/>
  <rect x="50" y="310" width="6" height="62" rx="3" fill="#57534e"/>
  <circle cx="87" cy="341" r="16" fill="#57534e" opacity="0.15"/>
  <text x="87" y="347" font-size="16" fill="#57534e" font-weight="700" text-anchor="middle" font-family="sans-serif">3</text>
  <text x="120" y="332" font-size="16" fill="#1e293b" font-weight="700" font-family="sans-serif">群聚感染事件處理記錄</text>
  <text x="120" y="352" font-size="14" fill="#57534e" font-family="sans-serif">發生群聚事件時逐案分析、處置，完整記錄通知人員、動線清消、就醫安排</text>
  <rect x="620" y="317" width="115" height="46" rx="6" fill="#57534e" opacity="0.12"/>
  <text x="677" y="341" font-size="14" fill="#57534e" font-weight="700" text-anchor="middle" font-family="sans-serif">逐案分析</text>
  <text x="677" y="357" font-size="13" fill="#57534e" text-anchor="middle" font-family="sans-serif">處置記錄</text>

  <!-- Row 4 -->
  <rect x="50" y="385" width="700" height="62" rx="8" fill="#ffffff"/>
  <rect x="50" y="385" width="6" height="62" rx="3" fill="#a8a29e"/>
  <circle cx="87" cy="416" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="87" y="422" font-size="16" fill="#a8a29e" font-weight="700" text-anchor="middle" font-family="sans-serif">4</text>
  <text x="120" y="407" font-size="16" fill="#1e293b" font-weight="700" font-family="sans-serif">每季感染分析與改善</text>
  <text x="120" y="427" font-size="14" fill="#57534e" font-family="sans-serif">每季進行感染發生率統計分析，檢討防疫作為並修正標準作業流程</text>
  <rect x="620" y="392" width="115" height="46" rx="6" fill="#a8a29e" opacity="0.12"/>
  <text x="677" y="416" font-size="14" fill="#a8a29e" font-weight="700" text-anchor="middle" font-family="sans-serif">每季分析</text>
  <text x="677" y="432" font-size="13" fill="#a8a29e" text-anchor="middle" font-family="sans-serif">PDCA改善</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" font-family="sans-serif">報告汪 reportwang.com</text>
</svg>
