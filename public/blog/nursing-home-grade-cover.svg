  <rect x="216" y="308" width="140" height="44" rx="22" fill="#78716c"/>
  <text x="286" y="336"  font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">E2 最多加 3 分</text>
  <rect x="372" y="308" width="140" height="44" rx="22" fill="#57534e"/>
  <text x="442" y="336"  font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">E1 改善 80%+</text>
  <!-- 右側等第階梯 -->
  <rect x="730" y="150" width="390" height="320" rx="16" fill="#ffffff" opacity="0.5"/>
  <rect x="760" y="400" width="330" height="40" rx="8" fill="#a8a29e"/>
  <text x="925" y="426"  font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">合格（甲等）</text>
  <rect x="780" y="346" width="290" height="40" rx="8" fill="#78716c"/>
  <text x="925" y="372"  font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">良好（甲等上）</text>
  <rect x="810" y="292" width="230" height="40" rx="8" fill="#57534e"/>
  <text x="925" y="318"  font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">優良</text>
  <rect x="840" y="238" width="170" height="40" rx="8" fill="#d97706"/>
  <text x="925" y="264"  font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">優等</text>
  <text x="925" y="210"  font-size="36" fill="#d97706" text-anchor="middle">&#8593;</text>
  <text x="925" y="184"  font-size="18" fill="#d97706" text-anchor="middle">目標</text>
  <text x="60" y="430"  font-size="22" fill="#78716c">住宿型照顧機構評鑑準備系列</text>
  <text x="1140" y="590" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400" >報告汪 reportwang.com</text>
