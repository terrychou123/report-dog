  <text x="60" y="258"  font-size="24" fill="#57534e">9 項一級必要 × E1/E2 加分 × 二級加強項提升</text>
  <rect x="60" y="284" width="600" height="2" fill="#a8a29e"/>
  <rect x="60" y="308" width="140" height="44" rx="22" fill="#d97706"/>
