  <text x="66" y="217" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">AD</text>
  <text x="100" y="210" font-size="28" fill="#1e293b" font-weight="700">病人自主權利法與精神疾病</text>
  <text x="100" y="234" font-size="18" fill="#57534e">精神障礙者同樣有簽署 AD（預立醫療決定）的權利，機構需協助</text>
  <rect x="620" y="185" width="136" height="52" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="205" font-size="16" fill="#d97706" text-anchor="middle">AD</text>
  <text x="688" y="225" font-size="16" fill="#d97706" text-anchor="middle">協助</text>
  <rect x="28" y="269" width="744" height="90" rx="12" fill="#e8e6de"/>
  <rect x="28" y="269" width="6" height="90" rx="2" fill="#78716c"/>
  <circle cx="66" cy="314" r="20" fill="#78716c" opacity="0.15"/>
  <text x="66" y="320" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">計畫</text>
  <text x="100" y="313" font-size="28" fill="#1e293b" font-weight="700">安寧療護工作計畫需更新</text>
  <text x="100" y="337" font-size="18" fill="#57534e">計畫需反映修法後的病人自主精神，包含住民意願尊重的具體機制</text>
  <rect x="620" y="288" width="136" height="52" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="308" font-size="16" fill="#78716c" text-anchor="middle">計畫</text>
  <text x="688" y="328" font-size="16" fill="#78716c" text-anchor="middle">更新</text>
  <rect x="28" y="372" width="744" height="90" rx="12" fill="#e8e6de"/>
  <rect x="28" y="372" width="6" height="90" rx="2" fill="#57534e"/>
  <circle cx="66" cy="417" r="20" fill="#57534e" opacity="0.15"/>
  <text x="66" y="423" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">意願</text>
  <text x="100" y="416" font-size="28" fill="#1e293b" font-weight="700">每位住民都需有安寧意願記錄</text>
  <text x="100" y="440" font-size="18" fill="#57534e">表達同意、拒絕或尚未表達均需有記錄，有意願者需協助辦理</text>
  <rect x="620" y="391" width="136" height="52" rx="8" fill="#57534e" opacity="0.12"/>
