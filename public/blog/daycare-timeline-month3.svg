<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="450" fill="#f0efe8"/>
  <text x="400" y="46" font-size="21" font-weight="700" fill="#1e293b" text-anchor="middle">評鑑前第 3 個月：基礎建立 4 大任務</text>
  <rect x="60" y="58" width="48" height="3" rx="1.5" fill="#d97706"/>
  <line x1="116" y1="59.5" x2="740" y2="59.5" stroke="#dedad3" stroke-width="1"/>

  <!-- Month badge -->
  <rect x="52" y="78" width="120" height="52" rx="10" fill="#94a3b8" opacity="0.15"/>
  <text x="112" y="100" font-size="28" font-weight="900" fill="#94a3b8" text-anchor="middle">-3</text>
  <text x="112" y="120" font-size="13" fill="#78716c" text-anchor="middle">個月前</text>

  <text x="192" y="112" font-size="15" fill="#1e293b" font-weight="600">目標：完成文件盤點，建立改善清單</text>

  <!-- Task 1: 文件盤點 -->
  <rect x="52" y="152" width="335" height="120" rx="12" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="52" y="152" width="335" height="5" rx="2.5" fill="#d97706"/>
  <text x="76" y="180" font-size="15" fill="#1e293b" font-weight="700">任務一：文件全面盤點</text>
  <text x="76" y="198" font-size="13" fill="#57534e">依照評鑑基準逐條對照現有文件</text>
  <text x="76" y="222" font-size="12" fill="#78716c">□ 列出所有評鑑條文所需文件清單</text>
  <text x="76" y="240" font-size="12" fill="#78716c">□ 逐一核對文件是否存在且為本年度</text>
  <text x="76" y="258" font-size="12" fill="#78716c">□ 建立「有/缺/需更新」三欄缺口清單</text>

  <!-- Task 2: 教育訓練 -->
  <rect x="413" y="152" width="335" height="120" rx="12" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="413" y="152" width="335" height="5" rx="2.5" fill="#78716c"/>
  <text x="437" y="180" font-size="15" fill="#1e293b" font-weight="700">任務二：教育訓練計畫</text>
  <text x="437" y="198" font-size="13" fill="#57534e">確認人員訓練時數與記錄完整性</text>
  <text x="437" y="222" font-size="12" fill="#78716c">□ 年度教育訓練計畫書（主管核章）</text>
  <text x="437" y="240" font-size="12" fill="#78716c">□ 每人訓練時數達標（法定+機構內訓）</text>
  <text x="437" y="258" font-size="12" fill="#78716c">□ 訓練簽到單、測驗卷留存</text>

  <!-- Task 3: 督導機制 -->
  <rect x="52" y="290" width="335" height="110" rx="12" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="52" y="290" width="335" height="5" rx="2.5" fill="#a8a29e"/>
  <text x="76" y="318" font-size="15" fill="#1e293b" font-weight="700">任務三：督導紀錄補強</text>
  <text x="76" y="336" font-size="13" fill="#57534e">確保每名個案有督導紀錄可查</text>
  <text x="76" y="358" font-size="12" fill="#78716c">□ 個案督導頻率符合規定（每月/季）</text>
  <text x="76" y="376" font-size="12" fill="#78716c">□ 督導記錄格式含：日期、問題、對策</text>

  <!-- Task 4: 品管指標 -->
  <rect x="413" y="290" width="335" height="110" rx="12" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="413" y="290" width="335" height="5" rx="2.5" fill="#d6d3d1"/>
  <text x="437" y="318" font-size="15" fill="#1e293b" font-weight="700">任務四：品管指標確認</text>
  <text x="437" y="336" font-size="13" fill="#57534e">確認品管指標設定合規且有數據</text>
  <text x="437" y="358" font-size="12" fill="#78716c">□ 有自訂品管指標（≥2個）</text>
  <text x="437" y="376" font-size="12" fill="#78716c">□ 近3個月數據收集完整</text>

  <text x="760" y="421" font-size="16" fill="#c4bfb8" text-anchor="end" font-weight="400" font-family="'Noto Sans TC', sans-serif">報告汪 reportwang.com</text>
</svg>
