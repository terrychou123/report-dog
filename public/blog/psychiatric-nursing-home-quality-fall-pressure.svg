<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <rect x="0" y="50" width="800" height="76" fill="white"/>
  <rect x="0" y="50" width="6" height="76" rx="2" fill="#d97706"/>
  <text x="28" y="104" font-size="36" fill="#1e293b" font-weight="700">指標一跌倒與指標二壓傷計算方式</text>
  <rect x="28" y="175" width="744" height="130" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="175" width="6" height="130" rx="2" fill="#d97706"/>
  <circle cx="66" cy="235" r="20" fill="#d97706" opacity="0.15"/>
  <text x="66" y="241" font-size="18" fill="#d97706" text-anchor="middle" font-weight="900">跌倒</text>
  <text x="100" y="225" font-size="24" fill="#1e293b" font-weight="700">跌倒發生率</text>
  <text x="100" y="251" font-size="16" fill="#57534e">發生率（件/千人日）= 跌倒件次 ÷ 住民總住院日數 × 1000</text>
  <text x="100" y="271" font-size="16" fill="#57534e">依傷害分級：無傷害/輕微/中等（需醫療）/嚴重（需住院）</text>
  <text x="100" y="291" font-size="16" fill="#57534e">每月統計，有趨勢分析，超閾值有改善措施</text>
  <rect x="620" y="183" width="136" height="115" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="234" font-size="16" fill="#d97706" text-anchor="middle">件/千</text>
  <text x="688" y="254" font-size="16" fill="#d97706" text-anchor="middle">人日</text>
  <rect x="28" y="325" width="744" height="120" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="325" width="6" height="120" rx="2" fill="#78716c"/>
  <circle cx="66" cy="380" r="20" fill="#78716c" opacity="0.15"/>
  <text x="66" y="386" font-size="18" fill="#78716c" text-anchor="middle" font-weight="900">壓傷</text>
  <text x="100" y="370" font-size="24" fill="#1e293b" font-weight="700">壓力性損傷盛行率</text>
  <text x="100" y="396" font-size="16" fill="#57534e">盛行率（%）= 調查日有壓傷住民 ÷ 調查日在院住民總人數 × 100</text>
  <text x="100" y="416" font-size="16" fill="#57534e">區分院內新發 vs 院外帶入，第一期至第四期分別記錄</text>
  <rect x="620" y="333" width="136" height="105" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="381" font-size="16" fill="#78716c" text-anchor="middle">盛行率</text>
  <text x="688" y="401" font-size="16" fill="#78716c" text-anchor="middle">分期</text>
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
