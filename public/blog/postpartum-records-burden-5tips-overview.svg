<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- 標題列 -->
  <rect x="0" y="29" width="800" height="60" fill="#e8e6de"/>
  <rect x="0" y="29" width="6" height="60" rx="2" fill="#d97706"/>
  <text x="28" y="74" font-size="30" fill="#1e293b" font-weight="700">文書效率 5 招：省一半時間總覽</text>
  <!-- Row 1 -->
  <rect x="28" y="118" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="118" width="6" height="62" rx="2" fill="#d97706"/>
  <circle cx="66" cy="149" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="155" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <text x="100" y="146" font-size="20" fill="#1e293b" font-weight="700">建立「入住當日標準流程包」</text>
  <text x="100" y="167" font-size="16" fill="#57534e">整合所有入住必填記錄，勾選+數值+異常欄，30 分鐘完成入住記錄</text>
  <rect x="620" y="126" width="136" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="143" font-size="16" fill="#d97706" text-anchor="middle">B1.1</text>
  <text x="688" y="163" font-size="16" fill="#d97706" text-anchor="middle">入住評估</text>
  <!-- Row 2 -->
  <rect x="28" y="191" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="191" width="6" height="60" rx="2" fill="#78716c"/>
  <circle cx="66" cy="221" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="227" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <text x="100" y="218" font-size="20" fill="#1e293b" font-weight="700">EPDS 嵌入入住評估，不再是獨立表格</text>
  <text x="100" y="239" font-size="16" fill="#57534e">入住完成一次、出院前再評一次，三欄格式一目了然</text>
  <rect x="620" y="199" width="136" height="44" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="216" font-size="16" fill="#78716c" text-anchor="middle">B1.1</text>
  <text x="688" y="236" font-size="16" fill="#78716c" text-anchor="middle">情緒評估</text>
  <!-- Row 3 -->
  <rect x="28" y="264" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="264" width="6" height="60" rx="2" fill="#57534e"/>
  <circle cx="66" cy="294" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="300" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <text x="100" y="291" font-size="20" fill="#1e293b" font-weight="700">哺乳追蹤改為「指標式」每日格式</text>
  <text x="100" y="312" font-size="16" fill="#57534e">哺乳方式勾選 + 體重數值 + 頻率，每日填寫 2-3 分鐘</text>
  <rect x="620" y="272" width="136" height="44" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="289" font-size="16" fill="#57534e" text-anchor="middle">B1.7</text>
  <text x="688" y="309" font-size="16" fill="#57534e" text-anchor="middle">哺乳計畫</text>
  <!-- Row 4 -->
  <rect x="28" y="337" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="337" width="6" height="60" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="367" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="373" font-size="16" fill="#a8a29e" text-anchor="middle" font-weight="900">4</text>
  <text x="100" y="364" font-size="20" fill="#1e293b" font-weight="700">出院評估＋指導合為一張整合表</text>
  <text x="100" y="385" font-size="16" fill="#57534e">產婦評估、嬰兒評估、出院指導、家屬簽名一份文件搞定</text>
  <rect x="620" y="345" width="136" height="44" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="362" font-size="16" fill="#a8a29e" text-anchor="middle">B1.5</text>
  <text x="688" y="382" font-size="16" fill="#a8a29e" text-anchor="middle">出住院評估</text>
  <!-- Row 5 -->
  <rect x="28" y="410" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="410" width="6" height="60" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="440" r="16" fill="#94a3b8" opacity="0.15"/>
  <text x="66" y="446" font-size="16" fill="#94a3b8" text-anchor="middle" font-weight="900">5</text>
  <text x="100" y="437" font-size="20" fill="#1e293b" font-weight="700">母乳冰箱溫度記錄數位化或結構化</text>
  <text x="100" y="458" font-size="16" fill="#57534e">交班確認溫度 + 預印標籤貼紙，減少手動填寫與漏填</text>
  <rect x="620" y="418" width="136" height="44" rx="8" fill="#94a3b8" opacity="0.12"/>
  <text x="688" y="435" font-size="16" fill="#94a3b8" text-anchor="middle">B1.8</text>
  <text x="688" y="455" font-size="16" fill="#94a3b8" text-anchor="middle">母乳貯存</text>
  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
