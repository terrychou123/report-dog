  <!-- Card 2: 功能評估 -->
  <rect x="218" y="108" width="174" height="342" rx="12" fill="white"/>
  <rect x="218" y="108" width="174" height="8" rx="4" fill="#78716c"/>
  <rect x="218" y="112" width="174" height="4" fill="#78716c"/>
  <circle cx="305" cy="194" r="44" fill="#f5f5f4"/>
  <text x="305" y="183" text-anchor="middle" font-size="17" fill="#78716c" font-weight="700">STEP</text>
  <text x="305" y="211" text-anchor="middle" font-size="28" fill="#78716c" font-weight="700">02</text>
  <text x="305" y="297" text-anchor="middle" font-size="20" fill="#1e293b" font-weight="700">功能評估</text>
