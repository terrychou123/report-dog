<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', sans-serif">
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 裝飾線 -->
  <rect x="0" y="0" width="8" height="630" fill="#d97706"/>
  <rect x="0" y="0" width="1200" height="8" fill="#d97706"/>
  <!-- 右側角色圖 -->
  <rect x="820" y="70" width="340" height="500" rx="16" fill="#ffffff" opacity="0.55"/>
  <!-- 護理師角色方塊 -->
  <rect x="840" y="95" width="300" height="90" rx="8" fill="#d97706" opacity="0.9"/>
  <text x="990" y="132" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle">護理師</text>
  <text x="990" y="158" font-size="14" fill="#fff8e7" text-anchor="middle">個案計畫｜護理紀錄｜用藥管理</text>
  <!-- 社工師角色方塊 -->
  <rect x="840" y="205" width="300" height="90" rx="8" fill="#78716c" opacity="0.9"/>
  <text x="990" y="242" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle">社工師</text>
  <text x="990" y="268" font-size="14" fill="#e7e5e4" text-anchor="middle">心理評估｜家屬溝通｜資源連結</text>
  <!-- 照服員角色方塊 -->
  <rect x="840" y="315" width="300" height="90" rx="8" fill="#57534e" opacity="0.9"/>
  <text x="990" y="352" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle">照服員</text>
  <text x="990" y="378" font-size="14" fill="#e7e5e4" text-anchor="middle">日常照護｜翻身清潔｜活動協助</text>
  <!-- 協作工具方塊 -->
  <rect x="840" y="425" width="300" height="90" rx="8" fill="#94a3b8" opacity="0.9"/>
  <text x="990" y="462" font-size="18" fill="#1e293b" font-weight="700" text-anchor="middle">協作工具</text>
  <text x="990" y="488" font-size="14" fill="#1e293b" text-anchor="middle">報告汪多人協作平台</text>
  <!-- 主標題 -->
  <text x="80" y="170" font-size="50" fill="#1e293b" font-weight="700">多職種團隊如何分工準備評鑑？</text>
  <text x="80" y="238" font-size="34" fill="#d97706" font-weight="600">護理、社工、照服員的協作攻略</text>
  <!-- 副說明 -->
  <text x="80" y="308" font-size="22" fill="#57534e">對應 A9/A10/A11/A13/B5 評鑑基準</text>
  <text x="80" y="340" font-size="22" fill="#57534e">從各司其職到整合協作，評鑑準備不各打各的</text>
  <!-- 標籤 -->
  <rect x="80" y="395" width="120" height="36" rx="18" fill="#fef3c7"/>
  <text x="140" y="418" font-size="16" fill="#d97706" text-anchor="middle" font-weight="600">評鑑準備</text>
  <rect x="216" y="395" width="120" height="36" rx="18" fill="#fef3c7"/>
  <text x="276" y="418" font-size="16" fill="#d97706" text-anchor="middle" font-weight="600">多職種團隊</text>
  <rect x="352" y="395" width="120" height="36" rx="18" fill="#fef3c7"/>
  <text x="412" y="418" font-size="16" fill="#d97706" text-anchor="middle" font-weight="600">評鑑分工</text>
  <!-- 浮水印 -->
  <text x="1140" y="590" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
