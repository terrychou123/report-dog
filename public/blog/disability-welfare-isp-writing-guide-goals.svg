  <!-- R: Relevant cx=554 -->
  <rect x="484" y="108" width="140" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="484" y="108" width="140" height="8" rx="4" fill="#a8a29e"/>
  <rect x="484" y="112" width="140" height="4" fill="#a8a29e"/>
  <circle cx="554" cy="189" r="35" fill="#f5f5f4"/>
  <text x="554" y="183" text-anchor="middle" font-size="32" fill="#a8a29e" font-weight="900">R</text>
  <text x="554" y="205" text-anchor="middle" font-size="14" fill="#a8a29e">Relevant</text>
  <text x="554" y="275" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="700">具功能性</text>
