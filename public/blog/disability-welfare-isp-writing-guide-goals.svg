  <!-- A: Achievable cx=402 -->
  <rect x="332" y="108" width="140" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="332" y="108" width="140" height="8" rx="4" fill="#57534e"/>
