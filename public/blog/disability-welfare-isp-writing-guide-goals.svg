  <text x="98" y="205" text-anchor="middle" font-size="14" fill="#d97706">Specific</text>
  <text x="98" y="275" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="700">具體性</text>
  <text x="98" y="300" text-anchor="middle" font-size="14" fill="#57534e">明確指定</text>
  <text x="98" y="318" text-anchor="middle" font-size="14" fill="#57534e">行為動作</text>
  <text x="98" y="336" text-anchor="middle" font-size="14" fill="#57534e">和情境</text>
  <rect x="43" y="377" width="110" height="36" rx="18" fill="#fef3c7"/>
  <text x="98" y="401" text-anchor="middle" font-size="14" fill="#d97706" font-weight="600">指定行為</text>

  <!-- M: Measurable cx=250 -->
  <rect x="180" y="108" width="140" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="180" y="108" width="140" height="8" rx="4" fill="#78716c"/>
  <rect x="180" y="112" width="140" height="4" fill="#78716c"/>
  <circle cx="250" cy="189" r="35" fill="#f5f5f4"/>
