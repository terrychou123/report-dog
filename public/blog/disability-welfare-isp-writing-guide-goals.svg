  <text x="554" y="401" text-anchor="middle" font-size="14" fill="#1e293b" font-weight="600">功能導向</text>

  <!-- T: Time-bound cx=706 -->
  <rect x="636" y="108" width="140" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="636" y="108" width="140" height="8" rx="4" fill="#94a3b8"/>
  <rect x="636" y="112" width="140" height="4" fill="#94a3b8"/>
  <circle cx="706" cy="189" r="35" fill="#f1f5f9"/>
  <text x="706" y="183" text-anchor="middle" font-size="32" fill="#94a3b8" font-weight="900">T</text>
  <text x="706" y="205" text-anchor="middle" font-size="14" fill="#94a3b8">Time-bound</text>
  <text x="706" y="275" text-anchor="middle" font-size="18" fill="#1e293b" font-weight="700">有時限</text>
  <text x="706" y="300" text-anchor="middle" font-size="14" fill="#57534e">設定預計</text>
  <text x="706" y="318" text-anchor="middle" font-size="14" fill="#57534e">達成日期</text>
  <text x="706" y="336" text-anchor="middle" font-size="14" fill="#57534e">半年內</text>
  <rect x="651" y="377" width="110" height="36" rx="18" fill="#f1f5f9"/>
  <text x="706" y="401" text-anchor="middle" font-size="14" fill="#94a3b8" font-weight="600">時間設定</text>

  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
