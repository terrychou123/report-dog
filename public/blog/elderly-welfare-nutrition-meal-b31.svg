<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <text x="400" y="50" font-size="26" font-weight="700" fill="#1e293b" text-anchor="middle" font-family="sans-serif">B31 管灌護理：五大技術要點全解析</text>
  <text x="400" y="76" font-size="16" fill="#57534e" text-anchor="middle" font-family="sans-serif">評鑑委員可能現場觀察操作，技術與文件須同步符合規範</text>

  <!-- N=4, H=62, outer_gap=50 -->
  <!-- Row 1 (y=160) -->
  <rect x="40" y="110" width="720" height="62" rx="6" fill="#ffffff"/>
  <rect x="40" y="110" width="6" height="62" rx="3" fill="#d97706"/>
  <circle cx="74" cy="141" r="16" fill="#d97706" opacity="0.15"/>
  <text x="74" y="147" font-size="16" font-weight="700" fill="#d97706" text-anchor="middle" font-family="sans-serif">1</text>
  <text x="100" y="133" font-size="16" font-weight="700" fill="#1e293b" font-family="sans-serif">個別灌食空針（最常見缺失）</text>
  <text x="100" y="156" font-size="14" fill="#57534e" font-family="sans-serif">每位管灌住民有專屬空針，標示姓名，不可多人共用；每日消毒、定期更換</text>
  <rect x="596" y="119" width="136" height="46" rx="5" fill="#dc2626" opacity="0.1"/>
  <text x="664" y="138" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="600" font-family="sans-serif">⚠ 高頻缺失</text>
  <text x="664" y="157" font-size="13" fill="#dc2626" text-anchor="middle" font-family="sans-serif">床邊即查</text>

  <!-- Row 2 (y=235) -->
  <rect x="40" y="185" width="720" height="62" rx="6" fill="#ffffff"/>
  <rect x="40" y="185" width="6" height="62" rx="3" fill="#78716c"/>
  <circle cx="74" cy="216" r="16" fill="#78716c" opacity="0.15"/>
  <text x="74" y="222" font-size="16" font-weight="700" fill="#78716c" text-anchor="middle" font-family="sans-serif">2</text>
  <text x="100" y="208" font-size="16" font-weight="700" fill="#1e293b" font-family="sans-serif">非全商業配方：至少管灌一次天然食材</text>
  <text x="100" y="231" font-size="14" fill="#57534e" font-family="sans-serif">需有紀錄佐證定期提供天然食材（如果泥、米漿），並確保熱量足夠</text>
  <rect x="596" y="194" width="136" height="46" rx="5" fill="#78716c" opacity="0.1"/>
  <text x="664" y="213" font-size="13" fill="#78716c" text-anchor="middle" font-weight="600" font-family="sans-serif">熱量記錄</text>
  <text x="664" y="232" font-size="13" fill="#78716c" text-anchor="middle" font-family="sans-serif">天然食材</text>

  <!-- Row 3 (y=310) -->
  <rect x="40" y="260" width="720" height="62" rx="6" fill="#ffffff"/>
  <rect x="40" y="260" width="6" height="62" rx="3" fill="#57534e"/>
  <circle cx="74" cy="291" r="16" fill="#57534e" opacity="0.15"/>
  <text x="74" y="297" font-size="16" font-weight="700" fill="#57534e" text-anchor="middle" font-family="sans-serif">3</text>
  <text x="100" y="283" font-size="16" font-weight="700" fill="#1e293b" font-family="sans-serif">灌食技術四項正確</text>
  <text x="100" y="306" font-size="14" fill="#57534e" font-family="sans-serif">①管路位置確認 ②回抽（確認胃殘餘量）③高度正確 ④流速適當，四項缺一不可</text>
  <rect x="596" y="269" width="136" height="46" rx="5" fill="#57534e" opacity="0.1"/>
  <text x="664" y="288" font-size="13" fill="#57534e" text-anchor="middle" font-weight="600" font-family="sans-serif">現場抽測</text>
  <text x="664" y="307" font-size="13" fill="#57534e" text-anchor="middle" font-family="sans-serif">技術操作</text>

  <!-- Row 4 (y=385) -->
  <rect x="40" y="335" width="720" height="62" rx="6" fill="#ffffff"/>
  <rect x="40" y="335" width="6" height="62" rx="3" fill="#a8a29e"/>
  <circle cx="74" cy="366" r="16" fill="#a8a29e" opacity="0.2"/>
  <text x="74" y="372" font-size="16" font-weight="700" fill="#a8a29e" text-anchor="middle" font-family="sans-serif">4</text>
  <text x="100" y="358" font-size="16" font-weight="700" fill="#1e293b" font-family="sans-serif">灌食後頭頸抬高 30-45 度維持</text>
  <text x="100" y="381" font-size="14" fill="#57534e" font-family="sans-serif">灌食後維持頭頸部抬高 30-45 度，直至規定時間（60 分鐘以內）；灌食前需打招呼</text>
  <rect x="596" y="344" width="136" height="46" rx="5" fill="#a8a29e" opacity="0.15"/>
  <text x="664" y="363" font-size="13" fill="#78716c" text-anchor="middle" font-weight="600" font-family="sans-serif">時間記錄</text>
  <text x="664" y="382" font-size="13" fill="#78716c" text-anchor="middle" font-family="sans-serif">姿勢確認</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" font-family="sans-serif">報告汪 reportwang.com</text>
</svg>
