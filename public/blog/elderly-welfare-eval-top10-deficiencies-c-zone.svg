<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 警示標題背景 -->
  <rect x="60" y="20" width="680" height="64" rx="12" fill="#dc2626" opacity="0.1"/>
  <text x="400" y="40" font-size="22" font-weight="700" fill="#dc2626" text-anchor="middle" >C 區一級必要指標：任一未達標即評鑑不通過</text>
  <text x="400" y="66" font-size="16" fill="#dc2626" text-anchor="middle" >C4 / C9 / C10 / C11 / C12 / C15 共 6 項，全部必須達標</text>

  <!-- 列1：C4 緊急呼叫 -->
  <rect x="60" y="110" width="680" height="86" rx="10" fill="white"/>
  <rect x="60" y="110" width="6" height="86" rx="3" fill="#dc2626"/>
  <circle cx="94" cy="153" r="16" fill="#dc2626"/>
  <text x="94" y="159" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="700" >C4</text>
  <text x="125" y="141" font-size="20" font-weight="700" fill="#1e293b" >C4 寢室及浴廁緊急呼叫系統</text>
  <text x="125" y="165" font-size="15" fill="#57534e" >浴室、廁所、寢室均需設置；功能正常且位置適當</text>
  <text x="125" y="185" font-size="15" fill="#57534e" >按鈴後服務人員須能立即反應處理</text>
  <rect x="612" y="122" width="112" height="46" rx="8" fill="#dc2626" opacity="0.12"/>
  <text x="668" y="150" font-size="16" font-weight="700" fill="#dc2626" text-anchor="middle" >一級必要</text>

  <!-- 列2：C9/C10 消防疏散 -->
  <rect x="60" y="212" width="680" height="86" rx="10" fill="white"/>
  <rect x="60" y="212" width="6" height="86" rx="2" fill="#d97706"/>
  <circle cx="94" cy="255" r="16" fill="#d97706" opacity="0.15"/>
  <text x="94" y="261" font-size="12" fill="#d97706" text-anchor="middle" font-weight="700" >C9/10</text>
  <text x="125" y="243" font-size="20" font-weight="700" fill="#1e293b" >C9 消防設備 + C10 疏散避難系統</text>
  <text x="125" y="267" font-size="15" fill="#57534e" >每半年委託消防設備師檢修申報；走道防火門保持暢通</text>
  <text x="125" y="287" font-size="15" fill="#57534e" >安全梯 + 兩個避難途徑；防火門往避難方向開啟</text>
  <rect x="612" y="224" width="112" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="668" y="252" font-size="16" font-weight="700" fill="#d97706" text-anchor="middle" >一級必要</text>

  <!-- 列3：C11/C12 演練逃生圖 -->
  <rect x="60" y="314" width="680" height="86" rx="10" fill="white"/>
  <rect x="60" y="314" width="6" height="86" rx="2" fill="#78716c"/>
  <circle cx="94" cy="357" r="16" fill="#78716c" opacity="0.15"/>
  <text x="94" y="363" font-size="12" fill="#78716c" text-anchor="middle" font-weight="700" >C11/12</text>
  <text x="125" y="345" font-size="20" font-weight="700" fill="#1e293b" >C11 演練計畫 + C12 逃生圖張貼</text>
  <text x="125" y="369" font-size="15" fill="#57534e" >每年至少複合型演練 1 次 + 夜間演練 1 次；有演練後檢討紀錄</text>
  <text x="125" y="389" font-size="15" fill="#57534e" >各樓層出入口張貼 A3 以上逃生圖；標示所在位置方向</text>
  <rect x="612" y="326" width="112" height="46" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="668" y="354" font-size="16" font-weight="700" fill="#78716c" text-anchor="middle" >一級必要</text>

  <!-- C15 提示 -->
  <rect x="60" y="418" width="680" height="44" rx="8" fill="#dc2626" opacity="0.08"/>
  <text x="400" y="445" font-size="16" fill="#dc2626" text-anchor="middle" >C15 護理站急救設備亦為一級必要：每層設置、氧氣瓶在效期內、急救藥品齊備</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" >報告汪 reportwang.com</text>
</svg>
