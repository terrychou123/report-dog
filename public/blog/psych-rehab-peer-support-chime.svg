<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- Header（y=29, h=60，N=5 outer_gap=29） -->
  <rect x="0" y="29" width="800" height="60" fill="white"/>
  <rect x="0" y="29" width="6" height="60" fill="#7c3aed"/>
  <!-- 11字 → 36px，text_y≈74 -->
  <text x="28" y="74" font-size="36" fill="#1e293b" font-weight="700">CHIME 個人復元五元素</text>

  <!-- Row 1：Connectedness（amber #d97706），y=118，H=60 -->
  <rect x="28" y="118" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="118" width="6" height="60" rx="2" fill="#d97706"/>
  <circle cx="66" cy="148" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="154" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">C</text>
  <text x="100" y="144" font-size="20" fill="#1e293b" font-weight="700">Connectedness 連結感</text>
  <text x="100" y="164" font-size="16" fill="#57534e">與機構、同儕、社區建立有意義的連結關係</text>
  <rect x="620" y="126" width="136" height="44" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="143" font-size="16" fill="#d97706" text-anchor="middle">連結感</text>
  <text x="688" y="163" font-size="16" fill="#d97706" text-anchor="middle">社區融合</text>

  <!-- Row 2：Hope（stone-500 #78716c），y=191 -->
  <rect x="28" y="191" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="191" width="6" height="60" rx="2" fill="#78716c"/>
  <circle cx="66" cy="221" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="227" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">H</text>
  <text x="100" y="217" font-size="20" fill="#1e293b" font-weight="700">Hope 希望感</text>
  <text x="100" y="237" font-size="16" fill="#57534e">對自己的復元旅程抱持正向期待與信心</text>
  <rect x="620" y="199" width="136" height="44" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="216" font-size="16" fill="#78716c" text-anchor="middle">希望感</text>
  <text x="688" y="236" font-size="16" fill="#78716c" text-anchor="middle">復元動力</text>

  <!-- Row 3：Identity（stone-600 #57534e），y=264 -->
  <rect x="28" y="264" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="264" width="6" height="60" rx="2" fill="#57534e"/>
  <circle cx="66" cy="294" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="300" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">I</text>
  <text x="100" y="290" font-size="20" fill="#1e293b" font-weight="700">Identity 身份認同</text>
  <text x="100" y="310" font-size="16" fill="#57534e">建立超越疾病標籤的正向自我認同與角色</text>
  <rect x="620" y="272" width="136" height="44" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="289" font-size="16" fill="#57534e" text-anchor="middle">認同感</text>
  <text x="688" y="309" font-size="16" fill="#57534e" text-anchor="middle">去標籤化</text>

  <!-- Row 4：Meaning（stone-400 #a8a29e），y=337 -->
  <rect x="28" y="337" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="337" width="6" height="60" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="367" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="373" font-size="16" fill="#a8a29e" text-anchor="middle" font-weight="900">M</text>
  <text x="100" y="363" font-size="20" fill="#1e293b" font-weight="700">Meaning 生命意義</text>
  <text x="100" y="383" font-size="16" fill="#57534e">在生活角色與日常活動中找到生命的意義</text>
  <rect x="620" y="345" width="136" height="44" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="362" font-size="16" fill="#a8a29e" text-anchor="middle">意義感</text>
  <text x="688" y="382" font-size="16" fill="#a8a29e" text-anchor="middle">目標導向</text>

  <!-- Row 5：Empowerment（slate-400 #94a3b8），y=410 -->
  <rect x="28" y="410" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="410" width="6" height="60" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="440" r="16" fill="#94a3b8" opacity="0.15"/>
  <text x="66" y="446" font-size="16" fill="#94a3b8" text-anchor="middle" font-weight="900">E</text>
  <text x="100" y="436" font-size="20" fill="#1e293b" font-weight="700">Empowerment 賦能</text>
  <text x="100" y="456" font-size="16" fill="#57534e">主動參與決策，掌控自己的生活方向與選擇</text>
  <rect x="620" y="418" width="136" height="44" rx="8" fill="#94a3b8" opacity="0.12"/>
  <text x="688" y="435" font-size="16" fill="#94a3b8" text-anchor="middle">賦能感</text>
  <text x="688" y="455" font-size="16" fill="#94a3b8" text-anchor="middle">自主決策</text>

  <!-- 浮水印 -->
  <text x="760" y="487" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
