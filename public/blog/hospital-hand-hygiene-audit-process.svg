<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題 -->
  <text x="400" y="48" text-anchor="middle" font-size="30" fill="#1e293b" font-weight="700">標準化手部衛生稽核執行流程</text>
  <text x="400" y="76" text-anchor="middle" font-size="20" fill="#57534e">直接觀察法是唯一被認可的稽核方式</text>
  <line x1="28" y1="92" x2="772" y2="92" stroke="#dedad3" stroke-width="1"/>

  <!-- N=4 flow：card_w=174, arrow_gap=16 -->
  <!-- card[0]: x=28  cx=115 -->
  <!-- card[1]: x=218 cx=305 -->
  <!-- card[2]: x=408 cx=495 -->
  <!-- card[3]: x=598 cx=685 -->

  <!-- 箭頭 arrow_y=279 -->
  <line x1="202" y1="279" x2="218" y2="279" stroke="#c4bfb8" stroke-width="2"/>
  <polygon points="202,273 218,279 202,285" fill="#c4bfb8"/>
  <line x1="392" y1="279" x2="408" y2="279" stroke="#c4bfb8" stroke-width="2"/>
  <polygon points="392,273 408,279 392,285" fill="#c4bfb8"/>
  <line x1="582" y1="279" x2="598" y2="279" stroke="#c4bfb8" stroke-width="2"/>
  <polygon points="582,273 598,279 582,285" fill="#c4bfb8"/>

  <!-- Step 01：稽核員訓練 (#d97706) x=28 cx=115 -->
  <rect x="28" y="108" width="174" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="108" width="174" height="8" rx="4" fill="#d97706"/>
  <rect x="28" y="112" width="174" height="4" fill="#d97706"/>
  <circle cx="115" cy="194" r="44" fill="#fef3c7"/>
  <text x="115" y="183" text-anchor="middle" font-size="17" fill="#d97706" font-weight="700">STEP</text>
  <text x="115" y="212" text-anchor="middle" font-size="28" fill="#d97706" font-weight="700">01</text>
  <text x="115" y="295" text-anchor="middle" font-size="26" fill="#1e293b" font-weight="700">稽核員</text>
  <text x="115" y="318" text-anchor="middle" font-size="26" fill="#1e293b" font-weight="700">訓練</text>
  <text x="115" y="342" text-anchor="middle" font-size="17" fill="#57534e">認識五大時機</text>
  <text x="115" y="362" text-anchor="middle" font-size="17" fill="#57534e">稽核表使用方式</text>
  <rect x="40" y="381" width="150" height="36" rx="18" fill="#fef3c7"/>
  <text x="115" y="405" text-anchor="middle" font-size="16" fill="#d97706" font-weight="600">多名種子稽核員</text>

  <!-- Step 02：直接觀察 (#78716c) x=218 cx=305 -->
  <rect x="218" y="108" width="174" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="218" y="108" width="174" height="8" rx="4" fill="#78716c"/>
  <rect x="218" y="112" width="174" height="4" fill="#78716c"/>
  <circle cx="305" cy="194" r="44" fill="#f5f5f4"/>
  <text x="305" y="183" text-anchor="middle" font-size="17" fill="#78716c" font-weight="700">STEP</text>
  <text x="305" y="212" text-anchor="middle" font-size="28" fill="#78716c" font-weight="700">02</text>
  <text x="305" y="295" text-anchor="middle" font-size="26" fill="#1e293b" font-weight="700">直接觀察</text>
  <text x="305" y="318" text-anchor="middle" font-size="26" fill="#1e293b" font-weight="700">不預告</text>
  <text x="305" y="342" text-anchor="middle" font-size="17" fill="#57534e">不定時交叉稽核</text>
  <text x="305" y="362" text-anchor="middle" font-size="17" fill="#57534e">記錄每次觀察</text>
  <rect x="230" y="381" width="150" height="36" rx="18" fill="#f5f5f4"/>
  <text x="305" y="405" text-anchor="middle" font-size="16" fill="#78716c" font-weight="600">避免霍桑效應</text>

  <!-- Step 03：數據分析 (#57534e) x=408 cx=495 -->
  <rect x="408" y="108" width="174" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="408" y="108" width="174" height="8" rx="4" fill="#57534e"/>
  <rect x="408" y="112" width="174" height="4" fill="#57534e"/>
  <circle cx="495" cy="194" r="44" fill="#f5f0eb"/>
  <text x="495" y="183" text-anchor="middle" font-size="17" fill="#57534e" font-weight="700">STEP</text>
  <text x="495" y="212" text-anchor="middle" font-size="28" fill="#57534e" font-weight="700">03</text>
  <text x="495" y="295" text-anchor="middle" font-size="26" fill="#1e293b" font-weight="700">數據分析</text>
  <text x="495" y="318" text-anchor="middle" font-size="26" fill="#1e293b" font-weight="700">分層檢視</text>
  <text x="495" y="342" text-anchor="middle" font-size="17" fill="#57534e">依病房/班次分析</text>
  <text x="495" y="362" text-anchor="middle" font-size="17" fill="#57534e">找出最薄弱環節</text>
  <rect x="420" y="381" width="150" height="36" rx="18" fill="#f5f0eb"/>
  <text x="495" y="405" text-anchor="middle" font-size="16" fill="#57534e" font-weight="600">趨勢報告有基準</text>

  <!-- Step 04：改善回饋 (#a8a29e) x=598 cx=685 -->
  <rect x="598" y="108" width="174" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="598" y="108" width="174" height="8" rx="4" fill="#a8a29e"/>
  <rect x="598" y="112" width="174" height="4" fill="#a8a29e"/>
  <circle cx="685" cy="194" r="44" fill="#f5f5f4"/>
  <text x="685" y="183" text-anchor="middle" font-size="17" fill="#a8a29e" font-weight="700">STEP</text>
  <text x="685" y="212" text-anchor="middle" font-size="28" fill="#a8a29e" font-weight="700">04</text>
  <text x="685" y="295" text-anchor="middle" font-size="26" fill="#1e293b" font-weight="700">改善回饋</text>
  <text x="685" y="318" text-anchor="middle" font-size="26" fill="#1e293b" font-weight="700">結果公開</text>
  <text x="685" y="342" text-anchor="middle" font-size="17" fill="#57534e">公布各病房執行率</text>
  <text x="685" y="362" text-anchor="middle" font-size="17" fill="#57534e">改善計畫追蹤</text>
  <rect x="610" y="381" width="150" height="36" rx="18" fill="#f5f5f4"/>
  <text x="685" y="405" text-anchor="middle" font-size="16" fill="#a8a29e" font-weight="600">透明化促改善</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
