<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"
     font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- Header（y=50, h=76）-->
  <rect x="0" y="50" width="800" height="76" fill="white"/>
  <rect x="0" y="50" width="6" height="76" fill="#d97706" rx="2"/>
  <text x="28" y="104" font-size="36" fill="#1e293b" font-weight="700">7 個技巧對應評鑑條文</text>

  <!-- ===== Row 1（y=160）#d97706 技巧 1–2 ===== -->
  <rect x="28" y="160" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="160" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="66" cy="191" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="197" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <text x="100" y="188" font-size="20" fill="#1e293b" font-weight="700">技巧 1–2：情緒同理與活動轉移</text>
  <text x="100" y="208" font-size="16" fill="#57534e">對應第 6 條「失智照顧技術」—— 展示工作人員具備失智照護專業知識</text>
  <rect x="620" y="168" width="136" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="187" font-size="16" fill="#d97706" text-anchor="middle">第 6 條</text>
  <text x="688" y="207" font-size="16" fill="#d97706" text-anchor="middle">失智照顧</text>

  <!-- ===== Row 2（y=235）#78716c 技巧 3 ===== -->
  <rect x="28" y="235" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="235" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="66" cy="266" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="272" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <text x="100" y="263" font-size="20" fill="#1e293b" font-weight="700">技巧 3：個別化懷舊活動轉移</text>
  <text x="100" y="283" font-size="16" fill="#57534e">對應第 9 條「服務活動計畫」—— 展示活動規劃有個別性考量與生命史應用</text>
  <rect x="620" y="243" width="136" height="46" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="262" font-size="16" fill="#78716c" text-anchor="middle">第 9 條</text>
  <text x="688" y="282" font-size="16" fill="#78716c" text-anchor="middle">服務活動</text>

  <!-- ===== Row 3（y=310）#57534e 技巧 4–5 ===== -->
  <rect x="28" y="310" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="310" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="341" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="347" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <text x="100" y="338" font-size="20" fill="#1e293b" font-weight="700">技巧 4–5：需求評估與照護調整</text>
  <text x="100" y="358" font-size="16" fill="#57534e">對應第 4 條「個案照護記錄」—— 展示照護計畫有動態調整與潛在需求回應</text>
  <rect x="620" y="318" width="136" height="46" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="337" font-size="16" fill="#57534e" text-anchor="middle">第 4 條</text>
  <text x="688" y="357" font-size="16" fill="#57534e" text-anchor="middle">個案記錄</text>

  <!-- ===== Row 4（y=385）#a8a29e 技巧 6–7 ===== -->
  <rect x="28" y="385" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="385" width="6" height="62" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="416" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="422" font-size="16" fill="#a8a29e" text-anchor="middle" font-weight="900">4</text>
  <text x="100" y="413" font-size="20" fill="#1e293b" font-weight="700">技巧 6–7：安全看視與追蹤評值</text>
  <text x="100" y="433" font-size="16" fill="#57534e">對應第 3 條「安全環境設備」—— 展示走失預防措施與事件追蹤記錄機制</text>
  <rect x="620" y="393" width="136" height="46" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="412" font-size="16" fill="#a8a29e" text-anchor="middle">第 3 條</text>
  <text x="688" y="432" font-size="16" fill="#a8a29e" text-anchor="middle">安全環境</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
