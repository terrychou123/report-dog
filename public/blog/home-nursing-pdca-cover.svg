  <text x="60" y="190" font-size="100" font-weight="900" fill="#1e293b">照護計畫</text>
  <text x="60" y="318" font-size="100" font-weight="900" fill="#d97706">PDCA 撰寫指引</text>

  <line x1="60" y1="348" x2="780" y2="348" stroke="#dedad3" stroke-width="2"/>

  <text x="60" y="400" font-size="36" fill="#57534e" font-weight="400">從照護計畫到品質指標的 PDCA 實踐</text>

  <!-- 特色標籤列 -->
