<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <text x="400" y="48"  font-size="32" font-weight="700" fill="#1e293b" text-anchor="middle">Plan 計畫階段</text>
  <text x="400" y="78"  font-size="22" fill="#78716c" text-anchor="middle">三步驟確認缺失根本原因與改善方向</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#a8a29e" stroke-width="1.5"/>
  <!-- P 標籤 -->
  <rect x="40" y="110" width="64" height="64" rx="32" fill="#d97706"/>
  <text x="72" y="153"  font-size="32" font-weight="700" fill="#ffffff" text-anchor="middle">P</text>
  <!-- 步驟1 -->
  <rect x="130" y="118" width="610" height="88" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <rect x="130" y="118" width="6" height="88" rx="2" fill="#d97706"/>
  <text x="160" y="156"  font-size="20" font-weight="700" fill="#d97706">1. 分類缺失性質</text>
  <text x="160" y="182"  font-size="16" fill="#57534e">文件缺漏 / 流程不符 / 設備問題 / 人員執行落差</text>
  <!-- 步驟2 -->
  <rect x="130" y="226" width="610" height="88" rx="10" fill="#ffffff" stroke="#78716c" stroke-width="2"/>
  <rect x="130" y="226" width="6" height="88" rx="2" fill="#78716c"/>
  <text x="160" y="264"  font-size="20" font-weight="700" fill="#78716c">2. 確認根本原因</text>
  <text x="160" y="290"  font-size="16" fill="#57534e">避免只處理表面問題，追溯人力、流程或訓練層面的根源</text>
  <!-- 步驟3 -->
  <rect x="130" y="334" width="610" height="88" rx="10" fill="#ffffff" stroke="#57534e" stroke-width="2"/>
  <rect x="130" y="334" width="6" height="88" rx="2" fill="#57534e"/>
  <text x="160" y="372"  font-size="20" font-weight="700" fill="#57534e">3. 訂定可量化目標</text>
  <text x="160" y="398"  font-size="16" fill="#57534e">「改善率降至 0%，3 個月內完成全員訓練」</text>
  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" >報告汪 reportwang.com</text>
</svg>
