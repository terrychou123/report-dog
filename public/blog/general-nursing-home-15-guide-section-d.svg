<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <text x="40" y="48" font-size="32" fill="#1e293b" font-weight="700">D 區：特別事項 3 項說明</text>
  <text x="40" y="76" font-size="22" fill="#57534e">D1 加分 · D2 口腔新重點 · D3 試評扣分紅線</text>
  <line x1="40" y1="92" x2="760" y2="92" stroke="#7c3aed" stroke-width="2"/>

  <!-- D1 -->
  <rect x="40" y="112" width="228" height="310" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="40" y="112" width="228" height="48" rx="12" fill="#7c3aed"/>
  <rect x="40" y="136" width="228" height="24" fill="#7c3aed"/>
  <text x="154" y="142" font-size="18" fill="#fff" font-weight="700" text-anchor="middle">D1 創新配合政策</text>
  <text x="154" y="162" font-size="14" fill="#e9d5ff" text-anchor="middle">加分項 · 等第提升關鍵</text>
  <text x="56" y="190" font-size="14" fill="#57534e" font-weight="600">小機構適合的加分方向：</text>
  <text x="56" y="212" font-size="14" fill="#57534e">• 建立電子化照護記錄</text>
  <text x="56" y="232" font-size="14" fill="#57534e">• 參與衛生局品質促進計畫</text>
  <text x="56" y="252" font-size="14" fill="#57534e">• 推動住民口腔健康促進</text>
  <text x="56" y="272" font-size="14" fill="#57534e">• 護理師地區研討會分享</text>
  <text x="56" y="300" font-size="14" fill="#7c3aed" font-weight="600">關鍵：有做要留書面記錄</text>
  <text x="56" y="320" font-size="14" fill="#57534e">創新不需要高科技</text>
  <text x="56" y="340" font-size="14" fill="#57534e">有做·有記錄·有成效</text>
  <text x="56" y="360" font-size="14" fill="#57534e">= 加分機會</text>

  <!-- D2 -->
  <rect x="286" y="112" width="228" height="310" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="286" y="112" width="228" height="48" rx="12" fill="#7c3aed"/>
  <rect x="286" y="136" width="228" height="24" fill="#7c3aed"/>
  <text x="400" y="142" font-size="18" fill="#fff" font-weight="700" text-anchor="middle">D2 口腔健康照護</text>
  <text x="400" y="162" font-size="14" fill="#e9d5ff" text-anchor="middle">115年新增 · 系統性要求</text>
  <text x="302" y="190" font-size="14" fill="#57534e" font-weight="600">四項必備：</text>
  <text x="302" y="212" font-size="14" fill="#57534e">① 定期口腔健康評估</text>
  <text x="302" y="232" font-size="14" fill="#57534e">② 工作人員口腔照護訓練</text>
  <text x="302" y="252" font-size="14" fill="#57534e">③ 每日口腔清潔執行記錄</text>
  <text x="302" y="272" font-size="14" fill="#57534e">④ 牙科轉介機制名單</text>
  <text x="302" y="302" font-size="14" fill="#dc2626" font-weight="600">⚠ 最常見缺失：</text>
  <text x="302" y="322" font-size="14" fill="#dc2626">只有打勾無觀察記錄</text>
  <text x="302" y="342" font-size="14" fill="#dc2626">沒有牙科合作名單</text>

  <!-- D3 -->
  <rect x="532" y="112" width="228" height="310" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <rect x="532" y="112" width="228" height="48" rx="12" fill="#dc2626"/>
  <rect x="532" y="136" width="228" height="24" fill="#dc2626"/>
  <text x="646" y="142" font-size="18" fill="#fff" font-weight="700" text-anchor="middle">D3 重大異常情事</text>
  <text x="646" y="162" font-size="14" fill="#fee2e2" text-anchor="middle">試評扣分 · 紅線勿碰</text>
  <text x="548" y="190" font-size="14" fill="#57534e" font-weight="600">四大紅線：</text>
  <text x="548" y="212" font-size="14" fill="#57534e">① 重大醫療事故未通報</text>
  <text x="548" y="232" font-size="14" fill="#57534e">② 違法（超收費/違規廣告）</text>
  <text x="548" y="252" font-size="14" fill="#57534e">③ 住民人權侵害事件</text>
  <text x="548" y="272" font-size="14" fill="#57534e">④ 評鑑提供不實資料</text>
  <text x="548" y="302" font-size="14" fill="#dc2626" font-weight="600">影響評鑑等第</text>
  <text x="548" y="324" font-size="14" fill="#57534e">確認通報流程完整</text>
  <text x="548" y="344" font-size="14" fill="#57534e">工作人員熟知規定</text>
  <text x="548" y="364" font-size="14" fill="#57534e">定期宣導住民人權</text>

  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
