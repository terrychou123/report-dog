<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <rect x="0" y="50" width="800" height="76" fill="white"/>
  <rect x="0" y="50" width="6" height="76" rx="2" fill="#d97706"/>
  <text x="28" y="104" font-size="36" fill="#1e293b" font-weight="700">約束的兩大定義類型</text>
  <rect x="28" y="175" width="744" height="130" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="175" width="6" height="130" rx="2" fill="#d97706"/>
  <circle cx="66" cy="230" r="20" fill="#d97706" opacity="0.15"/>
  <text x="66" y="236" font-size="18" fill="#d97706" text-anchor="middle" font-weight="900">身體</text>
  <text x="100" y="220" font-size="24" fill="#1e293b" font-weight="700">身體約束</text>
  <text x="100" y="248" font-size="16" fill="#57534e">使用任何物理方法或器具（約束帶、手套、背心、護欄等）</text>
  <text x="100" y="268" font-size="16" fill="#57534e">限制住民肢體自由移動，且住民本身無法輕易移除</text>
  <text x="100" y="288" font-size="16" fill="#57534e">注意：翻起的床護欄若住民無法自行放下，也屬約束</text>
  <rect x="620" y="183" width="136" height="115" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="234" font-size="16" fill="#d97706" text-anchor="middle">器具</text>
  <text x="688" y="254" font-size="16" fill="#d97706" text-anchor="middle">限制</text>
  <rect x="28" y="325" width="744" height="120" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="325" width="6" height="120" rx="2" fill="#78716c"/>
  <circle cx="66" cy="380" r="20" fill="#78716c" opacity="0.15"/>
  <text x="66" y="386" font-size="18" fill="#78716c" text-anchor="middle" font-weight="900">環境</text>
  <text x="100" y="370" font-size="24" fill="#1e293b" font-weight="700">環境約束</text>
  <text x="100" y="396" font-size="16" fill="#57534e">使用關閉的門或隔離空間，限制住民自由進出的能力</text>
  <text x="100" y="416" font-size="16" fill="#57534e">住民不能自由離開的封閉空間即屬於環境約束</text>
  <rect x="620" y="333" width="136" height="105" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="383" font-size="16" fill="#78716c" text-anchor="middle">空間</text>
  <text x="688" y="403" font-size="16" fill="#78716c" text-anchor="middle">限制</text>
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
