<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <rect x="0" y="50" width="800" height="76" fill="white"/>
  <rect x="0" y="50" width="6" height="76" rx="2" fill="#d97706"/>
  <text x="28" y="104" font-size="36" fill="#1e293b" font-weight="700">子項三：三讀五對的定義與記錄要求</text>
  <rect x="28" y="175" width="744" height="130" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="175" width="6" height="130" rx="2" fill="#d97706"/>
  <circle cx="66" cy="235" r="20" fill="#d97706" opacity="0.15"/>
  <text x="66" y="241" font-size="18" fill="#d97706" text-anchor="middle" font-weight="900">三讀</text>
  <text x="100" y="225" font-size="22" fill="#1e293b" font-weight="700">三讀：三個時間點核對</text>
  <text x="100" y="253" font-size="16" fill="#57534e">第一讀：取藥時（從藥品儲存處取出時核對）</text>
  <text x="100" y="273" font-size="16" fill="#57534e">第二讀：準備給藥時（配藥前核對）</text>
  <text x="100" y="293" font-size="16" fill="#57534e">第三讀：給藥後歸還時（藥品歸位時核對）</text>
  <rect x="620" y="183" width="136" height="115" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="234" font-size="16" fill="#d97706" text-anchor="middle">三個</text>
  <text x="688" y="254" font-size="16" fill="#d97706" text-anchor="middle">時間點</text>
  <rect x="28" y="325" width="744" height="120" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="325" width="6" height="120" rx="2" fill="#78716c"/>
  <circle cx="66" cy="380" r="20" fill="#78716c" opacity="0.15"/>
  <text x="66" y="386" font-size="18" fill="#78716c" text-anchor="middle" font-weight="900">五對</text>
  <text x="100" y="370" font-size="22" fill="#1e293b" font-weight="700">五對：每次核對五個要素</text>
  <text x="100" y="396" font-size="16" fill="#57534e">對的住民、對的藥品（名稱）、對的劑量、對的時間、對的給藥途徑</text>
  <text x="100" y="416" font-size="16" fill="#57534e">委員現場訪談護理人員：「請說明三讀五對」是常見考題</text>
  <rect x="620" y="333" width="136" height="105" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="381" font-size="16" fill="#78716c" text-anchor="middle">五個</text>
  <text x="688" y="401" font-size="16" fill="#78716c" text-anchor="middle">要素</text>
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
