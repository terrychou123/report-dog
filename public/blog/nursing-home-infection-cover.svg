<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 左側色塊 -->
  <rect x="0" y="0" width="580" height="630" fill="#d97706"/>
  <!-- 右側白底 -->
  <rect x="580" y="0" width="620" height="630" fill="#faf9f5"/>

  <!-- 左側標題區 -->
  <text x="60" y="120" font-size="48" fill="#fff" font-weight="700">感染管制</text>
  <text x="60" y="180" font-size="48" fill="#fff" font-weight="700">評鑑項目全解析</text>
  <text x="60" y="250" font-size="28" fill="#fde68a" font-weight="400">中小型機構也能輕鬆達標</text>

  <!-- 左側標籤 -->
  <rect x="60" y="290" width="200" height="40" rx="20" fill="#92400e"/>
  <text x="160" y="316" text-anchor="middle" font-size="18" fill="#fde68a" font-weight="600">114年度評鑑基準</text>

  <!-- 左側重點數字 -->
  <rect x="60" y="360" width="460" height="120" rx="12" fill="#b45309" opacity="0.6"/>
  <text x="90" y="400" font-size="16" fill="#fde68a">涵蓋評鑑項目</text>
  <text x="90" y="440" font-size="52" fill="#fff" font-weight="700">B10 / B17 / B25</text>
  <text x="420" y="460" font-size="16" fill="#fde68a">三大核心項目</text>

  <!-- 右側圖示區 -->
  <!-- 防疫卡片 -->
  <rect x="620" y="80" width="240" height="130" rx="12" fill="#fff" stroke="#e5e3dc" stroke-width="1"/>
  <text x="640" y="115" font-size="38">🦠</text>
  <text x="720" y="122" font-size="20" fill="#1e293b" font-weight="700">B10 防疫</text>
  <text x="720" y="148" font-size="14" fill="#57534e">住民每日量體溫</text>
  <text x="720" y="168" font-size="14" fill="#57534e">員工每週量體溫</text>
  <text x="720" y="188" font-size="14" fill="#57534e">二級加強項目</text>

  <!-- 感染防治卡片 -->
  <rect x="880" y="80" width="240" height="130" rx="12" fill="#fff" stroke="#e5e3dc" stroke-width="1"/>
  <text x="900" y="115" font-size="38">🔬</text>
  <text x="980" y="122" font-size="20" fill="#1e293b" font-weight="700">B17 感染</text>
  <text x="980" y="148" font-size="14" fill="#57534e">逐案分析處置</text>
  <text x="980" y="168" font-size="14" fill="#57534e">每半年定期分析</text>
  <text x="980" y="188" font-size="14" fill="#57534e">4類感染監測</text>

  <!-- 疫苗卡片 -->
  <rect x="620" y="230" width="240" height="130" rx="12" fill="#fff" stroke="#e5e3dc" stroke-width="1"/>
  <text x="640" y="265" font-size="38">💉</text>
  <text x="720" y="272" font-size="20" fill="#1e293b" font-weight="700">B25 疫苗</text>
  <text x="720" y="298" font-size="14" fill="#57534e">流感疫苗接種名冊</text>
  <text x="720" y="318" font-size="14" fill="#57534e">二級加強項目</text>
  <text x="720" y="338" font-size="14" fill="#57534e">鼓勵接種策略</text>

  <!-- 隔離空間卡片 -->
  <rect x="880" y="230" width="240" height="130" rx="12" fill="#fff" stroke="#e5e3dc" stroke-width="1"/>
  <text x="900" y="265" font-size="38">🏥</text>
  <text x="980" y="272" font-size="20" fill="#1e293b" font-weight="700">C13 隔離</text>
  <text x="980" y="298" font-size="14" fill="#57534e">獨立空調衛浴</text>
  <text x="980" y="318" font-size="14" fill="#57534e">緊急呼叫設備</text>
  <text x="980" y="338" font-size="14" fill="#57534e">感染隔離空間</text>

  <!-- 底部區塊 -->
  <rect x="620" y="390" width="500" height="160" rx="12" fill="#fef3c7"/>
  <text x="870" y="430" text-anchor="middle" font-size="18" fill="#92400e" font-weight="700">感染管制 4 大面向</text>
  <text x="640" y="465" font-size="15" fill="#78716c">✓ 體溫監測與通報機制（B10）</text>
  <text x="640" y="492" font-size="15" fill="#78716c">✓ 4類感染逐案分析（B17）</text>
  <text x="640" y="519" font-size="15" fill="#78716c">✓ 流感疫苗接種名冊（B25）</text>
  <text x="640" y="546" font-size="15" fill="#78716c">✓ 隔離空間設備（C13）</text>

  <!-- 浮水印 -->
  <text x="1140" y="590" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
