<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <text x="400" y="52" font-size="26" font-weight="700" fill="#1e293b" text-anchor="middle" >B28 膳食管理：菜單設計三大合規要件</text>
  <text x="400" y="80" font-size="16" fill="#57534e" text-anchor="middle" >最常見失分：菜單無營養師簽名、循環菜單不足兩週、快樂餐無選擇紀錄</text>

  <!-- N=3, H=90, outer_gap=38 -->
  <!-- Row 1 (y=166) -->
  <rect x="40" y="128" width="720" height="90" rx="8" fill="#ffffff"/>
  <rect x="40" y="128" width="6" height="90" rx="2" fill="#d97706"/>
  <circle cx="90" cy="173" r="22" fill="#d97706" opacity="0.15"/>
  <text x="90" y="179" font-size="20" font-weight="700" fill="#d97706" text-anchor="middle" >1</text>
  <text x="126" y="160" font-size="20" font-weight="700" fill="#1e293b" >營養師擬定並簽名</text>
  <text x="126" y="182" font-size="15" fill="#57534e" >菜單由專任或特約營養師擬定，每份菜單必須有營養師親筆或電子簽名</text>
  <text x="126" y="204" font-size="14" fill="#dc2626" >(!) 最常見缺失：菜單更換後未取得簽名即張貼</text>
  <rect x="596" y="145" width="136" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="664" y="163" font-size="14" fill="#d97706" text-anchor="middle" font-weight="600" >簽名核查</text>
  <text x="664" y="182" font-size="14" fill="#d97706" text-anchor="middle" >每季確認</text>

  <!-- Row 2 (y=269) -->
  <rect x="40" y="231" width="720" height="90" rx="8" fill="#ffffff"/>
  <rect x="40" y="231" width="6" height="90" rx="2" fill="#78716c"/>
  <circle cx="90" cy="276" r="22" fill="#78716c" opacity="0.15"/>
  <text x="90" y="282" font-size="20" font-weight="700" fill="#78716c" text-anchor="middle" >2</text>
  <text x="126" y="263" font-size="20" font-weight="700" fill="#1e293b" >至少兩週循環菜單，且與每日餐食相符</text>
  <text x="126" y="285" font-size="15" fill="#57534e" >備有兩週以上循環菜單紙本；評鑑當日實際餐食須與菜單所列內容一致</text>
  <text x="126" y="307" font-size="14" fill="#57534e" >建議廚房每日比對菜單後備料，避免菜色臨時更換未更新菜單</text>
  <rect x="596" y="248" width="136" height="46" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="664" y="266" font-size="14" fill="#78716c" text-anchor="middle" font-weight="600" >菜單>=2週</text>
  <text x="664" y="285" font-size="14" fill="#78716c" text-anchor="middle" >當日相符</text>

  <!-- Row 3 (y=372) -->
  <rect x="40" y="334" width="720" height="90" rx="8" fill="#ffffff"/>
  <rect x="40" y="334" width="6" height="90" rx="2" fill="#57534e"/>
  <circle cx="90" cy="379" r="22" fill="#57534e" opacity="0.15"/>
  <text x="90" y="385" font-size="20" font-weight="700" fill="#57534e" text-anchor="middle" >3</text>
  <text x="126" y="366" font-size="20" font-weight="700" fill="#1e293b" >每週至少一次快樂餐</text>
  <text x="126" y="388" font-size="15" fill="#57534e" >快樂餐核心是讓住民「自由選擇」，需有選擇機制（發選單/口頭詢問）及選擇紀錄</text>
  <text x="126" y="410" font-size="14" fill="#57534e" >並非只是備多樣菜色，而是讓住民有實際選擇機會，且留有紀錄佐證</text>
  <rect x="596" y="351" width="136" height="46" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="664" y="369" font-size="14" fill="#57534e" text-anchor="middle" font-weight="600" >每週執行</text>
  <text x="664" y="388" font-size="14" fill="#57534e" text-anchor="middle" >留有紀錄</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" >報告汪 reportwang.com</text>
</svg>
