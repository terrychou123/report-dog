<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- 標題 -->
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">失智照護評鑑自查清單</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">人力 ／ 活動 ／ 環境 3 大面向</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- 左欄 - 人力與制度 -->
  <text x="60" y="122" font-size="15" fill="#d97706" font-weight="700">人力配置與照護制度</text>
  <text x="430" y="122" font-size="15" fill="#78716c" font-weight="700">活動與環境</text>

  <rect x="40" y="132" width="350" height="36" rx="6" fill="#fff"/>
  <rect x="40" y="132" width="6" height="36" rx="2" fill="#d97706"/>
  <text x="58" y="156" font-size="14" fill="#57534e">□ 失智型照服員日 1:3 夜 1:15 符合配置</text>

  <rect x="40" y="176" width="350" height="36" rx="6" fill="#fafaf8"/>
  <rect x="40" y="176" width="6" height="36" rx="2" fill="#d97706"/>
  <text x="58" y="200" font-size="14" fill="#57534e">□ 護理人員失智型 1:20 配置，全日均有</text>

  <rect x="40" y="220" width="350" height="36" rx="6" fill="#fff"/>
  <rect x="40" y="220" width="6" height="36" rx="2" fill="#d97706"/>
  <text x="58" y="244" font-size="14" fill="#57534e">□ 服務對象 72 小時內完成個別化評估</text>

  <rect x="40" y="264" width="350" height="36" rx="6" fill="#fafaf8"/>
  <rect x="40" y="264" width="6" height="36" rx="2" fill="#d97706"/>
  <text x="58" y="288" font-size="14" fill="#57534e">□ 適應輔導辦法及紀錄完整（B4）</text>

  <rect x="40" y="308" width="350" height="36" rx="6" fill="#fff"/>
  <rect x="40" y="308" width="6" height="36" rx="2" fill="#d97706"/>
  <text x="58" y="332" font-size="14" fill="#57534e">□ 每3月跨專業聯繫會紀錄（B5）</text>

  <rect x="40" y="352" width="350" height="36" rx="6" fill="#fafaf8"/>
  <rect x="40" y="352" width="6" height="36" rx="2" fill="#d97706"/>
  <text x="58" y="376" font-size="14" fill="#57534e">□ 個別化自我照顧能力提升計畫（B28）</text>

  <!-- 右欄 - 活動與環境 -->
  <rect x="410" y="132" width="350" height="36" rx="6" fill="#fff"/>
  <rect x="410" y="132" width="6" height="36" rx="2" fill="#78716c"/>
  <text x="428" y="156" font-size="14" fill="#57534e">□ B26 每日下床 2 次有執行及紀錄</text>

  <rect x="410" y="176" width="350" height="36" rx="6" fill="#fafaf8"/>
  <rect x="410" y="176" width="6" height="36" rx="2" fill="#78716c"/>
  <text x="428" y="200" font-size="14" fill="#57534e">□ B6 每月至少辦理 1 次團體活動有紀錄</text>

  <rect x="410" y="220" width="350" height="36" rx="6" fill="#fff"/>
  <rect x="410" y="220" width="6" height="36" rx="2" fill="#78716c"/>
  <text x="428" y="244" font-size="14" fill="#57534e">□ D6 床間圍簾已設置，功能正常</text>

  <rect x="410" y="264" width="350" height="36" rx="6" fill="#fafaf8"/>
  <rect x="410" y="264" width="6" height="36" rx="2" fill="#78716c"/>
  <text x="428" y="288" font-size="14" fill="#57534e">□ 寢室及浴廁內無監視器設置</text>

  <rect x="410" y="308" width="350" height="36" rx="6" fill="#fff"/>
  <rect x="410" y="308" width="6" height="36" rx="2" fill="#78716c"/>
  <text x="428" y="332" font-size="14" fill="#57534e">□ 康樂設備（電視、書報等）有使用紀錄</text>

  <rect x="410" y="352" width="350" height="36" rx="6" fill="#fafaf8"/>
  <rect x="410" y="352" width="6" height="36" rx="2" fill="#78716c"/>
  <text x="428" y="376" font-size="14" fill="#57534e">□ 每樓層活動空間定期清潔有紀錄</text>

  <!-- 底部 -->
  <rect x="40" y="408" width="720" height="48" rx="8" fill="#fef3c7"/>
  <text x="400" y="429" text-anchor="middle" font-size="14" fill="#92400e" font-weight="700">D6 屬二級加強：床間圍簾和無寢室監視器是最常被查核的實地察看項目</text>
  <text x="400" y="450" text-anchor="middle" font-size="13" fill="#78716c">重度失能住民（ADL 60分以下）需有 PT/OT 評估紀錄，才能提供適當被動肢體活動</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
