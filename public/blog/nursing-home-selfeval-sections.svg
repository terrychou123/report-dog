<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- 標題 -->
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">5 大區塊自評表填寫重點</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">75 項評鑑指標分區攻略</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- 上排左 - A區塊 -->
  <rect x="40" y="104" width="340" height="168" rx="10" fill="#fff" stroke="#e5e3dc" stroke-width="1"/>
  <rect x="40" y="104" width="340" height="8" rx="4" fill="#d97706"/>
  <text x="56" y="136" font-size="17" fill="#d97706" font-weight="700">A 區塊：經營管理效能（15項）</text>
  <text x="56" y="158" font-size="13" fill="#57534e">• 一級必要：A7/A9/A11（3個）</text>
  <text x="56" y="178" font-size="13" fill="#57534e">• 二級加強：A2 入出機構管理</text>
  <text x="56" y="198" font-size="13" fill="#57534e">• A4 查核缺失改善達 100%</text>
  <text x="56" y="218" font-size="13" fill="#57534e">• A6 危機管理計畫 3 個以上風險</text>
  <text x="56" y="254" font-size="13" fill="#d97706" font-weight="600">★ 人力配置是最常被查核的核心</text>

  <!-- 上排右 - B區塊 -->
  <rect x="420" y="104" width="340" height="168" rx="10" fill="#fff" stroke="#e5e3dc" stroke-width="1"/>
  <rect x="420" y="104" width="340" height="8" rx="4" fill="#78716c"/>
  <text x="436" y="136" font-size="17" fill="#78716c" font-weight="700">B 區塊：專業照護品質（32項）</text>
  <text x="436" y="158" font-size="13" fill="#57534e">• 二級加強：B2/B10/B25（3個）</text>
  <text x="436" y="178" font-size="13" fill="#57534e">• B13 跌倒：每半年分析報告</text>
