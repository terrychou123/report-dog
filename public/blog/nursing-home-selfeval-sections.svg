  <text x="436" y="218" font-size="13" fill="#57534e">• B16 約束：同意書 3 月有效期</text>
  <text x="436" y="254" font-size="13" fill="#78716c" font-weight="600">★ 「逐案分析」是護理項目關鍵詞</text>

  <!-- 下排左 - C區塊 -->
  <rect x="40" y="288" width="220" height="162" rx="10" fill="#fff" stroke="#e5e3dc" stroke-width="1"/>
  <rect x="40" y="288" width="220" height="8" rx="4" fill="#d97706"/>
  <text x="56" y="316" font-size="15" fill="#d97706" font-weight="700">C 安全環境（16項）</text>
  <text x="56" y="338" font-size="12" fill="#57534e">• 一級必要：C4/C9/C10</text>
  <text x="56" y="356" font-size="12" fill="#57534e">  C11/C12/C15（6個）</text>
