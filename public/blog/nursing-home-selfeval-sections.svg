  <text x="56" y="396" font-size="12" fill="#57534e">• 疏散避難圖標示明確</text>
  <text x="56" y="430" font-size="12" fill="#d97706" font-weight="600">★ C區最多一級必要</text>

  <!-- 下排中 - D區塊 -->
  <rect x="280" y="288" width="220" height="162" rx="10" fill="#fff" stroke="#e5e3dc" stroke-width="1"/>
  <rect x="280" y="288" width="220" height="8" rx="4" fill="#78716c"/>
  <text x="296" y="316" font-size="15" fill="#78716c" font-weight="700">D 個案權益（9項）</text>
