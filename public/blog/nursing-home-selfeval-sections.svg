  <text x="296" y="430" font-size="12" fill="#78716c" font-weight="600">★ 實地察看項目多</text>

  <!-- 下排右 - E區塊 -->
  <rect x="520" y="288" width="240" height="162" rx="10" fill="#fff" stroke="#e5e3dc" stroke-width="1"/>
  <rect x="520" y="288" width="240" height="8" rx="4" fill="#d97706"/>
  <text x="536" y="316" font-size="15" fill="#d97706" font-weight="700">E 服務改進創新（3項）</text>
