  <rect x="420" y="311" width="20" height="20" rx="3" fill="#f0efe8" stroke="#a8a29e" stroke-width="1"/>
  <path d="M 424,321 L 428,326 L 437,314" fill="none" stroke="#a8a29e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="450" y="327" font-size="18" fill="#1e293b" >督導訪視頻率達標</text>

  <!-- Checkbox 2 y=341 (checked) -->
  <rect x="420" y="341" width="20" height="20" rx="3" fill="#f0efe8" stroke="#a8a29e" stroke-width="1"/>
  <path d="M 424,351 L 428,356 L 437,344" fill="none" stroke="#a8a29e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
