  <!-- 分隔線 (底部 legend 上方) -->
  <line x1="40" y1="435" x2="760" y2="435" stroke="#dedad3" stroke-width="1"/>

  <!-- Legend y=443 -->
  <!-- 已確認完成 -->
  <rect x="75" y="443" width="20" height="20" rx="3" fill="#f0efe8" stroke="#a8a29e" stroke-width="1"/>
  <path d="M 79,453 L 83,458 L 92,446" fill="none" stroke="#d97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="105" y="459" font-size="16" fill="#57534e" >已確認完成</text>

  <!-- 待確認項目 -->
  <rect x="230" y="443" width="20" height="20" rx="3" fill="none" stroke="#a8a29e" stroke-width="1.5"/>
  <text x="260" y="459" font-size="16" fill="#57534e" >待確認項目</text>

  <!-- 浮水印 -->
