<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e1a3f"/>
    </linearGradient>
    <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="420" fill="url(#bg)"/>

  <!-- 裝飾 -->
  <circle cx="700" cy="90" r="150" fill="rgba(167,139,250,0.06)"/>
  <circle cx="60" cy="380" r="100" fill="rgba(16,185,129,0.05)"/>
  <circle cx="740" cy="380" r="60" fill="rgba(255,255,255,0.03)"/>

  <!-- 頂部標籤 -->
  <rect x="48" y="40" width="96" height="28" rx="14" fill="rgba(167,139,250,0.8)"/>
  <text x="96" y="59" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="white" font-weight="600">品管指標</text>
  <rect x="155" y="40" width="96" height="28" rx="14" fill="rgba(255,255,255,0.1)"/>
  <text x="203" y="59" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">第 22 條</text>

  <!-- 主標題 -->
  <text x="48" y="138" font-family="'Noto Sans TC', sans-serif" font-size="52" fill="white" font-weight="700">品管指標</text>
  <text x="48" y="198" font-family="'Noto Sans TC', sans-serif" font-size="52" fill="#a78bfa" font-weight="700">自訂攻略</text>

  <!-- 副標題 -->
  <text x="48" y="240" font-family="'Noto Sans TC', sans-serif" font-size="18" fill="rgba(255,255,255,0.65)">第 22 條完整操作指南 · 拿滿分不是夢</text>

  <!-- 分隔線 -->
  <rect x="48" y="258" width="200" height="3" rx="2" fill="url(#gaugeGrad)"/>

  <!-- 特色標籤列 -->
  <rect x="48" y="276" width="130" height="32" rx="8" fill="rgba(167,139,250,0.2)" stroke="rgba(167,139,250,0.4)" stroke-width="1"/>
  <text x="113" y="296" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#c4b5fd">自訂指標範例</text>
  <rect x="190" y="276" width="130" height="32" rx="8" fill="rgba(16,185,129,0.2)" stroke="rgba(16,185,129,0.4)" stroke-width="1"/>
  <text x="255" y="296" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#6ee7b7">PDCA 管理循環</text>

  <!-- 品牌 -->
  <rect x="48" y="378" width="70" height="24" rx="6" fill="rgba(255,255,255,0.08)"/>
  <text x="83" y="394" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="rgba(255,255,255,0.5)">報告汪</text>

  <!-- 右側儀表板視覺 -->
  <!-- 儀表外框 -->
  <circle cx="596" cy="210" r="148" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <circle cx="596" cy="210" r="120" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- 儀表背景弧 (半圓) -->
  <path d="M 476 210 A 120 120 0 0 1 716 210" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="18" stroke-linecap="round"/>

  <!-- 分段弧 - 紅 -->
  <path d="M 476 210 A 120 120 0 0 1 516 126" fill="none" stroke="#ef4444" stroke-width="18" stroke-linecap="round" opacity="0.7"/>
  <!-- 分段弧 - 黃 -->
  <path d="M 516 126 A 120 120 0 0 1 596 90" fill="none" stroke="#f59e0b" stroke-width="18" stroke-linecap="round" opacity="0.7"/>
  <!-- 分段弧 - 綠 (大段) -->
  <path d="M 596 90 A 120 120 0 0 1 716 210" fill="none" stroke="url(#gaugeGrad)" stroke-width="18" stroke-linecap="round"/>

  <!-- 指針 -->
  <line x1="596" y1="210" x2="686" y2="130" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <circle cx="596" cy="210" r="10" fill="#a78bfa" stroke="white" stroke-width="2"/>

  <!-- 刻度文字 -->
  <text x="468" y="232" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="rgba(255,255,255,0.5)">0</text>
  <text x="596" y="78" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="rgba(255,255,255,0.5)">50</text>
  <text x="724" y="232" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="rgba(255,255,255,0.5)">100</text>

  <!-- 分數顯示 -->
  <text x="596" y="248" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="42" fill="#a78bfa" font-weight="700">95</text>
  <text x="596" y="272" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="rgba(255,255,255,0.5)">評鑑得分</text>

  <!-- 底部標籤 -->
  <rect x="530" y="290" width="132" height="28" rx="14" fill="rgba(16,185,129,0.25)" stroke="rgba(16,185,129,0.4)" stroke-width="1"/>
  <text x="596" y="308" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#6ee7b7" font-weight="600">優等 · 接近滿分</text>

  <!-- 品質指標小標籤 -->
  <rect x="456" y="330" width="90" height="24" rx="6" fill="rgba(167,139,250,0.15)"/>
  <text x="501" y="346" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="10" fill="#c4b5fd">品管指標設定</text>
  <rect x="558" y="330" width="90" height="24" rx="6" fill="rgba(16,185,129,0.15)"/>
  <text x="603" y="346" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="10" fill="#6ee7b7">數據追蹤分析</text>
  <rect x="660" y="330" width="90" height="24" rx="6" fill="rgba(14,165,233,0.15)"/>
  <text x="705" y="346" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="10" fill="#7dd3fc">改善方案執行</text>
</svg>
