<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420">

  <!-- 背景：米黃暖色 -->
  <rect width="800" height="420" fill="#f0efe8"/>

  <!-- 右側裝飾塊 -->
  <rect x="430" y="0" width="370" height="420" fill="#e8e6de"/>

  <!-- 頂部標籤 -->
  <rect x="48" y="40" width="96" height="28" rx="14" fill="#78716c"/>
  <text x="96" y="59" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="white" font-weight="600">品管指標</text>
  <rect x="155" y="40" width="96" height="28" rx="14" fill="white" stroke="#dedad3" stroke-width="1"/>
  <text x="203" y="59" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#64748b">第 22 條</text>

  <!-- 主標題 -->
  <text x="48" y="138" font-family="'Noto Sans TC', sans-serif" font-size="52" fill="#1e293b" font-weight="700">品管指標</text>
  <text x="48" y="198" font-family="'Noto Sans TC', sans-serif" font-size="52" fill="#d97706" font-weight="700">自訂攻略</text>

  <!-- 副標題 -->
  <text x="48" y="240" font-family="'Noto Sans TC', sans-serif" font-size="18" fill="#64748b">第 22 條完整操作指南 · 拿滿分不是夢</text>

  <!-- 分隔線 -->
  <rect x="48" y="258" width="200" height="3" rx="2" fill="#a8a29e"/>

  <!-- 特色標籤 -->
  <rect x="48" y="276" width="130" height="32" rx="8" fill="white" stroke="#dedad3" stroke-width="1"/>
  <text x="113" y="296" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#78716c">自訂指標範例</text>
  <rect x="190" y="276" width="130" height="32" rx="8" fill="white" stroke="#dedad3" stroke-width="1"/>
  <text x="255" y="296" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#78716c">PDCA 管理循環</text>

  <!-- 浮水印 -->
  <text x="756" y="412" text-anchor="end" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#c4bfb8">報告汪 reportwang.com</text>

  <!-- 右側儀表盤視覺 (暖灰版) -->
  <circle cx="596" cy="210" r="148" fill="white" stroke="#dedad3" stroke-width="1"/>
  <circle cx="596" cy="210" r="120" fill="#f8f7f2" stroke="#e8e5de" stroke-width="1"/>

  <!-- 儀表背景弧 -->
  <path d="M 476 210 A 120 120 0 0 1 716 210" fill="none" stroke="#e8e5de" stroke-width="18" stroke-linecap="round"/>

  <!-- 分段弧 - 淺灰 -->
  <path d="M 476 210 A 120 120 0 0 1 516 126" fill="none" stroke="#d6d3d1" stroke-width="18" stroke-linecap="round"/>
  <!-- 分段弧 - 中灰 -->
  <path d="M 516 126 A 120 120 0 0 1 596 90" fill="none" stroke="#a8a29e" stroke-width="18" stroke-linecap="round"/>
  <!-- 分段弧 - 琥珀大段 -->
  <path d="M 596 90 A 120 120 0 0 1 716 210" fill="none" stroke="#d97706" stroke-width="18" stroke-linecap="round"/>

  <!-- 指針 -->
  <line x1="596" y1="210" x2="686" y2="130" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
  <circle cx="596" cy="210" r="10" fill="#78716c" stroke="white" stroke-width="2"/>

  <!-- 刻度文字 -->
  <text x="468" y="232" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#94a3b8">0</text>
  <text x="596" y="78" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#94a3b8">50</text>
  <text x="724" y="232" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#94a3b8">100</text>

  <!-- 分數顯示 -->
  <text x="596" y="248" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="42" fill="#d97706" font-weight="700">95</text>
  <text x="596" y="272" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#64748b">評鑑得分</text>

  <!-- 底部標籤 -->
  <rect x="530" y="290" width="132" height="28" rx="14" fill="white" stroke="#dedad3" stroke-width="1"/>
  <text x="596" y="308" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#78716c" font-weight="600">優等 · 接近滿分</text>

  <!-- 小標籤 -->
  <rect x="456" y="332" width="90" height="24" rx="6" fill="white" stroke="#dedad3" stroke-width="1"/>
  <text x="501" y="348" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="10" fill="#a8a29e">品管指標設定</text>
  <rect x="558" y="332" width="90" height="24" rx="6" fill="white" stroke="#dedad3" stroke-width="1"/>
  <text x="603" y="348" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="10" fill="#a8a29e">數據追蹤分析</text>
  <rect x="660" y="332" width="90" height="24" rx="6" fill="white" stroke="#dedad3" stroke-width="1"/>
  <text x="705" y="348" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="10" fill="#a8a29e">改善方案執行</text>
</svg>
