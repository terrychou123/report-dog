  <text x="100" y="313" font-size="28" fill="#1e293b" font-weight="700">文件品質更穩定</text>
  <text x="100" y="337" font-size="18" fill="#57534e">不需倉促完稿，避免邏輯不一致與資料錯誤問題</text>
