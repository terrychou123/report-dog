<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- Header -->
  <rect x="0" y="29" width="800" height="60" fill="#e8e6de"/>
  <rect x="0" y="29" width="6" height="60" rx="2" fill="#d97706"/>
  <text x="28" y="74" font-size="30" fill="#1e293b" font-weight="700">嬰兒身分辨識管理 3 層面</text>
  <!-- Row 1 y=166 H=90 -->
  <rect x="28" y="166" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="166" width="6" height="90" rx="2" fill="#d97706"/>
  <circle cx="66" cy="211" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="217" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <text x="100" y="202" font-size="20" fill="#1e293b" font-weight="700">手腳環標示內容</text>
  <text x="100" y="223" font-size="16" fill="#57534e">入住時確認手腳環佩戴，標示嬰兒姓名、出生日期、性別、床位號</text>
  <rect x="620" y="174" width="136" height="74" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="207" font-size="16" fill="#d97706" text-anchor="middle">入住確認</text>
  <text x="688" y="227" font-size="16" fill="#d97706" text-anchor="middle">四項標示</text>
  <!-- Row 2 y=269 H=90 -->
  <rect x="28" y="269" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="269" width="6" height="90" rx="2" fill="#78716c"/>
  <circle cx="66" cy="314" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="320" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <text x="100" y="305" font-size="20" fill="#1e293b" font-weight="700">每班確認與特殊情境</text>
  <text x="100" y="326" font-size="16" fill="#57534e">每班交接確認完整佩戴；照光治療及沐浴後均需重新確認並記錄</text>
  <rect x="620" y="277" width="136" height="74" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="310" font-size="16" fill="#78716c" text-anchor="middle">每班交接</text>
  <text x="688" y="330" font-size="16" fill="#78716c" text-anchor="middle">沐浴後查</text>
  <!-- Row 3 y=372 H=90 -->
  <rect x="28" y="372" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="372" width="6" height="90" rx="2" fill="#57534e"/>
  <circle cx="66" cy="417" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="423" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <text x="100" y="408" font-size="20" fill="#1e293b" font-weight="700">書面記錄要求</text>
  <text x="100" y="429" font-size="16" fill="#57534e">護理記錄中需有書面確認，標示需清晰耐用，不因沐浴褪色</text>
  <rect x="620" y="380" width="136" height="74" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="413" font-size="16" fill="#57534e" text-anchor="middle">書面佐證</text>
  <text x="688" y="433" font-size="16" fill="#57534e" text-anchor="middle">清晰耐用</text>
  <!-- Watermark -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
