<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 右側裝飾區塊 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>

  <!-- 右側大文字 B1.5 -->
  <text x="1010" y="200" font-size="120" font-weight="900" fill="#16a34a" text-anchor="middle" opacity="0.85">B1.5</text>
  <text x="1010" y="242" font-size="26" fill="#78716c" text-anchor="middle" font-weight="600">出住院評估</text>

  <!-- 右側 5 個評鑑條件卡片 -->
  <rect x="840" y="265" width="320" height="48" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="858" y="289" font-size="20" fill="#16a34a" font-weight="700">① 產婦出院評估</text>
  <text x="1025" y="289" font-size="18" fill="#57534e">傷口・子宮・乳房・情緒</text>

  <rect x="840" y="319" width="320" height="48" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="858" y="343" font-size="20" fill="#16a34a" font-weight="700">② 嬰兒出院評估</text>
  <text x="1025" y="343" font-size="18" fill="#57534e">體重・黃疸・餵食</text>

  <rect x="840" y="373" width="320" height="48" rx="10" fill="#16a34a" opacity="0.10" stroke="#e8e5de" stroke-width="1"/>
  <text x="858" y="397" font-size="20" fill="#16a34a" font-weight="700">③ 書面出院指導</text>
  <text x="1025" y="397" font-size="18" fill="#57534e">家屬簽名必要</text>

  <rect x="840" y="427" width="320" height="48" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="858" y="451" font-size="20" fill="#78716c" font-weight="700">④ 社區資源轉介</text>
  <text x="1025" y="451" font-size="18" fill="#57534e">衛生所・哺乳資源</text>

  <rect x="840" y="481" width="320" height="48" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <text x="858" y="505" font-size="20" fill="#78716c" font-weight="700">⑤ 出院後追蹤</text>
  <text x="1025" y="505" font-size="18" fill="#57534e">3–7 天電話關懷</text>

  <!-- 右側底部 -->
  <rect x="840" y="539" width="320" height="46" rx="10" fill="#16a34a" opacity="0.10"/>
  <text x="1000" y="568" font-size="22" fill="#16a34a" text-anchor="middle" font-weight="700">家屬簽名 + 追蹤記錄</text>

  <!-- 左側主標題 -->
  <text x="60" y="155" font-size="96" font-weight="900" fill="#1e293b">出院評估</text>
  <text x="60" y="261" font-size="96" font-weight="900" fill="#16a34a">怎麼做？</text>

  <line x1="60" y1="293" x2="780" y2="293" stroke="#dedad3" stroke-width="2"/>

  <text x="60" y="339" font-size="34" fill="#57534e" font-weight="400">B1.5 · 從評估到追蹤的完整文件化流程</text>

  <!-- 特色標籤列 -->
  <rect x="60" y="367" width="188" height="52" rx="10" fill="#16a34a" opacity="0.10"/>
  <text x="154" y="402" font-size="26" fill="#16a34a" text-anchor="middle" font-weight="600">出院指導</text>

  <rect x="260" y="367" width="188" height="52" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="354" y="402" font-size="26" fill="#d97706" text-anchor="middle" font-weight="600">家屬簽名</text>

  <rect x="460" y="367" width="188" height="52" rx="10" fill="#78716c" opacity="0.12"/>
  <text x="554" y="402" font-size="26" fill="#78716c" text-anchor="middle" font-weight="600">出院追蹤</text>

  <!-- 適用對象 -->
  <text x="60" y="455" font-size="28" fill="#94a3b8">護產人員 · 護理主管 · 月子中心負責人</text>

  <!-- 底部說明 -->
  <text x="60" y="503" font-size="30" fill="#57534e" font-weight="500">出院指導沒有家屬簽名，是 B1.5 最常見的失分點</text>
  <text x="60" y="541" font-size="26" fill="#a8a29e">5 項條件，每項都需要完整的護理記錄為佐證</text>

  <!-- 浮水印 -->
  <text x="780" y="590" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
