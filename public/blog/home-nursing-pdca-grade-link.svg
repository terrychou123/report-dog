<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <rect x="0" y="50" width="800" height="76" fill="white"/>
  <rect x="0" y="50" width="6" height="76" fill="#d97706" rx="2"/>
  <text x="28" y="104" font-size="36" fill="#1e293b" font-weight="700">PDCA 深度與評鑑等級的直接關係</text>
  <rect x="28" y="160" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="160" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="66" cy="191" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="197" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">乙等</text>
  <text x="100" y="188" font-size="22" fill="#1e293b" font-weight="700">PDCA 形式存在</text>
  <text x="100" y="208" font-size="16" fill="#57534e">有季報、有計畫，但無原因分析、無追蹤記錄</text>
  <rect x="620" y="168" width="136" height="46" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="185" font-size="16" fill="#57534e" text-anchor="middle">70–79</text>
  <text x="688" y="205" font-size="16" fill="#57534e" text-anchor="middle">分</text>
  <rect x="28" y="235" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="235" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="66" cy="266" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="272" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">甲等</text>
  <text x="100" y="263" font-size="22" fill="#1e293b" font-weight="700">PDCA 有分析有追蹤</text>
  <text x="100" y="283" font-size="16" fill="#57534e">超標有分析原因，改善有追蹤，前後邏輯一致</text>
  <rect x="620" y="243" width="136" height="46" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="260" font-size="16" fill="#78716c" text-anchor="middle">80–89</text>
  <text x="688" y="280" font-size="16" fill="#78716c" text-anchor="middle">分</text>
  <rect x="28" y="310" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="310" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="341" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="347" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">優等</text>
  <text x="100" y="338" font-size="22" fill="#1e293b" font-weight="700">PDCA 融入日常管理</text>
  <text x="100" y="358" font-size="16" fill="#57534e">精細趨勢分析，改善有成效，非評鑑前才建立</text>
  <rect x="620" y="318" width="136" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="335" font-size="16" fill="#d97706" text-anchor="middle">90+</text>
  <text x="688" y="355" font-size="16" fill="#d97706" text-anchor="middle">分</text>
  <rect x="28" y="393" width="744" height="68" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="393" width="6" height="68" rx="2" fill="#94a3b8"/>
  <text x="100" y="420" font-size="20" fill="#1e293b" font-weight="700">關鍵差異：「臨時做」vs「日常做」</text>
  <text x="100" y="445" font-size="16" fill="#57534e">評鑑委員翻閱 4 季報告，馬上能判斷 PDCA 是真實管理還是應付文件</text>
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
