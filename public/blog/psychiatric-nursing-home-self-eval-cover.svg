<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 右側裝飾區 -->
  <rect x="800" y="0" width="400" height="630" fill="#e8e6de"/>

  <!-- 左側內容區 -->
  <!-- 主標題第1行 -->
  <text x="60" y="160" font-size="120" font-weight="900" fill="#1e293b" >36項自評</text>
  <!-- 主標題第2行 -->
  <text x="60" y="290" font-size="120" font-weight="900" fill="#d97706" >檢核清單</text>
  <!-- 副標題 -->
  <text x="60" y="360" font-size="38" fill="#57534e" >115年度精神護理之家評鑑完整自評工具</text>

  <!-- 特色標籤 -->
  <!-- 115年度 -->
  <rect x="60" y="400" width="140" height="44" rx="22" fill="#d97706"/>
  <text x="130" y="428" font-size="22" fill="white" text-anchor="middle" >115年度</text>
  <!-- 自評工具 -->
  <rect x="216" y="400" width="140" height="44" rx="22" fill="#78716c"/>
  <text x="286" y="428" font-size="22" fill="white" text-anchor="middle" >自評工具</text>
  <!-- 評鑑準備 -->
  <rect x="372" y="400" width="140" height="44" rx="22" fill="#57534e"/>
  <text x="442" y="428" font-size="22" fill="white" text-anchor="middle" >評鑑準備</text>

  <!-- 適用對象說明 -->
  <text x="60" y="500" font-size="28" fill="#78716c" >適用：精神護理之家評鑑準備負責人員</text>
  <text x="60" y="540" font-size="28" fill="#78716c" >115年度評鑑基準 A/B/C/D/E 面向完整覆蓋</text>

  <!-- 右側裝飾 -->
  <!-- 大數字 -->
  <text x="1000" y="200" font-size="200" font-weight="900" fill="#d97706" text-anchor="middle" >36</text>
  <text x="1000" y="250" font-size="28" fill="#78716c" text-anchor="middle" >評鑑基準</text>

  <!-- 2×2 卡片 -->
  <!-- 卡片1 -->
  <rect x="820" y="280" width="170" height="80" rx="10" fill="white"/>
  <text x="905" y="312" font-size="20" fill="#d97706" text-anchor="middle" font-weight="700" >A面向</text>
  <text x="905" y="343" font-size="20" fill="#1e293b" text-anchor="middle" >9項</text>
  <!-- 卡片2 -->
  <rect x="1005" y="280" width="170" height="80" rx="10" fill="white"/>
  <text x="1090" y="312" font-size="20" fill="#d97706" text-anchor="middle" font-weight="700" >B面向</text>
  <text x="1090" y="343" font-size="20" fill="#1e293b" text-anchor="middle" >21項</text>
  <!-- 卡片3 -->
  <rect x="820" y="375" width="170" height="80" rx="10" fill="white"/>
  <text x="905" y="406" font-size="18" fill="#d97706" text-anchor="middle" font-weight="700" >C/D/E</text>
  <text x="905" y="437" font-size="18" fill="#1e293b" text-anchor="middle" >6項</text>
  <!-- 卡片4 -->
  <rect x="1005" y="375" width="170" height="80" rx="10" fill="white"/>
  <text x="1090" y="406" font-size="18" fill="#d97706" text-anchor="middle" font-weight="700" >重點項目</text>
  <text x="1090" y="437" font-size="18" fill="#1e293b" text-anchor="middle" >2項</text>

  <!-- 底部描述 -->
  <text x="1000" y="510" font-size="22" fill="#57534e" text-anchor="middle" >自評項目覆蓋率 100%</text>
  <text x="1000" y="548" font-size="20" fill="#a8a29e" text-anchor="middle" >試扣分項目優先確認</text>

  <!-- 品牌浮水印 -->
  <text x="1140" y="590" font-size="24" fill="#c4bfb8" text-anchor="end" >報告汪 reportwang.com</text>
</svg>
