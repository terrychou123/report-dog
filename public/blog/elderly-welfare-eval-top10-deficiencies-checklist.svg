<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題 -->
  <text x="400" y="44" font-size="26" font-weight="700" fill="#1e293b" text-anchor="middle" font-family="Arial, sans-serif">評鑑前自我查核：5 大必查重點</text>
  <text x="400" y="72" font-size="16" fill="#57534e" text-anchor="middle" font-family="Arial, sans-serif">評鑑前 3 個月啟動，逐項確認文件齊備度</text>

  <!-- 列1 -->
  <rect x="60" y="96" width="680" height="62" rx="10" fill="white"/>
  <rect x="60" y="96" width="6" height="62" rx="3" fill="#d97706"/>
  <circle cx="94" cy="127" r="16" fill="#d97706" opacity="0.15"/>
  <text x="94" y="133" font-size="18" fill="#d97706" text-anchor="middle" font-weight="700" font-family="Arial, sans-serif">1</text>
  <text x="125" y="117" font-size="19" font-weight="700" fill="#1e293b" font-family="Arial, sans-serif">C 區一級必要指標全數確認</text>
  <text x="125" y="141" font-size="15" fill="#57534e" font-family="Arial, sans-serif">現場測試緊急呼叫、確認逃生圖 A3 以上張貼、演練紀錄齊備</text>
  <rect x="620" y="104" width="104" height="38" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="672" y="128" font-size="16" font-weight="700" fill="#d97706" text-anchor="middle" font-family="Arial, sans-serif">最優先</text>

  <!-- 列2 -->
  <rect x="60" y="174" width="680" height="62" rx="10" fill="white"/>
  <rect x="60" y="174" width="6" height="62" rx="3" fill="#78716c"/>
  <circle cx="94" cy="205" r="16" fill="#78716c" opacity="0.15"/>
  <text x="94" y="211" font-size="18" fill="#78716c" text-anchor="middle" font-weight="700" font-family="Arial, sans-serif">2</text>
  <text x="125" y="195" font-size="19" font-weight="700" fill="#1e293b" font-family="Arial, sans-serif">B2 個案服務計畫完整性</text>
  <text x="125" y="219" font-size="15" fill="#57534e" font-family="Arial, sans-serif">抽查 5 位個案：評估時程、照護計畫修訂、家屬討論紀錄是否齊全</text>
  <rect x="620" y="182" width="104" height="38" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="672" y="206" font-size="16" font-weight="700" fill="#78716c" text-anchor="middle" font-family="Arial, sans-serif">抽查 5 位</text>

  <!-- 列3 -->
  <rect x="60" y="252" width="680" height="62" rx="10" fill="white"/>
  <rect x="60" y="252" width="6" height="62" rx="3" fill="#57534e"/>
  <circle cx="94" cy="283" r="16" fill="#57534e" opacity="0.15"/>
  <text x="94" y="289" font-size="18" fill="#57534e" text-anchor="middle" font-weight="700" font-family="Arial, sans-serif">3</text>
  <text x="125" y="273" font-size="19" font-weight="700" fill="#1e293b" font-family="Arial, sans-serif">A13/A14 訓練時數計算</text>
  <text x="125" y="297" font-size="15" fill="#57534e" font-family="Arial, sans-serif">逐人計算年度在職 20H；新進人員職前 16H 含感控 4H 是否完成</text>
  <rect x="620" y="260" width="104" height="38" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="672" y="284" font-size="16" font-weight="700" fill="#57534e" text-anchor="middle" font-family="Arial, sans-serif">逐人統計</text>

  <!-- 列4 -->
  <rect x="60" y="330" width="680" height="62" rx="10" fill="white"/>
  <rect x="60" y="330" width="6" height="62" rx="3" fill="#a8a29e"/>
  <circle cx="94" cy="361" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="94" y="367" font-size="18" fill="#78716c" text-anchor="middle" font-weight="700" font-family="Arial, sans-serif">4</text>
  <text x="125" y="351" font-size="19" font-weight="700" fill="#1e293b" font-family="Arial, sans-serif">B13-B19 七大監測 PDCA 是否完整</text>
  <text x="125" y="375" font-size="15" fill="#57534e" font-family="Arial, sans-serif">每項監測有季度分析報告、改善方案、追蹤紀錄，缺一不可</text>
  <rect x="620" y="338" width="104" height="38" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="672" y="362" font-size="16" font-weight="700" fill="#78716c" text-anchor="middle" font-family="Arial, sans-serif">每季分析</text>

  <!-- 列5 -->
  <rect x="60" y="408" width="680" height="62" rx="10" fill="white"/>
  <rect x="60" y="408" width="6" height="62" rx="3" fill="#94a3b8"/>
  <circle cx="94" cy="439" r="16" fill="#94a3b8" opacity="0.15"/>
  <text x="94" y="445" font-size="18" fill="#94a3b8" text-anchor="middle" font-weight="700" font-family="Arial, sans-serif">5</text>
  <text x="125" y="429" font-size="19" font-weight="700" fill="#1e293b" font-family="Arial, sans-serif">D1 個資保密 + E/F 加分題準備</text>
  <text x="125" y="453" font-size="15" fill="#57534e" font-family="Arial, sans-serif">確認肖像權同意書齊全、系統權限設定；E2/F1-F3 加分題資料備齊可加 2-4 分</text>
  <rect x="620" y="416" width="104" height="38" rx="8" fill="#94a3b8" opacity="0.12"/>
  <text x="672" y="440" font-size="16" font-weight="700" fill="#94a3b8" text-anchor="middle" font-family="Arial, sans-serif">加分機會</text>

  <!-- 浮水印 -->
  <text x="760" y="490" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" font-family="Arial, sans-serif">報告汪 reportwang.com</text>
</svg>
