<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#fafaf9"/>

  <!-- 右側裝飾區塊 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>

  <!-- 右側大數字 3 -->
  <text x="920" y="180" font-family="'Noto Sans TC', sans-serif" font-size="160" font-weight="900" fill="#4f46e5" opacity="0.15">3</text>
  <text x="910" y="175" font-family="'Noto Sans TC', sans-serif" font-size="72" font-weight="900" fill="#4f46e5">3</text>
  <text x="990" y="175" font-family="'Noto Sans TC', sans-serif" font-size="22" font-weight="700" fill="#57534e">項必要條文</text>

  <!-- 右側三個條文說明 -->
  <rect x="848" y="205" width="310" height="52" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="870" y="226" font-family="'Noto Sans TC', sans-serif" font-size="13" font-weight="700" fill="#4f46e5">2.1.1</text>
  <text x="913" y="226" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#44403c">病人基本權利保障</text>
  <text x="870" y="245" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#78716c">資料查核＋訪談</text>

  <rect x="848" y="267" width="310" height="52" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="870" y="288" font-family="'Noto Sans TC', sans-serif" font-size="13" font-weight="700" fill="#d97706">2.1.2</text>
  <text x="913" y="288" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#44403c">知情同意作業</text>
  <text x="870" y="307" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#78716c">資料查核＋訪談</text>

  <rect x="848" y="329" width="310" height="52" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="870" y="350" font-family="'Noto Sans TC', sans-serif" font-size="13" font-weight="700" fill="#059669">2.1.3</text>
  <text x="913" y="350" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#44403c">病人隱私保護</text>
  <text x="870" y="369" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#78716c">資料查核＋實地查核</text>

  <!-- 右側查核方式卡片 -->
  <rect x="848" y="400" width="90" height="40" rx="6" fill="#4f46e5"/>
  <text x="893" y="425" font-family="'Noto Sans TC', sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">資料查核</text>

  <rect x="948" y="400" width="80" height="40" rx="6" fill="#d97706"/>
  <text x="988" y="425" font-family="'Noto Sans TC', sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">訪談查核</text>

  <rect x="1038" y="400" width="90" height="40" rx="6" fill="#059669"/>
  <text x="1083" y="425" font-family="'Noto Sans TC', sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">實地查核</text>

  <!-- 左側主標題 -->
  <text x="60" y="130" font-family="'Noto Sans TC', sans-serif" font-size="62" font-weight="900" fill="#1c1917">病人權利</text>
  <text x="60" y="205" font-family="'Noto Sans TC', sans-serif" font-size="62" font-weight="900" fill="#4f46e5">必要條文攻略</text>

  <!-- 副標題 -->
  <text x="60" y="258" font-family="'Noto Sans TC', sans-serif" font-size="22" fill="#57534e">2.1章 × 知情同意 × 隱私保護 × 全院協作</text>

  <!-- 分隔線 -->
  <line x1="60" y1="278" x2="420" y2="278" stroke="#4f46e5" stroke-width="3"/>

  <!-- 特色標籤 -->
  <rect x="60" y="300" width="104" height="34" rx="17" fill="#ede9fe"/>
  <text x="112" y="322" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#4f46e5" text-anchor="middle">病人權利書</text>

  <rect x="174" y="300" width="104" height="34" rx="17" fill="#fef3c7"/>
  <text x="226" y="322" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#d97706" text-anchor="middle">知情同意書</text>

  <rect x="288" y="300" width="92" height="34" rx="17" fill="#d1fae5"/>
  <text x="334" y="322" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#059669" text-anchor="middle">隱私保護</text>

  <rect x="60" y="344" width="92" height="34" rx="17" fill="#fee2e2"/>
  <text x="106" y="366" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#dc2626" text-anchor="middle">拒絕治療</text>

  <rect x="162" y="344" width="92" height="34" rx="17" fill="#e0e7ff"/>
  <text x="208" y="366" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#4f46e5" text-anchor="middle">多人協作</text>

  <!-- 底部說明 -->
  <rect x="60" y="420" width="700" height="70" rx="10" fill="#f5f5f4" stroke="#e7e5e4" stroke-width="1"/>
  <text x="80" y="447" font-family="'Noto Sans TC', sans-serif" font-size="14" fill="#78716c">評鑑委員最可能直接詢問第一線護理師的章節</text>
  <text x="80" y="470" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#a8a29e">2.1.1 和 2.1.2 訪談查核 ／ 2.1.3 實地現場觀察</text>

  <!-- 浮水印 -->
  <text x="600" y="612" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#a8a29e" text-anchor="middle" opacity="0.6">報告汪 reportwang.com</text>
</svg>
