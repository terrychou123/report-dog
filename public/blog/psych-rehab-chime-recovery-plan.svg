<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <text x="400" y="48" text-anchor="middle" font-size="30" fill="#1e293b" font-weight="700">復元導向服務計畫四大關鍵要素</text>
  <text x="400" y="78" text-anchor="middle" font-size="20" fill="#57534e">讓評鑑委員從文件就能看到 CHIME 精神的準備方法</text>
  <line x1="28" y1="94" x2="772" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- Row 1: 當事人語言的目標 -->
  <rect x="28" y="110" width="744" height="72" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="110" width="6" height="72" rx="2" fill="#d97706"/>
  <circle cx="66" cy="146" r="18" fill="#d97706" opacity="0.15"/>
  <text x="66" y="152" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <text x="100" y="132" font-size="18" fill="#1e293b" font-weight="700">用當事人自己的語言寫目標（Hope + Identity）</text>
  <text x="100" y="154" font-size="15" fill="#57534e">好：「阿明希望三個月後能自己搭公車去誠品買書」</text>
  <text x="100" y="172" font-size="15" fill="#dc2626">需改善：「提升個案社區適應能力及獨立生活技能」（太籠統、無個別性）</text>
  <rect x="620" y="118" width="136" height="56" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="138" font-size="15" fill="#d97706" text-anchor="middle">學員話語</text>
  <text x="688" y="158" font-size="15" fill="#d97706" text-anchor="middle">在計畫前段</text>

  <!-- Row 2: 優勢導向 -->
  <rect x="28" y="190" width="744" height="72" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="190" width="6" height="72" rx="2" fill="#78716c"/>
  <circle cx="66" cy="226" r="18" fill="#78716c" opacity="0.15"/>
  <text x="66" y="232" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <text x="100" y="212" font-size="18" fill="#1e293b" font-weight="700">記錄優勢而非只列問題（Identity + Meaning）</text>
  <text x="100" y="234" font-size="15" fill="#57534e">評估欄位中加入「個人優勢與興趣」：「喜歡音樂、手工藝能力良好、家庭支持強」</text>
  <text x="100" y="252" font-size="15" fill="#57534e">診斷和症狀紀錄之外，必須有能力和資源的描述</text>
  <rect x="620" y="198" width="136" height="56" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="218" font-size="15" fill="#78716c" text-anchor="middle">優勢欄位</text>
  <text x="688" y="238" font-size="15" fill="#78716c" text-anchor="middle">評估必填</text>

  <!-- Row 3: 三方參與 -->
  <rect x="28" y="270" width="744" height="72" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="270" width="6" height="72" rx="2" fill="#57534e"/>
  <circle cx="66" cy="306" r="18" fill="#57534e" opacity="0.15"/>
  <text x="66" y="312" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <text x="100" y="292" font-size="18" fill="#1e293b" font-weight="700">三方簽名體現 Hope 與 Connectedness</text>
  <text x="100" y="314" font-size="15" fill="#57534e">服務對象本人、家屬（或主要照顧者）、工作人員三方均需簽名或有參與紀錄</text>
  <text x="100" y="332" font-size="15" fill="#57534e">家屬無法到場：電話聯繫紀錄（時間、討論內容）也算有效紀錄</text>
  <rect x="620" y="278" width="136" height="56" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="298" font-size="15" fill="#57534e" text-anchor="middle">三方</text>
  <text x="688" y="318" font-size="15" fill="#57534e" text-anchor="middle">共同決定</text>

  <!-- Row 4: 季度更新 -->
  <rect x="28" y="350" width="744" height="72" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="350" width="6" height="72" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="386" r="18" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="392" font-size="16" fill="#a8a29e" text-anchor="middle" font-weight="900">4</text>
  <text x="100" y="372" font-size="18" fill="#1e293b" font-weight="700">每3個月更新顯示動態進展（Hope + Empowerment）</text>
  <text x="100" y="394" font-size="15" fill="#57534e">定期更新是評鑑委員確認機構「持續關注個案」的關鍵證據</text>
  <text x="100" y="412" font-size="15" fill="#57534e">更新紀錄中要看到目標進展和調整——不只是蓋章，要有實質修訂說明</text>
  <rect x="620" y="358" width="136" height="56" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="378" font-size="15" fill="#a8a29e" text-anchor="middle">每季提醒</text>
  <text x="688" y="398" font-size="15" fill="#a8a29e" text-anchor="middle">系統追蹤</text>

  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
