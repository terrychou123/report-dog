<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- @template: list-4 -->
  <rect width="800" height="500" fill="#f0efe8"/>
  <text x="400" y="48" text-anchor="middle" font-size="30" fill="#1e293b" font-weight="700">復元導向服務計畫四大關鍵要素</text>
  <text x="400" y="78" text-anchor="middle" font-size="20" fill="#57534e">讓評鑑委員從文件就能看到 CHIME 精神的準備方法</text>
  <line x1="28" y1="94" x2="772" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- Row 1: 當事人語言的目標 (rowY=160, H=62) -->
  <rect x="28" y="160" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="160" width="6" height="62" rx="2" fill="#d97706"/>
  <circle cx="66" cy="191" r="18" fill="#d97706" opacity="0.15"/>
  <!-- text_y = 160+31+22*0.35=160+31+7.7=198.7≈199 -->
  <text x="66" y="199" font-size="22" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <text x="100" y="180" font-size="22" fill="#1e293b" font-weight="700">用當事人自己的語言寫目標（Hope + Identity）</text>
  <text x="100" y="204" font-size="16" fill="#57534e">好：「阿明希望三個月後能自己搭公車去誠品買書」</text>
  <text x="100" y="220" font-size="15" fill="#dc2626">需改善：「提升個案社區適應能力及獨立生活技能」（太籠統、無個別性）</text>
  <!-- S-box: rectH=46, y=160+(62-46)/2=160+8=168 -->
  <rect x="620" y="168" width="136" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <!-- S text_y = 168+23+15*0.35=168+23+5.25=196.25≈196 -->
  <text x="688" y="186" font-size="15" fill="#d97706" text-anchor="middle">學員話語</text>
  <text x="688" y="204" font-size="15" fill="#d97706" text-anchor="middle">在計畫前段</text>

  <!-- Row 2: 優勢導向 (rowY=235, H=62) -->
  <rect x="28" y="235" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="235" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="66" cy="266" r="18" fill="#78716c" opacity="0.15"/>
  <!-- text_y = 235+31+7.7=273.7≈274 -->
  <text x="66" y="274" font-size="22" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <text x="100" y="255" font-size="22" fill="#1e293b" font-weight="700">記錄優勢而非只列問題（Identity + Meaning）</text>
  <text x="100" y="279" font-size="16" fill="#57534e">評估欄位中加入「個人優勢與興趣」：「喜歡音樂、手工藝能力良好、家庭支持強」</text>
  <!-- S-box: y=235+8=243 -->
  <rect x="620" y="243" width="136" height="46" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="261" font-size="15" fill="#78716c" text-anchor="middle">優勢欄位</text>
  <text x="688" y="279" font-size="15" fill="#78716c" text-anchor="middle">評估必填</text>

  <!-- Row 3: 三方參與 (rowY=310, H=62) -->
  <rect x="28" y="310" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="310" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="66" cy="341" r="18" fill="#57534e" opacity="0.15"/>
  <!-- text_y = 310+31+7.7=348.7≈349 -->
  <text x="66" y="349" font-size="22" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <text x="100" y="330" font-size="22" fill="#1e293b" font-weight="700">三方簽名體現 Hope 與 Connectedness</text>
  <text x="100" y="354" font-size="16" fill="#57534e">服務對象本人、家屬（或主要照顧者）、工作人員三方均需簽名或有參與紀錄</text>
  <!-- S-box: y=310+8=318 -->
  <rect x="620" y="318" width="136" height="46" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="336" font-size="15" fill="#57534e" text-anchor="middle">三方</text>
  <text x="688" y="354" font-size="15" fill="#57534e" text-anchor="middle">共同決定</text>

  <!-- Row 4: 季度更新 (rowY=385, H=62) -->
  <rect x="28" y="385" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="385" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="416" r="18" fill="#a8a29e" opacity="0.15"/>
  <!-- text_y = 385+31+7.7=423.7≈424 -->
  <text x="66" y="424" font-size="22" fill="#a8a29e" text-anchor="middle" font-weight="900">4</text>
  <text x="100" y="405" font-size="22" fill="#1e293b" font-weight="700">每3個月更新顯示動態進展（Hope + Empowerment）</text>
  <text x="100" y="429" font-size="16" fill="#57534e">定期更新是評鑑委員確認機構「持續關注個案」的關鍵證據，要有實質修訂說明</text>
  <!-- S-box: y=385+8=393 -->
  <rect x="620" y="393" width="136" height="46" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="411" font-size="15" fill="#a8a29e" text-anchor="middle">每季提醒</text>
  <text x="688" y="429" font-size="15" fill="#a8a29e" text-anchor="middle">系統追蹤</text>

  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
