<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- 標題 -->
  <text x="400" y="50" font-size="26" fill="#1e293b" text-anchor="middle" font-weight="700" >E2 創新服務 — 4 大加分類型</text>
  <!-- N=4: H=62, outer_gap=50, Row y: 145/220/295/370 -->
  <!-- Row 1 -->
  <rect x="50" y="145" width="700" height="62" rx="8" fill="#ffffff"/>
  <rect x="50" y="145" width="6" height="62" rx="3" fill="#9333ea"/>
  <circle cx="85" cy="176" r="16" fill="#9333ea"/>
  <text x="85" y="182" font-size="16" fill="#9333ea" text-anchor="middle" font-weight="700" >1</text>
  <text x="118" y="169" font-size="17" fill="#1e293b" font-weight="700" >服務對象安全提升</text>
  <text x="118" y="191" font-size="14" fill="#57534e" >優於法令標準的高規格設施設備，如智慧床墊、跌倒偵測感測系統、防走失定位裝置</text>
  <rect x="570" y="153" width="168" height="46" rx="6" fill="#9333ea" opacity="0.10"/>
  <text x="654" y="181" font-size="14" fill="#9333ea" text-anchor="middle" font-weight="600" >每項 +0.5 分</text>
  <!-- Row 2 -->
  <rect x="50" y="220" width="700" height="62" rx="8" fill="#ffffff"/>
  <rect x="50" y="220" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="85" cy="251" r="16" fill="#78716c" opacity="0.15"/>
  <text x="85" y="257" font-size="16" fill="#78716c" text-anchor="middle" font-weight="700" >2</text>
  <text x="118" y="244" font-size="17" fill="#1e293b" font-weight="700" >特殊族群創新照護模式</text>
  <text x="118" y="266" font-size="14" fill="#57534e" >失智症個別化照護方案、音樂/藝術治療、非藥物介入的行為精神症狀改善計畫</text>
  <rect x="570" y="228" width="168" height="46" rx="6" fill="#78716c" opacity="0.10"/>
  <text x="654" y="256" font-size="14" fill="#78716c" text-anchor="middle" font-weight="600" >每項 +0.5 分</text>
  <!-- Row 3 -->
  <rect x="50" y="295" width="700" height="62" rx="8" fill="#ffffff"/>
  <rect x="50" y="295" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="85" cy="326" r="16" fill="#57534e" opacity="0.15"/>
  <text x="85" y="332" font-size="16" fill="#57534e" text-anchor="middle" font-weight="700" >3</text>
  <text x="118" y="319" font-size="17" fill="#1e293b" font-weight="700" >配合政策或試辦計畫</text>
  <text x="118" y="341" font-size="14" fill="#57534e" >參與衛福部或縣市政府主導的試辦計畫，如智慧長照試辦、多元族群語言照護計畫</text>
  <rect x="570" y="303" width="168" height="46" rx="6" fill="#57534e" opacity="0.10"/>
  <text x="654" y="331" font-size="14" fill="#57534e" text-anchor="middle" font-weight="600" >每項 +0.5 分</text>
  <!-- Row 4 -->
  <rect x="50" y="370" width="700" height="62" rx="8" fill="#ffffff"/>
  <rect x="50" y="370" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="85" cy="401" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="85" y="407" font-size="16" fill="#a8a29e" text-anchor="middle" font-weight="700" >4</text>
  <text x="118" y="394" font-size="17" fill="#1e293b" font-weight="700" >多元族群語言個別化服務</text>
  <text x="118" y="416" font-size="14" fill="#57534e" >依原住民族或其他族群文化需求，提供母語翻譯或多語文字說明等個別化服務</text>
  <rect x="570" y="378" width="168" height="46" rx="6" fill="#a8a29e" opacity="0.10"/>
  <text x="654" y="406" font-size="14" fill="#a8a29e" text-anchor="middle" font-weight="600" >每項 +0.5 分</text>
  <!-- 說明文字 -->
  <text x="400" y="458" font-size="14" fill="#9333ea" text-anchor="middle" font-weight="500" >評鑑委員共識決認定，最多累計加 2 分；需提供「具體實踐成效」文件</text>
  <!-- 浮水印 -->
  <text x="760" y="482" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" >報告汪 reportwang.com</text>
</svg>