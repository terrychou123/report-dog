<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- @template: list-5 -->
  <rect width="800" height="500" fill="#f0efe8"/>
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">第二章 復健服務 關鍵條目</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">日間型與住宿型各37分，PFM訪談主要集中此章</text>
  <line x1="28" y1="94" x2="772" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- Row 1（y=118, S_rectH=44） -->
  <rect x="28" y="118" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="118" width="6" height="60" rx="2" fill="#d97706"/>
  <circle cx="66" cy="148" r="16" fill="#d97706" opacity="0.15"/>
  <!-- Q text_y = 118 + 44/2 + 21*0.35 = 118+22+7.35 = 147.35 ≈ 147 -->
  <text x="66" y="147" font-size="21" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <text x="100" y="138" font-size="20" fill="#1e293b" font-weight="700">2.1+2.2 復健評估與計畫（各4分）</text>
  <text x="100" y="160" font-size="16" fill="#57534e">整合性評估含自殺風險評估；計畫由三方共訂、每3個月修正，需有簽名紀錄</text>
  <rect x="620" y="126" width="136" height="44" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="143" font-size="16" fill="#d97706" text-anchor="middle">核心基礎</text>
  <text x="688" y="163" font-size="16" fill="#d97706" text-anchor="middle">每3月修正</text>

  <!-- Row 2（y=191, S_rectH=44） -->
  <rect x="28" y="191" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="191" width="6" height="60" rx="2" fill="#78716c"/>
  <circle cx="66" cy="220" r="16" fill="#78716c" opacity="0.15"/>
  <!-- Q text_y = 191 + 44/2 + 21*0.35 = 191+22+7.35 = 220.35 ≈ 220 -->
  <text x="66" y="220" font-size="21" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <text x="100" y="211" font-size="20" fill="#1e293b" font-weight="700">2.3 住宿型獨立生活功能訓練（6分，最高單條）</text>
  <text x="100" y="233" font-size="16" fill="#57534e">個別化訓練課程，涵蓋日常生活技能、自我照顧；日間型2.3為社區生活化多元復健（4分）</text>
  <rect x="620" y="199" width="136" height="44" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="216" font-size="16" fill="#78716c" text-anchor="middle">住宿型最高</text>
  <text x="688" y="236" font-size="16" fill="#78716c" text-anchor="middle">單條配分</text>

  <!-- Row 3（y=264, S_rectH=44） -->
  <rect x="28" y="264" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="264" width="6" height="60" rx="2" fill="#57534e"/>
  <circle cx="66" cy="294" r="16" fill="#57534e" opacity="0.15"/>
  <!-- Q text_y = 264 + 44/2 + 21*0.35 = 264+22+7.35 = 293.35 ≈ 293 -->
  <text x="66" y="293" font-size="21" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <text x="100" y="284" font-size="20" fill="#1e293b" font-weight="700">2.6 工作復健訓練及轉銜服務（4分）</text>
  <text x="100" y="306" font-size="16" fill="#57534e">依職業功能評估提供階段性訓練；需提供多樣化選擇並有完整紀錄</text>
  <rect x="620" y="272" width="136" height="44" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="289" font-size="16" fill="#57534e" text-anchor="middle">職能治療師</text>
  <text x="688" y="309" font-size="16" fill="#57534e" text-anchor="middle">社工主責</text>

  <!-- Row 4（y=337, S_rectH=44） -->
  <rect x="28" y="337" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="337" width="6" height="60" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="367" r="16" fill="#a8a29e" opacity="0.15"/>
  <!-- Q text_y = 337 + 44/2 + 21*0.35 = 337+22+7.35 = 366.35 ≈ 366 -->
  <text x="66" y="366" font-size="21" fill="#a8a29e" text-anchor="middle" font-weight="900">4</text>
  <text x="100" y="357" font-size="20" fill="#1e293b" font-weight="700">2.8 藥物自我管理（PFM）</text>
  <text x="100" y="379" font-size="16" fill="#57534e">60%以上學員/住民自行保管藥物；評鑑委員直接訪談，學員答不出即失分</text>
  <rect x="620" y="345" width="136" height="44" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="362" font-size="16" fill="#6b7280" text-anchor="middle">PFM直接</text>
  <text x="688" y="382" font-size="16" fill="#6b7280" text-anchor="middle">訪談學員</text>

  <!-- Row 5（y=410, S_rectH=44） -->
  <rect x="28" y="410" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="410" width="6" height="60" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="440" r="16" fill="#94a3b8" opacity="0.15"/>
  <!-- Q text_y = 410 + 44/2 + 21*0.35 = 410+22+7.35 = 439.35 ≈ 439 -->
  <text x="66" y="439" font-size="21" fill="#94a3b8" text-anchor="middle" font-weight="900">5</text>
  <text x="100" y="430" font-size="20" fill="#1e293b" font-weight="700">2.12 社區融合（PFM）+ 試評2.13/2.14</text>
  <text x="100" y="452" font-size="16" fill="#57534e">每半年至少1次機構外社區活動；試評項目（社會參與、同儕支持）不計入總分但建議準備</text>
  <rect x="620" y="418" width="136" height="44" rx="8" fill="#94a3b8" opacity="0.12"/>
  <text x="688" y="444" font-size="16" fill="#94a3b8" text-anchor="middle">社區融合PFM</text>

  <text x="760" y="488" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
