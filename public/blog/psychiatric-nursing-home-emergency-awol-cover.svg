<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 右側裝飾區 -->
  <rect x="800" y="0" width="400" height="630" fill="#e8e6de"/>

  <!-- 左側內容區 -->
  <!-- 主標題第1行 -->
  <text x="60" y="155" font-size="120" font-weight="900" fill="#1e293b" >擅離院SOP</text>
  <!-- 主標題第2行 -->
  <text x="60" y="275" font-size="130" font-weight="900" fill="#d97706" >通報實務</text>
  <!-- 副標題 -->
  <text x="60" y="345" font-size="32" fill="#57534e" >精神衛生法第52條通報義務與緊急事件處理</text>

  <!-- 特色標籤 -->
  <rect x="60" y="385" width="120" height="44" rx="22" fill="#d97706"/>
  <text x="120" y="413" font-size="22" fill="white" text-anchor="middle" >B1.10</text>
  <rect x="196" y="385" width="140" height="44" rx="22" fill="#78716c"/>
  <text x="266" y="413" font-size="22" fill="white" text-anchor="middle" >緊急事件</text>
  <rect x="352" y="385" width="140" height="44" rx="22" fill="#57534e"/>
  <text x="422" y="413" font-size="22" fill="white" text-anchor="middle" >精神衛生法</text>

  <!-- 適用對象說明 -->
  <text x="60" y="490" font-size="28" fill="#78716c" >適用：精神護理之家護理人員與管理人員</text>
  <text x="60" y="530" font-size="28" fill="#78716c" >10類緊急事件的SOP建立與評鑑準備</text>

  <!-- 右側裝飾 -->
  <!-- 大數字 -->
  <text x="1000" y="210" font-size="200" font-weight="900" fill="#d97706" text-anchor="middle" >10</text>
  <text x="1000" y="260" font-size="26" fill="#78716c" text-anchor="middle" >類緊急事件</text>

  <!-- 直列pill -->
  <rect x="860" y="295" width="280" height="44" rx="22" fill="white"/>
  <text x="1000" y="323" font-size="20" fill="#d97706" text-anchor="middle" >住民不假外出</text>

  <rect x="860" y="351" width="280" height="44" rx="22" fill="white"/>
  <text x="1000" y="379" font-size="20" fill="#78716c" text-anchor="middle" >精神衛生法</text>

  <rect x="860" y="407" width="280" height="44" rx="22" fill="white"/>
  <text x="1000" y="435" font-size="20" fill="#57534e" text-anchor="middle" >通報家屬</text>

  <rect x="860" y="463" width="280" height="44" rx="22" fill="white"/>
  <text x="1000" y="491" font-size="20" fill="#a8a29e" text-anchor="middle" >報告警察</text>

  <!-- 品牌浮水印 -->
  <text x="1140" y="590" font-size="24" fill="#c4bfb8" text-anchor="end" >報告汪 reportwang.com</text>
</svg>
