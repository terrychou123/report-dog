<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區塊 -->
  <rect x="0" y="0" width="800" height="76" fill="#1e293b"/>
  <text x="400" y="29"  font-size="14" fill="#94a3b8" text-anchor="middle" font-weight="400">A13–A15 教育訓練類</text>
  <text x="400" y="57"  font-size="22" fill="white" text-anchor="middle" font-weight="700">訓練時數要求一覽</text>

  <!-- N=4 版型: H=62, outer_gap=50, Row y: 160/235/310/385 -->

  <!-- Row 1: 職前訓練 16H -->
  <rect x="50" y="100" width="700" height="62" rx="8" fill="white"/>
  <rect x="50" y="100" width="6" height="62" rx="2" fill="#d97706"/>
  <circle cx="87" cy="131" r="16" fill="#d97706" opacity="0.15"/>
  <text x="87" y="137"  font-size="11" fill="white" text-anchor="middle" font-weight="700">A13</text>
  <text x="118" y="125"  font-size="20" fill="#1e293b" font-weight="700">職前訓練 — 16 小時（到職後 1 個月內）</text>
  <text x="118" y="148"  font-size="16" fill="#57534e">感染管制≥4H、個案權益≥2H、勞工安全衛生≥2H；需有適任性考核與意見回饋</text>
  <rect x="556" y="108" width="136" height="46" rx="8" fill="#fef3c7" opacity="0.12"/>
  <text x="624" y="123"  font-size="18" fill="#92400e" text-anchor="middle" font-weight="700">16 H</text>
  <text x="624" y="141"  font-size="14" fill="#92400e" text-anchor="middle">1個月內完成</text>

  <!-- Row 2: 在職訓練 20H -->
  <rect x="50" y="175" width="700" height="62" rx="8" fill="white"/>
  <rect x="50" y="175" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="87" cy="206" r="16" fill="#78716c" opacity="0.15"/>
  <text x="87" y="212"  font-size="11" fill="white" text-anchor="middle" font-weight="700">A14</text>
  <text x="118" y="200"  font-size="20" fill="#1e293b" font-weight="700">在職訓練 — 每人每年 20 小時</text>
  <text x="118" y="223"  font-size="16" fill="#57534e">感染管制專業人員另需8H感染管制課程；機構外訓須有心得報告</text>
  <rect x="556" y="183" width="136" height="46" rx="8" fill="#fef3c7" opacity="0.12"/>
  <text x="624" y="198"  font-size="18" fill="#92400e" text-anchor="middle" font-weight="700">20 H</text>
  <text x="624" y="216"  font-size="14" fill="#92400e" text-anchor="middle">每人每年</text>

  <!-- Row 3: 急救訓練 -->
  <rect x="50" y="250" width="700" height="62" rx="8" fill="white"/>
  <rect x="50" y="250" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="87" cy="281" r="16" fill="#57534e" opacity="0.15"/>
  <text x="87" y="287"  font-size="11" fill="white" text-anchor="middle" font-weight="700">A14</text>
  <text x="118" y="275"  font-size="20" fill="#1e293b" font-weight="700">護理人員 &amp; 照服員 — 急救訓練有效期證明</text>
  <text x="118" y="298"  font-size="16" fill="#57534e">BLS / CPR+AED / ACLS / ENT-1 擇一完訓；含外籍看護工；時數含入20H</text>
  <rect x="556" y="258" width="136" height="46" rx="8" fill="#f5f5f4" opacity="0.12"/>
  <text x="624" y="272"  font-size="14" fill="#57534e" text-anchor="middle" font-weight="600">有效期內</text>
  <text x="624" y="290"  font-size="14" fill="#57534e" text-anchor="middle">完訓證明</text>

  <!-- Row 4: 廚工 8H -->
  <rect x="50" y="325" width="700" height="62" rx="8" fill="white"/>
  <rect x="50" y="325" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="87" cy="356" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="87" y="362"  font-size="11" fill="white" text-anchor="middle" font-weight="700">A15</text>
  <text x="118" y="350"  font-size="20" fill="#1e293b" font-weight="700">廚工 — 丙級執照 + 每年 8 小時外部訓練</text>
  <text x="118" y="373"  font-size="16" fill="#57534e">負責膳食廚工須持丙級以上餐飲技術士執照；8H須為外部（餐飲工會等）訓練</text>
  <rect x="556" y="333" width="136" height="46" rx="8" fill="#f5f5f4" opacity="0.12"/>
  <text x="624" y="348"  font-size="18" fill="#57534e" text-anchor="middle" font-weight="700">8 H</text>
  <text x="624" y="366"  font-size="14" fill="#57534e" text-anchor="middle">外部訓練</text>

  <!-- 提示說明 -->
  <rect x="50" y="404" width="700" height="52" rx="8" fill="#e7e5e4"/>
  <text x="400" y="420"  font-size="16" fill="#57534e" text-anchor="middle" font-weight="700">未滿 1 年新進人員：按任職月數比例計算所需訓練時數</text>
  <text x="400" y="441"  font-size="15" fill="#78716c" text-anchor="middle">建議建立逐人追蹤表，年底前提醒未達標人員補訓</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" >報告汪 reportwang.com</text>
</svg>
