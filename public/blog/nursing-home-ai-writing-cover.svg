<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 右側裝飾區塊 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>

  <!-- 右側大數字 -->
  <text x="1010" y="240" font-size="160" font-weight="900" fill="#d97706" text-anchor="middle" opacity="0.85">AI</text>
  <text x="1010" y="280" font-size="28" fill="#78716c" text-anchor="middle" font-weight="600">文書輔助</text>

  <!-- 右側 2×2 資訊卡片 row1 y=305 row2 y=400 h=86 -->
  <rect x="840" y="305" width="155" height="80" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="918" y="340" font-size="28" fill="#d97706" text-anchor="middle" font-weight="700">75 項</text>
  <text x="918" y="368" font-size="20" fill="#a8a29e" text-anchor="middle">評鑑指標</text>

  <rect x="1005" y="305" width="155" height="80" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="1083" y="340" font-size="28" fill="#78716c" text-anchor="middle" font-weight="700">省 50%</text>
  <text x="1083" y="368" font-size="20" fill="#a8a29e" text-anchor="middle">文書時間</text>

  <rect x="840" y="398" width="155" height="80" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="918" y="433" font-size="28" fill="#57534e" text-anchor="middle" font-weight="700">4 步驟</text>
  <text x="918" y="461" font-size="20" fill="#a8a29e" text-anchor="middle">AI輔助流程</text>

  <rect x="1005" y="398" width="155" height="80" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="1083" y="433" font-size="28" fill="#a8a29e" text-anchor="middle" font-weight="700">B2 A3</text>
  <text x="1083" y="461" font-size="20" fill="#a8a29e" text-anchor="middle">核心文件</text>

  <!-- 右側底部標籤 -->
  <rect x="840" y="494" width="320" height="50" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="1000" y="525" font-size="26" fill="#d97706" text-anchor="middle" font-weight="700">114年度評鑑備審指南</text>

  <!-- 左側主內容區 -->
  <text x="60" y="200" font-size="110" font-weight="900" fill="#1e293b">評鑑文件</text>
  <text x="60" y="330" font-size="110" font-weight="900" fill="#d97706">AI省一半</text>

  <line x1="60" y1="358" x2="780" y2="358" stroke="#dedad3" stroke-width="2"/>

  <text x="60" y="406" font-size="36" fill="#57534e" font-weight="400">75 項文書作業不用再從零開始</text>

  <!-- 標籤列 -->
  <rect x="60" y="442" width="168" height="50" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="144" y="473" font-size="26" fill="#d97706" text-anchor="middle" font-weight="600">AI 報告撰寫</text>

  <rect x="242" y="442" width="148" height="50" rx="10" fill="#78716c" opacity="0.12"/>
  <text x="316" y="473" font-size="26" fill="#78716c" text-anchor="middle" font-weight="600">格式統一</text>

  <rect x="404" y="442" width="168" height="50" rx="10" fill="#57534e" opacity="0.12"/>
  <text x="488" y="473" font-size="26" fill="#57534e" text-anchor="middle" font-weight="600">多人協作</text>

  <!-- 適用對象說明 -->
  <text x="60" y="552" font-size="28" fill="#94a3b8">適用：護理之家、長期照顧機構、養護機構、安養機構</text>

  <!-- 浮水印 -->
  <text x="1140" y="590" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
