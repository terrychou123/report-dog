<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- 標題 -->
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">感染預防 4 大措施面向</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">中小型機構實務操作重點</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- 上排左卡 - 日常監測 -->
  <rect x="40" y="104" width="340" height="168" rx="10" fill="#fff" stroke="#e5e3dc" stroke-width="1"/>
  <rect x="40" y="104" width="340" height="8" rx="4" fill="#d97706"/>
  <text x="210" y="140" text-anchor="middle" font-size="18" fill="#d97706" font-weight="700">日常體溫監測</text>
  <text x="60" y="166" font-size="14" fill="#57534e">• 住民：每日至少測量 1 次</text>
  <text x="60" y="188" font-size="14" fill="#57534e">• 員工：每週至少測量 1 次</text>
  <text x="60" y="210" font-size="14" fill="#57534e">• 記錄表格須完整有姓名日期</text>
  <text x="60" y="232" font-size="14" fill="#57534e">• 異常發燒立即通報護理人員</text>
  <text x="60" y="258" font-size="14" fill="#d97706" font-weight="600">* 紀錄完整是查核重點</text>

  <!-- 上排右卡 - 環境清潔 -->
  <rect x="420" y="104" width="340" height="168" rx="10" fill="#fff" stroke="#e5e3dc" stroke-width="1"/>
  <rect x="420" y="104" width="340" height="8" rx="4" fill="#78716c"/>
  <text x="590" y="140" text-anchor="middle" font-size="18" fill="#78716c" font-weight="700">環境清潔消毒</text>
  <text x="440" y="166" font-size="14" fill="#57534e">• 每間寢室備洗手設施</text>
  <text x="440" y="188" font-size="14" fill="#57534e">• 酒精消毒液須在效期內</text>
  <text x="440" y="210" font-size="14" fill="#57534e">• 每3個月環境消毒並有紀錄</text>
  <text x="440" y="232" font-size="14" fill="#57534e">• 污物動線避免穿越用餐區</text>
  <text x="440" y="258" font-size="14" fill="#78716c" font-weight="600">* 實地察看洗手設施是必查點</text>

  <!-- 下排左卡 - 通報機制 -->
  <rect x="40" y="288" width="340" height="162" rx="10" fill="#fff" stroke="#e5e3dc" stroke-width="1"/>
  <rect x="40" y="288" width="340" height="8" rx="4" fill="#d97706"/>
  <text x="210" y="322" text-anchor="middle" font-size="18" fill="#d97706" font-weight="700">傳染病通報機制</text>
  <text x="60" y="348" font-size="14" fill="#57534e">• 疥瘡、呼吸道、腸道傳染病</text>
  <text x="60" y="370" font-size="14" fill="#57534e">• 不明原因發燒及群聚感染</text>
  <text x="60" y="392" font-size="14" fill="#57534e">• 訂有明確通報作業流程</text>
  <text x="60" y="414" font-size="14" fill="#57534e">• 依規定按時上網登載</text>
  <text x="60" y="440" font-size="14" fill="#d97706" font-weight="600">* 通報流程工作人員須熟悉</text>

  <!-- 下排右卡 - 疫苗策略 -->
  <rect x="420" y="288" width="340" height="162" rx="10" fill="#fff" stroke="#e5e3dc" stroke-width="1"/>
  <rect x="420" y="288" width="340" height="8" rx="4" fill="#78716c"/>
  <text x="590" y="322" text-anchor="middle" font-size="18" fill="#78716c" font-weight="700">疫苗接種策略</text>
  <text x="440" y="348" font-size="14" fill="#57534e">• 繕造流感疫苗接種名冊</text>
  <text x="440" y="370" font-size="14" fill="#57534e">• 配合政策施打疫苗</text>
  <text x="440" y="392" font-size="14" fill="#57534e">• 未打者原因須有紀錄</text>
  <text x="440" y="414" font-size="14" fill="#57534e">• 建立鼓勵接種書面策略</text>
  <text x="440" y="440" font-size="14" fill="#78716c" font-weight="600">* 名冊格式完整為查核重點</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
