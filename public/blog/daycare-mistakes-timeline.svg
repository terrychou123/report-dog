<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"
     font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">5 大評鑑扣分地雷</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">照顧計畫・追蹤評值・督導紀錄・品管指標・教育訓練</text>
  <line x1="28" y1="94" x2="776" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- 箭頭 N=5, arrow_y=279 -->
  <!-- 0→1: card[0] right=28+140=168, card[1] left=180 -->
  <line x1="168" y1="279" x2="180" y2="279" stroke="#c4bfb8" stroke-width="2"/>
  <polygon points="168,273 180,279 168,285" fill="#c4bfb8"/>
  <!-- 1→2: 320→332 -->
  <line x1="320" y1="279" x2="332" y2="279" stroke="#c4bfb8" stroke-width="2"/>
  <polygon points="320,273 332,279 320,285" fill="#c4bfb8"/>
  <!-- 2→3: 472→484 -->
  <line x1="472" y1="279" x2="484" y2="279" stroke="#c4bfb8" stroke-width="2"/>
  <polygon points="472,273 484,279 472,285" fill="#c4bfb8"/>
  <!-- 3→4: 624→636 -->
  <line x1="624" y1="279" x2="636" y2="279" stroke="#c4bfb8" stroke-width="2"/>
  <polygon points="624,273 636,279 624,285" fill="#c4bfb8"/>

  <!-- N=5 card_w=140 arrow_gap=12 r=35
       H_font=28（4字標題）gap=40
       cy=191 STEP_y=182 0N_y=205
       H_y=286 J1_y=310 J2_y=332
       pill_y=372 pill_text_y=396 pill_w=114 -->

  <!-- Step 0: 照顧計畫 #d97706 x=28 cx=98 -->
  <rect x="28" y="108" width="140" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="108" width="140" height="8" rx="4" fill="#d97706"/>
  <rect x="28" y="112" width="140" height="4" fill="#d97706"/>
  <circle cx="98" cy="191" r="35" fill="#fef3c7"/>
  <text x="98" y="182" text-anchor="middle" font-size="14" fill="#d97706" font-weight="700">STEP</text>
  <text x="98" y="205" text-anchor="middle" font-size="23" fill="#d97706" font-weight="700">01</text>
  <text x="98" y="286" text-anchor="middle" font-size="28" fill="#1e293b" font-weight="700">照顧計畫</text>
  <text x="98" y="310" text-anchor="middle" font-size="16" fill="#57534e">7工作天期限</text>
  <text x="98" y="332" text-anchor="middle" font-size="16" fill="#57534e">家屬參與記錄</text>
  <rect x="41" y="372" width="114" height="36" rx="18" fill="#fef3c7"/>
  <text x="98" y="396" text-anchor="middle" font-size="14" fill="#d97706" font-weight="600">第 6 條</text>

  <!-- Step 1: 追蹤評值 #78716c x=180 cx=250 -->
  <rect x="180" y="108" width="140" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="180" y="108" width="140" height="8" rx="4" fill="#78716c"/>
  <rect x="180" y="112" width="140" height="4" fill="#78716c"/>
  <circle cx="250" cy="191" r="35" fill="#f5f5f4"/>
  <text x="250" y="182" text-anchor="middle" font-size="14" fill="#78716c" font-weight="700">STEP</text>
  <text x="250" y="205" text-anchor="middle" font-size="23" fill="#78716c" font-weight="700">02</text>
  <text x="250" y="286" text-anchor="middle" font-size="28" fill="#1e293b" font-weight="700">追蹤評值</text>
  <text x="250" y="310" text-anchor="middle" font-size="16" fill="#57534e">未達成要分析</text>
  <text x="250" y="332" text-anchor="middle" font-size="16" fill="#57534e">計畫修正要留紀</text>
  <rect x="193" y="372" width="114" height="36" rx="18" fill="#f5f5f4"/>
  <text x="250" y="396" text-anchor="middle" font-size="14" fill="#78716c" font-weight="600">第 7 條</text>

  <!-- Step 2: 督導紀錄 #57534e x=332 cx=402 -->
  <rect x="332" y="108" width="140" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="332" y="108" width="140" height="8" rx="4" fill="#57534e"/>
  <rect x="332" y="112" width="140" height="4" fill="#57534e"/>
  <circle cx="402" cy="191" r="35" fill="#f5f0eb"/>
  <text x="402" y="182" text-anchor="middle" font-size="14" fill="#57534e" font-weight="700">STEP</text>
  <text x="402" y="205" text-anchor="middle" font-size="23" fill="#57534e" font-weight="700">03</text>
  <text x="402" y="286" text-anchor="middle" font-size="28" fill="#1e293b" font-weight="700">督導紀錄</text>
  <text x="402" y="310" text-anchor="middle" font-size="16" fill="#57534e">個督每半年</text>
  <text x="402" y="332" text-anchor="middle" font-size="16" fill="#57534e">團督每一季</text>
  <rect x="345" y="372" width="114" height="36" rx="18" fill="#f5f0eb"/>
  <text x="402" y="396" text-anchor="middle" font-size="14" fill="#57534e" font-weight="600">第 9 條</text>

  <!-- Step 3: 品管指標 #a8a29e x=484 cx=554 -->
  <rect x="484" y="108" width="140" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="484" y="108" width="140" height="8" rx="4" fill="#a8a29e"/>
  <rect x="484" y="112" width="140" height="4" fill="#a8a29e"/>
  <circle cx="554" cy="191" r="35" fill="#f5f5f4"/>
  <text x="554" y="182" text-anchor="middle" font-size="14" fill="#a8a29e" font-weight="700">STEP</text>
  <text x="554" y="205" text-anchor="middle" font-size="23" fill="#a8a29e" font-weight="700">04</text>
  <text x="554" y="286" text-anchor="middle" font-size="28" fill="#1e293b" font-weight="700">品管指標</text>
  <text x="554" y="310" text-anchor="middle" font-size="16" fill="#57534e">自訂至少兩項</text>
  <text x="554" y="332" text-anchor="middle" font-size="16" fill="#57534e">逐案異常分析</text>
  <rect x="497" y="372" width="114" height="36" rx="18" fill="#f5f5f4"/>
  <text x="554" y="396" text-anchor="middle" font-size="14" fill="#a8a29e" font-weight="600">第 22 條</text>

  <!-- Step 4: 教育訓練 #94a3b8 x=636 cx=706 -->
  <rect x="636" y="108" width="140" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="636" y="108" width="140" height="8" rx="4" fill="#94a3b8"/>
  <rect x="636" y="112" width="140" height="4" fill="#94a3b8"/>
  <circle cx="706" cy="191" r="35" fill="#f1f5f9"/>
  <text x="706" y="182" text-anchor="middle" font-size="14" fill="#94a3b8" font-weight="700">STEP</text>
  <text x="706" y="205" text-anchor="middle" font-size="23" fill="#94a3b8" font-weight="700">05</text>
  <text x="706" y="286" text-anchor="middle" font-size="28" fill="#1e293b" font-weight="700">教育訓練</text>
  <text x="706" y="310" text-anchor="middle" font-size="16" fill="#57534e">每年至少20時</text>
  <text x="706" y="332" text-anchor="middle" font-size="16" fill="#57534e">必要課程齊備</text>
  <rect x="649" y="372" width="114" height="36" rx="18" fill="#f1f5f9"/>
  <text x="706" y="396" text-anchor="middle" font-size="14" fill="#94a3b8" font-weight="600">第 29 條</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
