  <rect x="20" y="420" width="368" height="76" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="20" y="420" width="6" height="76" rx="3" fill="#0d9488"/>
  <circle cx="52" cy="458" r="18" fill="#0d9488" opacity="0.15"/>
  <text x="52" y="464" text-anchor="middle" font-size="18" fill="#0d9488" font-weight="900">5</text>
  <text x="78" y="446" font-size="16" fill="#1e293b" font-weight="700">2.6.1 手術安全查核</text>
  <text x="78" y="468" font-size="14" fill="#57534e">Time Out 程序未全員參與</text>
  <rect x="308" y="434" width="72" height="28" rx="8" fill="#0d9488" opacity="0.12"/>
  <text x="344" y="453" text-anchor="middle" font-size="13" fill="#0d9488" font-weight="600">必要‧訪談</text>

  <!-- ===== 右欄：失分 #6-#10 (col_x=412) ===== -->

  <!-- #6 2.2.1 品質指標管理 (y=88) -->
  <rect x="412" y="88" width="368" height="76" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="412" y="88" width="6" height="76" rx="3" fill="#d97706"/>
  <circle cx="444" cy="126" r="18" fill="#d97706" opacity="0.15"/>
  <text x="444" y="132" text-anchor="middle" font-size="18" fill="#d97706" font-weight="900">6</text>
  <text x="470" y="114" font-size="16" fill="#1e293b" font-weight="700">2.2.1 品質指標管理</text>
