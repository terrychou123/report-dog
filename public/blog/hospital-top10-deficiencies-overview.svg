<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題 -->
  <text x="400" y="40" text-anchor="middle" font-size="28" fill="#1e293b" font-weight="700">10大常見失分條文一覽</text>
  <text x="400" y="66" text-anchor="middle" font-size="18" fill="#57534e">依失分風險程度排列，10項全數為必要條文</text>
  <line x1="20" y1="80" x2="780" y2="80" stroke="#dedad3" stroke-width="1"/>

  <!-- ===== 左欄：失分 #1-#5 (col_x=20) ===== -->

  <!-- #1 2.7.2 標準防護措施 (y=88) -->
  <rect x="20" y="88" width="368" height="76" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="20" y="88" width="6" height="76" rx="3" fill="#dc2626"/>
  <circle cx="52" cy="126" r="18" fill="#dc2626" opacity="0.15"/>
  <text x="52" y="132" text-anchor="middle" font-size="18" fill="#dc2626" font-weight="900">1</text>
  <text x="78" y="114" font-size="16" fill="#1e293b" font-weight="700">2.7.2 標準防護措施</text>
  <text x="78" y="136" font-size="14" fill="#57534e">手部衛生稽核、PPE、隔離措施（三重查核）</text>
  <rect x="308" y="102" width="72" height="28" rx="8" fill="#dc2626" opacity="0.12"/>
  <text x="344" y="121" text-anchor="middle" font-size="13" fill="#dc2626" font-weight="600">必要‧三重</text>

  <!-- #2 1.3.2 護理人力配置 (y=171) -->
  <rect x="20" y="171" width="368" height="76" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="20" y="171" width="6" height="76" rx="3" fill="#2563eb"/>
  <circle cx="52" cy="209" r="18" fill="#2563eb" opacity="0.15"/>
  <text x="52" y="215" text-anchor="middle" font-size="18" fill="#2563eb" font-weight="900">2</text>
  <text x="78" y="197" font-size="16" fill="#1e293b" font-weight="700">1.3.2 護理人力配置</text>
  <text x="78" y="219" font-size="14" fill="#57534e">護病比計算公式、夜班人員安排</text>
  <rect x="308" y="185" width="72" height="28" rx="8" fill="#2563eb" opacity="0.12"/>
  <text x="344" y="204" text-anchor="middle" font-size="13" fill="#2563eb" font-weight="600">必要‧資料</text>

  <!-- #3 2.2.3 異常事件通報 (y=254) -->
  <rect x="20" y="254" width="368" height="76" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="20" y="254" width="6" height="76" rx="3" fill="#16a34a"/>
  <circle cx="52" cy="292" r="18" fill="#16a34a" opacity="0.15"/>
  <text x="52" y="298" text-anchor="middle" font-size="18" fill="#16a34a" font-weight="900">3</text>
  <text x="78" y="280" font-size="16" fill="#1e293b" font-weight="700">2.2.3 異常事件通報</text>
  <text x="78" y="302" font-size="14" fill="#57534e">RCA 品質、改善措施追蹤</text>
  <rect x="308" y="268" width="72" height="28" rx="8" fill="#16a34a" opacity="0.12"/>
  <text x="344" y="287" text-anchor="middle" font-size="13" fill="#16a34a" font-weight="600">必要‧資料</text>

