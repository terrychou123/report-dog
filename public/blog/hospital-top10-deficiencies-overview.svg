  <rect x="700" y="102" width="72" height="28" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="736" y="121" text-anchor="middle" font-size="13" fill="#d97706" font-weight="600">必要‧訪談</text>

  <!-- #7 1.4.1 病歷書寫管理 (y=171) -->
  <rect x="412" y="171" width="368" height="76" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="412" y="171" width="6" height="76" rx="3" fill="#4f46e5"/>
  <circle cx="444" cy="209" r="18" fill="#4f46e5" opacity="0.15"/>
  <text x="444" y="215" text-anchor="middle" font-size="18" fill="#4f46e5" font-weight="900">7</text>
  <text x="470" y="197" font-size="16" fill="#1e293b" font-weight="700">1.4.1 病歷書寫管理</text>
  <text x="470" y="219" font-size="14" fill="#57534e">書寫時效不符、出院摘要延遲</text>
  <rect x="700" y="185" width="72" height="28" rx="8" fill="#4f46e5" opacity="0.12"/>
  <text x="736" y="204" text-anchor="middle" font-size="13" fill="#4f46e5" font-weight="600">必要‧資料</text>

  <!-- #8 2.1.2 知情同意作業 (y=254) -->
  <rect x="412" y="254" width="368" height="76" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="412" y="254" width="6" height="76" rx="3" fill="#ea580c"/>
  <circle cx="444" cy="292" r="18" fill="#ea580c" opacity="0.15"/>
  <text x="444" y="298" text-anchor="middle" font-size="18" fill="#ea580c" font-weight="900">8</text>
  <text x="470" y="280" font-size="16" fill="#1e293b" font-weight="700">2.1.2 知情同意作業</text>
  <text x="470" y="302" font-size="14" fill="#57534e">緊急情況程序缺漏、SOP 未書面化</text>
  <rect x="700" y="268" width="72" height="28" rx="8" fill="#ea580c" opacity="0.12"/>
  <text x="736" y="287" text-anchor="middle" font-size="13" fill="#ea580c" font-weight="600">必要‧訪談</text>

  <!-- #9 1.5.2 消防安全管理 (y=337) -->
  <rect x="412" y="337" width="368" height="76" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="412" y="337" width="6" height="76" rx="3" fill="#9333ea"/>
  <circle cx="444" cy="375" r="18" fill="#9333ea" opacity="0.15"/>
  <text x="444" y="381" text-anchor="middle" font-size="18" fill="#9333ea" font-weight="900">9</text>
  <text x="470" y="363" font-size="16" fill="#1e293b" font-weight="700">1.5.2 消防安全管理</text>
  <text x="470" y="385" font-size="14" fill="#57534e">夜間演練未辦、設備逾期</text>
  <rect x="700" y="351" width="72" height="28" rx="8" fill="#9333ea" opacity="0.12"/>
  <text x="736" y="370" text-anchor="middle" font-size="13" fill="#9333ea" font-weight="600">必要‧實地</text>

  <!-- #10 2.7.3 HAI 感染監測 (y=420) -->
  <rect x="412" y="420" width="368" height="76" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="412" y="420" width="6" height="76" rx="3" fill="#be123c"/>
  <circle cx="444" cy="458" r="18" fill="#be123c" opacity="0.15"/>
  <text x="444" y="464" text-anchor="middle" font-size="17" fill="#be123c" font-weight="900">10</text>
  <text x="470" y="446" font-size="16" fill="#1e293b" font-weight="700">2.7.3 HAI 感染監測</text>
  <text x="470" y="468" font-size="14" fill="#57534e">感染率計算方式不標準、異常未調查</text>
  <rect x="700" y="434" width="72" height="28" rx="8" fill="#be123c" opacity="0.12"/>
  <text x="736" y="453" text-anchor="middle" font-size="13" fill="#be123c" font-weight="600">必要‧資料</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
