  <rect x="20" y="337" width="368" height="76" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="20" y="337" width="6" height="76" rx="3" fill="#7c3aed"/>
  <circle cx="52" cy="375" r="18" fill="#7c3aed" opacity="0.15"/>
  <text x="52" y="381" text-anchor="middle" font-size="18" fill="#7c3aed" font-weight="900">4</text>
