  <!-- Row 1 -->
  <rect x="28" y="108" width="744" height="62" rx="8" fill="#ffffff"/>
  <rect x="28" y="108" width="6" height="62" rx="3" fill="#d97706"/>
  <circle cx="66" cy="121" r="16" fill="#d97706"/>
  <text x="66" y="127" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">主任</text>
