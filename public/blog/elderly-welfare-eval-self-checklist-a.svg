<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- Header y=29, h=60 -->
  <rect x="40" y="29" width="720" height="60" rx="10" fill="#1e293b"/>
  <text x="400" y="58" font-size="22" font-weight="700" fill="#ffffff" font-family="sans-serif" text-anchor="middle">A 區：行政管理效能 — 5 大核心自評問題（A1–A15）</text>
  <text x="400" y="79" font-size="14" fill="#a8a29e" font-family="sans-serif" text-anchor="middle"> </text>

  <!-- N=5 版型：H=60, inner_gap=13, outer_gap=29 -->
  <!-- Row1 y=118 -->
  <rect x="40" y="118" width="720" height="60" rx="8" fill="#ffffff"/>
  <rect x="40" y="118" width="6" height="60" rx="3" fill="#d97706"/>
  <circle cx="66" cy="148" r="16" fill="#d97706"/>
  <text x="66" y="154" font-size="16" font-weight="700" fill="#ffffff" font-family="sans-serif" text-anchor="middle">A1</text>
  <text x="100" y="140" font-size="18" font-weight="700" fill="#1e293b" font-family="sans-serif">工作手冊年度審閱</text>
  <text x="100" y="161" font-size="14" fill="#57534e" font-family="sans-serif">至少每年 1 次修訂並有日期、負責人簽名記錄</text>
  <rect x="620" y="129" width="128" height="38" rx="6" fill="#fef3c7"/>
  <text x="684" y="153" font-size="14" font-weight="700" fill="#d97706" font-family="sans-serif" text-anchor="middle">每年必查</text>

  <!-- Row2 y=191 -->
  <rect x="40" y="191" width="720" height="60" rx="8" fill="#ffffff"/>
  <rect x="40" y="191" width="6" height="60" rx="3" fill="#78716c"/>
  <circle cx="66" cy="221" r="16" fill="#78716c"/>
  <text x="66" y="227" font-size="16" font-weight="700" fill="#ffffff" font-family="sans-serif" text-anchor="middle">A2</text>
  <text x="100" y="213" font-size="18" font-weight="700" fill="#1e293b" font-family="sans-serif">近4年違規紀錄清查</text>
  <text x="100" y="234" font-size="14" fill="#57534e" font-family="sans-serif">衛生、消防、建管、勞工查核缺失改善率需達100%（A4）</text>
  <rect x="620" y="202" width="128" height="38" rx="6" fill="#fee2e2"/>
  <text x="684" y="226" font-size="14" font-weight="700" fill="#dc2626" font-family="sans-serif" text-anchor="middle">二級加強</text>

  <!-- Row3 y=264 -->
  <rect x="40" y="264" width="720" height="60" rx="8" fill="#ffffff"/>
  <rect x="40" y="264" width="6" height="60" rx="3" fill="#57534e"/>
  <circle cx="66" cy="294" r="16" fill="#57534e"/>
  <text x="66" y="300" font-size="16" font-weight="700" fill="#ffffff" font-family="sans-serif" text-anchor="middle">A9</text>
  <text x="100" y="286" font-size="18" font-weight="700" fill="#1e293b" font-family="sans-serif">護理人員24小時排班</text>
  <text x="100" y="307" font-size="14" fill="#57534e" font-family="sans-serif">全日均須有護理人員，夜班、假日不得僅靠照服員</text>
  <rect x="620" y="275" width="128" height="38" rx="6" fill="#fee2e2"/>
  <text x="684" y="299" font-size="14" font-weight="700" fill="#dc2626" font-family="sans-serif" text-anchor="middle">高風險缺失</text>

  <!-- Row4 y=337 -->
  <rect x="40" y="337" width="720" height="60" rx="8" fill="#ffffff"/>
  <rect x="40" y="337" width="6" height="60" rx="3" fill="#a8a29e"/>
  <circle cx="66" cy="367" r="16" fill="#a8a29e"/>
  <text x="66" y="373" font-size="14" font-weight="700" fill="#ffffff" font-family="sans-serif" text-anchor="middle">A13</text>
  <text x="100" y="359" font-size="18" font-weight="700" fill="#1e293b" font-family="sans-serif">新進員工職前訓練16小時</text>
  <text x="100" y="380" font-size="14" fill="#57534e" font-family="sans-serif">到職後1個月內完成，含感染管制4h、個案權益2h、勞安2h</text>
  <rect x="620" y="348" width="128" height="38" rx="6" fill="#fef3c7"/>
  <text x="684" y="372" font-size="14" font-weight="700" fill="#d97706" font-family="sans-serif" text-anchor="middle">1個月內</text>

  <!-- Row5 y=410 -->
  <rect x="40" y="410" width="720" height="60" rx="8" fill="#ffffff"/>
  <rect x="40" y="410" width="6" height="60" rx="3" fill="#94a3b8"/>
  <circle cx="66" cy="440" r="16" fill="#94a3b8"/>
  <text x="66" y="446" font-size="14" font-weight="700" fill="#ffffff" font-family="sans-serif" text-anchor="middle">A14</text>
  <text x="100" y="432" font-size="18" font-weight="700" fill="#1e293b" font-family="sans-serif">在職訓練每人每年20小時</text>
  <text x="100" y="453" font-size="14" fill="#57534e" font-family="sans-serif">硬性規定，另需急救有效期內完訓證明（護理、照服員）</text>
  <rect x="620" y="421" width="128" height="38" rx="6" fill="#fef3c7"/>
  <text x="684" y="445" font-size="14" font-weight="700" fill="#d97706" font-family="sans-serif" text-anchor="middle">每季抽查</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" font-family="sans-serif">報告汪 reportwang.com</text>
</svg>
