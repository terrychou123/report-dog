<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- Header y=29, h=60 -->
  <rect x="40" y="29" width="720" height="60" rx="10" fill="#1e293b"/>
  <text x="400" y="58" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">A 區：行政管理效能 — 5 大核心自評問題（A1–A15）</text>

  <!-- N=5 版型：H=60, inner_gap=13, outer_gap=29 -->
  <!-- Row1 y=118 -->
  <rect x="28" y="118" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="118" width="6" height="60" rx="2" fill="#d97706"/>
  <circle cx="66" cy="148" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="154" font-size="16" font-weight="900" fill="#d97706" text-anchor="middle">A1</text>
  <text x="100" y="145" font-size="20" font-weight="700" fill="#1e293b">工作手冊年度審閱</text>
  <text x="100" y="166" font-size="16" fill="#57534e">至少每年 1 次修訂並有日期、負責人簽名記錄</text>
  <rect x="620" y="126" width="136" height="44" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="154" font-size="16" fill="#d97706" text-anchor="middle">每年必查</text>

  <!-- Row2 y=191 -->
  <rect x="28" y="191" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="191" width="6" height="60" rx="2" fill="#78716c"/>
  <circle cx="66" cy="221" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="227" font-size="16" font-weight="900" fill="#78716c" text-anchor="middle">A2</text>
  <text x="100" y="218" font-size="20" font-weight="700" fill="#1e293b">近4年違規紀錄清查</text>
  <text x="100" y="239" font-size="16" fill="#57534e">衛生、消防、建管、勞工查核缺失改善率需達100%（A4）</text>
  <rect x="620" y="199" width="136" height="44" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="227" font-size="16" fill="#78716c" text-anchor="middle">二級加強</text>

  <!-- Row3 y=264 -->
  <rect x="28" y="264" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="264" width="6" height="60" rx="2" fill="#57534e"/>
  <circle cx="66" cy="294" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="300" font-size="16" font-weight="900" fill="#57534e" text-anchor="middle">A9</text>
  <text x="100" y="291" font-size="20" font-weight="700" fill="#1e293b">護理人員24小時排班</text>
  <text x="100" y="312" font-size="16" fill="#57534e">全日均須有護理人員，夜班、假日不得僅靠照服員</text>
  <rect x="620" y="272" width="136" height="44" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="300" font-size="16" fill="#57534e" text-anchor="middle">高風險缺失</text>

  <!-- Row4 y=337 -->
  <rect x="28" y="337" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="337" width="6" height="60" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="367" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="373" font-size="16" font-weight="900" fill="#a8a29e" text-anchor="middle">A13</text>
  <text x="100" y="364" font-size="20" font-weight="700" fill="#1e293b">新進員工職前訓練16小時</text>
  <text x="100" y="385" font-size="16" fill="#57534e">到職後1個月內完成，含感染管制4h、個案權益2h、勞安2h</text>
  <rect x="620" y="345" width="136" height="44" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="373" font-size="16" fill="#a8a29e" text-anchor="middle">1個月內</text>

  <!-- Row5 y=410 -->
  <rect x="28" y="410" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="410" width="6" height="60" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="440" r="16" fill="#94a3b8" opacity="0.15"/>
  <text x="66" y="446" font-size="16" font-weight="900" fill="#94a3b8" text-anchor="middle">A14</text>
  <text x="100" y="437" font-size="20" font-weight="700" fill="#1e293b">在職訓練每人每年20小時</text>
  <text x="100" y="458" font-size="16" fill="#57534e">硬性規定，另需急救有效期內完訓證明（護理、照服員）</text>
  <rect x="620" y="418" width="136" height="44" rx="8" fill="#94a3b8" opacity="0.12"/>
  <text x="688" y="446" font-size="16" fill="#94a3b8" text-anchor="middle">每季抽查</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
