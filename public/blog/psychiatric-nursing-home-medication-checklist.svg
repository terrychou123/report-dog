<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題 -->
  <text x="400" y="48" font-size="32" fill="#1e293b" text-anchor="middle"  font-weight="700">用藥管理自評清單</text>
  <text x="400" y="78" font-size="22" fill="#78716c" text-anchor="middle" >評鑑前確認B1.6的七項子要求</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#dedad3" stroke-width="2"/>

  <!-- 左欄標題 -->
  <rect x="40" y="110" width="340" height="44" rx="8" fill="#d97706"/>
  <text x="210" y="138" font-size="20" fill="white" text-anchor="middle"  font-weight="700">藥品管理</text>

  <!-- 右欄標題 -->
  <rect x="420" y="110" width="340" height="44" rx="8" fill="#78716c"/>
  <text x="590" y="138" font-size="20" fill="white" text-anchor="middle"  font-weight="700">給藥程序</text>

  <!-- 左欄項目1 確認 -->
  <rect x="40" y="165" width="340" height="64" rx="8" fill="white"/>
  <rect x="55" y="182" width="24" height="24" rx="4" fill="#d97706"/>
  <text x="67" y="199" font-size="16" fill="white" text-anchor="middle"  font-weight="700">✓</text>
  <text x="95" y="193" font-size="16" fill="#1e293b"  font-weight="700">確認：藥品分區儲存</text>
  <text x="95" y="215" font-size="14" fill="#78716c" >一般藥品與管制藥品分開存放</text>

  <!-- 左欄項目2 確認 -->
  <rect x="40" y="240" width="340" height="64" rx="8" fill="white"/>
  <rect x="55" y="257" width="24" height="24" rx="4" fill="#d97706"/>
  <text x="67" y="274" font-size="16" fill="white" text-anchor="middle"  font-weight="700">✓</text>
  <text x="95" y="268" font-size="16" fill="#1e293b"  font-weight="700">確認：標示完整</text>
  <text x="95" y="290" font-size="14" fill="#78716c" >姓名、時間、劑量均有標示</text>

  <!-- 左欄項目3 待確認 -->
  <rect x="40" y="315" width="340" height="64" rx="8" fill="white"/>
  <rect x="55" y="332" width="24" height="24" rx="4" fill="#a8a29e"/>
  <text x="67" y="349" font-size="14" fill="white" text-anchor="middle"  font-weight="700">!</text>
  <text x="95" y="343" font-size="16" fill="#1e293b"  font-weight="700">待確認：有效期限</text>
  <text x="95" y="365" font-size="14" fill="#78716c" >有效期限全數在效，無過期藥品</text>

  <!-- 右欄項目1 確認 -->
  <rect x="420" y="165" width="340" height="64" rx="8" fill="white"/>
  <rect x="435" y="182" width="24" height="24" rx="4" fill="#78716c"/>
  <text x="447" y="199" font-size="16" fill="white" text-anchor="middle"  font-weight="700">✓</text>
  <text x="475" y="193" font-size="16" fill="#1e293b"  font-weight="700">確認：有三讀五對SOP</text>
  <text x="475" y="215" font-size="14" fill="#78716c" >書面化作業程序已建立</text>

  <!-- 右欄項目2 確認 -->
  <rect x="420" y="240" width="340" height="64" rx="8" fill="white"/>
  <rect x="435" y="257" width="24" height="24" rx="4" fill="#78716c"/>
  <text x="447" y="274" font-size="16" fill="white" text-anchor="middle"  font-weight="700">✓</text>
  <text x="475" y="268" font-size="16" fill="#1e293b"  font-weight="700">確認：護理師有給藥記錄</text>
  <text x="475" y="290" font-size="14" fill="#78716c" >每次給藥均有護理紀錄</text>

  <!-- 右欄項目3 待確認 -->
  <rect x="420" y="315" width="340" height="64" rx="8" fill="white"/>
  <rect x="435" y="332" width="24" height="24" rx="4" fill="#a8a29e"/>
  <text x="447" y="349" font-size="14" fill="white" text-anchor="middle"  font-weight="700">!</text>
  <text x="475" y="343" font-size="16" fill="#1e293b"  font-weight="700">待確認：管制藥品銷燬紀錄</text>
  <text x="475" y="365" font-size="14" fill="#78716c" >不再使用藥品是否有回收紀錄</text>

  <!-- 品牌浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" >報告汪 reportwang.com</text>
</svg>
