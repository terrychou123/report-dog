<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- 背景 -->
  <rect width="800" height="500" fill="#fafaf9"/>

  <!-- 頂部標題區塊 -->
  <rect x="0" y="0" width="800" height="108" rx="0" fill="#1c1917"/>
  <text x="400" y="52"  font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">出院教育七大項目（前4項）</text>
  <text x="400" y="82"  font-size="14" fill="#a8a29e" text-anchor="middle">每項需有書面記錄及家屬確認簽名，評鑑委員訪談必查</text>

  <!-- 列 1 (y=128) -->
  <rect x="38" y="128" width="724" height="80" rx="10" fill="#fffbeb"/>
  <rect x="38" y="128" width="6" height="80" rx="2" fill="#d97706"/>
  <circle cx="80" cy="168" r="20" fill="#d97706" opacity="0.15"/>
  <text x="80" y="175"  font-size="20" font-weight="900" fill="#d97706" text-anchor="middle">1</text>
  <text x="116" y="153"  font-size="15" font-weight="700" fill="#92400e">藥物使用衛教</text>
  <text x="116" y="175"  font-size="14" fill="#78716c">出院用藥名稱、劑量、頻次、副作用、特殊注意事項，家屬確認知悉</text>
  <text x="116" y="198"  font-size="14" fill="#a8a29e">提供藥品說明書，服藥時間與食物交互作用特別說明</text>
  <rect x="624" y="147" width="114" height="26" rx="13" fill="#d97706"/>
  <text x="681" y="165"  font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">用藥安全</text>

  <!-- 列 2 (y=228) -->
  <rect x="38" y="228" width="724" height="80" rx="10" fill="#f5f5f4"/>
  <rect x="38" y="228" width="6" height="80" rx="2" fill="#78716c"/>
  <circle cx="80" cy="268" r="20" fill="#78716c" opacity="0.15"/>
  <text x="80" y="275"  font-size="20" font-weight="900" fill="#78716c" text-anchor="middle">2</text>
  <text x="116" y="253"  font-size="15" font-weight="700" fill="#44403c">飲食指導</text>
  <text x="116" y="275"  font-size="14" fill="#78716c">依診斷給予個別化飲食建議（如糖尿病、心臟病、腎病飲食），有書面衛教單</text>
  <text x="116" y="298"  font-size="14" fill="#a8a29e">制式衛教單不夠，需標注個別化限制事項（如低鈉、低磷）</text>
  <rect x="624" y="247" width="114" height="26" rx="13" fill="#78716c"/>
  <text x="681" y="265"  font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">飲食管理</text>

  <!-- 列 3 (y=328) -->
  <rect x="38" y="328" width="724" height="80" rx="10" fill="#f5f5f4"/>
  <rect x="38" y="328" width="6" height="80" rx="2" fill="#57534e"/>
  <circle cx="80" cy="368" r="20" fill="#57534e" opacity="0.15"/>
  <text x="80" y="375"  font-size="20" font-weight="900" fill="#57534e" text-anchor="middle">3</text>
  <text x="116" y="353"  font-size="15" font-weight="700" fill="#44403c">活動與復健</text>
  <text x="116" y="375"  font-size="14" fill="#78716c">活動限制說明（禁止提重物/爬樓梯等），居家復健動作指導</text>
  <text x="116" y="398"  font-size="14" fill="#a8a29e">手術後傷口照護、引流管注意事項、洗澡限制等均需說明</text>
  <rect x="624" y="347" width="114" height="26" rx="13" fill="#57534e"/>
  <text x="681" y="365"  font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">活動指導</text>

  <!-- 列 4 (y=428) -->
  <rect x="38" y="428" width="724" height="52" rx="10" fill="#f5f5f4"/>
  <rect x="38" y="428" width="6" height="52" rx="2" fill="#a8a29e"/>
  <circle cx="80" cy="454" r="20" fill="#a8a29e" opacity="0.15"/>
  <text x="80" y="461"  font-size="20" font-weight="900" fill="#a8a29e" text-anchor="middle">4</text>
  <text x="116" y="449"  font-size="15" font-weight="700" fill="#44403c">返診計畫與緊急就醫</text>
  <text x="116" y="471"  font-size="14" fill="#78716c">下次回診時間、科別，哪些症狀需立即返院，急診就醫指引</text>
  <rect x="624" y="441" width="114" height="26" rx="13" fill="#a8a29e"/>
  <text x="681" y="459"  font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">返診計畫</text>

  <!-- 浮水印 -->
  <text x="400" y="494"  font-size="14" fill="#a8a29e" text-anchor="middle" opacity="0.6">報告汪 reportwang.com</text>
</svg>
