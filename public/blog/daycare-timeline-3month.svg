<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480">
  <!-- 背景：米黃暖色 -->
  <rect width="800" height="480" fill="#f0efe8"/>

  <!-- 標題區 -->
  <rect x="0" y="0" width="800" height="64" fill="#78716c"/>
  <text x="32" y="25" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="rgba(255,255,255,0.85)" font-weight="500">評鑑前 3 個月衝刺計畫</text>
  <text x="32" y="50" font-family="'Noto Sans TC', sans-serif" font-size="20" fill="white" font-weight="700">3 個月甘特時程表</text>

  <!-- 月份標頭 -->
  <rect x="0" y="64" width="800" height="36" fill="#e8e5de"/>
  <text x="160" y="83" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#64748b" font-weight="600">任務項目</text>
  <!-- 月份標籤 -->
  <text x="352" y="83" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#78716c" font-weight="600">第 3 個月前</text>
  <text x="512" y="83" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#78716c" font-weight="600">第 2 個月前</text>
  <text x="672" y="83" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#78716c" font-weight="600">第 1 個月前</text>

  <!-- 垂直分隔線 -->
  <line x1="280" y1="64" x2="280" y2="480" stroke="#dedad3" stroke-width="1"/>
  <line x1="432" y1="64" x2="432" y2="480" stroke="#dedad3" stroke-width="1"/>
  <line x1="592" y1="64" x2="592" y2="480" stroke="#dedad3" stroke-width="1"/>
  <line x1="752" y1="64" x2="752" y2="480" stroke="#dedad3" stroke-width="1"/>

  <!-- ===== 評鑑前3個月 Row ===== -->
  <rect x="0" y="100" width="800" height="80" fill="#f0efe8"/>
  <rect x="0" y="100" width="5" height="80" fill="#94a3b8"/>
  <text x="18" y="122" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#64748b" font-weight="700">評鑑前</text>
  <text x="18" y="140" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#64748b" font-weight="700">3 個月</text>

  <!-- 任務塊 -->
  <rect x="292" y="112" width="128" height="26" rx="6" fill="#94a3b8"/>
  <text x="356" y="129" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="white" font-weight="600">盤點文件缺口</text>
  <rect x="292" y="143" width="128" height="26" rx="6" fill="#a8a29e"/>
  <text x="356" y="160" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="white" font-weight="600">建立追蹤表</text>

  <!-- ===== 評鑑前2個月 Row ===== -->
  <rect x="0" y="180" width="800" height="80" fill="white"/>
  <rect x="0" y="180" width="5" height="80" fill="#a8a29e"/>
  <text x="18" y="202" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#64748b" font-weight="700">評鑑前</text>
  <text x="18" y="220" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#64748b" font-weight="700">2 個月</text>

  <rect x="292" y="192" width="120" height="26" rx="6" fill="#e8e5de" stroke="#a8a29e" stroke-width="1"/>
  <text x="352" y="209" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#78716c">延續追蹤</text>
  <rect x="444" y="192" width="136" height="26" rx="6" fill="#a8a29e"/>
  <text x="512" y="209" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="white" font-weight="600">補齊各類紀錄</text>
  <rect x="444" y="223" width="136" height="26" rx="6" fill="#a3a3a3"/>
  <text x="512" y="240" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="white" font-weight="600">教育訓練補課</text>

  <!-- ===== 評鑑前1個月 Row ===== -->
  <rect x="0" y="260" width="800" height="80" fill="#f0efe8"/>
  <rect x="0" y="260" width="5" height="80" fill="#d97706"/>
  <text x="18" y="282" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#78716c" font-weight="700">評鑑前</text>
  <text x="18" y="300" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#78716c" font-weight="700">1 個月</text>

  <rect x="292" y="272" width="110" height="26" rx="6" fill="#e8e5de" stroke="#dedad3" stroke-width="1"/>
  <text x="347" y="289" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#78716c">持續補件</text>
  <rect x="444" y="272" width="110" height="26" rx="6" fill="#e8e5de" stroke="#dedad3" stroke-width="1"/>
  <text x="499" y="289" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#78716c">訓練確認</text>
  <rect x="604" y="272" width="136" height="26" rx="6" fill="#d97706"/>
  <text x="672" y="289" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="white" font-weight="600">全員模擬演練</text>
  <rect x="604" y="303" width="136" height="26" rx="6" fill="#a8a29e"/>
  <text x="672" y="320" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="white" font-weight="600">全員說明會議</text>

  <!-- ===== 最後1週 Row ===== -->
  <rect x="0" y="340" width="800" height="80" fill="white"/>
  <rect x="0" y="340" width="5" height="80" fill="#78716c"/>
  <text x="18" y="362" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#64748b" font-weight="700">最後</text>
  <text x="18" y="380" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#64748b" font-weight="700">1 週</text>

  <rect x="604" y="352" width="136" height="26" rx="6" fill="#78716c"/>
  <text x="672" y="369" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="white" font-weight="600">最終文件確認</text>
  <rect x="604" y="383" width="136" height="26" rx="6" fill="#a3a3a3"/>
  <text x="672" y="400" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="white" font-weight="600">分工表整理</text>

  <!-- 水平分隔線 -->
  <line x1="0" y1="100" x2="800" y2="100" stroke="#dedad3" stroke-width="1"/>
  <line x1="0" y1="180" x2="800" y2="180" stroke="#dedad3" stroke-width="1"/>
  <line x1="0" y1="260" x2="800" y2="260" stroke="#dedad3" stroke-width="1"/>
  <line x1="0" y1="340" x2="800" y2="340" stroke="#dedad3" stroke-width="1"/>
  <line x1="0" y1="420" x2="800" y2="420" stroke="#dedad3" stroke-width="1"/>

  <!-- 底部品牌 -->
  <rect x="0" y="420" width="800" height="60" fill="#e8e5de"/>
  <text x="32" y="453" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#94a3b8">日照中心評鑑前 3 個月衝刺甘特表 · 報告汪製作</text>
  <!-- 圖例 -->
  <rect x="460" y="438" width="12" height="12" rx="3" fill="#94a3b8"/>
  <text x="478" y="449" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#64748b">文件類</text>
  <rect x="540" y="438" width="12" height="12" rx="3" fill="#a8a29e"/>
  <text x="558" y="449" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#64748b">訓練類</text>
  <rect x="620" y="438" width="12" height="12" rx="3" fill="#d97706"/>
  <text x="638" y="449" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#64748b">演練類</text>
  <rect x="700" y="438" width="12" height="12" rx="3" fill="#78716c"/>
  <text x="718" y="449" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#64748b">衝刺類</text>

  <!-- 浮水印 -->
  <text x="400" y="473" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#c4bfb8">報告汪 reportwang.com</text>
</svg>
