<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"
     font-family="'Noto Sans TC', sans-serif">
  <!-- @template: timeline -->
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">評鑑前 3 個月準備時程</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">從盤點缺口到全員備戰，系統化五階段推進節奏</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- 時間軸 -->
  <line x1="60" y1="272" x2="736" y2="272" stroke="#a8a29e" stroke-width="4"/>
  <polygon points="736,265 736,279 752,272" fill="#a8a29e"/>

  <!-- ===== Node 1：-3 個月（上方，#d97706，cx=120）===== -->
  <rect x="60" y="108" width="120" height="100" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="60" y="108" width="120" height="8" rx="4" fill="#d97706"/>
  <rect x="60" y="112" width="120" height="4" fill="#d97706"/>
  <text x="120" y="145" text-anchor="middle" font-size="20" fill="#1e293b" font-weight="700">-3 個月</text>
  <text x="120" y="167" text-anchor="middle" font-size="16" fill="#57534e">文件盤點</text>
  <text x="120" y="187" text-anchor="middle" font-size="16" fill="#57534e">找出缺口</text>
  <line x1="120" y1="208" x2="120" y2="248" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,3"/>
  <circle cx="120" cy="272" r="24" fill="#d97706" opacity="0.15"/>
  <text x="120" y="280" text-anchor="middle" font-size="20" fill="white" font-weight="700">1</text>
  <rect x="86" y="300" width="68" height="22" rx="11" fill="#d97706"/>
  <text x="120" y="315" text-anchor="middle" font-size="14" fill="white" font-weight="700">奠基</text>

  <!-- ===== Node 2：-2 個月（下方，#78716c，cx=254）===== -->
  <rect x="220" y="222" width="68" height="22" rx="11" fill="#78716c"/>
  <text x="254" y="237" text-anchor="middle" font-size="14" fill="white" font-weight="700">補強</text>
  <circle cx="254" cy="272" r="24" fill="#78716c" opacity="0.15"/>
  <text x="254" y="280" text-anchor="middle" font-size="20" fill="white" font-weight="700">2</text>
  <line x1="254" y1="296" x2="254" y2="350" stroke="#78716c" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="194" y="350" width="120" height="100" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="194" y="442" width="120" height="8" rx="4" fill="#78716c"/>
  <rect x="194" y="438" width="120" height="4" fill="#78716c"/>
  <text x="254" y="379" text-anchor="middle" font-size="20" fill="#1e293b" font-weight="700">-2 個月</text>
  <text x="254" y="401" text-anchor="middle" font-size="16" fill="#57534e">補缺補課</text>
  <text x="254" y="421" text-anchor="middle" font-size="16" fill="#57534e">持續記錄</text>

  <!-- ===== Node 3：-1 個月（上方，#57534e，cx=388）===== -->
  <rect x="328" y="108" width="120" height="100" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="328" y="108" width="120" height="8" rx="4" fill="#57534e"/>
  <rect x="328" y="112" width="120" height="4" fill="#57534e"/>
  <text x="388" y="145" text-anchor="middle" font-size="20" fill="#1e293b" font-weight="700">-1 個月</text>
  <text x="388" y="167" text-anchor="middle" font-size="16" fill="#57534e">全員演練</text>
  <text x="388" y="187" text-anchor="middle" font-size="16" fill="#57534e">環境確認</text>
  <line x1="388" y1="208" x2="388" y2="248" stroke="#57534e" stroke-width="1.5" stroke-dasharray="4,3"/>
  <circle cx="388" cy="272" r="24" fill="#57534e" opacity="0.15"/>
  <text x="388" y="280" text-anchor="middle" font-size="20" fill="white" font-weight="700">3</text>
  <rect x="354" y="300" width="68" height="22" rx="11" fill="#57534e"/>
  <text x="388" y="315" text-anchor="middle" font-size="14" fill="white" font-weight="700">備戰</text>

  <!-- ===== Node 4：最後 1 週（下方，#a8a29e，cx=522）===== -->
  <rect x="488" y="222" width="68" height="22" rx="11" fill="#a8a29e"/>
  <text x="522" y="237" text-anchor="middle" font-size="14" fill="white" font-weight="700">最後週</text>
  <circle cx="522" cy="272" r="24" fill="#a8a29e" opacity="0.15"/>
  <text x="522" y="280" text-anchor="middle" font-size="20" fill="white" font-weight="700">4</text>
  <line x1="522" y1="296" x2="522" y2="350" stroke="#a8a29e" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="462" y="350" width="120" height="100" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="462" y="442" width="120" height="8" rx="4" fill="#a8a29e"/>
  <rect x="462" y="438" width="120" height="4" fill="#a8a29e"/>
  <text x="522" y="379" text-anchor="middle" font-size="20" fill="#1e293b" font-weight="700">最後 1 週</text>
  <text x="522" y="401" text-anchor="middle" font-size="16" fill="#57534e">每日確認</text>
  <text x="522" y="421" text-anchor="middle" font-size="16" fill="#57534e">文件整理</text>

  <!-- ===== Node 5：評鑑當日（上方，#94a3b8，cx=656）===== -->
  <rect x="596" y="108" width="120" height="100" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="596" y="108" width="120" height="8" rx="4" fill="#94a3b8"/>
  <rect x="596" y="112" width="120" height="4" fill="#94a3b8"/>
  <text x="656" y="145" text-anchor="middle" font-size="20" fill="#1e293b" font-weight="700">評鑑當日</text>
  <text x="656" y="167" text-anchor="middle" font-size="16" fill="#57534e">沉著應對</text>
  <text x="656" y="187" text-anchor="middle" font-size="16" fill="#57534e">展示成果</text>
  <line x1="656" y1="208" x2="656" y2="248" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <circle cx="656" cy="272" r="24" fill="#94a3b8" opacity="0.15"/>
  <text x="656" y="280" text-anchor="middle" font-size="20" fill="white" font-weight="700">5</text>
  <rect x="622" y="300" width="68" height="22" rx="11" fill="#94a3b8"/>
  <text x="656" y="315" text-anchor="middle" font-size="14" fill="white" font-weight="700">評鑑日</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
