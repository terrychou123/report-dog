<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!--
    【ref-list-5.svg — 5 列直列清單參考範本（兩層間距 + 自適應字型版）】
    兩層間距公式：outer_gap（外圍）> inner_gap（列間）
      inner_gap = 13（row 與 row 之間，緊湊）
      outer_gap = floor((500-6×60-4×13)/3) = floor(88/3) = 29
    結構：outer | Header | outer | Row1 | inner | Row2 | inner | Row3 | inner | Row4 | inner | Row5 | outer
    驗算：3×29 + 6×60 + 4×13 = 87+360+52 = 499（1px 歸底部）

    自適應字型：Q_font = 20, R_font = 16, circle_r = 16
    S_rect_h = clamp(34, H-16, 52) = 44

    Header y=29, h=60, text_y=74
    Row[0] y = 29+60+29 = 118
    Row[1] y = 118+60+13 = 191
    Row[2] y = 191+60+13 = 264
    Row[3] y = 264+60+13 = 337
    Row[4] y = 337+60+13 = 410
    Row[4] bottom = 470, 底部留白=30 ≈ outer ✓

    Row 內垂直置中（H=60, Q_font=20, R_font=16）：
      cy = row_y+30, NUM y = row_y+36 (r=16)
      Q offset+27, R offset+48
      S_rect_y = row_y+8, h=44, S1=row_y+24, S2=row_y+44
    浮水印 y=488
  -->

  <!-- Header（y=29, h=60） -->
  <rect x="0" y="29" width="800" height="60" fill="#e8e6de"/>
  <rect x="0" y="29" width="6" height="60" fill="#d97706"/>
  <!-- M2_font=36（9字） -->
  <text x="28" y="74" font-size="36" fill="#1e293b" font-weight="700">5 大評鑑管理盲點</text>

  <!-- Row 1（y=118, H=60, cy=148, #d97706 琥珀） -->
  <rect x="28" y="118" width="744" height="60" rx="12" fill="#e8e6de"/>
  <rect x="28" y="118" width="6" height="60" rx="2" fill="#d97706"/>
  <circle cx="66" cy="148" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="154" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <!-- Q 20px offset+27 → 145; R 16px offset+48 → 166 -->
  <text x="100" y="145" font-size="20" fill="#1e293b" font-weight="700">督導機制不完整</text>
  <text x="100" y="166" font-size="16" fill="#57534e">個別督導頻率不足，員工問題無法及時被發現與支持</text>
  <!-- S rect y=126, h=44 -->
  <rect x="620" y="126" width="136" height="44" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="142" font-size="16" fill="#d97706" text-anchor="middle">第 9 條</text>
  <text x="688" y="162" font-size="16" fill="#d97706" text-anchor="middle">每半年個督一次</text>

  <!-- Row 2（y=191, H=60, cy=221, #78716c 暖灰） -->
  <rect x="28" y="191" width="744" height="60" rx="12" fill="#e8e6de"/>
  <rect x="28" y="191" width="6" height="60" rx="2" fill="#78716c"/>
  <circle cx="66" cy="221" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="227" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <!-- Q offset+27 → 218; R offset+48 → 239 -->
  <text x="100" y="218" font-size="20" fill="#1e293b" font-weight="700">教育訓練流於形式</text>
  <text x="100" y="239" font-size="16" fill="#57534e">訓練只是簽到，缺乏實質學習，員工成長動力低落</text>
  <!-- S rect y=199, h=44 -->
  <rect x="620" y="199" width="136" height="44" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="215" font-size="16" fill="#78716c" text-anchor="middle">第 29 條</text>
  <text x="688" y="235" font-size="16" fill="#78716c" text-anchor="middle">在職 20 小時</text>

  <!-- Row 3（y=264, H=60, cy=294, #57534e 深棕） -->
  <rect x="28" y="264" width="744" height="60" rx="12" fill="#e8e6de"/>
  <rect x="28" y="264" width="6" height="60" rx="2" fill="#57534e"/>
  <circle cx="66" cy="294" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="300" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <!-- Q offset+27 → 291; R offset+48 → 312 -->
  <text x="100" y="291" font-size="20" fill="#1e293b" font-weight="700">留任率未追蹤管理</text>
  <text x="100" y="312" font-size="16" fill="#57534e">不知如何計算離職率，缺乏系統性的離職原因分析</text>
  <!-- S rect y=272, h=44 -->
  <rect x="620" y="272" width="136" height="44" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="288" font-size="16" fill="#57534e" text-anchor="middle">第 30 條</text>
  <text x="688" y="308" font-size="16" fill="#57534e" text-anchor="middle">前四年度留任率</text>

  <!-- Row 4（y=337, H=60, cy=367, #a8a29e 淺灰） -->
  <rect x="28" y="337" width="744" height="60" rx="12" fill="#e8e6de"/>
  <rect x="28" y="337" width="6" height="60" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="367" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="373" font-size="16" fill="#a8a29e" text-anchor="middle" font-weight="900">4</text>
  <!-- Q offset+27 → 364; R offset+48 → 385 -->
  <text x="100" y="364" font-size="20" fill="#1e293b" font-weight="700">主任缺乏持續進修</text>
  <text x="100" y="385" font-size="16" fill="#57534e">管理者忙於日常業務，未安排進修，缺乏新管理知能</text>
  <!-- S rect y=345, h=44 -->
  <rect x="620" y="345" width="136" height="44" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="361" font-size="16" fill="#a8a29e" text-anchor="middle">第 31 條</text>
  <text x="688" y="381" font-size="16" fill="#a8a29e" text-anchor="middle">每年 4 小時</text>

  <!-- Row 5（y=410, H=60, cy=440, #94a3b8 藍灰） -->
  <rect x="28" y="410" width="744" height="60" rx="12" fill="#e8e6de"/>
  <rect x="28" y="410" width="6" height="60" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="440" r="16" fill="#94a3b8" opacity="0.15"/>
  <text x="66" y="446" font-size="16" fill="#94a3b8" text-anchor="middle" font-weight="900">5</text>
  <!-- Q offset+27 → 437; R offset+48 → 458 -->
  <text x="100" y="437" font-size="20" fill="#1e293b" font-weight="700">健康管理制度不足</text>
  <text x="100" y="458" font-size="16" fill="#57534e">健檢報告未追蹤異常值，員工誤以為健康可跳過年度檢查</text>
  <!-- S rect y=418, h=44 -->
  <rect x="620" y="418" width="136" height="44" rx="8" fill="#94a3b8" opacity="0.12"/>
  <text x="688" y="434" font-size="16" fill="#94a3b8" text-anchor="middle">第 32 條</text>
  <text x="688" y="454" font-size="16" fill="#94a3b8" text-anchor="middle">每年健檢</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
