<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- 標題 -->
  <text x="400" y="48" font-size="32" fill="#1e293b" text-anchor="middle" font-weight="700">品質持續改善 PDCA 循環</text>
  <text x="400" y="78" font-size="22" fill="#78716c" text-anchor="middle">住宿型機構品質管理核心架構</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#d97706" stroke-width="2"/>

  <!-- 中心圓 -->
  <circle cx="400" cy="300" r="55" fill="#d97706" opacity="0.12"/>
  <circle cx="400" cy="300" r="38" fill="#d97706" opacity="0.2"/>
  <text x="400" y="295" font-size="18" fill="#d97706" text-anchor="middle" font-weight="700">PDCA</text>
  <text x="400" y="315" font-size="14" fill="#78716c" text-anchor="middle">品質循環</text>

  <!-- P - Plan 計畫 -->
  <rect x="60" y="130" width="220" height="120" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="60" y="130" width="220" height="44" rx="12" fill="#d97706"/>
  <rect x="60" y="154" width="220" height="20" fill="#d97706"/>
  <text x="170" y="159" text-anchor="middle" font-size="20" fill="white" font-weight="700">P — 計畫</text>
  <text x="80" y="195" font-size="13" fill="#57534e">• A3 業務計畫訂定</text>
  <text x="80" y="213" font-size="13" fill="#57534e">• A6 危機管理分析</text>
  <text x="80" y="231" font-size="13" fill="#57534e">• B2 個案計畫初評</text>

  <!-- 箭頭 P→D -->
  <path d="M 280 190 Q 340 180 370 240" stroke="#d97706" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
  <polygon points="365,252 375,240 380,254" fill="#d97706"/>

  <!-- D - Do 執行 -->
  <rect x="520" y="130" width="220" height="120" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="520" y="130" width="220" height="44" rx="12" fill="#78716c"/>
  <rect x="520" y="154" width="220" height="20" fill="#78716c"/>
  <text x="630" y="159" text-anchor="middle" font-size="20" fill="white" font-weight="700">D — 執行</text>
  <text x="540" y="195" font-size="13" fill="#57534e">• B1 品質會議運作</text>
  <text x="540" y="213" font-size="13" fill="#57534e">• B5 跨專業聯繫會</text>
  <text x="540" y="231" font-size="13" fill="#57534e">• 各項照護實際落實</text>

  <!-- 箭頭 D→C -->
  <path d="M 520 260 Q 460 280 430 310" stroke="#78716c" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
  <polygon points="420,318 432,310 436,324" fill="#78716c"/>

  <!-- C - Check 查核 -->
  <rect x="520" y="360" width="220" height="110" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="520" y="360" width="220" height="44" rx="12" fill="#57534e"/>
  <rect x="520" y="384" width="220" height="20" fill="#57534e"/>
  <text x="630" y="389" text-anchor="middle" font-size="20" fill="white" font-weight="700">C — 查核</text>
  <text x="540" y="423" font-size="13" fill="#57534e">• B13/B14/B17 逐案分析</text>
  <text x="540" y="441" font-size="13" fill="#57534e">• E1 前次建議改善追蹤</text>

  <!-- 箭頭 C→A -->
  <path d="M 520 410 Q 460 420 430 370" stroke="#57534e" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
  <polygon points="420,362 432,370 425,383" fill="#57534e"/>

  <!-- A - Act 改善 -->
  <rect x="60" y="360" width="220" height="110" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="60" y="360" width="220" height="44" rx="12" fill="#94a3b8"/>
  <rect x="60" y="384" width="220" height="20" fill="#94a3b8"/>
  <text x="170" y="389" text-anchor="middle" font-size="20" fill="white" font-weight="700">A — 改善</text>
  <text x="80" y="423" font-size="13" fill="#57534e">• A4 缺失改善 100%</text>
  <text x="80" y="441" font-size="13" fill="#57534e">• E2 創新措施推動</text>

  <!-- 箭頭 A→P -->
  <path d="M 170 360 Q 170 290 220 220" stroke="#94a3b8" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
  <polygon points="215,210 225,220 212,226" fill="#94a3b8"/>

  <!-- 水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
