<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <!-- 背景 -->
  <rect width="800" height="450" fill="#0f172a" rx="16"/>

  <!-- 裝飾圓圈 -->
  <circle cx="760" cy="50" r="100" fill="rgba(255,255,255,0.03)"/>

  <!-- 標題 -->
  <text x="400" y="52" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="22" fill="white" font-weight="700">評鑑準備角色分工總覽</text>
  <text x="400" y="76" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="14" fill="rgba(255,255,255,0.5)">四大角色 · 各司其職 · 協力備審</text>

  <!-- 社工師 -->
  <rect x="40" y="100" width="165" height="310" rx="12" fill="rgba(29,78,216,0.2)" stroke="#1d4ed8" stroke-width="1.5"/>
  <!-- 圓形頭像 -->
  <circle cx="122" cy="135" r="22" fill="#1d4ed8"/>
  <text x="122" y="143" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="22" fill="white">👩‍💼</text>
  <text x="122" y="180" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="16" fill="white" font-weight="600">社工師</text>
  <line x1="60" y1="192" x2="185" y2="192" stroke="#1d4ed8" stroke-width="1" opacity="0.5"/>
  <text x="50" y="215" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">• 個案評估（第5條）</text>
  <text x="50" y="237" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">• 照顧計畫（第6條）</text>
  <text x="50" y="259" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">• 追蹤評值（第7條）</text>
  <text x="50" y="281" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">• 個案研討（第8條）</text>
  <text x="50" y="303" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">• 申訴機制（第2條）</text>
  <text x="50" y="325" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">• 社會參與（第18條）</text>
  <text x="50" y="347" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">• 家屬支持（第19條）</text>
  <rect x="55" y="375" width="115" height="24" rx="6" fill="rgba(29,78,216,0.5)"/>
  <text x="112" y="391" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="white">負責 9 項以上</text>

  <!-- 護理師 -->
  <rect x="220" y="100" width="165" height="310" rx="12" fill="rgba(13,148,136,0.2)" stroke="#0d9488" stroke-width="1.5"/>
  <circle cx="302" cy="135" r="22" fill="#0d9488"/>
  <text x="302" y="143" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="22" fill="white">👩‍⚕️</text>
  <text x="302" y="180" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="16" fill="white" font-weight="600">護理師</text>
  <line x1="240" y1="192" x2="365" y2="192" stroke="#0d9488" stroke-width="1" opacity="0.5"/>
  <text x="230" y="215" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">• 協助服藥（第12條）</text>
  <text x="230" y="237" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">• 健康檢查（第20條）</text>
  <text x="230" y="259" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">• 防疫機制（第21條）</text>
  <text x="230" y="281" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">• 工作人員健檢</text>
  <text x="246" y="297" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">（第32條）</text>
  <text x="230" y="319" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">• 疫苗注射（第33條）</text>
  <text x="230" y="341" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">• 急救物品（第36條）</text>
  <rect x="235" y="375" width="115" height="24" rx="6" fill="rgba(13,148,136,0.5)"/>
  <text x="292" y="391" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="white">負責 6 項以上</text>

  <!-- 照服員/行政 -->
  <rect x="400" y="100" width="165" height="310" rx="12" fill="rgba(234,88,12,0.2)" stroke="#ea580c" stroke-width="1.5"/>
  <circle cx="482" cy="135" r="22" fill="#ea580c"/>
  <text x="482" y="143" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="22" fill="white">🧑‍🤝‍🧑</text>
  <text x="482" y="180" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="16" fill="white" font-weight="600">照服員/行政</text>
  <line x1="420" y1="192" x2="545" y2="192" stroke="#ea580c" stroke-width="1" opacity="0.5"/>
  <text x="410" y="215" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">• 自我照顧（第11條）</text>
  <text x="410" y="237" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">• 安全看視（第14條）</text>
  <text x="410" y="259" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">• 個人清潔（第15條）</text>
  <text x="410" y="281" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">• 工作手冊（第24條）</text>
  <text x="410" y="303" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">• 環境整備（第38–43條）</text>
  <text x="410" y="325" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">• 器材維護（第26條）</text>
  <text x="410" y="347" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">• 廚房衛生（第42條）</text>
  <rect x="415" y="375" width="115" height="24" rx="6" fill="rgba(234,88,12,0.5)"/>
  <text x="472" y="391" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="white">負責 10 項以上</text>

  <!-- 業務負責人 -->
  <rect x="580" y="100" width="180" height="310" rx="12" fill="rgba(124,58,237,0.2)" stroke="#7c3aed" stroke-width="1.5"/>
  <circle cx="670" cy="135" r="22" fill="#7c3aed"/>
  <text x="670" y="143" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="22" fill="white">🏢</text>
  <text x="670" y="180" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="16" fill="white" font-weight="600">業務負責人</text>
  <line x1="600" y1="192" x2="740" y2="192" stroke="#7c3aed" stroke-width="1" opacity="0.5"/>
  <text x="590" y="215" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">• 督導機制（第9條）</text>
  <text x="590" y="237" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">• 品管指標（第22條）</text>
  <text x="590" y="259" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">• 業務計畫（第23條）</text>
  <text x="590" y="281" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">• 人力設置（第28條）</text>
  <text x="590" y="303" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">• 教育訓練（第29條）</text>
  <text x="590" y="325" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">• 緊急事件（第35條）</text>
  <text x="590" y="347" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">• 性騷擾防治（第37條）</text>
  <rect x="595" y="375" width="150" height="24" rx="6" fill="rgba(124,58,237,0.5)"/>
  <text x="670" y="391" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="white">統籌 10 項以上</text>
</svg>
