<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- Header (N=5) -->
  <rect x="29" y="29" width="742" height="76" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="400" y="68" font-size="22" fill="#1e293b" font-weight="700" text-anchor="middle" >B10 自我查核清單（評鑑前必確認）</text>
  <text x="400" y="92" font-size="15" fill="#57534e" text-anchor="middle" >5 大面向逐一核查，確保評鑑前防疫機制文件完整</text>

  <!-- Row 1 -->
  <rect x="29" y="118" width="742" height="60" rx="8" fill="#ffffff"/>
  <rect x="29" y="118" width="6" height="60" rx="2" fill="#d97706"/>
  <circle cx="66" cy="148" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="154" font-size="16" fill="#d97706" font-weight="700" text-anchor="middle" >1</text>
  <text x="100" y="140" font-size="16" fill="#1e293b" font-weight="700" >感染管制手冊版本日期</text>
  <text x="100" y="160" font-size="16" fill="#57534e" >確認手冊最後修訂日期在 1 年內，有主管（護理長/院長）簽核</text>
  <rect x="620" y="125" width="136" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="140" font-size="14" fill="#d97706" font-weight="700" text-anchor="middle" >每年更新</text>
  <text x="688" y="156" font-size="14" fill="#d97706" text-anchor="middle" >確認簽核</text>

  <!-- Row 2 -->
  <rect x="29" y="191" width="742" height="60" rx="8" fill="#ffffff"/>
  <rect x="29" y="191" width="6" height="60" rx="2" fill="#78716c"/>
  <circle cx="66" cy="221" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="227" font-size="16" fill="#78716c" font-weight="700" text-anchor="middle" >2</text>
  <text x="100" y="213" font-size="16" fill="#1e293b" font-weight="700" >體溫記錄與線上登載</text>
  <text x="100" y="233" font-size="16" fill="#57534e" >確認每日體溫記錄完整無缺漏，傳染病監視作業平台登載紀錄可供查驗</text>
  <rect x="620" y="198" width="136" height="46" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="213" font-size="14" fill="#78716c" font-weight="700" text-anchor="middle" >每日完整</text>
  <text x="688" y="229" font-size="14" fill="#78716c" text-anchor="middle" >平台登載</text>

  <!-- Row 3 -->
  <rect x="29" y="264" width="742" height="60" rx="8" fill="#ffffff"/>
  <rect x="29" y="264" width="6" height="60" rx="2" fill="#57534e"/>
  <circle cx="66" cy="294" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="300" font-size="16" fill="#57534e" font-weight="700" text-anchor="middle" >3</text>
  <text x="100" y="286" font-size="16" fill="#1e293b" font-weight="700" >訓練時數與記錄</text>
  <text x="100" y="306" font-size="16" fill="#57534e" >逐人核查感控訓練時數，職前 4H 與在職 8H 均有出席簽到與評估留存</text>
  <rect x="620" y="271" width="136" height="46" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="286" font-size="14" fill="#57534e" font-weight="700" text-anchor="middle" >逐人核查</text>
  <text x="688" y="302" font-size="14" fill="#57534e" text-anchor="middle" >時數足夠</text>

  <!-- Row 4 -->
  <rect x="29" y="337" width="742" height="60" rx="8" fill="#ffffff"/>
  <rect x="29" y="337" width="6" height="60" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="367" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="373" font-size="16" fill="#a8a29e" font-weight="700" text-anchor="middle" >4</text>
  <text x="100" y="359" font-size="16" fill="#1e293b" font-weight="700" >防護物資儲備與存放</text>
  <text x="100" y="379" font-size="16" fill="#57534e" >盤點口罩、手套、消毒液等物資有效期限，確認存放於通風乾燥環境</text>
  <rect x="620" y="344" width="136" height="46" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="359" font-size="14" fill="#a8a29e" font-weight="700" text-anchor="middle" >盤點期限</text>
  <text x="688" y="375" font-size="14" fill="#a8a29e" text-anchor="middle" >環境符規</text>

  <!-- Row 5 -->
  <rect x="29" y="410" width="742" height="60" rx="8" fill="#ffffff"/>
  <rect x="29" y="410" width="6" height="60" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="440" r="16" fill="#94a3b8" opacity="0.15"/>
  <text x="66" y="446" font-size="16" fill="#94a3b8" font-weight="700" text-anchor="middle" >5</text>
  <text x="100" y="432" font-size="16" fill="#1e293b" font-weight="700" >隔離空間設備功能</text>
  <text x="100" y="452" font-size="16" fill="#57534e" >現場確認隔離空間獨立空調/衛浴/緊急呼叫設備功能正常，使用記錄完整</text>
  <rect x="620" y="417" width="136" height="46" rx="8" fill="#94a3b8" opacity="0.12"/>
  <text x="688" y="432" font-size="14" fill="#94a3b8" font-weight="700" text-anchor="middle" >設備確認</text>
  <text x="688" y="448" font-size="14" fill="#94a3b8" text-anchor="middle" >功能正常</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" >報告汪 reportwang.com</text>
</svg>
