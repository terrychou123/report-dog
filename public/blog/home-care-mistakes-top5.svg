<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- Header (N=5: y=29, h=76) -->
  <rect x="0" y="29" width="800" height="76" fill="white"/>
  <rect x="0" y="29" width="6" height="76" fill="#d97706"/>
  <text x="28" y="85" font-size="36" fill="#1e293b" font-weight="700" font-family="sans-serif">居服評鑑 5 大常見缺失</text>

  <!-- Row 1 (#d97706) y=118 -->
  <rect x="28" y="118" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="118" width="6" height="60" rx="2" fill="#d97706"/>
  <circle cx="66" cy="148" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="154" font-size="16" font-weight="900" text-anchor="middle" fill="#d97706" font-family="sans-serif">1</text>
  <text x="100" y="145" font-size="22" fill="#1e293b" font-weight="700" font-family="sans-serif">服務紀錄不完整</text>
  <text x="100" y="165" font-size="16" fill="#57534e" font-family="sans-serif">紀錄格式欠缺、照服員未簽名</text>
  <rect x="620" y="126" width="136" height="44" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="143" font-size="16" text-anchor="middle" fill="#d97706" font-weight="700" font-family="sans-serif">項目13</text>
  <text x="688" y="163" font-size="16" text-anchor="middle" fill="#d97706" font-weight="700" font-family="sans-serif">最高頻</text>

  <!-- Row 2 (#78716c) y=191 -->
  <rect x="28" y="191" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="191" width="6" height="60" rx="2" fill="#78716c"/>
  <circle cx="66" cy="221" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="227" font-size="16" font-weight="900" text-anchor="middle" fill="#78716c" font-family="sans-serif">2</text>
  <text x="100" y="218" font-size="22" fill="#1e293b" font-weight="700" font-family="sans-serif">個別計畫未更新</text>
  <text x="100" y="238" font-size="16" fill="#57534e" font-family="sans-serif">超過6個月未更新個別服務計畫</text>
  <rect x="620" y="199" width="136" height="44" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="216" font-size="16" text-anchor="middle" fill="#78716c" font-weight="700" font-family="sans-serif">項目6</text>
  <text x="688" y="236" font-size="16" text-anchor="middle" fill="#78716c" font-weight="700" font-family="sans-serif">易遺漏</text>

  <!-- Row 3 (#57534e) y=264 -->
  <rect x="28" y="264" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="264" width="6" height="60" rx="2" fill="#57534e"/>
  <circle cx="66" cy="294" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="300" font-size="16" font-weight="900" text-anchor="middle" fill="#57534e" font-family="sans-serif">3</text>
  <text x="100" y="291" font-size="22" fill="#1e293b" font-weight="700" font-family="sans-serif">督導頻率不足</text>
  <text x="100" y="311" font-size="16" fill="#57534e" font-family="sans-serif">訪視紀錄缺漏或頻率未達標準</text>
  <rect x="620" y="272" width="136" height="44" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="289" font-size="16" text-anchor="middle" fill="#57534e" font-weight="700" font-family="sans-serif">項目12</text>
  <text x="688" y="309" font-size="16" text-anchor="middle" fill="#57534e" font-weight="700" font-family="sans-serif">常扣分</text>

  <!-- Row 4 (#a8a29e) y=337 -->
  <rect x="28" y="337" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="337" width="6" height="60" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="367" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="373" font-size="16" font-weight="900" text-anchor="middle" fill="#a8a29e" font-family="sans-serif">4</text>
  <text x="100" y="364" font-size="22" fill="#1e293b" font-weight="700" font-family="sans-serif">人力配置不符</text>
  <text x="100" y="384" font-size="16" fill="#57534e" font-family="sans-serif">照服員數量無法對應服務個案數</text>
  <rect x="620" y="345" width="136" height="44" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="362" font-size="16" text-anchor="middle" fill="#a8a29e" font-weight="700" font-family="sans-serif">項目16</text>
  <text x="688" y="382" font-size="16" text-anchor="middle" fill="#a8a29e" font-weight="700" font-family="sans-serif">難補救</text>

  <!-- Row 5 (#94a3b8) y=410 -->
  <rect x="28" y="410" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="410" width="6" height="60" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="440" r="16" fill="#94a3b8" opacity="0.15"/>
  <text x="66" y="446" font-size="16" font-weight="900" text-anchor="middle" fill="#94a3b8" font-family="sans-serif">5</text>
  <text x="100" y="437" font-size="22" fill="#1e293b" font-weight="700" font-family="sans-serif">教育訓練不足</text>
  <text x="100" y="457" font-size="16" fill="#57534e" font-family="sans-serif">在職訓練時數紀錄不完整</text>
  <rect x="620" y="418" width="136" height="44" rx="8" fill="#94a3b8" opacity="0.12"/>
  <text x="688" y="435" font-size="16" text-anchor="middle" fill="#94a3b8" font-weight="700" font-family="sans-serif">項目18</text>
  <text x="688" y="455" font-size="16" text-anchor="middle" fill="#94a3b8" font-weight="700" font-family="sans-serif">常忽略</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-family="sans-serif">報告汪 reportwang.com</text>
</svg>
