<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- 標題區 -->
  <text x="40" y="48" font-size="32" fill="#1e293b" font-weight="700">NG vs OK：護理紀錄範例對比</text>
  <text x="40" y="78" font-size="22" fill="#57534e">跌倒事件與逐案分析寫法示範</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#d97706" stroke-width="2"/>

  <!-- NG 標籤 -->
  <rect x="40" y="112" width="340" height="46" rx="10" fill="#ef4444"/>
  <text x="210" y="142" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle">NG — 委員不認可的寫法</text>

  <!-- NG 內容 -->
  <rect x="40" y="158" width="340" height="185" rx="0" rx="10" fill="#fff5f5" stroke="#ef4444" stroke-width="1.5"/>
  <text x="58" y="182" font-size="14" fill="#374151" font-style="italic">「2024/11/15 09:30</text>
  <text x="58" y="204" font-size="14" fill="#374151" font-style="italic">住民王○○於走廊跌倒，</text>
  <text x="58" y="226" font-size="14" fill="#374151" font-style="italic">右膝擦傷，無骨折。</text>
  <text x="58" y="248" font-size="14" fill="#374151" font-style="italic">已通知護理師處理，</text>
  <text x="58" y="270" font-size="14" fill="#374151" font-style="italic">通知家屬。」</text>
  <text x="58" y="308" font-size="13" fill="#ef4444">只有事件描述，無原因分析</text>
  <text x="58" y="328" font-size="13" fill="#ef4444">無改善措施記錄</text>
  <text x="58" y="348" font-size="13" fill="#ef4444">委員看不到機構有學習改進</text>

  <!-- OK 標籤 -->
  <rect x="420" y="112" width="340" height="46" rx="10" fill="#22c55e"/>
  <text x="590" y="142" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle">OK — 符合評鑑要求的寫法</text>

  <!-- OK 內容 -->
  <rect x="420" y="158" width="340" height="185" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="438" y="178" font-size="13" fill="#374151" font-weight="700">事件：2024/11/15 09:30 走廊跌倒</text>
  <text x="438" y="198" font-size="13" fill="#374151" font-weight="700">原因分析：</text>
  <text x="438" y="218" font-size="13" fill="#374151">  環境：走廊夜間照明不足</text>
  <text x="438" y="238" font-size="13" fill="#374151">  個人：近期體力下降、服用鎮靜劑</text>
  <text x="438" y="258" font-size="13" fill="#374151" font-weight="700">立即措施：清創+通知家屬+醫師評估</text>
  <text x="438" y="278" font-size="13" fill="#374151" font-weight="700">改善措施：</text>
  <text x="438" y="298" font-size="13" fill="#374151">  增設走廊感應燈（3日內完成）</text>
  <text x="438" y="318" font-size="13" fill="#374151">  納入個案照顧計畫調整</text>
  <text x="438" y="338" font-size="13" fill="#22c55e" font-weight="700">追蹤：2週後確認感應燈安裝效果</text>

  <!-- 底部說明 -->
  <rect x="40" y="360" width="720" height="100" rx="10" fill="#fef3c7"/>
  <text x="400" y="385" font-size="16" fill="#92400e" text-anchor="middle" font-weight="700">評鑑委員的核心問題</text>
  <text x="400" y="410" font-size="14" fill="#92400e" text-anchor="middle">「機構看到問題後，有沒有真的改變什麼？」</text>
  <text x="400" y="432" font-size="14" fill="#92400e" text-anchor="middle">逐案分析必須包含「為什麼發生」和「改了什麼」</text>
  <text x="400" y="454" font-size="14" fill="#92400e" text-anchor="middle">改善措施要具體，不能只寫「加強巡視」</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
