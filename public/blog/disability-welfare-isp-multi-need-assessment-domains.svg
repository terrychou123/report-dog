<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">ISP 多重需求六大評估面向</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">每個面向需依服務對象障礙類型選用適合工具</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- 2×3 grid of cards -->
  <!-- Row 1 -->
  <!-- Card 1: 生理健康 -->
  <rect x="40" y="108" width="224" height="120" rx="10" fill="white"/>
  <rect x="40" y="108" width="224" height="8" rx="4" fill="#d97706"/>
  <rect x="40" y="112" width="224" height="4" fill="#d97706"/>
  <text x="152" y="152" text-anchor="middle" font-size="22" fill="#d97706" font-weight="700">生理健康</text>
  <text x="152" y="178" text-anchor="middle" font-size="15" fill="#57534e">健康狀況・用藥・</text>
  <text x="152" y="198" text-anchor="middle" font-size="15" fill="#57534e">飲食・壓傷風險</text>

  <!-- Card 2: 心理情緒 -->
  <rect x="288" y="108" width="224" height="120" rx="10" fill="white"/>
  <rect x="288" y="108" width="224" height="8" rx="4" fill="#78716c"/>
  <rect x="288" y="112" width="224" height="4" fill="#78716c"/>
  <text x="400" y="152" text-anchor="middle" font-size="22" fill="#78716c" font-weight="700">心理情緒</text>
  <text x="400" y="178" text-anchor="middle" font-size="15" fill="#57534e">情緒表達・行為問題・</text>
  <text x="400" y="198" text-anchor="middle" font-size="15" fill="#57534e">心理健康需求</text>

  <!-- Card 3: 日常生活 -->
  <rect x="536" y="108" width="224" height="120" rx="10" fill="white"/>
  <rect x="536" y="108" width="224" height="8" rx="4" fill="#57534e"/>
  <rect x="536" y="112" width="224" height="4" fill="#57534e"/>
  <text x="648" y="152" text-anchor="middle" font-size="22" fill="#57534e" font-weight="700">日常生活</text>
  <text x="648" y="178" text-anchor="middle" font-size="15" fill="#57534e">ADL 自理能力・</text>
  <text x="648" y="198" text-anchor="middle" font-size="15" fill="#57534e">IADL 工具性活動</text>

  <!-- Row 2 -->
  <!-- Card 4: 社交溝通 -->
  <rect x="40" y="252" width="224" height="120" rx="10" fill="white"/>
  <rect x="40" y="252" width="224" height="8" rx="4" fill="#a8a29e"/>
  <rect x="40" y="256" width="224" height="4" fill="#a8a29e"/>
  <text x="152" y="296" text-anchor="middle" font-size="22" fill="#a8a29e" font-weight="700">社交溝通</text>
  <text x="152" y="322" text-anchor="middle" font-size="15" fill="#57534e">人際互動・溝通方式・</text>
  <text x="152" y="342" text-anchor="middle" font-size="15" fill="#57534e">AAC 替代溝通需求</text>

  <!-- Card 5: 學習技能 -->
  <rect x="288" y="252" width="224" height="120" rx="10" fill="white"/>
  <rect x="288" y="252" width="224" height="8" rx="4" fill="#d97706"/>
  <rect x="288" y="256" width="224" height="4" fill="#d97706"/>
  <text x="400" y="296" text-anchor="middle" font-size="22" fill="#d97706" font-weight="700">學習技能</text>
  <text x="400" y="322" text-anchor="middle" font-size="15" fill="#57534e">職業技能・休閒技能・</text>
  <text x="400" y="342" text-anchor="middle" font-size="15" fill="#57534e">認知與學習能力</text>

  <!-- Card 6: 社區融合 -->
  <rect x="536" y="252" width="224" height="120" rx="10" fill="white"/>
  <rect x="536" y="252" width="224" height="8" rx="4" fill="#78716c"/>
  <rect x="536" y="256" width="224" height="4" fill="#78716c"/>
  <text x="648" y="296" text-anchor="middle" font-size="22" fill="#78716c" font-weight="700">社區融合</text>
  <text x="648" y="322" text-anchor="middle" font-size="15" fill="#57534e">社區活動參與・</text>
  <text x="648" y="342" text-anchor="middle" font-size="15" fill="#57534e">家庭支持・資源連結</text>

  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
