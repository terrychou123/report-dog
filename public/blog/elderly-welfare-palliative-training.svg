<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- 標題 -->
  <text x="400" y="50" font-size="26" fill="#1e293b" text-anchor="middle" font-weight="700" font-family="sans-serif">安寧療護訓練要求 — 3 大項目</text>
  <!-- N=3: H=90, outer_gap=38, Header y=38, Row y: 166/269/372 -->
  <!-- Row 1 -->
  <rect x="38" y="151" width="724" height="90" rx="8" fill="#ffffff"/>
  <rect x="38" y="151" width="6" height="90" rx="3" fill="#d97706"/>
  <circle cx="73" cy="196" r="16" fill="#d97706" opacity="0.15"/>
  <text x="73" y="202" font-size="16" fill="#d97706" text-anchor="middle" font-weight="700" font-family="sans-serif">1</text>
  <text x="107" y="185" font-size="18" fill="#1e293b" font-weight="700" font-family="sans-serif">護理人員安寧療護訓練</text>
  <text x="107" y="209" font-size="14" fill="#57534e" font-family="sans-serif">完成安寧療護教育訓練（含病人自主權利法），訓練紀錄保存於人事資料夾</text>
  <text x="107" y="230" font-size="14" fill="#57534e" font-family="sans-serif">建議每 2 年至少完成 1 次安寧療護在職教育，新進護理師於到職 3 個月內完成</text>
  <rect x="590" y="162" width="150" height="46" rx="6" fill="#d97706" opacity="0.10"/>
  <text x="665" y="190" font-size="14" fill="#d97706" text-anchor="middle" font-weight="600" font-family="sans-serif">護理專責</text>
  <!-- Row 2 -->
  <rect x="38" y="254" width="724" height="90" rx="8" fill="#ffffff"/>
  <rect x="38" y="254" width="6" height="90" rx="3" fill="#78716c"/>
  <circle cx="73" cy="299" r="16" fill="#78716c" opacity="0.15"/>
  <text x="73" y="305" font-size="16" fill="#78716c" text-anchor="middle" font-weight="700" font-family="sans-serif">2</text>
  <text x="107" y="288" font-size="18" fill="#1e293b" font-weight="700" font-family="sans-serif">社工人員安寧療護訓練</text>
  <text x="107" y="312" font-size="14" fill="#57534e" font-family="sans-serif">完成安寧療護與病人自主權利相關教育訓練，具備家屬心理支持基本知能</text>
  <text x="107" y="333" font-size="14" fill="#57534e" font-family="sans-serif">訓練時數、機構名稱、課程主題均應留有書面佐證，以利評鑑文件備查</text>
  <rect x="590" y="265" width="150" height="46" rx="6" fill="#78716c" opacity="0.10"/>
  <text x="665" y="293" font-size="14" fill="#78716c" text-anchor="middle" font-weight="600" font-family="sans-serif">社工專責</text>
  <!-- Row 3 -->
  <rect x="38" y="357" width="724" height="90" rx="8" fill="#ffffff"/>
  <rect x="38" y="357" width="6" height="90" rx="3" fill="#57534e"/>
  <circle cx="73" cy="402" r="16" fill="#57534e" opacity="0.15"/>
  <text x="73" y="408" font-size="16" fill="#57534e" text-anchor="middle" font-weight="700" font-family="sans-serif">3</text>
  <text x="107" y="391" font-size="18" fill="#1e293b" font-weight="700" font-family="sans-serif">訓練佐證文件管理</text>
  <text x="107" y="415" font-size="14" fill="#57534e" font-family="sans-serif">集中建檔訓練證明（結業證書、出席名冊、課程手冊），依人員分類存放</text>
  <text x="107" y="436" font-size="14" fill="#57534e" font-family="sans-serif">評鑑前確認全員訓練紀錄完整，避免遺漏兼任或約聘護理師的訓練佐證</text>
  <rect x="590" y="368" width="150" height="46" rx="6" fill="#57534e" opacity="0.10"/>
  <text x="665" y="396" font-size="14" fill="#57534e" text-anchor="middle" font-weight="600" font-family="sans-serif">行政備文</text>
  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" font-family="sans-serif">報告汪 reportwang.com</text>
</svg>