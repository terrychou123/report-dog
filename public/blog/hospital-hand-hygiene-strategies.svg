<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- N=5 列表圖：H=60, inner_gap=13, outer_gap=29 -->
  <!-- Header y=29, Row y=118/191/264/337/410 -->

  <!-- Header（y=29, h=60） -->
  <rect x="0" y="29" width="800" height="60" fill="white"/>
  <rect x="0" y="29" width="6" height="60" fill="#16a34a"/>
  <text x="28" y="71" font-size="36" fill="#1e293b" font-weight="700">提升手部衛生合規率的五大策略</text>

  <!-- ===== Row 1（y=118）稽核員制度 #d97706 ===== -->
  <rect x="28" y="118" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="118" width="6" height="60" rx="2" fill="#d97706"/>
  <circle cx="66" cy="148" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="154" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <text x="100" y="141" font-size="20" fill="#1e293b" font-weight="700">建立標準化稽核員制度</text>
  <text x="100" y="165" font-size="16" fill="#57534e">擴大稽核員範圍（各病房2-3名種子稽核員）、不定時交叉稽核（A稽核B）、不預告觀察</text>
  <rect x="620" y="126" width="136" height="38" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="150" font-size="16" fill="#d97706" text-anchor="middle">破除霍桑</text>

  <!-- ===== Row 2（y=191）分層目標 #78716c ===== -->
  <rect x="28" y="191" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="191" width="6" height="60" rx="2" fill="#78716c"/>
  <circle cx="66" cy="221" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="227" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <text x="100" y="214" font-size="20" fill="#1e293b" font-weight="700">設定分層目標值並追蹤趨勢</text>
  <text x="100" y="238" font-size="16" fill="#57534e">按病房、班次分析稽核數據，夜班和特定科別找出最薄弱環節優先介入</text>
  <rect x="620" y="199" width="136" height="38" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="223" font-size="16" fill="#78716c" text-anchor="middle">精準改善</text>

  <!-- ===== Row 3（y=264）環境設計 #16a34a ===== -->
  <rect x="28" y="264" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="264" width="6" height="60" rx="2" fill="#16a34a"/>
  <circle cx="66" cy="294" r="16" fill="#16a34a" opacity="0.15"/>
  <text x="66" y="300" font-size="16" fill="#16a34a" text-anchor="middle" font-weight="900">3</text>
  <text x="100" y="287" font-size="20" fill="#1e293b" font-weight="700">從提醒升級為環境設計</text>
  <text x="100" y="311" font-size="16" fill="#57534e">每床旁可及之處配置乾洗手液（最重要）、清除環境障礙——方便洗手勝過貼標語10倍</text>
  <rect x="620" y="272" width="136" height="38" rx="8" fill="#16a34a" opacity="0.12"/>
  <text x="688" y="296" font-size="16" fill="#16a34a" text-anchor="middle">設計防呆</text>

  <!-- ===== Row 4（y=337）情境訓練 #57534e ===== -->
  <rect x="28" y="337" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="337" width="6" height="60" rx="2" fill="#57534e"/>
  <circle cx="66" cy="367" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="373" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">4</text>
  <text x="100" y="360" font-size="20" fill="#1e293b" font-weight="700">針對性情境訓練</text>
  <text x="100" y="384" font-size="16" fill="#57534e">小組情境測驗（5-10分鐘）> 大班制上課；評鑑前1個月巡迴測驗，確認五大時機能當場示範</text>
  <rect x="620" y="345" width="136" height="38" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="369" font-size="16" fill="#57534e" text-anchor="middle">情境優於背誦</text>

  <!-- ===== Row 5（y=410）管理層示範 #a8a29e ===== -->
  <rect x="28" y="410" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="410" width="6" height="60" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="440" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="446" font-size="16" fill="#a8a29e" text-anchor="middle" font-weight="900">5</text>
  <text x="100" y="433" font-size="20" fill="#1e293b" font-weight="700">管理層可見的以身作則</text>
  <text x="100" y="457" font-size="16" fill="#57534e">護理長、醫師在護理師面前率先正確執行手部衛生，文化感染效果遠大於懲罰機制</text>
  <rect x="620" y="418" width="136" height="38" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="442" font-size="16" fill="#a8a29e" text-anchor="middle">文化介入</text>

  <!-- 浮水印 -->
  <text x="760" y="490" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
