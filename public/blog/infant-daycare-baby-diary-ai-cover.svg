<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>

  <!-- 右側裝飾 -->
  <text x="1010" y="230" font-size="130" font-weight="900" fill="#d97706" text-anchor="middle" opacity="0.85">50%</text>
  <text x="1010" y="275" font-size="26" fill="#78716c" text-anchor="middle" font-weight="600">文書時間減少</text>
  <line x1="840" y1="295" x2="1180" y2="295" stroke="#dedad3" stroke-width="1"/>

  <!-- 右側卡片 -->
  <rect x="840" y="306" width="320" height="70" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="1000" y="335" font-size="28" fill="#d97706" text-anchor="middle" font-weight="700">AI 輔助撰寫</text>
  <text x="1000" y="366" font-size="22" fill="#a8a29e" text-anchor="middle">自動生成日誌初稿</text>

  <rect x="840" y="384" width="320" height="70" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="1000" y="413" font-size="28" fill="#78716c" text-anchor="middle" font-weight="700">多人協作</text>
  <text x="1000" y="444" font-size="22" fill="#a8a29e" text-anchor="middle">帶班者即時填寫</text>

  <rect x="840" y="462" width="320" height="70" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="1000" y="491" font-size="28" fill="#57534e" text-anchor="middle" font-weight="700">評鑑加分</text>
  <text x="1000" y="522" font-size="22" fill="#a8a29e" text-anchor="middle">第 35 條個別化紀錄</text>

  <!-- 左側主內容 -->
  <text x="60" y="196" font-size="100" font-weight="900" fill="#1e293b">寶寶日誌</text>
  <text x="60" y="326" font-size="80" font-weight="900" fill="#d97706">AI 省一半</text>
  <line x1="60" y1="356" x2="780" y2="356" stroke="#dedad3" stroke-width="2"/>
  <text x="60" y="404" font-size="34" fill="#57534e">用 AI 每天省 30 分鐘 × 評鑑也通過</text>

  <rect x="60" y="430" width="160" height="54" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="140" y="466" font-size="26" fill="#d97706" text-anchor="middle" font-weight="600">AI 撰寫</text>

  <rect x="232" y="430" width="160" height="54" rx="10" fill="#78716c" opacity="0.12"/>
  <text x="312" y="466" font-size="26" fill="#78716c" text-anchor="middle" font-weight="600">省時省力</text>

  <rect x="404" y="430" width="160" height="54" rx="10" fill="#57534e" opacity="0.12"/>
  <text x="484" y="466" font-size="26" fill="#57534e" text-anchor="middle" font-weight="600">評鑑達標</text>

  <text x="60" y="550" font-size="26" fill="#94a3b8">適用：托嬰中心托育人員・負責人・行政人員</text>
  <text x="1140" y="590" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
