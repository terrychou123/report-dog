<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- @template: list-N -->
  <rect width="800" height="500" fill="#f0efe8"/>
  <text x="400" y="48" text-anchor="middle" font-size="30" fill="#1e293b" font-weight="700">藥物自我管理 60% 達標：能力分級與計算</text>
  <text x="400" y="78" text-anchor="middle" font-size="20" fill="#57534e">「自我管理」是能力光譜，不是全有全無的二元判斷</text>
  <line x1="28" y1="94" x2="772" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- Row 1: 完全自管 -->
  <rect x="28" y="166" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="166" width="6" height="90" rx="2" fill="#d97706"/>
  <circle cx="66" cy="211" r="18" fill="#16a34a"/>
  <path d="M 58,211 L 63,216 L 74,205" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="100" y="198" font-size="28" fill="#1e293b" font-weight="700">完全自管：計入分子 [v]</text>
  <text x="100" y="225" font-size="16" fill="#57534e">能說出藥名、用途、服用時間，自行整理藥盒，知道何時需要回診或聯繫醫師</text>
  <text x="100" y="245" font-size="16" fill="#57534e">定義：不需工作人員提醒，有完整的自主管理流程</text>
  <rect x="620" y="174" width="136" height="52" rx="8" fill="#16a34a" opacity="0.12"/>
  <text x="688" y="196" font-size="16" fill="#16a34a" text-anchor="middle" font-weight="700">計入分子</text>
  <text x="688" y="218" font-size="16" fill="#16a34a" text-anchor="middle">60% 目標</text>

  <!-- Row 2: 協助下自管 -->
  <rect x="28" y="269" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="269" width="6" height="90" rx="2" fill="#78716c"/>
  <circle cx="66" cy="314" r="18" fill="#d97706" opacity="0.15"/>
  <path d="M 58,314 L 63,319 L 74,308" fill="none" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="100" y="301" font-size="28" fill="#1e293b" font-weight="700">協助下自管：部分計入分子（視情況）</text>
  <text x="100" y="328" font-size="16" fill="#57534e">能說出至少一種藥名或用途，了解自己為何需要服藥，知道感覺不對要告訴工作人員</text>
  <text x="100" y="348" font-size="16" fill="#57534e">評鑑委員依個別訪談狀況判斷是否達到基本自我管理意識</text>
  <rect x="620" y="277" width="136" height="52" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="299" font-size="16" fill="#d97706" text-anchor="middle">視評估</text>
  <text x="688" y="321" font-size="16" fill="#d97706" text-anchor="middle">部分計入</text>

  <!-- Row 3: 完全依賴 -->
  <rect x="28" y="372" width="744" height="90" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="372" width="6" height="90" rx="2" fill="#57534e"/>
  <circle cx="66" cy="417" r="18" fill="#a8a29e" opacity="0.15"/>
  <rect x="58" y="409" width="16" height="16" rx="3" fill="none" stroke="#a8a29e" stroke-width="1.5"/>
  <text x="100" y="404" font-size="28" fill="#1e293b" font-weight="700">完全依賴：不計入分子（需加強訓練）</text>
  <text x="100" y="431" font-size="16" fill="#57534e">無法說出任何用藥資訊，對自己的用藥狀況完全不了解，完全由工作人員管理</text>
  <text x="100" y="451" font-size="16" fill="#57534e">需制定個別化訓練計畫，設定階段性目標逐步提升能力</text>
  <rect x="620" y="380" width="136" height="52" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="402" font-size="16" fill="#a8a29e" text-anchor="middle">不計入</text>
  <text x="688" y="424" font-size="16" fill="#a8a29e" text-anchor="middle">需加強訓練</text>

  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
