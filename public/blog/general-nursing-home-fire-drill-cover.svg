<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 右側裝飾區塊 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>

  <!-- 右側裝飾大數字 C -->
  <text x="1010" y="230" font-size="200" font-weight="900" fill="#d97706" text-anchor="middle" opacity="0.85">C</text>
  <text x="1010" y="275" font-size="28" fill="#78716c" text-anchor="middle" font-weight="600">環境設施與安全維護</text>

  <!-- 右側四張子題卡片 2×2 -->
  <rect x="840" y="298" width="155" height="74" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="918" y="327" font-size="22" fill="#d97706" text-anchor="middle" font-weight="700">C1</text>
  <text x="918" y="356" font-size="18" fill="#78716c" text-anchor="middle">演練計畫</text>

  <rect x="1005" y="298" width="155" height="74" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="1083" y="327" font-size="22" fill="#57534e" text-anchor="middle" font-weight="700">C2</text>
  <text x="1083" y="356" font-size="18" fill="#78716c" text-anchor="middle">疏散通道</text>

  <rect x="840" y="384" width="155" height="74" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="918" y="413" font-size="22" fill="#57534e" text-anchor="middle" font-weight="700">C3</text>
  <text x="918" y="442" font-size="18" fill="#78716c" text-anchor="middle">個別化疏散</text>

  <rect x="1005" y="384" width="155" height="74" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="1083" y="413" font-size="22" fill="#d97706" text-anchor="middle" font-weight="700">C4</text>
  <text x="1083" y="442" font-size="18" fill="#78716c" text-anchor="middle">情境演練</text>

  <!-- 右側底部標籤 -->
  <rect x="840" y="470" width="320" height="52" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="1000" y="503" font-size="26" fill="#d97706" text-anchor="middle" font-weight="700">4 項基準全攻略</text>

  <!-- 左側主內容 -->
  <text x="60" y="210" font-size="120" font-weight="900" fill="#1e293b">消防演練</text>
  <text x="60" y="348" font-size="100" font-weight="900" fill="#d97706">怎麼做？</text>

  <line x1="60" y1="375" x2="780" y2="375" stroke="#dedad3" stroke-width="2"/>

  <text x="60" y="422" font-size="38" fill="#57534e" font-weight="400">C 區評鑑 4 題全攻略｜情境式抽測不再怕</text>

  <!-- 特色標籤列 -->
  <rect x="60" y="452" width="130" height="50" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="125" y="486" font-size="26" fill="#d97706" text-anchor="middle" font-weight="600">C1 演練計畫</text>

  <rect x="202" y="452" width="130" height="50" rx="10" fill="#78716c" opacity="0.12"/>
  <text x="267" y="486" font-size="26" fill="#78716c" text-anchor="middle" font-weight="600">C2 疏散通道</text>

  <rect x="344" y="452" width="130" height="50" rx="10" fill="#57534e" opacity="0.12"/>
  <text x="409" y="486" font-size="26" fill="#57534e" text-anchor="middle" font-weight="600">C3 疏散策略</text>

  <rect x="486" y="452" width="130" height="50" rx="10" fill="#dc2626" opacity="0.12"/>
  <text x="551" y="486" font-size="26" fill="#dc2626" text-anchor="middle" font-weight="600">C4 情境演練</text>

  <!-- 適用對象 -->
  <text x="60" y="555" font-size="28" fill="#94a3b8">適用：一般護理之家 ｜ 115 年度評鑑基準</text>

  <!-- 浮水印 -->
  <text x="1140" y="590" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
