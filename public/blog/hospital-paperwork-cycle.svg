<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- 背景 -->
  <rect width="800" height="500" fill="#fafaf9"/>

  <!-- 標題區 -->
  <rect x="0" y="0" width="800" height="68" fill="#1c1917"/>
  <text x="400" y="42"  font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">大拜拜循環 vs 日常化品管</text>

  <!-- 列1 — 評鑑前集中衝刺 (#dc2626)，y=128 -->
  <rect x="32" y="128" width="736" height="90" rx="8" fill="#fff5f5" stroke="#fca5a5" stroke-width="1.5"/>
  <rect x="32" y="128" width="8" height="90" rx="4" fill="#dc2626"/>
  <text x="56" y="157"  font-size="17" font-weight="700" fill="#dc2626">評鑑前集中衝刺</text>
  <text x="56" y="179"  font-size="14" fill="#57534e">X 舊模式：評鑑前2個月全科加班補寫文書</text>
  <text x="56" y="200"  font-size="14" fill="#78716c">品質低、壓力大、文書缺乏連貫性，可持續性極差</text>
  <rect x="648" y="150" width="100" height="32" rx="16" fill="#dc2626" opacity="0.12"/>
  <text x="698" y="171"  font-size="14" font-weight="700" fill="#dc2626" text-anchor="middle">大拜拜</text>

  <!-- 列2 — 評鑑後品管鬆懈 (#d97706)，y=231 -->
  <rect x="32" y="231" width="736" height="90" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
  <rect x="32" y="231" width="8" height="90" rx="4" fill="#d97706"/>
  <text x="56" y="260"  font-size="17" font-weight="700" fill="#d97706">評鑑後品管鬆懈</text>
  <text x="56" y="282"  font-size="14" fill="#57534e">X 舊模式：評鑑結束即放鬆，改善計畫追蹤中斷</text>
  <text x="56" y="303"  font-size="14" fill="#78716c">下次評鑑前再度集中衝刺，惡性循環年年重演</text>
  <rect x="648" y="253" width="100" height="32" rx="16" fill="#d97706" opacity="0.15"/>
  <text x="698" y="274"  font-size="14" font-weight="700" fill="#d97706" text-anchor="middle">惡性循環</text>

  <!-- 列3 — 日常化品管新路徑 (#16a34a)，y=334 -->
  <rect x="32" y="334" width="736" height="90" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <rect x="32" y="334" width="8" height="90" rx="4" fill="#16a34a"/>
  <text x="56" y="363"  font-size="17" font-weight="700" fill="#16a34a">日常化品管新路徑</text>
  <text x="56" y="385"  font-size="14" fill="#57534e">O 新做法：每月品質報告、AI輔助文書日常化、每季自我查核</text>
  <text x="56" y="406"  font-size="14" fill="#78716c">評鑑只是日常品管的一次例行驗收，不再恐慌</text>
  <rect x="648" y="356" width="100" height="32" rx="16" fill="#16a34a" opacity="0.12"/>
  <text x="698" y="377"  font-size="14" font-weight="700" fill="#16a34a" text-anchor="middle">永續品管</text>

  <!-- 浮水印 -->
  <text x="400" y="480"  font-size="14" fill="#a8a29e" text-anchor="middle" opacity="0.7">報告汪 reportwang.com</text>
</svg>
