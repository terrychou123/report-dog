<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"
     font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 標題區 -->
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">改善計畫書撰寫確認清單</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">文件內容・執行規劃，兩大面向全面到位</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- 左欄 Section 1：文件內容 #d97706 -->
  <rect x="60" y="108" width="6" height="24" rx="3" fill="#d97706"/>
  <text x="74" y="125" font-size="18" fill="#1e293b" font-weight="700">文件內容</text>

  <rect x="64" y="140" width="20" height="20" rx="3" fill="#f0efe8" stroke="#a8a29e" stroke-width="1"/>
  <path d="M 68,150 L 72,155 L 81,143" fill="none" stroke="#d97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="94" y="156" font-size="18" fill="#1e293b">明列每項缺失的改善措施</text>

  <rect x="64" y="180" width="20" height="20" rx="3" fill="#f0efe8" stroke="#a8a29e" stroke-width="1"/>
  <path d="M 68,190 L 72,195 L 81,183" fill="none" stroke="#d97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="94" y="196" font-size="18" fill="#1e293b">訂定各項完成期限</text>

  <rect x="64" y="220" width="20" height="20" rx="3" fill="#f0efe8" stroke="#a8a29e" stroke-width="1"/>
  <path d="M 68,230 L 72,235 L 81,223" fill="none" stroke="#d97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="94" y="236" font-size="18" fill="#1e293b">指定各項負責人員</text>

  <!-- 左欄 Section 2：執行規劃 #57534e -->
  <rect x="60" y="262" width="6" height="24" rx="3" fill="#57534e"/>
  <text x="74" y="279" font-size="18" fill="#1e293b" font-weight="700">執行規劃</text>

  <rect x="64" y="294" width="20" height="20" rx="3" fill="none" stroke="#a8a29e" stroke-width="1.5"/>
  <text x="94" y="310" font-size="18" fill="#1e293b">改善進度追蹤機制已建立</text>

  <rect x="64" y="334" width="20" height="20" rx="3" fill="none" stroke="#a8a29e" stroke-width="1.5"/>
  <text x="94" y="350" font-size="18" fill="#1e293b">全員已知悉各自負責項目</text>

  <rect x="64" y="374" width="20" height="20" rx="3" fill="none" stroke="#a8a29e" stroke-width="1.5"/>
  <text x="94" y="390" font-size="18" fill="#1e293b">主管定期查核時間已排定</text>

  <!-- 垂直分隔線 -->
  <line x1="400" y1="98" x2="400" y2="432" stroke="#dedad3" stroke-width="1"/>

  <!-- 右欄 Section 1：格式規範 #78716c -->
  <rect x="416" y="108" width="6" height="24" rx="3" fill="#78716c"/>
  <text x="430" y="125" font-size="18" fill="#1e293b" font-weight="700">格式規範</text>

  <rect x="420" y="140" width="20" height="20" rx="3" fill="#f0efe8" stroke="#a8a29e" stroke-width="1"/>
  <path d="M 424,150 L 428,155 L 437,143" fill="none" stroke="#78716c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="450" y="156" font-size="18" fill="#1e293b">使用主管機關規定表單</text>

  <rect x="420" y="180" width="20" height="20" rx="3" fill="#f0efe8" stroke="#a8a29e" stroke-width="1"/>
  <path d="M 424,190 L 428,195 L 437,183" fill="none" stroke="#78716c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="450" y="196" font-size="18" fill="#1e293b">確認送件格式與頁數限制</text>

  <rect x="420" y="220" width="20" height="20" rx="3" fill="#f0efe8" stroke="#a8a29e" stroke-width="1"/>
  <path d="M 424,230 L 428,235 L 437,223" fill="none" stroke="#78716c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="450" y="236" font-size="18" fill="#1e293b">主任簽核頁已附上</text>

  <!-- 右欄 Section 2：備存文件 #a8a29e -->
  <rect x="416" y="262" width="6" height="24" rx="3" fill="#a8a29e"/>
  <text x="430" y="279" font-size="18" fill="#1e293b" font-weight="700">備存文件</text>

  <rect x="420" y="294" width="20" height="20" rx="3" fill="none" stroke="#a8a29e" stroke-width="1.5"/>
  <text x="450" y="310" font-size="18" fill="#1e293b">計畫書正本已留存備查</text>

  <rect x="420" y="334" width="20" height="20" rx="3" fill="none" stroke="#a8a29e" stroke-width="1.5"/>
  <text x="450" y="350" font-size="18" fill="#1e293b">送件收據或確認信已保存</text>

  <rect x="420" y="374" width="20" height="20" rx="3" fill="none" stroke="#a8a29e" stroke-width="1.5"/>
  <text x="450" y="390" font-size="18" fill="#1e293b">改善完成後填寫結案紀錄</text>

  <!-- 底部分隔線 -->
  <line x1="40" y1="433" x2="760" y2="433" stroke="#dedad3" stroke-width="1"/>

  <!-- 圖例 -->
  <rect x="75" y="443" width="18" height="18" rx="3" fill="#f0efe8" stroke="#a8a29e" stroke-width="1"/>
  <path d="M 78,453 L 82,458 L 91,446" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="102" y="458" font-size="18" fill="#57534e">已確認完成</text>

  <rect x="230" y="443" width="18" height="18" rx="3" fill="none" stroke="#a8a29e" stroke-width="1.5"/>
  <text x="257" y="458" font-size="18" fill="#57534e">待確認項目</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
