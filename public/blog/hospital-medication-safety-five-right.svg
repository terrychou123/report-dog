<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- N=5 列表圖：H=60, inner_gap=13, outer_gap=29 -->
  <!-- Header y=29, Row y=118/191/264/337/410 -->

  <!-- Header（y=29, h=60） -->
  <rect x="0" y="29" width="800" height="60" fill="white"/>
  <rect x="0" y="29" width="6" height="60" fill="#9333ea"/>
  <text x="28" y="71" font-size="36" fill="#1e293b" font-weight="700">給藥五對查核：每次給藥都要確認</text>

  <!-- ===== Row 1（y=118）正確的病人 #d97706 ===== -->
  <rect x="28" y="118" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="118" width="6" height="60" rx="2" fill="#d97706"/>
  <circle cx="66" cy="148" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="154" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">1對</text>
  <text x="100" y="141" font-size="20" fill="#1e293b" font-weight="700">正確的病人（Right Patient）</text>
  <text x="100" y="165" font-size="16" fill="#57534e">使用至少兩種辨識方式（姓名＋病歷號/出生日期），掃描手環條碼最佳；昏迷病人核對手環</text>
  <rect x="620" y="126" width="136" height="38" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="150" font-size="16" fill="#d97706" text-anchor="middle">雙重辨識</text>

  <!-- ===== Row 2（y=191）正確的藥品 #78716c ===== -->
  <rect x="28" y="191" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="191" width="6" height="60" rx="2" fill="#78716c"/>
  <circle cx="66" cy="221" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="227" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">2對</text>
  <text x="100" y="214" font-size="20" fill="#1e293b" font-weight="700">正確的藥品（Right Drug）</text>
  <text x="100" y="238" font-size="16" fill="#57534e">核對藥品名稱（注意發音/外觀相似藥品的混淆），特別注意Look-alike/Sound-alike藥品</text>
  <rect x="620" y="199" width="136" height="38" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="223" font-size="16" fill="#78716c" text-anchor="middle">LASA藥品</text>

  <!-- ===== Row 3（y=264）正確的劑量 #57534e ===== -->
  <rect x="28" y="264" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="264" width="6" height="60" rx="2" fill="#57534e"/>
  <circle cx="66" cy="294" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="300" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">3對</text>
  <text x="100" y="287" font-size="20" fill="#1e293b" font-weight="700">正確的劑量（Right Dose）</text>
  <text x="100" y="311" font-size="16" fill="#57534e">核對劑量單位（mg vs mcg, ml vs mEq），高警訊藥品劑量需雙人獨立計算確認</text>
  <rect x="620" y="272" width="136" height="38" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="296" font-size="16" fill="#57534e" text-anchor="middle">單位核對</text>

  <!-- ===== Row 4（y=337）正確的途徑 #a8a29e ===== -->
  <rect x="28" y="337" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="337" width="6" height="60" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="367" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="373" font-size="16" fill="#a8a29e" text-anchor="middle" font-weight="900">4對</text>
  <text x="100" y="360" font-size="20" fill="#1e293b" font-weight="700">正確的途徑（Right Route）</text>
  <text x="100" y="384" font-size="16" fill="#57534e">口服、靜脈注射、肌肉注射、皮下注射，途徑不同、劑量和效果也不同，不得混淆</text>
  <rect x="620" y="345" width="136" height="38" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="369" font-size="16" fill="#a8a29e" text-anchor="middle">途徑確認</text>

  <!-- ===== Row 5（y=410）正確的時間 #9333ea ===== -->
  <rect x="28" y="410" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="410" width="6" height="60" rx="2" fill="#9333ea"/>
  <circle cx="66" cy="440" r="16" fill="#9333ea"/>
  <text x="66" y="446" font-size="16" fill="#9333ea" text-anchor="middle" font-weight="900">5對</text>
  <text x="100" y="433" font-size="20" fill="#1e293b" font-weight="700">正確的時間（Right Time）</text>
  <text x="100" y="457" font-size="16" fill="#57534e">依醫囑時間給藥，偏差超過30分鐘需記錄原因；給藥後立即在紀錄單上簽名，不得事先預簽</text>
  <rect x="620" y="418" width="136" height="38" rx="8" fill="#9333ea" opacity="0.12"/>
  <text x="688" y="442" font-size="16" fill="#9333ea" text-anchor="middle">執行後簽名</text>

  <!-- 浮水印 -->
  <text x="760" y="490" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
