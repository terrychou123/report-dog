<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 頂部標題區塊 -->
  <rect x="0" y="0" width="800" height="108" rx="0" fill="#1e293b"/>
  <text x="400" y="52"  font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">出院計畫跨部門協作角色分工</text>
  <text x="400" y="82"  font-size="14" fill="#a8a29e" text-anchor="middle">四個角色同步協作，出院計畫評鑑零漏接</text>

  <!-- 列 1 (y=128) -->
  <rect x="38" y="128" width="724" height="80" rx="10" fill="#fef3c7"/>
  <rect x="38" y="128" width="6" height="80" rx="2" fill="#d97706"/>
  <circle cx="80" cy="168" r="20" fill="#d97706" opacity="0.15"/>
  <text x="80" y="175"  font-size="14" font-weight="700" fill="#d97706" text-anchor="middle">醫</text>
  <text x="116" y="153"  font-size="15" font-weight="700" fill="#d97706">醫師</text>
  <text x="116" y="175"  font-size="14" fill="#78716c">確定出院時間點與醫療限制，開立出院醫囑，完成出院病歷摘要</text>
  <text x="116" y="198"  font-size="14" fill="#a8a29e">出院病摘需在規定時限內完成，內容需包含診斷、治療過程、醫囑</text>
  <rect x="624" y="147" width="114" height="26" rx="13" fill="#d97706"/>
  <text x="681" y="165"  font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">醫療決策</text>

  <!-- 列 2 (y=228) -->
  <rect x="38" y="228" width="724" height="80" rx="10" fill="#f5f5f4"/>
  <rect x="38" y="228" width="6" height="80" rx="2" fill="#78716c"/>
  <circle cx="80" cy="268" r="20" fill="#78716c" opacity="0.15"/>
  <text x="80" y="275"  font-size="14" font-weight="700" fill="#78716c" text-anchor="middle">護</text>
  <text x="116" y="253"  font-size="15" font-weight="700" fill="#57534e">護理師</text>
  <text x="116" y="275"  font-size="14" fill="#78716c">執行出院教育七大項目，確認家屬知悉，記錄於護理紀錄</text>
  <text x="116" y="298"  font-size="14" fill="#a8a29e">評鑑委員訪談護理師時必問出院教育執行情況，需備書面紀錄與簽名</text>
  <rect x="624" y="247" width="114" height="26" rx="13" fill="#78716c"/>
  <text x="681" y="265"  font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">衛教執行</text>

  <!-- 列 3 (y=328) -->
  <rect x="38" y="328" width="724" height="80" rx="10" fill="#f5f5f4"/>
  <rect x="38" y="328" width="6" height="80" rx="2" fill="#57534e"/>
  <circle cx="80" cy="368" r="20" fill="#57534e" opacity="0.15"/>
  <text x="80" y="375"  font-size="14" font-weight="700" fill="#57534e" text-anchor="middle">社</text>
  <text x="116" y="353"  font-size="15" font-weight="700" fill="#57534e">醫療社工</text>
  <text x="116" y="375"  font-size="14" fill="#78716c">評估長照需求，連結社區資源，辦理轉銜評估單，追蹤銜接結果</text>
  <text x="116" y="398"  font-size="14" fill="#a8a29e">入院後早期介入篩選高需求病人，確認長照服務出院前啟動</text>
  <rect x="624" y="347" width="114" height="26" rx="13" fill="#57534e"/>
  <text x="681" y="365"  font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">資源連結</text>

  <!-- 列 4 (y=428) -->
  <rect x="38" y="428" width="724" height="52" rx="10" fill="#f5f5f4"/>
  <rect x="38" y="428" width="6" height="52" rx="2" fill="#a8a29e"/>
  <circle cx="80" cy="454" r="20" fill="#a8a29e" opacity="0.15"/>
  <text x="80" y="461"  font-size="14" font-weight="700" fill="#a8a29e" text-anchor="middle">藥</text>
  <text x="116" y="449"  font-size="15" font-weight="700" fill="#57534e">藥師</text>
  <text x="116" y="471"  font-size="14" fill="#78716c">出院前用藥衛教，確認多重用藥問題，提供藥品說明書</text>
  <rect x="624" y="441" width="114" height="26" rx="13" fill="#a8a29e"/>
  <text x="681" y="459"  font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">用藥衛教</text>

  <!-- 浮水印 -->
  <text x="400" y="494"  font-size="14" fill="#a8a29e" text-anchor="middle" opacity="0.6">報告汪 reportwang.com</text>
</svg>
