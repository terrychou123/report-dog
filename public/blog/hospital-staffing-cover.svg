<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#fafaf9"/>

  <!-- 右側裝飾區塊 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>

  <!-- 右側大數字「3」 -->
  <text x="940" y="220"  font-size="180" font-weight="900" fill="#2563eb" opacity="0.18">3</text>
  <text x="870" y="210"  font-size="160" font-weight="900" fill="#2563eb">3</text>

  <!-- 右側說明文字 -->
  <text x="858" y="270"  font-size="17" fill="#44403c" font-weight="600">1.3.1 醫師配置</text>
  <text x="858" y="298"  font-size="17" fill="#44403c" font-weight="600">1.3.2 護理人力</text>
  <text x="858" y="326"  font-size="17" fill="#44403c" font-weight="600">1.3.3 醫事人員</text>

  <!-- 右側3個卡片 -->
  <rect x="845" y="355" width="310" height="58" rx="10" fill="#ffffff" opacity="0.85"/>
  <text x="865" y="378"  font-size="13" fill="#d97706" font-weight="700">護病比計算</text>
  <text x="865" y="400"  font-size="13" fill="#57534e">各班次分別計算，白班/夜班合規</text>

  <rect x="845" y="423" width="310" height="58" rx="10" fill="#ffffff" opacity="0.85"/>
  <text x="865" y="446"  font-size="13" fill="#2563eb" font-weight="700">執照管理</text>
  <text x="865" y="468"  font-size="13" fill="#57534e">效期追蹤，預警提醒，及時換照</text>

  <rect x="845" y="491" width="310" height="58" rx="10" fill="#ffffff" opacity="0.85"/>
  <text x="865" y="514"  font-size="13" fill="#16a34a" font-weight="700">人力排班</text>
  <text x="865" y="536"  font-size="13" fill="#57534e">夜班值班制度，緊急補足機制</text>

  <!-- 左側主標題 -->
  <text x="60" y="130"  font-size="58" font-weight="900" fill="#1c1917">醫院人力配置</text>
  <text x="60" y="200"  font-size="58" font-weight="900" fill="#2563eb">必要條文解析</text>

  <!-- 副標題 -->
  <text x="60" y="248"  font-size="20" fill="#57534e" font-weight="500">1.3.1 醫師  ×  1.3.2 護病比  ×  1.3.3 醫事人員</text>

  <!-- 分隔線 -->
  <rect x="60" y="270" width="700" height="3" fill="#2563eb" opacity="0.25" rx="2"/>

  <!-- 標籤列 -->
  <!-- 必要條文 -->
  <rect x="60" y="295" width="104" height="34" rx="17" fill="#2563eb"/>
  <text x="112" y="317"  font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle">必要條文</text>

  <!-- 護病比計算 -->
  <rect x="174" y="295" width="116" height="34" rx="17" fill="#d97706"/>
  <text x="232" y="317"  font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle">護病比計算</text>

  <!-- 執照管理 -->
  <rect x="300" y="295" width="92" height="34" rx="17" fill="#16a34a"/>
  <text x="346" y="317"  font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle">執照管理</text>

  <!-- 夜班配置 -->
  <rect x="402" y="295" width="92" height="34" rx="17" fill="#7c3aed"/>
  <text x="448" y="317"  font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle">夜班配置</text>

  <!-- AI自我查核 -->
  <rect x="504" y="295" width="118" height="34" rx="17" fill="#0e7490"/>
  <text x="563" y="317"  font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle">AI自我查核</text>

  <!-- 說明文字區塊 -->
  <rect x="60" y="358" width="720" height="180" rx="14" fill="#eff6ff" opacity="0.7"/>
  <text x="84" y="392"  font-size="16" fill="#1e40af" font-weight="700">重要提醒</text>
  <text x="84" y="420"  font-size="15" fill="#1c1917">人力配置 3 項必要條文，任一不符合即視為重大缺失</text>
  <text x="84" y="446"  font-size="15" fill="#1c1917">常見問題：護病比計算錯誤、執照過期、夜班安排不符</text>
  <text x="84" y="472"  font-size="15" fill="#1c1917">本文提供逐條解析 ＋ AI 自我查核清單，評鑑前快速確認合規</text>
  <text x="84" y="498"  font-size="15" fill="#2563eb" font-weight="600">依據：114 年度醫院評鑑基準</text>

  <!-- 浮水印 -->
  <text x="600" y="612"  font-size="13" fill="#a8a29e" text-anchor="middle">報告汪 reportwang.com</text>
</svg>
