<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- Header (N=4) -->
  <rect x="50" y="50" width="700" height="76" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="400" y="84" font-size="22" fill="#1e293b" font-weight="700" text-anchor="middle" >B2 個案計畫 4 大常見錯誤</text>
  <text x="400" y="108" font-size="15" fill="#57534e" text-anchor="middle" >評鑑委員最常點到的缺失，提前避免即可大幅提升得分</text>

  <!-- Row 1: y=160 -->
  <rect x="50" y="160" width="700" height="62" rx="8" fill="#ffffff"/>
  <rect x="50" y="160" width="6" height="62" rx="2" fill="#d97706"/>
  <circle cx="87" cy="191" r="16" fill="#d97706" opacity="0.15"/>
  <text x="87" y="197" font-size="16" fill="#d97706" font-weight="700" text-anchor="middle" >1</text>
  <text x="120" y="182" font-size="16" fill="#1e293b" font-weight="700" >評估時程超過 72 小時</text>
  <text x="120" y="202" font-size="14" fill="#57534e" >入住超過 3 天才補做評估，文件日期不符，評鑑委員一眼識破</text>
  <rect x="620" y="167" width="115" height="46" rx="6" fill="#d97706" opacity="0.12"/>
  <text x="677" y="187" font-size="14" fill="#d97706" font-weight="700" text-anchor="middle" >時效錯誤</text>
  <text x="677" y="203" font-size="14" fill="#d97706" text-anchor="middle" >最常見</text>

  <!-- Row 2: y=235 -->
  <rect x="50" y="235" width="700" height="62" rx="8" fill="#ffffff"/>
  <rect x="50" y="235" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="87" cy="266" r="16" fill="#78716c" opacity="0.15"/>
  <text x="87" y="272" font-size="16" fill="#78716c" font-weight="700" text-anchor="middle" >2</text>
  <text x="120" y="257" font-size="16" fill="#1e293b" font-weight="700" >計畫內容千人一面</text>
  <text x="120" y="277" font-size="14" fill="#57534e" >所有住民照護計畫幾乎相同，缺乏「個別化」針對性，違反 B2 核心精神</text>
  <rect x="620" y="242" width="115" height="46" rx="6" fill="#78716c" opacity="0.12"/>
  <text x="677" y="262" font-size="14" fill="#78716c" font-weight="700" text-anchor="middle" >格式化錯誤</text>
  <text x="677" y="278" font-size="14" fill="#78716c" text-anchor="middle" >缺個別化</text>

  <!-- Row 3: y=310 -->
  <rect x="50" y="310" width="700" height="62" rx="8" fill="#ffffff"/>
  <rect x="50" y="310" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="87" cy="341" r="16" fill="#57534e" opacity="0.15"/>
  <text x="87" y="347" font-size="16" fill="#57534e" font-weight="700" text-anchor="middle" >3</text>
  <text x="120" y="332" font-size="16" fill="#1e293b" font-weight="700" >3 個月未更新計畫</text>
  <text x="120" y="352" font-size="14" fill="#57534e" >超過 3 個月（安養機構 6 個月）沒有重新評估，評值結果欄位空白</text>
  <rect x="620" y="317" width="115" height="46" rx="6" fill="#57534e" opacity="0.12"/>
  <text x="677" y="337" font-size="14" fill="#57534e" font-weight="700" text-anchor="middle" >更新缺失</text>
  <text x="677" y="353" font-size="14" fill="#57534e" text-anchor="middle" >逾期未評</text>

  <!-- Row 4: y=385 -->
  <rect x="50" y="385" width="700" height="62" rx="8" fill="#ffffff"/>
  <rect x="50" y="385" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="87" cy="416" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="87" y="422" font-size="16" fill="#a8a29e" font-weight="700" text-anchor="middle" >4</text>
  <text x="120" y="407" font-size="16" fill="#1e293b" font-weight="700" >無家屬討論修正紀錄</text>
  <text x="120" y="427" font-size="14" fill="#57534e" >半年修正未有家屬參與証明，或家屬簽名缺漏、日期前後矛盾</text>
  <rect x="620" y="392" width="115" height="46" rx="6" fill="#a8a29e" opacity="0.12"/>
  <text x="677" y="412" font-size="14" fill="#a8a29e" font-weight="700" text-anchor="middle" >文件缺漏</text>
  <text x="677" y="428" font-size="14" fill="#a8a29e" text-anchor="middle" >簽名缺失</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" >報告汪 reportwang.com</text>
</svg>
