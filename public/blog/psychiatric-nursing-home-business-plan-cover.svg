<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 右側裝飾區 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>

  <!-- 特色標籤 -->
  <rect x="60" y="60" width="90" height="32" rx="16" fill="#d97706"/>
  <text x="105" y="81" font-size="16" fill="white" text-anchor="middle"  font-weight="bold">A1.1</text>
  <rect x="160" y="60" width="90" height="32" rx="16" fill="#78716c"/>
  <text x="205" y="81" font-size="16" fill="white" text-anchor="middle"  font-weight="bold">A2.1</text>
  <rect x="260" y="60" width="120" height="32" rx="16" fill="#57534e"/>
  <text x="320" y="81" font-size="16" fill="white" text-anchor="middle" >經營管理</text>

  <!-- 主標題第1行 -->
  <text x="60" y="220" font-size="120" fill="#1e293b"  font-weight="bold">業務計畫</text>
  <!-- 主標題第2行 -->
  <text x="60" y="340" font-size="110" fill="#d97706"  font-weight="bold">三階段規劃</text>

  <!-- 副標題 -->
  <text x="60" y="405" font-size="32" fill="#57534e" >A1.1短中長程計畫撰寫與A2.1負責人參與評鑑準備</text>

  <!-- 分隔線 -->
  <line x1="60" y1="430" x2="760" y2="430" stroke="#c4bfb8" stroke-width="2"/>

  <!-- 底部說明 -->
  <text x="60" y="470" font-size="28" fill="#78716c" >精神護理之家評鑑準備系列</text>

  <!-- 右側裝飾區內容 -->
  <!-- 大數字 -->
  <text x="1010" y="185" font-size="180" fill="#d97706" text-anchor="middle"  font-weight="bold" opacity="0.9">3</text>
  <text x="1010" y="230" font-size="22" fill="#57534e" text-anchor="middle" >短中長三階段</text>
  <text x="1010" y="260" font-size="26" fill="#78716c" text-anchor="middle"  font-weight="bold">階段業務計畫</text>

  <!-- 2x2 卡片 -->
  <rect x="870" y="290" width="130" height="70" rx="8" fill="#d97706"/>
  <text x="935" y="315" font-size="14" fill="white" text-anchor="middle"  font-weight="bold">短程計畫</text>
  <text x="935" y="335" font-size="13" fill="white" text-anchor="middle" >1年以內</text>

  <rect x="1020" y="290" width="130" height="70" rx="8" fill="#78716c"/>
  <text x="1085" y="315" font-size="14" fill="white" text-anchor="middle"  font-weight="bold">中程計畫</text>
  <text x="1085" y="335" font-size="13" fill="white" text-anchor="middle" >1-4年</text>

  <rect x="870" y="375" width="130" height="70" rx="8" fill="#57534e"/>
  <text x="935" y="400" font-size="14" fill="white" text-anchor="middle"  font-weight="bold">長程計畫</text>
  <text x="935" y="420" font-size="13" fill="white" text-anchor="middle" >4年以上</text>

  <rect x="1020" y="375" width="130" height="70" rx="8" fill="#a8a29e"/>
  <text x="1085" y="400" font-size="14" fill="white" text-anchor="middle"  font-weight="bold">年度計畫</text>
  <text x="1085" y="420" font-size="13" fill="white" text-anchor="middle" >每年檢討</text>

  <!-- 品牌浮水印 -->
  <text x="1140" y="590" font-size="24" fill="#c4bfb8" text-anchor="end" >報告汪 reportwang.com</text>
</svg>
