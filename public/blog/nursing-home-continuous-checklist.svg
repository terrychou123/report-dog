  <text x="446" y="153"  font-size="14" fill="#57534e">所有消防局查核及設備檢修報告</text>
  <rect x="40" y="172" width="348" height="32" rx="6" fill="#d97706" opacity="0.15"/>
  <rect x="48" y="180" width="16" height="16" rx="3" fill="#d97706"/>
  <text x="74" y="193"  font-size="14" fill="#57534e">建管局公共安全申報文件</text>
  <rect x="412" y="172" width="348" height="32" rx="6" fill="#d97706" opacity="0.15"/>
  <rect x="420" y="180" width="16" height="16" rx="3" fill="#d97706"/>
  <text x="446" y="193"  font-size="14" fill="#57534e">勞政局查核及外勞管理文件</text>
  <!-- 改善記錄 -->
  <text x="56" y="224"  font-size="15" font-weight="700" fill="#78716c">改善記錄完整性</text>
  <rect x="40" y="232" width="348" height="32" rx="6" fill="#78716c" opacity="0.15"/>
  <rect x="48" y="240" width="16" height="16" rx="3" fill="#78716c"/>
  <text x="74" y="253"  font-size="14" fill="#57534e">每筆缺失均有改善計畫（含負責人及期限）</text>
  <rect x="412" y="232" width="348" height="32" rx="6" fill="#78716c" opacity="0.15"/>
  <rect x="420" y="240" width="16" height="16" rx="3" fill="#78716c"/>
  <text x="446" y="253"  font-size="14" fill="#57534e">每筆缺失均有佐證文件（照片/記錄/採購）</text>
