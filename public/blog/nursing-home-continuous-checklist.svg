  <rect x="48" y="280" width="16" height="16" rx="3" fill="#78716c"/>
  <text x="74" y="293"  font-size="14" fill="#57534e">缺失追蹤台帳狀態全部更新為「已結案」</text>
  <rect x="412" y="272" width="348" height="32" rx="6" fill="#78716c" opacity="0.15"/>
  <rect x="420" y="280" width="16" height="16" rx="3" fill="#78716c"/>
  <text x="446" y="293"  font-size="14" fill="#57534e">改善比例計算完成（目標 100%）</text>
