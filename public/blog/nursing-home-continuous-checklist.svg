  <text x="56" y="324"  font-size="15" font-weight="700" fill="#57534e">預防機制</text>
  <rect x="40" y="332" width="348" height="32" rx="6" fill="#57534e" opacity="0.15"/>
  <rect x="48" y="340" width="16" height="16" rx="3" fill="#57534e"/>
  <text x="74" y="353"  font-size="14" fill="#57534e">重複缺失已納入 SOP 或員工訓練</text>
  <rect x="412" y="332" width="348" height="32" rx="6" fill="#57534e" opacity="0.15"/>
  <rect x="420" y="340" width="16" height="16" rx="3" fill="#57534e"/>
  <text x="446" y="353"  font-size="14" fill="#57534e">消防設備維護排程已建立並落實</text>
  <rect x="40" y="372" width="348" height="32" rx="6" fill="#57534e" opacity="0.15"/>
  <rect x="48" y="380" width="16" height="16" rx="3" fill="#57534e"/>
