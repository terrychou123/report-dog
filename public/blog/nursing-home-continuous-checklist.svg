  <rect x="412" y="372" width="348" height="32" rx="6" fill="#57534e" opacity="0.15"/>
  <rect x="420" y="380" width="16" height="16" rx="3" fill="#57534e"/>
  <text x="446" y="393"  font-size="14" fill="#57534e">完成 1 次完整 A4 文件模擬展示演練</text>
  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" >報告汪 reportwang.com</text>
