<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 右側裝飾區塊 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>

  <!-- 右側裝飾大數字 "60"（頂部對齊左側主標題）-->
  <text x="1010" y="255" font-size="180" font-weight="900" fill="#d97706" text-anchor="middle" opacity="0.85">60</text>
  <text x="1010" y="295" font-size="26" fill="#78716c" text-anchor="middle" font-weight="600">項評鑑指標</text>

  <!-- 右側分隔線 -->
  <line x1="840" y1="315" x2="1180" y2="315" stroke="#dedad3" stroke-width="1"/>

  <!-- 右側三個分類卡片 -->
  <!-- Card 1：行政管理 -->
  <rect x="840" y="326" width="320" height="70" rx="8" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="1000" y="350" font-size="28" fill="#d97706" text-anchor="middle" font-weight="700">行政管理</text>
  <text x="1000" y="382" font-size="22" fill="#a8a29e" text-anchor="middle">20分 ｜ 第1-11項</text>

  <!-- Card 2：托育活動 -->
  <rect x="840" y="404" width="320" height="70" rx="8" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="1000" y="428" font-size="28" fill="#78716c" text-anchor="middle" font-weight="700">托育活動</text>
  <text x="1000" y="460" font-size="22" fill="#a8a29e" text-anchor="middle">40分 ｜ 第12-36項</text>

  <!-- Card 3：健康安全 -->
  <rect x="840" y="482" width="320" height="70" rx="8" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="1000" y="506" font-size="28" fill="#57534e" text-anchor="middle" font-weight="700">健康安全</text>
  <text x="1000" y="538" font-size="22" fill="#a8a29e" text-anchor="middle">40分 ｜ 第37-60項</text>

  <!-- 左側主內容區 -->
  <!-- 主標題第 1 行 -->
  <text x="60" y="200" font-size="120" font-weight="900" fill="#1e293b">托嬰中心</text>
  <!-- 主標題第 2 行（琥珀強調色）-->
  <text x="60" y="338" font-size="120" font-weight="900" fill="#d97706">評鑑全攻略</text>

  <!-- 分隔線 -->
  <line x1="60" y1="368" x2="780" y2="368" stroke="#dedad3" stroke-width="2"/>

  <!-- 副標題 -->
  <text x="60" y="416" font-size="36" fill="#57534e" font-weight="400">臺北市114-116年度 · 60項指標逐條拆解</text>

  <!-- 特色標籤 Pill -->
  <rect x="60" y="442" width="148" height="54" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="134" y="475" font-size="28" fill="#d97706" text-anchor="middle" font-weight="600">評鑑準備</text>

  <rect x="220" y="442" width="148" height="54" rx="10" fill="#78716c" opacity="0.12"/>
  <text x="294" y="475" font-size="28" fill="#78716c" text-anchor="middle" font-weight="600">60項指標</text>

  <rect x="380" y="442" width="148" height="54" rx="10" fill="#57534e" opacity="0.12"/>
  <text x="454" y="475" font-size="28" fill="#57534e" text-anchor="middle" font-weight="600">三大區塊</text>

  <!-- 適用對象 -->
  <text x="60" y="556" font-size="26" fill="#94a3b8">適用：托嬰中心負責人・托育人員・行政人員</text>

  <!-- 浮水印 -->
  <text x="1140" y="590" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
