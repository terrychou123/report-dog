<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 右側裝飾區 -->
  <rect x="800" y="0" width="400" height="630" fill="#e8e6de"/>

  <!-- 左側內容區 -->
  <!-- 主標題第1行 -->
  <text x="60" y="160" font-size="130" font-weight="900" fill="#1e293b" >感染控制</text>
  <!-- 主標題第2行 -->
  <text x="60" y="290" font-size="130" font-weight="900" fill="#d97706" >8項要求</text>
  <!-- 副標題 -->
  <text x="60" y="360" font-size="36" fill="#57534e" >B1.3防疫機制完整解析與評鑑準備</text>

  <!-- 特色標籤 -->
  <rect x="60" y="400" width="110" height="44" rx="22" fill="#d97706"/>
  <text x="115" y="428" font-size="22" fill="white" text-anchor="middle" >B1.3</text>
  <rect x="186" y="400" width="140" height="44" rx="22" fill="#78716c"/>
  <text x="256" y="428" font-size="22" fill="white" text-anchor="middle" >感染管制</text>
  <rect x="342" y="400" width="140" height="44" rx="22" fill="#57534e"/>
  <text x="412" y="428" font-size="22" fill="white" text-anchor="middle" >防疫機制</text>

  <!-- 適用對象說明 -->
  <text x="60" y="500" font-size="28" fill="#78716c" >適用：精神護理之家感染管制負責人員</text>
  <text x="60" y="540" font-size="28" fill="#78716c" >涵蓋8項子要求的完整準備策略</text>

  <!-- 右側裝飾 -->
  <!-- 大數字 -->
  <text x="1000" y="200" font-size="210" font-weight="900" fill="#d97706" text-anchor="middle" >8</text>
  <text x="1000" y="255" font-size="26" fill="#78716c" text-anchor="middle" >防疫機制子要求</text>

  <!-- 直列pill -->
  <rect x="860" y="290" width="280" height="44" rx="22" fill="white"/>
  <text x="1000" y="318" font-size="20" fill="#d97706" text-anchor="middle" >體溫監測</text>

  <rect x="860" y="346" width="280" height="44" rx="22" fill="white"/>
  <text x="1000" y="374" font-size="20" fill="#78716c" text-anchor="middle" >感控計畫</text>

  <rect x="860" y="402" width="280" height="44" rx="22" fill="white"/>
  <text x="1000" y="430" font-size="20" fill="#57534e" text-anchor="middle" >手部衛生</text>

  <rect x="860" y="458" width="280" height="44" rx="22" fill="white"/>
  <text x="1000" y="486" font-size="20" fill="#a8a29e" text-anchor="middle" >物資儲備</text>

  <!-- 品牌浮水印 -->
  <text x="1140" y="590" font-size="24" fill="#c4bfb8" text-anchor="end" >報告汪 reportwang.com</text>
</svg>
