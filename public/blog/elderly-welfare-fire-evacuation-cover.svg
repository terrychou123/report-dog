<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>

  <!-- 右側裝飾色塊 -->
  <rect x="720" y="0" width="480" height="630" fill="#e8e6de" rx="0"/>

  <!-- 右側圖示裝飾：年度演練圖示 -->
  <circle cx="960" cy="220" r="120" fill="#fef3c7" stroke="#d97706" stroke-width="4"/>
  <text x="960" y="200" font-size="48" text-anchor="middle" >🔥</text>
  <text x="960" y="255" font-size="28" font-weight="bold" fill="#92400e" text-anchor="middle" >年度演練</text>
  <text x="960" y="290" font-size="22" fill="#78716c" text-anchor="middle" >複合型 ＋ 夜間各1次</text>

  <!-- 右側小資訊框 -->
  <rect x="820" y="350" width="280" height="60" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="960" y="369" font-size="18" font-weight="bold" fill="#dc2626" text-anchor="middle" >C9-C12 全部一級必要</text>
  <text x="960" y="392" font-size="16" fill="#78716c" text-anchor="middle" >消防設備 5 年紀錄不可中斷</text>

  <!-- 左側主標題第1行 -->
  <text x="80" y="190" font-size="100" font-weight="900" fill="#1e293b" >消防演練</text>
  <!-- 左側主標題第2行（琥珀色） -->
  <text x="80" y="310" font-size="100" font-weight="900" fill="#d97706" >疏散計畫全攻略</text>

  <!-- 副標題 -->
  <text x="80" y="375" font-size="38" fill="#57534e" >C9-C12 四項一級必要，年度演練不能敷衍</text>

  <!-- Pill 標籤 -->
  <rect x="80" y="420" width="150" height="44" rx="22" fill="#d97706"/>
  <text x="155" y="448" font-size="19" fill="white" text-anchor="middle" >C9-C12指標</text>
  <rect x="244" y="420" width="130" height="44" rx="22" fill="#b45309"/>
  <text x="309" y="448" font-size="19" fill="white" text-anchor="middle" >消防申報</text>
  <rect x="388" y="420" width="130" height="44" rx="22" fill="#92400e"/>
  <text x="453" y="448" font-size="19" fill="white" text-anchor="middle" >年度演練</text>
  <rect x="532" y="420" width="130" height="44" rx="22" fill="#78350f"/>
  <text x="597" y="448" font-size="19" fill="white" text-anchor="middle" >多人協作</text>

  <!-- 底部細節 -->
  <text x="80" y="555" font-size="26" fill="#78716c" >老人福利機構評鑑 115年度 ｜ 消防安全實務操作手冊</text>

  <!-- 浮水印 -->
  <text x="1140" y="590" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400" >報告汪 reportwang.com</text>
</svg>
