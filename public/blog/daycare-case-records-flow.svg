<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans TC', sans-serif">
  <!-- 主背景 -->
  <rect width="800" height="450" fill="#f0efe8"/>

  <!-- 頂部標題區域 -->
  <rect x="0" y="0" width="800" height="60" fill="#1e293b"/>
  <text x="400" y="32" font-size="19" font-weight="700" fill="#f0efe8" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">個案紀錄撰寫 SOP——從入案到結案保存</text>
  <text x="400" y="51" font-size="13" fill="#94a3b8" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">對照 115 年度日照評鑑基準條文</text>

  <!-- 流程節點定義：垂直排列，兩欄交替 -->
  <!-- 步驟 1：入案評估 -->
  <rect x="60" y="90" width="200" height="72" rx="12" fill="#1e293b"/>
  <text x="160" y="118" font-size="15" font-weight="700" fill="#f0efe8" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">① 入案評估</text>
  <text x="160" y="136" font-size="12" fill="#94a3b8" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">ADL / IADL / MMSE</text>
  <text x="160" y="152" font-size="11" fill="#d97706" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">第 5 條</text>

  <!-- 箭頭 1→2 -->
  <line x1="260" y1="126" x2="310" y2="126" stroke="#d97706" stroke-width="2.5"/>
  <polygon points="310,119 324,126 310,133" fill="#d97706"/>

  <!-- 步驟 2：照顧計畫 -->
  <rect x="324" y="90" width="200" height="72" rx="12" fill="#d97706"/>
  <text x="424" y="118" font-size="15" font-weight="700" fill="#fff" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">② 照顧計畫</text>
  <text x="424" y="136" font-size="12" fill="#fff" text-anchor="middle" opacity="0.85" font-family="'Noto Sans TC', sans-serif">評估後 7 工作天內完成</text>
  <text x="424" y="152" font-size="11" fill="#fff" text-anchor="middle" opacity="0.8" font-family="'Noto Sans TC', sans-serif">第 6 條</text>

  <!-- 箭頭 2→3 -->
  <line x1="524" y1="126" x2="574" y2="126" stroke="#64748b" stroke-width="2.5"/>
  <polygon points="574,119 588,126 574,133" fill="#64748b"/>

  <!-- 步驟 3：個案討論 -->
  <rect x="588" y="90" width="148" height="72" rx="12" fill="#78716c"/>
  <text x="662" y="118" font-size="15" font-weight="700" fill="#f0efe8" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">③ 個案討論</text>
  <text x="662" y="136" font-size="12" fill="#e8e6de" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">每季跨專業討論</text>
  <text x="662" y="152" font-size="11" fill="#dedad3" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">第 8 條</text>

  <!-- 垂直箭頭：第3列→第4列 -->
  <line x1="662" y1="162" x2="662" y2="210" stroke="#64748b" stroke-width="2.5"/>
  <polygon points="655,210 662,224 669,210" fill="#64748b"/>

  <!-- 步驟 4：追蹤評值 -->
  <rect x="588" y="224" width="148" height="72" rx="12" fill="#e8e6de"/>
  <rect x="588" y="224" width="4" height="72" rx="2" fill="#d97706"/>
  <text x="668" y="252" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">④ 追蹤評值</text>
  <text x="668" y="270" font-size="12" fill="#64748b" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">達成度分析</text>
  <text x="668" y="286" font-size="11" fill="#d97706" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">第 7 條</text>

  <!-- 水平箭頭：4←5（向左） -->
  <line x1="580" y1="260" x2="524" y2="260" stroke="#64748b" stroke-width="2.5"/>
  <polygon points="524,253 510,260 524,267" fill="#64748b"/>

  <!-- 步驟 5：計畫更新 -->
  <rect x="310" y="224" width="200" height="72" rx="12" fill="#e8e6de"/>
  <rect x="310" y="224" width="4" height="72" rx="2" fill="#64748b"/>
  <text x="410" y="252" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">⑤ 修正計畫</text>
  <text x="410" y="270" font-size="12" fill="#64748b" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">依評值結果更新策略</text>
  <text x="410" y="286" font-size="11" fill="#64748b" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">第 6、7 條</text>

  <!-- 水平箭頭：5←6（向左） -->
  <line x1="310" y1="260" x2="254" y2="260" stroke="#64748b" stroke-width="2.5"/>
  <polygon points="254,253 240,260 254,267" fill="#64748b"/>

  <!-- 步驟 6：結案保存 -->
  <rect x="60" y="224" width="180" height="72" rx="12" fill="#1e293b"/>
  <text x="150" y="252" font-size="15" font-weight="700" fill="#f0efe8" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">⑥ 結案保存</text>
  <text x="150" y="270" font-size="12" fill="#94a3b8" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">紀錄保存 7 年</text>
  <text x="150" y="286" font-size="11" fill="#d97706" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">第 10 條</text>

  <!-- 循環回箭頭：評值後若未達成→回到修正計畫（循環提示） -->
  <path d="M 410 296 Q 410 340 250 340 Q 120 340 120 316" stroke="#a8a29e" stroke-width="1.5" fill="none" stroke-dasharray="5,4"/>
  <polygon points="114,316 120,302 126,316" fill="#a8a29e"/>
  <text x="290" y="358" font-size="11" fill="#a8a29e" text-anchor="middle" font-family="'Noto Sans TC', sans-serif">未達成 → 再評估</text>

  <!-- 底部注意事項 -->
  <rect x="60" y="374" width="680" height="50" rx="10" fill="#e8e6de"/>
  <text x="80" y="396" font-size="13" fill="#64748b" font-family="'Noto Sans TC', sans-serif">📌 重要提醒：</text>
  <text x="80" y="414" font-size="12" fill="#78716c" font-family="'Noto Sans TC', sans-serif">每 6 個月須重新評估（第5條）；個案討論紀錄需含前次決議追蹤（第8條）；安全事件隨時記錄（第14條）</text>

  <!-- 浮水印 -->
  <text x="756" y="442" font-size="13" fill="#c4bfb8" text-anchor="end" font-family="'Noto Sans TC', sans-serif">報告汪 reportwang.com</text>
</svg>
