<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- Header y=50, h=76 -->
  <rect x="30" y="50" width="740" height="76" rx="8" fill="#78716c"/>
  <text x="400" y="84" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">第二個月（第 5-8 週）：文件補強任務</text>
  <text x="400" y="112" font-size="15" fill="#d6d3d1" text-anchor="middle">補足關鍵文件、建立監測統計、強化個案紀錄</text>

  <!-- Row1 y=160, h=62 -->
  <rect x="28" y="160" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="160" width="6" height="62" rx="2" fill="#d97706"/>
  <circle cx="66" cy="191" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="197" font-size="16" font-weight="900" fill="#d97706" text-anchor="middle">W5</text>
  <text x="100" y="188" font-size="18" font-weight="700" fill="#1e293b">第 5 週：補強 B2 個案服務計畫與 B10 防疫 SOP</text>
  <text x="100" y="208" font-size="16" fill="#57534e">入住 72 小時評估、每季更新計畫、感染管制手冊年度更新</text>
  <rect x="620" y="168" width="136" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="185" font-size="16" fill="#d97706" text-anchor="middle">負責單位</text>
  <text x="688" y="205" font-size="16" fill="#d97706" text-anchor="middle">社工 / 護理</text>

  <!-- Row2 y=235, h=62 -->
  <rect x="28" y="235" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="235" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="66" cy="266" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="272" font-size="16" font-weight="900" fill="#78716c" text-anchor="middle">W6</text>
  <text x="100" y="263" font-size="18" font-weight="700" fill="#1e293b">第 6 週：確認七大監測指標統計分析（B13-B19）</text>
  <text x="100" y="283" font-size="16" fill="#57534e">跌倒、壓傷、疼痛、約束、感染、非計畫住院、體重改變，每季分析報告</text>
  <rect x="620" y="243" width="136" height="46" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="260" font-size="16" fill="#78716c" text-anchor="middle">負責單位</text>
  <text x="688" y="280" font-size="16" fill="#78716c" text-anchor="middle">護理主管</text>

  <!-- Row3 y=310, h=62 -->
  <rect x="28" y="310" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="310" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="66" cy="341" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="347" font-size="16" font-weight="900" fill="#57534e" text-anchor="middle">W7</text>
  <text x="100" y="338" font-size="18" font-weight="700" fill="#1e293b">第 7 週：整理 D 區個案權益文件</text>
  <text x="100" y="358" font-size="16" fill="#57534e">D1 服務契約、D2 權益說明、D4 申訴機制、D6 隱私保護、D8 尊嚴照護</text>
  <rect x="620" y="318" width="136" height="46" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="335" font-size="16" fill="#57534e" text-anchor="middle">負責單位</text>
  <text x="688" y="355" font-size="16" fill="#57534e" text-anchor="middle">社工</text>

  <!-- Row4 y=385, h=62 -->
  <rect x="28" y="385" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="385" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="416" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="422" font-size="16" font-weight="900" fill="#a8a29e" text-anchor="middle">W8</text>
  <text x="100" y="413" font-size="18" font-weight="700" fill="#1e293b">第 8 週：補足 B25-B27 日常照護記錄與訓練時數</text>
  <text x="100" y="433" font-size="16" fill="#57534e">下床活動、翻身拍背紀錄完整、A13-14 職前與在職訓練時數各達標</text>
  <rect x="620" y="393" width="136" height="46" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="410" font-size="16" fill="#a8a29e" text-anchor="middle">負責單位</text>
  <text x="688" y="430" font-size="16" fill="#a8a29e" text-anchor="middle">照服 / 行政</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
