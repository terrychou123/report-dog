<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- Header y=50, h=76 -->
  <rect x="30" y="50" width="740" height="76" rx="8" fill="#78716c"/>
  <text x="400" y="84" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="sans-serif">第二個月（第 5-8 週）：文件補強任務</text>
  <text x="400" y="112" font-size="15" fill="#d6d3d1" text-anchor="middle" font-family="sans-serif">補足關鍵文件、建立監測統計、強化個案紀錄</text>

  <!-- Row1 y=160, h=62 -->
  <rect x="30" y="160" width="740" height="62" rx="6" fill="#ffffff"/>
  <rect x="30" y="160" width="6" height="62" rx="3" fill="#d97706"/>
  <circle cx="66" cy="191" r="16" fill="#d97706"/>
  <text x="66" y="196" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="sans-serif">W5</text>
  <text x="100" y="180" font-size="19" font-weight="700" fill="#1e293b" font-family="sans-serif">第 5 週：補強 B2 個案服務計畫與 B10 防疫 SOP</text>
  <text x="100" y="200" font-size="15" fill="#57534e" font-family="sans-serif">入住 72 小時評估、每季更新計畫、感染管制手冊年度更新</text>
  <rect x="620" y="169" width="136" height="44" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="688" y="188" font-size="13" fill="#d97706" text-anchor="middle" font-family="sans-serif">負責單位</text>
  <text x="688" y="206" font-size="13" fill="#92400e" text-anchor="middle" font-family="sans-serif">社工 / 護理</text>

  <!-- Row2 y=235, h=62 -->
  <rect x="30" y="235" width="740" height="62" rx="6" fill="#ffffff"/>
  <rect x="30" y="235" width="6" height="62" rx="3" fill="#78716c"/>
  <circle cx="66" cy="266" r="16" fill="#78716c"/>
  <text x="66" y="271" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="sans-serif">W6</text>
  <text x="100" y="255" font-size="19" font-weight="700" fill="#1e293b" font-family="sans-serif">第 6 週：確認七大監測指標統計分析（B13-B19）</text>
  <text x="100" y="275" font-size="15" fill="#57534e" font-family="sans-serif">跌倒、壓傷、疼痛、約束、感染、非計畫住院、體重改變，每季分析報告</text>
  <rect x="620" y="244" width="136" height="44" rx="6" fill="#f5f5f4" stroke="#78716c" stroke-width="1.5"/>
  <text x="688" y="263" font-size="13" fill="#78716c" text-anchor="middle" font-family="sans-serif">負責單位</text>
  <text x="688" y="281" font-size="13" fill="#44403c" text-anchor="middle" font-family="sans-serif">護理主管</text>

  <!-- Row3 y=310, h=62 -->
  <rect x="30" y="310" width="740" height="62" rx="6" fill="#ffffff"/>
  <rect x="30" y="310" width="6" height="62" rx="3" fill="#57534e"/>
  <circle cx="66" cy="341" r="16" fill="#57534e"/>
  <text x="66" y="346" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="sans-serif">W7</text>
  <text x="100" y="330" font-size="19" font-weight="700" fill="#1e293b" font-family="sans-serif">第 7 週：整理 D 區個案權益文件</text>
  <text x="100" y="350" font-size="15" fill="#57534e" font-family="sans-serif">D1 服務契約、D2 權益說明、D4 申訴機制、D6 隱私保護、D8 尊嚴照護</text>
  <rect x="620" y="319" width="136" height="44" rx="6" fill="#f0efe8" stroke="#57534e" stroke-width="1.5"/>
  <text x="688" y="338" font-size="13" fill="#57534e" text-anchor="middle" font-family="sans-serif">負責單位</text>
  <text x="688" y="356" font-size="13" fill="#44403c" text-anchor="middle" font-family="sans-serif">社工</text>

  <!-- Row4 y=385, h=62 -->
  <rect x="30" y="385" width="740" height="62" rx="6" fill="#ffffff"/>
  <rect x="30" y="385" width="6" height="62" rx="3" fill="#a8a29e"/>
  <circle cx="66" cy="416" r="16" fill="#a8a29e"/>
  <text x="66" y="421" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="sans-serif">W8</text>
  <text x="100" y="405" font-size="19" font-weight="700" fill="#1e293b" font-family="sans-serif">第 8 週：補足 B25-B27 日常照護記錄與訓練時數</text>
  <text x="100" y="425" font-size="15" fill="#57534e" font-family="sans-serif">下床活動、翻身拍背紀錄完整、A13-14 職前與在職訓練時數各達標</text>
  <rect x="620" y="394" width="136" height="44" rx="6" fill="#f5f5f4" stroke="#a8a29e" stroke-width="1.5"/>
  <text x="688" y="413" font-size="13" fill="#78716c" text-anchor="middle" font-family="sans-serif">負責單位</text>
  <text x="688" y="431" font-size="13" fill="#44403c" text-anchor="middle" font-family="sans-serif">照服 / 行政</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" font-family="sans-serif">報告汪 reportwang.com</text>
</svg>
