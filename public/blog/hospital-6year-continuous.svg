<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- 背景 -->
  <rect width="800" height="500" fill="#fafaf9"/>

  <!-- 標題區 -->
  <rect x="0" y="0" width="800" height="110" fill="#f5f5f4"/>
  <text x="400" y="52" text-anchor="middle" font-size="26" font-weight="900" fill="#1c1917">持續性品質監測四大核心機制</text>
  <text x="400" y="84" text-anchor="middle" font-size="15" fill="#78716c">取代週期性集中備審——建立全年運作的品管系統</text>

  <!-- 列1：月度品質指標報告 y=132 -->
  <rect x="38" y="122" width="724" height="82" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <rect x="38" y="122" width="10" height="82" rx="5" fill="#d97706"/>
  <text x="68" y="153" font-size="17" font-weight="700" fill="#d97706">月度品質指標報告</text>
  <text x="68" y="175" font-size="14" fill="#1c1917">每月追蹤核心品質指標，有達標／未達標分析，改善措施自動啟動</text>
  <text x="68" y="194" font-size="14" fill="#78716c">固定月例會報告，形成可追溯的品管軌跡</text>
  <rect x="634" y="140" width="92" height="30" rx="15" fill="#fef3c7"/>
  <text x="680" y="160" text-anchor="middle" font-size="14" fill="#d97706" font-weight="700">月度追蹤</text>

  <!-- 列2：季度自我查核 y=220 -->
  <rect x="38" y="215" width="724" height="82" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <rect x="38" y="215" width="10" height="82" rx="5" fill="#78716c"/>
  <text x="68" y="246" font-size="17" font-weight="700" fill="#78716c">季度自我查核</text>
  <text x="68" y="268" font-size="14" fill="#1c1917">每季對照評鑑基準進行自我評估，提前發現缺口</text>
  <text x="68" y="287" font-size="14" fill="#78716c">比等評鑑再發現更有時間改善，主動掌握符合狀態</text>
  <rect x="634" y="233" width="92" height="30" rx="15" fill="#f5f5f4"/>
  <text x="680" y="253" text-anchor="middle" font-size="14" fill="#78716c" font-weight="700">季度查核</text>

  <!-- 列3：年度全面評估 y=308 -->
  <rect x="38" y="308" width="724" height="82" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <rect x="38" y="308" width="10" height="82" rx="5" fill="#57534e"/>
  <text x="68" y="339" font-size="17" font-weight="700" fill="#57534e">年度全面評估</text>
  <text x="68" y="361" font-size="14" fill="#1c1917">年度整體品質回顧，跨年度趨勢分析，確認品管目標達成情況</text>
  <text x="68" y="380" font-size="14" fill="#78716c">6年累積的年度報告即為評鑑最佳佐證文書</text>
  <rect x="634" y="326" width="92" height="30" rx="15" fill="#f5f5f4"/>
  <text x="680" y="346" text-anchor="middle" font-size="14" fill="#57534e" font-weight="700">年度評估</text>

  <!-- 列4：即時異常應對 y=401 -->
  <rect x="38" y="394" width="724" height="82" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <rect x="38" y="394" width="10" height="82" rx="5" fill="#a8a29e"/>
  <text x="68" y="425" font-size="17" font-weight="700" fill="#a8a29e">即時異常應對</text>
  <text x="68" y="447" font-size="14" fill="#1c1917">品質指標異常立即啟動改善，不等到評鑑才處理</text>
  <text x="68" y="466" font-size="14" fill="#78716c">異常通報-原因分析-改善追蹤，全程記錄可查核</text>
  <rect x="634" y="412" width="92" height="30" rx="15" fill="#f5f5f4"/>
  <text x="680" y="432" text-anchor="middle" font-size="14" fill="#a8a29e" font-weight="700">即時應對</text>

  <!-- 浮水印 -->
  <text x="400" y="480" text-anchor="middle" font-size="14" fill="#a8a29e" opacity="0.6">報告汪 reportwang.com</text>
</svg>
