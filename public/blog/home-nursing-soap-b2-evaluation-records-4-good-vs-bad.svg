<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- Header -->
  <rect x="0" y="50" width="800" height="76" fill="white"/>
  <rect x="0" y="50" width="6" height="76" rx="2" fill="#d97706"/>
  <text x="28" y="104" font-size="36" fill="#1e293b" font-weight="700">居家護理 SOAP 合格 vs 不合格對照</text>

  <!-- Row 1 (y=160) amber — 不合格範例 -->
  <rect x="28" y="160" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="160" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="66" cy="191" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="197" font-size="14" fill="#d97706" text-anchor="middle" font-weight="900"></text>
  <text x="100" y="185" font-size="22" fill="#1e293b" font-weight="700">不合格：O 段缺量表數值</text>
  <text x="100" y="208" font-size="16" fill="#57534e">「個案今日傷口情況尚可，換藥完畢。」- 無 Braden 分數、傷口尺寸</text>
  <rect x="620" y="168" width="136" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="187" font-size="16" fill="#d97706" text-anchor="middle">O 段</text>
  <text x="688" y="207" font-size="16" fill="#d97706" text-anchor="middle">缺數值</text>

  <!-- Row 2 (y=235) stone-500 — 合格範例 -->
  <rect x="28" y="235" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="235" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="66" cy="266" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="272" font-size="14" fill="#78716c" text-anchor="middle" font-weight="900">[v]</text>
  <text x="100" y="260" font-size="22" fill="#1e293b" font-weight="700">合格：O 段含量表與尺寸</text>
  <text x="100" y="283" font-size="16" fill="#57534e">「Braden 16 分；左足潰瘍 1.5×1.2cm（上週 2.0×1.5cm）。」</text>
  <rect x="620" y="243" width="136" height="46" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="262" font-size="16" fill="#78716c" text-anchor="middle">O 段</text>
  <text x="688" y="282" font-size="16" fill="#78716c" text-anchor="middle">具體數值</text>

  <!-- Row 3 (y=310) stone-600 — 不合格範例 -->
  <rect x="28" y="310" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="310" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="341" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="347" font-size="14" fill="#57534e" text-anchor="middle" font-weight="900"></text>
  <text x="100" y="335" font-size="22" fill="#1e293b" font-weight="700">不合格：P 段只寫「繼續追蹤」</text>
  <text x="100" y="358" font-size="16" fill="#57534e">「下次訪視繼續追蹤。」- 無目標值、評值時點、具體措施</text>
  <rect x="620" y="318" width="136" height="46" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="337" font-size="16" fill="#57534e" text-anchor="middle">P 段</text>
  <text x="688" y="357" font-size="16" fill="#57534e" text-anchor="middle">過於籠統</text>

  <!-- Row 4 (y=385) stone-400 — 合格範例 -->
  <rect x="28" y="385" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="385" width="6" height="62" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="416" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="422" font-size="14" fill="#a8a29e" text-anchor="middle" font-weight="900">[v]</text>
  <text x="100" y="410" font-size="22" fill="#1e293b" font-weight="700">合格：P 段含目標與評值</text>
  <text x="100" y="433" font-size="16" fill="#57534e">「兩週後評估傷口是否縮小 50%；無改善則通知主治醫師會診。」</text>
  <rect x="620" y="393" width="136" height="46" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="412" font-size="16" fill="#a8a29e" text-anchor="middle">P 段</text>
  <text x="688" y="432" font-size="16" fill="#a8a29e" text-anchor="middle">具體評值</text>

  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
