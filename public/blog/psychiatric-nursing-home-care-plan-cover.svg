  <!-- 分隔線 -->
  <line x1="60" y1="460" x2="620" y2="460" stroke="#dedad3" stroke-width="2"/>

  <!-- 右側裝飾區內容 -->
  <!-- 大數字 -->
  <text x="950" y="260" font-size="200" fill="#d97706" text-anchor="middle"  font-weight="700" opacity="0.15">72</text>
  <text x="950" y="260" font-size="180" fill="#d97706" text-anchor="middle"  font-weight="700">72</text>
  <text x="950" y="310" font-size="28" fill="#78716c" text-anchor="middle" >小時內完成評估</text>

  <!-- 右側 pill 標籤 -->
  <rect x="780" y="370" width="170" height="40" rx="20" fill="#d97706"/>
