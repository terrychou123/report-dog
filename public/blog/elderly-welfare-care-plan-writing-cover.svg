<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 左側裝飾色塊 -->
  <rect x="0" y="0" width="8" height="630" fill="#d97706"/>
  <!-- 右側裝飾條 -->
  <rect x="1192" y="0" width="8" height="630" fill="#d97706" opacity="0.3"/>
  <!-- 頂部裝飾線 -->
  <rect x="60" y="60" width="120" height="6" fill="#d97706" rx="3"/>
  <!-- 標籤 -->
  <rect x="60" y="80" width="220" height="36" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="80" y="103" font-size="18" fill="#d97706" font-weight="700" font-family="sans-serif">老人福利機構 · B2 指標</text>

  <!-- 主標題第1行 黑色 -->
  <text x="60" y="220" font-size="100" fill="#1e293b" font-weight="900" font-family="sans-serif">個案服務計畫</text>
  <!-- 主標題第2行 琥珀色 -->
  <text x="60" y="340" font-size="100" fill="#d97706" font-weight="900" font-family="sans-serif">B2 撰寫指南</text>
  <!-- 副標題 -->
  <text x="60" y="405" font-size="38" fill="#57534e" font-family="sans-serif">5 步驟完整示範，評鑑委員看的就是這份</text>

  <!-- Pill 標籤 -->
  <rect x="60" y="450" width="140" height="44" rx="22" fill="#d97706" opacity="0.15"/>
  <text x="130" y="477" font-size="18" fill="#d97706" font-weight="700" text-anchor="middle" font-family="sans-serif">5步驟流程</text>

  <rect x="216" y="450" width="140" height="44" rx="22" fill="#78716c" opacity="0.15"/>
  <text x="286" y="477" font-size="18" fill="#78716c" font-weight="700" text-anchor="middle" font-family="sans-serif">多專業分工</text>

  <rect x="372" y="450" width="140" height="44" rx="22" fill="#57534e" opacity="0.15"/>
  <text x="442" y="477" font-size="18" fill="#57534e" font-weight="700" text-anchor="middle" font-family="sans-serif">常見錯誤</text>

  <rect x="528" y="450" width="140" height="44" rx="22" fill="#d97706" opacity="0.15"/>
  <text x="598" y="477" font-size="18" fill="#d97706" font-weight="700" text-anchor="middle" font-family="sans-serif">AI輔助撰寫</text>

  <!-- 右側圖形裝飾 -->
  <circle cx="1000" cy="280" r="180" fill="#d97706" opacity="0.06"/>
  <circle cx="1000" cy="280" r="130" fill="#d97706" opacity="0.08"/>
  <circle cx="1000" cy="280" r="80" fill="#d97706" opacity="0.12"/>
  <!-- 數字裝飾 -->
  <text x="1000" y="305" font-size="100" fill="#d97706" font-weight="900" text-anchor="middle" font-family="sans-serif" opacity="0.4">5</text>
  <text x="1000" y="340" font-size="28" fill="#d97706" font-weight="700" text-anchor="middle" font-family="sans-serif" opacity="0.5">步驟</text>

  <!-- 底部分隔線 -->
  <rect x="60" y="540" width="1080" height="2" fill="#d97706" opacity="0.2"/>

  <!-- 浮水印 -->
  <text x="1140" y="590" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400" font-family="sans-serif">報告汪 reportwang.com</text>
</svg>
