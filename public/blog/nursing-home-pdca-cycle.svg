<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- 標題區 -->
  <text x="400" y="48"  font-size="32" font-weight="700" fill="#1e293b" text-anchor="middle">PDCA 缺失改善循環圖</text>
  <text x="400" y="78"  font-size="22" fill="#78716c" text-anchor="middle">讓每一筆缺失都有完整改善軌跡</text>
  <line x1="40" y1="94" x2="760" y2="94" stroke="#a8a29e" stroke-width="1.5"/>
  <!-- 中心圓 -->
  <circle cx="400" cy="295" r="60" fill="#ffffff" stroke="#d97706" stroke-width="3"/>
  <text x="400" y="288"  font-size="16" font-weight="700" fill="#d97706" text-anchor="middle">缺失</text>
  <text x="400" y="310"  font-size="16" font-weight="700" fill="#d97706" text-anchor="middle">改善</text>
  <!-- P 區塊 -->
  <rect x="240" y="115" width="180" height="90" rx="12" fill="#d97706"/>
  <text x="330" y="156"  font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">P</text>
  <text x="330" y="184"  font-size="16" fill="#ffffff" text-anchor="middle">Plan 計畫</text>
  <!-- D 區塊 -->
  <rect x="540" y="230" width="180" height="90" rx="12" fill="#78716c"/>
  <text x="630" y="271"  font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">D</text>
  <text x="630" y="299"  font-size="16" fill="#ffffff" text-anchor="middle">Do 執行</text>
  <!-- C 區塊 -->
  <rect x="240" y="360" width="180" height="90" rx="12" fill="#57534e"/>
  <text x="330" y="401"  font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>
  <text x="330" y="429"  font-size="16" fill="#ffffff" text-anchor="middle">Check 查核</text>
  <!-- A 區塊 -->
  <rect x="80" y="230" width="180" height="90" rx="12" fill="#94a3b8"/>
  <text x="170" y="271"  font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
  <text x="170" y="299"  font-size="16" fill="#ffffff" text-anchor="middle">Act 行動</text>
  <!-- 箭頭連線 -->
  <path d="M420,205 Q490,230 540,255" stroke="#d97706" stroke-width="2.5" fill="none" marker-end="url(#arrow1)"/>
  <path d="M630,320 Q610,365 520,400" stroke="#78716c" stroke-width="2.5" fill="none" marker-end="url(#arrow2)"/>
  <path d="M280,405 Q230,385 200,345" stroke="#57534e" stroke-width="2.5" fill="none" marker-end="url(#arrow3)"/>
  <path d="M170,230 Q210,175 300,160" stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#arrow4)"/>
  <!-- 箭頭定義 -->
  <defs>
    <marker id="arrow1" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97706"/>
    </marker>
    <marker id="arrow2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#78716c"/>
    </marker>
    <marker id="arrow3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#57534e"/>
    </marker>
    <marker id="arrow4" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
  </defs>
  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" >報告汪 reportwang.com</text>
</svg>
