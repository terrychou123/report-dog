<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!--
    【ref-list-4.svg — 4 列直列清單參考範本（兩層間距版）】
    兩層間距公式：outer_gap（外圍）> inner_gap（列間）
      inner_gap = 13（row 與 row 之間，緊湊）
      outer_gap = floor((500-5×62-3×13)/3) = floor(151/3) = 50
    結構：outer | Header | outer | Row1 | inner | Row2 | inner | Row3 | inner | Row4 | outer
    驗算：3×50 + 5×62 + 3×13 = 150+310+39 = 499（1px 歸底部）

    Header y=50, h=62
    Header text_y = 50+(62+36×0.85)/2 = 96
    Row[0] y = 50+62+50 = 162
    Row[1] y = 162+62+13 = 237
    Row[2] y = 237+62+13 = 312
    Row[3] y = 312+62+13 = 387
    Row[3] bottom = 449, 底部留白=51 ✓

    Row 內垂直置中（H=62, Q_font=22）：
      cy = row_y+31, NUM y = row_y+37 (r=16)
      Q offset+28, R offset+48
      S_rect_y = row_y+8, h=46, S1=row_y+25, S2=row_y+45
    浮水印 y=488
  -->

  <!-- Header（y=50, h=62） -->
  <rect x="0" y="50" width="800" height="62" fill="#e8e6de"/>
  <rect x="0" y="50" width="6" height="62" fill="#d97706"/>
  <!-- M2_font=36（9字） -->
  <text x="28" y="96" font-size="36" fill="#1e293b" font-weight="700">4 大評鑑準備重點</text>

  <!-- Row 1（y=162, H=62, cy=193, #d97706 琥珀） -->
  <rect x="28" y="162" width="744" height="62" rx="12" fill="#e8e6de"/>
  <rect x="28" y="162" width="6" height="62" rx="2" fill="#d97706"/>
  <circle cx="66" cy="193" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="199" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <!-- Q 22px offset+28 → 190; R 16px offset+48 → 210 -->
  <text x="100" y="190" font-size="22" fill="#1e293b" font-weight="700">督導機制不完整</text>
  <text x="100" y="210" font-size="16" fill="#57534e">個別督導頻率不足，員工問題無法及時被發現與支持</text>
  <!-- S rect y=170, h=46 -->
  <rect x="620" y="170" width="136" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="187" font-size="16" fill="#d97706" text-anchor="middle">第 9 條</text>
  <text x="688" y="207" font-size="16" fill="#d97706" text-anchor="middle">每半年個督一次</text>

  <!-- Row 2（y=237, H=62, cy=268, #78716c 暖灰） -->
  <rect x="28" y="237" width="744" height="62" rx="12" fill="#e8e6de"/>
  <rect x="28" y="237" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="66" cy="268" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="274" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <!-- Q offset+28 → 265; R offset+48 → 285 -->
  <text x="100" y="265" font-size="22" fill="#1e293b" font-weight="700">教育訓練流於形式</text>
  <text x="100" y="285" font-size="16" fill="#57534e">訓練只是簽到，缺乏實質學習，員工成長動力低落</text>
  <!-- S rect y=245, h=46 -->
  <rect x="620" y="245" width="136" height="46" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="262" font-size="16" fill="#78716c" text-anchor="middle">第 29 條</text>
  <text x="688" y="282" font-size="16" fill="#78716c" text-anchor="middle">在職 20 小時</text>

  <!-- Row 3（y=312, H=62, cy=343, #57534e 深棕） -->
  <rect x="28" y="312" width="744" height="62" rx="12" fill="#e8e6de"/>
  <rect x="28" y="312" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="66" cy="343" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="349" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <!-- Q offset+28 → 340; R offset+48 → 360 -->
  <text x="100" y="340" font-size="22" fill="#1e293b" font-weight="700">留任率未追蹤管理</text>
  <text x="100" y="360" font-size="16" fill="#57534e">不知如何計算離職率，缺乏系統性的離職原因分析</text>
  <!-- S rect y=320, h=46 -->
  <rect x="620" y="320" width="136" height="46" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="337" font-size="16" fill="#57534e" text-anchor="middle">第 30 條</text>
  <text x="688" y="357" font-size="16" fill="#57534e" text-anchor="middle">前四年度留任率</text>

  <!-- Row 4（y=387, H=62, cy=418, #a8a29e 淺灰） -->
  <rect x="28" y="387" width="744" height="62" rx="12" fill="#e8e6de"/>
  <rect x="28" y="387" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="418" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="424" font-size="16" fill="#a8a29e" text-anchor="middle" font-weight="900">4</text>
  <!-- Q offset+28 → 415; R offset+48 → 435 -->
  <text x="100" y="415" font-size="22" fill="#1e293b" font-weight="700">主任缺乏持續進修</text>
  <text x="100" y="435" font-size="16" fill="#57534e">管理者忙於日常業務，未安排進修，缺乏新管理知能</text>
  <!-- S rect y=395, h=46 -->
  <rect x="620" y="395" width="136" height="46" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="412" font-size="16" fill="#a8a29e" text-anchor="middle">第 31 條</text>
  <text x="688" y="432" font-size="16" fill="#a8a29e" text-anchor="middle">負責人每年 4 小時</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
