<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <rect x="0" y="38" width="800" height="90" fill="#e8e6de"/>
  <rect x="0" y="38" width="6" height="90" rx="2" fill="#d97706"/>
  <text x="28" y="98" font-size="36" fill="#1e293b" font-weight="700">子項一至二：藥品儲存分區與標示</text>
  <rect x="28" y="166" width="744" height="90" rx="12" fill="#e8e6de"/>
  <rect x="28" y="166" width="6" height="90" rx="2" fill="#d97706"/>
  <circle cx="66" cy="211" r="20" fill="#d97706" opacity="0.15"/>
  <text x="66" y="217" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">儲存</text>
  <text x="100" y="210" font-size="28" fill="#1e293b" font-weight="700">管制藥品必須獨立上鎖保管</text>
  <text x="100" y="234" font-size="18" fill="#57534e">第一至四級管制藥品置於專用保險箱或雙鎖藥櫃，與一般藥品完全分開</text>
  <rect x="620" y="185" width="136" height="52" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="205" font-size="16" fill="#d97706" text-anchor="middle">上鎖</text>
  <text x="688" y="225" font-size="16" fill="#d97706" text-anchor="middle">分開</text>
  <rect x="28" y="269" width="744" height="90" rx="12" fill="#e8e6de"/>
  <rect x="28" y="269" width="6" height="90" rx="2" fill="#78716c"/>
  <circle cx="66" cy="314" r="20" fill="#78716c" opacity="0.15"/>
  <text x="66" y="320" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">效期</text>
  <text x="100" y="313" font-size="28" fill="#1e293b" font-weight="700">所有藥品均在有效期限內</text>
  <text x="100" y="337" font-size="18" fill="#57534e">委員可能抽查藥品效期，過期藥品須依規定銷燬並有記錄</text>
  <rect x="620" y="288" width="136" height="52" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="308" font-size="16" fill="#78716c" text-anchor="middle">定期</text>
  <text x="688" y="328" font-size="16" fill="#78716c" text-anchor="middle">清查</text>
  <rect x="28" y="372" width="744" height="90" rx="12" fill="#e8e6de"/>
  <rect x="28" y="372" width="6" height="90" rx="2" fill="#57534e"/>
  <circle cx="66" cy="417" r="20" fill="#57534e" opacity="0.15"/>
  <text x="66" y="423" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">標示</text>
  <text x="100" y="416" font-size="28" fill="#1e293b" font-weight="700">藥包標示：姓名、時間、劑量</text>
  <text x="100" y="440" font-size="18" fill="#57534e">住民完整姓名（非代號）、服藥時間（早/午/晚/睡前）及劑量</text>
  <rect x="620" y="391" width="136" height="52" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="411" font-size="16" fill="#57534e" text-anchor="middle">完整</text>
  <text x="688" y="431" font-size="16" fill="#57534e" text-anchor="middle">標示</text>
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
