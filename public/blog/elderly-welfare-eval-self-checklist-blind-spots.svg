<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- Header y=29, h=60（警示橘色） -->
  <rect x="40" y="29" width="720" height="60" rx="10" fill="#d97706"/>
  <text x="400" y="57" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">5 大常見評鑑盲點警示</text>
  <text x="400" y="79" font-size="15" fill="#fef3c7" text-anchor="middle">這些項目是機構最常在評鑑前夕才發現的問題</text>

  <!-- N=5 版型：H=60, inner_gap=13, outer_gap=29 -->
  <!-- Row1 y=118 -->
  <rect x="28" y="118" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="118" width="6" height="60" rx="2" fill="#d97706"/>
  <circle cx="66" cy="148" r="16" fill="#dc2626"/>
  <text x="66" y="154" font-size="16" font-weight="900" fill="#dc2626" text-anchor="middle">1</text>
  <text x="100" y="145" font-size="20" font-weight="700" fill="#dc2626">緊急呼叫系統從未實地測試（C4）</text>
  <text x="100" y="166" font-size="16" fill="#57534e">安裝後長期未測試，按鈴無人回應是最常見扣分原因</text>
  <rect x="620" y="126" width="136" height="44" rx="8" fill="#dc2626" opacity="0.12"/>
  <text x="688" y="154" font-size="16" fill="#dc2626" text-anchor="middle">每季測試</text>

  <!-- Row2 y=191 -->
  <rect x="28" y="191" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="191" width="6" height="60" rx="2" fill="#78716c"/>
  <circle cx="66" cy="221" r="16" fill="#dc2626"/>
  <text x="66" y="227" font-size="16" font-weight="900" fill="#dc2626" text-anchor="middle">2</text>
  <text x="100" y="218" font-size="20" font-weight="700" fill="#dc2626">在職訓練時數不足（A14）</text>
  <text x="100" y="239" font-size="16" fill="#57534e">每人每年20小時硬性規定，急救完訓需在有效期內</text>
  <rect x="620" y="199" width="136" height="44" rx="8" fill="#dc2626" opacity="0.12"/>
  <text x="688" y="227" font-size="16" fill="#dc2626" text-anchor="middle">提前3個月</text>

  <!-- Row3 y=264 -->
  <rect x="28" y="264" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="264" width="6" height="60" rx="2" fill="#57534e"/>
  <circle cx="66" cy="294" r="16" fill="#dc2626"/>
  <text x="66" y="300" font-size="16" font-weight="900" fill="#dc2626" text-anchor="middle">3</text>
  <text x="100" y="291" font-size="20" font-weight="700" fill="#dc2626">PDCA報告有填寫但無分析（B13-19）</text>
  <text x="100" y="312" font-size="16" fill="#57534e">僅有數字統計表，無趨勢圖表、原因分析、改善措施</text>
  <rect x="620" y="272" width="136" height="44" rx="8" fill="#dc2626" opacity="0.12"/>
  <text x="688" y="300" font-size="16" fill="#dc2626" text-anchor="middle">補圖表分析</text>

  <!-- Row4 y=337 -->
  <rect x="28" y="337" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="337" width="6" height="60" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="367" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="373" font-size="16" font-weight="900" fill="#d97706" text-anchor="middle">4</text>
  <text x="100" y="364" font-size="20" font-weight="700" fill="#1e293b">防疫SOP超過1年未更新（B10）</text>
  <text x="100" y="385" font-size="16" fill="#57534e">疫後版本未再審閱，感染管制手冊需每年檢視更新</text>
  <rect x="620" y="345" width="136" height="44" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="373" font-size="16" fill="#d97706" text-anchor="middle">黃燈風險</text>

  <!-- Row5 y=410 -->
  <rect x="28" y="410" width="744" height="60" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="410" width="6" height="60" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="440" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="446" font-size="16" font-weight="900" fill="#d97706" text-anchor="middle">5</text>
  <text x="100" y="437" font-size="20" font-weight="700" fill="#1e293b">前次評鑑建議事項未全數改善（E1）</text>
  <text x="100" y="458" font-size="16" fill="#57534e">建立追蹤表，每條建議標示燈號，每季更新改善狀態</text>
  <rect x="620" y="418" width="136" height="44" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="446" font-size="16" fill="#d97706" text-anchor="middle">建立追蹤表</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
