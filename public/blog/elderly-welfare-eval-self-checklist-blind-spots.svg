<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- Header y=29, h=60（警示橘色） -->
  <rect x="40" y="29" width="720" height="60" rx="10" fill="#d97706"/>
  <text x="400" y="57" font-size="22" font-weight="700" fill="#ffffff" font-family="sans-serif" text-anchor="middle">5 大常見評鑑盲點警示</text>
  <text x="400" y="79" font-size="15" fill="#fef3c7" font-family="sans-serif" text-anchor="middle">這些項目是機構最常在評鑑前夕才發現的問題</text>

  <!-- N=5 版型：H=60, inner_gap=13, outer_gap=29 -->
  <!-- Row1 y=118 -->
  <rect x="40" y="118" width="720" height="60" rx="8" fill="#ffffff"/>
  <rect x="40" y="118" width="6" height="60" rx="3" fill="#dc2626"/>
  <circle cx="66" cy="148" r="16" fill="#dc2626"/>
  <text x="66" y="154" font-size="16" font-weight="700" fill="#ffffff" font-family="sans-serif" text-anchor="middle">1</text>
  <text x="100" y="140" font-size="18" font-weight="700" fill="#dc2626" font-family="sans-serif">緊急呼叫系統從未實地測試（C4）</text>
  <text x="100" y="161" font-size="14" fill="#57534e" font-family="sans-serif">安裝後長期未測試，按鈴無人回應是最常見扣分原因</text>
  <rect x="620" y="129" width="128" height="38" rx="6" fill="#fee2e2"/>
  <text x="684" y="153" font-size="14" font-weight="700" fill="#dc2626" font-family="sans-serif" text-anchor="middle">每季測試</text>

  <!-- Row2 y=191 -->
  <rect x="40" y="191" width="720" height="60" rx="8" fill="#ffffff"/>
  <rect x="40" y="191" width="6" height="60" rx="3" fill="#dc2626"/>
  <circle cx="66" cy="221" r="16" fill="#dc2626"/>
  <text x="66" y="227" font-size="16" font-weight="700" fill="#ffffff" font-family="sans-serif" text-anchor="middle">2</text>
  <text x="100" y="213" font-size="18" font-weight="700" fill="#dc2626" font-family="sans-serif">在職訓練時數不足（A14）</text>
  <text x="100" y="234" font-size="14" fill="#57534e" font-family="sans-serif">每人每年20小時硬性規定，急救完訓需在有效期內</text>
  <rect x="620" y="202" width="128" height="38" rx="6" fill="#fee2e2"/>
  <text x="684" y="226" font-size="14" font-weight="700" fill="#dc2626" font-family="sans-serif" text-anchor="middle">提前3個月</text>

  <!-- Row3 y=264 -->
  <rect x="40" y="264" width="720" height="60" rx="8" fill="#ffffff"/>
  <rect x="40" y="264" width="6" height="60" rx="3" fill="#dc2626"/>
  <circle cx="66" cy="294" r="16" fill="#dc2626"/>
  <text x="66" y="300" font-size="16" font-weight="700" fill="#ffffff" font-family="sans-serif" text-anchor="middle">3</text>
  <text x="100" y="286" font-size="18" font-weight="700" fill="#dc2626" font-family="sans-serif">PDCA報告有填寫但無分析（B13-19）</text>
  <text x="100" y="307" font-size="14" fill="#57534e" font-family="sans-serif">僅有數字統計表，無趨勢圖表、原因分析、改善措施</text>
  <rect x="620" y="275" width="128" height="38" rx="6" fill="#fee2e2"/>
  <text x="684" y="299" font-size="14" font-weight="700" fill="#dc2626" font-family="sans-serif" text-anchor="middle">補圖表分析</text>

  <!-- Row4 y=337 -->
  <rect x="40" y="337" width="720" height="60" rx="8" fill="#ffffff"/>
  <rect x="40" y="337" width="6" height="60" rx="3" fill="#d97706"/>
  <circle cx="66" cy="367" r="16" fill="#d97706"/>
  <text x="66" y="373" font-size="16" font-weight="700" fill="#ffffff" font-family="sans-serif" text-anchor="middle">4</text>
  <text x="100" y="359" font-size="18" font-weight="700" fill="#1e293b" font-family="sans-serif">防疫SOP超過1年未更新（B10）</text>
  <text x="100" y="380" font-size="14" fill="#57534e" font-family="sans-serif">疫後版本未再審閱，感染管制手冊需每年檢視更新</text>
  <rect x="620" y="348" width="128" height="38" rx="6" fill="#fef3c7"/>
  <text x="684" y="372" font-size="14" font-weight="700" fill="#d97706" font-family="sans-serif" text-anchor="middle">黃燈風險</text>

  <!-- Row5 y=410 -->
  <rect x="40" y="410" width="720" height="60" rx="8" fill="#ffffff"/>
  <rect x="40" y="410" width="6" height="60" rx="3" fill="#d97706"/>
  <circle cx="66" cy="440" r="16" fill="#d97706"/>
  <text x="66" y="446" font-size="16" font-weight="700" fill="#ffffff" font-family="sans-serif" text-anchor="middle">5</text>
  <text x="100" y="432" font-size="18" font-weight="700" fill="#1e293b" font-family="sans-serif">前次評鑑建議事項未全數改善（E1）</text>
  <text x="100" y="453" font-size="14" fill="#57534e" font-family="sans-serif">建立追蹤表，每條建議標示燈號，每季更新改善狀態</text>
  <rect x="620" y="421" width="128" height="38" rx="6" fill="#fef3c7"/>
  <text x="684" y="445" font-size="14" font-weight="700" fill="#d97706" font-family="sans-serif" text-anchor="middle">建立追蹤表</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400" font-family="sans-serif">報告汪 reportwang.com</text>
</svg>
