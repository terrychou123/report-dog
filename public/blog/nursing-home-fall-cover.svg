  <text x="720" y="122" font-size="20" fill="#1e293b" font-weight="700">B13 跌倒</text>
  <text x="720" y="148" font-size="14" fill="#57534e">逐案分析處置</text>
  <text x="720" y="168" font-size="14" fill="#57534e">每半年定期分析</text>
