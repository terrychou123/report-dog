  <text x="720" y="272" font-size="20" fill="#1e293b" font-weight="700">B16 約束</text>
  <text x="720" y="298" font-size="14" fill="#57534e">醫師診斷為依據</text>
  <text x="720" y="318" font-size="14" fill="#57534e">同意書3月有效</text>
  <text x="720" y="338" font-size="14" fill="#57534e">每季分析改善</text>

  <!-- A6 危機管理 -->
  <rect x="880" y="230" width="240" height="130" rx="12" fill="#fff" stroke="#e5e3dc" stroke-width="1"/>
