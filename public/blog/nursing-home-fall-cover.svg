  <!-- B14 壓損 -->
  <rect x="880" y="80" width="240" height="130" rx="12" fill="#fff" stroke="#e5e3dc" stroke-width="1"/>
  <text x="900" y="115" font-size="36">🩹</text>
  <text x="980" y="122" font-size="20" fill="#1e293b" font-weight="700">B14 壓損</text>
  <text x="980" y="148" font-size="14" fill="#57534e">逐案分析處置</text>
  <text x="980" y="168" font-size="14" fill="#57534e">每季定期分析</text>
  <text x="980" y="188" font-size="14" fill="#57534e">安養機構不適用</text>

  <!-- B16 約束 -->
  <rect x="620" y="230" width="240" height="130" rx="12" fill="#fff" stroke="#e5e3dc" stroke-width="1"/>
