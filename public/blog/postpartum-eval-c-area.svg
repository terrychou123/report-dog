<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <rect x="0" y="50" width="800" height="76" fill="white"/>
  <rect x="0" y="50" width="6" height="76" rx="2" fill="#d97706"/>
  <text x="28" y="104" font-size="36" fill="#1e293b" font-weight="700">C 區環境安全兩條核心要求</text>
  <rect x="28" y="175" width="744" height="130" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="175" width="6" height="130" rx="2" fill="#d97706"/>
  <circle cx="66" cy="235" r="20" fill="#d97706" opacity="0.15"/>
  <text x="66" y="241" font-size="18" fill="#d97706" text-anchor="middle" font-weight="900">C1</text>
  <text x="100" y="225" font-size="24" fill="#1e293b" font-weight="700">疏散避難系統</text>
  <text x="100" y="251" font-size="16" fill="#57534e">嬰兒緊急疏散 SOP 需明確「誰抱哪個嬰兒」的人員分工</text>
  <text x="100" y="271" font-size="16" fill="#57534e">每年至少 1 次含嬰兒疏散的消防演練，有照片和演練報告</text>
  <text x="100" y="291" font-size="16" fill="#57534e">疏散路線無障礙物，緊急出口可正常開啟</text>
  <rect x="620" y="183" width="136" height="115" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="234" font-size="16" fill="#d97706" text-anchor="middle">嬰兒</text>
  <text x="688" y="254" font-size="16" fill="#d97706" text-anchor="middle">疏散</text>
  <text x="688" y="274" font-size="16" fill="#d97706" text-anchor="middle">SOP</text>
  <rect x="28" y="325" width="744" height="120" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="325" width="6" height="120" rx="2" fill="#78716c"/>
  <circle cx="66" cy="380" r="20" fill="#78716c" opacity="0.15"/>
  <text x="66" y="386" font-size="18" fill="#78716c" text-anchor="middle" font-weight="900">C2</text>
  <text x="100" y="370" font-size="24" fill="#1e293b" font-weight="700">災害緊急應變</text>
  <text x="100" y="396" font-size="16" fill="#57534e">天災應變計畫（颱風、地震）存在，有演練記錄</text>
  <text x="100" y="416" font-size="16" fill="#57534e">嬰兒室溫度維持 24–26°C，有連續監測記錄和警示機制</text>
  <rect x="620" y="333" width="136" height="105" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="381" font-size="16" fill="#78716c" text-anchor="middle">24-26°C</text>
  <text x="688" y="401" font-size="16" fill="#78716c" text-anchor="middle">監測</text>
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
