  <text x="688" y="357" font-size="16" text-anchor="middle" fill="#57534e" font-weight="700" >重大缺失</text>

  <!-- Row 4 (#a8a29e) y=385 -->
  <rect x="28" y="385" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
