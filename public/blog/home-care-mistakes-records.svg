  <text x="100" y="188" font-size="22" fill="#1e293b" font-weight="700" >格式不完整</text>
  <text x="100" y="208" font-size="16" fill="#57534e" >缺少日期、時間或服務項目欄位</text>
  <rect x="620" y="168" width="136" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="187" font-size="16" text-anchor="middle" fill="#d97706" font-weight="700" >項目13</text>
  <text x="688" y="207" font-size="16" text-anchor="middle" fill="#d97706" font-weight="700" >評委必查</text>

  <!-- Row 2 (#78716c) y=235 -->
  <rect x="28" y="235" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
