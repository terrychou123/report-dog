  <text x="100" y="338" font-size="22" fill="#1e293b" font-weight="700" >異常未記錄</text>
  <text x="100" y="358" font-size="16" fill="#57534e" >個案身體異常未立即記載回報</text>
  <rect x="620" y="318" width="136" height="46" rx="8" fill="#57534e" opacity="0.12"/>
