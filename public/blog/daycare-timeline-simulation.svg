<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"
     font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- 主標題 32px y=48 -->
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">模擬委員訪談演練 3 步驟</text>
  <!-- 副標題 22px y=78 -->
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">準備、演練、改進，讓全員沉著應對委員查核</text>
  <!-- 分隔線 -->
  <line x1="129" y1="94" x2="671" y2="94" stroke="#dedad3" stroke-width="1"/>

  <!-- 箭頭 (arrow_y=279) -->
  <line x1="299" y1="279" x2="315" y2="279" stroke="#c4bfb8" stroke-width="2"/>
  <polygon points="299,273 315,279 299,285" fill="#c4bfb8"/>
  <line x1="485" y1="279" x2="501" y2="279" stroke="#c4bfb8" stroke-width="2"/>
  <polygon points="485,273 501,279 485,285" fill="#c4bfb8"/>

  <!-- ===== Step 1：準備問題（#d97706）x=129 cx=214 ===== -->
  <rect x="129" y="108" width="170" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="129" y="108" width="170" height="8" rx="4" fill="#d97706"/>
  <rect x="129" y="112" width="170" height="4" fill="#d97706"/>
  <!-- STEP 圓圈 (r=43, cy=194) -->
  <circle cx="214" cy="194" r="43" fill="#fef3c7"/>
  <text x="214" y="183" text-anchor="middle" font-size="17" fill="#d97706" font-weight="700">STEP</text>
  <text x="214" y="211" text-anchor="middle" font-size="28" fill="#d97706" font-weight="700">01</text>
  <!-- 卡片標題 H_font=35 -->
  <text x="214" y="297" text-anchor="middle" font-size="35" fill="#1e293b" font-weight="700">準備問題</text>
  <!-- 說明 J_font=23 -->
  <text x="214" y="324" text-anchor="middle" font-size="23" fill="#57534e">整理委員常見</text>
  <text x="214" y="347" text-anchor="middle" font-size="23" fill="#57534e">訪談問題清單</text>
  <!-- Pill 標籤 (y=381, w=144) -->
  <rect x="142" y="381" width="144" height="36" rx="18" fill="#fef3c7"/>
  <text x="214" y="405" text-anchor="middle" font-size="18" fill="#d97706" font-weight="600">事先準備</text>

  <!-- ===== Step 2：模擬演練（#78716c）x=315 cx=400 ===== -->
  <rect x="315" y="108" width="170" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="315" y="108" width="170" height="8" rx="4" fill="#78716c"/>
  <rect x="315" y="112" width="170" height="4" fill="#78716c"/>
  <circle cx="400" cy="194" r="43" fill="#f5f5f4"/>
  <text x="400" y="183" text-anchor="middle" font-size="17" fill="#78716c" font-weight="700">STEP</text>
  <text x="400" y="211" text-anchor="middle" font-size="28" fill="#78716c" font-weight="700">02</text>
  <text x="400" y="297" text-anchor="middle" font-size="35" fill="#1e293b" font-weight="700">模擬演練</text>
  <text x="400" y="324" text-anchor="middle" font-size="23" fill="#57534e">角色扮演委員</text>
  <text x="400" y="347" text-anchor="middle" font-size="23" fill="#57534e">逐職類訪談</text>
  <rect x="328" y="381" width="144" height="36" rx="18" fill="#f5f5f4"/>
  <text x="400" y="405" text-anchor="middle" font-size="18" fill="#78716c" font-weight="600">實戰演練</text>

  <!-- ===== Step 3：追蹤改進（#57534e）x=501 cx=586 ===== -->
  <rect x="501" y="108" width="170" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="501" y="108" width="170" height="8" rx="4" fill="#57534e"/>
  <rect x="501" y="112" width="170" height="4" fill="#57534e"/>
  <circle cx="586" cy="194" r="43" fill="#f5f0eb"/>
  <text x="586" y="183" text-anchor="middle" font-size="17" fill="#57534e" font-weight="700">STEP</text>
  <text x="586" y="211" text-anchor="middle" font-size="28" fill="#57534e" font-weight="700">03</text>
  <text x="586" y="297" text-anchor="middle" font-size="35" fill="#1e293b" font-weight="700">追蹤改進</text>
  <text x="586" y="324" text-anchor="middle" font-size="23" fill="#57534e">彙整弱項</text>
  <text x="586" y="347" text-anchor="middle" font-size="23" fill="#57534e">針對練習改進</text>
  <rect x="514" y="381" width="144" height="36" rx="18" fill="#f5f0eb"/>
  <text x="586" y="405" text-anchor="middle" font-size="18" fill="#57534e" font-weight="600">持續改進</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
