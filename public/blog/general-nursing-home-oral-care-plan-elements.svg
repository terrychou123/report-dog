  <text x="100" y="283" font-size="16" fill="#57534e">鼻胃管、氣切、認知障礙等高風險住民需標注加強照護原因</text>
  <rect x="620" y="243" width="136" height="46" rx="8" fill="#78716c" opacity="0.12"/>
