<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="450" fill="#f0efe8"/>
  <text x="400" y="46" font-size="21" font-weight="700" fill="#1e293b" text-anchor="middle">品管指標是什麼？4 步驟理解核心概念</text>
  <rect x="60" y="58" width="48" height="3" rx="1.5" fill="#d97706"/>
  <line x1="116" y1="59.5" x2="740" y2="59.5" stroke="#dedad3" stroke-width="1"/>

  <!-- Definition card -->
  <rect x="52" y="82" width="696" height="72" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="52" y="82" width="4" height="72" rx="2" fill="#d97706"/>
  <text x="72" y="107" font-size="14" fill="#78716c" font-weight="700">品管指標定義</text>
  <text x="72" y="128" font-size="13" fill="#1e293b">機構自訂的服務品質衡量數值，用於追蹤照護成效並驅動持續改善</text>
  <text x="72" y="146" font-size="12" fill="#57534e">→ 不是給委員看的表格，是機構真正管理服務品質的工具</text>

  <!-- 4-step flow -->
  <!-- Step 1 -->
  <rect x="52" y="178" width="152" height="210" rx="12" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="52" y="178" width="152" height="5" rx="2.5" fill="#d97706"/>
  <text x="128" y="204" font-size="13" fill="#78716c" text-anchor="middle" font-weight="700">① 設定指標</text>
  <circle cx="128" cy="245" r="28" fill="#d97706" opacity="0.10"/>
  <text x="128" y="253" font-size="28" fill="#d97706" font-weight="900" text-anchor="middle">P</text>
  <text x="128" y="276" font-size="12" fill="#78716c" text-anchor="middle">Plan</text>
  <line x1="68" y1="293" x2="188" y2="293" stroke="#f0ede6" stroke-width="1"/>
  <text x="68" y="313" font-size="11" fill="#57534e">選擇 2+ 個指標</text>
  <text x="68" y="329" font-size="11" fill="#57534e">設目標值/頻率</text>
  <text x="68" y="345" font-size="11" fill="#57534e">責任人分配</text>
  <text x="68" y="361" font-size="11" fill="#57534e">規範書面化</text>

  <!-- Arrow -->
  <text x="222" y="285" font-size="20" fill="#d97706" text-anchor="middle">→</text>

  <!-- Step 2 -->
  <rect x="236" y="178" width="152" height="210" rx="12" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="236" y="178" width="152" height="5" rx="2.5" fill="#16a34a"/>
  <text x="312" y="204" font-size="13" fill="#78716c" text-anchor="middle" font-weight="700">② 收集數據</text>
  <circle cx="312" cy="245" r="28" fill="#16a34a" opacity="0.10"/>
  <text x="312" y="253" font-size="28" fill="#16a34a" font-weight="900" text-anchor="middle">D</text>
  <text x="312" y="276" font-size="12" fill="#78716c" text-anchor="middle">Do</text>
  <line x1="252" y1="293" x2="372" y2="293" stroke="#f0ede6" stroke-width="1"/>
  <text x="252" y="313" font-size="11" fill="#57534e">每月定期統計</text>
  <text x="252" y="329" font-size="11" fill="#57534e">填寫月報表單</text>
  <text x="252" y="345" font-size="11" fill="#57534e">數值簽名確認</text>
  <text x="252" y="361" font-size="11" fill="#57534e">存放可查詢</text>

  <!-- Arrow -->
  <text x="406" y="285" font-size="20" fill="#d97706" text-anchor="middle">→</text>

  <!-- Step 3 -->
  <rect x="420" y="178" width="152" height="210" rx="12" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="420" y="178" width="152" height="5" rx="2.5" fill="#ea580c"/>
  <text x="496" y="204" font-size="13" fill="#78716c" text-anchor="middle" font-weight="700">③ 分析檢討</text>
  <circle cx="496" cy="245" r="28" fill="#ea580c" opacity="0.10"/>
  <text x="496" y="253" font-size="24" fill="#ea580c" font-weight="900" text-anchor="middle">C</text>
  <text x="496" y="276" font-size="12" fill="#78716c" text-anchor="middle">Check</text>
  <line x1="436" y1="293" x2="556" y2="293" stroke="#f0ede6" stroke-width="1"/>
  <text x="436" y="313" font-size="11" fill="#57534e">與目標值比較</text>
  <text x="436" y="329" font-size="11" fill="#57534e">趨勢圖分析</text>
  <text x="436" y="345" font-size="11" fill="#57534e">未達標原因</text>
  <text x="436" y="361" font-size="11" fill="#57534e">召開品管討論</text>

  <!-- Arrow -->
  <text x="590" y="285" font-size="20" fill="#d97706" text-anchor="middle">→</text>

  <!-- Step 4 -->
  <rect x="604" y="178" width="144" height="210" rx="12" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="604" y="178" width="144" height="5" rx="2.5" fill="#9333ea"/>
  <text x="676" y="204" font-size="13" fill="#78716c" text-anchor="middle" font-weight="700">④ 改善執行</text>
  <circle cx="676" cy="245" r="28" fill="#9333ea" opacity="0.10"/>
  <text x="676" y="253" font-size="28" fill="#9333ea" font-weight="900" text-anchor="middle">A</text>
  <text x="676" y="276" font-size="12" fill="#78716c" text-anchor="middle">Act</text>
  <line x1="620" y1="293" x2="732" y2="293" stroke="#f0ede6" stroke-width="1"/>
  <text x="620" y="313" font-size="11" fill="#57534e">制訂改善對策</text>
  <text x="620" y="329" font-size="11" fill="#57534e">執行並追蹤</text>
  <text x="620" y="345" font-size="11" fill="#57534e">下月再評估</text>
  <text x="620" y="361" font-size="11" fill="#57534e">循環持續</text>

  <text x="760" y="421" font-size="16" fill="#c4bfb8" text-anchor="end" font-weight="400" font-family="'Noto Sans TC', sans-serif">報告汪 reportwang.com</text>
</svg>
