  <text x="100" y="260" font-size="22" fill="#1e293b" font-weight="700">文書減量</text>
  <text x="100" y="283" font-size="16" fill="#57534e">導入 AI 文書工具，減少教保員與社工師每週文書時間</text>
  <rect x="620" y="243" width="136" height="46" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="256" font-size="16" fill="#78716c" text-anchor="middle">留才策略</text>
  <text x="688" y="276" font-size="16" fill="#78716c" text-anchor="middle">效率工具</text>

  <!-- Row 3 (y=310) -->
  <rect x="28" y="310" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
