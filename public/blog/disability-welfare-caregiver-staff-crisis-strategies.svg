  <text x="688" y="406" font-size="16" fill="#a8a29e" text-anchor="middle">留才策略</text>
  <text x="688" y="426" font-size="16" fill="#a8a29e" text-anchor="middle">職涯支持</text>

  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
