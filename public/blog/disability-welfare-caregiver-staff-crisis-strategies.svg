  <circle cx="66" cy="191" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="197" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <text x="100" y="185" font-size="22" fill="#1e293b" font-weight="700">薪資透明化</text>
  <text x="100" y="208" font-size="16" fill="#57534e">公開薪資結構與晉升制度，讓員工看得到成長路徑</text>
  <rect x="620" y="168" width="136" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="181" font-size="16" fill="#d97706" text-anchor="middle">留才策略</text>
  <text x="688" y="201" font-size="16" fill="#d97706" text-anchor="middle">薪酬管理</text>

  <!-- Row 2 (y=235) -->
  <rect x="28" y="235" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
