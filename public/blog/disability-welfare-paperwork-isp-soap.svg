<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <!-- Header -->
  <rect x="0" y="29" width="800" height="60" fill="#e8e6de"/>
  <rect x="0" y="29" width="6" height="60" rx="2" fill="#d97706"/>
  <text x="28" y="74" font-size="28" fill="#1e293b" font-weight="700">ISP 與 SOAP 文書效率化四技巧</text>
  <!-- Row 1: y=118, H=62 -->
  <rect x="28" y="118" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1.5"/>
  <rect x="28" y="118" width="6" height="62" rx="2" fill="#78716c"/>
  <circle cx="66" cy="149" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="144" font-size="20" fill="#d97706" font-weight="700" text-anchor="middle">1</text>
  <text x="66" y="164" font-size="14" fill="#78716c" text-anchor="middle">結構先行</text>
  <text x="96" y="144" font-size="20" fill="#1e293b" font-weight="700">先輸入結構，再補充內容</text>
  <text x="96" y="165" font-size="16" fill="#57534e">ISP 依六大需求面向分段輸入評估摘要，AI 自動生成各段目標框架</text>
  <rect x="620" y="126" width="136" height="46" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="146" font-size="14" fill="#d97706" font-weight="700" text-anchor="middle">六大面向</text>
  <text x="688" y="165" font-size="14" fill="#d97706" text-anchor="middle">分段撰寫</text>
  <!-- Row 2: y=191, H=62 -->
  <rect x="28" y="191" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1.5"/>
  <rect x="28" y="191" width="6" height="62" rx="2" fill="#57534e"/>
  <circle cx="66" cy="222" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="217" font-size="20" fill="#78716c" font-weight="700" text-anchor="middle">2</text>
  <text x="66" y="237" font-size="14" fill="#78716c" text-anchor="middle">SOAP 格式</text>
  <text x="96" y="217" font-size="20" fill="#1e293b" font-weight="700">區分 SOAP 四格，避免混淆</text>
  <text x="96" y="238" font-size="16" fill="#57534e">S=主觀陳述 / O=客觀觀察 / A=評估判斷 / P=後續計畫，各格內容不混用</text>
  <rect x="620" y="199" width="136" height="46" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="219" font-size="14" fill="#78716c" font-weight="700" text-anchor="middle">S / O / A / P</text>
  <text x="688" y="238" font-size="14" fill="#78716c" text-anchor="middle">四格分離</text>
  <!-- Row 3: y=264, H=62 -->
  <rect x="28" y="264" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1.5"/>
  <rect x="28" y="264" width="6" height="62" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="295" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="290" font-size="20" fill="#57534e" font-weight="700" text-anchor="middle">3</text>
  <text x="66" y="310" font-size="14" fill="#78716c" text-anchor="middle">專業審閱</text>
  <text x="96" y="290" font-size="20" fill="#1e293b" font-weight="700">AI 初稿必須由負責人員審閱確認</text>
  <text x="96" y="311" font-size="16" fill="#57534e">確認 AI 生成內容符合服務對象實際狀況，並由社工師簽名負責</text>
  <rect x="620" y="272" width="136" height="46" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="292" font-size="14" fill="#57534e" font-weight="700" text-anchor="middle">專業把關</text>
  <text x="688" y="311" font-size="14" fill="#57534e" text-anchor="middle">不照單全收</text>
  <!-- Row 4: y=337, H=62 -->
  <rect x="28" y="337" width="744" height="62" rx="12" fill="white" stroke="#e8e6de" stroke-width="1.5"/>
  <rect x="28" y="337" width="6" height="62" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="368" r="16" fill="#94a3b8" opacity="0.15"/>
  <text x="66" y="363" font-size="20" fill="#94a3b8" font-weight="700" text-anchor="middle">4</text>
  <text x="66" y="383" font-size="14" fill="#78716c" text-anchor="middle">統一用語</text>
  <text x="96" y="363" font-size="20" fill="#1e293b" font-weight="700">統一紀錄用語減少個人風格差異</text>
  <text x="96" y="384" font-size="16" fill="#57534e">機構建立統一用語詞庫，各職類按共同格式記錄，方便跨職類查閱</text>
  <rect x="620" y="345" width="136" height="46" rx="8" fill="#94a3b8" opacity="0.12"/>
  <text x="688" y="365" font-size="14" fill="#94a3b8" font-weight="700" text-anchor="middle">統一詞庫</text>
  <text x="688" y="384" font-size="14" fill="#94a3b8" text-anchor="middle">跨職類查閱</text>
  <!-- Watermark -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
