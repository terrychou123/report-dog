<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#fafaf9"/>

  <!-- 標題區 -->
  <rect x="0" y="0" width="800" height="68" fill="#1c1917"/>
  <text x="400" y="42" font-family="'Noto Sans TC', sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">日常化品管四大策略</text>

  <!-- 列1 — 建立月度文書例行作業 (#d97706) -->
  <rect x="32" y="80" width="736" height="82" rx="8" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <rect x="32" y="80" width="8" height="82" rx="4" fill="#d97706"/>
  <text x="56" y="107" font-family="'Noto Sans TC', sans-serif" font-size="17" font-weight="700" fill="#1c1917">建立月度文書例行作業</text>
  <text x="56" y="128" font-family="'Noto Sans TC', sans-serif" font-size="14" fill="#57534e">每月第一週產出品質指標報告，委員會議紀錄按時完成</text>
  <text x="56" y="149" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#78716c">不積累到評鑑前，文書品質穩定且有連貫性</text>
  <rect x="648" y="101" width="100" height="32" rx="16" fill="#d97706" opacity="0.15"/>
  <text x="698" y="122" font-family="'Noto Sans TC', sans-serif" font-size="14" font-weight="700" fill="#d97706" text-anchor="middle">月度例行</text>

  <!-- 列2 — 導入AI輔助文書工具 (#78716c) -->
  <rect x="32" y="174" width="736" height="82" rx="8" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <rect x="32" y="174" width="8" height="82" rx="4" fill="#78716c"/>
  <text x="56" y="201" font-family="'Noto Sans TC', sans-serif" font-size="17" font-weight="700" fill="#1c1917">導入 AI 輔助文書工具</text>
  <text x="56" y="222" font-family="'Noto Sans TC', sans-serif" font-size="14" fill="#57534e">護理評估、改善計畫初稿由AI生成，護理師只需校閱修訂</text>
  <text x="56" y="243" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#78716c">節省70%撰寫時間，讓護理師回歸照護本業</text>
  <rect x="658" y="195" width="80" height="32" rx="16" fill="#78716c" opacity="0.15"/>
  <text x="698" y="216" font-family="'Noto Sans TC', sans-serif" font-size="14" font-weight="700" fill="#78716c" text-anchor="middle">AI加速</text>

  <!-- 列3 — 建立跨部門追蹤機制 (#57534e) -->
  <rect x="32" y="268" width="736" height="82" rx="8" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <rect x="32" y="268" width="8" height="82" rx="4" fill="#57534e"/>
  <text x="56" y="295" font-family="'Noto Sans TC', sans-serif" font-size="17" font-weight="700" fill="#1c1917">建立跨部門追蹤機制</text>
  <text x="56" y="316" font-family="'Noto Sans TC', sans-serif" font-size="14" fill="#57534e">品管、感控、護理部各自負責的文書項目統一可視化</text>
  <text x="56" y="337" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#78716c">追蹤系統自動提醒，避免文書缺漏到評鑑前才發現</text>
  <rect x="648" y="289" width="100" height="32" rx="16" fill="#57534e" opacity="0.12"/>
  <text x="698" y="310" font-family="'Noto Sans TC', sans-serif" font-size="14" font-weight="700" fill="#57534e" text-anchor="middle">跨部追蹤</text>

  <!-- 列4 — 每季自我查核 (#a8a29e) -->
  <rect x="32" y="362" width="736" height="82" rx="8" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <rect x="32" y="362" width="8" height="82" rx="4" fill="#a8a29e"/>
  <text x="56" y="389" font-family="'Noto Sans TC', sans-serif" font-size="17" font-weight="700" fill="#1c1917">每季自我查核</text>
  <text x="56" y="410" font-family="'Noto Sans TC', sans-serif" font-size="14" fill="#57534e">仿照評鑑委員查核方式，每季抽查文書完整性</text>
  <text x="56" y="431" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#78716c">早期發現缺漏，避免評鑑前集中補件的壓力</text>
  <rect x="648" y="383" width="100" height="32" rx="16" fill="#a8a29e" opacity="0.18"/>
  <text x="698" y="404" font-family="'Noto Sans TC', sans-serif" font-size="14" font-weight="700" fill="#78716c" text-anchor="middle">季度自評</text>

  <!-- 浮水印 -->
  <text x="400" y="480" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#a8a29e" text-anchor="middle" opacity="0.7">報告汪 reportwang.com</text>
</svg>
