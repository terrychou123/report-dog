<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', sans-serif">
  <rect width="1200" height="630" fill="#f0efe8"/>

  <!-- 右側裝飾區塊 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>

  <!-- 右側大數字 5 -->
  <text x="1010" y="290" text-anchor="middle" font-size="220" fill="#16a34a" font-weight="900" opacity="0.80">5</text>
  <text x="1010" y="338" text-anchor="middle" font-size="24" fill="#78716c" font-weight="600">手部衛生五大時機</text>

  <!-- 右側資訊卡片 -->
  <rect x="840" y="366" width="320" height="52" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="1000" y="399" text-anchor="middle" font-size="22" fill="#16a34a" font-weight="700">接觸病人前</text>

  <rect x="840" y="428" width="320" height="52" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="1000" y="461" text-anchor="middle" font-size="22" fill="#d97706" font-weight="700">執行無菌操作前</text>

  <rect x="840" y="490" width="320" height="52" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <text x="1000" y="523" text-anchor="middle" font-size="22" fill="#dc2626" font-weight="700">接觸體液後（流水洗）</text>

  <!-- 右側底部標籤 -->
  <rect x="840" y="552" width="320" height="46" rx="10" fill="#16a34a" opacity="0.12"/>
  <text x="1000" y="582" text-anchor="middle" font-size="22" fill="#16a34a" font-weight="700">稽核達標 + 日常習慣</text>

  <!-- 左側主標題 -->
  <text x="60" y="196" font-size="100" fill="#1e293b" font-weight="900">手部衛生</text>
  <text x="60" y="308" font-size="84" fill="#16a34a" font-weight="900">合規率提升</text>

  <!-- 左側分隔線 -->
  <line x1="60" y1="338" x2="780" y2="338" stroke="#dedad3" stroke-width="2"/>

  <!-- 左側副標題 -->
  <text x="60" y="380" font-size="30" fill="#57534e">2.7.2實地查核 × 5個策略 × 30天衝刺計畫</text>

  <!-- 特色標籤列 -->
  <rect x="60" y="408" width="148" height="48" rx="10" fill="#16a34a" opacity="0.12"/>
  <text x="134" y="440" text-anchor="middle" font-size="24" fill="#16a34a" font-weight="600">稽核員制度</text>

  <rect x="220" y="408" width="148" height="48" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="294" y="440" text-anchor="middle" font-size="24" fill="#d97706" font-weight="600">環境設計</text>

  <rect x="380" y="408" width="148" height="48" rx="10" fill="#78716c" opacity="0.12"/>
  <text x="454" y="440" text-anchor="middle" font-size="24" fill="#78716c" font-weight="600">交叉稽核</text>

  <rect x="540" y="408" width="148" height="48" rx="10" fill="#dc2626" opacity="0.12"/>
  <text x="614" y="440" text-anchor="middle" font-size="24" fill="#dc2626" font-weight="600">五大時機訓練</text>

  <!-- 第二排標籤 -->
  <rect x="60" y="468" width="148" height="48" rx="10" fill="#9333ea" opacity="0.12"/>
  <text x="134" y="500" text-anchor="middle" font-size="24" fill="#9333ea" font-weight="600">管理層示範</text>

  <rect x="220" y="468" width="148" height="48" rx="10" fill="#0d9488" opacity="0.12"/>
  <text x="294" y="500" text-anchor="middle" font-size="24" fill="#0d9488" font-weight="600">霍桑效應</text>

  <rect x="380" y="468" width="148" height="48" rx="10" fill="#4f46e5" opacity="0.12"/>
  <text x="454" y="500" text-anchor="middle" font-size="24" fill="#4f46e5" font-weight="600">30天衝刺</text>

  <!-- 適用對象 -->
  <text x="60" y="550" font-size="24" fill="#a8a29e">適用：感染管制護理師、護理主管、全院護理師</text>

  <!-- 浮水印 -->
  <text x="1140" y="612" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
