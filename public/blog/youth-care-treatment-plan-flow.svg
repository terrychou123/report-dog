<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <rect width="800" height="500" fill="#f0efe8"/>
  <text x="400" y="48" text-anchor="middle" font-size="32" fill="#1e293b" font-weight="700">4步驟處遇計畫生命週期</text>
  <text x="400" y="78" text-anchor="middle" font-size="22" fill="#57534e">從接案評估到離院追蹤，缺一不可</text>
  <line x1="28" y1="94" x2="772" y2="94" stroke="#dedad3" stroke-width="1"/>
  <!-- 箭頭 N=4 -->
  <line x1="202" y1="279" x2="218" y2="279" stroke="#c4bfb8" stroke-width="2"/>
  <polygon points="202,273 218,279 202,285" fill="#c4bfb8"/>
  <line x1="392" y1="279" x2="408" y2="279" stroke="#c4bfb8" stroke-width="2"/>
  <polygon points="392,273 408,279 392,285" fill="#c4bfb8"/>
  <line x1="582" y1="279" x2="598" y2="279" stroke="#c4bfb8" stroke-width="2"/>
  <polygon points="582,273 598,279 582,285" fill="#c4bfb8"/>
  <!-- Step 1：接案評估 -->
  <rect x="28" y="108" width="174" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="108" width="174" height="8" rx="4" fill="#d97706"/>
  <rect x="28" y="112" width="174" height="4" fill="#d97706"/>
  <circle cx="115" cy="201" r="44" fill="#fef3c7"/>
  <text x="115" y="190" text-anchor="middle" font-size="16" fill="#d97706" font-weight="700">STEP</text>
  <text x="115" y="219" text-anchor="middle" font-size="26" fill="#d97706" font-weight="700">01</text>
  <text x="115" y="297" text-anchor="middle" font-size="22" fill="#1e293b" font-weight="700">接案評估</text>
  <text x="115" y="322" text-anchor="middle" font-size="15" fill="#57534e">身心狀態評估</text>
  <text x="115" y="342" text-anchor="middle" font-size="15" fill="#57534e">家庭背景了解</text>
  <rect x="41" y="377" width="148" height="36" rx="18" fill="#fef3c7"/>
  <text x="115" y="401" text-anchor="middle" font-size="16" fill="#d97706" font-weight="600">入院 2 週內</text>
  <!-- Step 2：計畫擬定 -->
  <rect x="218" y="108" width="174" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="218" y="108" width="174" height="8" rx="4" fill="#78716c"/>
  <rect x="218" y="112" width="174" height="4" fill="#78716c"/>
  <circle cx="305" cy="201" r="44" fill="#f5f5f4"/>
  <text x="305" y="190" text-anchor="middle" font-size="16" fill="#78716c" font-weight="700">STEP</text>
  <text x="305" y="219" text-anchor="middle" font-size="26" fill="#78716c" font-weight="700">02</text>
  <text x="305" y="297" text-anchor="middle" font-size="22" fill="#1e293b" font-weight="700">計畫擬定</text>
  <text x="305" y="322" text-anchor="middle" font-size="15" fill="#57534e">具體可量化目標</text>
  <text x="305" y="342" text-anchor="middle" font-size="15" fill="#57534e">介入策略規劃</text>
  <rect x="231" y="377" width="148" height="36" rx="18" fill="#f5f5f4"/>
  <text x="305" y="401" text-anchor="middle" font-size="16" fill="#78716c" font-weight="600">入院 1 個月內</text>
  <!-- Step 3：執行與紀錄 -->
  <rect x="408" y="108" width="174" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="408" y="108" width="174" height="8" rx="4" fill="#57534e"/>
  <rect x="408" y="112" width="174" height="4" fill="#57534e"/>
  <circle cx="495" cy="201" r="44" fill="#f5f0eb"/>
  <text x="495" y="190" text-anchor="middle" font-size="16" fill="#57534e" font-weight="700">STEP</text>
  <text x="495" y="219" text-anchor="middle" font-size="26" fill="#57534e" font-weight="700">03</text>
  <text x="495" y="297" text-anchor="middle" font-size="22" fill="#1e293b" font-weight="700">執行與紀錄</text>
  <text x="495" y="322" text-anchor="middle" font-size="15" fill="#57534e">服務落實記錄</text>
  <text x="495" y="342" text-anchor="middle" font-size="15" fill="#57534e">每 3 個月定期評估</text>
  <rect x="421" y="377" width="148" height="36" rx="18" fill="#f5f0eb"/>
  <text x="495" y="401" text-anchor="middle" font-size="16" fill="#57534e" font-weight="600">在院全期持續</text>
  <!-- Step 4：結案追蹤 -->
  <rect x="598" y="108" width="174" height="342" rx="12" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="598" y="108" width="174" height="8" rx="4" fill="#a8a29e"/>
  <rect x="598" y="112" width="174" height="4" fill="#a8a29e"/>
  <circle cx="685" cy="201" r="44" fill="#f5f5f4"/>
  <text x="685" y="190" text-anchor="middle" font-size="16" fill="#a8a29e" font-weight="700">STEP</text>
  <text x="685" y="219" text-anchor="middle" font-size="26" fill="#a8a29e" font-weight="700">04</text>
  <text x="685" y="297" text-anchor="middle" font-size="22" fill="#1e293b" font-weight="700">結案追蹤</text>
  <text x="685" y="322" text-anchor="middle" font-size="15" fill="#57534e">結案評估記錄</text>
  <text x="685" y="342" text-anchor="middle" font-size="15" fill="#57534e">離院後追蹤輔導</text>
  <rect x="611" y="377" width="148" height="36" rx="18" fill="#f5f5f4"/>
  <text x="685" y="401" text-anchor="middle" font-size="16" fill="#a8a29e" font-weight="600">離院後持續</text>
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
