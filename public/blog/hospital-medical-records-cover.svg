<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>

  <!-- 左側裝飾色塊 -->
  <rect x="0" y="0" width="8" height="630" fill="#d97706"/>

  <!-- 右側裝飾區背景 -->
  <rect x="720" y="0" width="480" height="630" fill="#fef3c7" rx="0"/>

  <!-- 右側大數字裝飾 -->
  <text x="870" y="260" font-family="'Noto Sans TC', sans-serif" font-size="200" font-weight="900" fill="#d97706" opacity="0.18">4</text>

  <!-- 右側說明文字 -->
  <text x="830" y="310" font-family="'Noto Sans TC', sans-serif" font-size="22" font-weight="700" fill="#92400e" text-anchor="middle">1.4.1 四大評核重點</text>

  <!-- 右側白色資訊卡片 1 -->
  <rect x="750" y="330" width="400" height="62" rx="10" fill="white" opacity="0.9"/>
  <rect x="750" y="330" width="6" height="62" rx="3" fill="#d97706"/>
  <text x="770" y="358" font-family="'Noto Sans TC', sans-serif" font-size="16" font-weight="700" fill="#1e293b">書寫規範與即時簽名</text>
  <text x="770" y="380" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#64748b">醫療人員依規定書寫、即時簽名</text>

  <!-- 右側白色資訊卡片 2 -->
  <rect x="750" y="404" width="400" height="62" rx="10" fill="white" opacity="0.9"/>
  <rect x="750" y="404" width="6" height="62" rx="3" fill="#78716c"/>
  <text x="770" y="432" font-family="'Noto Sans TC', sans-serif" font-size="16" font-weight="700" fill="#1e293b">病歷保存與調閱管理</text>
  <text x="770" y="454" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#64748b">年限合規、未授權不得查閱</text>

  <!-- 右側白色資訊卡片 3 -->
  <rect x="750" y="478" width="400" height="62" rx="10" fill="white" opacity="0.9"/>
  <rect x="750" y="478" width="6" height="62" rx="3" fill="#57534e"/>
  <text x="770" y="506" font-family="'Noto Sans TC', sans-serif" font-size="16" font-weight="700" fill="#1e293b">電子病歷系統合規</text>
  <text x="770" y="528" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#64748b">衛福部法規 + 資安規定落實</text>

  <!-- 底部 amber 標籤 -->
  <rect x="756" y="560" width="200" height="36" rx="18" fill="#d97706"/>
  <text x="856" y="583" font-family="'Noto Sans TC', sans-serif" font-size="15" font-weight="700" fill="white" text-anchor="middle">資料查核＋訪談</text>

  <!-- 左側主標題 -->
  <text x="60" y="155" font-family="'Noto Sans TC', sans-serif" font-size="110" font-weight="900" fill="#1e293b">病歷書寫</text>
  <text x="60" y="268" font-family="'Noto Sans TC', sans-serif" font-size="90" font-weight="900" fill="#d97706">評鑑怎麼過？</text>

  <!-- 副標題 -->
  <text x="60" y="330" font-family="'Noto Sans TC', sans-serif" font-size="28" font-weight="500" fill="#475569">1.4.1必要條文 × AI輔助文書效率革命</text>

  <!-- 分隔線 -->
  <rect x="60" y="355" width="600" height="3" fill="#d97706" rx="2"/>

  <!-- Feature chips -->
  <rect x="60" y="375" width="100" height="34" rx="17" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="110" y="397" font-family="'Noto Sans TC', sans-serif" font-size="14" font-weight="700" fill="#92400e" text-anchor="middle">必要條文</text>

  <rect x="172" y="375" width="100" height="34" rx="17" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="222" y="397" font-family="'Noto Sans TC', sans-serif" font-size="14" font-weight="700" fill="#92400e" text-anchor="middle">書寫時限</text>

  <rect x="284" y="375" width="100" height="34" rx="17" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="334" y="397" font-family="'Noto Sans TC', sans-serif" font-size="14" font-weight="700" fill="#92400e" text-anchor="middle">簽名合規</text>

  <rect x="396" y="375" width="100" height="34" rx="17" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="446" y="397" font-family="'Noto Sans TC', sans-serif" font-size="14" font-weight="700" fill="#92400e" text-anchor="middle">AI輔助</text>

  <rect x="60" y="421" width="100" height="34" rx="17" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="110" y="443" font-family="'Noto Sans TC', sans-serif" font-size="14" font-weight="700" fill="#92400e" text-anchor="middle">電子病歷</text>

  <rect x="172" y="421" width="100" height="34" rx="17" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="222" y="443" font-family="'Noto Sans TC', sans-serif" font-size="14" font-weight="700" fill="#92400e" text-anchor="middle">調閱管理</text>

  <!-- 浮水印 -->
  <text x="60" y="612" font-family="'Noto Sans TC', sans-serif" font-size="14" fill="#94a3b8" opacity="0.8">報告汪 reportwang.com</text>
</svg>
