<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0efe8"/>

  <!-- Header（y=29, h=60）-->
  <rect x="0" y="29" width="800" height="60" fill="white"/>
  <rect x="0" y="29" width="6" height="60" fill="#d97706"/>
  <text x="28" y="68" font-size="36" fill="#1e293b" font-weight="700">行政管理 五大子類一覽</text>

  <!-- Row 0：立案行政與業務管理（y=118）#d97706 -->
  <rect x="28" y="118" width="744" height="60" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="118" width="6" height="60" rx="2" fill="#d97706"/>
  <circle cx="66" cy="148" r="16" fill="#d97706" opacity="0.15"/>
  <text x="66" y="154" font-size="16" fill="#d97706" text-anchor="middle" font-weight="900">1</text>
  <text x="100" y="145" font-size="20" fill="#1e293b" font-weight="700">立案行政與業務管理（第1-3項）</text>
  <text x="100" y="166" font-size="16" fill="#57534e">體檢紀錄、在職訓練18小時、監視器保養、嬰幼兒接送與出缺席管理</text>
  <rect x="620" y="126" width="136" height="44" rx="8" fill="#d97706" opacity="0.12"/>
  <text x="688" y="142" font-size="16" fill="#d97706" text-anchor="middle">第1-3項</text>
  <text x="688" y="162" font-size="16" fill="#d97706" text-anchor="middle">負責人主管</text>

  <!-- Row 1：人事領導與管理（y=191）#78716c -->
  <rect x="28" y="191" width="744" height="60" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="191" width="6" height="60" rx="2" fill="#78716c"/>
  <circle cx="66" cy="221" r="16" fill="#78716c" opacity="0.15"/>
  <text x="66" y="227" font-size="16" fill="#78716c" text-anchor="middle" font-weight="900">2</text>
  <text x="100" y="218" font-size="20" fill="#1e293b" font-weight="700">人事領導與管理（第4-5項）</text>
  <text x="100" y="239" font-size="16" fill="#57534e">人事規章、差假辦法、薪資保險提撥、任職一年以上人員占2/3以上</text>
  <rect x="620" y="199" width="136" height="44" rx="8" fill="#78716c" opacity="0.12"/>
  <text x="688" y="215" font-size="16" fill="#78716c" text-anchor="middle">第4-5項</text>
  <text x="688" y="235" font-size="16" fill="#78716c" text-anchor="middle">負責人主管</text>

  <!-- Row 2：文書與檔案管理（y=264）#57534e -->
  <rect x="28" y="264" width="744" height="60" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="264" width="6" height="60" rx="2" fill="#57534e"/>
  <circle cx="66" cy="294" r="16" fill="#57534e" opacity="0.15"/>
  <text x="66" y="300" font-size="16" fill="#57534e" text-anchor="middle" font-weight="900">3</text>
  <text x="100" y="291" font-size="20" fill="#1e293b" font-weight="700">文書與檔案管理（第6-7項）</text>
  <text x="100" y="312" font-size="16" fill="#57534e">家長手冊、行事曆、公文管理、每半年召開全體工作人員會議</text>
  <rect x="620" y="272" width="136" height="44" rx="8" fill="#57534e" opacity="0.12"/>
  <text x="688" y="288" font-size="16" fill="#57534e" text-anchor="middle">第6-7項</text>
  <text x="688" y="308" font-size="16" fill="#57534e" text-anchor="middle">行政人員</text>

  <!-- Row 3：財務總務與安全管理（y=337）#a8a29e -->
  <rect x="28" y="337" width="744" height="60" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="337" width="6" height="60" rx="2" fill="#a8a29e"/>
  <circle cx="66" cy="367" r="16" fill="#a8a29e" opacity="0.15"/>
  <text x="66" y="373" font-size="16" fill="#a8a29e" text-anchor="middle" font-weight="900">4</text>
  <text x="100" y="364" font-size="20" fill="#1e293b" font-weight="700">財務總務與安全管理（第8-10項）</text>
  <text x="100" y="385" font-size="16" fill="#57534e">財產清冊年度盤點、事故傷害流程、CPR證照、每半年逃生演練</text>
  <rect x="620" y="345" width="136" height="44" rx="8" fill="#a8a29e" opacity="0.12"/>
  <text x="688" y="361" font-size="16" fill="#1e293b" text-anchor="middle">第8-10項</text>
  <text x="688" y="381" font-size="16" fill="#1e293b" text-anchor="middle">行政負責人</text>

  <!-- Row 4：兒童權益保障（y=410）#94a3b8 -->
  <rect x="28" y="410" width="744" height="60" rx="10" fill="white" stroke="#e8e6de" stroke-width="1"/>
  <rect x="28" y="410" width="6" height="60" rx="2" fill="#94a3b8"/>
  <circle cx="66" cy="440" r="16" fill="#94a3b8" opacity="0.15"/>
  <text x="66" y="446" font-size="16" fill="#94a3b8" text-anchor="middle" font-weight="900">5</text>
  <text x="100" y="437" font-size="20" fill="#1e293b" font-weight="700">兒童權益保障（第11項）</text>
  <text x="100" y="458" font-size="16" fill="#57534e">弱勢收托辦法、兒童保護通報流程、早期療育轉介、年度社區服務</text>
  <rect x="620" y="418" width="136" height="44" rx="8" fill="#94a3b8" opacity="0.12"/>
  <text x="688" y="434" font-size="16" fill="#1e293b" text-anchor="middle">第11項</text>
  <text x="688" y="454" font-size="16" fill="#1e293b" text-anchor="middle">負責人主管</text>

  <!-- 浮水印 -->
  <text x="760" y="480" font-size="16" fill="#d97706" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
