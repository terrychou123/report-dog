<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&amp;display=swap');</style>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- Right panel -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>
  <!-- Category badge -->
  <rect x="60" y="60" width="140" height="38" rx="19" fill="#d97706"/>
  <text x="130" y="84" font-family="'Noto Sans TC', sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">評鑑準備</text>
  <!-- Main title -->
  <text x="60" y="165" font-family="'Noto Sans TC', sans-serif" font-size="48" font-weight="900" fill="#1e293b">評鑑委員</text>
  <text x="60" y="225" font-family="'Noto Sans TC', sans-serif" font-size="48" font-weight="900" fill="#1e293b">在看什麼？</text>
  <!-- Subtitle -->
  <text x="60" y="285" font-family="'Noto Sans TC', sans-serif" font-size="22" font-weight="500" fill="#57534e">從審查角度拆解安置機構評鑑關鍵</text>
  <!-- Divider line -->
  <rect x="60" y="315" width="80" height="4" rx="2" fill="#d97706"/>
  <!-- Description -->
  <text x="60" y="360" font-family="'Noto Sans TC', sans-serif" font-size="18" fill="#78716c">文件查核、實地訪視、工作人員訪談</text>
  <text x="60" y="390" font-family="'Noto Sans TC', sans-serif" font-size="18" fill="#78716c">兒少訪談四大環節完整解析</text>
  <!-- Tags row -->
  <rect x="60" y="440" width="116" height="36" rx="18" fill="#fef3c7"/>
  <text x="118" y="462" font-family="'Noto Sans TC', sans-serif" font-size="14" fill="#d97706" text-anchor="middle">評鑑委員</text>
  <rect x="188" y="440" width="116" height="36" rx="18" fill="#fef3c7"/>
  <text x="246" y="462" font-family="'Noto Sans TC', sans-serif" font-size="14" fill="#d97706" text-anchor="middle">實地訪視</text>
  <rect x="316" y="440" width="116" height="36" rx="18" fill="#fef3c7"/>
  <text x="374" y="462" font-family="'Noto Sans TC', sans-serif" font-size="14" fill="#d97706" text-anchor="middle">審查重點</text>
  <!-- Brand -->
  <text x="60" y="560" font-family="'Noto Sans TC', sans-serif" font-size="18" font-weight="700" fill="#a8a29e">報告汪 reportwang.com</text>
  <!-- Right panel: visual element -->
  <!-- Large eye/magnifying glass icon using basic shapes -->
  <circle cx="1010" cy="260" r="90" fill="none" stroke="#d97706" stroke-width="6" opacity="0.25"/>
  <circle cx="1010" cy="260" r="55" fill="#d97706" opacity="0.12"/>
  <circle cx="1010" cy="260" r="28" fill="#d97706" opacity="0.22"/>
  <!-- Search handle -->
  <line x1="1055" y1="305" x2="1090" y2="340" stroke="#d97706" stroke-width="10" stroke-linecap="round" opacity="0.3"/>
  <text x="1010" y="270" font-family="'Noto Sans TC', sans-serif" font-size="36" font-weight="900" fill="#1e293b" text-anchor="middle" opacity="0.7">視角</text>
  <text x="1010" y="385" font-family="'Noto Sans TC', sans-serif" font-size="20" fill="#57534e" text-anchor="middle">委員審查視角</text>
  <text x="1010" y="415" font-family="'Noto Sans TC', sans-serif" font-size="20" fill="#57534e" text-anchor="middle">深度解析</text>
  <!-- Right panel items -->
  <rect x="880" y="460" width="260" height="52" rx="12" fill="#ffffff" opacity="0.6"/>
  <text x="1010" y="491" font-family="'Noto Sans TC', sans-serif" font-size="16" fill="#1e293b" text-anchor="middle">一致性與連續性</text>
  <rect x="880" y="524" width="260" height="52" rx="12" fill="#ffffff" opacity="0.6"/>
  <text x="1010" y="555" font-family="'Noto Sans TC', sans-serif" font-size="16" fill="#1e293b" text-anchor="middle">兒少安置機構 112年度</text>
  <!-- Watermark -->
  <text x="1140" y="600" font-family="'Noto Sans TC', sans-serif" font-size="24" fill="#c4bfb8" text-anchor="end" opacity="0.8">報告汪</text>
</svg>
