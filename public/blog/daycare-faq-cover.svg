<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e2d40"/>
    </linearGradient>
    <linearGradient id="bubbleGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:0.9"/>
    </linearGradient>
    <linearGradient id="bubbleGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:0.9"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="420" fill="url(#bgGrad)"/>

  <!-- 裝飾點陣 -->
  <circle cx="100" cy="50" r="3" fill="#0ea5e9" opacity="0.3"/>
  <circle cx="150" cy="80" r="2" fill="#f59e0b" opacity="0.3"/>
  <circle cx="80" cy="120" r="4" fill="#0ea5e9" opacity="0.2"/>
  <circle cx="700" cy="30" r="3" fill="#f59e0b" opacity="0.3"/>
  <circle cx="750" cy="80" r="2" fill="#0ea5e9" opacity="0.3"/>
  <circle cx="730" cy="380" r="4" fill="#10b981" opacity="0.2"/>
  <circle cx="680" cy="340" r="3" fill="#f59e0b" opacity="0.25"/>

  <!-- 大圓形裝飾 -->
  <circle cx="100" cy="350" r="130" fill="#0ea5e9" opacity="0.05"/>
  <circle cx="700" cy="80" r="100" fill="#f59e0b" opacity="0.05"/>

  <!-- 左側對話泡泡群 -->
  <!-- 大問號泡泡 1 -->
  <rect x="30" y="90" width="90" height="72" rx="16" fill="url(#bubbleGrad1)"/>
  <polygon points="55,162 70,162 62,182" fill="#0ea5e9" opacity="0.9"/>
  <text x="75" y="135" font-family="sans-serif" font-size="36" fill="white" text-anchor="middle" font-weight="bold">?</text>

  <!-- 小問號泡泡 2 -->
  <rect x="140" y="60" width="64" height="52" rx="12" fill="url(#bubbleGrad2)" opacity="0.8"/>
  <polygon points="155,112 170,112 162,128" fill="#f59e0b" opacity="0.8"/>
  <text x="172" y="93" font-family="sans-serif" font-size="28" fill="white" text-anchor="middle" font-weight="bold">?</text>

  <!-- 中問號泡泡 3 -->
  <rect x="50" y="185" width="76" height="60" rx="14" fill="#10b981" opacity="0.75"/>
  <polygon points="68,245 83,245 75,262" fill="#10b981" opacity="0.75"/>
  <text x="88" y="220" font-family="sans-serif" font-size="30" fill="white" text-anchor="middle" font-weight="bold">?</text>

  <!-- 小泡泡 4 -->
  <rect x="155" y="160" width="52" height="42" rx="10" fill="#0ea5e9" opacity="0.5"/>
  <text x="181" y="187" font-family="sans-serif" font-size="22" fill="white" text-anchor="middle" font-weight="bold">?</text>

  <!-- 右側小泡泡 -->
  <rect x="620" y="240" width="60" height="48" rx="12" fill="#0ea5e9" opacity="0.4"/>
  <text x="650" y="270" font-family="sans-serif" font-size="24" fill="white" text-anchor="middle" font-weight="bold">?</text>
  <rect x="680" y="290" width="48" height="40" rx="10" fill="#f59e0b" opacity="0.5"/>
  <text x="704" y="316" font-family="sans-serif" font-size="20" fill="white" text-anchor="middle" font-weight="bold">?</text>

  <!-- 分隔線 -->
  <line x1="250" y1="70" x2="250" y2="350" stroke="#334155" stroke-width="1.5" opacity="0.5"/>

  <!-- 右側文字區 -->
  <!-- 標籤 -->
  <rect x="280" y="70" width="120" height="28" rx="14" fill="#f59e0b" opacity="0.2"/>
  <rect x="280" y="70" width="120" height="28" rx="14" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.6"/>
  <text x="340" y="89" font-family="sans-serif" font-size="13" fill="#f59e0b" text-anchor="middle" font-weight="bold">FAQ 完整解答</text>

  <!-- 主標題 -->
  <text x="280" y="155" font-family="sans-serif" font-size="38" fill="white" font-weight="bold">日照評鑑</text>
  <text x="280" y="203" font-family="sans-serif" font-size="38" fill="white" font-weight="bold">15 大常見問題</text>

  <!-- 色條 -->
  <rect x="280" y="218" width="50" height="4" rx="2" fill="#0ea5e9"/>
  <rect x="338" y="218" width="50" height="4" rx="2" fill="#f59e0b"/>
  <rect x="396" y="218" width="50" height="4" rx="2" fill="#10b981"/>

  <!-- 副標題 -->
  <text x="280" y="255" font-family="sans-serif" font-size="20" fill="#94a3b8">制度｜文件｜現場</text>
  <text x="280" y="283" font-family="sans-serif" font-size="20" fill="#0ea5e9" font-weight="bold">全解答</text>

  <!-- 說明文字 -->
  <text x="280" y="318" font-family="sans-serif" font-size="13" fill="#64748b">評鑑前最常被問到的 15 個問題</text>
  <text x="280" y="338" font-family="sans-serif" font-size="13" fill="#64748b">一次解答，讓準備工作不再迷茫</text>

  <!-- 底部三類標籤 -->
  <rect x="280" y="360" width="78" height="24" rx="12" fill="#1e3a8a" opacity="0.8"/>
  <text x="319" y="376" font-family="sans-serif" font-size="11" fill="#93c5fd" text-anchor="middle">制度類 Q5</text>
  <rect x="368" y="360" width="78" height="24" rx="12" fill="#134e4a" opacity="0.8"/>
  <text x="407" y="376" font-family="sans-serif" font-size="11" fill="#6ee7b7" text-anchor="middle">文件類 Q5</text>
  <rect x="456" y="360" width="78" height="24" rx="12" fill="#451a03" opacity="0.8"/>
  <text x="495" y="376" font-family="sans-serif" font-size="11" fill="#fcd34d" text-anchor="middle">現場類 Q5</text>

  <!-- 品牌 -->
  <text x="760" y="410" font-family="sans-serif" font-size="11" fill="#334155" text-anchor="end">報告汪</text>
</svg>
