<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="630" fill="#f0efe8"/>
  <!-- 右側裝飾區塊 -->
  <rect x="820" y="0" width="380" height="630" fill="#e8e6de"/>

  <!-- 右側裝飾大數字（155px，頂部≈y=104） -->
  <text x="1010" y="220" font-size="155" font-weight="900" fill="#d97706" text-anchor="middle" opacity="0.85">15</text>
  <text x="1010" y="262" font-size="28" fill="#78716c" text-anchor="middle" font-weight="600">大常見問題</text>

  <!-- 右側時程條（3 條，各 80px） -->
  <rect x="840" y="282" width="330" height="80" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="840" y="282" width="7" height="80" rx="3" fill="#d97706"/>
  <text x="862" y="318" font-size="28" fill="#d97706" font-weight="700">制度篇 Q1–Q5</text>
  <text x="862" y="346" font-size="22" fill="#78716c">評鑑制度 · 通知時間 · 流程</text>

  <rect x="840" y="370" width="330" height="80" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="840" y="370" width="7" height="80" rx="3" fill="#78716c"/>
  <text x="862" y="406" font-size="28" fill="#78716c" font-weight="700">文件篇 Q6–Q10</text>
  <text x="862" y="434" font-size="22" fill="#78716c">備審文件 · 核心紀錄重點</text>

  <rect x="840" y="458" width="330" height="80" rx="10" fill="white" stroke="#e8e5de" stroke-width="1"/>
  <rect x="840" y="458" width="7" height="80" rx="3" fill="#a8a29e"/>
  <text x="862" y="494" font-size="28" fill="#a8a29e" font-weight="700">現場篇 Q11–Q15</text>
  <text x="862" y="522" font-size="22" fill="#78716c">評鑑當天 · 注意事項</text>

  <!-- 左側主內容區 -->
  <text x="60" y="200" font-size="120" font-weight="900" fill="#1e293b">評鑑常見</text>
  <text x="60" y="338" font-size="120" font-weight="900" fill="#d97706">15 大 FAQ</text>

  <line x1="60" y1="365" x2="780" y2="365" stroke="#dedad3" stroke-width="2"/>

  <text x="60" y="416" font-size="38" fill="#57534e" font-weight="400">制度 · 文件 · 現場 · 一次全解答</text>

  <!-- 特色標籤列（pill 高 54px） -->
  <rect x="60" y="450" width="148" height="54" rx="10" fill="#d97706" opacity="0.12"/>
  <text x="134" y="483" font-size="28" fill="#d97706" text-anchor="middle" font-weight="600">制度規定</text>

  <rect x="220" y="450" width="148" height="54" rx="10" fill="#78716c" opacity="0.12"/>
  <text x="294" y="483" font-size="28" fill="#78716c" text-anchor="middle" font-weight="600">文件備審</text>

  <rect x="380" y="450" width="148" height="54" rx="10" fill="#57534e" opacity="0.12"/>
  <text x="454" y="483" font-size="28" fill="#57534e" text-anchor="middle" font-weight="600">現場當日</text>

  <rect x="540" y="450" width="148" height="54" rx="10" fill="#a8a29e" opacity="0.18"/>
  <text x="614" y="483" font-size="28" fill="#78716c" text-anchor="middle" font-weight="600">注意事項</text>

  <!-- 適用對象 -->
  <text x="60" y="558" font-size="28" fill="#94a3b8">適用對象：日照主任 · 社工 · 照服員 · 評鑑前必讀</text>

  <!-- 浮水印 -->
  <text x="1140" y="590" font-size="24" fill="#c4bfb8" text-anchor="end" font-weight="400">報告汪 reportwang.com</text>
</svg>
