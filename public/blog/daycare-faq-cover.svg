<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">

  <!-- 背景：米黃暖色 -->
  <rect width="800" height="420" fill="#f0efe8"/>

  <!-- 左側裝飾塊 -->
  <rect x="0" y="0" width="240" height="420" fill="#e8e6de"/>

  <!-- 左側問號泡泡群 -->
  <rect x="30" y="90" width="90" height="72" rx="16" fill="#94a3b8"/>
  <polygon points="55,162 70,162 62,180" fill="#94a3b8"/>
  <text x="75" y="135" font-family="sans-serif" font-size="36" fill="white" text-anchor="middle" font-weight="bold">?</text>

  <rect x="140" y="60" width="64" height="52" rx="12" fill="#a8a29e"/>
  <polygon points="155,112 170,112 162,126" fill="#a8a29e"/>
  <text x="172" y="93" font-family="sans-serif" font-size="28" fill="white" text-anchor="middle" font-weight="bold">?</text>

  <rect x="50" y="185" width="76" height="60" rx="14" fill="#a3a3a3"/>
  <polygon points="68,245 83,245 75,260" fill="#a3a3a3"/>
  <text x="88" y="220" font-family="sans-serif" font-size="30" fill="white" text-anchor="middle" font-weight="bold">?</text>

  <rect x="155" y="160" width="52" height="42" rx="10" fill="#78716c"/>
  <text x="181" y="187" font-family="sans-serif" font-size="22" fill="white" text-anchor="middle" font-weight="bold">?</text>

  <!-- 分隔線 -->
  <line x1="250" y1="60" x2="250" y2="360" stroke="#dedad3" stroke-width="1.5"/>

  <!-- 右側文字區 -->
  <rect x="278" y="68" width="120" height="28" rx="14" fill="white" stroke="#dedad3" stroke-width="1"/>
  <text x="338" y="87" font-family="sans-serif" font-size="13" fill="#78716c" text-anchor="middle" font-weight="bold">FAQ 完整解答</text>

  <!-- 主標題 -->
  <text x="278" y="155" font-family="sans-serif" font-size="38" fill="#1e293b" font-weight="bold">日照評鑑</text>
  <text x="278" y="203" font-family="sans-serif" font-size="38" fill="#1e293b" font-weight="bold">15 大常見問題</text>

  <!-- 色條 -->
  <rect x="278" y="218" width="50" height="4" rx="2" fill="#94a3b8"/>
  <rect x="336" y="218" width="50" height="4" rx="2" fill="#a8a29e"/>
  <rect x="394" y="218" width="50" height="4" rx="2" fill="#d97706"/>

  <!-- 副標題 -->
  <text x="278" y="253" font-family="sans-serif" font-size="20" fill="#64748b">制度｜文件｜現場</text>
  <text x="278" y="281" font-family="sans-serif" font-size="20" fill="#d97706" font-weight="bold">全解答</text>

  <!-- 說明文字 -->
  <text x="278" y="314" font-family="sans-serif" font-size="13" fill="#94a3b8">評鑑前最常被問到的 15 個問題</text>
  <text x="278" y="334" font-family="sans-serif" font-size="13" fill="#94a3b8">一次解答，讓準備工作不再迷茫</text>

  <!-- 底部三類標籤 -->
  <rect x="278" y="358" width="78" height="24" rx="12" fill="white" stroke="#dedad3" stroke-width="1"/>
  <text x="317" y="374" font-family="sans-serif" font-size="11" fill="#78716c" text-anchor="middle">制度類 Q5</text>
  <rect x="366" y="358" width="78" height="24" rx="12" fill="white" stroke="#dedad3" stroke-width="1"/>
  <text x="405" y="374" font-family="sans-serif" font-size="11" fill="#78716c" text-anchor="middle">文件類 Q5</text>
  <rect x="454" y="358" width="78" height="24" rx="12" fill="white" stroke="#dedad3" stroke-width="1"/>
  <text x="493" y="374" font-family="sans-serif" font-size="11" fill="#78716c" text-anchor="middle">現場類 Q5</text>

  <!-- 浮水印 -->
  <text x="756" y="412" text-anchor="end" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#c4bfb8">報告汪 reportwang.com</text>
</svg>
